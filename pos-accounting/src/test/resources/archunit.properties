# Import only this module's classes (#2558, CI heap). With resolution on, ArchUnit also imports every JDK, Spring
# and Hibernate class a call or field names, transitively, and the surefire fork CI runs with -Xmx1g ran out of heap
# in ArchitectureTest. Every rule in this module matches other modules' types by name (packages, fully qualified
# names, annotation names), which unresolved stubs carry, so nothing needs the full hierarchy.
resolveMissingDependenciesFromClassPath=false
