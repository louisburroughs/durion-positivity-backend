spring:
  application:
    name: pos-customer-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: false
  main:
    allow-bean-definition-overriding: true

# Disable security for tests
security:
  enabled: false

# Disable eureka for tests  
eureka:
  client:
    enabled: false

# Credit Memo GL Configuration for tests
pos:
  accounting:
    credit-memo:
      revenue-account-id: "00000000-0000-0000-0000-000000004000"
      tax-payable-account-id: "00000000-0000-0000-0000-000000002200"
      ar-account-id: "00000000-0000-0000-0000-000000001200"

# Logging
logging:
  level:
    com:
      positivity: DEBUG
    org:
      springframework:
        security: DEBUG