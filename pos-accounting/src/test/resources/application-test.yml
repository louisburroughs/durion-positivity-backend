spring:
  application:
    name: pos-customer-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
  h2:
    console:
      enabled: false
  main:
    allow-bean-definition-overriding: true

# Disable security for tests
security:
  enabled: false

# Disable eureka for tests  
eureka:
  client:
    enabled: false

# Stripe configuration for tests
stripe:
  api-key: "sk_test_dummy_key_for_unit_tests"
  connect-account: ""

# Logging
logging:
  level:
    root: WARN
    com:
      positivity: INFO
    org:
      springframework:
        security: WARN

# Required GL account configuration for Credit Memo processing
pos:
  accounting:
    credit-memo:
      revenue-account-id: "01234567-89ab-cdef-0123-456789abcdef"
      tax-payable-account-id: "fedcba98-7654-3210-fedc-ba9876543210"
      ar-account-id: "11111111-2222-3333-4444-555555555555"
