# Bound the Spring TestContext cache (default 32). pos-accounting's test suite builds dozens of distinct
# application contexts (H2 and Postgres profiles, per-class @MockitoBean sets), each carrying the full
# Hibernate metamodel and ~65 Spring Data repositories (~30 MB). Holding 32 of them fills the 1.5 GiB
# (-Xmx1536m) Surefire fork CI runs with (-DlowResourceTests), and the fork dies of GC thrash / OutOfMemoryError.
# LRU eviction closes the least recently used context instead; a later class needing it rebuilds it.
# #2558 (CI OOM at 12 once the suite grew): 8 kept the then 1 GiB fork clear of the edge, and still holds at 1.5 GiB;
# an evicted context is rebuilt when a later class needs it.
spring.test.context.cache.maxSize=8
