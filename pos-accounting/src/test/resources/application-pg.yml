# Testcontainers Postgres profile (ADR-0062, plan R-B7): the real Flyway chain, Hibernate validate,
# the pool as pos_app (PostgresTenancyTestBase), strict tenancy. The datasource is supplied at
# runtime by @DynamicPropertySource.
spring:
  application:
    name: pos-accounting-pg-test
  datasource:
    hikari:
      # Every Spring context this JVM caches keeps its pool for the whole run, and this module has
      # a dozen-odd Postgres-backed context shapes. Hikari's default of 10 apiece exhausts even a
      # generously configured server; these tests need one connection at a time.
      maximum-pool-size: 8
      minimum-idle: 1
  autoconfigure:
    exclude: org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      # Counts statements per thread only while a test opens a count (ReceivablesWorklistPostgresIT, #2502).
      hibernate.session_factory.statement_inspector: com.positivity.accounting.tenancy.ThreadStatementCounter
  flyway:
    enabled: true
  cloud:
    discovery:
      enabled: false

pos:
  tenancy:
    # strict: nothing binds a tenant unless the test does
    default-tenant-id:
  accounting:
    # Tests drive accounting events explicitly; the scheduled received-event drainer (#2435) stays off.
    event-drainer:
      enabled: false
    # The undeposited drawer cash gauges (#2514) poll on a schedule too; UndepositedCashGaugeTest drives them.
    deposit-gauge:
      enabled: false

eureka:
  client:
    enabled: false

logging:
  level:
    org.hibernate.SQL: warn

# Required by the module's configuration even when nothing posts a credit memo or charges a card.
pos.accounting.credit-memo:
  revenue-account-id: "01234567-89ab-cdef-0123-456789abcdef"
  tax-payable-account-id: "fedcba98-7654-3210-fedc-ba9876543210"
  ar-account-id: "11111111-2222-3333-4444-555555555555"
stripe:
  api-key: "sk_test_dummy_key_for_tenancy_its"
  connect-account: ""

# Test contexts never reach pos-security-service or pos-event-receiver. Skip permission registration
# (its startup retry loop otherwise sleeps ~8 s in every Spring test context) and point the event-type
# initializer at a loopback port that refuses instantly. Same arrangement as pos-mcp-server's test profile.
pos.security.permission-registration.enabled: false
pos.events.base-url: http://127.0.0.1:1
