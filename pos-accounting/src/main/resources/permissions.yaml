domain: accounting
serviceName: pos-accounting
version: "1.0"
permissions:
  - name: "accounting:je:view"
    description: "View journal entries"
  - name: "accounting:je:create"
    description: "Create journal entries"
  - name: "accounting:je:post"
    description: "Post journal entries"
  - name: "accounting:ap:view"
    description: "View accounts payable"
  - name: "accounting:ap:pay"
    description: "Process payments"
  - name: "accounting:coa:view"
    description: "View chart of accounts"
  - name: "accounting:coa:create"
    description: "Create accounts in chart of accounts"
  - name: "accounting:coa:edit"
    description: "Edit accounts in chart of accounts"
  - name: "accounting:events:view"
    description: "View accounting events"
  - name: "accounting:events:submit"
    description: "Submit accounting events"
  - name: "accounting:events:retry"
    description: "Retry failed accounting events"
  - name: "accounting:events:reprocess"
    description: "Reprocess a suspended accounting event"
  - name: "accounting:export:request"
    description: "Request an accounting data export"
  - name: "accounting:export:view"
    description: "View accounting export status and history"
