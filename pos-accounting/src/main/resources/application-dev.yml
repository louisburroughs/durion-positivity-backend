spring:
  datasource:
    url: jdbc:h2:mem:pos_accounting;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 0

management:
  server:
    port: 0
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}

# Payment Gateway Configuration
payment:
  gateway:
    provider: ${PAYMENT_GATEWAY_PROVIDER:stripe}

stripe:
  api-key: ${STRIPE_API_KEY:DUMMY_STRIPE_API_KEY}
  connect-account: ${STRIPE_CONNECT_ACCOUNT:DUMMY_CONNECT_ACCOUNT_FOR_DEV}
  idempotency-window-hours: ${STRIPE_IDEMPOTENCY_WINDOW_HOURS:24}
