# Local development profile — H2 database + dynamic ports

spring:
  datasource:
    url: jdbc:h2:mem:pos_accounting;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 0

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}

# Credit Memo GL Configuration for local development
pos:
  accounting:
    credit-memo:
      revenue-account-id: "00000000-0000-0000-0000-000000004000"
      tax-payable-account-id: "00000000-0000-0000-0000-000000002200"
      ar-account-id: "00000000-0000-0000-0000-000000001200"

logging:
  level:
    root: INFO
    org:
      springframework:
        boot:
          web:
            embedded:
              tomcat:
                TomcatWebServer: INFO
        web: INFO
      hibernate:
        SQL: DEBUG
    com:
      positivity:
        accounting: DEBUG
