spring:
  application:
    name: accounting
  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 0
  tomcat:
    max-http-header-size: 65536

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# Cross-service configuration
pos:
  accounting:
    credit-memo:
      # Required: GL account for revenue reversals (typically 4000-4999 range)
      revenue-account-id: ${POS_ACCOUNTING_CREDIT_MEMO_REVENUE_ACCOUNT_ID}
      # Required: GL account for sales tax payable reversals (typically 2200-2299 range)
      tax-payable-account-id: ${POS_ACCOUNTING_CREDIT_MEMO_TAX_PAYABLE_ACCOUNT_ID}
      # Required: GL account for accounts receivable reductions (typically 1200-1299 range)
      ar-account-id: ${POS_ACCOUNTING_CREDIT_MEMO_AR_ACCOUNT_ID}
    kafka:
      enabled: ${POS_ACCOUNTING_KAFKA_ENABLED:false}
      payments-topic: ${POS_ACCOUNTING_KAFKA_PAYMENTS_TOPIC:payment.cleared.v1}
      customer-events-topic: ${POS_ACCOUNTING_KAFKA_CUSTOMER_EVENTS_TOPIC:customer.events.v1}
      invoice-events-topic: ${POS_ACCOUNTING_KAFKA_INVOICE_EVENTS_TOPIC:invoice.events.v1}
      # Warranty reimbursement expected-credit feed (#927)
      warranty-events-topic: ${POS_ACCOUNTING_KAFKA_WARRANTY_EVENTS_TOPIC:warranty.events.v1}
      workorder-commands-topic: ${POS_ACCOUNTING_KAFKA_WORKORDER_COMMANDS_TOPIC:workorder.commands.v1}
      consumer-group: ${POS_ACCOUNTING_KAFKA_CONSUMER_GROUP:${spring.application.name}-payments}

# Payment Gateway Configuration
payment:
  gateway:
    provider: ${PAYMENT_GATEWAY_PROVIDER:stripe}

stripe:
  api-key: ${STRIPE_API_KEY}
  connect-account: ${STRIPE_CONNECT_ACCOUNT:}
  idempotency-window-hours: ${STRIPE_IDEMPOTENCY_WINDOW_HOURS:24}

logging:
  level:
    root: INFO
    com:
      positivity:
        accounting: INFO
      netflix:
        discovery:
          shared:
            resolver:
              aws:
                ConfigClusterResolver: WARN
    org:
      springframework:
        web: INFO
      hibernate:
        SQL: INFO
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  default-produces-media-type: application/json
