spring:
  application:
    name: accounting
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/pos_accounting_db
    username: ${SPRING_DATASOURCE_USERNAME:pos_user}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 0

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# Cross-service configuration
pos:
  invoice:
    service:
      url: http://pos-invoice:8085
      timeout: 5000  # milliseconds

logging:
  level:
    root: INFO
    com:
      positivity:
        accounting: INFO
    org:
      springframework:
        security: DEBUG
        web: INFO
      hibernate:
        SQL: INFO
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html