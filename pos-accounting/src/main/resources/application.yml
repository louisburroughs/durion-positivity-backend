spring:
  application:
    name: accounting
  servlet:
    multipart:
      # Statement files (story S3, #2302) up to pos.accounting.bankrec.import.max-file-bytes.
      max-file-size: 10MB
      max-request-size: 11MB
  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 0
  tomcat:
    max-http-header-size: 65536

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# Cross-service configuration
pos:
  # ADR-0062 section 9 (plan WS3): the transitional default tenant. Every unbound path (a request
  # without X-Tenant-Id, a record without the tenant header, a scheduler with no registry entry)
  # runs as the alpha default tenant. Unset it (POS_TENANCY_DEFAULT_TENANT_ID=) once every client
  # sends a tenant: the runtime is then strict and an unbound request is a 401.
  tenancy:
    default-tenant-id: ${POS_TENANCY_DEFAULT_TENANT_ID:01900000-0000-7000-8000-000000000001}
  accounting:
    # Reconciliation manifests of accounting.events.v1, one per tenant per closed window (CAP:550 S16,
    # #2512; ADR-0044 section 4): consumers compare their processed-events log and request a replay on
    # accounting.commands.v1 when a window disagrees.
    manifest:
      topic: ${POS_ACCOUNTING_MANIFEST_TOPIC:accounting.manifest.v1}
      window: ${POS_ACCOUNTING_MANIFEST_WINDOW:PT1H}
      grace: ${POS_ACCOUNTING_MANIFEST_GRACE:PT5M}
    bankrec:
      import:
        # SPEC-manual-bank-reconciliation D13 (story S3, #2302): raw statement files are kept this many
        # days (default 7 years, the audit retention) and then hard-deleted per tenant; the bank_import
        # metadata and parsed rows stay.
        file-retention-days: ${POS_ACCOUNTING_BANKREC_IMPORT_FILE_RETENTION_DAYS:2555}
        # When the nightly retention job runs (server time).
        retention-cron: ${POS_ACCOUNTING_BANKREC_IMPORT_RETENTION_CRON:0 30 3 * * *}
        # Largest statement file accepted, in bytes (spring.servlet.multipart must allow it).
        max-file-bytes: ${POS_ACCOUNTING_BANKREC_IMPORT_MAX_FILE_BYTES:10485760}
    # Drains RECEIVED accounting events submitted through POST /v1/accounting/events (#2435):
    # INVOICE_PAYMENT to the AR subledger processor, every other type through the posting engine.
    event-drainer:
      enabled: ${POS_ACCOUNTING_EVENT_DRAINER_ENABLED:true}
      poll-interval-ms: ${POS_ACCOUNTING_EVENT_DRAINER_POLL_INTERVAL_MS:30000}
      batch-size: ${POS_ACCOUNTING_EVENT_DRAINER_BATCH_SIZE:50}
      # RECEIVED longer than this counts toward the accounting.events.received.stale gauge.
      stale-after-ms: ${POS_ACCOUNTING_EVENT_DRAINER_STALE_AFTER_MS:600000}
    credit-memo:
      # Required: GL account for revenue reversals (typically 4000-4999 range)
      revenue-account-id: ${POS_ACCOUNTING_CREDIT_MEMO_REVENUE_ACCOUNT_ID}
      # Required: GL account for sales tax payable reversals (typically 2200-2299 range)
      tax-payable-account-id: ${POS_ACCOUNTING_CREDIT_MEMO_TAX_PAYABLE_ACCOUNT_ID}
      # Required: GL account for accounts receivable reductions (typically 1200-1299 range)
      ar-account-id: ${POS_ACCOUNTING_CREDIT_MEMO_AR_ACCOUNT_ID}
    # Kafka is tier-1 (ADR-0044 §4, #2195): the consumers and outbox are always on outside the
    # broker-less dev/test profiles (see KafkaRails); there is no enable flag. Topic names only.
    kafka:
      customer-events-topic: ${POS_ACCOUNTING_KAFKA_CUSTOMER_EVENTS_TOPIC:customer.events.v1}
      invoice-events-topic: ${POS_ACCOUNTING_KAFKA_INVOICE_EVENTS_TOPIC:invoice.events.v1}
      # Warranty reimbursement expected-credit feed (#927)
      warranty-events-topic: ${POS_ACCOUNTING_KAFKA_WARRANTY_EVENTS_TOPIC:warranty.events.v1}
      # Inventory scrap fact feed for shrinkage GL posting (#1043)
      inventory-events-topic: ${POS_ACCOUNTING_KAFKA_INVENTORY_EVENTS_TOPIC:inventory.events.v1}
      # Order fact feed for register-session over/short GL posting (odoo-parity G3, #1083)
      order-events-topic: ${POS_ACCOUNTING_KAFKA_ORDER_EVENTS_TOPIC:order.events.v1}
      workorder-commands-topic: ${POS_ACCOUNTING_KAFKA_WORKORDER_COMMANDS_TOPIC:workorder.commands.v1}
      # Workorder fact feed resolving outstanding invoice-regeneration commands (#1537 D1)
      workorder-events-topic: ${POS_ACCOUNTING_KAFKA_WORKORDER_EVENTS_TOPIC:workorder.events.v1}
      # Invoice replica reconciliation manifest + its replay-request command topic (#1537 D2)
      invoice-manifest-topic: ${POS_ACCOUNTING_KAFKA_INVOICE_MANIFEST_TOPIC:invoice.manifest.v1}
      invoice-commands-topic: ${POS_ACCOUNTING_KAFKA_INVOICE_COMMANDS_TOPIC:invoice.commands.v1}
      # Accounting's own fact feed (accounting.invoice.gl-posted), drained from kafka_event_outbox (#1843)
      accounting-events-topic: ${POS_ACCOUNTING_KAFKA_ACCOUNTING_EVENTS_TOPIC:accounting.events.v1}
      # Drift repair for accounting's own facts (CAP:550 S16, #2512): consumers that find a window of
      # accounting.manifest.v1 out of step send accounting.outbox.replay-requested here.
      accounting-commands-topic: ${POS_ACCOUNTING_KAFKA_ACCOUNTING_COMMANDS_TOPIC:accounting.commands.v1}
      accounting-commands-consumer-group: ${POS_ACCOUNTING_KAFKA_ACCOUNTING_COMMANDS_CONSUMER_GROUP:pos-accounting-commands}
      # Location fact feed maintaining the ext_location replica whose materialised ancestor sets
      # answer the ADR-0061 location-scope check on the Labor & Overhead report (#1885)
      location-events-topic: ${POS_ACCOUNTING_KAFKA_LOCATION_EVENTS_TOPIC:location.events.v1}
      location-events-consumer-group: ${POS_ACCOUNTING_KAFKA_LOCATION_EVENTS_CONSUMER_GROUP:pos-accounting-location-events}
      # Tenant lifecycle facts: tenant.created provisions the new tenant's chart of accounts, GL mapping
      # defaults, statement lines and policy defaults from the accounting template (#2526). The group
      # reads from the earliest offset, so facts retained from before this consumer existed are processed once.
      tenant-events-topic: ${POS_ACCOUNTING_KAFKA_TENANT_EVENTS_TOPIC:tenant.events.v1}
      tenant-events-consumer-group: ${POS_ACCOUNTING_KAFKA_TENANT_EVENTS_CONSUMER_GROUP:pos-accounting-tenant-events}
    # The accounting template held in the platform tenant (#2526; ADR-0062 section 6).
    tenant-template:
      startup-sweep:
        # At each start, apply the template to every registry tenant: it provisions the alpha default
        # tenant (which has no tenant.created fact) and carries template additions to tenants
        # provisioned earlier. Never blocks startup.
        enabled: ${POS_ACCOUNTING_TENANT_TEMPLATE_STARTUP_SWEEP_ENABLED:true}

# Payment Gateway Configuration
payment:
  gateway:
    provider: ${PAYMENT_GATEWAY_PROVIDER:stripe}

stripe:
  api-key: ${STRIPE_API_KEY}
  connect-account: ${STRIPE_CONNECT_ACCOUNT:}
  idempotency-window-hours: ${STRIPE_IDEMPOTENCY_WINDOW_HOURS:24}

logging:
  level:
    root: INFO
    com:
      positivity:
        accounting: INFO
      netflix:
        discovery:
          shared:
            resolver:
              aws:
                ConfigClusterResolver: WARN
    org:
      springframework:
        web: INFO
      hibernate:
        SQL: INFO
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  default-produces-media-type: application/json

# The ledger currency (ADR-0067). Every existing tenant books in USD (MC-1 ruling); a document or
# fact in another currency is held or refused, never booked at par (PC-9). Step A5 replaces this
# deployment-wide value with the tenant's functional currency. Read through LedgerCurrency.
accounting:
  ledger:
    base-currency: USD
