spring:
  application:
    name: accounting
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/pos_accounting_db
    username: ${SPRING_DATASOURCE_USERNAME:pos_user}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 0

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# Cross-service configuration
pos:
  invoice:
    service:
      url: http://pos-invoice:8085
  # RestClient timeouts configured via pos.restclient.connect.timeout and pos.restclient.read.timeout
  # See RestClientConfig.java for timeout configuration
  accounting:
    credit-memo:
      # Required: GL account for revenue reversals (typically 4000-4999 range)
      revenue-account-id: ${POS_ACCOUNTING_CREDIT_MEMO_REVENUE_ACCOUNT_ID}
      # Required: GL account for sales tax payable reversals (typically 2200-2299 range)
      tax-payable-account-id: ${POS_ACCOUNTING_CREDIT_MEMO_TAX_PAYABLE_ACCOUNT_ID}
      # Required: GL account for accounts receivable reductions (typically 1200-1299 range)
      ar-account-id: ${POS_ACCOUNTING_CREDIT_MEMO_AR_ACCOUNT_ID}
    kafka:
      enabled: ${POS_ACCOUNTING_KAFKA_ENABLED:false}
      payments-topic: ${POS_ACCOUNTING_KAFKA_PAYMENTS_TOPIC:payment.cleared.v1}
      consumer-group: ${POS_ACCOUNTING_KAFKA_CONSUMER_GROUP:${spring.application.name}-payments}

# Payment Gateway Configuration
payment:
  gateway:
    provider: ${PAYMENT_GATEWAY_PROVIDER:stripe}

stripe:
  api-key: ${STRIPE_API_KEY}
  connect-account: ${STRIPE_CONNECT_ACCOUNT:}
  idempotency-window-hours: ${STRIPE_IDEMPOTENCY_WINDOW_HOURS:24}

logging:
  level:
    root: INFO
    com:
      positivity:
        accounting: INFO
    org:
      springframework:
        security: DEBUG
        web: INFO
      hibernate:
        SQL: INFO
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
