          description: Amount applied to the invoice
          example: 450.0
          type: number
        applicationId:
          description: Payment application identifier
          example: 01936e5f-1234-7a3d-8b6e-3c4567890124
          format: uuid
          type: string
        appliedAt:
          description: Timestamp the application was recorded (application_timestamp)
          example: '2026-06-15T14:32:00Z'
          format: date-time
          type: string
        invoiceId:
          description: Invoice identifier this application was made against
          example: 01936e61-1234-7a3d-8b6e-3c4567890126
          format: uuid
          type: string
        paymentId:
          description: Receivable payment identifier this application belongs to
          example: 01936e60-1234-7a3d-8b6e-3c4567890125
          format: uuid
          type: string
        reversed:
          description: True when this application has since been reversed (PaymentApplicationReversal exists). Always false when the caller did not set includeReversed=true, since reversed applications are excluded from the list entirely by default.
          example: false
          type: boolean
      required:
      - amount
      - applicationId
      - appliedAt
      - invoiceId
      - paymentId
      - reversed
      type: object
    PaymentApplicationRequest:
      description: Request payload for applying a payment to one or more invoices
      properties:
        allocationStrategy:
          default: CALLER_ORDER
          description: Optional allocation strategy. CALLER_ORDER (default when absent) applies amounts in the order supplied by the caller; OLDEST_FIRST allocates by ascending invoice date. Omitting this field is equivalent to CALLER_ORDER.
          enum:
          - CALLER_ORDER
          - OLDEST_FIRST
          example: OLDEST_FIRST
          type:
          - string
          - 'null'
        applicationRequestId:
          description: Idempotency key for this application request; retries with the same key must not duplicate
          example: pay-apply-20260618-001
          maxLength: 100
          minLength: 0
          type: string
        applications:
          description: Invoice applications allocating the payment amount to each invoice
          items:
            $ref: '#/components/schemas/InvoiceApplication'
          minItems: 1
          type: array
      required:
      - applicationRequestId
      - applications
      type: object
    PaymentApplicationResponse:
      description: Result of applying a payment to one or more invoices
      properties:
        applicationRequestId:
          description: Idempotency key echoed from the application request
          example: pay-apply-20260618-001
          type: string
        applicationTimestamp:
          description: Timestamp when the payment was applied (ISO 8601)
          example: '2026-06-18T08:00:00Z'
          format: date-time
          type: string
        applications:
          description: Per-invoice application details
          items:
            $ref: '#/components/schemas/ApplicationDetail'
          type: array
        appliedAmount:
          description: Amount of the payment applied to invoices
          example: 1000.0
          type: number
        currency:
          description: Currency code (ISO 4217)
          example: USD
          type: string
        customerCredit:
          $ref: '#/components/schemas/CustomerCreditInfo'
        customerId:
          description: Identifier of the customer who made the payment
          example: 01960003-0000-7000-8000-000000000002
          format: uuid
          type: string
        paymentId:
          description: Identifier of the payment that was applied
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        remainingAmount:
          description: Amount of the payment remaining after application
          example: 250.0
          type: number
        totalAmount:
          description: Total payment amount
          example: 1250.0
          type: number
      required:
      - paymentId
      type: object
    PaymentApplicationReversalRequest:
      description: Request payload for reversing a payment application
      properties:
        reason:
          description: Reason for the reversal, recorded for the audit trail
          example: Payment applied to the wrong invoice and must be reallocated
          maxLength: 1000
          minLength: 10
          type: string
      required:
      - reason
      type: object
