  /v1/accounting/bank-imports/{importId}/commit:
    post:
      description: 'Commits a validated import in one transaction: its rows become bank transactions of one statement (one per split segment) through the same intake as a manual statement, the gap acknowledgement moves the account''s reconciliation baseline, and the accounting.bankstatement.committed fact is queued.

        Use this tool once the preview ties and every rejected or out-of-window row is corrected or skipped; set startReconciliation to start the reconciliation of the committed statement (the first segment''s) in the same transaction instead of calling createReconciliation after.

        Preconditions: status VALIDATED; no REJECTED rows; OUT_OF_WINDOW rows skipped; opening + activity equal to closing within one minor unit; POSSIBLE_DUPLICATE rows either decided in duplicateDecisions or committed as possible duplicates for later review.

        Required inputs: importId in the path; optional duplicateDecisions [{rowNumber, decision}] and startReconciliation (its id is returned as reconciliationId).

        Emits an ACCOUNTING_BANK_IMPORT_COMMIT event; a second commit returns the same result.

        Returns 422 IMPORT_NOT_COMMITTABLE with fieldErrors rows[n] and activityTotal, or the header codes when the previous statement changed since upload; 409 when the import is DISCARDED, the window or the file is already committed, or the version is stale; 404 for an unknown import.

        '
      operationId: commitBankImport
      parameters:
      - description: Import id
        in: path
        name: importId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Commit and start reconciling:
                description: Commit and start reconciling
                value:
                  duplicateDecisions:
                  - decision: DISTINCT
                    rowNumber: 12
                  startReconciliation: true
                  version: 3
            schema:
              $ref: '#/components/schemas/BankImportCommitRequest'
        description: Optional; decisions on POSSIBLE_DUPLICATE rows, whether to start a reconciliation, and the version the caller read.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankImportCommitResponse'
          description: Committed (or already committed)
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: VALIDATION_ERROR
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks accounting:reconciliation:adjust
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: BANK_IMPORT_NOT_FOUND
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: IMPORT_DISCARDED, STATEMENT_ALREADY_IMPORTED, IMPORT_FILE_ALREADY_COMMITTED or OPTIMISTIC_LOCK
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: IMPORT_NOT_COMMITTABLE, CURRENCY_NOT_SUPPORTED, STATEMENT_PERIOD_OVERLAP, STATEMENT_NOT_CONTIGUOUS, STATEMENT_GAP_ACKNOWLEDGEMENT_NOT_APPLICABLE or AMOUNT_PRECISION_EXCEEDS_CURRENCY
      security:
      - bearerAuth:
        - accounting:reconciliation:adjust
      summary: Commit Bank Import
      tags:
      - Bank Imports
      x-required-permissions:
      - accounting:reconciliation:adjust
  /v1/accounting/bank-imports/{importId}/discard:
    post:
      description: 'Discards an import that will not be committed; the status becomes DISCARDED, which is terminal, and the raw file stays retained until its retention date.

        Use this tool for a wrong or superseded upload; do not use it on a committed import, whose statement is corrected by an explicit supersede instead.

        Preconditions: the import must be UPLOADED or VALIDATED.

        Required inputs: importId in the path and a reason of at least 10 characters.

        Emits an ACCOUNTING_BANK_IMPORT_DISCARD event.

        Returns 409 when the import is COMMITTED or already DISCARDED or the version is stale; 400 when the reason is missing or too short; 404 for an unknown import.

        '
