        contentHash:
          description: SHA-256 canonical content hash
          type: string
        frozenAt:
          description: Freeze timestamp
          format: date-time
          type: string
        frozenBy:
          description: User who froze the snapshot
          example: controller
          type: string
        periodCode:
          description: Accounting period code (YYYY-MM)
          example: 2026-06
          type: string
        reconciled:
          description: Whether GL drift was within tolerance at freeze time
          type: boolean
        snapshotId:
          description: Snapshot id
          format: uuid
          type: string
        status:
          description: 'Snapshot lifecycle status: ACTIVE or SUPERSEDED'
          example: ACTIVE
          type: string
        totalNetTax:
          description: Grand total net tax as frozen
