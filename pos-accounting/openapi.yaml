    TaxLiabilitySnapshotVerification:
      description: Re-derivation check of a frozen Sales-Tax Liability snapshot against live data
      properties:
        consistent:
          description: True when the re-derived report hashes identically to the frozen snapshot
          type: boolean
        frozenTotalNetTax:
          description: Total net tax as frozen
          type: number
        netTaxDelta:
          description: recomputedTotalNetTax - frozenTotalNetTax; zero when amounts agree even if row detail moved
          type: number
        periodCode:
          description: Accounting period code (YYYY-MM)
