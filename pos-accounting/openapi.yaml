  /v1/accounting/reports/financial/aged-payables:
    get:
      description: 'Generates the Aged Payables report as of a date: per-vendor open vendor-bill balances bucketed by days past due (0-30, 31-60, 61-90, 90+) with grand totals.

        Buckets are days past the bill''s DUE date, falling back to the bill date when a bill carries no due date — the same rule generateAgedReceivables uses — and not-yet-due bills are INCLUDED in the 0-30 bucket, which therefore means "not yet due, or up to 30 days past due".

        Use this tool to review what is owed to vendors and how overdue it is; do not use generateAgedReceivables, which is the customer-side mirror, and use listApBills to pick individual bills for payment.

        Preconditions: none; rows are empty when no open payables exist.

        Required inputs: asOfDate (ISO date) as a query parameter.

        Emits a REPORT_AGED_PAYABLES_GENERATE audit event; no state changes.

        Returns 400 when the asOfDate is missing or malformed.

        '
      operationId: generateAgedPayables
      parameters:
      - description: As-of date (YYYY-MM-DD)
        example: '2026-06-30'
        in: query
        name: asOfDate
        required: true
        schema:
          format: date
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgedPayablesReport'
          description: Aged payables generated successfully (rows empty when no open payables exist)
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid or missing asOfDate
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden - missing reporting:view:financial-statements
      security:
      - bearerAuth:
        - reporting:view:financial-statements
      summary: Generate Aged Payables
      tags:
      - Financial Reporting
      x-required-permissions:
      - reporting:view:financial-statements
