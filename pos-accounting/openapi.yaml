    RemainderCreditRequest:
      description: Keep a payment's unapplied remainder as a customer credit
      properties:
        expectedAmount:
          description: The payment's unapplied amount as the caller read it; must still match exactly
          example: 12.5
          minimum: 0.01
          type: number
        requestId:
          description: Idempotency key for this command; a replay returns the credit it issued, the same key on another payment is refused with IDEMPOTENCY_CONFLICT
          example: remainder-2026-10-06-017
          maxLength: 100
          minLength: 0
          type: string
      required:
      - expectedAmount
      - requestId
      type: object
    RemainderCreditResponse:
      description: The customer credit issued for a payment's unapplied remainder
      properties:
        amount:
          description: Amount of the credit (the whole remainder)
          example: 12.5
          type: number
        createdAt:
          description: When the credit was issued (ISO 8601)
          example: '2026-10-06T08:00:00Z'
          format: date-time
          type: string
        creditId:
          description: Identifier of the customer credit issued
          example: 01960003-0000-7000-8000-000000000020
          format: uuid
          type: string
        currency:
          description: Currency of the credit (ISO 4217)
          example: USD
          type: string
        paymentId:
          description: The payment whose remainder was credited
          example: 01960003-0000-7000-8000-000000000010
          format: uuid
          type: string
        remainingAmount:
          description: The payment's unapplied amount after the credit; always 0
          example: 0.0
          type: number
        requestId:
          description: The request's idempotency key, as sent
          example: remainder-2026-10-06-017
          type: string
      required:
      - amount
      - createdAt
      - creditId
      - currency
      - paymentId
      - remainingAmount
      - requestId
      type: object
    ReportExportRequest:
