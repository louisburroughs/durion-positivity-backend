    post:
      description: 'Submits an asynchronous export job that renders a financial report to a downloadable artifact, returning immediately with status PENDING.

        Use this tool to produce a file for one of the reporting endpoints'' outputs; do not use the synchronous generate operations such as generateIncomeStatement when a file artifact is what is needed, and poll getReportExportStatus for completion.

        Preconditions: none; as-of report types use the request''s endDate as the as-of date.

        Required inputs: format (PDF, CSV, XLSX or JSON), reportType (TAX_LIABILITY, INCOME_STATEMENT, BALANCE_SHEET, TRIAL_BALANCE, GENERAL_LEDGER, AGED_RECEIVABLES or AGED_PAYABLES), startDate and endDate (endDate on or after startDate); accountId and filename are optional.

