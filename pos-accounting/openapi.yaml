    SettlementWriteOffRequest:
      type: object
      description: Request payload for writing off a small unmatched settlement line
      properties:
        reason:
          type: string
          description: Mandatory reason for the write-off; recorded on the line and in the audit trail
          example: Unidentifiable micro-deposit below reconciliation threshold
          maxLength: 500
          minLength: 0
      required:
      - reason
    SettlementLineResponse:
      type: object
      description: Processor settlement line with its reconciliation match status
      properties:
        lineId:
          type: string
          format: uuid
          description: Settlement line UUID
          example: 01936e5e-7890-7a3d-8b6e-4d5678901234
        settlementId:
          type: string
          description: Owning settlement id (provider payout id)
          example: stl_1Mx3k2eZvKYlo2C0
        providerLineRef:
          type: string
          description: Provider's own line reference
          example: txn_3Mx3k2eZvKYlo2C0
        lineType:
          type: string
          description: Settlement line type
          enum:
          - CHARGE
          - REFUND
          - CHARGEBACK
          - FEE
          - ADJUSTMENT
          - RESERVE_HOLD
          - RESERVE_RELEASE
          - PAYOUT_CORRECTION
          example: CHARGE
        grossAmount:
          type: number
          description: Line gross amount (matched on gross, decision D-11)
          example: 1000.0
        feeAmount:
          type: number
          description: Line fee amount; null for netted/header-only providers
          example: 30.0
        netAmount:
          type: number
          description: Line net amount; null for netted/header-only providers
          example: 970.0
        paymentReference:
          type: string
          description: Platform correlation token echoed by the processor (decision D-11)
        matchStatus:
          type: string
          description: Reconciliation match status
          enum:
          - MATCHED
          - UNMATCHED
          - WRITTEN_OFF
          example: UNMATCHED
        matchedPaymentId:
          type: string
          format: uuid
          description: Id of the matched AR/AP payment; null while UNMATCHED
        matchedPaymentType:
          type: string
          description: Whether the matched payment is AR (receivable) or AP (vendor)
          enum:
          - AR
          - AP
        writeoffReason:
          type: string
          description: Recorded reason when the line was written off
        writeoffJournalEntryId:
          type: string
          format: uuid
          description: Journal entry id of the reversible write-off posting
        createdAt:
          type: string
          format: date-time
          description: When the line was first ingested
        updatedAt:
          type: string
          format: date-time
          description: When the line was last updated
    SettlementManualMatchRequest:
      type: object
      description: Request payload for manually matching a settlement line to a receivable payment
      properties:
        receivablePaymentId:
          type: string
          format: uuid
          description: The receivable payment to match the settlement line to
          example: 01936e5e-7890-7a3d-8b6e-4d5678901234
      required:
      - receivablePaymentId
    ReportExportRequest:
