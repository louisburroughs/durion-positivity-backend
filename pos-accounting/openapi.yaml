          example: 01936e5e-7890-7a3d-8b6e-4d5678901234
          format: uuid
          type: string
      required:
      - receivablePaymentId
      type: object
    SettlementWriteOffRequest:
      description: Request payload for writing off a small unmatched settlement line
      properties:
        reason:
          description: Mandatory reason for the write-off; recorded on the line and in the audit trail
          example: Unidentifiable micro-deposit below reconciliation threshold
          maxLength: 500
          minLength: 0
          type: string
      required:
      - reason
      type: object
    SortObject:
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean
      type: object
    TaxLiabilityReconciliation:
      description: Reconciliation of report net tax against the Sales-Tax Payable (2200) GL account period activity
      properties:
        drift:
          description: 'GL drift: reportNetTax - glNetActivity. Zero on a clean ledger; non-zero flags a mismatch'
          example: 0.0
          type: number
        glNetActivity:
          description: Credit-normal net activity of account 2200 in the period (Σ credit - Σ debit of POSTED lines); zero when the account has no activity or is not seeded
          example: 948.75
          type: number
        reconciled:
          description: True when the UNEXPLAINED drift (drift - unattributedCredits) is within the 0.01 reconciliation tolerance. Unattributed credits inflate drift by exactly their own value, so that portion is explained and does not flag the ledger as out of balance
          example: true
          type: boolean
        reportNetTax:
          description: Report's total net tax across all jurisdictions (echoes report totals.netTax)
          example: 948.75
          type: number
        taxPayableAccountCode:
          description: Sales-Tax Payable GL account code being reconciled against
          example: '2200'
          type: string
        unattributedCredits:
          description: Credit-memo tax that could not be attributed to any jurisdiction (the credit carries no frozen breakdown and its original invoice has no attributable tax rows). Excluded from the jurisdiction rows by design, so it accounts for exactly this much of the drift
          example: 0.0
          type: number
      required:
      - drift
      - glNetActivity
      - reconciled
      - reportNetTax
      - taxPayableAccountCode
      - unattributedCredits
      type: object
    TaxLiabilityReport:
      description: 'Sales-Tax Liability report: per-jurisdiction taxable/exempt base, gross, credits, net tax, and GL drift'
      properties:
        endDate:
          description: Period end date (inclusive)
          example: 2026-06-30
          format: date
          type: string
        generatedAt:
          description: Timestamp when the report was generated (ISO 8601)
          example: 2026-06-30 08:00:00+00:00
          format: date-time
          type: string
        reconciliation:
          $ref: '#/components/schemas/TaxLiabilityReconciliation'
        rows:
          description: Per-jurisdiction rows ordered by level (state/county/city/special) then code; empty when no in-period tax exists
          items:
            $ref: '#/components/schemas/TaxLiabilityRow'
          type: array
        startDate:
          description: Period start date (inclusive)
          example: 2026-06-01
          format: date
          type: string
        totalCreditsNetted:
          description: Grand total credits netted across all jurisdictions
          example: 82.5
          type: number
        totalExemptBase:
          description: Grand total exempt base across all jurisdictions
          example: 1500.0
          type: number
        totalNetTax:
          description: Grand total net tax across all jurisdictions
          example: 948.75
          type: number
        totalTaxCollectedGross:
          description: Grand total gross tax collected across all jurisdictions
          example: 1031.25
          type: number
        totalTaxableBase:
          description: Grand total taxable base across all jurisdictions
          example: 12500.0
          type: number
      required:
      - endDate
      - generatedAt
      - reconciliation
      - rows
      - startDate
      - totalCreditsNetted
      - totalExemptBase
      - totalNetTax
      - totalTaxCollectedGross
      - totalTaxableBase
      type: object
    TaxLiabilityRow:
      description: Per-jurisdiction sales-tax liability row (taxable/exempt base, gross, credits netted, net tax)
      properties:
        creditsNetted:
          description: Credit/refund tax netted against this jurisdiction — POSTED credit-memo reversals allocated pro-rata to collected tax
          example: 82.5
          type: number
        exemptBase:
          description: Sum of taxable base for exempt / zero-rate lines in this jurisdiction
          example: 1500.0
          type: number
        exemptionReasons:
          description: Distinct exemption reason codes contributing to the exempt base (ascending); empty when none
          items:
            type: string
          type: array
        jurisdictionCode:
          description: Jurisdiction code as reported by the tax engine
          example: WA
          type: string
        jurisdictionName:
          description: Human-readable jurisdiction name when available; null when the replica carries only the code
          example: Washington
          type: string
        jurisdictionType:
          description: 'Jurisdiction level: STATE, COUNTY, CITY, or SPECIAL'
          example: STATE
          type: string
        netTax:
          description: 'Net tax owed for this jurisdiction: taxCollectedGross - creditsNetted'
          example: 948.75
          type: number
        taxCollectedGross:
          description: Gross tax collected (Σ tax_amount of non-exempt lines) before credits
          example: 1031.25
          type: number
        taxableBase:
          description: Sum of taxable base for non-exempt lines in this jurisdiction
          example: 12500.0
          type: number
      required:
      - creditsNetted
      - exemptBase
      - exemptionReasons
      - jurisdictionCode
      - jurisdictionType
      - netTax
      - taxCollectedGross
      - taxableBase
      type: object
    TaxLiabilitySnapshotResponse:
