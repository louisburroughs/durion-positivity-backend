          description: Vendor found
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Vendor not found
      security:
      - bearerAuth:
        - accounting:ap:view
      summary: Get Vendor By Id
      tags:
      - Vendor Directory API
      x-required-permissions:
