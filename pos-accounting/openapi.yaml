      requestBody:
        content:
          application/json:
            examples:
              Debit and credit columns:
                description: Debit and credit columns
                value:
                  columnMapping:
                    credit: Credit
                    date: Posted Date
                    debit: Debit
                    description: Payee
                  dateFormat: dd/MM/yyyy
                  saveAsAccountDefault: true
                  signConvention: DEBIT_CREDIT_COLUMNS
                  version: 3
            schema:
              $ref: '#/components/schemas/BankImportMappingRequest'
        description: The column mapping and parse options to re-parse the file with; omitted options keep the import's current values.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankImportResponse'
          description: Import re-parsed
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: VALIDATION_ERROR
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks accounting:reconciliation:adjust
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: BANK_IMPORT_NOT_FOUND
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: IMPORT_ALREADY_COMMITTED, IMPORT_DISCARDED, STATEMENT_ALREADY_IMPORTED or OPTIMISTIC_LOCK
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: STATEMENT_PERIOD_OVERLAP, STATEMENT_NOT_CONTIGUOUS or STATEMENT_GAP_ACKNOWLEDGEMENT_NOT_APPLICABLE after a header change; AMOUNT_PRECISION_EXCEEDS_CURRENCY for a header or split balance finer than the currency
      security:
