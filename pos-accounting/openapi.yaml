      description: 'Selects one candidate from an ambiguous invoice match, approving the corresponding vendor bill and marking the candidate set resolved.

        Use this tool after reviewing listVendorBillMatchCandidates; do not use resolveVendorBillMatchException, which handles discrepancy exceptions on a single bill.

