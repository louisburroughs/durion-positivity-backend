          format: uuid
      responses:
        '200':
          description: Journal traceability returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryTraceabilityResponse'
        '404':
          description: Journal entry not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryTraceabilityResponse'
      security:
      - bearerAuth:
        - accounting:je:view
      x-required-permissions:
      - accounting:je:view
  /v1/accounting/invoice/{invoiceId}/status:
