      - exportType
      - format
    ExportJobResponse:
      type: object
      description: Status and metadata for an export job
      properties:
        jobId:
          type: string
          format: uuid
          description: Unique job identifier
          example: 01960003-0000-7000-8000-000000000001
        status:
          type: string
          description: Current job status
          example: COMPLETED
        requestedAt:
          type: string
          format: date-time
          description: When the export was requested (ISO 8601)
          example: 2026-06-18 08:00:00+00:00
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the export completed (ISO 8601)
          example: 2026-06-18 08:05:00+00:00
        downloadUrl:
          type:
          - string
          - 'null'
          description: Download URL when available
