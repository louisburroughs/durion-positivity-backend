  /v1/accounting/reports/location/labor-overhead:
    get:
      description: 'Generates the read-only Location Labor and Overhead Cost Report: the canonical cost-line matrix of 12 monthly amounts plus YTD with section subtotals, for one location and fiscal year, derived entirely from posted GL data.

        Use this tool for location-level labor and overhead cost review; do not use generateIncomeStatement, which is the org-wide statement without the location dimension.

        Preconditions: none; a location with no posted activity yields zeroed lines.

        Required inputs: locationId (the accounting locationId dimension, e.g. LOC-107) and fiscalYear (four-digit year); asOfMonth (1-12) is optional and defaults to 12, bounding the YTD column.

        Emits a REPORT_LABOR_OVERHEAD_GENERATE audit event; no state changes.

        Returns 400 when fiscalYear is not a four-digit year or asOfMonth is outside 1 to 12, and 403 with LOCATION_SCOPE_DENIED when the caller holds reporting:view:financial-statements but the token scopes it to locations that do not cover locationId (ADR-0061); an accounting location code the location replica cannot place is denied for a location-scoped caller.

        '
      operationId: generateLaborOverheadReport
      parameters:
      - description: Location/dealer identifier (accounting locationId dimension)
        example: LOC-107
        in: query
        name: locationId
        required: true
        schema:
          minLength: 1
          type: string
      - description: Fiscal year
        example: 2026
        in: query
        name: fiscalYear
        required: true
        schema:
          format: int32
          type: integer
      - description: Highest elapsed month bounding YTD (1-12); defaults to 12
        example: 6
        in: query
        name: asOfMonth
        required: false
        schema:
          format: int32
          type: integer
