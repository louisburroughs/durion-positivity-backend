          format: uuid
        example: 01936e5c-7890-7a3d-8b6e-2b3456789012
      responses:
        "200":
          description: Payment found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/APPaymentResponse"
        "404":
          description: Payment not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/APPaymentResponse"
      security:
      - bearerAuth: []
  /v1/accounting/ap/payments/by-ref/{paymentRef}:
    get:
      tags:
      - AP Payments
      summary: Get payment by reference
      description: Retrieve AP payment details by paymentRef (idempotency key).
      operationId: getPaymentByRef
      parameters:
      - name: paymentRef
        in: path
        description: Payment reference (idempotency key)
        required: true
        schema:
          type: string
          maxLength: 100
          minLength: 1
          pattern: "^[^\\r\\n]+$"
        example: 01936e5c-7890-7a3d-8b6e-2b3456789012
      responses:
        "200":
          description: Payment found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/APPaymentResponse"
        "404":
          description: Payment not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/APPaymentResponse"
      security:
      - bearerAuth: []
  /v1/accounting/ap/bills:
    get:
      tags:
      - AP Payments
      summary: List eligible vendor bills
      description: "Get eligible vendor bills for payment (status = APPROVED). Bills\
        \ are ordered by due date (oldest first, nulls last), then bill date, then\
        \ bill ID."
      operationId: listBills
      parameters:
      - name: vendorId
        in: query
        description: Vendor UUID
        required: true
        schema:
          type: string
          format: uuid
        example: 01936e5b-4567-7a3d-8b6e-1a2345678901
      responses:
        "200":
          description: Bills retrieved successfully
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VendorBillSummaryResponse"
        "400":
          description: Invalid vendor ID
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VendorBillSummaryResponse"
      security:
      - bearerAuth: []
