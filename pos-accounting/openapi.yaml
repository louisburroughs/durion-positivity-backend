    InvoiceRevenueReconcileRequest:
      description: Bounds for an invoice revenue reconciliation run; all fields optional
      properties:
        dryRun:
          default: false
          description: Report what would be posted without posting
          type: boolean
        finalizedFrom:
          description: Only invoices finalized at or after this instant
          example: '2026-07-01T00:00:00Z'
          format: date-time
          type: string
        finalizedTo:
          description: Only invoices finalized before this instant
          example: '2026-09-01T00:00:00Z'
          format: date-time
          type: string
        invoiceIds:
          description: Only these invoices (overrides the window when given)
          items:
            format: uuid
            type: string
          type: array
        limit:
          description: Stop after this many candidates, oldest first (1-5000)
          example: 500
          format: int32
          maximum: 5000
          minimum: 1
          type: integer
      type: object
    InvoiceRevenueReconcileResponse:
      description: Result of an invoice revenue reconciliation run
      properties:
        alreadyPosted:
          description: Invoices whose revenue was already on the ledger
          format: int32
          type: integer
        dryRun:
          description: True when nothing was posted (dry run)
          type: boolean
        failed:
          description: Invoices whose posting raised an error
          format: int32
          type: integer
        outcomes:
          description: One entry per candidate, in the order examined
          items:
            $ref: '#/components/schemas/Outcome'
          type: array
        posted:
          description: Postings created (or, on a dry run, that would be created)
          format: int32
          type: integer
        scanned:
          description: Candidates examined
          format: int32
          type: integer
        skipped:
          description: Invoices skipped by rule (deposit-take, zero total, no finalizedAt, reversed cycle)
          format: int32
          type: integer
      type: object
    InvoiceStatusResponse:
