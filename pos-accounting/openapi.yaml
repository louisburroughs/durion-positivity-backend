      operationId: deactivatePostingCategory
      parameters:
      - description: Posting category identifier
        in: path
        name: postingCategoryId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: Posting category deactivated
        '404':
          description: Posting category not found
        '409':
          description: Cannot deactivate - active mappings exist
      security:
      - bearerAuth:
        - accounting:posting-category:deactivate
      summary: Deactivate Posting Category
      tags:
      - Posting Categories
      x-required-permissions:
      - accounting:posting-category:deactivate
  /v1/accounting/posting-categories/{postingCategoryId}/mapping-keys:
