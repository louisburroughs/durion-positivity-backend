      tags:
      - Financial Reporting
      summary: Generate Aged Receivables
      description: 'Generates the Aged Receivables report as of a date: per-customer open invoice balances bucketed by days past due (0-30, 31-60, 61-90, 90+) with grand totals.

        Use this tool to review customer collection exposure; do not use generateAgedPayables, which is the vendor-side mirror of this report.

        Preconditions: none; rows are empty when no open receivables exist.

        Required inputs: asOfDate (ISO date) as a query parameter.

        Emits a REPORT_AGED_RECEIVABLES_GENERATE audit event; no state changes.

        Returns 400 when the asOfDate is missing or malformed.

        '
      operationId: generateAgedReceivables
      parameters:
      - name: asOfDate
        in: query
        description: As-of date (YYYY-MM-DD)
        required: true
        schema:
          type: string
          format: date
        example: 2026-06-30
      responses:
        '200':
          description: Aged receivables generated successfully (rows empty when no open receivables exist)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgedReceivablesReport'
        '400':
          description: Invalid or missing asOfDate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - missing reporting:view:financial-statements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - reporting:view:financial-statements
      x-required-permissions:
      - reporting:view:financial-statements
  /v1/accounting/reports/financial/aged-payables:
    get:
      tags:
      - Financial Reporting
      summary: Generate Aged Payables
      description: 'Generates the Aged Payables report as of a date: per-vendor open vendor-bill balances bucketed by days past due (0-30, 31-60, 61-90, 90+) with grand totals.

        Use this tool to review what is owed to vendors and how overdue it is; do not use generateAgedReceivables, which is the customer-side mirror, and use listApBills to pick individual bills for payment.

        Preconditions: none; rows are empty when no open payables exist.

        Required inputs: asOfDate (ISO date) as a query parameter.

        Emits a REPORT_AGED_PAYABLES_GENERATE audit event; no state changes.

        Returns 400 when the asOfDate is missing or malformed.

        '
      operationId: generateAgedPayables
      parameters:
      - name: asOfDate
        in: query
        description: As-of date (YYYY-MM-DD)
        required: true
        schema:
          type: string
          format: date
        example: 2026-06-30
      responses:
        '200':
          description: Aged payables generated successfully (rows empty when no open payables exist)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgedPayablesReport'
        '400':
          description: Invalid or missing asOfDate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - missing reporting:view:financial-statements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - reporting:view:financial-statements
      x-required-permissions:
      - reporting:view:financial-statements
  /v1/accounting/reports/export/{exportId}:
    get:
      tags:
      - Financial Reporting
      summary: Get Report Export Status
      description: 'Returns the current status of an asynchronous report export job: PENDING, IN_PROGRESS, COMPLETED or FAILED.

        Use this tool to poll a job created by requestReportExport; do not use downloadReportExport until the status is COMPLETED.

        Preconditions: the export job must exist.

        Required inputs: exportId (UUID) as a path parameter; there is no request body.

        Emits an ACCOUNTING_REPORT_EXPORT_STATUS audit event; no state changes.

        Returns 404 EXPORT_JOB_NOT_FOUND when no export job exists for the supplied id.

        '
      operationId: getReportExportStatus
      parameters:
      - name: exportId
        in: path
        description: Export job UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Export status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExportResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExportResponse'
        '403':
          description: Forbidden - missing accounting:report:export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExportResponse'
        '404':
          description: Export job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExportResponse'
      security:
      - bearerAuth:
        - accounting:report:export
      x-required-permissions:
      - accounting:report:export
  /v1/accounting/reports/export/{exportId}/download:
    get:
      tags:
      - Financial Reporting
      summary: Download Report Export Artifact
      description: 'Downloads the rendered artifact of a COMPLETED export job as an attachment whose content type matches the requested format, for example text/csv or application/pdf.

        Use this tool after getReportExportStatus reports COMPLETED; do not use it earlier, and note it requires reporting:view:financial-statements because the artifact carries actual financial figures.

        Preconditions: the export job must exist, be COMPLETED and still have its artifact.

        Required inputs: exportId (UUID) as a path parameter; there is no request body.

        Emits an ACCOUNTING_REPORT_EXPORT_DOWNLOAD audit event; no state changes.

        Returns 404 when the job or its artifact is missing, and 409 when the job is not COMPLETED.

        '
      operationId: downloadReportExport
      parameters:
      - name: exportId
        in: path
        description: Export job UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Rendered artifact returned (content type matches the export format, e.g. text/csv or application/pdf)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
                format: byte
        '403':
          description: Forbidden - missing reporting:view:financial-statements
          content:
            application/json:
              schema:
                type: string
                format: byte
        '404':
          description: Export job or artifact not found
          content:
            application/json:
              schema:
                type: string
                format: byte
        '409':
          description: Export job is not COMPLETED
          content:
            application/json:
              schema:
                type: string
                format: byte
      security:
      - bearerAuth:
        - accounting:report:export
      x-required-permissions:
      - reporting:view:financial-statements
  /v1/accounting/reconciliations:
    get:
      tags:
      - Bank Reconciliation
      summary: List Reconciliations
      description: 'Lists bank reconciliations most recent first as a paginated projection, optionally filtered by GL account and status.

        Use this tool to find in-progress or finalized reconciliations; do not use getReconciliation, which fetches one reconciliation with its lines by id.

        Preconditions: none beyond the caller holding accounting:reconciliation:view.

        Required inputs: none; glAccountId and status (IN_PROGRESS, FINALIZED) are optional filters, page defaults to 0 and size to 20.

        Emits an ACCOUNTING_RECONCILIATION_LIST audit event; no state changes.

        Returns 200 with an empty page when nothing matches the filters.

        '
      operationId: listReconciliations
      parameters:
      - name: glAccountId
        in: query
        description: Filter by reconciled GL account id
        required: false
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        description: Filter by reconciliation status
        required: false
        schema:
          type: string
          enum:
          - IN_PROGRESS
          - FINALIZED
          - CANCELLED
      - name: page
        in: query
        description: Zero-based page index
        required: false
        schema:
          type: integer
          format: int32
          default: 0
        example: 0
      - name: size
        in: query
        description: Page size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
        example: 20
      responses:
        '200':
          description: Reconciliations listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankReconciliationListResponse'
        '403':
          description: Caller lacks the accounting:reconciliation:view permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - accounting:reconciliation:view
      x-required-permissions:
      - accounting:reconciliation:view
  /v1/accounting/reconciliations/{reconciliationId}:
    get:
      tags:
      - Bank Reconciliation
      summary: Get Reconciliation
      description: 'Returns one bank reconciliation with its imported statement lines, match state and adjustments.

        Use this tool when the reconciliation id is already known; use listReconciliations instead when searching by account or status, or getReconciliationReport for the balance summary view.

        Preconditions: the reconciliation must exist.

        Required inputs: reconciliationId (UUID) as a path parameter; there is no request body.

        Emits an ACCOUNTING_RECONCILIATION_GET audit event; no state changes.

        Returns 404 RECONCILIATION_NOT_FOUND when the id is unknown.

        '
      operationId: getReconciliation
      parameters:
      - name: reconciliationId
        in: path
        description: Reconciliation id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Reconciliation found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankReconciliationResponse'
        '403':
          description: Caller lacks the accounting:reconciliation:view permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Reconciliation not found (RECONCILIATION_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - accounting:reconciliation:view
      x-required-permissions:
      - accounting:reconciliation:view
  /v1/accounting/reconciliations/{reconciliationId}/report:
    get:
      tags:
      - Bank Reconciliation
      summary: Get Reconciliation Report
      description: 'Returns the reconciliation report: opening GL and closing statement balances, matched versus outstanding lines, adjustments and the outstanding difference.

        Use this tool to see how far a reconciliation is from balancing before finalizeReconciliation; use getReconciliation instead for the raw line-level detail.

        Preconditions: the reconciliation must exist.

        Required inputs: reconciliationId (UUID) as a path parameter; there is no request body.

        Emits an ACCOUNTING_RECONCILIATION_REPORT audit event; no state changes.

        Returns 404 RECONCILIATION_NOT_FOUND when the id is unknown.

