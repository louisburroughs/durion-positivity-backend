        example: '2026-01-01'
        in: query
        name: from
        required: false
        schema:
          format: date
          type: string
      - description: Windows starting on or before this date
        example: '2026-12-31'
        in: query
        name: to
        required: false
        schema:
          format: date
          type: string
      - description: Zero-based page index
        example: 0
        in: query
        name: page
        required: false
        schema:
          default: 0
          format: int32
          type: integer
