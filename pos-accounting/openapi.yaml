    LaborOverheadCostReport:
      type: object
      description: Read-only Labor & Overhead Cost Report (CAP-316) for a location and fiscal year
      properties:
        locationId:
          type: string
          description: Location/dealer identifier (accounting locationId dimension)
          example: LOC-107
        locationLabel:
          type: string
          description: Human-readable location label
          example: Smetzer's Wooster
        fiscalYear:
          type: integer
          format: int32
          description: Fiscal year
          example: 2026
        asOfMonth:
          type: integer
          format: int32
          description: Highest elapsed month bounding YTD (1-12)
          example: 12
        currency:
          type: string
          description: Currency of the amounts (line 2.11.4 is always USD)
          example: USD
        localCurrencyPerUsd:
          type: number
          description: Local currency units per USD (1.00 for US plants)
          example: 1.0
        averageRate:
          type: number
          description: Average conversion rate used for the year (1.00 for US plants)
          example: 1.0
        lines:
          type: array
          description: Cost lines in canonical order (Labor §1, Overhead §2, totals)
          items:
            $ref: '#/components/schemas/LaborOverheadReportLine'
      required:
      - asOfMonth
      - averageRate
      - currency
      - fiscalYear
      - lines
      - localCurrencyPerUsd
      - locationId
    LaborOverheadReportLine:
      type: object
      description: A single Labor & Overhead cost line with monthly amounts and YTD
      properties:
        code:
          type: string
          description: Canonical line code
          example: 1.1.1
        label:
          type: string
          description: Display label
          example: Hourly wages and bonuses
        parentCode:
          type: string
          description: Parent line code, if any
          example: '1.1'
        level:
          type: integer
          format: int32
          description: Hierarchy depth (totals = 1, N.M = 2, N.M.K = 3)
          example: 3
        costType:
          type: string
          description: Fixed/Variable classification; absent when the source shows none
          enum:
          - FIXED
          - VARIABLE
          - FIXED_IF_LOW_VOLUME
        definition:
          type: string
          description: Include/exclude guidance from the Definitions tab
        monthly:
          type: array
          description: 12 monthly amounts in canonical order (index 0 = January)
          example:
          - 0
          - 0
          - 0
          - 0
          - 0
          - 0
          - 0
          - 0
          - 0
          - 62645
          - 0
          - 0
          items:
            type: number
        ytd:
          type: number
          description: Year-to-date total over elapsed months
          example: 62645
        subtotal:
          type: boolean
        isSubtotal:
          type: boolean
          description: True for computed roll-up rows; false for GL-mapped leaf lines
          example: false
        usdOnly:
          type: boolean
          description: True for line 2.11.4, which is reported in USD even on local-currency plants
          example: false
      required:
      - code
      - isSubtotal
      - label
      - level
      - monthly
      - usdOnly
      - ytd
    EntryNumberGapCheck:
      type: object
      description: Entry-number gap-check result for one monthly sequence scope; absent gaps mean a clean ledger
      properties:
        scopeKey:
          type: string
          description: Monthly sequence scope key
          example: JE-202607
        missingNumbers:
          type: array
          description: Ascending sequence numbers handed out but missing from the ledger for this scope
          example:
          - 7
          - 12
          items:
            type: integer
            format: int64
      required:
      - missingNumbers
      - scopeKey
    TrialBalanceReport:
      type: object
      description: Trial Balance report with per-account debit/credit/balance rows from POSTED journal lines, grand totals proving sum(debit) == sum(credit), and an entry-number gap-check footnote
      properties:
        asOfDate:
          type: string
          format: date
          description: Date the trial balance is reported as of (inclusive)
          example: 2026-06-30
        generatedAt:
          type: string
          format: date-time
          description: Timestamp when the report was generated (ISO 8601)
          example: 2026-06-30 08:00:00+00:00
        rows:
          type: array
          description: Per-account trial balance rows ordered by account number; empty when no POSTED data exists
          items:
            $ref: '#/components/schemas/TrialBalanceRow'
        totalDebit:
          type: number
          description: Grand total of all POSTED debit amounts across rows
          example: 1250000.0
        totalCredit:
          type: number
          description: Grand total of all POSTED credit amounts across rows
          example: 1250000.0
        balanced:
          type: boolean
          description: Whether sum of debits equals sum of credits; false surfaces a balance-constraint violation
          example: true
        entryNumberGaps:
          type: array
          description: 'Entry-number gap-check footnote: per-month sequence scopes with missing entry numbers; empty on a clean ledger'
          items:
            $ref: '#/components/schemas/EntryNumberGapCheck'
      required:
      - asOfDate
      - balanced
      - entryNumberGaps
      - generatedAt
      - rows
      - totalCredit
      - totalDebit
    TrialBalanceRow:
      type: object
      description: Per-account trial balance row aggregated from POSTED journal lines
      properties:
        accountId:
          type: string
          description: GL account ID (UUID)
          example: 123e4567-e89b-12d3-a456-426614174000
        accountNumber:
          type: string
          description: GL account number (chart-of-accounts code)
          example: '1000'
        accountName:
          type: string
          description: GL account display name
          example: Cash - Operating
        totalDebit:
          type: number
          description: Sum of POSTED debit amounts for the account up to the as-of date
          example: 125000.0
        totalCredit:
          type: number
          description: Sum of POSTED credit amounts for the account up to the as-of date
          example: 45000.0
        balance:
          type: number
          description: Net account balance (totalDebit - totalCredit, signed)
          example: 80000.0
      required:
      - accountId
      - accountName
      - accountNumber
      - balance
      - totalCredit
      - totalDebit
    IncomeStatementReport:
      type: object
      description: Income statement (Profit & Loss) report built from POSTED journal entries
      properties:
        startDate:
          type: string
          format: date
          description: Report period start date (inclusive)
          example: 2026-01-01
        endDate:
          type: string
          format: date
          description: Report period end date (inclusive)
          example: 2026-03-31
        generatedAt:
          type: string
          format: date-time
          description: Timestamp when the report was generated
          example: 2026-06-18 08:00:00+00:00
        lineItems:
          type: object
          additionalProperties:
            type: number
          description: Map of statement line codes to amounts (e.g. PL_REVENUE_SALES, PL_EXPENSE_SALARIES)
          example:
            PL_REVENUE_SALES: '1250.00'
        totalRevenue:
          type: number
          description: Total revenue (sum of all revenue accounts)
          example: 1250.0
        totalExpenses:
          type: number
          description: Total expenses (sum of all expense accounts)
          example: 1250.0
        netIncome:
          type: number
          description: Net income (total revenue minus total expenses); positive is profit, negative is loss
          example: 1250.0
      required:
      - endDate
      - generatedAt
      - lineItems
      - netIncome
      - startDate
      - totalExpenses
      - totalRevenue
    GeneralLedgerAccountSection:
