      tags:
      - Financial Reporting
      x-required-permissions:
      - accounting:report:export
  /v1/accounting/reports/export/{exportId}/download:
    get:
      description: 'Downloads the rendered artifact of a COMPLETED export job as an attachment whose content type matches the requested format, for example text/csv or application/pdf.

        Use this tool after getReportExportStatus reports COMPLETED; do not use it earlier, and note it requires reporting:view:financial-statements because the artifact carries actual financial figures.

        Preconditions: the export job must exist, be COMPLETED and still have its artifact.

        Required inputs: exportId (UUID) as a path parameter; there is no request body.

        Emits an ACCOUNTING_REPORT_EXPORT_DOWNLOAD audit event; no state changes.

        Returns 404 when the job or its artifact is missing, and 409 when the job is not COMPLETED.

        '
      operationId: downloadReportExport
      parameters:
      - description: Export job UUID
        in: path
        name: exportId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: Rendered artifact returned (content type matches the export format, e.g. text/csv or application/pdf)
        '401':
          content:
            application/json:
              schema:
                format: byte
                type: string
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                format: byte
                type: string
          description: Forbidden - missing reporting:view:financial-statements
        '404':
          content:
            application/json:
              schema:
                format: byte
                type: string
          description: Export job or artifact not found
        '409':
          content:
            application/json:
              schema:
                format: byte
                type: string
          description: Export job is not COMPLETED
      security:
      - bearerAuth:
        - accounting:report:export
      summary: Download Report Export Artifact
      tags:
      - Financial Reporting
      x-required-permissions:
      - reporting:view:financial-statements
