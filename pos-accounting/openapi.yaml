      x-required-permissions:
      - accounting:reconciliation:view
    post:
      description: 'Uploads a bank statement file (CSV) with its statement header for a reconcilable BANK_CASH account and stages it for review: every row is parsed under the column mapping and sign convention, bad rows are rejected one by one, and a preview shows opening + activity against closing. Nothing is committed until the import is committed.

        Use this tool to bring a downloaded bank statement into reconciliation; do not use it for a statement keyed by hand, use createBankStatement instead.

        Preconditions: the header must continue the account''s previous committed statement unless a gapAcknowledgement of at least 10 characters is given (required for the account''s first statement, refused on a contiguous one); the same file must not already be committed for the account.

        Required inputs: glAccountId, a UUIDv7 requestId, formatCode CSV, the file and statement {startDate, endDate, openingBalance, closingBalance}.

        Emits an ACCOUNTING_BANK_IMPORT_CREATE event; a replay of the same requestId and payload returns the original import with replayed=true.

        Returns 201 with status VALIDATED, or UPLOADED with mappingRequired when the columns need a mapping; 422 when the file is unreadable (STATEMENT_IMPORT_FAILED), the account is not reconcilable, the currency is not the account''s, the window overlaps a committed statement or the contiguity rule fails; 409 for a file already committed (naming the earlier importId and statementId), a window already committed or a reused requestId; 400 when the request is malformed or the acknowledgement is shorter than 10 characters.

        '
      operationId: createBankImport
      requestBody:
        content:
          application/json:
            examples:
              September CSV:
                description: September CSV
                value:
                  content: ZGF0ZSxkZXNjcmlwdGlvbixhbW91bnQKMjAyNi0wOS0wMixBQ0ggREVQT1NJVCw1MDAuMDA=
                  fileName: september.csv
                  formatCode: CSV
                  glAccountId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  requestId: 019a0000-0000-7000-8000-000000000020
                  statement:
                    closingBalance: 12830.67
                    endDate: '2026-09-30'
                    openingBalance: 12345.67
                    startDate: '2026-09-01'
            schema:
              $ref: '#/components/schemas/BankImportCreateRequest'
        description: The file as base64 content with its statement header and parse options. The same request is also accepted as multipart/form-data with the bytes in a part named file and this body, without content, in a JSON part named meta.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankImportResponse'
          description: Import staged (or replayed)
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: VALIDATION_ERROR or JUSTIFICATION_REQUIRED
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks accounting:reconciliation:adjust
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: IMPORT_FILE_ALREADY_COMMITTED, STATEMENT_ALREADY_IMPORTED or IDEMPOTENCY_CONFLICT
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: STATEMENT_IMPORT_FAILED, ACCOUNT_NOT_RECONCILABLE, CURRENCY_NOT_SUPPORTED, STATEMENT_PERIOD_OVERLAP, STATEMENT_NOT_CONTIGUOUS, STATEMENT_GAP_ACKNOWLEDGEMENT_NOT_APPLICABLE or AMOUNT_PRECISION_EXCEEDS_CURRENCY
      security:
      - bearerAuth:
        - accounting:reconciliation:adjust
      summary: Upload Bank Statement File
      tags:
      - Bank Imports
      x-required-permissions:
      - accounting:reconciliation:adjust
  /v1/accounting/bank-imports/{importId}:
    get:
      description: 'Returns one statement-file import with its header, mapping, counts, status, outcome ids and the preview: the first five rows with their resulting sign and running balance, and opening + activity against closing for each statement it will create.

        Use this tool to check an import before committing it; do not use it for the rows themselves, use listBankImportRows instead.

        Preconditions: the import must belong to the caller''s tenant.

        Required inputs: importId (UUID) in the path.

        No events are emitted beyond the ACCOUNTING_BANK_IMPORT_GET audit event.

        Returns 404 when the import does not exist in the tenant, and 403 without accounting:reconciliation:view.

