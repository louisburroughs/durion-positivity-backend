          type: number
        days31To60:
          description: Total outstanding 31-60 days past due
          example: 4200.0
          type: number
        days61To90:
          description: Total outstanding 61-90 days past due
          example: 1800.0
          type: number
        days90Plus:
          description: Total outstanding more than 90 days past due
          example: 900.0
          type: number
        totalOutstanding:
          description: Grand total outstanding across all buckets
          example: 19400.0
          type: number
      required:
      - current
      - days31To60
      - days61To90
      - days90Plus
      - totalOutstanding
      type: object
    AllocationLineRequest:
      description: Allocation line for a specific vendor bill
