    TaxLiabilitySnapshotVerification:
      description: Re-derivation check of a frozen Sales-Tax Liability snapshot against live data
      properties:
        consistent:
          description: True when the re-derived report hashes identically to the frozen snapshot
          type: boolean
        frozenTotalNetTax:
          description: Total net tax as frozen
          type: number
        netTaxDelta:
          description: recomputedTotalNetTax - frozenTotalNetTax; zero when amounts agree even if row detail moved
          type: number
        periodCode:
          description: Accounting period code (YYYY-MM)
          example: 2026-06
          type: string
        recomputedContentHash:
          description: Canonical hash of the report re-derived from live data
          type: string
        recomputedTotalNetTax:
          description: Total net tax re-derived from live data
          type: number
        snapshotContentHash:
          description: Canonical hash stored at freeze time
          type: string
        snapshotId:
          description: Snapshot id verified
          format: uuid
          type: string
        verifiedAt:
          description: Verification timestamp
          format: date-time
          type: string
      required:
      - consistent
      - frozenTotalNetTax
      - netTaxDelta
      - periodCode
      - recomputedContentHash
      - recomputedTotalNetTax
      - snapshotContentHash
      - snapshotId
      - verifiedAt
      type: object
    TenantTemplateAttentionItem:
      description: One template entry that waits for the tenant to resolve a clash
      properties:
        entryKey:
          description: 'The entry''s natural key: its kind and what identifies it within the kind'
          example: ACCOUNT:6295
          type: string
        kind:
          description: The kind of entry
          enum:
          - ACCOUNT
          - CATEGORY
          - MAPPING_KEY
          - GL_MAPPING
          - DEFAULT_GL_MAPPING
          - STATEMENT_LINE
          example: ACCOUNT
          type: string
        reason:
          description: 'ACCOUNT_DIFFERS: the tenant''s account under this code has another name or type. ACCOUNT_INACTIVE: it matches but is not active. ACCOUNT_MISSING: the entry refers to an account code the tenant does not hold. DEPENDS_ON_CONFLICT: the entry refers to an account that is in conflict'
          enum:
          - ACCOUNT_DIFFERS
          - ACCOUNT_INACTIVE
          - ACCOUNT_MISSING
          - DEPENDS_ON_CONFLICT
          example: ACCOUNT_DIFFERS
          type: string
        templateValue:
          description: What the template holds, in business words
          example: 6295 Staff Meals & Refreshments, expense
          type: string
        tenantValue:
          description: What the tenant holds in its place, in business words; absent when the tenant holds nothing
          example: 6295 Tire disposal, expense
          type:
          - string
          - 'null'
      required:
      - entryKey
      - kind
      - reason
      - templateValue
      type: object
    TenantTemplateCounts:
      description: How many template entries ended in each outcome for this tenant
      properties:
        adopted:
          description: Rows the tenant already held, left exactly as they were
          example: 0
          format: int32
          type: integer
        conflict:
          description: Accounts the tenant holds under a template code that are not the template's account
          example: 0
          format: int32
          type: integer
        created:
          description: Rows the template created
          example: 184
          format: int32
          type: integer
        refreshed:
          description: Untouched statement lines that took the template's new line code, description and display order
          example: 0
          format: int32
          type: integer
        withheld:
          description: Entries not created because an account they refer to is in conflict or missing
          example: 0
          format: int32
          type: integer
      required:
      - adopted
      - conflict
      - created
      - refreshed
      - withheld
      type: object
    TenantTemplateStatusResponse:
      description: Where the caller's tenant stands against the accounting template every tenant receives
      properties:
        attention:
          description: The entries that wait for someone to resolve a clash, in business words; empty unless state is NEEDS_ATTENTION
          items:
            $ref: '#/components/schemas/TenantTemplateAttentionItem'
          type: array
        counts:
          $ref: '#/components/schemas/TenantTemplateCounts'
        lastAppliedAt:
          description: When the template was last applied to this tenant; absent when never
          example: '2026-10-05T14:03:22Z'
          format: date-time
          type:
          - string
          - 'null'
        retreadPlantAddOn:
          description: True when this tenant has chosen the retread-plant add-on
          example: false
          type: boolean
        state:
          description: 'NOT_PROVISIONED: the template has never been applied. UP_TO_DATE: everything is created or adopted. PENDING: the template is newer than the last apply and the next service start brings it in. NEEDS_ATTENTION: at least one entry is in conflict or withheld; see attention'
          enum:
          - NOT_PROVISIONED
          - UP_TO_DATE
          - PENDING
          - NEEDS_ATTENTION
          example: UP_TO_DATE
          type: string
      required:
      - attention
      - counts
      - retreadPlantAddOn
      - state
      type: object
    TraceabilityIdDescriptor:
      description: An identifier usable to trace an accounting event across the ingestion pipeline
      properties:
        description:
          description: What the identifier is and how it is used
          type: string
        location:
          description: 'Where the identifier is carried: a request/response header name, or a field on the ingestion response'
          example: AccountingEventResponse.eventId
          type: string
        name:
          description: Name of the identifier
          example: eventId
          type: string
      required:
      - description
      - location
      - name
      type: object
    TrialBalanceReport:
      description: Trial Balance report with per-account debit/credit/balance rows from POSTED journal lines, grand totals proving sum(debit) == sum(credit), and an entry-number gap-check footnote
      properties:
        asOfDate:
          description: Date the trial balance is reported as of (inclusive)
          example: '2026-06-30'
          format: date
          type: string
        balanced:
          description: Whether sum of debits equals sum of credits; false surfaces a balance-constraint violation
          example: true
          type: boolean
        entryNumberGaps:
          description: 'Entry-number gap-check footnote: per-month sequence scopes with missing entry numbers; empty on a clean ledger'
          items:
            $ref: '#/components/schemas/EntryNumberGapCheck'
          type: array
        generatedAt:
          description: Timestamp when the report was generated (ISO 8601)
          example: '2026-06-30T08:00:00Z'
          format: date-time
          type: string
        rows:
          description: Per-account trial balance rows ordered by account number; empty when no POSTED data exists
          items:
            $ref: '#/components/schemas/TrialBalanceRow'
          type: array
        totalCredit:
          description: Grand total of all POSTED credit amounts across rows
          example: 1250000.0
          type: number
        totalDebit:
          description: Grand total of all POSTED debit amounts across rows
          example: 1250000.0
          type: number
      required:
      - asOfDate
      - balanced
      - entryNumberGaps
      - generatedAt
      - rows
      - totalCredit
      - totalDebit
      type: object
    TrialBalanceRow:
      description: Per-account trial balance row aggregated from POSTED journal lines
      properties:
        accountId:
          description: GL account ID (UUID)
          example: 123e4567-e89b-12d3-a456-426614174000
          type: string
        accountName:
          description: GL account display name
          example: Cash - Operating
          type: string
        accountNumber:
          description: GL account number (chart-of-accounts code)
          example: '1000'
          type: string
        balance:
          description: Net account balance (totalDebit - totalCredit, signed)
          example: 80000.0
          type: number
        totalCredit:
          description: Sum of POSTED credit amounts for the account up to the as-of date
          example: 45000.0
          type: number
        totalDebit:
          description: Sum of POSTED debit amounts for the account up to the as-of date
          example: 125000.0
          type: number
      required:
      - accountId
      - accountName
      - accountNumber
      - balance
      - totalCredit
      - totalDebit
      type: object
    UnappliedPaymentRow:
      description: A customer payment with an unapplied amount, and the invoices it most likely pays
      properties:
        currency:
          description: Payment currency (ISO 4217)
          example: USD
          type: string
        customerDisplayName:
          description: Customer name from accounting's customer replica; null when unknown
          example: Rivera Trucking
