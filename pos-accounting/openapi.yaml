      properties:
        amount:
          description: Signed adjustment amount; positive increases the reconciled cash account
          example: -12.5
          type: number
        description:
          description: Optional description recorded on the adjustment
          example: Monthly account service charge
          maxLength: 500
          minLength: 0
          type: string
        type:
          description: Adjustment type (decision D-6)
          enum:
          - BANK_FEE
          - NSF_FEE
          - INTEREST_EARNED
          - OTHER
          example: BANK_FEE
          type: string
      required:
      - amount
      - type
