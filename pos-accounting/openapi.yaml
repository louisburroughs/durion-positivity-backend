    ProcessingStatusDescriptor:
      description: One accounting event processing status and its meaning
      properties:
        meaning:
          description: Human-readable meaning of the status
          example: Event has been successfully processed; a journal entry was created.
          type: string
        status:
          description: The status constant
          enum:
          - RECEIVED
          - PROCESSING
          - PROCESSED
          - FAILED
          - SUSPENDED
          - SKIPPED
          example: PROCESSED
          type: string
      required:
      - meaning
      - status
      type: object
    ProcessingStatusesContract:
      description: Every accounting event processing status, and the lifecycles that produce them
      properties:
        kafkaFactLifecycle:
          description: 'Status sequence for a Kafka-consumed posting fact: exactly one row is written per consumed fact, never RECEIVED, PROCESSING or FAILED. It is terminal (PROCESSED or SKIPPED), except a fact held for its currency, which is SUSPENDED with failureReasonCode CURRENCY_NOT_SUPPORTED: never auto-retried, released only through the audited reprocess endpoint'
          example:
          - PROCESSED|SKIPPED|SUSPENDED
          items:
            type: string
          type: array
        restSubmissionLifecycle:
          description: Status sequence for an event submitted via POST /v1/accounting/events
          example:
          - RECEIVED
          - PROCESSING
          - PROCESSED|FAILED|SUSPENDED
          items:
            type: string
          type: array
        statuses:
          description: Every AccountingEventStatus constant with its meaning, derived from the enum so it cannot drift from the code
          items:
            $ref: '#/components/schemas/ProcessingStatusDescriptor'
          type: array
      required:
      - kafkaFactLifecycle
      - restSubmissionLifecycle
      - statuses
      type: object
