    ReportExportRequest:
      description: Request payload for exporting a financial report
      properties:
        accountId:
          description: Optional GL account UUID filter, honored by GENERAL_LEDGER exports only; null spans all accounts
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
          type: string
        endDate:
          description: Period end date (inclusive, YYYY-MM-DD). For the as-of reports (BALANCE_SHEET, TRIAL_BALANCE, AGED_RECEIVABLES, AGED_PAYABLES) this date is used as the as-of date.
          example: 2026-03-31
          format: date
          type: string
        filename:
          description: Optional output filename without extension
          example: journal-lines-q1-2026
          maxLength: 150
          minLength: 0
          type: string
        format:
          description: Export format
          enum:
          - PDF
          - CSV
          - XLSX
          - JSON
          example: CSV
          type: string
        organizationId:
          description: Organization UUID to scope the export
          example: d10217f9-3ec6-46b9-9c87-e7066c100c24
          format: uuid
          type: string
        reportType:
          description: 'Report type key. Renderable types: TAX_LIABILITY, INCOME_STATEMENT, BALANCE_SHEET, TRIAL_BALANCE, GENERAL_LEDGER, AGED_RECEIVABLES, AGED_PAYABLES.'
          example: INCOME_STATEMENT
          maxLength: 100
          minLength: 0
          type: string
        startDate:
          description: Period start date (inclusive, YYYY-MM-DD)
          example: 2026-01-01
          format: date
          type: string
      required:
      - endDate
      - format
      - organizationId
      - reportType
      - startDate
      type: object
    ReportExportResponse:
      description: Async report export job state
      properties:
        completedAt:
          description: ISO-8601 timestamp when export completed (null if not finished)
          example: 2026-04-25 10:00:05+00:00
          format: date-time
          type: string
        downloadUrl:
          description: Download URL (only present when status is COMPLETED)
          example: https://storage.example.com/exports/export-abc.csv
          type: string
        exportId:
          description: Unique export job identifier
          example: 01936e5c-7890-7a3d-8b6e-2b3456789012
          format: uuid
          type: string
        failureReason:
          description: Failure reason (only present when status is FAILED)
          example: Rendering is not supported for reportType 'INCOME_STATEMENT'
          type: string
        format:
          description: Export format
          enum:
          - PDF
          - CSV
          - XLSX
          - JSON
          example: CSV
          type: string
        reportType:
          description: Report type that was exported
          example: JOURNAL_LINES
          type: string
        requestedAt:
          description: ISO-8601 timestamp when the export was requested
          example: 2026-04-25 10:00:00+00:00
          format: date-time
          type: string
        status:
          description: Current export status
          enum:
          - PENDING
          - IN_PROGRESS
          - COMPLETED
          - FAILED
          example: PENDING
          type: string
      required:
      - exportId
      - status
