      operationId: getPostingCategory
      parameters:
      - description: Posting category identifier
        in: path
        name: postingCategoryId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingCategoryResponse'
          description: Posting category returned
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Posting category not found
      security:
      - bearerAuth:
        - accounting:posting-category:view
      summary: Get Posting Category
      tags:
      - Posting Categories
      x-required-permissions:
      - accounting:posting-category:view
    put:
      description: 'Renames a posting category or changes its description; mapping keys under it are unaffected.

        Use this tool to correct a category''s name or description; do not use deactivatePostingCategory, which retires the category from future mapping use.

        Preconditions: the posting category must exist, and a changed name must not collide with another category.

        Required inputs: postingCategoryId (UUID) as a path parameter, categoryName (max 100 chars) and modifiedBy (max 50 chars); description is optional.

        Emits an ACCOUNTING_POSTING_CATEGORY_UPDATE event.

        Returns 404 when the category does not exist, and 400 when the new name already exists.

        '
      operationId: updatePostingCategory
      parameters:
      - description: Posting category identifier
        in: path
        name: postingCategoryId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Rename category:
                description: Rename category
                value:
                  categoryName: PAYMENT_TENDERS
                  description: Payment tender classifications
                  modifiedBy: jdoe
            schema:
              $ref: '#/components/schemas/PostingCategoryUpdateRequest'
        description: Replacement name and description for the posting category.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingCategoryResponse'
          description: Posting category updated
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request or duplicate name
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Posting category not found
      security:
      - bearerAuth:
        - accounting:posting-category:edit
      summary: Update Posting Category
      tags:
      - Posting Categories
      x-required-permissions:
      - accounting:posting-category:edit
  /v1/accounting/posting-categories/{postingCategoryId}/deactivate:
    post:
      description: 'Deactivates a posting category so it can no longer be used for new GL mappings; the record and its keys are retained.

        Use this tool to retire an unused category; do not use deactivateMappingKey, which retires a single key inside a category.

        Preconditions: the posting category must exist and have no active GL mappings attached.

        Required inputs: postingCategoryId (UUID) as a path parameter; there is no request body.

