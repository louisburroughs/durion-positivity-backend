          description: Column label → cell text as read from the file; never rewritten
          type: object
        reference:
          description: Bank reference
          example: REF-1
          type: string
        rejectionCode:
          description: 'Why the row is REJECTED: DATE_UNPARSEABLE, AMOUNT_UNPARSEABLE, AMOUNT_ZERO, AMOUNT_AND_DEBIT_CREDIT_BOTH, REQUIRED_COLUMN_MISSING, DATE_OUTSIDE_STATEMENT or AMOUNT_PRECISION_EXCEEDS_CURRENCY'
          example: DATE_UNPARSEABLE
          type: string
        rejectionDetail:
          description: The line and value that failed
          example: 'Line 13: unparseable date ''2026-13-45'''
          type: string
        rowId:
          description: Row id
          format: uuid
          type: string
        rowNumber:
          description: 1-based position among the file's data rows; the transaction's sourceRowNumber
          example: 12
          format: int32
          type: integer
        rowStatus:
          description: Row status
          enum:
          - PARSED
          - REJECTED
          - CORRECTED
          - SKIPPED
          - POSSIBLE_DUPLICATE
          - OUT_OF_WINDOW
          - COMMITTED
          type: string
        signedAmount:
          description: Parsed (or corrected) amount, positive = cash in
          example: -15.0
          type: number
        skipReason:
          description: Why the row was skipped
          type: string
        sourceTransactionId:
          description: The bank's transaction id, when the file carries one
          example: TX-88121
          type: string
