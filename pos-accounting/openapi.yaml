          type: array
        reconciliationId:
          description: Reconciliation id
          format: uuid
          type: string
      type: object
    ReconciliationMatchRequest:
      description: Request to match statement lines to GL journal-entry lines
      properties:
        glLineIds:
          description: Posted GL journal-entry line ids to match against
          items:
            format: uuid
            type: string
          minItems: 1
          type: array
        statementLineIds:
          description: Statement line ids to match
          items:
            format: uuid
            type: string
          minItems: 1
          type: array
      required:
      - glLineIds
      - statementLineIds
      type: object
    ReconciliationReportResponse:
      description: Bank reconciliation report
      properties:
        accountCode:
          description: Reconciled account code
          example: '1000'
          type: string
        accountName:
          description: Reconciled account name
          example: Cash
          type: string
        adjustments:
          description: Recorded adjustments
          items:
            $ref: '#/components/schemas/BankReconciliationAdjustmentResponse'
          type: array
        currency:
          description: Reconciliation currency
          example: USD
          type: string
        difference:
          description: statementEndingBalance − (glEndingBalance + totalAdjustments); matched lines are already reflected in glEndingBalance
          example: 0.0
          type: number
        glEndingBalance:
          description: GL ending balance snapshotted at import (opening basis)
          example: 12000.0
          type: number
        matchedLineCount:
          description: Number of MATCHED statement lines
          example: 5
          format: int32
          type: integer
        outstandingLineCount:
          description: Number of UNMATCHED statement lines
          example: 0
          format: int32
          type: integer
        outstandingLines:
          description: Outstanding (UNMATCHED) statement lines
          items:
            $ref: '#/components/schemas/BankReconciliationLineResponse'
          type: array
        reconciliationId:
          description: Reconciliation id
          format: uuid
          type: string
        statementDate:
          description: Statement date
          example: 2026-06-30
          format: date
          type: string
        statementEndingBalance:
          description: Statement ending balance (closing basis)
          example: 12500.0
          type: number
        totalAdjustments:
          description: Sum of signed adjustment amounts
          example: 0.0
          type: number
        totalMatched:
          description: Sum of signed amounts over MATCHED statement lines
          example: 500.0
          type: number
        totalOutstanding:
          description: Sum of signed amounts over UNMATCHED statement lines
          example: 0.0
          type: number
