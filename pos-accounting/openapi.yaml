      description: 'One payment-lag cohort: invoice count and total invoice amount for invoices whose full-payment lag (or non-payment) falls in this band'
      properties:
        amount:
          description: Sum of invoice totals in this cohort — the invoice's full amount, not its remaining open balance
          example: 84250.0
          type: number
        cohort:
          description: 'Cohort label. <=30 / 31-60 / 61-90: whole days from the invoice''s issue-date anchor to the PaymentApplication at which invoiceBalanceAfter first reached zero (boundaries inclusive at the upper edge, e.g. 31-60 includes exactly 60). unpaid: no application ever brought the balance to zero in the observed data, the lag exceeded 90 days, or the invoice is only partially applied.'
          example: <=30
          type: string
        invoiceCount:
          description: Count of invoices in this cohort
          example: 42
          format: int32
          type: integer
      required:
      - amount
      - cohort
      - invoiceCount
      type: object
    PaymentLagCohortsReport:
      description: Payment-lag cohorts for invoices issued (finalized) in a date window
      properties:
        cohorts:
          description: Cohort rows in fixed order (<=30, 31-60, 61-90, unpaid), truncated to the requested limit
          items:
            $ref: '#/components/schemas/PaymentLagCohortRow'
          type: array
        generatedAt:
          description: Timestamp when the report was generated (ISO 8601)
          example: '2026-06-30T08:00:00Z'
          format: date-time
          type: string
        issuedFrom:
          description: Window start date (inclusive), anchored on invoice finalizedAt
          example: '2026-01-01'
          format: date
          type: string
        issuedTo:
          description: Window end date (inclusive)
          example: '2026-06-30'
          format: date
          type: string
        truncated:
          description: True when `limit` is below the fixed cohort count (4) and dropped cohorts that would otherwise appear, false otherwise
          type: boolean
      required:
      - cohorts
      - generatedAt
      - issuedFrom
      - issuedTo
      - truncated
      type: object
    PaymentMatchSuggestion:
      description: The invoices a payment most likely pays, the reasons, and what would be left over
      properties:
        invoices:
          description: Suggested invoices in allocation order (oldest first); empty when none is suggested
          items:
            $ref: '#/components/schemas/SuggestedInvoice'
          type: array
        leftOver:
          description: 'Unapplied amount minus the suggested total: what would become a customer credit (AD-003)'
          example: 0.0
          type: number
        reasons:
          description: 'Why these invoices are suggested. Served values: REMITTANCE_REFERENCE (the payment was taken against this invoice), SAME_CUSTOMER (the invoices belong to the payment''s customer), EXACT_TOTAL (the suggested balances add up exactly to the unapplied amount). A client renders an unknown value as Unknown. Empty when the customer has no open invoice.'
          items:
            example: SAME_CUSTOMER
            type: string
          type: array
        suggestedTotal:
          description: Sum of the suggested amounts; never more than the unapplied amount
          example: 4615.0
          type: number
      required:
      - invoices
      - leftOver
      - reasons
      - suggestedTotal
      type: object
