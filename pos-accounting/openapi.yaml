  /v1/accounting/journal-entries/{journalEntryId}/reverse:
    post:
      tags:
      - Journal Entries
      summary: Reverse journal entry
      description: 'Reverses a POSTED journal entry by creating and immediately posting an inverse entry (debits and credits swapped) with its own entryNumber, and transitioning the original POSTED → REVERSED. Use this tool to back out an incorrect posted entry; do NOT use it on DRAFT entries — delete or edit those instead. Preconditions: the entry must exist and be in POSTED status. Required input: a non-blank reason, recorded on the reversal entry and in the audit trail. Optional input: reversalDate — when omitted, it defaults to the original entry''s transaction date if that period is OPEN, otherwise to today; the resolved date must fall in an OPEN accounting period. Period gate (story B2): a resolved date strictly before the org-level hard-lock date is rejected unconditionally with 422 PERIOD_HARD_LOCKED (never overridable); a date in a CLOSED period is rejected with 422 PERIOD_CLOSED unless the caller holds accounting:period:override AND supplies a non-blank overrideJustification, in which case the reversal posts into the closed period and the override is audit-logged. Emits ACCOUNTING_JOURNAL_ENTRY_REVERSE and returns the reversal entry. Returns 409 JE_ALREADY_REVERSED if the entry was already reversed (including a lost concurrent-reversal race), 409 JE_NOT_POSTED if it is DRAFT/PENDING, and 422 PERIOD_CLOSED if the reversal date falls in a CLOSED period without a valid override — pick an open-period date, supply an override, or reopen the period before retrying.'
      operationId: reverseJournalEntry
      parameters:
      - name: journalEntryId
        in: path
        description: Journal entry identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalEntryReversalRequest'
        required: true
      responses:
        '200':
          description: Journal entry reversed; the posted reversal entry is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryResponse'
        '400':
          description: Reason is missing or blank (ARGUMENT_NOT_VALID), or no journal entry exists for the identifier (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Caller lacks the accounting:je:reverse permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Entry is already reversed (JE_ALREADY_REVERSED) or not yet posted (JE_NOT_POSTED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Resolved reversal date falls in a CLOSED accounting period without a valid override (PERIOD_CLOSED — accounting:period:override plus a non-blank overrideJustification allows reversing into closed periods), or is strictly before the hard-lock date (PERIOD_HARD_LOCKED — never overridable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - accounting:je:reverse
      x-required-permissions:
      - accounting:je:reverse
  /v1/accounting/journal-entries/{journalEntryId}/post:
    post:
      tags:
      - Journal Entries
      summary: Post journal entry
      description: 'Posts a DRAFT journal entry to the general ledger (DRAFT → POSTED), assigning its entryNumber and updating GL balances; the entry is immutable afterwards — use reverseJournalEntry to back it out. Preconditions: the entry must exist, be in DRAFT status, and be balanced. The request body is OPTIONAL: omit it entirely for a normal post. The entry''s transaction date is checked against the accounting-period gate (story B2): a date strictly before the org-level hard-lock date is rejected unconditionally with 422 PERIOD_HARD_LOCKED (never overridable); a date in a CLOSED period is rejected with 422 PERIOD_CLOSED unless the caller holds accounting:period:override AND supplies a non-blank overrideJustification in the body, in which case the posting proceeds and the override is audit-logged. Emits ACCOUNTING_JOURNAL_ENTRY_POST and returns the posted entry. Returns 409 ENTRY_ALREADY_POSTED if the entry is already POSTED or REVERSED, and 422 UNBALANCED_ENTRY if debits do not equal credits.'
      operationId: postJournalEntry
      parameters:
      - name: journalEntryId
        in: path
        description: Journal entry identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalEntryPostRequest'
      responses:
        '200':
          description: Journal entry posted; the posted entry with its entryNumber is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryResponse'
        '400':
          description: No journal entry exists for the identifier (VALIDATION_ERROR), or the overrideJustification exceeds 500 characters (ARGUMENT_NOT_VALID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Caller lacks the accounting:je:post permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Entry is already posted or reversed (ENTRY_ALREADY_POSTED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Transaction date is in a CLOSED period without a valid override (PERIOD_CLOSED — accounting:period:override plus a non-blank overrideJustification allows posting into closed periods), is strictly before the hard-lock date (PERIOD_HARD_LOCKED — never overridable), or the entry is unbalanced (UNBALANCED_ENTRY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - accounting:je:post
      x-required-permissions:
      - accounting:je:post
