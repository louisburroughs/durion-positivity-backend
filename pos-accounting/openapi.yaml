          - DISTINCT
          - DUPLICATE
          type: string
        duplicateOfBankTransactionId:
          description: A stored bank transaction this row's fingerprint collides with
          format: uuid
          type: string
        duplicateOfRowNumber:
          description: Another row of the file this row's fingerprint collides with
          example: 11
          format: int32
          type: integer
