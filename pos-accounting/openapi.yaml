          type: string
        supersededBy:
          description: User whose re-freeze superseded this snapshot; null while ACTIVE
          type: string
        supersedesSnapshotId:
          description: Id of the ACTIVE snapshot this one superseded at freeze time; null for a first freeze
          format: uuid
          type: string
        totalCreditsNetted:
          description: Grand total credits netted
          type: number
        totalExemptBase:
          description: Grand total exempt base
          type: number
        totalNetTax:
          description: Grand total net tax
          type: number
        totalTaxCollectedGross:
          description: Grand total gross tax collected
          type: number
        totalTaxableBase:
          description: Grand total taxable base
          type: number
      required:
