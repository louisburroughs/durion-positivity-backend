          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GLAccountResponse'
          description: GL account created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GLAccountResponse'
          description: Invalid request
