  /v1/accounting/bank-imports/{importId}/rows/{rowId}:
    put:
      description: 'Corrects one row of an import (its raw cells are kept), skips it with a reason, or answers a possible duplicate (DISTINCT keeps it, DUPLICATE skips it).

        Use this tool for rows the preview shows as REJECTED, OUT_OF_WINDOW or POSSIBLE_DUPLICATE; do not use it to remap every row, use setBankImportMapping instead.

        Preconditions: the import must be UPLOADED or VALIDATED; a skipped row cannot be corrected; a duplicate decision only applies to a POSSIBLE_DUPLICATE row.

        Required inputs: importId and rowId in the path and exactly one of correctedValues, skip=true with a reason of at least 10 characters, or duplicateDecision.

        Emits an ACCOUNTING_BANK_IMPORT_ROW_CORRECT event.

        Returns 409 when the import is COMMITTED or DISCARDED or the version is stale; 400 when the values are malformed or the reason is too short; 404 for an unknown import or row.

        '
      operationId: updateBankImportRow
      parameters:
      - description: Import id
        in: path
        name: importId
        required: true
        schema:
          format: uuid
          type: string
      - description: Row id
        in: path
        name: rowId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Correct a date:
                description: Correct a date
                value:
                  correctedValues:
                    date: '2026-09-14'
                  version: 3
            schema:
              $ref: '#/components/schemas/BankImportRowUpdateRequest'
        description: The row's corrected values, or a skip or duplicate decision with its reason.
