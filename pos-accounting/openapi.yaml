          description: Matching vendors returned
      security:
      - bearerAuth:
        - accounting:ap:view
      summary: Search Vendors By Name
      tags:
      - Vendor Directory API
      x-required-permissions:
      - accounting:ap:view
  /v1/accounting/vendors/{vendorId}:
    get:
      description: 'Returns one AP vendor by its identifier, typically to display a name for a deep-linked vendor id.

        Use this tool when the vendor id is already known; use searchVendors instead when resolving a name typed by a user.

        Preconditions: the vendor must exist in the AP vendor directory.

        Required inputs: vendorId (UUID) as a path parameter; there is no request body.

        Emits an ACCOUNTING_VENDOR_GET audit event; no state changes.

        Returns 404 when no vendor exists for the supplied id.

        '
      operationId: getVendorById
