    HardLockDateResponse:
      description: Org-level hard-lock date payload
      properties:
        hardLockDate:
          description: The org-level hard-lock date. Journal entries dated strictly before this date are permanently rejected (422 PERIOD_HARD_LOCKED) with no override path. Null when no hard lock has been configured yet.
          example: '2026-06-30'
          format: date
          type:
          - string
          - 'null'
      type: object
    HardLockDateUpdateRequest:
      description: Request payload for setting the org-level hard-lock date
      properties:
        hardLockDate:
          description: New hard-lock date. Must be on or after the currently stored hard-lock date (monotonic forward only — a backward move is rejected with 422 HARD_LOCK_DATE_REGRESSION). Once set, journal entries dated strictly before this date are permanently rejected with no override path.
          example: '2026-06-30'
          format: date
          type: string
        justification:
          description: Mandatory reason for moving the hard-lock date; recorded in the audit trail with the acting user
          example: FY2025 statutory filing complete; locking H1 2026
          maxLength: 500
          minLength: 0
          type: string
      required:
      - hardLockDate
      - justification
      type: object
    Header:
      description: Review header
      properties:
        accountCode:
          example: '1000'
          type: string
        accountName:
          example: Cash
          type: string
        accountingPeriodCode:
          example: 2026-09
          type: string
        approver:
          description: The approver (who finalized it); null until then
          type: string
        baselineDate:
          description: The account baseline that applies to this window
          format: date
          type: string
        baselineSetByThisStatement:
          description: Whether this window's statement set the baseline with its gap acknowledgement
          type: boolean
        currency:
          type: string
        gapAcknowledgement:
          description: The gap acknowledgement text of the statement that set the baseline
          type: string
        glAccountId:
          format: uuid
          type: string
        periodState:
          description: 'State of the period of the statement end date: OPEN, CLOSED or HARD_LOCKED'
          type: string
        preparer:
          description: The preparer (who created the reconciliation)
          type: string
        reconciliationId:
          format: uuid
          type: string
        sourceKind:
          description: Statement provenance
          enum:
          - FILE_IMPORT
          - MANUAL_ENTRY
          - BANK_FEED
          type: string
        statementEndDate:
          format: date
          type: string
        statementId:
          format: uuid
          type: string
        statementStartDate:
          format: date
          type: string
        status:
          enum:
          - IN_PROGRESS
          - SUBMITTED
          - FINALIZED
          - INVALIDATED
          - SUPERSEDED
          - CANCELLED
          type: string
        version:
          format: int64
          type: integer
      type: object
    IdempotencyOutcomeDescriptor:
      description: One Kafka fact-consumption idempotency outcome and its meaning
      properties:
        description:
          description: Human-readable meaning of the outcome
          example: Not matched to an earlier fact on its posting key; a new AccountingEvent row was written.
          type: string
        outcome:
          description: The outcome constant
          enum:
          - NEW
          - DUPLICATE_IGNORED
          example: NEW
          type: string
      required:
      - description
      - outcome
      type: object
    IdempotencyOutcomeEntry:
      description: One idempotency outcome, recorded on an accounting event whether it was consumed from Kafka or submitted through the API (e.g. INVOICE_PAYMENT)
      properties:
        code:
          description: Enum name, as accepted by the event list idempotency filter
          enum:
          - NEW
          - DUPLICATE_IGNORED
          example: DUPLICATE_IGNORED
          type: string
        description:
          description: Meaning of the outcome
          type: string
        displayName:
          description: Human-readable label
          example: Duplicate ignored
          type: string
      required:
      - code
      - description
      - displayName
      type: object
    IdempotencyOutcomesContract:
      description: The two idempotency mechanisms used by the accounting event ingestion pipeline
      properties:
        factConsumption:
          $ref: '#/components/schemas/FactConsumptionIdempotency'
        restSubmission:
          $ref: '#/components/schemas/RestSubmissionIdempotency'
      required:
      - factConsumption
      - restSubmission
      type: object
    IdentifierStrategy:
      description: How accounting assigns and accepts the identifiers carried on an event envelope
      properties:
        domainKeyIdFormat:
          description: 'Format of domainKeyId: the upstream domain''s own key, accepted as an opaque string and never required to be a UUID'
          example: OPAQUE_STRING
          type: string
        eventIdMintedBy:
          description: 'How eventId is assigned: minted server-side (AccountingEvent.eventId, @UUIDv7Id) unless the caller supplies eventId in the payload, which is then accepted verbatim'
          example: SERVER_UNLESS_SUPPLIED
          type: string
        idFormat:
          description: Primary-key format for every identifier accounting mints (AD-006 / ADR-0013)
          example: UUIDv7
          type: string
        notes:
          description: Additional notes on identifier handling
          items:
            type: string
          type: array
      required:
      - domainKeyIdFormat
      - eventIdMintedBy
      - idFormat
      type: object
    IncomeStatementReport:
      description: Income statement (Profit & Loss) report built from POSTED journal entries
      properties:
