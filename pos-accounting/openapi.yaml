    post:
      description: 'Creates a GL account in the chart of accounts with a unique account code, classification and activation date.

        Use this tool when adding a new account to the chart; do not use updateGLAccount, which edits the mutable fields of an account that already exists.

        Preconditions: no account may already exist with the same accountCode; a parentAccountId, when supplied, must reference an existing account.

        Required inputs: accountCode (pattern #### or ####-###), accountName, accountType (ASSET, LIABILITY, EQUITY, REVENUE or EXPENSE) and activationDate; accountSubtype, description and parentAccountId are optional, and reconcilable defaults to false.

        Emits an ACCOUNTING_GL_ACCOUNT_CREATE event; the account code and type are immutable after creation.

        Returns 409 when the account code already exists, and 400 when the parent account cannot be resolved.

