  /v1/accounting/journal-entries:
    get:
      description: 'Lists journal entries of every status as a paginated projection, optionally filtered by the exact posted-entry number.

        Use this tool when browsing or searching entries; do not use getJournalEntry, which retrieves one entry by its known id.

        Preconditions: none beyond the caller holding accounting:je:view.

        Required inputs: none; page defaults to 0, size to 20, sort to createdAt descending, and entryNumber (format JE-{YYYYMM}-{seq}, assigned only at posting) is an optional exact-match filter that never matches unposted entries.

        Emits an ACCOUNTING_JOURNAL_ENTRY_LIST audit event; no accounting state changes.

        Returns 400 when the sort property is not one of the supported fields.

        '
      operationId: listJournalEntries
      parameters:
      - description: Page index (0-based)
        in: query
        name: page
        required: false
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
      - description: Page size
        in: query
        name: size
        required: false
        schema:
          default: 20
          exclusiveMinimum: 0
          format: int32
          type: integer
      - description: 'Sort field with optional direction, e.g. ''modifiedAt,desc''. Supported fields: createdAt, modifiedAt, updatedAt, transactionDate, postedAt, status, entryType, description, createdBy, journalEntryId. Direction defaults to desc.'
        in: query
        name: sort
        required: true
        schema:
          default: createdAt
          minLength: 1
          type: string
      - description: Optional exact-match filter on the posted-entry number (format JE-{YYYYMM}-{seq}, sequential within the entry's transaction month, assigned at posting time). Entries not yet posted have no entry number and never match.
        example: JE-202607-1
        in: query
        name: entryNumber
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponseJournalEntryResponse'
          description: Journal entries listed
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponseJournalEntryResponse'
          description: Unsupported sort property or direction
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponseJournalEntryResponse'
          description: Forbidden
      security:
      - bearerAuth:
        - accounting:je:view
      summary: List Journal Entries
      tags:
      - Journal Entries
      x-required-permissions:
      - accounting:je:view
    post:
      description: 'Creates a balanced journal entry in DRAFT status; nothing hits the general ledger until the entry is posted.

        Use this tool to stage a manual entry for review; do not use postJournalEntry, which finalizes an existing draft, and note that system event-driven entries are created by the posting engine, not this operation.

        Preconditions: total debits must equal total credits across the lines, and every glAccountId must reference a GL account active on the transaction date.

        Required inputs: transactionDate and at least one line with glAccountId (UUID) and a debitAmount or creditAmount; description (max 500), sourceEventId, sourceEventType and dimensions are optional.

        Emits an ACCOUNTING_JOURNAL_ENTRY_CREATE event; GL balances are unchanged until posting.

        Returns 400 when the entry is unbalanced or a GL account is missing or inactive on the transaction date.

        '
      operationId: createJournalEntry
      requestBody:
        content:
          application/json:
            examples:
              Balanced two-line entry:
                description: Balanced two-line entry
                value:
                  description: Record cash sale
                  lines:
                  - debitAmount: 125.0
                    description: Cash
                    glAccountId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  - creditAmount: 125.0
                    description: Sales revenue
                    glAccountId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
                  transactionDate: 2026-08-13 00:00:00
            schema:
              $ref: '#/components/schemas/JournalEntryCreateRequest'
        description: Draft journal entry with balanced debit and credit lines.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryResponse'
          description: Journal entry created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryResponse'
          description: Invalid request
      security:
      - bearerAuth:
        - accounting:je:create
      summary: Create Journal Entry
      tags:
      - Journal Entries
      x-required-permissions:
      - accounting:je:create
  /v1/accounting/journal-entries/{journalEntryId}:
    get:
      description: 'Returns one journal entry with its lines, status (DRAFT, POSTED or REVERSED), entry type and posting metadata.

        Use this tool when the journal entry id is already known; use listJournalEntries instead when searching by entry number or browsing.

        Preconditions: the journal entry must exist.

        Required inputs: journalEntryId (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 400 with code VALIDATION_ERROR when no journal entry exists for the supplied id (this module maps entry not-found to 400, not 404).

        '
      operationId: getJournalEntry
      parameters:
      - description: Journal entry identifier
        in: path
        name: journalEntryId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryResponse'
          description: Journal entry returned
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryResponse'
          description: Journal entry not found
      security:
      - bearerAuth:
        - accounting:je:view
      summary: Get Journal Entry
      tags:
      - Journal Entries
      x-required-permissions:
      - accounting:je:view
    put:
      description: 'Replaces the description and lines of a journal entry that is still in DRAFT status; posted entries are immutable.

        Use this tool to correct a draft before posting; do not use it on a POSTED entry, which only reverseJournalEntry can back out.

        Preconditions: the entry must exist in DRAFT status, and the replacement lines must remain balanced.

        Required inputs: journalEntryId (UUID) as a path parameter plus the full replacement body (same shape as createJournalEntry); supplied lines replace the existing line set wholesale.

        Emits an ACCOUNTING_JOURNAL_ENTRY_UPDATE event; GL balances are unchanged because drafts are not yet in the ledger.

        Returns 409 when the entry is no longer DRAFT, and 400 when the updated entry is unbalanced or the entry id does not exist.

        '
      operationId: updateJournalEntry
      parameters:
      - description: Journal entry identifier
        in: path
        name: journalEntryId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Corrected draft:
                description: Corrected draft
                value:
                  description: Corrected cash sale amount
                  lines:
                  - debitAmount: 130.0
                    glAccountId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  - creditAmount: 130.0
                    glAccountId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
                  transactionDate: 2026-08-13 00:00:00
            schema:
              $ref: '#/components/schemas/JournalEntryCreateRequest'
        description: Replacement description and balanced line set for the draft entry.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryResponse'
          description: Journal entry updated
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryResponse'
          description: Journal entry not found
      security:
      - bearerAuth:
        - accounting:je:create
      summary: Update Journal Entry
      tags:
      - Journal Entries
      x-required-permissions:
      - accounting:je:create
  /v1/accounting/journal-entries/{journalEntryId}/post:
    post:
      description: 'Posts a DRAFT journal entry to the general ledger (DRAFT to POSTED), assigning its entryNumber (JE-{YYYYMM}-{seq}) and updating GL balances; the entry is immutable afterwards.

        Use this tool to finalize a balanced draft; do not use reverseJournalEntry, which backs out an entry that is already POSTED.

        Preconditions: the entry must exist in DRAFT status, debits must equal credits, every line''s GL account must be active on the transaction date, and the transaction date must clear the accounting-period gate.

        Required inputs: journalEntryId (UUID) as a path parameter; the body is optional and carries only overrideJustification (max 500 chars), which together with the accounting:period:override permission allows posting into a CLOSED period with the override audit-logged; a date before the org hard-lock date is never overridable.

        Emits an ACCOUNTING_JOURNAL_ENTRY_POST event and returns the posted entry.

        Returns 409 ENTRY_ALREADY_POSTED when the entry is already POSTED or REVERSED, 422 UNBALANCED_ENTRY when debits do not equal credits, 422 PERIOD_CLOSED or PERIOD_HARD_LOCKED for period-gate failures, and 400 when no entry exists for the id.

        '
      operationId: postJournalEntry
      parameters:
      - description: Journal entry identifier
        in: path
        name: journalEntryId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Closed-period override:
                description: Closed-period override
                value:
                  overrideJustification: Late vendor accrual approved by controller
            schema:
              $ref: '#/components/schemas/JournalEntryPostRequest'
        description: Optional closed-period override justification; omit the body for a normal post.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryResponse'
          description: Journal entry posted; the posted entry with its entryNumber is returned
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No journal entry exists for the identifier (VALIDATION_ERROR), or the overrideJustification exceeds 500 characters (ARGUMENT_NOT_VALID)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:je:post permission
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Entry is already posted or reversed (ENTRY_ALREADY_POSTED)
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Transaction date is in a CLOSED period without a valid override (PERIOD_CLOSED — accounting:period:override plus a non-blank overrideJustification allows posting into closed periods), is strictly before the hard-lock date (PERIOD_HARD_LOCKED — never overridable), or the entry is unbalanced (UNBALANCED_ENTRY)
      security:
      - bearerAuth:
        - accounting:je:post
      summary: Post Journal Entry
      tags:
      - Journal Entries
      x-required-permissions:
      - accounting:je:post
  /v1/accounting/journal-entries/{journalEntryId}/reverse:
    post:
      description: 'Reverses a POSTED journal entry by creating and immediately posting an inverse entry (debits and credits swapped) with its own entryNumber, transitioning the original POSTED to REVERSED.

        Use this tool to back out an incorrect posted entry; do not use it on DRAFT entries, which updateJournalEntry can still edit, and do not use postJournalEntry, which finalizes drafts.

        Preconditions: the entry must exist in POSTED status, and the resolved reversal date must clear the accounting-period gate.

        Required inputs: a non-blank reason (recorded on the reversal entry and audit trail); reversalDate is optional and defaults to the original transaction date when that period is OPEN, otherwise today; overrideJustification with the accounting:period:override permission allows reversing into a CLOSED period, but never before the hard-lock date.

        Emits an ACCOUNTING_JOURNAL_ENTRY_REVERSE event and returns the posted reversal entry.

        Returns 409 JE_ALREADY_REVERSED when the entry was already reversed (including a lost concurrent-reversal race), 409 JE_NOT_POSTED when it is DRAFT or PENDING, 422 PERIOD_CLOSED or PERIOD_HARD_LOCKED for period-gate failures, and 400 when the reason is blank or the entry does not exist.

        '
      operationId: reverseJournalEntry
      parameters:
      - description: Journal entry identifier
        in: path
        name: journalEntryId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Reverse with explicit date:
                description: Reverse with explicit date
                value:
                  reason: Duplicate posting of invoice INV-1042
                  reversalDate: 2026-08-13
            schema:
              $ref: '#/components/schemas/JournalEntryReversalRequest'
        description: Reversal reason with optional reversal date and closed-period override justification.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryResponse'
          description: Journal entry reversed; the posted reversal entry is returned
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reason is missing or blank (ARGUMENT_NOT_VALID), or no journal entry exists for the identifier (VALIDATION_ERROR)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:je:reverse permission
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Entry is already reversed (JE_ALREADY_REVERSED) or not yet posted (JE_NOT_POSTED)
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Resolved reversal date falls in a CLOSED accounting period without a valid override (PERIOD_CLOSED — accounting:period:override plus a non-blank overrideJustification allows reversing into closed periods), or is strictly before the hard-lock date (PERIOD_HARD_LOCKED — never overridable)
      security:
      - bearerAuth:
        - accounting:je:reverse
      summary: Reverse Journal Entry
      tags:
      - Journal Entries
      x-required-permissions:
      - accounting:je:reverse
  /v1/accounting/journal-entries/{journalEntryId}/traceability:
    get:
      description: 'Returns the traceability chain for a journal entry: its source event, posting rule set and version, and any reversal relationships.

        Use this tool when auditing where an entry came from; use getJournalEntry instead for the entry''s lines and amounts.

        Preconditions: the journal entry must exist; system-generated entries carry source-event links while manual entries may not.

        Required inputs: journalEntryId (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 400 with code VALIDATION_ERROR when no journal entry exists for the supplied id.

        '
      operationId: getJournalEntryTraceability
      parameters:
      - description: Journal entry identifier
        in: path
        name: journalEntryId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryTraceabilityResponse'
          description: Journal traceability returned
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryTraceabilityResponse'
          description: Journal entry not found
      security:
      - bearerAuth:
        - accounting:je:view
      summary: Get Journal Entry Traceability
      tags:
      - Journal Entries
      x-required-permissions:
      - accounting:je:view
  /v1/accounting/mapping-keys:
    post:
      description: 'Creates a mapping key inside a posting category, extending the taxonomy that GL mappings attach to.

        Use this tool when adding a new key under an existing category; do not use createPostingCategory, which creates the parent category itself.

        Preconditions: the posting category must exist, and no key with the same trimmed name may already exist inside it.

        Required inputs: postingCategoryId (UUID), keyName (max 100 chars, trimmed before uniqueness check) and createdBy (max 50 chars); description is optional.

        Emits an ACCOUNTING_MAPPING_KEY_CREATE event.

        Returns 404 when the posting category does not exist, and 400 when the key name already exists in that category.

        '
      operationId: createMappingKey
      requestBody:
        content:
          application/json:
            examples:
              Tender type key:
                description: Tender type key
                value:
                  createdBy: jdoe
                  description: Cash tender postings
                  keyName: TENDER_CASH
                  postingCategoryId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
            schema:
              $ref: '#/components/schemas/MappingKeyCreateRequest'
        description: Mapping key to add under an existing posting category.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingKeyResponse'
          description: Mapping key created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingKeyResponse'
          description: Invalid request or duplicate name
      security:
      - bearerAuth:
        - accounting:mapping-key:create
      summary: Create Mapping Key
      tags:
      - Mapping Keys
      x-required-permissions:
      - accounting:mapping-key:create
  /v1/accounting/mapping-keys/{mappingKeyId}:
    get:
      description: 'Returns one mapping key with its posting category, name, description and active flag.

        Use this tool when the mapping key id is already known; use listMappingKeysByCategory instead when browsing the keys of a category.

        Preconditions: the mapping key and its parent posting category must exist.

        Required inputs: mappingKeyId (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 404 when no mapping key exists for the supplied id.

        '
      operationId: getMappingKey
      parameters:
      - description: Mapping key identifier
        in: path
        name: mappingKeyId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingKeyResponse'
          description: Mapping key returned
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingKeyResponse'
          description: Mapping key not found
      security:
      - bearerAuth:
        - accounting:mapping-key:view
      summary: Get Mapping Key
      tags:
      - Mapping Keys
      x-required-permissions:
      - accounting:mapping-key:view
    put:
      description: 'Renames a mapping key or changes its description; the key stays in its posting category.

        Use this tool to correct a key''s name or description; do not use deactivateMappingKey, which retires the key from future mapping use.

        Preconditions: the mapping key must exist, and a changed name must not collide with another key in the same category.

        Required inputs: mappingKeyId (UUID) as a path parameter, keyName (max 100 chars) and modifiedBy (max 50 chars); description is optional.

        Emits an ACCOUNTING_MAPPING_KEY_UPDATE event.

        Returns 404 when the mapping key does not exist, and 400 when the new name already exists in the category.

        '
      operationId: updateMappingKey
      parameters:
      - description: Mapping key identifier
        in: path
        name: mappingKeyId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Rename key:
                description: Rename key
                value:
                  description: Cash drawer tender postings
                  keyName: TENDER_CASH_DRAWER
                  modifiedBy: jdoe
            schema:
              $ref: '#/components/schemas/MappingKeyUpdateRequest'
        description: Replacement name and description for the mapping key.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingKeyResponse'
          description: Mapping key updated
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingKeyResponse'
          description: Invalid request or duplicate name
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingKeyResponse'
          description: Mapping key not found
      security:
      - bearerAuth:
        - accounting:mapping-key:edit
      summary: Update Mapping Key
      tags:
      - Mapping Keys
      x-required-permissions:
      - accounting:mapping-key:edit
  /v1/accounting/mapping-keys/{mappingKeyId}/deactivate:
    post:
      description: 'Deactivates a mapping key so it can no longer be attached to new GL mappings; the record is retained.

        Use this tool to retire an unused key; do not use deactivatePostingCategory, which retires the whole parent category.

        Preconditions: the mapping key must exist and have no active GL mappings attached.

        Required inputs: mappingKeyId (UUID) as a path parameter; there is no request body.

        Emits an ACCOUNTING_MAPPING_KEY_DEACTIVATE event.

        Returns 404 when the mapping key does not exist, 409 when active GL mappings still reference it, and 204 with no body on success.

        '
      operationId: deactivateMappingKey
      parameters:
      - description: Mapping key identifier
        in: path
        name: mappingKeyId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: Mapping key deactivated
        '404':
          description: Mapping key not found
        '409':
          description: Cannot deactivate - active mappings exist
      security:
      - bearerAuth:
        - accounting:mapping-key:deactivate
      summary: Deactivate Mapping Key
      tags:
      - Mapping Keys
      x-required-permissions:
      - accounting:mapping-key:deactivate
  /v1/accounting/mappings:
    post:
      description: 'Creates a date-effective mapping from a source-system external code to a GL account, used when posting events that carry external codes.

        Use this tool to register how an upstream system''s code lands in the ledger; do not use createDefaultMapping, which sets the fallback debit and credit pair for an event type without explicit rules.

        Preconditions: the target GL account must exist and be active, and the new effective date range must not overlap an existing mapping for the same sourceSystem and externalCode.

        Required inputs: sourceSystem, externalCode, glAccountId (UUID) and effectiveStartDate; effectiveEndDate defaults to null (open-ended) and dimensions are optional.

        Emits an ACCOUNTING_GL_MAPPING_CREATE event; a cash-receipt code mapped to an implausible account subtype logs a non-blocking warning.

        Returns 400 when the GL account is missing or inactive, or when the effective dates overlap an existing mapping.

        '
      operationId: createGLMapping
      requestBody:
        content:
          application/json:
            examples:
              POS cash code mapping:
                description: POS cash code mapping
                value:
                  effectiveStartDate: 2026-01-01 00:00:00
                  externalCode: CASH_RECEIPT
                  glAccountId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  sourceSystem: POS
            schema:
              $ref: '#/components/schemas/GLMappingCreateRequest'
        description: Date-effective external-code-to-GL-account mapping to create.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GLMappingCreateResponse'
          description: GL mapping created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GLMappingCreateResponse'
          description: Invalid request payload
      security:
      - bearerAuth:
        - accounting:gl-mapping:create
      summary: Create GL Mapping
      tags:
      - GL Mapping API
      x-required-permissions:
      - accounting:gl-mapping:create
  /v1/accounting/mappings/resolve:
    post:
      description: 'Resolves a source-system external code to the GL account whose mapping is effective on the supplied transaction date.

        Use this tool to look up where a coded transaction will post; do not use resolveTestMapping, which dry-runs full posting-rule evaluation for an event payload rather than a single code lookup.

        Preconditions: a mapping must exist for the sourceSystem and externalCode whose effective date range covers the transaction date.

        Required inputs: sourceSystem, externalCode and transactionDate (ISO date-time); there are no optional fields.

        Emits an ACCOUNTING_GL_MAPPING_RESOLVE audit event; no mappings or entries are created.

        Returns 400 when no mapping is effective for the code on that date.

        '
      operationId: resolveGLMapping
      requestBody:
        content:
          application/json:
            examples:
              Resolve POS cash code:
                description: Resolve POS cash code
                value:
                  externalCode: CASH_RECEIPT
                  sourceSystem: POS
                  transactionDate: 2026-08-13 00:00:00
            schema:
              $ref: '#/components/schemas/GLMappingResolveRequest'
        description: External code and transaction date to resolve against effective mappings.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GLMappingResolveResponse'
          description: GL mapping resolved
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GLMappingResolveResponse'
          description: Invalid request payload
      security:
      - bearerAuth:
        - accounting:gl-mapping:resolve
      summary: Resolve GL Mapping
      tags:
      - GL Mapping API
      x-required-permissions:
      - accounting:gl-mapping:resolve
  /v1/accounting/mappings/resolve-test:
    post:
      description: 'Resolves a hypothetical accounting event against the published posting rules and GL mappings, returning the matched rule (id, name, version), the exact journal entry lines the evaluator would post including proportional split-line shares and residual distribution, and per-predicate evaluation outcomes.

        Use this tool to inspect what a rule set would do before real events arrive; do not use resolveGLMapping, which only resolves a single external code to one account.

        Preconditions: a PUBLISHED posting rule set should exist, though a no-match outcome is a normal 200 response with matched=false rather than an error.

        Required inputs: eventType and transactionDate (ISO date); samplePayload is an optional JSON object evaluated by the rule predicates.

        Emits an ACCOUNTING_MAPPING_RESOLVE_TEST audit event only; nothing is persisted, and no accounting event, journal entry or outbox record is created.

        Returns 400 when the sample payload cannot be interpreted by the rules.

        '
      operationId: resolveTestMapping
      requestBody:
        content:
          application/json:
            examples:
              Invoice finalized dry run:
                description: Invoice finalized dry run
                value:
                  eventType: INVOICE_FINALIZED
                  samplePayload:
                    taxAmount: 10.5
                    totalAmount: 150.0
                  transactionDate: 2026-08-13
            schema:
              $ref: '#/components/schemas/MappingResolutionTestRequest'
        description: Hypothetical event type, sample payload and date to evaluate against published rules.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingResolutionTestResponse'
          description: Dry-run resolution completed (matched=false when no published rule matched)
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request payload, or the sample payload could not be interpreted by the rules
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Missing or invalid authentication
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:posting_rules:view permission
      security:
      - bearerAuth:
        - accounting:posting_rules:view
      summary: Dry-Run Mapping Rule Resolution
      tags:
      - GL Mapping API
      x-required-permissions:
      - accounting:posting_rules:view
  /v1/accounting/payment-applications/{applicationId}/reverse:
    post:
      description: 'Reverses one payment application as a new compensating record, restoring the invoice''s balance and the payment''s unapplied amount.

        Use this tool for an application that settled a single invoice; do not use it on an application created by a multi-invoice apply request, which must be reversed as a whole via reversePayment.

        Preconditions: the application must exist, must not already be reversed, and must not belong to a multi-application request.

        Required inputs: applicationId (UUID) as a path parameter and a reason of 10 to 1000 characters for the audit trail; the caller needs accounting:payment:reverse authority.

        Emits an ACCOUNTING_PAYMENT_APPLICATION_REVERSE event; the reversal is a new record, not a deletion.

        Returns 404 when the application is not found, 409 when it is already reversed, 422 WHOLE_REQUEST_REVERSAL_REQUIRED when it belongs to a multi-application request, and 204 with no body on success.

        '
      operationId: reversePaymentApplication
      parameters:
      - description: Payment application identifier
        in: path
        name: applicationId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Reverse one application:
                description: Reverse one application
                value:
                  reason: Applied to invoice with disputed line items
            schema:
              $ref: '#/components/schemas/PaymentApplicationReversalRequest'
        description: Audit reason for reversing this single payment application.
        required: true
      responses:
        '204':
          description: Payment application reversed
        '400':
          description: Invalid request or already reversed
        '404':
          description: Payment application not found
      security:
      - bearerAuth:
        - accounting:payment:reverse
      summary: Reverse Payment Application
      tags:
      - Payment Applications
      x-required-permissions:
      - accounting:payment:reverse
  /v1/accounting/payments/{paymentId}/applications:
    post:
      description: 'Applies a receivable payment to one or more invoices atomically, updating each invoice''s balance and status and reducing the payment''s unapplied amount.

        Use this tool to settle invoices from an available payment; do not use applyCustomerCredit, which draws down a standing credit rather than a payment.

        Preconditions: the payment must be AVAILABLE with sufficient unapplied funds, and every target invoice must be applicable (not paid in full, voided or cancelled); an overpayment creates a CustomerCredit for the excess.

        Required inputs: paymentId (UUID) as a path parameter, applicationRequestId (max 100 chars, the idempotency key) and a non-empty applications list of invoiceId plus amountToApply (min 0.01); allocationStrategy is optional, CALLER_ORDER when omitted or OLDEST_FIRST to allocate by ascending invoice date.

        Emits an ACCOUNTING_PAYMENT_APPLY event; the application is atomic across all invoices and idempotent on applicationRequestId.

        Returns 404 when the payment is not found, 400 for insufficient funds, 409 for a currency mismatch or an inapplicable invoice, and 503 when the invoice service is unreachable.

        '
      operationId: applyPayment
      parameters:
      - description: Payment identifier
        in: path
        name: paymentId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Apply to two invoices oldest first:
                description: Apply to two invoices oldest first
                value:
                  allocationStrategy: OLDEST_FIRST
                  applicationRequestId: apply-2026-08-13-042
                  applications:
                  - amountToApply: 100.0
                    invoiceId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  - amountToApply: 50.0
                    invoiceId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
            schema:
              $ref: '#/components/schemas/PaymentApplicationRequest'
        description: Idempotent, atomic allocation of the payment across one or more invoices.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentApplicationResponse'
          description: Payment applied successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentApplicationResponse'
          description: Invalid request or insufficient funds
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentApplicationResponse'
          description: Payment not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentApplicationResponse'
          description: Currency mismatch or invoice not applicable
      security:
      - bearerAuth:
        - accounting:payment:apply
      summary: Apply Payment To Invoices
      tags:
      - Payment Applications
      x-required-permissions:
      - accounting:payment:apply
  /v1/accounting/payments/{paymentId}/reverse:
    post:
      description: 'Reverses every application of a receivable payment as new compensating records, restoring each invoice''s balance and the payment''s unapplied amount.

        Use this tool to back out a whole applied payment, which is also the required path for multi-invoice applications; do not use reversePaymentApplication, which reverses one single-invoice application, and do not use voidPaymentApplication, which only handles never-applied payments.

        Preconditions: the payment must exist and have at least one application; already-reversed applications are skipped rather than double-reversed.

        Required inputs: paymentId (UUID) as a path parameter and a reason of 10 to 1000 characters for the audit trail.

        Emits an ACCOUNTING_PAYMENT_REVERSE event; reversals are new records, never deletions.

        Returns 404 when the payment is not found, 409 when it has no applications to reverse, and 204 with no body on success.

        '
      operationId: reversePayment
      parameters:
      - description: Payment identifier
        in: path
        name: paymentId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Reverse misapplied payment:
                description: Reverse misapplied payment
                value:
                  reason: Payment applied to the wrong customer account
            schema:
              $ref: '#/components/schemas/PaymentApplicationReversalRequest'
        description: Audit reason for reversing all of the payment's applications.
        required: true
      responses:
        '204':
          description: Payment applications reversed
        '404':
          description: Payment not found
        '409':
          description: Payment has no applications to reverse
      security:
      - bearerAuth:
        - accounting:ap:pay
      summary: Reverse Payment
      tags:
      - Payment Applications
      x-required-permissions:
      - accounting:ap:pay
  /v1/accounting/payments/{paymentId}/void:
    post:
      description: 'Voids a receivable payment that has not been applied to any invoice, zeroing its unapplied amount so it can never be applied.

        Use this tool for a payment recorded in error before any application; do not use reversePayment, which backs out a payment whose applications already exist.

        Preconditions: the payment must exist and have no invoice applications; voiding an already-voided payment is a no-op.

        Required inputs: paymentId (UUID) as a path parameter; the request body is optional and ignored.

        Emits an ACCOUNTING_PAYMENT_VOID event.

        Returns 404 when the payment is not found, 409 when invoice applications already exist (reverse those first), and 204 with no body on success.

        '
      operationId: voidPaymentApplication
      parameters:
      - description: Payment identifier
        in: path
        name: paymentId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Empty body:
                description: Empty body
            schema:
              type: object
        description: Optional and ignored; send an empty object or omit the body entirely.
      responses:
        '204':
          description: Payment voided
        '404':
          description: Payment not found
        '409':
          description: Payment already applied; reverse applications first
      security:
      - bearerAuth:
        - accounting:ap:pay
      summary: Void Payment
      tags:
      - Payment Applications
      x-required-permissions:
      - accounting:ap:pay
  /v1/accounting/periods:
    get:
      description: 'Lists all known accounting periods with their OPEN or CLOSED status, most recent first (descending period code).

        Use this tool to review period statuses before closing or reopening a period; do not use closeAccountingPeriod or reopenAccountingPeriod, which perform the state transitions.

        Preconditions: none; periods are auto-provisioned on first posting, so months never posted into may be absent, and an absent month counts as OPEN for posting purposes.

        Required inputs: none; there are no parameters and no request body.

        Emits an ACCOUNTING_PERIOD_LIST audit event; nothing is created or changed by this call.

        Returns 200 with an empty list when no period has ever been provisioned.

        '
      operationId: listAccountingPeriods
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AccountingPeriodResponse'
                type: array
          description: Accounting periods listed, most recent first
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:period:view permission
      security:
      - bearerAuth:
        - accounting:period:view
      summary: List Accounting Periods
      tags:
      - Accounting Periods
      x-required-permissions:
      - accounting:period:view
  /v1/accounting/periods/hard-lock:
    get:
      description: 'Returns the org-level hard-lock date; journal entries dated strictly before this date are permanently rejected with PERIOD_HARD_LOCKED and no override path, unlike a CLOSED period which accounting:period:override plus a justification can bypass.

        Use this tool to check the current lock boundary before posting backdated entries; do not use setAccountingHardLockDate, which moves the lock, unless a change is intended.

        Preconditions: none; the lock may be unset.

        Required inputs: none; there are no parameters and no request body.

        Emits an ACCOUNTING_PERIOD_HARD_LOCK_VIEW audit event; no state changes.

        Returns 200 with hardLockDate null when no hard lock has been configured yet.

        '
      operationId: getAccountingHardLockDate
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardLockDateResponse'
          description: Current hard-lock date returned; hardLockDate is null when no hard lock is set
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:period:view permission
      security:
      - bearerAuth:
        - accounting:period:view
      summary: Get Accounting Hard-Lock Date
      tags:
      - Accounting Periods
      x-required-permissions:
      - accounting:period:view
    put:
      description: 'Sets the org-level hard-lock date; from then on, journal entries dated strictly before this date are permanently rejected with PERIOD_HARD_LOCKED and no override path, not even accounting:period:override, which only covers CLOSED periods.

        Use this tool after statutory filings or audits to make history immutable; use closeAccountingPeriod for the reversible month-end close instead.

        Preconditions: the new date must be on or after the currently stored hard-lock date; the lock is monotonic-forward-only and effectively irreversible, so set it deliberately.

        Required inputs: hardLockDate (ISO date) and a non-blank justification (max 500 characters), recorded in the audit trail with the acting user.

        Emits an ACCOUNTING_PERIOD_HARD_LOCK_SET event and returns the stored hard-lock date.

        Returns 422 HARD_LOCK_DATE_REGRESSION when the date would move backward, and 400 when the date or justification is missing or blank.

        '
      operationId: setAccountingHardLockDate
      requestBody:
        content:
          application/json:
            examples:
              Lock after audit:
                description: Lock after audit
                value:
                  hardLockDate: 2026-01-01
                  justification: FY2025 audit finalized; history locked
            schema:
              $ref: '#/components/schemas/HardLockDateUpdateRequest'
        description: New hard-lock date with the audit justification for moving it forward.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardLockDateResponse'
          description: Hard-lock date updated; the stored value is returned
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: hardLockDate is missing, or justification is missing, blank, or over 500 characters (ARGUMENT_NOT_VALID)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:period:hard_lock permission
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Requested date is before the currently stored hard-lock date (HARD_LOCK_DATE_REGRESSION) — the hard lock only moves forward
      security:
      - bearerAuth:
        - accounting:period:hard_lock
      summary: Set Accounting Hard-Lock Date
      tags:
      - Accounting Periods
      x-required-permissions:
      - accounting:period:hard_lock
  /v1/accounting/periods/{periodCode}/close:
    post:
      description: 'Closes an OPEN accounting period (OPEN to CLOSED), after which posting paths reject entries dated inside it with PERIOD_CLOSED unless a permissioned override is supplied.

        Use this tool during month-end close after all journal entries for the month are posted; do not use reopenAccountingPeriod, which reverses this transition for late adjustments.

        Preconditions: the period must not already be CLOSED, and no DRAFT journal entries may be dated inside the period; a valid YYYY-MM code with no row whose month has already started is auto-provisioned and then closed.

        Required inputs: periodCode (YYYY-MM) as a path parameter; there is no request body.

        Emits an ACCOUNTING_PERIOD_CLOSE event and audit-logs the close with the acting user.

        Returns 409 PERIOD_ALREADY_CLOSED when the period is already closed, 404 PERIOD_NOT_FOUND when no row exists and the month has not started, and 422 PERIOD_HAS_DRAFT_ENTRIES listing the blocking draftJournalEntryIds in fieldErrors; post or delete those entries before retrying.

        '
      operationId: closeAccountingPeriod
      parameters:
      - description: Period code in YYYY-MM format
        example: 2026-06
        in: path
        name: periodCode
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingPeriodResponse'
          description: Period closed; the updated period is returned
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: periodCode is not a valid YYYY-MM period code
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:period:close permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Period not found and its month has not started (PERIOD_NOT_FOUND)
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Period is already closed (PERIOD_ALREADY_CLOSED)
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: DRAFT journal entries are dated inside the period (PERIOD_HAS_DRAFT_ENTRIES); fieldErrors lists the blocking draftJournalEntryIds
      security:
      - bearerAuth:
        - accounting:period:close
      summary: Close Accounting Period
      tags:
      - Accounting Periods
      x-required-permissions:
      - accounting:period:close
  /v1/accounting/periods/{periodCode}/reopen:
    post:
      description: 'Reopens a CLOSED accounting period (CLOSED to OPEN), allowing entries to be posted into that month again.

        Use this tool only when late adjustments must be posted into an already-closed month; use closeAccountingPeriod instead to close it again afterwards, and prefer a permissioned closed-period override on postJournalEntry for a one-off posting.

        Preconditions: a period row must exist for the code and be CLOSED.

        Required inputs: periodCode (YYYY-MM) as a path parameter and a non-blank justification (max 500 characters), recorded on the period and in the audit trail with the acting user.

        Emits an ACCOUNTING_PERIOD_REOPEN event.

        Returns 409 PERIOD_ALREADY_OPEN when the period is not closed, 404 PERIOD_NOT_FOUND when no period row exists for the code, and 400 when the justification is missing or blank.

        '
      operationId: reopenAccountingPeriod
      parameters:
      - description: Period code in YYYY-MM format
        example: 2026-06
        in: path
        name: periodCode
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Late adjustment:
                description: Late adjustment
                value:
                  justification: Post late utility accrual approved by controller
            schema:
              $ref: '#/components/schemas/AccountingPeriodReopenRequest'
        description: Audit justification for reopening the closed period.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingPeriodResponse'
          description: Period reopened; the updated period is returned
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: periodCode is not a valid YYYY-MM period code, or justification is missing or blank
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:period:reopen permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No period row exists for the code (PERIOD_NOT_FOUND)
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Period is already open (PERIOD_ALREADY_OPEN)
      security:
      - bearerAuth:
        - accounting:period:reopen
      summary: Reopen Accounting Period
      tags:
      - Accounting Periods
      x-required-permissions:
      - accounting:period:reopen
  /v1/accounting/posting-categories:
    get:
      description: 'Lists posting categories as a paginated projection, optionally filtered by active flag.

        Use this tool when browsing the mapping taxonomy; do not use getPostingCategory, which fetches a single category by id.

        Preconditions: none beyond the caller holding accounting:posting-category:view.

        Required inputs: none; page defaults to 0, size to 20, sort to categoryName (an unsupported sort field silently falls back to categoryName), and isActive is an optional filter.

        Emits an ACCOUNTING_POSTING_CATEGORY_LIST audit event; no state changes.

        Returns 200 with an empty page when no categories exist.

        '
      operationId: listPostingCategories
      parameters:
      - description: Page index (0-based)
        in: query
        name: page
        required: false
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
      - description: Page size
        in: query
        name: size
        required: false
        schema:
          default: 20
          exclusiveMinimum: 0
          format: int32
          type: integer
      - description: Sort field
        in: query
        name: sort
        required: true
        schema:
          default: categoryName
          minLength: 1
          type: string
      - description: Filter by active status
        in: query
        name: isActive
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingCategoryListResponse'
