      type: object
      description: GL account response with computed status
      properties:
        glAccountId:
          type: string
          format: uuid
          description: GL account UUID
          example: 01960003-0000-7000-8000-000000000001
        accountCode:
          type: string
          description: GL account code
          example: 1200-100
        accountName:
          type: string
          description: GL account display name
          example: Accounts Receivable
        accountType:
          type: string
          description: Account classification
          enum:
          - ASSET
          - LIABILITY
          - EQUITY
          - REVENUE
          - EXPENSE
          example: ASSET
        accountSubtype:
          type: string
          description: Optional subtype refining accountType for report grouping and posting-config plausibility checks. Null when no refinement applies.
          enum:
          - RECEIVABLE
          - PAYABLE
          - BANK_CASH
          - UNDEPOSITED_FUNDS
          - TAX_PAYABLE
          - CURRENT_ASSET
          - FIXED_ASSET
          - CURRENT_LIABILITY
          - SALES
          - COST_OF_SALES
          - OPERATING_EXPENSE
          - OTHER
          example: UNDEPOSITED_FUNDS
        reconcilable:
          type: boolean
          description: Whether journal entry lines on this account participate in reconciliation (e.g. settlement/bank reconciliation).
          example: false
        description:
          type: string
          description: GL account description
          example: Primary receivables account
        parentAccountId:
          type: string
          format: uuid
          description: Parent GL account UUID for hierarchical accounts
          example: 01960003-0000-7000-8000-000000000002
        activationDate:
          type: string
          format: date-time
          description: Date the account becomes active
          example: 2026-01-15 10:30:00
        deactivationDate:
          type: string
          format: date-time
          description: Date the account becomes inactive
