      - accounting:reconciliation:adjust
  /v1/accounting/reconciliations/{reconciliationId}/outstanding-items:
    post:
      description: 'Registers a non-posting outstanding item: a deposit in transit (a debit to cash), an outstanding check (a credit) or another ledger timing item on a posted ledger line, or a bank error the bank will correct on a bank transaction. The item enters the explicit equation''s bank side while it is open and carries forward until matched, cleared or released.

        Use this tool for a timing difference; do not use addReconciliationAdjustment, which posts a journal entry, and use createReconciliationMatch when the other side is already present.

        Preconditions: the reconciliation must be IN_PROGRESS (409 RECONCILIATION_ALREADY_FINALIZED when FINALIZED, RECONCILIATION_NOT_EDITABLE in any other status); the line or bank transaction must be on the account, dated on or before the window end, in no active match and in no OPEN item; a deposit in transit must be positive and an outstanding check negative.

        Required inputs: reconciliationId as a path parameter; itemKind and exactly one of glLineId or bankTransactionId in the body; justification (at least 10 characters) for OTHER_LEDGER_TIMING, BANK_ERROR_PENDING and an item older than the aging days.

        Emits an ACCOUNTING_RECONCILIATION_OUTSTANDING_REGISTER event and a RECONCILIATION_OUTSTANDING_REGISTER audit row; no journal entry is posted.

        Returns 400 JUSTIFICATION_REQUIRED when a needed justification is missing or short, 409 RECONCILIATION_ALREADY_FINALIZED, RECONCILIATION_NOT_EDITABLE or RECONCILIATION_LINE_INELIGIBLE (a concurrent registration), and 422 OUTSTANDING_ITEM_NOT_ELIGIBLE when the line, sign, window or state does not allow the item.

        '
      operationId: registerReconciliationOutstandingItem
      parameters:
      - description: Reconciliation id
        in: path
        name: reconciliationId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Deposit in transit:
                description: Deposit in transit
                value:
                  glLineId: 019a0000-0000-7000-8000-000000000020
                  itemKind: DEPOSIT_IN_TRANSIT
            schema:
              $ref: '#/components/schemas/OutstandingItemRegisterRequest'
        description: The line or bank transaction and the item kind.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutstandingItemResponse'
          description: Item registered
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: VALIDATION_ERROR or JUSTIFICATION_REQUIRED
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks accounting:reconciliation:adjust
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reconciliation, line or bank transaction not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: RECONCILIATION_ALREADY_FINALIZED, RECONCILIATION_NOT_EDITABLE or RECONCILIATION_LINE_INELIGIBLE
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: OUTSTANDING_ITEM_NOT_ELIGIBLE
      security:
      - bearerAuth:
        - accounting:reconciliation:adjust
      summary: Register Outstanding Item
      tags:
      - Bank Reconciliation
      x-required-permissions:
      - accounting:reconciliation:adjust
  /v1/accounting/reconciliations/{reconciliationId}/outstanding-items/{itemId}/clear-in-gap:
    post:
      description: 'Closes an OPEN item registered in an earlier reconciliation whose other side appeared during the gap this reconciliation''s statement acknowledges: the item becomes CLEARED_IN_GAP with closedOn the day before the statement start and leaves this window''s opening and closing terms.

        Use this tool only in the reconciliation of an acknowledged statement; use createReconciliationMatch instead for an item whose other side is in a bank row, and releaseReconciliationOutstandingItem to undo a wrong registration.

        Preconditions: the reconciliation must be IN_PROGRESS or SUBMITTED (409 RECONCILIATION_ALREADY_FINALIZED when FINALIZED, RECONCILIATION_NOT_EDITABLE otherwise) and rest on a statement with a gap acknowledgement; the item must be OPEN, dated before the statement start and registered in an earlier reconciliation.

        Required inputs: reconciliationId and itemId as path parameters; justification (at least 10 characters) in the body.

        Emits an ACCOUNTING_RECONCILIATION_OUTSTANDING_CLEAR_IN_GAP event and a RECONCILIATION_OUTSTANDING_CLEAR_IN_GAP audit row.

