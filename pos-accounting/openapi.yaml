      - asOfDate
      - generatedAt
      - rows
      - totals
      type: object
    AgedPayablesRow:
      description: Per-vendor aged payables row with bucketed open vendor-bill balances
      properties:
        current:
          description: Outstanding 0-30 days past due (includes not-yet-due)
          example: 3200.0
          type: number
        days31To60:
          description: Outstanding 31-60 days past due
          example: 750.0
          type: number
        days61To90:
          description: Outstanding 61-90 days past due
          example: 0.0
          type: number
        days90Plus:
          description: Outstanding more than 90 days past due
          example: 0.0
          type: number
        totalOutstanding:
          description: Total outstanding for the vendor across all buckets
          example: 3950.0
          type: number
        vendorId:
          description: Vendor UUID
          example: d10217f9-3ec6-46b9-9c87-e7066c100c24
          format: uuid
          type: string
        vendorName:
          description: Vendor display name
          example: Global Parts Supply
          type: string
      required:
      - current
      - days31To60
      - days61To90
      - days90Plus
      - totalOutstanding
      - vendorId
      type: object
    AgedReceivablesReport:
      description: Aged Receivables report with per-customer bucketed open invoice balances
      properties:
        asOfDate:
          description: Date the receivables aging is reported as of (inclusive)
          example: 2026-06-30
          format: date
          type: string
        generatedAt:
          description: Timestamp when the report was generated (ISO 8601)
          example: 2026-06-30 08:00:00+00:00
          format: date-time
          type: string
        rows:
          description: Per-customer aging rows ordered by customer name; empty when no open receivables exist
          items:
            $ref: '#/components/schemas/AgedReceivablesRow'
          type: array
        totals:
          $ref: '#/components/schemas/AgingSummary'
      required:
      - asOfDate
      - generatedAt
      - rows
      - totals
      type: object
    AgedReceivablesRow:
      description: Per-customer aged receivables row with bucketed open invoice balances
      properties:
        current:
          description: Outstanding 0-30 days past due (includes not-yet-due)
          example: 1250.0
          type: number
        customerId:
          description: Customer (party) UUID
          example: d10217f9-3ec6-46b9-9c87-e7066c100c24
          format: uuid
          type: string
        customerName:
          description: Customer display name
          example: Acme Fleet Services
          type: string
        days31To60:
          description: Outstanding 31-60 days past due
          example: 500.0
          type: number
        days61To90:
          description: Outstanding 61-90 days past due
          example: 0.0
          type: number
        days90Plus:
          description: Outstanding more than 90 days past due
          example: 0.0
          type: number
        totalOutstanding:
          description: Total outstanding for the customer across all buckets
          example: 1750.0
          type: number
      required:
      - current
      - customerId
      - days31To60
      - days61To90
      - days90Plus
      - totalOutstanding
