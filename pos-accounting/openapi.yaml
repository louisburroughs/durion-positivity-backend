        modifiedBy:
          type: string
          description: Last modified by username
          example: accounting.user
        postedAt:
          type: string
          format: date-time
          description: Posted timestamp
          example: 2026-01-15 10:40:00+00:00
        postedBy:
          type: string
          description: Posted by username
