        correctedValues:
          description: What the preparer corrected
          type: object
        date:
          description: Parsed (or corrected) posting date
          example: '2026-09-14'
          format: date
          type: string
        description:
          description: Parsed (or corrected) description
          example: MONTHLY FEE
          type: string
        duplicateDecision:
          description: A human's answer to the collision
