    AccountingEventResponse:
      description: Accounting event ingestion record and its processing outcome
      properties:
        attemptCount:
          description: Number of processing attempts made
          example: 3
          format: int32
          type: integer
        domainKeyId:
          description: Domain key associated with the event
          example: INVOICE-2026-000123
          type: string
        errorMessage:
          description: Error message when processing failed
          example: Mapping not found for event type
          type: string
        eventId:
          description: Unique identifier of the accounting event
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        eventReference:
          description: Short human-readable reference for display in place of the raw event UUID
          example: AE-202609-42
          type:
          - string
          - 'null'
        eventType:
          description: Event type identifier
          example: INVOICE_RECEIVED
          type: string
        failureDetails:
          description: Detailed failure description
          example: No GL mapping configured for INVOICE_RECEIVED
          type: string
        failureReasonCode:
          description: Code categorizing the failure reason
          example: MAPPING_NOT_FOUND
          type: string
        finalPostingReferenceId:
          description: Posting reference assigned on final resolution
          example: JE-2026-000456
          type: string
        idempotencyOutcome:
          description: Idempotency outcome of ingestion
          example: NEW
          type: string
        ingestionId:
          description: Identifier of the ingestion batch
          example: 01960003-0000-7000-8000-000000000005
          format: uuid
          type: string
        invoiceId:
          description: Identifier of the related invoice, if any
          example: 01960003-0000-7000-8000-000000000006
          format: uuid
          type: string
        journalEntryId:
          description: Identifier of the journal entry produced, if any
          example: 01960003-0000-7000-8000-000000000003
          format: uuid
          type: string
        mappingVersionAttempted:
          description: Mapping version attempted during processing
          example: v3
          type: string
        organizationId:
          description: Identifier of the owning organization
          example: 01960003-0000-7000-8000-000000000002
          format: uuid
          type: string
        payload:
          description: Event-specific payload content
          type: object
        payloadReferences:
          description: 'Display projection for the reference values recognized inside the raw payload (issues #1778, #1797): UUID-backed ids, plus the code-keyed accounting location. The payload above is unchanged and remains the audit record; this list carries the human-readable identity of each recognized reference, with null display values where accounting cannot resolve one. Populated on the event detail endpoint only — list responses omit it.'
          items:
            $ref: '#/components/schemas/EventPayloadReference'
          type:
          - array
          - 'null'
        processedAt:
          description: Timestamp when the event was processed (ISO 8601)
          example: '2026-06-18T08:00:05Z'
          format: date-time
          type: string
        receivedAt:
          description: Timestamp when the event was received (ISO 8601)
          example: '2026-06-18T08:00:00Z'
          format: date-time
          type: string
        resolvedByUserId:
          description: Identifier of the user who resolved the event
          example: 01960003-0000-7000-8000-000000000004
          type: string
        sequenceNumber:
          description: Monotonic sequence number assigned to the event
          example: 42
          format: int64
          type: integer
        sourceSystem:
          description: Source system that emitted the event
          example: POS_ORDER
          type: string
        status:
          description: Processing status of the event
          enum:
          - RECEIVED
          - PROCESSING
          - PROCESSED
          - FAILED
          - SUSPENDED
          - SKIPPED
          example: PROCESSED
          type: string
        transactionDate:
          description: Business transaction timestamp
          example: '2026-06-18T10:30:00'
          format: date-time
          type: string
      required:
      - eventId
      - eventType
      - organizationId
      - receivedAt
      - status
      type: object
    AccountingEventSubmitRequest:
      description: Request payload for submitting an accounting event for ingestion
      properties:
        eventId:
          description: Optional event UUID (idempotency key). If omitted, service computes idempotency hash.
          example: 01936e5c-1234-7a3d-8b6e-123456789012
          format: uuid
          type: string
        eventType:
          description: Event type identifier
          example: INVOICE_RECEIVED
          maxLength: 100
          minLength: 0
          type: string
        organizationId:
          deprecated: true
          description: 'Deprecated and ignored. Vestigial multi-tenancy scope key retained only for producers that still send one: nothing resolves or displays it. Omit it.'
          example: 00000000-0000-4000-a000-000000000010
          format: uuid
          type:
          - string
          - 'null'
        payload:
          description: Event-specific payload content
          type: object
        sourceSystem:
          description: Source system name. If omitted, defaults to POS_ACCOUNTING_API.
          example: POS_ORDER
          maxLength: 100
          minLength: 0
          type: string
        transactionDate:
          description: Event transaction timestamp. If omitted, defaults to current time.
          example: '2026-01-15T10:30:00'
          format: date-time
          type: string
      required:
      - eventType
      - payload
      type: object
    AccountingEventTypeResponse:
