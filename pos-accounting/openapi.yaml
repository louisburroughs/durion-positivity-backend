  /v1/accounting/reconciliations/{reconciliationId}/review:
    get:
      description: 'Returns the review read model in one call, computed live, so a client never does arithmetic: the header (account, window, baseline and whether this statement set it, provenance, status, preparer, period state, version); every term of the explicit equation E3 with its drill-down, including late adjustments with their owning reconciliation; the opening terms and the OPENING_DIFFERENCE diagnostic, which never blocks; everything unresolved from the baseline on (late arrivals first, unexplained bank rows with their top ledger candidate, unexplained ledger lines with their top bank candidate, possible duplicates with their near-duplicate candidates, aged timing items awaiting reaffirmation, proposed and broken matches); the posted adjustments; the evidence (matches with their served residual, items, exclusions, the adjustments to clearing, the statement); and the readiness with its reasons.

        Use this tool to render or audit the reconciliation workspace; use getReconciliation instead for the header alone and getReconciliationReport for the printable report.

        Preconditions: the reconciliation must exist.

        Required inputs: reconciliationId (UUID) as a path parameter; there is no request body.

        Emits an ACCOUNTING_RECONCILIATION_REVIEW event; no state changes.

        Returns 404 RECONCILIATION_NOT_FOUND when the id is unknown.

        '
      operationId: getReconciliationReview
      parameters:
      - description: Reconciliation id
        in: path
        name: reconciliationId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationReviewResponse'
          description: Review read
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:reconciliation:view permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reconciliation not found (RECONCILIATION_NOT_FOUND)
      security:
      - bearerAuth:
        - accounting:reconciliation:view
      summary: Get Reconciliation Review
      tags:
      - Bank Reconciliation
      x-required-permissions:
      - accounting:reconciliation:view
  /v1/accounting/reconciliations/{reconciliationId}/submit:
    post:
      description: 'Submits an IN_PROGRESS reconciliation for approval (IN_PROGRESS to SUBMITTED) after the approval gate E4 holds on the live figures: the difference within 0.01, then no unexplained bank transaction and no unexplained ledger line from the window''s baseline to its end. The opening difference is never a condition.

        Use this tool when the preparer has explained every item; do not use it for the approver''s step (use finalizeReconciliation instead), and use getReconciliationReview to see what still blocks (readiness.canSubmit).

        Preconditions: the reconciliation must be IN_PROGRESS; while SUBMITTED it no longer changes until the approver returns it.

        Required inputs: reconciliationId (UUID) as a path parameter; the body is optional and may carry the version the caller read.

        Emits an ACCOUNTING_RECONCILIATION_SUBMIT event, writes a RECONCILIATION_SUBMIT audit row and queues the accounting.bankreconciliation.submitted fact; no journal entry is posted.

        Returns 200 with the header; 404 RECONCILIATION_NOT_FOUND; 409 RECONCILIATION_ALREADY_FINALIZED, RECONCILIATION_NOT_EDITABLE (SUBMITTED, INVALIDATED, SUPERSEDED, CANCELLED) or OPTIMISTIC_LOCK; 422 RECONCILIATION_NOT_BALANCED (fieldErrors[difference]) or, when it balances, RECONCILIATION_HAS_UNEXPLAINED_ITEMS (fieldErrors countUnexplainedBank, countUnexplainedLedger and the first 50 ids per side).

        '
      operationId: submitReconciliation
      parameters:
      - description: Reconciliation id
        in: path
        name: reconciliationId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              With version:
                description: With version
                value:
                  version: 3
            schema:
              $ref: '#/components/schemas/ReconciliationTransitionRequest'
        description: Optional; the version the caller read, for optimistic locking.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankReconciliationResponse'
          description: Reconciliation submitted
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:reconciliation:adjust permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reconciliation not found (RECONCILIATION_NOT_FOUND)
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: RECONCILIATION_ALREADY_FINALIZED, RECONCILIATION_NOT_EDITABLE or OPTIMISTIC_LOCK
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: RECONCILIATION_NOT_BALANCED or RECONCILIATION_HAS_UNEXPLAINED_ITEMS
      security:
      - bearerAuth:
        - accounting:reconciliation:adjust
      summary: Submit Reconciliation For Approval
      tags:
      - Bank Reconciliation
      x-required-permissions:
      - accounting:reconciliation:adjust
  /v1/accounting/reconciliations/{reconciliationId}/supersede:
    post:
      description: 'Starts a new IN_PROGRESS reconciliation of the same statement that supersedes a FINALIZED or INVALIDATED one: the predecessor''s match members are released (its matches keep their state as sealed history) and re-proposed in the successor as PROPOSED matches for the preparer to re-confirm; OPEN outstanding items carry over unchanged. The successor uses the baseline that governed the window. When the successor is approved the predecessor becomes SUPERSEDED.

        Use this tool to correct an approved window (there is no reopen); use createReconciliation instead for a statement never reconciled, and a corrected re-import (supersedesStatementId) when the bank''s statement itself was wrong.

        Preconditions: the reconciliation must be FINALIZED or INVALIDATED, not already superseded, and its statement still COMMITTED.

        Required inputs: reconciliationId (UUID) as a path parameter and justification (at least 10 characters) in the body; requestId (UUIDv7) makes a retry return the same successor; version is optional.

        Emits an ACCOUNTING_RECONCILIATION_SUPERSEDE event and writes a RECONCILIATION_SUPERSEDE audit row on the predecessor and a RECONCILIATION_CREATE row on the successor.

        Returns 201 with the successor''s header (200 with replayed true on a replay); 400 VALIDATION_ERROR or JUSTIFICATION_REQUIRED; 404 RECONCILIATION_NOT_FOUND; 409 RECONCILIATION_WINDOW_ALREADY_RECONCILED (it is IN_PROGRESS or SUBMITTED, or the statement has another active one), RECONCILIATION_NOT_EDITABLE (SUPERSEDED, CANCELLED, already superseded, or its statement superseded), IDEMPOTENCY_CONFLICT or OPTIMISTIC_LOCK.

        '
      operationId: supersedeReconciliation
      parameters:
      - description: Reconciliation id
        in: path
        name: reconciliationId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Supersede with justification:
                description: Supersede with justification
                value:
                  justification: Bank corrected a posting date after approval
                  requestId: 019a0000-0000-7000-8000-000000000003
                  version: 5
            schema:
              $ref: '#/components/schemas/ReconciliationJustificationRequest'
        description: The justification (at least 10 characters), a requestId (UUIDv7) so a retry returns the same successor, and optionally the version the caller read.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankReconciliationResponse'
          description: Replay of an earlier supersede with the same requestId (replayed = true)
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankReconciliationResponse'
          description: Superseding reconciliation started
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: VALIDATION_ERROR or JUSTIFICATION_REQUIRED
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:reconciliation:approve permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reconciliation not found (RECONCILIATION_NOT_FOUND)
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: RECONCILIATION_WINDOW_ALREADY_RECONCILED, RECONCILIATION_NOT_EDITABLE, IDEMPOTENCY_CONFLICT or OPTIMISTIC_LOCK
      security:
      - bearerAuth:
        - accounting:reconciliation:approve
      summary: Supersede Reconciliation
      tags:
      - Bank Reconciliation
      x-required-permissions:
      - accounting:reconciliation:approve
  /v1/accounting/reports/export:
    get:
      description: 'Lists all asynchronous report export jobs as a paginated projection, most recent first.

        Use this tool to review past exports and their statuses; do not use getReportExportStatus, which polls a single job by id.

        Preconditions: none beyond the caller holding accounting:report:export.

        Required inputs: none; the page defaults to 20 items and only requestedAt is a supported sort property.

        Emits an ACCOUNTING_REPORT_EXPORT_LIST audit event; no state changes.

        Returns 400 when an unsupported sort property is requested.

        '
      operationId: listReportExports
      parameters:
      - description: Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: The size of the page to be returned
        in: query
        name: size
        required: false
        schema:
          default: 20
          minimum: 1
          type: integer
      - description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
        in: query
        name: sort
        required: false
        schema:
          default:
          - requestedAt,DESC
          items:
            type: string
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageReportExportResponse'
          description: Export history returned
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden - missing accounting:report:export
      security:
      - bearerAuth:
        - accounting:report:export
      summary: List Report Export History
      tags:
      - Financial Reporting
      x-required-permissions:
      - accounting:report:export
    post:
      description: 'Submits an asynchronous export job that renders a financial report to a downloadable artifact, returning immediately with status PENDING.

        Use this tool to produce a file for one of the reporting endpoints'' outputs; do not use the synchronous generate operations such as generateIncomeStatement when a file artifact is what is needed, and poll getReportExportStatus for completion.

        Preconditions: none; as-of report types use the request''s endDate as the as-of date.

        Required inputs: format (PDF, CSV, XLSX or JSON), reportType (TAX_LIABILITY, INCOME_STATEMENT, BALANCE_SHEET, TRIAL_BALANCE, GENERAL_LEDGER, AGED_RECEIVABLES or AGED_PAYABLES), startDate and endDate (endDate on or after startDate); accountId and filename are optional.

        Emits an ACCOUNTING_REPORT_EXPORT_REQUEST event and records the requesting operator.

        Returns 400 when the payload is invalid or the end date precedes the start date.

        '
      operationId: requestReportExport
      requestBody:
        content:
          application/json:
            examples:
              Trial balance CSV:
                description: Trial balance CSV
