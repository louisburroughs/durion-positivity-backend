          type: number
        equation:
          $ref: '#/components/schemas/Equation'
        glEndingBalance:
          description: Live GL balance at the end of the statement end date
          example: 12000.0
          type: number
        matchedLineCount:
          description: Number of MATCHED statement lines
          example: 5
          format: int32
          type: integer
        openingTerms:
          $ref: '#/components/schemas/Diagnostics'
        outstandingItems:
          description: Outstanding items open at the window end, with their age
          items:
            $ref: '#/components/schemas/OutstandingItemResponse'
          type: array
        outstandingLineCount:
          description: Number of UNMATCHED statement lines
          example: 0
          format: int32
          type: integer
        outstandingLines:
          description: Outstanding (UNMATCHED) statement lines
