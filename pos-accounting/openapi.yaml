      required:
      - triggeredByUserId
      type: object
    ReprocessingAttemptHistoryResponse:
      description: Historical record of a single reprocessing attempt
      properties:
        attemptId:
          description: Unique identifier of the reprocessing attempt
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        attemptedAt:
          description: Timestamp when the reprocessing was attempted (ISO 8601)
          example: 2026-06-18 08:00:00+00:00
          format: date-time
          type: string
        eventId:
          description: Identifier of the event that was reprocessed
          example: 01960003-0000-7000-8000-000000000002
          format: uuid
          type: string
        mappingVersionUsed:
          description: Mapping version used for the attempt
          example: v3
          type: string
        outcome:
          description: Outcome of the reprocessing attempt
