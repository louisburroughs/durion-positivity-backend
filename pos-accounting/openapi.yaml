      x-required-permissions:
      - accounting:default-mapping:edit
  /v1/accounting/events:
    get:
      description: 'Lists ingested accounting events as a paginated projection with rich optional filters: organization, event type, idempotency outcome, received-at range, event id, ingestion id, domain key, invoice id and processing status.

        Use this tool to monitor or triage the event pipeline; do not use getAccountingEvent, which fetches one event by its known id.

        Preconditions: none beyond the caller holding accounting:events:view; an unrecognized status value is silently ignored rather than rejected.

        Required inputs: none; all filters are optional and the page defaults to 20 items sorted by receivedAt descending.

        Emits an ACCOUNTING_EVENT_LIST audit event; no state changes.

        Returns 200 with an empty page when nothing matches the filters.

        '
      operationId: listAccountingEvents
      parameters:
      - description: Filter by organization
        in: query
        name: organizationId
        required: false
        schema:
          format: uuid
          type: string
      - description: Filter by event type
        in: query
        name: eventType
        required: false
        schema:
          type: string
      - description: Filter by idempotency outcome
        in: query
        name: idempotencyOutcome
        required: false
        schema:
          type: string
      - description: Filter by received-at range start (ISO-8601)
        in: query
        name: receivedAtFrom
        required: false
        schema:
          format: date-time
          type: string
      - description: Filter by received-at range end (ISO-8601)
        in: query
        name: receivedAtTo
        required: false
        schema:
          format: date-time
          type: string
      - description: Filter by event UUID
        in: query
        name: eventId
        required: false
        schema:
          format: uuid
          type: string
      - description: Filter by ingestion job UUID
        in: query
        name: ingestionId
        required: false
        schema:
          format: uuid
          type: string
      - description: Filter by domain key
        in: query
        name: domainKeyId
        required: false
        schema:
          type: string
      - description: Filter by invoice UUID
        in: query
        name: invoiceId
        required: false
        schema:
          format: uuid
          type: string
      - description: Filter by processing status
        in: query
        name: status
        required: false
        schema:
          type: string
      - description: Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: The size of the page to be returned
        in: query
        name: size
        required: false
        schema:
          default: 20
          minimum: 1
          type: integer
      - description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
        in: query
        name: sort
        required: false
        schema:
          default:
          - receivedAt,DESC
          items:
            type: string
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageAccountingEventResponse'
          description: Events listed
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageAccountingEventResponse'
          description: Forbidden
      security:
      - bearerAuth:
        - accounting:events:view
      summary: List Accounting Events
      tags:
      - Accounting Events
      x-required-permissions:
      - accounting:events:view
    post:
      description: 'Submits a business event into the accounting pipeline, where the posting engine converts it into journal entries via published posting rules or default GL mappings.

        Use this tool to feed source-system activity into the ledger; do not use createJournalEntry, which bypasses the rules engine for manual entries, and use resolveTestMapping to preview the rules first.

        Preconditions: no event with the same eventId may already be ingested; duplicates are rejected rather than reprocessed.

        Required inputs: eventType (max 100 chars), organizationId (UUID) and payload (JSON object); eventId, sourceSystem and transactionDate (ISO-8601) are optional, eventId being generated when omitted.

        Emits an ACCOUNTING_EVENT_SUBMIT event and returns 202 while processing continues asynchronously; callers poll getAccountingEvent for the outcome.

        Returns 409 DUPLICATE_EVENT when the eventId was already ingested, and 400 when required fields are missing or the transactionDate is not valid ISO-8601.

        '
      operationId: submitAccountingEvent
      requestBody:
        content:
          application/json:
            examples:
              Invoice finalized event:
                description: Invoice finalized event
                value:
                  eventId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  eventType: INVOICE_FINALIZED
                  organizationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
                  payload:
                    invoiceId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5d
                    totalAmount: 150.0
                  sourceSystem: POS
                  transactionDate: 2026-08-13 10:15:00
            schema:
              $ref: '#/components/schemas/AccountingEventSubmitRequest'
        description: Business event envelope to convert into journal entries.
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingEventResponse'
          description: Event accepted for processing
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingEventResponse'
          description: Invalid request
      security:
      - bearerAuth:
        - accounting:events:submit
      summary: Submit Accounting Event
      tags:
      - Accounting Events
      x-required-permissions:
      - accounting:events:submit
