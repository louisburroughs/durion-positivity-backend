  /v1/accounting/posting-rules:
    get:
      description: 'Lists posting rule sets, the event-to-journal-entry conversion definitions, as a paginated projection.

        Use this tool when browsing rule sets; do not use getPostingRuleSet, which fetches one set by id, or listPostingRuleVersions, which lists a set''s version history.

        Preconditions: none beyond the caller holding accounting:posting_rules:view.

        Required inputs: none; page defaults to 0, size to 20, and sort to createdAt descending (supported fields: createdAt, modifiedAt, updatedAt, name, eventType).

        Emits an ACCOUNTING_POSTING_RULE_LIST audit event; no state changes.

        Returns 400 when the sort property is not one of the supported fields.

        '
      operationId: listPostingRuleSets
      parameters:
      - description: Page index (0-based)
        in: query
        name: page
        required: false
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
      - description: Page size
        in: query
        name: size
        required: false
        schema:
          default: 20
          exclusiveMinimum: 0
          format: int32
          type: integer
      - description: 'Sort field with optional direction, e.g. ''modifiedAt,desc''. Supported fields: createdAt, modifiedAt, updatedAt, name, eventType. Direction defaults to desc.'
        in: query
        name: sort
        required: true
        schema:
          default: createdAt
          minLength: 1
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRuleSetListResponse'
          description: Posting rule sets listed
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRuleSetListResponse'
          description: Unsupported sort property or direction
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRuleSetListResponse'
          description: Forbidden
      security:
      - bearerAuth:
        - accounting:posting_rules:view
      summary: List Posting Rule Sets
      tags:
      - Posting Rules
      x-required-permissions:
      - accounting:posting_rules:view
    post:
      description: 'Creates a posting rule set for one event type together with its initial DRAFT version holding the rules definition.

        Use this tool to introduce new event-to-journal-entry conversion rules; do not use publishPostingRuleSet, which activates an existing draft, and do not use createDefaultMapping, which only sets a fallback account pair.

        Preconditions: none; drafts may hold work-in-progress definitions because split-group and predicate-grammar invariants are enforced only at publish time.

        Required inputs: name (max 100 chars), eventType (max 100 chars), rulesDefinition (JSON rules document as a string) and createdBy (max 50 chars); description is optional.

        Emits an ACCOUNTING_POSTING_RULE_CREATE event; the new version starts in DRAFT and does not affect posting until published.

        Returns 400 when required fields are missing or blank.

        '
      operationId: createPostingRuleSet
      requestBody:
        content:
          application/json:
            examples:
              Invoice finalized rules:
                description: Invoice finalized rules
                value:
                  createdBy: jdoe
                  description: AR and revenue postings for finalized invoices
                  eventType: INVOICE_FINALIZED
                  name: Invoice posting rules
                  rulesDefinition: '{"rules":[{"debit":"1100","credit":"4000","amountField":"totalAmount"}]}'
            schema:
              $ref: '#/components/schemas/PostingRuleSetCreateRequest'
        description: Rule set metadata with the initial DRAFT rules definition document.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRuleSetResponse'
          description: Posting rule set created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRuleSetResponse'
          description: Invalid request
      security:
      - bearerAuth:
        - accounting:posting_rules:create
      summary: Create Posting Rule Set
      tags:
      - Posting Rules
      x-required-permissions:
      - accounting:posting_rules:create
  /v1/accounting/posting-rules/{postingRuleSetId}:
    get:
      description: 'Returns one posting rule set with its metadata and current version state.

        Use this tool when the rule set id is already known; use listPostingRuleSets instead when searching, or listPostingRuleVersions for the full version history.

        Preconditions: the posting rule set must exist.

        Required inputs: postingRuleSetId (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 400 when no posting rule set exists for the supplied id (mapped as VALIDATION_ERROR, not 404).

        '
      operationId: getPostingRuleSet
      parameters:
      - description: Posting rule set identifier
        in: path
        name: postingRuleSetId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRuleSetResponse'
          description: Posting rule set returned
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRuleSetResponse'
          description: Posting rule set not found
      security:
      - bearerAuth:
        - accounting:posting_rules:view
      summary: Get Posting Rule Set
      tags:
      - Posting Rules
      x-required-permissions:
      - accounting:posting_rules:view
    put:
      description: 'Updates a posting rule set''s metadata and draft rules definition while no PUBLISHED version exists.

        Use this tool to iterate on a draft before publishing; do not use it once a version is PUBLISHED, and do not use publishPostingRuleSet, which is the activation step.

        Preconditions: the rule set must exist and must not have a PUBLISHED version.

        Required inputs: postingRuleSetId (UUID) as a path parameter plus the same body shape as createPostingRuleSet (name, eventType, rulesDefinition, createdBy).

        Emits an ACCOUNTING_POSTING_RULE_UPDATE event.

        Returns 409 when a PUBLISHED version already exists, and 400 when the rule set id cannot be resolved (mapped as VALIDATION_ERROR, not 404).

        '
      operationId: updatePostingRuleSet
      parameters:
      - description: Posting rule set identifier
        in: path
        name: postingRuleSetId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Revised draft rules:
                description: Revised draft rules
                value:
                  createdBy: jdoe
                  eventType: INVOICE_FINALIZED
                  name: Invoice posting rules v2
                  rulesDefinition: '{"rules":[{"debit":"1100","credit":"4000","amountField":"totalAmount"}]}'
            schema:
              $ref: '#/components/schemas/PostingRuleSetCreateRequest'
        description: Replacement rule set metadata and draft rules definition.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRuleSetResponse'
          description: Posting rule set updated
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRuleSetResponse'
          description: Posting rule set not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRuleSetResponse'
          description: Cannot modify published rule set
      security:
      - bearerAuth:
        - accounting:posting_rules:create
      summary: Update Posting Rule Set
      tags:
      - Posting Rules
      x-required-permissions:
      - accounting:posting_rules:create
  /v1/accounting/posting-rules/{postingRuleSetId}/archive:
    post:
      description: 'Archives the rule set''s PUBLISHED version (PUBLISHED to ARCHIVED), taking it out of live event-to-journal-entry conversion.

        Use this tool to retire live rules deliberately; do not use publishPostingRuleSet, which already archives the old version automatically when a replacement draft is published.

        Preconditions: the rule set must have a PUBLISHED version; after archiving, events of this type fall back to default GL mappings or fail as UNMAPPED_EVENT_TYPE.

        Required inputs: postingRuleSetId (UUID) as a path parameter; there is no request body.

        Emits an ACCOUNTING_POSTING_RULE_ARCHIVE event.

        Returns 400 when no PUBLISHED version exists to archive.

        '
      operationId: archivePostingRuleSet
      parameters:
      - description: Posting rule set identifier
        in: path
        name: postingRuleSetId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRuleVersionResponse'
          description: Posting rule set archived
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRuleVersionResponse'
          description: No PUBLISHED version to archive
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRuleVersionResponse'
          description: Posting rule set not found
      security:
      - bearerAuth:
        - accounting:posting_rules:archive
      summary: Archive Posting Rule Set
      tags:
      - Posting Rules
      x-required-permissions:
      - accounting:posting_rules:archive
  /v1/accounting/posting-rules/{postingRuleSetId}/publish:
    post:
      description: 'Publishes the rule set''s DRAFT version (DRAFT to PUBLISHED), making it the live conversion definition for its event type; any previously PUBLISHED version is archived atomically in the same call.

        Use this tool to activate reviewed rules; do not use archivePostingRuleSet, which retires the live version without a replacement, and use resolveTestMapping to dry-run the rules first.

        Preconditions: the set must have a DRAFT version with a non-empty rules definition that passes split-group and condition-predicate validation.

        Required inputs: postingRuleSetId (UUID) as a path parameter; there is no request body.

        Emits an ACCOUNTING_POSTING_RULE_PUBLISH event; subsequent accounting events for the event type post through the new version.

        Returns 400 when no DRAFT version exists or its definition is empty, and 422 UNBALANCED_RULES listing every offending condition, group or line in fieldErrors when publish-time validation fails.

        '
      operationId: publishPostingRuleSet
      parameters:
      - description: Posting rule set identifier
        in: path
        name: postingRuleSetId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRuleVersionResponse'
          description: Posting rule set published
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRuleVersionResponse'
          description: No DRAFT version to publish
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRuleVersionResponse'
          description: Posting rule set not found
      security:
      - bearerAuth:
        - accounting:posting_rules:publish
      summary: Publish Posting Rule Set
      tags:
      - Posting Rules
      x-required-permissions:
      - accounting:posting_rules:publish
  /v1/accounting/posting-rules/{postingRuleSetId}/versions:
    get:
      description: 'Lists the version history of one posting rule set with each version''s DRAFT, PUBLISHED or ARCHIVED state and timestamps.

        Use this tool to audit how a rule set evolved; use getPostingRuleSet instead for the set''s current metadata only.

        Preconditions: the posting rule set must exist; a set always has at least its initial version.

        Required inputs: postingRuleSetId (UUID) as a path parameter; page defaults to 0 and size to 10.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 with an empty list when the page index is beyond the version history.

        '
      operationId: listPostingRuleVersions
      parameters:
      - description: Posting rule set identifier
        in: path
        name: postingRuleSetId
        required: true
        schema:
          format: uuid
          type: string
      - description: Page index (0-based)
        in: query
        name: page
        required: false
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
      - description: Page size
        in: query
        name: size
        required: false
        schema:
          default: 10
          exclusiveMinimum: 0
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PostingRuleVersionResponse'
                type: array
          description: Posting rule versions listed
        '404':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PostingRuleVersionResponse'
                type: array
          description: Posting rule set not found
      security:
      - bearerAuth:
        - accounting:posting_rules:view
      summary: List Posting Rule Versions
      tags:
      - Posting Rules
      x-required-permissions:
      - accounting:posting_rules:view
  /v1/accounting/reconciliations:
    get:
      description: 'Lists bank reconciliations most recent first as a paginated projection, optionally filtered by GL account and status.

        Use this tool to find in-progress or finalized reconciliations; do not use getReconciliation, which fetches one reconciliation with its lines by id.

        Preconditions: none beyond the caller holding accounting:reconciliation:view.

        Required inputs: none; glAccountId and status (IN_PROGRESS, FINALIZED) are optional filters, page defaults to 0 and size to 20.

        Emits an ACCOUNTING_RECONCILIATION_LIST audit event; no state changes.

        Returns 200 with an empty page when nothing matches the filters.

        '
      operationId: listReconciliations
      parameters:
      - description: Filter by reconciled GL account id
        in: query
        name: glAccountId
        required: false
        schema:
          format: uuid
          type: string
      - description: Filter by reconciliation status
        in: query
        name: status
        required: false
        schema:
          enum:
          - IN_PROGRESS
          - FINALIZED
          - CANCELLED
          type: string
      - description: Zero-based page index
        example: 0
        in: query
        name: page
        required: false
        schema:
          default: 0
          format: int32
          type: integer
      - description: Page size
        example: 20
        in: query
        name: size
        required: false
        schema:
          default: 20
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankReconciliationListResponse'
          description: Reconciliations listed
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:reconciliation:view permission
      security:
      - bearerAuth:
        - accounting:reconciliation:view
      summary: List Reconciliations
      tags:
      - Bank Reconciliation
      x-required-permissions:
      - accounting:reconciliation:view
  /v1/accounting/reconciliations/adjustment-types:
    get:
      description: 'Returns the supported reconciliation adjustment types with their sign rules (BANK_FEE and NSF_FEE negative-only, INTEREST_EARNED positive-only, OTHER any), so clients never hardcode the enum.

        Use this tool to populate an adjustment picker before calling addReconciliationAdjustment; do not use addReconciliationAdjustment itself just to discover the types.

        Preconditions: none.

        Required inputs: none; there are no parameters and no request body.

        Emits an ACCOUNTING_RECONCILIATION_ADJUSTMENT_TYPES_LIST audit event; no state changes.

        Returns 200 with the full static type list.

        '
      operationId: listReconciliationAdjustmentTypes
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AdjustmentTypeResponse'
                type: array
          description: Adjustment types listed
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:reconciliation:view permission
      security:
      - bearerAuth:
        - accounting:reconciliation:view
      summary: List Reconciliation Adjustment Types
      tags:
      - Bank Reconciliation
      x-required-permissions:
      - accounting:reconciliation:view
  /v1/accounting/reconciliations/import:
    post:
      description: 'Parses a bank statement CSV (columns: date, description, signed amount, reference) for a reconcilable GL cash account and creates an IN_PROGRESS reconciliation whose statement lines start UNMATCHED, snapshotting the GL ending balance from posted journal-entry lines as of the statement date.

        Use this tool to start a reconciliation cycle; do not use matchReconciliation, addReconciliationAdjustment or finalizeReconciliation, which operate on a reconciliation that already exists.

        Preconditions: the GL account must exist with its reconcilable flag set to true.

        Required inputs: glAccountId (UUID), periodStartDate, periodEndDate, statementDate, statementEndingBalance, currency (3-letter ISO code) and the csv text itself.

        Emits an ACCOUNTING_RECONCILIATION_IMPORT event.

        Returns 422 ACCOUNT_NOT_RECONCILABLE when the account''s reconcilable flag is false, and 400 when the CSV is malformed.

        '
      operationId: importReconciliation
      requestBody:
        content:
          application/json:
            examples:
              July statement import:
                description: July statement import
                value:
                  csv: 'date,description,amount,reference

                    2026-07-02,Deposit,500.00,DEP-1

                    2026-07-05,Bank fee,-15.00,FEE-1'
                  currency: USD
                  glAccountId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  periodEndDate: 2026-07-31
                  periodStartDate: 2026-07-01
                  statementDate: 2026-07-31
                  statementEndingBalance: 10250.75
            schema:
              $ref: '#/components/schemas/BankReconciliationImportRequest'
        description: Statement metadata plus the raw CSV text to import for the cash account.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankReconciliationResponse'
          description: Reconciliation created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Request body invalid or CSV malformed (ARGUMENT_NOT_VALID / VALIDATION_ERROR)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:reconciliation:adjust permission
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: GL account is not reconcilable (ACCOUNT_NOT_RECONCILABLE)
      security:
      - bearerAuth:
        - accounting:reconciliation:adjust
      summary: Import Bank Statement CSV
      tags:
      - Bank Reconciliation
      x-required-permissions:
      - accounting:reconciliation:adjust
  /v1/accounting/reconciliations/{reconciliationId}:
    get:
      description: 'Returns one bank reconciliation with its imported statement lines, match state and adjustments.

        Use this tool when the reconciliation id is already known; use listReconciliations instead when searching by account or status, or getReconciliationReport for the balance summary view.

        Preconditions: the reconciliation must exist.

        Required inputs: reconciliationId (UUID) as a path parameter; there is no request body.

        Emits an ACCOUNTING_RECONCILIATION_GET audit event; no state changes.

        Returns 404 RECONCILIATION_NOT_FOUND when the id is unknown.

        '
      operationId: getReconciliation
      parameters:
      - description: Reconciliation id
        in: path
        name: reconciliationId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankReconciliationResponse'
          description: Reconciliation found
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:reconciliation:view permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reconciliation not found (RECONCILIATION_NOT_FOUND)
      security:
      - bearerAuth:
        - accounting:reconciliation:view
      summary: Get Reconciliation
      tags:
      - Bank Reconciliation
      x-required-permissions:
      - accounting:reconciliation:view
  /v1/accounting/reconciliations/{reconciliationId}/adjustments:
    post:
      description: 'Records a signed reconciliation adjustment and posts a real balanced journal entry, debiting or crediting the reconciled cash account against the type''s mapped counter account, through the accounting-period gate.

        Use this tool for bank-only items such as fees or interest that have no GL counterpart; do not use matchReconciliation, which links existing posted GL lines.

        Preconditions: the reconciliation must be IN_PROGRESS, and the amount sign must be permitted for the type (BANK_FEE and NSF_FEE negative, INTEREST_EARNED positive, OTHER any).

        Required inputs: reconciliationId (UUID) as a path parameter, type (BANK_FEE, NSF_FEE, INTEREST_EARNED or OTHER) and a non-zero signed amount; description (max 500 chars) is optional.

        Emits an ACCOUNTING_RECONCILIATION_ADJUSTMENT event and posts a journal entry that changes GL balances.

        Returns 404 RECONCILIATION_NOT_FOUND when the reconciliation is missing, 409 RECONCILIATION_ALREADY_FINALIZED when finalized, and 422 PERIOD_CLOSED, PERIOD_HARD_LOCKED or RECONCILIATION_ADJUSTMENT_SIGN_INVALID for period-gate or sign failures.

        '
      operationId: addReconciliationAdjustment
      parameters:
      - description: Reconciliation id
        in: path
        name: reconciliationId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Bank fee:
                description: Bank fee
                value:
                  amount: -15.0
                  description: Monthly account service fee
                  type: BANK_FEE
            schema:
              $ref: '#/components/schemas/ReconciliationAdjustmentRequest'
        description: Typed, signed adjustment that will post a balanced journal entry.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankReconciliationResponse'
          description: Adjustment recorded and JE posted
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Request body invalid or amount is zero (ARGUMENT_NOT_VALID / VALIDATION_ERROR)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:reconciliation:adjust permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reconciliation not found (RECONCILIATION_NOT_FOUND)
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reconciliation already finalized (RECONCILIATION_ALREADY_FINALIZED)
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Adjustment JE dated into a CLOSED or hard-locked period (PERIOD_CLOSED / PERIOD_HARD_LOCKED), or the amount sign is not permitted for the type — BANK_FEE/NSF_FEE must be negative, INTEREST_EARNED must be positive (RECONCILIATION_ADJUSTMENT_SIGN_INVALID)
      security:
      - bearerAuth:
        - accounting:reconciliation:adjust
      summary: Record Reconciliation Adjustment
      tags:
      - Bank Reconciliation
      x-required-permissions:
      - accounting:reconciliation:adjust
  /v1/accounting/reconciliations/{reconciliationId}/audit:
    get:
      description: 'Returns the time-ordered audit trail of a reconciliation''s actions: import, matches, unmatches, adjustments and finalize, each with the acting user.

        Use this tool when reviewing who did what during a reconciliation; use getReconciliationReport instead for the balance summary.

        Preconditions: the reconciliation must exist.

        Required inputs: reconciliationId (UUID) as a path parameter; there is no request body.

        Emits an ACCOUNTING_RECONCILIATION_AUDIT audit event; no state changes.

        Returns 404 RECONCILIATION_NOT_FOUND when the id is unknown.

        '
      operationId: getReconciliationAudit
      parameters:
      - description: Reconciliation id
        in: path
        name: reconciliationId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationAuditResponse'
          description: Audit trail generated
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:reconciliation:view permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reconciliation not found (RECONCILIATION_NOT_FOUND)
      security:
      - bearerAuth:
        - accounting:reconciliation:view
      summary: Get Reconciliation Audit Trail
      tags:
      - Bank Reconciliation
      x-required-permissions:
      - accounting:reconciliation:view
  /v1/accounting/reconciliations/{reconciliationId}/finalize:
    post:
      description: 'Finalizes a reconciliation (IN_PROGRESS to FINALIZED), locking it against further matching, unmatching or adjustments.

        Use this tool once all lines are matched or adjusted; do not use it while a difference remains, which addReconciliationAdjustment or further matching must clear first.

        Preconditions: the statement ending balance must equal the GL ending balance plus the sum of adjustments within 0.01, matched GL lines being already reflected in the GL ending balance.

        Required inputs: reconciliationId (UUID) as a path parameter; there is no request body.

        Emits an ACCOUNTING_RECONCILIATION_FINALIZE event; FINALIZED is terminal for the reconciliation.

        Returns 404 RECONCILIATION_NOT_FOUND when missing, 409 RECONCILIATION_ALREADY_FINALIZED when already finalized, and 422 RECONCILIATION_NOT_BALANCED carrying the outstanding difference as a field error when it does not balance.

        '
      operationId: finalizeReconciliation
      parameters:
      - description: Reconciliation id
        in: path
        name: reconciliationId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankReconciliationResponse'
          description: Reconciliation finalized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:reconciliation:adjust permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reconciliation not found (RECONCILIATION_NOT_FOUND)
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reconciliation already finalized (RECONCILIATION_ALREADY_FINALIZED)
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reconciliation does not balance (RECONCILIATION_NOT_BALANCED)
      security:
      - bearerAuth:
        - accounting:reconciliation:adjust
      summary: Finalize Reconciliation
      tags:
      - Bank Reconciliation
      x-required-permissions:
      - accounting:reconciliation:adjust
  /v1/accounting/reconciliations/{reconciliationId}/match:
    post:
      description: 'Matches a set of statement lines to a set of posted GL journal-entry lines on the reconciled account (1-to-1 or N-to-1), marking the statement lines MATCHED and recording the linkage.

        Use this tool to pair bank activity with ledger activity; do not use unmatchReconciliation, which reverses a match, and use addReconciliationAdjustment for bank-only items like fees that have no GL counterpart yet.

        Preconditions: the reconciliation must be IN_PROGRESS, every statement line must be UNMATCHED, every GL line must be POSTED and not already reconciled, and the two sets must net to equal signed amounts within 0.01.

        Required inputs: reconciliationId (UUID) as a path parameter plus non-empty statementLineIds and glLineIds lists.

        Emits an ACCOUNTING_RECONCILIATION_MATCH event; no journal entries are created by matching.

        Returns 404 RECONCILIATION_NOT_FOUND when the reconciliation or a line is missing, 409 RECONCILIATION_ALREADY_FINALIZED or RECONCILIATION_LINE_INELIGIBLE for state conflicts, and 422 MATCH_AMOUNT_MISMATCH when the sets do not net.

        '
      operationId: matchReconciliation
      parameters:
      - description: Reconciliation id
        in: path
        name: reconciliationId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              One-to-one match:
                description: One-to-one match
                value:
                  glLineIds:
                  - 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
                  statementLineIds:
                  - 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
            schema:
              $ref: '#/components/schemas/ReconciliationMatchRequest'
        description: Statement-line and GL-line id sets to link; the sets must net to equal amounts.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankReconciliationResponse'
          description: Lines matched
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Request body invalid (ARGUMENT_NOT_VALID / VALIDATION_ERROR)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:reconciliation:adjust permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reconciliation or a referenced line not found (RECONCILIATION_NOT_FOUND)
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reconciliation already finalized (RECONCILIATION_ALREADY_FINALIZED), or a statement/GL line is ineligible — not UNMATCHED, not POSTED, or already reconciled (RECONCILIATION_LINE_INELIGIBLE)
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Matched sets do not net to equal amounts (MATCH_AMOUNT_MISMATCH)
      security:
      - bearerAuth:
        - accounting:reconciliation:adjust
      summary: Match Statement Lines To GL Lines
      tags:
      - Bank Reconciliation
      x-required-permissions:
      - accounting:reconciliation:adjust
  /v1/accounting/reconciliations/{reconciliationId}/report:
    get:
      description: 'Returns the reconciliation report: opening GL and closing statement balances, matched versus outstanding lines, adjustments and the outstanding difference.

        Use this tool to see how far a reconciliation is from balancing before finalizeReconciliation; use getReconciliation instead for the raw line-level detail.

        Preconditions: the reconciliation must exist.

        Required inputs: reconciliationId (UUID) as a path parameter; there is no request body.

        Emits an ACCOUNTING_RECONCILIATION_REPORT audit event; no state changes.

        Returns 404 RECONCILIATION_NOT_FOUND when the id is unknown.

        '
      operationId: getReconciliationReport
      parameters:
      - description: Reconciliation id
        in: path
        name: reconciliationId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationReportResponse'
          description: Report generated
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:reconciliation:view permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reconciliation not found (RECONCILIATION_NOT_FOUND)
      security:
      - bearerAuth:
        - accounting:reconciliation:view
      summary: Get Reconciliation Report
      tags:
      - Bank Reconciliation
      x-required-permissions:
      - accounting:reconciliation:view
  /v1/accounting/reconciliations/{reconciliationId}/unmatch:
    post:
      description: 'Reverses a previously recorded match, returning the affected statement lines to UNMATCHED and releasing the linked GL lines for re-matching.

        Use this tool to correct a wrong pairing while the reconciliation is still IN_PROGRESS; do not use matchReconciliation, which records new matches.

        Preconditions: the reconciliation must not be FINALIZED, and either the matchId or the statementLineIds must resolve to exactly one match group.

        Required inputs: reconciliationId (UUID) as a path parameter plus matchId or statementLineIds in the body (one of the two is required).

        Emits an ACCOUNTING_RECONCILIATION_UNMATCH event.

        Returns 404 RECONCILIATION_NOT_FOUND when the reconciliation or match group is missing, 409 RECONCILIATION_ALREADY_FINALIZED when finalized, and 400 when neither identifier resolves to a single match group.

        '
      operationId: unmatchReconciliation
      parameters:
      - description: Reconciliation id
        in: path
        name: reconciliationId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Unmatch by match id:
                description: Unmatch by match id
                value:
                  matchId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5d
            schema:
              $ref: '#/components/schemas/ReconciliationUnmatchRequest'
        description: Match group to reverse, identified by matchId or by its statement line ids.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankReconciliationResponse'
          description: Match reversed
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Neither matchId nor statementLineIds resolved to a single match group (VALIDATION_ERROR)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:reconciliation:adjust permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reconciliation or match group not found (RECONCILIATION_NOT_FOUND)
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reconciliation already finalized (RECONCILIATION_ALREADY_FINALIZED)
      security:
      - bearerAuth:
        - accounting:reconciliation:adjust
      summary: Reverse A Reconciliation Match
      tags:
      - Bank Reconciliation
      x-required-permissions:
      - accounting:reconciliation:adjust
  /v1/accounting/reports/export:
    get:
      description: 'Lists all asynchronous report export jobs as a paginated projection, most recent first.

        Use this tool to review past exports and their statuses; do not use getReportExportStatus, which polls a single job by id.

        Preconditions: none beyond the caller holding accounting:report:export.

        Required inputs: none; the page defaults to 20 items and only requestedAt is a supported sort property.

        Emits an ACCOUNTING_REPORT_EXPORT_LIST audit event; no state changes.

        Returns 400 when an unsupported sort property is requested.

        '
      operationId: listReportExports
      parameters:
      - description: Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: The size of the page to be returned
        in: query
        name: size
        required: false
        schema:
          default: 20
          minimum: 1
          type: integer
      - description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
        in: query
        name: sort
