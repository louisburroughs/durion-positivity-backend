          minimum: 0
          type: integer
      - description: The size of the page to be returned
        in: query
        name: size
        required: false
        schema:
          default: 20
          minimum: 1
          type: integer
      - description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
        in: query
        name: sort
        required: false
        schema:
          default:
          - requestedAt,DESC
          items:
            type: string
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageExportJobResponse'
          description: Export history returned
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden
      security:
      - bearerAuth:
        - accounting:export:view
      summary: List Export Job History
      tags:
      - Accounting Exports
      x-required-permissions:
      - accounting:export:view
  /v1/accounting/export/status/{jobId}:
    get:
      description: 'Returns the current status of one timekeeping or generic export job.

        Use this tool to poll a job created by requestExport; use listExportHistory instead to browse all past jobs.

        Preconditions: the export job must exist.

        Required inputs: jobId (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

