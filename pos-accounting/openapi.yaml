components:
  schemas:
    PostingRuleSetCreateRequest:
      type: object
      description: Request payload for creating a new posting rule set
      properties:
        name:
          type: string
          description: Display name of the posting rule set
          example: Workorder Revenue Posting
          maxLength: 100
          minLength: 0
        eventType:
          type: string
          description: Accounting event type the rule set applies to
          example: WORKORDER_COMPLETED
          maxLength: 100
          minLength: 0
        description:
          type: string
          description: Optional human-readable description of the rule set
          example: Posts revenue and tax for completed workorders
          maxLength: 500
          minLength: 0
        rulesDefinition:
          type: string
          description: Serialized rules definition (JSON) describing GL mapping logic
          example:
            debit: 1200-100
            credit: '4000'
          minLength: 1
        createdBy:
          type: string
          description: Identifier of the user creating the rule set
          example: ap.manager
          maxLength: 50
          minLength: 0
      required:
      - createdBy
      - eventType
      - name
      - rulesDefinition
    PostingRuleSetResponse:
      type: object
      description: Posting rule set with its versions and audit metadata
      properties:
        postingRuleSetId:
          type: string
          format: uuid
          description: Unique identifier of the posting rule set
          example: 01960003-0000-7000-8000-000000000001
        name:
          type: string
          description: Display name of the posting rule set
          example: Workorder Revenue Posting
        eventType:
          type: string
          description: Accounting event type the rule set applies to
          example: WORKORDER_COMPLETED
        description:
          type: string
          description: Human-readable description of the rule set
          example: Posts revenue and tax for completed workorders
        versions:
          type: array
          description: Versions belonging to this posting rule set
          items:
            $ref: '#/components/schemas/PostingRuleVersionResponse'
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the rule set was created (ISO 8601)
          example: 2026-06-18 08:00:00+00:00
        createdBy:
          type: string
          description: Identifier of the user who created the rule set
          example: ap.manager
        modifiedAt:
          type: string
          format: date-time
          description: Timestamp when the rule set was last modified (ISO 8601)
          example: 2026-06-18 09:30:00+00:00
        modifiedBy:
          type: string
          description: Identifier of the user who last modified the rule set
          example: ap.lead
      required:
      - postingRuleSetId
    PostingRuleVersionResponse:
      type: object
      description: A single version of a posting rule set
      properties:
        versionId:
          type: string
          format: uuid
          description: Unique identifier of the rule version
          example: 01960003-0000-7000-8000-000000000002
        postingRuleSetId:
          type: string
          format: uuid
          description: Identifier of the owning posting rule set
          example: 01960003-0000-7000-8000-000000000001
        versionNumber:
          type: integer
          format: int32
          description: Sequential version number within the rule set
          example: 3
        state:
          type: string
          description: Lifecycle state of the version
          enum:
          - DRAFT
          - PUBLISHED
          - ARCHIVED
          example: PUBLISHED
        rulesDefinition:
          type: string
          description: Serialized rules definition (JSON) for this version
          example:
            debit: 1200-100
            credit: '4000'
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the version was created (ISO 8601)
          example: 2026-06-18 08:00:00+00:00
        createdBy:
          type: string
          description: Identifier of the user who created the version
          example: ap.manager
        modifiedAt:
          type: string
          format: date-time
          description: Timestamp when the version was last modified (ISO 8601)
          example: 2026-06-18 09:30:00+00:00
        modifiedBy:
          type: string
          description: Identifier of the user who last modified the version
          example: ap.lead
      required:
      - postingRuleSetId
      - versionId
    PostingCategoryUpdateRequest:
      type: object
      description: Request payload for updating an existing posting category
      properties:
        categoryName:
          type: string
          description: Name of the posting category
          example: Customer Payments
          maxLength: 100
          minLength: 0
        description:
          type: string
          description: Optional description of the posting category
          example: Categories for cleared customer payments
          maxLength: 500
          minLength: 0
        modifiedBy:
          type: string
          description: Identifier of the user modifying the posting category
          example: asmith
