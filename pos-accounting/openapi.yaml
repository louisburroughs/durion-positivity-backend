    GLAccountCreateRequest:
      type: object
      description: Request to create a new GL account
      properties:
        accountCode:
          type: string
          description: 'Account code in #### or ####-### format'
          example: '4000'
          minLength: 1
          pattern: ^\d{4}(-\d{3})?$
        accountName:
          type: string
          description: Display name of the GL account
          example: Service Revenue
          minLength: 1
        accountType:
          type: string
          description: Type of the GL account
          enum:
          - ASSET
          - LIABILITY
          - EQUITY
          - REVENUE
          - EXPENSE
          example: REVENUE
        accountSubtype:
          type: string
          description: Optional subtype refining accountType for report grouping and posting-config plausibility checks (e.g. UNDEPOSITED_FUNDS for the cash-receipt clearing account). Null when no refinement applies.
          enum:
          - RECEIVABLE
          - PAYABLE
          - BANK_CASH
          - UNDEPOSITED_FUNDS
          - TAX_PAYABLE
          - CURRENT_ASSET
          - FIXED_ASSET
          - CURRENT_LIABILITY
          - SALES
          - COST_OF_SALES
          - OPERATING_EXPENSE
          - OTHER
          example: UNDEPOSITED_FUNDS
        reconcilable:
          type: boolean
          default: false
          description: Whether journal entry lines on this account participate in reconciliation (e.g. settlement/bank reconciliation). Defaults to false when omitted.
          example: false
        description:
          type: string
          description: Optional description of the account
          example: Revenue from service work
        parentAccountId:
          type: string
          format: uuid
          description: Identifier of the parent account, if any
          example: 01960003-0000-7000-8000-000000000001
        activationDate:
          type: string
          format: date-time
          description: Date and time the account becomes active (ISO 8601)
          example: 2026-06-18 08:00:00
      required:
      - accountCode
      - accountName
      - accountType
      - activationDate
    GLAccountActivateRequest:
      type: object
      description: Request to activate a GL account
      properties:
        effectiveDate:
          type: string
          format: date
          description: Date the activation takes effect (ISO 8601 date)
          example: 2026-06-18
      required:
      - effectiveDate
    ExportJobRequest:
