          - NOT_YET_ACTIVE
          example: ACTIVE
        createdAt:
          type: string
          format: date-time
          description: Created timestamp
          example: 2026-06-18 08:00:00+00:00
        createdBy:
          type: string
          description: Created by username
          example: accounting.user
        modifiedAt:
          type: string
          format: date-time
          description: Last modified timestamp
          example: 2026-06-18 08:00:00+00:00
        modifiedBy:
          type: string
          description: Last modified by username
          example: accounting.user
        version:
