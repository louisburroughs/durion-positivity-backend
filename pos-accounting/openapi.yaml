    put:
      description: 'Renames a mapping key or changes its description; the key stays in its posting category.

        Use this tool to correct a key''s name or description; do not use deactivateMappingKey, which retires the key from future mapping use.

        Preconditions: the mapping key must exist, and a changed name must not collide with another key in the same category.

        Required inputs: mappingKeyId (UUID) as a path parameter, keyName (max 100 chars) and modifiedBy (max 50 chars); description is optional.

        Emits an ACCOUNTING_MAPPING_KEY_UPDATE event.

        Returns 404 when the mapping key does not exist, and 400 when the new name already exists in the category.

        '
      operationId: updateMappingKey
      parameters:
      - description: Mapping key identifier
        in: path
        name: mappingKeyId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Rename key:
                description: Rename key
                value:
                  description: Cash drawer tender postings
                  keyName: TENDER_CASH_DRAWER
                  modifiedBy: jdoe
            schema:
              $ref: '#/components/schemas/MappingKeyUpdateRequest'
        description: Replacement name and description for the mapping key.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingKeyResponse'
          description: Mapping key updated
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request or duplicate name
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Mapping key not found
      security:
      - bearerAuth:
        - accounting:mapping-key:edit
      summary: Update Mapping Key
      tags:
      - Mapping Keys
      x-required-permissions:
      - accounting:mapping-key:edit
  /v1/accounting/mapping-keys/{mappingKeyId}/deactivate:
    post:
      description: 'Deactivates a mapping key so it can no longer be attached to new GL mappings; the record is retained.

        Use this tool to retire an unused key; do not use deactivatePostingCategory, which retires the whole parent category.

        Preconditions: the mapping key must exist and have no active GL mappings attached.

        Required inputs: mappingKeyId (UUID) as a path parameter; there is no request body.

        Emits an ACCOUNTING_MAPPING_KEY_DEACTIVATE event.

        Returns 404 when the mapping key does not exist, 409 when active GL mappings still reference it, and 204 with no body on success.

        '
      operationId: deactivateMappingKey
      parameters:
      - description: Mapping key identifier
        in: path
        name: mappingKeyId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: Mapping key deactivated
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Mapping key not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Cannot deactivate - active mappings exist
      security:
      - bearerAuth:
        - accounting:mapping-key:deactivate
      summary: Deactivate Mapping Key
      tags:
      - Mapping Keys
      x-required-permissions:
      - accounting:mapping-key:deactivate
  /v1/accounting/mappings:
    post:
      description: 'Creates a date-effective mapping from a source-system external code to a GL account, used when posting events that carry external codes.

        Use this tool to register how an upstream system''s code lands in the ledger; do not use createDefaultMapping, which sets the fallback debit and credit pair for an event type without explicit rules.

        Preconditions: the target GL account must exist and be active, and the new effective date range must not overlap an existing mapping for the same sourceSystem and externalCode.

        Required inputs: sourceSystem, externalCode, glAccountId (UUID) and effectiveStartDate; effectiveEndDate defaults to null (open-ended) and dimensions are optional.

        Emits an ACCOUNTING_GL_MAPPING_CREATE event; a cash-receipt code mapped to an implausible account subtype logs a non-blocking warning.

        Returns 400 when the GL account is missing or inactive, or when the effective dates overlap an existing mapping.

        '
      operationId: createGLMapping
      requestBody:
        content:
          application/json:
            examples:
              POS cash code mapping:
                description: POS cash code mapping
                value:
                  effectiveStartDate: '2026-01-01T00:00:00'
                  externalCode: CASH_RECEIPT
                  glAccountId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  sourceSystem: POS
            schema:
              $ref: '#/components/schemas/GLMappingCreateRequest'
        description: Date-effective external-code-to-GL-account mapping to create.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GLMappingCreateResponse'
          description: GL mapping created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request payload
      security:
      - bearerAuth:
        - accounting:gl-mapping:create
      summary: Create GL Mapping
      tags:
      - GL Mapping API
      x-required-permissions:
      - accounting:gl-mapping:create
  /v1/accounting/mappings/resolve:
    post:
      description: 'Resolves a source-system external code to the GL account whose mapping is effective on the supplied transaction date.

        Use this tool to look up where a coded transaction will post; do not use resolveTestMapping, which dry-runs full posting-rule evaluation for an event payload rather than a single code lookup.

        Preconditions: a mapping must exist for the sourceSystem and externalCode whose effective date range covers the transaction date.

        Required inputs: sourceSystem, externalCode and transactionDate (ISO date-time); there are no optional fields.

        Emits an ACCOUNTING_GL_MAPPING_RESOLVE audit event; no mappings or entries are created.

        Returns 400 when no mapping is effective for the code on that date.

        '
      operationId: resolveGLMapping
      requestBody:
        content:
          application/json:
            examples:
              Resolve POS cash code:
                description: Resolve POS cash code
                value:
                  externalCode: CASH_RECEIPT
                  sourceSystem: POS
                  transactionDate: '2026-08-13T00:00:00'
            schema:
              $ref: '#/components/schemas/GLMappingResolveRequest'
        description: External code and transaction date to resolve against effective mappings.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GLMappingResolveResponse'
          description: GL mapping resolved
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request payload
      security:
      - bearerAuth:
        - accounting:gl-mapping:resolve
      summary: Resolve GL Mapping
      tags:
      - GL Mapping API
      x-required-permissions:
      - accounting:gl-mapping:resolve
  /v1/accounting/mappings/resolve-test:
    post:
      description: 'Resolves a hypothetical accounting event against the published posting rules and GL mappings, returning the matched rule (id, name, version), the exact journal entry lines the evaluator would post including proportional split-line shares and residual distribution, and per-predicate evaluation outcomes.

        Use this tool to inspect what a rule set would do before real events arrive; do not use resolveGLMapping, which only resolves a single external code to one account.

        Preconditions: a PUBLISHED posting rule set should exist, though a no-match outcome is a normal 200 response with matched=false rather than an error.

        Required inputs: eventType and transactionDate (ISO date); samplePayload is an optional JSON object evaluated by the rule predicates.

        Emits an ACCOUNTING_MAPPING_RESOLVE_TEST audit event only; nothing is persisted, and no accounting event, journal entry or outbox record is created.

        Returns 400 when the sample payload cannot be interpreted by the rules.

        '
      operationId: resolveTestMapping
      requestBody:
        content:
          application/json:
            examples:
              Invoice finalized dry run:
                description: Invoice finalized dry run
                value:
                  eventType: INVOICE_FINALIZED
                  samplePayload:
                    taxAmount: 10.5
                    totalAmount: 150.0
                  transactionDate: '2026-08-13'
            schema:
              $ref: '#/components/schemas/MappingResolutionTestRequest'
        description: Hypothetical event type, sample payload and date to evaluate against published rules.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingResolutionTestResponse'
          description: Dry-run resolution completed (matched=false when no published rule matched)
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request payload, or the sample payload could not be interpreted by the rules
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Missing or invalid authentication
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:posting_rules:view permission
      security:
      - bearerAuth:
        - accounting:posting_rules:view
      summary: Dry-Run Mapping Rule Resolution
      tags:
      - GL Mapping API
      x-required-permissions:
      - accounting:posting_rules:view
  /v1/accounting/payment-applications:
    get:
      description: 'Lists pos-accounting cash applications of customer payments to invoices whose applied date falls in [appliedFrom, appliedTo], ordered by appliedAt ascending.

        Use this tool to review A/R cash application activity in a period; do not use getPaymentLagCohorts or getCollectionsAnalytics for this, which are aggregate reports rather than a row-level application list, and note this endpoint is SCOPED TO pos-accounting cash applications only — it does not include pos-invoice deposit-credit draw-downs (DepositCreditApplication) or refunds (RefundRecord); see issue #1605 for that open cross-module question.

        Preconditions: none beyond the caller holding accounting:analytics:view.

        Required inputs: appliedFrom and appliedTo (ISO dates, appliedTo on or after appliedFrom); the window cannot exceed 366 days, to bound the scan. includeReversed is optional and defaults to false, in which case applications later reversed via PaymentApplicationReversal are EXCLUDED from the list entirely (not merely flagged); pass includeReversed=true to include them, with each row''s reversed field then reporting whether that application was reversed. That exclusion default is a DELIBERATELY DIFFERENT basis from getCollectionsAnalytics, which nets reversals on a movement basis (reducing the window a reversal was recorded in rather than the window its application landed in) because it measures movement in a window while this endpoint answers the point-in-time question of which applications are currently live; do not unify the two. page/size/sort are standard, though the appliedAt-ascending sort is server-controlled and any caller-supplied sort is ignored.

        Emits an ACCOUNTING_PAYMENT_APPLICATION_LIST_VIEW audit event; no state changes.

        Returns 400 when appliedTo is before appliedFrom or the window exceeds 366 days.

        '
      operationId: listPaymentApplications
      parameters:
      - description: Applied-date window start (YYYY-MM-DD)
        example: '2026-06-01'
        in: query
        name: appliedFrom
        required: true
        schema:
          format: date
          type: string
      - description: Applied-date window end (YYYY-MM-DD)
        example: '2026-06-30'
        in: query
        name: appliedTo
        required: true
        schema:
          format: date
          type: string
      - description: 'Include applications later reversed, flagged via the row''s reversed field (default false: reversed applications are excluded entirely)'
        example: false
        in: query
        name: includeReversed
        required: false
        schema:
          default: false
          type: boolean
      - description: Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: The size of the page to be returned
        in: query
        name: size
        required: false
        schema:
          default: 20
          minimum: 1
          type: integer
      - description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
        in: query
        name: sort
        required: false
        schema:
          items:
            type: string
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagePaymentApplicationListRow'
          description: Payment applications retrieved successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid date range or window too wide
      security:
      - bearerAuth:
        - accounting:analytics:view
      summary: List Payment Applications By Applied Date
      tags:
      - Payment Applications
      x-required-permissions:
      - accounting:analytics:view
  /v1/accounting/payment-applications/automatic:
    get:
      description: 'Lists the payment applications made automatically since an instant, newest first: a settled payment applied to the invoice it was taken against, or an INVOICE_PAYMENT event applied to its invoice, each with the invoice number, the customer''s name and any credit kept.

        Use this tool to review what was matched without a person and to undo one with reversePaymentApplication; use listUnappliedPayments instead for payments still waiting to be matched.

        Preconditions: the caller needs accounting:payment:apply authority; UNDO is offered only to holders of accounting:payment:reverse and only while the application is not reversed.

        Required inputs: since (ISO-8601 instant, at most 31 days back); page (0 or more) and size (1 to 100, default 50) are optional query parameters.

        Emits an ACCOUNTING_PAYMENT_APPLICATION_AUTOMATIC_LIST_VIEW event and changes no state; totalElements counts every automatic application since the instant, reversed ones included.

        Returns 400 VALIDATION_ERROR when since is missing, unparsable or more than 31 days back or size is outside 1 to 100, and 403 when the caller lacks the authority.

        '
      operationId: listAutomaticPaymentApplications
      parameters:
      - description: Only applications made at or after this instant (ISO-8601), at most 31 days back
        example: '2026-10-05T00:00:00Z'
        in: query
        name: since
        required: true
        schema:
          type: string
      - description: Page index (0-based)
        example: 0
        in: query
        name: page
        required: false
        schema:
          default: 0
          format: int32
          type: integer
      - description: Page size, 1 to 100
        example: 50
        in: query
        name: size
        required: false
        schema:
          default: 50
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomaticPaymentApplicationsPage'
          description: A page of automatic payment applications, newest first
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'VALIDATION_ERROR: since missing, unparsable or more than 31 days back, or size outside 1-100'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks accounting:payment:apply
      security:
      - bearerAuth:
        - accounting:payment:apply
      summary: List Payment Applications Made Automatically
      tags:
      - Payment Applications
      x-required-permissions:
      - accounting:payment:apply
  /v1/accounting/payment-applications/{applicationId}/reverse:
    post:
      description: 'Reverses one payment application as a new compensating record, restoring the invoice''s balance and the payment''s unapplied amount.

        Use this tool for an application that settled a single invoice; do not use it on an application created by a multi-invoice apply request, which must be reversed as a whole via reversePayment.

        Preconditions: the application must exist, must not already be reversed, and must not belong to a multi-application request.

        Required inputs: applicationId (UUID) as a path parameter and a reason of 10 to 1000 characters for the audit trail; the caller needs accounting:payment:reverse authority.

        Emits an ACCOUNTING_PAYMENT_APPLICATION_REVERSE event; the reversal is a new record, not a deletion.

        Returns 404 when the application is not found, 409 when it is already reversed, 422 WHOLE_REQUEST_REVERSAL_REQUIRED when it belongs to a multi-application request, and 204 with no body on success.

        '
      operationId: reversePaymentApplication
      parameters:
      - description: Payment application identifier
        in: path
        name: applicationId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Reverse one application:
                description: Reverse one application
                value:
                  reason: Applied to invoice with disputed line items
            schema:
              $ref: '#/components/schemas/PaymentApplicationReversalRequest'
        description: Audit reason for reversing this single payment application.
        required: true
      responses:
        '204':
          description: Payment application reversed
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request or already reversed
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Payment application not found
      security:
      - bearerAuth:
        - accounting:payment:reverse
      summary: Reverse Payment Application
      tags:
      - Payment Applications
      x-required-permissions:
      - accounting:payment:reverse
  /v1/accounting/payments/{paymentId}/applications:
    post:
      description: 'Applies a receivable payment to one or more invoices atomically, updating each invoice''s balance and status and reducing the payment''s unapplied amount.

        Use this tool to settle invoices from an available payment; do not use applyCustomerCredit, which draws down a standing credit rather than a payment.

        Preconditions: the payment must be AVAILABLE with sufficient unapplied funds, and every target invoice must be applicable (not paid in full, voided or cancelled); an overpayment creates a CustomerCredit for the excess.

        Required inputs: paymentId (UUID) as a path parameter, applicationRequestId (max 100 chars, the idempotency key) and a non-empty applications list of invoiceId plus amountToApply (min 0.01); allocationStrategy is optional, CALLER_ORDER when omitted or OLDEST_FIRST to allocate by ascending invoice date.

        Emits an ACCOUNTING_PAYMENT_APPLY event; the application is atomic across all invoices and idempotent on applicationRequestId.

        Returns 404 when the payment is not found, 400 for insufficient funds, 409 for an inapplicable invoice, 422 CURRENCY_NOT_SUPPORTED for a payment in a currency other than the ledger''s (nothing is written), and 503 when the invoice service is unreachable.

        '
      operationId: applyPayment
      parameters:
      - description: Payment identifier
        in: path
        name: paymentId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Apply to two invoices oldest first:
                description: Apply to two invoices oldest first
                value:
                  allocationStrategy: OLDEST_FIRST
                  applicationRequestId: apply-2026-08-13-042
                  applications:
                  - amountToApply: 100.0
                    invoiceId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  - amountToApply: 50.0
                    invoiceId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
            schema:
              $ref: '#/components/schemas/PaymentApplicationRequest'
        description: Idempotent, atomic allocation of the payment across one or more invoices.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentApplicationResponse'
          description: Payment applied successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request or insufficient funds
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Payment not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invoice not applicable
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'CURRENCY_NOT_SUPPORTED: the payment is in a currency other than the ledger''s; nothing is written (ADR-0067 PC-9)'
      security:
      - bearerAuth:
        - accounting:payment:apply
      summary: Apply Payment To Invoices
      tags:
      - Payment Applications
      x-required-permissions:
      - accounting:payment:apply
  /v1/accounting/payments/{paymentId}/remainder-credit:
    post:
      description: 'Converts the whole unapplied remainder of a receivable payment into a customer credit in one transaction: the credit is created, the Dr Undeposited Funds / Cr Customer Credit Liability issuance is enqueued, and the payment becomes FULLY_APPLIED.

        Use this tool after applyPayment when the customer keeps the leftover on account, or when the credit will be refunded next with refundCustomerCredit; do not use applyCustomerCredit, which draws down a credit that already exists.

        Preconditions: the payment must be AVAILABLE, in the ledger currency, and still carry exactly expectedAmount unapplied; a replay with the same requestId returns the credit it issued and writes nothing.

        Required inputs: paymentId (UUID) as a path parameter, requestId (max 100 chars, the idempotency key) and expectedAmount (the unapplied amount the caller read, min 0.01).

        Emits an ACCOUNTING_PAYMENT_REMAINDER_CREDIT event; the credit''s creator and the issuance entry''s actor come from the security context.

        Returns 201 with the credit, 404 PAYMENT_NOT_FOUND when the payment does not exist, 409 PAYMENT_NOT_AVAILABLE when it is already fully applied, 409 IDEMPOTENCY_CONFLICT when the requestId was used on another payment, 409 OPTIMISTIC_LOCK after a second concurrent update, 422 PAYMENT_REMAINDER_CHANGED when expectedAmount no longer matches (re-read the payment), and 422 CURRENCY_NOT_SUPPORTED for a payment in another currency.

        '
      operationId: creditPaymentRemainder
      parameters:
      - description: Payment identifier
        in: path
        name: paymentId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Keep 12.50 as credit:
                description: Keep 12.50 as credit
                value:
                  expectedAmount: 12.5
                  requestId: remainder-2026-10-06-017
            schema:
              $ref: '#/components/schemas/RemainderCreditRequest'
        description: Idempotency key and the unapplied amount the caller expects to credit.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemainderCreditResponse'
          description: Remainder credited; a replay returns the same credit
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'VALIDATION_ERROR: requestId missing or too long, expectedAmount missing or below 0.01'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: PAYMENT_NOT_FOUND
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: PAYMENT_NOT_AVAILABLE, IDEMPOTENCY_CONFLICT or OPTIMISTIC_LOCK
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: PAYMENT_REMAINDER_CHANGED or CURRENCY_NOT_SUPPORTED; nothing is written
      security:
      - bearerAuth:
        - accounting:payment:apply
      summary: Keep Payment Remainder As Customer Credit
      tags:
      - Payment Applications
      x-required-permissions:
      - accounting:payment:apply
  /v1/accounting/payments/{paymentId}/reverse:
    post:
      description: 'Reverses every application of a receivable payment as new compensating records, restoring each invoice''s balance and the payment''s unapplied amount.

        Use this tool to back out a whole applied payment, which is also the required path for multi-invoice applications; do not use reversePaymentApplication, which reverses one single-invoice application, and do not use voidPaymentApplication, which only handles never-applied payments.

        Preconditions: the payment must exist and have at least one application; already-reversed applications are skipped rather than double-reversed.

        Required inputs: paymentId (UUID) as a path parameter and a reason of 10 to 1000 characters for the audit trail.

        Emits an ACCOUNTING_PAYMENT_REVERSE event; reversals are new records, never deletions.

        Returns 404 when the payment is not found, 409 when it has no applications to reverse, and 204 with no body on success.

        '
      operationId: reversePayment
      parameters:
      - description: Payment identifier
        in: path
        name: paymentId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Reverse misapplied payment:
                description: Reverse misapplied payment
                value:
                  reason: Payment applied to the wrong customer account
            schema:
              $ref: '#/components/schemas/PaymentApplicationReversalRequest'
        description: Audit reason for reversing all of the payment's applications.
        required: true
      responses:
        '204':
          description: Payment applications reversed
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Payment not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Payment has no applications to reverse
      security:
      - bearerAuth:
        - accounting:ap:pay
      summary: Reverse Payment
      tags:
      - Payment Applications
      x-required-permissions:
      - accounting:ap:pay
  /v1/accounting/payments/{paymentId}/void:
    post:
      description: 'Voids a receivable payment that has not been applied to any invoice, zeroing its unapplied amount so it can never be applied.

        Use this tool for a payment recorded in error before any application; do not use reversePayment, which backs out a payment whose applications already exist.

        Preconditions: the payment must exist and have no invoice applications; voiding an already-voided payment is a no-op.

        Required inputs: paymentId (UUID) as a path parameter; the request body is optional and ignored.

        Emits an ACCOUNTING_PAYMENT_VOID event.

        Returns 404 when the payment is not found, 409 when invoice applications already exist (reverse those first), and 204 with no body on success.

        '
      operationId: voidPaymentApplication
      parameters:
      - description: Payment identifier
        in: path
        name: paymentId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Empty body:
                description: Empty body
            schema:
              type: object
        description: Optional and ignored; send an empty object or omit the body entirely.
      responses:
        '204':
          description: Payment voided
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Payment not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Payment already applied; reverse applications first
      security:
      - bearerAuth:
        - accounting:ap:pay
      summary: Void Payment
      tags:
      - Payment Applications
      x-required-permissions:
      - accounting:ap:pay
  /v1/accounting/periods:
    get:
      description: 'Lists all known accounting periods with their OPEN or CLOSED status, most recent first (descending period code).

        Use this tool to review period statuses before closing or reopening a period; do not use closeAccountingPeriod or reopenAccountingPeriod, which perform the state transitions.

        Preconditions: none; periods are auto-provisioned on first posting, so months never posted into may be absent, and an absent month counts as OPEN for posting purposes.

        Required inputs: none; there are no parameters and no request body.

        Emits an ACCOUNTING_PERIOD_LIST audit event; nothing is created or changed by this call.

        Returns 200 with an empty list when no period has ever been provisioned.

        '
      operationId: listAccountingPeriods
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AccountingPeriodResponse'
                type: array
          description: Accounting periods listed, most recent first
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:period:view permission
      security:
      - bearerAuth:
        - accounting:period:view
      summary: List Accounting Periods
      tags:
      - Accounting Periods
      x-required-permissions:
      - accounting:period:view
  /v1/accounting/periods/bank-reconciliation-policy:
    get:
      description: 'Returns the tenant''s effective bank reconciliation policy: closePolicy, closeScope, closeCoverageLagDays, allowSelfApproval and otherApprovalThreshold (null while unset), with the functional currency of the threshold and who changed a setting last.

        Use this tool to see how period close treats unreconciled bank accounts; use setBankReconciliationPolicy instead to change it.

        Preconditions: none; a setting never written reads as its default (REQUIRED_WITH_EXCEPTION, BANK_CASH_SUBTYPE, 0, false, unset).

        Required inputs: none; there are no parameters and no request body.

        Emits an ACCOUNTING_PERIOD_BANK_REC_POLICY_VIEW audit event; nothing is changed.

        Returns 200 with the five effective values; updatedAt and updatedBy are null until the policy is first changed.

        '
      operationId: getBankReconciliationPolicy
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankReconciliationPolicyResponse'
          description: Effective bank reconciliation policy
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:period:view permission
      security:
      - bearerAuth:
        - accounting:period:view
      summary: Get Bank Reconciliation Policy
      tags:
      - Accounting Periods
      x-required-permissions:
      - accounting:period:view
    put:
      description: 'Replaces the tenant''s bank reconciliation policy: closePolicy (ADVISORY, REQUIRED_WITH_EXCEPTION or REQUIRED), closeScope (BANK_CASH_SUBTYPE or ALL_RECONCILABLE), closeCoverageLagDays (integer >= 0), allowSelfApproval (boolean) and otherApprovalThreshold (amount >= 0 in the functional currency, or null to unset it).

        Use this tool when Finance changes how period close treats unreconciled bank accounts, whether preparers may approve their own reconciliations, or the OTHER adjustment approval threshold; do not use it just to read the current values (use getBankReconciliationPolicy instead).

        Preconditions: the caller holds accounting:period:hard_lock, the governance level of the hard lock.

        Required inputs: all six body fields, including otherApprovalThreshold (null clears it) and a justification of at least 10 characters.

        Emits an ACCOUNTING_PERIOD_BANK_REC_POLICY_SET event and writes one BANK_REC_POLICY_SET audit row per setting whose value changes (old and new value, justification); an unchanged setting writes nothing.

        Returns 400 VALIDATION_ERROR for a missing field, an unknown value, a negative number or a blank justification, 400 JUSTIFICATION_REQUIRED for a justification of 1 to 9 characters, and 422 AMOUNT_PRECISION_EXCEEDS_CURRENCY when otherApprovalThreshold has more decimal places than the functional currency''s minor unit (it is refused, never rounded).

        '
      operationId: setBankReconciliationPolicy
      requestBody:
        content:
          application/json:
            examples:
              Mid-month cycles:
                description: Mid-month cycles
                value:
                  allowSelfApproval: false
                  closeCoverageLagDays: 31
                  closePolicy: REQUIRED_WITH_EXCEPTION
                  closeScope: BANK_CASH_SUBTYPE
                  justification: Bank statements end mid-month
                  otherApprovalThreshold: 250.0
            schema:
              $ref: '#/components/schemas/BankReconciliationPolicyRequest'
        description: The five settings with the audit justification.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankReconciliationPolicyResponse'
          description: Policy stored; the effective policy is returned
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: A field is missing or invalid (VALIDATION_ERROR), or the justification is shorter than 10 characters (JUSTIFICATION_REQUIRED)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:period:hard_lock permission
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: otherApprovalThreshold has more decimal places than the functional currency allows (AMOUNT_PRECISION_EXCEEDS_CURRENCY, fieldErrors[otherApprovalThreshold])
      security:
      - bearerAuth:
        - accounting:period:hard_lock
      summary: Set Bank Reconciliation Policy
      tags:
      - Accounting Periods
      x-required-permissions:
      - accounting:period:hard_lock
  /v1/accounting/periods/hard-lock:
    get:
      description: 'Returns the org-level hard-lock date; journal entries dated strictly before this date are permanently rejected with PERIOD_HARD_LOCKED and no override path, unlike a CLOSED period which accounting:period:override plus a justification can bypass.

        Use this tool to check the current lock boundary before posting backdated entries; do not use setAccountingHardLockDate, which moves the lock, unless a change is intended.

        Preconditions: none; the lock may be unset.

        Required inputs: none; there are no parameters and no request body.

        Emits an ACCOUNTING_PERIOD_HARD_LOCK_VIEW audit event; no state changes.

        Returns 200 with hardLockDate null when no hard lock has been configured yet.

        '
      operationId: getAccountingHardLockDate
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardLockDateResponse'
          description: Current hard-lock date returned; hardLockDate is null when no hard lock is set
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:period:view permission
      security:
      - bearerAuth:
        - accounting:period:view
      summary: Get Accounting Hard-Lock Date
      tags:
      - Accounting Periods
      x-required-permissions:
      - accounting:period:view
    put:
      description: 'Sets the org-level hard-lock date; from then on, journal entries dated strictly before this date are permanently rejected with PERIOD_HARD_LOCKED and no override path, not even accounting:period:override, which only covers CLOSED periods.

        Use this tool after statutory filings or audits to make history immutable; use closeAccountingPeriod for the reversible month-end close instead.

        Preconditions: the new date must be on or after the currently stored hard-lock date; the lock is monotonic-forward-only and effectively irreversible, so set it deliberately.

        Required inputs: hardLockDate (ISO date) and a non-blank justification (max 500 characters), recorded in the audit trail with the acting user.

        Emits an ACCOUNTING_PERIOD_HARD_LOCK_SET event and returns the stored hard-lock date.

        Returns 422 HARD_LOCK_DATE_REGRESSION when the date would move backward, and 400 when the date or justification is missing or blank.

        '
      operationId: setAccountingHardLockDate
      requestBody:
        content:
          application/json:
            examples:
              Lock after audit:
                description: Lock after audit
                value:
                  hardLockDate: '2026-01-01'
                  justification: FY2025 audit finalized; history locked
            schema:
              $ref: '#/components/schemas/HardLockDateUpdateRequest'
        description: New hard-lock date with the audit justification for moving it forward.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardLockDateResponse'
          description: Hard-lock date updated; the stored value is returned
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: hardLockDate is missing, or justification is missing, blank, or over 500 characters (ARGUMENT_NOT_VALID)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:period:hard_lock permission
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Requested date is before the currently stored hard-lock date (HARD_LOCK_DATE_REGRESSION) — the hard lock only moves forward
      security:
      - bearerAuth:
        - accounting:period:hard_lock
      summary: Set Accounting Hard-Lock Date
      tags:
      - Accounting Periods
      x-required-permissions:
      - accounting:period:hard_lock
  /v1/accounting/periods/{periodCode}/close:
    post:
      description: 'Closes an OPEN accounting period (OPEN to CLOSED), after which posting paths reject entries dated inside it with PERIOD_CLOSED unless a permissioned override is supplied.

        Use this tool during month-end close after all journal entries for the month are posted and getAccountingPeriodCloseReadiness shows the bank accounts reconciled; do not use reopenAccountingPeriod, which reverses this transition for late adjustments.

        Preconditions: the period must not already be CLOSED, and no DRAFT journal entries may be dated inside the period; a valid YYYY-MM code with no row whose month has already started is auto-provisioned and then closed; bank reconciliation readiness is then evaluated under the tenant''s close policy: under REQUIRED or REQUIRED_WITH_EXCEPTION any BLOCKING check refuses the close; ADVISORY never refuses.

        Required inputs: periodCode (YYYY-MM) as a path parameter; the body is optional: bankReconciliationException.justification (at least 10 characters) closes despite BLOCKING checks under REQUIRED_WITH_EXCEPTION when the caller also holds accounting:period:override.

        Emits an ACCOUNTING_PERIOD_CLOSE event and audit-logs the close (with a readiness summary) with the acting user; a granted exception adds a PERIOD_CLOSE_BANKREC_EXCEPTION audit row holding the readiness snapshot, and the response carries bankReconciliationReady and bankReconciliationException.

        Returns 409 PERIOD_ALREADY_CLOSED when the period is already closed, 404 PERIOD_NOT_FOUND when no row exists and the month has not started, 422 PERIOD_HAS_DRAFT_ENTRIES listing the blocking draftJournalEntryIds in fieldErrors, 422 PERIOD_BANK_RECONCILIATION_INCOMPLETE listing unreconciledGlAccountIds in fieldErrors, 403 PERIOD_CLOSE_EXCEPTION_NOT_PERMITTED for an exception without the override authority, and 400 JUSTIFICATION_REQUIRED for a justification shorter than 10 characters.

        '
      operationId: closeAccountingPeriod
      parameters:
      - description: Period code in YYYY-MM format
        example: 2026-06
        in: path
        name: periodCode
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Close on an exception:
                description: Close on an exception
                value:
                  bankReconciliationException:
                    justification: September statement delayed by the bank; controller approved
            schema:
              $ref: '#/components/schemas/PeriodCloseRequest'
        description: 'Optional: a bank reconciliation exception with its justification.'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingPeriodResponse'
          description: Period closed; the updated period is returned with bankReconciliationReady and bankReconciliationException
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: periodCode is not a valid YYYY-MM period code (VALIDATION_ERROR), the exception justification is blank (VALIDATION_ERROR) or shorter than 10 characters (JUSTIFICATION_REQUIRED)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:period:close permission (FORBIDDEN), or asks for a bank reconciliation exception without accounting:period:override (PERIOD_CLOSE_EXCEPTION_NOT_PERMITTED)
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Period not found and its month has not started (PERIOD_NOT_FOUND)
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Period is already closed (PERIOD_ALREADY_CLOSED)
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'DRAFT journal entries are dated inside the period (PERIOD_HAS_DRAFT_ENTRIES; fieldErrors lists draftJournalEntryIds), or in-scope bank accounts are not reconciled under the close policy (PERIOD_BANK_RECONCILIATION_INCOMPLETE; fieldErrors lists unreconciledGlAccountIds as "<glAccountId> <accountCode>: <check codes>" and, under REQUIRED, bankReconciliationException as not permitted by policy)'
      security:
      - bearerAuth:
        - accounting:period:close
      summary: Close Accounting Period
      tags:
      - Accounting Periods
      x-required-permissions:
      - accounting:period:close
  /v1/accounting/periods/{periodCode}/close-readiness:
    get:
      description: 'Reads the bank reconciliation close readiness of a period: per in-scope bank account the baseline that applies at the period end, the coverage and reconciled frontiers, the OPEN outstanding items with their sum, and the checks that fired (STATEMENT_COVERAGE, RECONCILIATION_APPROVED, RECONCILIATION_IN_FLIGHT, RECONCILIATION_INVALIDATED, BALANCE_AGREEMENT, UNEXPLAINED_BANK_TRANSACTIONS, UNEXPLAINED_LEDGER_LINES, UNPOSTED_ADJUSTMENTS, COVERAGE_LAG_APPLIED, INCOMPLETE_IMPORTS, OUTSTANDING_ITEMS_AGING, LATE_BANK_TRANSACTIONS, RECONCILED_AFTER_CLOSE), plus tenant-wide checks (DRAFT_JOURNAL_ENTRIES, CLEARING_BALANCE_AGING) in the top-level checks list.

        Use this tool before closeAccountingPeriod to see whether the close will pass and what blocks it; do not use listAccountingPeriods, which only reports OPEN or CLOSED.

        Preconditions: none; a month with no period row is evaluated as OPEN without creating it.

        Required inputs: periodCode (YYYY-MM) as a path parameter; there is no request body.

        Emits an ACCOUNTING_PERIOD_CLOSE_READINESS audit event; nothing is created or changed.

        Returns 200 with ready = true when no BLOCKING check remains under the tenant''s close policy (under ADVISORY only DRAFT journal entries count), and 400 VALIDATION_ERROR for a malformed periodCode.

        '
      operationId: getAccountingPeriodCloseReadiness
      parameters:
      - description: Period code in YYYY-MM format
        example: 2026-08
        in: path
        name: periodCode
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloseReadinessResponse'
          description: Readiness of the period
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: periodCode is not a valid YYYY-MM period code (VALIDATION_ERROR)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:period:view permission
      security:
      - bearerAuth:
        - accounting:period:view
      summary: Get Accounting Period Close Readiness
      tags:
      - Accounting Periods
      x-required-permissions:
      - accounting:period:view
  /v1/accounting/periods/{periodCode}/reopen:
    post:
      description: 'Reopens a CLOSED accounting period (CLOSED to OPEN), allowing entries to be posted into that month again.

        Use this tool only when late adjustments must be posted into an already-closed month; use closeAccountingPeriod instead to close it again afterwards, and prefer a permissioned closed-period override on postJournalEntry for a one-off posting.

        Preconditions: a period row must exist for the code and be CLOSED.

        Required inputs: periodCode (YYYY-MM) as a path parameter and a non-blank justification (max 500 characters), recorded on the period and in the audit trail with the acting user.

        Emits an ACCOUNTING_PERIOD_REOPEN event.

        Returns 409 PERIOD_ALREADY_OPEN when the period is not closed, 404 PERIOD_NOT_FOUND when no period row exists for the code, and 400 when the justification is missing or blank.

        '
      operationId: reopenAccountingPeriod
      parameters:
      - description: Period code in YYYY-MM format
        example: 2026-06
        in: path
        name: periodCode
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Late adjustment:
                description: Late adjustment
                value:
                  justification: Post late utility accrual approved by controller
            schema:
              $ref: '#/components/schemas/AccountingPeriodReopenRequest'
        description: Audit justification for reopening the closed period.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingPeriodResponse'
          description: Period reopened; the updated period is returned
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: periodCode is not a valid YYYY-MM period code, or justification is missing or blank
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:period:reopen permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No period row exists for the code (PERIOD_NOT_FOUND)
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Period is already open (PERIOD_ALREADY_OPEN)
      security:
      - bearerAuth:
        - accounting:period:reopen
      summary: Reopen Accounting Period
      tags:
      - Accounting Periods
      x-required-permissions:
      - accounting:period:reopen
  /v1/accounting/posting-categories:
    get:
      description: 'Lists posting categories as a paginated projection, optionally filtered by active flag.

        Use this tool when browsing the mapping taxonomy; do not use getPostingCategory, which fetches a single category by id.

        Preconditions: none beyond the caller holding accounting:posting-category:view.

        Required inputs: none; page defaults to 0, size to 20, sort to categoryName (an unsupported sort field silently falls back to categoryName), and isActive is an optional filter.

        Emits an ACCOUNTING_POSTING_CATEGORY_LIST audit event; no state changes.

        Returns 200 with an empty page when no categories exist.

        '
      operationId: listPostingCategories
      parameters:
      - description: Page index (0-based)
        in: query
        name: page
        required: false
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
      - description: Page size
        in: query
        name: size
        required: false
        schema:
          default: 20
          exclusiveMinimum: 0
          format: int32
          type: integer
      - description: Sort field
        in: query
        name: sort
        required: true
        schema:
          default: categoryName
          minLength: 1
          type: string
      - description: Filter by active status
        in: query
        name: isActive
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingCategoryListResponse'
          description: Posting categories listed
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden
      security:
      - bearerAuth:
        - accounting:posting-category:view
      summary: List Posting Categories
      tags:
      - Posting Categories
      x-required-permissions:
      - accounting:posting-category:view
    post:
      description: 'Creates a posting category, the top level of the GL mapping taxonomy under which mapping keys are grouped.

        Use this tool when adding a new grouping to the taxonomy; do not use createMappingKey, which adds a key inside an existing category.

        Preconditions: no category with the same trimmed name may already exist.

        Required inputs: categoryName (max 100 chars, trimmed before the uniqueness check) and createdBy (max 50 chars); description is optional.

        Emits an ACCOUNTING_POSTING_CATEGORY_CREATE event.

        Returns 400 when a category with the same name already exists.

        '
      operationId: createPostingCategory
      requestBody:
        content:
          application/json:
            examples:
              Tender category:
                description: Tender category
                value:
                  categoryName: TENDER_TYPES
                  createdBy: jdoe
                  description: Payment tender classifications
            schema:
              $ref: '#/components/schemas/PostingCategoryCreateRequest'
        description: Posting category to add to the GL mapping taxonomy.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingCategoryResponse'
          description: Posting category created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request or duplicate name
      security:
      - bearerAuth:
        - accounting:posting-category:create
      summary: Create Posting Category
      tags:
      - Posting Categories
      x-required-permissions:
      - accounting:posting-category:create
  /v1/accounting/posting-categories/{postingCategoryId}:
    get:
      description: 'Returns one posting category with its name, description and active flag.

        Use this tool when the category id is already known; use listPostingCategories instead when browsing or filtering.

        Preconditions: the posting category must exist.

        Required inputs: postingCategoryId (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 404 when no posting category exists for the supplied id.

