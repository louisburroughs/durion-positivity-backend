        effectiveStartDate:
          type: string
          format: date-time
          description: Inclusive start of the mapping's temporal validity
          example: 2026-01-15 10:30:00
        effectiveEndDate:
          type: string
          format: date-time
          description: Exclusive end of the mapping's temporal validity (open-ended when null)
