          type: string
        rejectedAt:
          format: date-time
          type: string
        rejectedBy:
          type: string
        replacesMatchId:
          description: The match a residual settlement replaced
          format: uuid
          type: string
        replayed:
          description: True when this answers a replayed match command
          type: boolean
        residual:
          description: 'bankTotal − ledgerTotal: what a residual settlement posts'
          example: -0.01
          type: number
        state:
          description: State
          enum:
          - PROPOSED
          - ACCEPTED
          - REJECTED
          - UNMATCHED
          - BROKEN
          example: ACCEPTED
          type: string
        toleranceUsed:
          description: abs(bankTotal − ledgerTotal), at most 0.01
          example: 0.01
          type: number
        unmatchReason:
          description: Free text, or RESIDUAL_SETTLED when a residual settlement replaced the match
          type: string
        unmatchedAt:
          format: date-time
          type: string
        unmatchedBy:
          type: string
      type: object
    ReconciliationReasonRequest:
