            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: FORBIDDEN when the caller lacks reporting:view:financial-statements; LOCATION_SCOPE_DENIED when the caller holds it but the token scopes it to locations that do not cover locationId (ADR-0061)
      security:
      - bearerAuth:
        - reporting:view:financial-statements
      summary: Generate Labor Overhead Cost Report
