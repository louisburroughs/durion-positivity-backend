  /v1/accounting/reconciliations/{reconciliationId}/matches/{matchId}/accept:
    post:
      description: 'Accepts a PROPOSED match: the match becomes ACCEPTED, its bank rows MATCHED, and any OPEN ledger-side outstanding item on its lines CLEARED.

        Use this tool to confirm a proposal from autoMatchReconciliation; use rejectReconciliationMatch instead to decline it.

        Preconditions: the reconciliation must be IN_PROGRESS (409 RECONCILIATION_ALREADY_FINALIZED when FINALIZED, RECONCILIATION_NOT_EDITABLE in any other status); the match must be PROPOSED and its members still matchable; a justification is needed when the proposal uses the tolerance or spans dates beyond the window.

        Required inputs: reconciliationId and matchId as path parameters; justification optional.

        Emits an ACCOUNTING_RECONCILIATION_MATCH_ACCEPT event and a RECONCILIATION_MATCH_ACCEPT audit row.

        Returns 404 RECONCILIATION_NOT_FOUND for an unknown match, 409 MATCH_STATE_INVALID when the match is not PROPOSED, 409 RECONCILIATION_LINE_INELIGIBLE when a member is no longer matchable, and 422 MATCH_REQUIRES_REVIEW when a justification is needed.

        '
      operationId: acceptReconciliationMatch
      parameters:
      - description: Reconciliation id
        in: path
        name: reconciliationId
        required: true
        schema:
          format: uuid
          type: string
      - description: Match id
        in: path
        name: matchId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Accept with justification:
                description: Accept with justification
                value:
                  justification: Amount within tolerance, same payer
            schema:
              $ref: '#/components/schemas/ReconciliationMatchDecisionRequest'
        description: Optional justification (at least 10 characters when given).
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationMatchResponse'
          description: Match accepted
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Justification shorter than 10 characters (JUSTIFICATION_REQUIRED)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks accounting:reconciliation:adjust
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reconciliation or match not found (RECONCILIATION_NOT_FOUND)
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: MATCH_STATE_INVALID, RECONCILIATION_LINE_INELIGIBLE, RECONCILIATION_ALREADY_FINALIZED or RECONCILIATION_NOT_EDITABLE
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: A justification is needed (MATCH_REQUIRES_REVIEW)
      security:
      - bearerAuth:
        - accounting:reconciliation:adjust
      summary: Accept Proposed Match
      tags:
      - Bank Reconciliation
      x-required-permissions:
      - accounting:reconciliation:adjust
  /v1/accounting/reconciliations/{reconciliationId}/matches/{matchId}/reject:
