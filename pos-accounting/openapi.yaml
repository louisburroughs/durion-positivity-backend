        format:
          description: Export format
          enum:
          - PDF
          - CSV
          - XLSX
          - JSON
          example: CSV
          type: string
        reportType:
          description: Report type that was exported
          example: JOURNAL_LINES
          type: string
        requestedAt:
          description: ISO-8601 timestamp when the export was requested
          example: '2026-04-25T10:00:00Z'
          format: date-time
          type: string
        status:
          description: Current export status
          enum:
          - PENDING
          - IN_PROGRESS
          - COMPLETED
          - FAILED
          example: PENDING
          type: string
      required:
      - exportId
      - status
      type: object
    ReprocessEventRequest:
