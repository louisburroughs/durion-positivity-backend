        transactionDate:
          type: string
          format: date-time
          description: Transaction date and time
          example: 2026-01-15 10:30:00
        description:
          type: string
          description: Journal entry description
          example: Invoice accrual posting
        sourceEventId:
          type: string
          format: uuid
          description: Source event UUID
          example: 01936e5c-1234-7a3d-8b6e-123456789012
        sourceEventType:
          type: string
          description: Source event type
          example: INVOICE_RECEIVED
