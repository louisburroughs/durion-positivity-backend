        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingCategoryResponse'
          description: Posting category returned
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingCategoryResponse'
          description: Posting category not found
      security:
      - bearerAuth:
        - accounting:posting-category:view
