          type: string
        lineItemId:
          description: Identifier of the line item associated with the event
          example: 01960003-0000-7000-8000-000000000004
          format: uuid
          type: string
        linkedSourceIds:
          description: Comma-separated linked source identifiers
          example: 01960003-0000-7000-8000-000000000007
          type: string
        orderId:
          description: Identifier of the order associated with the event
          example: 01960003-0000-7000-8000-000000000003
          format: uuid
          type: string
        originalPaymentStatus:
          description: Status of the original payment being refunded
          enum:
          - PENDING
          - SETTLED
          - FAILED
          - AUTHORIZED
          example: SETTLED
          type: string
        originalPrice:
          description: Original price before override
          example: 1250.0
          type: number
        overrideAmountOrPercent:
          description: Override expressed as an amount or percentage
          example: -12%
          type: string
        partialPaymentInfo:
          description: Partial payment details captured at cancellation (JSON)
          type: string
        paymentId:
          description: Identifier of the payment associated with the event
          example: 01960003-0000-7000-8000-000000000006
          format: uuid
          type: string
        policyValidationResult:
          description: Result of policy validation for the event
          enum:
          - APPROVED
          - REJECTED_FORBIDDEN
          - REJECTED_THRESHOLD_EXCEEDED
          type: string
        policyVersion:
          description: Version of the policy evaluated for the action
          example: v3
          type: string
        reason:
          description: Reason captured for the action
          example: Price matched competitor quote
          type: string
        refundAmount:
          description: Refund amount
          example: 1250.0
          type: number
        refundMethod:
          description: Method used to issue the refund
          enum:
          - VOID
          - CHARGEBACK
          - CASH_REFUND
          - CREDIT_MEMO
          example: CASH_REFUND
          type: string
        refundType:
          description: Type of refund recorded
          enum:
          - REVERSAL
          - CREDIT_MEMO
          - ADJUSTMENT
          example: REVERSAL
          type: string
        sourceDocumentId:
          description: Identifier of the source business document
          example: INV-2026-000123
          type: string
        sourceEventId:
          description: Identifier of the source accounting event
          example: 01960003-0000-7000-8000-000000000008
          format: uuid
          type: string
        timestamp:
          description: Timestamp when the audit event occurred (ISO 8601)
          example: '2026-06-18T08:00:00Z'
          format: date-time
          type: string
