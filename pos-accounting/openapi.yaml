    ReconciliationAdjustmentRequest:
      description: Post a reconciliation adjustment (a real journal entry)
      properties:
        amount:
          description: Signed amount; positive increases the reconciled cash. Required unless settlesMatchId or bridgesStatementId is set, when the server computes it and a sent value must equal it
          example: -12.5
          type: number
        bankTransactionId:
          description: The UNMATCHED bank transaction this adjustment explains; its cash line is matched to it
          format: uuid
          type: string
        bridgesStatementId:
          description: 'OTHER only: this reconciliation''s statement, whose acknowledged gap this bridges'
          format: uuid
          type: string
        counterGlAccountId:
          description: 'TRANSFER only: the counter bank account (a reconcilable BANK_CASH account)'
          format: uuid
          type: string
        description:
          description: Description recorded on the adjustment
          example: Monthly account service charge
          maxLength: 500
          minLength: 0
          type: string
        justification:
          description: Required for OTHER (at least 10 characters)
          example: Bank debit pending classification
          maxLength: 1000
          minLength: 0
          type: string
        overrideJustification:
          description: Post into a CLOSED period; needs accounting:period:override (never a hard-locked one)
          maxLength: 1000
          minLength: 0
          type: string
        requestId:
          description: Caller-generated UUIDv7; a replay returns the original with replayed true
          format: uuid
          type: string
        settlesMatchId:
          description: 'OTHER only: the ACCEPTED match whose residual this settles'
          format: uuid
          type: string
        transactionDate:
          description: The date to post at when the explaining date's period is closed; it must be in an OPEN period
          example: '2026-10-01'
          format: date
          type: string
        type:
          description: Adjustment type
          enum:
          - BANK_FEE
          - NSF_FEE
          - INTEREST_EARNED
          - OTHER
          - TRANSFER
