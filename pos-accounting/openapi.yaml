        Use this tool to decline a proposal from autoMatchReconciliation; use acceptReconciliationMatch instead to confirm it.

        Preconditions: the reconciliation must be IN_PROGRESS (409 RECONCILIATION_ALREADY_FINALIZED when FINALIZED, RECONCILIATION_NOT_EDITABLE in any other status) and the match must be PROPOSED.

