    BankReconciliationPolicyRequest:
      description: Replaces the tenant's bank reconciliation policy; all six fields are required
      properties:
        allowSelfApproval:
          description: Whether a submitter may approve their own reconciliation
          example: false
          type: boolean
        closeCoverageLagDays:
          description: Days the reconciled and coverage frontiers may fall short of the period end
          example: 0
          format: int32
          minimum: 0
          type: integer
        closePolicy:
          description: ADVISORY, REQUIRED_WITH_EXCEPTION or REQUIRED
          enum:
          - ADVISORY
          - REQUIRED_WITH_EXCEPTION
          - REQUIRED
          example: REQUIRED_WITH_EXCEPTION
          type: string
        closeScope:
          description: BANK_CASH_SUBTYPE or ALL_RECONCILABLE
          enum:
          - BANK_CASH_SUBTYPE
          - ALL_RECONCILABLE
          example: BANK_CASH_SUBTYPE
          type: string
        justification:
          description: Why the policy changes; at least 10 characters (400 JUSTIFICATION_REQUIRED otherwise); recorded on every BANK_REC_POLICY_SET audit row
          example: Finance sets the OTHER threshold after the Q3 review
          maxLength: 1000
          minLength: 10
          type: string
        otherApprovalThreshold:
          description: OTHER adjustment amount in the functional currency above which accounting:reconciliation:approve is needed; required, null clears it (unset)
          example: 250.0
          minimum: 0
          type:
          - number
          - 'null'
      required:
      - allowSelfApproval
      - closeCoverageLagDays
      - closePolicy
      - closeScope
      - justification
      - otherApprovalThreshold
      type: object
    BankReconciliationPolicyResponse:
      description: Effective bank reconciliation policy of the tenant
      properties:
        allowSelfApproval:
          description: BANK_REC_ALLOW_SELF_APPROVAL (default false)
          example: false
          type: boolean
        closeCoverageLagDays:
          description: BANK_REC_CLOSE_COVERAGE_LAG_DAYS (default 0)
          example: 0
          format: int32
          type: integer
        closePolicy:
          description: BANK_REC_CLOSE_POLICY (default REQUIRED_WITH_EXCEPTION)
          enum:
          - ADVISORY
          - REQUIRED_WITH_EXCEPTION
          - REQUIRED
          example: REQUIRED_WITH_EXCEPTION
          type: string
        closeScope:
          description: BANK_REC_CLOSE_SCOPE (default BANK_CASH_SUBTYPE)
          enum:
          - BANK_CASH_SUBTYPE
          - ALL_RECONCILABLE
          example: BANK_CASH_SUBTYPE
          type: string
        currency:
          description: ISO 4217 functional currency the threshold is expressed in
          example: USD
          type: string
        otherApprovalThreshold:
          description: BANK_REC_OTHER_APPROVAL_THRESHOLD in the functional currency; null while unset (every non-residual OTHER adjustment then needs accounting:reconciliation:approve)
          example: 250.0
          type:
          - number
          - 'null'
        updatedAt:
          description: When a setting last changed; null while every setting is at its default
          format: date-time
          type:
          - string
          - 'null'
        updatedBy:
          description: Who last changed a setting; null while every setting is at its default
          type:
          - string
          - 'null'
      type: object
    BankReconciliationResponse:
      description: Bank reconciliation header with the live equation (E3), opening terms and unexplained counts
      properties:
        accountCode:
          description: Reconciled account code
          example: '1000'
          type: string
        accountName:
          description: Reconciled account name
          example: Cash
          type: string
        accountingPeriodCode:
          description: YearMonth of the statement end date, for attribution only (never a window constraint)
          example: 2026-09
          type: string
        adjustedBankBalance:
          description: statementClosingBalance + sumOutstandingLedgerItems − sumOutstandingBankItems
          type: number
        adjustedBookBalance:
          description: glEndingBalance + sumLateAdjustments
          type: number
        approvedGlEndingBalance:
          description: The ledger balance as-of the statement end date that the approver saw, snapshotted at approval; compare with glEndingBalance (live) to see whether the ledger changed since
          example: 12840.12
          type: number
        baselineDate:
          description: 'Start date of the latest acknowledged statement on or before the window start: nothing dated before it counts as unexplained; null when the account has no acknowledged statement'
          example: '2026-09-01'
          format: date
          type: string
        cancelReason:
          description: Why it was cancelled
          type: string
        cancelledAt:
          description: When the reconciliation was cancelled
          format: date-time
          type: string
        cancelledBy:
          description: Who cancelled it (the approver)
          type: string
        countUnexplainedBank:
          description: Unexplained bank transactions from the baseline to the window end (exact count)
          format: int32
          type: integer
        countUnexplainedLedger:
          description: Unexplained ledger lines from the baseline to the window end, aged OTHER_LEDGER_TIMING items not reaffirmed here included (exact count)
          format: int32
          type: integer
        createdAt:
          description: When the reconciliation was created
          format: date-time
          type: string
        createdBy:
          description: Who created the reconciliation (the preparer)
          type: string
        currency:
          description: Reconciliation currency (the ledger currency)
          example: USD
          type: string
        difference:
          description: adjustedBankBalance − adjustedBookBalance; balanced within ±0.01
          example: 0.0
          type: number
        finalizedAt:
          description: When the reconciliation was approved (finalized); null until then
          format: date-time
          type: string
        finalizedBy:
          description: Who approved (finalized) the reconciliation
          type: string
        glAccountId:
          description: Reconciled GL cash account id
          format: uuid
          type: string
        glEndingBalance:
          description: Live ledger balance at the end of the statement end date, entries POSTED or REVERSED at their own dates
          type: number
        glOpeningBalance:
          description: Live ledger balance at the end of the day before the window start
          type: number
        invalidatedAt:
          description: When an approved reconciliation was invalidated
          format: date-time
          type: string
        invalidatedByJournalEntryId:
          description: The journal entry whose posting or reversal invalidated it
          format: uuid
          type: string
        invalidationReason:
          description: 'Why it was invalidated: LEDGER_LINE_REVERSED, LEDGER_LINE_POSTED, SOURCE_REMOVED or STATEMENT_SUPERSEDED'
          example: LEDGER_LINE_REVERSED
          type: string
        openingDifference:
          description: 'Diagnostic only, never blocking: statementOpeningBalance + ledger items − bank items open at the day before the start − (glOpeningBalance + sumOpeningAdjustments)'
          type: number
        reconciliationId:
          description: Reconciliation id
          format: uuid
          type: string
        replayed:
          description: True when this answers a replayed create command (same requestId and payload)
          type: boolean
        statementClosingBalance:
          description: Statement closing balance
          example: 12345.67
          type: number
        statementEndDate:
          description: Statement window end date; the as-of date of every closing term
          example: '2026-09-30'
          format: date
          type: string
        statementId:
          description: The bank statement this reconciliation rests on
          format: uuid
          type: string
        statementOpeningBalance:
          description: Statement opening balance
          example: 12000.0
          type: number
        statementStartDate:
          description: Statement window start date
          example: '2026-09-01'
          format: date
          type: string
        status:
          description: Reconciliation status
          enum:
          - IN_PROGRESS
          - SUBMITTED
          - FINALIZED
          - INVALIDATED
          - SUPERSEDED
          - CANCELLED
          example: IN_PROGRESS
          type: string
        submittedAt:
          description: When the preparer submitted it for approval; null while it is not submitted
          format: date-time
          type: string
        submittedBy:
          description: Who submitted it for approval (the preparer)
          type: string
        sumLateAdjustments:
          description: Adjustment postings of this or an earlier reconciliation on the account dated after the statement end date
          type: number
        sumOpeningAdjustments:
          description: Adjustment postings of earlier windows, and this statement's gap bridges, dated on or after the window start
          type: number
        sumOutstandingBankItems:
          description: Σ bank-side outstanding items open at the end of the window (bank errors)
          type: number
        sumOutstandingLedgerItems:
          description: Σ ledger-side outstanding items open at the end of the window (deposits +, checks −)
          type: number
        sumUnexplainedBank:
          description: Σ signed amounts of the unexplained bank transactions
          type: number
        sumUnexplainedLedger:
          description: Σ signed amounts of the unexplained ledger lines
          type: number
        supersededByReconciliationId:
          description: The approved reconciliation that superseded this one
          format: uuid
          type: string
        supersedesReconciliationId:
          description: The reconciliation this one supersedes (a correction of an approved window)
          format: uuid
          type: string
        version:
          description: Optimistic-lock version of the row
          example: 3
          format: int64
          type: integer
      type: object
