  /v1/accounting/settlements/lines/{lineId}/write-off:
    post:
      tags:
      - Settlement Reconciliation
      summary: Write Off Small Settlement Line
      description: 'Writes off an UNMATCHED settlement line whose gross is at or below the configured write-off threshold (default 25.00), posting a reversible adjustment entry (debit Settlement Suspense, credit Settlement Adjustment) rather than a silent status flip.

        Use this tool only for genuinely unidentifiable small residuals; do not use it above the threshold, where matchSettlementLine or escalation is the only path.

        Preconditions: the line must exist and be UNMATCHED, its parent settlement must be POSTED, and the line''s absolute gross must not exceed the threshold.

        Required inputs: lineId (UUID) as a path parameter and a non-blank audited reason (max 500 chars).

        Emits an ACCOUNTING_SETTLEMENT_LINE_WRITE_OFF event and posts the adjustment entry through the accounting-period gate.

        Returns 422 WRITE_OFF_THRESHOLD_EXCEEDED when the absolute gross exceeds the threshold or PERIOD_CLOSED / PERIOD_HARD_LOCKED for locked periods, 409 SETTLEMENT_LINE_NOT_UNMATCHED or SETTLEMENT_NOT_POSTED for state conflicts, and 404 SETTLEMENT_LINE_NOT_FOUND when the line is missing.

        '
      operationId: writeOffSettlementLine
      parameters:
      - name: lineId
        in: path
        description: Settlement line id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Audited reason for writing off the small unmatched residual.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementWriteOffRequest'
            examples:
              Write off rounding residual:
                description: Write off rounding residual
                value:
                  reason: Processor rounding residual, no matching payment
        required: true
      responses:
        '200':
          description: Line written off; the updated line is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementLineResponse'
        '400':
          description: reason is missing, blank, or over 500 characters (ARGUMENT_NOT_VALID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Caller lacks the accounting:reconciliation:adjust permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Settlement line not found (SETTLEMENT_LINE_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Settlement line is not UNMATCHED (SETTLEMENT_LINE_NOT_UNMATCHED), or the settlement has not yet posted (SETTLEMENT_NOT_POSTED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Line absolute gross exceeds the write-off threshold (WRITE_OFF_THRESHOLD_EXCEEDED); manual match or escalate — or the adjustment entry is dated into a CLOSED or hard-locked accounting period (PERIOD_CLOSED / PERIOD_HARD_LOCKED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - accounting:reconciliation:adjust
      x-required-permissions:
      - accounting:reconciliation:adjust
  /v1/accounting/settlements/lines/{lineId}/match:
    post:
      tags:
      - Settlement Reconciliation
      summary: Manually Match Settlement Line
      description: 'Manually matches an UNMATCHED settlement line to an AR receivable payment, posting a reclass entry (debit Settlement Suspense, credit Undeposited Funds) that clears the line''s gross out of suspense.

        Use this tool when the automatic gross match could not identify the payment; do not use writeOffSettlementLine, which is only for small unidentifiable residuals, and note that AP vendor matching is not supported in v1.

        Preconditions: the line must exist and be UNMATCHED, its parent settlement must already be POSTED, and the receivable payment must exist.

        Required inputs: lineId (UUID) as a path parameter and receivablePaymentId (UUID) in the body.

        Emits an ACCOUNTING_SETTLEMENT_LINE_MATCH event and posts the reclass journal entry.

        Returns 404 SETTLEMENT_LINE_NOT_FOUND or RECEIVABLE_PAYMENT_NOT_FOUND when either record is missing, 409 SETTLEMENT_LINE_NOT_UNMATCHED or SETTLEMENT_NOT_POSTED for state conflicts, and 422 PERIOD_CLOSED or PERIOD_HARD_LOCKED when the reclass entry is dated into a locked period.

        '
      operationId: matchSettlementLine
      parameters:
      - name: lineId
        in: path
        description: Settlement line id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Receivable payment to match the unmatched settlement line against.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementManualMatchRequest'
            examples:
              Match to payment:
                description: Match to payment
                value:
                  receivablePaymentId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
        required: true
      responses:
        '200':
          description: Line matched; the updated line is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementLineResponse'
        '400':
          description: receivablePaymentId is missing (ARGUMENT_NOT_VALID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Caller lacks the accounting:reconciliation:adjust permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Settlement line or receivable payment not found (SETTLEMENT_LINE_NOT_FOUND / RECEIVABLE_PAYMENT_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Settlement line is not UNMATCHED (SETTLEMENT_LINE_NOT_UNMATCHED), or the settlement has not yet posted (SETTLEMENT_NOT_POSTED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Reclass entry is dated into a CLOSED or hard-locked accounting period (PERIOD_CLOSED / PERIOD_HARD_LOCKED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - accounting:reconciliation:adjust
      x-required-permissions:
      - accounting:reconciliation:adjust
  /v1/accounting/reports/financial/tax-liability/snapshots:
    get:
      tags:
      - Financial Reporting
      - Financial Reporting for Tax Liability
      summary: List Sales-Tax Liability Snapshots
      description: 'Lists Sales-Tax Liability snapshot summaries without their row detail, newest freeze first, optionally filtered by period code.

        Use this tool to find which periods are frozen and which snapshot is ACTIVE; use getTaxLiabilitySnapshot instead for a snapshot''s full frozen content.

        Preconditions: none.

        Required inputs: none; periodCode (YYYY-MM) is an optional filter.

        Emits a TAX_LIABILITY_SNAPSHOT_LIST audit event; no state changes.

        Returns 200 with an empty list when no snapshots exist.

        '
      operationId: listTaxLiabilitySnapshots
      parameters:
      - name: periodCode
        in: query
        description: Optional accounting period code filter (YYYY-MM)
        required: false
        schema:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
        example: 2026-06
      responses:
        '200':
          description: Snapshot summaries (empty list when none exist)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaxLiabilitySnapshotSummary'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - missing reporting:view:financial-statements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - reporting:view:financial-statements
      x-required-permissions:
      - reporting:view:financial-statements
    post:
      tags:
      - Financial Reporting
      - Financial Reporting for Tax Liability
      summary: Freeze Sales-Tax Liability Snapshot
      description: 'Generates the Sales-Tax Liability report over a closed accounting period''s exact date range and persists it as an immutable snapshot with a canonical SHA-256 content hash; snapshots are provider-neutral and carry no filing-provider identifiers.

        Use this tool at period close to fix filing figures; do not use generateTaxLiabilityReport, which computes the live report without freezing anything.

        Preconditions: the accounting period must exist and be CLOSED, and no ACTIVE snapshot may exist for the period unless supersede is set.

        Required inputs: periodCode (YYYY-MM) as a query parameter; supersede defaults to false and, when true, demotes the prior ACTIVE snapshot to SUPERSEDED while preserving history.

        Emits a TAX_LIABILITY_SNAPSHOT_FREEZE event.

        Returns 404 when the period does not exist, 409 when the period is not CLOSED or an ACTIVE snapshot exists without supersede, and 400 when the period code is malformed.

        '
      operationId: freezeTaxLiabilitySnapshot
      parameters:
      - name: periodCode
        in: query
        description: Accounting period code (YYYY-MM)
        required: true
        schema:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
        example: 2026-06
      - name: supersede
        in: query
        description: Supersede an existing ACTIVE snapshot for the period
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '201':
          description: Snapshot frozen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxLiabilitySnapshotResponse'
        '400':
          description: Invalid period code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - missing accounting:tax-snapshot:freeze
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Accounting period not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Period not CLOSED, or an ACTIVE snapshot exists and supersede was not set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - accounting:tax-snapshot:freeze
      x-required-permissions:
      - accounting:tax-snapshot:freeze
  /v1/accounting/reports/financial/tax-liability/snapshots/{snapshotId}/verify:
    post:
      tags:
      - Financial Reporting
      - Financial Reporting for Tax Liability
      summary: Verify Sales-Tax Liability Snapshot
      description: 'Re-derives the Sales-Tax Liability report for a snapshot''s period from the live replicas and compares canonical hashes, reporting consistent=true when they match.

        Use this tool to detect drift after a freeze; do not use freezeTaxLiabilitySnapshot to check consistency, since freezing creates state.

        Preconditions: the snapshot must exist; inconsistency means underlying data moved after the freeze, for example postings into a reopened period, and the remedy is re-freezing with supersede=true once the period is closed again.

        Required inputs: snapshotId (UUID) as a path parameter; there is no request body.

        Emits a TAX_LIABILITY_SNAPSHOT_VERIFY audit event; the snapshot itself is never mutated.

        Returns 404 TAX_SNAPSHOT_NOT_FOUND when no snapshot exists for the supplied id.

        '
      operationId: verifyTaxLiabilitySnapshot
      parameters:
      - name: snapshotId
        in: path
        description: Snapshot id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Verification result (consistent=true when hashes match)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxLiabilitySnapshotVerification'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden - missing reporting:view:financial-statements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Snapshot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - reporting:view:financial-statements
      x-required-permissions:
      - reporting:view:financial-statements
