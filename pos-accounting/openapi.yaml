          example: Acme Auto Parts
          type: string
        status:
          description: Vendor status
          enum:
          - ACTIVE
          - INACTIVE
          example: ACTIVE
          type: string
        vendorId:
          description: Stable vendor identifier
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        vendorNumber:
          description: Human-readable vendor number, when assigned
          example: V-1042
          type: string
      required:
      - name
      - vendorId
      type: object
    VendorSpendReport:
      description: Per-vendor spend report for one date window, ordered by paidAmount descending. paidAmount (settled A/P cash) and billsIssuedInWindow/avgIssuedBillAmount (bill records) are different populations — see VendorSpendRow field descriptions.
      properties:
        endDate:
          description: Window end date (inclusive)
          example: '2026-06-30'
          format: date
          type: string
        generatedAt:
          description: Timestamp when the report was generated (ISO 8601)
          example: '2026-06-30T08:00:00Z'
          format: date-time
          type: string
        limit:
          description: The effective row cap applied to this response
          example: 20
          format: int32
          type: integer
        rows:
          description: Per-vendor rows, paidAmount descending, bounded to `limit` entries
          items:
            $ref: '#/components/schemas/VendorSpendRow'
          type: array
        startDate:
          description: Window start date (inclusive)
          example: '2026-06-01'
          format: date
          type: string
        truncated:
          description: True when more vendors had settled payments or bills in the window than `limit` allowed through — rows beyond the cap are not included
          type: boolean
      required:
      - endDate
      - generatedAt
      - limit
      - rows
      - startDate
      - truncated
      type: object
    VendorSpendRow:
      description: One vendor's spend over the report window; see field descriptions for the paidAmount vs billsIssuedInWindow/avgIssuedBillAmount population split
      properties:
        avgIssuedBillAmount:
          description: Sum of VendorBill.totalAmount for this vendor's bills in the window divided by billsIssuedInWindow; 0 (never null) when billsIssuedInWindow is 0 — there is nothing to average, and 0 keeps this field a well-defined BigDecimal for every row
          example: 1425.75
          type: number
        billsIssuedInWindow:
          description: Count of VendorBill records for this vendor whose billDate falls in the window, regardless of payment status; 0 when none issued in the window. Bill-side figure, a DIFFERENT population from paidAmount above — see class Javadoc.
          example: 4
          format: int32
          type: integer
        name:
          description: Resolved vendor display name, from the AP vendor directory; falls back to the vendor name snapshot recorded on the vendor's own bills/payments when the vendor has no directory entry, and is null only if neither source has a name
          example: Acme Parts Co
          type:
          - string
          - 'null'
        paidAmount:
          description: Sum of APPayment.grossAmount for settled payments (status GATEWAY_SUCCEEDED or later) to this vendor whose paymentDate falls in the window; 0 when none settled in the window. This is A/P cash, a DIFFERENT population from billsIssuedInWindow/avgIssuedBillAmount below — see class Javadoc.
          example: 18250.0
          type: number
        vendorId:
          description: Vendor identifier
          example: 01936e5b-4567-7a3d-8b6e-1a2345678901
          format: uuid
          type: string
      required:
      - avgIssuedBillAmount
      - billsIssuedInWindow
      - paidAmount
      - vendorId
      type: object
    VoidCreditMemoRequest:
      description: Void a POSTED credit memo, restoring AR and the reversed tax liability
      properties:
        voidReason:
          description: Reason the memo is being voided (audit trail)
          example: Issued against the wrong invoice
          maxLength: 1000
          minLength: 0
          type: string
      required:
      - voidReason
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
