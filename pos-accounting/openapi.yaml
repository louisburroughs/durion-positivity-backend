    JournalEntryPostRequest:
      description: Optional request payload for posting a journal entry
      properties:
        overrideJustification:
          description: Optional justification for posting into a CLOSED accounting period. When the entry's transaction date falls in a CLOSED period, supplying a non-blank justification together with the accounting:period:override permission allows the posting to proceed (audit-logged); without it the post is rejected with 422 PERIOD_CLOSED. Has no effect for dates in OPEN periods and can never bypass the hard lock (422 PERIOD_HARD_LOCKED).
          example: Auditor-approved late accrual for June close
          maxLength: 500
          minLength: 0
          type: string
      type: object
    JournalEntryResponse:
      description: Journal entry response payload
      properties:
        createdAt:
          description: Created timestamp
          example: 2026-01-15 10:31:00+00:00
          format: date-time
          type: string
        createdBy:
          description: Created by username
          example: accounting.user
          type: string
        description:
          description: Journal entry description
          example: Invoice accrual posting
          type: string
        entryNumber:
          description: Human-readable posted-entry number in the format JE-{YYYYMM}-{seq}, sequential within the entry's transaction month and assigned at posting time. Null for DRAFT and PENDING entries and for entries posted before numbering existed.
          example: JE-202607-1
          type:
          - string
          - 'null'
        isBalanced:
          description: Whether total debits equal total credits
          example: true
          type: boolean
        journalEntryId:
          description: Journal entry UUID
          example: 01936e5e-7890-7a3d-8b6e-4d5678901234
          format: uuid
          type: string
        lines:
          description: Journal entry lines
          items:
            $ref: '#/components/schemas/JournalEntryLineResponse'
          type: array
        modifiedAt:
          description: Last modified timestamp
          example: 2026-01-15 10:32:00+00:00
          format: date-time
          type: string
        modifiedBy:
          description: Last modified by username
          example: accounting.user
          type: string
        postedAt:
          description: Posted timestamp
          example: 2026-01-15 10:40:00+00:00
          format: date-time
          type: string
        postedBy:
          description: Posted by username
          example: accounting.manager
          type: string
        postingRuleSetId:
          description: Posting rule set UUID
          format: uuid
          type: string
        postingRuleVersionId:
          description: Posting rule version UUID
          format: uuid
          type: string
        reversalJournalEntryId:
          description: Original journal entry UUID when this entry is a reversal
          format: uuid
          type: string
        reversedAt:
          description: Reversed timestamp
          example: 2026-01-16 08:20:00+00:00
          format: date-time
          type: string
        reversedByJournalEntryId:
          description: Reversal journal entry UUID when this entry has been reversed
          format: uuid
          type: string
        sourceEventId:
          description: Source event UUID
          example: 01936e5c-1234-7a3d-8b6e-123456789012
          format: uuid
          type: string
        sourceEventType:
          description: Source event type
          example: INVOICE_RECEIVED
          type: string
        status:
          description: Journal entry status
          enum:
          - DRAFT
          - PENDING
          - POSTED
          - REVERSED
          example: DRAFT
          type: string
        totalCredits:
          description: Total credits
          example: 1250.0
          type: number
        totalDebits:
          description: Total debits
          example: 1250.0
          type: number
        transactionDate:
          description: Transaction date and time
          example: 2026-01-15 10:30:00
          format: date-time
          type: string
      type: object
    JournalEntryReversalRequest:
      description: Request payload for reversing a journal entry
      properties:
        overrideJustification:
          description: Optional justification for reversing into a CLOSED accounting period (story B2). When the resolved reversal date falls in a CLOSED period, supplying a non-blank justification together with the accounting:period:override permission allows the reversal to post into that period (audit-logged); without it the reversal is rejected with 422 PERIOD_CLOSED. Has no effect for dates in OPEN periods and can never bypass the hard lock (422 PERIOD_HARD_LOCKED).
          example: Auditor-approved correction of June posting
          maxLength: 500
          minLength: 0
          type: string
        reason:
          description: Reason for reversing the journal entry
          example: Correcting duplicate posting
          minLength: 1
          type: string
        reversalDate:
          description: Optional transaction date for the reversal entry. When omitted or null, the date defaults to the original entry's transaction date if that date's accounting period is OPEN, otherwise to today's date. Whether explicit or defaulted, the resolved date must fall in an OPEN accounting period; a date in a CLOSED period is rejected with 422 PERIOD_CLOSED.
          example: 2026-07-15
          format: date
          type: string
      required:
      - reason
      type: object
