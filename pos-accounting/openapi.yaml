      - accounting:events:view
    post:
      tags:
      - Accounting Events
      summary: Submit Accounting Event
      description: 'Submits a business event into the accounting pipeline, where the posting engine converts it into journal entries via published posting rules or default GL mappings.

        Use this tool to feed source-system activity into the ledger; do not use createJournalEntry, which bypasses the rules engine for manual entries, and use resolveTestMapping to preview the rules first.

        Preconditions: no event with the same eventId may already be ingested; duplicates are rejected rather than reprocessed.

        Required inputs: eventType (max 100 chars), organizationId (UUID) and payload (JSON object); eventId, sourceSystem and transactionDate (ISO-8601) are optional, eventId being generated when omitted.

        Emits an ACCOUNTING_EVENT_SUBMIT event and returns 202 while processing continues asynchronously; callers poll getAccountingEvent for the outcome.

        Returns 409 DUPLICATE_EVENT when the eventId was already ingested, and 400 when required fields are missing or the transactionDate is not valid ISO-8601.

        '
      operationId: submitAccountingEvent
      requestBody:
        description: Business event envelope to convert into journal entries.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountingEventSubmitRequest'
            examples:
              Invoice finalized event:
                description: Invoice finalized event
                value:
                  eventId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  eventType: INVOICE_FINALIZED
                  organizationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
                  sourceSystem: POS
                  transactionDate: 2026-08-13 10:15:00
                  payload:
                    invoiceId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5d
                    totalAmount: 150.0
        required: true
      responses:
        '202':
          description: Event accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingEventResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingEventResponse'
      security:
      - bearerAuth:
        - accounting:events:submit
      x-required-permissions:
      - accounting:events:submit
  /v1/accounting/events/{eventId}/retry:
    post:
      tags:
      - Accounting Events
      summary: Retry Accounting Event Processing
      description: 'Re-runs pipeline processing for a failed accounting event using its original payload and the current rules.

        Use this tool for transient failures; do not use reprocessSuspendedEvent, which is the audited path for SUSPENDED events after a mapping or rule correction.

        Preconditions: the event must exist and be in a retryable failed state.

        Required inputs: eventId (UUID) as a path parameter; the request body is optional and ignored.

        Emits an ACCOUNTING_EVENT_RETRY event and returns 202 while processing continues asynchronously.

        Returns 404 EVENT_NOT_FOUND when the event does not exist.

        '
      operationId: retryAccountingEvent
      parameters:
      - name: eventId
        in: path
        description: Event identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Optional and ignored; send an empty object or omit the body entirely.
        content:
          application/json:
            schema:
              type: object
            examples:
              Empty body:
                description: Empty body
      responses:
        '202':
          description: Retry requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingEventResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingEventResponse'
      security:
      - bearerAuth:
        - accounting:events:retry
      x-required-permissions:
      - accounting:events:retry
  /v1/accounting/events/{eventId}/reprocess:
    post:
      tags:
      - Accounting Events
      summary: Reprocess Suspended Event
      description: 'Reprocesses a SUSPENDED accounting event after a mapping or rule correction, recording an audited reprocessing attempt with the triggering user.

        Use this tool once the underlying mapping gap is fixed; do not use retryAccountingEvent, which is the unaudited retry for transient failures.

        Preconditions: the event must exist and be SUSPENDED; an event already PROCESSED is rejected to preserve idempotency.

        Required inputs: eventId (UUID) as a path parameter and triggeredByUserId in the body; mappingVersionToUse and reprocessingNotes are optional.

        Emits an ACCOUNTING_EVENT_REPROCESS event; a successful synchronous outcome returns 200 with status PROCESSED while 202 means processing continues.

        Returns 404 EVENT_NOT_FOUND when the event does not exist, 409 when it is already PROCESSED, and 400 when the request is invalid.

        '
      operationId: reprocessSuspendedEvent
      parameters:
      - name: eventId
        in: path
        description: Event identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Audited reprocessing trigger with optional mapping version pin and notes.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReprocessEventRequest'
            examples:
              Reprocess after mapping fix:
                description: Reprocess after mapping fix
                value:
                  triggeredByUserId: jdoe
                  reprocessingNotes: Default mapping added for CASH_SALE
        required: true
      responses:
        '202':
          description: Reprocessing accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingEventResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingEventResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingEventResponse'
        '409':
          description: Event already PROCESSED (idempotency violation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingEventResponse'
      security:
      - bearerAuth:
        - accounting:events:reprocess
      x-required-permissions:
      - accounting:events:reprocess
  /v1/accounting/default-mappings:
    get:
      tags:
      - Default GL Mappings
      summary: List Default GL Mappings
      description: 'Lists all default GL mappings as a paginated projection, including inactive ones.

        Use this tool to browse the fallback catalog; use searchDefaultMappings instead to filter by event type or organization, or resolveDefaultMapping to find the one that would apply to an event.

        Preconditions: none beyond the caller holding accounting:default-mapping:view.

        Required inputs: none; page defaults to 0 and size to 20.

        Emits an ACCOUNTING_DEFAULT_MAPPING_LIST audit event; no state changes.

        Returns 200 with an empty page when no default mappings exist.

        '
      operationId: listDefaultMappings
      parameters:
      - name: page
        in: query
        description: Page index (0-based)
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        description: Page size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          exclusiveMinimum: 0
      responses:
        '200':
          description: Default mappings listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultGLMappingListResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultGLMappingListResponse'
      security:
      - bearerAuth:
        - accounting:default-mapping:view
      x-required-permissions:
      - accounting:default-mapping:view
    post:
      tags:
      - Default GL Mappings
      summary: Create Default GL Mapping
      description: 'Creates a fallback debit and credit account pair for an event type, used by the posting engine when no explicit posting rule matches; resolution order is explicit rule, then org-scoped default, then global default, then UNMAPPED_EVENT_TYPE failure.

        Use this tool to guarantee an event type always posts somewhere; do not use createGLMapping, which maps a source-system external code to a single account.

        Preconditions: the debit and credit GL accounts must exist.

        Required inputs: eventType (max 100 chars), debitAccountId (UUID) and creditAccountId (UUID); organizationId is optional (null makes the default global) and active defaults to true.

        Emits an ACCOUNTING_DEFAULT_MAPPING_CREATE event.

        Returns 400 when a referenced GL account cannot be resolved.

        '
      operationId: createDefaultMapping
      requestBody:
        description: Fallback debit and credit account pair for one event type.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefaultGLMappingRequest'
            examples:
              Global fallback for cash sales:
                description: Global fallback for cash sales
                value:
                  eventType: CASH_SALE
                  debitAccountId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  creditAccountId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
                  description: Fallback posting for cash sales
                  active: true
        required: true
      responses:
        '201':
          description: Default mapping created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultGLMappingResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultGLMappingResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultGLMappingResponse'
      security:
      - bearerAuth:
        - accounting:default-mapping:create
      x-required-permissions:
      - accounting:default-mapping:create
  /v1/accounting/customer-credits/{creditId}/refunds:
    post:
      tags:
      - Customer Credits
      summary: Refund Customer Credit
      description: 'Refunds an open customer credit as cash back to the customer, posting debit Customer Credit Liability, credit Undeposited Funds for the refunded amount.

        Use this tool to pay standing credit out; do not use applyCustomerCredit, which consumes the credit against an invoice instead.

        Preconditions: the credit must have sufficient open amount and the accounting period must be open.

        Required inputs: creditId (UUID) as a path parameter, requestId (max 100 chars, the idempotency key) and amount (min 0.01); note (max 500 chars) is optional.

        Emits an ACCOUNTING_CUSTOMER_CREDIT_REFUND event; replaying the same requestId returns the original refund instead of double-paying.

        Returns 404 when the credit is not found, 409 for insufficient open credit, a closed period, or a requestId reused for a different operation, and 400 when the amount is missing or non-positive.

        '
      operationId: refundCustomerCredit
      parameters:
      - name: creditId
        in: path
        description: Credit identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Idempotent cash refund of part or all of the open credit.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreditRefundRequest'
            examples:
              Refund remainder:
                description: Refund remainder
                value:
                  requestId: refund-2026-08-13-001
                  amount: 15.0
                  note: Customer requested cash back
        required: true
      responses:
        '200':
          description: Credit refunded (or the original refund replayed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCreditTransactionResponse'
        '400':
          description: Amount missing or non-positive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Credit not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Insufficient open credit, accounting period not open, or the request id was already used for a different operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - accounting:customer-credit:refund
      x-required-permissions:
      - accounting:customer-credit:refund
  /v1/accounting/customer-credits/{creditId}/applications:
    post:
      tags:
      - Customer Credits
      summary: Apply Customer Credit To Invoice
      description: 'Draws an open customer credit down against an outstanding invoice, posting debit Customer Credit Liability, credit Accounts Receivable for the applied amount.

        Use this tool to consume standing credit against an invoice; do not use refundCustomerCredit, which pays the credit back as cash, and do not use createCreditMemo, which issues new credit against an invoice.

        Preconditions: the credit must have sufficient open amount, the invoice must be AR-eligible and belong to the same customer, the amount must not exceed the invoice balance, and the accounting period must be open.

        Required inputs: creditId (UUID) as a path parameter, requestId (max 100 chars, the idempotency key), invoiceId (UUID) and amount (min 0.01).

        Emits an ACCOUNTING_CUSTOMER_CREDIT_APPLY event; replaying the same requestId returns the original application instead of double-applying.

        Returns 404 when the credit or invoice is not found, 409 for insufficient open credit, an ineligible or foreign invoice, an amount over the invoice balance, a closed period, or a requestId reused for a different operation, and 400 when the amount is missing or non-positive.

        '
      operationId: applyCustomerCredit
      parameters:
      - name: creditId
        in: path
        description: Credit identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Idempotent draw-down of the credit against one outstanding invoice.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreditApplicationRequest'
            examples:
              Apply to invoice:
                description: Apply to invoice
                value:
                  requestId: apply-2026-08-13-001
                  invoiceId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  amount: 25.0
        required: true
      responses:
        '200':
          description: Credit applied (or the original application replayed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCreditTransactionResponse'
        '400':
          description: Amount missing or non-positive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Credit or invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Insufficient open credit, invoice not AR-eligible, invoice belongs to another customer, amount exceeds the invoice balance, accounting period not open, or the request id was already used for a different operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - accounting:customer-credit:apply
      x-required-permissions:
      - accounting:customer-credit:apply
  /v1/accounting/credit-memos:
    get:
      tags:
      - Credit Memos
      summary: List Credit Memos
      description: 'Lists credit memos as a paginated projection, optionally filtered by customer, original invoice or lifecycle status.

        Use this tool when browsing or reconciling memos; do not use getCreditMemo, which fetches one memo by its known id.

        Preconditions: none beyond the caller holding accounting:credit-memo:read.

        Required inputs: none; customerId, originalInvoiceId and status (DRAFT, POSTED, APPLIED, VOIDED) are optional filters, with standard page, size and sort parameters.

        Emits an ACCOUNTING_CREDIT_MEMO_LIST audit event; no state changes.

        Returns 400 when pagination or filter parameters are invalid.

        '
      operationId: listCreditMemos
      parameters:
      - name: customerId
        in: query
        description: Filter by customer ID
        required: false
        schema:
          type: string
          format: uuid
      - name: originalInvoiceId
        in: query
        description: Filter by original invoice ID
        required: false
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        description: Filter by status (DRAFT, POSTED, APPLIED, VOIDED)
        required: false
        schema:
          type: string
          enum:
          - DRAFT
          - POSTED
          - APPLIED
          - VOIDED
      - name: pageable
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Pageable'
      responses:
        '200':
          description: Credit memos retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageCreditMemoResponse'
        '400':
          description: Invalid pagination or filter parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageCreditMemoResponse'
      security:
      - bearerAuth:
        - accounting:credit-memo:read
      x-required-permissions:
      - accounting:credit-memo:read
    post:
      tags:
      - Credit Memos
      summary: Create Credit Memo
      description: 'Creates and posts a credit memo against a finalized invoice, reversing invoice charges by posting debit revenue and tax, credit Accounts Receivable, and reducing the invoice''s outstanding balance.

        Use this tool for AR corrections against a specific invoice; do not use applyCustomerCredit, which draws down a standing customer credit, and do not use voidCreditMemo, which backs out a memo already posted.

        Preconditions: the invoice must exist and be finalized, and creditAmount must not exceed the invoice''s outstanding balance.

        Required inputs: originalInvoiceId (UUID), creditAmount (min 0.01) and reasonCode (max 50 chars, kept for the audit trail); justificationNote (max 1000 chars) is optional.

        Emits an ACCOUNTING_CREDIT_MEMO_CREATE event and posts the reversing GL entries.

        Returns 404 when the invoice is not found, 409 when the amount exceeds the outstanding balance or the invoice is not finalized, and 401 when no authenticated user is present.

        '
      operationId: createCreditMemo
      requestBody:
        description: Credit to issue against a finalized invoice, with the audit reason code.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCreditMemoRequest'
            examples:
              Partial credit:
                description: Partial credit
                value:
                  originalInvoiceId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  creditAmount: 45.0
                  reasonCode: BILLING_ERROR
                  justificationNote: Labor line billed twice
        required: true
      responses:
        '201':
          description: Credit memo created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditMemoResponse'
        '400':
          description: Invalid request - validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditMemoResponse'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditMemoResponse'
        '409':
          description: Business rule violation - amount exceeds balance or invoice not finalized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditMemoResponse'
      security:
      - bearerAuth:
        - accounting:credit-memo:create
      x-required-permissions:
      - accounting:credit-memo:create
  /v1/accounting/credit-memos/{creditMemoId}/void:
    post:
      tags:
      - Credit Memos
      summary: Void Credit Memo
      description: 'Voids a POSTED credit memo by posting the mirror GL entry (debit AR, credit Revenue and Sales-Tax Payable) dated at void time, restoring the invoice''s outstanding balance.

        Use this tool to back out a memo issued in error; do not use createCreditMemo, which issues new credit, and note that APPLIED memos have been consumed and cannot be voided.

        Preconditions: the credit memo must exist and be in POSTED status; VOIDED is terminal.

        Required inputs: creditMemoId (UUID) as a path parameter and a non-blank voidReason (max 1000 chars).

        Emits an ACCOUNTING_CREDIT_MEMO_VOID event; the memo''s original posting-period figures are never restated, and the tax-liability report restores the reversed tax in the void''s period so GL drift stays zero.

        Returns 404 when the memo is not found, 409 when it is not POSTED, and 400 when the void reason is missing or blank.

        '
      operationId: voidCreditMemo
      parameters:
      - name: creditMemoId
        in: path
        description: Credit Memo id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Mandatory audit reason for voiding the posted memo.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidCreditMemoRequest'
            examples:
              Void issued in error:
                description: Void issued in error
                value:
                  voidReason: Memo issued against wrong invoice
        required: true
      responses:
        '200':
          description: Credit memo voided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditMemoResponse'
        '400':
          description: Missing or invalid void reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Credit memo not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Credit memo is not in POSTED status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - accounting:credit-memo:void
      x-required-permissions:
      - accounting:credit-memo:void
  /v1/accounting/audit/refund:
    post:
      tags:
      - Audit Trail
      summary: Record Refund Audit Entry
      description: 'Records an audit trail entry for a refund exception, validating refund policy and settlement handling for the original payment before persisting.

        Use this tool when a customer refund is granted; do not use refundCustomerCredit, which actually moves money out of a standing credit, and do not use recordPriceOverrideAudit for price changes.

        Preconditions: the refund must pass the refund authorization policy for its type and amount; a denial records nothing.

        Required inputs: invoiceId (UUID), paymentId (UUID), refundType, refundAmount and originalPaymentStatus; actorId is optional.

        Emits an ACCOUNTING_AUDIT_REFUND event.

        Returns 403 AUTHORIZATION_DENIED when separate authorization is required and absent, and 400 when required fields are missing.

        '
      operationId: recordRefundAudit
      requestBody:
        description: Refund exception details with type, amount and original payment status.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
            examples:
              Settled payment reversal:
                description: Settled payment reversal
                value:
                  invoiceId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  paymentId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
                  refundType: REVERSAL
                  refundAmount: 25.0
                  originalPaymentStatus: SETTLED
        required: true
      responses:
        '201':
          description: Refund recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditTrailResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Authorization denied - separate authorization required
          content:
            application/json:
              schema:
                type: object
        '422':
          description: Refund policy validation failed
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
      security:
      - bearerAuth:
        - accounting:events:submit
      x-required-permissions:
      - accounting:events:submit
