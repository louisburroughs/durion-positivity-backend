          description: Payment reference (idempotency key)
          example: 01936e5c-7890-7a3d-8b6e-2b3456789012
        vendorId:
          type: string
          format: uuid
          description: Vendor UUID
          example: 01936e5b-4567-7a3d-8b6e-1a2345678901
        vendorName:
          type: string
          description: Vendor name
          example: Acme Supplies Ltd
        grossAmount:
          type: number
          description: Gross payment amount
          example: 1500.0
        feeAmount:
          type: number
          description: Fee amount
          example: 15.0
        netAmount:
          type: number
          description: Net amount
          example: 1485.0
        unappliedAmount:
