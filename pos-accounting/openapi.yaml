      - accounting:export:view
  /v1/accounting/gl-accounts:
    get:
      description: 'Lists the chart of accounts as a paginated projection, optionally filtered by derived lifecycle status and sorted by a named field.

        Use this tool when browsing or searching the chart of accounts; do not use getGLAccount, which retrieves one account by its known id.

        Preconditions: none beyond the caller holding accounting:coa:view; an empty chart returns an empty page rather than an error.

        Required inputs: none; page defaults to 0, size to 20, sort to accountCode ascending (format ''field,direction''), and status optionally filters by ACTIVE, INACTIVE or NOT_YET_ACTIVE.

        Emits an ACCOUNTING_GL_ACCOUNT_LIST audit event; no accounting state changes.

        Returns 400 when the sort property is not one of the supported fields.

        '
      operationId: listGLAccounts
      parameters:
      - description: Page index (0-based)
        in: query
        name: page
        required: false
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
      - description: Page size
        in: query
        name: size
        required: false
        schema:
          default: 20
          exclusiveMinimum: 0
          format: int32
          type: integer
      - description: 'Sort field with optional direction, e.g. ''modifiedAt,desc''. Supported fields: accountCode, accountName, accountType, description, activationDate, deactivationDate, createdAt, modifiedAt, updatedAt, glAccountId. Direction defaults to asc.'
        in: query
        name: sort
        required: true
        schema:
          default: accountCode
          minLength: 1
          type: string
      - description: Filter by account status
        in: query
        name: status
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GLAccountListResponse'
          description: GL accounts listed
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unsupported sort property or direction
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden
      security:
      - bearerAuth:
        - accounting:coa:view
      summary: List GL Accounts
      tags:
      - GL Accounts
      x-required-permissions:
      - accounting:coa:view
    post:
      description: 'Creates a GL account in the chart of accounts with a unique account code, classification and activation date.

        Use this tool when adding a new account to the chart; do not use updateGLAccount, which edits the mutable fields of an account that already exists.

        Preconditions: no account may already exist with the same accountCode; a parentAccountId, when supplied, must reference an existing account.

        Required inputs: accountCode (pattern #### or ####-###), accountName, accountType (ASSET, LIABILITY, EQUITY, REVENUE or EXPENSE) and activationDate; accountSubtype, description and parentAccountId are optional, and reconcilable defaults to false.

        Emits an ACCOUNTING_GL_ACCOUNT_CREATE event; the account code and type are immutable after creation.

        Returns 409 when the account code already exists, and 400 when the parent account cannot be resolved.

        '
      operationId: createGLAccount
      requestBody:
        content:
          application/json:
            examples:
              Cash account:
                description: Cash account
                value:
                  accountCode: '1000'
                  accountName: Cash on Hand
                  accountSubtype: BANK_CASH
                  accountType: ASSET
                  activationDate: '2026-01-01T00:00:00'
                  description: Register and vault cash
                  reconcilable: true
            schema:
              $ref: '#/components/schemas/GLAccountCreateRequest'
        description: GL account definition to add to the chart of accounts.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GLAccountResponse'
          description: GL account created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request
      security:
      - bearerAuth:
        - accounting:coa:create
      summary: Create GL Account
      tags:
      - GL Accounts
      x-required-permissions:
      - accounting:coa:create
  /v1/accounting/gl-accounts/{glAccountId}:
    get:
      description: 'Returns one GL account with its code, name, type, subtype, reconcilable flag and derived lifecycle status.

        Use this tool when the GL account id is already known; use listGLAccounts instead when searching by code, name or status.

        Preconditions: the GL account must exist.

        Required inputs: glAccountId (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 404 when no GL account exists for the supplied id.

        '
      operationId: getGLAccount
      parameters:
      - description: GL account identifier
        in: path
        name: glAccountId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GLAccountResponse'
          description: GL account returned
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: GL account not found
      security:
      - bearerAuth:
        - accounting:coa:view
      summary: Get GL Account
      tags:
      - GL Accounts
      x-required-permissions:
      - accounting:coa:view
    put:
      description: 'Updates the mutable descriptive fields of an existing GL account: name, description, subtype and the reconcilable flag.

        Use this tool when correcting or enriching an account''s metadata; do not use createGLAccount, which adds a new account, and note that accountCode and accountType are immutable and cannot be changed by any operation.

        Preconditions: the GL account must exist.

        Required inputs: glAccountId (UUID) as a path parameter; all body fields are optional and only supplied fields are changed (accountName max 100 chars, description max 500).

        Emits an ACCOUNTING_GL_ACCOUNT_UPDATE event; posted journal entries referencing the account are unaffected.

        Returns 404 when no GL account exists for the supplied id.

        '
      operationId: updateGLAccount
      parameters:
      - description: GL account identifier
        in: path
        name: glAccountId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Rename and mark reconcilable:
                description: Rename and mark reconcilable
                value:
                  accountName: Operating Cash
                  accountSubtype: BANK_CASH
                  description: Primary operating bank account
                  reconcilable: true
            schema:
              $ref: '#/components/schemas/GLAccountUpdateRequest'
        description: Mutable GL account fields to change; omitted fields keep their current values.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GLAccountResponse'
          description: GL account updated
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: GL account not found
      security:
      - bearerAuth:
        - accounting:coa:edit
      summary: Update GL Account
      tags:
      - GL Accounts
      x-required-permissions:
      - accounting:coa:edit
  /v1/accounting/gl-accounts/{glAccountId}/activate:
    post:
      description: 'Activates a GL account for posting by setting its activation date to the start of the supplied effective date and clearing any deactivation date.

        Use this tool when re-enabling an inactive account or bringing a not-yet-active account into service; do not use deactivateGLAccount, which does the reverse.

        Preconditions: the GL account must exist; activation is idempotent and simply resets the effective dates.

        Required inputs: glAccountId (UUID) as a path parameter and effectiveDate (ISO date) in the body; the account becomes ACTIVE at start of day on that date.

        Emits an ACCOUNTING_GL_ACCOUNT_ACTIVATE event; no journal entries are created or altered.

        Returns 404 when no GL account exists for the supplied id.

        '
      operationId: activateGLAccount
      parameters:
      - description: GL account identifier
        in: path
        name: glAccountId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Activate at month start:
                description: Activate at month start
                value:
                  effectiveDate: '2026-09-01'
            schema:
              $ref: '#/components/schemas/GLAccountActivateRequest'
        description: Effective date on which the account becomes active for posting.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GLAccountResponse'
          description: GL account activated
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: GL account not found
      security:
      - bearerAuth:
        - accounting:coa:edit
      summary: Activate GL Account
      tags:
      - GL Accounts
      x-required-permissions:
      - accounting:coa:edit
  /v1/accounting/gl-accounts/{glAccountId}/archive:
    post:
      description: 'Archives an inactive GL account as a soft delete, tagging it [ARCHIVED] while keeping the record and its posting history.

        Use this tool only after deactivateGLAccount has succeeded; do not use it on an ACTIVE account, which must be deactivated to zero balance first.

        Preconditions: the GL account must exist and its derived status must be INACTIVE.

        Required inputs: glAccountId (UUID) as a path parameter; the request body is optional and ignored.

        Emits an ACCOUNTING_GL_ACCOUNT_ARCHIVE event; the row is never physically deleted.

        Returns 404 when no GL account exists for the supplied id, and 409 ACCOUNT_NOT_INACTIVE when the account is not INACTIVE.

        '
      operationId: archiveGLAccount
      parameters:
      - description: GL account identifier
        in: path
        name: glAccountId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Empty body:
                description: Empty body
            schema:
              type: object
        description: Optional and ignored; send an empty object or omit the body entirely.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GLAccountResponse'
          description: GL account archived
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: GL account not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Account is not INACTIVE (ACCOUNT_NOT_INACTIVE)
      security:
      - bearerAuth:
        - accounting:coa:deactivate
      summary: Archive GL Account
      tags:
      - GL Accounts
      x-required-permissions:
      - accounting:coa:deactivate
  /v1/accounting/gl-accounts/{glAccountId}/balance:
    get:
      description: 'Returns the current posted balance of one GL account, computed from its journal entry lines.

        Use this tool for a single account''s balance; use the trial balance report in financial reporting instead when balances for the whole chart are needed.

        Preconditions: the GL account must exist; an account with no postings reports a zero balance.

        Required inputs: glAccountId (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 404 when no GL account exists for the supplied id.

        '
      operationId: getGLAccountBalance
      parameters:
      - description: GL account identifier
        in: path
        name: glAccountId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GLAccountBalanceResponse'
          description: Balance returned
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: GL account not found
      security:
      - bearerAuth:
        - accounting:coa:view
      summary: Get GL Account Balance
      tags:
      - GL Accounts
      x-required-permissions:
      - accounting:coa:view
  /v1/accounting/gl-accounts/{glAccountId}/deactivate:
    post:
      description: 'Deactivates a GL account by stamping its deactivation date now, preventing future postings to it.

        Use this tool when retiring an account from active use; do not use archiveGLAccount, which additionally flags an already-INACTIVE account as archived, and do not use it while the account still carries a balance.

        Preconditions: the GL account must exist and its posted balance must be exactly zero.

        Required inputs: glAccountId (UUID) as a path parameter; the request body is optional and ignored.

        Emits an ACCOUNTING_GL_ACCOUNT_DEACTIVATE event; historical journal entries remain intact.

        Returns 404 when no GL account exists for the supplied id, and 409 ACCOUNT_NOT_ZERO_BALANCE when the account balance is not zero.

        '
      operationId: deactivateGLAccount
      parameters:
      - description: GL account identifier
        in: path
        name: glAccountId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Empty body:
                description: Empty body
            schema:
              type: object
        description: Optional and ignored; send an empty object or omit the body entirely.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GLAccountResponse'
          description: GL account deactivated
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: GL account not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Account balance is not zero (ACCOUNT_NOT_ZERO_BALANCE)
      security:
      - bearerAuth:
        - accounting:coa:deactivate
      summary: Deactivate GL Account
      tags:
      - GL Accounts
      x-required-permissions:
      - accounting:coa:deactivate
  /v1/accounting/invoice-revenue/reconcile:
    post:
      description: 'Posts revenue to the general ledger for every finalized invoice in the accounting replica that has no open revenue posting yet, using the same entries the live invoice event path creates (Dr Accounts Receivable / Cr Service Revenue / Cr Sales Tax Payable, dated at the invoice''s finalization).

        Use this tool to backfill invoices finalized before revenue posting existed, after a consumer outage, or when the income statement disagrees with invoice totals; do not use retryAccountingEvent, which re-runs a single failed ingestion event, or an outbox replay, which cannot reach invoices that never produced an event.

        Preconditions: caller holds accounting:gl:reconcile. Idempotent: an invoice already on the ledger is reported as ALREADY_POSTED and left alone; a second run posts nothing new.

        Required inputs: none. Optional body: finalizedFrom / finalizedTo (half-open instant window), invoiceIds (overrides the window), dryRun (report without posting), limit (oldest first).

        Emits an ACCOUNTING_INVOICE_REVENUE_RECONCILE event and returns 200 with per-invoice outcomes (POSTED, WOULD_POST, ALREADY_POSTED, SKIPPED with reason, FAILED with error) and totals.

        '
      operationId: reconcileInvoiceRevenue
      requestBody:
        content:
          application/json:
            examples:
              Dry run for July-August 2026:
                description: Dry run for July-August 2026
                value:
                  dryRun: true
                  finalizedFrom: '2026-07-01T00:00:00Z'
                  finalizedTo: '2026-09-01T00:00:00Z'
            schema:
              $ref: '#/components/schemas/InvoiceRevenueReconcileRequest'
        description: Optional bounds; an empty or absent body reconciles everything, live.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceRevenueReconcileResponse'
          description: Reconciliation run completed; see per-invoice outcomes
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid bounds (limit outside 1-5000)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks accounting:gl:reconcile
      security:
      - bearerAuth:
        - accounting:gl:reconcile
      summary: Reconcile Invoice Revenue Postings
      tags:
      - Accounting GL
      x-required-permissions:
      - accounting:gl:reconcile
  /v1/accounting/invoice/invoices:
    post:
      description: 'Requests regeneration of an invoice from a completed workorder, either synchronously or via the asynchronous command path.

        Use this tool when an invoice must be rebuilt from its source workorder; do not use getInvoiceStatus, which only reads the current payment status.

        Preconditions: the workorder must exist and be in COMPLETED state.

        Required inputs: workorderId (UUID); idempotencyKey is optional and de-duplicates repeated regeneration commands.

        Emits an ACCOUNTING_INVOICE_REGENERATE event; on the async path the call returns 202 with status PENDING and the invoice arrives later via invoice.events.v1.

        Returns 202 when the command is accepted asynchronously, 404 when the workorder is not found, 409 when it is not COMPLETED, and 503 when the workorder service is unavailable.

        '
      operationId: regenerateInvoiceFromWorkorder
      requestBody:
        content:
          application/json:
            examples:
              Regenerate invoice:
                description: Regenerate invoice
                value:
                  idempotencyKey: regen-2026-08-13-001
                  workorderId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
            schema:
              $ref: '#/components/schemas/RegenerateInvoiceFromWorkorderRequest'
        description: Workorder to rebuild the invoice from, with an optional idempotency key.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceGenerationResponse'
          description: Invoice regenerated
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceGenerationResponse'
          description: Regeneration command accepted (ADR-0044 async path); invoice arrives via invoice.events.v1
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Workorder not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Workorder is not in COMPLETED state
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Workorder service unavailable
      security:
      - bearerAuth:
        - accounting:ap:view
      summary: Regenerate Invoice From Workorder
      tags:
      - Invoice Payments
      x-required-permissions:
      - accounting:ap:view
  /v1/accounting/invoice/rules/{customerId}:
