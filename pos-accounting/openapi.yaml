          example: 01960003-0000-7000-8000-000000000001
        idempotencyKey:
          type: string
          description: Optional idempotency key to safely retry regeneration
          example: 01960003-0000-7000-8000-000000000099
      required:
      - workorderId
    InvoiceGenerationResponse:
      type: object
