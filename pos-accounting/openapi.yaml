        debitAmount:
          type: number
          description: Debit amount for this line
          example: 1250.0
          minimum: 0.0
        creditAmount:
          type: number
          description: Credit amount for this line
          example: 1250.0
          minimum: 0.0
        description:
          type: string
          description: Line description
          example: Recognize receivable
