openapi: 3.1.0
info:
  title: POS Accounting Service API
  description: Accounting service for invoice, journal entry, and GL account management
  contact:
    name: Durion Support Services
    email: louis.burroughs@gmail.com
  version: v1
servers:
- url: http://localhost:8086
  description: Generated server url
tags:
- name: Audit Trail
  description: Audit trail operations for tracking accounting exceptions and overrides
- name: Accounting Exports
  description: Manage timekeeping and generic data export jobs.
- name: Payment Applications
  description: Manage payment applications to invoices (AR)
- name: Posting Rules
  description: Manage posting rule sets and their lifecycle.
- name: Invoice Payments
  description: Apply payments and query invoice status.
- name: Mapping Keys
  description: Manage mapping keys for GL mapping taxonomy
- name: Posting Categories
  description: Manage posting categories for GL mapping taxonomy
- name: Credit Memos
  description: Manage credit memos for AR corrections
- name: GL Mapping API
  description: Endpoints for creating and resolving GL mappings
- name: Journal Entries
  description: Manage journal entries including posting and reversal.
- name: GL Accounts
  description: Manage chart of accounts including lifecycle actions.
- name: Bank Reconciliation
  description: 'Manual CSV bank reconciliation: import a statement, match lines to posted GL entries, record adjustments, and finalize when balanced.'
- name: Financial Reporting for Tax Liability
  description: Period-close-aligned freeze of the Sales-Tax Liability report
- name: Accounting Periods
  description: 'Accounting period lifecycle: list periods, close a period, reopen a closed period, and manage the org-level hard-lock date.'
- name: Settlement Reconciliation
  description: 'Processor settlement reconciliation review: list settlement lines, manually match an unmatched line to a receivable payment, and write off small unmatched lines.'
- name: Vendor Directory API
  description: Vendor search and lookup endpoints for name-to-vendorId resolution (typeahead support)
- name: Customer Credits
  description: 'AR customer credits: balances, application to invoices, and refunds'
- name: Location Cost Reporting
  description: Read-only location Labor & Overhead Cost Report (CAP-316)
- name: AP Payments
  description: Accounts Payable vendor payment operations
- name: Financial Reporting
  description: Income Statement and Balance Sheet generation with drilldown
- name: Vendor Bill API
  description: Endpoints for vendor bill creation, matching, retrieval, and exception resolution
- name: Default GL Mappings
  description: Manage default GL account mappings for event types without explicit posting rules
- name: Accounting Events
  description: Ingest and manage accounting events for journal processing.
paths:
  /v1/accounting/posting-rules/{postingRuleSetId}:
    get:
      tags:
      - Posting Rules
      summary: Get Posting Rule Set
      description: 'Returns one posting rule set with its metadata and current version state.

        Use this tool when the rule set id is already known; use listPostingRuleSets instead when searching, or listPostingRuleVersions for the full version history.

        Preconditions: the posting rule set must exist.

        Required inputs: postingRuleSetId (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 400 when no posting rule set exists for the supplied id (mapped as VALIDATION_ERROR, not 404).

        '
      operationId: getPostingRuleSet
      parameters:
      - name: postingRuleSetId
        in: path
        description: Posting rule set identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Posting rule set returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRuleSetResponse'
        '404':
          description: Posting rule set not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRuleSetResponse'
      security:
      - bearerAuth:
        - accounting:posting_rules:view
      x-required-permissions:
      - accounting:posting_rules:view
    put:
      tags:
      - Posting Rules
      summary: Update Posting Rule Set
      description: 'Updates a posting rule set''s metadata and draft rules definition while no PUBLISHED version exists.

        Use this tool to iterate on a draft before publishing; do not use it once a version is PUBLISHED, and do not use publishPostingRuleSet, which is the activation step.

        Preconditions: the rule set must exist and must not have a PUBLISHED version.

        Required inputs: postingRuleSetId (UUID) as a path parameter plus the same body shape as createPostingRuleSet (name, eventType, rulesDefinition, createdBy).

        Emits an ACCOUNTING_POSTING_RULE_UPDATE event.

        Returns 409 when a PUBLISHED version already exists, and 400 when the rule set id cannot be resolved (mapped as VALIDATION_ERROR, not 404).

        '
      operationId: updatePostingRuleSet
      parameters:
      - name: postingRuleSetId
        in: path
        description: Posting rule set identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Replacement rule set metadata and draft rules definition.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostingRuleSetCreateRequest'
            examples:
              Revised draft rules:
                description: Revised draft rules
                value:
                  name: Invoice posting rules v2
                  eventType: INVOICE_FINALIZED
                  rulesDefinition: '{"rules":[{"debit":"1100","credit":"4000","amountField":"totalAmount"}]}'
                  createdBy: jdoe
        required: true
      responses:
        '200':
          description: Posting rule set updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRuleSetResponse'
        '404':
          description: Posting rule set not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRuleSetResponse'
        '409':
          description: Cannot modify published rule set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRuleSetResponse'
      security:
      - bearerAuth:
        - accounting:posting_rules:create
      x-required-permissions:
      - accounting:posting_rules:create
  /v1/accounting/posting-categories/{postingCategoryId}:
    get:
      tags:
      - Posting Categories
      summary: Get Posting Category
      description: 'Returns one posting category with its name, description and active flag.

        Use this tool when the category id is already known; use listPostingCategories instead when browsing or filtering.

        Preconditions: the posting category must exist.

        Required inputs: postingCategoryId (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 404 when no posting category exists for the supplied id.

        '
      operationId: getPostingCategory
      parameters:
      - name: postingCategoryId
        in: path
        description: Posting category identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Posting category returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingCategoryResponse'
        '404':
          description: Posting category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingCategoryResponse'
      security:
      - bearerAuth:
        - accounting:posting-category:view
      x-required-permissions:
      - accounting:posting-category:view
    put:
      tags:
      - Posting Categories
      summary: Update Posting Category
      description: 'Renames a posting category or changes its description; mapping keys under it are unaffected.

        Use this tool to correct a category''s name or description; do not use deactivatePostingCategory, which retires the category from future mapping use.

        Preconditions: the posting category must exist, and a changed name must not collide with another category.

        Required inputs: postingCategoryId (UUID) as a path parameter, categoryName (max 100 chars) and modifiedBy (max 50 chars); description is optional.

        Emits an ACCOUNTING_POSTING_CATEGORY_UPDATE event.

        Returns 404 when the category does not exist, and 400 when the new name already exists.

        '
      operationId: updatePostingCategory
      parameters:
      - name: postingCategoryId
        in: path
        description: Posting category identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Replacement name and description for the posting category.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostingCategoryUpdateRequest'
            examples:
              Rename category:
                description: Rename category
                value:
                  categoryName: PAYMENT_TENDERS
                  description: Payment tender classifications
                  modifiedBy: jdoe
        required: true
      responses:
        '200':
          description: Posting category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingCategoryResponse'
        '404':
          description: Posting category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingCategoryResponse'
        '400':
          description: Invalid request or duplicate name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingCategoryResponse'
      security:
      - bearerAuth:
        - accounting:posting-category:edit
      x-required-permissions:
      - accounting:posting-category:edit
  /v1/accounting/periods/hard-lock:
    get:
      tags:
      - Accounting Periods
      summary: Get Accounting Hard-Lock Date
      description: 'Returns the org-level hard-lock date; journal entries dated strictly before this date are permanently rejected with PERIOD_HARD_LOCKED and no override path, unlike a CLOSED period which accounting:period:override plus a justification can bypass.

        Use this tool to check the current lock boundary before posting backdated entries; do not use setAccountingHardLockDate, which moves the lock, unless a change is intended.

        Preconditions: none; the lock may be unset.

        Required inputs: none; there are no parameters and no request body.

        Emits an ACCOUNTING_PERIOD_HARD_LOCK_VIEW audit event; no state changes.

        Returns 200 with hardLockDate null when no hard lock has been configured yet.

        '
      operationId: getAccountingHardLockDate
      responses:
        '200':
          description: Current hard-lock date returned; hardLockDate is null when no hard lock is set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardLockDateResponse'
        '403':
          description: Caller lacks the accounting:period:view permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - accounting:period:view
      x-required-permissions:
      - accounting:period:view
    put:
      tags:
      - Accounting Periods
      summary: Set Accounting Hard-Lock Date
      description: 'Sets the org-level hard-lock date; from then on, journal entries dated strictly before this date are permanently rejected with PERIOD_HARD_LOCKED and no override path, not even accounting:period:override, which only covers CLOSED periods.

        Use this tool after statutory filings or audits to make history immutable; use closeAccountingPeriod for the reversible month-end close instead.

        Preconditions: the new date must be on or after the currently stored hard-lock date; the lock is monotonic-forward-only and effectively irreversible, so set it deliberately.

        Required inputs: hardLockDate (ISO date) and a non-blank justification (max 500 characters), recorded in the audit trail with the acting user.

        Emits an ACCOUNTING_PERIOD_HARD_LOCK_SET event and returns the stored hard-lock date.

        Returns 422 HARD_LOCK_DATE_REGRESSION when the date would move backward, and 400 when the date or justification is missing or blank.

        '
      operationId: setAccountingHardLockDate
      requestBody:
        description: New hard-lock date with the audit justification for moving it forward.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HardLockDateUpdateRequest'
            examples:
              Lock after audit:
                description: Lock after audit
                value:
                  hardLockDate: 2026-01-01
                  justification: FY2025 audit finalized; history locked
        required: true
      responses:
        '200':
          description: Hard-lock date updated; the stored value is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardLockDateResponse'
        '400':
          description: hardLockDate is missing, or justification is missing, blank, or over 500 characters (ARGUMENT_NOT_VALID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Caller lacks the accounting:period:hard_lock permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Requested date is before the currently stored hard-lock date (HARD_LOCK_DATE_REGRESSION) — the hard lock only moves forward
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - accounting:period:hard_lock
      x-required-permissions:
      - accounting:period:hard_lock
  /v1/accounting/mapping-keys/{mappingKeyId}:
    get:
      tags:
      - Mapping Keys
      summary: Get Mapping Key
      description: 'Returns one mapping key with its posting category, name, description and active flag.

        Use this tool when the mapping key id is already known; use listMappingKeysByCategory instead when browsing the keys of a category.

        Preconditions: the mapping key and its parent posting category must exist.

        Required inputs: mappingKeyId (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 404 when no mapping key exists for the supplied id.

        '
      operationId: getMappingKey
      parameters:
      - name: mappingKeyId
        in: path
        description: Mapping key identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Mapping key returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingKeyResponse'
        '404':
          description: Mapping key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingKeyResponse'
      security:
      - bearerAuth:
        - accounting:mapping-key:view
      x-required-permissions:
      - accounting:mapping-key:view
    put:
      tags:
      - Mapping Keys
      summary: Update Mapping Key
      description: 'Renames a mapping key or changes its description; the key stays in its posting category.

        Use this tool to correct a key''s name or description; do not use deactivateMappingKey, which retires the key from future mapping use.

        Preconditions: the mapping key must exist, and a changed name must not collide with another key in the same category.

        Required inputs: mappingKeyId (UUID) as a path parameter, keyName (max 100 chars) and modifiedBy (max 50 chars); description is optional.

        Emits an ACCOUNTING_MAPPING_KEY_UPDATE event.

        Returns 404 when the mapping key does not exist, and 400 when the new name already exists in the category.

        '
      operationId: updateMappingKey
      parameters:
      - name: mappingKeyId
        in: path
        description: Mapping key identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Replacement name and description for the mapping key.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MappingKeyUpdateRequest'
            examples:
              Rename key:
                description: Rename key
                value:
                  keyName: TENDER_CASH_DRAWER
                  description: Cash drawer tender postings
                  modifiedBy: jdoe
        required: true
      responses:
        '200':
          description: Mapping key updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingKeyResponse'
        '404':
          description: Mapping key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingKeyResponse'
        '400':
          description: Invalid request or duplicate name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingKeyResponse'
      security:
      - bearerAuth:
        - accounting:mapping-key:edit
      x-required-permissions:
      - accounting:mapping-key:edit
  /v1/accounting/journal-entries/{journalEntryId}:
    get:
      tags:
      - Journal Entries
      summary: Get Journal Entry
      description: 'Returns one journal entry with its lines, status (DRAFT, POSTED or REVERSED), entry type and posting metadata.

        Use this tool when the journal entry id is already known; use listJournalEntries instead when searching by entry number or browsing.

        Preconditions: the journal entry must exist.

        Required inputs: journalEntryId (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 400 with code VALIDATION_ERROR when no journal entry exists for the supplied id (this module maps entry not-found to 400, not 404).

        '
      operationId: getJournalEntry
      parameters:
      - name: journalEntryId
        in: path
        description: Journal entry identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Journal entry returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryResponse'
        '404':
          description: Journal entry not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryResponse'
      security:
      - bearerAuth:
        - accounting:je:view
      x-required-permissions:
      - accounting:je:view
    put:
      tags:
      - Journal Entries
      summary: Update Journal Entry
      description: 'Replaces the description and lines of a journal entry that is still in DRAFT status; posted entries are immutable.

        Use this tool to correct a draft before posting; do not use it on a POSTED entry, which only reverseJournalEntry can back out.

        Preconditions: the entry must exist in DRAFT status, and the replacement lines must remain balanced.

        Required inputs: journalEntryId (UUID) as a path parameter plus the full replacement body (same shape as createJournalEntry); supplied lines replace the existing line set wholesale.

        Emits an ACCOUNTING_JOURNAL_ENTRY_UPDATE event; GL balances are unchanged because drafts are not yet in the ledger.

        Returns 409 when the entry is no longer DRAFT, and 400 when the updated entry is unbalanced or the entry id does not exist.

        '
      operationId: updateJournalEntry
      parameters:
      - name: journalEntryId
        in: path
        description: Journal entry identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Replacement description and balanced line set for the draft entry.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalEntryCreateRequest'
            examples:
              Corrected draft:
                description: Corrected draft
                value:
                  transactionDate: 2026-08-13 00:00:00
                  description: Corrected cash sale amount
                  lines:
                  - glAccountId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                    debitAmount: 130.0
                  - glAccountId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
                    creditAmount: 130.0
        required: true
      responses:
        '200':
          description: Journal entry updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryResponse'
        '404':
          description: Journal entry not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryResponse'
      security:
      - bearerAuth:
        - accounting:je:create
      x-required-permissions:
      - accounting:je:create
  /v1/accounting/gl-accounts/{glAccountId}:
    get:
      tags:
      - GL Accounts
      summary: Get GL Account
      description: 'Returns one GL account with its code, name, type, subtype, reconcilable flag and derived lifecycle status.

        Use this tool when the GL account id is already known; use listGLAccounts instead when searching by code, name or status.

        Preconditions: the GL account must exist.

        Required inputs: glAccountId (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 404 when no GL account exists for the supplied id.

        '
      operationId: getGLAccount
      parameters:
      - name: glAccountId
        in: path
        description: GL account identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: GL account returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GLAccountResponse'
        '404':
          description: GL account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GLAccountResponse'
      security:
      - bearerAuth:
        - accounting:coa:view
      x-required-permissions:
      - accounting:coa:view
    put:
      tags:
      - GL Accounts
      summary: Update GL Account
      description: 'Updates the mutable descriptive fields of an existing GL account: name, description, subtype and the reconcilable flag.

        Use this tool when correcting or enriching an account''s metadata; do not use createGLAccount, which adds a new account, and note that accountCode and accountType are immutable and cannot be changed by any operation.

        Preconditions: the GL account must exist.

        Required inputs: glAccountId (UUID) as a path parameter; all body fields are optional and only supplied fields are changed (accountName max 100 chars, description max 500).

        Emits an ACCOUNTING_GL_ACCOUNT_UPDATE event; posted journal entries referencing the account are unaffected.

        Returns 404 when no GL account exists for the supplied id.

        '
      operationId: updateGLAccount
      parameters:
      - name: glAccountId
        in: path
        description: GL account identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Mutable GL account fields to change; omitted fields keep their current values.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GLAccountUpdateRequest'
            examples:
              Rename and mark reconcilable:
                description: Rename and mark reconcilable
                value:
                  accountName: Operating Cash
                  description: Primary operating bank account
                  accountSubtype: BANK_CASH
                  reconcilable: true
        required: true
      responses:
        '200':
          description: GL account updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GLAccountResponse'
        '404':
          description: GL account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GLAccountResponse'
      security:
      - bearerAuth:
        - accounting:coa:edit
      x-required-permissions:
      - accounting:coa:edit
  /v1/accounting/default-mappings/{id}:
    get:
      tags:
      - Default GL Mappings
      summary: Get Default GL Mapping
      description: 'Returns one default GL mapping with its event type, debit and credit accounts, scope and active flag.

        Use this tool when the mapping id is already known; use searchDefaultMappings or listDefaultMappings instead when hunting by event type or organization.

        Preconditions: the default mapping must exist.

        Required inputs: id (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 400 when no default mapping exists for the supplied id (mapped as VALIDATION_ERROR, not 404).

        '
      operationId: getDefaultMapping
      parameters:
      - name: id
        in: path
        description: Default mapping identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Default mapping returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultGLMappingResponse'
        '404':
          description: Default mapping not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultGLMappingResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultGLMappingResponse'
      security:
      - bearerAuth:
        - accounting:default-mapping:view
      x-required-permissions:
      - accounting:default-mapping:view
    put:
      tags:
      - Default GL Mappings
      summary: Update Default GL Mapping
      description: 'Updates an existing default GL mapping''s event type, accounts, scope, description or active flag.

        Use this tool to repoint or rescope an existing fallback; do not use createDefaultMapping, which adds a new one, or deactivateDefaultMapping, which soft deletes.

        Preconditions: the default mapping must exist.

        Required inputs: id (UUID) as a path parameter plus the full replacement body with eventType, debitAccountId and creditAccountId; organizationId null means global scope.

        Emits an ACCOUNTING_DEFAULT_MAPPING_UPDATE event; future postings resolve against the updated pair while already-posted entries are untouched.

        Returns 400 when no default mapping exists for the supplied id (mapped as VALIDATION_ERROR, not 404).

        '
      operationId: updateDefaultMapping
      parameters:
      - name: id
        in: path
        description: Default mapping identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Replacement fallback mapping definition for the event type.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefaultGLMappingRequest'
            examples:
              Repoint credit account:
                description: Repoint credit account
                value:
                  eventType: CASH_SALE
                  debitAccountId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  creditAccountId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5d
                  active: true
        required: true
      responses:
        '200':
          description: Default mapping updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultGLMappingResponse'
        '404':
          description: Default mapping not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultGLMappingResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultGLMappingResponse'
      security:
      - bearerAuth:
        - accounting:default-mapping:edit
      x-required-permissions:
      - accounting:default-mapping:edit
    delete:
      tags:
      - Default GL Mappings
      summary: Deactivate Default GL Mapping
      description: 'Soft deletes a default GL mapping by marking it inactive; the row is retained for history and stops participating in fallback resolution.

        Use this tool to retire a fallback pair; do not use updateDefaultMapping with active=false only when other fields must change at the same time, and note there is no reactivation endpoint other than updateDefaultMapping.

        Preconditions: the default mapping must exist.

        Required inputs: id (UUID) as a path parameter; there is no request body.

        Emits an ACCOUNTING_DEFAULT_MAPPING_DELETE event.

        Returns 400 when no default mapping exists for the supplied id (mapped as VALIDATION_ERROR, not 404), and 204 with no body on success.

        '
      operationId: deactivateDefaultMapping
      parameters:
      - name: id
        in: path
        description: Default mapping identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Default mapping deactivated
        '404':
