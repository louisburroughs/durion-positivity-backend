            examples:
              Cash account:
                description: Cash account
                value:
                  accountCode: '1000'
                  accountName: Cash on Hand
                  accountSubtype: BANK_CASH
                  accountType: ASSET
                  activationDate: 2026-01-01 00:00:00
                  description: Register and vault cash
                  reconcilable: true
