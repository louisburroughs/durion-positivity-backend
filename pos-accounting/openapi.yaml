        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks accounting:payment:apply
      security:
      - bearerAuth:
        - accounting:payment:apply
      summary: List a Customer's Open Invoices
      tags:
      - Payment Applications
      x-required-permissions:
      - accounting:payment:apply
  /v1/accounting/default-mappings:
    get:
      description: 'Lists all default GL mappings as a paginated projection, including inactive ones.

        Use this tool to browse the fallback catalog; use searchDefaultMappings instead to filter by event type or organization, or resolveDefaultMapping to find the one that would apply to an event.

        Preconditions: none beyond the caller holding accounting:default-mapping:view.

        Required inputs: none; page defaults to 0 and size to 20.

        Emits an ACCOUNTING_DEFAULT_MAPPING_LIST audit event; no state changes.

        Returns 200 with an empty page when no default mappings exist.

        '
      operationId: listDefaultMappings
      parameters:
      - description: Page index (0-based)
        in: query
        name: page
        required: false
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
      - description: Page size
        in: query
        name: size
        required: false
        schema:
          default: 20
          exclusiveMinimum: 0
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultGLMappingListResponse'
          description: Default mappings listed
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden
      security:
      - bearerAuth:
        - accounting:default-mapping:view
      summary: List Default GL Mappings
      tags:
      - Default GL Mappings
      x-required-permissions:
      - accounting:default-mapping:view
    post:
      description: 'Creates a fallback debit and credit account pair for an event type, used by the posting engine when no explicit posting rule matches; resolution order is explicit rule, then org-scoped default, then global default, then UNMAPPED_EVENT_TYPE failure.

        Use this tool to guarantee an event type always posts somewhere; do not use createGLMapping, which maps a source-system external code to a single account.

        Preconditions: the debit and credit GL accounts must exist.

        Required inputs: eventType (max 100 chars), debitAccountId (UUID) and creditAccountId (UUID); organizationId is optional (null makes the default global) and active defaults to true.

        Emits an ACCOUNTING_DEFAULT_MAPPING_CREATE event.

        Returns 400 for an invalid request, 404 GL_ACCOUNT_NOT_FOUND when a referenced GL account does not exist, and 422 GL_ACCOUNT_NOT_ACTIVE when it exists but is not active on the current date.

        '
      operationId: createDefaultMapping
      requestBody:
        content:
          application/json:
            examples:
              Global fallback for cash sales:
                description: Global fallback for cash sales
                value:
                  active: true
                  creditAccountId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
                  debitAccountId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  description: Fallback posting for cash sales
                  eventType: CASH_SALE
            schema:
              $ref: '#/components/schemas/DefaultGLMappingRequest'
        description: Fallback debit and credit account pair for one event type.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultGLMappingResponse'
          description: Default mapping created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Referenced GL account not found (GL_ACCOUNT_NOT_FOUND)
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Referenced GL account is not active (GL_ACCOUNT_NOT_ACTIVE)
      security:
      - bearerAuth:
        - accounting:default-mapping:create
      summary: Create Default GL Mapping
      tags:
      - Default GL Mappings
      x-required-permissions:
      - accounting:default-mapping:create
  /v1/accounting/default-mappings/global:
    get:
      description: 'Returns all global default GL mappings, meaning those with no organizationId, which act as the last fallback before an event type fails as UNMAPPED_EVENT_TYPE.

        Use this tool to audit the global safety net; use searchDefaultMappings instead when org-scoped mappings are also of interest.

        Preconditions: none beyond the caller holding accounting:default-mapping:view.

        Required inputs: none; there are no parameters and no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 with an empty list when no global defaults are configured.

        '
      operationId: listGlobalDefaultMappings
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DefaultGLMappingResponse'
                type: array
          description: Global default mappings returned
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden
      security:
      - bearerAuth:
        - accounting:default-mapping:view
      summary: List Global Default Mappings
      tags:
      - Default GL Mappings
      x-required-permissions:
      - accounting:default-mapping:view
  /v1/accounting/default-mappings/resolve:
    get:
      description: 'Finds the most specific active default mapping for an event type, preferring an org-scoped mapping over the global one.

        Use this tool to see which fallback the posting engine would use for an event; do not use searchDefaultMappings, which lists matches without applying resolution priority.

        Preconditions: an active default mapping must exist for the event type at org or global scope.

        Required inputs: eventType as a query parameter; organizationId (UUID) is optional and widens resolution to that org''s mappings first.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 404 when no active default mapping resolves for the event type.

        '
      operationId: resolveDefaultMapping
      parameters:
      - description: Event type
        in: query
        name: eventType
        required: true
        schema:
          minLength: 1
          type: string
      - description: Organization ID (optional)
        in: query
        name: organizationId
        required: false
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultGLMappingResponse'
          description: Default mapping resolved
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No default mapping found
      security:
      - bearerAuth:
        - accounting:default-mapping:view
      summary: Resolve Default Mapping For Event
      tags:
      - Default GL Mappings
      x-required-permissions:
      - accounting:default-mapping:view
  /v1/accounting/default-mappings/search:
    get:
      description: 'Finds default GL mappings filtered by event type or organization; when both filters are omitted it returns the global defaults only.

        Use this tool to filter the fallback catalog; do not use resolveDefaultMapping, which applies the org-then-global resolution priority to pick the single winning mapping.

        Preconditions: none; eventType takes precedence when both filters are supplied.

        Required inputs: none; eventType and organizationId are optional query parameters.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 with an empty list when nothing matches the filter.

        '
      operationId: searchDefaultMappings
      parameters:
      - description: Filter by event type
        in: query
        name: eventType
        required: false
        schema:
          type: string
      - description: Filter by organization ID
        in: query
        name: organizationId
        required: false
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DefaultGLMappingResponse'
                type: array
          description: Matching default mappings returned
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden
      security:
      - bearerAuth:
        - accounting:default-mapping:view
      summary: Search Default GL Mappings
      tags:
      - Default GL Mappings
      x-required-permissions:
      - accounting:default-mapping:view
  /v1/accounting/default-mappings/{id}:
    delete:
      description: 'Soft deletes a default GL mapping by marking it inactive; the row is retained for history and stops participating in fallback resolution.

        Use this tool to retire a fallback pair; do not use updateDefaultMapping with active=false only when other fields must change at the same time, and note there is no reactivation endpoint other than updateDefaultMapping.

        Preconditions: the default mapping must exist.

        Required inputs: id (UUID) as a path parameter; there is no request body.

        Emits an ACCOUNTING_DEFAULT_MAPPING_DELETE event.

        Returns 204 with no body on success, and 404 DEFAULT_GL_MAPPING_NOT_FOUND when no default mapping exists for the supplied id.

        '
      operationId: deactivateDefaultMapping
      parameters:
      - description: Default mapping identifier
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: Default mapping deactivated
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No default mapping exists for the identifier (DEFAULT_GL_MAPPING_NOT_FOUND)
      security:
      - bearerAuth:
        - accounting:default-mapping:delete
      summary: Deactivate Default GL Mapping
      tags:
      - Default GL Mappings
      x-required-permissions:
      - accounting:default-mapping:delete
    get:
      description: 'Returns one default GL mapping with its event type, debit and credit accounts, scope and active flag.

        Use this tool when the mapping id is already known; use searchDefaultMappings or listDefaultMappings instead when hunting by event type or organization.

        Preconditions: the default mapping must exist.

        Required inputs: id (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 404 DEFAULT_GL_MAPPING_NOT_FOUND when no default mapping exists for the supplied id.

        '
      operationId: getDefaultMapping
      parameters:
      - description: Default mapping identifier
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultGLMappingResponse'
          description: Default mapping returned
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No default mapping exists for the identifier (DEFAULT_GL_MAPPING_NOT_FOUND)
      security:
      - bearerAuth:
        - accounting:default-mapping:view
      summary: Get Default GL Mapping
      tags:
      - Default GL Mappings
      x-required-permissions:
      - accounting:default-mapping:view
    put:
      description: 'Updates an existing default GL mapping''s event type, accounts, scope, description or active flag.

        Use this tool to repoint or rescope an existing fallback; do not use createDefaultMapping, which adds a new one, or deactivateDefaultMapping, which soft deletes.

        Preconditions: the default mapping must exist.

        Required inputs: id (UUID) as a path parameter plus the full replacement body with eventType, debitAccountId and creditAccountId; organizationId null means global scope.

        Emits an ACCOUNTING_DEFAULT_MAPPING_UPDATE event; future postings resolve against the updated pair while already-posted entries are untouched.

        Returns 404 DEFAULT_GL_MAPPING_NOT_FOUND when no default mapping exists for the supplied id, 404 GL_ACCOUNT_NOT_FOUND when a referenced GL account does not exist, and 422 GL_ACCOUNT_NOT_ACTIVE when it exists but is not active on the current date.

        '
      operationId: updateDefaultMapping
      parameters:
      - description: Default mapping identifier
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Repoint credit account:
                description: Repoint credit account
                value:
                  active: true
                  creditAccountId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5d
                  debitAccountId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  eventType: CASH_SALE
            schema:
              $ref: '#/components/schemas/DefaultGLMappingRequest'
        description: Replacement fallback mapping definition for the event type.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultGLMappingResponse'
          description: Default mapping updated
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No default mapping exists for the identifier (DEFAULT_GL_MAPPING_NOT_FOUND), or a referenced GL account not found (GL_ACCOUNT_NOT_FOUND)
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Referenced GL account is not active (GL_ACCOUNT_NOT_ACTIVE)
      security:
      - bearerAuth:
        - accounting:default-mapping:edit
      summary: Update Default GL Mapping
      tags:
      - Default GL Mappings
      x-required-permissions:
      - accounting:default-mapping:edit
  /v1/accounting/events:
    get:
      description: 'Lists ingested accounting events as a paginated projection with rich optional filters: event type, idempotency outcome, received-at range, event id, ingestion id, domain key, invoice id and processing status.

        Use this tool to monitor or triage the event pipeline; do not use getAccountingEvent, which fetches one event by its known id.

        Preconditions: none beyond the caller holding accounting:events:view; an unrecognized status value is silently ignored rather than rejected.

        Required inputs: none; all filters are optional and the page defaults to 20 items sorted by receivedAt descending.

        Emits an ACCOUNTING_EVENT_LIST audit event; no state changes.

        Returns 200 with an empty page when nothing matches the filters.

        '
      operationId: listAccountingEvents
      parameters:
      - description: Filter by event type
        in: query
        name: eventType
        required: false
        schema:
          type: string
      - description: Filter by idempotency outcome
        in: query
        name: idempotencyOutcome
        required: false
        schema:
          type: string
      - description: Filter by received-at range start (ISO-8601)
        in: query
        name: receivedAtFrom
        required: false
        schema:
          format: date-time
          type: string
      - description: Filter by received-at range end (ISO-8601)
        in: query
        name: receivedAtTo
        required: false
        schema:
          format: date-time
          type: string
      - description: Filter by event UUID
        in: query
        name: eventId
        required: false
        schema:
          format: uuid
          type: string
      - description: Filter by ingestion job UUID
        in: query
        name: ingestionId
        required: false
        schema:
          format: uuid
          type: string
      - description: Filter by domain key
        in: query
        name: domainKeyId
        required: false
        schema:
          type: string
      - description: Filter by invoice UUID
        in: query
        name: invoiceId
        required: false
        schema:
          format: uuid
          type: string
      - description: Filter by processing status
        in: query
        name: status
        required: false
        schema:
          type: string
      - description: Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: The size of the page to be returned
        in: query
        name: size
        required: false
        schema:
          default: 20
          minimum: 1
          type: integer
      - description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
        in: query
        name: sort
        required: false
        schema:
          default:
          - receivedAt,DESC
          items:
            type: string
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageAccountingEventResponse'
          description: Events listed
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden
      security:
      - bearerAuth:
        - accounting:events:view
      summary: List Accounting Events
      tags:
      - Accounting Events
      x-required-permissions:
      - accounting:events:view
    post:
      description: 'Injects a source-system business event into the accounting pipeline on behalf of its producer, where the posting engine converts it into journal entries via published posting rules or default GL mappings.

        Use this endpoint as the source system that owns the event (Billing and the other source domains publish their own facts) or as an operator replaying a producer''s event; do not use it for a manual posting, which is createJournalEntry, or to re-run a FAILED or SUSPENDED event, which is retryAccountingEvent or reprocessSuspendedEvent, and use resolveTestMapping to preview the rules first.

        Preconditions: no event with the same eventId may already be ingested; duplicates are rejected rather than reprocessed.

        Required inputs: eventType (max 100 chars) and payload (JSON object); eventId, sourceSystem and transactionDate (ISO-8601) are optional, eventId being generated when omitted.

        Emits an ACCOUNTING_EVENT_SUBMIT event and returns 202 while processing continues asynchronously; callers poll getAccountingEvent for the outcome.

        Returns 409 DUPLICATE_EVENT when the eventId was already ingested, and 400 when required fields are missing or the transactionDate is not valid ISO-8601.

        '
      operationId: submitAccountingEvent
      requestBody:
        content:
          application/json:
            examples:
              Invoice finalized event:
                description: Invoice finalized event
                value:
                  eventId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  eventType: INVOICE_FINALIZED
                  payload:
                    invoiceId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5d
                    totalAmount: 150.0
                  sourceSystem: POS
                  transactionDate: '2026-08-13T10:15:00'
            schema:
              $ref: '#/components/schemas/AccountingEventSubmitRequest'
        description: Business event envelope to convert into journal entries.
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingEventResponse'
          description: Event accepted for processing
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request
      security:
      - bearerAuth:
        - accounting:events:submit
      summary: Submit Accounting Event
      tags:
      - Accounting Events
      x-required-permissions:
      - accounting:events:submit
  /v1/accounting/events/contract:
    get:
      description: 'Returns the current accounting event envelope schema contract, which SDKs use to validate events before submission.

        Use this tool to fetch the authoritative envelope shape before calling submitAccountingEvent; do not use submitAccountingEvent itself to probe validation rules.

        Preconditions: none.

        Required inputs: none; there are no parameters and no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 with the contract document.

        '
      operationId: getEventContract
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventEnvelopeContract'
          description: Contract returned
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden
      security:
      - bearerAuth:
        - accounting:events:view
      summary: Get Event Envelope Contract
      tags:
      - Accounting Events
      x-required-permissions:
      - accounting:events:view
  /v1/accounting/events/statuses:
    get:
      description: 'Returns every accounting event status (code, label, meaning, whether it is terminal, whether retry/reprocess applies) and every idempotency outcome, generated from the enums so the set cannot drift.

        Use this tool to populate the status and idempotency-outcome filters of listAccountingEvents; the code is the value that filter accepts. Do not use it to find events in a given status; use listAccountingEvents with that status instead.

        Preconditions: none.

        Required inputs: none; there are no parameters and no request body.

        Emits an ACCOUNTING_EVENT_STATUS_LIST audit event; no state changes.

        Returns 200 with the catalog.

        '
      operationId: listAccountingEventStatuses
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventStatusCatalogResponse'
          description: Statuses returned
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden
      security:
      - bearerAuth:
        - accounting:events:view
      summary: List Accounting Event Statuses
      tags:
      - Accounting Events
      x-required-permissions:
      - accounting:events:view
  /v1/accounting/events/types:
    get:
      description: 'Lists every accounting event type the deployed code records, each with its code, display name, source domain, ingestion path (KAFKA or API) and whether a fact of that type can produce a journal entry. KAFKA types are recorded by the module''s topic listeners; API types are the ones the module''s own code submits through submitEvent (INVOICE_PAYMENT, VENDOR_BILL_GL_POSTING, AP_PAYMENT_GL_POSTING).

        submitEvent checks only that eventType is present and accepts any string, so a caller can record a type this list does not hold; such an event is posted only when an active posting rule set or default GL mapping resolves its type, and is otherwise suspended.

        Use this tool to discover the valid values of the eventType filter of listAccountingEvents, including types with no traffic yet; do not use listAccountingEvents itself, which lists ingested event instances, or getEventContract, which describes the submit envelope.

        Preconditions: none beyond the caller holding accounting:events:view.

        Required inputs: none; there is no request body and no filter.

        Emits an ACCOUNTING_EVENT_TYPE_LIST audit event; no state changes.

        Returns 200 with the full registry; the list is fixed by the deployed code, never empty.

        '
      operationId: listAccountingEventTypes
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AccountingEventTypeResponse'
                type: array
          description: Event types listed
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden
      security:
      - bearerAuth:
        - accounting:events:view
      summary: List Accounting Event Types
      tags:
      - Accounting Events
      x-required-permissions:
      - accounting:events:view
  /v1/accounting/events/{eventId}:
    get:
      description: 'Returns one ingested accounting event with its payload, processing status and idempotency outcome.

        Use this tool when the event id is already known; use listAccountingEvents instead when searching by type, status or time range.

        Preconditions: the event must exist.

        Required inputs: eventId (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        The payload is returned unchanged for audit; payloadReferences adds a display projection of the reference values recognized inside it: UUID-backed invoice, customer, journal-entry, vendor and vendor-bill ids, plus the code-keyed accounting location (locationId / location_id, matched case-insensitively against the location profile code). Each entry carries rawValue as written and id only when that value is a UUID; displayName and displayReference are null when accounting cannot resolve the reference and are never the identifier rendered as text. listAccountingEvents omits payloadReferences.

        Returns 404 EVENT_NOT_FOUND when no accounting event exists for the supplied id.

        '
      operationId: getAccountingEvent
      parameters:
      - description: Event identifier
        in: path
        name: eventId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingEventResponse'
          description: Event returned
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Event not found
      security:
      - bearerAuth:
        - accounting:events:view
      summary: Get Accounting Event
      tags:
      - Accounting Events
      x-required-permissions:
      - accounting:events:view
  /v1/accounting/events/{eventId}/processing-log:
    get:
      description: 'Returns the structured, step-by-step processing audit log for one accounting event, covering rule matching, mapping resolution and posting outcomes.

        Use this tool to diagnose why an event suspended or failed; use getEventReprocessingHistory instead for the list of manual reprocessing attempts.

        Preconditions: none; an event with no log yields an empty list.

        Required inputs: eventId (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 with an empty list when the event has no processing log.

        '
      operationId: getEventProcessingLog
      parameters:
      - description: Event identifier
        in: path
        name: eventId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/EventProcessingLogEntry'
                type: array
          description: Processing log returned
      security:
      - bearerAuth:
        - accounting:events:view
      summary: Get Event Processing Log
      tags:
      - Accounting Events
      x-required-permissions:
      - accounting:events:view
  /v1/accounting/events/{eventId}/reprocess:
    post:
      description: 'Reprocesses a SUSPENDED accounting event after a mapping or rule correction, recording an audited reprocessing attempt with the authenticated caller as the triggering user.

        Use this tool once the underlying mapping gap is fixed; do not use retryAccountingEvent, which is the unaudited retry for transient failures.

        Preconditions: the event must exist and be SUSPENDED; an event already PROCESSED is rejected to preserve idempotency. A fact held for its currency (failureReasonCode CURRENCY_NOT_SUPPORTED, ADR-0067 PC-9) is released here too; while its currency is still not the ledger''s it stays SUSPENDED with that reason and nothing is posted.

        Required inputs: eventId (UUID) as a path parameter; the body is optional and may carry mappingVersionToUse (a UUID) and reprocessingNotes. The triggering user is the authenticated caller; any user field in the body is ignored.

        Emits an ACCOUNTING_EVENT_REPROCESS event; a successful synchronous outcome returns 200 with status PROCESSED while 202 means processing continues.

        Returns 404 EVENT_NOT_FOUND when the event does not exist, 409 when it is already PROCESSED, and 400 when the request is invalid.

        '
      operationId: reprocessSuspendedEvent
      parameters:
      - description: Event identifier
        in: path
        name: eventId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Reprocess after mapping fix:
                description: Reprocess after mapping fix
                value:
                  mappingVersionToUse: 0198a1b2-7c3d-7e4f-8a9b-0c1d2e3f4a5c
                  reprocessingNotes: Default mapping added for CASH_SALE
            schema:
              $ref: '#/components/schemas/ReprocessEventRequest'
        description: Audited reprocessing trigger with optional mapping version pin and notes. May be omitted.
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingEventResponse'
          description: Reprocessing accepted
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Event not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Event already PROCESSED (idempotency violation)
      security:
      - bearerAuth:
        - accounting:events:reprocess
      summary: Reprocess Suspended Event
      tags:
      - Accounting Events
      x-required-permissions:
      - accounting:events:reprocess
  /v1/accounting/events/{eventId}/reprocessing-history:
    get:
      description: 'Returns every recorded reprocessing attempt for an accounting event, including who triggered each attempt and its outcome.

        Use this tool when auditing a suspended event''s correction history; use getEventProcessingLog instead for the step-by-step pipeline log of a single run.

        Preconditions: none; an unknown event yields an empty list rather than an error.

        Required inputs: eventId (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 with an empty list when the event does not exist or was never reprocessed.

        '
      operationId: getEventReprocessingHistory
      parameters:
      - description: Event identifier
        in: path
        name: eventId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ReprocessingAttemptHistoryResponse'
                type: array
          description: Reprocessing history returned (may be empty list)
      security:
      - bearerAuth:
        - accounting:events:view
      summary: Get Event Reprocessing History
      tags:
      - Accounting Events
      x-required-permissions:
      - accounting:events:view
  /v1/accounting/events/{eventId}/retry:
    post:
      description: 'Re-runs posting for a FAILED accounting event through the posting engine using its original payload and the current rules; the event ends PROCESSED, FAILED, SUSPENDED or SKIPPED (the engine''s terminal outcome for an event that posts nothing, e.g. no amount).

        Use this tool for transient failures; do not use reprocessSuspendedEvent, which is the audited path for SUSPENDED events after a mapping or rule correction.

        Preconditions: the event must exist and be in status FAILED; any other status is rejected and the event is left unchanged. The previous failure detail stays on the event until the new outcome replaces it.

        Required inputs: eventId (UUID) as a path parameter; the request body is optional and ignored.

        Emits an ACCOUNTING_EVENT_RETRY event and returns 202 with the event in its new status.

        Returns 404 EVENT_NOT_FOUND when the event does not exist, and 409 EVENT_NOT_RETRYABLE when the event is not FAILED.

        '
      operationId: retryAccountingEvent
      parameters:
      - description: Event identifier
        in: path
        name: eventId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Empty body:
                description: Empty body
            schema:
              type: object
        description: Optional and ignored; send an empty object or omit the body entirely.
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingEventResponse'
          description: Retry ran; the event carries its new status
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Event not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'EVENT_NOT_RETRYABLE: the event is not FAILED and was left unchanged'
      security:
      - bearerAuth:
        - accounting:events:retry
      summary: Retry Accounting Event Processing
      tags:
      - Accounting Events
      x-required-permissions:
      - accounting:events:retry
  /v1/accounting/export:
    post:
      description: 'Submits an asynchronous timekeeping or generic data export job and returns it in its initial accepted state.

        Use this tool to export timekeeping data; do not use requestReportExport, which renders financial-statement reports, and poll getExportStatus for completion.

        Preconditions: none; the job is queued for asynchronous processing.

        Required inputs: exportType and format (both non-blank strings); filters (JSON object) and deliveryMode are optional.

        Emits an ACCOUNTING_EXPORT_REQUEST event and returns 202 while the job runs asynchronously.

        Returns 400 when exportType or format is missing or blank.

        '
      operationId: requestExport
      requestBody:
        content:
          application/json:
            examples:
              Timekeeping CSV export:
                description: Timekeeping CSV export
                value:
                  exportType: TIMEKEEPING
                  filters:
                    from: '2026-08-01'
                    to: '2026-08-13'
                  format: CSV
            schema:
              $ref: '#/components/schemas/ExportJobRequest'
        description: Export job definition with type, format and optional filters.
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobResponse'
          description: Export job accepted
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden
      security:
      - bearerAuth:
        - accounting:export:request
      summary: Request Timekeeping Export
      tags:
      - Accounting Exports
      x-required-permissions:
      - accounting:export:request
  /v1/accounting/export/history:
    get:
      description: 'Lists timekeeping and generic export jobs as a paginated projection, most recent first.

        Use this tool to review past export jobs; do not use getExportStatus, which polls one job by its id.

        Preconditions: none beyond the caller holding accounting:export:view.

        Required inputs: none; the page defaults to 20 items and only requestedAt is a supported sort property.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 400 UNSUPPORTED_SORT_PROPERTY when an unsupported sort property is requested.

        '
      operationId: listExportHistory
      parameters:
      - description: Zero-based page index (0..N)
        in: query
