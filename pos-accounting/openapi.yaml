  /v1/accounting/bank-imports/{importId}/mapping:
    put:
      description: 'Sets an import''s column mapping, sign convention and parser options and parses every row again from the retained file; the import becomes VALIDATED once its columns are mapped. A corrected or widened header and split points may come with it.

        Use this tool when the columns need a mapping or the preview does not tie because the sign convention is wrong; do not use it to fix one row, use updateBankImportRow instead.

        Preconditions: the import must be UPLOADED or VALIDATED; earlier corrections, skips and duplicate decisions are discarded by the re-parse.

        Required inputs: importId in the path and columnMapping; optional saveAsAccountDefault stores the mapping on the account''s profile for the next import.

        Emits an ACCOUNTING_BANK_IMPORT_MAPPING_SET event.

        Returns 409 when the import is COMMITTED (IMPORT_ALREADY_COMMITTED) or DISCARDED (IMPORT_DISCARDED) or the version is stale; 422 when a changed header overlaps or breaks contiguity; 400 when the mapping or options are malformed; 404 for an unknown import.

        '
      operationId: setBankImportMapping
      parameters:
