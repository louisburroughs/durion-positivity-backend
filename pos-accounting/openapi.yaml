      - severity
    ContractField:
      type: object
      description: A single field definition in an event envelope contract
      properties:
        name:
          type: string
          description: Name of the field
          example: eventId
        jsonPath:
          type: string
          description: JSON path locating the field within the envelope
          example: $.payload.eventId
        type:
          type: string
          description: Data type of the field
          example: string
        required:
          type: boolean
          description: Whether the field is required in the envelope
          example: true
        description:
          type: string
          description: Human-readable description of the field
          example: Unique identifier of the event
        enumValues:
          type:
          - array
          - 'null'
          description: Allowed enum values for the field, if constrained
          items:
            type: string
      required:
      - jsonPath
      - name
      - required
      - type
    EventEnvelopeContract:
