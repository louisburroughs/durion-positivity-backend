        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: IMPORT_ALREADY_COMMITTED, IMPORT_DISCARDED or OPTIMISTIC_LOCK
        '422':
          content:
            application/json:
