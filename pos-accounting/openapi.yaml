        - accounting:reconciliation:view
      summary: List Bank Statements
      tags:
      - Bank Statements
      x-required-permissions:
      - accounting:reconciliation:view
    post:
      description: 'Commits a bank statement keyed by hand — header, transactions and, when needed, a gap acknowledgement — for a reconcilable BANK_CASH account, through the same intake as a file.

        Use this tool when the bank offers no statement download or to reconcile to a date; do not use it to correct a committed statement, which is an explicit supersede instead.

        Preconditions: the statement must continue the account''s previous statement (opening balance equals its closing balance, start date the day after its end) unless a gapAcknowledgement of at least 10 characters is given, which is required for the account''s first statement, refused on a contiguous one and moves the account''s reconciliation baseline.

        Required inputs: glAccountId, a UUIDv7 requestId, statement {startDate, endDate, openingBalance, closingBalance} and transactions[] each with a date, a description and either signedAmount or one of debit/credit; startReconciliation optionally starts the statement''s reconciliation in the same transaction (listed under reconciliations).

        Emits an ACCOUNTING_BANK_STATEMENT_CREATE event and queues the accounting.bankstatement.committed fact; a replay of the same requestId and payload returns the original statement with replayed=true.

        Returns 422 when the account is not reconcilable, the currency is not the account''s, the window overlaps a committed statement, contiguity or the acknowledgement rule fails, a transaction lies outside the window or opening + activity differs from closing; 409 when the window is already committed or the requestId was used with another payload; and 400 when the request is malformed or a justification is shorter than 10 characters.

        '
      operationId: createBankStatement
      requestBody:
        content:
          application/json:
            examples:
              September statement:
                description: September statement
                value:
                  gapAcknowledgement: First statement reconciled on this account
                  glAccountId: 5eed0acc-0000-4000-8000-000000001000
                  requestId: 01992b3c-4d5e-7f60-8a1b-2c3d4e5f6a7b
                  statement:
                    closingBalance: 12830.67
                    endDate: '2026-09-30'
                    openingBalance: 12345.67
                    startDate: '2026-09-01'
                  transactions:
                  - credit: 500.0
                    date: '2026-09-02'
                    description: ACH DEPOSIT ACME
                    reference: DEP-1
                  - date: '2026-09-15'
                    debit: 15.0
                    description: MONTHLY FEE
            schema:
              $ref: '#/components/schemas/BankStatementCreateRequest'
        description: The statement header, its transactions and an optional gap acknowledgement.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankStatementResponse'
          description: Statement committed (or replayed)
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Malformed request (VALIDATION_ERROR) or short acknowledgement (JUSTIFICATION_REQUIRED)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks accounting:reconciliation:adjust
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: STATEMENT_ALREADY_IMPORTED or IDEMPOTENCY_CONFLICT
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ACCOUNT_NOT_RECONCILABLE, CURRENCY_NOT_SUPPORTED, STATEMENT_PERIOD_OVERLAP, STATEMENT_NOT_CONTIGUOUS, STATEMENT_GAP_ACKNOWLEDGEMENT_NOT_APPLICABLE, STATEMENT_TRANSACTION_OUT_OF_WINDOW, STATEMENT_ACTIVITY_MISMATCH or AMOUNT_PRECISION_EXCEEDS_CURRENCY
      security:
      - bearerAuth:
        - accounting:reconciliation:adjust
      summary: Enter Bank Statement
      tags:
      - Bank Statements
      x-required-permissions:
      - accounting:reconciliation:adjust
