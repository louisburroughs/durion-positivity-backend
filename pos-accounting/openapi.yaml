          - PAYABLE
          - BANK_CASH
          - UNDEPOSITED_FUNDS
          - TAX_PAYABLE
          - CURRENT_ASSET
          - FIXED_ASSET
          - CURRENT_LIABILITY
          - SALES
          - COST_OF_SALES
          - OPERATING_EXPENSE
          - OTHER
          example: UNDEPOSITED_FUNDS
