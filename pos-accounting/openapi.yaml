  /v1/accounting/settlements/lines/{lineId}/write-off:
    post:
      tags:
      - Settlement Reconciliation
      summary: Write off a small unmatched settlement line
      description: 'Writes off an UNMATCHED settlement line whose gross is at or below the configured reconciliation write-off threshold (default $25.00, decision D-14), posting a reversible adjustment entry (Dr Settlement Suspense / Cr Settlement Adjustment) — never a silent status flip. Use this tool only for genuinely unidentifiable small residuals; above the threshold there is no self-service write-off — manually match or escalate. Preconditions: the line must exist and be UNMATCHED, its gross must not exceed the threshold (compared on absolute value), and a non-blank reason (max 500 chars) is required and audited. Respects accounting period locks (Story B2). Emits ACCOUNTING_SETTLEMENT_LINE_WRITE_OFF. Returns 422 when the absolute gross exceeds the threshold (WRITE_OFF_THRESHOLD_EXCEEDED) or the adjustment entry is dated into a locked accounting period (PERIOD_CLOSED / PERIOD_HARD_LOCKED), and 409 when the line is no longer UNMATCHED (SETTLEMENT_LINE_NOT_UNMATCHED) or the settlement has not yet posted (SETTLEMENT_NOT_POSTED).'
      operationId: writeOffSettlementLine
      parameters:
      - name: lineId
        in: path
        description: Settlement line id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementWriteOffRequest'
        required: true
      responses:
        '200':
          description: Line written off; the updated line is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementLineResponse'
        '400':
          description: reason is missing, blank, or over 500 characters (ARGUMENT_NOT_VALID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Caller lacks the accounting:reconciliation:adjust permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Settlement line not found (SETTLEMENT_LINE_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Settlement line is not UNMATCHED (SETTLEMENT_LINE_NOT_UNMATCHED), or the settlement has not yet posted (SETTLEMENT_NOT_POSTED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Line absolute gross exceeds the write-off threshold (WRITE_OFF_THRESHOLD_EXCEEDED); manual match or escalate — or the adjustment entry is dated into a CLOSED or hard-locked accounting period (PERIOD_CLOSED / PERIOD_HARD_LOCKED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - accounting:reconciliation:adjust
      x-required-permissions:
      - accounting:reconciliation:adjust
  /v1/accounting/settlements/lines/{lineId}/match:
    post:
      tags:
      - Settlement Reconciliation
      summary: Manually match a settlement line
      description: 'Manually matches an UNMATCHED settlement line to an AR receivable payment, posting a reclass entry (Dr Settlement Suspense / Cr Undeposited Funds) that clears the line''s gross out of suspense. Use this tool when the automatic gross match could not identify the payment. AP (vendor) matching is not supported in v1. Preconditions: the line must exist and be UNMATCHED, its parent settlement must already be POSTED, and the receivable payment must exist. Returns 404 if the line or payment is not found (SETTLEMENT_LINE_NOT_FOUND / RECEIVABLE_PAYMENT_NOT_FOUND), 409 if the line is no longer UNMATCHED (SETTLEMENT_LINE_NOT_UNMATCHED) or the settlement has not yet posted (SETTLEMENT_NOT_POSTED), and 422 if the reclass entry is dated into a locked accounting period (PERIOD_CLOSED / PERIOD_HARD_LOCKED). Emits ACCOUNTING_SETTLEMENT_LINE_MATCH.'
      operationId: matchSettlementLine
      parameters:
      - name: lineId
        in: path
        description: Settlement line id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementManualMatchRequest'
        required: true
      responses:
        '200':
          description: Line matched; the updated line is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementLineResponse'
        '400':
          description: receivablePaymentId is missing (ARGUMENT_NOT_VALID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Caller lacks the accounting:reconciliation:adjust permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Settlement line or receivable payment not found (SETTLEMENT_LINE_NOT_FOUND / RECEIVABLE_PAYMENT_NOT_FOUND)
          content:
            application/json:
              schema:
