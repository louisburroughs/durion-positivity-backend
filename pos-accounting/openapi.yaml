      - categoryName
      - modifiedBy
    PostingCategoryResponse:
      type: object
      description: Posting category details
      properties:
        postingCategoryId:
          type: string
          format: uuid
          description: Unique identifier of the posting category
          example: 01960003-0000-7000-8000-000000000001
        categoryName:
          type: string
          description: Name of the posting category
          example: Customer Payments
        description:
          type: string
          description: Description of the posting category
          example: Categories for cleared customer payments
        isActive:
          type: boolean
          description: Whether the posting category is active
          example: true
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the posting category was created (ISO 8601)
          example: 2026-06-18 08:00:00+00:00
        createdBy:
          type: string
          description: Identifier of the user who created the posting category
          example: jdoe
        modifiedAt:
          type: string
          format: date-time
          description: Timestamp when the posting category was last modified (ISO 8601)
          example: 2026-06-18 08:00:00+00:00
        modifiedBy:
          type: string
          description: Identifier of the user who last modified the posting category
          example: asmith
