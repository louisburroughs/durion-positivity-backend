        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExportResponse'
          description: Export status retrieved
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExportResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExportResponse'
          description: Forbidden - missing accounting:report:export
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExportResponse'
          description: Export job not found
      security:
      - bearerAuth:
        - accounting:report:export
