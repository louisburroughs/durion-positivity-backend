                description: Rename category
                value:
                  categoryName: PAYMENT_TENDERS
                  description: Payment tender classifications
                  modifiedBy: jdoe
            schema:
              $ref: '#/components/schemas/PostingCategoryUpdateRequest'
        description: Replacement name and description for the posting category.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingCategoryResponse'
          description: Posting category updated
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingCategoryResponse'
          description: Invalid request or duplicate name
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingCategoryResponse'
          description: Posting category not found
      security:
      - bearerAuth:
        - accounting:posting-category:edit
      summary: Update Posting Category
      tags:
      - Posting Categories
      x-required-permissions:
      - accounting:posting-category:edit
  /v1/accounting/posting-categories/{postingCategoryId}/deactivate:
    post:
      description: 'Deactivates a posting category so it can no longer be used for new GL mappings; the record and its keys are retained.

        Use this tool to retire an unused category; do not use deactivateMappingKey, which retires a single key inside a category.

        Preconditions: the posting category must exist and have no active GL mappings attached.

        Required inputs: postingCategoryId (UUID) as a path parameter; there is no request body.

        Emits an ACCOUNTING_POSTING_CATEGORY_DEACTIVATE event.

        Returns 404 when the category does not exist, 409 when active GL mappings still reference it, and 204 with no body on success.

