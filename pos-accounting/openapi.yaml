        reversedAt:
          type: string
          format: date-time
          description: Reversed timestamp
          example: 2026-01-16 08:20:00+00:00
    GLAccountUpdateRequest:
      type: object
      description: Request payload for updating mutable GL account fields
      properties:
        accountName:
          type: string
          description: Updated account name
          example: Accounts Receivable - Trade
          maxLength: 100
          minLength: 0
        description:
          type: string
          description: Updated account description
          example: Primary receivables account
          maxLength: 500
          minLength: 0
        accountSubtype:
          type: string
          description: Updated account subtype refining the immutable accountType for report grouping and posting-config plausibility checks. Left unchanged when omitted.
          enum:
          - RECEIVABLE
          - PAYABLE
          - BANK_CASH
          - UNDEPOSITED_FUNDS
          - TAX_PAYABLE
          - CURRENT_ASSET
          - FIXED_ASSET
          - CURRENT_LIABILITY
          - SALES
          - COST_OF_SALES
          - OPERATING_EXPENSE
          - OTHER
          example: BANK_CASH
        reconcilable:
          type: boolean
          description: Whether journal entry lines on this account participate in reconciliation (e.g. settlement/bank reconciliation). Left unchanged when omitted.
          example: true
