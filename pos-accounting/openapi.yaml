  /v1/accounting/customers/{customerId}/open-invoices:
    get:
      description: 'Lists a customer''s open invoices oldest first, each with the balance still due after payment applications, customer credits, posted credit memos and deposits, and whether it is overdue.

        Use this tool to choose the invoices a payment of this customer pays; do not use pos-invoice search for this, because it does not net credits, credit memos or deposits.

        Preconditions: the caller needs accounting:payment:apply authority; an invoice is open when it is FINALIZED or POSTED and its balance due is above zero.

        Required inputs: customerId (UUID) as a path parameter; page (0 or more) and size (1 to 200, default 100) are optional query parameters.

        Emits an ACCOUNTING_CUSTOMER_OPEN_INVOICES_VIEW event and changes no state; a customer with nothing open, or unknown to accounting, gets 200 with no rows.

