            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Identifier rejected (malformed or invalid invoiceId)
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invoice unknown to accounting (no replica record)
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error retrieving invoice status
      security:
      - bearerAuth:
