  /v1/accounting/invoice/{invoiceId}/status:
    get:
      description: 'Returns the current payment status of an invoice as tracked by the accounting module''s invoice replica.

        Use this tool to check whether an invoice is open, partially paid or paid before applying payments or credits; do not use applyPayment, which changes the status.

        Preconditions: the invoice must be known to the accounting module.

        Required inputs: invoiceId (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        An invoice with no payment history answers 200 with status UNPAID, derived from the ext_invoice replica and accounting''s own application/credit records.

        Returns 404 only when accounting has no record of the invoice at all, and 400 when the identifier is rejected (malformed or invalid invoiceId).

        '
      operationId: getInvoiceStatus
      parameters:
      - description: Invoice identifier
        in: path
        name: invoiceId
        required: true
        schema:
          format: uuid
