    AgedPayablesRow:
      description: Per-vendor aged payables row with bucketed open vendor-bill balances. Age is measured from the bill due date, falling back to the bill date when no due date is recorded; only APPROVED bills are aged, unapproved bills are reported separately and unaged.
      properties:
        days1To30:
          description: Approved bills outstanding 1-30 days past due
          example: 700.0
          type: number
        days31To60:
          description: Outstanding 31-60 days past due
          example: 750.0
          type: number
        days61To90:
          description: Outstanding 61-90 days past due
          example: 0.0
          type: number
        days90Plus:
          description: Outstanding more than 90 days past due
          example: 0.0
          type: number
        notYetDue:
          description: 'Approved bills outstanding not yet due: due today or later (due today is not overdue)'
          example: 2500.0
          type: number
        overdue:
          description: 'Overdue: the sum of days1To30, days31To60, days61To90 and days90Plus'
          example: 1450.0
          type: number
        totalIncludingUnapproved:
          description: totalOutstanding + unapproved
          example: 4250.0
          type: number
        totalOutstanding:
          description: 'Total outstanding on approved bills: notYetDue + overdue'
          example: 3950.0
          type: number
        unapproved:
          description: Open amount on bills not yet approved (PENDING_RECEIPT_MATCH, MATCH_EXCEPTION); never aged
          example: 300.0
          type: number
        unapprovedBillCount:
          description: Number of open bills not yet approved
          example: 2
          format: int32
          type: integer
        vendorId:
          description: Vendor UUID
          example: d10217f9-3ec6-46b9-9c87-e7066c100c24
          format: uuid
          type: string
        vendorName:
          description: Vendor display name
          example: Global Parts Supply
          type: string
      required:
      - days1To30
      - days31To60
      - days61To90
      - days90Plus
      - notYetDue
      - overdue
      - totalIncludingUnapproved
      - totalOutstanding
      - unapproved
      - unapprovedBillCount
      - vendorId
      type: object
    AgedReceivablesReport:
      description: Aged Receivables report with per-customer bucketed open invoice balances
      properties:
        asOfDate:
          description: Date the receivables aging is reported as of (inclusive)
          example: '2026-06-30'
          format: date
          type: string
        generatedAt:
          description: Timestamp when the report was generated (ISO 8601)
          example: '2026-06-30T08:00:00Z'
          format: date-time
          type: string
        rows:
          description: Per-customer aging rows ordered by customer id; empty when no open receivables exist
          items:
            $ref: '#/components/schemas/AgedReceivablesRow'
