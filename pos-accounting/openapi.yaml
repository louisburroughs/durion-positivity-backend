  /v1/accounting/periods/hard-lock:
    get:
      tags:
      - Accounting Periods
      summary: Get the accounting hard-lock date
      description: 'Returns the org-level hard-lock date: journal entries dated strictly before this date are permanently rejected (422 PERIOD_HARD_LOCKED) with no override path — unlike a CLOSED period, which accounting:period:override plus a justification can bypass. Use this tool to check the current lock boundary before posting backdated entries or before moving the lock with setAccountingHardLockDate. Returns hardLockDate: null when no hard lock has been configured yet. No preconditions and no side effects.'
      operationId: getAccountingHardLockDate
      responses:
        '200':
          description: Current hard-lock date returned; hardLockDate is null when no hard lock is set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardLockDateResponse'
        '403':
          description: Caller lacks the accounting:period:view permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - accounting:period:view
      x-required-permissions:
      - accounting:period:view
    put:
      tags:
      - Accounting Periods
      summary: Set the accounting hard-lock date
      description: 'Sets the org-level hard-lock date: from then on, journal entries dated strictly before this date are permanently rejected (422 PERIOD_HARD_LOCKED) with NO override path — not even accounting:period:override can bypass it (that permission only covers CLOSED periods, error PERIOD_CLOSED). Use this tool after statutory filings or audits to make history immutable; use closeAccountingPeriod for the reversible month-end close instead. The date is monotonic-forward-only: it must be on or after the currently stored hard-lock date, and moving it backward is rejected with 422 HARD_LOCK_DATE_REGRESSION — effectively irreversible, so set it deliberately. Required inputs: hardLockDate (ISO date) and a non-blank justification (max 500 characters), recorded in the audit trail with the acting user. Emits ACCOUNTING_PERIOD_HARD_LOCK_SET and returns the stored hard-lock date. Returns 400 if the date is missing or the justification is missing or blank.'
      operationId: setAccountingHardLockDate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HardLockDateUpdateRequest'
        required: true
      responses:
        '200':
          description: Hard-lock date updated; the stored value is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardLockDateResponse'
        '400':
          description: hardLockDate is missing, or justification is missing, blank, or over 500 characters (ARGUMENT_NOT_VALID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Caller lacks the accounting:period:hard_lock permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Requested date is before the currently stored hard-lock date (HARD_LOCK_DATE_REGRESSION) — the hard lock only moves forward
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - accounting:period:hard_lock
      x-required-permissions:
      - accounting:period:hard_lock
