                  endDate: '2026-07-31'
                  format: CSV
                  reportType: TRIAL_BALANCE
                  startDate: '2026-07-01'
            schema:
              $ref: '#/components/schemas/ReportExportRequest'
        description: Report type, format and date range to render asynchronously.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExportResponse'
          description: Export job created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request payload
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden - missing accounting:report:export
      security:
      - bearerAuth:
        - accounting:report:export
      summary: Request Async Report Export
      tags:
      - Financial Reporting
      x-required-permissions:
      - accounting:report:export
