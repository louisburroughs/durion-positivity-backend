          example: 01960003-0000-7000-8000-000000000001
      required:
      - glAccountId
    MappingResolutionTestRequest:
      type: object
      description: Dry-run mapping/rule resolution request describing a hypothetical accounting event. Nothing is persisted by this operation.
      properties:
        eventType:
          type: string
          description: Accounting event type to resolve posting rules for
          example: INVOICE_FINALIZED
          minLength: 1
        samplePayload:
          type: object
          description: Sample event payload (arbitrary JSON object) evaluated against rule predicates and amount fields. Optional; when omitted the rules are evaluated against an empty payload.
          example:
            totalAmount: 125.0
            channel: POS
        transactionDate:
          type: string
          format: date
          description: Transaction date used for effective-dated rule version and GL mapping selection
          example: 2026-01-15
      required:
      - eventType
      - transactionDate
    MappingResolutionTestResponse:
      type: object
      description: Dry-run mapping/rule resolution result. A no-match outcome is represented as matched=false with a reason, not as an error. Nothing is persisted.
      properties:
        matched:
          type: boolean
          description: Whether a published posting rule matched the supplied event. false means no rule matched; inspect noMatchReason/noMatchDetail.
          example: true
        matchedRule:
          $ref: '#/components/schemas/MatchedRule'
        matchedMapping:
          $ref: '#/components/schemas/MatchedMapping'
        resolvedLines:
          type: array
          description: Journal entry lines the evaluator would post for this event, including E1 proportional split-line shares and residual distribution. Present when matched=true.
          items:
            $ref: '#/components/schemas/ResolvedLine'
        predicateEvaluations:
          type: array
          description: Per-predicate evaluation outcomes against the sample payload (E2 condition grammar). Populated for every candidate rule condition that was evaluated.
          items:
            $ref: '#/components/schemas/PredicateEvaluation'
        noMatchReason:
          type: string
          description: Machine-readable no-match reason, present when matched=false
          example: UNMAPPED_EVENT_TYPE
        noMatchDetail:
          type: string
          description: Human-readable no-match detail, present when matched=false
          example: No published rule version maps event type INVOICE_FINALIZED on 2026-01-15
      required:
      - matched
    MatchedMapping:
      type: object
      description: Mapping evaluation details for the matched rule
      properties:
        mappingType:
          type: string
          description: Type of mapping that was matched (exact, fallback, category_default)
          example: exact
        mappingKey:
          type: string
          description: Mapping key that was matched
          example: INVENTORY:SKU-1234
        keysEvaluated:
          type: array
          description: All mapping keys evaluated during the search, in evaluation order
          items:
            type: string
    MatchedRule:
      type: object
      description: Identity of the posting rule that matched the dry-run event
      properties:
        postingRuleSetId:
          type: string
          format: uuid
          description: Posting rule set identifier
          example: 01960003-0000-7000-8000-000000000001
        ruleSetName:
          type: string
          description: Posting rule set name
          example: Invoice finalization postings
        ruleVersionId:
          type: string
          format: uuid
          description: Posting rule version identifier that was evaluated
          example: 01960003-0000-7000-8000-000000000002
        versionNumber:
          type: integer
          format: int32
          description: Posting rule version number that was evaluated
          example: 3
      required:
      - postingRuleSetId
      - ruleSetName
      - ruleVersionId
      - versionNumber
    PredicateEvaluation:
      type: object
      description: Evaluation outcome of one rule condition predicate (E2 grammar)
      properties:
        predicate:
          type: string
          description: Predicate expression as configured on the rule condition
          example: payload.channel == 'POS' && payload.totalAmount > 100
        matched:
          type: boolean
          description: Whether the predicate matched the supplied event type and sample payload
          example: true
        detail:
          type: string
          description: Optional evaluation detail (e.g. which clause failed)
          example: 'clause payload.totalAmount > 100 evaluated false (actual: 42.00)'
      required:
      - matched
      - predicate
    ResolvedLine:
      type: object
      description: One journal entry line the dry-run evaluator would post
      properties:
        glAccountId:
          type: string
          format: uuid
          description: Resolved GL account identifier
          example: 01960003-0000-7000-8000-000000000003
        accountCode:
          type: string
          description: Resolved GL account code
          example: '4000'
        accountName:
          type: string
          description: Resolved GL account name
          example: Sales Revenue
        debitAmount:
          type: number
          description: Debit amount for this line
          example: 75.0
        creditAmount:
          type: number
          description: Credit amount for this line
          example: 0.0
        description:
          type: string
          description: Line description
          example: Recognize revenue (60% share)
        splitGroup:
          type: string
          description: E1 split group this line belongs to; null for non-split lines
          example: revenue-split
        factorPercent:
          type: number
          description: E1 split factor percentage applied to this line; null for non-split lines
          example: 60.0
      required:
      - creditAmount
      - debitAmount
      - glAccountId
    MappingKeyCreateRequest:
      type: object
      description: Request payload for creating a new mapping key
      properties:
        postingCategoryId:
          type: string
          format: uuid
          description: Identifier of the posting category this mapping key belongs to
          example: 01960003-0000-7000-8000-000000000001
        keyName:
          type: string
          description: Name of the mapping key
          example: PAYMENT_RECEIVED
          maxLength: 100
          minLength: 0
        description:
          type: string
          description: Optional description of the mapping key
          example: Maps cleared customer payments to the receivable account
          maxLength: 500
          minLength: 0
        createdBy:
          type: string
          description: Identifier of the user creating the mapping key
          example: jdoe
          maxLength: 50
          minLength: 0
      required:
      - createdBy
      - keyName
      - postingCategoryId
    JournalEntryReversalRequest:
      type: object
      description: Request payload for reversing a journal entry
      properties:
        reason:
          type: string
          description: Reason for reversing the journal entry
          example: Correcting duplicate posting
          minLength: 1
        reversalDate:
          type: string
          format: date
          description: Optional transaction date for the reversal entry. When omitted or null, the date defaults to the original entry's transaction date if that date's accounting period is OPEN, otherwise to today's date. Whether explicit or defaulted, the resolved date must fall in an OPEN accounting period; a date in a CLOSED period is rejected with 422 PERIOD_CLOSED.
          example: 2026-07-15
        overrideJustification:
          type: string
          description: Optional justification for reversing into a CLOSED accounting period (story B2). When the resolved reversal date falls in a CLOSED period, supplying a non-blank justification together with the accounting:period:override permission allows the reversal to post into that period (audit-logged); without it the reversal is rejected with 422 PERIOD_CLOSED. Has no effect for dates in OPEN periods and can never bypass the hard lock (422 PERIOD_HARD_LOCKED).
          example: Auditor-approved correction of June posting
          maxLength: 500
          minLength: 0
      required:
      - reason
    JournalEntryPostRequest:
      type: object
      description: Optional request payload for posting a journal entry
      properties:
        overrideJustification:
          type: string
          description: Optional justification for posting into a CLOSED accounting period. When the entry's transaction date falls in a CLOSED period, supplying a non-blank justification together with the accounting:period:override permission allows the posting to proceed (audit-logged); without it the post is rejected with 422 PERIOD_CLOSED. Has no effect for dates in OPEN periods and can never bypass the hard lock (422 PERIOD_HARD_LOCKED).
          example: Auditor-approved late accrual for June close
          maxLength: 500
          minLength: 0
    RegenerateInvoiceFromWorkorderRequest:
      type: object
      description: Request to regenerate an invoice from a completed workorder
      properties:
