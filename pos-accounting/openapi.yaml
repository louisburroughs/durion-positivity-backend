  /v1/accounting/periods/{periodCode}/reopen:
    post:
      tags:
      - Accounting Periods
      summary: Reopen a closed accounting period
      description: 'Reopens a CLOSED accounting period (CLOSED → OPEN), resetting its lifecycle status to OPEN. Use this tool only when late adjustments must be posted into an already-closed month; use closeAccountingPeriod to close it again afterwards. Preconditions: a period row must exist for the code and be CLOSED. Required input: a non-blank justification (max 500 characters) which is recorded on the period and in the audit trail with the acting user. Emits ACCOUNTING_PERIOD_REOPEN. Returns 409 PERIOD_ALREADY_OPEN if the period is not closed, and 400 if the justification is missing or blank.'
      operationId: reopenAccountingPeriod
      parameters:
      - name: periodCode
        in: path
        description: Period code in YYYY-MM format
        required: true
        schema:
          type: string
        example: 2026-06
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountingPeriodReopenRequest'
        required: true
      responses:
        '200':
          description: Period reopened; the updated period is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingPeriodResponse'
        '400':
          description: periodCode is not a valid YYYY-MM period code, or justification is missing or blank
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Caller lacks the accounting:period:reopen permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No period row exists for the code (PERIOD_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Period is already open (PERIOD_ALREADY_OPEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - accounting:period:reopen
      x-required-permissions:
      - accounting:period:reopen
  /v1/accounting/periods/{periodCode}/close:
    post:
      tags:
      - Accounting Periods
      summary: Close an accounting period
      description: 'Closes an OPEN accounting period (OPEN → CLOSED), recording its lifecycle status as CLOSED. Use this tool during month-end close after all journal entries for the month are posted; use reopenAccountingPeriod to reverse the transition. Note: journal-entry posting paths do not yet reject postings dated into a CLOSED period; that enforcement (error code PERIOD_CLOSED) arrives with the period-enforcement story (parity-B2). Preconditions: the period must not already be CLOSED, and no DRAFT journal entries may be dated inside the period. A valid YYYY-MM period with no row whose month has already started is auto-provisioned and then closed. The close is audit-logged with the acting user and emits ACCOUNTING_PERIOD_CLOSE. Returns 409 PERIOD_ALREADY_CLOSED if the period is already closed, and 422 PERIOD_HAS_DRAFT_ENTRIES listing the blocking draft journal entry IDs in fieldErrors — post or delete those entries before retrying.'
      operationId: closeAccountingPeriod
      parameters:
      - name: periodCode
        in: path
        description: Period code in YYYY-MM format
        required: true
        schema:
          type: string
        example: 2026-06
      responses:
        '200':
          description: Period closed; the updated period is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingPeriodResponse'
        '400':
          description: periodCode is not a valid YYYY-MM period code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Caller lacks the accounting:period:close permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Period not found and its month has not started (PERIOD_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Period is already closed (PERIOD_ALREADY_CLOSED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: DRAFT journal entries are dated inside the period (PERIOD_HAS_DRAFT_ENTRIES); fieldErrors lists the blocking draftJournalEntryIds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - accounting:period:close
      x-required-permissions:
      - accounting:period:close
