    EventProcessingLogEntry:
      type: object
      description: A single entry in an accounting event's processing audit log
      properties:
        entryId:
          type: string
          format: uuid
          description: Unique identifier for this log entry
          example: 01960003-0000-7000-8000-000000000001
        occurredAt:
          type: string
          format: date-time
          description: When this log entry was created (ISO 8601)
          example: 2026-06-18 08:00:00+00:00
        severity:
          type: string
          description: 'Severity level: INFO, WARN, or ERROR'
          example: INFO
        message:
          type: string
          description: Human-readable log message
          example: Event processed successfully
        contextJson:
          type:
          - string
          - 'null'
          description: Optional JSON context for debugging
          example:
            retries: 0
      required:
