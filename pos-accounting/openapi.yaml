    BankImportCreateRequest:
      description: A bank statement file with its statement header, column mapping and parser options
      properties:
        columnMapping:
          description: Column mapping {date, description, amount | debit + credit, reference, checkNumber, sourceTransactionId}, each a header name or a zero-based column index; defaults to the account's saved mapping, else date, description, amount, reference
          example:
            amount: Amount
            date: Posted Date
            description: Payee
          type: object
        content:
          description: Base64 of the file's bytes (JSON upload only; omitted in a multipart upload)
          example: ZGF0ZSxkZXNjcmlwdGlvbixhbW91bnQKMjAyNi0wOS0wMixBQ0ggREVQT1NJVCw1MDAuMDA=
          type: string
        contentType:
          description: Media type of the file (defaults to text/csv)
          example: text/csv
          type: string
        currency:
          description: ISO 4217 code of the file's amounts; defaults to, and must equal, the account's currency
          example: USD
          type: string
        dateFormat:
          description: Date pattern of the file, e.g. dd/MM/yyyy; defaults to ISO and US dates
          example: MM/dd/yyyy
          type: string
        decimalFormat:
          description: DECIMAL_POINT (default, 1,234.56) or DECIMAL_COMMA (1.234,56)
          example: DECIMAL_POINT
          type: string
        delimiter:
          description: 'Field delimiter: one character or TAB (default ,)'
          example: ','
          type: string
        encoding:
          description: Character set of the file (default UTF-8)
          example: UTF-8
          type: string
        fileName:
          description: Name of the uploaded file
          example: september.csv
          type: string
        formatCode:
          description: File format; CSV in phase 1
          example: CSV
          type: string
        gapAcknowledgement:
          description: Justification (at least 10 characters) required when the statement does not continue the previous one — always for the account's first statement — and refused when it does
          example: First statement reconciled on this account
          type: string
        glAccountId:
          description: Reconcilable BANK_CASH GL account the statement belongs to
          format: uuid
          type: string
        requestId:
          description: Caller-generated UUIDv7; a replay with the same payload returns the original import
          format: uuid
          type: string
        signConvention:
          description: SIGNED_AMOUNT (default, positive = cash in), SIGNED_AMOUNT_INVERTED or DEBIT_CREDIT_COLUMNS
          example: SIGNED_AMOUNT
          type: string
        splitAt:
          description: 'Split points: each date ends a segment committed as its own statement, with its keyed closing balance'
          items:
            $ref: '#/components/schemas/BankImportSplitPoint'
          type: array
        statement:
          $ref: '#/components/schemas/BankImportStatementHeader'
        supersedesStatementId:
          description: 'A COMMITTED statement of the same account this corrected file supersedes (§4.9 path 3): checked at upload and again at commit, where the old statement becomes SUPERSEDED, its rows EXCLUDED and a FINALIZED reconciliation of it INVALIDATED; not combined with splitAt'
          example: 019a0000-0000-7000-8000-000000000002
          format: uuid
          type: string
        supersessionJustification:
          description: Why the statement is superseded (at least 10 characters); required with supersedesStatementId and refused without it
          example: The bank reissued September with the missing wire of 2026-09-14
          type: string
      required:
      - formatCode
      - glAccountId
      - requestId
      - statement
      type: object
    BankImportDiscardRequest:
      description: Discard of an import that will not be committed
      properties:
        reason:
          description: Why the import is discarded (at least 10 characters)
          example: Uploaded the savings account's file by mistake
          type: string
        version:
          description: The import version the discard was made against
          example: 3
          format: int64
          type: integer
      required:
      - reason
      type: object
    BankImportDuplicateDecision:
