              Partial credit:
                description: Partial credit
                value:
                  creditAmount: 45.0
                  justificationNote: Labor line billed twice
                  originalInvoiceId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  reasonCode: BILLING_ERROR
            schema:
              $ref: '#/components/schemas/CreateCreditMemoRequest'
        description: Credit to issue against a finalized invoice, with the audit reason code.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditMemoResponse'
          description: Credit memo created successfully
        '400':
