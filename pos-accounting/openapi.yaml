          example: 1250.0
        adjustedPrice:
          type: number
          description: Adjusted price after override
          example: 1100.0
        overrideAmountOrPercent:
          type: string
          description: Override expressed as an amount or percentage
          example: -12%
        forbiddenCategoryCode:
          type: string
          description: Forbidden category code that was triggered, if any
          example: BELOW_COST
        policyValidationResult:
          type: string
          description: Result of policy validation for the event
          enum:
          - APPROVED
          - REJECTED_FORBIDDEN
          - REJECTED_THRESHOLD_EXCEEDED
        invoiceId:
          type: string
          format: uuid
          description: Identifier of the invoice associated with the event
          example: 01960003-0000-7000-8000-000000000005
        paymentId:
          type: string
          format: uuid
          description: Identifier of the payment associated with the event
          example: 01960003-0000-7000-8000-000000000006
        refundType:
          type: string
          description: Type of refund recorded
          enum:
          - REVERSAL
          - CREDIT_MEMO
          - ADJUSTMENT
          example: REVERSAL
        refundAmount:
          type: number
          description: Refund amount
          example: 1250.0
        originalPaymentStatus:
          type: string
          description: Status of the original payment being refunded
          enum:
          - PENDING
          - SETTLED
          - FAILED
          - AUTHORIZED
          example: SETTLED
        refundMethod:
          type: string
          description: Method used to issue the refund
          enum:
          - VOID
          - CHARGEBACK
          - CASH_REFUND
          - CREDIT_MEMO
          example: CASH_REFUND
        linkedSourceIds:
          type: string
          description: Comma-separated linked source identifiers
          example: 01960003-0000-7000-8000-000000000007
        cancellationType:
          type: string
          description: Type of cancellation recorded
          enum:
          - ORDER_CANCELLED
          - INVOICE_CANCELLED
          - PAYMENT_FAILED
          example: ORDER_CANCELLED
        beforeSnapshot:
          type: string
          description: Snapshot of state before the cancellation (JSON)
        afterSnapshot:
          type: string
          description: Snapshot of state after the cancellation (JSON)
        partialPaymentInfo:
          type: string
          description: Partial payment details captured at cancellation (JSON)
        glReversalStatus:
          type: string
          description: Status of the GL reversal triggered by the cancellation
          example: COMPLETED
        accountingIntent:
          type: string
          description: Accounting intent of the event
          enum:
          - REVENUE_ADJUSTMENT
          - PAYMENT_REVERSAL
          - CUSTOMER_CREDIT
          - WRITE_OFF
          - REVENUE_REVERSAL
          - PAYMENT_RECOVERY
          example: REVENUE_ADJUSTMENT
        accountingStatus:
          type: string
          description: Accounting status of the event
          enum:
          - PENDING_POSTING
          - POSTED
          - RECONCILED
          - REJECTED
          - REVERSED
          - VOIDED
          - ON_HOLD
          - DISPUTED
          example: POSTED
        expectedAccountingOutcome:
          type: string
          description: Expected accounting outcome description
          example: Net revenue decreased by 150.00
        sourceEventId:
          type: string
          format: uuid
          description: Identifier of the source accounting event
          example: 01960003-0000-7000-8000-000000000008
        sourceDocumentId:
          type: string
          description: Identifier of the source business document
          example: INV-2026-000123
      required:
      - auditId
      - exceptionType
      - timestamp
    PriceOverrideRequest:
