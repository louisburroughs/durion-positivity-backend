        Use this tool to inspect how a customer is billed before generating or regenerating invoices; do not use regenerateInvoiceFromWorkorder, which performs the regeneration itself.

        Preconditions: the customer must exist in the customer service.

        Required inputs: customerId (UUID) as a path parameter; there is no request body.

