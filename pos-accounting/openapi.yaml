    TaxLiabilityReconciliation:
      type: object
      description: Reconciliation of report net tax against the Sales-Tax Payable (2200) GL account period activity
      properties:
        taxPayableAccountCode:
          type: string
          description: Sales-Tax Payable GL account code being reconciled against
          example: '2200'
        glNetActivity:
          type: number
          description: Credit-normal net activity of account 2200 in the period (Σ credit - Σ debit of POSTED lines); zero when the account has no activity or is not seeded
          example: 948.75
        reportNetTax:
          type: number
          description: Report's total net tax across all jurisdictions (echoes report totals.netTax)
          example: 948.75
        unattributedCredits:
          type: number
          description: Credit-memo tax that could not be attributed to any jurisdiction (the credit carries no frozen breakdown and its original invoice has no attributable tax rows). Excluded from the jurisdiction rows by design, so it accounts for exactly this much of the drift
          example: 0.0
        drift:
          type: number
          description: 'GL drift: reportNetTax - glNetActivity. Zero on a clean ledger; non-zero flags a mismatch'
          example: 0.0
        reconciled:
          type: boolean
          description: True when the UNEXPLAINED drift (drift - unattributedCredits) is within the 0.01 reconciliation tolerance. Unattributed credits inflate drift by exactly their own value, so that portion is explained and does not flag the ledger as out of balance
          example: true
      required:
      - drift
      - glNetActivity
      - reconciled
      - reportNetTax
      - taxPayableAccountCode
      - unattributedCredits
    TaxLiabilityRow:
      type: object
      description: Per-jurisdiction sales-tax liability row (taxable/exempt base, gross, credits netted, net tax)
      properties:
        jurisdictionType:
          type: string
          description: 'Jurisdiction level: STATE, COUNTY, CITY, or SPECIAL'
          example: STATE
        jurisdictionCode:
          type: string
          description: Jurisdiction code as reported by the tax engine
          example: WA
        jurisdictionName:
          type: string
          description: Human-readable jurisdiction name when available; null when the replica carries only the code
          example: Washington
        taxableBase:
          type: number
          description: Sum of taxable base for non-exempt lines in this jurisdiction
          example: 12500.0
        exemptBase:
          type: number
          description: Sum of taxable base for exempt / zero-rate lines in this jurisdiction
          example: 1500.0
        exemptionReasons:
          type: array
          description: Distinct exemption reason codes contributing to the exempt base (ascending); empty when none
          items:
            type: string
        taxCollectedGross:
          type: number
          description: Gross tax collected (Σ tax_amount of non-exempt lines) before credits
          example: 1031.25
        creditsNetted:
          type: number
          description: Credit/refund tax netted against this jurisdiction — POSTED credit-memo reversals allocated pro-rata to collected tax
          example: 82.5
        netTax:
          type: number
          description: 'Net tax owed for this jurisdiction: taxCollectedGross - creditsNetted'
          example: 948.75
      required:
      - creditsNetted
      - exemptBase
      - exemptionReasons
      - jurisdictionCode
      - jurisdictionType
      - netTax
      - taxCollectedGross
      - taxableBase
    TaxLiabilitySnapshotResponse:
      type: object
      description: Frozen Sales-Tax Liability snapshot for a closed accounting period
      properties:
        snapshotId:
          type: string
          format: uuid
          description: Snapshot id
        periodId:
          type: string
          format: uuid
          description: Accounting period id the snapshot freezes
        periodCode:
          type: string
          description: Accounting period code (YYYY-MM)
          example: 2026-06
        startDate:
          type: string
          format: date
          description: Period start date (inclusive)
          example: 2026-06-01
        endDate:
          type: string
          format: date
          description: Period end date (inclusive)
          example: 2026-06-30
        status:
          type: string
          description: 'Snapshot lifecycle status: ACTIVE or SUPERSEDED'
          example: ACTIVE
        periodClosedAt:
          type: string
          format: date-time
          description: The period's closedAt at freeze time
        frozenAt:
          type: string
          format: date-time
          description: Freeze timestamp
        frozenBy:
          type: string
          description: User who froze the snapshot
          example: controller
        contentHash:
          type: string
          description: SHA-256 (lowercase hex) over the canonical report serialization
        rows:
          type: array
          description: Frozen per-jurisdiction rows in report order
          items:
            $ref: '#/components/schemas/TaxLiabilityRow'
        totalTaxableBase:
          type: number
          description: Grand total taxable base
        totalExemptBase:
          type: number
          description: Grand total exempt base
        totalTaxCollectedGross:
          type: number
          description: Grand total gross tax collected
        totalCreditsNetted:
          type: number
          description: Grand total credits netted
        totalNetTax:
          type: number
          description: Grand total net tax
        reconciliation:
          $ref: '#/components/schemas/TaxLiabilityReconciliation'
        supersedesSnapshotId:
          type: string
          format: uuid
          description: Id of the ACTIVE snapshot this one superseded at freeze time; null for a first freeze
        supersededAt:
          type: string
          format: date-time
          description: When this snapshot was superseded; null while ACTIVE
        supersededBy:
          type: string
          description: User whose re-freeze superseded this snapshot; null while ACTIVE
      required:
      - contentHash
      - endDate
      - frozenAt
      - frozenBy
      - periodClosedAt
      - periodCode
      - periodId
      - reconciliation
      - rows
      - snapshotId
      - startDate
      - status
      - totalCreditsNetted
      - totalExemptBase
      - totalNetTax
      - totalTaxCollectedGross
      - totalTaxableBase
    TaxLiabilitySnapshotVerification:
      type: object
      description: Re-derivation check of a frozen Sales-Tax Liability snapshot against live data
      properties:
        snapshotId:
          type: string
          format: uuid
          description: Snapshot id verified
        periodCode:
          type: string
          description: Accounting period code (YYYY-MM)
          example: 2026-06
        verifiedAt:
          type: string
          format: date-time
          description: Verification timestamp
        snapshotContentHash:
          type: string
          description: Canonical hash stored at freeze time
        recomputedContentHash:
          type: string
          description: Canonical hash of the report re-derived from live data
        consistent:
          type: boolean
          description: True when the re-derived report hashes identically to the frozen snapshot
        frozenTotalNetTax:
          type: number
          description: Total net tax as frozen
        recomputedTotalNetTax:
          type: number
          description: Total net tax re-derived from live data
        netTaxDelta:
          type: number
          description: recomputedTotalNetTax - frozenTotalNetTax; zero when amounts agree even if row detail moved
      required:
      - consistent
      - frozenTotalNetTax
      - netTaxDelta
      - periodCode
      - recomputedContentHash
      - recomputedTotalNetTax
      - snapshotContentHash
      - snapshotId
      - verifiedAt
