    JournalEntryCreateRequest:
      type: object
      description: Request payload for creating or updating a journal entry
      properties:
        organizationId:
          type: string
          format: uuid
          description: Organization UUID
          example: 00000000-0000-4000-a000-000000000010
        transactionDate:
          type: string
          format: date-time
          description: Journal transaction date and time
          example: 2026-01-15T10:30:00
        description:
          type: string
          description: Journal entry description
          example: Invoice accrual posting
          maxLength: 500
          minLength: 0
        sourceEventId:
          type: string
          format: uuid
          description: Source event UUID
          example: 01936e5c-1234-7a3d-8b6e-123456789012
        sourceEventType:
          type: string
          description: Source event type
          example: INVOICE_RECEIVED
          maxLength: 100
          minLength: 0
        postingRuleSetId:
          type: string
          format: uuid
          description: Posting rule set UUID used to generate this journal entry
        postingRuleVersionId:
          type: string
          format: uuid
          description: Posting rule version UUID used to generate this journal entry
        lines:
          type: array
          description: Journal lines (must net to a balanced entry)
          items:
            $ref: "#/components/schemas/JournalEntryLineRequest"
      required:
      - lines
      - transactionDate
    JournalEntryLineRequest:
      type: object
      description: Journal entry line request
      properties:
        glAccountId:
          type: string
          format: uuid
          description: GL account UUID
          example: 01936e5d-1234-7a3d-8b6e-3c4567890123
        debitAmount:
          type: number
          description: Debit amount for this line
          example: 1250.0
          minimum: 0.00
        creditAmount:
          type: number
          description: Credit amount for this line
          example: 1250.0
          minimum: 0.00
        description:
          type: string
          description: Line description
          example: Recognize receivable
          maxLength: 500
          minLength: 0
        dimensions:
          type: object
          additionalProperties:
            type: string
          description: Optional dimensional attributes for reporting
          example:
            department: SERVICE
        singleSidedAmount:
          type: boolean
      required:
      - glAccountId
    JournalEntryLineResponse:
      type: object
      description: Journal entry line response
      properties:
        lineId:
          type: string
          format: uuid
          description: Line UUID
          example: 01936e60-1234-7a3d-8b6e-6f7890123456
        lineNumber:
          type: integer
          format: int32
          description: Line sequence number
          example: 1
        glAccountId:
          type: string
          format: uuid
          description: GL account UUID
          example: 01936e5d-1234-7a3d-8b6e-3c4567890123
        accountCode:
          type: string
          description: GL account code
          example: 1100-000
        accountName:
          type: string
          description: GL account name
          example: Accounts Receivable
        debitAmount:
          type: number
          description: Debit amount
          example: 1250.0
        creditAmount:
          type: number
          description: Credit amount
          example: 0.0
        description:
          type: string
          description: Line description
          example: Recognize receivable
        dimensions:
          type: object
          additionalProperties:
            type: string
          description: Optional dimensional attributes
          example:
            department: SERVICE
    JournalEntryResponse:
      type: object
      description: Journal entry response payload
      properties:
        journalEntryId:
          type: string
          format: uuid
          description: Journal entry UUID
          example: 01936e5e-7890-7a3d-8b6e-4d5678901234
        status:
          type: string
          description: Journal entry status
          enum:
          - DRAFT
          - PENDING
          - POSTED
          - REVERSED
          example: DRAFT
        transactionDate:
          type: string
          format: date-time
          description: Transaction date and time
          example: 2026-01-15T10:30:00
        description:
          type: string
          description: Journal entry description
          example: Invoice accrual posting
        sourceEventId:
          type: string
          format: uuid
          description: Source event UUID
          example: 01936e5c-1234-7a3d-8b6e-123456789012
        sourceEventType:
          type: string
          description: Source event type
          example: INVOICE_RECEIVED
        postingRuleSetId:
          type: string
          format: uuid
          description: Posting rule set UUID
        postingRuleVersionId:
          type: string
          format: uuid
          description: Posting rule version UUID
        reversalJournalEntryId:
          type: string
          format: uuid
          description: Original journal entry UUID when this entry is a reversal
        reversedByJournalEntryId:
          type: string
          format: uuid
          description: Reversal journal entry UUID when this entry has been reversed
        totalDebits:
          type: number
          description: Total debits
          example: 1250.0
        totalCredits:
          type: number
          description: Total credits
          example: 1250.0
        isBalanced:
          type: boolean
          description: Whether total debits equal total credits
          example: true
        lines:
          type: array
          description: Journal entry lines
          items:
            $ref: "#/components/schemas/JournalEntryLineResponse"
        createdAt:
          type: string
          format: date-time
          description: Created timestamp
          example: 2026-01-15T10:31:00Z
        createdBy:
          type: string
          description: Created by username
          example: accounting.user
        modifiedAt:
          type: string
          format: date-time
          description: Last modified timestamp
          example: 2026-01-15T10:32:00Z
        modifiedBy:
          type: string
          description: Last modified by username
          example: accounting.user
        postedAt:
          type: string
          format: date-time
          description: Posted timestamp
          example: 2026-01-15T10:40:00Z
