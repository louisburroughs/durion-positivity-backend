    InvoiceStatusResponse:
      type: object
      description: Invoice payment status response
      properties:
        invoiceId:
          type: string
          format: uuid
          description: Invoice UUID
          example: 01960003-0000-7000-8000-000000000001
        status:
          type: string
          description: Payment status of the invoice
          enum:
          - PAID
          - PARTIALLY_PAID
          - UNPAID
          - FAILED
          - CHARGEBACK
          example: PARTIALLY_PAID
        totalPaid:
          type: number
          description: Total amount paid to date
          example: 1250.0
        invoiceTotal:
          type: number
          description: Total invoice amount
          example: 1250.0
        remainingBalance:
          type: number
          description: Remaining balance (invoice total minus total paid)
          example: 0.0
        latestTransactionReference:
          type: string
          description: Reference of the latest payment transaction
          example: TXN-2026-000123
        lastUpdated:
          type: string
          format: date-time
          description: Last updated timestamp
          example: 2026-06-18 08:00:00+00:00
      required:
      - invoiceId
      - status
    BillingRuleRefResponse:
      type: object
      description: Billing rules snapshot returned by pos-customer for a customer account
      properties:
        poRequired:
          type: boolean
          description: Whether a purchase order is required for billing
          example: true
        taxExempt:
          type: boolean
          description: Whether the customer is tax exempt
          example: false
        paymentTerms:
          type: string
          description: Agreed payment terms
          example: NET30
        creditLimit:
          type: number
          description: Credit limit extended to the customer
          example: 50000.0
        creditHold:
          type: boolean
          description: Whether the customer is currently on credit hold
          example: false
        invoiceDeliveryMethod:
          type: string
          description: Method used to deliver invoices
          example: EMAIL
        billingAddressId:
          type: string
          format: uuid
          description: Identifier of the billing address
          example: 01960003-0000-7000-8000-000000000001
        autoPayEnabled:
          type: boolean
          description: Whether automatic payment is enabled
          example: false
        discountPolicyRef:
          type: string
          description: Reference to the applicable discount policy
          example: STD-2026
        currency:
          type: string
          description: ISO 4217 currency code
          example: USD
        extensions:
          type: object
          description: Additional extension attributes keyed by name
      required:
      - autoPayEnabled
      - creditHold
      - poRequired
      - taxExempt
