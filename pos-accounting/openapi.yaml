        totals:
          $ref: '#/components/schemas/AgingSummary'
      required:
      - asOfDate
      - generatedAt
      - rows
      - totals
      type: object
    AgedReceivablesRow:
      description: Per-customer aged receivables row with bucketed open invoice balances. Age is measured from the invoice due date, falling back to the invoice date when no due date is recorded; invoices due today or later are notYetDue, the four late buckets are overdue money.
      properties:
        customerId:
          description: Customer (party) UUID
          example: d10217f9-3ec6-46b9-9c87-e7066c100c24
          format: uuid
          type: string
        customerName:
          description: Customer display name from the customer replica; null when the party is not yet known
          example: Acme Fleet Services
          type: string
        customerReference:
          description: Customer number from the customer replica; null when the party is not yet known
          example: C-10042
          type: string
        days1To30:
          description: Outstanding 1-30 days past due
          example: 250.0
          type: number
        days31To60:
          description: Outstanding 31-60 days past due
          example: 500.0
          type: number
        days61To90:
          description: Outstanding 61-90 days past due
          example: 0.0
          type: number
        days90Plus:
          description: Outstanding more than 90 days past due
          example: 0.0
          type: number
        notYetDue:
          description: 'Outstanding not yet due: due today or later (due today is not overdue)'
          example: 1000.0
          type: number
        overdue:
          description: 'Overdue: the sum of days1To30, days31To60, days61To90 and days90Plus'
          example: 750.0
          type: number
        totalOutstanding:
          description: 'Total outstanding for the customer: notYetDue + overdue'
          example: 1750.0
          type: number
      required:
      - customerId
      - days1To30
      - days31To60
      - days61To90
      - days90Plus
      - notYetDue
      - overdue
      - totalOutstanding
      type: object
    AgingSummary:
      description: Grand-total aging buckets across all rows of an aged AR/AP report
      properties:
        days1To30:
          description: Total outstanding 1-30 days past due
          example: 3500.0
          type: number
        days31To60:
          description: Total outstanding 31-60 days past due
          example: 4200.0
          type: number
        days61To90:
          description: Total outstanding 61-90 days past due
          example: 1800.0
          type: number
        days90Plus:
          description: Total outstanding more than 90 days past due
          example: 900.0
          type: number
        notYetDue:
          description: 'Total outstanding not yet due: due today or later (due today is not overdue)'
          example: 9000.0
          type: number
        overdue:
          description: 'Total overdue: the sum of days1To30, days31To60, days61To90 and days90Plus'
          example: 10400.0
          type: number
        totalOutstanding:
          description: 'Grand total outstanding: notYetDue + overdue'
          example: 19400.0
          type: number
      required:
      - days1To30
      - days31To60
      - days61To90
      - days90Plus
      - notYetDue
      - overdue
      - totalOutstanding
      type: object
