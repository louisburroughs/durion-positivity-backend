                  lineItemId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
                  originalPrice: 49.99
                  adjustedPrice: 39.99
                  actorRole: STORE_MANAGER
                  reason: Price match against competitor
        required: true
      responses:
        '201':
          description: Price override recorded successfully
