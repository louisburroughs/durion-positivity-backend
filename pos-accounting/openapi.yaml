        invoiceBalanceBefore:
          type: number
          description: Invoice balance before this application
          example: 1000.0
        invoiceBalanceAfter:
          type: number
          description: Invoice balance after this application
          example: 0.0
        invoiceStatus:
          type: string
          description: Invoice status after this application
          enum:
          - OPEN
          - PARTIALLY_PAID
          - PAID_IN_FULL
          - VOIDED
          - CANCELLED
          - UNKNOWN
          example: PAID_IN_FULL
    CustomerCreditInfo:
