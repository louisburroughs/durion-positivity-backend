        name: isActive
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingKeyListResponse'
          description: Mapping keys listed
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Posting category not found
      security:
      - bearerAuth:
        - accounting:mapping-key:view
      summary: List Mapping Keys By Category
      tags:
      - Mapping Keys
      x-required-permissions:
      - accounting:mapping-key:view
  /v1/accounting/posting-rules:
    get:
      description: 'Lists posting rule sets, the event-to-journal-entry conversion definitions, as a paginated projection.

        Use this tool when browsing rule sets; do not use getPostingRuleSet, which fetches one set by id, or listPostingRuleVersions, which lists a set''s version history.

        Preconditions: none beyond the caller holding accounting:posting_rules:view.

        Required inputs: none; page defaults to 0, size to 20, and sort to createdAt descending (supported fields: createdAt, modifiedAt, updatedAt, name, eventType).

        Emits an ACCOUNTING_POSTING_RULE_LIST audit event; no state changes.

        Returns 400 when the sort property is not one of the supported fields.

        '
      operationId: listPostingRuleSets
      parameters:
      - description: Page index (0-based)
        in: query
        name: page
        required: false
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
      - description: Page size
        in: query
        name: size
        required: false
        schema:
          default: 20
          exclusiveMinimum: 0
          format: int32
          type: integer
      - description: 'Sort field with optional direction, e.g. ''modifiedAt,desc''. Supported fields: createdAt, modifiedAt, updatedAt, name, eventType. Direction defaults to desc.'
        in: query
        name: sort
        required: true
        schema:
          default: createdAt
          minLength: 1
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRuleSetListResponse'
          description: Posting rule sets listed
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unsupported sort property or direction
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden
      security:
      - bearerAuth:
        - accounting:posting_rules:view
      summary: List Posting Rule Sets
      tags:
      - Posting Rules
      x-required-permissions:
      - accounting:posting_rules:view
    post:
      description: 'Creates a posting rule set for one event type together with its initial DRAFT version holding the rules definition.

        Use this tool to introduce new event-to-journal-entry conversion rules; do not use publishPostingRuleSet, which activates an existing draft, and do not use createDefaultMapping, which only sets a fallback account pair.

        Preconditions: none; drafts may hold work-in-progress definitions because split-group and predicate-grammar invariants are enforced only at publish time.

        Required inputs: name (max 100 chars), eventType (max 100 chars), rulesDefinition (JSON rules document as a string) and createdBy (max 50 chars); description is optional.

        Emits an ACCOUNTING_POSTING_RULE_CREATE event; the new version starts in DRAFT and does not affect posting until published.

        Returns 400 when required fields are missing or blank.

        '
      operationId: createPostingRuleSet
      requestBody:
        content:
          application/json:
            examples:
              Invoice finalized rules:
                description: Invoice finalized rules
                value:
                  createdBy: jdoe
                  description: AR and revenue postings for finalized invoices
                  eventType: INVOICE_FINALIZED
                  name: Invoice posting rules
                  rulesDefinition: '{"rules":[{"debit":"1100","credit":"4000","amountField":"totalAmount"}]}'
            schema:
              $ref: '#/components/schemas/PostingRuleSetCreateRequest'
        description: Rule set metadata with the initial DRAFT rules definition document.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRuleSetResponse'
          description: Posting rule set created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request
      security:
      - bearerAuth:
        - accounting:posting_rules:create
      summary: Create Posting Rule Set
      tags:
      - Posting Rules
      x-required-permissions:
      - accounting:posting_rules:create
  /v1/accounting/posting-rules/{postingRuleSetId}:
    get:
      description: 'Returns one posting rule set with its metadata and current version state.

        Use this tool when the rule set id is already known; use listPostingRuleSets instead when searching, or listPostingRuleVersions for the full version history.

        Preconditions: the posting rule set must exist.

        Required inputs: postingRuleSetId (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 404 POSTING_RULE_SET_NOT_FOUND when no posting rule set exists for the supplied id.

        '
      operationId: getPostingRuleSet
      parameters:
      - description: Posting rule set identifier
        in: path
        name: postingRuleSetId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRuleSetResponse'
          description: Posting rule set returned
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No posting rule set exists for the identifier (POSTING_RULE_SET_NOT_FOUND)
      security:
      - bearerAuth:
        - accounting:posting_rules:view
      summary: Get Posting Rule Set
      tags:
      - Posting Rules
      x-required-permissions:
      - accounting:posting_rules:view
    put:
      description: 'Updates a posting rule set''s metadata and draft rules definition while no PUBLISHED version exists.

        Use this tool to iterate on a draft before publishing; do not use it once a version is PUBLISHED, and do not use publishPostingRuleSet, which is the activation step.

        Preconditions: the rule set must exist and must not have a PUBLISHED version.

        Required inputs: postingRuleSetId (UUID) as a path parameter plus the same body shape as createPostingRuleSet (name, eventType, rulesDefinition, createdBy).

        Emits an ACCOUNTING_POSTING_RULE_UPDATE event.

        Returns 404 POSTING_RULE_SET_NOT_FOUND when the rule set id cannot be resolved, and 409 when a PUBLISHED version already exists.

        '
      operationId: updatePostingRuleSet
      parameters:
      - description: Posting rule set identifier
        in: path
        name: postingRuleSetId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Revised draft rules:
                description: Revised draft rules
                value:
                  createdBy: jdoe
                  eventType: INVOICE_FINALIZED
                  name: Invoice posting rules v2
                  rulesDefinition: '{"rules":[{"debit":"1100","credit":"4000","amountField":"totalAmount"}]}'
            schema:
              $ref: '#/components/schemas/PostingRuleSetCreateRequest'
        description: Replacement rule set metadata and draft rules definition.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRuleSetResponse'
          description: Posting rule set updated
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No posting rule set exists for the identifier (POSTING_RULE_SET_NOT_FOUND)
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Cannot modify published rule set
      security:
      - bearerAuth:
        - accounting:posting_rules:create
      summary: Update Posting Rule Set
      tags:
      - Posting Rules
      x-required-permissions:
      - accounting:posting_rules:create
  /v1/accounting/posting-rules/{postingRuleSetId}/archive:
    post:
      description: 'Archives the rule set''s PUBLISHED version (PUBLISHED to ARCHIVED), taking it out of live event-to-journal-entry conversion.

        Use this tool to retire live rules deliberately; do not use publishPostingRuleSet, which already archives the old version automatically when a replacement draft is published.

        Preconditions: the rule set must have a PUBLISHED version; after archiving, events of this type fall back to default GL mappings or fail as UNMAPPED_EVENT_TYPE.

        Required inputs: postingRuleSetId (UUID) as a path parameter; there is no request body.

        Emits an ACCOUNTING_POSTING_RULE_ARCHIVE event.

        Returns 400 when no PUBLISHED version exists to archive, and 404 POSTING_RULE_SET_NOT_FOUND when no posting rule set exists for the supplied id.

        '
      operationId: archivePostingRuleSet
      parameters:
      - description: Posting rule set identifier
        in: path
        name: postingRuleSetId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRuleVersionResponse'
          description: Posting rule set archived
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No PUBLISHED version exists to archive
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No posting rule set exists for the identifier (POSTING_RULE_SET_NOT_FOUND)
      security:
      - bearerAuth:
        - accounting:posting_rules:archive
      summary: Archive Posting Rule Set
      tags:
      - Posting Rules
      x-required-permissions:
      - accounting:posting_rules:archive
  /v1/accounting/posting-rules/{postingRuleSetId}/publish:
    post:
      description: 'Publishes the rule set''s DRAFT version (DRAFT to PUBLISHED), making it the live conversion definition for its event type; any previously PUBLISHED version is archived atomically in the same call.

        Use this tool to activate reviewed rules; do not use archivePostingRuleSet, which retires the live version without a replacement, and use resolveTestMapping to dry-run the rules first.

        Preconditions: the set must have a DRAFT version with a non-empty rules definition that passes split-group and condition-predicate validation.

        Required inputs: postingRuleSetId (UUID) as a path parameter; there is no request body.

        Emits an ACCOUNTING_POSTING_RULE_PUBLISH event; subsequent accounting events for the event type post through the new version.

        Returns 400 when no DRAFT version exists or its definition is empty, 404 POSTING_RULE_SET_NOT_FOUND when no posting rule set exists for the supplied id, and 422 UNBALANCED_RULES listing every offending condition, group or line in fieldErrors when publish-time validation fails.

        '
      operationId: publishPostingRuleSet
      parameters:
      - description: Posting rule set identifier
        in: path
        name: postingRuleSetId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingRuleVersionResponse'
          description: Posting rule set published
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No DRAFT version exists to publish
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No posting rule set exists for the identifier (POSTING_RULE_SET_NOT_FOUND)
      security:
      - bearerAuth:
        - accounting:posting_rules:publish
      summary: Publish Posting Rule Set
      tags:
      - Posting Rules
      x-required-permissions:
      - accounting:posting_rules:publish
  /v1/accounting/posting-rules/{postingRuleSetId}/versions:
    get:
      description: 'Lists the version history of one posting rule set with each version''s DRAFT, PUBLISHED or ARCHIVED state and timestamps.

        Use this tool to audit how a rule set evolved; use getPostingRuleSet instead for the set''s current metadata only.

        Preconditions: the posting rule set must exist; a set always has at least its initial version.

        Required inputs: postingRuleSetId (UUID) as a path parameter; page defaults to 0 and size to 10.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 with an empty list when the page index is beyond the version history, and 404 POSTING_RULE_SET_NOT_FOUND when no posting rule set exists for the supplied id.

        '
      operationId: listPostingRuleVersions
      parameters:
      - description: Posting rule set identifier
        in: path
        name: postingRuleSetId
        required: true
        schema:
          format: uuid
          type: string
      - description: Page index (0-based)
        in: query
        name: page
        required: false
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
      - description: Page size
        in: query
        name: size
        required: false
        schema:
          default: 10
          exclusiveMinimum: 0
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PostingRuleVersionResponse'
                type: array
          description: Posting rule versions listed
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No posting rule set exists for the identifier (POSTING_RULE_SET_NOT_FOUND)
      security:
      - bearerAuth:
        - accounting:posting_rules:view
      summary: List Posting Rule Versions
      tags:
      - Posting Rules
      x-required-permissions:
      - accounting:posting_rules:view
  /v1/accounting/receivable-payments:
    get:
      description: 'Lists the customer payments still waiting to be matched, oldest cleared first, each with the open invoices it most likely pays, the reasons, and what would be left over as credit.

        Use this tool to choose a payment to match; then apply it with applyPaymentToInvoices, and do not treat a suggestion as applied, because the list is advisory and the apply command validates again.

        Preconditions: the caller needs accounting:payment:apply authority; only payments with an unapplied amount (status AVAILABLE) are listed.

        Required inputs: none; status (only AVAILABLE), customerId (UUID), page (0 or more) and size (1 to 100, default 25) are optional query parameters.

        Emits an ACCOUNTING_RECEIVABLE_PAYMENT_LIST_VIEW event and changes no state; the summary totals cover every payment matching the filter, not only the page.

        Returns 400 VALIDATION_ERROR when status is not AVAILABLE, customerId is malformed or size is outside 1 to 100, and 403 when the caller lacks the authority.

        '
      operationId: listUnappliedPayments
      parameters:
      - description: Payment status; only AVAILABLE is supported
        example: AVAILABLE
        in: query
        name: status
        required: false
        schema:
          default: AVAILABLE
          type: string
      - description: Only this customer's payments
        example: 0198a000-0000-7000-8000-000000000412
        in: query
        name: customerId
        required: false
        schema:
          format: uuid
          type: string
      - description: Page index (0-based)
        example: 0
        in: query
        name: page
        required: false
        schema:
          default: 0
          format: int32
          type: integer
      - description: Page size, 1 to 100
        example: 25
        in: query
        name: size
        required: false
        schema:
          default: 25
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnappliedPaymentsPage'
          description: A page of unapplied payments with suggestions and a summary
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'VALIDATION_ERROR: status other than AVAILABLE, malformed customerId, or size outside 1-100'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks accounting:payment:apply
      security:
      - bearerAuth:
        - accounting:payment:apply
      summary: List Unapplied Customer Payments
      tags:
      - Payment Applications
      x-required-permissions:
      - accounting:payment:apply
  /v1/accounting/reconciliations:
    get:
      description: 'Lists bank reconciliation headers most recent first as a paginated projection, optionally filtered by GL account, status, attribution period (periodCode, YYYY-MM) and a from/to window on the statement end date; each row carries the terms its last mutation stored.

        Use this tool to find reconciliations by account, status or period; do not use getReconciliation, which fetches one reconciliation with its lines by id.

        Preconditions: none beyond the caller holding accounting:reconciliation:view.

        Required inputs: none; glAccountId, status (IN_PROGRESS, SUBMITTED, FINALIZED, INVALIDATED, SUPERSEDED, CANCELLED), periodCode, from and to are optional filters, page defaults to 0 and size to 20.

        Emits an ACCOUNTING_RECONCILIATION_LIST audit event; no state changes.

        Returns 200 with an empty page when nothing matches the filters.

        '
      operationId: listReconciliations
      parameters:
      - description: Filter by reconciled GL account id
        in: query
        name: glAccountId
        required: false
        schema:
          format: uuid
          type: string
      - description: Filter by reconciliation status
        in: query
        name: status
        required: false
        schema:
          enum:
          - IN_PROGRESS
          - SUBMITTED
          - FINALIZED
          - INVALIDATED
          - SUPERSEDED
          - CANCELLED
          type: string
      - description: Filter by attribution period (YYYY-MM of the statement end date)
        example: 2026-09
        in: query
        name: periodCode
        required: false
        schema:
          type: string
      - description: Statement end date on or after this date
        example: '2026-01-01'
        in: query
        name: from
        required: false
        schema:
          format: date
          type: string
      - description: Statement end date on or before this date
        example: '2026-12-31'
        in: query
        name: to
        required: false
        schema:
          format: date
          type: string
      - description: Zero-based page index
        example: 0
        in: query
        name: page
        required: false
        schema:
          default: 0
          format: int32
          type: integer
      - description: Page size
        example: 20
        in: query
        name: size
        required: false
        schema:
          default: 20
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankReconciliationListResponse'
          description: Reconciliations listed
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:reconciliation:view permission
      security:
      - bearerAuth:
        - accounting:reconciliation:view
      summary: List Reconciliations
      tags:
      - Bank Reconciliation
      x-required-permissions:
      - accounting:reconciliation:view
    post:
      description: 'Starts an IN_PROGRESS reconciliation of a COMMITTED bank statement: the window, opening and closing balances are copied from the statement, and the explicit equation (E3), the opening terms, the account baseline and the unexplained counts are computed live from the ledger.

        Use this tool to begin reconciling a statement committed through bank-statements or a file import; do not use createBankStatement or the bank-import commit, which commit the statement itself.

        Preconditions: the account must be a reconcilable BANK_CASH account; the statement must be COMMITTED on that account and have no IN_PROGRESS reconciliation and no FINALIZED one without a successor. An interim reconciliation to a date is a manual-entry statement in phase 1.

        Required inputs: glAccountId, requestId (UUIDv7) and statementId in the body.

        Emits an ACCOUNTING_RECONCILIATION_CREATE event and writes a RECONCILIATION_CREATE audit row; no journal entry is posted.

        Returns 201 with the header, or 200 with replayed true when the same requestId and payload are sent again; 409 RECONCILIATION_WINDOW_ALREADY_RECONCILED (fieldErrors naming the reconciliationId) when the statement is already reconciled, 409 IDEMPOTENCY_CONFLICT when the requestId was used with another payload, 404 BANK_STATEMENT_NOT_FOUND when the statement is unknown on the account, 422 ACCOUNT_NOT_RECONCILABLE when the account is not a bank account, and 422 BANK_ACCOUNT_FEED_NOT_LINKED when the body has no statementId (the statementless interim is phase 2).

        '
      operationId: createReconciliation
      requestBody:
        content:
          application/json:
            examples:
              September statement:
                description: September statement
                value:
                  glAccountId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  requestId: 019a0000-0000-7000-8000-000000000001
                  statementId: 019a0000-0000-7000-8000-000000000002
            schema:
              $ref: '#/components/schemas/ReconciliationCreateRequest'
        description: The statement to reconcile and the command's requestId.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankReconciliationResponse'
          description: Replay of an earlier create with the same requestId (replayed = true)
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankReconciliationResponse'
          description: Reconciliation started
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Request body invalid (VALIDATION_ERROR)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:reconciliation:adjust permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Statement not found on the account (BANK_STATEMENT_NOT_FOUND)
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Statement already reconciled (RECONCILIATION_WINDOW_ALREADY_RECONCILED) or requestId reused with another payload (IDEMPOTENCY_CONFLICT)
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Account is not a reconcilable bank account (ACCOUNT_NOT_RECONCILABLE), or the body is statementless on an account without a feed link (BANK_ACCOUNT_FEED_NOT_LINKED)
      security:
      - bearerAuth:
        - accounting:reconciliation:adjust
      summary: Start Reconciliation From Statement
      tags:
      - Bank Reconciliation
      x-required-permissions:
      - accounting:reconciliation:adjust
  /v1/accounting/reconciliations/adjustment-types:
    get:
      description: 'Returns the supported reconciliation adjustment types with their sign rules (BANK_FEE and NSF_FEE negative-only, INTEREST_EARNED positive-only, OTHER and TRANSFER any), so clients never hardcode the enum.

        Use this tool to populate an adjustment picker before calling addReconciliationAdjustment; do not use addReconciliationAdjustment itself just to discover the types.

        Preconditions: none.

        Required inputs: none; there are no parameters and no request body.

        Emits an ACCOUNTING_RECONCILIATION_ADJUSTMENT_TYPES_LIST audit event; no state changes.

        Returns 200 with the full static type list.

        '
      operationId: listReconciliationAdjustmentTypes
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AdjustmentTypeResponse'
                type: array
          description: Adjustment types listed
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:reconciliation:view permission
      security:
      - bearerAuth:
        - accounting:reconciliation:view
      summary: List Reconciliation Adjustment Types
      tags:
      - Bank Reconciliation
      x-required-permissions:
      - accounting:reconciliation:view
  /v1/accounting/reconciliations/{reconciliationId}:
    get:
      description: 'Returns one bank reconciliation header with every term of the explicit equation (E3) and the opening terms computed live from the ledger, the baseline date and the unexplained counts; statement lines are not embedded (read them from bank-transactions).

        Use this tool when the reconciliation id is already known; use listReconciliations instead when searching by account or status, or getReconciliationReview for the full workspace read model.

        Preconditions: the reconciliation must exist.

        Required inputs: reconciliationId (UUID) as a path parameter; there is no request body.

        Emits an ACCOUNTING_RECONCILIATION_GET audit event; no state changes.

        Returns 404 RECONCILIATION_NOT_FOUND when the id is unknown.

        '
      operationId: getReconciliation
      parameters:
      - description: Reconciliation id
        in: path
        name: reconciliationId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankReconciliationResponse'
          description: Reconciliation found
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:reconciliation:view permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reconciliation not found (RECONCILIATION_NOT_FOUND)
      security:
      - bearerAuth:
        - accounting:reconciliation:view
      summary: Get Reconciliation
      tags:
      - Bank Reconciliation
      x-required-permissions:
      - accounting:reconciliation:view
  /v1/accounting/reconciliations/{reconciliationId}/adjustments:
    post:
      description: 'Posts a reconciliation adjustment as a real balanced journal entry through the accounting-period gate: positive debits the reconciled cash account against the type''s mapped counter account, negative credits it; BANK_FEE and NSF_FEE are negative, INTEREST_EARNED positive, and TRANSFER (either sign) posts against counterGlAccountId, another bank account, with no mapping.

        OTHER posts to the clearing account and names exactly one link: a bank transaction, settlesMatchId (a match residual; the server sets the amount to the served residual and replaces the match with an exact one) or bridgesStatementId (this statement''s acknowledged gap; the server sets the amount to the opening difference); with a bankTransactionId the entry''s cash line is matched to it as an ADJUSTMENT match, and the entry is dated at the explaining date (the bank date, the residual match''s latest bank date, or the day before the window) when its period is open, else at transactionDate.

        Use this tool for a bank-only movement the books lack; do not use it for a timing difference (registerReconciliationOutstandingItem), a duplicate (bank-transaction duplicate review) or a books error (a journal-entry reversal).

        Preconditions: the reconciliation must be IN_PROGRESS (409 RECONCILIATION_ALREADY_FINALIZED when FINALIZED, RECONCILIATION_NOT_EDITABLE in any other status); an OTHER needs a justification of at least 10 characters and, above the tenant''s BANK_REC_OTHER_APPROVAL_THRESHOLD (or while it is unset, for anything but a residual), accounting:reconciliation:approve; posting into a CLOSED period needs overrideJustification and accounting:period:override.

        Required inputs: reconciliationId as a path parameter; type and requestId in the body, amount unless a residual or bridge is named, and the links and justification the type needs.

        Emits an ACCOUNTING_RECONCILIATION_ADJUSTMENT event and a RECONCILIATION_ADJUSTMENT audit row, and posts a journal entry that changes GL balances.

        Returns 201 with the adjustment (200 with replayed true for a replayed requestId); 400 JUSTIFICATION_REQUIRED; 403 RECONCILIATION_ADJUSTMENT_APPROVAL_REQUIRED; 409 RECONCILIATION_LINE_INELIGIBLE, ADJUSTMENT_BRIDGE_ALREADY_POSTED, IDEMPOTENCY_CONFLICT, RECONCILIATION_ALREADY_FINALIZED or RECONCILIATION_NOT_EDITABLE; 422 RECONCILIATION_ADJUSTMENT_SIGN_INVALID, ADJUSTMENT_LINK_REQUIRED, ADJUSTMENT_LINK_NOT_ELIGIBLE, GL_ACCOUNT_NOT_ACTIVE, ACCOUNT_NOT_RECONCILABLE, PERIOD_CLOSED, PERIOD_HARD_LOCKED or GL_MAPPING_NOT_CONFIGURED when the rule named fails; an adjustment linked to a bank transaction must equal its amount exactly (no minor-unit tolerance), and any difference is ADJUSTMENT_LINK_NOT_ELIGIBLE on amount.

        '
      operationId: addReconciliationAdjustment
      parameters:
      - description: Reconciliation id
        in: path
        name: reconciliationId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Bank fee linked to its bank row:
                description: Bank fee linked to its bank row
                value:
                  amount: -15.0
                  bankTransactionId: 019a0000-0000-7000-8000-000000000030
                  description: Monthly account service fee
                  requestId: 019a0000-0000-7000-8000-000000000031
                  type: BANK_FEE
            schema:
              $ref: '#/components/schemas/ReconciliationAdjustmentRequest'
        description: The typed adjustment, its links and the command's requestId.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankReconciliationAdjustmentResponse'
          description: Replay of an earlier adjustment with the same requestId (replayed = true)
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankReconciliationAdjustmentResponse'
          description: Adjustment posted
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: VALIDATION_ERROR or JUSTIFICATION_REQUIRED
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks accounting:reconciliation:adjust, or approve for this OTHER (RECONCILIATION_ADJUSTMENT_APPROVAL_REQUIRED)
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reconciliation or bank transaction not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: RECONCILIATION_LINE_INELIGIBLE, ADJUSTMENT_BRIDGE_ALREADY_POSTED, IDEMPOTENCY_CONFLICT, RECONCILIATION_ALREADY_FINALIZED or RECONCILIATION_NOT_EDITABLE
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: RECONCILIATION_ADJUSTMENT_SIGN_INVALID, ADJUSTMENT_LINK_REQUIRED, ADJUSTMENT_LINK_NOT_ELIGIBLE, GL_ACCOUNT_NOT_ACTIVE, ACCOUNT_NOT_RECONCILABLE, PERIOD_CLOSED, PERIOD_HARD_LOCKED, GL_MAPPING_NOT_CONFIGURED or AMOUNT_PRECISION_EXCEEDS_CURRENCY
      security:
      - bearerAuth:
        - accounting:reconciliation:adjust
      summary: Post Reconciliation Adjustment
      tags:
      - Bank Reconciliation
      x-required-permissions:
      - accounting:reconciliation:adjust
  /v1/accounting/reconciliations/{reconciliationId}/adjustments/{adjustmentId}/reverse:
    post:
      description: 'Reverses a posted adjustment by posting the inverse journal entry through the period gate; the adjustment becomes REVERSED, its ADJUSTMENT match is unmatched and its bank transaction returns to UNMATCHED. The original and its reversal form a reversal pair that never counts as unexplained; a reversed gap bridge frees its statement for a new bridge.

        Use this tool when an adjustment was wrong or the bank reversed the item; do not use the journal-entry reversal endpoint, which leaves the reconciliation''s links in place.

        Preconditions: the reconciliation must be IN_PROGRESS, SUBMITTED or FINALIZED (a reversal under a FINALIZED one invalidates it; 409 RECONCILIATION_NOT_EDITABLE otherwise) and the adjustment must be POSTED.

        Required inputs: reconciliationId and adjustmentId as path parameters; reason (at least 10 characters) in the body; reversalDate and overrideJustification optional.

        Emits an ACCOUNTING_RECONCILIATION_ADJUSTMENT_REVERSE event and a RECONCILIATION_ADJUSTMENT_REVERSE audit row, and posts the reversal journal entry.

        Returns 400 VALIDATION_ERROR or JUSTIFICATION_REQUIRED for the reason, 404 RECONCILIATION_NOT_FOUND for an unknown adjustment, 409 ADJUSTMENT_ALREADY_REVERSED, JE_NOT_POSTED, JE_ALREADY_REVERSED or RECONCILIATION_NOT_EDITABLE, and 422 PERIOD_CLOSED or PERIOD_HARD_LOCKED when the reversal date is not open.

        '
      operationId: reverseReconciliationAdjustment
      parameters:
      - description: Reconciliation id
        in: path
        name: reconciliationId
        required: true
        schema:
          format: uuid
          type: string
      - description: Adjustment id
        in: path
        name: adjustmentId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Refunded fee:
                description: Refunded fee
                value:
                  reason: Bank refunded the service fee
            schema:
              $ref: '#/components/schemas/AdjustmentReverseRequest'
        description: Why the adjustment is reversed.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankReconciliationAdjustmentResponse'
          description: Adjustment reversed
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: VALIDATION_ERROR or JUSTIFICATION_REQUIRED
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks accounting:reconciliation:approve
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reconciliation or adjustment not found (RECONCILIATION_NOT_FOUND)
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ADJUSTMENT_ALREADY_REVERSED, JE_NOT_POSTED, JE_ALREADY_REVERSED or RECONCILIATION_NOT_EDITABLE
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: PERIOD_CLOSED or PERIOD_HARD_LOCKED
      security:
      - bearerAuth:
        - accounting:reconciliation:approve
      summary: Reverse Reconciliation Adjustment
      tags:
      - Bank Reconciliation
      x-required-permissions:
      - accounting:reconciliation:approve
  /v1/accounting/reconciliations/{reconciliationId}/audit:
    get:
      description: 'Returns the stored audit trail, oldest first and a page at a time: every AccountingAuditLog row of the reconciliation (create, adjustments and their reversals, auto-match, submit, approve including a refused or allowed self-approval, return, cancel, supersede, invalidation), of its matches (match, accept, reject, unmatch) and of the outstanding items it registered, cleared or reaffirmed — each with operation, actor, timestamp, trace id, justification and the old and new value.

        Use this tool when reviewing who did what during a reconciliation; use getReconciliationReport instead for the balance summary.

        Preconditions: the reconciliation must exist.

        Required inputs: reconciliationId (UUID) as a path parameter; page (default 0) and size (default 50, at most 200) are optional; there is no request body.

        Emits an ACCOUNTING_RECONCILIATION_AUDIT audit event; no state changes.

        Returns 404 RECONCILIATION_NOT_FOUND when the id is unknown.

        '
      operationId: getReconciliationAudit
      parameters:
      - description: Reconciliation id
        in: path
        name: reconciliationId
        required: true
        schema:
          format: uuid
          type: string
      - description: Zero-based page index
        example: 0
        in: query
        name: page
        required: false
        schema:
          default: 0
          format: int32
          type: integer
      - description: Page size (at most 200)
        example: 50
        in: query
        name: size
        required: false
        schema:
          default: 50
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationAuditResponse'
          description: Audit trail page read
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:reconciliation:view permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reconciliation not found (RECONCILIATION_NOT_FOUND)
      security:
      - bearerAuth:
        - accounting:reconciliation:view
      summary: Get Reconciliation Audit Trail
      tags:
      - Bank Reconciliation
      x-required-permissions:
      - accounting:reconciliation:view
  /v1/accounting/reconciliations/{reconciliationId}/auto-match:
    post:
      description: 'Proposes a ONE_TO_ONE RULE match, state PROPOSED, for every unexplained bank transaction whose top candidate scores at least 90 and beats the second by at least 20; closer calls propose nothing and are counted as ambiguous. The system never accepts a match.

        Use this tool to pre-pair the obvious rows before reviewing them with acceptReconciliationMatch or rejectReconciliationMatch; use createReconciliationMatch instead to record a pairing directly.

        Preconditions: the reconciliation must be IN_PROGRESS (409 RECONCILIATION_ALREADY_FINALIZED when FINALIZED, RECONCILIATION_NOT_EDITABLE in any other status).

        Required inputs: reconciliationId as a path parameter; the body is empty.

        Emits an ACCOUNTING_RECONCILIATION_AUTO_MATCH event and writes a RECONCILIATION_AUTO_MATCH audit row with the counts.

        Returns 404 RECONCILIATION_NOT_FOUND when the reconciliation is unknown and 409 RECONCILIATION_ALREADY_FINALIZED when it is finalized or RECONCILIATION_NOT_EDITABLE when it is not IN_PROGRESS.

        '
      operationId: autoMatchReconciliation
      parameters:
      - description: Reconciliation id
        in: path
        name: reconciliationId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoMatchResponse'
          description: Proposals made
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks accounting:reconciliation:adjust
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reconciliation not found (RECONCILIATION_NOT_FOUND)
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reconciliation already finalized (RECONCILIATION_ALREADY_FINALIZED) or not IN_PROGRESS (RECONCILIATION_NOT_EDITABLE), or a proposed line was concurrently matched (RECONCILIATION_LINE_INELIGIBLE)
      security:
      - bearerAuth:
        - accounting:reconciliation:adjust
      summary: Propose Matches Automatically
      tags:
      - Bank Reconciliation
      x-required-permissions:
      - accounting:reconciliation:adjust
  /v1/accounting/reconciliations/{reconciliationId}/cancel:
    post:
      description: 'Cancels an IN_PROGRESS or SUBMITTED reconciliation (to CANCELLED): its proposed and accepted matches become UNMATCHED with unmatchReason RECONCILIATION_CANCELLED (bank rows back to UNMATCHED), the OPEN outstanding items it registered are RELEASED, and posted adjustments stay posted — they are real journal entries, reversed explicitly if wrong.

        Use this tool to abandon a reconciliation; use returnReconciliation instead to send a submitted one back, and supersedeReconciliation to correct an approved one.

        Preconditions: the reconciliation must be IN_PROGRESS or SUBMITTED.

        Required inputs: reconciliationId (UUID) as a path parameter and justification (at least 10 characters) in the body; version is optional.

        Emits an ACCOUNTING_RECONCILIATION_CANCEL event, writes a RECONCILIATION_CANCEL audit row and queues accounting.bankreconciliation.cancelled; CANCELLED is terminal.

        Returns 200 with the header; 400 VALIDATION_ERROR or JUSTIFICATION_REQUIRED; 404 RECONCILIATION_NOT_FOUND; 409 RECONCILIATION_ALREADY_FINALIZED, RECONCILIATION_NOT_EDITABLE or OPTIMISTIC_LOCK.

        '
      operationId: cancelReconciliation
      parameters:
      - description: Reconciliation id
        in: path
        name: reconciliationId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Cancel with justification:
                description: Cancel with justification
                value:
                  justification: Started against the wrong statement
                  version: 2
            schema:
              $ref: '#/components/schemas/ReconciliationJustificationRequest'
        description: The justification (at least 10 characters) and, optionally, the version the caller read.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankReconciliationResponse'
          description: Reconciliation cancelled
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: VALIDATION_ERROR or JUSTIFICATION_REQUIRED
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:reconciliation:approve permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reconciliation not found (RECONCILIATION_NOT_FOUND)
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: RECONCILIATION_ALREADY_FINALIZED, RECONCILIATION_NOT_EDITABLE or OPTIMISTIC_LOCK
      security:
      - bearerAuth:
        - accounting:reconciliation:approve
      summary: Cancel Reconciliation
      tags:
      - Bank Reconciliation
      x-required-permissions:
      - accounting:reconciliation:approve
  /v1/accounting/reconciliations/{reconciliationId}/candidates:
    get:
      description: 'Ranks match candidates deterministically for one bank transaction (posted ledger lines on the account) or one ledger line (bank transactions), each with its score and reason codes: EXACT_AMOUNT +60, WITHIN_TOLERANCE +40, DATE_IN_WINDOW +20 × (1 − d/W), REFERENCE_MATCH +20, DESCRIPTION_SIMILAR up to +10; beyond W a widened window marks DATE_OUT_OF_WINDOW.

        Use this tool to find the ledger lines a bank row should be matched to before createReconciliationMatch; use autoMatchReconciliation instead to propose matches for every unexplained bank row at once.

        Preconditions: the reconciliation must exist; exactly one of bankTransactionId and glLineId.

        Required inputs: reconciliationId as a path parameter and bankTransactionId or glLineId as a query parameter; windowDays optionally widens the date window W (default 7).

        Emits an ACCOUNTING_RECONCILIATION_CANDIDATES event; no state changes.

        Returns 400 VALIDATION_ERROR when neither or both subjects are named, and 404 RECONCILIATION_NOT_FOUND or BANK_TRANSACTION_NOT_FOUND when the reconciliation or the subject is unknown.

        '
      operationId: listReconciliationCandidates
      parameters:
      - description: Reconciliation id
        in: path
        name: reconciliationId
        required: true
        schema:
          format: uuid
          type: string
      - description: Bank transaction to find ledger candidates for
        in: query
        name: bankTransactionId
        required: false
        schema:
          format: uuid
          type: string
      - description: Ledger line to find bank candidates for
        in: query
        name: glLineId
        required: false
        schema:
          format: uuid
          type: string
      - description: Widen the date window to this many days
        example: 30
        in: query
        name: windowDays
        required: false
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationCandidatesResponse'
          description: Candidates ranked
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Neither or both of bankTransactionId and glLineId (VALIDATION_ERROR)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks accounting:reconciliation:view
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reconciliation, bank transaction or ledger line not found (RECONCILIATION_NOT_FOUND / BANK_TRANSACTION_NOT_FOUND)
      security:
      - bearerAuth:
        - accounting:reconciliation:view
      summary: List Match Candidates
      tags:
      - Bank Reconciliation
      x-required-permissions:
      - accounting:reconciliation:view
  /v1/accounting/reconciliations/{reconciliationId}/finalize:
    post:
      description: 'Approves a SUBMITTED reconciliation (SUBMITTED to FINALIZED): the row is locked, the live ledger balance, every term of E3, the baseline and both unexplained counts are recomputed and the gate E4 is evaluated again, so nothing is approved on a stale figure. On success the approvedGlEndingBalance and baselineDate are snapshotted, the matches are sealed, and a reconciliation it corrects becomes SUPERSEDED.

        Use this tool as the approver once the preparer has submitted; use submitReconciliation for the preparer''s step and returnReconciliation to send it back instead.

        Preconditions: the reconciliation must be SUBMITTED, and the approver must not be the submitter unless the tenant''s BANK_REC_ALLOW_SELF_APPROVAL is true (every approval under that switch is audited as a self-approval).

        Required inputs: reconciliationId (UUID) as a path parameter; the body is optional and may carry the version the caller read.

        Emits an ACCOUNTING_RECONCILIATION_FINALIZE event, writes a RECONCILIATION_APPROVE audit row and queues accounting.bankreconciliation.approved (and .superseded for a corrected predecessor); FINALIZED is terminal for the reconciliation.

        Returns 200 with the header; 403 RECONCILIATION_SELF_APPROVAL (audited) when the submitter approves without the switch; 404 RECONCILIATION_NOT_FOUND; 409 RECONCILIATION_NOT_SUBMITTED, RECONCILIATION_ALREADY_FINALIZED or OPTIMISTIC_LOCK; 422 RECONCILIATION_NOT_BALANCED (fieldErrors[difference]) or RECONCILIATION_HAS_UNEXPLAINED_ITEMS.

        '
      operationId: finalizeReconciliation
      parameters:
      - description: Reconciliation id
        in: path
        name: reconciliationId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              With version:
                description: With version
                value:
                  version: 3
            schema:
              $ref: '#/components/schemas/ReconciliationTransitionRequest'
        description: Optional; the version the caller read, for optimistic locking.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankReconciliationResponse'
          description: Reconciliation approved (FINALIZED)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:reconciliation:approve permission, or submitted it (RECONCILIATION_SELF_APPROVAL)
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reconciliation not found (RECONCILIATION_NOT_FOUND)
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: RECONCILIATION_NOT_SUBMITTED, RECONCILIATION_ALREADY_FINALIZED or OPTIMISTIC_LOCK
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: RECONCILIATION_NOT_BALANCED or RECONCILIATION_HAS_UNEXPLAINED_ITEMS
      security:
      - bearerAuth:
        - accounting:reconciliation:approve
      summary: Approve Reconciliation
      tags:
      - Bank Reconciliation
      x-required-permissions:
      - accounting:reconciliation:approve
  /v1/accounting/reconciliations/{reconciliationId}/matches:
    post:
      description: 'Creates an ACCEPTED match of bank transactions to posted ledger lines on the reconciled account (1:1, 1:N or N:1), marks the bank rows MATCHED and clears any OPEN ledger-side outstanding item on the matched lines; the response serves toleranceUsed and the signed residual (bankTotal − ledgerTotal).

        Use this tool to record that bank and ledger rows describe the same cash movement; use addReconciliationAdjustment instead for a bank-only item, and registerReconciliationOutstandingItem for a timing difference.

        Preconditions: the reconciliation must be IN_PROGRESS (409 RECONCILIATION_ALREADY_FINALIZED when FINALIZED, RECONCILIATION_NOT_EDITABLE in any other status); bank rows UNMATCHED, settled, in no match or open item and dated on or before the window end; ledger lines POSTED, on the account, in no active match and dated on or before the window end; the sides must agree within 0.01. A justification of at least 10 characters is required for a non-1:1 match, any tolerance use, dates beyond the window, or a former possible duplicate.

        Required inputs: reconciliationId as a path parameter; bankTransactionIds, glLineIds and requestId in the body.

        Emits an ACCOUNTING_RECONCILIATION_MATCH event and a RECONCILIATION_MATCH audit row; no journal entry is posted.

        Returns 201 with the match (200 with replayed true for a replayed requestId); 409 RECONCILIATION_LINE_INELIGIBLE for a row not matchable (including a ledger line dated after the window end), 409 RECONCILIATION_ALREADY_FINALIZED, RECONCILIATION_NOT_EDITABLE or IDEMPOTENCY_CONFLICT; 422 MATCH_AMOUNT_MISMATCH when the sides differ by more than 0.01, 422 MATCH_CARDINALITY_NOT_ALLOWED for N:M, and 422 MATCH_REQUIRES_REVIEW listing the reasons in fieldErrors[justification] when a justification is needed.

        '
      operationId: createReconciliationMatch
      parameters:
      - description: Reconciliation id
        in: path
        name: reconciliationId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Batch deposit (1:N):
                description: Batch deposit (1:N)
                value:
                  bankTransactionIds:
                  - 019a0000-0000-7000-8000-000000000010
                  glLineIds:
                  - 019a0000-0000-7000-8000-000000000011
                  - 019a0000-0000-7000-8000-000000000012
                  justification: Batch deposit of two receipts
                  requestId: 019a0000-0000-7000-8000-000000000013
            schema:
              $ref: '#/components/schemas/ReconciliationMatchCreateRequest'
        description: The members of the match and the command's requestId.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationMatchResponse'
          description: Replay of an earlier match with the same requestId (replayed = true)
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationMatchResponse'
          description: Match created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Request body invalid (VALIDATION_ERROR) or justification shorter than 10 characters (JUSTIFICATION_REQUIRED)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks accounting:reconciliation:adjust
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reconciliation, bank transaction or ledger line not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: RECONCILIATION_LINE_INELIGIBLE, RECONCILIATION_ALREADY_FINALIZED, RECONCILIATION_NOT_EDITABLE or IDEMPOTENCY_CONFLICT
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: MATCH_AMOUNT_MISMATCH, MATCH_CARDINALITY_NOT_ALLOWED or MATCH_REQUIRES_REVIEW
      security:
      - bearerAuth:
        - accounting:reconciliation:adjust
      summary: Match Bank Transactions To Ledger Lines
      tags:
      - Bank Reconciliation
