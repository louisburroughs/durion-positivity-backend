          description: Customer number from accounting's customer replica; null when unknown
          example: CUST-00412
          type:
          - string
          - 'null'
        paymentId:
          description: Receivable payment identifier
          example: 0199a000-0000-7000-8000-000000000101
          format: uuid
          type: string
        paymentMethod:
          description: Settlement method as the payment fact sent it (CASH, CARD, ON_ACCOUNT, OTHER); null when the recording path carried none
          example: CARD
          type:
          - string
          - 'null'
        receivedAt:
          description: When the payment cleared
          example: '2026-10-04T15:12:09Z'
          format: date-time
          type: string
        sourceInvoiceId:
          description: Invoice the payment was taken against (its remittance reference); null when unknown
          example: 0199a000-0000-7000-8000-000000001702
