        schema:
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TaxLiabilitySnapshotSummary'
                type: array
