      description: 'Records an audit trail entry for an order or invoice cancellation, capturing before and after document snapshots.

        Use this tool when an order or invoice is cancelled upstream; do not use recordRefundAudit, which covers money returned on a retained document.

        Preconditions: none enforced beyond validation; either orderId or invoiceId should identify the cancelled document.

