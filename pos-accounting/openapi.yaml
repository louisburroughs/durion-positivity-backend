    BankStatementCreateRequest:
      description: 'A bank statement entered by hand: header, transactions and, when the statement does not continue the previous one, a gap acknowledgement'
      properties:
        currency:
          description: ISO 4217 code of the amounts; defaults to the account profile's currency, and must equal it
          example: USD
          type: string
        gapAcknowledgement:
          description: Justification (at least 10 characters) required when the statement does not continue the previous one — always for the account's first statement — and refused when it does
          example: Account opened at the new bank on 2026-09-01; earlier history is on the old statements
          type: string
        glAccountId:
          description: Reconcilable BANK_CASH GL account the statement belongs to
          format: uuid
          type: string
        requestId:
          description: Caller-generated UUIDv7; a replay with the same payload returns the original statement
          format: uuid
          type: string
        startReconciliation:
          description: Start an IN_PROGRESS reconciliation of the committed statement in the same transaction; it appears in reconciliations (story S4)
          example: true
          type: boolean
        statement:
          $ref: '#/components/schemas/BankStatementHeaderRequest'
        supersedesStatementId:
          description: 'A COMMITTED statement of the same account this corrected statement supersedes (§4.9 path 3): it becomes SUPERSEDED, its rows EXCLUDED (STATEMENT_SUPERSEDED), and a FINALIZED reconciliation of it INVALIDATED; refused while it has an IN_PROGRESS or SUBMITTED reconciliation'
          example: 019a0000-0000-7000-8000-000000000002
          format: uuid
          type: string
        supersessionJustification:
          description: Why the statement is superseded (at least 10 characters); required with supersedesStatementId and refused without it
          example: The bank reissued September with the missing wire of 2026-09-14
          type: string
        transactions:
          description: Transactions of the statement, in the order the bank lists them
          items:
            $ref: '#/components/schemas/BankStatementTransactionRequest'
          type: array
      required:
      - glAccountId
      - requestId
      - statement
      - transactions
      type: object
    BankStatementHeaderRequest:
      description: Statement header as printed by the bank
      properties:
        closingBalance:
          description: Closing balance as printed
          example: 12840.12
          type: number
        endDate:
          description: Last day of the statement window
