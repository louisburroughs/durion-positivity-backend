      tags:
      - Invoice Payments
      x-required-permissions:
      - accounting:ap:view
  /v1/accounting/journal-entries:
    get:
      description: 'Lists journal entries of every status as a paginated projection, optionally filtered by the exact posted-entry number.

        Use this tool when browsing or searching entries; do not use getJournalEntry, which retrieves one entry by its known id.

        Preconditions: none beyond the caller holding accounting:je:view.

        Required inputs: none; page defaults to 0, size to 20, sort to createdAt descending, and entryNumber (format JE-{YYYYMM}-{seq}, assigned only at posting) is an optional exact-match filter that never matches unposted entries.

        Emits an ACCOUNTING_JOURNAL_ENTRY_LIST audit event; no accounting state changes.

        Returns 400 when the sort property is not one of the supported fields.

        '
      operationId: listJournalEntries
      parameters:
      - description: Page index (0-based)
        in: query
        name: page
        required: false
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
      - description: Page size
        in: query
        name: size
        required: false
        schema:
          default: 20
          exclusiveMinimum: 0
          format: int32
          type: integer
      - description: 'Sort field with optional direction, e.g. ''modifiedAt,desc''. Supported fields: createdAt, modifiedAt, updatedAt, transactionDate, postedAt, status, entryType, description, createdBy, journalEntryId. Direction defaults to desc.'
        in: query
        name: sort
        required: true
        schema:
          default: createdAt
          minLength: 1
          type: string
      - description: Optional exact-match filter on the posted-entry number (format JE-{YYYYMM}-{seq}, sequential within the entry's transaction month, assigned at posting time). Entries not yet posted have no entry number and never match.
        example: JE-202607-1
        in: query
        name: entryNumber
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponseJournalEntryResponse'
          description: Journal entries listed
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unsupported sort property or direction
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden
      security:
      - bearerAuth:
        - accounting:je:view
      summary: List Journal Entries
      tags:
      - Journal Entries
      x-required-permissions:
      - accounting:je:view
    post:
      description: 'Creates a balanced journal entry in DRAFT status; nothing hits the general ledger until the entry is posted.

        Use this tool to stage a manual entry for review; do not use postJournalEntry, which finalizes an existing draft, and note that system event-driven entries are created by the posting engine, not this operation.

        Preconditions: total debits must equal total credits across the lines, and every glAccountId must reference a GL account active on the transaction date.

        Required inputs: transactionDate and at least one line with glAccountId (UUID) and a debitAmount or creditAmount; description (max 500), sourceEventId, sourceEventType and dimensions are optional. An entry created without a sourceEventType is stored with sourceEventType MANUAL, and one without a sourceEventId takes its own journalEntryId.

        Emits an ACCOUNTING_JOURNAL_ENTRY_CREATE event; GL balances are unchanged until posting.

        Returns 400 for a malformed request, 404 GL_ACCOUNT_NOT_FOUND when a line''s glAccountId does not exist, and 422 UNBALANCED_ENTRY or GL_ACCOUNT_NOT_ACTIVE when the entry is unbalanced or a GL account is not active on the transaction date.

        '
      operationId: createJournalEntry
      requestBody:
        content:
          application/json:
            examples:
              Balanced two-line entry:
                description: Balanced two-line entry
                value:
                  description: Record cash sale
                  lines:
                  - debitAmount: 125.0
                    description: Cash
                    glAccountId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  - creditAmount: 125.0
                    description: Sales revenue
                    glAccountId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
                  transactionDate: '2026-08-13T00:00:00'
            schema:
              $ref: '#/components/schemas/JournalEntryCreateRequest'
        description: Draft journal entry with balanced debit and credit lines.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryResponse'
          description: Journal entry created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: GL account not found (GL_ACCOUNT_NOT_FOUND)
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Entry is unbalanced (UNBALANCED_ENTRY), or a GL account is not active on the transaction date (GL_ACCOUNT_NOT_ACTIVE)
      security:
      - bearerAuth:
        - accounting:je:create
      summary: Create Journal Entry
      tags:
      - Journal Entries
      x-required-permissions:
      - accounting:je:create
  /v1/accounting/journal-entries/{journalEntryId}:
    get:
      description: 'Returns one journal entry with its lines, status (DRAFT, POSTED or REVERSED), entry type and posting metadata.

        Use this tool when the journal entry id is already known; use listJournalEntries instead when searching by entry number or browsing.

        Preconditions: the journal entry must exist.

        Required inputs: journalEntryId (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 404 JOURNAL_ENTRY_NOT_FOUND when no journal entry exists for the supplied id.

        '
      operationId: getJournalEntry
      parameters:
      - description: Journal entry identifier
        in: path
        name: journalEntryId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryResponse'
          description: Journal entry returned
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Journal entry not found (JOURNAL_ENTRY_NOT_FOUND)
      security:
      - bearerAuth:
        - accounting:je:view
      summary: Get Journal Entry
      tags:
      - Journal Entries
      x-required-permissions:
      - accounting:je:view
    put:
      description: 'Replaces the description and lines of a journal entry that is still in DRAFT status; posted entries are immutable.

        Use this tool to correct a draft before posting; do not use it on a POSTED entry, which only reverseJournalEntry can back out.

        Preconditions: the entry must exist in DRAFT status, and the replacement lines must remain balanced.

        Required inputs: journalEntryId (UUID) as a path parameter plus the full replacement body (same shape as createJournalEntry); supplied lines replace the existing line set wholesale.

        Emits an ACCOUNTING_JOURNAL_ENTRY_UPDATE event; GL balances are unchanged because drafts are not yet in the ledger.

        Returns 404 JOURNAL_ENTRY_NOT_FOUND when the entry id does not exist, 409 when the entry is no longer DRAFT, and 422 UNBALANCED_ENTRY when the updated entry is unbalanced.

        '
      operationId: updateJournalEntry
      parameters:
      - description: Journal entry identifier
        in: path
        name: journalEntryId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Corrected draft:
                description: Corrected draft
                value:
                  description: Corrected cash sale amount
                  lines:
                  - debitAmount: 130.0
                    glAccountId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  - creditAmount: 130.0
                    glAccountId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
                  transactionDate: '2026-08-13T00:00:00'
            schema:
              $ref: '#/components/schemas/JournalEntryCreateRequest'
        description: Replacement description and balanced line set for the draft entry.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryResponse'
          description: Journal entry updated
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Journal entry not found (JOURNAL_ENTRY_NOT_FOUND)
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Entry is no longer DRAFT
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Updated entry is unbalanced (UNBALANCED_ENTRY)
      security:
      - bearerAuth:
        - accounting:je:create
      summary: Update Journal Entry
      tags:
      - Journal Entries
      x-required-permissions:
      - accounting:je:create
  /v1/accounting/journal-entries/{journalEntryId}/post:
    post:
      description: 'Posts a DRAFT journal entry to the general ledger (DRAFT to POSTED), assigning its entryNumber (JE-{YYYYMM}-{seq}) and updating GL balances; the entry is immutable afterwards.

        Use this tool to finalize a balanced draft; do not use reverseJournalEntry, which backs out an entry that is already POSTED.

        Preconditions: the entry must exist in DRAFT status, debits must equal credits, every line''s GL account must be active on the transaction date, and the transaction date must clear the accounting-period gate.

        Required inputs: journalEntryId (UUID) as a path parameter; the body is optional and carries only overrideJustification (max 500 chars), which together with the accounting:period:override permission allows posting into a CLOSED period with the override audit-logged; a date before the org hard-lock date is never overridable.

        Emits an ACCOUNTING_JOURNAL_ENTRY_POST event and returns the posted entry.

        Returns 400 ARGUMENT_NOT_VALID when overrideJustification exceeds 500 characters, 404 JOURNAL_ENTRY_NOT_FOUND when no entry exists for the id, 409 ENTRY_ALREADY_POSTED when the entry is already POSTED or REVERSED, and 422 UNBALANCED_ENTRY, GL_ACCOUNT_NOT_ACTIVE, PERIOD_CLOSED or PERIOD_HARD_LOCKED for domain-policy or period-gate failures.

        '
      operationId: postJournalEntry
      parameters:
      - description: Journal entry identifier
        in: path
        name: journalEntryId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Closed-period override:
                description: Closed-period override
                value:
                  overrideJustification: Late vendor accrual approved by controller
            schema:
              $ref: '#/components/schemas/JournalEntryPostRequest'
        description: Optional closed-period override justification; omit the body for a normal post.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryResponse'
          description: Journal entry posted; the posted entry with its entryNumber is returned
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: overrideJustification exceeds 500 characters (ARGUMENT_NOT_VALID)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:je:post permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Journal entry not found (JOURNAL_ENTRY_NOT_FOUND)
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Entry is already posted or reversed (ENTRY_ALREADY_POSTED)
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Transaction date is in a CLOSED period without a valid override (PERIOD_CLOSED — accounting:period:override plus a non-blank overrideJustification allows posting into closed periods), is strictly before the hard-lock date (PERIOD_HARD_LOCKED — never overridable), the entry is unbalanced (UNBALANCED_ENTRY), or a line's GL account is not active on the transaction date (GL_ACCOUNT_NOT_ACTIVE)
      security:
      - bearerAuth:
        - accounting:je:post
      summary: Post Journal Entry
      tags:
      - Journal Entries
      x-required-permissions:
      - accounting:je:post
  /v1/accounting/journal-entries/{journalEntryId}/reverse:
    post:
      description: 'Reverses a POSTED journal entry by creating and immediately posting an inverse entry (debits and credits swapped) with its own entryNumber, transitioning the original POSTED to REVERSED.

        Use this tool to back out an incorrect posted entry; do not use it on DRAFT entries, which updateJournalEntry can still edit, and do not use postJournalEntry, which finalizes drafts.

        Preconditions: the entry must exist in POSTED status, and the resolved reversal date must clear the accounting-period gate.

        Required inputs: a non-blank reason (recorded on the reversal entry and audit trail); reversalDate is optional and defaults to the original transaction date when that period is OPEN, otherwise today; overrideJustification with the accounting:period:override permission allows reversing into a CLOSED period, but never before the hard-lock date.

        Emits an ACCOUNTING_JOURNAL_ENTRY_REVERSE event and returns the posted reversal entry.

        Returns 400 when the reason is blank, 404 JOURNAL_ENTRY_NOT_FOUND when the entry does not exist, 409 JE_ALREADY_REVERSED when the entry was already reversed (including a lost concurrent-reversal race), 409 JE_NOT_POSTED when it is DRAFT or PENDING, and 422 PERIOD_CLOSED or PERIOD_HARD_LOCKED for period-gate failures.

        '
      operationId: reverseJournalEntry
      parameters:
      - description: Journal entry identifier
        in: path
        name: journalEntryId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Reverse with explicit date:
                description: Reverse with explicit date
                value:
                  reason: Duplicate posting of invoice INV-1042
                  reversalDate: '2026-08-13'
            schema:
              $ref: '#/components/schemas/JournalEntryReversalRequest'
        description: Reversal reason with optional reversal date and closed-period override justification.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryResponse'
          description: Journal entry reversed; the posted reversal entry is returned
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reason is missing or blank (ARGUMENT_NOT_VALID)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks the accounting:je:reverse permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Journal entry not found (JOURNAL_ENTRY_NOT_FOUND)
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Entry is already reversed (JE_ALREADY_REVERSED) or not yet posted (JE_NOT_POSTED)
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Resolved reversal date falls in a CLOSED accounting period without a valid override (PERIOD_CLOSED — accounting:period:override plus a non-blank overrideJustification allows reversing into closed periods), or is strictly before the hard-lock date (PERIOD_HARD_LOCKED — never overridable)
      security:
      - bearerAuth:
        - accounting:je:reverse
      summary: Reverse Journal Entry
      tags:
      - Journal Entries
      x-required-permissions:
      - accounting:je:reverse
  /v1/accounting/journal-entries/{journalEntryId}/traceability:
    get:
      description: 'Returns the traceability chain for a journal entry: its source event, posting rule set and version, and any reversal relationships.

        Use this tool when auditing where an entry came from; use getJournalEntry instead for the entry''s lines and amounts.

        Preconditions: the journal entry must exist; system-generated entries carry source-event links while manual entries may not.

        Required inputs: journalEntryId (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 404 JOURNAL_ENTRY_NOT_FOUND when no journal entry exists for the supplied id.

        '
      operationId: getJournalEntryTraceability
      parameters:
      - description: Journal entry identifier
        in: path
        name: journalEntryId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryTraceabilityResponse'
          description: Journal traceability returned
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Journal entry not found (JOURNAL_ENTRY_NOT_FOUND)
      security:
      - bearerAuth:
        - accounting:je:view
      summary: Get Journal Entry Traceability
      tags:
      - Journal Entries
      x-required-permissions:
      - accounting:je:view
  /v1/accounting/mapping-keys:
    post:
      description: 'Creates a mapping key inside a posting category, extending the taxonomy that GL mappings attach to.

        Use this tool when adding a new key under an existing category; do not use createPostingCategory, which creates the parent category itself.

        Preconditions: the posting category must exist, and no key with the same trimmed name may already exist inside it.

