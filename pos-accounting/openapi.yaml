    post:
      tags:
      - Audit Trail
      summary: Record Price Override Audit Entry
      description: 'Records an audit trail entry for a price override exception, validating the acting role''s authorization level against the override amount before persisting.

        Use this tool when an order line price is overridden at the point of sale; do not use recordRefundAudit or recordCancellationAudit, which cover those other exception types.

        Preconditions: the actor''s role must be authorized for the override delta; a denied authorization publishes an AuthorizationDenied event and records nothing.

        Required inputs: orderId (UUID), lineItemId (UUID), originalPrice, adjustedPrice, actorRole and reason; categoryCode is optional.

        Emits an ACCOUNTING_AUDIT_PRICE_OVERRIDE event.

