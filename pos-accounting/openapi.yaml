  /v1/accounting/ap/payments:
    post:
      tags:
      - AP Payments
      summary: Execute Vendor Payment
      description: 'Executes an AP vendor payment through the payment gateway, optionally allocating it across approved vendor bills, and posts the corresponding GL entries.

        Use this tool to pay a vendor; do not use applyPayment, which is the AR-side application of customer payments to invoices, and use listApBills first to find APPROVED bills to allocate against.

        Preconditions: every allocated bill must exist, be APPROVED and belong to the vendor, and the allocation total must not exceed the gross amount.

        Required inputs: vendorId (UUID), grossAmount (min 0.01), currency (3-char ISO code), paymentRef (max 100 chars, the idempotency key) and paymentMethod (e.g. ACH, CHECK); feeAmount, netAmount, paymentSource, memo and explicit allocations are optional.

        Emits an AP_PAYMENT_EXECUTE event; the call is idempotent on paymentRef, replaying the same ref with the same payload as a 200 instead of paying twice.

        Returns 200 on an idempotent replay, 409 IDEMPOTENCY_CONFLICT when the paymentRef exists with a different payload, 400 when a bill is missing, unapproved or over-allocated, and 500 PAYMENT_GATEWAY_FAILURE when the gateway cannot be reached.

        '
      operationId: executeApPayment
      requestBody:
        description: Vendor payment instruction with idempotency key and optional bill allocations.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteAPPaymentRequest'
            examples:
              ACH payment allocated to one bill:
                description: ACH payment allocated to one bill
                value:
                  vendorId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  grossAmount: 250.0
                  currency: USD
                  paymentRef: ap-pay-2026-08-13-007
                  paymentMethod: ACH
                  allocations:
                  - vendorBillId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
                    appliedAmount: 250.0
        required: true
      responses:
        '200':
          description: 'Idempotent replay: existing payment returned'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APPaymentResponse'
        '201':
          description: Payment executed successfully (new payment created)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APPaymentResponse'
        '400':
          description: 'Validation error: negative amounts, invalid bills, etc.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APPaymentResponse'
        '409':
          description: 'Conflict: paymentRef exists with different payload'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APPaymentResponse'
        '500':
          description: Payment gateway failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APPaymentResponse'
      security:
      - bearerAuth:
        - accounting:ap:pay
      x-required-permissions:
      - accounting:ap:pay
