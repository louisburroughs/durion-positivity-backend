        beforeSnapshot:
          type: string
          description: Snapshot of state before the cancellation (JSON)
        afterSnapshot:
          type: string
          description: Snapshot of state after the cancellation (JSON)
        partialPaymentInfo:
          type: string
          description: Partial payment details captured at cancellation (JSON)
        actorId:
          type: string
          description: Legacy client-provided actor identifier; service resolves authoritative actor from security context
          example: 01960003-0000-7000-8000-000000000003
        actorRole:
          type: string
          description: Role of the actor performing the cancellation
          example: STORE_MANAGER
        reason:
          type: string
          description: Reason for the cancellation
          example: Customer requested cancellation
      required:
      - actorRole
      - afterSnapshot
      - beforeSnapshot
      - cancellationType
      - reason
    AllocationLineRequest:
      type: object
      description: Allocation line for a specific vendor bill
      properties:
        vendorBillId:
          type: string
          format: uuid
          description: Vendor bill UUID
          example: 01936e5d-1234-7a3d-8b6e-3c4567890123
        appliedAmount:
          type: number
          description: Amount to apply to this bill
          example: 750.0
          minimum: 0.0
      required:
      - appliedAmount
      - vendorBillId
    ExecuteAPPaymentRequest:
      type: object
      description: Request to execute an AP vendor payment
      properties:
        vendorId:
          type: string
          format: uuid
          description: Vendor UUID
          example: 01936e5c-7890-7a3d-8b6e-2b3456789012
        grossAmount:
          type: number
          description: Gross payment amount
          example: 1500.0
          minimum: 0.01
        feeAmount:
          type: number
          description: Fee amount (if known at capture time)
          example: 15.0
        netAmount:
          type: number
          description: Net amount deposited (if applicable)
          example: 1485.0
        currency:
          type: string
          description: ISO 4217 currency code
          example: USD
          maxLength: 3
          minLength: 3
        paymentRef:
          type: string
          description: Unique payment reference (idempotency key)
          example: 01936e5c-7890-7a3d-8b6e-2b3456789012
          maxLength: 100
          minLength: 1
        paymentMethod:
          type: string
          description: Payment method (ACH, CHECK, WIRE, CREDIT_CARD, OTHER)
          enum:
          - ACH
          - CHECK
          - WIRE
          - CREDIT_CARD
          - OTHER
          example: ACH
        paymentSource:
          type: string
          description: Payment source token or identifier from the payment provider (e.g., Stripe token, bank account ID)
          example: tok_visa
          maxLength: 255
          minLength: 0
        memo:
          type: string
          description: Optional payment memo/notes
          example: Monthly supplier payment
          maxLength: 1000
          minLength: 0
        allocations:
          type: array
          description: Optional explicit allocations to vendor bills. If omitted, automatic allocation applied.
          items:
            $ref: '#/components/schemas/AllocationLineRequest'
