                $ref: '#/components/schemas/ExportJobResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobResponse'
      security:
      - bearerAuth:
        - accounting:export:request
      x-required-permissions:
      - accounting:export:request
  /v1/accounting/events:
    get:
      tags:
