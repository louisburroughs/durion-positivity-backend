        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: BANK_TRANSACTION_NOT_FOUND
      security:
      - bearerAuth:
        - accounting:reconciliation:view
      summary: Get Bank Transaction
      tags:
      - Bank Transactions
      x-required-permissions:
      - accounting:reconciliation:view
  /v1/accounting/bank-transactions/{bankTransactionId}/duplicate-review:
    post:
      description: 'Decides whether a POSSIBLE_DUPLICATE bank transaction is a real duplicate: DISTINCT returns it to UNMATCHED, DUPLICATE excludes it and records its original.

        Use this tool for a row the intake flagged because its fingerprint matched another row; do not use it to exclude an ordinary row, use excludeBankTransaction instead.

        Preconditions: the row must be POSSIBLE_DUPLICATE and, for DUPLICATE, name or have been flagged against another row on the same account.

        Required inputs: decision (DISTINCT or DUPLICATE) and a justification of at least 10 characters; optional duplicateOfBankTransactionId and the version read.

        Emits an ACCOUNTING_BANK_TRANSACTION_DUPLICATE_REVIEW event and writes an audit row.

        Returns 409 when the row is not POSSIBLE_DUPLICATE or the version is stale, 404 when it does not exist, and 400 when the decision or justification is missing or too short.

        '
      operationId: reviewBankTransactionDuplicate
      parameters:
      - description: Bank transaction id
        in: path
        name: bankTransactionId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Distinct fees:
                description: Distinct fees
                value:
                  decision: DISTINCT
                  justification: Two separate monthly fees charged on the same day
                  version: 0
            schema:
              $ref: '#/components/schemas/DuplicateReviewRequest'
        description: The decision and its justification.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankTransactionResponse'
          description: Reviewed row
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: VALIDATION_ERROR or JUSTIFICATION_REQUIRED
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks accounting:reconciliation:adjust
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: BANK_TRANSACTION_NOT_FOUND
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: RECONCILIATION_LINE_INELIGIBLE or OPTIMISTIC_LOCK
      security:
      - bearerAuth:
        - accounting:reconciliation:adjust
      summary: Review Possible Duplicate
      tags:
      - Bank Transactions
      x-required-permissions:
      - accounting:reconciliation:adjust
  /v1/accounting/bank-transactions/{bankTransactionId}/exclude:
    post:
      description: 'Excludes an UNMATCHED bank transaction from reconciliation with a justification, so it leaves every sum and count; the row itself is kept as evidence.

        Use this tool for a row the bank reported that should never be explained, such as a line the bank later reversed on the same statement; do not use it for a flagged possible duplicate, use reviewBankTransactionDuplicate instead.

        Preconditions: the row must be UNMATCHED.

        Required inputs: bankTransactionId in the path and a justification of at least 10 characters; optional version.

        Emits an ACCOUNTING_BANK_TRANSACTION_EXCLUDE event and writes an audit row.

        Returns 409 when the row is not UNMATCHED or the version is stale, 404 when it does not exist, 403 without accounting:reconciliation:approve, and 400 when the justification is missing or too short.

        '
      operationId: excludeBankTransaction
      parameters:
      - description: Bank transaction id
        in: path
        name: bankTransactionId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Exclude:
                description: Exclude
                value:
                  justification: Internal transfer recorded twice by the bank
                  version: 0
            schema:
              $ref: '#/components/schemas/BankTransactionJustificationRequest'
        description: The justification and, optionally, the version read.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankTransactionResponse'
          description: Excluded row
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: VALIDATION_ERROR or JUSTIFICATION_REQUIRED
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks accounting:reconciliation:approve
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: BANK_TRANSACTION_NOT_FOUND
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: RECONCILIATION_LINE_INELIGIBLE or OPTIMISTIC_LOCK
      security:
      - bearerAuth:
        - accounting:reconciliation:approve
      summary: Exclude Bank Transaction
      tags:
      - Bank Transactions
      x-required-permissions:
      - accounting:reconciliation:approve
  /v1/accounting/bank-transactions/{bankTransactionId}/restore:
    post:
      description: 'Returns an EXCLUDED bank transaction to UNMATCHED with a justification, so it counts as unexplained again.

        Use this tool to undo an exclusion or a duplicate decision made in error; do not use it on a row a FINALIZED reconciliation covered, which is corrected by superseding that reconciliation instead.

        Preconditions: the row must be EXCLUDED and no FINALIZED reconciliation on the account may cover its transaction date.

        Required inputs: bankTransactionId in the path and a justification of at least 10 characters; optional version.

        Emits an ACCOUNTING_BANK_TRANSACTION_RESTORE event and writes an audit row.

        Returns 409 when the row is not EXCLUDED, a FINALIZED reconciliation covers it or the version is stale, 404 when it does not exist, 403 without accounting:reconciliation:approve, and 400 when the justification is missing or too short.

        '
      operationId: restoreBankTransaction
      parameters:
      - description: Bank transaction id
