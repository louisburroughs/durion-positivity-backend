openapi: 3.1.0
info:
  title: POS Accounting Service API
  description: Accounting service for invoice, journal entry, and GL account management
  contact:
    name: Durion Support Services
    email: louis.burroughs@gmail.com
  version: v1
servers:
- url: http://localhost:8086
  description: Generated server url
tags:
- name: Audit Trail
  description: Audit trail operations for tracking accounting exceptions and overrides
- name: Accounting Exports
  description: Manage timekeeping and generic data export jobs.
- name: Payment Applications
  description: Manage payment applications to invoices (AR)
- name: Posting Rules
  description: Manage posting rule sets and their lifecycle.
- name: Invoice Payments
  description: Apply payments and query invoice status.
- name: Mapping Keys
  description: Manage mapping keys for GL mapping taxonomy
- name: Posting Categories
  description: Manage posting categories for GL mapping taxonomy
- name: Credit Memos
  description: Manage credit memos for AR corrections
- name: GL Mapping API
  description: Endpoints for creating and resolving GL mappings
- name: Journal Entries
  description: Manage journal entries including posting and reversal.
- name: GL Accounts
  description: Manage chart of accounts including lifecycle actions.
- name: Accounting Periods
  description: 'Accounting period lifecycle: list periods, close a period, reopen a closed period, and manage the org-level hard-lock date.'
- name: Settlement Reconciliation
  description: 'Processor settlement reconciliation review: list settlement lines, manually match an unmatched line to a receivable payment, and write off small unmatched lines.'
- name: Vendor Directory API
  description: Vendor search and lookup endpoints for name-to-vendorId resolution (typeahead support)
- name: Location Cost Reporting
  description: Read-only location Labor & Overhead Cost Report (CAP-316)
- name: AP Payments
  description: Accounts Payable vendor payment operations
- name: Financial Reporting
  description: Income Statement and Balance Sheet generation with drilldown
- name: Vendor Bill API
  description: Endpoints for vendor bill creation, matching, retrieval, and exception resolution
- name: Default GL Mappings
  description: Manage default GL account mappings for event types without explicit posting rules
- name: Accounting Events
  description: Ingest and manage accounting events for journal processing.
