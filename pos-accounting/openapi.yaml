      - name: postingRuleSetId
        in: path
        description: Posting rule set identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        description: Page index (0-based)
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        description: Page size
        required: false
        schema:
          type: integer
          format: int32
          default: 10
          exclusiveMinimum: 0
      responses:
        '200':
          description: Posting rule versions listed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostingRuleVersionResponse'
        '404':
          description: Posting rule set not found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostingRuleVersionResponse'
      security:
      - bearerAuth:
        - accounting:posting_rules:view
      x-required-permissions:
      - accounting:posting_rules:view
  /v1/accounting/posting-categories/{postingCategoryId}/mapping-keys:
    get:
      tags:
      - Mapping Keys
      summary: List Mapping Keys By Category
      description: 'Lists the mapping keys of one posting category as a paginated projection, optionally filtered by active flag.

        Use this tool when browsing a category''s keys; do not use getMappingKey, which fetches a single key by id.

        Preconditions: the posting category must exist.

        Required inputs: postingCategoryId (UUID) as a path parameter; page defaults to 0, size to 20, sort to keyName (an unsupported sort field silently falls back to keyName), and isActive is an optional filter.

        Emits an ACCOUNTING_MAPPING_KEY_LIST audit event; no state changes.

        Returns 404 when the posting category does not exist.

        '
      operationId: listMappingKeysByCategory
      parameters:
      - name: postingCategoryId
        in: path
        description: Posting category identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        description: Page index (0-based)
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        description: Page size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          exclusiveMinimum: 0
      - name: sort
        in: query
        description: Sort field
        required: true
        schema:
          type: string
          default: keyName
          minLength: 1
      - name: isActive
        in: query
        description: Filter by active status
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Mapping keys listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingKeyListResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingKeyListResponse'
        '404':
          description: Posting category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingKeyListResponse'
      security:
      - bearerAuth:
        - accounting:mapping-key:view
      x-required-permissions:
      - accounting:mapping-key:view
  /v1/accounting/periods:
    get:
      tags:
      - Accounting Periods
      summary: List Accounting Periods
      description: 'Lists all known accounting periods with their OPEN or CLOSED status, most recent first (descending period code).

        Use this tool to review period statuses before closing or reopening a period; do not use closeAccountingPeriod or reopenAccountingPeriod, which perform the state transitions.

        Preconditions: none; periods are auto-provisioned on first posting, so months never posted into may be absent, and an absent month counts as OPEN for posting purposes.

        Required inputs: none; there are no parameters and no request body.

        Emits an ACCOUNTING_PERIOD_LIST audit event; nothing is created or changed by this call.

        Returns 200 with an empty list when no period has ever been provisioned.

        '
      operationId: listAccountingPeriods
      responses:
        '200':
          description: Accounting periods listed, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountingPeriodResponse'
        '403':
          description: Caller lacks the accounting:period:view permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - accounting:period:view
      x-required-permissions:
      - accounting:period:view
  /v1/accounting/journal-entries/{journalEntryId}/traceability:
    get:
      tags:
