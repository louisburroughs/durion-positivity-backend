  /v1/accounting/reconciliations/{reconciliationId}/matches/{matchId}/unmatch:
    post:
      description: 'Undoes an ACCEPTED match: it becomes UNMATCHED with the reason (never deleted), its bank rows return to UNMATCHED, its lines are released for re-matching, and the outstanding items it had cleared re-open.

        Use this tool to correct a wrong pairing; do not use rejectReconciliationMatch, which declines a proposal that was never accepted.

        Preconditions: the reconciliation must be IN_PROGRESS (409 RECONCILIATION_ALREADY_FINALIZED when FINALIZED, RECONCILIATION_NOT_EDITABLE in any other status) and the match must be ACCEPTED.

        Required inputs: reconciliationId and matchId as path parameters; reason (at least 10 characters) in the body.

        Emits an ACCOUNTING_RECONCILIATION_UNMATCH event and a RECONCILIATION_UNMATCH audit row with the actor and reason.

        Returns 400 VALIDATION_ERROR without a reason or JUSTIFICATION_REQUIRED for a short one, 404 RECONCILIATION_NOT_FOUND for an unknown match, and 409 MATCH_STATE_INVALID when the match is not ACCEPTED.

        '
      operationId: unmatchReconciliationMatch
      parameters:
      - description: Reconciliation id
        in: path
