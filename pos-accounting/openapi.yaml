      - frozenBy
      - periodClosedAt
      - periodCode
      - periodId
      - reconciliation
      - rows
      - snapshotId
      - startDate
      - status
      - totalCreditsNetted
      - totalExemptBase
      - totalNetTax
      - totalTaxCollectedGross
      - totalTaxableBase
