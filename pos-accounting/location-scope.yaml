# Location-scope decisions for pos-accounting (ADR-0061, #1872 and #1885).
# Every operation that takes a caller-supplied locationId must appear here;
# scripts/audit-rbac.py --check fails on a missing or stale entry.
#
# gate = require(permission, locationId): outside the caller's reach is 403 LOCATION_SCOPE_DENIED.
# Accounting names a location by its GL dimension code (e.g. LOC-107), so the gate resolves the
# code through this module's own ext_location replica before the check; a code the replica cannot
# place is denied for a location-scoped caller and ignored for a global one.
decisions:
  - operation: LaborOverheadReportController.generateLaborOverheadReport
    shape: gate
    permission: reporting:view:financial-statements
    reason: The required locationId names the single location the cost matrix is derived for; the clearest FINANCIAL case in the platform, so an ACCOUNTANT assigned to a region sees that region's shops and no others. Gated in the controller after fiscalYear/asOfMonth validation, on the location the GL dimension code resolves to (#1885)
  - operation: RegisterFloatController.establishGoLive
    shape: gate
    permission: accounting:float:manage
    reason: The required locationId names the location whose register drawer the go-live float is put in, and the 1080 line carries it as a dimension; a CONTROLLER scoped to a region may set floats only for that region's registers. Gated in the controller after body validation (#2511)
  - operation: RegisterFloatController.changeFloat
    shape: gate
    permission: accounting:float:manage
    reason: The required locationId names the location whose register drawer float changes, and the 1080 line carries it as a dimension; a CONTROLLER scoped to a region may change floats only for that region's registers. Gated in the controller after body validation (#2511)
  - operation: RegisterFloatController.relocate
    shape: gate
    permission: accounting:float:manage
    fields: fromLocationId, toLocationId
    reason: A relocation names two locations, the one the register leaves and the one it moves to, and posts a 1080 line at each; a CONTROLLER scoped to a region may move a register only between locations it reaches, so BOTH fields are gated in the controller after body validation. The register's stored location is then required to equal fromLocationId under the row lock (422 FLOAT_REGISTER_LOCATION_MISMATCH, logged, never returned), so naming an in-scope origin cannot move another location's register (#2571, AW32)
  - operation: BankDepositController.listUndepositedSessions
    shape: narrow
    permission: accounting:deposit:create
    reason: CAP:550 S18 (#2514); the read takes no locationId but reaches every undeposited session, each stored with its register session's location; DepositServiceImpl.undeposited lists only the sessions whose location the caller's accounting:deposit:create covers (a session with no location only for an unscoped caller), and a sessionId outside that list is 400 like an unknown one, so another location's session is neither listed nor told apart.
  - operation: BankDepositController.recordBankDeposit
    shape: gate
    permission: accounting:deposit:create
    reason: CAP:550 S18 (#2514); the deposit takes the named sessions' drawer cash, so DepositServiceImpl.record gates on each session's stored location after locking the rows and before their status is read (403 LOCATION_SCOPE_DENIED, which never names the location); a requestId replay is gated the same way on the stored deposit's sessions.
  - operation: BankDepositController.getBankDeposit
    shape: gate
    permission: accounting:deposit:create
    reason: CAP:550 S18 (#2514); resource-addressed sibling of recordBankDeposit; DepositServiceImpl.get gates on every location the stored deposit took cash from after the 404, so a deposit of another location's drawers cannot be read by id.
  - operation: BankDepositController.reverseBankDeposit
    shape: gate
    permission: accounting:deposit:reverse
    reason: CAP:550 S18 (#2514); DepositServiceImpl.reverse gates on every location the stored deposit took cash from before its status is read, without a lock (deposit_session locations are immutable; the reversal itself locks in the generic sequence → entry → deposit order), and a requestId replay the same way; the generic journal-entry reversal of the same entry is gated by accounting:je:reverse alone, as for every entry, and DepositReversalReaction takes no scope decision.
