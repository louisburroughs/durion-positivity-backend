# Location-scope decisions for pos-invoice (ADR-0061, #1872).
# Every operation that takes a caller-supplied locationId must appear here;
# scripts/audit-rbac.py --check fails on a missing or stale entry.
decisions:
  - operation: InvoiceController.createInvoice
    shape: gate
    permission: invoice:manage
    reason: the request's locationId names the shop the workorder invoice is raised at; gated in the controller before the service runs, and an omitted locationId is denied for a scoped caller (fail closed).
  - operation: InvoiceController.createInvoiceFromOrder
    shape: gate
    permission: invoice:manage
    reason: the request's locationId names the shop the order invoice is raised at (OrderInvoiceServiceImpl stores it verbatim, nothing is read from a replicated order), so it is gated in the controller before the service runs; an omitted locationId is denied for a scoped caller (fail closed).
  - operation: InvoiceController.getInvoice
    shape: gate
    permission: invoice:invoice:view
    reason: resource-addressed sibling of the create gates; InvoiceServiceImpl.loadInvoiceDetail gates on the stored invoice's locationId after the 404 so ids cannot be probed and the create gate cannot be bypassed by reading the invoice back.
  - operation: PaymentReversalController.voidPayment
    shape: gate
    permission: invoice:payment:void
    reason: no caller-supplied locationId; PaymentReversalServiceImpl.voidPayment gates on the payment intent's invoice location after the existence check (#2226, BILL-DEC-008).
  - operation: PaymentReversalController.refundPayment
    shape: gate
    permission: invoice:payment:refund
    reason: no caller-supplied locationId; PaymentReversalServiceImpl.refundPayment gates on the payment intent's invoice location after the existence/status check (#2226, BILL-DEC-008).
  - operation: ReceiptController.generateReceipt
    shape: gate
    permission: invoice:receipt:generate
    reason: no caller-supplied locationId; ReceiptServiceImpl.generateReceipt gates on the invoice's location after the existence check, mirroring ReceiptServiceImpl.getReceipt (#2226, BILL-DEC-008).
  - operation: ReceiptController.reprintReceipt
    shape: gate
    permission: invoice:receipt:reprint_override
    reason: no caller-supplied locationId and no base @PreAuthorize authority (isAuthenticated only); ReceiptServiceImpl.reprintReceipt scopes only the over-5-reprint override to the receipt's invoice location, so a caller who does not hold invoice:receipt:reprint_override at all is unaffected (#2226, BILL-DEC-010).
  - operation: StandaloneRefundController.refundInvoiceStandalone
    shape: gate
    permission: invoice:refund:issue_manual
    reason: no caller-supplied locationId; PaymentReversalServiceImpl.refundInvoiceStandalone gates on the invoice's location after the existence check (#2226, BILL-DEC-008).
  - operation: StandaloneRefundController.refundPartyStandalone
    shape: unscoped
    reason: the refund is anchored directly to a customer party, not an invoice, so there is no location to scope on; the finance-only invoice:refund:issue_manual authority is the entire access control (#2226).
  - operation: PaymentController.listInvoicePayments
    shape: gate
    permission: invoice:invoice:view
    reason: no caller-supplied locationId; PaymentServiceImpl.listInvoicePayments gates on the invoice's location after the existence check, mirroring InvoiceServiceImpl.loadInvoiceDetail (#2226, #2215).
  - operation: PaymentController.getInvoicePayment
    shape: gate
    permission: invoice:invoice:view
    reason: no caller-supplied locationId; PaymentServiceImpl.getInvoicePayment gates on the payment intent's invoice location after the existence check (#2226, #2215).
