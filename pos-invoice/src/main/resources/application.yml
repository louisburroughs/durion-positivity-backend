spring:
  application:
    name: invoice
  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

server:
  port: 0
  tomcat:
    max-http-header-size: 65536
  servlet:
    context-path: /

invoice:
  documents:
    base-url: ${INVOICE_DOCUMENTS_BASE_URL:http://pos-documents:8092/v1/documents}
  artifacts:
    # Set a stable secret in production for multi-instance/restart-safe download tokens.
    # When blank, a per-instance random key is generated at startup.
    signing-secret: ${INVOICE_ARTIFACTS_SIGNING_SECRET:}
    token-ttl-seconds: ${INVOICE_ARTIFACTS_TOKEN_TTL_SECONDS:300}

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    org:
      springframework:
        web: INFO
      hibernate: INFO
    com:
      positivity:
        invoice: INFO

      netflix:
        discovery:
          shared:
            resolver:
              aws:
                ConfigClusterResolver: WARN
# Billing defaults (CAP:092)
billing:
  defaults:
    purchase-order-required: false
    payment-terms-code: NET_30
    invoice-delivery-method: EMAIL
    invoice-grouping-strategy: PER_WORKORDER

# Event service configuration
pos:
  invoice:
    kafka:
      # Domain-event publishing (ADR-0044, #842). Off until the broker is provisioned;
      # flip POS_INVOICE_KAFKA_ENABLED per environment.
      enabled: ${POS_INVOICE_KAFKA_ENABLED:false}
      # Employment replica feed (ADR-0044 §6, #877)
      people-events-topic: ${POS_INVOICE_PEOPLE_EVENTS_TOPIC:people.events.v1}
      people-events-consumer-group: ${POS_INVOICE_PEOPLE_EVENTS_CONSUMER_GROUP:pos-invoice-people-events}
      # Customer-party replica feed + reconciliation (ADR-0044 §6, #891)
      customer-events-topic: ${POS_INVOICE_CUSTOMER_EVENTS_TOPIC:customer.events.v1}
      customer-events-consumer-group: ${POS_INVOICE_CUSTOMER_EVENTS_CONSUMER_GROUP:pos-invoice-customer-events}
      customer-manifest-topic: ${POS_INVOICE_CUSTOMER_MANIFEST_TOPIC:customer.manifest.v1}
      customer-manifest-consumer-group: ${POS_INVOICE_CUSTOMER_MANIFEST_CONSUMER_GROUP:pos-invoice-customer-manifests}
      customer-commands-topic: ${POS_INVOICE_CUSTOMER_COMMANDS_TOPIC:customer.commands.v1}
      # Location replica feed + reconciliation (ADR-0044 §6, #892)
      location-events-topic: ${POS_INVOICE_LOCATION_EVENTS_TOPIC:location.events.v1}
      location-events-consumer-group: ${POS_INVOICE_LOCATION_EVENTS_CONSUMER_GROUP:pos-invoice-location-events}
      location-manifest-topic: ${POS_INVOICE_LOCATION_MANIFEST_TOPIC:location.manifest.v1}
      location-manifest-consumer-group: ${POS_INVOICE_LOCATION_MANIFEST_CONSUMER_GROUP:pos-invoice-location-manifests}
      location-commands-topic: ${POS_INVOICE_LOCATION_COMMANDS_TOPIC:location.commands.v1}
      # Workorder replica feed + reconciliation (ADR-0044 §6, #897)
      workorder-events-topic: ${POS_INVOICE_WORKORDER_EVENTS_TOPIC:workorder.events.v1}
      workorder-events-consumer-group: ${POS_INVOICE_WORKORDER_EVENTS_CONSUMER_GROUP:pos-invoice-workorder-events}
      workorder-manifest-topic: ${POS_INVOICE_WORKORDER_MANIFEST_TOPIC:workorder.manifest.v1}
      workorder-manifest-consumer-group: ${POS_INVOICE_WORKORDER_MANIFEST_CONSUMER_GROUP:pos-invoice-workorder-manifests}
      workorder-commands-topic: ${POS_INVOICE_WORKORDER_COMMANDS_TOPIC:workorder.commands.v1}
      # Own command intake + reconciliation manifests (ADR-0044 §4, #900)
      commands-topic: ${POS_INVOICE_COMMANDS_TOPIC:invoice.commands.v1}
      commands-consumer-group: ${POS_INVOICE_COMMANDS_CONSUMER_GROUP:pos-invoice-commands}
    manifest:
      topic: ${POS_INVOICE_MANIFEST_TOPIC:invoice.manifest.v1}
      window: ${POS_INVOICE_MANIFEST_WINDOW:PT1H}
      grace: ${POS_INVOICE_MANIFEST_GRACE:PT5M}
      poll-interval-ms: ${POS_INVOICE_MANIFEST_POLL_INTERVAL_MS:300000}
  events:
    api-secret: ${POS_EVENTS_API_SECRET:}

# OpenAPI/Swagger configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json
