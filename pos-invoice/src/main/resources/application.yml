spring:
  application:
    name: invoice
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://localhost:5432/pos_invoice_db
    username: ${SPRING_DATASOURCE_USERNAME:pos_user}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

server:
  port: 0
  servlet:
    context-path: /

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    org:
      springframework:
        web: INFO
      hibernate: INFO
    com:
      positivity:
        invoice: INFO

# Billing defaults (CAP:092)
billing:
  defaults:
    purchase-order-required: false
    payment-terms-code: NET_30
    invoice-delivery-method: EMAIL
    invoice-grouping-strategy: PER_WORKORDER

# Event service configuration
pos:
  events:
    base-url: http://localhost:8085
    api-secret: ${POS_EVENTS_API_SECRET:}

# OpenAPI/Swagger configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
