spring:
  application:
    name: invoice
  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

server:
  port: 0
  tomcat:
    max-http-header-size: 65536
  servlet:
    context-path: /

invoice:
  documents:
    base-url: ${INVOICE_DOCUMENTS_BASE_URL:http://pos-documents:8092/v1/documents}
  artifacts:
    # Set a stable secret in production for multi-instance/restart-safe download tokens.
    # When blank, a per-instance random key is generated at startup.
    signing-secret: ${INVOICE_ARTIFACTS_SIGNING_SECRET:}
    token-ttl-seconds: ${INVOICE_ARTIFACTS_TOKEN_TTL_SECONDS:300}

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    org:
      springframework:
        web: INFO
      hibernate: INFO
    com:
      positivity:
        invoice: INFO

      netflix:
        discovery:
          shared:
            resolver:
              aws:
                ConfigClusterResolver: WARN
# Billing defaults (CAP:092)
billing:
  defaults:
    purchase-order-required: false
    payment-terms-code: NET_30
    invoice-delivery-method: EMAIL
    invoice-grouping-strategy: PER_WORKORDER

# Event service configuration
pos:
  invoice:
    kafka:
      # Domain-event publishing (ADR-0044, #842). Off until the broker is provisioned;
      # flip POS_INVOICE_KAFKA_ENABLED per environment.
      enabled: ${POS_INVOICE_KAFKA_ENABLED:false}
  events:
    api-secret: ${POS_EVENTS_API_SECRET:}

# OpenAPI/Swagger configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json
