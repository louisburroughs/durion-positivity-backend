security:
  jwt:
    secret: ${SECURITY_JWT_SECRET}

eureka:
  instance:
    appname: api-gateway
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL}

# ADR-0046: deployed environments run INFO baseline; framework noise capped at WARN
logging:
  level:
    root: INFO
    com:
      netflix:
        discovery:
          shared:
            resolver:
              aws:
                ConfigClusterResolver: WARN
