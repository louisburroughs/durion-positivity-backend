security:
  jwt:
    # Local/test fallback; override with SECURITY_JWT_SECRET in real environments.
    # Must be >= 32 bytes for HS256 key material.
    secret: ${SECURITY_JWT_SECRET:local-dev-jwt-secret-change-me-32-bytes-minimum}

pos:
  gateway:
    security:
      revocation-check:
        # Local dev usually runs without Redis. Off explicitly so the degraded-path WARN means
        # something when it does appear, rather than being the normal state of every dev run.
        enabled: false

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

# ADR-0046: developer-only DEBUG loggers moved out of application.yml
logging:
  level:
    org:
      springframework:
        cloud:
          gateway: DEBUG
    com:
      positivity:
        gateway: DEBUG
