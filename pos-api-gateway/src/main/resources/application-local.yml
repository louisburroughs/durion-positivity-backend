# Local development profile — dynamic ports

server:
  port: 8080  # Fixed gateway entry point

# NOTE: spring.cloud.gateway routes are defined in application.yml
# Do NOT override spring.cloud.gateway here or it will erase the routes

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: unrestricted
    health:
      show-details: always
      access: unrestricted

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}

logging:
  level:
    root: INFO
    org:
      springframework:
        cloud:
          gateway: DEBUG
        boot:
          web:
            embedded:
              tomcat:
                TomcatWebServer: INFO
    com:
      positivity:
        gateway: DEBUG
