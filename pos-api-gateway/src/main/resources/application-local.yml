# Local development profile — dynamic ports

server:
  port: 8080  # Fixed gateway entry point

management:
  # No separate management port - expose actuator on main server port for healthchecks
  endpoints:
    web:
      exposure:
        include: gateway,health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}

logging:
  level:
    root: INFO
    org:
      springframework:
        cloud:
          gateway: DEBUG
        boot:
          web:
            embedded:
              tomcat:
                TomcatWebServer: INFO
    com:
      positivity:
        gateway: DEBUG
