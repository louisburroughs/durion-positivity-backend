# .github/workflows/contract-sync.yml
#
# Purpose:
# - Fail backend PRs that change API/contract-relevant code unless the PR body links to:
#   (a) the canonical durion contract guide entry, and
#   (b) a durion contract PR.
#
# Notes:
# - Tune the "Contract-relevant file patterns" to match your repo layout.
# - This workflow is intentionally conservative; it only enforces the link requirement
#   when contract-relevant files change.

name: Contract Sync Enforcement

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main
      - master
      - "cap/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  contract-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for file context if needed)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Detect contract-relevant file changes
        id: changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        with:
          # If any of these match, we require contract links in the PR body.
          filters: |
            contract_relevant:
              # --- REST/OpenAPI surface ---
              - '**/openapi/**'
              - '**/swagger/**'
              - '**/*openapi*.yml'
              - '**/*openapi*.yaml'
              - '**/*openapi*.json'
              - '**/*swagger*.yml'
              - '**/*swagger*.yaml'
              - '**/*swagger*.json'

              # --- Typical controller / API entrypoints ---
              - '**/*Controller.java'
              - '**/*Resource.java'
              - '**/*Endpoint.java'
              - '**/*Routes.*'
              - '**/controller/**'
              - '**/resource/**'
              - '**/endpoint/**'
              - '**/routes/**'

              # --- DTOs / API models ---
              - '**/dto/**'
              - '**/api/**/model/**'
              - '**/*Request.java'
              - '**/*Response.java'
              - '**/*Dto.java'

              # --- Events / contracts (adjust to your naming) ---
              - '**/events/**'
              - '**/event/**'
              - '**/*Event.java'
              - '**/*Schema.json'
              - '**/*schema.json'
              - '**/*.avsc'
              - '**/*.proto'

              # --- Validation / error model changes often affect contract semantics ---
              - '**/validation/**'
              - '**/*Exception.java'
              - '**/*Error*.java'
              - '**/*Problem*.java'

      - name: Enforce contract links in PR body (when contract-relevant files changed)
        if: steps.changes.outputs.contract_relevant == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          if [ -z "${PR_BODY:-}" ]; then
            echo "::error::PR description is empty. It must include contract links when contract-relevant files change."
            exit 1
          fi

          # Require a reference to the canonical contract guide filename anywhere in the PR body.
          # This is intentionally simple — any mention of the filename suffices.
          GUIDE_KEYWORD='BACKEND_CONTRACT_GUIDE\.md'

          echo "${PR_BODY}" | grep -Eqi "${GUIDE_KEYWORD}" || {
            echo "::error::Missing contract guide reference. Mention BACKEND_CONTRACT_GUIDE.md in your PR description."
            echo "::notice::Simply include the text 'BACKEND_CONTRACT_GUIDE.md' anywhere in the PR body (a link to the relevant domain contract guide is recommended)."
            exit 1
          }

          echo "Contract links present."

      - name: No contract-relevant changes detected
        if: steps.changes.outputs.contract_relevant != 'true'
        run: echo "No contract-relevant file changes; skipping contract link enforcement."
