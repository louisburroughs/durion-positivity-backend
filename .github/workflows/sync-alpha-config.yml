name: Sync Alpha Config

# Config-only delivery path for the alpha compose files (#1457). Before this workflow,
# the only thing that shipped deployment/alpha/docker-compose.prod.yml to the box was a
# full build-push-ecr run, so a merged two-line env change was silently inert until the
# next image build. This workflow uploads the committed compose files (and the deploy
# script) to S3, pulls them onto the alpha host over SSM, and runs
# deploy-backend.sh --config-only, which recreates exactly the containers whose merged
# compose config changed — recreation, not restart, because a restarted container keeps
# its old environment.
#
# The full build-push-ecr deploy ships the same files itself, so the two paths converge
# on the committed state; the checksum guard in deploy-backend.sh fails either path
# loudly if the on-box file is ever stale.
on:
  push:
    branches: [main]
    paths:
      - docker-compose.yml
      - deployment/alpha/docker-compose.prod.yml
      - deployment/alpha/deploy-backend.sh
  workflow_dispatch:

# Queue rather than cancel: two merged config changes must both reach the box in order.
concurrency:
  group: sync-alpha-config
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  sync:
    name: Sync compose config to alpha
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload config files to S3
        run: |
          aws s3 cp docker-compose.yml s3://${{ vars.ALPHA_DEPLOY_BUCKET }}/alpha/backend/docker-compose.yml
          aws s3 cp deployment/alpha/docker-compose.prod.yml s3://${{ vars.ALPHA_DEPLOY_BUCKET }}/alpha/docker-compose.prod.yml
          aws s3 cp deployment/alpha/deploy-backend.sh s3://${{ vars.ALPHA_DEPLOY_BUCKET }}/alpha/scripts/deploy-backend.sh

      - name: Compute committed checksums
        id: sums
        run: |
          echo "prod=$(sha256sum deployment/alpha/docker-compose.prod.yml | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "base=$(sha256sum docker-compose.yml | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Pull config files on alpha host
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.ALPHA_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["mkdir -p /opt/durion/alpha/backend /opt/durion/alpha/scripts","aws s3 cp s3://${{ vars.ALPHA_DEPLOY_BUCKET }}/alpha/backend/docker-compose.yml /opt/durion/alpha/backend/docker-compose.yml","aws s3 cp s3://${{ vars.ALPHA_DEPLOY_BUCKET }}/alpha/docker-compose.prod.yml /opt/durion/alpha/docker-compose.prod.yml","aws s3 cp s3://${{ vars.ALPHA_DEPLOY_BUCKET }}/alpha/scripts/deploy-backend.sh /opt/durion/alpha/scripts/deploy-backend.sh","chmod +x /opt/durion/alpha/scripts/deploy-backend.sh"]}' \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.ALPHA_EC2_INSTANCE_ID }}"

      - name: Apply config on alpha host (recreate changed containers)
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.ALPHA_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[\"PROD_OVERRIDE_SHA256='${{ steps.sums.outputs.prod }}' BASE_COMPOSE_SHA256='${{ steps.sums.outputs.base }}' bash /opt/durion/alpha/scripts/deploy-backend.sh --config-only\"]}" \
            --timeout-seconds 2700 \
            --query "Command.CommandId" --output text)
          echo "SSM Command ID: $COMMAND_ID"
          for i in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.ALPHA_EC2_INSTANCE_ID }}" \
              --query "Status" --output text)
            echo "[$i/180] Status: $STATUS"
            if [[ "$STATUS" == "Success" ]]; then break; fi
            if [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ vars.ALPHA_EC2_INSTANCE_ID }}" \
                --query "[StandardOutputContent,StandardErrorContent]" \
                --output text
              exit 1
            fi
            sleep 15
          done
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.ALPHA_EC2_INSTANCE_ID }}" \
            --query "[StandardOutputContent,StandardErrorContent]" \
            --output text
