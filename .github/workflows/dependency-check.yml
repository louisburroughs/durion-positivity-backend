name: Dependency Update Check

on:
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday at midnight
  workflow_dispatch:

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  check-dependencies:
    name: Check for Dependency Updates
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set Maven revision
        run: echo "-Drevision=0.1.${{ github.run_number }}-SNAPSHOT" > .mvn/maven.config

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      
      - name: Check for dependency updates
        run: ./mvnw versions:display-dependency-updates -B
      
      - name: Check for plugin updates
        run: ./mvnw versions:display-plugin-updates -B
      
      - name: Generate dependency tree
        run: ./mvnw dependency:tree -B > dependency-tree.txt
      
      - name: Upload dependency reports
        uses: actions/upload-artifact@v6
        with:
          name: dependency-reports
          path: |
            dependency-tree.txt
            **/target/versions-maven-plugin.txt
          retention-days: 30
