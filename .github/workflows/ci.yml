name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "pos-*/**"
      - "pom.xml"
      - ".github/workflows/ci.yml"
      - "Dockerfile"
      - "docker-compose.yml"
  pull_request:
    branches: [main]
    paths:
      - "pos-*/**"
      - "pom.xml"
      - ".github/workflows/ci.yml"
      - "Dockerfile"
      - "docker-compose.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  JAVA_DISTRIBUTION: "temurin"
  MAVEN_OPTS: -Xmx3072m
  DOCKER_BUILDKIT: 1

jobs:
  detect-test-modules:
    name: Detect Test Modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
      has-changes: ${{ steps.detect.outputs.has-changes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect modules to test
        id: detect
        run: |
          set -euo pipefail

          ARCHUNIT_MODULE="pos-archunit"
          ALL_MODULES_JSON=$(ls -d pos-* | jq -R -s -c 'split("\n")[:-1]')

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "modules=${ALL_MODULES_JSON}" >> "$GITHUB_OUTPUT"
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch: testing all modules"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            DIFF_BASE="origin/${{ github.base_ref }}"
            DIFF_HEAD="${{ github.sha }}"
          else
            DIFF_BASE="${{ github.event.before }}"
            DIFF_HEAD="${{ github.sha }}"
            if [[ -z "${DIFF_BASE}" || "${DIFF_BASE}" == "0000000000000000000000000000000000000000" ]]; then
              DIFF_BASE="$(git rev-parse HEAD~1)"
            fi
          fi

          CHANGED_FILES=$(git diff --name-only "${DIFF_BASE}" "${DIFF_HEAD}" || true)

          if echo "${CHANGED_FILES}" | grep -Eq '^(pom\.xml|\.github/workflows/ci\.yml|docker-compose\.yml)$'; then
            echo "modules=${ALL_MODULES_JSON}" >> "$GITHUB_OUTPUT"
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
            echo "Core CI/build file changed: testing all modules"
            exit 0
          fi

          CHANGED_MODULES_JSON=$(echo "${CHANGED_FILES}" | grep '^pos-' | cut -d'/' -f1 | sort -u | jq -R -s -c 'split("\n")[:-1]')
          MATRIX_MODULES_JSON=$(jq -cn \
            --argjson changed "${CHANGED_MODULES_JSON}" \
            --arg archunit "${ARCHUNIT_MODULE}" \
            '$changed + [$archunit] | unique')

          if [[ "${CHANGED_MODULES_JSON}" == "[]" ]]; then
            echo "modules=${MATRIX_MODULES_JSON}" >> "$GITHUB_OUTPUT"
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
            echo "No pos-* module changes detected; running ${ARCHUNIT_MODULE}"
          else
            echo "modules=${MATRIX_MODULES_JSON}" >> "$GITHUB_OUTPUT"
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
            echo "Changed modules (+${ARCHUNIT_MODULE}): ${MATRIX_MODULES_JSON}"
          fi

  unit-tests:
    name: Unit Tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: detect-test-modules
    if: needs.detect-test-modules.outputs.has-changes == 'true'

    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-test-modules.outputs.modules) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better change detection

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Enforce no-arg now() policy
        run: ./scripts/check-noarg-now.sh

      - name: Build module graph for unit test dependencies
        run: ./mvnw -pl ${{ matrix.module }} -am -DskipTests install -T 1C -B -q

      - name: Run unit tests (module only)
        run: ./mvnw -pl ${{ matrix.module }} test -T 1C -B -q

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.module }}
          path: |
            **/target/surefire-reports/*.xml
          retention-days: 30

  integration-tests-modules:
    name: Integration Tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: detect-test-modules
    if: needs.detect-test-modules.outputs.has-changes == 'true'

    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-test-modules.outputs.modules) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build module graph for IT dependencies
        run: ./mvnw -pl ${{ matrix.module }} -am -DskipTests install -T 1C -B -q

      - name: Run integration tests
        run: ./mvnw -pl ${{ matrix.module }} -DskipTests=false failsafe:integration-test failsafe:verify -T 1C -B -q

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-${{ matrix.module }}
          path: |
            **/target/failsafe-reports/*.xml
          retention-days: 30

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests-modules]
    # Only run on main branch pushes or when pom.xml files change (dependency updates)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || contains(github.event.pull_request.changed_files, 'pom.xml')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Run OWASP Dependency Check
        run: ./mvnw org.owasp:dependency-check-maven:check -B
        continue-on-error: true

      - name: Upload dependency check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: "**/target/dependency-check-report.html"
          retention-days: 30

  docker-build:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests-modules]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      services: ${{ steps.detect-services.outputs.services }}
      has-changes: ${{ steps.detect-services.outputs.has-changes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need history to detect changes

      - name: Detect changed services
        id: detect-services
        run: |
          # Get all changed pos-* modules since last main commit
          CHANGED_MODULES=$(git diff --name-only HEAD~1 HEAD | grep '^pos-' | cut -d'/' -f1 | sort -u || true)
          # Only containerized modules (have a Dockerfile) should enter Docker matrix
          CHANGED_SERVICES=$(echo "$CHANGED_MODULES" | while read -r module; do
            [ -n "$module" ] || continue
            if [ -f "$module/Dockerfile" ]; then
              echo "$module"
            fi
          done | sort -u)

          if [ -z "$CHANGED_SERVICES" ]; then
            echo "No containerized service changes detected, skipping Docker builds"
            echo "services=[]" >> $GITHUB_OUTPUT
            echo "has-changes=false" >> $GITHUB_OUTPUT
          else
            # Convert to JSON array for matrix
            SERVICES_JSON=$(echo "$CHANGED_SERVICES" | jq -R -s -c 'split("\n")[:-1]')
            echo "services=$SERVICES_JSON" >> $GITHUB_OUTPUT
            echo "has-changes=true" >> $GITHUB_OUTPUT
            echo "Changed services: $SERVICES_JSON"
          fi

  docker-build-matrix:
    name: Build Docker Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: docker-build
    if: needs.docker-build.outputs.has-changes == 'true'

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.docker-build.outputs.services) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Build service JAR
        run: ./mvnw clean package -pl ${{ matrix.service }} -am -DskipTests -DskipITs -T 1C -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: ${{ matrix.service }}:latest,${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

        # Uncomment below to push to Docker registry
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${{ github.sha }}

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests-modules]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Run Checkstyle
        run: ./mvnw checkstyle:check -B
        continue-on-error: true

      - name: Run SpotBugs
        run: ./mvnw spotbugs:check -B
        continue-on-error: true

      # Uncomment to enable SonarCloud CI-based analysis
      # This provides deeper analysis than SonarCloud's automatic analysis
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }} # Needed for PR decoration
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # Get from sonarcloud.io
        run: |
          ./mvnw test-compile sonar:sonar -DskipTests -DskipITs \
            -Dsonar.projectKey=louisburroughs_durion-positivity-backend \
            -Dsonar.organization=louisburroughs \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

  integration-test:
    name: Integration Tests with Docker Compose
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests-modules]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Basic ${{ secrets.GRAFANA_TOKEN }}"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Build all modules
        run: ./mvnw clean package -DskipTests -DskipITs -B

      - name: Detect Docker Compose command
        run: |
          if docker compose version >/dev/null 2>&1; then
            echo "COMPOSE_CMD=docker compose" >> "$GITHUB_ENV"
          elif command -v docker-compose >/dev/null 2>&1; then
            echo "COMPOSE_CMD=docker-compose" >> "$GITHUB_ENV"
          else
            echo "Docker Compose is not available on this runner."
            exit 1
          fi

      - name: Start services with Docker Compose
        run: |
          SERVICES=$($COMPOSE_CMD config --services | grep -v '^pos-frontend$' | tr '\n' ' ')
          echo "Starting services (excluding pos-frontend): $SERVICES"
          $COMPOSE_CMD up -d $SERVICES

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for Eureka to be ready..."
          timeout 300 bash -c 'until curl -sf http://localhost:8761/actuator/health; do sleep 5; done'
          echo "Waiting for API Gateway to be ready..."
          timeout 300 bash -c 'until curl -sf http://localhost:8080/actuator/health; do sleep 5; done'

      - name: Run smoke tests
        run: |
          # Test Eureka
          curl -f http://localhost:8761/actuator/health || exit 1
          # Test API Gateway
          curl -f http://localhost:8080/actuator/health || exit 1
          echo "Smoke tests passed!"

      - name: Show service logs on failure
        if: failure()
        run: $COMPOSE_CMD logs

      - name: Shut down services
        if: always()
        run: $COMPOSE_CMD down -v

  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs:
      [
        unit-tests,
        security-scan,
        docker-build,
        docker-build-matrix,
        code-quality,
      ]
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "Build failed!"
            exit 1
          fi
          echo "Build succeeded!"

      # Uncomment to enable Slack notifications
      # - name: Send Slack notification
      #   if: always()
      #   uses: 8398a7/action-slack@v3
      #   with:
      #     status: ${{ job.status }}
      #     text: 'Backend CI/CD Pipeline'
      #     webhook_url: ${{ secrets.SLACK_WEBHOOK }}
