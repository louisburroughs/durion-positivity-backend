name: Backend CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'pos-*/**'
      - 'pom.xml'
      - '.github/workflows/ci.yml'
      - 'Dockerfile'
      - 'docker-compose.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'pos-*/**'
      - 'pom.xml'
      - '.github/workflows/ci.yml'
      - 'Dockerfile'
      - 'docker-compose.yml'
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  MAVEN_OPTS: -Xmx3072m
  DOCKER_BUILDKIT: 1

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better change detection
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      
      - name: Build with Maven
        run: ./mvnw clean install -DskipTests -B -V
      
      - name: Run unit tests
        run: ./mvnw test -B
      
      - name: Run integration tests
        run: ./mvnw verify -B
      
      - name: Generate test coverage report
        run: ./mvnw jacoco:report
        continue-on-error: true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          retention-days: 30
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maven-artifacts
          path: |
            **/target/*.jar
            !**/target/*-sources.jar
            !**/target/*-javadoc.jar
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      
      - name: Run OWASP Dependency Check
        run: ./mvnw org.owasp:dependency-check-maven:check -B
        continue-on-error: true
      
      - name: Upload dependency check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: '**/target/dependency-check-report.html'
          retention-days: 30

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    strategy:
      matrix:
        service:
          - pos-api-gateway
          - pos-service-discovery
          - pos-accounting
          - pos-catalog
          - pos-customer
          - pos-event-receiver
          - pos-events
          - pos-image
          - pos-inquiry
          - pos-inventory
          - pos-invoice
          - pos-location
          - pos-order
          - pos-people
          - pos-price
          - pos-security-service
          - pos-shop-manager
          - pos-vehicle-fitment
          - pos-vehicle-inventory
          - pos-vehicle-reference-carapi
          - pos-vehicle-reference-nhtsa
          - pos-workorder
          - pos-agent-framework
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: maven-artifacts
      
      - name: Build service JAR
        run: ./mvnw clean package -pl ${{ matrix.service }} -am -DskipTests -B
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: ${{ matrix.service }}:latest,${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
        # Uncomment below to push to Docker registry
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
            context: ./${{ matrix.service }}
            file: ./${{ matrix.service }}/Dockerfile
            push: true
            tags: |
                ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest
                ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${{ github.sha }}

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      
      - name: Run Checkstyle
        run: ./mvnw checkstyle:check -B
        continue-on-error: true
      
      - name: Run SpotBugs
        run: ./mvnw spotbugs:check -B
        continue-on-error: true
      
      # Uncomment to enable SonarCloud CI-based analysis
      # This provides deeper analysis than SonarCloud's automatic analysis
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      
      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}  # Needed for PR decoration
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}    # Get from sonarcloud.io
        run: |
          ./mvnw verify sonar:sonar \
            -Dsonar.projectKey=louisburroughs_durion-positivity-backend \
            -Dsonar.organization=louisburroughs \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  integration-test:
    name: Integration Tests with Docker Compose
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    env:
      OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Basic ${{ secrets.GRAFANA_TOKEN }}"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      
      - name: Build all modules
        run: ./mvnw clean package -DskipTests -B
      
      - name: Start services with Docker Compose
        run: docker-compose up -d
      
      - name: Wait for services to be healthy
        run: |
          echo "Waiting for Eureka to be ready..."
          timeout 300 bash -c 'until curl -sf http://localhost:8761/actuator/health; do sleep 5; done'
          echo "Waiting for API Gateway to be ready..."
          timeout 300 bash -c 'until curl -sf http://localhost:8080/actuator/health; do sleep 5; done'
      
      - name: Run smoke tests
        run: |
          # Test Eureka
          curl -f http://localhost:8761/actuator/health || exit 1
          # Test API Gateway
          curl -f http://localhost:8080/actuator/health || exit 1
          echo "Smoke tests passed!"
      
      - name: Show service logs on failure
        if: failure()
        run: docker-compose logs
      
      - name: Shut down services
        if: always()
        run: docker-compose down -v

  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan, docker-build, code-quality]
    if: always()
    
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "Build failed!"
            exit 1
          fi
          echo "Build succeeded!"
      
      # Uncomment to enable Slack notifications
      # - name: Send Slack notification
      #   if: always()
      #   uses: 8398a7/action-slack@v3
      #   with:
      #     status: ${{ job.status }}
      #     text: 'Backend CI/CD Pipeline'
      #     webhook_url: ${{ secrets.SLACK_WEBHOOK }}
