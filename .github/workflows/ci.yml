name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "pos-*/**"
      - "pom.xml"
      - ".github/workflows/ci.yml"
      - "Dockerfile"
      - "docker-compose.yml"
  pull_request:
    branches: [main]
    paths:
      - "pos-*/**"
      - "pom.xml"
      - ".github/workflows/ci.yml"
      - "Dockerfile"
      - "docker-compose.yml"
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

# Job-level permissions only (Sonar githubactions:S8264); jobs without a
# permissions block get no token scopes.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  JAVA_DISTRIBUTION: "temurin"
  MAVEN_OPTS: -Xmx3072m
  DOCKER_BUILDKIT: 1
  SONAR_MAVEN_PLUGIN_VERSION: "5.5.0.6356"
  COVERAGE_AGGREGATE_MODULE: "pos-coverage-aggregate"
  COVERAGE_AGGREGATE_XML_PATH: "pos-coverage-aggregate/target/site/jacoco-aggregate/jacoco.xml"

jobs:
  detect-test-modules:
    name: Detect Test Modules
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name != 'schedule'
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
      changed-modules: ${{ steps.detect.outputs.changed-modules }}
      full-reactor: ${{ steps.detect.outputs.full-reactor }}
      has-changes: ${{ steps.detect.outputs.has-changes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect modules to test
        id: detect
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            DETECTION="$(./scripts/ci/detect-modules.sh --full)"
          else
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              git fetch origin "${{ github.base_ref }}" --depth=1
              DIFF_BASE="origin/${{ github.base_ref }}"
              DIFF_HEAD="${{ github.sha }}"
            else
              DIFF_BASE="${{ github.event.before }}"
              DIFF_HEAD="${{ github.sha }}"
              if [[ -z "${DIFF_BASE}" || "${DIFF_BASE}" == "0000000000000000000000000000000000000000" ]]; then
                DIFF_BASE="$(git rev-parse HEAD~1)"
              fi
            fi
            DETECTION="$(./scripts/ci/detect-modules.sh "${DIFF_BASE}" "${DIFF_HEAD}")"
          fi

          echo "Detection: ${DETECTION}"
          FULL_REACTOR="$(jq -r '.full_reactor' <<< "${DETECTION}")"
          CHANGED_JSON="$(jq -c '.modules' <<< "${DETECTION}")"

          # Matrix view of the detection: every selectable module when the whole
          # reactor is affected, otherwise the changed modules plus pos-archunit
          # (current behaviour, preserved — a CI-triggering change that maps to
          # no module still runs pos-archunit, so has-changes is always true).
          NON_TEST_MODULES_JSON='["pos-dependencies","pos-coverage-aggregate"]'
          if [[ "${FULL_REACTOR}" == "true" ]]; then
            MATRIX_JSON=$(ls -d pos-* | jq -R -s -c --argjson excluded "${NON_TEST_MODULES_JSON}" 'split("\n")[:-1] | map(select((. as $module | $excluded | index($module)) | not))')
          else
            MATRIX_JSON=$(jq -c '. + ["pos-archunit"] | unique' <<< "${CHANGED_JSON}")
          fi

          echo "full-reactor=${FULL_REACTOR}" >> "$GITHUB_OUTPUT"
          echo "changed-modules=${CHANGED_JSON}" >> "$GITHUB_OUTPUT"
          echo "modules=${MATRIX_JSON}" >> "$GITHUB_OUTPUT"
          echo "has-changes=true" >> "$GITHUB_OUTPUT"

  build-test:
    # One job, three reactor invocations (BACKEND_BUILD_SPEC.md §4.2/§4.3, adapted):
    #
    #  1. install -DskipTests        — full reactor, ~2 min warm. Needed because
    #     Maven's -amd includes dependents of the selection but NOT the dependents'
    #     own upstream dependencies, so a purely selective build cannot resolve on
    #     a clean runner; and pos-archunit depends on nearly every module anyway.
    #     This also populates ~/.m2 with every internal artifact for the SHA-keyed
    #     reactor cache and packages every service JAR for downstream jobs.
    #  2. selective tests            — -pl <changed> -amd runs the changed modules'
    #     tests plus every dependent's tests (gap G1): PRs stop at `test` (ITs
    #     skipped), main pushes run `verify` (failsafe ITs included). Dependencies
    #     absent from the -amd reactor resolve from the step-1 install.
    #  3. pos-archunit rules         — its own -am reactor stopped at the `test`
    #     phase, where sibling classes resolve from target/classes. Running the
    #     rules past `package` lets spring-boot:repackage swap siblings for fat
    #     JARs whose classes hide under BOOT-INF/classes, and every rule passes
    #     vacuously (#909) — which is also why -Darchunit.skipTests=true is set on
    #     invocations 1 and 2.
    #
    # Replaces the former build-reactor job and both per-module test matrices:
    # same three build shapes, minus ~70s×N of per-job setup/cache-restore
    # overhead and the inter-job queue gaps (docs/build-timings-baseline.md).
    name: Build & Test (reactor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: detect-test-modules
    if: needs.detect-test-modules.outputs.has-changes == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set Maven revision
        # Commit-stamped, not run-stamped: the reactor cache below is keyed by
        # SHA, so the artifact version must be a function of the SHA too. A
        # run-number version made every cache hit useless — a later job on the
        # same commit (e.g. the nightly security scan) restored artifacts
        # published under a different run's version and failed dependency
        # resolution (run 31298480848).
        run: printf -- "-Drevision=0.1.%s-SNAPSHOT\n-Dmaven.build.cache.enabled=false\n" "${GITHUB_SHA::7}" > .mvn/maven.config

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Cache Maven wrapper binary
        uses: actions/cache@v5
        with:
          path: ~/.m2/wrapper
          key: ${{ runner.os }}-maven-wrapper-${{
            hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Enforce no-arg now() policy
        run: ./scripts/check-noarg-now.sh

      - name: Enforce Flyway migration hygiene
        run: ./scripts/check-flyway-hygiene.sh

      - name: Enforce coverage-aggregate module coverage
        # A reactor module absent from pos-coverage-aggregate's dependencies is
        # excluded from both the JaCoCo aggregate report and the
        # `-pl pos-coverage-aggregate -am` SonarCloud reactor, with no build
        # failure to signal it. Fail fast here instead.
        run: ./scripts/check-coverage-aggregate-drift.sh

      - name: Enforce OpenAPI inventory coverage
        # pos-openapi-validation only walks modules registered in
        # module-inventory.yaml, so a spec-producing module absent from it is
        # validated by nothing — it can ship an unparseable openapi.yaml with a
        # green build. Fail fast here instead (#1262).
        run: ./scripts/check-openapi-inventory-drift.sh

      - name: Enforce deploy-list registration
        # Deploying a service means adding it to five independent lists (compose,
        # ALL_SERVICES_JSON, the alpha override, the alpha start order, and a
        # Prometheus scrape job). Nothing made them agree, and the same drift was
        # fixed by hand three times. Fail fast here instead (#1580).
        run: ./scripts/check-deploy-service-drift.sh

      - name: Verify the config-only sync's image pre-flight
        # deploy-backend.sh --config-only decides what an alpha sync does when an
        # image is missing at the pinned BACKEND_TAG, and that decision is
        # otherwise only observable on the box after a merge. The self-test drives
        # the real script against a stubbed Docker (#1646).
        run: bash scripts/tests/deploy-backend-config-only-selftest.sh

      - name: Enforce Kafka topic provisioning coverage
        # kafka-topic-init is the authoritative topic provisioner on alpha, so a
        # topic missing from it lands on broker defaults — which for a DLQ means
        # 7-day retention instead of the intended 30 (#1578, #1579).
        run: ./scripts/check-kafka-topic-drift.sh

      - name: Configure build cache (PR pilot)
        # Build Cache Extension pilot, PR builds only (spec §4.5). PRs skip the
        # commit-stamped revision: a version that changes every commit would poison
        # every cache key, and nothing downstream consumes PR artifacts by version.
        # (The pilot's first run exposed pos-archunit's 2.4 GB fat jar, which the
        # extension's output hashing cannot read — fixed in pos-archunit/pom.xml.)
        # The ArchUnit step below opts back out of the cache: restored modules
        # resolve as fat JARs, not target/classes, which blinds the rules (#909).
        if: github.event_name == 'pull_request'
        run: echo "-Dmaven.build.cache.enabled=true" > .mvn/maven.config

      - name: Restore build cache (PR pilot)
        if: github.event_name == 'pull_request'
        uses: actions/cache@v5
        with:
          path: ~/.m2/build-cache
          # v3: the v2 cache pool was poisoned again, same mechanism as the v1
          # incident below — PR #1617 saw pos-invoice's brand-new
          # InvoiceAnalyticsRepositoryTest fail deterministically in CI (empty
          # result sets from queries whose logic is correct and passes in every
          # local/non-cached run) while every other signal on the PR was green.
          # restore-keys reuse caches across branches, so one branch's
          # stale/experimental target/classes can leak into every later PR
          # build and produce phantom failures that never reproduce locally.
          # Bumping the namespace abandons the poisoned entries.
          #
          # v2: the v1 cache pool was poisoned with a compiled test class
          # (RagContextBuilderTest) that exists in no commit — restore-keys
          # reuse caches across branches, so one branch's stale/experimental
          # target/test-classes can leak into every later PR build and fail
          # surefire on phantom tests (PR #1201). Bumping the namespace
          # abandons the poisoned entries.
          key: ${{ runner.os }}-mvn-build-cache-v3-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-mvn-build-cache-v3-

      - name: Install reactor (skip tests)
        # alwaysRunPlugins: on a build-cache hit the extension skips the install
        # goal, so sibling snapshots never reach ~/.m2 and the selective test
        # reactor below fails resolution on any module outside its own graph
        # (first pos-shared-dtos, then pos-tax-common via an -amd dependent —
        # the -am band-aid can't cover dependents' own upstreams). Forcing the
        # install plugin to run installs the restored artifacts without
        # rebuilding them, keeping the cache's compile/test savings.
        # flatten must be forced too: without it a cache-hit module installs its
        # RAW pom.xml whose parent/version is the unresolved ${revision} literal,
        # poisoning ~/.m2 so the selective reactor fails descriptor resolution on
        # every sibling (run 31211645364, pos-archunit -> pos-accounting et al.).
        run: >-
          ./mvnw install -DskipTests -DskipITs -Darchunit.skipTests=true
          -Dmaven.build.cache.alwaysRunPlugins=flatten-maven-plugin:flatten,maven-install-plugin:install
          -T 1C -B -ntp -q

      - name: Compute test selection
        id: selection
        env:
          FULL_REACTOR: ${{ needs.detect-test-modules.outputs.full-reactor }}
          CHANGED_MODULES: ${{ needs.detect-test-modules.outputs.changed-modules }}
        run: |
          set -euo pipefail
          if [[ "${FULL_REACTOR}" == "true" ]]; then
            # Whole reactor affected: no -pl, every module's tests run.
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "args-pr=" >> "$GITHUB_OUTPUT"
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
          else
            CSV="$(jq -r 'join(",")' <<< "${CHANGED_MODULES}")"
            if [[ -z "${CSV}" ]]; then
              # No module changed (e.g. root Dockerfile): archunit still runs below.
              echo "args=" >> "$GITHUB_OUTPUT"
              echo "args-pr=" >> "$GITHUB_OUTPUT"
              echo "run-tests=false" >> "$GITHUB_OUTPUT"
            else
              echo "args=-pl ${CSV} -amd" >> "$GITHUB_OUTPUT"
              # PR variant adds -am: with the build-cache pilot enabled, a cache
              # hit on the install step skips installing sibling snapshots into
              # ~/.m2, so the test session must materialize upstream modules in
              # its own reactor (cache restores them cheaply). Without this, any
              # re-run that hits the restored cache fails dependency resolution
              # ("Could not find artifact com.positivity:pos-events:...").
              echo "args-pr=-pl ${CSV} -amd -am" >> "$GITHUB_OUTPUT"
              echo "run-tests=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Test changed modules and dependents (PR)
        if: github.event_name == 'pull_request' && steps.selection.outputs.run-tests == 'true'
        # lowResourceTests bounds each Surefire fork to 1 GiB: with -T 1C up to four
        # module builds fork test JVMs concurrently, and default heap sizing would
        # overcommit the 16 GB runner.
        #
        # The `check` goal is invoked directly rather than by running `verify`: the
        # ratchet's check-ratchet execution is bound to verify, so a build that stops at
        # `test` never evaluates it and every PR merged ungated (the nightly then caught
        # the regression a day late). Invoking the goal gates here without paying for
        # package + spring-boot:repackage on every changed module. Its rules live at
        # plugin level in the root pom precisely so this CLI invocation sees them.
        #
        # -DskipITs is what makes this the RIGHT gate: it is the measurement the nightly
        # ratchet performs and the one the floors are derived from. Do not drop it.
        run: |
          ./mvnw ${{ steps.selection.outputs.args-pr }} \
            -DskipTests=false test \
            org.jacoco:jacoco-maven-plugin:0.8.14:report \
            org.jacoco:jacoco-maven-plugin:0.8.14:check \
            -Darchunit.skipTests=true \
            -DlowResourceTests=true \
            -DskipITs -T 1C -B -ntp

      - name: Test changed modules and dependents incl. ITs (main)
        if: github.event_name != 'pull_request' && steps.selection.outputs.run-tests == 'true'
        # This step runs the ITs, so its jacoco.exec is IT-inclusive and its coverage is
        # higher than the floors describe. Reaching `verify` fires the check-ratchet
        # execution against that inflated data, which cannot fail honestly — it can only
        # pass a module the unit-only gate would reject, and that false green is exactly
        # how pos-image and pos-supplier reached main below their floors. haltOnFailure is
        # off here so the numbers are still logged for information while the binding
        # verdicts come from the two unit-only measurements: the PR step above and the
        # nightly ratchet job. See docs/TEST_COVERAGE_IMPROVEMENT_PLAN.md §6.2.
        run: |
          ./mvnw ${{ steps.selection.outputs.args }} \
            -DskipTests=false verify \
            org.jacoco:jacoco-maven-plugin:0.8.14:report \
            -Darchunit.skipTests=true \
            -DlowResourceTests=true \
            -Djacoco.check.haltOnFailure=false \
            -T 1C -B -ntp

      - name: Summarize test failures
        # With -T 1C the parallel reactor interleaves module output and the
        # failing module's surefire detail can scroll far from the end of the
        # log; re-print every failed <testcase> here so the failure names and
        # messages sit in the job log's tail where they are easy to find.
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          for f in sorted(glob.glob('*/target/surefire-reports/TEST-*.xml') + glob.glob('*/target/failsafe-reports/TEST-*.xml')):
              try:
                  root = ET.parse(f).getroot()
              except ET.ParseError:
                  continue
              if int(root.get('failures', '0')) == 0 and int(root.get('errors', '0')) == 0:
                  continue
              print(f"::group::{f}")
              for tc in root.iter('testcase'):
                  for kind in ('failure', 'error'):
                      for node in tc.findall(kind):
                          print(f"{kind.upper()}: {tc.get('classname')}.{tc.get('name')}")
                          print(f"  message: {node.get('message', '')[:500]}")
                          print((node.text or '')[:3000])
              print("::endgroup::")
          EOF

      - name: Run ArchUnit rules
        # Cache opt-out: a build-cache hit restores sibling modules as their
        # repackaged fat JARs instead of materializing target/classes, hiding
        # every application class under BOOT-INF/classes — the exact #909
        # failure mode ClasspathVisibilityGuardTest exists to catch.
        run: |
          ./mvnw -pl pos-archunit -am -DskipTests=false test \
            -Dtest='com/positivity/archunit/*' \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dmaven.build.cache.enabled=false \
            -DskipITs -T 1C -B -ntp -q

      - name: Save reactor build to cache
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-reactor-${{ github.sha }}

      - name: Stage service JARs
        if: github.event_name != 'pull_request'
        # The bytes downstream Docker/ECR jobs ship (spec §4.6): one JAR per
        # containerized module, all packaged by the step-1 install.
        run: |
          set -euo pipefail
          rm -rf artifact-jars
          for dockerfile in pos-*/Dockerfile; do
            service="${dockerfile%%/*}"
            jar="$(find "${service}/target" -maxdepth 1 -name '*.jar' ! -name '*.jar.original' 2>/dev/null | head -n 1 || true)"
            if [[ -n "${jar}" ]]; then
              mkdir -p "artifact-jars/${service}/target"
              cp "${jar}" "artifact-jars/${service}/target/"
            fi
          done
          find artifact-jars -maxdepth 2 -print | sort

      - name: Upload service JARs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: service-jars
          path: artifact-jars
          retention-days: 3
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-reactor
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-coverage-reactor
          path: |
            **/target/site/jacoco/jacoco.xml
          if-no-files-found: ignore
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Only run on the nightly schedule or on manual dispatch. Even with an NVD
    # API key, a cold NVD sync via the API takes hours (observed ~2.5h for 48%
    # of the DB on 2026-08-07), so the scan is kept out of the push/PR path and
    # runs overnight against the datafeed mirror instead. No `needs`:
    # detect-test-modules/build-test are skipped on schedule, and a job whose
    # needs are skipped is skipped — the reactor cache restore below (plus its
    # cache-miss fallback install) makes this job self-sufficient anyway.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set Maven revision
        run: printf -- "-Drevision=0.1.%s-SNAPSHOT\n-Dmaven.build.cache.enabled=false\n" "${GITHUB_SHA::7}" > .mvn/maven.config

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Maven wrapper binary
        uses: actions/cache@v5
        with:
          path: ~/.m2/wrapper
          key: ${{ runner.os }}-maven-wrapper-${{
            hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Restore reactor build cache
        id: restore-reactor-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-reactor-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-maven-reactor-

      - name: Install internal snapshot artifacts (cache-miss fallback)
        if: steps.restore-reactor-cache.outputs.cache-hit != 'true'
        run: ./mvnw install -DskipTests -DskipITs -T 1C -B -q

      - name: Get current week for cache key
        id: date
        run: echo "week=$(date +'%Y-%W')" >> "$GITHUB_OUTPUT"

      - name: Cache OWASP NVD data
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/owasp
          # NVD data is time-sensitive, not pom-sensitive — bust weekly so stale
          # CVE data doesn't linger, but pom changes don't force a re-download.
          key: ${{ runner.os }}-owasp-nvd-${{ steps.date.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-owasp-nvd-

      - name: Run OWASP Dependency Check
        # The NVD API is unusably slow even with an API key (a cold sync was
        # observed taking >2.5h for half the DB), so pull the pre-built NVD
        # cache the dependency-check project publishes daily instead — the
        # {0} placeholder expands to a year or "modified" per feed file.
        # Fails the job on CVSS >= 7 findings (failBuildOnCVSS in the plugin
        # config); suppressions live in build-tools/owasp-suppressions.xml.
        run: >-
          ./mvnw org.owasp:dependency-check-maven:check
          -DnvdDatafeedUrl="https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz"
          -B

      - name: Upload dependency check report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-check-report
          path: "**/target/dependency-check-report.html"
          retention-days: 30

  docker-build:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [build-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      services: ${{ steps.detect-services.outputs.services }}
      has-changes: ${{ steps.detect-services.outputs.has-changes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Need history to detect changes

      - name: Detect changed services
        id: detect-services
        run: |
          # Get all changed pos-* modules since last main commit
          CHANGED_MODULES=$(git diff --name-only HEAD~1 HEAD | grep '^pos-' | cut -d'/' -f1 | sort -u || true)
          # Only containerized modules (have a Dockerfile) should enter Docker matrix
          CHANGED_SERVICES=$(echo "$CHANGED_MODULES" | while read -r module; do
            [ -n "$module" ] || continue
            if [ -f "$module/Dockerfile" ]; then
              echo "$module"
            fi
          done | sort -u)

          if [ -z "$CHANGED_SERVICES" ]; then
            echo "No containerized service changes detected, skipping Docker builds"
            echo "services=[]" >> $GITHUB_OUTPUT
            echo "has-changes=false" >> $GITHUB_OUTPUT
          else
            # Convert to JSON array for matrix
            SERVICES_JSON=$(echo "$CHANGED_SERVICES" | jq -R -s -c 'split("\n")[:-1]')
            echo "services=$SERVICES_JSON" >> $GITHUB_OUTPUT
            echo "has-changes=true" >> $GITHUB_OUTPUT
            echo "Changed services: $SERVICES_JSON"
          fi

  docker-build-matrix:
    name: Build Docker Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: docker-build
    if: needs.docker-build.outputs.has-changes == 'true'

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.docker-build.outputs.services) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Maven wrapper binary
        uses: actions/cache@v5
        with:
          path: ~/.m2/wrapper
          key: ${{ runner.os }}-maven-wrapper-${{
            hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Download tested service JAR
        id: tested-jar
        # Prefer the JAR that passed build-test (spec §4.6). Fall back to a scoped
        # Maven build only if this service wasn't part of the tested artifact.
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: service-jars
          path: downloaded-jars

      - name: Restore tested JAR or build from source
        run: |
          set -euo pipefail
          JAR_PATH="$(find downloaded-jars -type f \
            -path "*/${{ matrix.service }}/target/*.jar" 2>/dev/null | head -n 1 || true)"
          if [[ -n "${JAR_PATH}" ]]; then
            mkdir -p "${{ matrix.service }}/target"
            cp "${JAR_PATH}" "${{ matrix.service }}/target/"
            echo "Using tested JAR from build-test: ${JAR_PATH}"
          else
            echo "No tested JAR for ${{ matrix.service }}; building from source"
            ./mvnw package -pl ${{ matrix.service }} -am -DskipTests -DskipITs -T 1C -B
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: ${{ matrix.service }}:latest,${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Docker Hub
        if: vars.ENABLE_DOCKERHUB_PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        if: vars.ENABLE_DOCKERHUB_PUSH == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${{ github.sha }}

      - name: Skip Docker Hub push
        if: vars.ENABLE_DOCKERHUB_PUSH != 'true'
        run:
          echo "Docker Hub push is disabled. Set ENABLE_DOCKERHUB_PUSH=true to
          publish from this workflow."

  code-quality:
    name: Incremental Code Quality Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    needs: [build-test]
    if: github.event_name != 'schedule'
    # Exposed at job level purely so the Sonar steps below can test for its presence:
    # the `secrets` context is not readable from a step `if:`, but `env` is.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set Maven revision
        run: printf -- "-Drevision=0.1.%s-SNAPSHOT\n-Dmaven.build.cache.enabled=false\n" "${GITHUB_SHA::7}" > .mvn/maven.config

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Cache Maven wrapper binary
        uses: actions/cache@v5
        with:
          path: ~/.m2/wrapper
          key: ${{ runner.os }}-maven-wrapper-${{
            hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Restore reactor build cache
        # Only populated on main pushes (build-test saves it after `install`);
        # a PR-run miss is expected and harmless.
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-reactor-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-maven-reactor-

      - name: Run Checkstyle
        if: github.event_name != 'pull_request'
        run: ./mvnw checkstyle:check -B
        continue-on-error: true

      - name: Run SpotBugs
        if: github.event_name != 'pull_request'
        run: ./mvnw com.github.spotbugs:spotbugs-maven-plugin:4.9.8.1:check -B
        continue-on-error: true

      # ---------------------------------------------------------------------
      # Everything below is PULL-REQUEST ONLY, and must stay that way.
      #
      # This job imports coverage for the CHANGED modules only (that is all the
      # selective `build-test` run produces) while indexing the WHOLE reactor for
      # analysis. Sonar's Zero Coverage Sensor then scores every module that was
      # not tested at 0%. On a pull request that is harmless — PR analyses are
      # stored against the PR, `Coverage on New Code` only looks at changed files,
      # and the branch measures are untouched.
      #
      # On a push to main it was catastrophic: the analysis published to the `main`
      # branch and overwrote the nightly aggregate's real number with the changed
      # modules' share of the reactor. Run 32130372863 (merge of #1363, touching
      # pos-order + pos-workorder) logged `Importing 2 report(s).` for a 37-module
      # reactor and dropped main from 78.0% to 14.9% — 10,622 covered lines out of
      # 84,981, i.e. exactly those two modules. The project had been sawtoothing
      # like that on every push since May.
      #
      # Main-branch coverage now comes from ONE place: the `code-quality-full` job
      # below, which measures the whole reactor through pos-coverage-aggregate.
      # ---------------------------------------------------------------------
      - name: Cache SonarCloud packages
        if: github.event_name == 'pull_request' && env.SONAR_TOKEN != ''
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Download JaCoCo coverage reports
        if: github.event_name == 'pull_request' && env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: jacoco-coverage-*
          path: sonar-coverage

      - name: Report downloaded coverage reports
        if: github.event_name == 'pull_request' && env.SONAR_TOKEN != ''
        # This job runs `test-compile` only, so the sole source of coverage is the
        # artifact downloaded above; if it is empty the scan silently reports 0%.
        # Warn rather than fail: when selective testing skips every module, an empty
        # artifact is the correct outcome and must not break the gate.
        run: |
          # The download step is continue-on-error and creates nothing when no artifact
          # matches, so sonar-coverage may not exist. Without this mkdir, `find` exits 1
          # and -eo pipefail fails the step — the opposite of the warn-only intent.
          mkdir -p sonar-coverage
          count=$(find sonar-coverage -name jacoco.xml | wc -l)
          echo "Downloaded ${count} JaCoCo report(s) for coverage import."
          if [[ "${count}" -eq 0 ]]; then
            echo "::warning::No JaCoCo reports downloaded; SonarCloud will report no coverage for this analysis."
          else
            find sonar-coverage -name jacoco.xml | sed 's/^/  /'
          fi

      - name: Announce a missing SonarCloud token
        if: github.event_name == 'pull_request' && env.SONAR_TOKEN == ''
        # A fork PR is handed no secrets, and a tokenless `sonar:sonar` pays for a full
        # test-compile over the reactor before dying on authentication. The steps below
        # skip instead — but say so out loud, because a silently skipped analysis looks
        # exactly like a clean one on the checks list.
        run: echo "::warning::SONAR_TOKEN unavailable (fork pull request?); SonarCloud analysis skipped for this PR."

      - name: SonarCloud Scan (pull requests only)
        if: github.event_name == 'pull_request' && env.SONAR_TOKEN != ''
        # Stopgap: PR-mode analysis currently fails at PR decoration because SonarCloud cannot
        # resolve the pull request via its GitHub App / DevOps-platform binding ("Something went
        # wrong while trying to get the pullrequest with key 'N'"). Until that binding is fixed in
        # SonarCloud, do not let a PR-decoration failure fail this check. The authoritative
        # branch-level quality gate is the `code-quality-full` job below.
        #
        # The analysis is forced into PR mode with the four `sonar.pullrequest.*` properties.
        # Never let this fall back to a branch analysis: without them the scanner auto-detects a
        # branch and publishes partial coverage over it, which is the regression described in the
        # block above.
        #
        # xmlReportPaths must be absolute: the scanner resolves a relative value against each
        # Maven module's own base directory, so `sonar-coverage/**` only ever matched from the
        # root module and every other module imported nothing. The per-module
        # `**/target/site/jacoco/jacoco.xml` entry that used to follow it was dead weight here —
        # this job runs `test-compile` with -DskipTests, so no module produces a local report and
        # the downloaded artifact is the only coverage that exists.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # SONAR_TOKEN is inherited from the job-level env above.
          # Event data is passed via env vars, never interpolated into the script:
          # head.ref is attacker-controlled on fork PRs (script injection).
          PR_KEY: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ./mvnw test-compile org.sonarsource.scanner.maven:sonar-maven-plugin:${{ env.SONAR_MAVEN_PLUGIN_VERSION }}:sonar \
            -DskipTests -DskipITs \
            -Dsonar.projectKey=louisburroughs_durion-positivity-backend \
            -Dsonar.organization=louisburroughs \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=${{ github.workspace }}/sonar-coverage/**/jacoco.xml \
            -Dsonar.pullrequest.key="${PR_KEY}" \
            -Dsonar.pullrequest.branch="${PR_BRANCH}" \
            -Dsonar.pullrequest.base="${PR_BASE}" \
            -Dsonar.scm.revision="${PR_HEAD_SHA}"

  code-quality-full:
    name: Full Coverage SonarCloud Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The ONLY job that publishes a branch-level SonarCloud analysis. It measures the
    # whole reactor through pos-coverage-aggregate, so main's coverage is the real
    # number rather than whichever modules a push happened to touch (see the long
    # comment in `code-quality`). Nightly on the schedule; `workflow_dispatch` is here
    # so main can be refreshed on demand instead of waiting for 06:00 UTC — useful
    # right after a coverage push, or to repair main if a stray analysis lands on it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set Maven revision
        run: printf -- "-Drevision=0.1.%s-SNAPSHOT\n-Dmaven.build.cache.enabled=false\n" "${GITHUB_SHA::7}" > .mvn/maven.config

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Cache Maven wrapper binary
        uses: actions/cache@v5
        with:
          path: ~/.m2/wrapper
          key: ${{ runner.os }}-maven-wrapper-${{
            hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Cache SonarCloud packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build aggregate coverage report and run SonarCloud
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # This `verify` on the -am reactor takes the domain modules through package, where
        # spring-boot:repackage swaps their jars for fat jars whose classes hide under
        # BOOT-INF/classes. pos-archunit's cross-module rules (and ClasspathVisibilityGuardTest)
        # would then see nothing and fail (#909), exactly as in the integration-tests job. Skip
        # pos-archunit's tests here (-Darchunit.skipTests=true): it has no production code so it
        # adds no coverage, and its rules are enforced at the `test` phase in the per-module
        # unit/integration jobs.
        #
        # Coverage import uses `aggregateXmlReportPaths`, not `xmlReportPaths`: the latter is the
        # per-module property, and the scanner resolves a *relative* value against each Maven
        # module's own base directory. Every non-root module therefore looked for
        # `<module>/pos-coverage-aggregate/target/site/jacoco-aggregate/jacoco.xml`, found nothing,
        # and fell back to its own `target/site/jacoco/jacoco.xml` — losing exactly the
        # cross-module coverage the aggregate report exists to capture. The path is absolute
        # (github.workspace) so it resolves identically from every module.
        #
        # The coverage ratchet runs here with -Djacoco.check.haltOnFailure=false. With the
        # default (true) the reactor stops at the first module under its floor, so a single
        # regression hid every other module's result *and* skipped the SonarCloud upload, because
        # the sonar goal is bound to the aggregate module that depends on all of them. Reporting
        # one offender per nightly run turns a ten-minute fix into a ten-day queue. The gate is
        # not weakened: JaCoCo still evaluates every rule and logs each violation, and the step
        # below fails the job with the complete list.
        run: |
          set -o pipefail
          ./mvnw -pl ${{ env.COVERAGE_AGGREGATE_MODULE }} -am -DskipITs -Darchunit.skipTests=true verify -T 1C -B \
            -Djacoco.check.haltOnFailure=false \
            org.sonarsource.scanner.maven:sonar-maven-plugin:${{ env.SONAR_MAVEN_PLUGIN_VERSION }}:sonar \
            -Dsonar.projectKey=louisburroughs_durion-positivity-backend \
            -Dsonar.organization=louisburroughs \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.aggregateXmlReportPaths=${{ github.workspace }}/${{ env.COVERAGE_AGGREGATE_XML_PATH }} \
            2>&1 | tee "$RUNNER_TEMP/full-coverage.log"

      # The floors this step enforces live in each module's pom.xml and MUST be
      # derived from a `-DskipITs` run, because that is what the build step above
      # runs. Floors derived from an IT-inclusive measurement describe coverage
      # this job cannot see, which silently eats the cushion and leaves modules
      # failing on run-to-run noise. See docs/TEST_COVERAGE_IMPROVEMENT_PLAN.md §6.1.
      - name: Enforce the coverage ratchet across every module
        if: always()
        run: |
          LOG="$RUNNER_TEMP/full-coverage.log"
          if [ ! -f "$LOG" ]; then
            echo "::error::Coverage log missing — the build step did not run to completion."
            exit 1
          fi

          # JaCoCo emits one "Rule violated for bundle <module>: <counter> covered ratio is X,
          # but expected minimum is Y" per breach. Collect them all rather than the first.
          grep -F 'Rule violated for bundle' "$LOG" | sed 's/^\[WARNING\] *//; s/^\[ERROR\] *//' \
            | sort -u > "$RUNNER_TEMP/coverage-violations.txt" || true

          if [ ! -s "$RUNNER_TEMP/coverage-violations.txt" ]; then
            echo "Coverage ratchet: every module met its floor."
            exit 0
          fi

          # One module can breach both counters, so violations and modules are different
          # counts. Report both: the module count is what says how much work this is, the
          # violation count is what you tick off.
          VIOLATIONS=$(wc -l < "$RUNNER_TEMP/coverage-violations.txt")
          sed 's/^Rule violated for bundle \([^:]*\):.*/\1/' "$RUNNER_TEMP/coverage-violations.txt" \
            | sort -u > "$RUNNER_TEMP/coverage-modules.txt"
          MODULES=$(wc -l < "$RUNNER_TEMP/coverage-modules.txt")

          {
            echo "## Coverage ratchet: $MODULES module(s) below floor, $VIOLATIONS violation(s)"
            echo
            echo '```'
            cat "$RUNNER_TEMP/coverage-violations.txt"
            echo '```'
            echo
            echo "Modules: $(paste -sd, "$RUNNER_TEMP/coverage-modules.txt" | sed 's/,/, /g')"
            echo
            echo "Floors live in each module's pom.xml (jacoco.line.min / jacoco.branch.min)."
            echo "See docs/TEST_COVERAGE_IMPROVEMENT_PLAN.md §6 for how they are set."
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r line; do echo "::error::$line"; done < "$RUNNER_TEMP/coverage-violations.txt"
          echo "Coverage ratchet failed for $MODULES module(s) ($VIOLATIONS violation(s)); see the job summary."
          exit 1

      - name: Enforce coverage floor drift
        # The ratchet step above only catches a module falling BELOW its floor.
        # Nothing caught a floor that had fallen behind the module, and floors
        # were hand-edited, so §6.2's "raise a module's floor when its coverage
        # rises" was advice with no enforcement. Measured at the time this step
        # was added, the reactor's floors permitted ~3,400 covered lines and ~970
        # covered branches to disappear — about four points of overall coverage —
        # without one build turning red.
        #
        # This runs on the same `verify -DskipITs` output the ratchet reads, and
        # for the same reason: floors derived from any other measurement describe
        # coverage the gate cannot reproduce (§6.1). It reads each module's OWN
        # target/site/jacoco/jacoco.csv, never the aggregate, because that is what
        # jacoco:check evaluates.
        #
        # Fix a failure with `scripts/update-coverage-floors.sh --apply` after a
        # local -DskipITs build, then commit the poms.
        if: always()
        run: |
          set -o pipefail
          if scripts/check-coverage-floor-drift.sh 2>&1 | tee "$RUNNER_TEMP/floor-drift.log"; then
            exit 0
          fi
          {
            echo "## Coverage floor drift"
            echo
            echo '```'
            cat "$RUNNER_TEMP/floor-drift.log"
            echo '```'
            echo
            echo "Re-derive the floors after a -DskipITs build:"
            echo '```'
            echo "./mvnw -pl pos-coverage-aggregate -am verify -DskipITs -Darchunit.skipTests=true -T 1C"
            echo "scripts/update-coverage-floors.sh --apply"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Upload aggregate JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-coverage-aggregate
          path: ${{ env.COVERAGE_AGGREGATE_XML_PATH }}
          if-no-files-found: error
          retention-days: 7

  integration-test:
    name: Integration Tests with Docker Compose
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [build-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      POSTGRES_USER: positivity
      POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
      POSTGRES_DB: positivity
      SPRING_DATASOURCE_USERNAME: positivity
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
      SECURITY_JWT_SECRET: ci-jwt-secret-key-0123456789abcdef0123456789
      SECURITY_SEED_ADMIN_PASSWORD_HASH: ${{ secrets.CI_SEED_ADMIN_PASSWORD_HASH }}
      STRIPE_API_KEY: sk_test_ci_placeholder_key
      POS_ACCOUNTING_CREDIT_MEMO_REVENUE_ACCOUNT_ID: 11111111-1111-1111-1111-111111111111
      POS_ACCOUNTING_CREDIT_MEMO_TAX_PAYABLE_ACCOUNT_ID: 22222222-2222-2222-2222-222222222222
      POS_ACCOUNTING_CREDIT_MEMO_AR_ACCOUNT_ID: 33333333-3333-3333-3333-333333333333
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      POS_EVENTS_API_SECRET: ci-events-secret
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set Maven revision
        run: printf -- "-Drevision=0.1.%s-SNAPSHOT\n-Dmaven.build.cache.enabled=false\n" "${GITHUB_SHA::7}" > .mvn/maven.config

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Maven wrapper binary
        uses: actions/cache@v5
        with:
          path: ~/.m2/wrapper
          key: ${{ runner.os }}-maven-wrapper-${{
            hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Restore reactor build cache
        # Supersedes setup-java's dependency cache here: it contains the external
        # dependencies plus the internal modules build-test installed.
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-reactor-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-maven-reactor-

      - name: Package smoke-test services
        # Only the services this smoke test actually starts (plus their in-repo
        # dependencies via -am) — not the whole reactor (G3). Internal deps build
        # from source in-reactor, so this is correct even when build-test's
        # selective install didn't cover these modules.
        run: ./mvnw package -pl
          pos-service-discovery,pos-security-service,pos-api-gateway -am -DskipTests
          -DskipITs -T 1C -B

      - name: Detect Docker Compose command
        run: |
          if docker compose version >/dev/null 2>&1; then
            echo "COMPOSE_CMD=docker compose" >> "$GITHUB_ENV"
          elif command -v docker-compose >/dev/null 2>&1; then
            echo "COMPOSE_CMD=docker-compose" >> "$GITHUB_ENV"
          else
            echo "Docker Compose is not available on this runner."
            exit 1
          fi

      - name: Start services with Docker Compose
        run: |
          BASE_SERVICES="postgres eureka-server"
          APP_SERVICES="pos-security-service pos-api-gateway"

          echo "Starting base smoke-test services: $BASE_SERVICES"
          $COMPOSE_CMD up -d $BASE_SERVICES

          echo "Starting application smoke-test services without transitive dependencies: $APP_SERVICES"
          $COMPOSE_CMD up -d --no-deps $APP_SERVICES

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for Eureka to be ready..."
          timeout 300 bash -c 'until curl -sf http://localhost:8761/actuator/health; do sleep 5; done'
          echo "Waiting for API Gateway to be ready..."
          timeout 300 bash -c 'until curl -sf http://localhost:8080/actuator/health; do sleep 5; done'

      - name: Run smoke tests
        run: |
          # Test Eureka
          curl -f http://localhost:8761/actuator/health || exit 1
          # Test API Gateway
          curl -f http://localhost:8080/actuator/health || exit 1
          echo "Smoke tests passed!"

      - name: Show service logs on failure
        if: failure()
        run: $COMPOSE_CMD logs

      - name: Shut down services
        if: always()
        run: $COMPOSE_CMD down -v

  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs:
      [
        build-test,
        security-scan,
        docker-build,
        docker-build-matrix,
        code-quality,
        code-quality-full,
      ]
    # !cancelled() matters: always() deliberately runs a job even when the workflow run
    # was cancelled, so without it a run superseded by the next push to the same branch
    # reports this check as a build failure on an intermediate commit that never failed
    # (issue #1755).
    if: always() && !cancelled() && github.event_name != 'schedule'

    steps:
      - name: Check build status
        run: |
          # Report what actually happened rather than treating every non-success alike.
          # 'skipped' is a legitimate outcome: this workflow builds only changed modules
          # and their dependents, so a run with no matching changes never runs build-test.
          case "${{ needs.build-test.result }}" in
            success) echo "Build succeeded!" ;;
            skipped) echo "Build skipped - no changed modules matched." ;;
            *)       echo "Build ${{ needs.build-test.result }}!"; exit 1 ;;
          esac
      # Uncomment to enable Slack notifications
      # - name: Send Slack notification
      #   if: always()
      #   uses: 8398a7/action-slack@v3
      #   with:
      #     status: ${{ job.status }}
      #     text: 'Backend CI/CD Pipeline'
      #     webhook_url: ${{ secrets.SLACK_WEBHOOK }}
