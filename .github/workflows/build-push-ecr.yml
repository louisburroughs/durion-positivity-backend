name: Build and Push to ECR

on:
  push:
    branches: [main]
    paths:
      - "pos-*/**"
      - "pom.xml"
      - "docker-compose.yml"
      - "deployment/alpha/docker-compose.prod.yml"
      - ".github/workflows/build-push-ecr.yml"
  workflow_dispatch:
    inputs:
      deploy_alpha:
        description: "Deploy to alpha EC2 after pushing images"
        required: false
        default: false
        type: boolean

concurrency:
  group: ecr-push-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  JAVA_VERSION: "25"
  JAVA_DISTRIBUTION: temurin
  MAVEN_OPTS: -Xmx3072m

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Build all JARs with Maven and upload as a shared artifact
  # ─────────────────────────────────────────────────────────────────────────
  build-jars:
    name: Maven Package (all modules)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Build all JARs (skip tests — tested separately in ci.yml)
        run: ./mvnw package -B -DskipTests -q

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: "**/target/*.jar"
          retention-days: 1
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Build and push one Docker image per service (parallel matrix)
  # ─────────────────────────────────────────────────────────────────────────
  push-images:
    name: Push ${{ matrix.service }}
    needs: build-jars
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read

    strategy:
      fail-fast: false
      matrix:
        service:
          - pos-accounting
          - pos-api-gateway
          - pos-catalog
          - pos-customer
          - pos-event-receiver
          - pos-image
          - pos-inventory
          - pos-invoice
          - pos-location
          - pos-mcp-server
          - pos-people
          - pos-price
          - pos-security-service
          - pos-service-discovery
          - pos-shop-manager
          - pos-vehicle-inventory
          - pos-workorder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR artifacts
        uses: actions/download-artifact@v4
        with:
          name: service-jars

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="sha-${SHORT_SHA}"
          SERVICE="${{ matrix.service }}"
          # Some services publish to repository names that differ from the module directory.
          case "$SERVICE" in
            pos-service-discovery)
              ECR_REPO_NAME="durion/eureka-server"
              ;;
            *)
              ECR_REPO_NAME="durion/${SERVICE}"
              ;;
          esac
          FULL_IMAGE="${{ steps.login-ecr.outputs.registry }}/${ECR_REPO_NAME}:${IMAGE_TAG}"
          LATEST_IMAGE="${{ steps.login-ecr.outputs.registry }}/${ECR_REPO_NAME}:latest"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "full_image=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "latest_image=${LATEST_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Image: ${FULL_IMAGE}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.full_image }}
            ${{ steps.meta.outputs.latest_image }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Write a deployment summary after all images are pushed
  # ─────────────────────────────────────────────────────────────────────────
  deployment-summary:
    name: Deployment Summary
    needs: push-images
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Write summary
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="sha-${SHORT_SHA}"

          echo "## Backend Images Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All service images pushed with tag: \`${IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | ECR Repository |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for SERVICE in \
            pos-accounting pos-api-gateway pos-catalog pos-customer \
            pos-event-receiver pos-image pos-inventory pos-invoice \
            pos-location pos-mcp-server pos-people pos-price pos-security-service \
            pos-service-discovery pos-shop-manager pos-vehicle-inventory pos-workorder; do
            case "$SERVICE" in
              pos-service-discovery)
                ECR_REPO_NAME="durion/eureka-server"
                ;;
              *)
                ECR_REPO_NAME="durion/${SERVICE}"
                ;;
            esac
            echo "| \`${SERVICE}\` | \`${ECR_REPO_NAME}:${IMAGE_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Use \`${IMAGE_TAG}\` as **BACKEND_TAG** in \`docker-compose.prod.yml\` for deployment." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-alpha:
    name: Deploy Backend to Alpha
    needs: [push-images, deployment-summary]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    if: >
      success() &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.deploy_alpha) ||
        vars.AUTO_DEPLOY_ALPHA == 'true'
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload compose files to S3
        run: |
          aws s3 cp docker-compose.yml s3://${{ secrets.ALPHA_DEPLOY_BUCKET }}/alpha/backend/docker-compose.yml
          aws s3 cp deployment/alpha/docker-compose.prod.yml s3://${{ secrets.ALPHA_DEPLOY_BUCKET }}/alpha/docker-compose.prod.yml

      - name: Pull compose files on alpha host
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.ALPHA_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["aws s3 cp s3://${{ secrets.ALPHA_DEPLOY_BUCKET }}/alpha/backend/docker-compose.yml /opt/durion/alpha/backend/docker-compose.yml","aws s3 cp s3://${{ secrets.ALPHA_DEPLOY_BUCKET }}/alpha/docker-compose.prod.yml /opt/durion/alpha/docker-compose.prod.yml"]}' \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.ALPHA_EC2_INSTANCE_ID }}"

      - name: Deploy backend services on alpha host
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.ALPHA_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[\"SECURITY_SEED_ADMIN_PASSWORD_HASH='${{ secrets.SECURITY_SEED_ADMIN_PASSWORD_HASH }}' bash /opt/durion/alpha/scripts/deploy-backend.sh '${{ github.sha }}'\"]}" \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.ALPHA_EC2_INSTANCE_ID }}"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.ALPHA_EC2_INSTANCE_ID }}" \
            --query "[StandardOutputContent,StandardErrorContent]" \
            --output text

      - name: _deploy_script_placeholder
        run: echo "deploy script runs on the instance — see below"
        # The inline script block below is kept as reference for the on-instance deploy script.
        # Move this to /opt/durion/alpha/scripts/deploy-backend.sh on the EC2 instance.
        # Script receives: $1=GITHUB_SHA, env: SECURITY_SEED_ADMIN_PASSWORD_HASH
        if: false
        # script: |
            set -euo pipefail

            ALPHA_ROOT="/opt/durion/alpha"
            BACKEND_DIR="${ALPHA_ROOT}/backend"
            ENV_FILE="${ALPHA_ROOT}/.env"
            PROD_OVERRIDE="${ALPHA_ROOT}/docker-compose.prod.yml"
            IMAGE_TAG="sha-${GITHUB_SHA::7}"
            BACKEND_SERVICES=(
              eureka-server
              pos-accounting
              pos-api-gateway
              pos-catalog
              pos-customer
              pos-event-receiver
              pos-image
              pos-inventory
              pos-invoice
              pos-location
              pos-mcp-server
              pos-people
              pos-price
              pos-security-service
              pos-shop-manager
              pos-vehicle-inventory
              pos-workorder
            )

            if grep -q '^BACKEND_TAG=' "${ENV_FILE}"; then
              sed -i "s/^BACKEND_TAG=.*/BACKEND_TAG=${IMAGE_TAG}/" "${ENV_FILE}"
            else
              printf '\nBACKEND_TAG=%s\n' "${IMAGE_TAG}" >> "${ENV_FILE}"
            fi

            if [[ -z "${SECURITY_SEED_ADMIN_PASSWORD_HASH:-}" ]]; then
              echo "SECURITY_SEED_ADMIN_PASSWORD_HASH is required for seeded admin password migration."
              exit 1
            fi

            if grep -q '^SECURITY_SEED_ADMIN_PASSWORD_HASH=' "${ENV_FILE}"; then
              sed -i "s|^SECURITY_SEED_ADMIN_PASSWORD_HASH=.*|SECURITY_SEED_ADMIN_PASSWORD_HASH=${SECURITY_SEED_ADMIN_PASSWORD_HASH}|" "${ENV_FILE}"
            else
              printf 'SECURITY_SEED_ADMIN_PASSWORD_HASH=%s\n' "${SECURITY_SEED_ADMIN_PASSWORD_HASH}" >> "${ENV_FILE}"
            fi

            # Ensure ECR_REGISTRY is present in .env (derived from the EC2 instance role).
            ECR_REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.us-east-1.amazonaws.com"
            if grep -q '^ECR_REGISTRY=' "${ENV_FILE}"; then
              sed -i "s|^ECR_REGISTRY=.*|ECR_REGISTRY=${ECR_REGISTRY}|" "${ENV_FILE}"
            else
              printf 'ECR_REGISTRY=%s\n' "${ECR_REGISTRY}" >> "${ENV_FILE}"
            fi

            cd "${BACKEND_DIR}"

            COMPOSE_ARGS=(
              -f docker-compose.yml
              -f "${PROD_OVERRIDE}"
              --env-file "${ENV_FILE}"
            )

            DESIRED_POSTGRES_IMAGE="$(
              docker compose "${COMPOSE_ARGS[@]}" config \
                | sed -n '/^  postgres:/,/^[^ ]/p' \
                | awk '/image:/ {print $2; exit}'
            )"
            CURRENT_POSTGRES_CONTAINER_ID="$(docker compose "${COMPOSE_ARGS[@]}" ps -q postgres 2>/dev/null || true)"
            CURRENT_POSTGRES_IMAGE=""

            if [[ -n "${CURRENT_POSTGRES_CONTAINER_ID}" ]]; then
              CURRENT_POSTGRES_IMAGE="$(docker inspect -f '{{.Config.Image}}' "${CURRENT_POSTGRES_CONTAINER_ID}" 2>/dev/null || true)"
            fi

            if [[ -n "${DESIRED_POSTGRES_IMAGE}" && "${CURRENT_POSTGRES_IMAGE}" != "${DESIRED_POSTGRES_IMAGE}" ]]; then
              echo "Reconciling postgres image: current='${CURRENT_POSTGRES_IMAGE:-<none>}' desired='${DESIRED_POSTGRES_IMAGE}'"
              docker compose \
                "${COMPOSE_ARGS[@]}" \
                pull postgres

              docker compose \
                "${COMPOSE_ARGS[@]}" \
                up -d --force-recreate postgres
            fi

            docker compose \
              "${COMPOSE_ARGS[@]}" \
              pull "${BACKEND_SERVICES[@]}"

            docker compose \
              "${COMPOSE_ARGS[@]}" \
              up -d --force-recreate "${BACKEND_SERVICES[@]}"

            docker compose \
              "${COMPOSE_ARGS[@]}" \
              ps
