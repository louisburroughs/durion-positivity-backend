name: Build and Push to ECR

# Promotes the JARs that passed CI instead of rebuilding from source
# (BACKEND_BUILD_SPEC.md §4.6): runs after a successful "Backend CI/CD"
# main-push run and downloads its service-jars artifact, so the image
# contains the tested bytes and a red CI run can never race a green ECR
# push for the same commit.
on:
  workflow_run:
    workflows: ["Backend CI/CD"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_alpha:
        description: "Deploy to alpha EC2 after pushing images"
        required: false
        default: false
        type: boolean

concurrency:
  group: ecr-push-backend-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  JAVA_VERSION: "25"
  JAVA_DISTRIBUTION: temurin
  MAVEN_OPTS: -Xmx3072m
  # The commit being shipped: the CI run's head for workflow_run events,
  # the current ref for manual dispatches. github.sha would be the default
  # branch head at event time, which can race ahead of the tested commit.
  BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Detect which services need image builds
  # ─────────────────────────────────────────────────────────────────────────
  detect-services:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    # Promote only successful CI runs for pushes to main; manual dispatch
    # keeps working as a full rebuild-and-push.
    if: github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    outputs:
      services: ${{ steps.detect.outputs.services }}
      modules-csv: ${{ steps.detect.outputs.modules-csv }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
      all-services: ${{ steps.detect.outputs.all-services }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.BUILD_SHA }}

      - name: Detect services to build
        id: detect
        run: |
          set -euo pipefail

          ALL_SERVICES_JSON='["pos-accounting","pos-api-gateway","pos-bulk-loader","pos-catalog","pos-customer","pos-documents","pos-event-receiver","pos-image","pos-inventory","pos-invoice","pos-location","pos-marketing","pos-mcp-server","pos-people","pos-people-contact","pos-price","pos-security-service","pos-service-discovery","pos-shop-manager","pos-tax","pos-vehicle-inventory","pos-warranty","pos-workorder"]'
          echo "all-services=${ALL_SERVICES_JSON}" >> "$GITHUB_OUTPUT"
          FORCE_FULL_REBUILD=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            FORCE_FULL_REBUILD=true
          fi

          if [[ "${{ vars.AUTO_DEPLOY_ALPHA }}" == "true" ]]; then
            # Alpha deploy uses a single BACKEND_TAG for the whole stack, so all images
            # must exist for the commit tag whenever auto-deploy is enabled.
            FORCE_FULL_REBUILD=true
          fi

          if [[ "${FORCE_FULL_REBUILD}" == "true" ]]; then
            SERVICES_JSON="${ALL_SERVICES_JSON}"
            MODULES_CSV="$(jq -r 'join(",")' <<< "${SERVICES_JSON}")"
            echo "services=${SERVICES_JSON}" >> "$GITHUB_OUTPUT"
            echo "modules-csv=${MODULES_CSV}" >> "$GITHUB_OUTPUT"
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
            echo "Full rebuild required: ${SERVICES_JSON}"
            exit 0
          fi

          # workflow_run events carry no push before/after pair; diff the shipped
          # commit against its first parent. Squash-merged PRs (the norm here) are
          # one commit, so this covers the whole change; a rare multi-commit push
          # can under-select, and AUTO_DEPLOY_ALPHA=true or a manual dispatch
          # forces the full set regardless.
          DIFF_HEAD="${BUILD_SHA}"
          DIFF_BASE="$(git rev-parse "${DIFF_HEAD}~1")"

          CHANGED_FILES="$(git diff --name-only "${DIFF_BASE}" "${DIFF_HEAD}" || true)"

          if echo "${CHANGED_FILES}" | grep -Eq '^(pom\.xml|docker-compose\.yml|postgres/.*|deployment/alpha/docker-compose\.prod\.yml|\.github/workflows/build-push-ecr\.yml)$'; then
            SERVICES_JSON="${ALL_SERVICES_JSON}"
            MODULES_CSV="$(jq -r 'join(",")' <<< "${SERVICES_JSON}")"
            echo "services=${SERVICES_JSON}" >> "$GITHUB_OUTPUT"
            echo "modules-csv=${MODULES_CSV}" >> "$GITHUB_OUTPUT"
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
            echo "Shared build/deploy file changed: ${SERVICES_JSON}"
            exit 0
          fi

          SERVICES_JSON="$(
            echo "${CHANGED_FILES}" \
              | grep '^pos-' || true \
          )"

          SERVICES_JSON="$(
            echo "${SERVICES_JSON}" \
              | cut -d'/' -f1 \
              | sort -u \
              | while read -r module; do
                  [[ -n "${module}" && -f "${module}/Dockerfile" ]] && echo "${module}"
                done \
              | jq -R -s -c 'split("\n")[:-1]'
          )"

          if [[ "${SERVICES_JSON}" == "[]" ]]; then
            echo "services=[]" >> "$GITHUB_OUTPUT"
            echo "modules-csv=" >> "$GITHUB_OUTPUT"
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
            echo "No containerized service changes detected"
          else
            MODULES_CSV="$(jq -r 'join(",")' <<< "${SERVICES_JSON}")"
            echo "services=${SERVICES_JSON}" >> "$GITHUB_OUTPUT"
            echo "modules-csv=${MODULES_CSV}" >> "$GITHUB_OUTPUT"
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
            echo "Changed services: ${SERVICES_JSON}"
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Collect the tested JARs from the triggering CI run (spec §4.6);
  # build from source only what the artifact is missing (or on dispatch).
  # ─────────────────────────────────────────────────────────────────────────
  build-jars:
    name: Collect tested JARs
    needs: detect-services
    if: needs.detect-services.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # cross-run artifact download from the CI workflow run

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_SHA }}

      - name: Download tested JARs from CI run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: service-jars
          path: ci-jars
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Stage tested JARs, list missing services
        id: stage
        run: |
          set -euo pipefail
          rm -rf artifact-jars
          MISSING=()
          for service in $(jq -r '.[]' <<< '${{ needs.detect-services.outputs.services }}'); do
            JAR_PATH="$(find ci-jars -type f -path "*/${service}/target/*.jar" 2>/dev/null | head -n 1 || true)"
            if [[ -n "${JAR_PATH}" ]]; then
              mkdir -p "artifact-jars/${service}/target"
              cp "${JAR_PATH}" "artifact-jars/${service}/target/"
              echo "tested JAR: ${service}"
            else
              MISSING+=("${service}")
              echo "missing from CI artifact: ${service}"
            fi
          done
          MISSING_CSV="$(IFS=,; echo "${MISSING[*]-}")"
          echo "missing-csv=${MISSING_CSV}" >> "$GITHUB_OUTPUT"

      - name: Set Maven revision
        if: steps.stage.outputs.missing-csv != ''
        run: printf -- "-Drevision=0.1.%s-SNAPSHOT\n-Dmaven.build.cache.enabled=false\n" "${GITHUB_SHA::7}" > .mvn/maven.config

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        if: steps.stage.outputs.missing-csv != ''
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Build missing JARs from source (fallback)
        if: steps.stage.outputs.missing-csv != ''
        run: |
          set -euo pipefail
          ./mvnw -pl "${{ steps.stage.outputs.missing-csv }}" -am package -B -DskipTests -T 1C -q
          for service in $(tr ',' ' ' <<< "${{ steps.stage.outputs.missing-csv }}"); do
            mkdir -p "artifact-jars/${service}/target"
            find "${service}/target" -maxdepth 1 -name '*.jar' ! -name '*.jar.original' \
              -exec cp {} "artifact-jars/${service}/target/" \;
          done

      - name: Store JAR artifacts
        uses: actions/upload-artifact@v6
        with:
          name: service-jars
          path: artifact-jars
          retention-days: 1
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Build and push one Docker image per selected service (parallel matrix)
  # ─────────────────────────────────────────────────────────────────────────
  push-images:
    name: Push ${{ matrix.service }}
    needs: [detect-services, build-jars]
    if: needs.detect-services.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-services.outputs.services) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_SHA }}

      - name: Download JAR artifacts
        uses: actions/download-artifact@v5
        with:
          name: service-jars
          path: downloaded-jars

      - name: Restore service JAR
        run: |
          set -euo pipefail
          mkdir -p "${{ matrix.service }}/target"
          JAR_PATH="$(
            find downloaded-jars -type f \
              -path "*/${{ matrix.service }}/target/*.jar" \
              ! -name '*.jar.original' \
              | head -n 1
          )"

          if [[ -z "${JAR_PATH}" ]]; then
            echo "Could not locate a staged JAR for ${{ matrix.service }}"
            find downloaded-jars -maxdepth 4 -print | sort
            exit 1
          fi

          cp "${JAR_PATH}" "${{ matrix.service }}/target/"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Set image metadata
        id: meta
        run: |
          SHORT_SHA="${BUILD_SHA::7}"
          IMAGE_TAG="sha-${SHORT_SHA}"
          SERVICE="${{ matrix.service }}"
          # Some services publish to repository names that differ from the module directory.
          case "$SERVICE" in
            pos-service-discovery)
              ECR_REPO_NAME="durion/eureka-server"
              ;;
            *)
              ECR_REPO_NAME="durion/${SERVICE}"
              ;;
          esac
          FULL_IMAGE="${{ steps.login-ecr.outputs.registry }}/${ECR_REPO_NAME}:${IMAGE_TAG}"
          LATEST_IMAGE="${{ steps.login-ecr.outputs.registry }}/${ECR_REPO_NAME}:latest"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "full_image=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "latest_image=${LATEST_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Image: ${FULL_IMAGE}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.full_image }}
            ${{ steps.meta.outputs.latest_image }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4: Write a deployment summary after selected images are pushed
  # ─────────────────────────────────────────────────────────────────────────
  deployment-summary:
    name: Deployment Summary
    needs: [detect-services, push-images]
    runs-on: ubuntu-latest
    if: needs.detect-services.outputs.has-changes == 'true' && success()

    steps:
      - name: Write summary
        run: |
          set -euo pipefail

          SHORT_SHA="${BUILD_SHA::7}"
          IMAGE_TAG="sha-${SHORT_SHA}"
          SERVICE_COUNT="$(jq 'length' <<< '${{ needs.detect-services.outputs.services }}')"
          # Derived from the canonical list in detect-services so it can't go stale
          # when services are added or removed.
          FULL_SERVICE_COUNT="$(jq 'length' <<< '${{ needs.detect-services.outputs.all-services }}')"

          echo "## Backend Images Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Published image tag: \`${IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | ECR Repository |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for SERVICE in $(jq -r '.[]' <<< '${{ needs.detect-services.outputs.services }}'); do
            case "$SERVICE" in
              pos-service-discovery)
                ECR_REPO_NAME="durion/eureka-server"
                ;;
              *)
                ECR_REPO_NAME="durion/${SERVICE}"
                ;;
            esac
            echo "| \`${SERVICE}\` | \`${ECR_REPO_NAME}:${IMAGE_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${SERVICE_COUNT}" -eq "${FULL_SERVICE_COUNT}" ]]; then
            echo "This run published the full backend service set. Use \`${IMAGE_TAG}\` as **BACKEND_TAG** in \`docker-compose.prod.yml\` for deployment." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "This run published only changed services. Unchanged services were not retagged to \`${IMAGE_TAG}\`, so this tag is not valid for whole-stack deployment." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${BUILD_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-alpha:
    name: Deploy Backend to Alpha
    needs: [push-images, deployment-summary]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    if: >
      success() &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.deploy_alpha) ||
        vars.AUTO_DEPLOY_ALPHA == 'true'
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_SHA }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload compose files to S3
        run: |
          aws s3 cp docker-compose.yml s3://${{ vars.ALPHA_DEPLOY_BUCKET }}/alpha/backend/docker-compose.yml
          aws s3 cp deployment/alpha/docker-compose.prod.yml s3://${{ vars.ALPHA_DEPLOY_BUCKET }}/alpha/docker-compose.prod.yml
          aws s3 cp deployment/alpha/deploy-backend.sh s3://${{ vars.ALPHA_DEPLOY_BUCKET }}/alpha/scripts/deploy-backend.sh
          aws s3 cp postgres/init-databases.sql s3://${{ vars.ALPHA_DEPLOY_BUCKET }}/alpha/backend/postgres/init-databases.sql
          # Observability config (#863): ship the whole tree as one object so the
          # host pull needs only s3:GetObject (EC2-SSM-Role lacks s3:ListBucket).
          tar czf observability.tgz observability
          aws s3 cp observability.tgz s3://${{ vars.ALPHA_DEPLOY_BUCKET }}/alpha/backend/observability.tgz

      - name: Pull compose files on alpha host
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.ALPHA_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["mkdir -p /opt/durion/alpha/backend/postgres /opt/durion/alpha/scripts","aws s3 cp s3://${{ vars.ALPHA_DEPLOY_BUCKET }}/alpha/backend/docker-compose.yml /opt/durion/alpha/backend/docker-compose.yml","aws s3 cp s3://${{ vars.ALPHA_DEPLOY_BUCKET }}/alpha/docker-compose.prod.yml /opt/durion/alpha/docker-compose.prod.yml","aws s3 cp s3://${{ vars.ALPHA_DEPLOY_BUCKET }}/alpha/scripts/deploy-backend.sh /opt/durion/alpha/scripts/deploy-backend.sh","chmod +x /opt/durion/alpha/scripts/deploy-backend.sh","aws s3 cp s3://${{ vars.ALPHA_DEPLOY_BUCKET }}/alpha/backend/postgres/init-databases.sql /opt/durion/alpha/backend/postgres/init-databases.sql","aws s3 cp s3://${{ vars.ALPHA_DEPLOY_BUCKET }}/alpha/backend/observability.tgz /opt/durion/alpha/backend/observability.tgz","rm -rf /opt/durion/alpha/backend/observability","tar xzf /opt/durion/alpha/backend/observability.tgz -C /opt/durion/alpha/backend/","rm -f /opt/durion/alpha/backend/observability.tgz"]}' \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.ALPHA_EC2_INSTANCE_ID }}"

      - name: Deploy backend services on alpha host
        env:
          SECURITY_SEED_ADMIN_PASSWORD_HASH: ${{ secrets.SECURITY_SEED_ADMIN_PASSWORD_HASH }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.ALPHA_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[\"SECURITY_SEED_ADMIN_PASSWORD_HASH='${SECURITY_SEED_ADMIN_PASSWORD_HASH}' bash /opt/durion/alpha/scripts/deploy-backend.sh '${{ env.BUILD_SHA }}'\"]}" \
            --timeout-seconds 2700 \
            --query "Command.CommandId" --output text)
          echo "SSM Command ID: $COMMAND_ID"
          for i in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.ALPHA_EC2_INSTANCE_ID }}" \
              --query "Status" --output text)
            echo "[$i/180] Status: $STATUS"
            if [[ "$STATUS" == "Success" ]]; then break; fi
            if [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ vars.ALPHA_EC2_INSTANCE_ID }}" \
                --query "[StandardOutputContent,StandardErrorContent]" \
                --output text
              exit 1
            fi
            sleep 15
          done
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.ALPHA_EC2_INSTANCE_ID }}" \
            --query "[StandardOutputContent,StandardErrorContent]" \
            --output text

      - name: Dump Docker logs on deploy failure
        if: failure()
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.ALPHA_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["echo \"=== Container Status ===\"","docker ps -a --format \"table {{.Names}}\t{{.Status}}\t{{.Ports}}\" 2>/dev/null || true","echo \"\"","echo \"=== Unhealthy / Exited Container Logs (last 200 lines each) ===\"","for cid in $({ docker ps -a --filter \"status=exited\" --filter \"status=dead\" -q; docker ps -a --filter \"health=unhealthy\" -q; } 2>/dev/null | sort -u); do name=$(docker inspect --format \"{{.Name}}\" \"$cid\" | sed \"s|^/||\"); echo \"--- $name ---\"; docker logs --tail 200 --timestamps \"$cid\" 2>&1; echo \"\"; done","echo \"=== Recently Restarting Containers (restart count > 0) ===\"","for cid in $(docker ps -q 2>/dev/null); do rc=$(docker inspect --format \"{{.RestartCount}}\" \"$cid\"); if [ \"$rc\" -gt 0 ] 2>/dev/null; then name=$(docker inspect --format \"{{.Name}}\" \"$cid\" | sed \"s|^/||\"); echo \"--- $name (restarts: $rc) ---\"; docker logs --tail 200 --timestamps \"$cid\" 2>&1; echo \"\"; fi; done"]}' \
            --timeout-seconds 120 \
            --query "Command.CommandId" --output text)
          echo "SSM Command ID (log dump): $COMMAND_ID"
          for i in $(seq 1 16); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.ALPHA_EC2_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i/16] Log dump status: $STATUS"
            if [[ "$STATUS" == "Success" || "$STATUS" == "Failed" || "$STATUS" == "TimedOut" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ vars.ALPHA_EC2_INSTANCE_ID }}" \
                --query "[StandardOutputContent,StandardErrorContent]" \
                --output text
              break
            fi
            sleep 10
          done
