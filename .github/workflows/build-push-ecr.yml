name: Build and Push to ECR

on:
  push:
    branches: [main]
    paths:
      - "pos-*/**"
      - "pom.xml"
      - "docker-compose.yml"
      - "deployment/alpha/docker-compose.prod.yml"
      - ".github/workflows/build-push-ecr.yml"
  workflow_dispatch:
    inputs:
      deploy_alpha:
        description: "Deploy to alpha EC2 after pushing images"
        required: false
        default: false
        type: boolean

concurrency:
  group: ecr-push-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  JAVA_VERSION: "25"
  JAVA_DISTRIBUTION: temurin
  MAVEN_OPTS: -Xmx3072m

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Build all JARs with Maven and upload as a shared artifact
  # ─────────────────────────────────────────────────────────────────────────
  build-jars:
    name: Maven Package (all modules)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Build all JARs (skip tests — tested separately in ci.yml)
        run: ./mvnw package -B -DskipTests -q

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: "**/target/*.jar"
          retention-days: 1
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Build and push one Docker image per service (parallel matrix)
  # ─────────────────────────────────────────────────────────────────────────
  push-images:
    name: Push ${{ matrix.service }}
    needs: build-jars
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read

    strategy:
      fail-fast: false
      matrix:
        service:
          - pos-accounting
          - pos-api-gateway
          - pos-catalog
          - pos-customer
          - pos-event-receiver
          - pos-image
          - pos-inventory
          - pos-invoice
          - pos-location
          - pos-mcp-server
          - pos-people
          - pos-price
          - pos-security-service
          - pos-service-discovery
          - pos-shop-manager
          - pos-vehicle-inventory
          - pos-workorder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR artifacts
        uses: actions/download-artifact@v4
        with:
          name: service-jars

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="sha-${SHORT_SHA}"
          SERVICE="${{ matrix.service }}"
          # Some services publish to repository names that differ from the module directory.
          case "$SERVICE" in
            pos-service-discovery)
              ECR_REPO_NAME="durion/eureka-server"
              ;;
            *)
              ECR_REPO_NAME="durion/${SERVICE}"
              ;;
          esac
          FULL_IMAGE="${{ steps.login-ecr.outputs.registry }}/${ECR_REPO_NAME}:${IMAGE_TAG}"
          LATEST_IMAGE="${{ steps.login-ecr.outputs.registry }}/${ECR_REPO_NAME}:latest"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "full_image=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "latest_image=${LATEST_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Image: ${FULL_IMAGE}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.full_image }}
            ${{ steps.meta.outputs.latest_image }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Write a deployment summary after all images are pushed
  # ─────────────────────────────────────────────────────────────────────────
  deployment-summary:
    name: Deployment Summary
    needs: push-images
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Write summary
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="sha-${SHORT_SHA}"

          echo "## Backend Images Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All service images pushed with tag: \`${IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | ECR Repository |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for SERVICE in \
            pos-accounting pos-api-gateway pos-catalog pos-customer \
            pos-event-receiver pos-image pos-inventory pos-invoice \
            pos-location pos-mcp-server pos-people pos-price pos-security-service \
            pos-service-discovery pos-shop-manager pos-vehicle-inventory pos-workorder; do
            case "$SERVICE" in
              pos-service-discovery)
                ECR_REPO_NAME="durion/eureka-server"
                ;;
              *)
                ECR_REPO_NAME="durion/${SERVICE}"
                ;;
            esac
            echo "| \`${SERVICE}\` | \`${ECR_REPO_NAME}:${IMAGE_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Use \`${IMAGE_TAG}\` as **BACKEND_TAG** in \`docker-compose.prod.yml\` for deployment." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-alpha:
    name: Deploy Backend to Alpha
    needs: [push-images, deployment-summary]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    if: >
      success() &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.deploy_alpha) ||
        vars.AUTO_DEPLOY_ALPHA == 'true'
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload compose files to S3
        run: |
          aws s3 cp docker-compose.yml s3://${{ vars.ALPHA_DEPLOY_BUCKET }}/alpha/backend/docker-compose.yml
          aws s3 cp deployment/alpha/docker-compose.prod.yml s3://${{ vars.ALPHA_DEPLOY_BUCKET }}/alpha/docker-compose.prod.yml

      - name: Pull compose files on alpha host
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.ALPHA_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["aws s3 cp s3://${{ vars.ALPHA_DEPLOY_BUCKET }}/alpha/backend/docker-compose.yml /opt/durion/alpha/backend/docker-compose.yml","aws s3 cp s3://${{ vars.ALPHA_DEPLOY_BUCKET }}/alpha/docker-compose.prod.yml /opt/durion/alpha/docker-compose.prod.yml"]}' \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.ALPHA_EC2_INSTANCE_ID }}"

      - name: Deploy backend services on alpha host
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.ALPHA_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[\"SECURITY_SEED_ADMIN_PASSWORD_HASH='${{ secrets.SECURITY_SEED_ADMIN_PASSWORD_HASH }}' bash /opt/durion/alpha/scripts/deploy-backend.sh '${{ github.sha }}'\"]}" \
            --timeout-seconds 900 \
            --query "Command.CommandId" --output text)
          echo "SSM Command ID: $COMMAND_ID"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.ALPHA_EC2_INSTANCE_ID }}" \
              --query "Status" --output text)
            echo "[$i/60] Status: $STATUS"
            if [[ "$STATUS" == "Success" ]]; then break; fi
            if [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ vars.ALPHA_EC2_INSTANCE_ID }}" \
                --query "[StandardOutputContent,StandardErrorContent]" \
                --output text
              exit 1
            fi
            sleep 15
          done
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.ALPHA_EC2_INSTANCE_ID }}" \
            --query "[StandardOutputContent,StandardErrorContent]" \
            --output text
