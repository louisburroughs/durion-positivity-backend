name: PR Checks

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  MAVEN_OPTS: -Xmx3072m

jobs:
  detect-changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.changed.outputs.modules }}
      has-changes: ${{ steps.changed.outputs.has-changes }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Detect changed modules
        id: changed
        run: |
          # Get changed files between base and head
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Extract unique module names
          CHANGED_MODULES=$(echo "$CHANGED_FILES" | grep '^pos-' | cut -d'/' -f1 | sort -u | tr '\n' ',' | sed 's/,$//')
          
          if [ -z "$CHANGED_MODULES" ]; then
            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "modules=" >> $GITHUB_OUTPUT
          else
            echo "has-changes=true" >> $GITHUB_OUTPUT
            echo "modules=$CHANGED_MODULES" >> $GITHUB_OUTPUT
          fi
          
          echo "Changed modules: $CHANGED_MODULES"

  build-changed-modules:
    name: Build Changed Modules
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
      
      - name: Build changed modules and dependencies
        run: |
          IFS=',' read -ra MODULES <<< "${{ needs.detect-changes.outputs.modules }}"
          for module in "${MODULES[@]}"; do
            echo "Building module: $module"
            ./mvnw clean install -pl "$module" -am -B -DskipTests -DskipITs
          done
      
      - name: Test changed modules
        run: |
          IFS=',' read -ra MODULES <<< "${{ needs.detect-changes.outputs.modules }}"
          for module in "${MODULES[@]}"; do
            echo "Testing module: $module"
            ./mvnw test -pl "$module" -B
          done

  validate-dockerfile:
    name: Validate Dockerfiles
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install hadolint
        run: |
          wget -O /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint
      
      - name: Lint Dockerfiles
        run: |
          IFS=',' read -ra MODULES <<< "${{ needs.detect-changes.outputs.modules }}"
          for module in "${MODULES[@]}"; do
            if [ -f "$module/Dockerfile" ]; then
              echo "Linting Dockerfile for $module"
              hadolint "$module/Dockerfile" || true
            fi
          done

  pr-comment:
    name: PR Summary Comment
    runs-on: ubuntu-latest
    needs: [detect-changes, build-changed-modules]
    if: always()
    permissions:
      pull-requests: write
    
    steps:
      - name: Create PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const modules = '${{ needs.detect-changes.outputs.modules }}';
            const buildStatus = '${{ needs.build-changed-modules.result }}';
            
            let comment = '## 🔍 PR Analysis\n\n';
            
            if (!modules) {
              comment += '✅ No backend modules were modified in this PR.\n';
            } else {
              comment += '### Changed Modules\n';
              comment += modules.split(',').map(m => `- \`${m}\``).join('\n');
              comment += '\n\n### Build Status\n';
              
              if (buildStatus === 'success') {
                comment += '✅ All changed modules built and tested successfully!\n';
              } else if (buildStatus === 'failure') {
                comment += '❌ Build or tests failed for changed modules. Please review the logs.\n';
              } else {
                comment += '⏭️  Build was skipped or not applicable.\n';
              }
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
