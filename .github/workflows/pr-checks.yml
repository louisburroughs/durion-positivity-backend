name: PR Checks

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'
  MAVEN_OPTS: -Xmx3072m

jobs:
  detect-changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.changed.outputs.modules }}
      has-changes: ${{ steps.changed.outputs.has-changes }}
      full-reactor: ${{ steps.changed.outputs.full-reactor }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed modules
        id: changed
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          DETECTION="$(./scripts/ci/detect-modules.sh "origin/${{ github.base_ref }}" HEAD)"
          echo "Detection: ${DETECTION}"

          FULL_REACTOR="$(jq -r '.full_reactor' <<< "${DETECTION}")"
          if [[ "${FULL_REACTOR}" == "true" ]]; then
            # A full-reactor change (root pom, .mvn/**, BOM, ci.yml, compose)
            # affects every module: the detection's module list is empty by
            # contract, so lint every containerized module's Dockerfile.
            CHANGED_MODULES="$(ls -d pos-*/ | cut -d'/' -f1 | paste -sd, -)"
          else
            CHANGED_MODULES="$(jq -r '.modules | join(",")' <<< "${DETECTION}")"
          fi

          echo "full-reactor=${FULL_REACTOR}" >> $GITHUB_OUTPUT
          if [ -z "$CHANGED_MODULES" ]; then
            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "modules=" >> $GITHUB_OUTPUT
          else
            echo "has-changes=true" >> $GITHUB_OUTPUT
            echo "modules=$CHANGED_MODULES" >> $GITHUB_OUTPUT
          fi

          echo "Changed modules: $CHANGED_MODULES"

  # Note: Build and test are now handled by ci.yml to avoid duplication.
  # This workflow focuses on PR-specific checks and reporting.

  validate-dockerfile:
    name: Validate Dockerfiles
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Install hadolint
        run: |
          # --https-only refuses to follow any redirect to a non-HTTPS URL, so the
          # binary can only ever be fetched over TLS. (Sonar secrets/redirect hotspot)
          # GitHub release assets are served via one HTTPS redirect to
          # release-assets.githubusercontent.com, so cap redirects at 2 instead of
          # disallowing them entirely (which made every download fail with exit 8).
          wget --https-only --max-redirect=2 -O /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint
      
      - name: Lint Dockerfiles
        run: |
          IFS=',' read -ra MODULES <<< "${{ needs.detect-changes.outputs.modules }}"
          for module in "${MODULES[@]}"; do
            if [ -f "$module/Dockerfile" ]; then
              echo "Linting Dockerfile for $module"
              hadolint "$module/Dockerfile" || true
            fi
          done

  validate-permissions:
    name: Validate Permission Catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        # Pin the exact version (locks the resolved dependency graph; PyYAML has no
        # runtime deps) and force pre-built wheels only, so no arbitrary setup.py /
        # build script runs during install. (Sonar githubactions:S8541, S8544)
        run: |
          pip install --only-binary=:all: 'pyyaml==6.0.2'

      - name: Check @PreAuthorize permissions are registered in the catalog
        run: |
          # Fails if any @PreAuthorize permission is missing from PermissionCode /
          # GatewayPermissionCatalog / DownstreamPermissionCatalog. Run
          # `scripts/generate-permissions.sh --sync` locally and commit the result
          # (note: a catalog change bumps CATALOG_VERSION = fleet-coordinated deploy).
          scripts/generate-permissions.sh --sync --check

      - name: Check RBAC authorization drift (audit-rbac.py --check)
        # Fails on NEW disagreement between what's granted (seed), required
        # (contract/@PreAuthorize/code), registered (permissions.yaml) and
        # bit-indexed (PermissionCode) -- the #1494/#1499/#1512 defect class.
        # Documented, accepted exceptions live in scripts/rbac-audit-baseline.json;
        # a stale entry there (no longer drifting) also fails the build, so the
        # baseline stays reviewable instead of accumulating dead lines. Uses only
        # the Python standard library -- no extra install needed here.
        run: |
          python3 scripts/audit-rbac.py --check

      - name: Check MCP facade tool contracts (check-mcp-facade-paths.py)
        # Fails when a pos-mcp-server facade @Tool would call an endpoint (verb +
        # gateway-routed path, or the pos-tax direct route) that no module's
        # openapi.yaml publishes -- the #1519 defect class. Known pre-existing
        # breaks live in scripts/mcp-facade-paths-baseline.json and are burned
        # down by the #1519 restoration waves; only NEW breaks fail this step.
        # Stdlib only, no build, no database.
        run: |
          python3 scripts/check-mcp-facade-paths.py --baseline scripts/mcp-facade-paths-baseline.json

      - name: Analytics gate runner unit tests (test_analytics_gate_run.py)
        # The gate runner decides whether a run is valid at all: it decodes the caller's role from
        # the bearer token and refuses to start for the wrong actor (#1706). Two runs on
        # 2026-09-04 scored 0/12 and 2/12 purely because of the actor, and produced complete,
        # plausible-looking records that said nothing about it.
        #
        # Those tests existed but nothing ran them, so the pins they carry -- including that the
        # expected role matches the actor the corpus README documents, and that the token never
        # reaches run.json or an abort message -- were pins no job evaluated. Stdlib only, no
        # build, no network, no database.
        run: |
          python3 -m unittest scripts.test_analytics_gate_run

  pr-comment:
    name: PR Summary Comment
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: always()
    permissions:
      pull-requests: write
    
    steps:
      - name: Create PR comment
        uses: actions/github-script@v8
        with:
          script: |
            const modules = '${{ needs.detect-changes.outputs.modules }}';
            const fullReactor = '${{ needs.detect-changes.outputs.full-reactor }}' === 'true';

            let comment = '## 🔍 PR Analysis\n\n';

            if (fullReactor) {
              comment += '🔄 Build-wide change (root pom / `.mvn` / BOM / CI config): **all modules** are affected and the full reactor will be tested.\n';
            } else if (!modules) {
              comment += '✅ No backend modules were modified in this PR.\n';
            } else {
              comment += '### Changed Modules\n';
              comment += modules.split(',').map(m => `- \`${m}\``).join('\n');
              comment += '\n\n_Build and test status will be reported by the main CI workflow._\n';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
