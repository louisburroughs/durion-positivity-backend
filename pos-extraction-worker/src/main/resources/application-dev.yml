# Local JVM: a scratch directory that exists, Eureka on localhost, details visible.
pos:
  extraction-worker:
    scratch-dir: ${java.io.tmpdir}/extraction-worker-scratch

server:
  port: 0

management:
  server:
    port: 0
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}
