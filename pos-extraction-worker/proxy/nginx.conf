# extraction-proxy (CAP:550 S26): the only listener pos-accounting reaches. It forwards the worker API
# path to the worker and nothing else, so a compromised parser on extraction-net has no route to
# pos-accounting itself (S26 review finding 2). Runs read-only as the unprivileged nginx user.
pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server_tokens off;
    client_max_body_size 26m;
    # Uploads stream straight through: the proxy keeps no copy of a bill file.
    proxy_request_buffering off;
    proxy_buffering off;
    # Deadline (30 s inspect/render, 120 s extract) plus margin.
    proxy_read_timeout 130s;
    proxy_send_timeout 60s;

    server {
        listen 8080;

        location /extraction-worker/v1/ {
            # Resolved when nginx starts: the worker is up first (depends_on).
            proxy_pass http://pos-extraction-worker:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }
}
