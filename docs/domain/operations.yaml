  # ---------------------------------------------------------------------------
  # Frontend-driven operations (durion-positivity-frontend, Angular 21)
  #
  # Added: 2026-07-17 (Phase 1 extension - frontend scope added to sre.config.yaml
  # context.frontend / context.frontend_root). Source state: greenfield
  # (see docs/domain/brownfield-assessment.md "Frontend" section).
  #
  # These operations represent genuinely frontend-only CUJs (aggregation/board
  # views, multi-step UI wizards) that do not correspond 1:1 to a single already
  # -cataloged backend operation above. `telemetry.semanticConvention: frontend`
  # marks these as browser/RUM spans, not backend HTTP-handler spans, so
  # downstream instrumentation agents route them to the OTel Web SDK / Faro
  # (Phase 3b), never the Java agent. Where a frontend operation is fulfilled by
  # an existing backend operation cataloged above, we link via
  # `downstream[].operation` instead of re-cataloging it here (e.g. order-cart,
  # estimate-approval, and NLTI chat flows already have Tier-1/2 backend
  # operations under order-management / work-order-execution / genai-assistant
  # and are intentionally NOT duplicated).
