    tier: 1
    lifecycle:
      state: active
      since: "2026-07-17"
      owner: order-eng
    entrypoints:
      - type: http
        method: POST
        path: /v1/orders/carts
    telemetry:
      spans:
        business_span: Create Sales Order
        recipe: http-handler
      metric_prefix: create_sales_order_cart
      histogram_buckets: tier-1
    instrumentation:
      state: preserve
      agent: otel-java-agent
      agent_version: "v2.9.0"
      resource_config: env-vars
    downstream:
      - service: pos-customer
        criticality: critical
      - service: pos-price
        criticality: medium
    data_entities:
      - SalesOrder
    slis:
      - id: create-sales-order-cart-availability
        type: availability
        recipe: success-rate
        description: Ratio of successful cart creations to total attempts.
      - id: create-sales-order-cart-latency
        type: latency
        recipe: p95-latency
        threshold_ms: 2000
        description: 95th percentile latency to create a sales order cart.
    slos:
      - sli: create-sales-order-cart-availability
        target: 0.999
        window: 30d
      - sli: create-sales-order-cart-latency
        target: 0.99
        window: 30d

