spring:
  application:
    name: workorder
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: 0

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    org:
      springframework: INFO
    com:
      positivity:
        workorder: INFO
      netflix:
        discovery:
          shared:
            resolver:
              aws:
                ConfigClusterResolver: WARN
# workorder:
#   statemachine:
#     audit:
#       enabled: true
#     snapshot:
#       enabled: true
#       captureOnStart: true
#       captureOnComplete: true
#     autoStart:
#       onFirstLaborEntry: false
springdoc:
  packages-to-scan: com.positivity.workorder
  paths-to-match: /v1/workorders/**, /v1/workexec/**
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

  default-produces-media-type: application/json
pos:
  gateway:
    base-url: ${POS_GATEWAY_BASE_URL:http://api-gateway}
  customer:
    base-url: ${POS_CUSTOMER_BASE_URL:http://api-gateway}
  vehicle:
    base-url: ${POS_VEHICLE_BASE_URL:http://pos-vehicle:8088}
  tax:
    base-url: ${POS_TAX_BASE_URL:http://pos-tax:8091}
  invoice:
    base-url: ${POS_INVOICE_BASE_URL:http://api-gateway}
  inventory:
    base-url: ${POS_INVENTORY_BASE_URL:http://api-gateway}
  people:
    base-url: ${POS_PEOPLE_BASE_URL:http://api-gateway}
  shopmgr:
    base-url: ${POS_SHOPMGR_BASE_URL:http://api-gateway}
  documents:
    base-url: ${POS_DOCUMENTS_BASE_URL:http://pos-documents:8080}

workorder:
  kafka:
    enabled: ${WORKORDER_KAFKA_ENABLED:false}
    events-topic: ${WORKORDER_KAFKA_EVENTS_TOPIC:workorder.events.v1}
    commands-topic: ${WORKORDER_KAFKA_COMMANDS_TOPIC:workorder.commands.v1}
    consumer-group: ${WORKORDER_KAFKA_CONSUMER_GROUP:${spring.application.name}-commands}
