spring:
  application:
    name: workorder
  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: 0
  tomcat:
    max-http-header-size: 65536

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    org:
      springframework: INFO
    com:
      positivity:
        workorder: INFO
      netflix:
        discovery:
          shared:
            resolver:
              aws:
                ConfigClusterResolver: WARN
# workorder:
#   statemachine:
#     audit:
#       enabled: true
#     snapshot:
#       enabled: true
#       captureOnStart: true
#       captureOnComplete: true
#     autoStart:
#       onFirstLaborEntry: false
springdoc:
  packages-to-scan: com.positivity.workorder
  paths-to-match: /v1/workorders/**, /v1/workexec/**
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

  default-produces-media-type: application/json
pos:
  customer:
    service-id: ${POS_CUSTOMER_SERVICE_ID:customer}
  tax:
    base-url: ${POS_TAX_BASE_URL:http://pos-tax:8091}
  people:
    service-id: ${POS_PEOPLE_SERVICE_ID:people}
  documents:
    service-id: ${POS_DOCUMENTS_SERVICE_ID:documents}

workorder:
  fleetauth:
    # How long a job's held resources (a technician assignment) survive an unresolved fleet
    # payment authorization before they are released. Configurable because the domain ruled retry,
    # timeout and escalation rules differ by deployment -- a shop with tight bay capacity wants a
    # short grace period, one with slack wants a long one.
    resource-release-after: ${WORKORDER_FLEETAUTH_RESOURCE_RELEASE_AFTER:PT4H}
    resource-release-interval-ms: ${WORKORDER_FLEETAUTH_RESOURCE_RELEASE_INTERVAL_MS:900000}
    resource-release-batch-size: ${WORKORDER_FLEETAUTH_RESOURCE_RELEASE_BATCH_SIZE:50}
  kafka:
    enabled: ${WORKORDER_KAFKA_ENABLED:false}
    # Fleet payment authorization (#1346): decisions from pos-supplier, vehicle identity from
    # pos-vehicle-inventory (ADR-0044 R3), and the delayed release of resources held by a job
    # blocked on an unresolved authorization.
    supplier-events-topic: ${WORKORDER_SUPPLIER_EVENTS_TOPIC:supplier.events.v1}
    supplier-events-consumer-group: ${WORKORDER_SUPPLIER_EVENTS_CONSUMER_GROUP:pos-workorder-supplier-events}
    vehicle-events-topic: ${WORKORDER_VEHICLE_EVENTS_TOPIC:vehicle.events.v1}
    vehicle-events-consumer-group: ${WORKORDER_VEHICLE_EVENTS_CONSUMER_GROUP:pos-workorder-vehicle-events}
    events-topic: ${WORKORDER_KAFKA_EVENTS_TOPIC:workorder.events.v1}
    # People replicas (ADR-0044 §6, #877)
    people-contact-events-topic: ${WORKORDER_PC_EVENTS_TOPIC:people-contact.events.v1}
    people-contact-events-consumer-group: ${WORKORDER_PC_EVENTS_CONSUMER_GROUP:pos-workorder-people-contact-events}
    people-events-topic: ${WORKORDER_PEOPLE_EVENTS_TOPIC:people.events.v1}
    people-events-consumer-group: ${WORKORDER_PEOPLE_EVENTS_CONSUMER_GROUP:pos-workorder-people-events}
    # Customer-party replica feed + reconciliation (ADR-0044 §6, #891)
    customer-events-topic: ${WORKORDER_CUSTOMER_EVENTS_TOPIC:customer.events.v1}
    customer-events-consumer-group: ${WORKORDER_CUSTOMER_EVENTS_CONSUMER_GROUP:pos-workorder-customer-events}
    customer-manifest-topic: ${WORKORDER_CUSTOMER_MANIFEST_TOPIC:customer.manifest.v1}
    customer-manifest-consumer-group: ${WORKORDER_CUSTOMER_MANIFEST_CONSUMER_GROUP:pos-workorder-customer-manifests}
    customer-commands-topic: ${WORKORDER_CUSTOMER_COMMANDS_TOPIC:customer.commands.v1}
    # Location replica feed + reconciliation (ADR-0044 §6, #892)
    location-events-topic: ${WORKORDER_LOCATION_EVENTS_TOPIC:location.events.v1}
    location-events-consumer-group: ${WORKORDER_LOCATION_EVENTS_CONSUMER_GROUP:pos-workorder-location-events}
    location-manifest-topic: ${WORKORDER_LOCATION_MANIFEST_TOPIC:location.manifest.v1}
    location-manifest-consumer-group: ${WORKORDER_LOCATION_MANIFEST_CONSUMER_GROUP:pos-workorder-location-manifests}
    location-commands-topic: ${WORKORDER_LOCATION_COMMANDS_TOPIC:location.commands.v1}
    # Pick replica feed + async pick commands (ADR-0044 §4/§6, #901)
    inventory-events-topic: ${WORKORDER_INVENTORY_EVENTS_TOPIC:inventory.events.v1}
    inventory-events-consumer-group: ${WORKORDER_INVENTORY_EVENTS_CONSUMER_GROUP:pos-workorder-inventory-events}
    inventory-manifest-topic: ${WORKORDER_INVENTORY_MANIFEST_TOPIC:inventory.manifest.v1}
    inventory-manifest-consumer-group: ${WORKORDER_INVENTORY_MANIFEST_CONSUMER_GROUP:pos-workorder-inventory-manifests}
    inventory-commands-topic: ${WORKORDER_INVENTORY_COMMANDS_TOPIC:inventory.commands.v1}
    # Invoice replica feed + async generation commands (ADR-0044 §4/§6, #900)
    invoice-events-topic: ${WORKORDER_INVOICE_EVENTS_TOPIC:invoice.events.v1}
    invoice-events-consumer-group: ${WORKORDER_INVOICE_EVENTS_CONSUMER_GROUP:pos-workorder-invoice-events}
    invoice-manifest-topic: ${WORKORDER_INVOICE_MANIFEST_TOPIC:invoice.manifest.v1}
    invoice-manifest-consumer-group: ${WORKORDER_INVOICE_MANIFEST_CONSUMER_GROUP:pos-workorder-invoice-manifests}
    invoice-commands-topic: ${WORKORDER_INVOICE_COMMANDS_TOPIC:invoice.commands.v1}
    # Catalog product replica feed (ADR-0044 §6, ADR-0055, #1413): the per-product base
    # unit-of-measure precision scale that decides whether a part quantity may carry decimals.
    catalog-events-topic: ${WORKORDER_CATALOG_EVENTS_TOPIC:catalog.events.v1}
    catalog-events-consumer-group: ${WORKORDER_CATALOG_EVENTS_CONSUMER_GROUP:pos-workorder-catalog-events}
    # Order settlement finalize-back feed (odoo-parity E3, #1084): completing a workorder-linked
    # order transitions the workorder to COMPLETED via its own state machine.
    order-events-topic: ${WORKORDER_ORDER_EVENTS_TOPIC:order.events.v1}
    order-events-consumer-group: ${WORKORDER_ORDER_EVENTS_CONSUMER_GROUP:pos-workorder-order-events}
    command-send-timeout-ms: ${WORKORDER_COMMAND_SEND_TIMEOUT_MS:10000}
    commands-topic: ${WORKORDER_KAFKA_COMMANDS_TOPIC:workorder.commands.v1}
    consumer-group: ${WORKORDER_KAFKA_CONSUMER_GROUP:${spring.application.name}-commands}
  # Reconciliation manifests (ADR-0044, one summary per closed window of the fact topic)
  manifest:
    topic: ${WORKORDER_MANIFEST_TOPIC:workorder.manifest.v1}
    window: ${WORKORDER_MANIFEST_WINDOW:PT1H}
    grace: ${WORKORDER_MANIFEST_GRACE:PT5M}
    poll-interval-ms: ${WORKORDER_MANIFEST_POLL_INTERVAL_MS:300000}
    send-timeout-ms: ${WORKORDER_MANIFEST_SEND_TIMEOUT_MS:10000}
