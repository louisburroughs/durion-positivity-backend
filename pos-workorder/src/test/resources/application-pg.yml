# Testcontainers Postgres profile (ADR-0062, plan R-B7): the real Flyway chain (V1 baseline .. Vn),
# Hibernate validate, strict tenancy (nothing binds a tenant unless the test does). The datasource
# is supplied at runtime: PostgresTenancyTestBase connects the pool as pos_app with Flyway on the
# owner (@DynamicPropertySource); FlywayMigrationIT (#711) uses @ServiceConnection as the owner.
spring:
  application:
    name: pos-workorder-pg-test
  autoconfigure:
    exclude: org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
  cloud:
    discovery:
      enabled: false
  main:
    allow-bean-definition-overriding: true

pos:
  tenancy:
    # strict: nothing binds a tenant unless the test does
    default-tenant-id:

workorder:
  kafka:
    enabled: false

# Disable security for tests
security:
  enabled: false

eureka:
  client:
    enabled: false

logging:
  level:
    com.positivity: INFO
    org.hibernate.SQL: warn
