spring:
  application:
    name: pos-workorder-test
  datasource:
    # MODE=PostgreSQL restored. This profile file shadows application.yml in the same directory,
    # which sets it; dropping the mode here silently put every test on the "test" profile onto plain
    # H2 dialect while the base config, this module's dev profile and production are all Postgres.
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
  h2:
    console:
      enabled: false
  main:
    allow-bean-definition-overriding: true

# Disable security for tests
security:
  enabled: false

# Disable eureka for tests  
eureka:
  client:
    enabled: false


# Logging
logging:
  level:
    com:
      positivity: DEBUG
    org:
      springframework:
        security: DEBUG

# Test contexts never reach pos-security-service or pos-event-receiver. Skip permission registration
# (its startup retry loop otherwise sleeps ~8 s in every Spring test context) and point the event-type
# initializer at a loopback port that refuses instantly. Same arrangement as pos-mcp-server's test profile.
pos.security.permission-registration.enabled: false
pos.events.base-url: http://127.0.0.1:1
