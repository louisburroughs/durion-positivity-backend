spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:h2:mem:workorder_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Use simple logger for tests
logging:
  level:
    root: INFO
    com.positivity.workorder: DEBUG
    org.hibernate.SQL: INFO

# Stub properties for pos-tax test mode
pos:
  tax:
    test-mode:
      enabled: true
