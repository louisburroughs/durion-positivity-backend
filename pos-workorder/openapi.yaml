      summary: Create a change request
      description: Technician creates a request for additional work beyond authorized
        scope. Items are marked as PENDING_APPROVAL until advisor approves. Requires
        description and at least one service or part item. Supports idempotent creation
        via Idempotency-Key header to prevent duplicate change requests.
      operationId: createChangeRequest
      parameters:
      - name: workorderId
        in: path
        description: ID of the work order
