      - technicianId
    SuggestSubstitutesRequest:
      type: object
      description: Request to scope workorder substitute suggestions to a specific part
      properties:
        partId:
          type: string
          format: uuid
          description: Identifier of the part (product) on the workorder to suggest substitutes for; omit for workorder-wide suggestions
          example: 01960003-0000-7000-8000-000000000001
    SubstituteLinkResponse:
      type: object
      description: A substitute-part link associating a product with an approved substitute
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the substitute link
          example: 0196cf6f-c8dd-7ee0-93e7-f48a5698a535
        productId:
          type: string
          format: uuid
          description: Identifier of the product the substitute applies to
          example: 2c018664-dfea-46ef-a838-6b9dbf8f9b1d
        substitutePartId:
          type: string
          format: uuid
          description: Identifier of the substitute part
          example: 01960003-0000-7000-8000-000000000001
        substituteType:
          type: string
          description: Type of substitution relationship
          enum:
          - EQUIVALENT
          - APPROVED_ALTERNATIVE
          - UPGRADE
          - DOWNGRADE
          example: EQUIVALENT
        priority:
          type: integer
          format: int32
          description: Ordering priority of this substitute among alternatives (lower is preferred)
          example: 1
        version:
          type: integer
          format: int32
          description: Version for optimistic locking
          example: 0
        createdBy:
          type: string
          description: Identifier of the user who created the link
          example: system
        updatedBy:
          type: string
          description: Identifier of the user who last updated the link
          example: system
        active:
          type: boolean
        autoSuggest:
          type: boolean
        isAutoSuggest:
          type: boolean
          description: Whether this substitute is automatically suggested during picking
          example: true
        isActive:
          type: boolean
          description: Whether this substitute link is currently active
          example: true
      required:
      - id
      - isActive
      - isAutoSuggest
      - priority
      - productId
      - substitutePartId
      - substituteType
      - version
    StartWorkorderRequest:
