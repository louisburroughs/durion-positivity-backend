      description: 'Checks a scanned SKU and location against a pick task''s expected SKU and location, returning matched plus a matchStatus of MATCHED, SKU_MISMATCH, LOCATION_MISMATCH, or NO_MATCH.

        Use this tool to validate a barcode scan before confirmPickLine; it performs no confirmation itself, so do not treat a match as a recorded pick.

