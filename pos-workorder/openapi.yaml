            examples:
              Two ids:
                description: Two ids
                value:
                  workorderIds:
                  - 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a11
                  - 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a12
        required: true
      responses:
        '200':
          description: Resolved workorder id-to-number pairings returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkorderNumberRef'
