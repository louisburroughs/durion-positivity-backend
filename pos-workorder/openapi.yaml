      - bearerAuth:
        - workorder:parts:add
      x-required-permissions:
      - workorder:parts:add
  /v1/workorders/{workorderId}/parts/consume:
    post:
      tags:
      - Workorder Parts Usage
      summary: Record Part Consumption on Workorder
      description: 'Records actual consumption of an issued part, incrementing the line''s quantityConsumed and writing a CONSUME usage event.

        Use this tool when a part is actually installed on the vehicle; do not use issueParts, which only reserves quantity, or returnParts, which sends unused quantity back.

        Preconditions: the part must belong to the workorder and cumulative consumption must not exceed the quantity already issued.

        Required inputs: workorderId (UUID) as a path parameter, plus workorderPartId (UUID) and a positive quantity in the body; an Idempotency-Key header makes retries return the original usage event.

        Emits a WORKORDER_PART_CONSUME event and marks the workorder fact changed.

        Returns 201 with the CONSUME event, 400 when the quantity is not positive, exceeds the issued quantity, or the part cannot be found, 404 when the workorder does not exist, and 409 when the part belongs to a different workorder.

