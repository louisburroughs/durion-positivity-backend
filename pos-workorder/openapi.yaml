        status:
          type: string
          default: "##default"
          description: Service line status
          enum:
          - PENDING_APPROVAL
          - OPEN
          - READY_TO_EXECUTE
          - IN_PROGRESS
          - COMPLETED
          - CANCELLED
          example: OPEN
        quantity:
          type: number
          default: "##default"
          description: Authorized quantity (hours for labor)
