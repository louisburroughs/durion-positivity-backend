  /v1/workorders/{workorderId}/parts/substitute:
    post:
      tags:
      - Workorder Part Adjustments
      summary: Substitute Part on Workorder
      description: 'Substitutes one part line with a different part, preserving the original line for audit history, capturing a pricing snapshot, and recording a substitution adjustment event.

        Use this tool when the planned part is replaced by an alternative; use suggestWorkorderSubstitutes first to find candidate parts, and do not use correctPartQuantity, which fixes quantities rather than parts.

