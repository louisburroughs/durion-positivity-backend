        laborTotal:
          type: number
          description: Total labor cost (conditionally included)
          example: 425.0
        partsTotal:
          type: number
          description: Total parts cost (conditionally included)
          example: 720.5
        taxTotal:
          type: number
          description: Total tax (conditionally included)
          example: 100.0
        capabilities:
          $ref: '#/components/schemas/WorkorderCapabilities'
