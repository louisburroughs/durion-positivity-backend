      description: 'Evaluates whether a workorder can be completed, returning a canComplete flag, a checklist, blocking reasons, counts of unresolved approval-gated change requests and non-terminal items, the emergency-denial acknowledgment state, and whether billable items exist.

        Use this tool before completeWorkorder to surface blockers without attempting the transition; do not use checkWorkorderCanClose, which checks only the emergency-denial acknowledgment dimension.

