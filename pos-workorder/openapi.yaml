                $ref: '#/components/schemas/WorkSessionResponse'
        '400':
          description: Invalid request - missing required fields or work order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkSessionResponse'
      security:
      - bearerAuth:
        - timekeeping:work_session:create
      x-required-permissions:
      - timekeeping:work_session:create
  /v1/workorders/travelSegments/{travelSegmentId}/stop:
    post:
      tags:
      - Travel Segment API
      summary: Stop an Active Travel Segment
      description: 'Stops an IN_PROGRESS travel segment, transitioning it to COMPLETED and computing the duration in whole minutes from the server clock.

        Use this tool when a technician arrives and the travel leg ends; do not use submitTravelSegments, which batches finished segments for approval.

        Preconditions: the segment must exist and be IN_PROGRESS; COMPLETED, SUBMITTED, or APPROVED segments cannot be stopped again.

        Required inputs: travelSegmentId (UUID) as a path parameter; toLocationId in the body is optional and overrides the destination recorded at start.

        Emits a WORKORDER_TRAVEL_SEGMENT_STOP event carrying the computed duration.

        Returns 404 when no segment exists for the id, and 409 when the segment is not IN_PROGRESS.

        '
      operationId: stopTravelSegment
      parameters:
      - name: travelSegmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Final travel details recorded when the segment ends.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopTravelSegmentRequest'
            examples:
              Arrived at customer:
                description: Arrived at customer
                value:
                  toLocationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a45
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelSegmentResponse'
      security:
      - bearerAuth:
        - workorder:labor:add
      x-required-permissions:
      - workorder:labor:add
  /v1/workorders/travelSegments/{travelSegmentId}/adjustments:
    post:
      tags:
      - Travel Segment API
      summary: Create Post-Approval Travel Adjustment
      description: 'Creates an adjustment record against an APPROVED travel segment, capturing corrected start and end times and a reason while leaving the original segment untouched.

        Use this tool when approved travel times need correction after the fact; do not use stopTravelSegment or submitTravelSegments, which drive the normal pre-approval lifecycle.

        Preconditions: the segment must exist and be in APPROVED status — adjustments cannot be created for IN_PROGRESS, COMPLETED, or SUBMITTED segments.

        Required inputs: travelSegmentId (UUID) as a path parameter and a body with a non-blank adjustmentReason; adjustedStartAt and adjustedEndAt (ISO instants) are optional.

        Emits a WORKORDER_TRAVEL_SEGMENT_ADJUSTMENT event; the adjusting user is recorded from the security context.

        Returns 201 with the adjustment, 404 when no segment exists for the id, and 409 when the segment is not APPROVED.

        '
      operationId: createTravelSegmentAdjustment
      parameters:
      - name: travelSegmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Corrected travel times and the reason for adjusting an approved segment.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTravelSegmentAdjustmentRequest'
            examples:
              Trim end time:
                description: Trim end time
                value:
                  adjustedStartAt: 2026-08-13 13:00:00+00:00
                  adjustedEndAt: 2026-08-13 13:35:00+00:00
                  adjustmentReason: Technician forgot to stop the segment at arrival
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelSegmentAdjustmentResponse'
      security:
      - bearerAuth:
        - workorder:labor:add
      x-required-permissions:
      - workorder:labor:add
  /v1/workorders/travelSegments/submit/{mobileWorkAssignmentId}:
    post:
      tags:
      - Travel Segment API
      summary: Submit Travel Segments for Approval
      description: 'Submits the calling technician''s IN_PROGRESS and COMPLETED travel segments for a mobile work assignment, transitioning them all to SUBMITTED for downstream approval.

        Use this tool at end of day when travel is ready for review; do not use stopTravelSegment, which ends a single running leg without submitting it.

        Preconditions: the security-context username must parse as the technician''s UUID, and at least one IN_PROGRESS or COMPLETED segment must exist for that technician on the assignment.

        Required inputs: mobileWorkAssignmentId (UUID) as a path parameter and a body with workDate (ISO date); the body is validated but submission is keyed entirely on the path id and the caller''s identity.

        Emits a WORKORDER_TRAVEL_SEGMENT_SUBMIT event.

        Returns 200 with the submitted segments, 400 when the caller''s username is not a UUID, and 404 when no submittable segments exist for the assignment.

        '
      operationId: submitTravelSegments
      parameters:
      - name: mobileWorkAssignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Submission context for the day's travel segments.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTravelSegmentsRequest'
            examples:
              End of day:
                description: End of day
                value:
                  workDate: 2026-08-13
                  notes: All site visits complete
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TravelSegmentResponse'
      security:
      - bearerAuth:
        - workorder:labor:add
      x-required-permissions:
      - workorder:labor:add
  /v1/workorders/travelSegments/start:
    post:
      tags:
      - Travel Segment API
      summary: Start a Travel Segment
      description: 'Starts an IN_PROGRESS travel segment for a mobile technician, stamping the start time from the server clock and recording who created it.

        Use this tool when a technician begins travel tied to a mobile work assignment; do not use stopTravelSegment, which ends an already-running segment.

        Preconditions: no IN_PROGRESS travel segment may exist for the same mobile work assignment, and when actedForPersonId is set an onBehalfReasonCode is mandatory.

        Required inputs: mobileWorkAssignmentId (UUID), technicianId (UUID), and segmentType (DEPART_SHOP, ARRIVE_CUSTOMER_SITE, DEPART_CUSTOMER_SITE, ARRIVE_SHOP, TRAVEL_BETWEEN_SITES, or DEADHEAD); fromLocationId, toLocationId, workOrderId, actedForPersonId, and onBehalfReasonCode (TECHNICIAN_UNAVAILABLE, FORGOT_TO_CLOCK, DATA_ENTRY_ERROR) are optional.

        Emits a WORKORDER_TRAVEL_SEGMENT_START event.

        Returns 201 with the new segment, 400 when actedForPersonId is given without onBehalfReasonCode, and 409 when an active segment already exists for the assignment.

        '
      operationId: startTravelSegment
      requestBody:
        description: Travel segment start details identifying the assignment, technician, and leg.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTravelSegmentRequest'
            examples:
              Depart shop:
                description: Depart shop
                value:
                  mobileWorkAssignmentId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a41
                  technicianId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a42
                  segmentType: DEPART_SHOP
                  fromLocationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a43
                  workOrderId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a44
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelSegmentResponse'
      security:
      - bearerAuth:
        - workorder:labor:add
      x-required-permissions:
      - workorder:labor:add
  /v1/workorders/timeEntries/{timeEntryId}/reject:
    post:
      tags:
      - Time Entry API
      summary: Reject a Submitted Time Entry
      description: 'Rejects a SUBMITTED time entry, recording the rejection reason, the deciding user, and the decision timestamp for technician follow-up.

        Use this tool when submitted hours are wrong and must be sent back; do not use approveTimeEntry, which accepts the entry as-is.

        Preconditions: the time entry must exist and be in SUBMITTED status; entries already APPROVED or REJECTED cannot be re-decided.

        Required inputs: timeEntryId (UUID) as a path parameter and a body with a non-blank rejectionReason; the deciding identity is taken from the security context.

        Emits a WORKORDER_TIME_ENTRY_REJECTED event carrying the rejection reason.

        Returns 404 when no time entry exists for the id, and 409 when the entry is not in SUBMITTED status.

        '
      operationId: rejectTimeEntry
      parameters:
      - name: timeEntryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Rejection details explaining why the submitted hours are being sent back.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectTimeEntryRequest'
            examples:
              Rejection:
                description: Rejection
                value:
                  rejectionReason: Hours overlap an existing approved entry for the same day
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntryResponse'
      security:
      - bearerAuth:
        - workorder:timeEntry:reject
      x-required-permissions:
      - workorder:timeEntry:reject
  /v1/workorders/timeEntries/{timeEntryId}/approve:
    post:
      tags:
      - Time Entry API
      summary: Approve a Submitted Time Entry
      description: 'Approves a SUBMITTED time entry, stamping the approving user and decision timestamp so the hours can flow onward in the workorder timekeeping workflow.

        Use this tool when a supervisor accepts a technician''s submitted hours; do not use rejectTimeEntry, which marks the entry REJECTED with a reason instead.

        Preconditions: the time entry must exist and be in SUBMITTED status; entries already APPROVED or REJECTED cannot be re-decided.

        Required inputs: timeEntryId (UUID) as a path parameter; there is no request body, and the approver identity is taken from the security context.

        Emits a WORKORDER_TIME_ENTRY_APPROVED event recording the decision.

        Returns 404 when no time entry exists for the id, and 409 when the entry is not in SUBMITTED status.

        '
      operationId: approveTimeEntry
      parameters:
      - name: timeEntryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntryResponse'
      security:
      - bearerAuth:
        - workorder:timeEntry:approve
      x-required-permissions:
      - workorder:timeEntry:approve
  /v1/workorders/numbers:resolve:
    post:
      tags:
