      x-required-permissions:
      - workorder:estimate:approve
  /v1/workorders/estimates/from-appointment:
    post:
      tags:
      - Estimates from Appointments
      summary: Create Draft Estimate From Appointment
      description: 'Creates a DRAFT estimate seeded from a shop appointment, linking the appointment, customer, vehicle, and location ids onto the new estimate.

        Use this tool when an appointment arrives and needs an estimate started; do not use createEstimate, which builds an estimate from scratch without an appointment link or idempotency guarantee.

        Preconditions: none beyond authentication — the appointment id is not verified against the scheduling service, and an estimate already linked to the appointmentId short-circuits creation.

        Required inputs: idempotencyKey, appointmentId, customerId, vehicleId, and locationId (all UUIDs); requestedServices is an optional list of free-text service descriptions.

        Emits a WORKORDER_ESTIMATE_CREATE_FROM_APPOINTMENT event; the call is idempotent on appointmentId, so retries never create duplicates.

        Returns 201 with created=true when a new estimate is persisted, and 200 with created=false and the existing estimateId when the appointment already has one.

        '
      operationId: createEstimateFromAppointment
      requestBody:
        description: Appointment reference and party identifiers used to seed the new draft estimate.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEstimateFromAppointmentRequest'
            examples:
              From appointment:
                description: From appointment
                value:
                  idempotencyKey: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a01
                  appointmentId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a02
                  customerId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a03
                  vehicleId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a04
                  locationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a05
                  requestedServices:
                  - Front brake inspection
                  - Oil change
        required: true
      responses:
        '201':
          description: Estimate created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEstimateFromAppointmentResponse'
        '200':
          description: Existing estimate returned (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEstimateFromAppointmentResponse'
        '400':
          description: Missing or invalid required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEstimateFromAppointmentResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEstimateFromAppointmentResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEstimateFromAppointmentResponse'
      security:
