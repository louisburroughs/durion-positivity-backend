  /v1/workorders/count:
    get:
      tags:
      - Work Order API
      summary: Count Workorders by Status
      description: 'Counts workorders server-side and returns a grand total plus a per-status breakdown without listing the rows.

        Use this tool for dashboard tiles and status widgets; use listWorkorders or searchWorkorders instead when the actual workorder rows are needed.

        Preconditions: none beyond the caller holding workorder:workorder:view.

        Required inputs: none — status (repeatable, exact statuses) takes precedence over openOnly, which defaults to false and, when true, counts every status except COMPLETED and CANCELLED.

        Emits a WORKORDER_COUNT audit event; no workorder state changes — this is a read-only aggregation.

        Returns 200 with the counts, and 400 when a status value is not a valid WorkorderStatus.

        '
      operationId: countWorkorders
      parameters:
      - name: openOnly
        in: query
        description: Count only open (non-terminal) work orders. Ignored when 'status' is supplied. Defaults to false (count all statuses).
        required: false
        schema:
          type: boolean
          default: false
      - name: status
        in: query
        description: Exact statuses to count; repeatable. Takes precedence over 'openOnly'.
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - DRAFT
            - APPROVED
            - ASSIGNED
            - WORK_IN_PROGRESS
            - AWAITING_PARTS
            - AWAITING_APPROVAL
            - READY_FOR_PICKUP
            - COMPLETED
            - CANCELLED
      responses:
        '200':
          description: Count returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
      security:
      - bearerAuth:
        - workorder:workorder:view
      x-required-permissions:
      - workorder:workorder:view
