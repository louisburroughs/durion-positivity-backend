      description: 'Reopens a DECLINED estimate back to DRAFT, clearing the decline reason, decline timestamp, and expiry date.

        Use this tool when a customer changes their mind after declining; do not use reopenWorkorder, which reopens a completed workorder rather than an estimate.

        Preconditions: the estimate must be DECLINED and still within the declineExpiryDays window of its approval configuration — expired declines cannot be reopened.

        Required inputs: estimateId (UUID) as a path parameter; there is no request body.

        Emits a WORKORDER_ESTIMATE_REOPEN event and marks the estimate fact changed.

        Returns 400 when the estimate is missing, not declined, or past its expiry window — all failures surface as 400 in this operation.

        '
