      description: 'Returns every change request attached to a workorder, in all statuses from AWAITING_ADVISOR_REVIEW through APPROVED, DECLINED, CANCELLED, and APPROVED_WITH_EXCEPTION.

        Use this tool when reviewing a workorder''s additional-work history; use getChangeRequest instead for one request by id.

        Preconditions: none — an unknown workorderId simply yields an empty list.

        Required inputs: workorderId (UUID) as a path parameter.

        Emits a WORKORDER_CHANGE_REQUEST_LIST audit event; no change request state changes — this is a read-only projection.

        Returns 200 with the list, possibly empty; no 404 is produced for unknown workorders.

