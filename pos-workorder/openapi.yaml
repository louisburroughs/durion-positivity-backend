        Emits a WORKORDER_CHANGE_REQUEST_APPROVE event and persists an ApprovalRecord audit row.

        Returns 400 when the change request cannot be found, is not awaiting review, or the note is missing — all failures surface as 400 in this operation.

        '
      operationId: approveChangeRequest
