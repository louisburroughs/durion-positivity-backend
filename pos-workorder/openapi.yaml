            application/json:
              schema:
                $ref: '#/components/schemas/WorkorderPartUsageEventResponse'
      security:
      - bearerAuth:
        - workorder:parts:add
      x-required-permissions:
      - workorder:parts:add
  /v1/workorders/{workorderId}/operationalContext/override:
    post:
      tags:
      - Operational Context
      summary: Override Workorder Operational Context
      description: 'Applies a manager-authorized override of the workorder''s operational context, replacing the location, assigned mechanics, and assigned resources (the first assigned resource becomes the bay) before work starts.

        Use this tool when a manager must re-slot a workorder to a different bay, crew, or location prior to execution; do not use getOperationalContext, which only reads the current context.

        Preconditions: the workorder must exist and work must not have started — once workStartedAt is set the context is locked and overrides are rejected.

        Required inputs: workorderId (UUID) as a path parameter and a body with locationId (UUID, required); bayId, assignedMechanics, assignedResources, and constraints are optional, and constraints are echoed back but not persisted.

        Emits a WORKORDER_OPERATIONAL_CONTEXT_OVERRIDE event and marks the workorder fact changed for downstream replication.

        Returns 404 when no workorder exists for the id, and 409 when work has already started and the context is locked.

        '
      operationId: overrideOperationalContext
      parameters:
      - name: workorderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Replacement operational context values — location, bay, mechanics, and resources.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationalContextOverrideRequest'
            examples:
              Re-slot to another bay:
                description: Re-slot to another bay
                value:
                  locationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a21
                  bayId: BAY-3
                  assignedMechanics:
                  - 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a22
                  assignedResources:
                  - 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a23
                  constraints: []
        required: true
      responses:
        '200':
          description: Override applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalContextResponse'
        '404':
          description: Workorder not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalContextResponse'
        '409':
          description: Context locked (work started)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalContextResponse'
      security:
      - bearerAuth:
        - workorder:operationalContext:override
      x-required-permissions:
      - workorder:operationalContext:override
  /v1/workorders/{workorderId}/labor/{entryId}/stop:
    post:
      tags:
      - Workorder Labor API
      summary: Stop Active Labor Session
      description: 'Stops an open labor entry, stamping the end time and computing hours worked from the elapsed session time.

        Use this tool when a technician finishes labor on a service; do not use adjustLaborHours, which corrects the hours on an already-stopped entry.

        Preconditions: the labor entry must exist and still be open — an entry with an end time cannot be stopped again.

        Required inputs: workorderId and entryId (UUIDs) as path parameters; there is no request body, and an Idempotency-Key header makes retried stops return the already-stopped entry.

        Emits a WORKORDER_LABOR_STOP event.

        Returns 404 when no labor entry exists for the id, and 400 when the session is already stopped.

        '
      operationId: stopLaborSession
      parameters:
