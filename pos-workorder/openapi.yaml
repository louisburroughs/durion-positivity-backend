      security:
      - bearerAuth:
        - workorder:labor:add
      summary: Stop Authenticated Mechanic Timers
      tags:
      - Workexec Time Tracking API
      x-required-permissions:
      - workorder:labor:add
  /v1/workexec/wip:
    get:
      description: 'Returns a page of workorders in active work-in-progress statuses (APPROVED, ASSIGNED, WORK_IN_PROGRESS, AWAITING_PARTS, AWAITING_APPROVAL), enriched with customer and vehicle references.

        Use this tool for the WIP status board; do not use getDispatchDashboard, which aggregates mechanics, bays, and conflicts for one date, and use getWipDetail for a single workorder''s status history.

        Preconditions: multiLocation=true requires the caller to hold workorder:wip:view_all_locations; otherwise results are scoped to the given location.

        Required inputs: locationId (UUID as a string) as a query parameter — ignored when multiLocation is true; multiLocation defaults to false and page size defaults to 25.

        Emits a WORKORDER_WIP_LIST audit event; no workorder state changes — this is a read-only projection.

        Returns 400 when locationId does not parse as a UUID, and 403 when multiLocation is requested without workorder:wip:view_all_locations.

        '
      operationId: listWipWorkorders
      parameters:
      - description: Location ID to filter workorders by
        in: query
        name: locationId
        required: true
        schema:
          type: string
      - description: Request cross-location results; requires workorder:wip:view_all_locations
        in: query
        name: multiLocation
        required: false
        schema:
          default: false
          type: boolean
      - description: Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: The size of the page to be returned
        in: query
        name: size
        required: false
        schema:
          default: 25
          minimum: 1
          type: integer
      - description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
        in: query
        name: sort
        required: false
        schema:
          items:
            type: string
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageWorkorderStatusView'
          description: OK
      security:
      - bearerAuth:
        - workorder:wip:view
      summary: List Active WIP Workorders
      tags:
      - WIP Dashboard
      x-required-permissions:
      - workorder:wip:view
  /v1/workexec/wip/{workorderId}:
    get:
      description: 'Returns the full work-in-progress detail for one workorder: current status, the complete status transition history with actors and reasons, blocking part numbers, and the currently assigned technician.

        Use this tool when drilling into a single workorder from the WIP board; use listWipWorkorders instead for the paginated board itself.

        Preconditions: the workorder must exist; it does not need to be in an active WIP status to be viewed.

        Required inputs: workorderId (UUID) as a path parameter.

