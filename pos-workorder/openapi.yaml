  /v1/workorders/travelSegments/{travelSegmentId}/adjustments:
    post:
      description: 'Creates an adjustment record against an APPROVED travel segment, capturing corrected start and end times and a reason while leaving the original segment untouched.

        Use this tool when approved travel times need correction after the fact; do not use stopTravelSegment or submitTravelSegments, which drive the normal pre-approval lifecycle.

        Preconditions: the segment must exist and be in APPROVED status — adjustments cannot be created for IN_PROGRESS, COMPLETED, or SUBMITTED segments.

        Required inputs: travelSegmentId (UUID) as a path parameter and a body with a non-blank adjustmentReason; adjustedStartAt and adjustedEndAt (ISO instants) are optional.

        Emits a WORKORDER_TRAVEL_SEGMENT_ADJUSTMENT event; the adjusting user is recorded from the security context.

        Returns 201 with the adjustment, 404 when no segment exists for the id, and 409 when the segment is not APPROVED.

