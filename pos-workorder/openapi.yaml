    get:
      tags:
      - Change Request API
      summary: Check Workorder Close Eligibility
      description: 'Checks whether a workorder can be closed with respect to declined emergency change requests, returning true only when every declined emergency or safety item has a customer denial acknowledgment.

        Use this tool before completing a workorder that had declined safety work; use acknowledgeChangeRequestDenial to clear a blocking acknowledgment rather than re-polling this check.

