        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkorderLaborEntryResponse'
        '404':
          description: Labor entry not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkorderLaborEntryResponse'
