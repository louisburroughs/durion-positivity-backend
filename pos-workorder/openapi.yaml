      description: 'Applies a manager''s emergency override to a change request awaiting advisor review, setting it to APPROVED_WITH_EXCEPTION, flagging it as an emergency exception, and moving its items to READY_TO_EXECUTE.

        Use this tool only when safety-critical work must proceed without the normal approval artifact; do not use approveChangeRequest, which is the standard advisor approval.

        Preconditions: the change request must exist in AWAITING_ADVISOR_REVIEW status, and the caller must hold workorder:change_request:emergency_override — the caller''s identity becomes the overriding manager of record.

        Required inputs: changeId (UUID) as a path parameter and a non-blank exceptionReason; the managerId body field is ignored in favor of the security context.

        Emits a WORKORDER_CHANGE_REQUEST_EMERGENCY_OVERRIDE event and persists an ApprovalRecord with the APPROVED_WITH_EXCEPTION resolution.

        Returns 400 when the change request cannot be found, is not awaiting review, or the reason is missing — all failures surface as 400 in this operation.

        '
      operationId: applyChangeRequestEmergencyOverride
      parameters:
      - name: changeId
        in: path
