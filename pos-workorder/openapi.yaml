      summary: Resolve Workorder Ids to Numbers
      description: 'Batch-resolves workorder ids to their human-readable workorder numbers for sibling services that store only the id.

        Use this tool when known workorder ids need display numbers; do not use searchWorkorders, which is for discovering workorders by text query rather than resolving known ids.

        Preconditions: none — nulls and duplicates in the id list are silently dropped, and ids with no matching workorder are omitted from the response rather than erroring.

        Required inputs: a body with workorderIds, a non-empty list of UUIDs.

        Emits a WORKORDER_NUMBER_RESOLVE audit event; no workorder state changes — this is a read-only projection.

        Returns 200 with one pairing per found workorder, and 400 when workorderIds is missing or empty.

        '
