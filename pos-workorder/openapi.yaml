      description: 'Records that the customer acknowledged the denial of a declined emergency or safety change request, marking every emergency-flagged service and part item on it as acknowledged.

        Use this tool after a customer refuses safety-critical work so the vehicle can be released; use checkWorkorderCanClose instead to verify whether any acknowledgments are still outstanding.

