      description: 'Returns the comprehensive workorder detail view — services with labor totals, parts, current technician assignment, derived started/in-progress/completed flags, and capability flags for the calling user.

        Use this tool when rendering a workorder screen tailored to the caller''s role; do not use getWorkorder, which returns the raw workorder without capability flags or authority-based field filtering.

