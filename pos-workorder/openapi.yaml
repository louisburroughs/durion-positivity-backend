      requestBody:
        description: Part or labor line being added to the draft estimate.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddEstimateItemRequest'
            examples:
              addEstimateItem:
                description: addEstimateItem
                value:
                  itemType: LABOR
                  description: Brake inspection
                  quantity: 1
                  unitPrice: 129.99
                  taxCode: LABOR_STANDARD
