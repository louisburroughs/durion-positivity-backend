  /v1/workorders/travelSegments/{travelSegmentId}/stop:
    post:
      description: 'Stops an IN_PROGRESS travel segment, transitioning it to COMPLETED and computing the duration in whole minutes from the server clock.

        Use this tool when a technician arrives and the travel leg ends; do not use submitTravelSegments, which batches finished segments for approval.

        Preconditions: the segment must exist and be IN_PROGRESS; COMPLETED, SUBMITTED, or APPROVED segments cannot be stopped again.

        Required inputs: travelSegmentId (UUID) as a path parameter; toLocationId in the body is optional and overrides the destination recorded at start.

        Emits a WORKORDER_TRAVEL_SEGMENT_STOP event carrying the computed duration.

        Returns 404 when no segment exists for the id, and 409 when the segment is not IN_PROGRESS.

        '
      operationId: stopTravelSegment
      parameters:
