openapi: 3.1.0
info:
  title: Positivity Price API
  description: Price service for managing product pricing and discounts
  contact:
    name: Durion Team
    email: louis.burroughs@gmail.com
  version: v1
servers:
- url: http://localhost:8086
  description: Generated server url
tags:
- name: Promotion Offers
  description: Promotion offer lifecycle operations
- name: Price Normalization
  description: Price normalization and standardization operations
- name: Price Restrictions
  description: Price restriction evaluation and override operations
- name: Price Quotes
  description: Contextual price quote operations
paths:
  /v1/promotions/offers:
    post:
      tags:
      - Promotion Offers
      operationId: createOffer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePromotionOfferRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PromotionOfferResponse"
      security:
      - BearerAuth: []
  /v1/promotions/offers/{promotionId}/rules:
    get:
      tags:
      - Promotion Eligibility Rules
      operationId: getRules
      parameters:
      - name: promotionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EligibilityRuleResponse"
      security:
      - BearerAuth: []
    post:
      tags:
      - Promotion Eligibility Rules
      operationId: addRule
      parameters:
      - name: promotionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddEligibilityRuleRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EligibilityRuleResponse"
      security:
      - BearerAuth: []
  /v1/promotions/offers/{promotionId}/rules/evaluate:
    post:
      tags:
      - Promotion Eligibility Rules
      operationId: evaluateEligibility
      parameters:
      - name: promotionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EligibilityContext"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EligibilityDecisionResponse"
      security:
      - BearerAuth: []
  /v1/promotions/offers/apply:
    post:
      tags:
      - Promotion Offers
      summary: Apply promotion offer during estimate pricing
      operationId: applyPromotion
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyPromotionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApplyPromotionResponse"
      security:
      - BearerAuth: []
  /v1/price/restrictions:override:
    post:
      tags:
      - Price Restrictions
      summary: Override price restrictions
      description: Override price restrictions for a specific context or condition.
      operationId: overrideRestrictions
      requestBody:
        content:
          application/json:
            schema: {}
      responses:
        "400":
          description: Invalid request body.
          content:
            '*/*':
              schema: {}
        "501":
          description: Not yet implemented.
          content:
            '*/*':
              schema: {}
        "500":
          description: Internal server error.
          content:
            '*/*':
              schema: {}
        "403":
          description: Insufficient permissions to override restrictions.
          content:
            '*/*':
              schema: {}
  /v1/price/restrictions:evaluate:
    post:
      tags:
      - Price Restrictions
      summary: Evaluate price restrictions
      description: Evaluate whether a price is within allowed restrictions.
      operationId: evaluateRestrictions
      requestBody:
        content:
          application/json:
            schema: {}
      responses:
        "400":
          description: Invalid request body.
          content:
            '*/*':
              schema: {}
        "501":
          description: Not yet implemented.
          content:
            '*/*':
              schema: {}
        "500":
          description: Internal server error.
          content:
            '*/*':
              schema: {}
  /v1/price/quotes:
    post:
      tags:
      - Price Quotes
      operationId: calculatePriceQuote
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceQuoteRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PriceQuoteResponse"
  /v1/price/normalize:
    post:
      tags:
      - Price Normalization
      summary: Normalize pricing
      description: Normalize and standardize pricing data across the system.
      operationId: normalizePricing
      requestBody:
        content:
          application/json:
            schema: {}
      responses:
        "400":
          description: Invalid request body.
          content:
            '*/*':
              schema: {}
        "501":
          description: Not yet implemented.
          content:
            '*/*':
              schema: {}
        "500":
          description: Internal server error.
          content:
            '*/*':
              schema: {}
  /v1/promotions/offers/{id}/deactivate:
    patch:
      tags:
      - Promotion Offers
      operationId: deactivateOffer
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PromotionOfferResponse"
      security:
      - BearerAuth: []
  /v1/promotions/offers/{id}/activate:
    patch:
      tags:
      - Promotion Offers
      operationId: activateOffer
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PromotionOfferResponse"
      security:
      - BearerAuth: []
  /v1/promotions/offers/{id}:
    get:
      tags:
      - Promotion Offers
      operationId: getOfferById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PromotionOfferResponse"
      security:
      - BearerAuth: []
  /v1/promotions/offers/by-code/{promoCode}:
    get:
      tags:
      - Promotion Offers
      operationId: getOfferByCode
      parameters:
      - name: promoCode
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PromotionOfferResponse"
      security:
      - BearerAuth: []
  /v1/price/snapshots/{snapshotId}:
    get:
      tags:
      - pricing-snapshot-controller
      operationId: getSnapshot
      parameters:
      - name: snapshotId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PricingSnapshotResponse"
  /v1/promotions/offers/{promotionId}/rules/{ruleId}:
    delete:
      tags:
      - Promotion Eligibility Rules
      operationId: deleteRule
      parameters:
      - name: promotionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: ruleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
      security:
      - BearerAuth: []
components:
  schemas:
    CreatePromotionOfferRequest:
      type: object
      properties:
        promoCode:
          type: string
        name:
          type: string
        description:
          type: string
        discountType:
          type: string
          enum:
          - PERCENT_LABOR
          - PERCENT_PARTS
          - FIXED_INVOICE
        discountValue:
          type: number
          minimum: 0.01
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        usageLimit:
          type: integer
          format: int32
        storeCode:
          type: string
      required:
      - discountType
      - discountValue
      - endDate
      - name
      - promoCode
      - startDate
    PromotionOfferResponse:
      type: object
      properties:
        promotionOfferId:
          type: string
          format: uuid
        promoCode:
          type: string
        name:
          type: string
        description:
          type: string
        discountType:
          type: string
          enum:
          - PERCENT_LABOR
          - PERCENT_PARTS
          - FIXED_INVOICE
        discountValue:
          type: number
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        usageLimit:
          type: integer
          format: int32
        usageCount:
          type: integer
          format: int32
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - INACTIVE
          - EXPIRED
        storeCode:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
    AddEligibilityRuleRequest:
      type: object
      properties:
        conditionType:
          type: string
          enum:
          - ACCOUNT_ID_LIST
          - VEHICLE_TAG
          - ACCOUNT_FLEET_SIZE
        operator:
          type: string
          enum:
          - IN
          - NOT_IN
          - EQUALS
          - GREATER_THAN_OR_EQUAL_TO
        value:
          type: string
        ruleCombination:
          type: string
          enum:
          - AND
          - OR
      required:
      - conditionType
      - operator
      - value
    EligibilityRuleResponse:
      type: object
      properties:
        ruleId:
          type: string
          format: uuid
        promotionId:
          type: string
          format: uuid
        conditionType:
          type: string
          enum:
          - ACCOUNT_ID_LIST
          - VEHICLE_TAG
          - ACCOUNT_FLEET_SIZE
        operator:
          type: string
          enum:
          - IN
          - NOT_IN
          - EQUALS
          - GREATER_THAN_OR_EQUAL_TO
        value:
          type: string
    EligibilityContext:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
    EligibilityDecisionResponse:
      type: object
      properties:
        reasonCode:
          type: string
          enum:
          - ELIGIBLE
          - ACCOUNT_NOT_IN_LIST
          - ACCOUNT_IN_EXCLUSION_LIST
          - VEHICLE_TAG_NOT_PRESENT
          - VEHICLE_TAG_EXCLUDED
          - FLEET_SIZE_TOO_SMALL
          - MISSING_ACCOUNT_CONTEXT
          - MISSING_VEHICLE_CONTEXT
          - EVALUATION_ERROR
        eligible:
          type: boolean
        isEligible:
          type: boolean
    ApplyPromotionRequest:
      type: object
      properties:
        promotionCode:
          type: string
        estimateContext:
          $ref: "#/components/schemas/EstimateContext"
      required:
      - estimateContext
      - promotionCode
    EstimateContext:
      type: object
      properties:
        estimateId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/LineItemContext"
          maxItems: 2147483647
          minItems: 1
        subtotal:
          type: number
          minimum: 0
        appliedPromoCodes:
          type: array
          items:
            type: string
      required:
      - customerId
      - estimateId
      - lineItems
      - subtotal
    LineItemContext:
      type: object
      properties:
        sku:
          type: string
        quantity:
          type: number
          minimum: 0
        unitPrice:
          type: number
          minimum: 0
      required:
      - quantity
      - sku
      - unitPrice
    ApplyPromotionResponse:
      type: object
      properties:
        subtotal:
          type: number
        total:
          type: number
        appliedAdjustments:
          type: array
          items:
            $ref: "#/components/schemas/PricingAdjustment"
    PricingAdjustment:
      type: object
      properties:
        type:
          type: string
        sourceId:
          type: string
          format: uuid
        label:
          type: string
        amount:
          type: number
        metadata: {}
    PriceQuoteRequest:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1
        locationId:
          type: string
          format: uuid
        customerTierId:
          type: string
          format: uuid
        effectiveTimestamp:
          type: string
          format: date-time
      required:
      - customerTierId
      - locationId
      - productId
      - quantity
    MoneyAmount:
      type: object
      properties:
        amount:
          type: number
        currency:
          type: string
    PriceQuoteResponse:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
        msrp:
          $ref: "#/components/schemas/MoneyAmount"
        unitPrice:
          $ref: "#/components/schemas/MoneyAmount"
        extendedPrice:
          $ref: "#/components/schemas/MoneyAmount"
        priceSource:
          type: string
        pricingBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/PricingBreakdownEntry"
        warnings:
          type: array
          items:
            type: string
    PricingBreakdownEntry:
      type: object
      properties:
        ruleName:
          type: string
        ruleType:
          type: string
        adjustment:
          $ref: "#/components/schemas/MoneyAmount"
        resultingValue:
          $ref: "#/components/schemas/MoneyAmount"
    PricingSnapshotResponse:
      type: object
      properties:
        snapshotId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        sourceContext:
          type: string
        itemIdentifier:
          type: string
        quantity:
          type: integer
          format: int32
        prices:
          type: string
        appliedRules:
          type: string
        policyVersion:
          type: string
