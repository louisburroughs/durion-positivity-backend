    RestrictionRuleResponse:
      type: object
      properties:
        ruleId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        locationTag:
          type: string
          enum:
          - ALL_LOCATIONS
          - RETAIL_STORE
          - WAREHOUSE
          - MOBILE_SERVICE
          - FRANCHISE
          - TEST_LOCATION
        serviceTag:
          type: string
          enum:
          - POS_SALE
