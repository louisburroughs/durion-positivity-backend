openapi: 3.1.0
info:
  title: Positivity Price API
  description: Price service for managing product pricing and discounts
  contact:
    name: Durion Support Services
    email: louis.burroughs@gmail.com
  version: v1
servers:
- url: http://localhost:8086
  description: Generated server url
tags:
- name: Price Bulk Ingest API
  description: Bulk import base price records
- name: Pricing Snapshots
  description: Read operations for immutable pricing snapshots
- name: Promotion Offers
  description: Promotion offer lifecycle operations
- name: Price Normalization
  description: Price normalization and standardization operations
- name: Price Restrictions
  description: Price restriction evaluation and override operations
- name: Restriction Rules
  description: CRUD operations for price restriction rules
- name: Promotion Eligibility Rules
  description: Promotion eligibility rule management and evaluation operations
- name: Price Quotes
  description: Contextual price quote operations
paths:
  /v1/promotions/offers:
    post:
      tags:
      - Promotion Offers
      summary: Create promotion offer
      description: Creates a new promotion offer with code, lifecycle settings, and discount policy.
      operationId: createOffer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePromotionOfferRequest'
        required: true
      responses:
        '201':
          description: Promotion offer created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionOfferResponse'
        '400':
          description: Invalid promotion offer request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionOfferResponse'
        '409':
          description: Promotion code already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionOfferResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionOfferResponse'
      security:
      - bearerAuth:
        - pricing:promotion:manage
      x-required-permissions:
      - pricing:promotion:manage
  /v1/promotions/offers/{promotionId}/rules:
    get:
      tags:
      - Promotion Eligibility Rules
      summary: List eligibility rules for promotion offer
      description: Returns all eligibility rules configured for the specified promotion offer.
      operationId: getRules
      parameters:
      - name: promotionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Eligibility rules returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EligibilityRuleResponse'
        '404':
          description: Promotion offer not found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EligibilityRuleResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EligibilityRuleResponse'
      security:
      - bearerAuth:
        - pricing:promotion:view
      x-required-permissions:
      - pricing:promotion:view
    post:
      tags:
      - Promotion Eligibility Rules
      summary: Add eligibility rule to promotion offer
      description: Creates and attaches a new eligibility rule to the specified promotion offer.
      operationId: addRule
      parameters:
      - name: promotionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddEligibilityRuleRequest'
        required: true
      responses:
        '201':
          description: Eligibility rule created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityRuleResponse'
        '400':
          description: Invalid eligibility rule request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityRuleResponse'
        '404':
          description: Promotion offer not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityRuleResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityRuleResponse'
      security:
      - bearerAuth:
        - pricing:promotion:manage
      x-required-permissions:
      - pricing:promotion:manage
  /v1/promotions/offers/{promotionId}/rules/evaluate:
    post:
      tags:
      - Promotion Eligibility Rules
      summary: Evaluate promotion eligibility
      description: Evaluates whether a promotion offer is eligible for the provided evaluation context.
      operationId: evaluateEligibility
      parameters:
      - name: promotionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EligibilityContext'
        required: true
      responses:
        '200':
          description: Eligibility evaluation result returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityDecisionResponse'
        '400':
          description: Invalid evaluation request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityDecisionResponse'
        '404':
          description: Promotion offer not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityDecisionResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityDecisionResponse'
      security:
      - bearerAuth:
        - pricing:promotion:apply
      x-required-permissions:
      - pricing:promotion:apply
  /v1/promotions/offers/apply:
    post:
      tags:
      - Promotion Offers
      summary: Apply promotion offer during estimate pricing
      description: Applies a promotion offer to pricing inputs and returns resulting discount and adjusted totals.
      operationId: applyPromotion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyPromotionRequest'
        required: true
      responses:
        '200':
          description: Promotion offer applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyPromotionResponse'
        '400':
          description: Invalid promotion application request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyPromotionResponse'
        '404':
          description: Promotion offer not found or not eligible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyPromotionResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyPromotionResponse'
      security:
      - bearerAuth:
        - pricing:promotion:apply
      x-required-permissions:
      - pricing:promotion:apply
  /v1/price/restrictions:override:
    post:
      tags:
      - Price Restrictions
      summary: Override price restrictions
      description: Issues an override for price restrictions. Requires pricing:restriction:override authority.
      operationId: overrideRestrictions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestrictionOverrideRequest'
        required: true
      responses:
        '200':
          description: Override issued. Returns overrideId and expiresAt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictionOverrideResponse'
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictionOverrideResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictionOverrideResponse'
        '403':
          description: Insufficient permissions to override restrictions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictionOverrideResponse'
      security:
      - bearerAuth:
        - pricing:restriction:override
      x-required-permissions:
      - pricing:restriction:override
  /v1/price/restrictions:evaluate:
    post:
      tags:
      - Price Restrictions
      summary: Evaluate price restrictions
      description: Evaluates whether products are subject to restrictions in the given context.
      operationId: evaluateRestrictions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestrictionEvaluationRequest'
        required: true
      responses:
        '200':
          description: Evaluation results per product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictionEvaluationResponse'
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictionEvaluationResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictionEvaluationResponse'
        '503':
          description: Restriction evaluation service unavailable (commit path only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictionEvaluationResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - AUTHENTICATED
  /v1/price/restrictions/rules:
    get:
      tags:
      - Restriction Rules
      summary: List all active restriction rules
      description: Returns all currently active price restriction rules that can affect pricing decisions.
      operationId: listRules
      responses:
        '200':
          description: List of restriction rules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RestrictionRuleResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RestrictionRuleResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - AUTHENTICATED
    post:
      tags:
      - Restriction Rules
      summary: Create a restriction rule
      description: Creates a price restriction rule for a product, location tag, and service tag combination.
      operationId: createRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRestrictionRuleRequest'
        required: true
      responses:
        '201':
          description: Restriction rule created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictionRuleResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictionRuleResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictionRuleResponse'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictionRuleResponse'
      security:
      - bearerAuth:
        - pricing:restriction:manage
      x-required-permissions:
      - pricing:restriction:manage
  /v1/price/quotes:
    post:
      tags:
      - Price Quotes
      summary: Calculate contextual price quote
      description: Calculates a contextual price quote using request inputs such as product, location, customer tier, and pricing context.
      operationId: calculatePriceQuote
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceQuoteRequest'
        required: true
      responses:
        '200':
          description: Price quote calculated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceQuoteResponse'
        '400':
          description: Invalid quote request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceQuoteResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceQuoteResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - AUTHENTICATED
  /v1/price/normalize:
    post:
      tags:
      - Price Normalization
      summary: Normalize pricing
      description: Normalize and standardize pricing data across the system.
      operationId: normalizePricing
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '501':
          description: Not yet implemented.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
      security:
      - bearerAuth: []
      x-required-permissions:
      - AUTHENTICATED
  /v1/price/bulk-ingest:
    post:
      tags:
      - Price Bulk Ingest API
      summary: Bulk ingest records
      description: Accepts a batch of domain records for bulk import. Returns per-record results.
      operationId: bulkIngest
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkIngestRequestBasePriceBulkIngestRecord'
        required: true
      responses:
        '200':
          description: Batch processed (check per-record success/failure in response)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkIngestResponse'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkIngestResponse'
      security:
      - bearerAuth:
        - pricing:base_price:create
      x-required-permissions:
      - pricing:base_price:create
  /v1/promotions/offers/{id}/deactivate:
    patch:
      tags:
      - Promotion Offers
      summary: Deactivate promotion offer
      description: Deactivates a promotion offer so it is no longer eligible for application.
      operationId: deactivateOffer
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Promotion offer deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionOfferResponse'
        '404':
          description: Promotion offer not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionOfferResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionOfferResponse'
      security:
      - bearerAuth:
        - pricing:promotion:manage
      x-required-permissions:
      - pricing:promotion:manage
  /v1/promotions/offers/{id}/activate:
    patch:
      tags:
      - Promotion Offers
      summary: Activate promotion offer
      description: Activates a promotion offer so it becomes eligible for application.
      operationId: activateOffer
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Promotion offer activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionOfferResponse'
        '404':
          description: Promotion offer not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionOfferResponse'
        '409':
          description: Promotion offer cannot be activated in current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionOfferResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionOfferResponse'
      security:
      - bearerAuth:
        - pricing:promotion:manage
      x-required-permissions:
      - pricing:promotion:manage
  /v1/promotions/offers/{id}:
    get:
      tags:
      - Promotion Offers
      summary: Get promotion offer by ID
      description: Retrieves a promotion offer using its unique identifier.
      operationId: getOfferById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Promotion offer returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionOfferResponse'
        '404':
          description: Promotion offer not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionOfferResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionOfferResponse'
      security:
      - bearerAuth:
        - pricing:promotion:view
      x-required-permissions:
      - pricing:promotion:view
  /v1/promotions/offers/by-code/{promoCode}:
    get:
      tags:
      - Promotion Offers
      summary: Get promotion offer by code
      description: Retrieves a promotion offer using its promotion code.
      operationId: getOfferByCode
      parameters:
      - name: promoCode
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Promotion offer returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionOfferResponse'
        '404':
          description: Promotion offer not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionOfferResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionOfferResponse'
      security:
      - bearerAuth:
        - pricing:promotion:view
      x-required-permissions:
      - pricing:promotion:view
  /v1/price/snapshots/{snapshotId}:
    get:
      tags:
      - Pricing Snapshots
      summary: Get pricing snapshot by ID
      description: Retrieves an immutable pricing snapshot using its snapshot identifier.
      operationId: getSnapshot
      parameters:
      - name: snapshotId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Pricing snapshot returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingSnapshotResponse'
        '404':
          description: Pricing snapshot not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingSnapshotResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingSnapshotResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - AUTHENTICATED
  /v1/price/restrictions/rules/{ruleId}:
    get:
      tags:
      - Restriction Rules
      summary: Get a restriction rule by ID
      description: Returns the active or inactive restriction rule identified by the supplied rule ID.
      operationId: getRuleById
      parameters:
      - name: ruleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Restriction rule found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictionRuleResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictionRuleResponse'
        '404':
          description: Restriction rule not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictionRuleResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - AUTHENTICATED
    delete:
      tags:
      - Restriction Rules
      summary: Deactivate a restriction rule
      description: Deactivates the specified restriction rule so it no longer participates in price restriction evaluation.
      operationId: deactivateRule
      parameters:
      - name: ruleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Restriction rule deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictionRuleResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictionRuleResponse'
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictionRuleResponse'
        '404':
          description: Restriction rule not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictionRuleResponse'
      security:
      - bearerAuth:
        - pricing:restriction:manage
      x-required-permissions:
      - pricing:restriction:manage
  /v1/promotions/offers/{promotionId}/rules/{ruleId}:
    delete:
      tags:
      - Promotion Eligibility Rules
      summary: Delete eligibility rule
      description: Deletes an eligibility rule from the specified promotion offer.
      operationId: deleteRule
      parameters:
      - name: promotionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: ruleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Eligibility rule deleted.
        '404':
          description: Promotion offer or rule not found.
        '403':
          description: Forbidden.
      security:
      - bearerAuth:
        - pricing:promotion:manage
      x-required-permissions:
      - pricing:promotion:manage
components:
  schemas:
    CreatePromotionOfferRequest:
      type: object
      description: Request payload for creating a promotion offer
      properties:
        promoCode:
          type: string
          description: Unique promotion code
          example: SUMMER20
          maxLength: 64
          minLength: 0
        name:
          type: string
          description: Display name for the promotion
          example: Summer Labor Discount
          maxLength: 255
          minLength: 0
        description:
          type:
          - string
          - 'null'
          description: Optional promotion description
          example: 20% off labor for seasonal service
          maxLength: 255
          minLength: 0
        discountType:
          type: string
          description: Discount strategy to apply
          enum:
          - PERCENT_LABOR
          - PERCENT_PARTS
          - FIXED_INVOICE
          example: PERCENT_LABOR
        discountValue:
          type: number
          description: Discount value based on selected discount type
          example: 20.0
          minimum: 0.01
        startDate:
          type: string
          format: date
          description: Date when promotion becomes valid
          example: 2026-03-01
        endDate:
          type: string
          format: date
          description: Date when promotion expires
          example: 2026-03-31
        usageLimit:
          type:
          - integer
          - 'null'
          format: int32
          description: Maximum number of times promotion can be applied
          example: 100
        storeCode:
          type:
          - string
          - 'null'
          description: Optional store/location code that scopes the promotion
          example: NYC-001
          maxLength: 255
          minLength: 0
      required:
      - discountType
      - discountValue
      - endDate
      - name
      - promoCode
      - startDate
    PromotionOfferResponse:
      type: object
      description: Response payload representing a promotion offer
      properties:
        promotionOfferId:
          type: string
          format: uuid
          description: Promotion offer identifier
          example: f51d2c5b-a1f2-4f4e-a7cf-4e7b1752e6aa
        promoCode:
          type: string
          description: Unique promotion code
          example: SUMMER20
        name:
          type: string
          description: Promotion display name
          example: Summer Labor Discount
        description:
          type:
          - string
          - 'null'
          description: Optional promotion description
          example: 20% off labor for seasonal service
        discountType:
          type: string
          description: Discount strategy
          enum:
          - PERCENT_LABOR
          - PERCENT_PARTS
          - FIXED_INVOICE
          example: PERCENT_LABOR
        discountValue:
          type: number
          description: Discount value based on discount type
          example: 20.0
        startDate:
          type: string
          format: date
          description: Promotion validity start date
          example: 2026-03-01
        endDate:
          type: string
          format: date
          description: Promotion validity end date
          example: 2026-03-31
        usageLimit:
          type:
          - integer
          - 'null'
          format: int32
          description: Optional usage limit
          example: 100
        usageCount:
          type: integer
          format: int32
          description: Number of times the promotion has been applied
          example: 14
        status:
          type: string
          description: Current promotion status
          enum:
          - DRAFT
          - ACTIVE
          - INACTIVE
          - EXPIRED
          example: ACTIVE
        storeCode:
          type:
          - string
          - 'null'
          description: Optional store code scope
          example: NYC-001
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Record creation timestamp
          example: 2026-03-01 08:00:00+00:00
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Record last update timestamp
          example: 2026-03-02 10:15:00+00:00
        createdBy:
          type:
          - string
          - 'null'
          description: User that created the record
          example: user-001
      required:
      - discountType
      - discountValue
      - endDate
      - name
      - promoCode
      - promotionOfferId
      - startDate
      - status
      - usageCount
    AddEligibilityRuleRequest:
      type: object
      description: Request payload to add a new eligibility rule to a promotion
      properties:
        conditionType:
          type: string
          description: Rule condition type to evaluate
          enum:
          - ACCOUNT_ID_LIST
          - VEHICLE_TAG
          - ACCOUNT_FLEET_SIZE
          example: ACCOUNT_FLEET_SIZE
        operator:
          type: string
          description: Comparison operator for the rule
          enum:
          - IN
          - NOT_IN
          - EQUALS
          - GREATER_THAN_OR_EQUAL_TO
          example: GREATER_THAN_OR_EQUAL_TO
        value:
          type: string
          description: Rule threshold or comparison value
          example: '1000'
          maxLength: 255
          minLength: 0
        ruleCombination:
          type:
          - string
          - 'null'
          description: Logical combinator when multiple rules exist
          enum:
          - AND
          - OR
          example: AND
      required:
      - conditionType
      - operator
      - value
    EligibilityRuleResponse:
      type: object
      description: Response payload representing a stored promotion eligibility rule
      properties:
        ruleId:
          type: string
          format: uuid
          description: Eligibility rule identifier
          example: f51d2c5b-a1f2-4f4e-a7cf-4e7b1752e6ab
        promotionId:
          type: string
          format: uuid
          description: Promotion identifier to which this rule belongs
          example: f51d2c5b-a1f2-4f4e-a7cf-4e7b1752e6aa
        conditionType:
          type: string
          description: Rule condition type
          enum:
          - ACCOUNT_ID_LIST
          - VEHICLE_TAG
          - ACCOUNT_FLEET_SIZE
          example: ACCOUNT_FLEET_SIZE
        operator:
          type: string
          description: Comparison operator
          enum:
          - IN
          - NOT_IN
          - EQUALS
          - GREATER_THAN_OR_EQUAL_TO
          example: GREATER_THAN_OR_EQUAL_TO
        value:
          type: string
          description: Rule threshold or value
          example: '1000'
      required:
      - conditionType
      - operator
      - promotionId
      - ruleId
      - value
    EligibilityContext:
      type: object
      description: Optional account/vehicle context used to evaluate promotion eligibility
      properties:
        accountId:
          type:
          - string
          - 'null'
          format: uuid
          description: Customer account identifier
          example: 9fdaf7eb-b58f-4e4f-8c14-035e9368f7e8
        vehicleId:
          type:
          - string
          - 'null'
          format: uuid
          description: Vehicle identifier used for vehicle-based eligibility rules
          example: 0b4a9f7c-f5a8-4a5f-b3cb-2b7a3f4ec5a1
    EligibilityDecisionResponse:
      type: object
      description: Eligibility evaluation result for a promotion and context
      properties:
        reasonCode:
          type: string
          description: Detailed ineligibility reason when eligibility is false
          enum:
          - ELIGIBLE
          - ACCOUNT_NOT_IN_LIST
          - ACCOUNT_IN_EXCLUSION_LIST
          - VEHICLE_TAG_NOT_PRESENT
          - VEHICLE_TAG_EXCLUDED
          - FLEET_SIZE_TOO_SMALL
          - MISSING_ACCOUNT_CONTEXT
          - MISSING_VEHICLE_CONTEXT
          - EVALUATION_ERROR
          example: MISSING_ACCOUNT_CONTEXT
        eligible:
          type: boolean
        isEligible:
          type: boolean
          description: Whether the promotion is eligible for the provided context
          example: true
      required:
      - isEligible
    ApplyPromotionRequest:
      type: object
      description: Request payload for applying a promotion code to an estimate context
      properties:
        promotionCode:
          type: string
          description: Promotion code to apply
          example: SUMMER20
          maxLength: 64
          minLength: 0
        estimateContext:
          $ref: '#/components/schemas/EstimateContext'
      required:
      - estimateContext
      - promotionCode
    EstimateContext:
      type: object
      description: Estimate context used for applying promotion rules and calculations
      properties:
        estimateId:
          type: string
          format: uuid
          description: Estimate identifier
          example: 00000000-0000-0000-0000-000000000001
        customerId:
          type: string
          format: uuid
          description: Customer identifier
          example: 00000000-0000-0000-0000-000000000002
        vehicleId:
          type:
          - string
          - 'null'
          format: uuid
          description: Optional vehicle identifier for vehicle-specific eligibility checks
          example: 00000000-0000-0000-0000-000000000003
        lineItems:
          type: array
          description: Line items included in the estimate
          items:
            $ref: '#/components/schemas/LineItemContext'
          maxItems: 2147483647
          minItems: 1
        subtotal:
          type: number
          description: Estimate subtotal before promotions
          example: 500.0
          minimum: 0
        appliedPromoCodes:
          type:
          - array
          - 'null'
          description: Promotion codes already applied to this estimate
          example:
          - SPRING10
          items:
            type: string
            maxLength: 64
            minLength: 0
      required:
      - customerId
      - estimateId
      - lineItems
      - subtotal
    LineItemContext:
      type: object
      description: Single estimate line item used for promotion and pricing calculations
      properties:
        sku:
          type: string
          description: Product SKU or identifier
          example: P001
          maxLength: 120
          minLength: 0
        quantity:
          type: number
          description: Line item quantity
          example: 1
          minimum: 0
        unitPrice:
          type: number
          description: Line item unit price
          example: 100.0
          minimum: 0
      required:
      - quantity
      - sku
      - unitPrice
    ApplyPromotionResponse:
      type: object
      description: Response payload after applying a promotion to an estimate
      properties:
        subtotal:
          type: number
          description: Original estimate subtotal before promotions
          example: 500.0
        total:
          type: number
          description: Final estimate total after applying adjustments
          example: 400.0
        appliedAdjustments:
          type: array
          description: Adjustments applied during promotion evaluation
          example: []
          items:
            $ref: '#/components/schemas/PricingAdjustment'
      required:
      - appliedAdjustments
      - subtotal
      - total
    PricingAdjustment:
      type: object
      description: A single pricing adjustment applied to an estimate
      properties:
        type:
          type: string
          description: Adjustment type
          example: PROMOTION
        sourceId:
          type: string
          format: uuid
          description: Source identifier that produced this adjustment
          example: f51d2c5b-a1f2-4f4e-a7cf-4e7b1752e6aa
        label:
          type: string
          description: Human-readable adjustment label
          example: Summer Labor Discount
        amount:
          type: number
          description: Adjustment amount; negative values reduce total
          example: -100.0
        metadata:
          description: Optional adjustment metadata bag
      required:
      - amount
      - label
      - type
    RestrictionOverrideRequest:
      type: object
      description: Request payload to override a sale-restriction rule for a transaction
      properties:
        ruleId:
          type: string
          format: uuid
          description: Restriction rule being overridden
          example: f51d2c5b-a1f2-4f4e-a7cf-4e7b1752e6ab
        transactionId:
          type: string
          format: uuid
          description: Transaction the override applies to
          example: 1f0c2b9a-7e44-4f0e-9c1b-2a6d8e3f4b50
        productId:
          type: string
          format: uuid
          description: Product the override applies to
          example: 7f3c35db-b908-42fa-83f1-2ef46a3c2149
        overrideContext:
          type: string
          description: Transaction lifecycle context for the override
          enum:
          - BROWSE
          - QUOTE
          - CHECKOUT
          - INVOICE_FINALIZE
          - COMMIT_SALE
          example: CHECKOUT
        reasonCode:
          type: string
          description: Reason code justifying the override
          example: MANAGER_APPROVAL
          minLength: 1
        notes:
          type: string
          description: Optional free-text notes for the override
          example: Customer is a licensed reseller
        approvedBy:
          type: string
          description: Optional identifier of the approver who authorized the override
          example: user-001
      required:
      - overrideContext
      - productId
      - reasonCode
      - ruleId
      - transactionId
    RestrictionOverrideResponse:
      type: object
      description: Response payload confirming a created sale-restriction override
      properties:
        overrideId:
          type: string
          format: uuid
          description: Identifier of the created override
          example: 9c3b1f2a-5d6e-4a7b-8c9d-0e1f2a3b4c5d
        expiresAt:
          type: string
          format: date-time
          description: Timestamp when the override expires
          example: 2026-03-05 21:38:21.752000+00:00
      required:
      - expiresAt
      - overrideId
    RestrictionEvaluationItem:
      type: object
      description: Single product/context entry to evaluate against sale-restriction rules
      properties:
        productId:
          type: string
          format: uuid
          description: Product to evaluate restrictions for
          example: 7f3c35db-b908-42fa-83f1-2ef46a3c2149
        locationTag:
          type: string
          description: Location scope tag for the evaluation
          enum:
          - ALL_LOCATIONS
          - RETAIL_STORE
          - WAREHOUSE
          - MOBILE_SERVICE
          - FRANCHISE
          - TEST_LOCATION
          example: RETAIL_STORE
        serviceTag:
          type: string
          description: Service channel scope tag for the evaluation
          enum:
          - POS_SALE
          - WORKORDER
          - ESTIMATE
          - INVOICE
          - DELIVERY
          example: POS_SALE
        context:
          type: string
          description: Transaction lifecycle context for the evaluation
          enum:
          - BROWSE
          - QUOTE
          - CHECKOUT
          - INVOICE_FINALIZE
          - COMMIT_SALE
          example: CHECKOUT
      required:
      - context
      - locationTag
      - productId
      - serviceTag
    RestrictionEvaluationRequest:
      type: object
      description: Batch request to evaluate sale-restriction rules for one or more product contexts
      properties:
        items:
          type: array
          description: Product/context entries to evaluate; must contain at least one item
          items:
            $ref: '#/components/schemas/RestrictionEvaluationItem'
          minItems: 1
      required:
      - items
    RestrictionEvaluationResponse:
      type: object
      description: Batch response containing one restriction-evaluation result per requested item
      properties:
        results:
          type: array
          description: Per-item restriction evaluation results
          example: []
          items:
            $ref: '#/components/schemas/RestrictionEvaluationResult'
      required:
      - results
    RestrictionEvaluationResult:
      type: object
      description: Restriction-evaluation outcome for a single product context
      properties:
        productId:
          type: string
          format: uuid
          description: Product the evaluation applies to
          example: 7f3c35db-b908-42fa-83f1-2ef46a3c2149
        decision:
          type: string
          description: Restriction decision for the product context
          enum:
          - ALLOW
          - BLOCK
          - ALLOW_WITH_OVERRIDE
          - RESTRICTION_UNKNOWN
          example: ALLOW
        ruleIds:
          type: array
          description: Identifiers of rules that contributed to the decision
          example: []
          items:
            type: string
            format: uuid
        reasonCodes:
          type: array
          description: Reason codes explaining the decision
          example: []
          items:
            type: string
      required:
      - decision
      - productId
      - reasonCodes
      - ruleIds
    CreateRestrictionRuleRequest:
      type: object
      description: Request payload to create a product sale-restriction rule
      properties:
        productId:
          type: string
          format: uuid
          description: Product the restriction rule applies to
          example: 7f3c35db-b908-42fa-83f1-2ef46a3c2149
        locationTag:
          type: string
          description: Location scope tag for the restriction
          enum:
          - ALL_LOCATIONS
          - RETAIL_STORE
          - WAREHOUSE
          - MOBILE_SERVICE
          - FRANCHISE
          - TEST_LOCATION
          example: RETAIL_STORE
        serviceTag:
          type: string
          description: Service channel scope tag for the restriction
          enum:
          - POS_SALE
          - WORKORDER
          - ESTIMATE
          - INVOICE
          - DELIVERY
          example: POS_SALE
        effectiveFrom:
          type: string
          format: date
          description: Date the restriction rule becomes effective
          example: 2026-03-01
        effectiveTo:
          type: string
          format: date
          description: Optional date the restriction rule stops being effective
          example: 2026-12-31
        policyVersion:
          type: integer
          format: int32
          description: Optional pricing policy version associated with the rule
          example: 3
        overrideable:
          type: boolean
          description: Whether the restriction can be overridden with authorization
          example: true
      required:
      - effectiveFrom
      - locationTag
      - overrideable
      - productId
      - serviceTag
    RestrictionRuleResponse:
      type: object
      description: Response payload representing a stored sale-restriction rule
      properties:
        ruleId:
          type: string
          format: uuid
          description: Restriction rule identifier
          example: f51d2c5b-a1f2-4f4e-a7cf-4e7b1752e6ab
        productId:
          type: string
          format: uuid
          description: Product the restriction rule applies to
          example: 7f3c35db-b908-42fa-83f1-2ef46a3c2149
        locationTag:
          type: string
          description: Location scope tag for the restriction
          enum:
          - ALL_LOCATIONS
          - RETAIL_STORE
          - WAREHOUSE
          - MOBILE_SERVICE
          - FRANCHISE
          - TEST_LOCATION
          example: RETAIL_STORE
        serviceTag:
          type: string
          description: Service channel scope tag for the restriction
          enum:
          - POS_SALE
          - WORKORDER
          - ESTIMATE
          - INVOICE
          - DELIVERY
          example: POS_SALE
        active:
          type: boolean
          description: Whether the restriction rule is currently active
          example: true
        effectiveFrom:
          type: string
          format: date
          description: Date the restriction rule becomes effective
          example: 2026-03-01
        effectiveTo:
          type: string
          format: date
          description: Optional date the restriction rule stops being effective
          example: 2026-12-31
      required:
      - active
      - effectiveFrom
      - locationTag
      - productId
      - ruleId
      - serviceTag
    PriceQuoteRequest:
      type: object
      description: Request payload for calculating contextual price quotes
      properties:
        productId:
          type: string
          format: uuid
          description: Product identifier
          example: 7f3c35db-b908-42fa-83f1-2ef46a3c2149
        quantity:
          type: integer
          format: int32
          description: Requested quantity
          example: 2
          minimum: 1
        locationId:
          type: string
          format: uuid
          description: Location identifier where quote applies
          example: 6b2896a2-d456-4e22-ab5b-8a67f32c4f59
        customerTierId:
          type: string
          format: uuid
          description: Customer tier identifier used for tier pricing rules
          example: ea2f17ef-f06e-40ec-a9d6-c2d1b3e56d8a
        effectiveTimestamp:
          type:
          - string
          - 'null'
          format: date-time
          description: Optional timestamp for effective pricing lookup; defaults to current time if omitted
          example: 2026-03-05 21:15:00+00:00
      required:
      - customerTierId
      - locationId
      - productId
      - quantity
    MoneyAmount:
      type: object
      description: Monetary value object with amount and ISO-4217 currency code
      properties:
        amount:
          type: number
          description: Numeric monetary amount
          example: 125.5
        currency:
          type: string
          description: ISO-4217 currency code
          example: USD
      required:
      - amount
      - currency
    PriceQuoteResponse:
      type: object
      description: Calculated contextual price quote response
      properties:
        productId:
          type: string
          format: uuid
          description: Product identifier
          example: 7f3c35db-b908-42fa-83f1-2ef46a3c2149
        quantity:
          type: integer
          format: int32
          description: Quoted quantity
          example: 2
        msrp:
          $ref: '#/components/schemas/MoneyAmount'
        unitPrice:
          $ref: '#/components/schemas/MoneyAmount'
        extendedPrice:
          $ref: '#/components/schemas/MoneyAmount'
        priceSource:
          type: string
          description: Source from which the final price was resolved
          example: LOCATION_OVERRIDE
        pricingBreakdown:
          type: array
          description: Per-rule pricing breakdown entries
          example: []
          items:
            $ref: '#/components/schemas/PricingBreakdownEntry'
        warnings:
          type: array
          description: Non-fatal warnings generated during quote calculation
          example: []
          items:
            type: string
      required:
      - extendedPrice
      - msrp
      - priceSource
      - pricingBreakdown
      - productId
      - quantity
      - unitPrice
      - warnings
    PricingBreakdownEntry:
      type: object
      description: Single pricing-rule application entry within a quote breakdown
      properties:
        ruleName:
          type: string
          description: Rule name
          example: Tier Discount Rule
        ruleType:
          type: string
          description: Rule category/type
          example: CUSTOMER_TIER
        adjustment:
          $ref: '#/components/schemas/MoneyAmount'
        resultingValue:
          $ref: '#/components/schemas/MoneyAmount'
      required:
      - adjustment
      - resultingValue
      - ruleName
      - ruleType
    BasePriceBulkIngestRecord:
      type: object
      description: Single base-price record within a bulk ingest payload
      properties:
        productId:
          type: string
          description: Product identifier the base price applies to
          example: P001
          minLength: 1
        msrp:
          type: string
          description: Manufacturer suggested retail price
          example: '125.50'
          minLength: 1
        currency:
          type: string
          description: ISO-4217 currency code
          example: USD
          maxLength: 3
          minLength: 3
        effectiveFrom:
          type: string
          description: Date the base price becomes effective
          example: 2026-03-01
          minLength: 1
      required:
      - currency
      - effectiveFrom
      - msrp
      - productId
    BulkIngestRequestBasePriceBulkIngestRecord:
      type: object
      description: 'Generic bulk ingest request: a batch of records for a job scoped to a location'
      properties:
        jobId:
          type: string
          format: uuid
          description: Identifier of the bulk ingest job
          example: 01960003-0000-7000-8000-000000000001
        locationId:
          type: string
          format: uuid
          description: Location the records are ingested for
          example: 01960003-0000-7000-8000-000000000002
        records:
          type: array
          description: The records to ingest (at least one); shape depends on the target domain
          items:
            $ref: '#/components/schemas/BasePriceBulkIngestRecord'
          minItems: 1
        operatorId:
          type: string
          description: Identifier of the operator submitting the batch
          example: user-jdoe
      required:
      - jobId
      - locationId
      - records
    BulkIngestResponse:
      type: object
      description: 'Summary outcome of a bulk ingest job: per-record results plus aggregate counts'
      properties:
        totalSubmitted:
          type: integer
          format: int32
          description: Total number of records submitted in the batch
          example: 100
        successCount:
          type: integer
          format: int32
          description: Number of records ingested successfully
          example: 98
        failureCount:
          type: integer
          format: int32
          description: Number of records that failed ingest
          example: 2
        results:
          type: array
          description: Per-record outcomes in submission order
          items:
            $ref: '#/components/schemas/BulkIngestResult'
      required:
      - failureCount
      - results
      - successCount
      - totalSubmitted
    BulkIngestResult:
      type: object
      description: Per-record outcome of a bulk ingest submission
      properties:
        rowIndex:
          type: integer
          format: int32
          description: Zero-based index of the record within the submitted batch
          example: 0
        entityId:
          type: string
          format: uuid
          description: Identifier of the entity created/updated for this record, when successful
          example: 01960003-0000-7000-8000-000000000001
        success:
          type: boolean
          description: Whether this record was ingested successfully
          example: true
        errorCode:
          type: string
          description: Machine-readable error code when the record failed
          example: VALIDATION_FAILED
        errorMessage:
          type: string
          description: Human-readable error detail when the record failed
          example: vin must be 17 characters
      required:
      - rowIndex
      - success
    PricingSnapshotResponse:
      type: object
      description: Response payload for immutable pricing snapshot retrieval
      properties:
        snapshotId:
          type: string
          format: uuid
          description: Snapshot identifier
          example: 4fd2de29-650f-4d97-9b80-01b476d9ce31
        createdAt:
          type: string
          format: date-time
          description: Snapshot creation timestamp
          example: 2026-03-05 21:38:21.752000+00:00
        sourceContext:
          type:
          - string
          - 'null'
          description: Optional source context
          example: quote-checkout
        itemIdentifier:
          type: string
          description: Identifier of the quoted item
          example: SKU:P001
        quantity:
          type: integer
          format: int32
          description: Quoted quantity
          example: 1
        prices:
          type: string
          description: Serialized prices payload
          example:
            unitPrice: 100.0
            total: 100.0
        appliedRules:
          type:
          - string
          - 'null'
          description: Serialized applied-rule details
        policyVersion:
          type: string
          description: Pricing policy version used
          example: 2026.03.1
      required:
      - createdAt
      - itemIdentifier
      - policyVersion
      - prices
      - quantity
      - snapshotId
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
