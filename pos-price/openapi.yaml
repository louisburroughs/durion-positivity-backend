        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
    PriceQuoteRequest:
      type: object
      description: Request payload for calculating contextual price quotes
      properties:
        productId:
          type: string
          format: uuid
          description: Product identifier
          example: 7f3c35db-b908-42fa-83f1-2ef46a3c2149
        quantity:
          type: integer
          format: int32
          description: Requested quantity
          example: 2
          minimum: 1
        locationId:
          type: string
          format: uuid
          description: Location identifier where quote applies
          example: 6b2896a2-d456-4e22-ab5b-8a67f32c4f59
        customerTierId:
          type: string
          format: uuid
          description: Customer tier identifier used for tier pricing rules
          example: ea2f17ef-f06e-40ec-a9d6-c2d1b3e56d8a
        effectiveTimestamp:
          type:
          - string
          - "null"
          format: date-time
          description: Optional timestamp for effective pricing lookup; defaults to
            current time if omitted
          example: 2026-03-05T21:15:00Z
      required:
      - customerTierId
      - locationId
      - productId
      - quantity
    MoneyAmount:
      type: object
      description: Monetary value object with amount and ISO-4217 currency code
      properties:
        amount:
          type: number
          description: Numeric monetary amount
          example: 125.5
        currency:
          type: string
          description: ISO-4217 currency code
          example: USD
    PriceQuoteResponse:
      type: object
      description: Calculated contextual price quote response
      properties:
        productId:
          type: string
          format: uuid
          description: Product identifier
          example: 7f3c35db-b908-42fa-83f1-2ef46a3c2149
        quantity:
          type: integer
          format: int32
          description: Quoted quantity
          example: 2
        msrp:
          $ref: "#/components/schemas/MoneyAmount"
          description: Manufacturer suggested retail price
        unitPrice:
          $ref: "#/components/schemas/MoneyAmount"
          description: Final unit price after applying applicable rules
        extendedPrice:
          $ref: "#/components/schemas/MoneyAmount"
          description: Extended price (unit price multiplied by quantity)
        priceSource:
          type: string
          description: Source from which the final price was resolved
          example: LOCATION_OVERRIDE
        pricingBreakdown:
          type: array
          description: Per-rule pricing breakdown entries
          items:
            $ref: "#/components/schemas/PricingBreakdownEntry"
        warnings:
          type: array
          description: Non-fatal warnings generated during quote calculation
          items:
            type: string
    PricingBreakdownEntry:
      type: object
      description: Single pricing-rule application entry within a quote breakdown
      properties:
        ruleName:
          type: string
          description: Rule name
          example: Tier Discount Rule
        ruleType:
          type: string
          description: Rule category/type
          example: CUSTOMER_TIER
        adjustment:
          $ref: "#/components/schemas/MoneyAmount"
          description: Amount adjusted by this rule
        resultingValue:
          $ref: "#/components/schemas/MoneyAmount"
          description: Running value after this rule adjustment
    BasePriceBulkIngestRecord:
      type: object
      properties:
        productId:
          type: string
          minLength: 1
        msrp:
          type: string
          minLength: 1
        currency:
          type: string
          maxLength: 3
          minLength: 3
        effectiveFrom:
          type: string
          minLength: 1
      required:
      - currency
      - effectiveFrom
      - msrp
      - productId
    BulkIngestRequestBasePriceBulkIngestRecord:
      type: object
      properties:
        jobId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        records:
          type: array
          items:
            $ref: "#/components/schemas/BasePriceBulkIngestRecord"
          minItems: 1
        operatorId:
          type: string
      required:
      - jobId
      - locationId
      - records
    BulkIngestResponse:
      type: object
      properties:
        totalSubmitted:
          type: integer
          format: int32
        successCount:
          type: integer
          format: int32
        failureCount:
          type: integer
          format: int32
        results:
          type: array
          items:
            $ref: "#/components/schemas/BulkIngestResult"
    BulkIngestResult:
      type: object
      properties:
        rowIndex:
          type: integer
          format: int32
        entityId:
          type: string
          format: uuid
        success:
          type: boolean
        errorCode:
          type: string
        errorMessage:
          type: string
    PricingSnapshotResponse:
      type: object
      description: Response payload for immutable pricing snapshot retrieval
      properties:
        snapshotId:
          type: string
          format: uuid
          description: Snapshot identifier
          example: 4fd2de29-650f-4d97-9b80-01b476d9ce31
        createdAt:
          type: string
          format: date-time
          description: Snapshot creation timestamp
          example: 2026-03-05T21:38:21.752Z
        sourceContext:
          type:
          - string
          - "null"
          description: Optional source context
          example: quote-checkout
        itemIdentifier:
          type: string
          description: Identifier of the quoted item
          example: SKU:P001
        quantity:
          type: integer
          format: int32
          description: Quoted quantity
          example: 1
        prices:
          type: string
          description: Serialized prices payload
        appliedRules:
          type:
          - string
          - "null"
          description: Serialized applied-rule details
        policyVersion:
          type: string
          description: Pricing policy version used
          example: 2026.03.1
