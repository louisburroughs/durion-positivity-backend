spring:
  application:
    name: pos-customer-test
  datasource:
    # MODE=PostgreSQL matches this module's own dev profile. Without it these tests ran on plain H2
    # dialect while production and dev are Postgres, so H2-only behaviour could pass here unnoticed.
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: false
  main:
    allow-bean-definition-overriding: true

# Disable security for tests
security:
  enabled: false

# Disable eureka for tests  
eureka:
  client:
    enabled: false


# Logging
logging:
  level:
    com:
      positivity: DEBUG
    org:
      springframework:
        security: DEBUG
