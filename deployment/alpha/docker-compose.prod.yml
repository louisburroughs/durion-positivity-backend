# Alpha deployment override for docker-compose.yml.
# Replaces build: contexts with pre-built ECR images and sets production restart policies.
# Deployed to /opt/durion/alpha/docker-compose.prod.yml by the build-push-ecr workflow.
#
# Required .env values (managed automatically by the deploy workflows):
#   ECR_REGISTRY  – e.g. 288757602241.dkr.ecr.us-east-1.amazonaws.com
#   BACKEND_TAG   – e.g. sha-a1b2c3d  (set by backend build workflow)
#   FRONTEND_TAG  – e.g. sha-44455b8  (set by frontend build workflow)

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:

  # ── Infrastructure ─────────────────────────────────────────────────────────

  postgres:
    restart: unless-stopped
    logging: *logging

  # ── Kafka domain-event backbone (ADR-0044, #838) ───────────────────────────

  kafka:
    restart: unless-stopped
    logging: *logging

  kafka-exporter:
    restart: unless-stopped
    logging: *logging

  # kafka-topic-init runs once (restart: no) — no override needed.

  # ── Observability ──────────────────────────────────────────────────────────

  prometheus:
    restart: unless-stopped
    logging: *logging

  grafana:
    restart: unless-stopped
    logging: *logging

  otel-collector:
    restart: unless-stopped
    logging: *logging

  loki:
    restart: unless-stopped
    logging: *logging

  docker-socket-proxy:
    restart: unless-stopped
    logging: *logging

  cadvisor:
    restart: unless-stopped
    logging: *logging

  postgres-exporter:
    restart: unless-stopped
    logging: *logging

  promtail:
    restart: unless-stopped
    logging: *logging

  # ── Ollama (Docker Hub image — no ECR) ─────────────────────────────────────

  ollama:
    restart: unless-stopped
    logging: *logging

  # ollama-init runs once (restart: no) — no override needed.

  # ── Durion Backend Services ────────────────────────────────────────────────

  eureka-server:
    image: ${ECR_REGISTRY}/durion/eureka-server:${BACKEND_TAG}
    restart: unless-stopped
    logging: *logging

  pos-accounting:
    image: ${ECR_REGISTRY}/durion/pos-accounting:${BACKEND_TAG}
    restart: unless-stopped
    logging: *logging
    # No Kafka flag: pos-accounting's consumers and outbox are tier-1, always on (ADR-0044 §4, #2195).

  pos-api-gateway:
    image: ${ECR_REGISTRY}/durion/pos-api-gateway:${BACKEND_TAG}
    restart: unless-stopped
    logging: *logging

  pos-bulk-loader:
    image: ${ECR_REGISTRY}/durion/pos-bulk-loader:${BACKEND_TAG}
    restart: unless-stopped
    logging: *logging

  pos-catalog:
    image: ${ECR_REGISTRY}/durion/pos-catalog:${BACKEND_TAG}
    restart: unless-stopped
    logging: *logging
    # No Kafka flag: the domain-event rails are tier-1, always on (ADR-0044 §4, #2463).

  pos-customer:
    image: ${ECR_REGISTRY}/durion/pos-customer:${BACKEND_TAG}
    restart: unless-stopped
    logging: *logging
    # No Kafka flag: pos-customer's consumers and outbox are tier-1, always on (ADR-0044 §4, #2463).

  pos-event-receiver:
    image: ${ECR_REGISTRY}/durion/pos-event-receiver:${BACKEND_TAG}
    restart: unless-stopped
    logging: *logging

  pos-image:
    image: ${ECR_REGISTRY}/durion/pos-image:${BACKEND_TAG}
    restart: unless-stopped
    logging: *logging

  pos-inventory:
    image: ${ECR_REGISTRY}/durion/pos-inventory:${BACKEND_TAG}
    restart: unless-stopped
    logging: *logging
    # No Kafka flag: pos-inventory's consumers and outbox are tier-1, always on (ADR-0044 §4, #2195).

  pos-invoice:
    image: ${ECR_REGISTRY}/durion/pos-invoice:${BACKEND_TAG}
    restart: unless-stopped
    logging: *logging
    # No Kafka flag: pos-invoice's consumers and outbox are tier-1, always on (ADR-0044 §4, #2463).

  pos-location:
    image: ${ECR_REGISTRY}/durion/pos-location:${BACKEND_TAG}
    restart: unless-stopped
    logging: *logging
    # No Kafka flag: the domain-event rails are tier-1, always on (ADR-0044 §4, #2463).

  pos-marketing:
    image: ${ECR_REGISTRY}/durion/pos-marketing:${BACKEND_TAG}
    restart: unless-stopped
    logging: *logging
    # No Kafka flag: the domain-event rails are tier-1, always on (ADR-0044 §4, #2463).

  pos-platform-sender:
    image: ${ECR_REGISTRY}/durion/pos-platform-sender:${BACKEND_TAG}
    restart: unless-stopped
    logging: *logging
    # Transport, AWS settings and the send secret come from the base compose's
    # POS_PLATFORM_SENDER_* interpolation of the on-box .env; until an operator sets
    # POS_PLATFORM_SENDER_TRANSPORT=aws it runs the 'log' transport and contacts nobody.

  pos-mcp-server:
    image: ${ECR_REGISTRY}/durion/pos-mcp-server:${BACKEND_TAG}
    restart: unless-stopped
    logging: *logging
    environment:
      # Stamped on every eval turn trace so a gate run records the build it measured (#1806).
      MCP_BUILD_ID: ${BACKEND_TAG:-unknown}

  pos-order:
    image: ${ECR_REGISTRY}/durion/pos-order:${BACKEND_TAG}
    restart: unless-stopped
    logging: *logging
    # No Kafka flag: pos-order's consumers and outbox are tier-1, always on (ADR-0044 §4, #2463).
    # pos-inventory builds its ext_purchase_order replicas from order.events.v1.

  pos-people:
    image: ${ECR_REGISTRY}/durion/pos-people:${BACKEND_TAG}
    restart: unless-stopped
    logging: *logging
    # No Kafka flag: the domain-event rails are tier-1, always on (ADR-0044 §4, #2463).

  pos-people-contact:
    image: ${ECR_REGISTRY}/durion/pos-people-contact:${BACKEND_TAG}
    restart: unless-stopped
    logging: *logging
    # No Kafka flag: the domain-event rails are tier-1, always on (ADR-0044 §4, #2463).

  pos-price:
    image: ${ECR_REGISTRY}/durion/pos-price:${BACKEND_TAG}
    restart: unless-stopped
    logging: *logging

  # Fake external labor-guide vendor (#1569 Phase 1, sourcing plan §10). Runs in alpha so the
  # labor-guide flow can be demoed there, but pos-catalog's alpha profile ships with
  # pos.catalog.labor-guide.enabled=false, so nothing calls it until that flag is flipped.
  pos-reference-mock:
    image: ${ECR_REGISTRY}/durion/pos-reference-mock:${BACKEND_TAG}
    restart: unless-stopped
    logging: *logging

  pos-security-service:
    image: ${ECR_REGISTRY}/durion/pos-security-service:${BACKEND_TAG}
    restart: unless-stopped
    logging: *logging

  pos-shop-manager:
    image: ${ECR_REGISTRY}/durion/pos-shop-manager:${BACKEND_TAG}
    restart: unless-stopped
    logging: *logging
    # No Kafka flag: the domain-event rails are tier-1, always on (ADR-0044 §4, #2463).

  pos-supplier:
    image: ${ECR_REGISTRY}/durion/pos-supplier:${BACKEND_TAG}
    restart: unless-stopped
    logging: *logging
    # No Kafka flag: the domain-event rails are tier-1, always on (ADR-0044 §4, #2463).

  pos-tax:
    image: ${ECR_REGISTRY}/durion/pos-tax:${BACKEND_TAG}
    restart: unless-stopped
    logging: *logging

  pos-tenant:
    image: ${ECR_REGISTRY}/durion/pos-tenant:${BACKEND_TAG}
    restart: unless-stopped
    logging: *logging
    # No Kafka flag: the domain-event rails are tier-1, always on (ADR-0044 §4, #2463).

  pos-documents:
    image: ${ECR_REGISTRY}/durion/pos-documents:${BACKEND_TAG}
    restart: unless-stopped
    logging: *logging

  pos-vehicle-inventory:
    image: ${ECR_REGISTRY}/durion/pos-vehicle-inventory:${BACKEND_TAG}
    restart: unless-stopped
    logging: *logging
    # No Kafka flag: the domain-event rails are tier-1, always on (ADR-0044 §4, #2463).

  pos-warranty:
    image: ${ECR_REGISTRY}/durion/pos-warranty:${BACKEND_TAG}
    restart: unless-stopped
    logging: *logging
    # No Kafka flag: pos-warranty's consumers and outbox are tier-1, always on (ADR-0044 §4, #2463).

  pos-workorder:
    image: ${ECR_REGISTRY}/durion/pos-workorder:${BACKEND_TAG}
    restart: unless-stopped
    logging: *logging
    # No Kafka flag: pos-workorder's consumers and outbox are tier-1, always on (ADR-0044 §4, #2463).

  # ── Frontend ───────────────────────────────────────────────────────────────

  pos-frontend:
    image: ${ECR_REGISTRY}/durion/durion-positivity-frontend:${FRONTEND_TAG}
    restart: unless-stopped
    logging: *logging
