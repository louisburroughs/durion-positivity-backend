domain: crm
serviceName: pos-customer
version: "1.0"
permissions:
  - name: "crm:billing_rules:edit"
    description: "Create or update billing rules configuration for a commercial party"
  - name: "crm:consent:manage"
    description: "Set per-channel marketing consent, opt-out reasons, and the account master gate"
  - name: "crm:consent:view"
    description: "View per-channel marketing consent and the consent-change audit trail"
  - name: "crm:contact:create"
    description: "Add new contact point (email/phone) to a party"
  - name: "crm:contact:delete"
    description: "Remove contact point from a party"
  - name: "crm:contact:edit"
    description: "Edit contact point details"
  - name: "crm:contact:view"
    description: "View contact points (email, phone) for a party"
  - name: "crm:contact_preference:edit"
    description: "Update communication channel preferences"
  - name: "crm:contact_preference:view"
    description: "View communication preferences for a party"
  - name: "crm:contact_role:assign"
    description: "Assign roles (BILLING, APPROVER, DRIVER) to contacts"
  - name: "crm:contact_role:revoke"
    description: "Revoke a role assignment from a contact"
  - name: "crm:contact_role:view"
    description: "View assigned roles for contacts on an account"
  - name: "crm:followup:manage"
    description: "Manage followup"
  - name: "crm:followup:view"
    description: "View followup"
  - name: "crm:inquiry:manage"
    description: "Manage inquiry"
  - name: "crm:inquiry:view"
    description: "View inquiry"
  - name: "crm:integration:audit"
    description: "View audit/attempt history for ingestion records"
  - name: "crm:interaction:view"
    description: "View a party's interaction and touch history (campaign sends, calls, notes)"
  - name: "crm:party:create"
    description: "Create new commercial account (party)"
  - name: "crm:party:deactivate"
    description: "Deactivate a party record (soft delete)"
  - name: "crm:party:edit"
    description: "Edit party master data (name, tax ID, identifiers)"
  - name: "crm:party:merge"
    description: "Merge two party records into one survivor"
  - name: "crm:party:search"
    description: "Search parties by name, email, phone, tax ID"
  - name: "crm:party:view"
    description: "View party (person/organization) records and details"
  - name: "crm:person:create"
    description: "Create person"
  - name: "crm:person:read"
    description: "Read person"
  - name: "crm:processing_log:view"
    description: "View ingestion event processing outcomes"
  - name: "crm:promotion_redemption:record"
    description: "Record promotion redemption"
  - name: "crm:promotion_redemption:view"
    description: "View promotion redemption"
  - name: "crm:relationship:create"
    description: "Create relationship"
  - name: "crm:relationship:delete"
    description: "Delete relationship"
  - name: "crm:relationship:read"
    description: "Read relationship"
  - name: "crm:relationship:update"
    description: "Update relationship"
  - name: "crm:segment:manage"
    description: "Create, edit, or delete audience segments and their membership"
  - name: "crm:segment:resolve"
    description: "Resolve a segment to its matching parties (counts and masked sample)"
  - name: "crm:segment:view"
    description: "View saved audience segments and their definitions"
  - name: "crm:suppression:manage"
    description: "Add or remove hard address-level suppression entries"
  - name: "crm:suppression:view"
    description: "View the marketing suppression list"
  - name: "crm:suspense:view"
    description: "View quarantined/unprocessable events"
  - name: "crm:tag:assign"
    description: "Attach or detach tags on a party"
  - name: "crm:tag:manage"
    description: "Create, edit, retire, or delete CRM tags"
  - name: "crm:tag:view"
    description: "View the CRM tag catalog and tags attached to parties"
  - name: "crm:vehicle:create"
    description: "Associate a vehicle VIN with a party"
  - name: "crm:vehicle:search"
    description: "Search vehicles by VIN, unit #, or plate"
  - name: "crm:vehicle:view"
    description: "View vehicle records (VIN, unit #, description, plate)"
  - name: "crm:vehicle_party_association:create"
    description: "Associate party to vehicle"
  - name: "crm:vehicle_party_association:edit"
    description: "Adjust effective dates for associations"
  - name: "crm:vehicle_party_association:view"
    description: "View party associations for a vehicle"
  - name: "crm:vehicle_preference:edit"
    description: "Update vehicle care preferences"
  - name: "crm:vehicle_preference:view"
    description: "View vehicle care preferences"
