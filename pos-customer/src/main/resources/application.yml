spring:
  application:
    name: customer
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      "[hibernate.format_sql]": true
  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: pos-customer-workorder-events
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 0
  tomcat:
    max-http-header-size: 65536

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    org:
      springframework: INFO
    com:
      positivity:
        customer: INFO

      netflix:
        discovery:
          shared:
            resolver:
              aws:
                ConfigClusterResolver: WARN
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

  default-produces-media-type: application/json
pos:
  customer:
    crm:
      # Service-due segment attribute (#1144): a party is `service.due` once its last completed
      # service is at least this many whole months old. Fallback interval only (#1175): a
      # vehicle's care-preference interval replicated from pos-vehicle-inventory
      # (ext_vehicle_care_preference) takes precedence; this default covers vehicles without an
      # override and vehicle-less service history.
      service-due-months: ${POS_CUSTOMER_SERVICE_DUE_MONTHS:6}
      # Service-due reminder feed (#1153): raises one SERVICE_DUE_REMINDER follow-up task per
      # party/vehicle service cycle once its latest completion is service-due-months old.
      # Idempotent via a deterministic source_event_id, so reruns and concurrent instances
      # cannot duplicate a task.
      service-due-reminders-enabled: ${POS_CUSTOMER_SERVICE_DUE_REMINDERS_ENABLED:true}
      # Interval poll, not a cron: the due cutoff comes from the application Clock, which the
      # accelerated profile advances far faster than the scheduler's own real clock.
      service-due-reminder-interval-ms: ${POS_CUSTOMER_SERVICE_DUE_REMINDER_INTERVAL_MS:86400000}
      service-due-reminder-batch-size: ${POS_CUSTOMER_SERVICE_DUE_REMINDER_BATCH_SIZE:500}
    inquiry:
      public:
        # Story #1154: the only unauthenticated write surface in pos-customer. OFF by default.
        # Before enabling: a captcha/bot check must be applied at the edge, the gateway must be
        # configured to route this path without a JWT (it currently has exactly one auth bypass,
        # the login endpoint), and edge rate limiting must be in place. The per-source ceiling
        # below is a correctness backstop, not a defence against volume.
        enabled: ${POS_CUSTOMER_PUBLIC_INQUIRY_ENABLED:false}
        max-submissions-per-hour: ${POS_CUSTOMER_PUBLIC_INQUIRY_MAX_PER_HOUR:5}
    kafka:
      workorder-events-topic: workorder-events
      # Service-history fact feed (FI-3, #1133): service-completion + declined-service facts
      # projected into the CRM service-history read model and declined-service follow-ups.
      workorder-facts-topic: ${POS_CUSTOMER_WORKORDER_FACTS_TOPIC:workorder.events.v1}
      workorder-facts-consumer-group: ${POS_CUSTOMER_WORKORDER_FACTS_CONSUMER_GROUP:pos-customer-workorder-facts}
      # Reconciliation manifests + drift-repair commands (ADR-0044)
      workorder-manifest-topic: ${POS_CUSTOMER_WORKORDER_MANIFEST_TOPIC:workorder.manifest.v1}
      workorder-commands-topic: ${POS_CUSTOMER_WORKORDER_COMMANDS_TOPIC:workorder.commands.v1}
      manifest-consumer-group: ${POS_CUSTOMER_MANIFEST_CONSUMER_GROUP:pos-customer-workorder-manifests}
      # Campaign-send facts logged onto the party interaction timeline (Story #1151)
      # (see pos.customer.inquiry below for the public capture form)
      marketing-events-topic: ${POS_CUSTOMER_MARKETING_EVENTS_TOPIC:marketing.events.v1}
      marketing-events-consumer-group: ${POS_CUSTOMER_MARKETING_EVENTS_CONSUMER_GROUP:pos-customer-marketing-events}
      # Vehicle replica feed + reconciliation (ADR-0044 §6, #843)
      vehicle-events-topic: ${POS_CUSTOMER_VEHICLE_EVENTS_TOPIC:vehicle.events.v1}
      vehicle-events-consumer-group: ${POS_CUSTOMER_VEHICLE_EVENTS_CONSUMER_GROUP:pos-customer-vehicle-events}
      vehicle-manifest-topic: ${POS_CUSTOMER_VEHICLE_MANIFEST_TOPIC:vehicle.manifest.v1}
      vehicle-manifest-consumer-group: ${POS_CUSTOMER_VEHICLE_MANIFEST_CONSUMER_GROUP:pos-customer-vehicle-manifests}
      vehicle-commands-topic: ${POS_CUSTOMER_VEHICLE_COMMANDS_TOPIC:vehicle.commands.v1}
      # Person identity replica feed + reconciliation + outbound identity commands
      # (ADR-0044 §6, #877)
      people-contact-events-topic: ${POS_CUSTOMER_PC_EVENTS_TOPIC:people-contact.events.v1}
      people-contact-events-consumer-group: ${POS_CUSTOMER_PC_EVENTS_CONSUMER_GROUP:pos-customer-people-contact-events}
      people-contact-manifest-topic: ${POS_CUSTOMER_PC_MANIFEST_TOPIC:people-contact.manifest.v1}
      people-contact-manifest-consumer-group: ${POS_CUSTOMER_PC_MANIFEST_CONSUMER_GROUP:pos-customer-people-contact-manifests}
      people-contact-commands-topic: ${POS_CUSTOMER_PC_COMMANDS_TOPIC:people-contact.commands.v1}
      # Own fact topic + reconciliation + inbound replay commands (ADR-0044 §6, #889)
      events-topic: ${POS_CUSTOMER_EVENTS_TOPIC:customer.events.v1}
      commands-topic: ${POS_CUSTOMER_COMMANDS_TOPIC:customer.commands.v1}
      commands-consumer-group: ${POS_CUSTOMER_COMMANDS_CONSUMER_GROUP:pos-customer-commands}
      enabled: ${POS_CUSTOMER_KAFKA_ENABLED:false}
    manifest:
      topic: ${POS_CUSTOMER_MANIFEST_TOPIC:customer.manifest.v1}
      window: ${POS_CUSTOMER_MANIFEST_WINDOW:PT1H}
      grace: ${POS_CUSTOMER_MANIFEST_GRACE:PT5M}

---
# Accelerated runs: the sweep polls on the scheduler's real clock while the due cutoff
# advances on the application clock. The daily default would leave ~2.7 virtual years
# between passes at the default 1000x scale, so poll every real minute (~17 virtual
# hours) instead. The sweep is cutoff-based and idempotent, so the tighter cadence only
# picks up what has come due.
spring:
  config:
    activate:
      on-profile: accelerated
pos:
  customer:
    crm:
      service-due-reminder-interval-ms: ${POS_CUSTOMER_SERVICE_DUE_REMINDER_INTERVAL_MS:60000}
