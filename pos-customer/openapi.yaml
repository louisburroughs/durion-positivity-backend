          maxLength: 500
          minLength: 0
          type: string
      required:
      - outcome
      type: object
    CommercialBulkIngestRecord:
      description: A single commercial account record within a bulk ingest request
      properties:
        billingTermsId:
          description: Billing terms identifier
          example: NET-30
          maxLength: 255
          minLength: 0
          type: string
        contactEmail:
          description: Primary email of the contact person
          example: dale.whitfield@piedmontfreight.example.com
          maxLength: 254
          minLength: 0
          type: string
        contactFirstName:
          description: First name of the primary contact to create and attach; requires contactLastName
          example: Dale
          maxLength: 255
          minLength: 0
          type: string
        contactLastName:
          description: Last name of the primary contact to create and attach; requires contactFirstName
          example: Whitfield
          maxLength: 255
          minLength: 0
          type: string
        contactPhone:
          description: Primary phone of the contact person
          example: '+17045550188'
          maxLength: 64
          minLength: 0
          type: string
        displayName:
          description: Display name; defaults to the legal name when omitted
          example: Piedmont Freight
          maxLength: 255
          minLength: 0
          type: string
        legalName:
          description: Registered legal name of the commercial account
          example: Piedmont Freight Carriers LLC
          maxLength: 255
          minLength: 0
          type: string
        taxId:
          description: Tax identifier (EIN)
          example: 27-4481203
          maxLength: 64
          minLength: 0
          type: string
      required:
      - legalName
