      - CRM Accounts
      summary: Check Commercial Party Duplicates
      description: 'Checks for existing commercial parties whose legal name contains the supplied name, flagging case-insensitive exact matches as EXACT with score 1.0 and other containment matches as FUZZY with score 0.7.

        Use this tool before createCrmCommercialAccount to avoid creating a duplicate customer; do not use searchParties for this, which does not classify match strength or surface an exactMatchPartyId.

        Preconditions: none; the check reads existing commercial parties only.

        Required inputs: legalName as a query parameter with at least 2 non-whitespace characters; there is no request body.

        Emits a CUSTOMER_PARTY_DUPLICATE_CHECK audit event; no state changes occur.

        Returns 400 when legalName is blank or shorter than 2 characters after trimming, and 200 with duplicatesFound false when no similar party exists.

        '
      operationId: checkPartyDuplicates
      parameters:
      - name: legalName
        in: query
        description: Legal name to check for duplicates
        required: true
        schema:
          type: string
          maxLength: 2147483647
          minLength: 2
        example: Acme Corporation
      responses:
        '200':
          description: Duplicate check completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateCheckResponse'
        '400':
          description: Invalid request - legalName too short or blank
        '403':
          description: Forbidden - insufficient permissions
      security:
      - bearerAuth:
        - crm:party:search
      x-required-permissions:
      - crm:party:search
  /v1/crm/suppression/{suppressionId}:
    delete:
      tags:
      - CRM Suppression
      summary: Lift Address Suppression
      description: 'Removes one suppression entry, allowing marketing to reach the address again subject to normal consent rules.

        Use this tool when an address was suppressed in error or a legal block is lifted; do not use updateMarketingConsent for this, which cannot override a suppression entry.

        Preconditions: the suppression entry must exist.

        Required inputs: suppressionId (UUID) as a path parameter; there is no request body.

        Emits a CRM_SUPPRESSION_REMOVE event and publishes a suppression-changed fact so consumers stop blocking the address.

        Returns 404 when no suppression entry exists for the supplied suppressionId.

        '
      operationId: removeSuppressionEntry
      parameters:
      - name: suppressionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Suppression lifted
        '404':
          description: Suppression entry not found
        '403':
          description: Forbidden - insufficient permissions
      security:
      - bearerAuth:
        - crm:suppression:manage
      x-required-permissions:
      - crm:suppression:manage
  /v1/crm/segments/{segmentId}/members/{partyId}:
    delete:
      tags:
      - CRM Segments
      summary: Unpin Segment Member
      description: 'Removes one party from a static segment''s pinned member list.

        Use this tool when a hand-picked party should leave the audience; do not use deleteSegment, which removes the whole segment and every member with it.

        Preconditions: none are enforced; removing a party that is not a member, or naming an unknown segment, is a silent no-op.

        Required inputs: segmentId and partyId (UUIDs) as path parameters; there is no request body.

        Emits a CRM_SEGMENT_MEMBER_REMOVE event; at most one membership row is deleted.

        Returns 204 in every authorized call, including when nothing was actually removed.

        '
      operationId: removeSegmentMember
      parameters:
      - name: segmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: partyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Member removed
        '403':
          description: Forbidden - insufficient permissions
      security:
      - bearerAuth:
        - crm:segment:manage
      x-required-permissions:
      - crm:segment:manage
  /v1/crm/parties/{partyId}/tags/{tagId}:
    delete:
      tags:
      - CRM Tags
      summary: Remove Tag From Party
      description: 'Detaches a tag from a party while leaving the tag itself in the catalog.

        Use this tool when a label no longer applies to a party; use deleteTag instead to remove the tag from the catalog and every party at once.

        Preconditions: none; removing a tag that is not assigned is an idempotent no-op.

        Required inputs: partyId and tagId (UUIDs) as path parameters; there is no request body.

        Emits a CRM_PARTY_TAG_REMOVE event and publishes a party-tag-changed fact when an assignment was actually removed.

        Returns 204 in every authorized call, including when nothing was assigned.

        '
      operationId: removeTagFromParty
      parameters:
      - name: partyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: tagId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Tag removed
        '403':
          description: Forbidden - insufficient permissions
      security:
      - bearerAuth:
        - crm:tag:assign
      x-required-permissions:
      - crm:tag:assign
  /v1/crm/commercial-accounts/{partyId}/relationships/{relationshipId}:
    delete:
      tags:
      - CRM Party Relationships
      summary: Deactivate Party Relationship
      description: 'Soft-deletes a relationship between a person and a commercial account by setting its effective end date to today; the historical record is retained.

        Use this tool when a person no longer represents the account; do not use createPartyRelationship to fix a wrong assignment without first deactivating the old one, since overlapping active roles are rejected.

        Preconditions: the relationship must exist; the partyId in the path is not validated against the relationship on this operation.

        Required inputs: partyId and relationshipId (UUIDs) as path parameters; there is no request body.

        Emits a CRM_RELATIONSHIP_DEACTIVATE event and re-emits the person''s identity fact because their account linkage changed.

        Returns 404 when no relationship exists for the supplied relationshipId.

        '
      operationId: deactivatePartyRelationship
      parameters:
      - name: partyId
        in: path
        description: The commercial account party ID
        required: true
        schema:
          type: string
          format: uuid
      - name: relationshipId
        in: path
        description: The relationship ID to deactivate
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Relationship deactivated
        '404':
          description: Relationship not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - missing required permission
      security:
      - bearerAuth:
        - crm:relationship:delete
      x-required-permissions:
      - crm:relationship:delete
components:
  schemas:
    CustomerDTO:
      type: object
      description: Customer data transfer object for API operations
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the customer
          example: 01960003-0000-7000-8000-000000000001
        partyId:
          type: string
          format: uuid
          description: CRM party identifier. Equal to id; exposed explicitly so callers can pass it to the CRM snapshot endpoints (GET /v1/crm/snapshot/party/{partyId}) without assuming the id mapping.
          example: 01960003-0000-7000-8000-000000000001
        customerNumber:
          type: string
          description: Unique customer number
          example: CUST-1001
          maxLength: 50
          minLength: 0
        lastName:
          type: string
          description: Last name of the customer. For a commercial party (customerType=COMMERCIAL), this field carries the organization's legal/registered name instead. Required when creating a customer (POST); optional on update (PUT), where an absent value leaves the existing name unchanged.
          example: Doe
          maxLength: 100
          minLength: 0
        firstName:
          type: string
          description: First name of the customer. For a commercial party (customerType=COMMERCIAL), this field carries the organization's display name instead. Required when creating a customer (POST); optional on update (PUT), where an absent value leaves the existing name unchanged.
          example: John
          maxLength: 100
          minLength: 0
        primaryAddress:
          type: string
          deprecated: true
          description: Legacy free-text address label. Superseded by the structured postal address in pos-people-contact (FI-4); retained for display compatibility.
          example: 123 Main St, Springfield
          maxLength: 255
          minLength: 0
        vehicleVins:
          type: array
          description: List of vehicle VINs associated with the customer. Omitting this field on an update leaves the customer's existing VINs unchanged; sending an empty list clears them.
          example:
          - 1HGCM82633A004352
          items:
            type: string
        customerType:
          type: string
          description: Type of customer (e.g., 'retail', 'commercial')
          example: retail
          maxLength: 50
          minLength: 0
    UpsertPartyTagRequest:
      type: object
      description: Request to create or update a CRM party tag
      properties:
        name:
          type: string
          description: Unique tag name
          example: Fleet Prospect
          maxLength: 100
          minLength: 0
        category:
          type: string
          description: Optional display grouping
          example: Lifecycle
          maxLength: 100
          minLength: 0
        color:
          type: string
          description: Presentation colour hint
          example: '#1f7a4d'
          pattern: ^#[0-9a-fA-F]{6}$
        active:
          type: boolean
          description: Whether the tag can be assigned; defaults to true on create
          example: true
      required:
      - name
    PartyTagResponse:
      type: object
      description: A CRM classification tag that can be attached to parties
      properties:
        tagId:
          type: string
          format: uuid
          description: Tag identifier
          example: 01960003-0000-7000-8000-000000000010
        name:
          type: string
          description: Unique tag name
          example: Fleet Prospect
        category:
          type: string
          description: Optional display grouping
          example: Lifecycle
        color:
          type: string
          description: Presentation colour hint
          example: '#1f7a4d'
        active:
          type: boolean
          description: Whether the tag can still be assigned
          example: true
        assignmentCount:
          type: integer
          format: int64
          description: Number of parties currently carrying the tag
          example: 42
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
      required:
      - active
      - assignmentCount
      - name
      - tagId
    And:
      allOf:
      - $ref: '#/components/schemas/SegmentPredicate'
      - type: object
        properties:
          nodes:
            type: array
            description: Child predicates
            items:
              oneOf:
              - $ref: '#/components/schemas/And'
              - $ref: '#/components/schemas/Comparison'
              - $ref: '#/components/schemas/Not'
              - $ref: '#/components/schemas/Or'
      description: All child predicates must match
    Comparison:
      allOf:
      - $ref: '#/components/schemas/SegmentPredicate'
      - type: object
        properties:
          attribute:
            type: string
            description: Attribute wire name
            example: party.accountTier
          operator:
            type: string
            description: Comparison operator
            enum:
            - EQUALS
            - NOT_EQUALS
            - IN
            - NOT_IN
            - GREATER_THAN
            - GREATER_THAN_OR_EQUAL
            - LESS_THAN
            - LESS_THAN_OR_EQUAL
            - IS_TRUE
            - IS_FALSE
            - IS_NULL
            - IS_NOT_NULL
            - CONTAINS_ANY
            - CONTAINS_ALL
            example: IN
          values:
            type: array
            description: Operand values; empty for unary operators
            items:
              type: string
      description: A single attribute test
    Not:
      allOf:
      - $ref: '#/components/schemas/SegmentPredicate'
      - type: object
        properties:
          node:
            description: Predicate to invert
            oneOf:
            - $ref: '#/components/schemas/And'
            - $ref: '#/components/schemas/Comparison'
            - $ref: '#/components/schemas/Not'
            - $ref: '#/components/schemas/Or'
      description: Inverts the child predicate
    Or:
      allOf:
      - $ref: '#/components/schemas/SegmentPredicate'
      - type: object
        properties:
          nodes:
            description: Child predicates
      description: At least one child predicate must match
    SegmentPredicate:
      description: Boolean predicate tree over the whitelisted segment attribute catalog
      discriminator:
        propertyName: nodeType
      properties:
        nodeType:
          type: string
      required:
      - nodeType
    UpsertSegmentRequest:
      type: object
      description: Request to create or update an audience segment
      properties:
        name:
          type: string
          description: Unique segment name
          example: Fleet accounts on credit hold
          maxLength: 150
          minLength: 0
        description:
          type: string
          description: What the segment is for
          maxLength: 1000
          minLength: 0
        audienceType:
          type: string
          description: Which kind of party the segment targets
          enum:
          - COMMERCIAL
          - INDIVIDUAL
          example: COMMERCIAL
        type:
          type: string
          description: STATIC for an explicit list, DYNAMIC for a stored predicate
          enum:
          - STATIC
          - DYNAMIC
        predicate:
          description: Predicate tree; required for DYNAMIC segments and rejected for STATIC ones
          oneOf:
          - $ref: '#/components/schemas/And'
          - $ref: '#/components/schemas/Comparison'
          - $ref: '#/components/schemas/Not'
          - $ref: '#/components/schemas/Or'
        active:
          type: boolean
          description: Whether the segment can be bound to a campaign; defaults to true
      required:
      - audienceType
      - name
      - type
    SegmentResponse:
      type: object
      description: A saved audience segment
      properties:
        segmentId:
          type: string
          format: uuid
          description: Segment identifier
        name:
          type: string
          description: Segment name
        description:
          type: string
          description: What the segment is for
        audienceType:
          type: string
          description: Targeted party kind
          enum:
          - COMMERCIAL
          - INDIVIDUAL
          example: COMMERCIAL
        type:
          type: string
          description: How membership is determined
          enum:
          - STATIC
          - DYNAMIC
          example: DYNAMIC
        predicate:
          description: Predicate tree for DYNAMIC segments
          oneOf:
          - $ref: '#/components/schemas/And'
          - $ref: '#/components/schemas/Comparison'
          - $ref: '#/components/schemas/Not'
          - $ref: '#/components/schemas/Or'
        active:
          type: boolean
          description: Whether the segment can be bound to a campaign
        memberCount:
          type: integer
          format: int64
          description: Pinned member count for STATIC segments; null for DYNAMIC
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
      required:
      - active
      - audienceType
      - name
      - segmentId
      - type
    UpdateMarketingConsentRequest:
      type: object
      description: Request to update per-channel marketing consent for a party
      properties:
        marketingEmailConsent:
          type: string
          description: New marketing consent for email
          enum:
          - OPT_IN
          - OPT_OUT
          - UNSET
          example: OPT_IN
        marketingSmsConsent:
          type: string
          description: New marketing consent for SMS
          enum:
          - OPT_IN
          - OPT_OUT
          - UNSET
          example: OPT_OUT
        optOutReason:
          type: string
          description: Reason recorded when a channel moves to OPT_OUT
          enum:
          - NOT_INTERESTED
          - TOO_FREQUENT
          - NEVER_SIGNED_UP
          - CONTENT_NOT_RELEVANT
          - LEGAL_DNC
          - OTHER
          example: TOO_FREQUENT
        source:
          type: string
          description: Where the change originated; defaults to CSR
          enum:
          - CSR
          - SELF_SERVICE
          - UNSUBSCRIBE_LINK
          - IMPORT
          - API
          - SYSTEM
        quietHoursStart:
          type: string
          description: Start of the local-time window during which marketing sends are held
          example: 1260
        quietHoursEnd:
          type: string
          description: End of the local-time window during which marketing sends are held
          example: 08:00
        maxMarketingSendsPerMonth:
          type: integer
          format: int32
          description: Cadence cap on marketing sends per calendar month
          example: 4
          maximum: 365
          minimum: 1
    MarketingConsentDecision:
      type: object
      description: Marketing send eligibility decision for a party and channel
      properties:
        partyId:
          type: string
          format: uuid
          description: Party the decision is about
        channel:
          type: string
          description: Channel evaluated
          enum:
          - EMAIL
          - SMS
          example: EMAIL
        allowed:
          type: boolean
          description: Whether a marketing send is permitted
          example: false
        reason:
          type: string
          description: Machine-readable decision reason
          enum:
          - OPT_IN
          - ACCOUNT_OPT_OUT
          - CONSENT_OPT_OUT
          - CONSENT_UNSET
          - NO_PRIMARY_CONTACT
          - SUPPRESSED
          - PARTY_NOT_FOUND
          example: ACCOUNT_OPT_OUT
        governingPartyId:
          type: string
          format: uuid
          description: Party whose personal consent governed the decision — the primary business contact for a commercial account, the party itself for an individual
      required:
      - allowed
      - channel
      - partyId
      - reason
    MarketingConsentSummaryResponse:
      type: object
      description: Per-channel marketing consent and suppression state for a party
      properties:
        partyId:
          type: string
          format: uuid
          description: Party identifier
        marketingEmailConsent:
          type: string
          description: Marketing consent for email
          enum:
          - OPT_IN
          - OPT_OUT
          - UNSET
          example: OPT_IN
        marketingSmsConsent:
          type: string
          description: Marketing consent for SMS
          enum:
          - OPT_IN
          - OPT_OUT
          - UNSET
          example: UNSET
        optOutReason:
          type: string
          description: Reason marketing consent was last withdrawn
        optOutAt:
          type: string
          format: date-time
          description: When marketing consent was last withdrawn
        accountMarketingOptOut:
          type: boolean
          description: Account-level hard gate; only meaningful for commercial parties, null for individuals
        quietHoursStart:
          type: string
          description: Start of the quiet-hours window
        quietHoursEnd:
          type: string
          description: End of the quiet-hours window
        maxMarketingSendsPerMonth:
          type: integer
          format: int32
          description: Cadence cap on marketing sends per month
        emailEligibility:
          $ref: '#/components/schemas/MarketingConsentDecision'
        smsEligibility:
          $ref: '#/components/schemas/MarketingConsentDecision'
