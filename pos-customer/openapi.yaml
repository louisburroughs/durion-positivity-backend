                  firstName: Dana
                  lastName: Ortiz
                  customerType: PERSON
                  primaryAddress: 100 Congress Ave, Austin, TX 78701
        required: true
      responses:
        '201':
          description: Customer created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDTO'
