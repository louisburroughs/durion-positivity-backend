          maxLength: 100
          minLength: 0
        lastName:
          type: string
          description: Last name of the customer
          example: Doe
          maxLength: 100
          minLength: 0
        email:
          type: string
          description: Email address of the customer
          example: jane@acme.com
          maxLength: 254
          minLength: 0
        phoneNumber:
          type: string
          description: Phone number of the customer
          example: +1-555-0142
          maxLength: 64
          minLength: 0
