          type: integer
          format: int32
          description: Total number of matching records
          example: 42
        pageNumber:
          type: integer
          format: int32
          description: Current page number
          example: 1
        pageSize:
          type: integer
          format: int32
          description: Items per page
          example: 20
      required:
      - pageNumber
      - pageSize
      - results
      - totalCount
    Pageable:
