              $ref: '#/components/schemas/CreatePersonRequest'
            examples:
              Individual with email and mobile:
                description: Individual with email and mobile
                value:
                  firstName: Dana
                  lastName: Ortiz
                  preferredContactMethod: EMAIL
                  emails:
                  - value: dana.ortiz@example.com
                    isPrimary: true
                  phones:
                  - value: '+15125550142'
                    type: PHONE_MOBILE
                    isPrimary: true
        required: true
      responses:
        '201':
          description: Person created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePersonResponse'
        '400':
          description: Invalid request - validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePersonResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePersonResponse'
        '403':
          description: Forbidden - missing required permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePersonResponse'
      security:
      - bearerAuth:
        - crm:person:create
      x-required-permissions:
      - crm:person:create
