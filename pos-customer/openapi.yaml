      properties:
        contactPointId:
          description: Contact point ID
          example: 01960003-0000-7000-8000-000000000002
          format: uuid
          type: string
        contactType:
          description: Type of contact point
          enum:
          - EMAIL
          - PHONE_MOBILE
          - PHONE_HOME
          - PHONE_WORK
          - FAX
          example: EMAIL
          type: string
        primary:
