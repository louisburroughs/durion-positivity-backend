          type: boolean
          description: Whether the customer is tax-exempt
          example: false
        paymentTerms:
          type: string
          description: Payment terms string
          example: Net 30
        creditLimit:
          type: number
          description: Maximum credit limit available; null means no configured limit
          example: 10000.0
        creditHold:
          type: boolean
          description: Whether the account is on a credit hold
          example: false
        invoiceDeliveryMethod:
          type: string
          description: Preferred invoice delivery method
          enum:
