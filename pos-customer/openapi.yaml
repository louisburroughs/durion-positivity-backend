                  accountId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  annualRevenue: 275000
                  activeContractCount: 3
                  accountAgeMonths: 18
                  applyTier: false
                  forceRecalculation: false
        required: true
      responses:
        '200':
          description: Tier resolved successfully
