    Comparison:
      allOf:
      - $ref: '#/components/schemas/SegmentPredicate'
      - properties:
          attribute:
            description: Attribute wire name
            example: party.accountTier
            type: string
          operator:
            description: Comparison operator
            enum:
            - EQUALS
            - NOT_EQUALS
            - IN
            - NOT_IN
            - GREATER_THAN
            - GREATER_THAN_OR_EQUAL
            - LESS_THAN
            - LESS_THAN_OR_EQUAL
            - IS_TRUE
            - IS_FALSE
            - IS_NULL
            - IS_NOT_NULL
            - CONTAINS_ANY
            - CONTAINS_ALL
            example: IN
            type: string
          values:
            description: Operand values; empty for unary operators
            items:
              type: string
            type: array
        type: object
      description: A single attribute test
    ContactPointDto:
