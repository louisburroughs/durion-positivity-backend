                value:
                  channel: EMAIL
                  address: bounced@example.com
                  partyId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  reason: HARD_BOUNCE
                  source: SYSTEM
        required: true
      responses:
