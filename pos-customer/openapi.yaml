          example: jane@example.com
          maxLength: 320
          minLength: 0
        partyId:
          type: string
          format: uuid
          description: Party the address belonged to, when known
        reason:
          type: string
          description: Why the address is blocked
          enum:
          - HARD_BOUNCE
          - SPAM_COMPLAINT
          - LEGAL_DNC
          - MANUAL
          - UNSUBSCRIBE_LINK
          example: HARD_BOUNCE
        source:
          type: string
          description: Where the block originated; defaults to CSR
          enum:
          - CSR
          - SELF_SERVICE
          - UNSUBSCRIBE_LINK
          - IMPORT
          - API
          - SYSTEM
      required:
      - address
      - channel
      - reason
    SuppressionEntryResponse:
      type: object
      description: A hard address-level marketing block
      properties:
        suppressionId:
          type: string
          format: uuid
          description: Suppression identifier
        channel:
          type: string
          description: Channel the block applies to
          enum:
          - EMAIL
          - SMS
          example: EMAIL
        addressHint:
          type: string
          description: Masked address; the raw value is never stored or returned
          example: j***@example.com
        partyId:
          type: string
          format: uuid
          description: Party the address belonged to when blocked
        reason:
          type: string
          description: Why the address is blocked
          example: HARD_BOUNCE
        source:
          type: string
          description: Where the block originated
          example: SYSTEM
        createdBy:
          type: string
          description: Actor that created the block
        createdAt:
          type: string
          format: date-time
          description: When the block was created
      required:
      - channel
      - createdAt
      - reason
      - source
      - suppressionId
