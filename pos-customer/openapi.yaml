          example: Acme Industrial Supply, LLC
          maxLength: 255
          minLength: 0
        displayName:
          type: string
          description: Display/trading name
          example: Acme Supply
          maxLength: 255
          minLength: 0
        taxId:
          type: string
          description: Tax identification number (required for certain jurisdictions)
          example: 12-3456789
          maxLength: 64
          minLength: 0
        partyType:
          type: string
          description: Party type (ORGANIZATION|INDIVIDUAL; default ORGANIZATION for commercial accounts)
          example: ORGANIZATION
          maxLength: 32
          minLength: 0
        billingTermsId:
          type: string
          description: Billing terms ID (foreign key to Billing domain)
          example: 01960003-0000-7000-8000-000000000001
        externalIdentifiers:
          type: object
          additionalProperties:
            type: string
          description: External identifiers (system-specific IDs from upstream systems)
          example:
            erp: CUST-00123
        contactFirstName:
          type: string
          description: Primary contact first name
          example: Jane
          maxLength: 255
          minLength: 0
        contactLastName:
          type: string
          description: Primary contact last name
          example: Smith
          maxLength: 255
          minLength: 0
        email:
          type: string
          format: email
          description: Contact email
          example: jane@acme.com
          maxLength: 255
          minLength: 0
        phone:
          type: string
          description: Contact phone
          example: +1-555-123-4567
          maxLength: 64
          minLength: 0
