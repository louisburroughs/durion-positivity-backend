        required: false
        schema:
          type: string
          default: PERSON
        example: PERSON
      - name: name
        in: query
        description: Case-insensitive partial name filter for typeahead search
        required: false
        schema:
          type: string
        example: doe
      - name: email
        in: query
        description: Case-insensitive email filter for typeahead search
        required: false
        schema:
          type: string
        example: jdoe@acme.com
      - name: pageable
        in: query
        description: Pagination parameters (page, size, sort)
        required: true
        schema:
          $ref: '#/components/schemas/Pageable'
      responses:
        '200':
          description: Page of customers returned successfully.
          content:
            application/json:
              schema:
