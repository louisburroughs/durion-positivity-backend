    And:
      allOf:
      - $ref: '#/components/schemas/SegmentPredicate'
      - type: object
        properties:
          nodes:
            type: array
            description: Child predicates
            items:
              oneOf:
              - $ref: '#/components/schemas/And'
              - $ref: '#/components/schemas/Comparison'
              - $ref: '#/components/schemas/Not'
              - $ref: '#/components/schemas/Or'
      description: All child predicates must match
    Comparison:
      allOf:
      - $ref: '#/components/schemas/SegmentPredicate'
      - type: object
        properties:
          attribute:
            type: string
            description: Attribute wire name
            example: party.accountTier
          operator:
            type: string
            description: Comparison operator
            enum:
            - EQUALS
            - NOT_EQUALS
            - IN
            - NOT_IN
            - GREATER_THAN
            - GREATER_THAN_OR_EQUAL
            - LESS_THAN
            - LESS_THAN_OR_EQUAL
            - IS_TRUE
            - IS_FALSE
            - IS_NULL
            - IS_NOT_NULL
            - CONTAINS_ANY
            - CONTAINS_ALL
            example: IN
          values:
            type: array
            description: Operand values; empty for unary operators
            items:
              type: string
      description: A single attribute test
    Not:
      allOf:
      - $ref: '#/components/schemas/SegmentPredicate'
      - type: object
        properties:
          node:
            description: Predicate to invert
            oneOf:
            - $ref: '#/components/schemas/And'
            - $ref: '#/components/schemas/Comparison'
            - $ref: '#/components/schemas/Not'
            - $ref: '#/components/schemas/Or'
      description: Inverts the child predicate
    Or:
      allOf:
      - $ref: '#/components/schemas/SegmentPredicate'
      - type: object
        properties:
          nodes:
            description: Child predicates
      description: At least one child predicate must match
    SegmentPredicate:
      description: Boolean predicate tree over the whitelisted segment attribute catalog
      discriminator:
        propertyName: nodeType
      properties:
        nodeType:
          type: string
      required:
      - nodeType
    UpsertSegmentRequest:
      type: object
