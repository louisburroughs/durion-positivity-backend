components:
  schemas:
    CustomerDTO:
      type: object
      description: Customer object to be created
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the customer
          example: 01960003-0000-7000-8000-000000000001
        partyId:
          type: string
          format: uuid
          description: CRM party identifier. Equal to id; exposed explicitly so callers can pass it to the CRM snapshot endpoints (GET /v1/crm/snapshot/party/{partyId}) without assuming the id mapping.
          example: 01960003-0000-7000-8000-000000000001
        customerNumber:
          type: string
          description: Unique customer number
          example: CUST-1001
          maxLength: 50
          minLength: 0
        lastName:
          type: string
          description: Last name of the customer
          example: Doe
          maxLength: 100
