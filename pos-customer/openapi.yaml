        required: true
        schema:
          type: string
          enum:
          - EMAIL
          - SMS
      - name: address
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Result returned
          content:
            application/json:
              schema:
                type: boolean
        '403':
          description: Forbidden - insufficient permissions
      security:
      - bearerAuth:
        - crm:suppression:view
      x-required-permissions:
      - crm:suppression:view
