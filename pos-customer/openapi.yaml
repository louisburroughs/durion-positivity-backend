          enum:
          - STATIC
          - DYNAMIC
        predicate:
          description: Predicate tree; required for DYNAMIC segments and rejected for STATIC ones
          oneOf:
          - $ref: '#/components/schemas/And'
          - $ref: '#/components/schemas/Comparison'
          - $ref: '#/components/schemas/Not'
          - $ref: '#/components/schemas/Or'
