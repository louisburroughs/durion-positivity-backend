    AccountSummary:
      type: object
      description: Account summary surfaced in a CRM snapshot
      properties:
        partyId:
          type: string
          description: Canonical party identifier of the account
          example: 01960003-0000-7000-8000-000000000001
        accountNumber:
          type: string
          description: Human-readable account/customer number
          example: CUST-000123
        accountName:
          type: string
          description: Account display name
          example: Acme Industrial Supply, LLC
        accountType:
          type: string
          description: Account type discriminator
          example: ORGANIZATION
      required:
      - accountName
      - accountNumber
      - accountType
      - partyId
    BillingPreferences:
      type: object
      description: Account-level billing preferences within a CRM snapshot
      properties:
        marketingOptOut:
          type: boolean
          description: Whether the account has opted out of marketing communications
          example: false
        doNotContact:
          type: boolean
          description: Whether the account should not be contacted at all
          example: false
        invoiceDeliveryMethod:
          type: string
          description: Preferred invoice delivery method
          example: EMAIL
      required:
      - doNotContact
      - marketingOptOut
    ContactPreferences:
      type: object
      description: Communication preferences for a contact
      properties:
        emailOptIn:
          type: boolean
          description: Whether the contact has opted in to email communications
          example: true
        smsOptIn:
          type: boolean
          description: Whether the contact has opted in to SMS communications
          example: false
        phoneOptIn:
          type: boolean
          description: Whether the contact has opted in to phone communications
          example: true
        doNotContact:
          type: boolean
          description: Whether the contact should not be contacted at all
          example: false
        preferredContactMethod:
          type: string
          description: Preferred method of contact
          example: EMAIL
        preferredLanguage:
          type: string
          description: Preferred language for communications
          example: en-US
      required:
      - doNotContact
      - emailOptIn
      - phoneOptIn
      - smsOptIn
    ContactSummary:
      type: object
      description: Contact summary surfaced in a CRM snapshot
      properties:
        contactId:
          type: string
          description: Identifier of the contact
          example: 01960003-0000-7000-8000-000000000020
        name:
          type: string
          description: Contact display name
          example: Jane Doe
        roles:
          type: array
          description: Roles assigned to this contact
          example:
          - BILLING
          - APPROVER
          items:
            type: string
        phoneNumbers:
          type: array
          description: Phone numbers for this contact
          items:
            $ref: '#/components/schemas/PhoneNumberDTO'
        emailAddresses:
          type: array
          description: Email addresses for this contact
          items:
            $ref: '#/components/schemas/EmailAddressDTO'
        preferences:
          $ref: '#/components/schemas/ContactPreferences'
        primary:
          type: boolean
      required:
      - contactId
      - emailAddresses
      - name
      - phoneNumbers
      - roles
    CrmSnapshotDTO:
      type: object
      description: Read-only CRM snapshot of an account, its contacts, vehicles, and billing configuration
      properties:
        snapshotMetadata:
          $ref: '#/components/schemas/SnapshotMetadata'
        account:
          $ref: '#/components/schemas/AccountSummary'
        contacts:
          type: array
          description: Contacts associated with the account
          items:
            $ref: '#/components/schemas/ContactSummary'
        vehicles:
          type: array
          description: Vehicles associated with the account
          items:
            $ref: '#/components/schemas/VehicleSummary'
        preferences:
          $ref: '#/components/schemas/BillingPreferences'
        billingRules:
          $ref: '#/components/schemas/BillingRuleRef'
      required:
      - account
      - contacts
      - snapshotMetadata
      - vehicles
    EmailAddressDTO:
      type: object
      description: An email address for a contact
      properties:
        type:
          type: string
          description: Email address type
          example: WORK
        address:
          type: string
          description: Email address value
          example: jane@acme.com
      required:
      - address
      - type
    PhoneNumberDTO:
      type: object
      description: A phone number for a contact
      properties:
        type:
          type: string
          description: Phone number type
          example: MOBILE
        number:
          type: string
          description: Phone number value
          example: +1-555-0142
      required:
      - number
      - type
    SnapshotMetadata:
      type: object
      description: Metadata describing a CRM snapshot, including freshness and version
      properties:
        snapshotId:
          type: string
          format: uuid
          description: Unique identifier of the snapshot
          example: 01960003-0000-7000-8000-000000000001
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the snapshot was created (ISO 8601)
          example: 2026-06-17 10:15:30+00:00
        version:
          type: string
          description: Snapshot schema/content version
          example: '1'
        source:
          type: string
          description: Data source the snapshot was served from
          enum:
          - CACHE
          - CRM_API
          example: CACHE
        stale:
          type: boolean
          description: Whether this snapshot was served from a stale (expired) cache entry
          example: false
        staleSince:
          type: string
          format: date-time
          description: Timestamp when the cache entry went stale; only present when stale is true
          example: 2026-06-17 09:00:00+00:00
      required:
      - createdAt
      - snapshotId
      - stale
      - version
    VehicleSummary:
      type: object
      description: Vehicle summary within a CRM snapshot
      properties:
        vehicleId:
          type: string
          description: Identifier of the vehicle
          example: 01960003-0000-7000-8000-000000000030
        vin:
          type: string
          description: Vehicle Identification Number
          example: 1HGCM82633A004352
        licensePlate:
          type: string
          description: License plate
          example: ABC-1234
        make:
          type: string
          description: Vehicle make
          example: Ford
        model:
          type: string
          description: Vehicle model
          example: Transit 250
        year:
          type: integer
          format: int32
          description: Model year
          example: 2019
      required:
      - vehicleId
    ContactPointDto:
      type: object
      description: Contact point details
      properties:
        contactPointId:
          type: string
          format: uuid
          description: Contact point ID
          example: 01960003-0000-7000-8000-000000000002
        contactType:
          type: string
          description: Type of contact point
          enum:
          - EMAIL
          - PHONE_MOBILE
          - PHONE_HOME
          - PHONE_WORK
          - FAX
          example: EMAIL
        value:
          type: string
          description: Contact value
          example: john.doe@example.com
        primary:
          type: boolean
      required:
      - contactPointId
      - contactType
      - value
    GetPersonResponse:
      type: object
      description: Person details response
      properties:
        personId:
          type: string
          format: uuid
          description: Unique identifier of the person
          example: 01960003-0000-7000-8000-000000000001
        firstName:
          type: string
          description: First name
          example: John
        lastName:
          type: string
          description: Last name
          example: Doe
        displayName:
          type: string
          description: Display name
          example: John Doe
        preferredContactMethod:
          type: string
          description: Preferred contact method
          enum:
          - EMAIL
          - PHONE_CALL
          - SMS
          - NONE
          example: EMAIL
        contactPoints:
          type: array
          description: Contact points (emails, phones)
          items:
            $ref: '#/components/schemas/ContactPointDto'
        individualCustomer:
          type: boolean
          description: Whether this CRM record represents an individual customer
          example: true
        commercialContact:
          type: boolean
          description: Whether this person is an active contact on one or more commercial accounts
          example: false
        commercialAccountCount:
          type: integer
          format: int32
          description: Number of active commercial accounts where this person is a contact
          example: 0
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the person was created
          example: 2026-01-15 10:30:00+00:00
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the person was last updated
          example: 2026-02-20 14:45:00+00:00
      required:
      - commercialAccountCount
      - commercialContact
      - createdAt
      - firstName
      - individualCustomer
      - lastName
      - personId
    AssignedRole:
      type: object
      description: An assigned role with its primary flag
      properties:
        roleCode:
          type: string
          description: Role code
          enum:
          - BILLING
          - APPROVER
          - DRIVER
          example: BILLING
          minLength: 1
        roleLabel:
          type: string
          description: Role display label
          example: Billing Contact
        isPrimary:
          type: boolean
          description: Whether this contact is primary for this role
          example: true
      required:
      - roleCode
    ContactWithRoles:
      type: object
      description: A single contact with its assigned roles
      properties:
        contactId:
          type: string
          description: Contact point identifier (person/contact)
          example: 01960003-0000-7000-8000-000000000020
          minLength: 1
        contactName:
          type: string
          description: Contact name
          example: Jane Doe
        email:
          type: string
          description: Email address
          example: jane@acme.com
        phone:
          type: string
          description: Phone number
          example: +1-555-0142
        hasPrimaryEmail:
          type: boolean
          description: Whether the contact has at least one primary email on file
          example: true
        roles:
          type: array
          description: Assigned roles for this contact
          items:
            $ref: '#/components/schemas/AssignedRole'
        invoiceDeliveryMethod:
          type: string
          description: Invoice delivery method for this contact
          enum:
          - EMAIL
          - PHONE
          - NONE
          example: EMAIL
      required:
      - contactId
      - contactName
    GetContactsWithRolesResponse:
      type: object
      description: Contacts with their assigned roles and primary flags for a party
      properties:
        partyId:
          type: string
          description: Party identifier the contacts belong to
          example: 01960003-0000-7000-8000-000000000001
          minLength: 1
        contacts:
          type: array
          description: List of contacts with assigned roles
          items:
            $ref: '#/components/schemas/ContactWithRoles'
      required:
      - contacts
      - partyId
    GetCommunicationPreferencesResponse:
      type: object
      description: Communication preferences and consent flags for a party
      properties:
        partyId:
          type: string
          description: Party identifier the preferences belong to
          example: 01960003-0000-7000-8000-000000000001
          minLength: 1
        version:
          type: string
          description: Optimistic locking version token for concurrent updates
          example: '3'
        emailPreference:
          type: string
          description: Email communication preference
          enum:
          - OPT_IN
          - OPT_OUT
          - NOT_APPLICABLE
          example: OPT_IN
        smsPreference:
          type: string
          description: SMS communication preference
          enum:
          - OPT_IN
          - OPT_OUT
          - NOT_APPLICABLE
          example: OPT_OUT
        phonePreference:
          type: string
          description: Phone communication preference
          enum:
          - OPT_IN
          - OPT_OUT
          - NOT_APPLICABLE
          example: OPT_IN
        marketingPreference:
          type: string
          description: Marketing communications preference
          enum:
          - OPT_IN
          - OPT_OUT
          example: OPT_OUT
        consentFlags:
          type: object
          additionalProperties:
            type: boolean
          description: Consent flags keyed by consent type
          example:
            gdpr: true
            tcpa: false
        preferencesNote:
          type: string
          description: User-provided note or preferences summary
          example: Prefers contact after 5pm
        updatedAt:
          type: string
          description: Last update timestamp (ISO 8601)
          example: 2026-06-17 10:15:30+00:00
        updateSource:
          type: string
          description: Source of the last update
          enum:
          - APP
          - API
          - ADMIN
          - IMPORT
          example: API
      required:
      - partyId
    ContactWithRole:
      type: object
      description: Contact information with role assignments
      properties:
        relationshipId:
          type: string
          format: uuid
          description: Relationship ID
          example: 01960003-0000-7000-8000-000000000010
        individualId:
          type: string
          format: uuid
          description: Individual person ID
          example: 01960003-0000-7000-8000-000000000011
        roles:
          type: array
          description: Roles assigned to this contact
          example:
          - BILLING
          items:
            type: string
            description: Role type for party relationships
            enum:
            - APPROVER
            - BILLING
            - PRIMARY_CONTACT
            - DRIVER
            - TECHNICAL
          uniqueItems: true
        status:
          type: string
          description: Status of the relationship
          example: ACTIVE
        effectiveFrom:
          type: string
          format: date
          description: Effective start date
          example: 2026-01-01
        effectiveTo:
          type: string
          format: date
          description: Effective end date (null if active)
          example: 2026-12-31
        individual:
          $ref: '#/components/schemas/IndividualDetails'
        primaryBilling:
          type: boolean
      required:
      - individualId
      - relationshipId
      - status
    GetCommercialAccountContactsResponse:
      type: object
      description: Contacts with roles for a commercial account
      properties:
        commercialAccountId:
          type: string
          description: ID of the commercial account
          example: 01960003-0000-7000-8000-000000000001
        contacts:
          type: array
          description: List of contacts with their roles
          items:
            $ref: '#/components/schemas/ContactWithRole'
      required:
      - commercialAccountId
      - contacts
    IndividualDetails:
      type: object
      description: Individual person details
      properties:
        displayName:
          type: string
          description: Display name
          example: John Doe
        email:
          type: string
          description: Primary email address
          example: john.doe@acme.com
        phone:
          type: string
          description: Primary phone number
          example: +1-555-0142
      required:
      - displayName
    BillingTermsRef:
      type: object
      description: Billing term reference entry
      properties:
        code:
          type: string
          description: Billing term code identifier
          example: NET_30
          minLength: 1
        label:
          type: string
          description: Human-readable label
          example: Net 30
          minLength: 1
        netDays:
          type: integer
          format: int32
          description: Net payment days. Negative values indicate prepayment is required.
          example: 30
      required:
      - code
      - label
      - netDays
    PersonLinkReport:
      type: object
      description: Outcome of a person-link reconciliation pass against pos-people
      properties:
        totalLinks:
          type: integer
          format: int32
          description: Count of distinct linked person ids checked
          example: 120
        resolved:
          type: integer
          format: int32
          description: Count of linked ids that exist in pos-people
          example: 118
        unresolvedPersonIds:
          type: array
          description: Linked person ids with no matching pos-people person (orphans)
          items:
            type: string
            format: uuid
        posPeopleReachable:
          type: boolean
          description: False if pos-people could not be reached, in which case resolved/unresolved counts are not meaningful
          example: true
        healthy:
          type: boolean
          description: 'Whether reconciliation is healthy: pos-people reachable and no unresolved orphan links'
          example: true
      required:
      - healthy
      - posPeopleReachable
      - resolved
      - totalLinks
      - unresolvedPersonIds
    GetAccountTierResponse:
      type: object
      description: Account tier information response
      properties:
        accountId:
          type: string
          description: Account/party identifier
          example: 01960003-0000-7000-8000-000000000001
        tier:
          type: string
          description: Current tier level
          enum:
          - STANDARD
          - BRONZE
          - SILVER
          - GOLD
          - PLATINUM
          - ENTERPRISE
          example: GOLD
        tierDisplayName:
          type: string
          description: Display name of the tier
          example: Gold
        tierAssignedAt:
          type: string
          format: date-time
          description: When the tier was last assigned or updated
          example: 2026-06-17 10:15:30+00:00
        tierAssignedBy:
          type: string
          description: Who assigned or last modified the tier
          example: user-admin
        notes:
          type: string
          description: Optional notes about tier assignment or status
          example: Upgraded after Q2 spend review
        manualOverride:
          type: boolean
          description: Whether tier was manually assigned or auto-calculated
          example: false
      required:
      - accountId
      - manualOverride
      - tier
      - tierDisplayName
    GetPartyResponse:
      type: object
      description: Party details for a commercial account or individual party
      properties:
        partyId:
          type: string
          description: Party ID (canonical CRM identifier)
          example: 01960003-0000-7000-8000-000000000001
          minLength: 1
        partyType:
          type: string
          description: Party type discriminator
          example: ORGANIZATION
          minLength: 1
        legalName:
          type: string
          description: Legal name of the party
          example: Acme Industrial Supply LLC
          minLength: 1
        displayName:
          type: string
          description: Display/trading name
          example: Acme Supply
        taxId:
          type: string
          description: Tax identification number
          example: 82-1234567
        status:
          type: string
          description: Current status of the party
          example: ACTIVE
          minLength: 1
        billingTermsId:
          type: string
          description: Billing terms ID
          example: 01960003-0000-7000-8000-000000000010
        createdAt:
          type: string
          description: Party creation timestamp (ISO 8601)
          example: 2026-01-15 10:30:00+00:00
        modifiedAt:
          type: string
          description: Last modification timestamp (ISO 8601)
          example: 2026-02-20 14:45:00+00:00
      required:
      - createdAt
      - legalName
      - partyId
      - partyType
      - status
    DuplicateCheckResponse:
      type: object
      description: Response containing potential duplicate party matches
      properties:
        duplicatesFound:
          type: boolean
          description: Whether any duplicate matches were found
          example: true
        exactMatchPartyId:
          type: string
          description: ID of exact-match party, if any
          example: 01960003-0000-7000-8000-000000000001
        potentialDuplicates:
          type: array
          description: List of potential duplicate matches
          items:
            $ref: '#/components/schemas/PartyMatch'
      required:
      - duplicatesFound
      - potentialDuplicates
    PartyMatch:
      type: object
      description: A single potential duplicate party match
      properties:
        partyId:
          type: string
          description: Party ID
          example: 01960003-0000-7000-8000-000000000001
          minLength: 1
        legalName:
          type: string
          description: Legal name of the party
          example: Acme Corporation
        score:
          type: number
          format: double
          description: Match confidence score (0.0-1.0)
          example: 0.95
        matchType:
          type: string
          description: Type of match
          enum:
          - EXACT
          - FUZZY
          example: EXACT
      required:
      - legalName
      - matchType
      - partyId
      - score
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
