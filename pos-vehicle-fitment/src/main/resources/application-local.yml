# Local development profile — dynamic ports
spring:
  datasource:
      url: jdbc:h2:mem:fitmentdb
      driverClassName: org.h2.Driver
      username: sa
      password: ''
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
  application:
    name: FITMENT_SERVICE

server:
  port: 0  # OS assigns available ephemeral port

management:
  server:
    port: 0  # OS assigns available ephemeral port (internal-only)
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}

logging:
  level:
    org:
      springframework:
        boot:
          web:
            embedded:
              tomcat:
                TomcatWebServer: INFO