domain: inventory
serviceName: pos-inventory
version: "1.0"
permissions:
  - name: "inventory:adjustment:create"
    description: "Create an adjustment request (draft/pending), capture reason code,
      quantity, and supporting notes"
  - name: "inventory:adjustment:approve"
    description: "Approve and post an adjustment to the ledger (creates
      ADJUSTMENT_IN/OUT events)"
  - name: "inventory:adjustment:view"
    description: "View adjustment history and details"
  - name: "inventory:stock_movement:create"
    description: "Record RECEIVE, PUT_AWAY, PICK, ISSUE, RETURN, or TRANSFER
      movements directly in the inventory ledger"
  - name: "inventory:location:view"
    description: "View storage location configuration and site default location assignments"
  - name: "inventory:location:admin"
    description: "Manage storage location lifecycle and site default location assignments"
  - name: "inventory:pick_list:create"
    description: "Create pick lists for workorders"
  - name: "inventory:pick_list:view"
    description: "View pick lists and pick tasks"
  - name: "inventory:pick_list:execute"
    description: "Release pick lists, confirm pick tasks, update pick status, and
      complete picking workflows"
  - name: "inventory:putaway:generate"
    description: "Generate putaway tasks from received inventory"
  - name: "inventory:putaway:view"
    description: "View putaway tasks and their assignment status"
  - name: "inventory:putaway:claim"
    description: "Claim a putaway task for execution"
  - name: "inventory:putaway:execute"
    description: "Execute a putaway task and move inventory into storage"
  - name: "inventory:putaway:override_location_compatibility"
    description: "Override location compatibility rules when location is not valid for SKU"
  - name: "inventory:putaway:override_location_capacity"
    description: "Override location capacity limits when at or near full capacity"
  - name: "inventory:cycle_count:initiate"
    description: "Initiate a cycle count for inventory reconciliation"
  - name: "inventory:cycle_count:view"
    description: "View cycle count tasks and results"
  - name: "inventory:cycle_count:complete"
    description: "Complete and submit cycle count results"
  - name: "inventory:on_hand:view"
    description: "View on-hand inventory levels at locations"
  - name: "inventory:on_hand:search"
    description: "Search inventory across multiple locations"
  - name: "inventory:receiving:create"
    description: "Create a receiving session from a PO or ASN"
  - name: "inventory:receiving:view"
    description: "View receiving sessions and their lines"
  - name: "inventory:receiving:complete"
    description: "Complete receiving operations including recording quantities"
  - name: "inventory:issue:parts"
    description: "Issue parts directly from a receiving session to a workorder (cross-dock)"
  - name: "inventory:override:part-match"
    description: "Override workorder part-match validation for cross-dock issuance"
  - name: "inventory:purchase_order:create"
    description: "Create or revise a purchase order (DRAFT state)"
  - name: "inventory:purchase_order:view"
    description: "View purchase orders and their line details"
  - name: "inventory:purchase_order:approve"
    description: "Approve or cancel a purchase order"
  - name: "inventory:purchase_order:receive"
    description: "Record receipts against an approved purchase order"
  - name: "inventory:asn:create"
    description: "Create an Advance Shipping Notice (ASN)"
  - name: "inventory:asn:view"
    description: "View ASN details and status"
  - name: "inventory:goods_receipt:create"
    description: "Create a goods receipt and trigger GRNI accrual"
  - name: "inventory:goods_receipt:view"
    description: "View goods receipt details"
  - name: "inventory:goods_receipt:override"
    description: "Allow over-receipt beyond PO open balance"
  - name: "inventory:allocations:reallocate"
    description: "Trigger deterministic reallocation of reserved stock across
      workorders by priority"
  - name: "inventory:shortage:resolve"
    description: "Resolve a shortage decision for an allocation"
  - name: "inventory:ledger:view"
    description: "View inventory ledger entries"
  - name: "inventory:return:view"
    description: "View returnable items and return reason codes"
  - name: "inventory:return:write"
    description: "Submit inventory returns to stock"
  - name: "inventory:shortage:view"
    description: "View shortage resolution options"
