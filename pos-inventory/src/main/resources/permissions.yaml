domain: inventory
serviceName: pos-inventory
version: "1.0"
permissions:
  - name: "inventory:adjustment:create"
    description: "Create an adjustment request (draft/pending), capture reason code, quantity, and supporting notes"
  - name: "inventory:adjustment:approve"
    description: "Approve and post an adjustment to the ledger (creates ADJUSTMENT_IN/OUT events)"
  - name: "inventory:adjustment:view"
    description: "View adjustment history and details"
  - name: "inventory:putaway:override_location_compatibility"
    description: "Override location compatibility rules when location is not valid for SKU"
  - name: "inventory:putaway:override_location_capacity"
    description: "Override location capacity limits when at or near full capacity"
  - name: "inventory:cycle_count:initiate"
    description: "Initiate a cycle count for inventory reconciliation"
  - name: "inventory:cycle_count:view"
    description: "View cycle count tasks and results"
  - name: "inventory:cycle_count:complete"
    description: "Complete and submit cycle count results"
  - name: "inventory:on_hand:view"
    description: "View on-hand inventory levels at locations"
  - name: "inventory:on_hand:search"
    description: "Search inventory across multiple locations"
