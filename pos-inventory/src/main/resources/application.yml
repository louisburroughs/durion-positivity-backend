spring:
  application:
    name: inventory
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 0
  tomcat:
    max-http-header-size: 65536

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    com:
      positivity:
        inventory: INFO
      netflix:
        discovery:
          shared:
            resolver:
              aws:
                ConfigClusterResolver: WARN
    org:
      springframework:
        web: INFO
      hibernate:
        SQL: DEBUG
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

  default-produces-media-type: application/json
pos:
  inventory:
    receiving:
      # Optional explicit upstream name (query param: service) for source document line lookups.
      # If blank, ReceivingServiceImpl falls back by source document type:
      #   PO  -> pos-order
      #   ASN -> pos-shipments
      source-document-service: ${POS_INVENTORY_RECEIVING_SOURCE_DOCUMENT_SERVICE:}
      # Optional site identifier used to resolve default staging location from pos-location.
      site-id: ${POS_INVENTORY_RECEIVING_SITE_ID:}
      # Inventory location used for standard receiving into staging.
      staging-location-id: ${POS_INVENTORY_RECEIVING_STAGING_LOCATION_ID:00000000-0000-0000-0000-000000000002}
      # Virtual location used for cross-dock receive+issue balancing.
      cross-dock-location-id: ${POS_INVENTORY_RECEIVING_CROSS_DOCK_LOCATION_ID:00000000-0000-0000-0000-000000000003}
      stub:
        # Enable/disable HTTP call to a stub source-document service.
        # If false, receiving session creation requires a real upstream source-document client/path;
        # otherwise no lines are returned and createReceivingSession fails as not found.
        enabled: ${POS_INVENTORY_RECEIVING_STUB_ENABLED:false}
        # Base URL hosting the stub endpoint (gateway or direct service URL).
        base-url: ${POS_INVENTORY_RECEIVING_STUB_BASE_URL:http://localhost:8080}
        # GET path template used by SourceDocumentStubClient.
        # Expected URI variables: {sourceDocumentType}, {sourceDocumentId}
        # Expected JSON response:
        # {
        #   "sourceDocumentId": "PO-123",
        #   "sourceDocumentType": "PO",
        #   "sourceService": "pos-order",
        #   "lines": [
        #     {
        #       "sourceLineId": "1",
        #       "productId": "PROD-1001",
        #       "expectedQuantity": 5,
        #       "unitOfMeasure": "EA"
        #     }
        #   ]
        # }
        path: ${POS_INVENTORY_RECEIVING_STUB_PATH:/stub/v1/source-documents/{sourceDocumentType}/{sourceDocumentId}/lines}
  location:
    service-id: ${POS_LOCATION_SERVICE_ID:location}
  workorder:
    service-id: ${POS_WORKORDER_SERVICE_ID:workorder}
