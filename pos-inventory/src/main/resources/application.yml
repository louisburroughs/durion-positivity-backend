spring:
  application:
    name: inventory
  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 0
  tomcat:
    max-http-header-size: 65536

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    com:
      positivity:
        inventory: INFO
      netflix:
        discovery:
          shared:
            resolver:
              aws:
                ConfigClusterResolver: WARN
    org:
      springframework:
        web: INFO
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

  default-produces-media-type: application/json
pos:
  inventory:
    valuation:
      # Deployment default costing method (odoo-parity J1, #1048; ADR-0048). Resolution order is
      # per-SKU config -> per-SKU-category config (unresolvable until the catalog replica carries a
      # category) -> DEFAULT config row -> this value. STANDARD or AVERAGE in v1; FIFO is v2.
      default-method: ${POS_INVENTORY_VALUATION_DEFAULT_METHOD:AVERAGE}
    receiving:
      # Optional explicit upstream name (query param: service) for source document line lookups.
      # If blank, ReceivingServiceImpl falls back by source document type:
      #   PO  -> pos-order
      #   ASN -> pos-shipments
      source-document-service: ${POS_INVENTORY_RECEIVING_SOURCE_DOCUMENT_SERVICE:}
      # Optional site identifier used to resolve default staging location from pos-location.
      site-id: ${POS_INVENTORY_RECEIVING_SITE_ID:}
      # Inventory location used for standard receiving into staging.
      staging-location-id: ${POS_INVENTORY_RECEIVING_STAGING_LOCATION_ID:00000000-0000-0000-0000-000000000002}
      # Virtual location used for cross-dock receive+issue balancing.
      cross-dock-location-id: ${POS_INVENTORY_RECEIVING_CROSS_DOCK_LOCATION_ID:00000000-0000-0000-0000-000000000003}
      stub:
        # Enable/disable HTTP call to a stub source-document service.
        # If false, receiving session creation requires a real upstream source-document client/path;
        # otherwise no lines are returned and createReceivingSession fails as not found.
        enabled: ${POS_INVENTORY_RECEIVING_STUB_ENABLED:false}
        # Base URL hosting the stub endpoint (gateway or direct service URL).
        base-url: ${POS_INVENTORY_RECEIVING_STUB_BASE_URL:http://localhost:8080}
        # GET path template used by SourceDocumentStubClient.
        # Expected URI variables: {sourceDocumentType}, {sourceDocumentId}
        # Expected JSON response:
        # {
        #   "sourceDocumentId": "PO-123",
        #   "sourceDocumentType": "PO",
        #   "sourceService": "pos-order",
        #   "lines": [
        #     {
        #       "sourceLineId": "1",
        #       "productId": "PROD-1001",
        #       "expectedQuantity": 5,
        #       "unitOfMeasure": "EA"
        #     }
        #   ]
        # }
        path: ${POS_INVENTORY_RECEIVING_STUB_PATH:/stub/v1/source-documents/{sourceDocumentType}/{sourceDocumentId}/lines}
    kafka:
      # Location replica feed + reconciliation (ADR-0044 §6, #892). Off until the broker is
      # provisioned; flip POS_INVENTORY_KAFKA_ENABLED per environment.
      enabled: ${POS_INVENTORY_KAFKA_ENABLED:false}
      location-events-topic: ${POS_INVENTORY_LOCATION_EVENTS_TOPIC:location.events.v1}
      location-events-consumer-group: ${POS_INVENTORY_LOCATION_EVENTS_CONSUMER_GROUP:pos-inventory-location-events}
      location-manifest-topic: ${POS_INVENTORY_LOCATION_MANIFEST_TOPIC:location.manifest.v1}
      location-manifest-consumer-group: ${POS_INVENTORY_LOCATION_MANIFEST_CONSUMER_GROUP:pos-inventory-location-manifests}
      location-commands-topic: ${POS_INVENTORY_LOCATION_COMMANDS_TOPIC:location.commands.v1}
      # Workorder replica feed + reconciliation (ADR-0044 §6, #897)
      workorder-events-topic: ${POS_INVENTORY_WORKORDER_EVENTS_TOPIC:workorder.events.v1}
      workorder-events-consumer-group: ${POS_INVENTORY_WORKORDER_EVENTS_CONSUMER_GROUP:pos-inventory-workorder-events}
      workorder-manifest-topic: ${POS_INVENTORY_WORKORDER_MANIFEST_TOPIC:workorder.manifest.v1}
      workorder-manifest-consumer-group: ${POS_INVENTORY_WORKORDER_MANIFEST_CONSUMER_GROUP:pos-inventory-workorder-manifests}
      workorder-commands-topic: ${POS_INVENTORY_WORKORDER_COMMANDS_TOPIC:workorder.commands.v1}
      # Catalog product replica feed (odoo-parity B1, #1033): base UoM + conversion factors,
      # tracking level, and substitution-group membership from catalog.product.updated v2 facts.
      # No catalog-commands topic: pos-catalog has no replay-command listener yet (#1023), so
      # manifest drift is detected (log + replica.drift metric) without requesting replay.
      catalog-events-topic: ${POS_INVENTORY_CATALOG_EVENTS_TOPIC:catalog.events.v1}
      catalog-events-consumer-group: ${POS_INVENTORY_CATALOG_EVENTS_CONSUMER_GROUP:pos-inventory-catalog-events}
      catalog-manifest-topic: ${POS_INVENTORY_CATALOG_MANIFEST_TOPIC:catalog.manifest.v1}
      catalog-manifest-consumer-group: ${POS_INVENTORY_CATALOG_MANIFEST_CONSUMER_GROUP:pos-inventory-catalog-manifests}
      # Warranty part-return quarantine/hold tracking feed (#927)
      warranty-events-topic: ${POS_INVENTORY_WARRANTY_EVENTS_TOPIC:warranty.events.v1}
      warranty-events-consumer-group: ${POS_INVENTORY_WARRANTY_EVENTS_CONSUMER_GROUP:pos-inventory-warranty-events}
      # Own fact publishing (ADR-0044 §6, #899): availability / storage-location on-hand /
      # lead-time facts via the transactional outbox, with manifests and replay commands.
      events-topic: ${POS_INVENTORY_EVENTS_TOPIC:inventory.events.v1}
      commands-topic: ${POS_INVENTORY_COMMANDS_TOPIC:inventory.commands.v1}
      commands-consumer-group: ${POS_INVENTORY_COMMANDS_CONSUMER_GROUP:pos-inventory-commands}
    manifest:
      topic: ${POS_INVENTORY_MANIFEST_TOPIC:inventory.manifest.v1}
      window: ${POS_INVENTORY_MANIFEST_WINDOW:PT1H}
      grace: ${POS_INVENTORY_MANIFEST_GRACE:PT5M}
      poll-interval-ms: ${POS_INVENTORY_MANIFEST_POLL_INTERVAL_MS:300000}
    location:
      # Window the manual sync endpoint asks pos-location to re-emit (owner caps lookback).
      replay-lookback: ${POS_INVENTORY_LOCATION_REPLAY_LOOKBACK:P30D}
    replenishment:
      # Last-resort lead time for the forecast-aware orderpoint trigger (odoo-parity F2,
      # #1040; decision D-4). Precedence: policy override (F3) -> vendor-feed MAX estimate
      # -> this default. 0 projects to "now" (on-hand plus already-due supply minus open
      # demand).
      default-lead-time-days: ${POS_INVENTORY_REPLENISHMENT_DEFAULT_LEAD_TIME_DAYS:0}
      scan:
        # Scheduled batch replenishment scan (CAP-217 / odoo-parity F1, #1025).
        # Off by default; flip per environment. The scan is idempotent per
        # (policy, day) so the interval only controls freshness, not duplication.
        enabled: ${POS_INVENTORY_REPLENISHMENT_SCAN_ENABLED:false}
        interval-ms: ${POS_INVENTORY_REPLENISHMENT_SCAN_INTERVAL_MS:3600000}
        initial-delay-ms: ${POS_INVENTORY_REPLENISHMENT_SCAN_INITIAL_DELAY_MS:600000}
    cycle-count:
      schedule:
        # Recurring cycle-count schedule runner (odoo-parity I1, #1031).
        # Off by default; flip per environment. The pass is idempotent per
        # (schedule, dueDate) so the interval only controls freshness, not
        # duplication.
        enabled: ${POS_INVENTORY_CYCLE_COUNT_SCHEDULE_ENABLED:false}
        interval-ms: ${POS_INVENTORY_CYCLE_COUNT_SCHEDULE_INTERVAL_MS:3600000}
        initial-delay-ms: ${POS_INVENTORY_CYCLE_COUNT_SCHEDULE_INITIAL_DELAY_MS:600000}
  workorder:
    service-id: ${POS_WORKORDER_SERVICE_ID:workorder}
