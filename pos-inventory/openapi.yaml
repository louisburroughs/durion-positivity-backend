          example: CYCLE_COUNT
        sourceTransactionId:
          type: string
          description: Identifier of the originating source transaction
          example: 01960003-0000-7000-8000-000000000007
        unitOfMeasure:
          type: string
          description: Unit of measure code for the quantities (e.g. EACH, KG)
          example: EACH
        notes:
          type: string
          description: Free-text notes attached to the entry
          example: Variance corrected after recount
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the entry record was created
          example: 2026-01-15 09:30:00+00:00
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the entry record was last updated
          example: 2026-01-15 09:35:00+00:00
      required:
      - changeInQuantity
      - eventType
      - ledgerEntryId
      - quantityAfter
      - stockItemId
      - timestamp
    CycleCountTaskResponse:
      type: object
      description: A cycle count task describing an item to be counted at a location and its current state
      properties:
        taskId:
          type: string
          format: uuid
          description: Unique identifier of the cycle count task
          example: 01960003-0000-7000-8000-000000000001
        binLocation:
          type: string
          description: Bin or location code where the item is stored
          example: LOC-001
        itemSku:
          type: string
          description: Stock keeping unit of the item to count
          example: SKU-10042
        itemDescription:
          type: string
          description: Human-readable description of the item
          example: Stainless steel water bottle, 750ml
        expectedQuantity:
          type: integer
          format: int32
          description: Quantity expected on hand for the item
          example: 15
        auditorId:
          type: string
          description: Identifier of the auditor assigned to the task, if assigned
          example: auditor-10042
        status:
          type: string
          description: Current status of the cycle count task
          enum:
          - ASSIGNED
          - COUNTED_PENDING_REVIEW
          - REQUIRES_INVESTIGATION
          - APPROVED
          - REJECTED
          example: ASSIGNED
        latestCountEntryId:
          type: string
          format: uuid
          description: Identifier of the most recent count entry recorded for the task, if any
          example: 01960003-0000-7000-8000-000000000002
        countEntriesCount:
          type: integer
          format: int32
          description: Total number of count entries recorded for the task
          example: 2
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the task was created
          example: 2026-01-15 09:30:00+00:00
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the task was last updated
          example: 2026-01-15 10:05:00+00:00
      required:
      - binLocation
      - countEntriesCount
      - createdAt
      - expectedQuantity
      - itemSku
      - status
      - taskId
      - updatedAt
    CountEntryResponse:
      type: object
      description: A single recorded count entry in a cycle count task's history
      properties:
        countEntryId:
          type: string
          format: uuid
          description: Unique identifier of the count entry
          example: 01960003-0000-7000-8000-000000000001
        cycleCountTaskId:
          type: string
          format: uuid
          description: Identifier of the cycle count task this entry belongs to
          example: 01960003-0000-7000-8000-000000000002
        auditorId:
          type: string
          description: Identifier of the auditor who recorded the count
          example: auditor-10042
        actualQuantity:
          type: integer
          format: int32
          description: Quantity physically counted by the auditor
          example: 12
        expectedQuantity:
          type: integer
          format: int32
          description: Quantity expected on hand at the time of the count
          example: 15
        variance:
          type: integer
          format: int32
          description: Difference between counted and expected quantity (actual minus expected)
          example: -3
        recountSequenceNumber:
          type: integer
          format: int32
          description: Sequence number of this count within the recount chain; 0 for the initial count
          example: 1
        recountOfCountEntryId:
          type: string
          format: uuid
          description: Identifier of the count entry this entry is a recount of, if any
          example: 01960003-0000-7000-8000-000000000003
        countedAt:
          type: string
          format: date-time
          description: Timestamp when the count was recorded
          example: 2026-01-15 09:30:00+00:00
        recount:
          type: boolean
          description: Whether this entry is a recount of a prior count
          example: false
      required:
      - actualQuantity
      - auditorId
      - countEntryId
      - countedAt
      - cycleCountTaskId
      - expectedQuantity
      - recount
      - recountSequenceNumber
      - variance
    AvailabilityView:
      type: object
      description: Read-only view of on-hand and available-to-promise quantities for a product at a specific location scope
      properties:
        productSku:
          type: string
          description: Stock-keeping unit identifier of the product
          example: SKU-10042
        locationId:
          type: string
          format: uuid
          description: Location identifier for the scope of this availability view
          example: 01960003-0000-7000-8000-000000000001
        storageLocationId:
          type: string
          format: uuid
          description: Optional storage sub-location identifier; null when scoped to the full location
          example: 01960003-0000-7000-8000-000000000002
        onHandQuantity:
          type: integer
          format: int32
          description: Net on-hand quantity (sum of affectsOnHand ledger entries)
          example: 120
        allocatedQuantity:
          type: integer
          format: int32
          description: Net allocated quantity (ALLOCATION_CREATED minus ALLOCATION_RELEASED)
          example: 30
        availableToPromiseQuantity:
          type: integer
          format: int32
          description: Available-to-promise quantity, equal to onHandQuantity minus allocatedQuantity
          example: 90
        unitOfMeasure:
          type: string
          description: Unit of measure code for the quantities (e.g. EACH, KG)
          example: EACH
      required:
      - allocatedQuantity
      - availableToPromiseQuantity
      - locationId
      - onHandQuantity
      - productSku
      - unitOfMeasure
    LocationAvailabilityDto:
      type: object
      description: Per-location availability projection for inventory availability queries
      properties:
        locationId:
          type: string
          format: uuid
          description: Identifier of the location
          example: 01960003-0000-7000-8000-000000000001
        locationName:
          type: string
          description: Human-readable name of the location
          example: Main Warehouse
        onHandQuantity:
          type: integer
          format: int32
          description: On-hand quantity at the location
          example: 120
        availableToPromiseQuantity:
          type: integer
          format: int32
          description: Available-to-promise quantity at the location
          example: 90
      required:
      - availableToPromiseQuantity
      - locationId
      - locationName
      - onHandQuantity
    LeadTimeView:
      type: object
      description: Lead-time view returned by inventory for product detail aggregation
      properties:
        productId:
          type: string
          format: uuid
          description: Product identifier
          example: 01960003-0000-7000-8000-000000000001
        locationId:
          type: string
          format: uuid
          description: Location identifier
          example: 01960003-0000-7000-8000-000000000002
        source:
          type: string
          description: Source of lead-time data
          example: INVENTORY
        minDays:
          type: integer
          format: int32
          description: Minimum lead-time in days
          example: 2
        maxDays:
          type: integer
          format: int32
          description: Maximum lead-time in days
          example: 5
        displayText:
          type: string
          description: Human-readable lead-time text
          example: 2-5 business days
        confidence:
          type: string
          description: Confidence level for this estimate
          example: HIGH
        asOf:
          type: string
          format: date-time
          description: Timestamp when lead-time data was last refreshed
          example: 2026-01-15 09:30:00+00:00
      required:
      - locationId
      - productId
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
