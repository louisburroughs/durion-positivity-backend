    ShortCloseTransferOrderRequest:
      description: Request to short-close a transfer order, resolving the undelivered remainder with a whole-order disposition
      properties:
        disposition:
          description: 'Disposition of the undelivered remainder: LOST_IN_TRANSIT writes it off (SCRAP_OUT, reason LOST); RETURNED_TO_SOURCE restores it to source on-hand'
          enum:
          - LOST_IN_TRANSIT
          - RETURNED_TO_SOURCE
          type: string
        notes:
          description: Free-text notes explaining the short-close (mandatory)
          maxLength: 2000
          minLength: 0
          type: string
        reason:
          description: Reason for the short-close (mandatory)
          maxLength: 100
          minLength: 0
          type: string
      required:
      - disposition
      - notes
      - reason
      type: object
    ShortageOptionDto:
      description: A computed option for resolving an inventory shortage on an allocation
      properties:
        allocationId:
          description: Identifier of the allocation the option applies to
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        availableQuantity:
          description: Quantity available toward the shortage for SUBSTITUTE / TRANSFER_IN options
          example: 12
          type: number
        costDelta:
          description: Per-unit cost delta versus the original SKU, when computable (positive = costs more)
          example: 4.5
          type: number
        description:
          description: Human-readable description of the resolution option
          example: Substitute with group member 0196... (12 available at site)
          type: string
        expectedResolutionDate:
          description: Estimated date the shortage would be resolved via this option
          example: 2026-08-01
          format: date
          type: string
        optionType:
          description: The computed resolution strategy
          enum:
          - BACKORDER
          - SUBSTITUTE
          - TRANSFER_IN
          - EMERGENCY_PURCHASE
          - CANCEL_LINE
          example: SUBSTITUTE
          type: string
        sourceLocationId:
          description: Source site surplus can be pulled from, when the option is TRANSFER_IN
          example: 01960004-0001-7000-8000-00000000000a
          format: uuid
          type: string
        substituteSku:
          description: Substitute stock-keeping unit offered, when the option is SUBSTITUTE
          example: 01960003-0000-7000-8000-000000000099
          type: string
      required:
      - allocationId
      - description
      - optionType
      type: object
    ShortageResolutionResultDto:
      description: Result of applying a resolution to an inventory shortage
      properties:
        allocationId:
          description: Identifier of the allocation that was resolved
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        artifactId:
          description: Identifier of the created artifact; null for CANCEL_LINE
          example: 01960003-0000-7000-8000-0000000000aa
          format: uuid
          type: string
        artifactType:
          description: Kind of artifact created (BACKORDER, RESERVATION, TRANSFER_ORDER, PURCHASE_SUGGESTION, NONE)
          example: BACKORDER
          type: string
        idempotencyKey:
          description: Idempotency key the resolution was recorded under
          type: string
        optionType:
          description: The resolution option that was executed
          enum:
          - BACKORDER
          - SUBSTITUTE
          - TRANSFER_IN
          - EMERGENCY_PURCHASE
          - CANCEL_LINE
          example: BACKORDER
          type: string
        resolvedAt:
          description: Timestamp when the shortage was resolved
          example: 2026-01-15 09:30:00+00:00
          format: date-time
          type: string
        status:
          description: Resulting status of the resolution
          example: RESOLVED
          type: string
      required:
      - allocationId
      - artifactType
      - idempotencyKey
      - optionType
      - resolvedAt
      - status
      type: object
    ShortageResolveRequest:
      description: Request to resolve an inventory shortage by executing a chosen option
      properties:
        allocationId:
          description: Identifier of the allocation to resolve
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        idempotencyKey:
          description: Retry-safe idempotency key; a replay with the same key returns the original result
          example: shortage-resolve-01960003-0001
          minLength: 1
          type: string
        locationId:
          description: Site the demand is short at (required for BACKORDER / TRANSFER_IN)
          example: 01960004-0001-7000-8000-00000000000c
          format: uuid
          type: string
        notes:
          description: Optional free-text notes explaining the resolution
          example: Customer approved substitute item
          type: string
        optionType:
          description: The resolution option to execute
          enum:
          - BACKORDER
          - SUBSTITUTE
          - TRANSFER_IN
          - EMERGENCY_PURCHASE
          - CANCEL_LINE
          example: BACKORDER
          type: string
        shortQuantity:
          description: Quantity that is short and to be resolved
          example: 3
          minimum: 0
          type: number
        sku:
          description: SKU / stock-item identifier that is short
          example: 01960003-0000-7000-8000-000000000002
          minLength: 1
          type: string
        sourceLocationId:
          description: Source site to pull surplus from; required when optionType is TRANSFER_IN
          example: 01960004-0001-7000-8000-00000000000a
          format: uuid
          type: string
        substituteSku:
          description: Substitute SKU to reserve; required when optionType is SUBSTITUTE
          example: 01960003-0000-7000-8000-000000000099
          type: string
        workorderLineId:
          description: Workorder line whose demand was short (required for BACKORDER / SUBSTITUTE / CANCEL_LINE)
          example: 01960003-0000-7000-8000-000000000003
          format: uuid
          type: string
      required:
      - allocationId
      - idempotencyKey
      - optionType
      - shortQuantity
      - sku
      type: object
