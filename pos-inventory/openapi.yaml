      description: 'Processes a batch of inventory adjustment records, creating one PENDING adjustment request per accepted row for the normal approval flow rather than posting stock changes directly.

        Use this tool for bulk imports such as cycle-count loads; do not use createAdjustmentRequest, which files a single interactive adjustment, and do not expect on-hand to change until each request is approved.

