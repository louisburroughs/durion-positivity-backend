      description: 'Accepts a return-to-stock submission for a workorder and acknowledges it with a generated returnId, the processed line count and a SUBMITTED status.

        Use this tool to hand back unused workorder parts; do not use receiveItemsIntoStaging or createGoodsReceipt, which receive vendor shipments rather than workorder returns.

        Preconditions: none checked by the current implementation; the call is an acknowledgement stub, so no return record is persisted, no ledger entry posts and on-hand stock does not change yet.

        Required inputs: workorderId (UUID) and lines (non-empty), each naming itemId (UUID), a positive quantity, a reasonCode from listReturnReasonCodes and a locationId; storageLocationId is optional.

        Emits an INVENTORY_RETURN_SUBMIT_TO_STOCK event; the 202 response signals acceptance of the submission, not completed stock movement.

