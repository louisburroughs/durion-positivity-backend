  /v1/inventory/putaway/tasks/generate:
    post:
      description: 'Generates one UNASSIGNED putaway task per received line of a goods receipt, sourced from the staging location, with the suggested destination resolved by the highest-priority enabled putaway rule or the default location when no rule exists.

        Use this tool once staged goods need storage assignments; do not use executePutaway, which performs the physical move for one task, and do not use claimPutawayTask, which assigns an existing task to a worker.

        Preconditions: the goods receipt named by sourceReceiptId must exist; putaway rules are optional.

        Required inputs: sourceReceiptId (UUID string) plus either lineItems, each naming productId (UUID string) and a quantity of at least 1, or the legacy productId/quantity pair, but never both forms together.

        Emits an INVENTORY_PUTAWAY_TASK_GENERATE event; the tasks are created UNASSIGNED and no stock moves until executePutaway runs.

        Returns 404 when the goods receipt does not exist, and 400 when both line forms are supplied, neither is supplied, an id is not a valid UUID, or a quantity is below 1.

        '
      operationId: generatePutawayTasks
      requestBody:
        content:
          application/json:
            examples:
              Two received lines:
                description: Two received lines
                value:
                  lineItems:
                  - productId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a41
                    quantity: 12
                  - productId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a42
                    quantity: 4
                  sourceReceiptId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a40
            schema:
              $ref: '#/components/schemas/GeneratePutawayTasksRequest'
        description: The source goods receipt and the received lines needing storage.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PutawayTaskResponse'
                type: array
          description: Putaway tasks generated
        '400':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PutawayTaskResponse'
                type: array
          description: Validation failure
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Goods receipt not found
      security:
      - bearerAuth:
        - inventory:putaway:generate
      summary: Generate Putaway Tasks
      tags:
      - Putaway
      x-required-permissions:
      - inventory:putaway:generate
  /v1/inventory/putaway/tasks/{taskId}/claim:
    post:
      description: 'Claims a putaway task for the calling user, locking the row and marking it ASSIGNED with the caller as assignee.

        Use this tool after finding a task via listPutawayTasks and before executePutaway; do not use executePutaway to claim, execution completes the task regardless of assignee.

        Preconditions: the task must exist; the service applies no status gate, so claiming an already ASSIGNED task silently reassigns it to the caller.

        Required inputs: taskId (UUID string) path parameter; there is no request body.

        Emits an INVENTORY_PUTAWAY_TASK_CLAIM event; no stock moves and the task''s suggested destination is unchanged.

        Returns 404 when no putaway task exists for the supplied id, and 400 when taskId is not a valid UUID.

        '
      operationId: claimPutawayTask
      parameters:
      - description: Putaway task identifier
        in: path
        name: taskId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutawayTaskResponse'
          description: Putaway task claimed
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutawayTaskResponse'
          description: Putaway task not found
      security:
      - bearerAuth:
        - inventory:putaway:claim
      summary: Claim Putaway Task
      tags:
      - Putaway
      x-required-permissions:
      - inventory:putaway:claim
  /v1/inventory/putaway/tasks/{taskId}/execute:
    post:
      description: 'Executes a putaway move, posting paired PUTAWAY ledger entries that decrement on-hand at the staging source location and increment it at the destination, then marking the task COMPLETED with the actual destination recorded.

        Use this tool when the clerk physically moves staged stock into storage; do not use generatePutawayTasks, which only creates tasks, and do not use claimPutawayTask, which only assigns one.

        Preconditions: the task must exist, the source location must hold on-hand stock of the SKU, and the destination must be valid for the SKU and within capacity unless the matching override flag is set by a caller holding the corresponding putaway override permission; every override needs overrideReasonCode and overrideJustification, and a capacity override also needs approvedBy and must stay within the configured overfill tolerance.

        Required inputs: taskId (UUID string) path parameter plus skuId, sourceLocationId, destinationLocationId and a positive quantity; the destination may differ from the task''s suggestion, and the override fields are optional.

        Emits an INVENTORY_PUTAWAY_EXECUTE event; on-hand shifts between the two locations immediately and the task leaves the executable pool.

        Returns 404 when the task does not exist, 422 when the source lacks on-hand, the destination is invalid for the SKU or at capacity, or an override omits its audit fields, 403 when an override is requested without its permission, and 400 when taskId is not a valid UUID.

        '
      operationId: executePutaway
      parameters:
      - description: Putaway task identifier
        in: path
        name: taskId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Standard move without overrides:
                description: Standard move without overrides
                value:
                  destinationLocationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a44
                  quantity: 12
                  skuId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a41
                  sourceLocationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a43
            schema:
              $ref: '#/components/schemas/PutawayExecutionRequest'
        description: The clerk's scan data for the move, with optional business-rule overrides.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutawayExecutionResponse'
          description: Putaway executed successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutawayExecutionResponse'
          description: Bad request - invalid task ID or request payload
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutawayExecutionResponse'
          description: Forbidden - insufficient authority
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutawayExecutionResponse'
          description: Putaway task not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutawayExecutionResponse'
          description: Validation failed for putaway execution
      security:
      - bearerAuth:
        - inventory:putaway:execute
      summary: Execute Putaway Task
      tags:
      - Putaway Execution
      x-required-permissions:
      - inventory:putaway:execute
  /v1/inventory/receiving/sessions:
    post:
      description: 'Creates an OPEN receiving session against a source document, pre-populating one EXPECTED line per source-document line fetched from the owning service.

        Use this tool to start a line-by-line receiving workflow before recording actual quantities with receiveItemsIntoStaging; do not use createGoodsReceipt, which posts stock against a purchase order in one call without a session.

