        scheduleId:
          type: string
          format: uuid
          description: Unique identifier of the schedule
          example: 01960003-0000-7000-8000-000000000001
        locationId:
          type: string
          format: uuid
          description: Identifier of the location the schedule applies to
          example: 01960003-0000-7000-8000-000000000002
        zoneId:
          type: string
          format: uuid
          description: Optional single-zone filter within the location
          example: 01960003-0000-7000-8000-000000000003
        skuCategory:
          type: string
          description: Optional SKU-category filter
          example: BRAKES
        frequencyDays:
          type: integer
          format: int32
          description: Count frequency in days
          example: 30
        nextDueDate:
          type: string
          format: date
          description: Next date the schedule is due for counting
          example: 2026-08-01
        autoCreatePlan:
          type: boolean
          description: Whether the scheduled runner auto-creates the next cycle-count plan when due
          example: true
        active:
          type: boolean
          description: Whether the schedule is active
          example: true
        createdBy:
          type: string
          description: Identifier of the user who created the schedule
