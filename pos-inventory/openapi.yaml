  /v1/inventory/reservations:
    post:
      description: 'Creates a soft reservation for a workorder line, or updates the existing reservation for that line to the requested stock item and quantity; creation records one SOFT allocation for the full quantity with no location and no ledger entry.

        Use this tool to register parts demand before picking; do not use promoteReservationAllocation, which hardens an existing allocation to a storage location, and do not use consumePickedItems, which posts the actual stock decrement.

        Preconditions: none for creation — no ATP check is performed at this stage, so the reservation is accepted even when stock is short; an update may not change stockItemId while the reservation still has located HARD allocations.

        Required inputs: workorderLineId (UUID), stockItemId (UUID) and requiredQuantity (positive integer); workorderLineId is the upsert key.

        Emits an INVENTORY_RESERVATION_CREATE_OR_UPDATE event; no inventory ledger entry is written for a soft allocation.

        Returns 201 in both the create and the update case, 409 when stockItemId is changed on a reservation with located HARD allocations, and 400 when a required field is missing or requiredQuantity is not positive.

        '
      operationId: createOrUpdateReservation
      requestBody:
        content:
          application/json:
            examples:
              Reserve four units:
                description: Reserve four units
                value:
                  requiredQuantity: 4
                  stockItemId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a02
                  workorderLineId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a01
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
        description: 'Demand to reserve: the workorder line, the stock item and the quantity; an existing reservation for the line is updated in place.'
