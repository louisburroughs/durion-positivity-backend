openapi: 3.1.0
info:
  title: Positivity Inventory API
  description: "API documentation for the Inventory service, accessible via the API\
    \ Gateway."
  contact:
    name: Durion Support Services
    email: louis.burroughs@gmail.com
  version: v1
servers:
- url: http://localhost:8086
  description: Generated server url
tags:
- name: Inventory Locations
  description: Read inventory facts for storage locations
- name: Reallocation
  description: Allocation rebalancing endpoints
- name: Inventory Management
  description: Operations related to inventory location management
- name: Cycle Count Plans
  description: Cycle count plan management endpoints
- name: Picking Lists
  description: Picking list command endpoints
- name: ASN
  description: Advanced Shipping Notice and goods receipt endpoints
- name: Pick Lists
  description: Pick list and pick task management endpoints
- name: Putaway
  description: Putaway task generation and claiming endpoints
- name: Inventory Availability
  description: Inventory availability read/write endpoints
- name: Consumption
  description: Workorder parts consumption endpoints
- name: Putaway Execution
  description: Execute putaway tasks with validation and audit events
- name: Cycle Count API
  description: API for cycle count operations and variance tracking
- name: Replenishment
  description: Replenishment task and policy endpoints
- name: Inventory Reservations
  description: "Reserve, promote, and cancel inventory allocations for workorder lines"
- name: Shortage Resolution
  description: Shortage resolution recommendation endpoints
- name: Cycle Count Query
  description: Query endpoints for cycle count tasks and history
- name: Purchase Orders
  description: "Purchase order creation, lifecycle, and receiving endpoints"
- name: Cycle Count Adjustments
  description: Manage inventory adjustments from cycle counts
- name: Inventory Bulk Ingest API
  description: Bulk import inventory adjustment requests
- name: Returns
  description: Inventory return-to-stock endpoints
- name: Receiving
  description: "Receiving session creation, item receiving, and cross-dock execution\
    \ endpoints"
- name: Inventory Sites
  description: Site inventory configuration endpoints. Inventory Sites represent physical
    locations that hold inventory.
- name: Stock Movements
  description: Inventory ledger movement recording and adjustment endpoints
- name: Cycle Count Operations
  description: Cycle count submission and recount operations
paths:
  /v1/inventory/sites/{siteId}/defaultLocations:
    get:
      tags:
      - Inventory Sites
      summary: Get site default locations
      description: Returns configured default locations for a site. Stub implementation.
      operationId: getSiteDefaultLocations
      parameters:
      - name: siteId
        in: path
        description: Site identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Default locations returned
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
        "501":
          description: Not implemented
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: string
                  format: uuid
    put:
      tags:
      - Inventory Sites
      summary: Replace site default locations
      description: Replaces the configured default locations for a site. Stub implementation.
      operationId: putSiteDefaultLocations
      parameters:
      - name: siteId
        in: path
        description: Site identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uuid
      responses:
        "200":
          description: Default locations replaced
        "501":
          description: Not implemented
  /v1/inventory/stock-movements:
    post:
      tags:
      - Stock Movements
      summary: Record a stock movement
      description: "Records a RECEIVE, PUT_AWAY, PICK, ISSUE, RETURN, or TRANSFER\
        \ movement in the inventory ledger."
      operationId: recordMovement
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordMovementRequest"
        required: true
      responses:
        "400":
          description: Validation failure
        "422":
          description: Insufficient stock
        "201":
          description: Movement recorded
  /v1/inventory/returns:
    post:
      tags:
      - Returns
      summary: Return items to stock
      description: Returns issued parts to inventory and records resulting return
        movement
      operationId: returnItemsToStock
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnItemsRequest"
        required: true
      responses:
        "422":
          description: Return quantity exceeds allowable amount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "201":
          description: Return recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResponse"
        "403":
          description: User lacks required return authority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/inventory/reservations:
    post:
      tags:
      - Inventory Reservations
      summary: Create or update a reservation
      description: Creates a reservation for a workorder line or updates an existing
        reservation with the requested quantity
      operationId: createOrUpdateReservation
      requestBody:
        description: Reservation create/update payload
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
        required: true
      responses:
        "201":
          description: Reservation created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
        "422":
          description: Business rule validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: User lacks required reservation authority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/inventory/reservations/{allocationId}/promote:
    post:
      tags:
      - Inventory Reservations
      summary: Promote allocation to hard
      description: Promotes an existing allocation to HARD state when ATP is sufficient
      operationId: promoteToHard
      parameters:
      - name: allocationId
        in: path
        description: Allocation identifier to promote
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Promotion request details
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoteAllocationRequest"
        required: true
      responses:
        "422":
          description: Insufficient ATP or business rule validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: User lacks required reservation authority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: Allocation promoted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
        "404":
          description: Allocation or reservation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/inventory/replenishment/policies:
    get:
      tags:
      - Replenishment
      summary: List replenishment policies
      description: Returns configured replenishment policies.
      operationId: getReplenishmentPolicies
      responses:
        "200":
          description: Replenishment policies returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReplenishmentPolicyResponse"
    post:
      tags:
      - Replenishment
      summary: Create replenishment policy
      description: Creates a replenishment policy used to generate replenishment tasks.
      operationId: createReplenishmentPolicy
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReplenishmentPolicyRequest"
        required: true
      responses:
        "400":
          description: Validation failure
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReplenishmentPolicyResponse"
        "201":
          description: Replenishment policy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplenishmentPolicyResponse"
  /v1/inventory/receiving/sessions:
    post:
      tags:
      - Receiving
      summary: Create receiving session
      description: Creates a receiving session from a source document (PO/ASN) using
        MANUAL or SCAN entry mode
      operationId: createReceivingSession
      requestBody:
        description: Receiving session creation payload
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReceivingSessionRequest"
        required: true
      responses:
        "404":
          description: Source document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "201":
          description: Receiving session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceivingSessionResponse"
        "403":
          description: User lacks required receiving:create authority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Validation failure or source document already fully received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/inventory/receiving/sessions/{sessionId}/receive:
    post:
      tags:
      - Receiving
      summary: Receive items into staging
      description: Records received quantities for receiving session lines and generates
        receipt ledger/variance records
      operationId: receiveItemsIntoStaging
      parameters:
      - name: sessionId
        in: path
        description: Receiving session identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Receive lines payload
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiveItemsRequest"
        required: true
      responses:
        "200":
          description: Items received successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiveItemsResponse"
        "400":
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Receiving session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: User lacks required receiving:complete authority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/inventory/receiving/sessions/{sessionId}/lines/{lineId}/cross-dock:
    post:
      tags:
      - Receiving
      summary: Cross-dock receiving line to workorder
      description: Cross-docks received quantity from a session line directly to a
        workorder line with atomic receipt and issue ledger events
      operationId: crossDockLineToWorkorder
      parameters:
      - name: sessionId
        in: path
        description: Receiving session identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: lineId
        in: path
        description: Receiving line identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Cross-dock request payload
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrossDockRequest"
        required: true
      responses:
        "403":
          description: User lacks required authority or part-match override permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Receiving session or line not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: Cross-dock completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrossDockResponse"
        "400":
          description: Invalid request or closed workorder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/inventory/putaway/tasks/{taskId}/execute:
    post:
      tags:
      - Putaway Execution
      summary: Execute putaway task
      description: Executes a putaway task by moving SKU quantity from source location
        to destination location.
      operationId: executePutaway
      parameters:
      - name: taskId
        in: path
        description: Putaway task identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutawayExecutionRequest"
        required: true
      responses:
        "422":
          description: Validation failed for putaway execution
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PutawayExecutionResponse"
        "404":
          description: Putaway task not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PutawayExecutionResponse"
        "403":
          description: Forbidden - insufficient authority
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PutawayExecutionResponse"
        "400":
          description: Bad request - invalid task ID or request payload
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PutawayExecutionResponse"
        "200":
          description: Putaway executed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutawayExecutionResponse"
  /v1/inventory/putaway/tasks/{taskId}/claim:
    post:
      tags:
      - Putaway
      summary: Claim a putaway task
      description: Claims an available putaway task for the current actor.
      operationId: claimTask
      parameters:
      - name: taskId
        in: path
        description: Putaway task identifier
        required: true
        schema:
          type: string
      responses:
        "404":
          description: Putaway task not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PutawayTaskResponse"
        "200":
          description: Putaway task claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutawayTaskResponse"
  /v1/inventory/putaway/tasks/generate:
    post:
      tags:
      - Putaway
      summary: Generate putaway tasks
      description: Generates putaway tasks for received inventory lines.
      operationId: generateTasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePutawayTasksRequest"
        required: true
      responses:
        "201":
          description: Putaway tasks generated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PutawayTaskResponse"
        "400":
          description: Validation failure
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PutawayTaskResponse"
  /v1/inventory/purchase-orders:
    get:
      tags:
      - Purchase Orders
      summary: List purchase orders
      description: Lists purchase orders using filter and pagination parameters
      operationId: listPurchaseOrders
      parameters:
      - name: filter
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/ListPurchaseOrdersRequest"
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Purchase orders returned
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagePurchaseOrderResponse"
        "403":
          description: User lacks required purchase order view authority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
      - Purchase Orders
      summary: Create purchase order
      description: Creates a purchase order with requested line items
      operationId: createPurchaseOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePurchaseOrderRequest"
        required: true
      responses:
        "403":
          description: User lacks required purchase order create authority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "201":
          description: Purchase order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrderResponse"
  /v1/inventory/purchase-orders/{poId}/revisions:
    post:
      tags:
      - Purchase Orders
      summary: Revise purchase order
      description: Creates a revision for an existing purchase order
      operationId: revisePurchaseOrder
      parameters:
      - name: poId
        in: path
        description: Purchase order identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisePurchaseOrderRequest"
        required: true
      responses:
        "403":
          description: User lacks required purchase order create authority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: Purchase order revised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrderResponse"
        "404":
          description: Purchase order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Purchase order is in a conflicting state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/inventory/purchase-orders/{poId}/receive:
    post:
      tags:
      - Purchase Orders
      summary: Receive purchase order
      description: Receives approved purchase order quantities and posts resulting
        ledger movements
      operationId: receivePurchaseOrder
      parameters:
      - name: poId
        in: path
        description: Purchase order identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceivePurchaseOrderRequest"
        required: true
      responses:
        "404":
          description: Purchase order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Purchase order is in a conflicting state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: Purchase order received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceivePurchaseOrderResponse"
        "403":
          description: User lacks required purchase order receive authority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/inventory/purchase-orders/{poId}/cancel:
    post:
      tags:
      - Purchase Orders
      summary: Cancel purchase order
      description: Cancels a purchase order that is no longer needed
      operationId: cancelPurchaseOrder
      parameters:
      - name: poId
        in: path
        description: Purchase order identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Purchase order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Purchase order is in a conflicting state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: User lacks required purchase order approval authority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: Purchase order cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrderResponse"
  /v1/inventory/purchase-orders/{poId}/approve:
    post:
      tags:
      - Purchase Orders
      summary: Approve purchase order
      description: Approves a purchase order and transitions it to an approvable state
      operationId: approvePurchaseOrder
      parameters:
      - name: poId
        in: path
        description: Purchase order identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovePurchaseOrderRequest"
        required: true
      responses:
        "404":
          description: Purchase order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Purchase order is in a conflicting state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: User lacks required purchase order approval authority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: Purchase order approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrderResponse"
  /v1/inventory/pickingLists/{id}/confirm:
    post:
      tags:
      - Picking Lists
      summary: Confirm picking list
      description: Confirms a picking list and commits consumption. Stub implementation.
      operationId: confirmPickingList
      parameters:
      - name: id
        in: path
        description: Picking list identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema: {}
      responses:
        "501":
          description: Not implemented
        "200":
          description: Picking list confirmed
  /v1/inventory/pick-lists:
    get:
      tags:
      - Pick Lists
      summary: List pick lists for workorder
      description: Returns pick lists linked to the provided workorder identifier
      operationId: getPickListsForWorkorder
      parameters:
      - name: workorderId
        in: query
        description: Workorder identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "403":
          description: User lacks required pick list authority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Invalid workorder identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: Pick lists returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PickListResponse"
    post:
      tags:
      - Pick Lists
      summary: Create pick list
      description: Creates a pick list for a workorder and returns generated pick
        tasks
      operationId: createPickList
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePickListRequest"
        required: true
      responses:
        "403":
          description: User lacks required pick list authority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "201":
          description: Pick list created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickListResponse"
  /v1/inventory/pick-lists/{pickListId}/tasks/{taskId}/confirm:
    post:
      tags:
      - Pick Lists
      summary: Confirm pick task
      description: Confirms a pick task using scanned SKU and location data
      operationId: confirmPickTask
      parameters:
      - name: pickListId
        in: path
        description: Pick list identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: taskId
        in: path
        description: Pick task identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Pick task confirmation payload
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmPickTaskRequest"
        required: true
      responses:
        "200":
          description: Pick task confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickTaskResponse"
        "400":
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: User lacks required pick task authority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Pick list or pick task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Pick confirmation failed business validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/inventory/pick-lists/{pickListId}/release:
    post:
      tags:
      - Pick Lists
      summary: Release pick list
      description: Releases a pick list so picking tasks can be executed
      operationId: releasePickList
      parameters:
      - name: pickListId
        in: path
        description: Pick list identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "403":
          description: User lacks required pick list authority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Pick list not found
          content:
            application/json:
              schema:
