    LocationInventoryItem:
      type: object
      description: A single on-hand stock item line
      properties:
        stockItemId:
          type: string
          description: Stock item identifier (product SKU)
          example: MICH-XC2-0001
        onHandQuantity:
          type: integer
          format: int64
          description: On-hand quantity of this stock item at the location
          example: 24
      required:
      - onHandQuantity
      - stockItemId
    LocationInventoryItemsResponse:
      type: object
      description: On-hand inventory contents for a storage location
      properties:
        locationId:
          type: string
          format: uuid
          description: Storage location identifier
        items:
          type: array
          description: Stock items currently on hand at the location
          items:
            $ref: '#/components/schemas/LocationInventoryItem'
      required:
      - items
      - locationId
    LocationInventoryInquiryResponse:
      type: object
      description: Inventory summary for a storage location
      properties:
        locationId:
          type: string
          format: uuid
          description: Storage location identifier
        onHandQuantity:
          type: integer
          format: int64
          description: Current on-hand quantity across all stock items at the location
          example: 12
        availableToPromiseQuantity:
          type: integer
          format: int64
          description: 'Quantity available to promise after pending allocations. Note: reservation events are not yet factored in. Null for as-of (historical) requests: historical allocation state is not reliably reconstructable from ATP-neutral ledger events, so as-of responses carry on-hand only.'
