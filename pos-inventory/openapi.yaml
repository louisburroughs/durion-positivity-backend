      - locationId
      - parentType
      - sites
      - totals
    SiteRollupSummary:
      type: object
      description: Per-site entry of a parent-location rollup, optionally including the storage-location tree
      properties:
        siteId:
          type: string
          format: uuid
          description: Site (Location) identifier
          example: 01960003-0000-7000-8000-000000000012
        siteName:
          type: string
          description: Site name from the location hierarchy
          example: Downtown Service Center
        totals:
          $ref: '#/components/schemas/RollupQuantities'
        nodes:
