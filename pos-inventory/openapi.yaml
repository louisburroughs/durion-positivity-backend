    ShortageResolveRequest:
      type: object
      description: Request to resolve an inventory shortage by executing a chosen option
      properties:
        idempotencyKey:
          type: string
          description: Retry-safe idempotency key; a replay with the same key returns the original result
          example: shortage-resolve-01960003-0001
          minLength: 1
        allocationId:
          type: string
          format: uuid
          description: Identifier of the allocation to resolve
          example: 01960003-0000-7000-8000-000000000001
        optionType:
          type: string
          description: The resolution option to execute
          enum:
          - BACKORDER
          - SUBSTITUTE
          - TRANSFER_IN
          - EMERGENCY_PURCHASE
          - CANCEL_LINE
          example: BACKORDER
        sku:
          type: string
          description: SKU / stock-item identifier that is short
          example: 01960003-0000-7000-8000-000000000002
          minLength: 1
        shortQuantity:
          type: integer
          format: int32
          description: Quantity that is short and to be resolved
          example: 3
          minimum: 0
        locationId:
          type: string
          format: uuid
          description: Site the demand is short at (required for BACKORDER / TRANSFER_IN)
          example: 01960004-0001-7000-8000-00000000000c
        workorderLineId:
          type: string
          format: uuid
          description: Workorder line whose demand was short (required for BACKORDER / SUBSTITUTE / CANCEL_LINE)
          example: 01960003-0000-7000-8000-000000000003
        substituteSku:
          type: string
          description: Substitute SKU to reserve; required when optionType is SUBSTITUTE
          example: 01960003-0000-7000-8000-000000000099
        sourceLocationId:
          type: string
          format: uuid
          description: Source site to pull surplus from; required when optionType is TRANSFER_IN
          example: 01960004-0001-7000-8000-00000000000a
        notes:
          type: string
          description: Optional free-text notes explaining the resolution
          example: Customer approved substitute item
      required:
      - allocationId
      - idempotencyKey
      - optionType
      - shortQuantity
      - sku
    ShortageResolutionResultDto:
      type: object
      description: Result of applying a resolution to an inventory shortage
      properties:
        allocationId:
          type: string
          format: uuid
          description: Identifier of the allocation that was resolved
          example: 01960003-0000-7000-8000-000000000001
        optionType:
          type: string
          description: The resolution option that was executed
          enum:
          - BACKORDER
          - SUBSTITUTE
          - TRANSFER_IN
          - EMERGENCY_PURCHASE
          - CANCEL_LINE
          example: BACKORDER
        idempotencyKey:
          type: string
          description: Idempotency key the resolution was recorded under
        artifactType:
          type: string
          description: Kind of artifact created (BACKORDER, RESERVATION, TRANSFER_ORDER, PURCHASE_SUGGESTION, NONE)
          example: BACKORDER
        artifactId:
          type: string
          format: uuid
          description: Identifier of the created artifact; null for CANCEL_LINE
          example: 01960003-0000-7000-8000-0000000000aa
        resolvedAt:
          type: string
          format: date-time
          description: Timestamp when the shortage was resolved
          example: 2026-01-15 09:30:00+00:00
        status:
          type: string
          description: Resulting status of the resolution
          example: RESOLVED
      required:
      - allocationId
      - artifactType
      - idempotencyKey
      - optionType
      - resolvedAt
      - status
    CreateScrapRequest:
      type: object
      description: Request to scrap (write off) stock at a location
      properties:
        stockItemId:
          type: string
          description: SKU / stock item identifier being scrapped
          example: OIL-5W30-5QT
          minLength: 1
        quantity:
          type: integer
          format: int32
          description: Quantity to write off; must be positive
          example: 3
          minimum: 0
        locationId:
          type: string
          format: uuid
          description: Location the stock is scrapped from
          example: 96dd346a-047c-86f5-3c9a-7c8cac53da86
        storageLocationId:
          type: string
          format: uuid
          description: Bin-level storage location, when the scrap is bin-scoped
          example: 01960004-0001-7000-8000-000000000009
        reasonCode:
          type: string
          description: Scrap reason; OTHER requires notes
          enum:
          - DAMAGED
          - EXPIRED
          - LOST
          - RECALLED
          - CONTAMINATED
          - WARRANTY_DESTROYED
          - OTHER
          example: DAMAGED
        notes:
          type: string
          description: Free-text notes; mandatory when reasonCode is OTHER
          example: Dropped during putaway, casing cracked
          maxLength: 2000
          minLength: 0
        workorderId:
          type: string
          format: uuid
          description: Workorder the scrapped part belonged to, when linked
          example: 01960005-0000-7000-8000-000000000001
        lotNumber:
          type: string
          description: Lot number the scrapped units belong to. Required (422 LOT_NUMBER_REQUIRED) when the SKU is LOT-tracked; must reference an existing (422 LOT_UNKNOWN) ACTIVE (422 LOT_NOT_AVAILABLE) lot. Ignored for untracked SKUs
          example: LOT-2026-A
          maxLength: 128
          minLength: 0
        attachmentReference:
          type: string
          description: Photo/attachment reference (storage out of scope)
          example: s3://scrap-evidence/2026/07/scrap-123.jpg
          maxLength: 500
          minLength: 0
        shouldReplenish:
          type: boolean
          description: When true, posting triggers a pick-face replenishment evaluation for the SKU/location
          example: false
        negativeStockOverride:
          type: boolean
          description: Explicit negative-stock override for the auto-approve posting path; honored only when the caller holds inventory:adjustment:override
          example: false
      required:
      - locationId
      - quantity
      - reasonCode
      - stockItemId
    ScrapResponse:
      type: object
      description: Scrap document with its approval and posting state
      properties:
        scrapId:
          type: string
          format: uuid
          description: Scrap document identifier
        stockItemId:
          type: string
          description: SKU / stock item identifier
        quantity:
          type: integer
          format: int32
          description: Quantity written off
        locationId:
          type: string
          format: uuid
          description: Location the stock is scrapped from
        storageLocationId:
          type: string
          format: uuid
          description: Bin-level storage location, when bin-scoped
        reasonCode:
          type: string
          description: Scrap reason
          enum:
          - DAMAGED
          - EXPIRED
          - LOST
          - RECALLED
          - CONTAMINATED
          - WARRANTY_DESTROYED
          - OTHER
        notes:
          type: string
          description: Free-text notes
        workorderId:
          type: string
          format: uuid
          description: Linked workorder, when the part was damaged during a job
        lotId:
          type: string
          format: uuid
          description: Lot the scrapped units belong to (LOT-tracked SKUs)
        attachmentReference:
          type: string
          description: Photo/attachment reference
        unitCostSnapshot:
          type: number
          description: Unit cost snapshot at creation; null when unknown
        costSource:
          type: string
          description: Origin of the cost snapshot (LATEST_RECEIPT or NONE)
          enum:
          - LATEST_RECEIPT
          - NONE
        scrapValue:
          type: number
          description: Monetary value of the scrap (quantity x cost snapshot); null when cost is unknown
        shouldReplenish:
          type: boolean
          description: Whether posting triggers a pick-face replenishment evaluation
        status:
          type: string
          description: Lifecycle status
          enum:
          - PENDING_APPROVAL
          - AUTO_APPROVED
          - APPROVED
          - POSTED
          - REJECTED
          - FAILED
        requiredApprovalTier:
          type: string
          description: Required approval tier; null when auto-approved
          enum:
          - TIER_1_MANAGER
          - TIER_2_DIRECTOR
        createdBy:
          type: string
          description: User who created the scrap
        approvedBy:
          type: string
          description: User who approved the scrap (SYSTEM for auto-approval)
        rejectedBy:
          type: string
          description: User who rejected the scrap
        rejectionReason:
          type: string
          description: Reason the scrap was rejected
        ledgerEntryId:
          type: string
          format: uuid
          description: SCRAP_OUT ledger entry created when posted
        errorMessage:
          type: string
          description: Error message when status is FAILED
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
        approvedAt:
          type: string
          format: date-time
          description: Approval timestamp
        rejectedAt:
          type: string
          format: date-time
          description: Rejection timestamp
        postedAt:
          type: string
          format: date-time
          description: Ledger posting timestamp
    RejectScrapRequest:
      type: object
      description: Request to reject a pending scrap document; no inventory changes are made
      properties:
        rejectionReason:
          type: string
          description: Reason explaining why the scrap is being rejected
          example: Part was recovered and restocked
          maxLength: 1000
          minLength: 0
      required:
      - rejectionReason
    ApproveScrapRequest:
      type: object
      description: Request to approve a pending scrap document and post it to the ledger
      properties:
        negativeStockOverride:
          type: boolean
          description: Explicit negative-stock override for the posting; honored only when the caller holds inventory:adjustment:override
          example: false
    ReturnLineDto:
      type: object
      description: 'A single line of a return submission: item, quantity, reason and disposition location'
      properties:
        itemId:
          type: string
          format: uuid
          description: Identifier of the item being returned
          example: 01960003-0000-7000-8000-000000000005
        quantity:
          type: integer
          format: int32
          description: Quantity of the item being returned
          example: 3
          minimum: 0
        reasonCode:
          type: string
          description: Reason code explaining the return
          example: DAMAGED
          minLength: 1
        locationId:
          type: string
          format: uuid
          description: Identifier of the location the item is returned to
          example: 01960003-0000-7000-8000-000000000006
        storageLocationId:
          type: string
          format: uuid
          description: Optional storage location within the location to receive the returned item
          example: 01960003-0000-7000-8000-000000000007
      required:
      - itemId
      - locationId
      - quantity
      - reasonCode
    ReturnSubmitRequest:
      type: object
      description: Request to submit a set of return lines against a workorder
      properties:
        workorderId:
          type: string
          format: uuid
          description: Identifier of the workorder the return is submitted against
          example: 01960003-0000-7000-8000-00000000000c
        lines:
          type: array
          description: Return lines describing each item, quantity and reason
          items:
            $ref: '#/components/schemas/ReturnLineDto'
          minItems: 1
      required:
      - lines
      - workorderId
    ReturnSubmissionResultDto:
      type: object
      description: Outcome of a return submission, summarizing how many lines were processed
      properties:
        returnId:
          type: string
          format: uuid
          description: Identifier of the created return record
          example: 01960003-0000-7000-8000-00000000000a
        workorderId:
          type: string
          format: uuid
          description: Identifier of the workorder the return was submitted against
          example: 01960003-0000-7000-8000-00000000000b
        processedLines:
          type: integer
          format: int32
          description: Number of return lines that were processed
          example: 2
        status:
          type: string
          description: Status of the return submission
          example: COMPLETED
        processedAt:
          type: string
          format: date-time
          description: Timestamp when the return was processed
          example: 2026-01-15 09:30:00+00:00
      required:
      - processedAt
      - processedLines
      - returnId
      - status
      - workorderId
    CreateReservationRequest:
      type: object
      description: Request to create an inventory reservation against a workorder line for a stock item
      properties:
        workorderLineId:
          type: string
          format: uuid
          description: Identifier of the workorder line the reservation fulfils
          example: 01960003-0000-7000-8000-000000000001
        stockItemId:
          type: string
          format: uuid
          description: Identifier of the stock item being reserved
          example: 01960003-0000-7000-8000-000000000002
        requiredQuantity:
          type: integer
          format: int32
          description: Quantity of the stock item required by the reservation
          example: 4
          minimum: 0
      required:
      - requiredQuantity
      - stockItemId
      - workorderLineId
    ReservationResponse:
      type: object
      description: Inventory reservation with its allocation state for a workorder line
      properties:
        reservationId:
          type: string
          format: uuid
          description: Identifier of the reservation
          example: 01960003-0000-7000-8000-000000000001
        workorderLineId:
          type: string
          format: uuid
          description: Identifier of the workorder line the reservation fulfils
          example: 01960003-0000-7000-8000-000000000002
        stockItemId:
          type: string
          format: uuid
          description: Identifier of the stock item being reserved
          example: 01960003-0000-7000-8000-000000000003
        requiredQuantity:
          type: integer
          format: int32
          description: Quantity of the stock item required by the reservation
          example: 4
        allocatedQuantity:
          type: integer
          format: int32
          description: Quantity currently allocated against the reservation
          example: 4
        status:
          type: string
          description: Status of the reservation, such as PENDING, ALLOCATED, or HARDENED
          example: ALLOCATED
      required:
      - allocatedQuantity
      - requiredQuantity
      - reservationId
      - status
      - stockItemId
      - workorderLineId
    PromoteAllocationRequest:
      type: object
      description: Request to promote a soft allocation to a hardened, location-pinned allocation
      properties:
        storageLocationId:
          type: string
          format: uuid
          description: Storage location identifier where the hardened allocation pins stock
          example: 01960003-0000-7000-8000-000000000001
        hardenedReason:
          type: string
          description: Reason the allocation is being hardened
          example: Reserved for scheduled workorder pick
      required:
      - storageLocationId
    ReplenishmentScanResultResponse:
      type: object
      description: Summary of a batch replenishment scan run over all replenishment policies
      properties:
        policiesEvaluated:
          type: integer
          format: int32
          description: Number of replenishment policies evaluated by the scan
          example: 42
        policiesBelowMinimum:
          type: integer
          format: int32
          description: Number of policies whose on-hand quantity was below the configured minimum
          example: 5
        tasksCreated:
          type: integer
          format: int32
          description: Number of new replenishment tasks created by the scan
          example: 3
        tasksRefreshed:
          type: integer
          format: int32
          description: Number of already-open replenishment tasks whose quantity was refreshed to the current need
          example: 2
        suggestionsCreated:
          type: integer
          format: int32
          description: Number of new purchase suggestions created for PURCHASE-preferring policies (odoo-parity F4)
          example: 1
        suggestionsRefreshed:
          type: integer
          format: int32
          description: Number of already-open purchase suggestions whose quantity was refreshed to the current need (odoo-parity F4)
          example: 0
        policiesSkipped:
          type: integer
          format: int32
          description: Number of policies skipped without evaluation because they are inactive or snoozed
          example: 1
        scanAt:
          type: string
          description: Timestamp at which the scan ran
          example: 2026-01-15 09:30:00+00:00
      required:
      - policiesBelowMinimum
      - policiesEvaluated
      - policiesSkipped
      - scanAt
      - suggestionsCreated
      - suggestionsRefreshed
      - tasksCreated
      - tasksRefreshed
    CreateReplenishmentPolicyRequest:
      type: object
      description: Request to create a replenishment policy defining min/max stock thresholds for an item at a location
      properties:
        locationId:
          type: string
          format: uuid
          description: Identifier of the location the replenishment policy applies to
          example: 01960003-0000-7000-8000-000000000001
        itemSKU:
          type: string
          description: SKU of the item the replenishment policy applies to
          example: SKU-10042
          minLength: 1
        minimumQuantity:
          type: integer
          format: int32
          description: Minimum on-hand quantity that triggers replenishment when reached
          example: 5
          minimum: 0
        maximumQuantity:
          type: integer
          format: int32
          description: Maximum on-hand quantity replenishment aims to restock up to
          example: 50
          minimum: 1
        orderMultiple:
          type: integer
          format: int32
          description: Round the computed replenishment quantity up to the nearest multiple of this value. When omitted, defaults to the vendor-feed pack size for the SKU when one is known (greater than 1); otherwise no rounding is applied.
          example: 6
          minimum: 1
        leadTimeDaysOverride:
          type: integer
          format: int32
          description: Per-policy lead-time override in days; takes precedence over vendor-feed lead-time estimates and the configured default
          example: 3
          minimum: 0
        preferredSourceType:
          type: string
          description: Preferred sourcing channel for replenishing this policy's pick face; defaults to EITHER
          enum:
          - INTERNAL_TRANSFER
          - PURCHASE
          - EITHER
          example: EITHER
        active:
          type: boolean
          description: Whether the policy participates in replenishment evaluation; defaults to true
          example: true
        minimumLessThanMaximum:
          type: boolean
      required:
      - itemSKU
      - locationId
      - maximumQuantity
      - minimumQuantity
    SnoozeReplenishmentPolicyRequest:
      type: object
      description: Request to snooze a replenishment policy until a future instant, or clear an existing snooze by sending a null snoozedUntil
      properties:
        snoozedUntil:
          type: string
          format: date-time
          description: Future instant until which the policy is excluded from replenishment evaluation; null clears an existing snooze
          example: 2026-02-01 00:00:00+00:00
    CreateReceivingSessionRequest:
      type: object
      description: Request to open a new inventory receiving session against a source document
      properties:
        sourceDocumentId:
          type: string
          description: Identifier of the source document (e.g. purchase order or workorder) being received against
          example: 01960003-0000-7000-8000-000000000001
          minLength: 1
        entryMethod:
          type: string
          description: Method used to enter receiving lines, such as SCAN or MANUAL
          example: MANUAL
      required:
      - sourceDocumentId
    ReceivingLineResponse:
      type: object
      description: A single line within a receiving session, with expected and received quantities
      properties:
        lineId:
          type: string
          format: uuid
          description: Identifier of the receiving line
          example: 01960003-0000-7000-8000-000000000001
        productId:
          type: string
          description: Identifier of the product on the receiving line
          example: 01960003-0000-7000-8000-000000000002
        expectedQuantity:
          type: number
          description: Quantity expected to be received on the line
          example: 10
        receivedQuantity:
          type: number
          description: Quantity received so far on the line
          example: 8
        status:
          type: string
          description: Status of the receiving line, such as PENDING or RECEIVED
          example: RECEIVED
        workorderId:
          type: string
          description: Identifier of the workorder the line is associated with, when applicable
          example: 01960003-0000-7000-8000-000000000003
        workorderLineId:
          type: string
          description: Identifier of the workorder line the receiving line fulfils, when applicable
          example: 01960003-0000-7000-8000-000000000004
        lotNumber:
          type: string
          description: Lot or batch number recorded on receipt; linked to the lot master for LOT-tracked products
          example: LOT-2026-0042
        documentUom:
          type: string
          description: UoM the line was keyed in when it differed from the product's base UoM
          example: CASE
        documentQuantity:
          type: number
          description: Quantity as keyed in documentUom; receivedQuantity holds the derived base quantity
          example: 1
        conversionFactor:
          type: number
          description: Effective base-per-document-unit conversion factor applied at posting time
          example: 12
      required:
      - lineId
      - productId
      - status
    ReceivingSessionResponse:
      type: object
      description: Inventory receiving session with its lines and source document context
      properties:
        sessionId:
          type: string
          format: uuid
          description: Identifier of the receiving session
          example: 01960003-0000-7000-8000-000000000001
        sourceDocumentId:
          type: string
          description: Identifier of the source document the session receives against
          example: 01960003-0000-7000-8000-000000000002
        sourceDocumentType:
          type: string
          description: Type of the source document, such as PURCHASE_ORDER or WORKORDER
          example: PURCHASE_ORDER
        supplierId:
          type: string
          description: Identifier of the supplier providing the received stock
          example: 01960003-0000-7000-8000-000000000003
        shipmentReference:
          type: string
          description: Carrier or shipment reference for the received goods
          example: SHIP-2026-00042
        status:
          type: string
          description: Status of the receiving session, such as IN_PROGRESS or COMPLETED
          example: IN_PROGRESS
        entryMethod:
          type: string
          description: Method used to enter receiving lines, such as SCAN or MANUAL
          example: MANUAL
        createdByUserId:
          type: string
          description: Identifier of the user who created the receiving session
          example: 01960003-0000-7000-8000-000000000004
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the receiving session was created
          example: 2026-01-15 09:30:00+00:00
        lines:
          type: array
          description: Receiving lines belonging to the session
          items:
            $ref: '#/components/schemas/ReceivingLineResponse'
      required:
      - createdAt
      - sessionId
      - sourceDocumentId
      - status
    ReceiveItemsRequest:
      type: object
      description: Request to record received quantities for one or more receiving session lines
      properties:
        lines:
          type: array
          description: Receiving lines with their received quantities; at least one line is required
          items:
            $ref: '#/components/schemas/ReceiveLineRequest'
          minItems: 1
      required:
      - lines
    ReceiveLineRequest:
      type: object
      description: Received quantity recorded against a single receiving session line
      properties:
        lineId:
          type: string
          format: uuid
          description: Identifier of the receiving line being recorded
          example: 01960003-0000-7000-8000-000000000001
        receivedQuantity:
          type: number
          description: Quantity actually received for the line, in the product's base UoM; may be zero. Required unless documentUom/documentQuantity are supplied, in which case the base quantity is derived and this field is ignored
          example: 8
          minimum: 0.0
        lotNumber:
          type: string
          description: Lot or batch number of the received stock. Required (422 LOT_NUMBER_REQUIRED) when the product is LOT-tracked per the catalog replica; ignored for tracking purposes otherwise
          example: LOT-2026-0042
        documentUom:
          type: string
          description: Optional UoM the line is keyed in (e.g. CASE). When present, documentQuantity is converted to the product's base UoM at posting time; a UoM with no conversion path is rejected with 422 UOM_CONVERSION_UNDEFINED
          example: CASE
        documentQuantity:
          type: number
          description: Quantity received expressed in documentUom; must be supplied together with documentUom
          example: 1
          minimum: 0
        expirationDate:
          type: string
          format: date
          description: Optional expiration date of the received lot (odoo-parity E3). Stamped on the lot on first receipt for LOT-tracked products; ignored for untracked products and for lots that already exist (correct an existing lot via the lot-management endpoint)
          example: 2027-01-31
        serialNumbers:
          type: array
          description: 'Serial numbers of the received units (odoo-parity E4). Required for SERIAL-tracked products: the list size must equal the received base quantity (422 SERIAL_COUNT_MISMATCH otherwise), and each serial is enumerated as an in-stock unit. Ignored for untracked and LOT-tracked products'
          example:
          - SN-0001
          - SN-0002
          items:
            type: string
      required:
      - lineId
    ReceiveItemsResponse:
      type: object
      description: Result of recording received quantities for a receiving session
      properties:
        sessionId:
          type: string
          format: uuid
          description: Identifier of the receiving session the items were recorded against
          example: 01960003-0000-7000-8000-000000000001
        sessionStatus:
          type: string
          description: Status of the receiving session after recording the items
          example: IN_PROGRESS
        linesProcessed:
          type: integer
          format: int32
          description: Number of receiving lines processed in this request
          example: 3
        variances:
          type: array
          description: Variance summaries for lines whose received quantity differed from the expected quantity
          items:
            $ref: '#/components/schemas/VarianceSummaryResponse'
      required:
      - linesProcessed
      - sessionId
      - sessionStatus
    VarianceSummaryResponse:
      type: object
      description: Summary of a quantity variance detected on a single receiving line
      properties:
        lineId:
          type: string
          format: uuid
          description: Identifier of the receiving line that had a variance
          example: 01960003-0000-7000-8000-000000000002
        productId:
          type: string
          description: Identifier of the product on the receiving line
          example: 01960003-0000-7000-8000-000000000003
        varianceType:
          type: string
          description: Type of variance detected, such as OVER or SHORT
          example: SHORT
        varianceQuantity:
          type: number
          description: Difference between received and expected quantity for the line
          example: 2
        expectedQuantity:
          type: number
          description: Quantity originally expected on the receiving line
          example: 10
        receivedQuantity:
          type: number
          description: Quantity actually received on the line
          example: 8
      required:
      - expectedQuantity
      - lineId
      - productId
      - receivedQuantity
      - varianceQuantity
      - varianceType
    CrossDockRequest:
      type: object
      description: Request to cross-dock received stock directly against a workorder line
      properties:
        workorderId:
          type: string
          description: Identifier of the workorder the received stock is cross-docked to
          example: 01960003-0000-7000-8000-000000000001
          minLength: 1
        workorderLineId:
          type: string
          description: Identifier of the workorder line the received stock fulfils
          example: 01960003-0000-7000-8000-000000000002
          minLength: 1
        quantity:
          type: number
          description: Quantity of stock to cross-dock against the workorder line
          example: 12
          minimum: 0.01
        notes:
          type: string
          description: Optional free-text note describing the cross-dock action
          example: Cross-docked at dock door 3 for urgent workorder
        lotNumber:
          type: string
          description: Lot or batch number of the cross-docked stock. Required (422 LOT_NUMBER_REQUIRED) when the product is LOT-tracked (falls back to the lot number already keyed on the receiving line); the lot is found-or-created like any receipt and stamped on BOTH paired ledger entries. Ignored for untracked products
          example: LOT-2026-A
          maxLength: 128
          minLength: 0
      required:
      - quantity
      - workorderId
      - workorderLineId
    CrossDockResponse:
      type: object
      description: Result of cross-docking received stock against a workorder line
      properties:
        lineId:
          type: string
          format: uuid
          description: Identifier of the receiving line that was cross-docked
          example: 01960003-0000-7000-8000-000000000001
        workorderId:
          type: string
          description: Identifier of the workorder the stock was cross-docked to
          example: 01960003-0000-7000-8000-000000000002
        workorderLineId:
          type: string
          description: Identifier of the workorder line the stock fulfilled
          example: 01960003-0000-7000-8000-000000000003
        crossDockedQuantity:
          type: number
          description: Quantity of stock that was cross-docked
          example: 12
        ledgerEntryIds:
          type: array
          description: Identifiers of the inventory ledger entries created by the cross-dock
          example:
          - 01960003-0000-7000-8000-000000000004
          items:
            type: string
        sessionStatus:
          type: string
          description: Status of the receiving session after the cross-dock
          example: COMPLETED
        lineStatus:
          type: string
          description: Status of the receiving line after the cross-dock
          example: RECEIVED
      required:
      - crossDockedQuantity
      - lineId
      - lineStatus
      - sessionStatus
      - workorderId
      - workorderLineId
    PutawayExecutionRequest:
      type: object
      description: Request to execute a putaway move from staging to storage, with optional business-rule overrides
      properties:
        skuId:
          type: string
          description: Identifier of the SKU being moved
          example: 01960003-0000-7000-8000-000000000120
          minLength: 1
        sourceLocationId:
          type: string
          format: uuid
          description: Identifier of the staging location the goods are moved from
          example: 01960003-0000-7000-8000-000000000121
        destinationLocationId:
          type: string
          format: uuid
          description: Identifier of the storage location the goods are moved to
          example: 01960003-0000-7000-8000-000000000122
        quantity:
          type: integer
          format: int32
          description: Quantity of units to move
          example: 12
          minimum: 0
        overrideLocationCompatibility:
          type: boolean
          description: When true, bypasses the location compatibility check for this move
          example: false
        overrideCapacity:
          type: boolean
          description: When true, bypasses the destination capacity check for this move
          example: false
        overrideReasonCode:
          type: string
          description: Audit reason code justifying any applied override
          enum:
          - CAPACITY_OVERRIDE
          - LOCATION_COMPATIBILITY_OVERRIDE
          - URGENT_FULFILLMENT
          - ALTERNATE_LOCATION
          - OTHER
