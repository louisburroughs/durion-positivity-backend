      - sourceReceiptId
    PutawayLineItemRequest:
      type: object
      description: A single product and quantity line for a putaway tasks generation request
      properties:
        productId:
          type: string
          description: Identifier of the product to be put away
          example: 01960003-0000-7000-8000-000000000080
          minLength: 1
        quantity:
          type: integer
          format: int32
          description: Quantity of the product to be put away
          example: 12
