  /v1/inventory/locations/{locationId}/inventory-rollup:
    get:
      tags:
      - Inventory Rollup
      summary: Get parent-location inventory rollup
      description: Aggregates inventory totals across all descendant sites of a parent location (building/place/region) along a typed parent chain (default PHYSICAL, ADR-0016). Returns per-site summaries plus a grand total. With expand=tree, each site entry inlines its full storage-location rollup tree; expansion is rejected with 422 when the descendant site count exceeds the configured cap (pos.inventory.rollup.expand-site-cap, default 25). Without expand, summaries are computed sequentially for every descendant regardless of count; prefer narrow parent locations for large hierarchies.
      operationId: getLocationInventoryRollup
      parameters:
      - name: locationId
        in: path
        description: Parent location identifier (building/place/region)
        required: true
        schema:
          type: string
          format: uuid
      - name: parentType
        in: query
        description: Typed parent chain to walk (default PHYSICAL)
        required: false
        schema:
          type: string
      - name: sku
        in: query
        description: Optional product SKU filter
        required: false
        schema:
          type: string
      - name: expand
        in: query
        description: Set to 'tree' to inline each site's full rollup tree
        required: false
        schema:
          type: string
      - name: depth
        in: query
        description: Maximum per-site tree depth (only with expand=tree)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
      - name: includeEmpty
        in: query
        description: Include all-zero tree nodes (only with expand=tree)
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Rollup returned (empty sites list when the location has no descendants)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationInventoryRollupResponse'
        '400':
          description: Invalid parameters (unknown parentType, bad expand value)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationInventoryRollupResponse'
        '403':
          description: User lacks required on-hand view authority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: 'expand=tree rejected: descendant site count exceeds the configured cap'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Location service unavailable; retry later
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:on_hand:view
      x-required-permissions:
      - inventory:on_hand:view
