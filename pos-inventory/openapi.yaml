  /v1/inventory/sites/{siteId}/inventory-rollup:
    get:
      description: 'Returns on-hand, allocated and available quantities grouped and subtotaled along the storage-location hierarchy of one site, each node carrying its own quantities plus the rolled-up sum of itself and all descendants.

        Use this tool for the storage-location tree inside a single site; do not use getLocationInventoryRollup, which aggregates across the descendant sites of a parent location (building, place or region) rather than within one site.

        Preconditions: the site must exist in pos-location, whose topology is fetched at request time; ledger rows at location ids unknown to the site are excluded — there is no unassigned bucket.

        Required inputs: siteId (UUID) path parameter; sku is an optional filter, depth (minimum 1, where 1 returns root storage locations only) limits the returned tree, and includeEmpty defaults to false.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 404 when the site is not found, 400 for invalid parameters, and 503 when the location service is unavailable.

        '
      operationId: getSiteInventoryRollup
      parameters:
      - description: Site (Location) identifier
        in: path
        name: siteId
        required: true
        schema:
          format: uuid
          type: string
      - description: Optional product SKU filter
        in: query
        name: sku
        required: false
        schema:
          type: string
      - description: Maximum tree depth to return (1 = root storage locations only)
        in: query
        name: depth
        required: false
        schema:
          format: int32
          minimum: 1
          type: integer
      - description: Include storage locations with zero on-hand and zero allocations
        in: query
        name: includeEmpty
        required: false
        schema:
          default: false
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteInventoryRollupResponse'
          description: Rollup returned (empty nodes list when the site has no storage locations)
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteInventoryRollupResponse'
          description: Invalid parameters
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: User lacks required on-hand view authority
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Site not found
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Location service unavailable; retry later
      security:
      - bearerAuth:
        - inventory:on_hand:view
      summary: Get site inventory rollup
      tags:
      - Inventory Rollup
      x-required-permissions:
      - inventory:on_hand:view
  /v1/inventory/sourcing-strategies:
    get:
      description: 'Lists every sourcing-strategy configuration row, active and inactive, ordered by scope type then scope value.

        Use this tool to inspect removal-strategy configuration; use upsertSourcingStrategyConfig instead to change a scope, and deactivateSourcingStrategyConfig instead to retire one.

        Preconditions: none; at most one row exists per scope.

        Required inputs: none, and there is no paging or filtering.

        Emits an INVENTORY_SOURCING_STRATEGY_LIST audit event; no configuration is changed.

        Returns 200 with an empty array when nothing is configured, in which case decision-time resolution falls through SKU_CATEGORY, SITE and DEFAULT to the platform default FIFO.

        '
      operationId: listSourcingStrategyConfigs
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SourcingStrategyConfigResponse'
                type: array
          description: Sourcing strategy configurations returned
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: User lacks required permission
      security:
      - bearerAuth:
        - inventory:location:admin
      summary: List sourcing strategy configurations
      tags:
      - Sourcing Strategies
      x-required-permissions:
      - inventory:location:admin
    put:
      description: 'Creates or updates the sourcing strategy for one scope and reactivates the row; at most one row exists per scopeType and scopeValue pair.

        Use this tool to set FIFO, FEFO, PROXIMITY or HIGHEST_STOCK at a scope; do not use deactivateSourcingStrategyConfig to change a strategy — an upsert on an inactive row reactivates it with the new strategy.

        Preconditions: none beyond scope-value shape; note that FEFO falls back to FIFO while the SKU has no lot-expiry data, PROXIMITY falls back to FIFO when a decision has no reference location, and SKU_CATEGORY rows are stored but unresolvable until the catalog replica carries categories.

        Required inputs: scopeType (SKU_CATEGORY, SITE or DEFAULT) and strategy; scopeValue must be the category string for SKU_CATEGORY, the site UUID as text for SITE, and must be omitted for DEFAULT.

        Emits an INVENTORY_SOURCING_STRATEGY_UPSERT event; the change affects subsequent sourcing decisions immediately.

        Returns 400 when scopeValue is missing for SITE or SKU_CATEGORY, is not a UUID for SITE, or is present for DEFAULT.

        '
      operationId: upsertSourcingStrategyConfig
      requestBody:
        content:
          application/json:
            examples:
              Proximity at one site:
                description: Proximity at one site
                value:
                  scopeType: SITE
                  scopeValue: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a10
                  strategy: PROXIMITY
            schema:
              $ref: '#/components/schemas/SourcingStrategyConfigRequest'
        description: The scope being configured and the sourcing strategy to apply at it.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcingStrategyConfigResponse'
          description: Sourcing strategy configuration upserted
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Validation failure
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: User lacks required permission
      security:
      - bearerAuth:
        - inventory:location:admin
      summary: Upsert sourcing strategy configuration
      tags:
      - Sourcing Strategies
      x-required-permissions:
      - inventory:location:admin
  /v1/inventory/sourcing-strategies/{configId}:
    delete:
      description: 'Deactivates one sourcing-strategy configuration row so it stops participating in strategy resolution; this is a soft delete and the row is never removed.

        Use this tool to retire a scope override and fall back to the next precedence level; do not use upsertSourcingStrategyConfig with a different strategy when the intent is to remove the override entirely.

        Preconditions: the configuration row must exist; deactivating an already inactive row is a no-op that returns the row.

        Required inputs: configId (UUID) path parameter; there is no request body.

        Emits an INVENTORY_SOURCING_STRATEGY_DEACTIVATE event; subsequent decisions fall back to SITE, DEFAULT or the platform default FIFO.

        Returns 404 when no configuration exists for the supplied id.

