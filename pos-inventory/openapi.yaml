openapi: 3.1.0
info:
  title: Positivity Inventory API
  description: API documentation for the Inventory service, accessible via the API Gateway.
  contact:
    name: Durion Support Services
    email: louis.burroughs@gmail.com
  version: v1
servers:
- url: http://localhost:8086
  description: Generated server url
tags:
- name: Inventory Locations
  description: Read inventory facts for storage locations
- name: Lots
  description: Lot master records captured on inbound receipts, with per-lot on-hand
- name: Reallocation
  description: Allocation rebalancing endpoints
- name: Cycle Count Plans
  description: Cycle count plan management endpoints
- name: Picking Lists
  description: Picking list command endpoints
- name: Pick Lists
  description: Pick list and pick task management endpoints
- name: Putaway Execution
  description: Execute putaway tasks with validation and audit events
- name: Location Sync
  description: Location roster sync trigger and audit log endpoints
- name: Inventory Reservations
  description: Reserve, promote, and cancel inventory allocations for workorder lines
- name: Shortage Resolution
  description: Shortage resolution recommendation endpoints
- name: Inventory Rollup
  description: Inventory quantities rolled up along the storage-location hierarchy
- name: Inventory Bulk Ingest API
  description: Bulk import inventory adjustment requests
- name: Returns
  description: Inventory return-to-stock endpoints
- name: Inventory Reference Data
  description: Inventory reference-data read endpoints
- name: Cycle Count Operations
  description: Cycle count submission and recount operations
- name: Inventory Management
  description: Operations related to inventory location management
- name: Transfer Orders
  description: Cross-site transfer orders with in-transit tracking
- name: Scraps
  description: Scrap (write-off) documents with value-threshold approval and SCRAP_OUT posting
- name: Purchase Suggestions
  description: Purchase suggestion listing and lifecycle endpoints
- name: ASN
  description: Advanced Shipping Notice and goods receipt endpoints
- name: Putaway
  description: Putaway task generation and claiming endpoints
- name: Inventory Availability
  description: Inventory availability read/write endpoints
- name: Consumption
  description: Workorder parts consumption endpoints
- name: Cycle Count API
  description: API for cycle count operations and variance tracking
- name: Replenishment
  description: Replenishment task and policy endpoints
- name: Cycle Count Query
  description: Query endpoints for cycle count tasks and history
- name: Backorders
  description: Unfulfilled workorder-line demand held open until availability covers it
- name: Cycle Count Schedules
  description: Recurring cycle-count schedule management endpoints
- name: Purchase Orders
  description: Purchase order creation, lifecycle, and receiving endpoints
- name: Cycle Count Adjustments
  description: Manage inventory adjustments from cycle counts
- name: Valuation Methods
  description: Costing method configuration endpoints (odoo-parity J1)
- name: Receiving
  description: Receiving session creation, item receiving, and cross-dock execution endpoints
- name: Sourcing Strategies
  description: Sourcing/removal strategy configuration endpoints
- name: Inventory Sites
  description: Site inventory configuration endpoints. Inventory Sites represent physical locations that hold inventory.
- name: Inventory Ledger
  description: Inventory ledger read endpoints
- name: Stock Movements
  description: Inventory ledger movement recording and adjustment endpoints
paths:
  /v1/inventory/valuation/methods:
    get:
      tags:
      - Valuation Methods
      summary: List costing method configurations
      description: Lists all costing method configuration rows (active and inactive), ordered by scope. Resolution precedence at posting time is SKU, then SKU_CATEGORY, then DEFAULT, then the deployment default pos.inventory.valuation.default-method (AVERAGE).
      operationId: listConfigs
      responses:
        '200':
          description: Costing method configurations returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CostingMethodConfigResponse'
        '403':
          description: User lacks required permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:location:admin
      x-required-permissions:
      - inventory:location:admin
    put:
      tags:
      - Valuation Methods
      summary: Upsert costing method configuration
      description: Creates or updates the costing method for one scope (SKU, SKU_CATEGORY, or DEFAULT) and reactivates it. A method change is recorded in the who/when/from/to change log. At most one row exists per scope. The new method applies going forward only; opening-value restatement is the J4 revaluation workflow.
      operationId: upsertConfig
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostingMethodConfigRequest'
        required: true
      responses:
        '200':
          description: Costing method configuration upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostingMethodConfigResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: User lacks required permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:location:admin
      x-required-permissions:
      - inventory:location:admin
  /v1/inventory/sourcing-strategies:
    get:
      tags:
      - Sourcing Strategies
      summary: List sourcing strategy configurations
      description: Lists all sourcing strategy configuration rows (active and inactive), ordered by scope. Resolution precedence at decision time is SKU_CATEGORY, then SITE, then DEFAULT, then the platform default FIFO.
      operationId: listConfigs_1
      responses:
        '200':
          description: Sourcing strategy configurations returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SourcingStrategyConfigResponse'
        '403':
          description: User lacks required permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:location:admin
      x-required-permissions:
      - inventory:location:admin
    put:
      tags:
      - Sourcing Strategies
      summary: Upsert sourcing strategy configuration
      description: Creates or updates the sourcing strategy for one scope (SKU_CATEGORY, SITE, or DEFAULT) and reactivates it. At most one row exists per scope.
      operationId: upsertConfig_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourcingStrategyConfigRequest'
        required: true
      responses:
        '200':
          description: Sourcing strategy configuration upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcingStrategyConfigResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: User lacks required permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:location:admin
      x-required-permissions:
      - inventory:location:admin
  /v1/inventory/sites/{siteId}/defaultLocations:
    get:
      tags:
      - Inventory Sites
      summary: Get site default locations
      description: Returns configured default locations for a site. Stub implementation.
      operationId: getSiteDefaultLocations
      parameters:
      - name: siteId
        in: path
        description: Site identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Default locations returned
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
      security:
      - bearerAuth:
        - inventory:location:view
      x-required-permissions:
      - inventory:location:view
    put:
      tags:
      - Inventory Sites
      summary: Replace site default locations
      description: Replaces the configured default locations for a site. Stub implementation.
      operationId: putSiteDefaultLocations
      parameters:
      - name: siteId
        in: path
        description: Site identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uuid
      responses:
        '200':
          description: Default locations replaced
        '501':
          description: Not implemented
      security:
      - bearerAuth:
        - inventory:location:admin
      x-required-permissions:
      - inventory:location:admin
  /v1/inventory/replenishment/policies/{policyId}:
    put:
      tags:
      - Replenishment
      summary: Update replenishment policy
      description: Full-replace update of a policy's min/max thresholds and tuning fields (order multiple, lead-time override, preferred source type, active flag). Omitted optional fields are cleared or reset to defaults. Location, SKU, and snooze state are not updatable here; snooze is managed by the snooze endpoint.
      operationId: updateReplenishmentPolicy
      parameters:
      - name: policyId
        in: path
        description: Replenishment policy identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReplenishmentPolicyRequest'
        required: true
      responses:
        '200':
          description: Replenishment policy updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplenishmentPolicyResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplenishmentPolicyResponse'
        '404':
          description: Policy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplenishmentPolicyResponse'
      security:
      - bearerAuth:
        - inventory:replenishment:manage
      x-required-permissions:
      - inventory:replenishment:manage
  /v1/inventory/lots/{lotId}/expiration:
    put:
      tags:
      - Lots
      summary: Set lot expiration
      description: Sets or clears a lot's expiration date and alert-window date. Re-dating resets the emit-once alert bookkeeping so the daily expiry scan can alert the new dates.
      operationId: updateLotExpiration
      parameters:
      - name: lotId
        in: path
        description: Lot ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LotExpirationUpdateRequest'
        required: true
      responses:
        '200':
          description: Lot expiration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotResponse'
        '403':
          description: Missing inventory:lot:manage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Lot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:lot:manage
      x-required-permissions:
      - inventory:lot:manage
  /v1/inventory/cycleCountSchedules/{scheduleId}:
    get:
      tags:
      - Cycle Count Schedules
      summary: Get cycle count schedule
      description: Returns a cycle-count schedule by identifier.
      operationId: getSchedule
      parameters:
      - name: scheduleId
        in: path
        description: Cycle count schedule identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Cycle count schedule returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountScheduleResponse'
        '404':
          description: Cycle count schedule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountScheduleResponse'
      security:
      - bearerAuth:
        - inventory:cycle_count:view
      x-required-permissions:
      - inventory:cycle_count:view
    put:
      tags:
      - Cycle Count Schedules
      summary: Update cycle count schedule
      description: Partially updates a cycle-count schedule (frequency, filters, next due date, auto-create, active flag); null fields are left unchanged.
      operationId: updateSchedule
      parameters:
      - name: scheduleId
        in: path
        description: Cycle count schedule identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCycleCountScheduleRequest'
        required: true
      responses:
        '200':
          description: Cycle count schedule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountScheduleResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountScheduleResponse'
        '403':
          description: User lacks required permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountScheduleResponse'
        '404':
          description: Cycle count schedule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountScheduleResponse'
      security:
      - bearerAuth:
        - inventory:cycle_count:initiate
      x-required-permissions:
      - inventory:cycle_count:initiate
    delete:
      tags:
      - Cycle Count Schedules
      summary: Deactivate cycle count schedule
      description: 'Soft delete: marks the schedule inactive so it stops firing; the row is never removed.'
      operationId: deactivateSchedule
      parameters:
      - name: scheduleId
        in: path
        description: Cycle count schedule identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Cycle count schedule deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountScheduleResponse'
        '403':
          description: User lacks required permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountScheduleResponse'
        '404':
          description: Cycle count schedule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountScheduleResponse'
      security:
      - bearerAuth:
        - inventory:cycle_count:initiate
      x-required-permissions:
      - inventory:cycle_count:initiate
  /v1/inventory/cycleCountPlans/{planId}/status:
    put:
      tags:
      - Cycle Count Plans
      summary: Transition cycle count plan status
      description: 'Moves a plan through its lifecycle (PLANNED → STARTED → COMPLETED_PENDING_APPROVAL → APPROVED/REJECTED; PLANNED/STARTED may be CANCELLED). Approving a schedule-created plan restamps the originating schedule''s next due date (odoo-parity I1, #1031).'
      operationId: updatePlanStatus
      parameters:
      - name: planId
        in: path
        description: Cycle count plan identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCycleCountPlanStatusRequest'
        required: true
      responses:
        '200':
          description: Cycle count plan status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountPlanResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountPlanResponse'
        '403':
          description: User lacks required permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountPlanResponse'
        '404':
          description: Cycle count plan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountPlanResponse'
        '409':
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountPlanResponse'
      security:
      - bearerAuth:
        - inventory:cycle_count:complete
      x-required-permissions:
      - inventory:cycle_count:complete
  /v1/inventory/transfer-orders:
    get:
      tags:
      - Transfer Orders
      summary: List transfer orders
      description: Lists transfer orders filtered by status, source site, and destination site
      operationId: listTransferOrders
      parameters:
      - name: status
        in: query
        description: Filter by lifecycle status
        required: false
        schema:
          type: string
          enum:
          - DRAFT
          - APPROVED
          - DISPATCHED
          - PARTIALLY_RECEIVED
          - RECEIVED
          - SHORT_CLOSED
          - CANCELLED
      - name: sourceLocationId
        in: query
        description: Filter by source site
        required: false
        schema:
          type: string
          format: uuid
      - name: destinationLocationId
        in: query
        description: Filter by destination site
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Transfer orders retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransferOrderResponse'
      security:
      - bearerAuth:
        - inventory:transfer:view
      x-required-permissions:
      - inventory:transfer:view
    post:
      tags:
      - Transfer Orders
      summary: Create transfer order
      description: Creates a cross-site transfer order in DRAFT. Source and destination must be different sites, both ACTIVE in the location roster (DECISION-INVENTORY-009), with at least one positive-quantity line.
      operationId: createTransferOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferOrderRequest'
        required: true
      responses:
        '201':
          description: Transfer order created in DRAFT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferOrderResponse'
        '400':
          description: Invalid request (same source and destination site, empty lines, non-positive quantity, or a storage location outside its site)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Missing inventory:transfer:create
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Source or destination site is not in the location roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: 'Source or destination site is not eligible for movement (TRANSFER_LOCATION_NOT_ELIGIBLE: INACTIVE/PENDING per DECISION-INVENTORY-009)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:transfer:create
      x-required-permissions:
      - inventory:transfer:create
  /v1/inventory/transfer-orders/{transferOrderId}/short-close:
    post:
      tags:
      - Transfer Orders
      summary: Short-close transfer order
      description: 'Short-closes a DISPATCHED or PARTIALLY_RECEIVED order whose in-transit remainder will never be received normally (parity-C3). One whole-order disposition resolves every line''s remainder (dispatched minus received): LOST_IN_TRANSIT writes it off through the ledger funnel (paired constructive TRANSFER_IN + SCRAP_OUT with reason LOST at the destination — global on-hand drops, no scrap document is created); RETURNED_TO_SOURCE restores it to source on-hand (constructive TRANSFER_IN, TRANSFER_OUT back, TRANSFER_IN at source). Either way the destination in-transit quantity zeroes atomically and the order reaches the terminal SHORT_CLOSED status; reason and notes are mandatory. The terminal TransferOrderUpdatedV1 fact carries the disposition.'
      operationId: shortCloseTransferOrder
      parameters:
      - name: transferOrderId
        in: path
        description: Transfer order ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShortCloseTransferOrderRequest'
        required: true
      responses:
        '200':
          description: Transfer order short-closed (terminal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferOrderResponse'
        '400':
          description: Missing disposition, reason, or notes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Missing inventory:transfer:short_close
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Transfer order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Order is not short-closable (not DISPATCHED/PARTIALLY_RECEIVED, or no outstanding in-transit remainder)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: 'RETURNED_TO_SOURCE only: the source site is not movement-eligible (TRANSFER_LOCATION_NOT_ELIGIBLE per DECISION-INVENTORY-009)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:transfer:short_close
      x-required-permissions:
      - inventory:transfer:short_close
  /v1/inventory/transfer-orders/{transferOrderId}/receive:
    post:
      tags:
      - Transfer Orders
      summary: Receive transfer order
      description: 'Receives dispatched quantities at the destination: posts one TRANSFER_IN per line through the ledger funnel (sourceTransactionId = transferOrderId), raising destination on-hand and draining the in-transit quantity. Status becomes RECEIVED when every line is fully received, else PARTIALLY_RECEIVED (the remainder stays in transit). Per-line quantities default to the full un-received remainder and must not exceed it.'
      operationId: receiveTransferOrder
      parameters:
      - name: transferOrderId
        in: path
        description: Transfer order ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiveTransferOrderRequest'
      responses:
        '200':
          description: Receipt recorded (RECEIVED or PARTIALLY_RECEIVED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferOrderResponse'
        '400':
          description: Unknown or duplicate line id in the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Missing inventory:transfer:receive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Transfer order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Order is not receivable (not yet dispatched, cancelled, short-closed, or already fully received)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Received quantity exceeds the un-received dispatched remainder (TRANSFER_RECEIVE_EXCEEDS_DISPATCHED), or the destination site is not movement-eligible (TRANSFER_LOCATION_NOT_ELIGIBLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:transfer:receive
      x-required-permissions:
      - inventory:transfer:receive
  /v1/inventory/transfer-orders/{transferOrderId}/dispatch:
    post:
      tags:
      - Transfer Orders
      summary: Dispatch transfer order
      description: 'Dispatches the order from the source site: posts one TRANSFER_OUT per line through the ledger funnel (sourceTransactionId = transferOrderId), decrements source on-hand, and raises the destination key''s in-transit quantity. Per-line quantities default to the full requested quantity and must not exceed it.'
      operationId: dispatchTransferOrder
      parameters:
      - name: transferOrderId
        in: path
        description: Transfer order ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchTransferOrderRequest'
      responses:
        '200':
          description: Transfer order dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferOrderResponse'
        '400':
          description: Unknown or duplicate line id in the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Missing inventory:transfer:dispatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Transfer order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Order is not dispatchable (already dispatched/terminal, or awaiting approval)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Dispatch quantity exceeds requested (TRANSFER_DISPATCH_EXCEEDS_REQUESTED), source on-hand insufficient (INSUFFICIENT_STOCK — TRANSFER_OUT is blocked below zero), or a site is not movement-eligible (TRANSFER_LOCATION_NOT_ELIGIBLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:transfer:dispatch
      x-required-permissions:
      - inventory:transfer:dispatch
  /v1/inventory/transfer-orders/{transferOrderId}/cancel:
    post:
      tags:
      - Transfer Orders
      summary: Cancel transfer order
      description: 'Cancels a transfer order before dispatch (DRAFT/APPROVED to CANCELLED). After dispatch the stock has physically moved: cancellation returns 409 and discrepancies resolve via short-close (parity-C3).'
      operationId: cancelTransferOrder
      parameters:
      - name: transferOrderId
        in: path
        description: Transfer order ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Transfer order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferOrderResponse'
        '403':
          description: Missing inventory:transfer:create
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Transfer order not found
          content:
