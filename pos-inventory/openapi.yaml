      description: Creates ONE multi-line DRAFT purchase order from ACCEPTED suggestions sharing a single vendor, then stamps each suggestion CONVERTED. The DRAFT order still passes the existing purchase order approval workflow — conversion never approves spend. Requires BOTH inventory:replenishment:manage AND inventory:purchase_order:create.
