    ReceivePurchaseOrderLineRequest:
      type: object
      description: Receipt detail for a single purchase order line
      properties:
        lineId:
          type: string
          format: uuid
          description: Identifier of the purchase order line being received
          example: 01960003-0000-7000-8000-000000000020
        quantityReceived:
          type: number
          description: Quantity received for this line, in the product's base UoM. Required unless documentUom/documentQuantity are supplied, in which case the base quantity is derived and this field is ignored
          example: 4
        unitCostMinor:
          type: integer
          format: int64
          description: Actual unit cost of the received goods in the smallest currency unit (e.g. cents). When documentUom is present this refers to one documentUom unit
          example: 1499
        documentUom:
          type: string
          description: Optional UoM the receipt is keyed in (e.g. CASE). When present, documentQuantity is converted to the product's base UoM at posting time; a UoM with no conversion path is rejected with 422 UOM_CONVERSION_UNDEFINED
          example: CASE
        documentQuantity:
          type: number
          description: Quantity received expressed in documentUom; must be supplied together with documentUom
          example: 1
        lotNumber:
          type: string
          description: Lot or batch number of the received stock. Required (422 LOT_NUMBER_REQUIRED) when the line's product is LOT-tracked per the catalog replica; ignored for tracking purposes otherwise
          example: LOT-2026-0042
      required:
      - lineId
    ReceivePurchaseOrderRequest:
      type: object
      description: Request to record receipt of goods against one or more purchase order lines
      properties:
        lines:
          type: array
          description: Line-level receipts describing the quantity received against each purchase order line
          items:
            $ref: '#/components/schemas/ReceivePurchaseOrderLineRequest'
          minItems: 1
      required:
      - lines
    ReceivePurchaseOrderLineDetail:
      type: object
      description: Open-quantity detail for a single purchase order line after a receipt
      properties:
        lineId:
          type: string
          format: uuid
          description: Identifier of the purchase order line
          example: 01960003-0000-7000-8000-000000000020
        openQuantityDecimal:
          type: number
          description: Quantity on this line still awaiting receipt
          example: 8
      required:
      - lineId
    ReceivePurchaseOrderResponse:
      type: object
      description: Result of receiving goods against a purchase order, including updated status and open balances
      properties:
        poId:
          type: string
          format: uuid
          description: Identifier of the purchase order that was received against
          example: 01960003-0000-7000-8000-000000000001
        status:
          type: string
          description: Updated lifecycle status of the purchase order after the receipt
          enum:
          - DRAFT
          - APPROVED
          - PARTIALLY_RECEIVED
          - FULLY_RECEIVED
          - CLOSED
          - CANCELLED
          example: PARTIALLY_RECEIVED
        openBalanceMinor:
          type: integer
          format: int64
          description: Remaining open balance in the smallest currency unit (e.g. cents) after the receipt
          example: 5000
        message:
          type: string
          description: Human-readable message summarising the outcome of the receipt
          example: Received 4 of 12 units; purchase order partially received
        lines:
          type: array
          description: Per-line detail of remaining open quantities after the receipt
          items:
            $ref: '#/components/schemas/ReceivePurchaseOrderLineDetail'
      required:
      - poId
      - status
    ApprovePurchaseOrderRequest:
      type: object
      description: Request to approve a purchase order, optionally capturing approval notes
      properties:
        approvalNotes:
          type: string
          description: Free-text notes recorded by the approver explaining the approval decision
          example: Approved within budget for Q1 restock
    CreatePickListRequest:
