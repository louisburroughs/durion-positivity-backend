    post:
      tags:
      - ASN
      summary: Create Goods Receipt
      description: 'Records a goods receipt against a purchase order, posting GOODS_RECEIPT ledger entries that increase on-hand stock at the receiving location.

        Use this tool when goods physically arrive and should enter stock in one posting; do not use createAsn, which only declares an expected shipment, and do not use the session-based flow of createReceivingSession and receiveItemsIntoStaging.

        Preconditions: the purchase order must exist and be APPROVED or PARTIALLY_RECEIVED, the ASN when supplied must exist, and the receipt total may not exceed the purchase order''s open balance unless the caller holds inventory:goods_receipt:override.

        Required inputs: poId (UUID), locationId (UUID) and lines each naming sku and unitCostMinor plus either a whole-number quantityReceived in base UoM or the documentUom/documentQuantity pair; lotNumber is mandatory for LOT-tracked SKUs, serialNumbers must enumerate exactly the received quantity for SERIAL-tracked SKUs, and asnId is optional.

        Emits an INVENTORY_GOODS_RECEIPT_CREATE event, decrements the purchase order''s open balance, moves the PO to PARTIALLY_RECEIVED or FULLY_RECEIVED, and updates the linked ASN''s received quantities and status.

        Returns 403 when the receipt exceeds the open balance without the override authority, 404 when the ASN or a referenced PO line cannot be resolved, 400 when the purchase order is unknown or not receivable, and 422 when a UoM has no conversion path, a LOT-tracked line omits lotNumber, or a serialized line''s serial count mismatches the received quantity.

        '
