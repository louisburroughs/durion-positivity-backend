      summary: Query inventory availability by SKU and location
      description: 'Returns a single aggregated availability view for a SKU: on-hand, allocated, available-to-promise, the derived unit of measure and the forecast quantities incomingQty, outgoingQty and projectedAvailable.

        Use this tool to check whether quantity can be promised, for example before createOrUpdateReservation; use getAvailabilityByProduct instead for a per-location breakdown, and listAvailabilityBySku only when a list-shaped response is required.

        Preconditions: the SKU must have at least one stock-summary row; expired ACTIVE lots stay counted in on-hand but are subtracted from ATP.

        Required inputs: productSku (string); locationId and storageLocationId (UUIDs) optionally narrow the scope (storageLocationId wins when both are given), sourceType (WAREHOUSE, SUPPLIER or TRANSIT) selects the lookup strategy, and horizon (ISO-8601 instant) bounds the forecast quantities; forecast supply is keyed by site, so a storage location is resolved to its parent site for the forecast fields.

        No events are emitted and no state changes; ATP is on-hand minus hard allocations minus expired ACTIVE lot on-hand — soft reservations are not subtracted (ADR-0001).

        Returns 404 when the SKU has no stock-summary rows, and 400 when locationId is combined with a non-WAREHOUSE sourceType (INVALID_PARAM_COMBINATION).

        '
      operationId: getAvailabilityBySku
      parameters:
      - name: productSku
        in: query
        description: Product SKU
        required: true
        schema:
          type: string
      - name: locationId
        in: query
        description: Location identifier
        required: false
        schema:
          type: string
          format: uuid
      - name: storageLocationId
        in: query
        description: Storage location identifier (optional; narrows to sub-location)
        required: false
        schema:
          type: string
          format: uuid
      - name: sourceType
        in: query
        description: Inventory lookup strategy. WAREHOUSE = from physical location stock, SUPPLIER = from supplier lead time, TRANSIT = from in-transit supply. When sourceType is WAREHOUSE, locationId narrows to a specific location.
        required: false
        schema:
          type: string
          enum:
          - WAREHOUSE
          - SUPPLIER
          - TRANSIT
      - name: horizon
        in: query
        description: Optional forecast horizon (ISO-8601 instant) bounding incomingQty/outgoingQty; documents without an expected date are excluded from horizon-bounded results.
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Availability view returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityView'
        '400':
          description: Invalid request parameters or locationId provided without sourceType=WAREHOUSE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: User lacks required read permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Product SKU or location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
