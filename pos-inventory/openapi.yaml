    SupplierStockHintView:
      type: object
      description: 'A vendor''s reported availability for one article: an advisory hint carrying its own age, never owned stock and never an ATP figure.'
      properties:
        vendorProfileId:
          type: string
          format: uuid
          description: Vendor profile that reported this. Hints are never aggregated across vendors — each vendor's statement stands on its own.
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
        supplierRef:
          type: string
          description: Vendor alias at fetch time; descriptive only.
          example: ediwheel-b21
        identityKind:
          type: string
          description: Which identifier this hint is keyed on.
          enum:
          - EAN
          - BUYER_ARTICLE
          - SUPPLIER_ARTICLE
        identityValue:
          type: string
          description: Value of the keyed identifier, as the vendor stated it.
        articleEan:
          type: string
          description: EAN/GTIN as the vendor stated it.
        supplierArticleCode:
          type: string
          description: The vendor's own article code.
        buyersArticleId:
          type: string
          description: Our article code as the vendor holds it.
        description:
          type: string
          description: Vendor article description.
        resolvedProductId:
          type: string
          format: uuid
          description: Catalog product this article resolved to; null while the article is unresolved, which is a normal state and not an error.
        quantity:
          type: integer
          format: int32
          description: Quantity the vendor reported. Null when the vendor stated none or when the hint is too stale to repeat — read `availability` to tell those apart. A value of 0 is the vendor explicitly reporting no stock.
          example: 12
        availability:
          type: string
          description: How to read this hint.
          enum:
          - REPORTED
          - QUANTITY_NOT_STATED
          - STALE_UNKNOWN
        snapshotAsOf:
          type: string
          format: date-time
          description: The vendor's own statement of when its snapshot was true. Null when the vendor stated no time; judge freshness on this whenever it is present.
        asOfSource:
          type: string
          description: Whether the age shown is the vendor's figure (VENDOR) or only our fetch clock (FETCH), which bounds the age from below without establishing it.
          enum:
          - VENDOR
          - FETCH
        fetchedAt:
          type: string
          format: date-time
          description: When we asked the vendor.
        snapshotComplete:
          type: boolean
          description: False when the snapshot this hint came from never arrived in full. The hint itself is still what the vendor said; the snapshot around it is incomplete.
        chunksApplied:
          type: integer
          format: int32
          description: Chunks of the source snapshot applied so far.
        chunkCount:
          type: integer
          format: int32
          description: Chunks the source snapshot was split into.
      required:
      - asOfSource
      - availability
      - chunkCount
      - chunksApplied
      - fetchedAt
      - identityKind
      - identityValue
      - snapshotComplete
      - vendorProfileId
    Pageable:
