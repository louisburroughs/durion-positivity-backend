          type: string
          format: uuid
          description: Storage location identifier
        items:
          type: array
          description: Stock items currently on hand at the location
          items:
            $ref: '#/components/schemas/LocationInventoryItem'
      required:
      - items
      - locationId
    LocationInventoryInquiryResponse:
      type: object
      description: Inventory summary for a storage location
      properties:
        locationId:
          type: string
          format: uuid
          description: Storage location identifier
        onHandQuantity:
          type: integer
          format: int64
          description: Current on-hand quantity across all stock items at the location
          example: 12
        availableToPromiseQuantity:
          type: integer
          format: int64
          description: 'Quantity available to promise after pending allocations. Note: reservation events are not yet factored in. Null for as-of (historical) requests: historical allocation state is not reliably reconstructable from ATP-neutral ledger events, so as-of responses carry on-hand only.'
          example: 8
      required:
      - locationId
      - onHandQuantity
    LedgerPage:
      type: object
      description: A single page of ledger entries with an optional cursor to the next page
      properties:
        entries:
          type: array
          description: Ledger entries contained in this page
        nextPageToken:
          type: string
          description: Opaque cursor for the next page; null when there are no more entries
          example: eyJvZmZzZXQiOjUwfQ==
      required:
      - entries
    InventoryLedgerEntryDto:
      type: object
      description: Inventory ledger entry record capturing a single stock movement or allocation event
      properties:
        ledgerEntryId:
          type: string
          format: uuid
          description: Unique identifier of the ledger entry
          example: 01960003-0000-7000-8000-000000000001
        stockItemId:
          type: string
          description: Identifier of the stock item the entry applies to
          example: SKU-10042
        adjustmentId:
          type: string
          format: uuid
          description: Identifier of the adjustment that produced this entry, if any
          example: 01960003-0000-7000-8000-000000000002
        eventType:
          type: string
          description: Type of inventory ledger event recorded
          enum:
          - GOODS_RECEIPT
          - TRANSFER_IN
          - PUTAWAY
          - RETURN_TO_STOCK
          - ADJUSTMENT_IN
          - COUNT_VARIANCE_IN
          - GOODS_ISSUE
          - WORKORDER_CONSUMPTION
          - TRANSFER_OUT
          - SCRAP_OUT
          - ADJUSTMENT_OUT
          - COUNT_VARIANCE_OUT
          - ADJUST_CYCLE_COUNT
          - RESERVATION_CREATED
          - RESERVATION_RELEASED
          - ALLOCATION_CREATED
          - ALLOCATION_RELEASED
          - BACKORDER_CREATED
          - BACKORDER_RESOLVED
          - PICK_TASK_CREATED
          - PICK_TASK_COMPLETED
          example: GOODS_RECEIPT
        changeInQuantity:
          type: integer
          format: int32
          description: Signed change in quantity applied by this entry (positive inbound, negative outbound)
          example: 12
        quantityAfter:
          type: integer
          format: int32
          description: Running quantity after this entry was applied
          example: 120
        unitCost:
          type: number
          description: Unit cost associated with this movement, if recorded
          example: 4.5
        transactionUserId:
          type: string
          description: Identifier of the user who initiated the transaction
          example: 01960003-0000-7000-8000-000000000003
        timestamp:
          type: string
          format: date-time
          description: Business timestamp of the inventory event
          example: 2026-01-15 09:30:00+00:00
        locationId:
          type: string
          format: uuid
          description: Location the entry applies to
          example: 01960003-0000-7000-8000-000000000004
        fromLocationId:
          type: string
          format: uuid
          description: Source location for transfer events
          example: 01960003-0000-7000-8000-000000000005
        toLocationId:
          type: string
          format: uuid
          description: Destination location for transfer events
          example: 01960003-0000-7000-8000-000000000006
        reasonCode:
          type: string
          description: Reason code explaining the entry
          example: CYCLE_COUNT
        sourceTransactionId:
          type: string
          description: Identifier of the originating source transaction
          example: 01960003-0000-7000-8000-000000000007
        unitOfMeasure:
          type: string
          description: Unit of measure code for the quantities (e.g. EACH, KG)
          example: EACH
        notes:
          type: string
          description: Free-text notes attached to the entry
          example: Variance corrected after recount
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the entry record was created
          example: 2026-01-15 09:30:00+00:00
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the entry record was last updated
          example: 2026-01-15 09:35:00+00:00
      required:
      - changeInQuantity
      - eventType
      - ledgerEntryId
      - quantityAfter
      - stockItemId
      - timestamp
    CycleCountTaskResponse:
      type: object
      description: A cycle count task describing an item to be counted at a location and its current state
      properties:
        taskId:
          type: string
          format: uuid
          description: Unique identifier of the cycle count task
          example: 01960003-0000-7000-8000-000000000001
        binLocation:
          type: string
          description: Bin or location code where the item is stored
          example: LOC-001
        itemSku:
          type: string
          description: Stock keeping unit of the item to count
          example: SKU-10042
        itemDescription:
          type: string
          description: Human-readable description of the item
          example: Stainless steel water bottle, 750ml
        expectedQuantity:
          type: integer
          format: int32
          description: Quantity expected on hand for the item
          example: 15
        auditorId:
          type: string
          description: Identifier of the auditor assigned to the task, if assigned
          example: auditor-10042
        status:
          type: string
          description: Current status of the cycle count task
          enum:
          - ASSIGNED
          - COUNTED_PENDING_REVIEW
          - CONFLICT
          - REQUIRES_INVESTIGATION
          - APPROVED
          - REJECTED
          example: ASSIGNED
        latestCountEntryId:
          type: string
          format: uuid
          description: Identifier of the most recent count entry recorded for the task, if any
          example: 01960003-0000-7000-8000-000000000002
        countEntriesCount:
          type: integer
          format: int32
          description: Total number of count entries recorded for the task
          example: 2
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the task was created
          example: 2026-01-15 09:30:00+00:00
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the task was last updated
          example: 2026-01-15 10:05:00+00:00
      required:
      - binLocation
      - countEntriesCount
      - createdAt
      - expectedQuantity
      - itemSku
      - status
      - taskId
      - updatedAt
    InterferingMovementResponse:
      type: object
      description: Ledger movement recorded between cycle-count task creation and now for the task's SKU/location
      properties:
        ledgerEntryId:
          type: string
          format: uuid
          description: Unique identifier of the ledger entry
          example: 01960003-0000-7000-8000-000000000001
        eventType:
          type: string
          description: Type of inventory ledger event recorded
          enum:
          - GOODS_RECEIPT
          - TRANSFER_IN
          - PUTAWAY
          - RETURN_TO_STOCK
          - ADJUSTMENT_IN
          - COUNT_VARIANCE_IN
          - GOODS_ISSUE
          - WORKORDER_CONSUMPTION
          - TRANSFER_OUT
          - SCRAP_OUT
          - ADJUSTMENT_OUT
          - COUNT_VARIANCE_OUT
          - ADJUST_CYCLE_COUNT
          - RESERVATION_CREATED
          - RESERVATION_RELEASED
          - ALLOCATION_CREATED
          - ALLOCATION_RELEASED
          - BACKORDER_CREATED
          - BACKORDER_RESOLVED
          - PICK_TASK_CREATED
          - PICK_TASK_COMPLETED
          example: GOODS_ISSUE
        changeInQuantity:
          type: integer
          format: int32
          description: Signed change in quantity applied by this entry (positive inbound, negative outbound)
          example: -3
        quantityAfter:
          type: integer
          format: int32
          description: Running quantity after this entry was applied
          example: 7
        locationId:
          type: string
          format: uuid
          description: Location the entry applies to
          example: 01960003-0000-7000-8000-000000000004
        timestamp:
          type: string
          format: date-time
          description: Business timestamp of the inventory event
          example: 2026-01-15 09:30:00+00:00
        transactionUserId:
          type: string
          description: Identifier of the user who initiated the transaction
          example: user-10042
        notes:
          type: string
          description: Free-text notes recorded with the entry
      required:
      - changeInQuantity
      - eventType
      - ledgerEntryId
      - timestamp
    CountEntryResponse:
      type: object
      description: A single recorded count entry in a cycle count task's history
      properties:
        countEntryId:
          type: string
          format: uuid
          description: Unique identifier of the count entry
          example: 01960003-0000-7000-8000-000000000001
        cycleCountTaskId:
          type: string
          format: uuid
          description: Identifier of the cycle count task this entry belongs to
          example: 01960003-0000-7000-8000-000000000002
        auditorId:
          type: string
          description: Identifier of the auditor who recorded the count
          example: auditor-10042
        actualQuantity:
          type: integer
          format: int32
          description: Quantity physically counted by the auditor
          example: 12
        expectedQuantity:
          type: integer
          format: int32
          description: Quantity expected on hand at the time of the count
          example: 15
        variance:
          type: integer
          format: int32
          description: Difference between counted and expected quantity (actual minus expected)
          example: -3
        recountSequenceNumber:
          type: integer
          format: int32
          description: Sequence number of this count within the recount chain; 0 for the initial count
          example: 1
        recountOfCountEntryId:
          type: string
          format: uuid
          description: Identifier of the count entry this entry is a recount of, if any
          example: 01960003-0000-7000-8000-000000000003
        countedAt:
          type: string
          format: date-time
          description: Timestamp when the count was recorded
          example: 2026-01-15 09:30:00+00:00
        recount:
          type: boolean
          description: Whether this entry is a recount of a prior count
          example: false
      required:
      - actualQuantity
      - auditorId
      - countEntryId
      - countedAt
      - cycleCountTaskId
      - expectedQuantity
      - recount
      - recountSequenceNumber
      - variance
    BackorderResponse:
      type: object
      description: 'A backorder: unfulfilled workorder-line demand held open until availability covers it'
      properties:
        backorderId:
          type: string
          format: uuid
          description: Backorder record identifier
        workorderLineId:
          type: string
          format: uuid
          description: Workorder line whose demand was short
        sku:
          type: string
          description: SKU / stock-item identifier that was short
        locationId:
          type: string
          format: uuid
          description: Site the demand is short at
        quantityShort:
          type: integer
          format: int32
          description: Quantity that could not be fulfilled (positive)
        status:
          type: string
          description: 'Lifecycle status: OPEN, RESOLVED, or CANCELLED'
          enum:
          - OPEN
          - RESOLVED
          - CANCELLED
        resolutionSource:
          type: string
          description: What drove resolution; null while OPEN or CANCELLED
          enum:
          - AVAILABILITY
          - REPLENISHMENT_RECEIPT
          - MANUAL
        createdBy:
          type: string
          description: Actor that opened the backorder
        createdAt:
          type: string
          format: date-time
          description: When the backorder was opened
        updatedAt:
          type: string
          format: date-time
          description: When the backorder was last updated
        resolvedAt:
          type: string
          format: date-time
          description: When the backorder was resolved; null otherwise
    AvailabilityView:
      type: object
      description: Read-only view of on-hand and available-to-promise quantities for a product at a specific location scope
      properties:
        productSku:
          type: string
          description: Stock-keeping unit identifier of the product
          example: SKU-10042
        locationId:
          type: string
          format: uuid
          description: Location identifier for the scope of this availability view
          example: 01960003-0000-7000-8000-000000000001
        storageLocationId:
          type: string
          format: uuid
          description: Optional storage sub-location identifier; null when scoped to the full location
          example: 01960003-0000-7000-8000-000000000002
        onHandQuantity:
          type: integer
          format: int32
          description: Net on-hand quantity (sum of affectsOnHand ledger entries)
          example: 120
        allocatedQuantity:
          type: integer
          format: int32
          description: Net allocated quantity (ALLOCATION_CREATED minus ALLOCATION_RELEASED)
          example: 30
        availableToPromiseQuantity:
          type: integer
          format: int32
          description: Available-to-promise quantity, equal to onHandQuantity minus allocatedQuantity
          example: 90
        unitOfMeasure:
          type: string
          description: Unit of measure code for the quantities (e.g. EACH, KG)
          example: EACH
        incomingQty:
          type: integer
          format: int64
          description: 'Open expected supply: approved purchase-order open line quantity plus un-received ASN remainder. Site-level when a location scope is given. Bounded by the ''horizon'' query parameter when present (documents without an expected date are excluded from horizon-bounded results). Omitted for as-of (historical) requests.'
          example: 25
        outgoingQty:
          type: integer
          format: int64
          description: 'Open expected demand not yet decremented from on-hand: unallocated reservation remainders plus released-not-picked pick-task remainders. Reservation demand carries no site and is included in every scope. Omitted for as-of (historical) requests.'
          example: 10
        projectedAvailable:
          type: integer
          format: int64
          description: 'Projected availability: onHandQuantity + incomingQty - outgoingQty. Omitted for as-of (historical) requests.'
          example: 135
      required:
      - allocatedQuantity
      - availableToPromiseQuantity
      - locationId
      - onHandQuantity
      - productSku
      - unitOfMeasure
    LocationAvailabilityDto:
      type: object
      description: Per-location availability projection for inventory availability queries
      properties:
        locationId:
          type: string
          format: uuid
          description: Identifier of the location
          example: 01960003-0000-7000-8000-000000000001
        locationName:
          type: string
          description: Human-readable name of the location
          example: Main Warehouse
        onHandQuantity:
          type: integer
          format: int32
          description: On-hand quantity at the location
          example: 120
        availableToPromiseQuantity:
          type: integer
          format: int32
          description: 'Available-to-promise quantity at the location. Null for as-of (historical) requests: historical allocation state is not reliably reconstructable from ATP-neutral ledger events, so as-of responses carry on-hand only.'
          example: 90
        incomingQty:
          type: integer
          format: int64
          description: 'Open expected supply at the site: approved purchase-order open line quantity plus un-received ASN remainder. Bounded by the ''horizon'' query parameter when present (documents without an expected date are excluded from horizon-bounded results). Omitted for as-of requests.'
          example: 25
        outgoingQty:
          type: integer
          format: int64
          description: 'Open expected demand not yet decremented from on-hand: unallocated reservation remainders plus released-not-picked pick-task remainders. Reservation demand carries no site and is included in every site row. Omitted for as-of requests.'
          example: 10
        projectedAvailable:
          type: integer
          format: int64
          description: 'Projected availability: onHandQuantity + incomingQty - outgoingQty (Odoo virtual_available). Omitted for as-of requests.'
          example: 135
      required:
      - locationId
      - locationName
      - onHandQuantity
    LeadTimeView:
      type: object
      description: Lead-time view returned by inventory for product detail aggregation
      properties:
        productId:
          type: string
          format: uuid
          description: Product identifier
          example: 01960003-0000-7000-8000-000000000001
        locationId:
          type: string
          format: uuid
          description: Location identifier
          example: 01960003-0000-7000-8000-000000000002
        source:
          type: string
          description: Source of lead-time data
          example: INVENTORY
        minDays:
          type: integer
          format: int32
          description: Minimum lead-time in days
          example: 2
        maxDays:
          type: integer
          format: int32
          description: Maximum lead-time in days
          example: 5
        displayText:
          type: string
          description: Human-readable lead-time text
          example: 2-5 business days
        confidence:
          type: string
          description: Confidence level for this estimate
          example: HIGH
        asOf:
          type: string
          format: date-time
          description: Timestamp when lead-time data was last refreshed
          example: 2026-01-15 09:30:00+00:00
      required:
      - locationId
      - productId
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
