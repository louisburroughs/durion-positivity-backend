  /v1/inventory/availability/{productId}:
    get:
      tags:
      - Inventory Availability
      summary: Query inventory availability
      description: 'Returns per-location availability for a product, including forecast quantities (incomingQty, outgoingQty, projectedAvailable) computed from open purchase orders, ASNs, reservations, and released pick tasks (odoo-parity A2). With ''asOf'', returns historical on-hand per location computed by direct ledger aggregation (timestamp <= asOf) instead: availableToPromiseQuantity and the forecast fields are null, because historical allocation state is not reliably reconstructable from ATP-neutral ledger events. As-of requests additionally require the ''inventory:ledger:view'' authority (history exposure) and reject future instants with 422; ''asOf'' cannot be combined with ''horizon''.'
      operationId: getInventoryAvailability
      parameters:
      - name: productId
        in: path
        description: Product identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: horizon
        in: query
        description: Optional forecast horizon (ISO-8601 instant). Bounds incomingQty to supply expected on or before this instant and outgoingQty to reservations due by it; documents without an expected date are excluded from horizon-bounded results.
        required: false
        schema:
          type: string
          format: date-time
      - name: asOf
        in: query
        description: Optional historical instant (ISO-8601). Returns on-hand as of this instant by direct ledger aggregation; ATP and forecast fields are null. Requires 'inventory:ledger:view'; future instants are rejected (422). Cannot be combined with 'horizon'.
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Availability returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationAvailabilityDto'
        '400':
          description: Invalid product identifier
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationAvailabilityDto'
      security:
      - bearerAuth:
        - inventory:on_hand:view
      x-required-permissions:
      - inventory:on_hand:view
    post:
      tags:
      - Inventory Availability
      summary: Update inventory availability
      description: Not implemented by design. Availability is derived from ledger events and is read-only via this endpoint. Use POST /v1/inventory/stock-movements or POST /v1/inventory/adjustments for inventory changes.
      operationId: updateInventoryAvailability
      parameters:
      - name: productId
        in: path
        description: Product identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Availability updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryAvailabilityResponse'
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryAvailabilityResponse'
      security:
      - bearerAuth:
        - inventory:adjustment:create
        - inventory:adjustment:approve
      x-required-permissions:
      - inventory:adjustment:create
      - inventory:adjustment:approve
