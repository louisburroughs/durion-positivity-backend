  /v1/inventory/receiving/sessions/{sessionId}/lines/{lineId}/cross-dock:
    post:
      description: 'Cross-docks received quantity from a receiving session line directly to a workorder line, posting paired GOODS_RECEIPT and GOODS_ISSUE ledger entries atomically at the cross-dock location so on-hand nets to zero.

        Use this tool when arrived stock should bypass staging and go straight to the demanding workorder; do not use receiveItemsIntoStaging, which books the quantity into the staging location for later putaway.

        Preconditions: the session and line must exist, the workorder must not be COMPLETED, CANCELLED or CLOSED, the cumulative received quantity may not exceed the line''s expected quantity, and the line''s product must match the workorder line''s demanded product unless the caller holds inventory:override:part-match.

        Required inputs: sessionId and lineId (UUIDv7) path parameters plus workorderId, workorderLineId and a positive quantity; lotNumber is mandatory for LOT-tracked products, falling back to the lot already keyed on the line, and notes is optional.

        Emits an INVENTORY_RECEIVING_CROSSDOCK event, stamps the workorder reference on the line, updates the line to RECEIVED, RECEIVED_SHORT or RECEIVED_OVER, and completes the session when every line is settled.

        Returns 404 when the session or line is not found, 400 when the workorder is closed or the quantity exceeds the expected quantity, 403 when the product mismatches the workorder demand without the override permission, and 422 when a LOT-tracked product resolves no lot number.

        '
      operationId: crossDockReceivingLine
      parameters:
      - description: Receiving session identifier
        in: path
        name: sessionId
        required: true
        schema:
          format: uuid
          type: string
      - description: Receiving line identifier
        in: path
        name: lineId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Cross-dock to urgent workorder:
                description: Cross-dock to urgent workorder
                value:
                  lotNumber: LOT-2026-0042
                  notes: Cross-docked at dock door 3
                  quantity: 12
                  workorderId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a07
                  workorderLineId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a08
            schema:
              $ref: '#/components/schemas/CrossDockRequest'
        description: Workorder destination and quantity for the cross-docked stock.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrossDockResponse'
          description: Cross-dock completed
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request or closed workorder
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: User lacks required authority or part-match override permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Receiving session or line not found
      security:
      - bearerAuth:
        - inventory:receiving:complete
        - inventory:issue:parts
      summary: Cross-Dock Receiving Line To Workorder
      tags:
      - Receiving
      x-required-permissions:
      - inventory:receiving:complete
      - inventory:issue:parts
  /v1/inventory/receiving/sessions/{sessionId}/receive:
    post:
      description: 'Records actual received quantities for receiving session lines, posting a GOODS_RECEIPT ledger entry into the staging location per line and a SHORTAGE or OVERAGE variance record for every expected-vs-received mismatch.

        Use this tool to book arrived stock into an open session; do not use crossDockReceivingLine, which routes a line straight to a workorder instead of staging, and do not use createGoodsReceipt, the sessionless PO receipt.

        Preconditions: the receiving session must exist; lines naming a lineId not present in the session are skipped rather than failing.

        Required inputs: sessionId (UUIDv7) path parameter and lines (non-empty), each naming lineId plus either a whole-number receivedQuantity in base UoM or the documentUom/documentQuantity pair; lotNumber is mandatory for LOT-tracked products (expirationDate optionally stamps a new lot) and serialNumbers must enumerate exactly the received quantity for SERIAL-tracked products.

        Emits an INVENTORY_RECEIVING_SESSION_COMPLETE event, marks each line RECEIVED, RECEIVED_SHORT or RECEIVED_OVER, and moves the session to COMPLETED when every line is settled or IN_PROGRESS otherwise.

        Returns 404 when the receiving session does not exist, 400 when a quantity is missing or not a whole number, and 422 when a documentUom has no conversion path, a LOT-tracked line omits lotNumber, or a serialized line''s serial count mismatches the received quantity.

        '
      operationId: receiveItemsIntoStaging
      parameters:
      - description: Receiving session identifier
        in: path
        name: sessionId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Lot-tracked line received in full:
                description: Lot-tracked line received in full
                value:
                  lines:
                  - expirationDate: 2027-01-31
                    lineId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a06
                    lotNumber: LOT-2026-0042
                    receivedQuantity: 8
            schema:
              $ref: '#/components/schemas/ReceiveItemsRequest'
        description: Actual received quantities, lot and serial data for the session lines.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiveItemsResponse'
          description: Items received successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Validation failure
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: User lacks required receiving:complete authority
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Receiving session not found
      security:
      - bearerAuth:
        - inventory:receiving:complete
      summary: Receive Items Into Staging
      tags:
      - Receiving
      x-required-permissions:
      - inventory:receiving:complete
  /v1/inventory/replenishment/needs:
    get:
      description: 'Reports, for every active non-snoozed replenishment policy, the projected availability at its lead-time horizon, whether a scan would trigger, the multiple-rounded suggested quantity and the projected stock-out deadline.

        Use this tool for ops review before materialising work; do not use runReplenishmentScan, which actually creates or refreshes tasks, and use listReplenishmentTasks instead to see tasks that already exist.

        Preconditions: none; snoozed and inactive policies are silently excluded.

        Required inputs: none; there is no request body or filtering.

        Emits an INVENTORY_REPLENISHMENT_NEEDS_LIST event; the report itself never creates or refreshes tasks, and it shares the batch scan''s math so it matches what a scan run at the same instant would do.

        Returns 200 with an empty array when no policies qualify, so an empty result is not an error condition.

        '
      operationId: listReplenishmentNeeds
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ReplenishmentNeedResponse'
                type: array
          description: Replenishment needs returned
      security:
      - bearerAuth:
        - inventory:on_hand:view
      summary: Replenishment needs report
      tags:
      - Replenishment
      x-required-permissions:
      - inventory:on_hand:view
  /v1/inventory/replenishment/policies:
    get:
      description: 'Lists configured replenishment policies as a page, optionally filtered to one location.

        Use this tool to discover a policyId before updating or snoozing a policy; use listReplenishmentNeeds instead to see which policies would currently trigger.

        Preconditions: none.

        Required inputs: none; locationId is an optional query filter and the standard page/size parameters default to a page size of 20.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 with an empty page when nothing is configured, so an empty result is not an error condition.

        '
      operationId: listReplenishmentPolicies
      parameters:
      - description: Location identifier
        in: query
        name: locationId
        required: false
        schema:
          format: uuid
          type: string
      - in: query
        name: pageable
        required: true
        schema:
          $ref: '#/components/schemas/Pageable'
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Page of replenishment policies
                type: string
          description: Replenishment policies returned (paged)
      security:
      - bearerAuth:
        - inventory:on_hand:view
      summary: List replenishment policies
      tags:
      - Replenishment
      x-required-permissions:
      - inventory:on_hand:view
    post:
      description: 'Creates a min/max replenishment policy that drives orderpoint evaluation for one SKU at one location.

        Use this tool to define when a pick face should be restocked; do not use updateReplenishmentPolicy, which retunes a policy that already exists.

        Preconditions: none checked against existing state; a duplicate policy for the same SKU and location is not rejected here.

        Required inputs: locationId (UUID), itemSKU, and minimumQuantity (at least 0) strictly less than maximumQuantity (at least 1); orderMultiple defaults to the vendor-feed pack size when one greater than 1 is known for a product-UUID SKU, preferredSourceType defaults to EITHER and active defaults to true.

        Emits an INVENTORY_REPLENISHMENT_POLICY_CREATE event; no task is created until a scan or stock event triggers the policy.

        Returns 400 when minimumQuantity is not less than maximumQuantity or a required field is missing.

        '
      operationId: createReplenishmentPolicy
      requestBody:
        content:
          application/json:
            examples:
              Pick-face min/max policy:
                description: Pick-face min/max policy
                value:
                  active: true
                  itemSKU: SKU-10042
                  leadTimeDaysOverride: 3
                  locationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a01
                  maximumQuantity: 50
                  minimumQuantity: 5
                  orderMultiple: 6
                  preferredSourceType: EITHER
            schema:
              $ref: '#/components/schemas/CreateReplenishmentPolicyRequest'
        description: Min/max thresholds and tuning fields for one SKU at one location.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplenishmentPolicyResponse'
          description: Replenishment policy created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplenishmentPolicyResponse'
          description: Validation failure
      security:
      - bearerAuth:
        - inventory:replenishment:manage
      summary: Create replenishment policy
      tags:
      - Replenishment
      x-required-permissions:
      - inventory:replenishment:manage
  /v1/inventory/replenishment/policies/{policyId}:
    put:
      description: 'Replaces every tunable field of a replenishment policy: min/max thresholds, order multiple, lead-time override, preferred source type and active flag.

        Use this tool to retune an existing policy; do not use snoozeReplenishmentPolicy, which manages the snooze state this endpoint cannot touch, and do not use createReplenishmentPolicy, which defines a new policy.

        Preconditions: the policy must exist; its location and SKU identity are immutable here.

        Required inputs: policyId (UUID) path parameter plus minimumQuantity (at least 0) strictly less than maximumQuantity (at least 1); omitted optional fields are cleared or reset — orderMultiple and leadTimeDaysOverride to none, preferredSourceType to EITHER, active to true.

        Emits an INVENTORY_REPLENISHMENT_POLICY_UPDATE event; the next scan or stock event evaluates the new thresholds.

        Returns 404 when the policy does not exist, and 400 when minimumQuantity is not less than maximumQuantity.

        '
      operationId: updateReplenishmentPolicy
      parameters:
      - description: Replenishment policy identifier
        in: path
        name: policyId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Retuned thresholds:
                description: Retuned thresholds
                value:
                  active: true
                  maximumQuantity: 60
                  minimumQuantity: 8
                  orderMultiple: 6
                  preferredSourceType: PURCHASE
            schema:
              $ref: '#/components/schemas/UpdateReplenishmentPolicyRequest'
        description: Replacement values for every tunable field of the policy; omitted optional fields are cleared or reset to defaults.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplenishmentPolicyResponse'
          description: Replenishment policy updated
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplenishmentPolicyResponse'
          description: Validation failure
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplenishmentPolicyResponse'
          description: Policy not found
      security:
      - bearerAuth:
        - inventory:replenishment:manage
      summary: Update replenishment policy
      tags:
      - Replenishment
      x-required-permissions:
      - inventory:replenishment:manage
  /v1/inventory/replenishment/policies/{policyId}/snooze:
    post:
      description: 'Snoozes a replenishment policy so scan, event and needs evaluation all skip it until the given future instant, or clears an existing snooze.

        Use this tool to silence a policy temporarily; do not use updateReplenishmentPolicy, which cannot touch snooze state, and prefer snoozing over clearing the active flag when the pause should expire on its own.

        Preconditions: the policy must exist; a non-null snoozedUntil must lie in the future.

        Required inputs: policyId (UUID) path parameter and a body whose optional snoozedUntil instant sets the snooze; a null snoozedUntil clears it — there is no separate unsnooze endpoint.

        Emits an INVENTORY_REPLENISHMENT_POLICY_SNOOZE event; the policy is excluded from evaluation until the instant passes.

        Returns 404 when the policy does not exist, and 422 with REPLENISHMENT_SNOOZE_NOT_IN_FUTURE when snoozedUntil is not in the future.

        '
      operationId: snoozeReplenishmentPolicy
      parameters:
      - description: Replenishment policy identifier
        in: path
        name: policyId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Snooze for one week:
                description: Snooze for one week
                value:
                  snoozedUntil: 2026-08-20 00:00:00+00:00
            schema:
              $ref: '#/components/schemas/SnoozeReplenishmentPolicyRequest'
        description: Snooze instant to set, or a null snoozedUntil to clear the snooze.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplenishmentPolicyResponse'
          description: Snooze state updated
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplenishmentPolicyResponse'
          description: Policy not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplenishmentPolicyResponse'
          description: snoozedUntil is not in the future
      security:
      - bearerAuth:
        - inventory:replenishment:manage
      summary: Snooze or unsnooze a replenishment policy
      tags:
      - Replenishment
      x-required-permissions:
      - inventory:replenishment:manage
  /v1/inventory/replenishment/scan:
    post:
      description: 'Runs the batch replenishment scan, evaluating every active non-snoozed policy against its lead-time forecast and creating or refreshing replenishment tasks for triggered pick faces.

        Use this tool to materialise restock work; use listReplenishmentNeeds instead for a side-effect-free preview of what the scan would do.

        Preconditions: none; policies preferring PURCHASE produce purchase suggestions instead of tasks, and a need already covered by an open source transfer order or an open task is not duplicated.

        Required inputs: none; there is no request body.

        Emits an INVENTORY_REPLENISHMENT_SCAN_RUN event and creates or refreshes tasks and purchase suggestions; the run is idempotent per policy and UTC day, and a triggered policy whose computed quantity is zero creates nothing.

        Returns 200 with a summary of policies evaluated, tasks created and refreshed, suggestions created and refreshed, and policies skipped.

        '
      operationId: runReplenishmentScan
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplenishmentScanResultResponse'
