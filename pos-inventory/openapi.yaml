openapi: 3.1.0
info:
  title: Positivity Inventory API
  description: "API documentation for the Inventory service, accessible via the API\
    \ Gateway."
  contact:
    name: Durion Team
    email: louis.burroughs@gmail.com
  version: v1
servers:
- url: http://localhost:8086
  description: Generated server url
tags:
- name: Inventory Management
  description: Operations related to inventory location management
- name: Cycle Count Plans
  description: Cycle count plan management endpoints
- name: Picking Lists
  description: Picking list command endpoints
- name: Putaway
  description: Putaway task generation and claiming endpoints
- name: Inventory Availability
  description: Inventory availability read/write endpoints
- name: Cycle Count API
  description: API for cycle count operations and variance tracking
- name: Replenishment
  description: Replenishment task and policy endpoints
- name: Cycle Count Query
  description: Query endpoints for cycle count tasks and history
- name: Putaway
  description: Putaway task execution endpoints
- name: Cycle Count Adjustments
  description: Manage inventory adjustments from cycle counts
- name: Inventory Sites
  description: Site inventory configuration endpoints. Inventory Sites represent physical
    locations that hold inventory.
- name: Stock Movements
  description: Inventory ledger movement recording and adjustment endpoints
- name: Cycle Count Operations
  description: Cycle count submission and recount operations
paths:
  /v1/inventory/sites/{siteId}/defaultLocations:
    get:
      tags:
      - Inventory Sites
      summary: Get site default locations
      description: Returns configured default locations for a site. Stub implementation.
      operationId: getSiteDefaultLocations
      parameters:
      - name: siteId
        in: path
        description: Site identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "501":
          description: Not implemented
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: string
                  format: uuid
        "200":
          description: Default locations returned
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
    put:
      tags:
      - Inventory Sites
      summary: Replace site default locations
      description: Replaces the configured default locations for a site. Stub implementation.
      operationId: putSiteDefaultLocations
      parameters:
      - name: siteId
        in: path
        description: Site identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uuid
      responses:
        "200":
          description: Default locations replaced
        "501":
          description: Not implemented
  /v1/inventory/stock-movements:
    post:
      tags:
      - Stock Movements
      summary: Record a stock movement
      description: "Records a RECEIVE, PUT_AWAY, PICK, ISSUE, RETURN, or TRANSFER\
        \ movement in the inventory ledger."
      operationId: recordMovement
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordMovementRequest"
        required: true
      responses:
        "400":
          description: Validation failure
        "422":
          description: Insufficient stock
        "201":
          description: Movement recorded
  /v1/inventory/replenishment/policies:
    get:
      tags:
      - Replenishment
      summary: List replenishment policies
      description: Returns configured replenishment policies.
      operationId: getReplenishmentPolicies
      responses:
        "200":
          description: Replenishment policies returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReplenishmentPolicyResponse"
    post:
      tags:
      - Replenishment
      summary: Create replenishment policy
      description: Creates a replenishment policy used to generate replenishment tasks.
      operationId: createReplenishmentPolicy
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReplenishmentPolicyRequest"
        required: true
      responses:
        "400":
          description: Validation failure
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReplenishmentPolicyResponse"
        "201":
          description: Replenishment policy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplenishmentPolicyResponse"
  /v1/inventory/putaway/tasks/{taskId}/execute:
    post:
      tags:
      - Putaway
      summary: Execute putaway task
      description: Executes a putaway task and records destination inventory placement.
      operationId: executePutaway
      parameters:
      - name: taskId
        in: path
        description: Putaway task identifier
        required: true
        schema:
          type: string
      - name: X-User-Id
        in: header
        description: Preferred actor identifier from gateway context
        required: false
        schema:
          type: string
      - name: X-User
        in: header
        description: Fallback actor identifier from gateway context
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutawayExecutionRequest"
        required: true
      responses:
        "400":
          description: Validation failure
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PutawayExecutionResponse"
        "404":
          description: Putaway task not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PutawayExecutionResponse"
        "200":
          description: Putaway task executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutawayExecutionResponse"
  /v1/inventory/putaway/tasks/{taskId}/claim:
    post:
      tags:
      - Putaway
      summary: Claim a putaway task
      description: Claims an available putaway task for the current actor.
      operationId: claimTask
      parameters:
      - name: taskId
        in: path
        description: Putaway task identifier
        required: true
        schema:
          type: string
      - name: X-User-Id
        in: header
        description: Preferred actor identifier from gateway context
        required: false
        schema:
          type: string
      - name: X-User
        in: header
        description: Fallback actor identifier from gateway context
        required: false
        schema:
          type: string
      responses:
        "404":
          description: Putaway task not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PutawayTaskResponse"
        "200":
          description: Putaway task claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutawayTaskResponse"
  /v1/inventory/putaway/tasks/generate:
    post:
      tags:
      - Putaway
      summary: Generate putaway tasks
      description: Generates putaway tasks for received inventory lines.
      operationId: generateTasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePutawayTasksRequest"
        required: true
      responses:
        "400":
          description: Validation failure
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PutawayTaskResponse"
        "201":
          description: Putaway tasks generated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PutawayTaskResponse"
  /v1/inventory/pickingLists/{id}/confirm:
    post:
      tags:
      - Picking Lists
      summary: Confirm picking list
      description: Confirms a picking list and commits consumption. Stub implementation.
      operationId: confirmPickingList
      parameters:
      - name: id
        in: path
        description: Picking list identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema: {}
      responses:
        "501":
          description: Not implemented
        "200":
          description: Picking list confirmed
  /v1/inventory/cycleCountPlans:
    post:
      tags:
      - Cycle Count Plans
      summary: Create cycle count plan
      description: Creates a cycle count plan and returns its configuration details.
      operationId: createPlan
      parameters:
      - name: X-User-Id
        in: header
        description: Actor identifier from gateway context
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCycleCountPlanRequest"
        required: true
      responses:
        "400":
          description: Validation failure
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CycleCountPlanResponse"
        "403":
          description: User lacks required permission
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CycleCountPlanResponse"
        "201":
          description: Cycle count plan created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CycleCountPlanResponse"
  /v1/inventory/cycleCountAdjustments:
    get:
      tags:
      - Cycle Count Adjustments
      summary: List adjustments by status
      description: Lists all adjustments matching the specified status
      operationId: listAdjustments
      parameters:
      - name: status
        in: query
        description: Filter by adjustment status
        required: false
        schema:
          type: string
          enum:
          - PENDING_APPROVAL
          - AUTO_APPROVED
          - APPROVED
          - POSTED
          - REJECTED
          - FAILED
      responses:
        "200":
          description: Adjustments retrieved
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdjustmentResponse"
    post:
      tags:
      - Cycle Count Adjustments
      summary: Create cycle count adjustment
      description: Creates a new adjustment from a cycle count. Automatically evaluates
        against approval thresholds.
      operationId: createAdjustment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdjustmentRequest"
        required: true
      responses:
        "201":
          description: Adjustment created successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdjustmentResponse"
        "400":
          description: Invalid request or no variance detected
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdjustmentResponse"
  /v1/inventory/cycleCountAdjustments/{adjustmentId}/reject:
    post:
      tags:
      - Cycle Count Adjustments
      summary: Reject adjustment
      description: Rejects a pending adjustment with a reason. No inventory changes
        are made.
      operationId: rejectAdjustment
      parameters:
      - name: adjustmentId
        in: path
        description: Adjustment ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectAdjustmentRequest"
        required: true
      responses:
        "200":
          description: Adjustment rejected
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdjustmentResponse"
        "400":
          description: Adjustment not found or not in rejectable state
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdjustmentResponse"
        "403":
          description: User lacks required approval permission
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdjustmentResponse"
  /v1/inventory/cycleCountAdjustments/{adjustmentId}/approve:
    post:
      tags:
      - Cycle Count Adjustments
      summary: Approve adjustment
      description: Approves a pending adjustment and posts it to the inventory ledger
      operationId: approveAdjustment
      parameters:
      - name: adjustmentId
        in: path
        description: Adjustment ID
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveAdjustmentRequest"
        required: true
      responses:
        "200":
          description: Adjustment approved and posted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdjustmentResponse"
        "403":
          description: User lacks required approval permission
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdjustmentResponse"
        "400":
          description: Adjustment not found or not in approvable state
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdjustmentResponse"
  /v1/inventory/availability/{productId}:
    get:
      tags:
      - Inventory Availability
      summary: Query inventory availability
      description: Returns per-location availability for a product.
      operationId: queryInventoryAvailability
      parameters:
      - name: productId
        in: path
        description: Product identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Availability returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LocationAvailabilityDto"
        "400":
          description: Invalid product identifier
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LocationAvailabilityDto"
    post:
      tags:
      - Inventory Availability
      summary: Update inventory availability
      description: Updates availability for a product. Stub implementation.
      operationId: updateInventoryAvailability
      parameters:
      - name: productId
        in: path
        description: Product identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema: {}
      responses:
        "501":
          description: Not implemented
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InventoryAvailabilityResponse"
        "200":
          description: Availability updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryAvailabilityResponse"
  /v1/inventory/adjustments:
    post:
      tags:
      - Stock Movements
      summary: Create adjustment request
      description: Creates a pending adjustment request for approval before posting
        to the inventory ledger.
      operationId: createAdjustmentRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdjustmentRequestDto"
        required: true
      responses:
        "201":
          description: Adjustment request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustmentRequestResponse"
        "403":
          description: User lacks required create permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryErrorResponse"
        "400":
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryErrorResponse"
  /v1/inventory/adjustments/{adjustmentRequestId}/approve:
    post:
      tags:
      - Stock Movements
      summary: Approve adjustment request
      description: Approves a pending adjustment request and posts the resulting movement
        to the inventory ledger.
      operationId: approveAdjustmentRequest
      parameters:
      - name: adjustmentRequestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "403":
          description: User lacks required approval permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryErrorResponse"
        "409":
          description: Adjustment request is in a conflicting state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryErrorResponse"
        "200":
          description: Adjustment approved
        "404":
          description: Referenced resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryErrorResponse"
        "422":
          description: Business rule validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryErrorResponse"
        "400":
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryErrorResponse"
  /api/inventory/locations/{locationId}/deactivate:
    post:
      tags:
      - Inventory Management
      summary: Deactivate a storage location
      description: "Deactivate a storage location with atomic stock transfer to a\
        \ destination location (Option B). If the location contains active inventory,\
        \ a destination location must be specified."
      operationId: deactivate
      parameters:
      - name: locationId
        in: path
        description: Location ID to deactivate
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeactivateLocationRequest"
      responses:
        "400":
          description: Bad request - invalid parameters or destination required
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DeactivateLocationResponse"
        "200":
          description: Deactivation completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeactivateLocationResponse"
        "404":
          description: Location not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DeactivateLocationResponse"
        "409":
          description: Conflict - business rule violation
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DeactivateLocationResponse"
  /api/inventory/cycleCount/submit:
    post:
      tags:
      - Cycle Count Operations
      - Cycle Count API
      summary: Submit a count for a cycle count task
      description: Records the actual quantity counted by an auditor. Calculates variance
        and updates task status.
      operationId: submitCount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitCountRequest"
        required: true
      responses:
        "404":
          description: Task not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CountResponse"
        "400":
          description: Invalid request or quantity
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CountResponse"
        "200":
          description: Count submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountResponse"
  /api/inventory/cycleCount/recount:
    post:
      tags:
      - Cycle Count Operations
      - Cycle Count API
      summary: Submit a recount for a cycle count task
      description: Records a recount with permission validation and limit enforcement.
        Maximum 2 recounts allowed (3 total counts).
      operationId: submitRecount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRecountRequest"
        required: true
      responses:
        "200":
          description: Recount submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountResponse"
        "404":
          description: Task not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CountResponse"
        "400":
          description: Invalid request or recount limit exceeded
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CountResponse"
        "403":
          description: Insufficient permission
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CountResponse"
  /v1/inventory/replenishment/tasks:
    get:
      tags:
      - Replenishment
      summary: List replenishment tasks
      description: Returns replenishment tasks that should be fulfilled.
      operationId: getReplenishmentTasks
      responses:
        "200":
          description: Replenishment tasks returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReplenishmentTaskResponse"
  /v1/inventory/putaway/tasks:
    get:
      tags:
      - Putaway
      summary: List available putaway tasks
      description: Returns all currently available putaway tasks.
      operationId: getAvailableTasks
      responses:
        "200":
          description: Available putaway tasks returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PutawayTaskResponse"
  /v1/inventory/cycleCountPlans/{planId}:
    get:
      tags:
      - Cycle Count Plans
      summary: Get cycle count plan
      description: Returns a cycle count plan by identifier.
      operationId: getPlan
      parameters:
      - name: planId
        in: path
        description: Cycle count plan identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Cycle count plan returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CycleCountPlanResponse"
        "404":
          description: Cycle count plan not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CycleCountPlanResponse"
  /v1/inventory/cycleCountAdjustments/{adjustmentId}:
    get:
      tags:
      - Cycle Count Adjustments
      summary: Get adjustment details
      description: Retrieves details of a specific cycle count adjustment
      operationId: getAdjustment
      parameters:
      - name: adjustmentId
        in: path
        description: Adjustment ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Adjustment found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdjustmentResponse"
        "404":
          description: Adjustment not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdjustmentResponse"
  /v1/inventory/cycleCountAdjustments/pending:
    get:
      tags:
      - Cycle Count Adjustments
      summary: List pending approvals
      description: Lists all adjustments awaiting approval
      operationId: listPendingApprovals
      responses:
        "200":
          description: Pending adjustments retrieved
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdjustmentResponse"
  /v1/inventory/cycleCountAdjustments/pending/count:
    get:
      tags:
      - Cycle Count Adjustments
      summary: Count pending approvals
      description: Returns the count of adjustments awaiting approval
      operationId: countPendingApprovals
      responses:
        "200":
          description: Count retrieved
          content:
            '*/*':
              schema:
                type: integer
                format: int64
  /v1/inventory/availability/query:
    get:
      tags:
      - Inventory Availability
      summary: Query inventory availability by SKU and location
      description: "Returns on-hand, allocated, and available-to-promise quantities\
        \ for a product at a specific location. storageLocationId is optional to narrow\
        \ the scope to a sub-location."
      operationId: queryAvailabilityBySku
      parameters:
      - name: productSku
        in: query
        description: Product SKU
        required: true
        schema:
          type: string
      - name: locationId
        in: query
        description: Location identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: storageLocationId
        in: query
        description: Storage location identifier (optional; narrows to sub-location)
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryErrorResponse"
        "200":
          description: Availability view returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityView"
        "403":
          description: User lacks required read permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryErrorResponse"
        "404":
          description: Product SKU or location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryErrorResponse"
        "400":
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryErrorResponse"
  /api/inventory/cycleCount/task/{taskId}:
    get:
      tags:
      - Cycle Count Query
      - Cycle Count API
      summary: Get cycle count task details
      description: Retrieves details of a specific cycle count task.
      operationId: getTask
      parameters:
      - name: taskId
        in: path
        description: Task ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Task not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CycleCountTaskResponse"
        "200":
          description: Task retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CycleCountTaskResponse"
  /api/inventory/cycleCount/task/{taskId}/history:
    get:
      tags:
      - Cycle Count Query
      - Cycle Count API
      summary: Get count history for a task
      description: "Retrieves all count entries (original + recounts) for a task,\
        \ ordered by sequence."
      operationId: getCountHistory
      parameters:
      - name: taskId
        in: path
        description: Task ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: History retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountEntryResponse"
  /api/inventory/cycleCount/auditor/{auditorId}/tasks:
    get:
      tags:
      - Cycle Count Query
      - Cycle Count API
      summary: Get tasks assigned to an auditor
      description: Retrieves all cycle count tasks assigned to a specific auditor.
      operationId: getAuditorTasks
      parameters:
      - name: auditorId
        in: path
        description: Auditor ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Tasks retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CycleCountTaskResponse"
components:
  schemas:
    RecordMovementRequest:
      type: object
      properties:
        productSku:
          type: string
        fromLocationId:
          type: string
          format: uuid
        toLocationId:
          type: string
          format: uuid
        movementType:
