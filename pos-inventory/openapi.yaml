  /v1/inventory/locations/{locationId}/inventory-rollup:
    get:
      description: 'Aggregates inventory totals across all descendant sites of a parent location (building, place or region) along a typed parent chain, returning per-site summaries plus a grand total.

        Use this tool for multi-site aggregation above the site level; do not use getSiteInventoryRollup, which walks the storage-location tree inside one site rather than across the descendant sites of a parent location.

        Preconditions: the parent location must exist in pos-location, whose topology is fetched at request time.

        Required inputs: locationId (UUID) path parameter; parentType defaults to PHYSICAL, sku is an optional filter, and expand=tree inlines each site''s full storage-location tree with optional depth (minimum 1) and includeEmpty (default false); without expand, summaries are computed sequentially for every descendant regardless of count.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 404 when the location is not found, 422 with ROLLUP_EXPANSION_TOO_LARGE when expand=tree covers more descendant sites than the configured cap (pos.inventory.rollup.expand-site-cap, default 25), 400 for an unknown parentType or an unsupported expand value, and 503 when the location service is unavailable.

        '
      operationId: getLocationInventoryRollup
      parameters:
      - description: Parent location identifier (building/place/region)
        in: path
        name: locationId
        required: true
        schema:
          format: uuid
          type: string
      - description: Typed parent chain to walk (default PHYSICAL)
        in: query
        name: parentType
        required: false
        schema:
          type: string
      - description: Optional product SKU filter
        in: query
        name: sku
        required: false
        schema:
          type: string
      - description: Set to 'tree' to inline each site's full rollup tree
        in: query
        name: expand
        required: false
        schema:
          type: string
      - description: Maximum per-site tree depth (only with expand=tree)
        in: query
        name: depth
        required: false
        schema:
          format: int32
          minimum: 1
          type: integer
      - description: Include all-zero tree nodes (only with expand=tree)
        in: query
        name: includeEmpty
        required: false
        schema:
          default: false
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationInventoryRollupResponse'
          description: Rollup returned (empty sites list when the location has no descendants)
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationInventoryRollupResponse'
          description: Invalid parameters (unknown parentType, bad expand value)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: User lacks required on-hand view authority
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Location not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'expand=tree rejected: descendant site count exceeds the configured cap'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Location service unavailable; retry later
      security:
      - bearerAuth:
        - inventory:on_hand:view
      summary: Get parent-location inventory rollup
      tags:
      - Inventory Rollup
      x-required-permissions:
      - inventory:on_hand:view
