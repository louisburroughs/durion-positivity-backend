  /v1/inventory/bulk-ingest:
    post:
      description: 'Processes a batch of inventory adjustment records, creating one PENDING adjustment request per accepted row for the normal approval flow rather than posting stock changes directly.

        Use this tool for bulk imports such as cycle-count loads; do not use createAdjustmentRequest, which files a single interactive adjustment, and do not expect on-hand to change until each request is approved.

        Preconditions: none beyond authentication; rows are processed independently, so one bad row fails only itself.

        Required inputs: jobId (UUID), locationId (UUID) and at least one record with sku and a non-negative quantity; a record-level locationId overrides the batch location, reasonCode defaults to CYCLE_COUNT_ADJUSTMENT, and operatorId attributes the rows when a service account submits the batch.

        Emits an INVENTORY_BULK_INGEST event; each accepted row persists a PENDING adjustment request attributed to the resolved actor.

        Returns 200 with per-row results — failed rows carry errorCode INVENTORY_INGEST_FAILED and the failure message — and 400 when the envelope itself is invalid because jobId, locationId or records are missing.

        '
      operationId: bulkIngestInventoryAdjustments
      requestBody:
        content:
          application/json:
            examples:
              Cycle-count batch:
                description: Cycle-count batch
                value:
                  jobId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a20
                  locationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a01
                  operatorId: user-jdoe
                  records:
                  - quantity: 120
                    reasonCode: CYCLE_COUNT
                    sku: SKU-10042
                    unitOfMeasure: EACH
            schema:
              $ref: '#/components/schemas/BulkIngestRequestInventoryBulkIngestRecord'
        description: Batch envelope with the job, target location and the adjustment records to file.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkIngestResponse'
          description: Batch processed (check per-record success/failure in response)
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkIngestResponse'
          description: Invalid request payload
      security:
      - bearerAuth:
        - inventory:adjustment:create
      summary: Bulk ingest inventory adjustments
      tags:
      - Inventory Bulk Ingest API
      x-required-permissions:
      - inventory:adjustment:create
  /v1/inventory/consumption:
    post:
      description: 'Consumes picked items against a workorder, posting a negative WORKORDER_CONSUMPTION ledger entry per line and closing the originating located HARD allocations with ALLOCATION_RELEASED entries in the same transaction.

        Use this tool after confirmPickTask has marked the tasks PICKED; do not use createStockMovement with ISSUE for workorder parts, which bypasses allocation closure, and do not use cancelReservation, which releases demand without consuming stock.

        Preconditions: every referenced pick task must exist and be PICKED, each line quantity must not exceed the task''s picked quantity, and a LOT-tracked SKU needs a lot — the line''s lotNumber override or the lot recorded at pick confirmation.

        Required inputs: workorderId (UUID) and items, each with pickTaskId (UUID), skuId (UUID) and a positive quantity; pickListId and per-line lotNumber are optional, and an absent or empty items list yields a no-op response.

        Emits an INVENTORY_WORKORDER_CONSUMPTION_CREATE event and publishes a ConsumptionRecordedV1 fact carrying engine-derived costs; allocations close in sourcing-strategy order (FIFO oldest-first by default), each release capped at the allocation''s un-released remainder, and the reservation''s allocated quantity is reduced by what was consumed.

        Returns 404 when a pick task is unknown, 422 with WORKORDER_CONSUMPTION_ERROR when a task is not PICKED or a quantity exceeds what was picked, and 422 with LOT_NUMBER_REQUIRED, LOT_UNKNOWN or LOT_NOT_AVAILABLE for lot failures.

        '
      operationId: consumePickedItems
      requestBody:
        content:
          application/json:
            examples:
              Consume one picked line:
                description: Consume one picked line
                value:
                  items:
                  - lotNumber: LOT-2026-A
                    pickTaskId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a03
                    quantity: 4
                    skuId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a04
                  pickListId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a02
                  workorderId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a01
            schema:
              $ref: '#/components/schemas/ConsumeItemsRequest'
        description: The workorder consuming the parts and the picked lines (pick task, SKU, quantity, optional lot override) to consume.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumptionResponse'
          description: Consumption recorded
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Validation failure
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: User lacks required consumption authority
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Consumption business rule validation failed
      security:
      - bearerAuth:
        - inventory:adjustment:create
      summary: Consume picked items
      tags:
      - Consumption
      x-required-permissions:
      - inventory:adjustment:create
