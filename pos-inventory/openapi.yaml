  /v1/inventory/purchase-suggestions/{suggestionId}/accept:
    post:
      description: 'Accepts a purchase suggestion, moving it from SUGGESTED to ACCEPTED as the human-mandatory gate the replenishment scan never crosses on its own.

        Use this tool when a reviewer approves proposed replenishment; do not use convertPurchaseSuggestions before acceptance, and use dismissPurchaseSuggestion instead to reject the proposal.

        Preconditions: the suggestion must exist and be in SUGGESTED status.

        Required inputs: suggestionId (UUIDv7) path parameter; there is no request body.

        Emits an INVENTORY_PURCHASE_SUGGESTION_ACCEPT event; no purchase order is created and no spend is committed, that happens only through convertPurchaseSuggestions and the PO approval workflow.

        Returns 404 when the suggestion does not exist, and 409 when it is not SUGGESTED because it was already accepted, converted or dismissed.

        '
      operationId: acceptPurchaseSuggestion
      parameters:
      - description: Purchase suggestion identifier
        in: path
        name: suggestionId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseSuggestionResponse'
          description: Purchase suggestion accepted
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: User lacks required replenishment manage authority
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Purchase suggestion not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Suggestion is not in SUGGESTED status
      security:
      - bearerAuth:
        - inventory:replenishment:manage
      summary: Accept Purchase Suggestion
      tags:
      - Purchase Suggestions
      x-required-permissions:
      - inventory:replenishment:manage
  /v1/inventory/purchase-suggestions/{suggestionId}/dismiss:
    post:
      description: 'Dismisses a purchase suggestion with a recorded reason, moving it to the terminal DISMISSED status.

        Use this tool to reject one specific proposal; dismissal is per-instance, so use the replenishment policy snooze instead to suppress future suggestions for the SKU, and do not use acceptPurchaseSuggestion, which approves the proposal.

        Preconditions: the suggestion must exist and be in SUGGESTED or ACCEPTED status.

        Required inputs: suggestionId (UUIDv7) path parameter and a body with reason, non-blank and at most 255 characters.

        Emits an INVENTORY_PURCHASE_SUGGESTION_DISMISS event and stores the dismissal reason on the suggestion; the replenishment scan may still raise a new suggestion later.

        Returns 404 when the suggestion does not exist, 409 when it is already CONVERTED or DISMISSED, and 400 when the reason is missing or blank.

        '
      operationId: dismissPurchaseSuggestion
      parameters:
      - description: Purchase suggestion identifier
        in: path
        name: suggestionId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Dismissal with reason:
                description: Dismissal with reason
                value:
                  reason: Vendor contract under renegotiation
            schema:
              $ref: '#/components/schemas/DismissPurchaseSuggestionRequest'
        description: Why this suggestion is being rejected; recorded on the suggestion.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseSuggestionResponse'
          description: Purchase suggestion dismissed
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Missing or blank dismissal reason
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: User lacks required replenishment manage authority
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Purchase suggestion not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Suggestion is already CONVERTED or DISMISSED
      security:
      - bearerAuth:
        - inventory:replenishment:manage
      summary: Dismiss Purchase Suggestion
      tags:
      - Purchase Suggestions
      x-required-permissions:
      - inventory:replenishment:manage
