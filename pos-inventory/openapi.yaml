  /v1/inventory/shortage/options:
    get:
      description: 'Computes the live resolution options for an inventory shortage: BACKORDER (always offered; expected date from the SKU''s replenishment lead time at the site, defaulting to 7 days), SUBSTITUTE (substitution-group members with positive ATP at the site, with cost delta), TRANSFER_IN (sibling sites whose surplus of on-hand minus allocated covers the shortage, 3-day lead), EMERGENCY_PURCHASE (always offered; vendor-selected lead and cost delta, defaulting to 14 days) and CANCEL_LINE (always offered, immediate).

        Use this tool to present choices before calling resolveShortage with the selected optionType; do not call resolveShortage blind, because SUBSTITUTE and TRANSFER_IN need fields (substituteSku, sourceLocationId) that this computation supplies.

        Preconditions: none beyond a positive shortQuantity; SUBSTITUTE and TRANSFER_IN options appear only when locationId is provided, and SUBSTITUTE additionally requires sku to parse as a product UUID.

        Required inputs: allocationId (UUID), sku (non-blank) and shortQuantity (positive, decimal-capable per the product''s catalog precision_scale declaration); workorderLineId and locationId are optional but drive which options appear.

        No events are emitted and no state changes; this is a read-only computation.

        Returns 400 when shortQuantity is not positive or sku is blank.

        '
      operationId: listShortageOptions
      parameters:
      - description: Allocation experiencing the shortage
        in: query
        name: allocationId
        required: true
        schema:
          format: uuid
          type: string
      - description: SKU / stock-item identifier that is short
        in: query
        name: sku
        required: true
        schema:
          minLength: 1
          type: string
      - description: Quantity that is short
        in: query
        name: shortQuantity
        required: true
        schema:
          exclusiveMinimum: 0
          type: number
      - description: Workorder line whose demand is short
        in: query
        name: workorderLineId
        required: false
        schema:
          format: uuid
          type: string
      - description: Site the demand is short at
        in: query
        name: locationId
        required: false
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ShortageOptionDto'
                type: array
          description: Shortage options returned
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Validation failure
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: User lacks required shortage view authority
      security:
      - bearerAuth:
        - inventory:shortage:view
      summary: List computed shortage options
      tags:
      - Shortage Resolution
      x-required-permissions:
      - inventory:shortage:view
  /v1/inventory/shortage/resolve:
    post:
      description: 'Executes one chosen shortage-resolution option atomically and records the created artifact: BACKORDER opens a backorder, SUBSTITUTE reserves the substitute SKU through the reservation upsert, TRANSFER_IN creates a cross-site transfer order, EMERGENCY_PURCHASE stores a purchase suggestion, and CANCEL_LINE cancels the workorder line''s reservation.

        Use this tool after picking an option from listShortageOptions; do not use createOrUpdateReservation directly for substitutes or cancelReservation directly for line cancels when an auditable, idempotent resolution record is wanted.

        Preconditions: option-specific — workorderLineId for BACKORDER and SUBSTITUTE, substituteSku (a product UUID with positive ATP at locationId when locationId is given) for SUBSTITUTE, and both sourceLocationId and locationId for TRANSFER_IN.

        Required inputs: idempotencyKey (unique per resolution attempt — a replay with the same key returns the stored result without re-executing), allocationId (UUID), sku, a positive shortQuantity and optionType (BACKORDER, SUBSTITUTE, TRANSFER_IN, EMERGENCY_PURCHASE or CANCEL_LINE), plus the option-specific fields above; notes is optional free text.

        Emits an INVENTORY_SHORTAGE_RESOLVE event and persists a shortage-resolution record referencing the artifact (BACKORDER, RESERVATION, TRANSFER_ORDER, PURCHASE_SUGGESTION or NONE).

        Returns 422 with per-case codes when execution preconditions fail — MISSING_FIELD for an absent option-specific field, SUBSTITUTE_UNAVAILABLE when the substitute has no ATP at the site, INVALID_IDENTIFIER when substituteSku is not a UUID — and 400 when idempotencyKey, allocationId, sku or optionType is missing.

        '
      operationId: resolveShortage
      requestBody:
        content:
          application/json:
            examples:
              Backorder the short demand:
                description: Backorder the short demand
                value:
                  allocationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a01
                  idempotencyKey: shortage-resolve-018f0a1b-0001
                  locationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a0c
                  optionType: BACKORDER
                  shortQuantity: 3
                  sku: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a02
