        Required inputs: workorderLineId (UUID), stockItemId (UUID) and requiredQuantity (positive integer); workorderLineId is the upsert key.

        Emits an INVENTORY_RESERVATION_CREATE_OR_UPDATE event; no inventory ledger entry is written for a soft allocation.

