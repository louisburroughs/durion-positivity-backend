      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
          description: Reservation created or updated
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Validation failure
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: User lacks required reservation authority
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Business rule validation failed
      security:
      - bearerAuth:
        - inventory:adjustment:create
      summary: Create or update a reservation
      tags:
      - Inventory Reservations
      x-required-permissions:
      - inventory:adjustment:create
  /v1/inventory/reservations/sales-order-line/{salesOrderLineId}:
    delete:
      description: 'Cancels the reservation for a sales-order line (CAP #1315) and releases every allocation under it — the sales-order-demand counterpart of cancelReservation.

        Use this tool when sales-order demand is withdrawn; do not use cancelReservation, whose path parameter is a workorderLineId and which finds nothing for a sales-order line.

        Preconditions: a reservation must exist for the sales-order line.

        Required inputs: salesOrderLineId (UUID) path parameter; there is no request body.

        Emits an INVENTORY_RESERVATION_CANCEL_SALES_ORDER_LINE event; every allocation is marked RELEASED, located HARD allocations get ALLOCATION_RELEASED ledger entries for their un-released remainder only, and the reservation ends CANCELLED with allocatedQuantity 0.

