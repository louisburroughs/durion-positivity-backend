    SubmitCountRequest:
      description: Request to submit the initial physical count for a cycle count task
      properties:
        actualQuantity:
          description: Quantity physically measured, in unitOfMeasure (or the product's base UoM when unitOfMeasure is omitted). Converted to base UoM before variance is computed.
          example: 12
          minimum: 0
          type: number
        auditorId:
          description: Identifier of the auditor submitting the count
          example: auditor-10042
          type: string
        measurementMethod:
          description: How the quantity was obtained. Defaults to MANUAL_COUNT.
          enum:
          - MANUAL_COUNT
          - DIP
          - GAUGE
          - SCALE
          - METER
          - SENSOR
          example: MANUAL_COUNT
          type: string
        taskId:
          description: Identifier of the cycle count task being counted
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        unitOfMeasure:
          description: Unit the quantity was physically measured in. Omit for the product's base UoM.
          example: GAL
          type: string
        varianceReason:
          description: 'Reason for the variance, if already known at submission time. Optional: a count and its eventual adjustment are separate transactions, and the adjustment''s own reason code is what ultimately gates posting an out-of-tolerance variance.'
          example: Evaporation since last count
          type: string
      required:
      - actualQuantity
      - auditorId
      - taskId
      type: object
    SubmitRecountRequest:
      description: Request to submit a recount for a cycle count task, including the caller's permission context
      properties:
        actualQuantity:
          description: Quantity physically measured on the recount, in unitOfMeasure (or the product's base UoM when unitOfMeasure is omitted). Converted to base UoM before variance is computed.
          example: 13
          minimum: 0
          type: number
        auditorId:
          description: Identifier of the auditor submitting the recount
          example: auditor-10042
          type: string
        measurementMethod:
          description: How the quantity was obtained. Defaults to MANUAL_COUNT.
          enum:
          - MANUAL_COUNT
          - DIP
          - GAUGE
          - SCALE
          - METER
          - SENSOR
          example: MANUAL_COUNT
          type: string
        permission:
          description: Permission context authorizing the recount; one of TRIGGER_RECOUNT_SELF or TRIGGER_RECOUNT_ANY
          example: TRIGGER_RECOUNT_SELF
          type: string
        taskId:
          description: Identifier of the cycle count task being recounted
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        unitOfMeasure:
          description: Unit the quantity was physically measured in. Omit for the product's base UoM.
          example: GAL
          type: string
        varianceReason:
          description: Reason for the variance, if already known at submission time. Optional.
          example: Evaporation since last count
          type: string
      required:
      - actualQuantity
      - auditorId
      - permission
      - taskId
      type: object
    SupplierStockHintView:
      description: 'A vendor''s reported availability for one article: an advisory hint carrying its own age, never owned stock and never an ATP figure.'
      properties:
        articleEan:
          description: EAN/GTIN as the vendor stated it.
          type: string
        asOfSource:
          description: Whether the age shown is the vendor's figure (VENDOR) or only our fetch clock (FETCH), which bounds the age from below without establishing it.
          enum:
          - VENDOR
          - FETCH
          type: string
        availability:
          description: How to read this hint.
          enum:
          - REPORTED
          - QUANTITY_NOT_STATED
          - STALE_UNKNOWN
          type: string
        buyersArticleId:
          description: Our article code as the vendor holds it.
          type: string
        chunkCount:
          description: Chunks the source snapshot was split into.
          format: int32
          type: integer
        chunksApplied:
          description: Chunks of the source snapshot applied so far.
          format: int32
          type: integer
        description:
          description: Vendor article description.
          type: string
        fetchedAt:
          description: When we asked the vendor.
          format: date-time
          type: string
        identityKind:
          description: Which identifier this hint is keyed on.
          enum:
          - EAN
          - BUYER_ARTICLE
          - SUPPLIER_ARTICLE
          type: string
        identityValue:
          description: Value of the keyed identifier, as the vendor stated it.
          type: string
        quantity:
          description: Quantity the vendor reported. Null when the vendor stated none or when the hint is too stale to repeat — read `availability` to tell those apart. A value of 0 is the vendor explicitly reporting no stock.
          example: 12
          format: int32
          type: integer
        resolvedProductId:
          description: Catalog product this article resolved to; null while the article is unresolved, which is a normal state and not an error.
          format: uuid
          type: string
        snapshotAsOf:
          description: The vendor's own statement of when its snapshot was true. Null when the vendor stated no time; judge freshness on this whenever it is present.
          format: date-time
          type: string
        snapshotComplete:
          description: False when the snapshot this hint came from never arrived in full. The hint itself is still what the vendor said; the snapshot around it is incomplete.
          type: boolean
        supplierArticleCode:
          description: The vendor's own article code.
          type: string
        supplierRef:
          description: Vendor alias at fetch time; descriptive only.
          example: ediwheel-b21
          type: string
        vendorProfileId:
          description: Vendor profile that reported this. Hints are never aggregated across vendors — each vendor's statement stands on its own.
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
          format: uuid
          type: string
      required:
      - asOfSource
      - availability
      - chunkCount
      - chunksApplied
      - fetchedAt
      - identityKind
      - identityValue
      - snapshotComplete
      - vendorProfileId
      type: object
