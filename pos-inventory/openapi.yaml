      description: 'Converts ACCEPTED purchase suggestions into one multi-line DRAFT purchase order, stamping each suggestion CONVERTED with the created order''s id; a line is keyed in the vendor''s pack UoM when the suggestion captured a pack size the quantity divides evenly by.

        Use this tool after acceptPurchaseSuggestion to turn approved replenishment into an order; do not use createPurchaseOrder, the manual path that ignores suggestions, and note that conversion never approves spend, so approvePurchaseOrder must still run on the DRAFT order.

