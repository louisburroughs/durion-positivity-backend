    CountEntryResponse:
      description: A single recorded count entry in a cycle count task's history
      properties:
        actualQuantity:
          description: Quantity counted, converted to the product's base UoM — what expectedQuantity and variance are computed against
          example: 12
          type: number
        allowedToleranceAbsolute:
          description: Resolved absolute-tolerance bound at count time, if configured for this product/location
          example: 50
          type: number
        allowedTolerancePercentage:
          description: Resolved percentage-tolerance bound at count time, if configured for this product/location
          example: 1.5
          type: number
        auditorId:
          description: Identifier of the auditor who recorded the count
          example: auditor-10042
          type: string
        countEntryId:
          description: Unique identifier of the count entry
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        countedAt:
          description: Measurement timestamp — when the count was physically taken and recorded
          example: 2026-01-15 09:30:00+00:00
          format: date-time
          type: string
        cycleCountTaskId:
          description: Identifier of the cycle count task this entry belongs to
          example: 01960003-0000-7000-8000-000000000002
          format: uuid
          type: string
        expectedQuantity:
          description: Book (expected) quantity at the time of the count, in base UoM
          example: 15
          type: number
        measuredQuantity:
          description: Quantity exactly as measured, in unitOfMeasure. Equal to actualQuantity when unitOfMeasure is null.
          example: 12
          type: number
        measurementMethod:
          description: How the quantity was obtained
          enum:
          - MANUAL_COUNT
          - DIP
          - GAUGE
          - SCALE
          - METER
          - SENSOR
          example: MANUAL_COUNT
          type: string
        recount:
          description: Whether this entry is a recount of a prior count
          example: false
          type: boolean
        recountOfCountEntryId:
          description: Identifier of the count entry this entry is a recount of, if any
          example: 01960003-0000-7000-8000-000000000003
          format: uuid
          type: string
        recountSequenceNumber:
          description: Sequence number of this count within the recount chain; 0 for the initial count
          example: 1
          format: int32
          type: integer
        unitOfMeasure:
          description: Unit the count was physically measured in; null means the product's base UoM
          example: GAL
          type: string
        variance:
          description: Difference between counted and expected quantity, in base UoM (actual minus expected)
          example: -3
          type: number
        variancePercentage:
          description: Absolute variance as a percentage of book quantity; 100 when book quantity is zero
          example: 20.0
          type: number
        varianceReason:
          description: Reason for the variance, when known. Optional even for an out-of-tolerance count — the eventual adjustment's own reason code is what gates posting.
          example: Evaporation since last count
          type: string
        withinTolerance:
          description: 'Whether the variance fell within the resolved tolerance. true: reconciled, no adjustment created. false: flagged for investigation and review before an adjustment may be posted.'
          example: true
          type: boolean
      required:
      - actualQuantity
      - auditorId
      - countEntryId
      - countedAt
      - cycleCountTaskId
      - expectedQuantity
      - measuredQuantity
      - measurementMethod
      - recount
      - recountSequenceNumber
      - variance
      - variancePercentage
      - withinTolerance
      type: object
    CountResponse:
      description: Result of submitting a count or recount for a cycle count task
      properties:
        actualQuantity:
          description: Quantity counted, converted to the product's base UoM
          example: 12
          type: number
        countEntryId:
          description: Unique identifier of the recorded count entry
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        countedAt:
          description: Timestamp when the count was recorded
          example: 2026-01-15 09:30:00+00:00
          format: date-time
          type: string
        expectedQuantity:
          description: Book (expected) quantity at the time of the count, in base UoM
          example: 15
          type: number
        limitExceeded:
          description: Whether the maximum allowed number of recounts has been exceeded
          example: false
          type: boolean
        message:
          description: Human-readable message describing the outcome of the submission
          example: Count submitted and awaiting review
          type: string
        recountSequenceNumber:
          description: Sequence number of this count within the recount chain; 0 for the initial count
          example: 1
          format: int32
          type: integer
        taskId:
          description: Identifier of the cycle count task the count was submitted against
          example: 01960003-0000-7000-8000-000000000002
          format: uuid
          type: string
        taskStatus:
          description: Resulting status of the cycle count task after the submission
          enum:
          - ASSIGNED
          - COUNTED_PENDING_REVIEW
          - CONFLICT
          - REQUIRES_INVESTIGATION
          - ACCEPTED_WITHIN_TOLERANCE
          - APPROVED
          - REJECTED
          example: COUNTED_PENDING_REVIEW
          type: string
        variance:
          description: Difference between counted and expected quantity, in base UoM (actual minus expected)
          example: -3
          type: number
        withinTolerance:
          description: Whether the variance fell within the resolved tolerance; true means the count was reconciled with no adjustment created
          example: true
          type: boolean
      required:
      - actualQuantity
      - countEntryId
      - countedAt
      - expectedQuantity
      - limitExceeded
      - recountSequenceNumber
      - taskId
      - taskStatus
      - variance
      - withinTolerance
      type: object
    CreateAdjustmentRequest:
      description: Request to create a new inventory adjustment from a cycle count variance
      properties:
        costAtTimeOfAdjustment:
          description: Unit cost to capture at the time of the adjustment
          example: 12.5
          minimum: 0.0
          type: number
        countedQuantity:
          description: Quantity physically counted by the auditor
          example: 12
          minimum: 0
          type: number
        createdByUserId:
          description: Identifier of the user creating the adjustment
          example: user-10042
          minLength: 1
          type: string
        quantityOnHandBefore:
          description: Quantity on hand recorded before the count was applied
          example: 15
          type: number
        reasonCode:
          description: Reason code explaining why the adjustment is being made
          example: CYCLE_COUNT_VARIANCE
          minLength: 1
          type: string
        stockItemId:
          description: Identifier of the stock item being adjusted
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        taskId:
          description: Cycle count task this adjustment settles, if created from a task. Enables approval-time conflict detection and variance recomputation against current on-hand.
          example: 01960003-0000-7000-8000-000000000009
          format: uuid
          type: string
      required:
      - costAtTimeOfAdjustment
      - countedQuantity
      - createdByUserId
      - quantityOnHandBefore
      - reasonCode
      - stockItemId
      type: object
    CreateAdjustmentRequestDto:
      description: Request body for creating a draft inventory adjustment request
      properties:
        locationId:
          description: Identifier of the location where the adjustment applies
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        productSku:
          description: Stock-keeping unit of the product to adjust
          example: SKU-10042
          minLength: 1
          type: string
        quantity:
          description: Adjustment quantity (positive to add stock, negative to remove)
          example: 12
          type: number
        reasonCode:
          description: Mandatory reason code explaining the adjustment
          example: CYCLE_COUNT
          minLength: 1
          type: string
        unitOfMeasure:
          description: Optional unit of measure code for the quantity (e.g. EACH, KG)
          example: EACH
          type: string
      required:
      - locationId
      - productSku
      - quantity
      - reasonCode
      type: object
    CreateAsnLineRequest:
      description: Request payload describing a single line item to include when creating an advance shipping notice (ASN)
      properties:
        documentQuantity:
          description: Quantity shipped expressed in documentUom; must be supplied together with documentUom
          example: 1
          minimum: 0
          type: number
        documentUom:
          description: Optional UoM the line is keyed in (e.g. CASE). When present, documentQuantity is converted to the product's base UoM at derivation time; a UoM with no conversion path is rejected with 422 UOM_CONVERSION_UNDEFINED
          example: CASE
          type: string
        lotNumber:
          description: Lot or batch number associated with the shipped product
          example: LOT-2026-0042
          type: string
        poId:
          description: Identifier of the purchase order this ASN line is associated with
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        poLineId:
          description: Identifier of the specific purchase order line this ASN line fulfills
          example: 01960003-0000-7000-8000-000000000002
          format: uuid
          type: string
        quantityShipped:
          description: Quantity of the SKU declared as shipped on the ASN, in the product's base UoM. Required unless documentUom/documentQuantity are supplied, in which case the base quantity is derived and this field is ignored
          example: 12
          minimum: 0
          type: number
        sku:
          description: Stock keeping unit identifier for the shipped product
          example: SKU-10042
          minLength: 1
          type: string
        unitCostMinor:
          description: Unit cost of the product expressed in minor currency units (e.g. cents)
          example: 1499
          format: int64
          minimum: 0
          type: integer
        unitOfMeasure:
          description: Unit of measure for the shipped quantity
          example: EA
          type: string
      required:
      - poId
      - sku
      type: object
    CreateAsnRequest:
      description: Request payload to create an advance shipping notice (ASN) for an inbound vendor shipment
      properties:
        asnReferenceNumber:
          description: Human-readable reference number assigned to the ASN by the vendor
          example: ASN-2026-000123
          minLength: 1
          type: string
        expectedArrivalDate:
          description: Expected arrival date of the shipment at the destination
          example: 2026-01-20
          format: date
          type: string
        lineItems:
          description: Line items detailing the SKUs and quantities included in this ASN
          items:
            $ref: '#/components/schemas/CreateAsnLineRequest'
          type: array
        relatedPoIds:
          description: Identifiers of the purchase orders this shipment relates to
          example:
          - 01960003-0000-7000-8000-000000000002
          items:
            format: uuid
            type: string
          minItems: 1
          type: array
        shipDate:
          description: Date the shipment left the vendor
          example: 2026-01-15
          format: date
          type: string
        vendorId:
          description: Identifier of the vendor that issued the shipment
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
      required:
      - asnReferenceNumber
      - lineItems
      - relatedPoIds
      - vendorId
      type: object
    CreateCycleCountPlanRequest:
      description: Request to create a cycle count plan scheduling counts across a location and zones
      properties:
        locationId:
          description: Identifier of the location the plan applies to
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        planName:
          description: Human-readable name for the cycle count plan
          example: Q1 perishables count
          minLength: 1
          type: string
        scheduledDate:
          description: Date on which the cycle count is scheduled to occur
          example: 2026-01-15
          format: date
          type: string
        zoneIds:
          description: Identifiers of the zones within the location to include in the plan
          example:
          - 01960003-0000-7000-8000-000000000002
          items:
            format: uuid
            type: string
          type: array
      required:
      - locationId
      - planName
      - scheduledDate
      type: object
    CreateCycleCountScheduleRequest:
      description: Request to create a recurring cycle-count schedule for a location
      properties:
        autoCreatePlan:
          description: Whether the scheduled runner auto-creates the next cycle-count plan when due (false = the schedule only appears in the due-for-count view); defaults to false
          example: true
          type: boolean
        frequencyDays:
          description: Count frequency in days
          example: 30
          format: int32
          minimum: 0
          type: integer
        locationId:
          description: Identifier of the location the schedule applies to
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        nextDueDate:
          description: First date the schedule is due for counting
          example: 2026-08-01
          format: date
          type: string
        skuCategory:
          description: Optional SKU-category filter (plain string, metadata-only in v1)
          example: BRAKES
          maxLength: 100
          minLength: 0
          type: string
        zoneId:
          description: Optional single-zone filter within the location
          example: 01960003-0000-7000-8000-000000000002
          format: uuid
          type: string
      required:
      - frequencyDays
      - locationId
      - nextDueDate
      type: object
    CreateCycleCountToleranceRequest:
      description: Request to create a tolerance configuration for cycle-count reconciliation
      properties:
        absoluteTolerance:
          description: Maximum acceptable absolute variance, in the product's base UoM
          example: 50
          minimum: 0
          type: number
        createdBy:
          description: Identifier of the user creating this configuration
          example: user-10042
          minLength: 1
          type: string
        percentageTolerance:
          description: Maximum acceptable variance as a percentage of book quantity (e.g. 1.5 = 1.5%)
          example: 1.5
          minimum: 0
          type: number
        productId:
          description: Catalog product this tolerance scopes to. Omit for a product-agnostic (location-only or global) row.
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        storageLocation:
          description: Storage location this tolerance scopes to, matching the value cycle-count tasks carry as binLocation. Omit for a location-agnostic (product-only or global) row.
          example: TANK-04
          type: string
      required:
      - createdBy
      type: object
    CreateGoodsReceiptLineRequest:
      description: Request payload describing a single received line item when recording a goods receipt against a purchase order
      properties:
        documentQuantity:
          description: Quantity received expressed in documentUom; must be supplied together with documentUom
          example: 1
          minimum: 0
          type: number
        documentUom:
          description: Optional UoM the receipt line is keyed in (e.g. CASE). When present, documentQuantity is converted to the product's base UoM at posting time and the ledger posts the base quantity; unitCostMinor then refers to one documentUom unit. A UoM with no conversion path is rejected with 422 UOM_CONVERSION_UNDEFINED
          example: CASE
          type: string
        lotNumber:
          description: Lot or batch number associated with the received product
          example: LOT-2026-0042
          type: string
        poLineId:
          description: Identifier of the specific purchase order line this receipt line fulfills
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        quantityReceived:
          description: Whole-unit quantity of the SKU received, in the product's base UoM. Required unless documentUom/documentQuantity are supplied, in which case the base quantity is derived and this field is ignored
          example: 8
          minimum: 0
          type: number
        serialNumbers:
          description: 'Serial numbers of the received units (odoo-parity E4). Required for SERIAL-tracked products: the list size must equal the received base quantity (422 SERIAL_COUNT_MISMATCH otherwise), and each serial is enumerated as an in-stock unit. Ignored for untracked and LOT-tracked products'
          example:
          - SN-0001
          - SN-0002
          items:
            type: string
          type: array
        sku:
          description: Stock keeping unit identifier for the received product
          example: SKU-10042
          minLength: 1
          type: string
        unitCostMinor:
          description: Unit cost of the received product expressed in minor currency units (e.g. cents)
          example: 1499
          format: int64
          minimum: 0
          type: integer
      required:
      - sku
      - unitCostMinor
      type: object
    CreateGoodsReceiptRequest:
      description: Request payload to record a goods receipt for inventory received against a purchase order, optionally linked to an ASN
      properties:
        asnId:
          description: Identifier of the advance shipping notice (ASN) this receipt fulfills, if applicable
          example: 01960003-0000-7000-8000-000000000002
          format: uuid
          type: string
        lines:
          description: Received line items detailing the SKUs and quantities in this goods receipt
          items:
            $ref: '#/components/schemas/CreateGoodsReceiptLineRequest'
          type: array
        locationId:
          description: Identifier of the location where the goods are received into inventory
          example: 01960003-0000-7000-8000-000000000003
          format: uuid
          type: string
        poId:
          description: Identifier of the purchase order the goods are received against
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
      required:
      - lines
      - locationId
      - poId
      type: object
    CreatePickListRequest:
      description: Request to create a pick list for a workorder, optionally linked to a parts reservation
      properties:
        dueAt:
          description: Timestamp by which the pick list should be completed
          example: 2026-01-15 09:30:00+00:00
          format: date-time
          type: string
        priority:
          description: Relative priority of the pick list; higher values are picked sooner
          example: 5
          format: int32
          minimum: 0
          type: integer
        reservationId:
          description: Identifier of the reservation backing the pick list, when applicable
          example: 01960003-0000-7000-8000-000000000011
          format: uuid
          type: string
        workorderId:
          description: Identifier of the workorder the pick list fulfills
          example: 01960003-0000-7000-8000-000000000010
          format: uuid
          type: string
      required:
      - workorderId
      type: object
    CreateReceivingSessionRequest:
      description: Request to open a new inventory receiving session against a source document
      properties:
        entryMethod:
          description: Method used to enter receiving lines, such as SCAN or MANUAL
          example: MANUAL
          type: string
        sourceDocumentId:
          description: Identifier of the source document (e.g. purchase order or workorder) being received against
          example: 01960003-0000-7000-8000-000000000001
          minLength: 1
          type: string
      required:
      - sourceDocumentId
      type: object
    CreateReplenishmentPolicyRequest:
      description: Request to create a replenishment policy defining min/max stock thresholds for an item at a location
      properties:
        active:
          description: Whether the policy participates in replenishment evaluation; defaults to true
          example: true
          type: boolean
        itemSKU:
          description: SKU of the item the replenishment policy applies to
          example: SKU-10042
          minLength: 1
          type: string
        leadTimeDaysOverride:
          description: Per-policy lead-time override in days; takes precedence over vendor-feed lead-time estimates and the configured default
          example: 3
          format: int32
          minimum: 0
          type: integer
        locationId:
          description: Identifier of the location the replenishment policy applies to
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        maximumQuantity:
          description: Maximum on-hand quantity replenishment aims to restock up to
          example: 50
          format: int32
          minimum: 1
          type: integer
        minimumLessThanMaximum:
          type: boolean
        minimumQuantity:
          description: Minimum on-hand quantity that triggers replenishment when reached
          example: 5
          format: int32
          minimum: 0
          type: integer
        orderMultiple:
          description: Round the computed replenishment quantity up to the nearest multiple of this value. When omitted, defaults to the vendor-feed pack size for the SKU when one is known (greater than 1); otherwise no rounding is applied.
          example: 6
          format: int32
          minimum: 1
          type: integer
        preferredSourceType:
          description: Preferred sourcing channel for replenishing this policy's pick face; defaults to EITHER
          enum:
          - INTERNAL_TRANSFER
          - PURCHASE
          - EITHER
          example: EITHER
          type: string
      required:
      - itemSKU
      - locationId
      - maximumQuantity
      - minimumQuantity
      type: object
    CreateReservationRequest:
      description: 'Request to create an inventory reservation against a demand line (a workorder line or a sales-order line, CAP #1315) for a stock item. Exactly one of workorderLineId/salesOrderLineId must be set; the service rejects a request that sets both or neither.'
      properties:
        requiredQuantity:
          description: Quantity of the stock item required by the reservation. Decimal-capable, and permitted decimals only to the precision_scale the product's catalog declaration allows (ADR-0055)
          example: 4
          minimum: 0
          type: number
        salesOrderLineId:
          description: 'Identifier of the sales-order line the reservation fulfils, when demand is from a sales order (CAP #1315). Exactly one of this and workorderLineId must be set.'
          example: 01960003-0000-7000-8000-000000000004
          format: uuid
          type: string
        stockItemId:
          description: Identifier of the stock item being reserved
          example: 01960003-0000-7000-8000-000000000002
          format: uuid
          type: string
        workorderLineId:
          description: Identifier of the workorder line the reservation fulfils, when demand is from a workorder. Exactly one of this and salesOrderLineId must be set.
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
      required:
      - requiredQuantity
      - stockItemId
      type: object
    CreateRevaluationRequest:
      description: Request to manually revalue a SKU's inventory unit cost
      properties:
        costDelta:
          description: Signed adjustment applied to the SKU's current cost (may be negative for a write-down). Supply exactly one of newUnitCost or costDelta
          example: -0.75
          type: number
        newUnitCost:
          description: Absolute corrected unit cost. Supply exactly one of newUnitCost or costDelta. Must be zero or positive
          example: 5.5
          type: number
        reason:
          description: Justification for the correction; recorded in the audit log
          example: Q3 physical recount valuation correction
          maxLength: 1000
          minLength: 0
          type: string
        stockItemId:
          description: SKU / stock item identifier to revalue
          example: OIL-5W30-5QT
          minLength: 1
          type: string
      required:
      - reason
      - stockItemId
      type: object
    CreateScrapRequest:
      description: Request to scrap (write off) stock at a location
      properties:
        attachmentReference:
          description: Photo/attachment reference (storage out of scope)
          example: s3://scrap-evidence/2026/07/scrap-123.jpg
          maxLength: 500
          minLength: 0
          type: string
        locationId:
          description: Location the stock is scrapped from
          example: 96dd346a-047c-86f5-3c9a-7c8cac53da86
          format: uuid
          type: string
        lotNumber:
          description: Lot number the scrapped units belong to. Required (422 LOT_NUMBER_REQUIRED) when the SKU is LOT-tracked; must reference an existing (422 LOT_UNKNOWN) ACTIVE (422 LOT_NOT_AVAILABLE) lot. Ignored for untracked SKUs
          example: LOT-2026-A
          maxLength: 128
          minLength: 0
          type: string
        negativeStockOverride:
          description: Explicit negative-stock override for the auto-approve posting path; honored only when the caller holds inventory:adjustment:override
          example: false
          type: boolean
        notes:
          description: Free-text notes; mandatory when reasonCode is OTHER
          example: Dropped during putaway, casing cracked
          maxLength: 2000
          minLength: 0
          type: string
        quantity:
          description: Quantity to write off; must be positive
          example: 3
          format: int32
          minimum: 0
          type: integer
        reasonCode:
          description: Scrap reason; OTHER requires notes
          enum:
          - DAMAGED
          - EXPIRED
          - LOST
          - RECALLED
          - CONTAMINATED
          - WARRANTY_DESTROYED
          - OTHER
          example: DAMAGED
          type: string
        shouldReplenish:
          description: When true, posting triggers a pick-face replenishment evaluation for the SKU/location
          example: false
          type: boolean
