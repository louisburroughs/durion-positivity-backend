    ConfirmPickTaskRequest:
      type: object
      description: Request to confirm a pick task by recording the scanned SKU, scanned location, and quantity picked
      properties:
        scannedSkuId:
          type: string
          format: uuid
          description: Identifier of the SKU scanned by the picker
          example: 01960003-0000-7000-8000-000000000001
        scannedLocationId:
          type: string
          format: uuid
          description: Identifier of the bin or shelf location scanned during the pick
          example: 01960003-0000-7000-8000-000000000002
        quantityPicked:
          type: integer
          format: int32
          description: Quantity of units actually picked at the scanned location
          example: 12
          minimum: 0
        lotNumber:
          type: string
          description: Lot number the units were picked from. Required (422 LOT_NUMBER_REQUIRED) when the SKU is LOT-tracked; must reference an existing (422 LOT_UNKNOWN) ACTIVE (422 LOT_NOT_AVAILABLE) lot. May differ from the task's advisory suggestedLotNumber. Ignored for untracked SKUs
          example: LOT-2026-A
          maxLength: 128
          minLength: 0
      required:
      - quantityPicked
      - scannedLocationId
      - scannedSkuId
    PickTaskResponse:
      type: object
      description: Pick task details describing a single SKU-and-location pick within a pick list
      properties:
        pickTaskId:
          type: string
          format: uuid
          description: Unique identifier of the pick task
          example: 01960003-0000-7000-8000-000000000040
        pickListId:
          type: string
          format: uuid
          description: Identifier of the pick list this task belongs to
          example: 01960003-0000-7000-8000-000000000041
        skuId:
          type: string
          format: uuid
          description: Identifier of the SKU to be picked
          example: 01960003-0000-7000-8000-000000000042
        locationId:
          type: string
          format: uuid
          description: Identifier of the location the SKU is picked from
          example: 01960003-0000-7000-8000-000000000043
        quantityRequired:
          type: integer
          format: int32
          description: Quantity required to satisfy this pick task
          example: 12
        quantityPicked:
          type: integer
          format: int32
          description: Quantity already picked against this task
          example: 8
        status:
          type: string
          description: Current status of the pick task
          enum:
          - PENDING
          - NEEDS_REVIEW
          - PICKED
          - CANCELLED
          example: PENDING
        sortOrder:
          type: integer
          format: int32
          description: Ordinal position of this task in the pick sequence
          example: 1
        suggestedLotNumber:
          type: string
          description: Advisory lot suggestion for LOT-tracked SKUs (FIFO by lot receivedAt at the suggested location; FEFO once expiry data exists). Null for untracked SKUs or when no lot has stock
          example: LOT-2026-A
        pickedLotId:
          type: string
          format: uuid
          description: Identifier of the lot actually keyed at pick confirmation for LOT-tracked SKUs; null for untracked SKUs and before confirmation
          example: 01960003-0000-7000-8000-000000000044
      required:
      - locationId
      - pickListId
      - pickTaskId
      - quantityPicked
      - quantityRequired
      - skuId
      - sortOrder
      - status
    LotStatusUpdateRequest:
