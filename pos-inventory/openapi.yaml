  /v1/inventory/purchase-suggestions:
    get:
      description: 'Returns a page of replenishment purchase suggestions, newest first, with their lifecycle status, suggested quantity, vendor and pricing snapshot.

        Use this tool to discover suggestionIds or review what the replenishment scan proposed; use getPurchaseSuggestion instead when the id is already known.

        Preconditions: none; suggestions are created only by the replenishment scan, so an empty page means the scan proposed nothing matching the filters.

        Required inputs: none; status (SUGGESTED, ACCEPTED, CONVERTED or DISMISSED), sku and locationId are optional filters, and the page size defaults to 20.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 400 when status is not a known lifecycle value, and 200 with an empty page when nothing matches.

        '
      operationId: listPurchaseSuggestions
      parameters:
      - description: Lifecycle status filter (SUGGESTED, ACCEPTED, CONVERTED, DISMISSED)
        in: query
        name: status
        required: false
        schema:
          type: string
      - description: Stock item (SKU) filter
        in: query
        name: sku
        required: false
        schema:
          type: string
      - description: Destination location filter
        in: query
        name: locationId
        required: false
        schema:
          format: uuid
          type: string
      - in: query
        name: pageable
        required: true
        schema:
          $ref: '#/components/schemas/Pageable'
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Page of purchase suggestions
                type: string
          description: Purchase suggestions returned (paged)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: User lacks required view authority
      security:
      - bearerAuth:
        - inventory:on_hand:view
      summary: List Purchase Suggestions
      tags:
      - Purchase Suggestions
      x-required-permissions:
      - inventory:on_hand:view
  /v1/inventory/purchase-suggestions/convert:
    post:
      description: 'Converts ACCEPTED purchase suggestions into one multi-line DRAFT purchase order, stamping each suggestion CONVERTED with the created order''s id; a line is keyed in the vendor''s pack UoM when the suggestion captured a pack size the quantity divides evenly by.

        Use this tool after acceptPurchaseSuggestion to turn approved replenishment into an order; do not use createPurchaseOrder, the manual path that ignores suggestions, and note that conversion never approves spend, so approvePurchaseOrder must still run on the DRAFT order.

        Preconditions: every listed suggestion must exist, be ACCEPTED, carry a vendor reference and a feed unit cost, all must share one vendor, and all must resolve to a single ship-to site.

        Required inputs: suggestionIds (non-empty list of UUIDs); duplicates are collapsed, and the caller needs both inventory:replenishment:manage and inventory:purchase_order:create.

        Emits an INVENTORY_PURCHASE_SUGGESTION_CONVERT event and creates the DRAFT order through the standard purchase order path, with the latest expected date among the suggestions as the expected delivery date.

        Returns 404 when a listed suggestion does not exist, 422 when a suggestion is not ACCEPTED, lacks a vendor or unit cost, or the suggestions mix vendors or ship-to sites, and 400 when suggestionIds is empty.

        '
      operationId: convertPurchaseSuggestions
      requestBody:
        content:
          application/json:
            examples:
              Two suggestions, one vendor:
                description: Two suggestions, one vendor
                value:
                  suggestionIds:
                  - 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a30
                  - 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a31
            schema:
              $ref: '#/components/schemas/ConvertPurchaseSuggestionsRequest'
        description: The ACCEPTED suggestions to fold into a single DRAFT purchase order; all must share one vendor.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertPurchaseSuggestionsResponse'
          description: DRAFT purchase order created and suggestions stamped CONVERTED
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Validation failure (empty suggestion list)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: User lacks replenishment manage and/or purchase order create authority
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: A listed purchase suggestion was not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'Conversion precondition violated: a suggestion is not ACCEPTED, suggestions mix vendors or ship-to sites, or a suggestion lacks a vendor or feed price'
      security:
      - bearerAuth:
        - inventory:replenishment:manage
        - order:purchase_order:create
      summary: Convert Purchase Suggestions To Purchase Order
      tags:
      - Purchase Suggestions
      x-required-permissions:
      - inventory:replenishment:manage
      - order:purchase_order:create
  /v1/inventory/purchase-suggestions/{suggestionId}:
    get:
      description: 'Returns one purchase suggestion with its status, suggested quantity, vendor reference, feed price and, when converted, the created purchase order id.

        Use this tool when the suggestionId is already known; use listPurchaseSuggestions instead to search by status, SKU or destination location.

        Preconditions: the purchase suggestion must exist.

