        lines:
          type: array
          description: Explicit per-line received quantities; omitted lines receive their full remainder
          items:
            $ref: '#/components/schemas/TransferQuantityLineRequest'
    TransferQuantityLineRequest:
      type: object
      description: Explicit per-line quantity for a transfer dispatch or receive
      properties:
        lineId:
          type: string
          format: uuid
          description: Transfer order line identifier
        quantity:
          type: integer
          format: int32
          description: Quantity to dispatch/receive on this line; must be positive
          minimum: 0
        lotNumber:
          type: string
          description: Lot number the dispatched units are drawn from (dispatch only; receive and short-close reuse the lot recorded at dispatch). Required (422 LOT_NUMBER_REQUIRED) when the SKU is LOT-tracked; must reference an existing (422 LOT_UNKNOWN) ACTIVE (422 LOT_NOT_AVAILABLE) lot. Ignored for untracked SKUs
