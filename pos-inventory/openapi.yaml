  /v1/inventory/transfer-orders:
    get:
      description: 'Lists transfer orders newest first, optionally filtered by lifecycle status, source site and destination site.

        Use this tool to discover transferOrderIds or survey in-flight transfers; use getTransferOrder instead when the id is already known.

        Preconditions: none; every filter is optional and omitted filters match everything.

        Required inputs: none; status (TransferOrderStatus), sourceLocationId and destinationLocationId are optional query parameters.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 with an empty array when nothing matches, so an empty result is not an error condition.

        '
      operationId: listTransferOrders
      parameters:
      - description: Filter by lifecycle status
        in: query
        name: status
        required: false
        schema:
          enum:
          - DRAFT
          - APPROVED
          - DISPATCHED
          - PARTIALLY_RECEIVED
          - RECEIVED
          - SHORT_CLOSED
          - CANCELLED
          type: string
      - description: Filter by source site
        in: query
        name: sourceLocationId
        required: false
        schema:
          format: uuid
          type: string
      - description: Filter by destination site
        in: query
        name: destinationLocationId
        required: false
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TransferOrderResponse'
                type: array
          description: Transfer orders retrieved
      security:
      - bearerAuth:
        - inventory:transfer:view
      summary: List transfer orders
      tags:
      - Transfer Orders
      x-required-permissions:
      - inventory:transfer:view
    post:
      description: 'Creates a cross-site transfer order in DRAFT that will carry stock between two different sites through an explicit dispatch/receive lifecycle.

        Use this tool when stock must move between sites; do not use it for intra-site bin moves, which post immediately through the stock-movements endpoint, and do not use dispatchTransferOrder, which ships an order that already exists.

        Preconditions: source and destination must be different sites, both present in the location roster with status ACTIVE (DECISION-INVENTORY-009); an optional bin-level storage location must belong to its site when the storage-location replica knows it.

        Required inputs: sourceLocationId and destinationLocationId (UUID site ids) and at least one line with sku and a positive requestedQty; sourceStorageLocationId, destinationStorageLocationId and notes are optional.

        Emits an INVENTORY_TRANSFER_ORDER_CREATE event and queues a TransferOrderUpdatedV1 fact; no stock moves until dispatch.

        Returns 404 when a site is not in the location roster, 422 with TRANSFER_LOCATION_NOT_ELIGIBLE when a site is INACTIVE or PENDING, and 400 when source equals destination, a storage location belongs to another site, lines are empty or a quantity is not positive.

        '
      operationId: createTransferOrder
      requestBody:
        content:
          application/json:
            examples:
              Two-line resupply draft:
                description: Two-line resupply draft
                value:
                  destinationLocationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a02
                  lines:
                  - requestedQty: 6
                    sku: OIL-5W30-5QT
                  - requestedQty: 12
                    sku: FILTER-PH7317
                  notes: Weekly resupply run
                  sourceLocationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a01
            schema:
              $ref: '#/components/schemas/CreateTransferOrderRequest'
        description: 'Transfer order to draft: the two sites and the requested SKU lines.'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferOrderResponse'
          description: Transfer order created in DRAFT
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request (same source and destination site, empty lines, non-positive quantity, or a storage location outside its site)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Missing inventory:transfer:create
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Source or destination site is not in the location roster
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'Source or destination site is not eligible for movement (TRANSFER_LOCATION_NOT_ELIGIBLE: INACTIVE/PENDING per DECISION-INVENTORY-009)'
      security:
      - bearerAuth:
        - inventory:transfer:create
      summary: Create transfer order
      tags:
      - Transfer Orders
      x-required-permissions:
      - inventory:transfer:create
  /v1/inventory/transfer-orders/{transferOrderId}:
    get:
      description: 'Returns one transfer order with its lifecycle status, per-line requested, dispatched and received quantities, pinned lots and any short-close disposition.

        Use this tool when the transferOrderId is already known; use listTransferOrders instead to search by status, source or destination site.

        Preconditions: the transfer order must exist.

        Required inputs: transferOrderId (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 404 when no transfer order exists for the supplied id.

