    CreateAdjustmentRequest:
      type: object
      description: Request to create a new inventory adjustment from a cycle count variance
      properties:
        stockItemId:
          type: string
          format: uuid
          description: Identifier of the stock item being adjusted
          example: 01960003-0000-7000-8000-000000000001
        reasonCode:
          type: string
          description: Reason code explaining why the adjustment is being made
          example: CYCLE_COUNT_VARIANCE
          minLength: 1
        countedQuantity:
          type: integer
          format: int32
          description: Quantity physically counted by the auditor
          example: 12
          minimum: 0
        quantityOnHandBefore:
          type: integer
          format: int32
          description: Quantity on hand recorded before the count was applied
          example: 15
        costAtTimeOfAdjustment:
          type: number
          description: Unit cost to capture at the time of the adjustment
          example: 12.5
          minimum: 0.0
        createdByUserId:
          type: string
          description: Identifier of the user creating the adjustment
          example: user-10042
          minLength: 1
      required:
      - costAtTimeOfAdjustment
      - countedQuantity
      - createdByUserId
      - quantityOnHandBefore
      - reasonCode
      - stockItemId
    AdjustmentResponse:
      type: object
      description: Result of a cycle count inventory adjustment, including approval state and posting outcome
      properties:
        adjustmentId:
          type: string
          format: uuid
          description: Unique identifier of the adjustment record
          example: 01960003-0000-7000-8000-000000000001
        stockItemId:
          type: string
          format: uuid
          description: Identifier of the stock item the adjustment applies to
          example: 01960003-0000-7000-8000-000000000002
        reasonCode:
          type: string
          description: Reason code explaining why the adjustment was made
          example: CYCLE_COUNT_VARIANCE
        quantityChange:
          type: integer
          format: int32
          description: Net change in quantity on hand resulting from the adjustment (may be negative)
          example: -3
        costAtTimeOfAdjustment:
          type: number
          description: Unit cost captured at the moment the adjustment was created
          example: 12.5
        quantityOnHandBefore:
          type: integer
          format: int32
          description: Quantity on hand recorded before the count was applied
          example: 15
        countedQuantity:
          type: integer
          format: int32
          description: Quantity physically counted by the auditor
          example: 12
        status:
          type: string
          description: Current lifecycle status of the adjustment
          enum:
          - PENDING_APPROVAL
          - AUTO_APPROVED
          - APPROVED
          - POSTED
          - REJECTED
          - FAILED
          example: PENDING_APPROVAL
        requiredApprovalTier:
          type: string
          description: Approval tier required to authorize the adjustment, when manual approval applies
          enum:
          - TIER_1_MANAGER
          - TIER_2_DIRECTOR
          example: TIER_1_MANAGER
        createdByUserId:
          type: string
          description: Identifier of the user who created the adjustment
          example: user-10042
        approvedByUserId:
          type: string
          description: Identifier of the user who approved the adjustment, if approved
          example: user-20055
        rejectedByUserId:
          type: string
          description: Identifier of the user who rejected the adjustment, if rejected
          example: user-30077
        rejectionReason:
          type: string
          description: Free-text reason supplied when the adjustment was rejected
          example: Recount required before posting
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the adjustment was created
          example: 2026-01-15 09:30:00+00:00
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the adjustment was last updated
          example: 2026-01-15 10:05:00+00:00
        approvedAt:
          type: string
          format: date-time
          description: Timestamp when the adjustment was approved, if approved
          example: 2026-01-15 10:05:00+00:00
        rejectedAt:
          type: string
          format: date-time
          description: Timestamp when the adjustment was rejected, if rejected
          example: 2026-01-15 10:05:00+00:00
        postedAt:
          type: string
          format: date-time
          description: Timestamp when the adjustment was posted to the inventory ledger, if posted
          example: 2026-01-15 10:10:00+00:00
        ledgerEntryId:
          type: string
          format: uuid
          description: Identifier of the inventory ledger entry created when the adjustment was posted
          example: 01960003-0000-7000-8000-000000000003
        errorMessage:
          type: string
          description: Error message describing why processing failed, if the adjustment failed
          example: Stock item not found
        varianceValue:
          type: number
          description: Monetary value of the counted variance
          example: 37.5
        variancePercentage:
          type: number
          description: Variance expressed as a percentage of expected quantity on hand
          example: 20.0
      required:
      - adjustmentId
      - costAtTimeOfAdjustment
      - countedQuantity
      - createdAt
      - createdByUserId
      - quantityChange
      - quantityOnHandBefore
      - reasonCode
      - status
      - stockItemId
      - updatedAt
    RejectAdjustmentRequest:
      type: object
      description: Request to reject a pending cycle count adjustment
      properties:
        rejectorUserId:
          type: string
          description: Identifier of the user rejecting the adjustment
          example: user-30077
          minLength: 1
        rejectionReason:
          type: string
          description: Reason explaining why the adjustment is being rejected
          example: Recount required before posting
          minLength: 1
      required:
      - rejectionReason
      - rejectorUserId
    ApproveAdjustmentRequest:
      type: object
      description: Request to approve a pending cycle count adjustment
      properties:
        approverUserId:
          type: string
          description: Legacy client-provided approver identifier; the authoritative actor is resolved server-side from the authenticated context
          example: user-20055
        notes:
          type: string
          description: Optional free-text notes recorded with the approval
          example: Variance confirmed against receiving log
    SubmitCountRequest:
      type: object
      description: Request to submit the initial physical count for a cycle count task
      properties:
        taskId:
          type: string
          format: uuid
          description: Identifier of the cycle count task being counted
          example: 01960003-0000-7000-8000-000000000001
        auditorId:
          type: string
          description: Identifier of the auditor submitting the count
          example: auditor-10042
        actualQuantity:
          type: integer
          format: int32
          description: Quantity physically counted by the auditor
          example: 12
          minimum: 0
      required:
      - actualQuantity
      - auditorId
      - taskId
    CountResponse:
      type: object
      description: Result of submitting a count or recount for a cycle count task
      properties:
        countEntryId:
          type: string
          format: uuid
          description: Unique identifier of the recorded count entry
          example: 01960003-0000-7000-8000-000000000001
        taskId:
          type: string
          format: uuid
          description: Identifier of the cycle count task the count was submitted against
          example: 01960003-0000-7000-8000-000000000002
        actualQuantity:
          type: integer
          format: int32
          description: Quantity physically counted by the auditor
          example: 12
        expectedQuantity:
          type: integer
          format: int32
          description: Quantity expected on hand at the time of the count
          example: 15
        variance:
          type: integer
          format: int32
          description: Difference between counted and expected quantity (actual minus expected)
          example: -3
        recountSequenceNumber:
          type: integer
          format: int32
          description: Sequence number of this count within the recount chain; 0 for the initial count
          example: 1
        taskStatus:
          type: string
          description: Resulting status of the cycle count task after the submission
          enum:
          - ASSIGNED
          - COUNTED_PENDING_REVIEW
          - REQUIRES_INVESTIGATION
          - APPROVED
          - REJECTED
          example: COUNTED_PENDING_REVIEW
        countedAt:
          type: string
          format: date-time
          description: Timestamp when the count was recorded
          example: 2026-01-15 09:30:00+00:00
        limitExceeded:
          type: boolean
          description: Whether the maximum allowed number of recounts has been exceeded
          example: false
        message:
          type: string
          description: Human-readable message describing the outcome of the submission
          example: Count submitted and awaiting review
      required:
      - actualQuantity
      - countEntryId
      - countedAt
      - expectedQuantity
      - limitExceeded
      - recountSequenceNumber
      - taskId
      - taskStatus
      - variance
    SubmitRecountRequest:
      type: object
