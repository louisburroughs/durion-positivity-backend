          type: integer
          format: int64
          description: On-hand quantity contributing to the value (site-scoped when a location filter is applied)
          example: 20
        costingMethod:
          type: string
          description: Resolved costing method for the SKU (AVERAGE or STANDARD)
          example: AVERAGE
