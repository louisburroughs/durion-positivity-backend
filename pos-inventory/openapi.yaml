        content:
          application/json:
            examples:
              Quarantine after recall notice:
                description: Quarantine after recall notice
                value:
                  reason: Supplier recall notice R-2026-014
                  status: QUARANTINED
            schema:
              $ref: '#/components/schemas/LotStatusUpdateRequest'
        description: Target lifecycle status with the mandatory traceability reason.
        required: true
      responses:
