          type: string
        purchaseOrderId:
          description: Identifier of the created DRAFT purchase order
          example: 01980003-0000-7000-8000-000000000005
          format: uuid
          type: string
        purchaseOrderStatus:
          description: Status of the created purchase order (always DRAFT; the existing approval workflow applies)
          example: DRAFT
          type: string
      required:
      - convertedSuggestionIds
      - poNumber
      - purchaseOrderId
      - purchaseOrderStatus
      type: object
    CostingMethodConfigRequest:
      description: Upsert of the costing method configured for one scope (odoo-parity J1)
      properties:
        method:
          description: Costing method applied at this scope
          enum:
          - STANDARD
          - AVERAGE
          example: AVERAGE
          type: string
        scopeType:
          description: Configuration scope kind
          enum:
          - SKU
          - SKU_CATEGORY
          - DEFAULT
          example: DEFAULT
          type: string
        scopeValue:
          description: 'Scope key: the stock item id for SKU, the category string for SKU_CATEGORY, omitted for DEFAULT'
          example: 01960003-0000-7000-8000-000000000010
          type: string
      required:
      - method
      - scopeType
      type: object
    CostingMethodConfigResponse:
      description: One costing method configuration row (odoo-parity J1)
      properties:
        active:
          description: Whether this row participates in resolution
          example: true
          type: boolean
        configId:
          description: Unique identifier of the configuration row
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        createdAt:
          description: Timestamp when the row was created
          example: 2026-07-01 00:00:00+00:00
          format: date-time
          type: string
        method:
          description: Costing method applied at this scope
          enum:
          - STANDARD
          - AVERAGE
          example: AVERAGE
          type: string
        scopeType:
          description: Configuration scope kind
          enum:
          - SKU
          - SKU_CATEGORY
          - DEFAULT
          example: DEFAULT
          type: string
        scopeValue:
          description: 'Scope key: stock item id, category string, or null for DEFAULT'
          example: 01960003-0000-7000-8000-000000000010
          type: string
