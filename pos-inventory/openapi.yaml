        Use this tool to discover a serialUnitId or resolve a serial number; use getSerialUnit instead when the id is known, and use traceSerialUnit for the movement history.

        Preconditions: none; serial units are created and transitioned exclusively by the ledger posting funnel, never through this API.

        Required inputs: none; stockItemId (catalog product id), status (IN_STOCK, ISSUED, RETURNED, SCRAPPED) and serialNumber are optional query filters.

