  /v1/inventory/backorders/{backorderId}:
    get:
      tags:
      - Backorders
      summary: Get backorder details
      description: 'Returns one backorder with its shortage quantity, lifecycle status, resolution source and timestamps.

        Use this tool when the backorderId is already known; use listBackorders instead to search by status, SKU, site or workorder line.

        Preconditions: the backorder must exist.

        Required inputs: backorderId (UUID) path parameter; there is no request body.

        No events are emitted and no state changes; auto-resolution happens asynchronously when inbound stock raises ATP at the backorder''s site — oldest-priority-first, and only when the full quantityShort fits the remaining ATP budget (whole-backorder resolution, no partials).

        Returns 404 when no backorder exists for the supplied id.

        '
      operationId: getBackorder
      parameters:
      - name: backorderId
        in: path
        description: Backorder ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Backorder found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackorderResponse'
        '404':
          description: Backorder not found
          content:
            application/json:
