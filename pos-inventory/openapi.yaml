        allocationId:
          type: string
          format: uuid
          description: Identifier of the allocation that was resolved
          example: 01960003-0000-7000-8000-000000000001
        resolution:
          type: string
          description: Resolution strategy that was applied
          example: SUBSTITUTE
        resolvedAt:
          type: string
          format: date-time
          description: Timestamp when the shortage was resolved
          example: 2026-01-15 09:30:00+00:00
        status:
          type: string
          description: Resulting status of the allocation after resolution
          example: RESOLVED
      required:
      - allocationId
      - resolution
      - resolvedAt
      - status
    CreateScrapRequest:
      type: object
      description: Request to scrap (write off) stock at a location
      properties:
        stockItemId:
          type: string
          description: SKU / stock item identifier being scrapped
          example: OIL-5W30-5QT
          minLength: 1
        quantity:
          type: integer
          format: int32
          description: Quantity to write off; must be positive
          example: 3
        locationId:
          type: string
          format: uuid
          description: Location the stock is scrapped from
          example: 96dd346a-047c-86f5-3c9a-7c8cac53da86
        storageLocationId:
          type: string
          format: uuid
          description: Bin-level storage location, when the scrap is bin-scoped
          example: 01960004-0001-7000-8000-000000000009
        reasonCode:
          type: string
          description: Scrap reason; OTHER requires notes
          enum:
          - DAMAGED
          - EXPIRED
          - LOST
          - RECALLED
          - CONTAMINATED
          - WARRANTY_DESTROYED
          - OTHER
          example: DAMAGED
        notes:
          type: string
          description: Free-text notes; mandatory when reasonCode is OTHER
          example: Dropped during putaway, casing cracked
          maxLength: 2000
          minLength: 0
        workorderId:
          type: string
          format: uuid
          description: Workorder the scrapped part belonged to, when linked
          example: 01960005-0000-7000-8000-000000000001
        lotNumber:
          type: string
          description: Lot number the scrapped units belong to. Required (422 LOT_NUMBER_REQUIRED) when the SKU is LOT-tracked; must reference an existing (422 LOT_UNKNOWN) ACTIVE (422 LOT_NOT_AVAILABLE) lot. Ignored for untracked SKUs
          example: LOT-2026-A
          maxLength: 128
          minLength: 0
        attachmentReference:
          type: string
          description: Photo/attachment reference (storage out of scope)
          example: s3://scrap-evidence/2026/07/scrap-123.jpg
          maxLength: 500
          minLength: 0
        shouldReplenish:
          type: boolean
          description: When true, posting triggers a pick-face replenishment evaluation for the SKU/location
          example: false
        negativeStockOverride:
          type: boolean
          description: Explicit negative-stock override for the auto-approve posting path; honored only when the caller holds inventory:adjustment:override
          example: false
      required:
      - locationId
      - quantity
      - reasonCode
      - stockItemId
    ScrapResponse:
