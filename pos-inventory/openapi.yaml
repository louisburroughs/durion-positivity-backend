        createdAt:
          type: string
          format: date-time
          description: Timestamp when the pick list was created
          example: 2026-01-15 08:00:00+00:00
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the pick list was last updated
          example: 2026-01-15 08:45:00+00:00
