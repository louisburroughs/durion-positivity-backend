    CreateTransferOrderRequest:
      type: object
      description: Request to create a cross-site transfer order in DRAFT
      properties:
        sourceLocationId:
          type: string
          format: uuid
          description: Source site the transfer ships from
          example: 01960004-0001-7000-8000-00000000000a
        sourceStorageLocationId:
          type: string
          format: uuid
          description: Optional bin-level source storage location under the source site
          example: 01960004-0001-7000-8000-00000000000b
        destinationLocationId:
          type: string
          format: uuid
          description: Destination site the transfer ships to
          example: 01960004-0001-7000-8000-00000000000c
        destinationStorageLocationId:
          type: string
          format: uuid
          description: Optional bin-level destination storage location under the destination site
          example: 01960004-0001-7000-8000-00000000000d
        lines:
          type: array
          description: Requested SKU lines; at least one
          items:
            $ref: '#/components/schemas/TransferOrderLineRequest'
          minItems: 1
        notes:
          type: string
          description: Free-text notes
          example: Weekly resupply run
          maxLength: 2000
          minLength: 0
      required:
      - destinationLocationId
      - lines
      - sourceLocationId
    TransferOrderLineRequest:
      type: object
      description: Requested SKU line of a transfer order
      properties:
        sku:
          type: string
          description: SKU / stock item identifier to transfer
          example: OIL-5W30-5QT
          minLength: 1
        requestedQty:
          type: integer
          format: int32
          description: Quantity requested for transfer; must be positive
          example: 6
      required:
      - requestedQty
      - sku
    TransferOrderLineResponse:
      type: object
      description: SKU line of a transfer order with requested/dispatched/received quantities
      properties:
        lineId:
          type: string
          format: uuid
          description: Line identifier
        lineNumber:
          type: integer
          format: int32
          description: Position of the line within the order (1-based)
        sku:
          type: string
          description: SKU / stock item identifier
        requestedQty:
          type: integer
          format: int32
          description: Quantity requested for transfer
        dispatchedQty:
          type: integer
          format: int32
          description: Quantity dispatched from the source so far
        receivedQty:
          type: integer
          format: int32
          description: Quantity received at the destination so far
        lotId:
          type: string
          format: uuid
          description: Lot the dispatched units were drawn from (LOT-tracked SKUs, pinned at dispatch)
        lotNumber:
          type: string
          description: Lot number matching lotId, kept for audit/display
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
    TransferOrderResponse:
      type: object
      description: Cross-site transfer order with lifecycle status and quantity lines
      properties:
        transferOrderId:
          type: string
          format: uuid
          description: Transfer order identifier
        sourceLocationId:
          type: string
          format: uuid
          description: Source site the transfer ships from
        sourceStorageLocationId:
          type: string
          format: uuid
          description: Bin-level source storage location, when bin-scoped
        destinationLocationId:
          type: string
          format: uuid
          description: Destination site the transfer ships to
        destinationStorageLocationId:
          type: string
          format: uuid
          description: Bin-level destination storage location, when bin-scoped
        status:
          type: string
          description: Lifecycle status
          enum:
          - DRAFT
          - APPROVED
          - DISPATCHED
          - PARTIALLY_RECEIVED
          - RECEIVED
          - SHORT_CLOSED
          - CANCELLED
        lines:
          type: array
          description: SKU lines
          items:
            $ref: '#/components/schemas/TransferOrderLineResponse'
        notes:
          type: string
          description: Free-text notes
        createdBy:
          type: string
          description: User who created the order
        approvedBy:
          type: string
          description: User who approved the order, when the approval step is enabled
        dispatchedBy:
          type: string
          description: User who dispatched the order
        shortCloseDisposition:
          type: string
          description: Disposition of the undelivered remainder; set only when SHORT_CLOSED
          enum:
          - LOST_IN_TRANSIT
          - RETURNED_TO_SOURCE
        shortCloseReason:
          type: string
          description: Short-close reason; set only when SHORT_CLOSED
        shortCloseNotes:
          type: string
          description: Short-close notes; set only when SHORT_CLOSED
        shortClosedBy:
          type: string
          description: User who short-closed the order; set only when SHORT_CLOSED
        shortClosedAt:
          type: string
          format: date-time
          description: When the order was short-closed; set only when SHORT_CLOSED
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
    ShortCloseTransferOrderRequest:
      type: object
      description: Request to short-close a transfer order, resolving the undelivered remainder with a whole-order disposition
      properties:
        disposition:
          type: string
          description: 'Disposition of the undelivered remainder: LOST_IN_TRANSIT writes it off (SCRAP_OUT, reason LOST); RETURNED_TO_SOURCE restores it to source on-hand'
          enum:
          - LOST_IN_TRANSIT
          - RETURNED_TO_SOURCE
        reason:
          type: string
          description: Reason for the short-close (mandatory)
          maxLength: 100
          minLength: 0
        notes:
          type: string
          description: Free-text notes explaining the short-close (mandatory)
          maxLength: 2000
          minLength: 0
      required:
      - disposition
      - notes
      - reason
    ReceiveTransferOrderRequest:
      type: object
      description: Request to receive a transfer order; omitted lines receive their full remainder
      properties:
        lines:
          type: array
          description: Explicit per-line received quantities; omitted lines receive their full remainder
          items:
            $ref: '#/components/schemas/TransferQuantityLineRequest'
    TransferQuantityLineRequest:
      type: object
      description: Explicit per-line quantity for a transfer dispatch or receive
      properties:
        lineId:
          type: string
          format: uuid
          description: Transfer order line identifier
        quantity:
          type: integer
          format: int32
          description: Quantity to dispatch/receive on this line; must be positive
        lotNumber:
          type: string
          description: Lot number the dispatched units are drawn from (dispatch only; receive and short-close reuse the lot recorded at dispatch). Required (422 LOT_NUMBER_REQUIRED) when the SKU is LOT-tracked; must reference an existing (422 LOT_UNKNOWN) ACTIVE (422 LOT_NOT_AVAILABLE) lot. Ignored for untracked SKUs
          example: LOT-2026-A
          maxLength: 128
          minLength: 0
      required:
      - lineId
      - quantity
    DispatchTransferOrderRequest:
      type: object
      description: Request to dispatch a transfer order; omitted lines dispatch their full requested quantity
      properties:
        lines:
          type: array
          description: Explicit per-line dispatch quantities; omitted lines dispatch full requested
          items:
            $ref: '#/components/schemas/TransferQuantityLineRequest'
    RecordMovementRequest:
      type: object
      description: Request body for recording a directional stock movement in the inventory ledger
      properties:
        productSku:
          type: string
          description: Stock keeping unit code of the product being moved
          example: SKU-10042
          minLength: 1
        fromLocationId:
          type: string
          format: uuid
          description: Identifier of the location the stock moves from
          example: 01960003-0000-7000-8000-000000000130
        toLocationId:
          type: string
          format: uuid
          description: Identifier of the destination location; required for TRANSFER movements
          example: 01960003-0000-7000-8000-000000000131
        movementType:
          type: string
          description: Direct ledger movement type. ADJUST is workflow-only and must use /v1/inventory/adjustments endpoints.
          enum:
          - RECEIVE
          - PUT_AWAY
          - PICK
          - ISSUE
          - RETURN
          - TRANSFER
          example: RECEIVE
        quantity:
          type: integer
          format: int32
          description: Quantity of units being moved
          example: 12
        unitOfMeasure:
          type: string
          description: Unit of measure for the quantity
          example: EACH
        sourceTransactionId:
          type: string
          description: Reference to the originating system transaction that caused the movement
          example: 01960003-0000-7000-8000-000000000132
      required:
      - fromLocationId
      - movementType
      - productSku
      - quantity
    ShortageResolveRequest:
      type: object
      description: Request to resolve an inventory shortage on an allocation
      properties:
        allocationId:
          type: string
          format: uuid
          description: Identifier of the allocation to resolve
          example: 01960003-0000-7000-8000-000000000001
        allocationLineId:
          type: string
          format: uuid
          description: Identifier of the specific allocation line to resolve, when line-scoped
          example: 01960003-0000-7000-8000-000000000002
        resolution:
