  /v1/inventory/reservations/{allocationId}/promote:
    post:
      tags:
      - Inventory Reservations
      summary: Promote allocation to hard
      description: 'Promotes an existing allocation to HARD, pinning it to a storage location and recording an ALLOCATION_CREATED inventory ledger entry against that location.

        Use this tool when stock is being committed to a location and ATP must be verified; do not use createOrUpdateReservation, which only registers soft demand, and do not use consumePickedItems, which decrements stock after picking.

        Preconditions: the allocation must exist, the storage location must exist and be active, and available ATP — the stock item''s ledger net on-hand minus the reservation''s other HARD quantity — must cover the allocation''s quantity.

        Required inputs: allocationId (UUID) path parameter and storageLocationId (UUID) in the body; hardenedReason is optional free text.

        Emits an INVENTORY_ALLOCATION_PROMOTE_HARD event; the reservation becomes FULFILLED or PARTIALLY_FULFILLED by total allocated quantity, a failed ATP check flips it to BACKORDERED before the 422 is returned, and a repeat promote of an already-HARD located allocation keeps its location and writes no duplicate ledger entry.

        Returns 404 when the allocation or storage location cannot be resolved, 422 with INSUFFICIENT_ATP when ATP does not cover the quantity, 409 when a different storageLocationId is supplied for an already-located HARD allocation (relocation via promote is unsupported), and 400 when storageLocationId is missing or the storage location is inactive.

        '
      operationId: promoteReservationAllocation
      parameters:
      - name: allocationId
        in: path
        description: Allocation identifier to promote
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Storage location the hardened allocation pins stock to, with an optional hardening reason.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteAllocationRequest'
            examples:
