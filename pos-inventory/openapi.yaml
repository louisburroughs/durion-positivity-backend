          description: User who approved the scrap (SYSTEM for auto-approval)
        rejectedBy:
          type: string
          description: User who rejected the scrap
        rejectionReason:
          type: string
          description: Reason the scrap was rejected
        ledgerEntryId:
          type: string
          format: uuid
          description: SCRAP_OUT ledger entry created when posted
        errorMessage:
          type: string
          description: Error message when status is FAILED
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
        approvedAt:
          type: string
          format: date-time
          description: Approval timestamp
        rejectedAt:
          type: string
          format: date-time
          description: Rejection timestamp
        postedAt:
          type: string
          format: date-time
          description: Ledger posting timestamp
    RejectScrapRequest:
