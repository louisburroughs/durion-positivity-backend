      - changeInQuantity
      - eventType
      - ledgerEntryId
      - timestamp
      type: object
    TraceabilityUpstream:
      description: 'Upstream origin: vendor, receipt date, and source documents (PO / ASN / goods receipt)'
      properties:
        documents:
          description: Upstream source documents, PO first then ASN then goods receipt
          items:
            $ref: '#/components/schemas/TraceabilityDocumentRef'
          type: array
        receivedAt:
          description: When the lot/serial was first received into stock
          format: date-time
          type: string
        vendorId:
          description: Vendor the lot/serial was first received from, when known
          format: uuid
          type: string
      required:
      - documents
      type: object
    Transfer:
      description: Details of inventory moved from the deactivated location to the destination location
      properties:
        movedAt:
          description: Timestamp when the inventory was moved
          example: 2026-01-15 09:30:00+00:00
          format: date-time
          type: string
        movedItems:
          description: Items moved as part of the transfer
          items:
            $ref: '#/components/schemas/MovedItem'
          type: array
      type: object
    TransferOrderLineRequest:
      description: Requested SKU line of a transfer order
      properties:
        requestedQty:
          description: Quantity requested for transfer; must be positive
          example: 6
          format: int32
          minimum: 0
          type: integer
        sku:
          description: SKU / stock item identifier to transfer
          example: OIL-5W30-5QT
          minLength: 1
          type: string
      required:
      - requestedQty
      - sku
      type: object
    TransferOrderLineResponse:
      description: SKU line of a transfer order with requested/dispatched/received quantities
      properties:
        createdAt:
          description: Creation timestamp
          format: date-time
          type: string
        dispatchedQty:
          description: Quantity dispatched from the source so far
          format: int32
          type: integer
        lineId:
          description: Line identifier
          format: uuid
          type: string
        lineNumber:
          description: Position of the line within the order (1-based)
          format: int32
          type: integer
        lotId:
          description: Lot the dispatched units were drawn from (LOT-tracked SKUs, pinned at dispatch)
          format: uuid
          type: string
        lotNumber:
          description: Lot number matching lotId, kept for audit/display
          type: string
        receivedQty:
          description: Quantity received at the destination so far
          format: int32
          type: integer
        requestedQty:
          description: Quantity requested for transfer
          format: int32
          type: integer
        sku:
          description: SKU / stock item identifier
          type: string
        updatedAt:
          description: Last update timestamp
          format: date-time
          type: string
      type: object
    TransferOrderResponse:
      description: Cross-site transfer order with lifecycle status and quantity lines
      properties:
        approvedBy:
          description: User who approved the order, when the approval step is enabled
          type: string
        createdAt:
          description: Creation timestamp
          format: date-time
          type: string
        createdBy:
          description: User who created the order
          type: string
        destinationLocationId:
          description: Destination site the transfer ships to
          format: uuid
          type: string
        destinationStorageLocationId:
          description: Bin-level destination storage location, when bin-scoped
          format: uuid
          type: string
        dispatchedBy:
          description: User who dispatched the order
          type: string
        lines:
          description: SKU lines
          items:
            $ref: '#/components/schemas/TransferOrderLineResponse'
          type: array
        notes:
          description: Free-text notes
          type: string
        shortCloseDisposition:
          description: Disposition of the undelivered remainder; set only when SHORT_CLOSED
          enum:
          - LOST_IN_TRANSIT
          - RETURNED_TO_SOURCE
          type: string
        shortCloseNotes:
          description: Short-close notes; set only when SHORT_CLOSED
          type: string
        shortCloseReason:
          description: Short-close reason; set only when SHORT_CLOSED
          type: string
        shortClosedAt:
          description: When the order was short-closed; set only when SHORT_CLOSED
          format: date-time
          type: string
        shortClosedBy:
          description: User who short-closed the order; set only when SHORT_CLOSED
          type: string
        sourceLocationId:
          description: Source site the transfer ships from
          format: uuid
          type: string
        sourceStorageLocationId:
          description: Bin-level source storage location, when bin-scoped
          format: uuid
          type: string
        status:
          description: Lifecycle status
          enum:
          - DRAFT
          - APPROVED
          - DISPATCHED
          - PARTIALLY_RECEIVED
          - RECEIVED
          - SHORT_CLOSED
          - CANCELLED
          type: string
        transferOrderId:
          description: Transfer order identifier
          format: uuid
          type: string
        updatedAt:
          description: Last update timestamp
          format: date-time
          type: string
      type: object
    TransferQuantityLineRequest:
      description: Explicit per-line quantity for a transfer dispatch or receive
      properties:
        lineId:
          description: Transfer order line identifier
          format: uuid
          type: string
        lotNumber:
          description: Lot number the dispatched units are drawn from (dispatch only; receive and short-close reuse the lot recorded at dispatch). Required (422 LOT_NUMBER_REQUIRED) when the SKU is LOT-tracked; must reference an existing (422 LOT_UNKNOWN) ACTIVE (422 LOT_NOT_AVAILABLE) lot. Ignored for untracked SKUs
          example: LOT-2026-A
          maxLength: 128
          minLength: 0
          type: string
        quantity:
          description: Quantity to dispatch/receive on this line; must be positive
          format: int32
          minimum: 0
          type: integer
      required:
      - lineId
      - quantity
      type: object
    UpdateCycleCountPlanStatusRequest:
      description: Request to transition a cycle count plan to a new lifecycle status
      properties:
        status:
          description: Target lifecycle status
          enum:
          - PLANNED
          - STARTED
          - COMPLETED_PENDING_APPROVAL
          - APPROVED
          - REJECTED
          - CANCELLED
          example: STARTED
          type: string
      required:
      - status
      type: object
    UpdateCycleCountScheduleRequest:
      description: Partial update of a recurring cycle-count schedule; null fields are left unchanged
      properties:
        active:
          description: Whether the schedule is active
          example: true
          type: boolean
        autoCreatePlan:
          description: Whether the scheduled runner auto-creates the next cycle-count plan when due
          example: false
          type: boolean
        frequencyDays:
          description: New count frequency in days
          example: 14
          format: int32
          minimum: 0
          type: integer
        nextDueDate:
          description: New next due date
          example: 2026-09-01
          format: date
          type: string
        skuCategory:
          description: New SKU-category filter
          example: BRAKES
          maxLength: 100
          minLength: 0
          type: string
        zoneId:
          description: New single-zone filter within the location
          example: 01960003-0000-7000-8000-000000000002
          format: uuid
          type: string
      type: object
    UpdateCycleCountToleranceRequest:
      description: Request to update a tolerance configuration's bounds or active state
      properties:
        absoluteTolerance:
          description: Maximum acceptable absolute variance, in the product's base UoM. Null clears it.
          example: 50
          minimum: 0
          type: number
        active:
          description: Whether this configuration is in effect
          example: true
          type: boolean
        percentageTolerance:
          description: Maximum acceptable variance as a percentage of book quantity
          example: 1.5
          minimum: 0
          type: number
      required:
      - active
      type: object
    UpdatePickListStatusRequest:
      description: Request to transition a pick list to a new lifecycle status
      properties:
        status:
          description: Target status to apply to the pick list
          enum:
          - DRAFT
          - READY_TO_PICK
          - IN_PROGRESS
          - COMPLETED
          - CANCELLED
          example: IN_PROGRESS
          type: string
      required:
      - status
      type: object
    UpdateReplenishmentPolicyRequest:
      description: Full-replace update of a replenishment policy's thresholds and tuning fields. Omitted optional fields are cleared or reset to defaults; location, SKU, and snooze state are not updatable here.
      properties:
        active:
          description: Whether the policy participates in replenishment evaluation; omit to reset to true
          example: true
          type: boolean
        leadTimeDaysOverride:
          description: Per-policy lead-time override in days; omit to clear (vendor-feed/default lead time applies)
          example: 3
          format: int32
          minimum: 0
          type: integer
        maximumQuantity:
          description: Maximum on-hand quantity replenishment aims to restock up to
          example: 50
          format: int32
          minimum: 1
          type: integer
        minimumLessThanMaximum:
          type: boolean
        minimumQuantity:
          description: Minimum on-hand quantity that triggers replenishment when reached
          example: 5
          format: int32
          minimum: 0
          type: integer
        orderMultiple:
          description: Round the computed replenishment quantity up to the nearest multiple of this value; omit to clear (no rounding)
          example: 6
          format: int32
          minimum: 1
          type: integer
        preferredSourceType:
          description: Preferred sourcing channel for replenishing this policy's pick face; omit to reset to EITHER
          enum:
          - INTERNAL_TRANSFER
          - PURCHASE
          - EITHER
          example: EITHER
          type: string
      required:
      - maximumQuantity
      - minimumQuantity
      type: object
    ValuationReportResponse:
      description: Inventory valuation report with SKU-level rows and a total
      properties:
        asOf:
          description: Historical instant the valuation was reconstructed at, or null for current state
          format: date-time
          type: string
        locationId:
          description: Location filter applied, or null for all sites
          format: uuid
          type: string
        rows:
          description: SKU-level valuation rows
          items:
            $ref: '#/components/schemas/ValuationRow'
          type: array
        totalOnHandValue:
          description: Sum of onHandValue across all rows (uncosted rows contribute 0)
          example: 120.0
          type: number
      required:
      - rows
      - totalOnHandValue
      type: object
    ValuationRow:
      description: SKU-level inventory valuation row
      properties:
        costingMethod:
          description: Resolved costing method for the SKU (AVERAGE or STANDARD)
          example: AVERAGE
          type: string
        onHand:
          description: On-hand quantity contributing to the value (site-scoped when a location filter is applied)
          example: 20
          type: number
        onHandValue:
          description: 'On-hand value: onHand × unitCostCurrent (0 when uncosted)'
          example: 120.0
          type: number
        stockItemId:
          description: SKU / stock-item identifier
          type: string
        uncosted:
          description: True when the SKU has no derivable unit cost, so its value is reported as 0
          example: false
          type: boolean
        unitCostCurrent:
          description: Current unit cost per the resolved method; null when the SKU is uncosted
          example: 6.0
          type: number
      required:
      - costingMethod
      - onHand
      - onHandValue
      - stockItemId
      - uncosted
      type: object
    VarianceSummaryResponse:
      description: Summary of a quantity variance detected on a single receiving line
      properties:
        expectedQuantity:
          description: Quantity originally expected on the receiving line
          example: 10
          type: number
        lineId:
          description: Identifier of the receiving line that had a variance
          example: 01960003-0000-7000-8000-000000000002
          format: uuid
          type: string
        productId:
          description: Identifier of the product on the receiving line
          example: 01960003-0000-7000-8000-000000000003
          type: string
        receivedQuantity:
          description: Quantity actually received on the line
          example: 8
          type: number
        unitOfMeasure:
          description: UoM the line was keyed in when it differed from the product's base UoM; null means the product's base UoM
          example: CASE
          type: string
        varianceQuantity:
          description: Difference between received and expected quantity for the line
          example: 2
          type: number
        varianceType:
          description: Type of variance detected, such as OVER or SHORT
          example: SHORT
          type: string
      required:
      - expectedQuantity
      - lineId
      - productId
      - receivedQuantity
      - varianceQuantity
      - varianceType
      type: object
    WarrantyHoldRef:
      description: A warranty part-return hold linked to the serial
      properties:
        claimId:
          description: Warranty claim the part return belongs to
          format: uuid
          type: string
        disposition:
          description: Disposition of the returned part, when known
          type: string
        partReturnId:
          description: Identifier of the warranty part-return hold
          format: uuid
          type: string
        requestedAt:
          description: When the part return was requested
          format: date-time
          type: string
        shippedAt:
          description: When the part was shipped back to the provider
          format: date-time
          type: string
        status:
          description: Hold status
          example: REQUESTED
          type: string
      required:
      - partReturnId
      - status
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
