        itemSKU:
          type: string
          description: Stock item (SKU) to purchase
          example: SKU-12345
        locationId:
          type: string
          format: uuid
          description: Destination location the purchased stock is for
          example: 01980003-0000-7000-8000-000000000003
        suggestedQuantity:
          type: integer
          format: int32
          description: Quantity to purchase after MOQ/pack/order-multiple rounding
          example: 24
        suggestedVendorType:
          type: string
          description: Which normalized vendor feed the selected vendor came from; null when no vendor was selectable
          enum:
          - MANUFACTURER
          - DISTRIBUTOR
          example: MANUFACTURER
        vendorRefId:
          type: string
          format: uuid
          description: Selected manufacturer or distributor identifier; null when no vendor was selectable
          example: 01980003-0000-7000-8000-000000000004
        unitCostMinor:
          type: integer
          format: int64
          description: Per-unit cost in minor currency units from the vendor feed; null when the feed carries no price
          example: 1499
        unitCostCurrency:
          type: string
          description: ISO 4217 currency of unitCostMinor
          example: USD
        vendorPackSize:
          type: integer
          format: int32
          description: Selected vendor's pack size captured at suggestion time
          example: 6
        leadTimeDays:
          type: integer
          format: int32
          description: Vendor lead-time estimate in days (MAX-day estimate, consistent with the replenishment horizon math)
          example: 5
        earliestExpectedDate:
          type: string
          format: date
          description: Earliest date the purchase could plausibly arrive (suggestion date + lead time)
          example: 2026-08-01
        selectionReason:
          type: string
          description: Explainable record of the deterministic vendor-ranking inputs
          example: 'MANUFACTURER 0198…: avail 40>=12, lead 5d, price 1499 USD-minor/unit; beat DISTRIBUTOR 0199…: avail 30>=12, lead 7d, price n/a'
        status:
          type: string
          description: Lifecycle status
          enum:
          - SUGGESTED
          - ACCEPTED
          - CONVERTED
          - DISMISSED
          example: SUGGESTED
        dismissalReason:
          type: string
          description: Human-entered reason captured when the suggestion was dismissed
          example: Vendor contract under renegotiation
        convertedPurchaseOrderId:
          type: string
          format: uuid
          description: The DRAFT purchase order the suggestion was converted into
          example: 01980003-0000-7000-8000-000000000005
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
          example: 2026-07-23 09:30:00+00:00
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: 2026-07-23 09:30:00+00:00
      required:
      - createdAt
      - itemSKU
      - locationId
      - policyId
      - selectionReason
      - status
      - suggestedQuantity
      - suggestionId
      - updatedAt
    ConvertPurchaseSuggestionsRequest:
      type: object
      description: Request to convert one or more ACCEPTED purchase suggestions into a single multi-line DRAFT purchase order. All suggestions must be ACCEPTED and share one vendor
      properties:
        suggestionIds:
          type: array
          description: Identifiers of the ACCEPTED suggestions to convert; all must share one vendor
          items:
            type: string
            format: uuid
          minItems: 1
      required:
      - suggestionIds
    ConvertPurchaseSuggestionsResponse:
      type: object
      description: Result of converting accepted purchase suggestions into a DRAFT purchase order
      properties:
        purchaseOrderId:
          type: string
          format: uuid
          description: Identifier of the created DRAFT purchase order
          example: 01980003-0000-7000-8000-000000000005
        poNumber:
          type: string
          description: Human-readable purchase order number
          example: PO-000123
        purchaseOrderStatus:
          type: string
          description: Status of the created purchase order (always DRAFT; the existing approval workflow applies)
          example: DRAFT
        convertedSuggestionIds:
          type: array
          description: Suggestions stamped CONVERTED by this call
          items:
            type: string
            format: uuid
      required:
      - convertedSuggestionIds
      - poNumber
      - purchaseOrderId
      - purchaseOrderStatus
    CreatePurchaseOrderRequest:
      type: object
      description: Request to create a new purchase order for a vendor with one or more order lines
      properties:
        vendorId:
          type: string
          format: uuid
          description: Identifier of the vendor the purchase order is placed with
          example: 01960003-0000-7000-8000-000000000001
        poDate:
          type: string
          format: date
          description: Date the purchase order is issued
          example: 2026-01-15
        currency:
          type: string
          description: ISO 4217 currency code the purchase order is denominated in
          example: USD
          minLength: 1
        paymentTermsId:
          type: string
          description: Identifier of the payment terms applied to this purchase order
          example: NET30
        expectedDeliveryDate:
          type: string
          format: date
          description: Date the ordered goods are expected to be delivered
          example: 2026-01-29
        shipToLocationId:
          type: string
          format: uuid
          description: Identifier of the location the goods should be shipped to
          example: 01960003-0000-7000-8000-000000000002
        requestedBy:
          type: string
          description: Identifier or name of the person who requested the purchase order
          example: user-jdoe
        comment:
          type: string
          description: Free-text comment providing additional context for the purchase order
          example: Urgent restock for spring promotion
        lines:
          type: array
          description: Order lines detailing the SKUs, quantities, and costs being purchased
          items:
            $ref: '#/components/schemas/PurchaseOrderLineRequest'
          minItems: 1
      required:
      - currency
      - lines
      - poDate
      - vendorId
    PurchaseOrderLineRequest:
      type: object
      description: A single line item on a purchase order request, identifying the SKU, quantity, and unit cost
      properties:
        lineNumber:
          type: integer
          format: int32
          description: Sequential line number identifying this line within the purchase order
          example: 1
        skuId:
          type: string
          format: uuid
          description: Identifier of the SKU being ordered on this line
          example: 01960003-0000-7000-8000-000000000010
        description:
          type: string
          description: Human-readable description of the item being ordered
          example: Stainless steel water bottle, 750ml
          minLength: 1
        quantity:
          type: number
          description: Quantity of the item being ordered on this line, in the product's base UoM. Required unless documentUom/documentQuantity are supplied, in which case the base quantity is derived and this field is ignored
          example: 12
        unitCostMinor:
          type: integer
          format: int64
          description: Unit cost of the item in the smallest currency unit (e.g. cents)
          example: 1499
        taxCodeId:
          type: string
          description: Identifier of the tax code applied to this line
          example: TAX-STD
        glAccountId:
          type: string
          description: Identifier of the general ledger account this line posts to
          example: GL-5000
        documentUom:
          type: string
          description: Optional UoM the line is keyed in (e.g. CASE). When present, documentQuantity is converted to the product's base UoM at derivation time via the catalog conversion factors; unitCostMinor then refers to one documentUom unit. A UoM with no conversion path is rejected with 422 UOM_CONVERSION_UNDEFINED
          example: CASE
        documentQuantity:
          type: number
          description: Quantity ordered expressed in documentUom; must be supplied together with documentUom
          example: 1
      required:
      - description
      - lineNumber
      - unitCostMinor
    PurchaseOrderLineResponse:
      type: object
      description: A single line item returned as part of a purchase order
      properties:
        lineId:
          type: string
          format: uuid
          description: Unique identifier of this purchase order line
          example: 01960003-0000-7000-8000-000000000020
        lineNumber:
          type: integer
          format: int32
          description: Sequential line number identifying this line within the purchase order
          example: 1
        skuId:
          type: string
          format: uuid
          description: Identifier of the SKU on this line
          example: 01960003-0000-7000-8000-000000000010
        description:
          type: string
          description: Human-readable description of the item on this line
          example: Stainless steel water bottle, 750ml
        quantityDecimal:
          type: number
          description: Quantity ordered on this line
          example: 12
        unitCostMinor:
          type: integer
          format: int64
          description: Unit cost of the item in the smallest currency unit (e.g. cents)
          example: 1499
        lineTotalMinor:
          type: integer
          format: int64
          description: Total cost of this line in the smallest currency unit (e.g. cents)
          example: 17988
        taxMinor:
          type: integer
          format: int64
          description: Tax amount for this line in the smallest currency unit (e.g. cents)
          example: 1439
        openQuantityDecimal:
          type: number
          description: Quantity on this line not yet received
          example: 4
        documentUom:
          type: string
          description: UoM the line was keyed in when it differed from the product's base UoM
          example: CASE
        documentQuantity:
          type: number
          description: Quantity as keyed in documentUom; quantityDecimal holds the derived base quantity
          example: 1
        conversionFactor:
          type: number
          description: Effective base-per-document-unit conversion factor applied at derivation time
          example: 12
      required:
      - lineId
      - lineNumber
    PurchaseOrderResponse:
      type: object
      description: Full representation of a purchase order, including header totals and line items
      properties:
        purchaseOrderId:
          type: string
          format: uuid
          description: Unique identifier of the purchase order
          example: 01960003-0000-7000-8000-000000000001
        vendorId:
          type: string
          format: uuid
          description: Identifier of the vendor the purchase order is placed with
          example: 01960003-0000-7000-8000-000000000002
        poNumber:
          type: string
          description: Human-readable purchase order number
          example: PO-2026-00042
        status:
          type: string
          description: Current lifecycle status of the purchase order
          enum:
          - DRAFT
          - APPROVED
          - PARTIALLY_RECEIVED
          - FULLY_RECEIVED
          - CLOSED
          - CANCELLED
          example: APPROVED
        versionNumber:
          type: integer
          format: int32
          description: Revision/version number of the purchase order, incremented on each revision
          example: 1
        currency:
          type: string
          description: ISO 4217 currency code the purchase order is denominated in
          example: USD
        subtotalMinor:
          type: integer
          format: int64
          description: Sum of line totals before tax in the smallest currency unit (e.g. cents)
          example: 17988
        taxMinor:
          type: integer
          format: int64
          description: Total tax amount in the smallest currency unit (e.g. cents)
          example: 1439
        grandTotalMinor:
          type: integer
          format: int64
          description: Grand total including tax in the smallest currency unit (e.g. cents)
          example: 19427
        openBalanceMinor:
          type: integer
          format: int64
          description: Remaining unpaid/unreceived balance in the smallest currency unit (e.g. cents)
          example: 19427
        shipToLocationId:
          type: string
          format: uuid
          description: Identifier of the location the goods are shipped to
          example: 01960003-0000-7000-8000-000000000003
        paymentTermsId:
          type: string
          description: Identifier of the payment terms applied to this purchase order
          example: NET30
        poDate:
          type: string
          format: date
          description: Date the purchase order was issued
          example: 2026-01-15
        expectedDeliveryDate:
          type: string
          format: date
          description: Date the ordered goods are expected to be delivered
          example: 2026-01-29
        requestedBy:
          type: string
          description: Identifier or name of the person who requested the purchase order
          example: user-jdoe
        comment:
          type: string
          description: Free-text comment providing additional context for the purchase order
          example: Urgent restock for spring promotion
        approverId:
          type: string
          description: Identifier of the person who approved the purchase order
          example: user-asmith
        approvalTimestamp:
          type: string
          format: date-time
          description: Timestamp at which the purchase order was approved
          example: 2026-01-15 09:30:00+00:00
        approvalNotes:
          type: string
          description: Notes recorded by the approver explaining the approval decision
          example: Approved within budget for Q1 restock
        encumbranceRef:
          type: string
          description: Reference to the financial encumbrance reserved for this purchase order
          example: ENC-2026-00042
        createdBy:
          type: string
          description: Identifier of the user who created the purchase order
          example: user-jdoe
        updatedBy:
          type: string
          description: Identifier of the user who last updated the purchase order
          example: user-asmith
        createdAt:
          type: string
          format: date-time
          description: Timestamp at which the purchase order was created
          example: 2026-01-15 09:00:00+00:00
        updatedAt:
          type: string
          format: date-time
          description: Timestamp at which the purchase order was last updated
          example: 2026-01-15 09:30:00+00:00
        lines:
          type: array
          description: Line items belonging to this purchase order
          items:
            $ref: '#/components/schemas/PurchaseOrderLineResponse'
      required:
      - createdAt
      - currency
      - poNumber
      - purchaseOrderId
      - status
      - updatedAt
      - vendorId
      - versionNumber
    RevisePurchaseOrderRequest:
      type: object
      description: Request to revise an existing purchase order, replacing its lines and recording a revision reason
      properties:
        poDate:
          type: string
          format: date
          description: Date the revised purchase order is issued
          example: 2026-01-20
        paymentTermsId:
          type: string
          description: Identifier of the payment terms applied to the revised purchase order
          example: NET30
        expectedDeliveryDate:
          type: string
          format: date
          description: Date the ordered goods are expected to be delivered
          example: 2026-02-03
        shipToLocationId:
          type: string
          format: uuid
          description: Identifier of the location the goods should be shipped to
          example: 01960003-0000-7000-8000-000000000003
        requestedBy:
          type: string
          description: Identifier or name of the person who requested the revision
          example: user-jdoe
        comment:
          type: string
          description: Free-text comment providing additional context for the revised purchase order
          example: Increased quantities after vendor confirmed availability
        lines:
          type: array
          description: Order lines replacing the existing purchase order lines
          items:
            $ref: '#/components/schemas/PurchaseOrderLineRequest'
          minItems: 1
        revisionReason:
          type: string
