          example: 01960003-0000-7000-8000-000000000002
          format: uuid
          type: string
        maxDays:
          description: Maximum lead-time in days
          example: 5
          format: int32
          type: integer
        minDays:
          description: Minimum lead-time in days
          example: 2
          format: int32
          type: integer
        productId:
          description: Product identifier
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        source:
          description: Source of lead-time data
          example: INVENTORY
          type: string
