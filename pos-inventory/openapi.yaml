      summary: Get tasks assigned to an auditor
      description: 'Returns every cycle count task assigned to one auditor, regardless of task status.

        Use this tool to build an auditor''s work queue and discover taskIds; use getCycleCountTask instead when the taskId is already known.

        Preconditions: none; an auditor with no assignments yields an empty array.

        Required inputs: auditorId (string) as a path parameter; there is no request body, paging or filtering.

