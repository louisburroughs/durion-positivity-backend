  /v1/inventory/cycleCountAdjustments:
    get:
      description: 'Returns every cycle count adjustment in one lifecycle status.

        Use this tool to browse adjustments by status; do not use listPendingCycleCountAdjustments, which returns only the pending-approval subset without a parameter, or countPendingCycleCountAdjustments, which returns just their number.

        Preconditions: none.

        Required inputs: status is an optional query parameter (PENDING_APPROVAL, AUTO_APPROVED, APPROVED, POSTED, REJECTED or FAILED) and defaults to PENDING_APPROVAL when omitted; there is no paging.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 with an empty array when no adjustments match, so an empty result is not an error condition.

        '
      operationId: listCycleCountAdjustments
      parameters:
      - description: Filter by adjustment status
        in: query
        name: status
        required: false
        schema:
          enum:
          - PENDING_APPROVAL
          - AUTO_APPROVED
          - APPROVED
          - POSTED
          - REJECTED
          - FAILED
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AdjustmentResponse'
                type: array
          description: Adjustments retrieved
      security:
      - bearerAuth:
        - inventory:adjustment:view
        - inventory:adjustment:approve
      summary: List adjustments by status
      tags:
      - Cycle Count Adjustments
      x-required-permissions:
      - inventory:adjustment:view
      - inventory:adjustment:approve
    post:
      description: 'Creates an inventory adjustment from a cycle count variance and evaluates it against the configured approval thresholds: below all thresholds it is AUTO_APPROVED and its COUNT_VARIANCE_IN or COUNT_VARIANCE_OUT entry posts to the inventory ledger in the same transaction, otherwise it enters PENDING_APPROVAL with a required approval tier.

        Use this tool to settle a counted variance; do not use submitCycleCount, which only records a count, and do not use approveCycleCountAdjustment, which acts on an adjustment that already exists.

        Preconditions: countedQuantity must differ from quantityOnHandBefore (a zero variance is rejected), a supplied taskId must reference an existing cycle count task, and the auto-approve path additionally requires the linked task to have no unreviewed in-window stock movements.

        Required inputs: stockItemId (UUID), reasonCode, countedQuantity, quantityOnHandBefore, costAtTimeOfAdjustment and createdByUserId; taskId is optional but enables conflict detection; the posted unit cost prefers the costing engine''s per-SKU running cost and falls back to costAtTimeOfAdjustment only for a SKU the engine has not costed.

        Emits an INVENTORY_CYCLE_COUNT_ADJUSTMENT_CREATE event, and an auto-approved posting changes on-hand immediately.

        Returns 400 when the counted quantity matches the system quantity, 404 when the referenced task does not exist, and 409 (CYCLE_COUNT_CONFLICT) when auto-approval detects in-window movements — the task is flagged CONFLICT and a reviewer must explicitly recount or approve with recomputation.

        '
      operationId: createCycleCountAdjustment
      requestBody:
        content:
          application/json:
            examples:
              Task-linked shortage:
                description: Task-linked shortage
                value:
                  costAtTimeOfAdjustment: 12.5
                  countedQuantity: 12
                  createdByUserId: user-10042
                  quantityOnHandBefore: 15
                  reasonCode: CYCLE_COUNT_VARIANCE
                  stockItemId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  taskId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
            schema:
              $ref: '#/components/schemas/CreateAdjustmentRequest'
        description: Cycle count variance to turn into an inventory adjustment, with the before/after quantities and the fallback unit cost.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdjustmentResponse'
          description: Adjustment created successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdjustmentResponse'
          description: Invalid request or no variance detected
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Referenced cycle count task not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: In-window stock movements detected on auto-approval (CYCLE_COUNT_CONFLICT)
      security:
      - bearerAuth:
        - inventory:adjustment:create
      summary: Create cycle count adjustment
      tags:
      - Cycle Count Adjustments
      x-required-permissions:
      - inventory:adjustment:create
