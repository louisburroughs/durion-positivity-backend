        scheduleId:
          description: Identifier of the recurring schedule that created this plan (null for manual plans)
          example: 01960003-0000-7000-8000-000000000004
          format: uuid
          type: string
        scheduledDate:
          description: Date on which the cycle count is scheduled to occur
          example: 2026-01-15
          format: date
          type: string
        status:
