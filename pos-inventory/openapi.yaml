          - DAMAGED
          - EXPIRED
          - LOST
          - RECALLED
          - CONTAMINATED
          - WARRANTY_DESTROYED
          - OTHER
      - name: status
        in: query
        description: Filter by lifecycle status
        required: false
        schema:
          type: string
          enum:
          - PENDING_APPROVAL
          - AUTO_APPROVED
          - APPROVED
          - POSTED
          - REJECTED
          - FAILED
      - name: locationId
        in: query
        description: Filter by location
        required: false
        schema:
          type: string
          format: uuid
