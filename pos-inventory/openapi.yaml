        Use this tool to find claimable putaway work before claimPutawayTask; tasks already ASSIGNED or COMPLETED never appear here, so do not use it to check a specific task''s progress.

        Preconditions: none; tasks exist only after generatePutawayTasks has run for a receipt.

        Required inputs: none; locationId and storageLocationId optionally scope the list by source location, and storageLocationId wins when both are given.

