  /v1/inventory/backorders:
    get:
      tags:
      - Backorders
      summary: List backorders
      description: 'Lists backorders — unfulfilled workorder-line demand held open until availability covers it — newest first.

        Use this tool to monitor open shortages awaiting stock; use getBackorder instead when the backorderId is already known, and note backorders are opened by the shortage flows (resolveShortage with BACKORDER), not by any direct create endpoint.

        Preconditions: none; an empty result is not an error.

        Required inputs: none — status (OPEN, RESOLVED or CANCELLED), sku, locationId and workorderLineId are optional filters combined with AND.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 with an empty array when nothing matches.

        '
      operationId: listBackorders
      parameters:
      - name: status
        in: query
        description: Filter by lifecycle status
        required: false
        schema:
          type: string
          enum:
          - OPEN
          - RESOLVED
          - CANCELLED
      - name: sku
        in: query
        description: Filter by SKU / stock-item identifier
        required: false
        schema:
          type: string
      - name: locationId
        in: query
        description: Filter by site
        required: false
        schema:
          type: string
          format: uuid
      - name: workorderLineId
