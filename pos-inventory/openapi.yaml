      - allocatedQty
      - asOfTimestamp
      - atpQty
      - locationId
      - onHandQty
      - productId
      - uom
    CreateAsnLineRequest:
      type: object
      description: Request payload describing a single line item to include when creating an advance shipping notice (ASN)
      properties:
        poId:
          type: string
          format: uuid
          description: Identifier of the purchase order this ASN line is associated with
          example: 01960003-0000-7000-8000-000000000001
        poLineId:
          type: string
          format: uuid
          description: Identifier of the specific purchase order line this ASN line fulfills
          example: 01960003-0000-7000-8000-000000000002
        sku:
          type: string
          description: Stock keeping unit identifier for the shipped product
          example: SKU-10042
          minLength: 1
        quantityShipped:
          type: number
          description: Quantity of the SKU declared as shipped on the ASN, in the product's base UoM. Required unless documentUom/documentQuantity are supplied, in which case the base quantity is derived and this field is ignored
          example: 12
        unitOfMeasure:
          type: string
          description: Unit of measure for the shipped quantity
          example: EA
        unitCostMinor:
          type: integer
          format: int64
          description: Unit cost of the product expressed in minor currency units (e.g. cents)
          example: 1499
        lotNumber:
          type: string
          description: Lot or batch number associated with the shipped product
          example: LOT-2026-0042
        documentUom:
          type: string
          description: Optional UoM the line is keyed in (e.g. CASE). When present, documentQuantity is converted to the product's base UoM at derivation time; a UoM with no conversion path is rejected with 422 UOM_CONVERSION_UNDEFINED
          example: CASE
        documentQuantity:
          type: number
          description: Quantity shipped expressed in documentUom; must be supplied together with documentUom
          example: 1
      required:
      - poId
      - sku
    CreateAsnRequest:
      type: object
      description: Request payload to create an advance shipping notice (ASN) for an inbound vendor shipment
      properties:
        vendorId:
          type: string
          format: uuid
          description: Identifier of the vendor that issued the shipment
          example: 01960003-0000-7000-8000-000000000001
        asnReferenceNumber:
          type: string
          description: Human-readable reference number assigned to the ASN by the vendor
          example: ASN-2026-000123
          minLength: 1
        relatedPoIds:
          type: array
          description: Identifiers of the purchase orders this shipment relates to
          example:
          - 01960003-0000-7000-8000-000000000002
          items:
            type: string
            format: uuid
          minItems: 1
        shipDate:
          type: string
          format: date
          description: Date the shipment left the vendor
          example: 2026-01-15
        expectedArrivalDate:
          type: string
          format: date
          description: Expected arrival date of the shipment at the destination
          example: 2026-01-20
        lineItems:
          type: array
          description: Line items detailing the SKUs and quantities included in this ASN
          items:
            $ref: '#/components/schemas/CreateAsnLineRequest'
      required:
      - asnReferenceNumber
      - lineItems
      - relatedPoIds
      - vendorId
    AsnLineResponse:
      type: object
      description: A single line item on an advance shipping notice (ASN) response, describing one SKU and its shipped/received quantities
      properties:
        asnLineId:
          type: string
          format: uuid
          description: Unique identifier of the ASN line item
          example: 01960003-0000-7000-8000-000000000001
        poId:
          type: string
          format: uuid
          description: Identifier of the purchase order this ASN line is associated with
          example: 01960003-0000-7000-8000-000000000002
        sku:
          type: string
          description: Stock keeping unit identifier for the shipped product
          example: SKU-10042
        quantityShipped:
          type: number
          description: Quantity of the SKU declared as shipped on the ASN
          example: 12
        quantityReceived:
          type: number
          description: Quantity of the SKU received against this ASN line so far
          example: 8
        unitOfMeasure:
          type: string
          description: Unit of measure for the shipped and received quantities
          example: EA
        lotNumber:
          type: string
          description: Lot or batch number associated with the shipped product
          example: LOT-2026-0042
        documentUom:
          type: string
          description: UoM the line was keyed in when it differed from the product's base UoM
          example: CASE
        documentQuantity:
          type: number
          description: Quantity as keyed in documentUom; quantityShipped holds the derived base quantity
          example: 1
        conversionFactor:
          type: number
          description: Effective base-per-document-unit conversion factor applied at derivation time
          example: 12
      required:
      - asnLineId
      - poId
      - quantityShipped
      - sku
    AsnResponse:
      type: object
      description: Advance shipping notice (ASN) representing an inbound shipment from a vendor, including its line items and lifecycle status
      properties:
        asnId:
          type: string
          format: uuid
          description: Unique identifier of the ASN
          example: 01960003-0000-7000-8000-000000000001
        asnReferenceNumber:
          type: string
          description: Human-readable reference number assigned to the ASN
          example: ASN-2026-000123
        vendorId:
          type: string
          format: uuid
          description: Identifier of the vendor that issued the shipment
          example: 01960003-0000-7000-8000-000000000002
        status:
          type: string
          description: Current lifecycle status of the ASN
          enum:
          - LOADED
          - READY_FOR_RECEIPT
          - PARTIALLY_RECEIVED
          - FULLY_RECEIVED
          - CANCELLED
          example: READY_FOR_RECEIPT
        shipDate:
          type: string
          format: date
          description: Date the shipment left the vendor
          example: 2026-01-15
        expectedArrivalDate:
          type: string
          format: date
          description: Expected arrival date of the shipment at the destination
          example: 2026-01-20
        createdBy:
          type: string
          description: Identifier of the user who created the ASN
          example: user-jdoe
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the ASN was created
          example: 2026-01-15 09:30:00+00:00
        lineItems:
          type: array
          description: Line items detailing the SKUs and quantities included in this ASN
          items:
            $ref: '#/components/schemas/AsnLineResponse'
      required:
      - asnId
      - asnReferenceNumber
      - createdAt
      - status
      - vendorId
    ReallocateRequest:
