paths:
  /v1/inventory/adjustments:
    post:
      description: 'Creates a PENDING inventory adjustment request that must be approved before any stock change posts.

        Use this tool to propose a quantity correction, then post it with approveAdjustmentRequest; do not use createStockMovement, whose ADJUST type is rejected — this two-step workflow is the only correction path.

        Preconditions: none are checked at creation; the SKU, location and quantity are validated for shape only, not against on-hand.

        Required inputs: productSku, locationId (UUID), quantity (integer — positive adds stock, negative removes it) and reasonCode; unitOfMeasure is optional.

        Emits an INVENTORY_ADJUSTMENT_REQUEST_CREATE event; no ledger entry is written and availability is unchanged until approval.

        Returns 201 with the PENDING request, and 400 when productSku, locationId, quantity or reasonCode is missing.

        '
      operationId: createAdjustmentRequest
      requestBody:
        content:
          application/json:
            examples:
              Cycle-count write-off:
                description: Cycle-count write-off
                value:
                  locationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a30
                  productSku: SKU-10042
                  quantity: -3
                  reasonCode: CYCLE_COUNT
                  unitOfMeasure: EACH
            schema:
              $ref: '#/components/schemas/CreateAdjustmentRequestDto'
        description: 'The proposed correction: SKU, location, signed quantity and the reason code justifying it.'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdjustmentRequestResponse'
          description: Adjustment request created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Validation failure
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: User lacks required create permission
      security:
      - bearerAuth:
        - inventory:adjustment:create
      summary: Create adjustment request
      tags:
      - Stock Movements
      x-required-permissions:
      - inventory:adjustment:create
  /v1/inventory/adjustments/{adjustmentRequestId}/approve:
    post:
      description: 'Approves a PENDING adjustment request and posts the resulting ADJUSTMENT_IN or ADJUSTMENT_OUT entry to the inventory ledger.

        Use this tool as the second step of the adjustment workflow, after createAdjustmentRequest; do not use createStockMovement to post corrections, and note approval needs the separate inventory:adjustment:approve authority.

        Preconditions: the adjustment request must exist and still be PENDING.

        Required inputs: adjustmentRequestId (UUID) path parameter; there is no request body.

        Emits an INVENTORY_ADJUSTMENT_REQUEST_APPROVE event; the request is stamped APPROVED with approver and timestamp, and the ledger posting updates the stock summary that availability reads.

        Returns 400 when the adjustment request id is unknown (the lookup failure maps to a validation error rather than 404), and 409 when the request is no longer PENDING.

        '
      operationId: approveAdjustmentRequest
      parameters:
      - in: path
        name: adjustmentRequestId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          description: Adjustment approved
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Validation failure
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: User lacks required approval permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Referenced resource not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Adjustment request is in a conflicting state
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Business rule validation failed
      security:
      - bearerAuth:
        - inventory:adjustment:approve
      summary: Approve adjustment request
      tags:
      - Stock Movements
      x-required-permissions:
      - inventory:adjustment:approve
  /v1/inventory/allocations/reallocate:
    post:
      description: 'Rebalances the allocated quantities of every reservation of one stock item, redistributing the reservations'' current total allocated pool by effective priority.

        Use this tool after a supply or priority change to re-decide which reservations hold stock; do not use promoteReservationAllocation, which hardens a single allocation, and do not use resolveShortage, which creates resolution artifacts for one short allocation.

        Preconditions: none beyond reservations existing for the stock item; the pool redistributed is the current total allocated quantity across those reservations, not ledger on-hand.

        Required inputs: stockItemId (UUID); triggerType (an AllocationAuditReasonCode name, falling back to MANUAL_OVERRIDE when absent or unrecognized) and triggerReferenceId are optional audit fields.

        Emits an INVENTORY_ALLOCATION_REALLOCATE event and writes one allocation-audit row per reservation; ordering is effective priority ascending (1 is critical, and priority ages one step per 24 hours after a 24-hour grace period), then due date, waiting-since, schedule start and creation time, each reservation receives its full required quantity or zero (no partial awards), and no ledger entries are written.

        Returns 400 when stockItemId is missing, and 200 with atpAfterReallocation (ledger on-hand minus total allocated) otherwise.

        '
      operationId: reallocateAllocations
      requestBody:
        content:
          application/json:
            examples:
              Rebalance after replenishment:
                description: Rebalance after replenishment
                value:
                  stockItemId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a01
                  triggerReferenceId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a02
                  triggerType: STOCK_REPLENISHED
            schema:
              $ref: '#/components/schemas/ReallocateRequest'
        description: The stock item to rebalance, with optional audit fields naming what triggered the reallocation.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReallocateResponse'
          description: Reallocation completed
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Validation failure
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: User lacks required reallocation authority
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reallocation failed business validation
      security:
      - bearerAuth:
        - inventory:allocations:reallocate
      summary: Reallocate inventory allocations
      tags:
      - Reallocation
      x-required-permissions:
      - inventory:allocations:reallocate
  /v1/inventory/asns:
    post:
      description: 'Creates an advance shipping notice (ASN) declaring an inbound vendor shipment against one or more approved purchase orders, stored in LOADED status with its declared lines.

        Use this tool when a vendor announces a shipment before it arrives; do not use createGoodsReceipt, which records goods actually received and posts stock, and do not use createReceivingSession, which starts a line-by-line receiving workflow.

        Preconditions: every purchase order in relatedPoIds must exist and be APPROVED, and no ASN may already exist for the same vendorId and asnReferenceNumber pair.

        Required inputs: vendorId (UUID), asnReferenceNumber, relatedPoIds (non-empty) and lineItems each naming poId and sku plus either quantityShipped in base UoM or the documentUom/documentQuantity pair, from which the base quantity is derived; shipDate and expectedArrivalDate are optional.

        Emits an INVENTORY_ASN_CREATE event; no stock is posted and no on-hand quantity changes until a goods receipt or receiving session references the ASN.

        Returns 409 when an ASN with the same vendor and reference number already exists, 400 when a related purchase order is unknown or not APPROVED, and 422 when a documentUom has no conversion path to the product''s base UoM.

        '
      operationId: createAsn
      requestBody:
        content:
          application/json:
            examples:
              Single-line ASN:
                description: Single-line ASN
                value:
                  asnReferenceNumber: ASN-2026-000123
                  expectedArrivalDate: 2026-08-15
                  lineItems:
                  - lotNumber: LOT-2026-0042
                    poId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a02
                    poLineId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a03
                    quantityShipped: 12
                    sku: SKU-10042
                    unitCostMinor: 1499
                    unitOfMeasure: EA
                  relatedPoIds:
                  - 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a02
                  shipDate: 2026-08-10
                  vendorId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a01
            schema:
              $ref: '#/components/schemas/CreateAsnRequest'
        description: 'Shipment declaration from the vendor: the ASN header plus the declared lines.'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsnResponse'
          description: ASN created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Validation failure
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: User lacks required ASN create authority
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ASN conflict (duplicate or state conflict)
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Document UoM has no conversion path to the product's base UoM
      security:
      - bearerAuth:
        - inventory:asn:create
      summary: Create ASN
      tags:
      - ASN
      x-required-permissions:
      - inventory:asn:create
  /v1/inventory/asns/{asnId}:
    get:
      description: 'Returns one advance shipping notice with its status, dates and per-line shipped and received quantities.

        Use this tool when the asnId is already known; use getGoodsReceipt instead to inspect what was actually received on a specific receipt.

        Preconditions: the ASN must exist.

        Required inputs: asnId (UUIDv7) path parameter; there is no request body.

        Emits an INVENTORY_ASN_GET audit event; no stock state changes, this is a read-only projection.

        Returns 404 when no ASN exists for the supplied id.

        '
      operationId: getAsn
      parameters:
      - description: ASN identifier
        in: path
        name: asnId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsnResponse'
          description: ASN returned
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: User lacks required ASN view authority
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ASN not found
      security:
      - bearerAuth:
        - inventory:asn:view
      summary: Get ASN
      tags:
      - ASN
      x-required-permissions:
      - inventory:asn:view
  /v1/inventory/availability:
    get:
      description: 'Returns the same single aggregated availability view as getAvailabilityBySku, wrapped in a one-element array, and takes the query parameter name sku instead of productSku.

        Use this tool only when a caller requires a list-shaped response from the root availability path; use getAvailabilityBySku instead for the plain object form, and getAvailabilityByProduct for a per-location breakdown.

        Preconditions: the SKU must have at least one stock-summary row, meaning it has been received or counted at least once.

        Required inputs: sku (string); locationId and storageLocationId (UUIDs) optionally narrow the scope, sourceType (WAREHOUSE, SUPPLIER or TRANSIT) selects the lookup strategy, and horizon (ISO-8601 instant) bounds the forecast quantities; locationId is only valid when sourceType is WAREHOUSE or omitted.

        No events are emitted and no state changes; ATP here is on-hand minus hard allocations minus expired ACTIVE lot on-hand — soft reservations are not subtracted (ADR-0001).

        Returns 404 when the SKU has no stock-summary rows, and 400 when locationId is combined with a non-WAREHOUSE sourceType (INVALID_PARAM_COMBINATION).

        '
      operationId: listAvailabilityBySku
      parameters:
      - description: Product SKU
        in: query
        name: sku
        required: true
        schema:
          type: string
      - description: Location identifier
        in: query
        name: locationId
        required: false
        schema:
          format: uuid
          type: string
      - description: Storage location identifier (optional; narrows to sub-location)
        in: query
        name: storageLocationId
        required: false
        schema:
          format: uuid
          type: string
      - description: Inventory lookup strategy
        in: query
        name: sourceType
        required: false
        schema:
          enum:
          - WAREHOUSE
          - SUPPLIER
          - TRANSIT
          type: string
      - description: Optional forecast horizon (ISO-8601 instant) bounding incomingQty/outgoingQty; documents without an expected date are excluded from horizon-bounded results.
        in: query
        name: horizon
        required: false
        schema:
          format: date-time
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AvailabilityView'
                type: array
          description: Availability list returned
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request parameters
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: User lacks required read permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Product SKU or location not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unexpected server error
      security:
      - bearerAuth:
        - inventory:on_hand:view
        - inventory:on_hand:search
      summary: Query inventory availability by SKU (list form)
      tags:
      - Inventory Availability
      x-required-permissions:
      - inventory:on_hand:view
      - inventory:on_hand:search
  /v1/inventory/availability/by-sku:
    get:
      description: 'Returns a single aggregated availability view for a SKU: on-hand, allocated, available-to-promise, the derived unit of measure and the forecast quantities incomingQty, outgoingQty and projectedAvailable.

        Use this tool to check whether quantity can be promised, for example before createOrUpdateReservation; use getAvailabilityByProduct instead for a per-location breakdown, and listAvailabilityBySku only when a list-shaped response is required.

        Preconditions: the SKU must have at least one stock-summary row; expired ACTIVE lots stay counted in on-hand but are subtracted from ATP.

        Required inputs: productSku (string); locationId and storageLocationId (UUIDs) optionally narrow the scope (storageLocationId wins when both are given), sourceType (WAREHOUSE, SUPPLIER or TRANSIT) selects the lookup strategy, and horizon (ISO-8601 instant) bounds the forecast quantities; forecast supply is keyed by site, so a storage location is resolved to its parent site for the forecast fields.

        No events are emitted and no state changes; ATP is on-hand minus hard allocations minus expired ACTIVE lot on-hand — soft reservations are not subtracted (ADR-0001).

        Returns 404 when the SKU has no stock-summary rows, and 400 when locationId is combined with a non-WAREHOUSE sourceType (INVALID_PARAM_COMBINATION).

        '
      operationId: getAvailabilityBySku
      parameters:
      - description: Product SKU
        in: query
        name: productSku
        required: true
        schema:
          type: string
      - description: Location identifier
        in: query
        name: locationId
        required: false
        schema:
          format: uuid
          type: string
      - description: Storage location identifier (optional; narrows to sub-location)
        in: query
        name: storageLocationId
        required: false
        schema:
          format: uuid
          type: string
      - description: Inventory lookup strategy. WAREHOUSE = from physical location stock, SUPPLIER = from supplier lead time, TRANSIT = from in-transit supply. When sourceType is WAREHOUSE, locationId narrows to a specific location.
        in: query
        name: sourceType
        required: false
        schema:
          enum:
          - WAREHOUSE
          - SUPPLIER
          - TRANSIT
          type: string
      - description: Optional forecast horizon (ISO-8601 instant) bounding incomingQty/outgoingQty; documents without an expected date are excluded from horizon-bounded results.
        in: query
        name: horizon
        required: false
        schema:
          format: date-time
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityView'
          description: Availability view returned
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request parameters or locationId provided without sourceType=WAREHOUSE
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: User lacks required read permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Product SKU or location not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unexpected server error
      security:
      - bearerAuth:
        - inventory:on_hand:view
        - inventory:on_hand:search
      summary: Query inventory availability by SKU and location
      tags:
      - Inventory Availability
      x-required-permissions:
      - inventory:on_hand:view
      - inventory:on_hand:search
  /v1/inventory/availability/lead-time:
    get:
      description: 'Returns a dynamic lead-time estimate (minDays, maxDays, display text, source and confidence) for a product, preferring the distributor inventory feed (source INVENTORY, confidence HIGH) and falling back to the manufacturer supply feed (source SUPPLY_CHAIN, confidence MEDIUM).

        Use this tool to estimate replenishment timing when stock is short; use getAvailabilityBySku instead for on-hand and ATP quantities.

        Preconditions: at least one normalized feed must carry lead-time data for the product.

        Required inputs: productId (UUID); locationId and storageLocationId (UUIDs) are optional and are echoed into the response scope (storageLocationId wins) but do not filter the feed lookup, and sourceType follows the same WAREHOUSE-only rule as the availability reads.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 404 when no feed carries lead-time data for the product, and 400 when locationId is combined with a non-WAREHOUSE sourceType (INVALID_PARAM_COMBINATION).

        '
      operationId: getInventoryLeadTime
      parameters:
      - description: Product identifier
        in: query
        name: productId
        required: true
        schema:
          format: uuid
          type: string
      - description: Location identifier
        in: query
        name: locationId
        required: false
        schema:
          format: uuid
          type: string
      - description: Storage location identifier (optional; narrows to sub-location)
        in: query
        name: storageLocationId
        required: false
        schema:
          format: uuid
          type: string
      - description: Inventory lookup strategy. WAREHOUSE = from physical location stock, SUPPLIER = from supplier lead time, TRANSIT = from in-transit supply. When sourceType is WAREHOUSE, locationId narrows to a specific location.
        in: query
        name: sourceType
        required: false
        schema:
          enum:
          - WAREHOUSE
          - SUPPLIER
          - TRANSIT
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadTimeView'
          description: Lead-time view returned
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request parameters or locationId provided without sourceType=WAREHOUSE
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: User lacks required read permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Lead-time data not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unexpected server error
      security:
      - bearerAuth:
        - inventory:on_hand:view
        - inventory:on_hand:search
      summary: Query product lead time
      tags:
      - Inventory Availability
      x-required-permissions:
      - inventory:on_hand:view
      - inventory:on_hand:search
  /v1/inventory/availability/{productId}:
    get:
      description: 'Returns per-location availability for a product: on-hand, available-to-promise and the forecast quantities incomingQty, outgoingQty and projectedAvailable computed from open purchase orders, ASNs, reservations and released pick tasks; ATP in this per-location list subtracts hard allocations, soft reservations and expired ACTIVE lot on-hand from on-hand.

        Use this tool when the productId is known and a per-location breakdown is wanted; use getAvailabilityBySku instead for a single aggregated view keyed by SKU, and getInventoryLeadTime for lead-time estimates.

        Preconditions: none for the current view; an asOf request additionally requires the inventory:ledger:view authority because it exposes ledger history.

        Required inputs: productId (UUID) path parameter; horizon (ISO-8601 instant) optionally bounds incomingQty/outgoingQty and excludes documents without an expected date; asOf (ISO-8601 instant) switches to historical on-hand computed by direct ledger aggregation, in which case availableToPromiseQuantity and the forecast fields are null because historical allocation state is not reliably reconstructable.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 400 when asOf is combined with horizon (INVALID_PARAM_COMBINATION) or productId is missing, 403 when an asOf request lacks inventory:ledger:view, and 422 when asOf is in the future (AS_OF_IN_FUTURE).

        '
      operationId: getAvailabilityByProduct
      parameters:
      - description: Product identifier
        in: path
        name: productId
        required: true
        schema:
          format: uuid
          type: string
      - description: Optional forecast horizon (ISO-8601 instant). Bounds incomingQty to supply expected on or before this instant and outgoingQty to reservations due by it; documents without an expected date are excluded from horizon-bounded results.
        in: query
        name: horizon
        required: false
        schema:
          format: date-time
          type: string
      - description: Optional historical instant (ISO-8601). Returns on-hand as of this instant by direct ledger aggregation; ATP and forecast fields are null. Requires 'inventory:ledger:view'; future instants are rejected (422). Cannot be combined with 'horizon'.
        in: query
        name: asOf
        required: false
        schema:
          format: date-time
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LocationAvailabilityDto'
                type: array
          description: Availability returned
        '400':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LocationAvailabilityDto'
                type: array
          description: Invalid product identifier
      security:
      - bearerAuth:
        - inventory:on_hand:view
      summary: Query per-location inventory availability
      tags:
      - Inventory Availability
      x-required-permissions:
      - inventory:on_hand:view
    post:
      description: 'Rejects direct availability writes with 501 NOT_IMPLEMENTED by design: availability is a projection derived from inventory ledger events, and overwriting it would bypass movement validation and break auditability.

        Use this tool for nothing in production flows; record a movement with createStockMovement or raise a correction with createAdjustmentRequest (posted via approveAdjustmentRequest) instead.

        Preconditions: none are evaluated; the request is rejected before any validation.

        Required inputs: productId (UUID) path parameter; any request body is ignored.

        Emits an INVENTORY_AVAILABILITY_UPDATE event recording the rejected attempt; no inventory state changes.

        Returns 501 for every call.

        '
      operationId: updateInventoryAvailability
      parameters:
      - description: Product identifier
        in: path
        name: productId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Ignored body:
                description: Ignored body
            schema:
              type: object
        description: Ignored; the endpoint rejects every call with 501 before reading the body.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryAvailabilityResponse'
          description: Availability updated
        '501':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryAvailabilityResponse'
          description: Not implemented
      security:
      - bearerAuth:
        - inventory:adjustment:create
        - inventory:adjustment:approve
      summary: Update inventory availability
      tags:
      - Inventory Availability
      x-required-permissions:
      - inventory:adjustment:create
      - inventory:adjustment:approve
