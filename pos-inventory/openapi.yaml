  /v1/inventory/valuation:
    get:
      tags:
      - Inventory Valuation
      summary: Get inventory valuation
      description: 'Returns on-hand inventory value per SKU with a total, computing on-hand times the current unit cost derived from each SKU''s resolved costing method — the running average under AVERAGE, the standard price (falling back to the latest-receipt memo) under STANDARD — with uncosted SKUs reported at null unit cost and zero value rather than as errors.

        Use this tool for valuation reporting; use listInventoryLedger instead for the raw movements behind the numbers, and createRevaluation to change a cost rather than read it.

        Preconditions: none for a current valuation; an asOf request additionally requires the inventory:ledger:view authority because it replays ledger history.

        Required inputs: none are mandatory — locationId scopes to one site, sku restricts to one stock item, and asOf (ISO-8601 instant) reconstructs both on-hand and unit cost from the ledger as of that instant.

        No events are emitted and no state changes; this is a read-only projection computed on demand and never persisted.

        Returns 422 when asOf is in the future (AS_OF_IN_FUTURE) or when an uncapped full-catalog asOf request exceeds the configured SKU safety cap (default 1000), and 403 when asOf is requested without inventory:ledger:view.

        '
      operationId: getInventoryValuation
      parameters:
      - name: locationId
        in: query
        description: Restrict valuation to one site
        required: false
        schema:
          type: string
          format: uuid
      - name: sku
        in: query
        description: Restrict valuation to one SKU / stock-item identifier
        required: false
        schema:
          type: string
      - name: asOf
        in: query
        description: Optional historical instant (ISO-8601). Reconstructs on-hand and unit cost from the ledger as of this instant. Requires 'inventory:ledger:view'; future instants are rejected (422).
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Valuation report returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValuationReportResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: User lacks required valuation view authority (or ledger view for as-of)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: As-of instant is in the future
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:valuation:view
      x-required-permissions:
      - inventory:valuation:view
