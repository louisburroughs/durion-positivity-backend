openapi: 3.1.0
info:
  title: Positivity Inventory API
  description: API documentation for the Inventory service, accessible via the API Gateway.
  contact:
    name: Durion Support Services
    email: louis.burroughs@gmail.com
  version: v1
servers:
- url: http://localhost:8086
  description: Generated server url
tags:
- name: Inventory Locations
  description: Read inventory facts for storage locations
- name: Reallocation
  description: Allocation rebalancing endpoints
- name: Cycle Count Plans
  description: Cycle count plan management endpoints
- name: Picking Lists
  description: Picking list command endpoints
- name: Pick Lists
  description: Pick list and pick task management endpoints
- name: Putaway Execution
  description: Execute putaway tasks with validation and audit events
- name: Inventory Reservations
  description: Reserve, promote, and cancel inventory allocations for workorder lines
- name: Shortage Resolution
  description: Shortage resolution recommendation endpoints
- name: Inventory Rollup
  description: Inventory quantities rolled up along the storage-location hierarchy
- name: Inventory Bulk Ingest API
  description: Bulk import inventory adjustment requests
- name: Returns
  description: Inventory return-to-stock endpoints
- name: Inventory Reference Data
  description: Inventory reference-data read endpoints
- name: Cycle Count Operations
  description: Cycle count submission and recount operations
- name: Inventory Management
  description: Operations related to inventory location management
- name: ASN
  description: Advanced Shipping Notice and goods receipt endpoints
- name: Putaway
  description: Putaway task generation and claiming endpoints
- name: Inventory Availability
  description: Inventory availability read/write endpoints
- name: Consumption
  description: Workorder parts consumption endpoints
- name: Cycle Count API
  description: API for cycle count operations and variance tracking
- name: Replenishment
  description: Replenishment task and policy endpoints
- name: Cycle Count Query
  description: Query endpoints for cycle count tasks and history
- name: Purchase Orders
  description: Purchase order creation, lifecycle, and receiving endpoints
- name: Cycle Count Adjustments
  description: Manage inventory adjustments from cycle counts
- name: Receiving
  description: Receiving session creation, item receiving, and cross-dock execution endpoints
- name: Inventory Sites
  description: Site inventory configuration endpoints. Inventory Sites represent physical locations that hold inventory.
- name: Inventory Ledger
  description: Inventory ledger read endpoints
- name: Stock Movements
  description: Inventory ledger movement recording and adjustment endpoints
paths:
  /v1/inventory/sites/{siteId}/defaultLocations:
    get:
      tags:
      - Inventory Sites
      summary: Get site default locations
      description: Returns configured default locations for a site. Stub implementation.
      operationId: getSiteDefaultLocations
      parameters:
      - name: siteId
        in: path
        description: Site identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Default locations returned
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
      security:
      - bearerAuth:
        - inventory:location:view
      x-required-permissions:
      - inventory:location:view
    put:
      tags:
      - Inventory Sites
      summary: Replace site default locations
      description: Replaces the configured default locations for a site. Stub implementation.
      operationId: putSiteDefaultLocations
      parameters:
      - name: siteId
        in: path
        description: Site identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uuid
      responses:
        '200':
          description: Default locations replaced
        '501':
          description: Not implemented
      security:
      - bearerAuth:
        - inventory:location:admin
      x-required-permissions:
      - inventory:location:admin
  /v1/inventory/stock-movements:
    post:
      tags:
      - Stock Movements
      summary: Record a stock movement
      description: Records a RECEIVE, PUT_AWAY, PICK, ISSUE, RETURN, or TRANSFER movement in the inventory ledger.
      operationId: recordMovement
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordMovementRequest'
        required: true
      responses:
        '201':
          description: Movement recorded
        '400':
          description: Validation failure
        '422':
          description: Insufficient stock
      security:
      - bearerAuth:
        - inventory:stock_movement:create
      x-required-permissions:
      - inventory:stock_movement:create
  /v1/inventory/shortage/resolve:
    post:
      tags:
      - Shortage Resolution
      summary: Resolve shortage
      description: Resolves inventory shortage using a selected strategy.
      operationId: resolveShortage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShortageResolveRequest'
        required: true
      responses:
        '200':
          description: Shortage resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortageResolutionResultDto'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: User lacks required shortage resolution authority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Unable to resolve shortage under current constraints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:shortage:resolve
      x-required-permissions:
      - inventory:shortage:resolve
  /v1/inventory/returns/submit-to-stock:
    post:
      tags:
      - Returns
      summary: Submit return to stock
      description: Submits inventory returns to stock.
      operationId: submitReturnToStock
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnSubmitRequest'
        required: true
      responses:
        '202':
          description: Return submitted and accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnSubmissionResultDto'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: User lacks required return write authority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Return submission violates business policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:return:write
      x-required-permissions:
      - inventory:return:write
  /v1/inventory/reservations:
    post:
      tags:
      - Inventory Reservations
      summary: Create or update a reservation
      description: Creates a reservation for a workorder line or updates an existing reservation with the requested quantity
      operationId: createOrUpdateReservation
      requestBody:
        description: Reservation create/update payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
        required: true
      responses:
        '201':
          description: Reservation created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: User lacks required reservation authority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Business rule validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:adjustment:create
      x-required-permissions:
      - inventory:adjustment:create
  /v1/inventory/reservations/{allocationId}/promote:
    post:
      tags:
      - Inventory Reservations
      summary: Promote allocation to hard
      description: Promotes an existing allocation to HARD state when ATP is sufficient. Requires a storageLocationId; the hardened allocation is pinned to that storage location and an ALLOCATION_CREATED ledger event is recorded against it. A repeat promote of an already-HARD allocation keeps its original location and writes no duplicate event.
      operationId: promoteToHard
      parameters:
      - name: allocationId
        in: path
        description: Allocation identifier to promote
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Promotion request details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteAllocationRequest'
        required: true
      responses:
        '200':
          description: Allocation promoted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: User lacks required reservation authority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Allocation, reservation, or storage location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Insufficient ATP or business rule validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:adjustment:create
      x-required-permissions:
      - inventory:adjustment:create
  /v1/inventory/replenishment/policies:
    get:
      tags:
      - Replenishment
      summary: List replenishment policies
      description: Returns configured replenishment policies.
      operationId: listReplenishmentPolicies
      parameters:
      - name: locationId
        in: query
        description: Location identifier
        required: false
        schema:
          type: string
          format: uuid
      - name: pageable
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Pageable'
      responses:
        '200':
          description: Replenishment policies returned (paged)
          content:
            application/json:
              schema:
                type: string
                description: Page of replenishment policies
      security:
      - bearerAuth:
        - inventory:on_hand:view
      x-required-permissions:
      - inventory:on_hand:view
    post:
      tags:
      - Replenishment
      summary: Create replenishment policy
      description: Creates a replenishment policy used to generate replenishment tasks.
      operationId: createReplenishmentPolicy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReplenishmentPolicyRequest'
        required: true
      responses:
        '201':
          description: Replenishment policy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplenishmentPolicyResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplenishmentPolicyResponse'
      security:
      - bearerAuth:
        - inventory:adjustment:create
      x-required-permissions:
      - inventory:adjustment:create
  /v1/inventory/receiving/sessions:
    post:
      tags:
      - Receiving
      summary: Create receiving session
      description: Creates a receiving session from a source document (PO/ASN) using MANUAL or SCAN entry mode
      operationId: createReceivingSession
      requestBody:
        description: Receiving session creation payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReceivingSessionRequest'
        required: true
      responses:
        '201':
          description: Receiving session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivingSessionResponse'
        '400':
          description: Validation failure or source document already fully received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: User lacks required receiving:create authority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Source document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:receiving:create
      x-required-permissions:
      - inventory:receiving:create
  /v1/inventory/receiving/sessions/{sessionId}/receive:
    post:
      tags:
      - Receiving
      summary: Receive items into staging
      description: Records received quantities for receiving session lines and generates receipt ledger/variance records
      operationId: receiveItemsIntoStaging
      parameters:
      - name: sessionId
        in: path
        description: Receiving session identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Receive lines payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiveItemsRequest'
        required: true
      responses:
        '200':
          description: Items received successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiveItemsResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: User lacks required receiving:complete authority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Receiving session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:receiving:complete
      x-required-permissions:
      - inventory:receiving:complete
  /v1/inventory/receiving/sessions/{sessionId}/lines/{lineId}/cross-dock:
    post:
      tags:
      - Receiving
      summary: Cross-dock receiving line to workorder
      description: Cross-docks received quantity from a session line directly to a workorder line with atomic receipt and issue ledger events
      operationId: crossDockLineToWorkorder
      parameters:
      - name: sessionId
        in: path
        description: Receiving session identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: lineId
        in: path
        description: Receiving line identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Cross-dock request payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrossDockRequest'
        required: true
      responses:
        '200':
          description: Cross-dock completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrossDockResponse'
        '400':
          description: Invalid request or closed workorder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: User lacks required authority or part-match override permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Receiving session or line not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:receiving:complete
        - inventory:issue:parts
      x-required-permissions:
      - inventory:receiving:complete
      - inventory:issue:parts
  /v1/inventory/putaway/tasks/{taskId}/execute:
    post:
      tags:
      - Putaway Execution
      summary: Execute putaway task
      description: Executes a putaway task by moving SKU quantity from source location to destination location.
      operationId: executePutaway
      parameters:
      - name: taskId
        in: path
        description: Putaway task identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutawayExecutionRequest'
        required: true
      responses:
        '200':
          description: Putaway executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutawayExecutionResponse'
        '400':
          description: Bad request - invalid task ID or request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutawayExecutionResponse'
        '403':
          description: Forbidden - insufficient authority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutawayExecutionResponse'
        '404':
          description: Putaway task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutawayExecutionResponse'
        '422':
          description: Validation failed for putaway execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutawayExecutionResponse'
      security:
      - bearerAuth:
        - inventory:putaway:execute
      x-required-permissions:
      - inventory:putaway:execute
  /v1/inventory/putaway/tasks/{taskId}/claim:
    post:
      tags:
      - Putaway
      summary: Claim a putaway task
      description: Claims an available putaway task for the current actor.
      operationId: claimPutawayTask
      parameters:
      - name: taskId
        in: path
        description: Putaway task identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Putaway task claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutawayTaskResponse'
        '404':
          description: Putaway task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutawayTaskResponse'
      security:
      - bearerAuth:
        - inventory:putaway:claim
      x-required-permissions:
      - inventory:putaway:claim
  /v1/inventory/putaway/tasks/generate:
    post:
      tags:
      - Putaway
      summary: Generate putaway tasks
      description: Generates putaway tasks for received inventory lines.
      operationId: generatePutawayTasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratePutawayTasksRequest'
        required: true
      responses:
        '201':
          description: Putaway tasks generated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PutawayTaskResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PutawayTaskResponse'
      security:
      - bearerAuth:
        - inventory:putaway:generate
      x-required-permissions:
      - inventory:putaway:generate
  /v1/inventory/purchase-orders:
    get:
      tags:
      - Purchase Orders
      summary: List purchase orders
      description: Lists purchase orders using filter and pagination parameters
      operationId: listPurchaseOrders
      parameters:
      - name: filter
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/ListPurchaseOrdersRequest'
      - name: pageable
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Pageable'
      responses:
        '200':
          description: Purchase orders returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagePurchaseOrderResponse'
        '403':
          description: User lacks required purchase order view authority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:purchase_order:view
      x-required-permissions:
      - inventory:purchase_order:view
    post:
      tags:
      - Purchase Orders
      summary: Create purchase order
      description: Creates a purchase order with requested line items
      operationId: createPurchaseOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePurchaseOrderRequest'
        required: true
      responses:
        '201':
          description: Purchase order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: User lacks required purchase order create authority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:purchase_order:create
      x-required-permissions:
      - inventory:purchase_order:create
  /v1/inventory/purchase-orders/{poId}/revisions:
    post:
      tags:
      - Purchase Orders
      summary: Revise purchase order
      description: Creates a revision for an existing purchase order
      operationId: revisePurchaseOrder
      parameters:
      - name: poId
        in: path
        description: Purchase order identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisePurchaseOrderRequest'
        required: true
      responses:
        '200':
          description: Purchase order revised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: User lacks required purchase order create authority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Purchase order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Purchase order is in a conflicting state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:purchase_order:create
      x-required-permissions:
      - inventory:purchase_order:create
  /v1/inventory/purchase-orders/{poId}/receive:
    post:
      tags:
      - Purchase Orders
      summary: Receive purchase order
      description: Receives approved purchase order quantities and posts resulting ledger movements
      operationId: receivePurchaseOrder
      parameters:
      - name: poId
        in: path
        description: Purchase order identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceivePurchaseOrderRequest'
        required: true
      responses:
        '200':
          description: Purchase order received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivePurchaseOrderResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: User lacks required purchase order receive authority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Purchase order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Purchase order is in a conflicting state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:purchase_order:receive
      x-required-permissions:
      - inventory:purchase_order:receive
  /v1/inventory/purchase-orders/{poId}/cancel:
    post:
      tags:
      - Purchase Orders
      summary: Cancel purchase order
      description: Cancels a purchase order that is no longer needed
      operationId: cancelPurchaseOrder
      parameters:
      - name: poId
        in: path
        description: Purchase order identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Purchase order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '403':
          description: User lacks required purchase order approval authority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Purchase order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Purchase order is in a conflicting state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:purchase_order:approve
      x-required-permissions:
      - inventory:purchase_order:approve
  /v1/inventory/purchase-orders/{poId}/approve:
    post:
      tags:
      - Purchase Orders
      summary: Approve purchase order
      description: Approves a purchase order and transitions it to an approvable state
      operationId: approvePurchaseOrder
      parameters:
      - name: poId
        in: path
        description: Purchase order identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovePurchaseOrderRequest'
        required: true
      responses:
        '200':
          description: Purchase order approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: User lacks required purchase order approval authority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Purchase order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Purchase order is in a conflicting state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
