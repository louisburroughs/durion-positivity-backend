      summary: Create or update a reservation
      description: 'Creates a soft reservation for a workorder line, or updates the existing reservation for that line to the requested stock item and quantity; creation records one SOFT allocation for the full quantity with no location and no ledger entry.

        Use this tool to register parts demand before picking; do not use promoteReservationAllocation, which hardens an existing allocation to a storage location, and do not use consumePickedItems, which posts the actual stock decrement.

