openapi: 3.1.0
info:
  title: Positivity Inventory API
  description: API documentation for the Inventory service, accessible via the API Gateway.
  contact:
    name: Durion Support Services
    email: louis.burroughs@gmail.com
  version: v1
servers:
- url: http://localhost:8086
  description: Generated server url
tags:
- name: Inventory Locations
  description: Read inventory facts for storage locations
- name: Lots
  description: Lot master records captured on inbound receipts, with per-lot on-hand
- name: Reallocation
  description: Allocation rebalancing endpoints
- name: Cycle Count Plans
  description: Cycle count plan management endpoints
- name: Picking Lists
  description: Picking list command endpoints
- name: Pick Lists
  description: Pick list and pick task management endpoints
- name: Putaway Execution
  description: Execute putaway tasks with validation and audit events
- name: Location Sync
  description: Location roster sync trigger and audit log endpoints
- name: Inventory Reservations
  description: Reserve, promote, and cancel inventory allocations for workorder lines
- name: Traceability
  description: Upstream/downstream traceability for lots and serial units
- name: Shortage Resolution
  description: Shortage resolution recommendation endpoints
- name: Inventory Rollup
  description: Inventory quantities rolled up along the storage-location hierarchy
- name: Inventory Bulk Ingest API
  description: Bulk import inventory adjustment requests
- name: Returns
  description: Inventory return-to-stock endpoints
- name: Inventory Reference Data
  description: Inventory reference-data read endpoints
- name: Inventory Revaluation
  description: Approval-gated manual cost revaluation (odoo-parity J4)
- name: Cycle Count Operations
  description: Cycle count submission and recount operations
- name: Inventory Management
  description: Operations related to inventory location management
- name: Inventory Valuation
  description: On-hand valuation read endpoints (odoo-parity J2)
- name: Transfer Orders
  description: Cross-site transfer orders with in-transit tracking
- name: Scraps
  description: Scrap (write-off) documents with value-threshold approval and SCRAP_OUT posting
- name: Purchase Suggestions
  description: Purchase suggestion listing and lifecycle endpoints
- name: ASN
  description: Advanced Shipping Notice and goods receipt endpoints
- name: Putaway
  description: Putaway task generation and claiming endpoints
- name: Inventory Availability
  description: Inventory availability read/write endpoints
- name: Consumption
  description: Workorder parts consumption endpoints
- name: Cycle Count API
  description: API for cycle count operations and variance tracking
- name: Replenishment
  description: Replenishment task and policy endpoints
- name: Cycle Count Query
  description: Query endpoints for cycle count tasks and history
- name: Backorders
  description: Unfulfilled workorder-line demand held open until availability covers it
- name: Cycle Count Schedules
  description: Recurring cycle-count schedule management endpoints
- name: Supplier Stock Hints
  description: Vendor-reported availability hints; advisory, never owned stock or ATP
- name: Cycle Count Adjustments
  description: Manage inventory adjustments from cycle counts
- name: Valuation Methods
  description: Costing method configuration endpoints (odoo-parity J1)
- name: Receiving
  description: Receiving session creation, item receiving, and cross-dock execution endpoints
- name: Serial Units
  description: Serial unit master records enumerated on inbound receipts for SERIAL-tracked SKUs
- name: Sourcing Strategies
  description: Sourcing/removal strategy configuration endpoints
- name: Inventory Sites
  description: Site inventory configuration endpoints. Inventory Sites represent physical locations that hold inventory.
- name: Inventory Ledger
  description: Inventory ledger read endpoints
- name: Stock Movements
  description: Inventory ledger movement recording and adjustment endpoints
paths:
  /v1/inventory/valuation/methods:
    get:
      tags:
      - Valuation Methods
      summary: List costing method configurations
      description: 'Returns every costing method configuration row, active and inactive, ordered by scope type and scope value.

        Use this tool to inspect which costing method each scope resolves to — precedence at posting time is SKU, then SKU_CATEGORY, then DEFAULT, then the deployment default pos.inventory.valuation.default-method (AVERAGE); do not use getInventoryValuation, which reports the values computed under those methods.

        Preconditions: none beyond the inventory:location:admin authority.

        Required inputs: none; there is no request body, paging or filtering.

        Emits an INVENTORY_VALUATION_METHOD_LIST audit event; no configuration changes.

        Returns 200 with an empty array when nothing is configured, meaning every SKU falls through to the deployment default.

        '
      operationId: listCostingMethodConfigs
      responses:
        '200':
          description: Costing method configurations returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CostingMethodConfigResponse'
        '403':
          description: User lacks required permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:location:admin
      x-required-permissions:
      - inventory:location:admin
    put:
      tags:
      - Valuation Methods
      summary: Upsert costing method configuration
      description: 'Creates or updates the costing method (STANDARD or AVERAGE) for one scope — SKU, SKU_CATEGORY or DEFAULT — reactivating the row and keeping at most one row per scope.

        Use this tool to switch which method a scope resolves to going forward only; do not use it expecting opening values to be restated — that cut-over is createRevaluation, which this call deliberately does not perform.

        Preconditions: none; note that SKU_CATEGORY rows are stored but unresolvable until the catalog replica carries a category, so resolution skips them to DEFAULT.

        Required inputs: scopeType, method, and scopeValue — the stock item id for SKU, the category string for SKU_CATEGORY, and omitted for DEFAULT.

        Emits an INVENTORY_VALUATION_METHOD_UPSERT event, and an effective method change is recorded as a who/when/from/to row in the cost method change log.

        Returns 400 when scopeValue is supplied for DEFAULT scope or missing for SKU or SKU_CATEGORY scope.

        '
      operationId: upsertCostingMethodConfig
      requestBody:
        description: Costing method to apply at one scope; the scope key rules depend on scopeType.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostingMethodConfigRequest'
            examples:
              Per-SKU standard costing:
                description: Per-SKU standard costing
                value:
                  scopeType: SKU
                  scopeValue: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  method: STANDARD
        required: true
      responses:
        '200':
          description: Costing method configuration upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostingMethodConfigResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: User lacks required permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:location:admin
      x-required-permissions:
      - inventory:location:admin
  /v1/inventory/sourcing-strategies:
    get:
      tags:
      - Sourcing Strategies
      summary: List sourcing strategy configurations
      description: 'Lists every sourcing-strategy configuration row, active and inactive, ordered by scope type then scope value.

        Use this tool to inspect removal-strategy configuration; use upsertSourcingStrategyConfig instead to change a scope, and deactivateSourcingStrategyConfig instead to retire one.

        Preconditions: none; at most one row exists per scope.

        Required inputs: none, and there is no paging or filtering.

        Emits an INVENTORY_SOURCING_STRATEGY_LIST audit event; no configuration is changed.

        Returns 200 with an empty array when nothing is configured, in which case decision-time resolution falls through SKU_CATEGORY, SITE and DEFAULT to the platform default FIFO.

        '
      operationId: listSourcingStrategyConfigs
      responses:
        '200':
          description: Sourcing strategy configurations returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SourcingStrategyConfigResponse'
        '403':
          description: User lacks required permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:location:admin
      x-required-permissions:
      - inventory:location:admin
    put:
      tags:
      - Sourcing Strategies
      summary: Upsert sourcing strategy configuration
      description: 'Creates or updates the sourcing strategy for one scope and reactivates the row; at most one row exists per scopeType and scopeValue pair.

        Use this tool to set FIFO, FEFO, PROXIMITY or HIGHEST_STOCK at a scope; do not use deactivateSourcingStrategyConfig to change a strategy — an upsert on an inactive row reactivates it with the new strategy.

        Preconditions: none beyond scope-value shape; note that FEFO falls back to FIFO while the SKU has no lot-expiry data, PROXIMITY falls back to FIFO when a decision has no reference location, and SKU_CATEGORY rows are stored but unresolvable until the catalog replica carries categories.

        Required inputs: scopeType (SKU_CATEGORY, SITE or DEFAULT) and strategy; scopeValue must be the category string for SKU_CATEGORY, the site UUID as text for SITE, and must be omitted for DEFAULT.

        Emits an INVENTORY_SOURCING_STRATEGY_UPSERT event; the change affects subsequent sourcing decisions immediately.

        Returns 400 when scopeValue is missing for SITE or SKU_CATEGORY, is not a UUID for SITE, or is present for DEFAULT.

        '
      operationId: upsertSourcingStrategyConfig
      requestBody:
        description: The scope being configured and the sourcing strategy to apply at it.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourcingStrategyConfigRequest'
            examples:
              Proximity at one site:
                description: Proximity at one site
                value:
                  scopeType: SITE
                  scopeValue: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a10
                  strategy: PROXIMITY
        required: true
      responses:
        '200':
          description: Sourcing strategy configuration upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcingStrategyConfigResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: User lacks required permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:location:admin
      x-required-permissions:
      - inventory:location:admin
  /v1/inventory/sites/{siteId}/defaultLocations:
    get:
      tags:
      - Inventory Sites
      summary: Get site default locations
      description: 'Returns the configured default storage locations for a site; this endpoint is a stub that currently always answers 501 Not Implemented.

        Use this tool only to probe the future site-defaults contract; use getSiteInventoryRollup instead for actual site inventory data, and do not expect updateSiteDefaultLocations to have stored anything readable here.

        Preconditions: none are evaluated; no configuration store exists yet.

        Required inputs: siteId (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; the stub performs no lookup.

        Returns 501 unconditionally until the configuration store is implemented.

        '
      operationId: getSiteDefaultLocations
      parameters:
      - name: siteId
        in: path
        description: Site identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Default locations returned
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
      security:
      - bearerAuth:
        - inventory:location:view
      x-required-permissions:
      - inventory:location:view
    put:
      tags:
      - Inventory Sites
      summary: Replace site default locations
      description: 'Replaces the configured default storage locations for a site; this endpoint is a stub that currently always answers 501 Not Implemented.

        Use this tool only to probe the future site-defaults contract; use getSiteDefaultLocations instead to read the configuration once implemented.

        Preconditions: none are evaluated; no configuration store exists yet.

        Required inputs: siteId (UUID) path parameter and an optional JSON array of storage-location UUIDs as the body.

        Emits an INVENTORY_SITE_DEFAULT_LOCATIONS_UPDATE event when invoked; no configuration is stored.

        Returns 501 unconditionally until the configuration store is implemented.

        '
      operationId: updateSiteDefaultLocations
      parameters:
      - name: siteId
        in: path
        description: Site identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Storage-location ids to install as the site's defaults, replacing any previous configuration.
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uuid
            examples:
              Two default locations:
                description: Two default locations
                value:
                - 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a01
                - 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a02
      responses:
        '200':
          description: Default locations replaced
        '501':
          description: Not implemented
      security:
      - bearerAuth:
        - inventory:location:admin
      x-required-permissions:
      - inventory:location:admin
  /v1/inventory/replenishment/policies/{policyId}:
    put:
      tags:
      - Replenishment
      summary: Update replenishment policy
      description: 'Replaces every tunable field of a replenishment policy: min/max thresholds, order multiple, lead-time override, preferred source type and active flag.

        Use this tool to retune an existing policy; do not use snoozeReplenishmentPolicy, which manages the snooze state this endpoint cannot touch, and do not use createReplenishmentPolicy, which defines a new policy.

        Preconditions: the policy must exist; its location and SKU identity are immutable here.

        Required inputs: policyId (UUID) path parameter plus minimumQuantity (at least 0) strictly less than maximumQuantity (at least 1); omitted optional fields are cleared or reset — orderMultiple and leadTimeDaysOverride to none, preferredSourceType to EITHER, active to true.

        Emits an INVENTORY_REPLENISHMENT_POLICY_UPDATE event; the next scan or stock event evaluates the new thresholds.

        Returns 404 when the policy does not exist, and 400 when minimumQuantity is not less than maximumQuantity.

        '
      operationId: updateReplenishmentPolicy
      parameters:
      - name: policyId
        in: path
        description: Replenishment policy identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Replacement values for every tunable field of the policy; omitted optional fields are cleared or reset to defaults.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReplenishmentPolicyRequest'
            examples:
              Retuned thresholds:
                description: Retuned thresholds
                value:
                  minimumQuantity: 8
                  maximumQuantity: 60
                  orderMultiple: 6
                  preferredSourceType: PURCHASE
                  active: true
        required: true
      responses:
        '200':
          description: Replenishment policy updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplenishmentPolicyResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplenishmentPolicyResponse'
        '404':
          description: Policy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplenishmentPolicyResponse'
      security:
      - bearerAuth:
        - inventory:replenishment:manage
      x-required-permissions:
      - inventory:replenishment:manage
  /v1/inventory/lots/{lotId}/expiration:
    put:
      tags:
      - Lots
      summary: Set lot expiration
      description: 'Sets or clears a lot''s expiration date and expiring-soon alert-window date.

        Use this tool to re-date a lot after inspection or vendor correction; do not use updateInventoryLotStatus, which changes the lifecycle status rather than the dates.

        Preconditions: the lot must exist.

        Required inputs: lotId (UUID) path parameter plus a body with optional expirationDate and alertDate (ISO dates); a null clears the corresponding date, and alertDate null means no early alert.

        Emits an INVENTORY_LOT_EXPIRATION_SET event and resets the emit-once alert bookkeeping so the daily expiry scan can alert the new dates afresh.

        Returns 404 when the lot does not exist.

        '
      operationId: updateInventoryLotExpiration
      parameters:
      - name: lotId
        in: path
        description: Lot ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Expiration and alert-window dates to set; a null clears the corresponding date.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LotExpirationUpdateRequest'
            examples:
              Re-date with early alert:
                description: Re-date with early alert
                value:
                  expirationDate: 2027-01-31
                  alertDate: 2027-01-01
        required: true
      responses:
        '200':
          description: Lot expiration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotResponse'
        '403':
          description: Missing inventory:lot:manage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Lot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:lot:manage
      x-required-permissions:
      - inventory:lot:manage
  /v1/inventory/cycleCountSchedules/{scheduleId}:
    get:
      tags:
      - Cycle Count Schedules
      summary: Get cycle count schedule
      description: 'Returns one recurring cycle-count schedule with its filters, frequency, next due date, and active and auto-create flags.

        Use this tool when the scheduleId is already known; use listCycleCountSchedules instead to search by location or due state.

        Preconditions: the schedule must exist.

        Required inputs: scheduleId (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 404 when no cycle count schedule exists for the supplied id.

        '
      operationId: getCycleCountSchedule
      parameters:
      - name: scheduleId
        in: path
        description: Cycle count schedule identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Cycle count schedule returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountScheduleResponse'
        '404':
          description: Cycle count schedule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountScheduleResponse'
      security:
      - bearerAuth:
        - inventory:cycle_count:view
      x-required-permissions:
      - inventory:cycle_count:view
    put:
      tags:
      - Cycle Count Schedules
      summary: Update cycle count schedule
      description: 'Partially updates a recurring cycle-count schedule: frequencyDays, zoneId, skuCategory, nextDueDate, autoCreatePlan and active can each be changed, and null fields are left unchanged.

        Use this tool to retune an existing schedule; do not use updateCycleCountPlanStatus, which moves an individual plan through its lifecycle, and note that v1 offers no way to clear the zone or SKU-category filters — recreate the schedule instead.

        Preconditions: the schedule must exist.

        Required inputs: scheduleId (UUID) path parameter and a body carrying only the fields to change; frequencyDays, when supplied, must be positive.

        Emits an INVENTORY_CYCLE_COUNT_SCHEDULE_UPDATE event; the change takes effect on the next scheduler pass.

        Returns 404 when the schedule does not exist, and 400 when a supplied frequencyDays is not positive.

        '
      operationId: updateCycleCountSchedule
      parameters:
      - name: scheduleId
        in: path
        description: Cycle count schedule identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Partial update; only non-null fields are applied to the schedule.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCycleCountScheduleRequest'
            examples:
              Tighten cadence:
                description: Tighten cadence
                value:
                  frequencyDays: 14
                  nextDueDate: 2026-09-01
                  active: true
        required: true
      responses:
        '200':
          description: Cycle count schedule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountScheduleResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountScheduleResponse'
        '403':
          description: User lacks required permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountScheduleResponse'
        '404':
          description: Cycle count schedule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountScheduleResponse'
      security:
      - bearerAuth:
        - inventory:cycle_count:initiate
      x-required-permissions:
      - inventory:cycle_count:initiate
    delete:
      tags:
      - Cycle Count Schedules
      summary: Deactivate cycle count schedule
      description: 'Deactivates a recurring cycle-count schedule — a soft delete that clears its active flag so it stops firing and drops out of the due-for-count view; the row is never removed.

        Use this tool to retire a schedule; to change its cadence or filters while keeping it running (or to re-activate it), use updateCycleCountSchedule instead.

        Preconditions: the schedule must exist; deactivating an already-inactive schedule succeeds unchanged.

        Required inputs: scheduleId (UUID) as a path parameter; there is no request body or confirmation flag.

        Emits an INVENTORY_CYCLE_COUNT_SCHEDULE_DEACTIVATE event; plans already created from the schedule are untouched.

        Returns 404 when no cycle count schedule exists for the supplied id.

        '
      operationId: deactivateCycleCountSchedule
      parameters:
      - name: scheduleId
        in: path
        description: Cycle count schedule identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Cycle count schedule deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountScheduleResponse'
        '403':
          description: User lacks required permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountScheduleResponse'
        '404':
          description: Cycle count schedule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountScheduleResponse'
      security:
      - bearerAuth:
        - inventory:cycle_count:initiate
      x-required-permissions:
      - inventory:cycle_count:initiate
  /v1/inventory/cycleCountPlans/{planId}/status:
    put:
      tags:
      - Cycle Count Plans
      summary: Transition cycle count plan status
      description: 'Moves a cycle count plan one step through its lifecycle: PLANNED to STARTED or CANCELLED, STARTED to COMPLETED_PENDING_APPROVAL or CANCELLED, and COMPLETED_PENDING_APPROVAL to APPROVED or REJECTED; APPROVED, REJECTED and CANCELLED are terminal.

        Use this tool for plan lifecycle transitions only; do not use updateCycleCountSchedule, which edits a recurring schedule''s configuration.

        Preconditions: the plan must exist and the requested status must be a legal transition from its current status.

        Required inputs: planId (UUID) path parameter and status (the target lifecycle value) in the body.

        Emits an INVENTORY_CYCLE_COUNT_PLAN_STATUS_UPDATE event; approving a schedule-created plan also restamps the originating schedule''s nextDueDate to today plus its frequencyDays, so a late count does not immediately come due again.

        Returns 404 when the plan does not exist, and 409 when the transition is not allowed from the current status.

        '
      operationId: updateCycleCountPlanStatus
      parameters:
      - name: planId
        in: path
        description: Cycle count plan identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Target lifecycle status for the plan transition.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCycleCountPlanStatusRequest'
            examples:
              Start counting:
                description: Start counting
                value:
                  status: STARTED
        required: true
      responses:
        '200':
          description: Cycle count plan status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountPlanResponse'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountPlanResponse'
        '403':
          description: User lacks required permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountPlanResponse'
        '404':
          description: Cycle count plan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountPlanResponse'
        '409':
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountPlanResponse'
      security:
      - bearerAuth:
        - inventory:cycle_count:complete
      x-required-permissions:
      - inventory:cycle_count:complete
  /v1/inventory/valuation/revaluations:
    get:
      tags:
      - Inventory Revaluation
      summary: List revaluations
      description: 'Returns revaluation documents, newest first, optionally filtered by SKU and/or lifecycle status (PENDING_APPROVAL, AUTO_APPLIED, APPLIED, REJECTED).

        Use this tool to find pending approvals or audit past cost corrections; use getRevaluation instead when the revaluationId is already known.

        Preconditions: none.

        Required inputs: stockItemId and status are optional query parameters; there is no paging — the full match set is returned.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 with an empty array when no revaluations match, so an empty result is not an error condition.

        '
      operationId: listRevaluations
      parameters:
      - name: stockItemId
        in: query
        description: Filter by SKU / stock item identifier
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: Filter by lifecycle status
        required: false
        schema:
          type: string
          enum:
          - PENDING_APPROVAL
          - AUTO_APPLIED
          - APPLIED
          - REJECTED
      responses:
        '200':
          description: Revaluations retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RevaluationResponse'
      security:
      - bearerAuth:
        - inventory:valuation:view
        - inventory:valuation:adjust
      x-required-permissions:
      - inventory:valuation:view
      - inventory:valuation:adjust
    post:
      tags:
      - Inventory Revaluation
      summary: Submit cost revaluation
      description: 'Submits a manual cost revaluation for a SKU, correcting the cost its resolved costing method uses — the standard price under STANDARD, the running average under AVERAGE; below the configured value-delta thresholds it is AUTO_APPLIED (cost state restated and a ProductValueChangedV1 fact emitted) in the same transaction, and at or above them it enters PENDING_APPROVAL with no cost change.

        Use this tool to correct a wrong unit cost; do not use upsertCostingMethodConfig, which switches the costing method without restating values, and do not use approveRevaluation, which acts on a revaluation that already exists.

        Preconditions: the caller must be an authenticated user; the SKU''s cost state row is seeded automatically when absent, so no prior costing history is required.

        Required inputs: stockItemId plus exactly one of newUnitCost (absolute, zero or positive) or costDelta (signed, applied to the current cost), and a reason for the audit log; the value delta gating the approval tier is the cost change multiplied by current on-hand.

        Emits an INVENTORY_REVALUATION_CREATE event, and the auto-apply path additionally emits the ProductValueChangedV1 fact so accounting can post the revaluation journal entry.

        Returns 400 when neither or both of newUnitCost and costDelta are supplied, or when the resulting unit cost would be negative.

        '
      operationId: createRevaluation
      requestBody:
        description: 'Cost correction for one SKU: an absolute new unit cost or a signed delta, with the justification recorded in the audit log.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRevaluationRequest'
            examples:
              Absolute correction:
                description: Absolute correction
                value:
                  stockItemId: OIL-5W30-5QT
                  newUnitCost: 5.5
                  reason: Q3 physical recount valuation correction
        required: true
      responses:
        '201':
          description: Revaluation created (AUTO_APPLIED or PENDING_APPROVAL)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevaluationResponse'
        '400':
          description: Invalid request (e.g. neither/both of newUnitCost and costDelta, or a negative result)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Missing inventory:valuation:adjust
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:valuation:adjust
      x-required-permissions:
      - inventory:valuation:adjust
  /v1/inventory/valuation/revaluations/{revaluationId}/reject:
    post:
      tags:
      - Inventory Revaluation
      summary: Reject cost revaluation
      description: 'Rejects a PENDING_APPROVAL revaluation with a recorded reason; the SKU cost state is untouched and the record moves to the terminal REJECTED status.

        Use this tool to discard a disputed cost correction; do not use approveRevaluation, which restates the SKU cost state.

        Preconditions: the revaluation must exist and be in PENDING_APPROVAL status; the rejecting actor is taken from the authenticated context, not the body.

        Required inputs: revaluationId (UUID) path parameter and rejectionReason (non-blank, max 1000 characters) in the body.

        Emits an INVENTORY_REVALUATION_REJECT event; no cost or ledger change is made.

        Returns 404 when the revaluation does not exist, and 409 when it is not in PENDING_APPROVAL status.

        '
      operationId: rejectRevaluation
      parameters:
      - name: revaluationId
        in: path
        description: Revaluation document ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Rejection context recording why the cost correction is discarded.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRevaluationRequest'
            examples:
              Rejection:
                description: Rejection
                value:
                  rejectionReason: Recount disputed; leave standard price unchanged
        required: true
      responses:
        '200':
          description: Revaluation rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevaluationResponse'
        '404':
          description: Revaluation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Revaluation is not in a rejectable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:valuation:adjust
      x-required-permissions:
      - inventory:valuation:adjust
  /v1/inventory/valuation/revaluations/{revaluationId}/approve:
    post:
      tags:
      - Inventory Revaluation
      summary: Approve cost revaluation
      description: 'Approves a PENDING_APPROVAL revaluation and applies it: the SKU''s cost state is restated to the recorded new unit cost and a ProductValueChangedV1 fact is emitted for the accounting journal entry.

        Use this tool after reviewing an above-threshold revaluation; do not use rejectRevaluation, which discards it and leaves the cost state untouched.

        Preconditions: the revaluation must exist and be in PENDING_APPROVAL status; the approver need not differ from the submitter.

        Required inputs: revaluationId (UUID) as a path parameter; there is no request body.

        Emits an INVENTORY_REVALUATION_APPROVE event plus the ProductValueChangedV1 fact; the new cost applies from now on and no ledger entries are rewritten.

        Returns 404 when the revaluation does not exist, and 409 when it is not in PENDING_APPROVAL status.

        '
      operationId: approveRevaluation
      parameters:
      - name: revaluationId
        in: path
        description: Revaluation document ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Revaluation approved and applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevaluationResponse'
        '403':
          description: Missing inventory:valuation:adjust
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Revaluation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Revaluation is not in an approvable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:valuation:adjust
      x-required-permissions:
      - inventory:valuation:adjust
  /v1/inventory/transfer-orders:
    get:
      tags:
      - Transfer Orders
      summary: List transfer orders
      description: 'Lists transfer orders newest first, optionally filtered by lifecycle status, source site and destination site.

        Use this tool to discover transferOrderIds or survey in-flight transfers; use getTransferOrder instead when the id is already known.

        Preconditions: none; every filter is optional and omitted filters match everything.

        Required inputs: none; status (TransferOrderStatus), sourceLocationId and destinationLocationId are optional query parameters.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 with an empty array when nothing matches, so an empty result is not an error condition.

        '
      operationId: listTransferOrders
      parameters:
      - name: status
        in: query
        description: Filter by lifecycle status
        required: false
        schema:
          type: string
          enum:
          - DRAFT
          - APPROVED
          - DISPATCHED
          - PARTIALLY_RECEIVED
          - RECEIVED
          - SHORT_CLOSED
          - CANCELLED
      - name: sourceLocationId
        in: query
        description: Filter by source site
        required: false
        schema:
          type: string
          format: uuid
      - name: destinationLocationId
        in: query
        description: Filter by destination site
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Transfer orders retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransferOrderResponse'
      security:
      - bearerAuth:
        - inventory:transfer:view
      x-required-permissions:
      - inventory:transfer:view
    post:
      tags:
      - Transfer Orders
      summary: Create transfer order
      description: 'Creates a cross-site transfer order in DRAFT that will carry stock between two different sites through an explicit dispatch/receive lifecycle.

        Use this tool when stock must move between sites; do not use it for intra-site bin moves, which post immediately through the stock-movements endpoint, and do not use dispatchTransferOrder, which ships an order that already exists.

        Preconditions: source and destination must be different sites, both present in the location roster with status ACTIVE (DECISION-INVENTORY-009); an optional bin-level storage location must belong to its site when the storage-location replica knows it.

        Required inputs: sourceLocationId and destinationLocationId (UUID site ids) and at least one line with sku and a positive requestedQty; sourceStorageLocationId, destinationStorageLocationId and notes are optional.

        Emits an INVENTORY_TRANSFER_ORDER_CREATE event and queues a TransferOrderUpdatedV1 fact; no stock moves until dispatch.

        Returns 404 when a site is not in the location roster, 422 with TRANSFER_LOCATION_NOT_ELIGIBLE when a site is INACTIVE or PENDING, and 400 when source equals destination, a storage location belongs to another site, lines are empty or a quantity is not positive.

        '
      operationId: createTransferOrder
      requestBody:
        description: 'Transfer order to draft: the two sites and the requested SKU lines.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferOrderRequest'
            examples:
              Two-line resupply draft:
                description: Two-line resupply draft
                value:
                  sourceLocationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a01
                  destinationLocationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a02
                  lines:
                  - sku: OIL-5W30-5QT
                    requestedQty: 6
                  - sku: FILTER-PH7317
                    requestedQty: 12
                  notes: Weekly resupply run
        required: true
      responses:
        '201':
          description: Transfer order created in DRAFT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferOrderResponse'
        '400':
          description: Invalid request (same source and destination site, empty lines, non-positive quantity, or a storage location outside its site)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Missing inventory:transfer:create
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Source or destination site is not in the location roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: 'Source or destination site is not eligible for movement (TRANSFER_LOCATION_NOT_ELIGIBLE: INACTIVE/PENDING per DECISION-INVENTORY-009)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:transfer:create
      x-required-permissions:
      - inventory:transfer:create
  /v1/inventory/transfer-orders/{transferOrderId}/short-close:
    post:
      tags:
      - Transfer Orders
      summary: Short-close transfer order
      description: 'Short-closes a transfer order whose in-transit remainder will never be received normally, resolving every line''s dispatched-minus-received quantity with one whole-order disposition.

        Use this tool for stock lost or turned back in transit; do not use cancelTransferOrder, which only works before dispatch, and do not use receiveTransferOrder, which books a normal arrival.

        Preconditions: the order must be DISPATCHED or PARTIALLY_RECEIVED with a positive in-transit remainder; for RETURNED_TO_SOURCE the source site must still be ACTIVE for movement, while LOST_IN_TRANSIT deliberately skips the eligibility check so a loss can be resolved toward a deactivated destination.

        Required inputs: transferOrderId (UUID) path parameter plus a body with disposition (LOST_IN_TRANSIT writes the remainder off via a paired constructive TRANSFER_IN and SCRAP_OUT with reason LOST at the destination; RETURNED_TO_SOURCE restores it to source on-hand), and mandatory reason and notes.

        Emits an INVENTORY_TRANSFER_ORDER_SHORT_CLOSE event; all ledger entries post atomically with sourceTransactionId = transferOrderId, destination in-transit zeroes, the order reaches the terminal SHORT_CLOSED status, and the TransferOrderUpdatedV1 fact carries the disposition — no scrap document is created.

        Returns 404 when the order does not exist, 409 when it is not short-closable or has no outstanding remainder, 422 with TRANSFER_LOCATION_NOT_ELIGIBLE for RETURNED_TO_SOURCE toward an ineligible source, and 400 when disposition, reason or notes are missing.

        '
      operationId: shortCloseTransferOrder
      parameters:
      - name: transferOrderId
        in: path
        description: Transfer order ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Whole-order disposition of the undelivered remainder with the mandatory audit reason and notes.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShortCloseTransferOrderRequest'
            examples:
              Write off a lost remainder:
                description: Write off a lost remainder
                value:
                  disposition: LOST_IN_TRANSIT
                  reason: Carrier loss claim
                  notes: Carrier confirmed the pallet missing; claim CL-2291 filed
        required: true
      responses:
        '200':
          description: Transfer order short-closed (terminal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferOrderResponse'
        '400':
          description: Missing disposition, reason, or notes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Missing inventory:transfer:short_close
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Transfer order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Order is not short-closable (not DISPATCHED/PARTIALLY_RECEIVED, or no outstanding in-transit remainder)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: 'RETURNED_TO_SOURCE only: the source site is not movement-eligible (TRANSFER_LOCATION_NOT_ELIGIBLE per DECISION-INVENTORY-009)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:transfer:short_close
      x-required-permissions:
      - inventory:transfer:short_close
  /v1/inventory/transfer-orders/{transferOrderId}/receive:
    post:
      tags:
      - Transfer Orders
      summary: Receive transfer order
      description: 'Receives dispatched quantities at the destination site, posting one TRANSFER_IN per line through the ledger funnel that raises destination on-hand and drains the in-transit quantity.

        Use this tool when goods arrive at the destination; do not use dispatchTransferOrder, which ships from the source, and use shortCloseTransferOrder instead when the remainder will never arrive.

        Preconditions: the order must be DISPATCHED or PARTIALLY_RECEIVED and the destination site must still be ACTIVE for movement; each line receives against the lot pinned at dispatch, never a request-keyed one.

        Required inputs: transferOrderId (UUID) path parameter; the body is optional — lines pin a per-line quantity (at most dispatched minus already received), and omitted lines receive their full un-received remainder.

        Emits an INVENTORY_TRANSFER_ORDER_RECEIVE event and queues a TransferOrderUpdatedV1 fact; the status becomes RECEIVED when every line is fully received, else PARTIALLY_RECEIVED with the remainder still in transit.

        Returns 404 when the order does not exist, 409 when it is not receivable, 422 with TRANSFER_RECEIVE_EXCEEDS_DISPATCHED or TRANSFER_LOCATION_NOT_ELIGIBLE, and 400 for an unknown or duplicate line id.

        '
      operationId: receiveTransferOrder
      parameters:
      - name: transferOrderId
        in: path
        description: Transfer order ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Optional per-line received quantities; omitted lines receive their full un-received remainder.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiveTransferOrderRequest'
            examples:
              Partial receipt of one line:
                description: Partial receipt of one line
                value:
                  lines:
                  - lineId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a10
                    quantity: 4
      responses:
        '200':
          description: Receipt recorded (RECEIVED or PARTIALLY_RECEIVED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferOrderResponse'
        '400':
          description: Unknown or duplicate line id in the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Missing inventory:transfer:receive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Transfer order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Order is not receivable (not yet dispatched, cancelled, short-closed, or already fully received)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Received quantity exceeds the un-received dispatched remainder (TRANSFER_RECEIVE_EXCEEDS_DISPATCHED), or the destination site is not movement-eligible (TRANSFER_LOCATION_NOT_ELIGIBLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:transfer:receive
      x-required-permissions:
      - inventory:transfer:receive
  /v1/inventory/transfer-orders/{transferOrderId}/dispatch:
    post:
      tags:
      - Transfer Orders
      summary: Dispatch transfer order
      description: 'Dispatches a transfer order from the source site, posting one TRANSFER_OUT per line through the ledger funnel that decrements source on-hand and raises the destination in-transit quantity.

        Use this tool when the stock physically leaves the source; do not use receiveTransferOrder, which books arrival at the destination, and do not use createTransferOrder, which only drafts the order.

        Preconditions: the order must be in DRAFT (or APPROVED when pos.inventory.transfer.approval-required=true), both sites must still be ACTIVE for movement, source on-hand must cover each dispatched quantity, and each LOT-tracked SKU must name an existing ACTIVE lot, which is pinned on the line for receive and short-close.

        Required inputs: transferOrderId (UUID) path parameter; the body is optional — lines pin a per-line quantity (at most the requested quantity) and a lotNumber for LOT-tracked SKUs, and omitted lines dispatch their full requested quantity.

        Emits an INVENTORY_TRANSFER_ORDER_DISPATCH event, posts the ledger batch with sourceTransactionId = transferOrderId and queues a TransferOrderUpdatedV1 fact.

        Returns 404 when the order does not exist, 409 when it is not dispatchable, 422 with TRANSFER_DISPATCH_EXCEEDS_REQUESTED, INSUFFICIENT_STOCK, TRANSFER_LOCATION_NOT_ELIGIBLE, LOT_NUMBER_REQUIRED, LOT_UNKNOWN or LOT_NOT_AVAILABLE, and 400 for an unknown or duplicate line id.

        '
      operationId: dispatchTransferOrder
      parameters:
      - name: transferOrderId
        in: path
        description: Transfer order ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Optional per-line dispatch quantities and lot numbers; omitted lines dispatch their full requested quantity.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchTransferOrderRequest'
            examples:
              Partial dispatch of one lot-tracked line:
                description: Partial dispatch of one lot-tracked line
                value:
                  lines:
                  - lineId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a10
                    quantity: 4
                    lotNumber: LOT-2026-A
      responses:
        '200':
          description: Transfer order dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferOrderResponse'
        '400':
          description: Unknown or duplicate line id in the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Missing inventory:transfer:dispatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Transfer order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Order is not dispatchable (already dispatched/terminal, or awaiting approval)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Dispatch quantity exceeds requested (TRANSFER_DISPATCH_EXCEEDS_REQUESTED), source on-hand insufficient (INSUFFICIENT_STOCK — TRANSFER_OUT is blocked below zero), or a site is not movement-eligible (TRANSFER_LOCATION_NOT_ELIGIBLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:transfer:dispatch
      x-required-permissions:
      - inventory:transfer:dispatch
  /v1/inventory/transfer-orders/{transferOrderId}/cancel:
    post:
      tags:
      - Transfer Orders
      summary: Cancel transfer order
      description: 'Cancels a transfer order before dispatch, moving DRAFT or APPROVED to the terminal CANCELLED status.

        Use this tool to abandon an order whose stock has not moved; do not use it after dispatch — the stock has physically moved, so resolve discrepancies with shortCloseTransferOrder instead.

        Preconditions: the order must be in DRAFT or APPROVED.

        Required inputs: transferOrderId (UUID) as a path parameter; there is no request body.

        Emits an INVENTORY_TRANSFER_ORDER_CANCEL event and queues a TransferOrderUpdatedV1 fact; no ledger entries are posted.

        Returns 404 when the order does not exist, and 409 when it has already been dispatched or is terminal.

        '
      operationId: cancelTransferOrder
      parameters:
      - name: transferOrderId
        in: path
        description: Transfer order ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Transfer order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferOrderResponse'
        '403':
          description: Missing inventory:transfer:create
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Transfer order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Order already dispatched (or terminal) — cancellation is only allowed before dispatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:transfer:create
      x-required-permissions:
      - inventory:transfer:create
  /v1/inventory/transfer-orders/{transferOrderId}/approve:
    post:
      tags:
      - Transfer Orders
      summary: Approve transfer order
      description: 'Approves a DRAFT transfer order, moving it to APPROVED so it becomes dispatchable when the approval step is enabled (decision D-8).

        Use this tool only when the deployment sets pos.inventory.transfer.approval-required=true; do not use dispatchTransferOrder to approve, and with the flag off (the default) skip approval entirely because DRAFT orders dispatch directly and this call returns 409.

        Preconditions: the approval flag must be on and the order must be in DRAFT.

        Required inputs: transferOrderId (UUID) as a path parameter; there is no request body.

        Emits an INVENTORY_TRANSFER_ORDER_APPROVE event and queues a TransferOrderUpdatedV1 fact; no stock moves.

        Returns 404 when the order does not exist, and 409 when the approval step is disabled or the order is not in DRAFT.

        '
      operationId: approveTransferOrder
      parameters:
      - name: transferOrderId
        in: path
        description: Transfer order ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Transfer order approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferOrderResponse'
        '403':
          description: Missing inventory:transfer:dispatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Transfer order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Approval step disabled, or order is not in DRAFT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:transfer:dispatch
      x-required-permissions:
      - inventory:transfer:dispatch
  /v1/inventory/stock-movements:
    post:
      tags:
      - Stock Movements
      summary: Record a stock movement
      description: 'Records a directional stock movement in the inventory ledger: RECEIVE posts GOODS_RECEIPT, PUT_AWAY posts PUTAWAY, PICK and ISSUE post GOODS_ISSUE, RETURN posts RETURN_TO_STOCK, and TRANSFER posts a paired TRANSFER_OUT and TRANSFER_IN.

        Use this tool for ledger-backed inventory changes; do not use updateInventoryAvailability, which always returns 501, and do not send movementType ADJUST here — quantity corrections go through createAdjustmentRequest and approveAdjustmentRequest.

        Preconditions: PICK and ISSUE require on-hand at fromLocationId to cover the quantity; TRANSFER is intra-site only — when both ends resolve to different sites the movement must go through a transfer order so in-transit stock is represented.

        Required inputs: productSku, fromLocationId (UUID), movementType and a positive quantity; toLocationId is required for TRANSFER, while unitOfMeasure and sourceTransactionId are optional.

        Emits an INVENTORY_STOCK_MOVEMENT_CREATE event and posts the entries through the ledger funnel, which updates the stock summary that availability reads.

        Returns 201 with no body, 422 with INSUFFICIENT_STOCK when a PICK or ISSUE exceeds on-hand at the source, 422 with CROSS_SITE_TRANSFER_REQUIRES_ORDER for a cross-site TRANSFER, and 400 when toLocationId is missing for TRANSFER or movementType is ADJUST.

        '
      operationId: createStockMovement
      requestBody:
        description: 'The directional movement to post: SKU, source location, movement type and quantity, plus a destination for transfers.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordMovementRequest'
            examples:
              Receive twelve units:
                description: Receive twelve units
                value:
                  productSku: SKU-10042
                  fromLocationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a30
                  movementType: RECEIVE
                  quantity: 12
                  unitOfMeasure: EACH
                  sourceTransactionId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a32
        required: true
      responses:
        '201':
          description: Movement recorded
        '400':
          description: Validation failure
        '422':
          description: Insufficient stock
      security:
      - bearerAuth:
        - inventory:stock_movement:create
      x-required-permissions:
      - inventory:stock_movement:create
  /v1/inventory/shortage/resolve:
    post:
      tags:
      - Shortage Resolution
      summary: Resolve shortage
      description: 'Executes one chosen shortage-resolution option atomically and records the created artifact: BACKORDER opens a backorder, SUBSTITUTE reserves the substitute SKU through the reservation upsert, TRANSFER_IN creates a cross-site transfer order, EMERGENCY_PURCHASE stores a purchase suggestion, and CANCEL_LINE cancels the workorder line''s reservation.

        Use this tool after picking an option from listShortageOptions; do not use createOrUpdateReservation directly for substitutes or cancelReservation directly for line cancels when an auditable, idempotent resolution record is wanted.

        Preconditions: option-specific — workorderLineId for BACKORDER and SUBSTITUTE, substituteSku (a product UUID with positive ATP at locationId when locationId is given) for SUBSTITUTE, and both sourceLocationId and locationId for TRANSFER_IN.

        Required inputs: idempotencyKey (unique per resolution attempt — a replay with the same key returns the stored result without re-executing), allocationId (UUID), sku, a positive shortQuantity and optionType (BACKORDER, SUBSTITUTE, TRANSFER_IN, EMERGENCY_PURCHASE or CANCEL_LINE), plus the option-specific fields above; notes is optional free text.

        Emits an INVENTORY_SHORTAGE_RESOLVE event and persists a shortage-resolution record referencing the artifact (BACKORDER, RESERVATION, TRANSFER_ORDER, PURCHASE_SUGGESTION or NONE).

        Returns 422 with per-case codes when execution preconditions fail — MISSING_FIELD for an absent option-specific field, SUBSTITUTE_UNAVAILABLE when the substitute has no ATP at the site, INVALID_IDENTIFIER when substituteSku is not a UUID — and 400 when idempotencyKey, allocationId, sku or optionType is missing.

        '
      operationId: resolveShortage
      requestBody:
        description: The chosen resolution option with its idempotency key and the option-specific fields listShortageOptions supplied.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShortageResolveRequest'
            examples:
              Backorder the short demand:
                description: Backorder the short demand
                value:
                  idempotencyKey: shortage-resolve-018f0a1b-0001
                  allocationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a01
                  optionType: BACKORDER
                  sku: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a02
                  shortQuantity: 3
                  locationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a0c
                  workorderLineId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a03
        required: true
      responses:
        '200':
          description: Shortage resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortageResolutionResultDto'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: User lacks required shortage resolution authority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Unable to resolve shortage under current constraints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:shortage:resolve
      x-required-permissions:
      - inventory:shortage:resolve
  /v1/inventory/scraps:
    get:
      tags:
      - Scraps
      summary: List scraps
      description: 'Returns scrap documents, newest first, optionally filtered by reason code, lifecycle status, location, and an inclusive creation-time range.

        Use this tool to find pending approvals or audit write-off history; use getScrap instead when the scrapId is already known.

        Preconditions: none.

        Required inputs: reasonCode, status, locationId, createdFrom and createdTo (ISO-8601 instants) are all optional query parameters; there is no paging — the full match set is returned.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 with an empty array when no scraps match, so an empty result is not an error condition.

        '
      operationId: listScraps
      parameters:
      - name: reasonCode
        in: query
        description: Filter by scrap reason
        required: false
        schema:
          type: string
          enum:
          - DAMAGED
          - EXPIRED
          - LOST
          - RECALLED
          - CONTAMINATED
          - WARRANTY_DESTROYED
          - OTHER
      - name: status
        in: query
        description: Filter by lifecycle status
        required: false
        schema:
          type: string
          enum:
          - PENDING_APPROVAL
          - AUTO_APPROVED
          - APPROVED
          - POSTED
          - REJECTED
          - FAILED
      - name: locationId
        in: query
        description: Filter by location
        required: false
        schema:
          type: string
          format: uuid
      - name: createdFrom
        in: query
        description: Inclusive lower creation-time bound
        required: false
        schema:
          type: string
          format: date-time
      - name: createdTo
        in: query
        description: Inclusive upper creation-time bound
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Scraps retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScrapResponse'
      security:
      - bearerAuth:
        - inventory:scrap:view
        - inventory:scrap:approve
      x-required-permissions:
      - inventory:scrap:view
      - inventory:scrap:approve
    post:
      tags:
      - Scraps
      summary: Create scrap document
      description: 'Creates a scrap (write-off) document for stock at a location and evaluates its value — quantity times the latest-receipt cost snapshot — against the configured approval thresholds: below all thresholds it is AUTO_APPROVED and its SCRAP_OUT ledger entry posts in the same transaction, while above them, or when no cost is derivable, it enters PENDING_APPROVAL.

        Use this tool to write off damaged, expired or lost stock; do not use createCycleCountAdjustment, which settles a counted variance rather than a deliberate write-off.

        Preconditions: the caller must be an authenticated user; a LOT-tracked SKU must name an existing ACTIVE lot, and the auto-approve posting requires sufficient on-hand at the posting location (the storage location when given, else the location) unless an authorized negative-stock override is passed.

        Required inputs: stockItemId, quantity (positive), locationId and reasonCode (DAMAGED, EXPIRED, LOST, RECALLED, CONTAMINATED, WARRANTY_DESTROYED or OTHER — OTHER requires notes); storageLocationId, lotNumber, workorderId and attachmentReference are optional, and shouldReplenish and negativeStockOverride default to false.

        Emits an INVENTORY_SCRAP_CREATE event, and a posted scrap additionally emits a ScrapPostedV1 fact, reduces on-hand immediately, and triggers a best-effort replenishment evaluation when shouldReplenish is true.

        Returns 400 when reasonCode is OTHER without notes, 403 when negativeStockOverride is requested without inventory:adjustment:override, and 422 for insufficient on-hand (SCRAP_INSUFFICIENT_STOCK) or lot violations (LOT_NUMBER_REQUIRED, LOT_UNKNOWN, LOT_NOT_AVAILABLE).

        '
      operationId: createScrap
      requestBody:
        description: 'Stock write-off to record: what is scrapped, where, how much, and why.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScrapRequest'
            examples:
              Damaged stock write-off:
                description: Damaged stock write-off
                value:
                  stockItemId: OIL-5W30-5QT
                  quantity: 3
                  locationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  storageLocationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
                  reasonCode: DAMAGED
                  notes: Dropped during putaway, casing cracked
                  shouldReplenish: false
                  negativeStockOverride: false
        required: true
      responses:
        '201':
          description: Scrap created (AUTO_APPROVED/POSTED or PENDING_APPROVAL)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapResponse'
        '400':
          description: Invalid request (e.g. OTHER reason without notes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Missing inventory:scrap:create, or override requested without inventory:adjustment:override
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: 'Insufficient on-hand for the auto-approved posting (SCRAP_INSUFFICIENT_STOCK): reconcile via cycle count or adjustment, or use an authorized negative-stock override'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:scrap:create
      x-required-permissions:
      - inventory:scrap:create
  /v1/inventory/scraps/{scrapId}/reject:
    post:
      tags:
      - Scraps
      summary: Reject scrap
      description: 'Rejects a PENDING_APPROVAL scrap with a recorded reason; no ledger posting or on-hand change is made and the document moves to the terminal REJECTED status.

        Use this tool when the write-off should not happen (for example the part was recovered); do not use approveScrap, which posts the SCRAP_OUT entry.

        Preconditions: the scrap must exist and be in PENDING_APPROVAL status; the rejecting actor is taken from the authenticated context, not the body.

        Required inputs: scrapId (UUID) path parameter and rejectionReason (non-blank, max 1000 characters) in the body.

        Emits an INVENTORY_SCRAP_REJECT event; inventory is untouched.

        Returns 404 when the scrap does not exist, and 409 when it is not in PENDING_APPROVAL status.

        '
      operationId: rejectScrap
      parameters:
      - name: scrapId
        in: path
        description: Scrap document ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Rejection context recording why the write-off is discarded.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectScrapRequest'
            examples:
              Rejection:
                description: Rejection
                value:
                  rejectionReason: Part was recovered and restocked
        required: true
      responses:
        '200':
          description: Scrap rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapResponse'
        '404':
          description: Scrap not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Scrap is not in a rejectable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:scrap:approve
      x-required-permissions:
      - inventory:scrap:approve
  /v1/inventory/scraps/{scrapId}/approve:
    post:
      tags:
      - Scraps
      summary: Approve scrap
      description: 'Approves a PENDING_APPROVAL scrap and posts its SCRAP_OUT entry to the inventory ledger, reducing on-hand at the posting location and emitting a ScrapPostedV1 fact.

        Use this tool after reviewing an above-threshold or unknown-value scrap; do not use rejectScrap, which discards it without touching inventory.

        Preconditions: the scrap must exist and be in PENDING_APPROVAL status, and sufficient on-hand must exist at the posting location unless an authorized negative-stock override is passed — an insufficient-stock rejection rolls back and the scrap stays PENDING_APPROVAL.

        Required inputs: scrapId (UUID) path parameter; the body carries only negativeStockOverride (default false), honored only when the caller holds inventory:adjustment:override; the approving actor comes from the authenticated context.

        Emits an INVENTORY_SCRAP_APPROVE event plus the ScrapPostedV1 fact on the posting, and a scrap created with shouldReplenish triggers a best-effort replenishment evaluation.

        Returns 404 when the scrap does not exist, 409 when it is not PENDING_APPROVAL, 403 when the override is requested without the permission, and 422 (SCRAP_INSUFFICIENT_STOCK) when on-hand is insufficient — reconcile via cycle count or adjustment, or use an authorized override.

        '
      operationId: approveScrap
      parameters:
      - name: scrapId
        in: path
        description: Scrap document ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Approval context; only the optional negative-stock override travels in the body.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveScrapRequest'
            examples:
              Approval without override:
                description: Approval without override
                value:
                  negativeStockOverride: false
        required: true
      responses:
        '200':
          description: Scrap approved and posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapResponse'
        '403':
          description: Missing inventory:scrap:approve, or override requested without inventory:adjustment:override
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Scrap not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Scrap is not in an approvable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: 'Insufficient on-hand (SCRAP_INSUFFICIENT_STOCK): reconcile via cycle count or adjustment, or use an authorized negative-stock override'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:scrap:approve
      x-required-permissions:
      - inventory:scrap:approve
  /v1/inventory/returns/submit-to-stock:
    post:
      tags:
