            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: User lacks required reservation authority
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Reservation not found
      security:
      - bearerAuth:
        - inventory:adjustment:create
