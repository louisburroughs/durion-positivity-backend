  /v1/inventory/supplierStockHints/byCode:
    get:
      description: 'Returns what each vendor last reported about an article identified by a code, whether or not the article has been resolved to a catalog product.

        Use this tool when the article is known by an EAN or by an article code rather than by a product id — in particular for articles no product in the catalog carries, whose hints are retained and reachable only this way.

        Preconditions: none; an unknown code simply matches nothing.

        Required inputs: identityKind (EAN, BUYER_ARTICLE or SUPPLIER_ARTICLE) and value, matched exactly after trimming.

        Emits INVENTORY_SUPPLIER_STOCK_HINT_LIST_BY_CODE for audit; this is a read of what vendors reported and changes no state.

        Returns 200 with an empty array when no vendor stated that code. The availability, snapshotAsOf and asOfSource fields carry the same meanings as on the by-product listing, and an entry with a null resolvedProductId is an article we have not tied to a catalog product, not an error.

        '
      operationId: listSupplierStockHintsByCode
      parameters:
      - description: Identifier scheme the value belongs to
        in: query
        name: identityKind
        required: true
        schema:
          enum:
          - EAN
          - BUYER_ARTICLE
          - SUPPLIER_ARTICLE
          type: string
      - description: Exact code value; trimmed, otherwise matched verbatim
        in: query
        name: value
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SupplierStockHintView'
                type: array
          description: Vendor hints stating the code, empty when none do
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: User lacks the supplier stock hint view authority
      security:
      - bearerAuth:
        - inventory:supplier_stock_hint:view
      summary: List vendor availability hints for an article code
      tags:
      - Supplier Stock Hints
      x-required-permissions:
      - inventory:supplier_stock_hint:view
  /v1/inventory/supplierStockHints/byProduct/{productId}:
    get:
      description: 'Returns what each vendor last reported about its own availability of a product, one entry per vendor, newest fetch first.

        Use this tool to tell a customer what a supplier says it can supply for a future need; do not use it to decide what can be promised or committed today, which is owned availability-to-promise and comes from the availability endpoints instead.

        Preconditions: none; the product need not exist, and hints appear only for articles that have been resolved to it.

        Required inputs: productId as a path parameter.

        Emits INVENTORY_SUPPLIER_STOCK_HINT_LIST_BY_PRODUCT for audit; this is a read of what vendors reported and changes no state.

        Returns 200 with an empty array when no vendor has reported the product, which means no vendor has said anything about it — NOT that it is unavailable. Read each entry''s availability field: REPORTED carries the vendor''s quantity (0 meaning the vendor explicitly has none), QUANTITY_NOT_STATED means the vendor listed the article without a quantity, and STALE_UNKNOWN means the vendor''s figure is too old to repeat. Judge freshness on snapshotAsOf, the vendor''s own figure, and check asOfSource: when it is FETCH the vendor stated no time and the age shown is only when we asked.

        '
      operationId: listSupplierStockHintsByProduct
      parameters:
      - description: Catalog product to report vendor availability for
        in: path
        name: productId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SupplierStockHintView'
                type: array
          description: Vendor hints for the product, empty when none have been reported
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: User lacks the supplier stock hint view authority
      security:
      - bearerAuth:
        - inventory:supplier_stock_hint:view
      summary: List vendor availability hints for a product
      tags:
      - Supplier Stock Hints
      x-required-permissions:
      - inventory:supplier_stock_hint:view
