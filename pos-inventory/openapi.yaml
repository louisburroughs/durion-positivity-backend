    LedgerPage:
      type: object
      description: A single page of ledger entries with an optional cursor to the next page
      properties:
        entries:
          type: array
          description: Ledger entries contained in this page
        nextPageToken:
          type: string
          description: Opaque cursor for the next page; null when there are no more entries
          example: eyJvZmZzZXQiOjUwfQ==
      required:
      - entries
    InventoryLedgerEntryDto:
      type: object
      description: Inventory ledger entry record capturing a single stock movement or allocation event
      properties:
        ledgerEntryId:
          type: string
          format: uuid
          description: Unique identifier of the ledger entry
          example: 01960003-0000-7000-8000-000000000001
        stockItemId:
          type: string
          description: Identifier of the stock item the entry applies to
          example: SKU-10042
        adjustmentId:
          type: string
          format: uuid
          description: Identifier of the adjustment that produced this entry, if any
          example: 01960003-0000-7000-8000-000000000002
        eventType:
          type: string
          description: Type of inventory ledger event recorded
          enum:
          - GOODS_RECEIPT
          - TRANSFER_IN
          - PUTAWAY
          - RETURN_TO_STOCK
          - ADJUSTMENT_IN
          - COUNT_VARIANCE_IN
          - GOODS_ISSUE
          - WORKORDER_CONSUMPTION
          - TRANSFER_OUT
          - SCRAP_OUT
          - ADJUSTMENT_OUT
          - COUNT_VARIANCE_OUT
          - ADJUST_CYCLE_COUNT
          - RESERVATION_CREATED
          - RESERVATION_RELEASED
          - ALLOCATION_CREATED
          - ALLOCATION_RELEASED
          - BACKORDER_CREATED
          - BACKORDER_RESOLVED
          - PICK_TASK_CREATED
          - PICK_TASK_COMPLETED
          example: GOODS_RECEIPT
        changeInQuantity:
          type: integer
          format: int32
          description: Signed change in quantity applied by this entry (positive inbound, negative outbound)
          example: 12
        quantityAfter:
          type: integer
          format: int32
          description: Running quantity after this entry was applied
          example: 120
        unitCost:
          type: number
          description: Unit cost associated with this movement, if recorded
          example: 4.5
        transactionUserId:
          type: string
          description: Identifier of the user who initiated the transaction
          example: 01960003-0000-7000-8000-000000000003
        timestamp:
          type: string
          format: date-time
          description: Business timestamp of the inventory event
          example: 2026-01-15 09:30:00+00:00
        locationId:
          type: string
          format: uuid
          description: Location the entry applies to
          example: 01960003-0000-7000-8000-000000000004
        fromLocationId:
          type: string
          format: uuid
          description: Source location for transfer events
          example: 01960003-0000-7000-8000-000000000005
        toLocationId:
          type: string
          format: uuid
          description: Destination location for transfer events
          example: 01960003-0000-7000-8000-000000000006
        reasonCode:
          type: string
          description: Reason code explaining the entry
          example: CYCLE_COUNT
        sourceTransactionId:
          type: string
          description: Identifier of the originating source transaction
          example: 01960003-0000-7000-8000-000000000007
        unitOfMeasure:
          type: string
          description: Unit of measure code for the quantities (e.g. EACH, KG)
          example: EACH
        notes:
          type: string
          description: Free-text notes attached to the entry
          example: Variance corrected after recount
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the entry record was created
          example: 2026-01-15 09:30:00+00:00
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the entry record was last updated
          example: 2026-01-15 09:35:00+00:00
      required:
      - changeInQuantity
      - eventType
      - ledgerEntryId
      - quantityAfter
      - stockItemId
      - timestamp
    CycleCountTaskResponse:
      type: object
      description: A cycle count task describing an item to be counted at a location and its current state
      properties:
        taskId:
          type: string
          format: uuid
          description: Unique identifier of the cycle count task
          example: 01960003-0000-7000-8000-000000000001
        binLocation:
          type: string
          description: Bin or location code where the item is stored
          example: LOC-001
        itemSku:
          type: string
          description: Stock keeping unit of the item to count
          example: SKU-10042
        itemDescription:
          type: string
          description: Human-readable description of the item
          example: Stainless steel water bottle, 750ml
        expectedQuantity:
          type: integer
          format: int32
          description: Quantity expected on hand for the item
          example: 15
        auditorId:
          type: string
          description: Identifier of the auditor assigned to the task, if assigned
          example: auditor-10042
        status:
          type: string
          description: Current status of the cycle count task
          enum:
          - ASSIGNED
          - COUNTED_PENDING_REVIEW
          - CONFLICT
          - REQUIRES_INVESTIGATION
          - APPROVED
          - REJECTED
          example: ASSIGNED
        latestCountEntryId:
          type: string
          format: uuid
          description: Identifier of the most recent count entry recorded for the task, if any
          example: 01960003-0000-7000-8000-000000000002
        countEntriesCount:
          type: integer
          format: int32
          description: Total number of count entries recorded for the task
          example: 2
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the task was created
          example: 2026-01-15 09:30:00+00:00
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the task was last updated
          example: 2026-01-15 10:05:00+00:00
      required:
      - binLocation
      - countEntriesCount
      - createdAt
      - expectedQuantity
      - itemSku
      - status
      - taskId
      - updatedAt
    InterferingMovementResponse:
      type: object
      description: Ledger movement recorded between cycle-count task creation and now for the task's SKU/location
      properties:
        ledgerEntryId:
          type: string
          format: uuid
          description: Unique identifier of the ledger entry
          example: 01960003-0000-7000-8000-000000000001
        eventType:
          type: string
          description: Type of inventory ledger event recorded
          enum:
          - GOODS_RECEIPT
          - TRANSFER_IN
          - PUTAWAY
          - RETURN_TO_STOCK
          - ADJUSTMENT_IN
          - COUNT_VARIANCE_IN
          - GOODS_ISSUE
          - WORKORDER_CONSUMPTION
          - TRANSFER_OUT
          - SCRAP_OUT
          - ADJUSTMENT_OUT
          - COUNT_VARIANCE_OUT
          - ADJUST_CYCLE_COUNT
          - RESERVATION_CREATED
          - RESERVATION_RELEASED
          - ALLOCATION_CREATED
          - ALLOCATION_RELEASED
          - BACKORDER_CREATED
          - BACKORDER_RESOLVED
          - PICK_TASK_CREATED
          - PICK_TASK_COMPLETED
          example: GOODS_ISSUE
        changeInQuantity:
          type: integer
          format: int32
          description: Signed change in quantity applied by this entry (positive inbound, negative outbound)
          example: -3
        quantityAfter:
          type: integer
          format: int32
          description: Running quantity after this entry was applied
          example: 7
        locationId:
          type: string
          format: uuid
          description: Location the entry applies to
          example: 01960003-0000-7000-8000-000000000004
        timestamp:
          type: string
          format: date-time
          description: Business timestamp of the inventory event
          example: 2026-01-15 09:30:00+00:00
        transactionUserId:
          type: string
          description: Identifier of the user who initiated the transaction
