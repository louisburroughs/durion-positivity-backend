  /v1/inventory/locations/sync:
    post:
      description: 'Requests an administrative re-emit of pos-location''s outbox on the location.commands.v1 topic so the location.events.v1 consumer idempotently repairs the local location roster replica.

        Use this tool when the roster replica looks stale or damaged; use listSyncLogs instead to inspect past runs — the repair completes asynchronously, so this call never returns repaired counts.

        Preconditions: the Kafka location event feed must be enabled; with the feed disabled the run is recorded as FAILED instead of REQUESTED.

        Required inputs: none in the body; an optional Idempotency-Key header makes retries safe — re-sending the same key returns the original run — and an optional X-Correlation-Id header is recorded on the run log.

        Emits an INVENTORY_LOCATION_SYNC_TRIGGER event and writes one sync-log run entry; the re-emit covers the configured lookback window (pos.inventory.location.replay-lookback, default P30D).

        Returns 202 with outcome REQUESTED when the replay command was published, and 202 with outcome FAILED and the error recorded in the sync log when publishing was not possible.

        '
      operationId: triggerLocationSync
      parameters:
      - description: Client-generated key that makes retries idempotent
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      - in: header
        name: X-Correlation-Id
        required: false
        schema:
          type: string
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationSyncRunResponse'
          description: Re-emit requested (outcome REQUESTED) or the failure recorded in the sync log
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: User lacks required sync authority
      security:
      - bearerAuth:
        - inventory:location:sync
      summary: Trigger a location roster re-sync
      tags:
      - Location Sync
      x-required-permissions:
      - inventory:location:sync
  /v1/inventory/locations/{locationId}/deactivate:
    post:
      description: 'Deactivates a storage location, atomically transferring any remaining on-hand stock to a destination location in the same site through paired TRANSFER_OUT and TRANSFER_IN ledger entries with reason LOCATION_DEACTIVATION_TRANSFER.

        Use this tool to retire a bin or storage location; do not use triggerLocationSync, which repairs the roster replica, and do not use it for routine stock relocation between active locations.

        Preconditions: the location must exist and be active; when it holds stock, the destination must exist, be active, differ from the source and belong to the same site.

        Required inputs: locationId (UUID) path parameter; the body is optional and carries destinationLocationId, which becomes mandatory when the source holds stock.

        Emits an INVENTORY_LOCATION_DEACTIVATE event, posts the transfer entries when stock is moved and publishes an audit event; the response reports status Inactive with the moved items.

        Returns 404 when the source or destination location is unknown, 409 when the source or destination is already inactive, and 400 when destinationLocationId is missing while stock remains, equals the source, or belongs to a different site.

        '
      operationId: deactivateInventoryLocation
      parameters:
      - description: Location ID to deactivate
        in: path
        name: locationId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Deactivate and move stock:
                description: Deactivate and move stock
                value:
                  destinationLocationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a02
            schema:
              $ref: '#/components/schemas/DeactivateLocationRequest'
        description: Optional destination for the remaining stock; mandatory when the location still holds inventory.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeactivateLocationResponse'
          description: Deactivation completed
        '400':
