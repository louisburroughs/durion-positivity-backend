        pickListId:
          type: string
          format: uuid
          description: Unique identifier of the pick list
          example: 01960003-0000-7000-8000-000000000030
        workorderId:
          type: string
          format: uuid
          description: Identifier of the workorder the pick list fulfills
          example: 01960003-0000-7000-8000-000000000031
        status:
