  /v1/inventory/cycleCountAdjustments/{adjustmentId}/approve:
    post:
      tags:
      - Cycle Count Adjustments
      summary: Approve adjustment
      description: 'Approves a PENDING_APPROVAL cycle count adjustment and posts its COUNT_VARIANCE_IN or COUNT_VARIANCE_OUT entry to the inventory ledger, marking the linked task APPROVED.

        Use this tool after reviewing a pending adjustment; do not use rejectCycleCountAdjustment, which discards it without touching inventory.

        Preconditions: the adjustment must be in PENDING_APPROVAL; for a task-linked adjustment the conflict gate applies — a first approval that detects in-window stock movements flags the task CONFLICT and aborts, and re-approving a CONFLICT task recomputes the variance against current on-hand rather than the stale snapshot (a recomputed zero variance approves without posting anything).

        Required inputs: adjustmentId (UUID) path parameter; the body''s approverUserId is legacy and ignored — the actor is resolved from the authenticated context; notes are optional, and an optional X-Correlation-Id header is propagated to the audit event.

        Emits an INVENTORY_CYCLE_COUNT_ADJUSTMENT_APPROVE event plus a MovementAdjusted audit event, and the posting changes on-hand immediately.

        Returns 400 when no adjustment exists for the id (the unknown id maps to a validation error, not 404), and 409 when the adjustment is not PENDING_APPROVAL or the conflict gate rejects the first approval (CYCLE_COUNT_CONFLICT).

        '
      operationId: approveCycleCountAdjustment
      parameters:
      - name: adjustmentId
        in: path
        description: Adjustment ID
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          type: string
      requestBody:
        description: Approval context; the authoritative approver is resolved server-side from the authenticated caller.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveAdjustmentRequest'
            examples:
              Approval with notes:
                description: Approval with notes
                value:
                  notes: Variance confirmed against receiving log
        required: true
      responses:
        '200':
          description: Adjustment approved and posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdjustmentResponse'
        '400':
          description: Adjustment not found or not in approvable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdjustmentResponse'
        '403':
          description: User lacks required approval permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdjustmentResponse'
        '409':
          description: Adjustment not PENDING_APPROVAL, or conflict gate rejected the approval (CYCLE_COUNT_CONFLICT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:adjustment:approve
      x-required-permissions:
      - inventory:adjustment:approve
  /v1/inventory/cycleCount/submit:
    post:
      tags:
      - Cycle Count Operations
      - Cycle Count API
      summary: Submit a count for a cycle count task
      description: 'Records the auditor''s initial physical count for an ASSIGNED cycle count task, computes the variance against the task''s expected-quantity snapshot, and moves the task to COUNTED_PENDING_REVIEW — or to CONFLICT when on-hand-affecting stock movements occurred during the count window.

        Use this tool for the first count of a task; do not use submitCycleCountRecount, which records a follow-up count, and do not use createCycleCountAdjustment, which posts the settled variance to the ledger.

        Preconditions: the task must exist and be in ASSIGNED status; stock movements are never frozen during counts, so a CONFLICT outcome is expected behaviour, not an error.

        Required inputs: taskId (UUID), auditorId, and actualQuantity (integer, zero or positive).

        Emits an INVENTORY_CYCLE_COUNT_SUBMIT event; a count entry is recorded but no ledger posting or on-hand change happens here.

        Returns 404 when the task does not exist, 409 when the task is not in ASSIGNED status, and 400 when actualQuantity is negative.

