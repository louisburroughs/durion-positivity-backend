        notes:
          type: string
          description: Free-text notes recorded with the entry
      required:
      - changeInQuantity
      - eventType
      - ledgerEntryId
      - timestamp
    CountEntryResponse:
      type: object
      description: A single recorded count entry in a cycle count task's history
      properties:
        countEntryId:
          type: string
          format: uuid
          description: Unique identifier of the count entry
          example: 01960003-0000-7000-8000-000000000001
        cycleCountTaskId:
          type: string
          format: uuid
          description: Identifier of the cycle count task this entry belongs to
          example: 01960003-0000-7000-8000-000000000002
        auditorId:
          type: string
          description: Identifier of the auditor who recorded the count
          example: auditor-10042
        actualQuantity:
          type: integer
          format: int32
          description: Quantity physically counted by the auditor
          example: 12
        expectedQuantity:
          type: integer
          format: int32
          description: Quantity expected on hand at the time of the count
          example: 15
        variance:
          type: integer
          format: int32
          description: Difference between counted and expected quantity (actual minus expected)
          example: -3
        recountSequenceNumber:
          type: integer
          format: int32
          description: Sequence number of this count within the recount chain; 0 for the initial count
          example: 1
        recountOfCountEntryId:
          type: string
          format: uuid
          description: Identifier of the count entry this entry is a recount of, if any
          example: 01960003-0000-7000-8000-000000000003
        countedAt:
          type: string
          format: date-time
          description: Timestamp when the count was recorded
          example: 2026-01-15 09:30:00+00:00
        recount:
          type: boolean
          description: Whether this entry is a recount of a prior count
          example: false
      required:
      - actualQuantity
      - auditorId
      - countEntryId
      - countedAt
      - cycleCountTaskId
      - expectedQuantity
      - recount
      - recountSequenceNumber
      - variance
    BackorderResponse:
      type: object
      description: 'A backorder: unfulfilled workorder-line demand held open until availability covers it'
      properties:
        backorderId:
          type: string
          format: uuid
          description: Backorder record identifier
        workorderLineId:
          type: string
          format: uuid
          description: Workorder line whose demand was short
        sku:
          type: string
          description: SKU / stock-item identifier that was short
        locationId:
          type: string
          format: uuid
          description: Site the demand is short at
        quantityShort:
          type: integer
          format: int32
          description: Quantity that could not be fulfilled (positive)
        status:
          type: string
          description: 'Lifecycle status: OPEN, RESOLVED, or CANCELLED'
          enum:
          - OPEN
          - RESOLVED
          - CANCELLED
        resolutionSource:
          type: string
          description: What drove resolution; null while OPEN or CANCELLED
          enum:
          - AVAILABILITY
          - REPLENISHMENT_RECEIPT
          - MANUAL
        createdBy:
          type: string
          description: Actor that opened the backorder
        createdAt:
          type: string
          format: date-time
          description: When the backorder was opened
        updatedAt:
          type: string
          format: date-time
          description: When the backorder was last updated
        resolvedAt:
          type: string
          format: date-time
          description: When the backorder was resolved; null otherwise
    AvailabilityView:
      type: object
      description: Read-only view of on-hand and available-to-promise quantities for a product at a specific location scope
      properties:
        productSku:
          type: string
          description: Stock-keeping unit identifier of the product
          example: SKU-10042
        locationId:
          type: string
          format: uuid
          description: Location identifier for the scope of this availability view
          example: 01960003-0000-7000-8000-000000000001
        storageLocationId:
          type: string
          format: uuid
          description: Optional storage sub-location identifier; null when scoped to the full location
          example: 01960003-0000-7000-8000-000000000002
        onHandQuantity:
          type: integer
          format: int32
          description: Net on-hand quantity (sum of affectsOnHand ledger entries)
          example: 120
        allocatedQuantity:
          type: integer
          format: int32
          description: Net allocated quantity (ALLOCATION_CREATED minus ALLOCATION_RELEASED)
          example: 30
        availableToPromiseQuantity:
          type: integer
          format: int32
          description: Available-to-promise quantity, equal to onHandQuantity minus allocatedQuantity
          example: 90
        unitOfMeasure:
          type: string
          description: Unit of measure code for the quantities (e.g. EACH, KG)
          example: EACH
        incomingQty:
          type: integer
          format: int64
          description: 'Open expected supply: approved purchase-order open line quantity plus un-received ASN remainder. Site-level when a location scope is given. Bounded by the ''horizon'' query parameter when present (documents without an expected date are excluded from horizon-bounded results). Omitted for as-of (historical) requests.'
          example: 25
        outgoingQty:
          type: integer
          format: int64
          description: 'Open expected demand not yet decremented from on-hand: unallocated reservation remainders plus released-not-picked pick-task remainders. Reservation demand carries no site and is included in every scope. Omitted for as-of (historical) requests.'
          example: 10
        projectedAvailable:
          type: integer
          format: int64
          description: 'Projected availability: onHandQuantity + incomingQty - outgoingQty. Omitted for as-of (historical) requests.'
          example: 135
      required:
      - allocatedQuantity
      - availableToPromiseQuantity
      - locationId
      - onHandQuantity
      - productSku
      - unitOfMeasure
    LocationAvailabilityDto:
      type: object
      description: Per-location availability projection for inventory availability queries
      properties:
        locationId:
          type: string
          format: uuid
          description: Identifier of the location
          example: 01960003-0000-7000-8000-000000000001
        locationName:
          type: string
          description: Human-readable name of the location
          example: Main Warehouse
        onHandQuantity:
          type: integer
          format: int32
          description: On-hand quantity at the location
          example: 120
        availableToPromiseQuantity:
          type: integer
          format: int32
          description: 'Available-to-promise quantity at the location. Null for as-of (historical) requests: historical allocation state is not reliably reconstructable from ATP-neutral ledger events, so as-of responses carry on-hand only.'
          example: 90
        incomingQty:
          type: integer
          format: int64
          description: 'Open expected supply at the site: approved purchase-order open line quantity plus un-received ASN remainder. Bounded by the ''horizon'' query parameter when present (documents without an expected date are excluded from horizon-bounded results). Omitted for as-of requests.'
          example: 25
        outgoingQty:
          type: integer
          format: int64
          description: 'Open expected demand not yet decremented from on-hand: unallocated reservation remainders plus released-not-picked pick-task remainders. Reservation demand carries no site and is included in every site row. Omitted for as-of requests.'
          example: 10
        projectedAvailable:
          type: integer
          format: int64
          description: 'Projected availability: onHandQuantity + incomingQty - outgoingQty (Odoo virtual_available). Omitted for as-of requests.'
          example: 135
      required:
      - locationId
      - locationName
      - onHandQuantity
    LeadTimeView:
      type: object
      description: Lead-time view returned by inventory for product detail aggregation
      properties:
        productId:
          type: string
          format: uuid
          description: Product identifier
          example: 01960003-0000-7000-8000-000000000001
        locationId:
          type: string
          format: uuid
          description: Location identifier
          example: 01960003-0000-7000-8000-000000000002
        source:
          type: string
          description: Source of lead-time data
          example: INVENTORY
        minDays:
          type: integer
          format: int32
          description: Minimum lead-time in days
          example: 2
        maxDays:
          type: integer
          format: int32
          description: Maximum lead-time in days
          example: 5
        displayText:
          type: string
          description: Human-readable lead-time text
          example: 2-5 business days
        confidence:
          type: string
          description: Confidence level for this estimate
          example: HIGH
        asOf:
          type: string
          format: date-time
          description: Timestamp when lead-time data was last refreshed
          example: 2026-01-15 09:30:00+00:00
      required:
      - locationId
      - productId
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
