  /v1/inventory/receiving/sessions:
    post:
      tags:
      - Receiving
      summary: Create Receiving Session
      description: 'Creates an OPEN receiving session against a source document, pre-populating one EXPECTED line per source-document line fetched from the owning service.

        Use this tool to start a line-by-line receiving workflow before recording actual quantities with receiveItemsIntoStaging; do not use createGoodsReceipt, which posts stock against a purchase order in one call without a session.

        Preconditions: the source document must resolve to at least one receivable line and must not already be fully received; the document type is detected from the id prefix, ASN when the id starts with ASN and PO otherwise.

        Required inputs: sourceDocumentId (non-blank string); entryMethod is optional and defaults to MANUAL, with SCAN the other accepted value.

        Emits an INVENTORY_RECEIVING_SESSION_CREATE event; no stock is posted, the session only stages expected quantities until items are received.

        Returns 404 when the source document yields no receiving lines, and 400 when the source document has already been fully received or entryMethod is not a known value.

        '
      operationId: createReceivingSession
      requestBody:
        description: Source document to receive against and the line entry method.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReceivingSessionRequest'
            examples:
              Manual PO receiving session:
                description: Manual PO receiving session
                value:
                  sourceDocumentId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a02
                  entryMethod: MANUAL
        required: true
      responses:
        '201':
          description: Receiving session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivingSessionResponse'
        '400':
          description: Validation failure or source document already fully received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
