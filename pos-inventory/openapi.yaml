  /v1/inventory/cycleCount/recount:
    post:
      description: 'Records a recount for a cycle count task, appending a new count entry with a recomputed variance and re-running conflict detection against the task''s count window.

        Use this tool when a prior count is disputed or a conflict forces recounting; do not use submitCycleCount, which records the first count of a task.

        Preconditions: the task must exist and hold fewer than 3 total counts (the original plus 2 recounts — an attempt beyond the limit flags the task REQUIRES_INVESTIGATION); permission TRIGGER_RECOUNT_SELF covers only the first recount by the original auditor, while TRIGGER_RECOUNT_ANY (manager) covers any recount.

        Required inputs: taskId (UUID), auditorId, actualQuantity (zero or positive), and permission (TRIGGER_RECOUNT_SELF or TRIGGER_RECOUNT_ANY).

        Emits an INVENTORY_CYCLE_COUNT_RECOUNT event; a task already in CONFLICT stays CONFLICT while in-window movements remain, because the expected-quantity snapshot is still stale.

        Returns 404 when the task does not exist, 400 when the recount limit is already reached (RECOUNT_LIMIT_EXCEEDED) or actualQuantity is negative, and 403 when the permission context does not authorize this recount.

        '
      operationId: submitCycleCountRecount
      requestBody:
        content:
          application/json:
            examples:
              Auditor self-recount:
                description: Auditor self-recount
                value:
                  actualQuantity: 13
                  auditorId: auditor-10042
                  permission: TRIGGER_RECOUNT_SELF
                  taskId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
            schema:
              $ref: '#/components/schemas/SubmitRecountRequest'
        description: Recount submission carrying the task, the auditor, the newly counted quantity, and the permission context authorizing the recount.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
          description: Recount submitted successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
          description: Invalid request or recount limit exceeded
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
          description: Insufficient permission
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
          description: Task not found
      security:
      - bearerAuth:
        - inventory:cycle_count:complete
      summary: Submit a recount for a cycle count task
      tags:
      - Cycle Count Operations
      - Cycle Count API
      x-required-permissions:
      - inventory:cycle_count:complete
  /v1/inventory/cycleCount/submit:
    post:
      description: 'Records the auditor''s initial physical count for an ASSIGNED cycle count task, computes the variance against the task''s expected-quantity snapshot, and moves the task to COUNTED_PENDING_REVIEW — or to CONFLICT when on-hand-affecting stock movements occurred during the count window.

        Use this tool for the first count of a task; do not use submitCycleCountRecount, which records a follow-up count, and do not use createCycleCountAdjustment, which posts the settled variance to the ledger.

        Preconditions: the task must exist and be in ASSIGNED status; stock movements are never frozen during counts, so a CONFLICT outcome is expected behaviour, not an error.

        Required inputs: taskId (UUID), auditorId, and actualQuantity (integer, zero or positive).

        Emits an INVENTORY_CYCLE_COUNT_SUBMIT event; a count entry is recorded but no ledger posting or on-hand change happens here.

        Returns 404 when the task does not exist, 409 when the task is not in ASSIGNED status, and 400 when actualQuantity is negative.

        '
      operationId: submitCycleCount
      requestBody:
        content:
          application/json:
            examples:
              Initial count:
                description: Initial count
                value:
                  actualQuantity: 12
                  auditorId: auditor-10042
                  taskId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
            schema:
              $ref: '#/components/schemas/SubmitCountRequest'
        description: Initial count submission identifying the task, the auditor, and the quantity physically found.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
          description: Count submitted successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
          description: Invalid request or quantity
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
          description: Task not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Task is not in ASSIGNED status
      security:
      - bearerAuth:
        - inventory:cycle_count:complete
      summary: Submit a count for a cycle count task
      tags:
      - Cycle Count Operations
      - Cycle Count API
      x-required-permissions:
      - inventory:cycle_count:complete
