  /v1/inventory/pick-lists/{pickListId}/tasks/{taskId}/confirm:
    post:
      description: 'Confirms one pick task against scanned data, marking it PICKED with the quantity picked and the lot the units were taken from; when every task on the list is PICKED the pick list flips to COMPLETED.

        Use this tool once per physical pick; do not use confirmPickingList on the pickingLists path, which is an unimplemented stub that always returns 501, and do not use consumePickedItems until after confirmation — consumption posts the stock decrement, while confirmation posts no ledger entries.

        Preconditions: the pick task must exist and belong to the pick list; for a LOT-tracked SKU the lot must be keyed and resolve to an existing ACTIVE lot.

        Required inputs: pickListId and taskId (UUIDs) as path parameters, plus scannedSkuId (UUID), scannedLocationId (UUID) and quantityPicked (positive, at most the task''s required quantity); lotNumber is required for LOT-tracked SKUs, ignored for untracked ones, and overrides the task''s advisory suggestedLotNumber.

        Emits an INVENTORY_PICK_TASK_CONFIRM event; the resolved pickedLotId is stored on the task and travels to the consumption posting.

        Returns 404 when the pick list or task is unknown or the task belongs to another list, 422 with PICK_SCAN_MISMATCH when scannedSkuId differs from the task''s product, 422 with LOT_NUMBER_REQUIRED, LOT_UNKNOWN or LOT_NOT_AVAILABLE for lot failures, and 400 when quantityPicked exceeds the required quantity.

        '
      operationId: confirmPickTask
      parameters:
      - description: Pick list identifier
        in: path
        name: pickListId
        required: true
        schema:
          format: uuid
