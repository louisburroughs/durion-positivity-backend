  /v1/inventory/ledger:
    get:
      description: 'Returns one token-paged slice of inventory ledger entries in stable ledgerEntryId order, optionally filtered by SKU, location, timestamp range, source transaction and movement types.

        Use this tool to trace stock movement history and audit on-hand changes; use getInventoryLedgerEntry instead when the entryId is already known, and getInventoryValuation when a value report rather than raw movements is wanted.

