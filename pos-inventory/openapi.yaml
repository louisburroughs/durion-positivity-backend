      summary: Query per-location inventory availability
      description: 'Returns per-location availability for a product: on-hand, available-to-promise and the forecast quantities incomingQty, outgoingQty and projectedAvailable computed from open purchase orders, ASNs, reservations and released pick tasks; ATP in this per-location list subtracts hard allocations, soft reservations and expired ACTIVE lot on-hand from on-hand.

        Use this tool when the productId is known and a per-location breakdown is wanted; use getAvailabilityBySku instead for a single aggregated view keyed by SKU, and getInventoryLeadTime for lead-time estimates.

        Preconditions: none for the current view; an asOf request additionally requires the inventory:ledger:view authority because it exposes ledger history.

        Required inputs: productId (UUID) path parameter; horizon (ISO-8601 instant) optionally bounds incomingQty/outgoingQty and excludes documents without an expected date; asOf (ISO-8601 instant) switches to historical on-hand computed by direct ledger aggregation, in which case availableToPromiseQuantity and the forecast fields are null because historical allocation state is not reliably reconstructable.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 400 when asOf is combined with horizon (INVALID_PARAM_COMBINATION) or productId is missing, 403 when an asOf request lacks inventory:ledger:view, and 422 when asOf is in the future (AS_OF_IN_FUTURE).

