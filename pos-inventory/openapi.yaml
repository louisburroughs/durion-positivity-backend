          example: 20
          type: number
        auditRecordsCreated:
          description: Number of audit records created during the reallocation
          example: 3
          format: int32
          type: integer
        stockItemId:
          description: Identifier of the stock item that was reallocated
          example: 01960003-0000-7000-8000-000000000110
          format: uuid
          type: string
        totalReallocated:
          description: Total quantity reallocated across all affected reservations
          example: 12
          format: int32
          type: integer
      required:
      - atpAfterReallocation
      - auditRecordsCreated
      - stockItemId
      - totalReallocated
      type: object
    ReasonCodeDto:
      description: Reference entry describing a valid reason a returned item can be assigned
      properties:
        category:
          description: Grouping category the reason code belongs to
          example: QUALITY
          type: string
        code:
          description: Machine-readable reason code
          example: DAMAGED
          type: string
        description:
          description: Human-readable explanation of the reason code
          example: Item arrived damaged or defective
          type: string
      required:
      - code
      - description
      type: object
    ReceiveItemsRequest:
      description: Request to record received quantities for one or more receiving session lines
      properties:
        lines:
          description: Receiving lines with their received quantities; at least one line is required
          items:
            $ref: '#/components/schemas/ReceiveLineRequest'
          minItems: 1
          type: array
      required:
      - lines
      type: object
    ReceiveItemsResponse:
      description: Result of recording received quantities for a receiving session
      properties:
        linesProcessed:
          description: Number of receiving lines processed in this request
          example: 3
          format: int32
          type: integer
        sessionId:
          description: Identifier of the receiving session the items were recorded against
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        sessionStatus:
          description: Status of the receiving session after recording the items
          example: IN_PROGRESS
          type: string
        variances:
          description: Variance summaries for lines whose received quantity differed from the expected quantity
          items:
            $ref: '#/components/schemas/VarianceSummaryResponse'
          type: array
      required:
      - linesProcessed
      - sessionId
      - sessionStatus
      type: object
    ReceiveLineRequest:
      description: Received quantity recorded against a single receiving session line
      properties:
        documentQuantity:
          description: Quantity received expressed in documentUom; must be supplied together with documentUom
          example: 1
          minimum: 0
          type: number
        documentUom:
          description: Optional UoM the line is keyed in (e.g. CASE). When present, documentQuantity is converted to the product's base UoM at posting time; a UoM with no conversion path is rejected with 422 UOM_CONVERSION_UNDEFINED
          example: CASE
          type: string
        expirationDate:
          description: Optional expiration date of the received lot (odoo-parity E3). Stamped on the lot on first receipt for LOT-tracked products; ignored for untracked products and for lots that already exist (correct an existing lot via the lot-management endpoint)
          example: 2027-01-31
          format: date
          type: string
        lineId:
          description: Identifier of the receiving line being recorded
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        lotNumber:
          description: Lot or batch number of the received stock. Required (422 LOT_NUMBER_REQUIRED) when the product is LOT-tracked per the catalog replica; ignored for tracking purposes otherwise
          example: LOT-2026-0042
          type: string
        receivedQuantity:
          description: Quantity actually received for the line, in the product's base UoM; may be zero. Required unless documentUom/documentQuantity are supplied, in which case the base quantity is derived and this field is ignored
          example: 8
          minimum: 0.0
          type: number
        serialNumbers:
          description: 'Serial numbers of the received units (odoo-parity E4). Required for SERIAL-tracked products: the list size must equal the received base quantity (422 SERIAL_COUNT_MISMATCH otherwise), and each serial is enumerated as an in-stock unit. Ignored for untracked and LOT-tracked products'
          example:
          - SN-0001
          - SN-0002
          items:
            type: string
          type: array
      required:
      - lineId
      type: object
    ReceiveTransferOrderRequest:
      description: Request to receive a transfer order; omitted lines receive their full remainder
      properties:
        lines:
          description: Explicit per-line received quantities; omitted lines receive their full remainder
          items:
            $ref: '#/components/schemas/TransferQuantityLineRequest'
          type: array
      type: object
    ReceivingLineResponse:
      description: A single line within a receiving session, with expected and received quantities
      properties:
        conversionFactor:
          description: Effective base-per-document-unit conversion factor applied at posting time
          example: 12
          type: number
        documentQuantity:
          description: Quantity as keyed in documentUom; receivedQuantity holds the derived base quantity
          example: 1
          type: number
        documentUom:
          description: UoM the line was keyed in when it differed from the product's base UoM
          example: CASE
          type: string
        expectedQuantity:
          description: Quantity expected to be received on the line
          example: 10
          type: number
        lineId:
          description: Identifier of the receiving line
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        lotNumber:
          description: Lot or batch number recorded on receipt; linked to the lot master for LOT-tracked products
          example: LOT-2026-0042
          type: string
        productId:
          description: Identifier of the product on the receiving line
          example: 01960003-0000-7000-8000-000000000002
          type: string
        receivedQuantity:
          description: Quantity received so far on the line
          example: 8
          type: number
        status:
          description: Status of the receiving line, such as PENDING or RECEIVED
          example: RECEIVED
          type: string
        workorderId:
          description: Identifier of the workorder the line is associated with, when applicable
          example: 01960003-0000-7000-8000-000000000003
          type: string
        workorderLineId:
          description: Identifier of the workorder line the receiving line fulfils, when applicable
          example: 01960003-0000-7000-8000-000000000004
          type: string
      required:
      - lineId
      - productId
      - status
      type: object
    ReceivingSessionResponse:
      description: Inventory receiving session with its lines and source document context
      properties:
        createdAt:
          description: Timestamp when the receiving session was created
          example: 2026-01-15 09:30:00+00:00
          format: date-time
          type: string
        createdByUserId:
          description: Identifier of the user who created the receiving session
          example: 01960003-0000-7000-8000-000000000004
          type: string
        entryMethod:
          description: Method used to enter receiving lines, such as SCAN or MANUAL
          example: MANUAL
          type: string
        lines:
          description: Receiving lines belonging to the session
          items:
            $ref: '#/components/schemas/ReceivingLineResponse'
          type: array
        sessionId:
          description: Identifier of the receiving session
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        shipmentReference:
          description: Carrier or shipment reference for the received goods
          example: SHIP-2026-00042
          type: string
        sourceDocumentId:
          description: Identifier of the source document the session receives against
          example: 01960003-0000-7000-8000-000000000002
          type: string
        sourceDocumentType:
          description: Type of the source document, such as PURCHASE_ORDER or WORKORDER
          example: PURCHASE_ORDER
          type: string
        status:
          description: Status of the receiving session, such as IN_PROGRESS or COMPLETED
          example: IN_PROGRESS
          type: string
        supplierId:
          description: Identifier of the supplier providing the received stock
          example: 01960003-0000-7000-8000-000000000003
          type: string
      required:
      - createdAt
      - sessionId
      - sourceDocumentId
      - status
      type: object
    RecordMovementRequest:
      description: Request body for recording a directional stock movement in the inventory ledger
      properties:
        fromLocationId:
          description: Identifier of the location the stock moves from
          example: 01960003-0000-7000-8000-000000000130
          format: uuid
          type: string
        movementType:
          description: Direct ledger movement type. ADJUST is workflow-only and must use /v1/inventory/adjustments endpoints.
          enum:
          - RECEIVE
          - PUT_AWAY
          - PICK
          - ISSUE
          - RETURN
          - TRANSFER
          example: RECEIVE
          type: string
        productSku:
          description: Stock keeping unit code of the product being moved
          example: SKU-10042
          minLength: 1
          type: string
        quantity:
          description: Quantity of units being moved
          example: 12
          minimum: 0
          type: number
        sourceTransactionId:
          description: Reference to the originating system transaction that caused the movement
          example: 01960003-0000-7000-8000-000000000132
          type: string
        toLocationId:
          description: Identifier of the destination location; required for TRANSFER movements
          example: 01960003-0000-7000-8000-000000000131
          format: uuid
          type: string
        unitOfMeasure:
          description: Unit of measure for the quantity
          example: EACH
          type: string
      required:
      - fromLocationId
      - movementType
      - productSku
      - quantity
      type: object
    RejectAdjustmentRequest:
      description: Request to reject a pending cycle count adjustment
      properties:
        rejectionReason:
          description: Reason explaining why the adjustment is being rejected
          example: Recount required before posting
          minLength: 1
          type: string
        rejectorUserId:
          description: Identifier of the user rejecting the adjustment
          example: user-30077
          minLength: 1
          type: string
      required:
      - rejectionReason
      - rejectorUserId
      type: object
    RejectRevaluationRequest:
      description: Request to reject a pending revaluation; the SKU cost state is untouched
      properties:
        rejectionReason:
          description: Reason explaining why the revaluation is being rejected
          example: Recount disputed; leave standard price unchanged
          maxLength: 1000
          minLength: 0
          type: string
      required:
      - rejectionReason
      type: object
    RejectScrapRequest:
      description: Request to reject a pending scrap document; no inventory changes are made
      properties:
        rejectionReason:
          description: Reason explaining why the scrap is being rejected
          example: Part was recovered and restocked
          maxLength: 1000
          minLength: 0
          type: string
      required:
      - rejectionReason
      type: object
    ReplenishmentNeedResponse:
      description: 'Current computed replenishment state of one active, non-snoozed policy: the same orderpoint evaluation the batch scan applies, with no side effects'
      properties:
        deadlineDate:
          description: Earliest date at which the projected available quantity goes below zero; absent when the policy is not triggered or no stock-out is projected within the lead-time horizon
          example: 2026-01-20
          type: string
        itemSKU:
          description: SKU of the item the policy applies to
          example: SKU-10042
          type: string
        leadHorizonDate:
          description: UTC date of the lead-time horizon the projection was evaluated at
          example: 2026-01-20
          type: string
        leadTimeSource:
          description: Where the resolved lead time came from
          enum:
          - POLICY_OVERRIDE
          - FEED
          - DEFAULT
          example: POLICY_OVERRIDE
          type: string
        locationId:
          description: Identifier of the location the policy applies to
          example: 01960003-0000-7000-8000-000000000002
          format: uuid
          type: string
        maximumQuantity:
          description: Maximum on-hand quantity replenishment aims to restock up to
          example: 50
          format: int32
          type: integer
        minimumQuantity:
          description: Minimum on-hand quantity that triggers replenishment when reached
          example: 5
          format: int32
          type: integer
        onHand:
          description: Current on-hand quantity at the policy's location
          example: 3
          type: number
        policyId:
          description: Unique identifier of the replenishment policy
          example: 01960003-0000-7000-8000-000000000001
          type: string
        preferredSourceType:
          description: Preferred sourcing channel configured on the policy
          example: EITHER
          type: string
        projectedAvailable:
          description: Projected available quantity at the lead-time horizon (on-hand + expected supply - open demand)
          example: 3
          type: number
        suggestedQuantity:
          description: 'Quantity a scan would replenish now: replenish-to-max after in-progress netting, rounded up to the policy''s order multiple; zero when in-progress supply already covers the need or the policy is not triggered'
          example: 12
          format: int32
          type: integer
        wouldTrigger:
          description: Whether a batch scan run now would consider this policy triggered (projected available below minimum)
          example: true
          type: boolean
      required:
      - itemSKU
      - leadHorizonDate
      - leadTimeSource
      - locationId
      - maximumQuantity
      - minimumQuantity
      - onHand
      - policyId
      - preferredSourceType
      - projectedAvailable
      - suggestedQuantity
      - wouldTrigger
      type: object
    ReplenishmentPolicyResponse:
      description: Representation of a replenishment policy defining min/max stock thresholds for an item at a location
      properties:
        active:
          description: Whether the policy participates in replenishment evaluation
          example: true
          type: boolean
        createdAt:
          description: Timestamp at which the replenishment policy was created
          example: 2026-01-15 09:30:00+00:00
          type: string
        itemSKU:
          description: SKU of the item the replenishment policy applies to
          example: SKU-10042
          type: string
        leadTimeDaysOverride:
          description: Per-policy lead-time override in days; absent means vendor-feed/default lead time applies
          example: 3
          format: int32
          type: integer
        locationId:
          description: Identifier of the location the replenishment policy applies to
          example: 01960003-0000-7000-8000-000000000002
          format: uuid
          type: string
        maximumQuantity:
          description: Maximum on-hand quantity replenishment aims to restock up to
          example: 50
          format: int32
          type: integer
        minimumQuantity:
          description: Minimum on-hand quantity that triggers replenishment when reached
          example: 5
          format: int32
          type: integer
        orderMultiple:
          description: Round the computed replenishment quantity up to the nearest multiple of this value; absent means no rounding
          example: 6
          format: int32
          type: integer
        policyId:
          description: Unique identifier of the replenishment policy
          example: 01960003-0000-7000-8000-000000000001
          type: string
        preferredSourceType:
          description: Preferred sourcing channel for replenishing this policy's pick face
          example: EITHER
          type: string
        snoozedUntil:
          description: Instant until which the policy is snoozed (excluded from replenishment evaluation); absent or past means the policy is evaluated normally
          example: 2026-02-01 00:00:00+00:00
          type: string
      required:
      - active
      - createdAt
      - itemSKU
      - locationId
      - maximumQuantity
      - minimumQuantity
      - policyId
      - preferredSourceType
      type: object
    ReplenishmentScanResultResponse:
      description: Summary of a batch replenishment scan run over all replenishment policies
      properties:
        policiesBelowMinimum:
          description: Number of policies whose on-hand quantity was below the configured minimum
          example: 5
          format: int32
          type: integer
        policiesEvaluated:
          description: Number of replenishment policies evaluated by the scan
          example: 42
          format: int32
          type: integer
        policiesSkipped:
          description: Number of policies skipped without evaluation because they are inactive or snoozed
          example: 1
          format: int32
          type: integer
        scanAt:
          description: Timestamp at which the scan ran
          example: 2026-01-15 09:30:00+00:00
          type: string
        suggestionsCreated:
          description: Number of new purchase suggestions created for PURCHASE-preferring policies (odoo-parity F4)
          example: 1
          format: int32
          type: integer
        suggestionsRefreshed:
          description: Number of already-open purchase suggestions whose quantity was refreshed to the current need (odoo-parity F4)
          example: 0
          format: int32
          type: integer
        tasksCreated:
          description: Number of new replenishment tasks created by the scan
          example: 3
          format: int32
          type: integer
        tasksRefreshed:
          description: Number of already-open replenishment tasks whose quantity was refreshed to the current need
          example: 2
          format: int32
          type: integer
      required:
      - policiesBelowMinimum
      - policiesEvaluated
      - policiesSkipped
      - scanAt
      - suggestionsCreated
      - suggestionsRefreshed
      - tasksCreated
      - tasksRefreshed
      type: object
    ReplenishmentTaskResponse:
      description: A replenishment task describing a recommended or in-progress stock movement between locations
      properties:
        assignedTo:
          description: Identifier or name of the user the replenishment task is assigned to
          example: user-jdoe
          type: string
        createdAt:
          description: Timestamp at which the replenishment task was created
          example: 2026-01-15 09:30:00+00:00
          type: string
        deadlineDate:
          description: Earliest date at which the projected available quantity goes below zero (stock-out deadline used for prioritization); absent when no stock-out is projected within the lead-time horizon
          example: 2026-01-20
          type: string
        decisionReason:
          description: Explanation of why this replenishment was decided
          example: On-hand quantity 3 fell below minimum threshold of 5
          type: string
        destinationLocationId:
          description: Identifier of the location stock is moved to
          example: 01960003-0000-7000-8000-000000000003
          format: uuid
          type: string
        itemSKU:
          description: SKU of the item to be replenished
          example: SKU-10042
          type: string
        quantity:
          description: Quantity of the item to be moved by this replenishment task
          example: 12
          format: int32
          type: integer
        sourceLocationId:
          description: Identifier of the location stock is sourced from
          example: 01960003-0000-7000-8000-000000000002
          format: uuid
          type: string
        sourcingReason:
          description: Explanation of why the chosen source location was selected to supply the stock
          example: Nearest location with sufficient available stock
          type: string
        status:
          description: Current status of the replenishment task
          example: PENDING
          type: string
        taskId:
          description: Unique identifier of the replenishment task
          example: 01960003-0000-7000-8000-000000000001
          type: string
        triggerType:
          description: Mechanism that triggered the task, such as a manual request or automatic threshold breach
          example: AUTOMATIC
          type: string
      required:
      - createdAt
      - destinationLocationId
      - itemSKU
      - quantity
      - status
      - taskId
      type: object
    ReservationResponse:
