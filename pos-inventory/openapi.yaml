  /v1/inventory/returns/reason-codes:
    get:
      description: 'Returns the fixed catalog of return reason codes: DAMAGED, WRONG_ITEM, EXCESS and DEFECTIVE, each with a description and category.

        Use this tool to populate the reasonCode of return lines before submitReturnToStock; do not use listReturnableItems, which lists what can be returned rather than why.

        Preconditions: none; the list is static in the service and takes no filters.

