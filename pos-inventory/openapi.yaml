      summary: Snooze or unsnooze a replenishment policy
      description: 'Snoozes a replenishment policy so scan, event and needs evaluation all skip it until the given future instant, or clears an existing snooze.

        Use this tool to silence a policy temporarily; do not use updateReplenishmentPolicy, which cannot touch snooze state, and prefer snoozing over clearing the active flag when the pause should expire on its own.

        Preconditions: the policy must exist; a non-null snoozedUntil must lie in the future.

        Required inputs: policyId (UUID) path parameter and a body whose optional snoozedUntil instant sets the snooze; a null snoozedUntil clears it — there is no separate unsnooze endpoint.

        Emits an INVENTORY_REPLENISHMENT_POLICY_SNOOZE event; the policy is excluded from evaluation until the instant passes.

        Returns 404 when the policy does not exist, and 422 with REPLENISHMENT_SNOOZE_NOT_IN_FUTURE when snoozedUntil is not in the future.

