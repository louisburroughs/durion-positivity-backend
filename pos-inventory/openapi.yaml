          format: int32
          description: Number of location refs created
          example: 3
        locationsUpdated:
          type: integer
          format: int32
          description: Number of location refs updated
          example: 5
        locationsUnchanged:
          type: integer
          format: int32
          description: Number of roster records already up to date
          example: 34
        locationsFailed:
          type: integer
          format: int32
          description: Number of roster records that failed to apply
          example: 0
        startedAt:
          type: string
          format: date-time
          description: When the run started
        completedAt:
          type: string
          format: date-time
          description: When the run completed
        correlationId:
          type: string
          description: Correlation id of the triggering request
      required:
      - locationsCreated
      - locationsFailed
      - locationsProcessed
      - locationsUnchanged
      - locationsUpdated
      - outcome
      - syncRunId
    CreateGoodsReceiptLineRequest:
      type: object
      description: Request payload describing a single received line item when recording a goods receipt against a purchase order
      properties:
        poLineId:
          type: string
          format: uuid
          description: Identifier of the specific purchase order line this receipt line fulfills
          example: 01960003-0000-7000-8000-000000000001
        sku:
          type: string
          description: Stock keeping unit identifier for the received product
          example: SKU-10042
          minLength: 1
        quantityReceived:
          type: number
          description: Whole-unit quantity of the SKU received, in the product's base UoM. Required unless documentUom/documentQuantity are supplied, in which case the base quantity is derived and this field is ignored
          example: 8
        unitCostMinor:
          type: integer
          format: int64
          description: Unit cost of the received product expressed in minor currency units (e.g. cents)
          example: 1499
        lotNumber:
          type: string
          description: Lot or batch number associated with the received product
          example: LOT-2026-0042
        documentUom:
          type: string
          description: Optional UoM the receipt line is keyed in (e.g. CASE). When present, documentQuantity is converted to the product's base UoM at posting time and the ledger posts the base quantity; unitCostMinor then refers to one documentUom unit. A UoM with no conversion path is rejected with 422 UOM_CONVERSION_UNDEFINED
          example: CASE
        documentQuantity:
          type: number
          description: Quantity received expressed in documentUom; must be supplied together with documentUom
          example: 1
      required:
      - sku
      - unitCostMinor
    CreateGoodsReceiptRequest:
      type: object
      description: Request payload to record a goods receipt for inventory received against a purchase order, optionally linked to an ASN
      properties:
        poId:
          type: string
          format: uuid
          description: Identifier of the purchase order the goods are received against
          example: 01960003-0000-7000-8000-000000000001
        asnId:
          type: string
          format: uuid
          description: Identifier of the advance shipping notice (ASN) this receipt fulfills, if applicable
          example: 01960003-0000-7000-8000-000000000002
        locationId:
          type: string
          format: uuid
          description: Identifier of the location where the goods are received into inventory
          example: 01960003-0000-7000-8000-000000000003
        lines:
          type: array
          description: Received line items detailing the SKUs and quantities in this goods receipt
          items:
            $ref: '#/components/schemas/CreateGoodsReceiptLineRequest'
      required:
      - lines
      - locationId
      - poId
    GoodsReceiptLineResponse:
      type: object
      description: A single received line item on a goods receipt response, describing one SKU, its received quantity, and accrued cost
      properties:
        receiptLineId:
          type: string
          format: uuid
          description: Unique identifier of the goods receipt line
          example: 01960003-0000-7000-8000-000000000001
        poLineId:
          type: string
          format: uuid
          description: Identifier of the purchase order line this receipt line fulfills
          example: 01960003-0000-7000-8000-000000000002
        sku:
          type: string
          description: Stock keeping unit identifier for the received product
          example: SKU-10042
        quantityReceived:
          type: number
          description: Quantity of the SKU received in this goods receipt
          example: 8
        unitCostMinor:
          type: integer
          format: int64
          description: Unit cost of the received product expressed in minor currency units (e.g. cents)
          example: 1499
        lineAccruedAmountMinor:
          type: integer
          format: int64
          description: Total accrued cost for this line expressed in minor currency units (quantity multiplied by unit cost)
          example: 11992
        documentUom:
          type: string
          description: UoM the line was keyed in when it differed from the product's base UoM
          example: CASE
        documentQuantity:
          type: number
          description: Quantity as keyed in documentUom; quantityReceived holds the derived base quantity
          example: 1
        conversionFactor:
          type: number
          description: Effective base-per-document-unit conversion factor applied at posting time
          example: 12
      required:
      - quantityReceived
      - receiptLineId
      - sku
    GoodsReceiptResponse:
      type: object
      description: Goods receipt representing inventory received against a purchase order, including its received line items and accrued totals
      properties:
        receiptId:
          type: string
          format: uuid
          description: Unique identifier of the goods receipt
          example: 01960003-0000-7000-8000-000000000001
        receiptNumber:
          type: string
          description: Human-readable reference number assigned to the goods receipt
          example: GR-2026-000456
        poId:
          type: string
          format: uuid
          description: Identifier of the purchase order the goods were received against
          example: 01960003-0000-7000-8000-000000000002
        asnId:
          type: string
          format: uuid
          description: Identifier of the advance shipping notice (ASN) this receipt fulfilled, if applicable
          example: 01960003-0000-7000-8000-000000000003
        locationId:
          type: string
          format: uuid
          description: Identifier of the location where the goods were received into inventory
          example: 01960003-0000-7000-8000-000000000004
        totalAccruedAmountMinor:
          type: integer
          format: int64
          description: Total accrued cost for the goods receipt expressed in minor currency units (e.g. cents)
          example: 11992
        createdBy:
          type: string
          description: Identifier of the user who recorded the goods receipt
          example: user-jdoe
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the goods receipt was created
          example: 2026-01-20 14:05:00+00:00
        lines:
          type: array
          description: Received line items detailing the SKUs and quantities in this goods receipt
          items:
            $ref: '#/components/schemas/GoodsReceiptLineResponse'
      required:
      - createdAt
      - locationId
      - poId
      - receiptId
      - receiptNumber
    CreateCycleCountScheduleRequest:
      type: object
      description: Request to create a recurring cycle-count schedule for a location
      properties:
        locationId:
          type: string
          format: uuid
          description: Identifier of the location the schedule applies to
          example: 01960003-0000-7000-8000-000000000001
        zoneId:
          type: string
          format: uuid
          description: Optional single-zone filter within the location
          example: 01960003-0000-7000-8000-000000000002
        skuCategory:
          type: string
          description: Optional SKU-category filter (plain string, metadata-only in v1)
          example: BRAKES
          maxLength: 100
          minLength: 0
        frequencyDays:
          type: integer
          format: int32
          description: Count frequency in days
          example: 30
        nextDueDate:
          type: string
          format: date
          description: First date the schedule is due for counting
          example: 2026-08-01
        autoCreatePlan:
          type: boolean
          description: Whether the scheduled runner auto-creates the next cycle-count plan when due (false = the schedule only appears in the due-for-count view); defaults to false
          example: true
      required:
      - frequencyDays
      - locationId
      - nextDueDate
    CreateCycleCountPlanRequest:
      type: object
      description: Request to create a cycle count plan scheduling counts across a location and zones
      properties:
        locationId:
          type: string
          format: uuid
          description: Identifier of the location the plan applies to
          example: 01960003-0000-7000-8000-000000000001
        zoneIds:
          type: array
          description: Identifiers of the zones within the location to include in the plan
          example:
          - 01960003-0000-7000-8000-000000000002
          items:
            type: string
            format: uuid
        planName:
          type: string
          description: Human-readable name for the cycle count plan
          example: Q1 perishables count
          minLength: 1
        scheduledDate:
          type: string
          format: date
          description: Date on which the cycle count is scheduled to occur
          example: 2026-01-15
      required:
      - locationId
      - planName
      - scheduledDate
    CreateAdjustmentRequest:
      type: object
      description: Request to create a new inventory adjustment from a cycle count variance
      properties:
        stockItemId:
          type: string
          format: uuid
          description: Identifier of the stock item being adjusted
          example: 01960003-0000-7000-8000-000000000001
        taskId:
          type: string
          format: uuid
          description: Cycle count task this adjustment settles, if created from a task. Enables approval-time conflict detection and variance recomputation against current on-hand.
          example: 01960003-0000-7000-8000-000000000009
        reasonCode:
          type: string
          description: Reason code explaining why the adjustment is being made
          example: CYCLE_COUNT_VARIANCE
          minLength: 1
        countedQuantity:
          type: integer
          format: int32
          description: Quantity physically counted by the auditor
          example: 12
          minimum: 0
        quantityOnHandBefore:
          type: integer
          format: int32
          description: Quantity on hand recorded before the count was applied
          example: 15
        costAtTimeOfAdjustment:
          type: number
          description: Unit cost to capture at the time of the adjustment
          example: 12.5
          minimum: 0.0
        createdByUserId:
          type: string
          description: Identifier of the user creating the adjustment
          example: user-10042
          minLength: 1
      required:
      - costAtTimeOfAdjustment
      - countedQuantity
      - createdByUserId
      - quantityOnHandBefore
      - reasonCode
      - stockItemId
    AdjustmentResponse:
      type: object
      description: Result of a cycle count inventory adjustment, including approval state and posting outcome
      properties:
        taskId:
          type: string
          format: uuid
          description: Cycle count task this adjustment settles, if created from a task
          example: 01960003-0000-7000-8000-000000000009
        adjustmentId:
          type: string
          format: uuid
          description: Unique identifier of the adjustment record
          example: 01960003-0000-7000-8000-000000000001
        stockItemId:
          type: string
          format: uuid
          description: Identifier of the stock item the adjustment applies to
          example: 01960003-0000-7000-8000-000000000002
        reasonCode:
          type: string
          description: Reason code explaining why the adjustment was made
          example: CYCLE_COUNT_VARIANCE
        quantityChange:
          type: integer
          format: int32
          description: Net change in quantity on hand resulting from the adjustment (may be negative)
          example: -3
        costAtTimeOfAdjustment:
          type: number
          description: Unit cost captured at the moment the adjustment was created
          example: 12.5
        quantityOnHandBefore:
          type: integer
          format: int32
          description: Quantity on hand recorded before the count was applied
          example: 15
        countedQuantity:
          type: integer
          format: int32
          description: Quantity physically counted by the auditor
          example: 12
        status:
          type: string
          description: Current lifecycle status of the adjustment
          enum:
          - PENDING_APPROVAL
          - AUTO_APPROVED
          - APPROVED
          - POSTED
          - REJECTED
          - FAILED
          example: PENDING_APPROVAL
        requiredApprovalTier:
          type: string
          description: Approval tier required to authorize the adjustment, when manual approval applies
          enum:
          - TIER_1_MANAGER
          - TIER_2_DIRECTOR
          example: TIER_1_MANAGER
        createdByUserId:
          type: string
          description: Identifier of the user who created the adjustment
          example: user-10042
        approvedByUserId:
          type: string
          description: Identifier of the user who approved the adjustment, if approved
          example: user-20055
        rejectedByUserId:
          type: string
          description: Identifier of the user who rejected the adjustment, if rejected
          example: user-30077
        rejectionReason:
          type: string
          description: Free-text reason supplied when the adjustment was rejected
          example: Recount required before posting
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the adjustment was created
          example: 2026-01-15 09:30:00+00:00
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the adjustment was last updated
          example: 2026-01-15 10:05:00+00:00
        approvedAt:
          type: string
          format: date-time
          description: Timestamp when the adjustment was approved, if approved
          example: 2026-01-15 10:05:00+00:00
        rejectedAt:
          type: string
          format: date-time
          description: Timestamp when the adjustment was rejected, if rejected
          example: 2026-01-15 10:05:00+00:00
        postedAt:
          type: string
          format: date-time
          description: Timestamp when the adjustment was posted to the inventory ledger, if posted
          example: 2026-01-15 10:10:00+00:00
        ledgerEntryId:
          type: string
          format: uuid
          description: Identifier of the inventory ledger entry created when the adjustment was posted
          example: 01960003-0000-7000-8000-000000000003
        errorMessage:
          type: string
          description: Error message describing why processing failed, if the adjustment failed
          example: Stock item not found
        varianceValue:
          type: number
          description: Monetary value of the counted variance
          example: 37.5
        variancePercentage:
          type: number
          description: Variance expressed as a percentage of expected quantity on hand
          example: 20.0
      required:
      - adjustmentId
      - costAtTimeOfAdjustment
      - countedQuantity
      - createdAt
      - createdByUserId
      - quantityChange
      - quantityOnHandBefore
      - reasonCode
      - status
      - stockItemId
      - updatedAt
    RejectAdjustmentRequest:
      type: object
      description: Request to reject a pending cycle count adjustment
      properties:
        rejectorUserId:
          type: string
          description: Identifier of the user rejecting the adjustment
          example: user-30077
          minLength: 1
        rejectionReason:
          type: string
          description: Reason explaining why the adjustment is being rejected
          example: Recount required before posting
          minLength: 1
      required:
      - rejectionReason
      - rejectorUserId
    ApproveAdjustmentRequest:
      type: object
      description: Request to approve a pending cycle count adjustment
      properties:
        approverUserId:
          type: string
          description: Legacy client-provided approver identifier; the authoritative actor is resolved server-side from the authenticated context
          example: user-20055
        notes:
          type: string
          description: Optional free-text notes recorded with the approval
          example: Variance confirmed against receiving log
    SubmitCountRequest:
      type: object
      description: Request to submit the initial physical count for a cycle count task
      properties:
        taskId:
          type: string
          format: uuid
          description: Identifier of the cycle count task being counted
          example: 01960003-0000-7000-8000-000000000001
        auditorId:
          type: string
          description: Identifier of the auditor submitting the count
          example: auditor-10042
        actualQuantity:
          type: integer
          format: int32
          description: Quantity physically counted by the auditor
          example: 12
          minimum: 0
      required:
      - actualQuantity
      - auditorId
      - taskId
    CountResponse:
      type: object
      description: Result of submitting a count or recount for a cycle count task
      properties:
        countEntryId:
          type: string
          format: uuid
          description: Unique identifier of the recorded count entry
          example: 01960003-0000-7000-8000-000000000001
        taskId:
          type: string
          format: uuid
          description: Identifier of the cycle count task the count was submitted against
          example: 01960003-0000-7000-8000-000000000002
        actualQuantity:
          type: integer
          format: int32
          description: Quantity physically counted by the auditor
          example: 12
        expectedQuantity:
          type: integer
          format: int32
          description: Quantity expected on hand at the time of the count
          example: 15
        variance:
          type: integer
          format: int32
          description: Difference between counted and expected quantity (actual minus expected)
          example: -3
        recountSequenceNumber:
          type: integer
          format: int32
          description: Sequence number of this count within the recount chain; 0 for the initial count
          example: 1
        taskStatus:
          type: string
          description: Resulting status of the cycle count task after the submission
          enum:
          - ASSIGNED
          - COUNTED_PENDING_REVIEW
          - CONFLICT
          - REQUIRES_INVESTIGATION
          - APPROVED
          - REJECTED
          example: COUNTED_PENDING_REVIEW
        countedAt:
          type: string
          format: date-time
          description: Timestamp when the count was recorded
          example: 2026-01-15 09:30:00+00:00
        limitExceeded:
          type: boolean
          description: Whether the maximum allowed number of recounts has been exceeded
          example: false
        message:
          type: string
          description: Human-readable message describing the outcome of the submission
          example: Count submitted and awaiting review
      required:
      - actualQuantity
      - countEntryId
      - countedAt
      - expectedQuantity
      - limitExceeded
      - recountSequenceNumber
      - taskId
      - taskStatus
      - variance
    SubmitRecountRequest:
      type: object
      description: Request to submit a recount for a cycle count task, including the caller's permission context
      properties:
        taskId:
          type: string
          format: uuid
          description: Identifier of the cycle count task being recounted
          example: 01960003-0000-7000-8000-000000000001
        auditorId:
          type: string
          description: Identifier of the auditor submitting the recount
          example: auditor-10042
        actualQuantity:
          type: integer
          format: int32
          description: Quantity physically counted by the auditor on the recount
          example: 13
          minimum: 0
        permission:
          type: string
          description: Permission context authorizing the recount; one of TRIGGER_RECOUNT_SELF or TRIGGER_RECOUNT_ANY
          example: TRIGGER_RECOUNT_SELF
      required:
      - actualQuantity
      - auditorId
      - permission
      - taskId
    ConsumeItemLine:
      type: object
      description: A single line in a consumption request, identifying a SKU and quantity to consume against a pick task
      properties:
        pickTaskId:
          type: string
          format: uuid
          description: Identifier of the pick task the consumed items are drawn from
          example: 01960003-0000-7000-8000-000000000001
        skuId:
          type: string
          format: uuid
          description: Identifier of the SKU being consumed
          example: 01960003-0000-7000-8000-000000000002
        quantity:
          type: integer
          format: int32
          description: Quantity of the SKU to consume
          example: 4
        lotNumber:
          type: string
          description: 'Optional lot override for LOT-tracked SKUs: must reference an existing (422 LOT_UNKNOWN) ACTIVE (422 LOT_NOT_AVAILABLE) lot. When absent, the lot recorded at pick confirmation is used; a LOT-tracked SKU with neither is rejected (422 LOT_NUMBER_REQUIRED). Ignored for untracked SKUs'
          example: LOT-2026-A
          maxLength: 128
          minLength: 0
      required:
      - pickTaskId
      - quantity
      - skuId
    ConsumeItemsRequest:
      type: object
      description: Request payload to consume inventory items against a workorder, optionally drawn from a specific pick list
      properties:
        workorderId:
          type: string
          format: uuid
          description: Identifier of the workorder the items are consumed for
          example: 01960003-0000-7000-8000-000000000001
        pickListId:
          type: string
          format: uuid
          description: Identifier of the pick list the consumed items are drawn from, if applicable
          example: 01960003-0000-7000-8000-000000000002
        items:
          type: array
          description: Line items identifying the SKUs and quantities to consume
          items:
            $ref: '#/components/schemas/ConsumeItemLine'
      required:
      - workorderId
    ConsumptionResponse:
      type: object
      description: Response describing the outcome of consuming inventory items against a workorder, including the ledger entries created
      properties:
        consumptionId:
          type: string
          format: uuid
          description: Unique identifier of the consumption record
          example: 01960003-0000-7000-8000-000000000001
        workorderId:
          type: string
          format: uuid
          description: Identifier of the workorder the items were consumed for
          example: 01960003-0000-7000-8000-000000000002
        pickListId:
          type: string
          format: uuid
          description: Identifier of the pick list the consumed items were drawn from, if applicable
          example: 01960003-0000-7000-8000-000000000003
        totalItemsConsumed:
          type: integer
          format: int32
          description: Total number of items consumed in this operation
          example: 4
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the consumption was recorded
          example: 2026-01-20 14:05:00+00:00
        ledgerEntryIds:
          type: array
          description: Identifiers of the inventory ledger entries created by this consumption
          example:
          - 01960003-0000-7000-8000-000000000004
          items:
            type: string
            format: uuid
      required:
      - consumptionId
      - createdAt
      - totalItemsConsumed
      - workorderId
    BulkIngestRequestInventoryBulkIngestRecord:
      type: object
      description: 'Generic bulk ingest request: a batch of records for a job scoped to a location'
      properties:
        jobId:
          type: string
          format: uuid
          description: Identifier of the bulk ingest job
          example: 01960003-0000-7000-8000-000000000001
        locationId:
          type: string
          format: uuid
          description: Location the records are ingested for
          example: 01960003-0000-7000-8000-000000000002
        records:
          type: array
          description: The records to ingest (at least one); shape depends on the target domain
          items:
            $ref: '#/components/schemas/InventoryBulkIngestRecord'
          minItems: 1
        operatorId:
          type: string
          description: Identifier of the operator submitting the batch
          example: user-jdoe
      required:
      - jobId
      - locationId
      - records
    InventoryBulkIngestRecord:
      type: object
      description: Single record within a bulk inventory ingest request
      properties:
        sku:
          type: string
          description: Stock-keeping unit of the product being ingested
          example: SKU-10042
          minLength: 1
        locationId:
          type: string
          format: uuid
          description: Identifier of the location the quantity applies to
          example: 01960003-0000-7000-8000-000000000001
        quantity:
          type: integer
          format: int32
          description: Quantity to ingest for the product (non-negative)
          example: 120
          minimum: 0
        reasonCode:
          type: string
          description: Optional reason code explaining the ingest
          example: CYCLE_COUNT
        unitOfMeasure:
          type: string
          description: Optional unit of measure code for the quantity (e.g. EACH, KG)
          example: EACH
      required:
      - quantity
      - sku
    BulkIngestResponse:
      type: object
      description: 'Summary outcome of a bulk ingest job: per-record results plus aggregate counts'
      properties:
        totalSubmitted:
          type: integer
          format: int32
          description: Total number of records submitted in the batch
          example: 100
        successCount:
          type: integer
          format: int32
          description: Number of records ingested successfully
          example: 98
        failureCount:
          type: integer
          format: int32
          description: Number of records that failed ingest
          example: 2
        results:
          type: array
          description: Per-record outcomes in submission order
          items:
            $ref: '#/components/schemas/BulkIngestResult'
      required:
      - failureCount
      - results
      - successCount
      - totalSubmitted
    BulkIngestResult:
      type: object
      description: Per-record outcome of a bulk ingest submission
