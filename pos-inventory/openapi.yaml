  /v1/inventory/lots/{lotId}/status:
    post:
      tags:
      - Lots
      summary: Change lot status
      description: 'Changes a lot''s lifecycle status: quarantines or recalls it, or releases it back to ACTIVE; QUARANTINED and RECALLED lots are blocked from lot suggestion and outbound movement.

        Use this tool to gate a lot for quality or recall reasons; do not use updateInventoryLotExpiration, which only re-dates the lot, and note the status flip does not move stock — relocating units to a quarantine bin is a separate operator-driven transfer.

        Preconditions: the lot must exist and must not already be CONSUMED, because a CONSUMED lot holds no stock and its status is owned by the posting-funnel reconciler.

        Required inputs: lotId (UUID) path parameter plus a body with status (ACTIVE, QUARANTINED or RECALLED; CONSUMED is rejected) and a mandatory reason recorded for traceability.

        Emits an INVENTORY_LOT_STATUS_UPDATE event; no ledger entries are posted.

        Returns 404 when the lot does not exist, and 400 when the target status is CONSUMED, the lot is already CONSUMED, or reason is missing.

        '
      operationId: updateInventoryLotStatus
      parameters:
