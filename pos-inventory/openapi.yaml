  /v1/inventory/locations/sync:
    post:
      tags:
      - Location Sync
      summary: Trigger a location roster re-sync
      description: 'Requests an administrative re-emit of pos-location''s outbox on the location.commands.v1 topic so the location.events.v1 consumer idempotently repairs the local location roster replica.

        Use this tool when the roster replica looks stale or damaged; use listSyncLogs instead to inspect past runs — the repair completes asynchronously, so this call never returns repaired counts.

        Preconditions: the Kafka location event feed must be enabled; with the feed disabled the run is recorded as FAILED instead of REQUESTED.

        Required inputs: none in the body; an optional Idempotency-Key header makes retries safe — re-sending the same key returns the original run — and an optional X-Correlation-Id header is recorded on the run log.

        Emits an INVENTORY_LOCATION_SYNC_TRIGGER event and writes one sync-log run entry; the re-emit covers the configured lookback window (pos.inventory.location.replay-lookback, default P30D).

        Returns 202 with outcome REQUESTED when the replay command was published, and 202 with outcome FAILED and the error recorded in the sync log when publishing was not possible.

        '
      operationId: triggerLocationSync
      parameters:
      - name: Idempotency-Key
        in: header
        description: Client-generated key that makes retries idempotent
        required: false
        schema:
          type: string
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '202':
          description: Re-emit requested (outcome REQUESTED) or the failure recorded in the sync log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationSyncRunResponse'
        '403':
          description: User lacks required sync authority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:location:sync
      x-required-permissions:
      - inventory:location:sync
