                $ref: '#/components/schemas/ApiError'
        '404':
          description: Product SKU or location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:on_hand:view
        - inventory:on_hand:search
      x-required-permissions:
      - inventory:on_hand:view
      - inventory:on_hand:search
  /v1/inventory/asns/{asnId}:
