        in: path
        description: Task ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Task retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountTaskResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCountTaskResponse'
      security:
      - bearerAuth:
        - inventory:cycle_count:view
      x-required-permissions:
      - inventory:cycle_count:view
  /v1/inventory/cycleCount/task/{taskId}/interfering-movements:
    get:
      tags:
      - Cycle Count Query
      - Cycle Count API
      summary: List interfering movements for a cycle count task
      description: 'Returns the on-hand-affecting ledger entries for the task''s SKU recorded between task creation and now — the movements that make the task''s expected-quantity snapshot stale and drive its CONFLICT status.

        Use this tool when a count or adjustment reports CONFLICT and the reviewer must choose between a recount and approving with the variance recomputed; use listCycleCountHistory instead for the count entries themselves.

        Preconditions: the task must exist; movements are never frozen during counts, so entries listed here are legitimate operations, not errors.

        Required inputs: taskId (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 404 when no cycle count task exists for the supplied id.

        '
      operationId: listCycleCountInterferingMovements
      parameters:
      - name: taskId
        in: path
        description: Task ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Interfering movements retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InterferingMovementResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - inventory:cycle_count:view
      x-required-permissions:
      - inventory:cycle_count:view
  /v1/inventory/cycleCount/task/{taskId}/history:
    get:
      tags:
      - Cycle Count Query
      - Cycle Count API
      summary: Get count history for a task
      description: 'Returns every count entry recorded for a cycle count task — the original count and any recounts — ordered by recount sequence number.

        Use this tool to review how counted quantities and variances evolved across recounts; use listCycleCountInterferingMovements instead for the stock movements that made the task''s snapshot stale.

        Preconditions: none are enforced; an unknown taskId yields an empty array rather than 404.

        Required inputs: taskId (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 with an empty array when the task has no counts or the id is unknown, so an empty result is not an error condition.

        '
      operationId: listCycleCountHistory
      parameters:
      - name: taskId
        in: path
        description: Task ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: History retrieved successfully
          content:
            application/json:
