    LotResponse:
      description: An inventory lot master record (odoo-parity E1)
      properties:
        createdAt:
          description: Creation timestamp
          format: date-time
          type: string
        expirationDate:
          description: Expiration date; null until the expiry flows (E3) populate it
          example: 2027-01-31
          format: date
          type: string
        lotId:
          description: Identifier of the lot
          example: 01980003-0000-7000-8000-000000000001
          format: uuid
          type: string
        lotNumber:
          description: Vendor/manufacturer lot or batch number
          example: LOT-2026-0042
          type: string
        receivedAt:
