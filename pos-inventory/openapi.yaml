          type: integer
          format: int32
          description: Minimum on-hand quantity that triggers replenishment when reached
          example: 5
        maximumQuantity:
          type: integer
          format: int32
          description: Maximum on-hand quantity replenishment aims to restock up to
          example: 50
        wouldTrigger:
          type: boolean
          description: Whether a batch scan run now would consider this policy triggered (projected available below minimum)
          example: true
        suggestedQuantity:
          type: integer
          format: int32
          description: 'Quantity a scan would replenish now: replenish-to-max after in-progress netting, rounded up to the policy''s order multiple; zero when in-progress supply already covers the need or the policy is not triggered'
          example: 12
        deadlineDate:
          type: string
          description: Earliest date at which the projected available quantity goes below zero; absent when the policy is not triggered or no stock-out is projected within the lead-time horizon
          example: 2026-01-20
        preferredSourceType:
          type: string
          description: Preferred sourcing channel configured on the policy
          example: EITHER
      required:
      - itemSKU
      - leadHorizonDate
      - leadTimeSource
      - locationId
      - maximumQuantity
      - minimumQuantity
      - onHand
      - policyId
      - preferredSourceType
      - projectedAvailable
      - suggestedQuantity
      - wouldTrigger
    LotDetailResponse:
      type: object
      description: An inventory lot with its per-location on-hand balances (odoo-parity E1)
      properties:
        lot:
          $ref: '#/components/schemas/LotResponse'
        locations:
          type: array
          description: Per-location on-hand of this lot, from the per-lot stock summary rows; locations with fully consumed balances may report zero
          items:
            $ref: '#/components/schemas/LotLocationOnHand'
      required:
      - lot
    LotLocationOnHand:
      type: object
      description: On-hand quantity of a lot at one location
      properties:
        locationId:
          type: string
          format: uuid
          description: Location holding the lot; null for postings recorded without a location
          example: 01980003-0000-7000-8000-000000000004
        onHand:
          type: integer
          format: int64
          description: On-hand quantity of the lot at the location
          example: 12
        inTransitQty:
          type: integer
          format: int64
          description: Quantity of the lot in transit toward the location
          example: 0
      required:
      - inTransitQty
      - onHand
    LotTraceabilityResponse:
      type: object
      description: Upstream/downstream traceability for a lot (odoo-parity E5)
      properties:
        lotId:
          type: string
          format: uuid
          description: Identifier of the lot
        stockItemId:
          type: string
          description: Stock item (catalog product id) the lot belongs to
        lotNumber:
          type: string
          description: Vendor/manufacturer lot number
        lotStatus:
          type: string
          description: Lifecycle status of the lot
