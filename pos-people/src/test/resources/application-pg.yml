# Test profile that runs the real Flyway migration chain + repeatable seed against a
# Testcontainers Postgres, with Hibernate ddl-auto=validate. This executes migrations
# and cross-service-shaped seed SQL in CI (issue #684 process follow-up), catching the
# class of breakages that H2 + flyway-disabled tests miss (e.g. seed/column drift).
# The datasource is supplied at runtime: PostgresTenancyTestBase connects the pool as pos_app with Flyway on
# the owner (@DynamicPropertySource); FlywayMigrationIT uses @ServiceConnection
# as the owner. Tenancy is strict (nothing binds a tenant unless the test does; ADR-0062).
spring:
  application:
    name: pos-people-pg-test
  autoconfigure:
    exclude: org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092

# Disable security for tests
security:
  enabled: false

# Disable eureka for tests
eureka:
  client:
    enabled: false

logging:
  level:
    com.positivity: INFO

pos:
  tenancy:
    # strict: nothing binds a tenant unless the test does
    default-tenant-id:
  people:
    kafka:
      enabled: false

# Test contexts never reach pos-security-service or pos-event-receiver. Skip permission registration
# (its startup retry loop otherwise sleeps ~8 s in every Spring test context) and point the event-type
# initializer at a loopback port that refuses instantly. Same arrangement as pos-mcp-server's test profile.
pos.security.permission-registration.enabled: false
pos.events.base-url: http://127.0.0.1:1
