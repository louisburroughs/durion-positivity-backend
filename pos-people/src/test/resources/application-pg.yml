# Test profile that runs the real Flyway baseline + repeatable seeds against a Testcontainers
# Postgres, with Hibernate ddl-auto=validate. This executes the migrations and seed SQL in CI,
# catching the class of breakages that H2 + flyway-disabled tests miss (column drift, cross-DB
# refs, seed FK gaps). The datasource is supplied at runtime by @ServiceConnection.
spring:
  datasource:
    hikari:
      # Transitional tenant binding (ADR-0062): every scoped table defaults tenant_id from this
      # session setting and hides rows without it. Replaced by TenantAwareDataSource in plan WS1.
      connection-init-sql: "SELECT set_config('app.current_tenant', '01900000-0000-7000-8000-000000000001', false)"
  application:
    name: pos-people-pg-test
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

security:
  enabled: false

eureka:
  client:
    enabled: false

logging:
  level:
    com.positivity: INFO

pos:
  # TenantAwareDataSource (pos-tenancy-common, plan WS1) binds app.current_tenant per checkout
  # from TenantContext and clears it when nothing is bound. A test has no request to bind from,
  # so it names the tenant the Postgres fixtures use; without this every scoped table reads empty.
  tenancy:
    fallback-tenant-id: 01900000-0000-7000-8000-000000000001
