spring:
  application:
    name: people
  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  flyway:
    out-of-order: ${SPRING_FLYWAY_OUT_OF_ORDER:false}

server:
  port: 0
  tomcat:
    max-http-header-size: 65536

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    org:
      springframework: INFO
    com:
      positivity:
        people: INFO
      netflix:
        discovery:
          shared:
            resolver:
              aws:
                ConfigClusterResolver: WARN
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

  default-produces-media-type: application/json
pos:
  people:
    reports:
      threshold-cache:
        max-resolution-cache-entries: ${POS_PEOPLE_REPORTS_THRESHOLD_CACHE_MAX_ENTRIES:4096}
        preload-location-policies: ${POS_PEOPLE_REPORTS_THRESHOLD_CACHE_PRELOAD_LOCATION:true}
        preload-global-policies: ${POS_PEOPLE_REPORTS_THRESHOLD_CACHE_PRELOAD_GLOBAL:true}
    kafka:
      # ADR-0044 domain-event flow (#875): people.events.v1 facts via the transactional outbox,
      # people.commands.v1 replay commands, people.manifest.v1 reconciliation, plus the
      # people-contact.events.v1 replica consumer and person upsert commands toward
      # people-contact.commands.v1.
      enabled: ${POS_PEOPLE_KAFKA_ENABLED:false}
      events-topic: ${POS_PEOPLE_EVENTS_TOPIC:people.events.v1}
      commands-topic: ${POS_PEOPLE_COMMANDS_TOPIC:people.commands.v1}
      commands-consumer-group: ${POS_PEOPLE_COMMANDS_CONSUMER_GROUP:pos-people-commands}
      people-contact-events-topic: ${POS_PEOPLE_PC_EVENTS_TOPIC:people-contact.events.v1}
      people-contact-events-consumer-group: ${POS_PEOPLE_PC_EVENTS_CONSUMER_GROUP:pos-people-people-contact-events}
      people-contact-manifest-topic: ${POS_PEOPLE_PC_MANIFEST_TOPIC:people-contact.manifest.v1}
      people-contact-manifest-consumer-group: ${POS_PEOPLE_PC_MANIFEST_CONSUMER_GROUP:pos-people-people-contact-manifests}
      people-contact-commands-topic: ${POS_PEOPLE_PC_COMMANDS_TOPIC:people-contact.commands.v1}
      workorder-events-topic: ${POS_PEOPLE_WO_EVENTS_TOPIC:workorder.events.v1}
      workorder-events-consumer-group: ${POS_PEOPLE_WO_EVENTS_CONSUMER_GROUP:pos-people-workorder-events}
    manifest:
      topic: ${POS_PEOPLE_MANIFEST_TOPIC:people.manifest.v1}
  location-service:
    service-id: ${POS_LOCATION_SERVICE_SERVICE_ID:location}
