spring:
  application:
    name: people
  datasource:
    url: jdbc:postgresql://localhost:5432/pos_people_db
    username: ${SPRING_DATASOURCE_USERNAME:pos_user}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

server:
  port: 0

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    org:
      springframework: INFO
    com:
      positivity:
        people: INFO
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

pos:
  people:
    reports:
      threshold-cache:
        max-resolution-cache-entries: ${POS_PEOPLE_REPORTS_THRESHOLD_CACHE_MAX_ENTRIES:4096}
        preload-location-policies: ${POS_PEOPLE_REPORTS_THRESHOLD_CACHE_PRELOAD_LOCATION:true}
        preload-global-policies: ${POS_PEOPLE_REPORTS_THRESHOLD_CACHE_PRELOAD_GLOBAL:true}
  location-service:
    base-url: ${POS_LOCATION_SERVICE_BASE_URL:http://pos-location:8084}
  security-service:
    base-url: ${POS_SECURITY_SERVICE_BASE_URL:http://pos-security-service:8086}
