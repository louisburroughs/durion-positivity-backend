      type: object
      properties:
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/Decision"
    TimeEntryAdjustmentRequest:
      type: object
      description: Request to create a time entry adjustment
      properties:
        timeEntryId:
          type: string
          format: uuid
          description: Time entry identifier to adjust
          example: 123e4567-e89b-12d3-a456-426614174000
        reasonCode:
          type: string
          description: Reason code for the adjustment
          example: MISSED_BREAK
        notes:
          type: string
          description: Additional notes explaining the adjustment
          example: Employee forgot to log lunch break
        proposedStartAt:
          type: string
          format: date-time
          description: Proposed new start timestamp
          example: 2026-02-17T08:00:00-05:00
        proposedEndAt:
          type: string
          format: date-time
          description: Proposed new end timestamp
          example: 2026-02-17T17:00:00-05:00
        minutesDelta:
          type: integer
          format: int32
          description: "Adjustment in minutes (positive to add time, negative to subtract)"
          example: -30
        createdBy:
          type: string
          description: User creating the adjustment request
          example: employee-456
      required:
      - reasonCode
      - timeEntryId
    TimeEntryAdjustmentResponse:
      type: object
      description: Response from creating or updating a time entry adjustment
      properties:
        adjustmentId:
          type: string
          format: uuid
          description: Unique identifier of the created or updated adjustment
          example: 123e4567-e89b-12d3-a456-426614174000
        success:
          type: boolean
          description: Indicates whether the operation was successful
          example: true
        message:
          type: string
          description: Human-readable message describing the outcome
          example: Adjustment created and pending approval
      required:
      - success
    CreateStaffingAssignmentRequest:
      type: object
      description: Request to create a staffing assignment
      properties:
        personId:
          type: string
          format: uuid
          description: Person identifier
          example: 123e4567-e89b-12d3-a456-426614174000
        locationId:
          type: string
          format: uuid
          description: Location identifier
          example: 22222222-2222-2222-2222-222222222222
