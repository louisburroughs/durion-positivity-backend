    WorkSessionClockStateResponse:
      type: object
      description: "A person's current work-session (clock) state, derived from their\
        \ open work session and open break. CLOCKED_OUT is an answer, not an error:\
        \ it is returned when nothing is open."
      properties:
        personId:
          type: string
          format: uuid
          description: Person the state belongs to
          example: 01960011-0000-7000-8000-000000000001
        clockState:
          type: string
          description: "CLOCKED_IN (open session, no open break), ON_BREAK (open session\
            \ with an open break) or CLOCKED_OUT (no open session)"
          enum:
          - CLOCKED_IN
          - ON_BREAK
          - CLOCKED_OUT
          example: CLOCKED_IN
        workSessionId:
          type: string
          format: uuid
          description: The open work session; non-null exactly when clockState is
            CLOCKED_IN or ON_BREAK. The break endpoints are keyed by this id.
          example: 01960011-0000-7000-8000-000000000002
        clockedInAt:
          type: string
          format: date-time
          description: When the open session started; non-null exactly when workSessionId
            is
          example: 2026-02-16T08:00:00Z
        breakStartedAt:
          type: string
          format: date-time
          description: When the open break started; non-null exactly when clockState
            is ON_BREAK
          example: 2026-02-16T12:00:00Z
      required:
      - clockState
      - personId
