openapi: 3.1.0
info:
  contact:
    email: louis.burroughs@gmail.com
    name: Durion Support Services
  description: Human Resources service for employee management, payroll, and benefits administration
  title: POS Human Resources Service API
  version: v1
servers:
- description: Generated server url
  url: http://localhost:8086
tags:
- description: Person-to-location staffing assignment operations (CAP-119)
  name: People - Staffing Assignments
- description: Reporting endpoints for people and attendance data
  name: People Reports API
- description: Platform skill registry and vendor cross-references
  name: Skill Registry API
- description: Operations for querying people availability
  name: People Availability API
- description: Operations for managing work sessions and breaks
  name: Work Sessions API
- description: List, approve and reject attendance time entries (clock-in, clock-out, breaks)
  name: Time Entry Approval API
- description: Pay-period lifecycle management for timekeeping approval
  name: Time Period Management API
- description: Bulk import of the credentials people hold
  name: Person Credential Bulk Ingest API
- description: The tenant's own job-role list (HR master data)
  name: Job Role API
- description: Identity-compliance reports (ADR-0015 §4)
  name: People Compliance API
- description: Bulk import person-to-location assignments
  name: Staffing Assignment Bulk Ingest API
- description: Employee profile and offboarding operations
  name: Employee API
- description: Pay-period-based timekeeping approval operations
  name: Timekeeping Approval API
- description: Operations related to people records
  name: People API
- description: Time entry adjustments and related APIs
  name: People TimeEntries
- description: Time entry exception APIs
  name: People - Exceptions
- description: Bulk import employee records
  name: People Bulk Ingest API
- description: The credentials a person holds or held
  name: Person Credential API
paths:
  /v1/people/availability:
    get:
      description: 'Lists people with staffing assignments active on a given date, joined with identity fields from the person replica, one row per assignment.

        Use this tool to see who is available to work at a location on a date; use getPersonPrimaryLocation instead to resolve a single person''s home location.

        Preconditions: when locationId is omitted the caller must be linked to a person with an active assignment, because the requester''s own location becomes the filter.

        Required inputs: none are mandatory; locationId (UUID) defaults to the requester''s location and date (yyyy-MM-dd) defaults to today.

        Location scope: when locationId is given it must lie within the caller''s location reach, or the request is refused with 403 LOCATION_SCOPE_DENIED. When locationId is omitted the filter is the requester''s own location; if the caller''s people:availability:view permission is location-scoped and that location lies outside their reach the list is empty rather than refused, and a caller whose permission is not location-scoped is unaffected.

        Emits a PEOPLE_AVAILABILITY_LIST audit event but changes no state; this is a read-only projection.

        Returns 404 when locationId is omitted and the requester has no active location assignment or no person link, and 403 LOCATION_SCOPE_DENIED when locationId is outside the caller''s location reach.

        '
      operationId: listPeopleAvailability
      parameters:
      - description: Filter by location ID; it must lie within the caller's location reach (403 LOCATION_SCOPE_DENIED otherwise). Defaults to the requester's own location when omitted, which is narrowed to the caller's reach rather than refused.
        in: query
        name: locationId
        required: false
        schema:
          format: uuid
          type: string
      - description: 'Filter by date (ISO format: yyyy-MM-dd)'
        in: query
        name: date
        required: false
        schema:
          format: date
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PeopleAvailabilityResponse'
                type: array
          description: Availability data returned successfully.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'LOCATION_SCOPE_DENIED: locationId is outside the caller''s location reach'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: locationId omitted and the requester has no active location assignment or person link.
      security:
      - bearerAuth:
        - people:availability:view
      summary: List People Availability For A Location
      tags:
      - People Availability API
      x-required-permissions:
      - people:availability:view
  /v1/people/bulk-ingest:
    post:
      description: 'Imports a batch of employee records, creating each one through the same path as createEmployee with status forced to ACTIVE.

        Use this tool for initial loads or migrations of many employees; use createEmployee instead for a single hire, since per-record failures here are reported in the response body rather than as an HTTP error.

        Preconditions: each record is checked under the STRICT duplicate policy, so an existing employee number, email, or phone fails that record.

        Required inputs: jobId (UUID), locationId (UUID), and records, each with firstName, lastName, employeeNumber, and hireDate as a YYYY-MM-DD string.

        Emits a PEOPLE_BULK_INGEST event, and each successfully created employee also publishes its identity upsert command and people.employee.updated fact.

        Returns 200 even when individual records fail: inspect each record''s success flag and errorCode, which is PEOPLE_INGEST_FAILED with the reason for a record the service refused, or INTERNAL_ERROR with a correlationId to quote and no detail of its own for a record lost to a server-side fault. Returns 400 when the envelope itself is invalid or the records list is empty.

        '
      operationId: createEmployeesBulk
      requestBody:
        content:
          application/json:
            examples:
              Two-person batch:
                description: Two-person batch
                value:
                  jobId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  locationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
                  operatorId: user-jdoe
                  records:
                  - employeeNumber: EMP-0001
                    firstName: Jane
                    hireDate: '2026-01-15'
                    lastName: Smith
                    primaryEmail: jane.smith@example.com
                  - employeeNumber: EMP-0002
                    firstName: John
                    hireDate: '2026-02-01'
                    lastName: Doe
                    primaryPhone: +1-555-123-4567
            schema:
              $ref: '#/components/schemas/BulkIngestRequestPersonBulkIngestRecord'
        description: 'Bulk ingest envelope: a job-scoped batch of person records to import as ACTIVE employees.'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkIngestResponse'
          description: Batch processed; inspect per-record results
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request payload
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden
      security:
      - bearerAuth:
        - people:employee:create
      summary: Bulk Import Employee Records From Batch
      tags:
      - People Bulk Ingest API
      x-required-permissions:
      - people:employee:create
  /v1/people/compliance/inactive-person-active-user:
    get:
      description: 'Reports every ACTIVE user-person link whose linked person is in an inactive employment status (SUSPENDED, TERMINATED, or DISABLED), per ADR-0015 section 4; each row is a user that should have been disabled during offboarding.

        Use this tool for periodic identity-compliance audits; do not use disableEmployee here, which performs the offboarding itself rather than reporting on it.

        Preconditions: none; link facts come from the people-contact replica, so results can trail the link authority by the event-propagation delay.

        Required inputs: none; there are no parameters and no request body.

        Emits a REPORT_INACTIVE_PERSON_ACTIVE_USER_GENERATED audit event but changes no state; this is a read-only report.

        Returns 200 with an empty list when no offending links exist.

        '
      operationId: listInactivePersonActiveUsers
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/InactivePersonActiveUserResponse'
                type: array
          description: Offending links returned (possibly empty)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unexpected server error
      security:
      - bearerAuth:
        - people:compliance:view
      summary: List Active Users Linked To Inactive Persons
      tags:
      - People Compliance API
      x-required-permissions:
      - people:compliance:view
  /v1/people/credentials/bulk-ingest:
    post:
      description: 'Records many credentials at once, resolving each row''s employee number to a person and its vendor code (sourceCode + sourceCredentialCode, such as ASE T4-BRAKES) to a registry skill through the cross-reference, or taking a Durion skillCode such as DOT-INSPECTOR directly.

        Use this tool when loading an HR feed''s certifications or seeding an environment; read the registry at GET /v1/people/skills instead of guessing codes.

        Preconditions: each employee number must resolve to a person with an employee record, and each vendor code must be in the cross-reference — an unknown code rejects its row rather than becoming a skill nobody holds.

        Required inputs: jobId, and per record employeeNumber, issuer, issuedOn and either skillCode or sourceCode + sourceCredentialCode; expiresOn, proficiency (1-5) and evidenceRef are optional, and expiresOn may not precede issuedOn.

        Semantics: upsert by natural key (person, skill, issuer, issuedOn), so a re-send updates the expiry, proficiency and evidence, a renewal with a later issuedOn is a new row, and status is derived from the dates rather than taken from the row.

        With supersedeAbsent=true, each person in the batch has their credentials from this job''s sourceSystem that the batch no longer lists marked SUPERSEDED — never deleted.

        Emits a PEOPLE_CREDENTIAL_BULK_INGEST event and a person-credential fact per row written.

        Returns 200 with a per-record result, where a refused row carries CREDENTIAL_EMPLOYEE_UNKNOWN or CREDENTIAL_INGEST_REJECTED with the reason.

        '
      operationId: bulkIngestPersonCredentials
      requestBody:
        content:
          application/json:
            examples:
              HR certifications:
                description: HR certifications
                value:
                  jobId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a00
                  locationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a10
                  operatorId: seed-operator
                  records:
                  - employeeNumber: EMP-0006
                    expiresOn: '2029-03-15'
                    issuedOn: '2024-03-15'
                    proficiency: 4
                    sourceCode: ASE
                    sourceCredentialCode: T4-BRAKES
                  - employeeNumber: EMP-0008
                    expiresOn: '2027-01-10'
                    issuedOn: '2025-01-10'
                    issuer: SHOP
                    skillCode: DOT-INSPECTOR
            schema:
              $ref: '#/components/schemas/BulkIngestRequestPersonCredentialBulkIngestRecord'
        description: Credentials to record.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkIngestResponse'
          description: Batch processed; inspect per-record results
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request payload
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden
      summary: Record People's Credentials in Bulk
      tags:
      - Person Credential Bulk Ingest API
      x-required-permissions:
      - people:employee:edit
  /v1/people/employees:
    get:
      description: 'Returns a paged list of slim employee rows matching a case-insensitive substring search across first name, last name, preferred name, and employee number, optionally narrowed to one or more employment statuses and sorted.

        Use this tool when listing, filtering, sorting, or typeahead-filtering employees; do not use getEmployee, which requires the person id already be known, do not use getEmployeeByNumber, which resolves one exact employee number rather than searching, and do not use this tool to render the register''s stat tiles -- use getEmployeeStatusCounts instead, which returns the status histogram over the same q filter without changing this endpoint''s response shape.

        Preconditions: none; an empty result set is returned rather than an error when nothing matches.

        Required inputs: none are mandatory; q defaults to blank, which lists every employee; status defaults to none, which applies no status filter; sort defaults to lastName,asc; page defaults to 0, and size defaults to 20 with a maximum of 100. The status filter and sort are applied across every matching employee, not just the returned page, so totalElements and ordering are both correct for a result set spanning more than one page.

        Emits a PEOPLE_EMPLOYEE_SEARCH audit event but changes no state; this is a read-only projection merged in memory from local employment rows and the pos-people-contact identity replica.

        Register enrichment (durion#2155): include= repeatable tokens (USERNAME, CONTACT_INFO, ROLE_ASSIGNMENTS, LOCATION, JOB_ROLE) each turn on one extra field/group on the returned rows -- username, contact info, active application roles, a single primary location plus a count of the rest, and job role -- so the register can render a full page in this one call instead of one follow-up call per row per column. Omitted, every one of those fields is null: the pre-#2155 thin row, byte for byte, so an existing caller (e.g. HrFacadeTool.searchEmployees) sees no change. Whichever categories are requested are resolved against the page actually returned, never the whole matching set, so the response cost stays flat as the tenant grows. Two categories carry a second, narrower gate, and both behave the same way: requesting one without its permission still returns 200, just with that field absent from every row, never a 403. CONTACT_INFO: email/phone appear only when the caller also holds people:employee_pii:view (#1898). ROLE_ASSIGNMENTS: application roles appear only when the caller also holds people-contact:role:view, the same permission that gates the equivalent read on pos-people-contact -- #2160 changed where this data is read from, not who may see it.

        Returns 200 with an empty items list and correct totals when the page, query, or status filter matches nothing.

        '
      operationId: searchEmployees
      parameters:
      - description: Case-insensitive substring match on name or employee number; blank lists all
        in: query
        name: q
        required: false
        schema:
          type: string
      - description: Employment status filter; repeatable (?status=ACTIVE&status=DISABLED). Omitted or empty applies no status filter and lists every status.
        in: query
        name: status
        required: false
        schema:
          items:
            enum:
            - ACTIVE
            - ON_LEAVE
            - SUSPENDED
            - TERMINATED
            - DISABLED
            type: string
          type: array
      - description: Sort field with optional direction, e.g. 'lastName,desc'. Only lastName is supported today. Direction defaults to asc.
        in: query
        name: sort
        required: false
        schema:
          default: lastName,asc
          type: string
      - description: Zero-based page index
        in: query
        name: page
        required: false
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
      - description: Page size, up to 100
        in: query
        name: size
        required: false
        schema:
          default: 20
          exclusiveMinimum: 0
          format: int32
          maximum: 100
          type: integer
      - description: 'Register-enrichment categories (durion#2155); repeatable (?include=USERNAME&include=ROLE_ASSIGNMENTS), matching how `status` above is passed. Omitted or empty returns the thin pre-#2155 row: username, contactInfo, roleAssignments, primaryLocation, otherLocationCount and jobRole are all null. CONTACT_INFO additionally requires people:employee_pii:view (#1898) and ROLE_ASSIGNMENTS additionally requires people-contact:role:view; without the relevant permission that field is simply absent, never a 403.'
        in: query
        name: include
        required: false
        schema:
          items:
            enum:
            - USERNAME
            - CONTACT_INFO
            - ROLE_ASSIGNMENTS
            - LOCATION
            - JOB_ROLE
            type: string
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponseEmployeeSummaryDto'
          description: Employees returned (possibly empty)
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unsupported sort field or direction
      security:
      - bearerAuth:
        - people:employee:view
      summary: Search Employees By Name Or Number
      tags:
      - Employee API
      x-required-permissions:
      - people:employee:view
    post:
      description: 'Creates an employee profile: employment attributes (employee number, status, hire date) are stored in the people domain, while identity attributes (names, contact info) are forwarded to pos-people-contact as an upsert command with a server-generated UUIDv7 person id.

        Use this tool when hiring or registering a brand-new employee; do not use updateEmployee, which modifies an existing profile, and do not use createEmployeesBulk, which imports many records in one call.

        Preconditions: no existing employee may match the employee number, primary email, or phone when duplicatePolicy is STRICT (the default); identity duplicate checks run against an eventually consistent replica.

        Required inputs: firstName, lastName, employeeNumber, status (ACTIVE, ON_LEAVE, SUSPENDED, TERMINATED, DISABLED) and hireDate (yyyy-MM-dd); duplicatePolicy defaults to STRICT, and BALANCED accepts suspected duplicates while returning warnings in the response.

        Emits a PEOPLE_EMPLOYEE_CREATE event, publishes a people.employee.updated fact, and sends a person upsert command to pos-people-contact; the response echoes the submitted identity fields because the replica may lag.

        Returns 409 when a duplicate employee number, email, or phone is detected under STRICT policy, and 422 when terminationDate is before hireDate.

        '
      operationId: createEmployee
      requestBody:
        content:
          application/json:
            examples:
              New technician:
                description: New technician
                value:
                  contactInfo:
                    primaryEmail: jane.smith@example.com
                    primaryPhone: +1-555-123-4567
                  duplicatePolicy: STRICT
                  employeeNumber: EMP-0001
                  firstName: Jane
                  hireDate: '2026-01-15'
                  lastName: Smith
                  preferredName: Jane
                  status: ACTIVE
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
        description: 'Employee profile to create: identity fields forwarded to pos-people-contact plus local employment attributes.'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfileDto'
          description: Employee created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Duplicate employee
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Semantic validation failure
      security:
      - bearerAuth:
        - people:employee:create
      summary: Create A New Employee Profile
      tags:
      - Employee API
      x-required-permissions:
      - people:employee:create
  /v1/people/employees/by-number/{employeeNumber}:
    get:
      description: 'Resolves an employee number to a slim identity projection containing the person id, employee number, employment status, and an active flag.

        Use this tool for service-to-service approver resolution such as manager-approval-by-employee-number; use getEmployee instead when the full profile with names and contact info is needed, which requires the narrower people:employee_pii:view.

        Preconditions: an employee record with the given employee number must exist; matching is case-insensitive.

        Required inputs: employeeNumber (string) path parameter; there is no request body and no pagination.

        No events are emitted and no state changes; this is a read-only lookup.

        Returns 404 when no employee carries the supplied employee number.

        '
      operationId: getEmployeeByNumber
      parameters:
      - in: path
        name: employeeNumber
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeIdentityDto'
          description: Employee resolved
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No employee with that number
      security:
      - bearerAuth:
        - people:employee:view
      summary: Resolve Employee By Employee Number
      tags:
      - Employee API
      x-required-permissions:
      - people:employee:view
  /v1/people/employees/status-counts:
    get:
      description: 'Returns a per-status employee count for the employee register''s stat tiles, computed over the same case-insensitive name/employee-number q filter searchEmployees applies, before any status filter -- so every tile reports what selecting that status would return out of the current search, including for a status not currently selected.

        Use this tool alongside searchEmployees to render the register''s stat-tile row; do not use it in place of searchEmployees, which alone returns the paged row list (durion#2158: this histogram used to be folded into that endpoint''s response, which changed its shape for every caller -- it is now this separate, additive endpoint instead).

        Preconditions: none; an empty tenant, or a q that matches nothing, returns an empty counts map rather than an error.

        Required inputs: none are mandatory; q defaults to blank, which counts every employee. Unlike searchEmployees this endpoint takes no status, sort, page, size, or include parameters -- the histogram always covers the whole q-filtered set, never one page of it.

        Emits a PEOPLE_EMPLOYEE_STATUS_COUNTS audit event but changes no state; this is a read-only projection merged in memory the same way searchEmployees is, and carries a bucket for an employee with no status recorded (a legacy row) so the counts always sum to the q-filtered total.

        Returns 200 with an empty counts map when q matches nothing.

        '
      operationId: getEmployeeStatusCounts
      parameters:
      - description: Case-insensitive substring match on name or employee number; blank counts all
        in: query
        name: q
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeStatusCountsResponse'
          description: Status histogram returned (possibly empty)
      security:
      - bearerAuth:
        - people:employee:view
      summary: Get Employee Status Histogram For The Register
      tags:
      - Employee API
      x-required-permissions:
      - people:employee:view
  /v1/people/employees/{employeeId}:
    get:
      description: 'Returns the full employee profile for a person id, merging identity fields from the pos-people-contact replica with local employment fields, including the contactInfo block: personal address, personal phone numbers, personal email and emergency contact.

        Use this tool when the person id is already known; use getEmployeeByNumber instead to resolve a human-entered employee number, and searchEmployees to list or pick an employee without their personal contact detail.

        Preconditions: the caller holds people:employee_pii:view, which is narrower than the people:employee:view held by the structural reads; an employee row or identity-replica row must exist for the id; identity fields may briefly be null right after creation while the replica catches up.

        Required inputs: employeeId (UUID) path parameter, which is the person id; there is no request body.

        Emits a PEOPLE_EMPLOYEE_GET audit event but changes no state; this is a read-only projection.

        Returns 403 when the caller does not hold people:employee_pii:view, and 404 when neither an employee record nor a person replica row exists for the id.

        '
      operationId: getEmployee
      parameters:
      - in: path
        name: employeeId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfileDto'
          description: Employee found
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Employee not found
      security:
      - bearerAuth:
        - people:employee_pii:view
      summary: Get Employee Profile By Person Id
      tags:
      - Employee API
      x-required-permissions:
      - people:employee_pii:view
    put:
      description: 'Updates an existing employee profile by person id, replacing employment attributes locally and forwarding identity attributes to pos-people-contact as an upsert command.

        Use this tool when correcting or changing an existing employee''s details; do not use createEmployee, which registers a new person, and do not use disableEmployee, which is the offboarding transition.

        Preconditions: an employee row or identity-replica row must exist for the supplied employeeId, which is the person id at this API surface.

        Required inputs: employeeId (UUID) path parameter plus the full profile (firstName, lastName, employeeNumber, status, hireDate); this is a full replacement, not a patch, and duplicatePolicy defaults to STRICT.

        Emits a PEOPLE_EMPLOYEE_UPDATE event and publishes a people.employee.updated fact; a status change also stamps statusEffectiveAt.

        Returns 404 when no employee or person exists for the id, 409 when another employee already uses the employee number, email, or phone under STRICT policy, and 422 when terminationDate is before hireDate.

        '
      operationId: updateEmployee
      parameters:
      - in: path
        name: employeeId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Status change to leave:
                description: Status change to leave
                value:
                  duplicatePolicy: BALANCED
                  employeeNumber: EMP-0001
                  firstName: Jane
                  hireDate: '2026-01-15'
                  lastName: Smith
                  status: ON_LEAVE
            schema:
              $ref: '#/components/schemas/UpdateEmployeeRequest'
        description: Full replacement employee profile; identity fields are re-sent to pos-people-contact as an upsert command.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfileDto'
          description: Employee updated
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Employee not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Duplicate employee
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Semantic validation failure
      security:
      - bearerAuth:
        - people:employee:edit
      summary: Update An Existing Employee Profile
      tags:
      - Employee API
      x-required-permissions:
      - people:employee:edit
  /v1/people/employees/{employeeId}/disable:
    post:
      description: 'Disables an ACTIVE employee, setting status DISABLED with a fresh statusEffectiveAt, and applies the requested staffing-assignment offboarding policy.

        Use this tool for offboarding; do not use updateEmployee to force the status field, which skips offboarding, and do not use endStaffingAssignment, which ends a single assignment only.

        Preconditions: the employee must exist and be in ACTIVE status; ON_LEAVE or SUSPENDED employees are rejected, as are already DISABLED or TERMINATED ones.

        Required inputs: employeeId (UUID) path parameter; the body is optional, assignmentPolicy defaults to IMMEDIATE, and assignmentEndDate applies only with GRACE_PERIOD.

        Emits a PEOPLE_EMPLOYEE_DISABLE event and publishes a people.employee.updated fact; when the downstream assignment action fails, a retry is queued with a five-minute delay instead of failing the request.

        Returns 404 when the employee does not exist, and 409 when the employee is not currently ACTIVE (an already DISABLED, TERMINATED, ON_LEAVE, or SUSPENDED employee cannot be disabled again).

        '
      operationId: disableEmployee
      parameters:
      - in: path
        name: employeeId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Grace-period offboarding:
                description: Grace-period offboarding
                value:
                  assignmentEndDate: '2026-03-31'
                  assignmentPolicy: GRACE_PERIOD
                  disableReason: Voluntary resignation
            schema:
              $ref: '#/components/schemas/DisableEmployeeRequestDto'
        description: Optional offboarding metadata controlling how the employee's staffing assignments are terminated; omitting it applies the IMMEDIATE policy.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfileDto'
          description: Employee disabled
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Employee not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Employee is not currently ACTIVE
      security:
      - bearerAuth:
        - people:employee:activation
      summary: Disable Employee And Offboard Assignments
      tags:
      - Employee API
      x-required-permissions:
      - people:employee:activation
  /v1/people/employees/{employeeId}/enable:
    post:
      description: 'Reactivates a DISABLED employee, setting status ACTIVE with a fresh statusEffectiveAt. This is the explicit DISABLED -> ACTIVE transition DECISION-PEOPLE-001 calls for, and the direct inverse of disableEmployee: staffing assignments are left exactly as disableEmployee''s offboarding policy left them, never silently resurrected.

        Use this tool to bring a DISABLED employee back to ACTIVE; do not use updateEmployee to force the status field, which is gated on the broader profile-edit permission rather than this activation permission and runs no confirmation semantics, and do not use this tool for ON_LEAVE or SUSPENDED employees, which carry dates and a reason that only updateEmployee collects.

        Preconditions: the employee must exist and currently be DISABLED; TERMINATED is rejected as irreversible, ACTIVE is rejected as already active, and ON_LEAVE or SUSPENDED are rejected in favor of updateEmployee.

        Required inputs: employeeId (UUID) path parameter; the request body is required and carries updatedAt, the concurrency token also returned as EmployeeProfileDto.updatedAt — submit back the value most recently read for this employee so a change made in the meantime is caught rather than silently overwritten.

        Emits a PEOPLE_EMPLOYEE_ENABLE event and publishes a people.employee.updated fact, so the downstream replicas disableEmployee notified converge back to ACTIVE without a manual replay.

        Returns 404 when the employee does not exist, and 409 when the employee is TERMINATED (irreversible), ON_LEAVE or SUSPENDED (use updateEmployee instead), already ACTIVE, or when the submitted updatedAt no longer matches the employee''s current value.

        '
      operationId: enableEmployee
      parameters:
      - in: path
        name: employeeId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Reactivate with last-known updatedAt:
                description: Reactivate with last-known updatedAt
                value:
                  updatedAt: '2026-02-01T14:05:00Z'
            schema:
              $ref: '#/components/schemas/EnableEmployeeRequestDto'
        description: 'Concurrency token guarding the reactivation: the updatedAt value most recently read for this employee.'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfileDto'
          description: Employee enabled
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Employee not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Employee is not currently DISABLED, or the concurrency token is stale
      security:
      - bearerAuth:
        - people:employee:activation
      summary: Enable A Disabled Employee
      tags:
      - Employee API
      x-required-permissions:
      - people:employee:activation
  /v1/people/exceptions:
    get:
      description: 'Lists time entry exceptions, either all of them or those recorded for one employee.

        Use this tool to review open and historical exceptions; use createTimeEntryException instead to record a new one.

        Preconditions: none; when employeeId is omitted every exception in the system is returned without pagination.

        Required inputs: none; employeeId (string) is an optional filter.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 with an empty list when nothing matches.

        '
      operationId: listTimeEntryExceptions
      parameters:
      - in: query
        name: employeeId
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TimeEntryException'
                type: array
          description: List returned
      security:
      - bearerAuth:
        - people:timeException:view
      summary: List Time Entry Exceptions By Employee
      tags:
      - People - Exceptions
      x-required-permissions:
      - people:timeException:view
    post:
      description: 'Records a timekeeping exception in OPEN status for an employee, such as a missed clock-out.

        Use this tool when a timekeeping anomaly is detected; do not use resolveTimeEntryException or waiveTimeEntryException, which close an existing exception.

        Preconditions: none are checked against other records; employeeId and timeEntryId are stored as given without referential validation.

        Required inputs: employeeId and exceptionCode; severity accepts WARNING or BLOCKING and silently falls back to WARNING on any other value, and detectedAt defaults to the current server time.

        Emits a PEOPLE_TIME_ENTRY_EXCEPTION_CREATE event; the exception starts in OPEN status.

        Returns 200 with the new exceptionId, and 400 when the JSON payload is malformed.

        '
      operationId: createTimeEntryException
      requestBody:
        content:
          application/json:
            examples:
              Missed clock-out:
                description: Missed clock-out
                value:
                  detectedAt: '2026-02-17T08:30:00-05:00'
                  employeeId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  exceptionCode: MISSED_CLOCK_OUT
                  resolutionNotes: Employee forgot to clock out at end of shift
                  severity: BLOCKING
                  timeEntryId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
            schema:
              $ref: '#/components/schemas/TimeEntryExceptionRequest'
        description: Timekeeping anomaly to record against an employee, optionally tied to a specific time entry.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntryExceptionResponse'
          description: Exception created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request
      security:
      - bearerAuth:
        - people:timeException:create
      summary: Create A Time Entry Exception
      tags:
      - People - Exceptions
      x-required-permissions:
      - people:timeException:create
  /v1/people/exceptions/{exceptionId}/acknowledge:
    post:
      description: 'Marks an OPEN time entry exception as ACKNOWLEDGED, stamping the acting user and timestamp.

        Use this tool to signal an exception has been seen but not yet fixed; use resolveTimeEntryException or waiveTimeEntryException instead to close it.

        Preconditions: the exception must exist and must not already be RESOLVED or WAIVED, which are terminal states.

        Required inputs: exceptionId (UUID) path parameter; there is no request body, and an optional X-Correlation-Id header is carried into the audit trail.

        Emits a PEOPLE_TIME_ENTRY_EXCEPTION_ACKNOWLEDGE event and writes an EXCEPTION_ACKNOWLEDGED audit row.

        Returns 404 when the exception does not exist, and 409 when it is already RESOLVED or WAIVED.

        '
      operationId: acknowledgeTimeEntryException
      parameters:
      - in: path
        name: exceptionId
        required: true
        schema:
          format: uuid
          type: string
      - in: header
        name: X-Correlation-Id
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: Exception acknowledged successfully
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Exception not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Exception is already RESOLVED or WAIVED
      security:
      - bearerAuth:
        - people:timeException:acknowledge
      summary: Acknowledge An Open Time Entry Exception
      tags:
      - People - Exceptions
      x-required-permissions:
      - people:timeException:acknowledge
  /v1/people/exceptions/{exceptionId}/resolve:
    post:
      description: 'Marks a time entry exception as RESOLVED with optional resolution notes, stamping the acting user and timestamp.

        Use this tool when the underlying issue has been fixed; use waiveTimeEntryException instead to close it without a fix, or acknowledgeTimeEntryException to flag it as merely seen.

        Preconditions: the exception must exist and must not already be RESOLVED or WAIVED, which are terminal states.

        Required inputs: exceptionId (UUID) path parameter; the body is optional and may carry resolutionNotes.

        Emits a PEOPLE_TIME_ENTRY_EXCEPTION_RESOLVE event and writes an EXCEPTION_RESOLVED audit row.

        Returns 404 when the exception does not exist, and 409 when it is already RESOLVED or WAIVED.

        '
      operationId: resolveTimeEntryException
      parameters:
      - in: path
        name: exceptionId
        required: true
        schema:
          format: uuid
          type: string
      - in: header
        name: X-Correlation-Id
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Resolution with notes:
                description: Resolution with notes
                value:
                  resolutionNotes: Corrected the clock-out time manually
            schema:
              $ref: '#/components/schemas/TimeEntryExceptionResolveRequest'
        description: Optional resolution details; when present, resolutionNotes replaces the notes stored on the exception.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: Exception resolved successfully
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Exception not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Exception is already RESOLVED or WAIVED
      security:
      - bearerAuth:
        - people:timeException:resolve
      summary: Resolve A Time Entry Exception
      tags:
      - People - Exceptions
      x-required-permissions:
      - people:timeException:resolve
  /v1/people/exceptions/{exceptionId}/waive:
    post:
      description: 'Marks a time entry exception as WAIVED with a mandatory reason, closing it without a correction.

        Use this tool to deliberately dismiss an exception; use resolveTimeEntryException instead when the underlying issue was actually fixed.

        Preconditions: the exception must exist and must not already be RESOLVED or WAIVED, which are terminal states.

        Required inputs: exceptionId (UUID) path parameter and a body with a non-blank waiveReason, which is stored as the exception''s resolution notes.

        Emits a PEOPLE_TIME_ENTRY_EXCEPTION_WAIVE event and writes an EXCEPTION_WAIVED audit row.

        Returns 404 when the exception does not exist, 400 when waiveReason is blank, and 409 when the exception is already RESOLVED or WAIVED.

        '
      operationId: waiveTimeEntryException
      parameters:
      - in: path
        name: exceptionId
        required: true
        schema:
          format: uuid
          type: string
      - in: header
        name: X-Correlation-Id
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Waive for device outage:
                description: Waive for device outage
                value:
                  waiveReason: Known device outage; entry validated manually
            schema:
              $ref: '#/components/schemas/TimeEntryExceptionWaiveRequest'
        description: Waiver justification; the reason is mandatory and becomes the exception's resolution notes.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: Exception waived successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request - waiveReason is required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Exception not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Exception is already RESOLVED or WAIVED
      security:
      - bearerAuth:
        - people:timeException:resolve
      summary: Waive A Time Entry Exception
      tags:
      - People - Exceptions
      x-required-permissions:
      - people:timeException:resolve
  /v1/people/job-roles:
    get:
      description: 'Returns every active job role on the calling tenant''s own list, ordered by name.

        Use this tool to populate a job-role picker when creating or editing an employee, or to look up the id createJobRole needs; do not use it to look up application roles or permissions, which live in pos-security-service and are a different concept entirely.

        Preconditions: the caller holds people:jobRole:view.

        Required inputs: none; there are no parameters and no request body.

        No events are emitted beyond the audit read and no state changes; this is a read-only projection scoped to the caller''s tenant.

        Returns 200 with the list, empty when the tenant has defined none, and 403 without the authority.

        '
      operationId: listJobRoles
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/JobRoleDto'
                type: array
          description: The tenant's active job roles.
      security:
      - bearerAuth:
        - people:jobRole:view
      summary: List The Tenant's Job Roles
      tags:
      - Job Role API
      x-required-permissions:
      - people:jobRole:view
    post:
      description: 'Adds a job role to the calling tenant''s own list: a code, a display name and an optional description. HR master data only -- it carries no permissions and is never evaluated by security decisions.

        Use this tool to set up the tenant''s job titles before assigning them to employees; do not use it to create an application role or a permission, which are pos-security-service concepts.

        Preconditions: the caller holds people:jobRole:manage; the code must not already be used by another job role in this tenant (another tenant may reuse the same code freely).

        Required inputs: code and name; description is optional.

        Emits a PEOPLE_JOB_ROLE_CREATE event; no other state changes.

        Returns 422 when the code is already in use within this tenant.

