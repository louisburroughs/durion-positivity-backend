openapi: 3.1.0
info:
  title: POS Human Resources Service API
  description: Human Resources service for employee management, payroll, and benefits administration
  contact:
    name: Durion Support Services
    email: louis.burroughs@gmail.com
  version: v1
servers:
- url: http://localhost:8086
  description: Generated server url
tags:
- name: People - Staffing Assignments
  description: Person-to-location staffing assignment operations (CAP-119)
- name: People Reports API
  description: Reporting endpoints for people and attendance data
- name: Time Entry Approval API
  description: Approve/reject time entries (batch)
- name: People Availability API
  description: Operations for querying people availability
- name: Work Sessions API
  description: Operations for managing work sessions and breaks
- name: People API
  description: Operations related to people records
- name: People - TimeEntries
  description: Time entry adjustments and related APIs
- name: People TimeEntries
  description: Time entry adjustments and related APIs
- name: People - Exceptions
  description: Time entry exception APIs
- name: People Bulk Ingest API
  description: Bulk import employee records
- name: Employee API
  description: Employee profile and offboarding operations
- name: Timekeeping Approval API
  description: Pay-period-based timekeeping approval operations
paths:
  /v1/people/staffing/assignments/{assignmentId}:
    get:
      tags:
      - People - Staffing Assignments
      summary: Get assignment by ID
      description: Retrieves a single staffing assignment by its unique ID.
      operationId: getAssignment
      parameters:
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Assignment found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffingAssignmentResponse'
        '404':
          description: Assignment not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffingAssignmentResponse'
      security:
      - bearerAuth:
        - people:employee:view
      x-required-permissions:
      - people:employee:view
    put:
      tags:
      - People - Staffing Assignments
      summary: Update staffing assignment
      description: Updates an existing staffing assignment, including role, dates, and primary flag.
      operationId: updateAssignment
      parameters:
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStaffingAssignmentRequest'
        required: true
      responses:
        '200':
          description: Assignment updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffingAssignmentResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffingAssignmentResponse'
        '404':
          description: Assignment not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffingAssignmentResponse'
        '409':
          description: Overlapping assignment exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffingAssignmentResponse'
      security:
      - bearerAuth:
        - people:employee:edit
      x-required-permissions:
      - people:employee:edit
    delete:
      tags:
      - People - Staffing Assignments
      summary: End (soft-delete) an assignment
      description: Ends an active staffing assignment without physically deleting the record.
      operationId: endAssignment
      parameters:
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Assignment ended.
        '404':
          description: Assignment not found.
      security:
      - bearerAuth:
        - people:employee:edit
      x-required-permissions:
      - people:employee:edit
  /v1/people/employees/{employeeId}:
    get:
      tags:
      - Employee API
      summary: Get employee profile
      description: Retrieves an employee profile by employee ID.
      operationId: getEmployee
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Employee found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfileDto'
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfileDto'
      security:
      - bearerAuth:
        - people:employee:view
      x-required-permissions:
      - people:employee:view
    put:
      tags:
      - Employee API
      summary: Update employee profile
      description: Updates an existing employee profile using the provided employee ID.
      operationId: updateEmployee
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeRequest'
        required: true
      responses:
        '200':
          description: Employee updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfileDto'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfileDto'
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfileDto'
        '409':
          description: Duplicate employee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfileDto'
        '422':
          description: Semantic validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfileDto'
      security:
      - bearerAuth:
        - people:employee:edit
      x-required-permissions:
      - people:employee:edit
  /v1/people/workSessions/{id}/submit:
    post:
      tags:
      - Work Sessions API
      summary: Submit work session
      description: Submit an ended work session with its billable and break totals for approval.
      operationId: submitWorkSession
      parameters:
      - name: id
        in: path
        description: Work session ID
        required: true
        schema:
          type: string
          format: uuid
        example: 7b1f5a9d-0c2b-4c6d-9a5a-5f8e7c3a9b1c
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkSessionSubmitRequest'
        required: true
      responses:
        '200':
          description: Work session submitted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkSessionDto'
        '404':
          description: Work session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkSessionDto'
        '409':
          description: Work session is not in a submittable state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkSessionDto'
      security:
      - bearerAuth: []
      x-required-permissions:
      - AUTHENTICATED
  /v1/people/workSessions/{id}/breaks/stop:
    post:
      tags:
      - Work Sessions API
      summary: Stop work session break
      description: End a break within a work session.
      operationId: stopWorkSessionBreak
      parameters:
      - name: id
        in: path
        description: Work session ID
        required: true
        schema:
          type: string
          format: uuid
        example: 7b1f5a9d-0c2b-4c6d-9a5a-5f8e7c3a9b1c
      responses:
        '200':
          description: Break stopped successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakDto'
        '404':
          description: Work session or break not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakDto'
      security:
      - bearerAuth: []
      x-required-permissions:
      - AUTHENTICATED
  /v1/people/workSessions/{id}/breaks/start:
    post:
      tags:
      - Work Sessions API
      summary: Start work session break
      description: Start a break within an active work session.
      operationId: startWorkSessionBreak
      parameters:
      - name: id
        in: path
        description: Work session ID
        required: true
        schema:
          type: string
          format: uuid
        example: 7b1f5a9d-0c2b-4c6d-9a5a-5f8e7c3a9b1c
      responses:
        '200':
          description: Break started successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakDto'
        '404':
          description: Work session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakDto'
      security:
      - bearerAuth: []
      x-required-permissions:
      - AUTHENTICATED
  /v1/people/workSessions/stop:
    post:
      tags:
      - Work Sessions API
      summary: Stop work session
      description: Stop an active work session.
      operationId: stopWorkSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkSessionRequest'
        required: true
      responses:
        '200':
          description: Work session stopped successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkSessionDto'
      security:
      - bearerAuth: []
      x-required-permissions:
      - AUTHENTICATED
  /v1/people/workSessions/start:
    post:
      tags:
      - Work Sessions API
      summary: Start work session
      description: Create/start a work session for a person.
      operationId: startWorkSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkSessionRequest'
        required: true
      responses:
        '200':
          description: Work session started successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkSessionDto'
      security:
      - bearerAuth: []
      x-required-permissions:
      - AUTHENTICATED
  /v1/people/timekeeping/time-periods/{timePeriodId}/people/{personId}/reject:
    post:
      tags:
      - Timekeeping Approval API
      summary: Reject all pending timekeeping entries for a person in a period
      description: Bulk-rejects all PENDING_APPROVAL timekeeping entries for the given employee in the given period.
      operationId: rejectPeriod
      parameters:
      - name: timePeriodId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: personId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectTimePeriodRequest'
        required: true
      responses:
        '200':
          description: Entries rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimePeriodDecisionResponse'
        '400':
          description: Reason is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimePeriodDecisionResponse'
        '404':
          description: Time period not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimePeriodDecisionResponse'
      security:
      - bearerAuth:
        - people:timekeeping:reject
      x-required-permissions:
      - people:timekeeping:reject
  /v1/people/timekeeping/time-periods/{timePeriodId}/people/{personId}/approve:
    post:
      tags:
      - Timekeeping Approval API
      summary: Approve all pending timekeeping entries for a person in a period
      description: Bulk-approves all PENDING_APPROVAL timekeeping entries for the given employee in the given period.
      operationId: approvePeriod
      parameters:
      - name: timePeriodId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: personId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Entries approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimePeriodDecisionResponse'
        '404':
          description: Time period not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimePeriodDecisionResponse'
      security:
      - bearerAuth:
        - people:timekeeping:approve
      x-required-permissions:
      - people:timekeeping:approve
  /v1/people/timeEntries/reject:
    post:
      tags:
      - Time Entry Approval API
      summary: Batch reject time entries
      description: Reject multiple time entries. rejectionReason is required for each decision.
      operationId: rejectTimeEntries
      parameters:
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeEntryDecisionBatchRequest'
        required: true
      responses:
        '200':
          description: Time entries rejected successfully
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid request - rejectionReason required for all decisions
          content:
            application/json:
              schema:
                type: object
      security:
      - bearerAuth:
        - people:timeEntry:reject
      x-required-permissions:
      - people:timeEntry:reject
  /v1/people/timeEntries/approve:
    post:
      tags:
      - Time Entry Approval API
      summary: Batch approve time entries
      description: Approve multiple time entries. pos-people is authoritative for approval execution.
      operationId: approveTimeEntries
      parameters:
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeEntryDecisionBatchRequest'
        required: true
      responses:
        '200':
          description: Time entries approved successfully
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid request - decisions required
          content:
            application/json:
              schema:
                type: object
      security:
      - bearerAuth:
        - people:timeEntry:approve
      x-required-permissions:
      - people:timeEntry:approve
  /v1/people/timeEntries/adjustments:
    post:
      tags:
      - People TimeEntries
      summary: Create a time entry adjustment
      description: Submit a request to adjust a time entry. The adjustment will be in PENDING status until approved.
      operationId: createAdjustment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeEntryAdjustmentRequest'
        required: true
      responses:
        '201':
          description: Adjustment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntryAdjustmentResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntryAdjustmentResponse'
        '404':
          description: Time entry not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntryAdjustmentResponse'
        '409':
          description: Invalid time entry state for adjustment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntryAdjustmentResponse'
      security:
      - bearerAuth:
        - people:timeAdjustment:create
      x-required-permissions:
      - people:timeAdjustment:create
  /v1/people/timeEntries/adjustments/{adjustmentId}/approve:
    post:
      tags:
      - People TimeEntries
      summary: Approve a time entry adjustment
      description: Approve a pending time entry adjustment. Requires approval permissions.
      operationId: approveAdjustment
      parameters:
      - name: adjustmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Adjustment approved successfully
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Adjustment not found
          content:
            application/json:
              schema:
                type: object
      security:
      - bearerAuth:
        - people:timeAdjustment:approve
      x-required-permissions:
      - people:timeAdjustment:approve
  /v1/people/staffing/assignments:
    get:
      tags:
      - People - Staffing Assignments
      summary: List assignments for person
      description: Returns all staffing assignments for the specified person.
      operationId: getAssignments
      parameters:
      - name: personId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: List of assignments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffingAssignmentResponse'
      security:
      - bearerAuth:
        - people:employee:view
      x-required-permissions:
      - people:employee:view
    post:
      tags:
      - People - Staffing Assignments
      summary: Create staffing assignment
      description: Link a person to a location with role, effective dates, and primary flag.
      operationId: createAssignment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffingAssignmentRequest'
        required: true
      responses:
        '201':
          description: Assignment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffingAssignmentResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffingAssignmentResponse'
        '404':
          description: Location or person not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffingAssignmentResponse'
        '409':
          description: Overlapping assignment exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffingAssignmentResponse'
      security:
      - bearerAuth:
        - people:employee:edit
      x-required-permissions:
      - people:employee:edit
  /v1/people/exceptions:
    get:
      tags:
      - People - Exceptions
      summary: List exceptions, optional filter by employeeId
      description: Retrieve all exceptions or filter by a specific employee ID.
      operationId: listByEmployee
      parameters:
      - name: employeeId
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: List returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeEntryException'
      security:
      - bearerAuth:
        - people:timeException:view
      x-required-permissions:
      - people:timeException:view
    post:
      tags:
      - People - Exceptions
      summary: Create a time entry exception
      description: Create a new time entry exception record with validation of required fields.
      operationId: createException
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeEntryExceptionRequest'
        required: true
      responses:
        '200':
          description: Exception created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntryExceptionResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntryExceptionResponse'
      security:
      - bearerAuth:
        - people:timeException:create
      x-required-permissions:
      - people:timeException:create
  /v1/people/exceptions/{exceptionId}/waive:
    post:
      tags:
      - People - Exceptions
      summary: Waive an exception
      description: Waive an exception with a reason. waiveReason is required.
      operationId: waiveException
      parameters:
      - name: exceptionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeEntryExceptionWaiveRequest'
        required: true
      responses:
        '200':
          description: Exception waived successfully
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid request - waiveReason is required
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Exception not found
          content:
            application/json:
              schema:
                type: object
      security:
      - bearerAuth:
        - people:timeException:resolve
      x-required-permissions:
      - people:timeException:resolve
  /v1/people/exceptions/{exceptionId}/resolve:
    post:
      tags:
      - People - Exceptions
      summary: Resolve an exception
      description: Mark an exception as resolved with optional resolution notes.
      operationId: resolveException
      parameters:
      - name: exceptionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeEntryExceptionResolveRequest'
      responses:
        '200':
          description: Exception resolved successfully
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Exception not found
          content:
            application/json:
              schema:
                type: object
      security:
      - bearerAuth:
        - people:timeException:resolve
      x-required-permissions:
      - people:timeException:resolve
  /v1/people/exceptions/{exceptionId}/acknowledge:
    post:
      tags:
      - People - Exceptions
      summary: Acknowledge an exception
      description: Mark an exception as acknowledged.
      operationId: acknowledgeException
      parameters:
      - name: exceptionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Exception acknowledged successfully
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Exception not found
          content:
            application/json:
              schema:
                type: object
      security:
      - bearerAuth:
        - people:timeException:acknowledge
      x-required-permissions:
      - people:timeException:acknowledge
  /v1/people/employees:
    post:
      tags:
      - Employee API
      summary: Create employee profile
      description: Creates a new employee profile with identity, employment, and role-related attributes.
      operationId: createEmployee
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
        required: true
      responses:
        '201':
          description: Employee created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfileDto'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfileDto'
        '409':
          description: Duplicate employee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfileDto'
        '422':
          description: Semantic validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfileDto'
      security:
      - bearerAuth:
        - people:employee:create
      x-required-permissions:
      - people:employee:create
  /v1/people/employees/{employeeId}/disable:
    post:
      tags:
      - Employee API
      summary: Disable employee profile
      description: Disables an employee profile and records optional disable metadata.
      operationId: disableEmployee
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisableEmployeeRequestDto'
      responses:
        '200':
          description: Employee disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfileDto'
        '400':
          description: Employee cannot be disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfileDto'
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfileDto'
      security:
      - bearerAuth:
        - people:employee:deactivate
      x-required-permissions:
      - people:employee:deactivate
  /v1/people/bulk-ingest:
    post:
      tags:
      - People Bulk Ingest API
      summary: Bulk ingest records
      description: Accepts a batch of domain records for bulk import. Returns per-record results.
      operationId: bulkIngest
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkIngestRequestPersonBulkIngestRecord'
        required: true
      responses:
        '200':
          description: Batch processed (check per-record success/failure in response)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkIngestResponse'
        '400':
          description: Invalid request payload
          content:
