components:
  schemas:
    Person:
      type: object
      description: Person object to be created
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        primaryEmail:
          type: string
        secondaryEmail:
          type: string
        phoneNumbers:
          type: array
          items:
            type: string
        username:
          type: string
    UpdateStaffingAssignmentRequest:
      type: object
      description: Request to update a staffing assignment
      properties:
        personId:
          type: string
          format: uuid
          description: Person identifier
          example: 123e4567-e89b-12d3-a456-426614174000
        locationId:
          type: string
          format: uuid
          description: Location identifier
          example: 22222222-2222-2222-2222-222222222222
        role:
          type: string
          description: Assignment role
          example: TECHNICIAN
        effectiveFrom:
          type: string
          format: date
          description: Assignment effective start date
          example: 2026-02-16
        effectiveTo:
          type: string
          format: date
          description: Assignment effective end date
          example: 2026-12-31
        effectiveDateRangeValid:
          type: boolean
        isPrimary:
          type: boolean
          description: Whether this assignment is primary
          example: true
      required:
      - effectiveFrom
      - isPrimary
      - locationId
      - personId
      - role
    StaffingAssignmentResponse:
      type: object
      description: Staffing assignment response
      properties:
        assignmentId:
          type: string
          format: uuid
          description: Assignment identifier
          example: 33333333-3333-3333-3333-333333333333
        personId:
          type: string
          format: uuid
          description: Person identifier
          example: 123e4567-e89b-12d3-a456-426614174000
        locationId:
          type: string
          format: uuid
          description: Location identifier
          example: 22222222-2222-2222-2222-222222222222
        role:
          type: string
          description: Assignment role
          example: TECHNICIAN
        status:
          type: string
          description: Assignment lifecycle status
          enum:
          - ACTIVE
          - ENDED
        effectiveFrom:
          type: string
          format: date
          description: Assignment effective start date
          example: 2026-02-16
        effectiveTo:
          type: string
          format: date
          description: Assignment effective end date
          example: 2026-12-31
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp in UTC
          example: 2026-02-16T14:30:00Z
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp in UTC
          example: 2026-02-18T09:15:00Z
        createdBy:
          type: string
          description: Username that created the assignment
          example: manager.user
        isPrimary:
          type: boolean
          description: Whether this assignment is primary
          example: true
      required:
      - assignmentId
      - effectiveFrom
      - isPrimary
      - locationId
      - personId
      - role
      - status
