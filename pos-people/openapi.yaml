      - personId
      - sessionId
      - status
    BreakDto:
      type: object
      description: Break taken within a work session
      properties:
        sessionId:
          type: string
          format: uuid
          description: Work session the break belongs to
          example: 01960011-0000-7000-8000-000000000001
        startedAt:
          type: string
          format: date-time
          description: Timestamp the break started
          example: 2026-02-16T12:00:00Z
        endedAt:
          type: string
          format: date-time
          description: Timestamp the break ended
          example: 2026-02-16T12:30:00Z
      required:
      - sessionId
      - startedAt
    WorkSessionRequest:
      type: object
      description: Request to start or act on a work session for a person
      properties:
        personId:
          type: string
          format: uuid
          description: ID of the person
          example: 01960011-0000-7000-8000-000000000001
        actor:
          type: string
          description: Actor performing the action
          example: manager.user
      required:
      - personId
    RejectTimePeriodRequest:
      type: object
      description: Request to reject a time period approval
      properties:
        reason:
          type: string
          description: Reason the time period is being rejected
          example: Missing break entries for two shifts
          minLength: 1
      required:
      - reason
    TimePeriodDecisionResponse:
      type: object
      description: Result of an approve/reject decision applied across a person's
        time period entries
      properties:
        personId:
          type: string
          format: uuid
          description: Person identifier
          example: 01960011-0000-7000-8000-000000000001
        timePeriodId:
          type: string
          format: uuid
          description: Time period identifier
          example: 01960011-0000-7000-8000-000000000010
        processedCount:
          type: integer
          format: int32
          description: Number of entries processed by the decision
          example: 7
        status:
          type: string
          description: Resulting status of the operation
          example: APPROVED
      required:
      - personId
      - processedCount
      - status
      - timePeriodId
    Decision:
      type: object
      description: An individual decision for a specific time entry
      properties:
        timeEntryId:
          type: string
          description: The unique identifier of the time entry
          example: 123e4567-e89b-12d3-a456-426614174000
          minLength: 1
        rejectionReason:
          type: string
          description: The reason for rejection. Applicable if this is a rejection
            request.
          example: Incomplete work details
      required:
      - timeEntryId
    TimeEntryDecisionBatchRequest:
      type: object
      description: Batch request payload for making decisions (approve/reject) on
        multiple time entries
      properties:
        decisions:
          type: array
          description: List of decisions for the time entries
          items:
            $ref: "#/components/schemas/Decision"
          minItems: 1
      required:
      - decisions
    TimeEntryAdjustmentRequest:
      type: object
      description: Request to create a time entry adjustment
      properties:
        timeEntryId:
          type: string
          format: uuid
          description: Time entry identifier to adjust
          example: 123e4567-e89b-12d3-a456-426614174000
        reasonCode:
          type: string
          description: Reason code for the adjustment
          example: MISSED_BREAK
          minLength: 1
        notes:
          type: string
          description: Additional notes explaining the adjustment
          example: Employee forgot to log lunch break
        proposedStartAt:
          type: string
          format: date-time
          description: Proposed new start timestamp
          example: 2026-02-17T08:00:00-05:00
        proposedEndAt:
          type: string
          format: date-time
          description: Proposed new end timestamp
          example: 2026-02-17T17:00:00-05:00
        minutesDelta:
          type: integer
          format: int32
          description: "Adjustment in minutes (positive to add time, negative to subtract)"
          example: -30
        createdBy:
          type: string
          description: User creating the adjustment request
          example: employee-456
      required:
      - reasonCode
      - timeEntryId
    TimeEntryAdjustmentResponse:
      type: object
      description: Response from creating or updating a time entry adjustment
      properties:
        adjustmentId:
          type: string
          format: uuid
          description: Unique identifier of the created or updated adjustment
          example: 123e4567-e89b-12d3-a456-426614174000
        success:
          type: boolean
          description: Indicates whether the operation was successful
          example: true
        message:
          type: string
          description: Human-readable message describing the outcome
          example: Adjustment created and pending approval
      required:
      - success
    CreateTimePeriodRequest:
      type: object
      description: Request to create a pay period for timekeeping approval
      properties:
        tenantId:
          type: string
          format: uuid
          description: Tenant the period belongs to
          example: 01960000-0000-7000-8000-000000000001
        startDate:
          type: string
          format: date
          description: First date of the period (inclusive)
          example: 2026-06-01
        endDate:
          type: string
          format: date
          description: Last date of the period (inclusive)
          example: 2026-06-14
        status:
          type: string
          description: Initial lifecycle status; defaults to OPEN when omitted
          enum:
          - OPEN
          - SUBMISSION_CLOSED
          - PAYROLL_CLOSED
          example: OPEN
      required:
      - endDate
      - startDate
      - tenantId
    TimePeriodDto:
      type: object
      description: Timekeeping time period bounding a payroll or submission cycle
      properties:
        timePeriodId:
          type: string
          format: uuid
          description: Time period identifier
          example: 01960011-0000-7000-8000-000000000001
        tenantId:
          type: string
          format: uuid
          description: Tenant identifier the period belongs to
          example: 01960011-0000-7000-8000-000000000099
        startDate:
          type: string
          format: date
          description: First date of the period
