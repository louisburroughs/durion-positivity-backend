  /v1/people/exceptions/{exceptionId}/acknowledge:
    post:
      tags:
      - People - Exceptions
      summary: Acknowledge An Open Time Entry Exception
      description: |
        Marks an OPEN time entry exception as ACKNOWLEDGED, stamping the acting user and timestamp.
        Use this tool to signal an exception has been seen but not yet fixed; use resolveTimeEntryException or waiveTimeEntryException instead to close it.
        Preconditions: the exception must exist and must not already be RESOLVED or WAIVED, which are terminal states.
        Required inputs: exceptionId (UUID) path parameter; there is no request body, and an optional X-Correlation-Id header is carried into the audit trail.
        Emits a PEOPLE_TIME_ENTRY_EXCEPTION_ACKNOWLEDGE event and writes an EXCEPTION_ACKNOWLEDGED audit row.
        Returns 404 when the exception does not exist, and 409 when it is already RESOLVED or WAIVED.
      operationId: acknowledgeTimeEntryException
      parameters:
      - name: exceptionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Exception acknowledged successfully
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Exception not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Exception is already RESOLVED or WAIVED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth:
        - people:timeException:acknowledge
      x-required-permissions:
      - people:timeException:acknowledge
  /v1/people/employees:
    get:
      tags:
      - Employee API
      summary: Search Employees By Name Or Number
      description: |
        Returns a paged list of slim employee rows matching a case-insensitive substring search across first name, last name, preferred name, and employee number, optionally narrowed to one or more employment statuses and sorted.
        Use this tool when listing, filtering, sorting, or typeahead-filtering employees; do not use getEmployee, which requires the person id already be known, do not use getEmployeeByNumber, which resolves one exact employee number rather than searching, and do not use this tool to render the register's stat tiles -- use getEmployeeStatusCounts instead, which returns the status histogram over the same q filter without changing this endpoint's response shape.
        Preconditions: none; an empty result set is returned rather than an error when nothing matches.
        Required inputs: none are mandatory; q defaults to blank, which lists every employee; status defaults to none, which applies no status filter; sort defaults to lastName,asc; page defaults to 0, and size defaults to 20 with a maximum of 100. The status filter and sort are applied across every matching employee, not just the returned page, so totalElements and ordering are both correct for a result set spanning more than one page.
        Emits a PEOPLE_EMPLOYEE_SEARCH audit event but changes no state; this is a read-only projection merged in memory from local employment rows and the pos-people-contact identity replica.
        Register enrichment (durion#2155, plus ALLOWED_ACTIONS from durion#2159): include= repeatable tokens (USERNAME, CONTACT_INFO, ROLE_ASSIGNMENTS, LOCATION, JOB_ROLE, ALLOWED_ACTIONS) each turn on one extra field/group on the returned rows -- username, contact info, active application roles, a single primary location plus a count of the rest, job role, and the caller's allowed actions on the row -- so the register can render a full page in this one call instead of one follow-up call per row per column. Omitted, every one of those fields is null: the pre-#2155 thin row, byte for byte, so an existing caller (e.g. HrFacadeTool.searchEmployees) sees no change. Whichever categories are requested are resolved against the page actually returned, never the whole matching set, so the response cost stays flat as the tenant grows. Two categories carry a second, narrower gate, and both behave the same way: requesting one without its permission still returns 200, just with that field absent from every row, never a 403. CONTACT_INFO: email/phone appear only when the caller also holds people:employee_pii:view (#1898). ROLE_ASSIGNMENTS: application roles appear only when the caller also holds people-contact:role:view, the same permission that gates the equivalent read on pos-people-contact -- #2160 changed where this data is read from, not who may see it. ALLOWED_ACTIONS is different again: a RENDERING HINT ONLY -- computed by EmployeeActionPolicy from the caller's permissions and each row's status, never a substitute for the @PreAuthorize and service-level guards those actions still enforce independently -- and it does not account for location-scoped access enforced elsewhere in this module, so a location-scoped caller may occasionally see an action listed that their scope does not actually cover for that employee.
        Returns 200 with an empty items list and correct totals when the page, query, or status filter matches nothing.
      operationId: searchEmployees
      parameters:
      - name: q
        in: query
        description: Case-insensitive substring match on name or employee number;
          blank lists all
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: Employment status filter; repeatable (?status=ACTIVE&status=DISABLED).
          Omitted or empty applies no status filter and lists every status.
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - ACTIVE
            - ON_LEAVE
            - SUSPENDED
            - TERMINATED
            - DISABLED
      - name: sort
        in: query
        description: "Sort field with optional direction, e.g. 'lastName,desc'. Only\
          \ lastName is supported today. Direction defaults to asc."
        required: false
        schema:
          type: string
          default: "lastName,asc"
      - name: page
        in: query
        description: Zero-based page index
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        description: "Page size, up to 100"
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          exclusiveMinimum: 0
          maximum: 100
      - name: include
        in: query
        description: "Register-enrichment categories (durion#2155, plus ALLOWED_ACTIONS\
          \ from durion#2159); repeatable (?include=USERNAME&include=ROLE_ASSIGNMENTS),\
          \ matching how `status` above is passed. Omitted or empty returns the thin\
          \ pre-#2155 row: username, contactInfo, roleAssignments, primaryLocation,\
          \ otherLocationCount, jobRole and allowedActions are all null. CONTACT_INFO\
          \ additionally requires people:employee_pii:view (#1898) and ROLE_ASSIGNMENTS\
          \ additionally requires people-contact:role:view; without the relevant permission\
          \ that field is simply absent, never a 403. ALLOWED_ACTIONS is a rendering\
          \ hint only -- see EmployeeSummaryDto.allowedActions."
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - USERNAME
            - CONTACT_INFO
            - ROLE_ASSIGNMENTS
            - LOCATION
            - JOB_ROLE
            - ALLOWED_ACTIONS
      responses:
        "200":
          description: Employees returned (possibly empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedResponseEmployeeSummaryDto"
        "400":
          description: Unsupported sort field or direction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth:
        - people:employee:view
      x-required-permissions:
      - people:employee:view
    post:
      tags:
      - Employee API
      summary: Create A New Employee Profile
      description: |
        Creates an employee profile: employment attributes (employee number, status, hire date) are stored in the people domain, while identity attributes (names, contact info) are forwarded to pos-people-contact as an upsert command with a server-generated UUIDv7 person id.
        Use this tool when hiring or registering a brand-new employee; do not use updateEmployee, which modifies an existing profile, and do not use createEmployeesBulk, which imports many records in one call.
        Preconditions: no existing employee may match the employee number, primary email, or phone when duplicatePolicy is STRICT (the default); identity duplicate checks run against an eventually consistent replica.
        Required inputs: firstName, lastName, employeeNumber, status (ACTIVE, ON_LEAVE, SUSPENDED, TERMINATED, DISABLED) and hireDate (yyyy-MM-dd); duplicatePolicy defaults to STRICT, and BALANCED accepts suspected duplicates while returning warnings in the response.
        Emits a PEOPLE_EMPLOYEE_CREATE event, publishes a people.employee.updated fact, and sends a person upsert command to pos-people-contact; the response echoes the submitted identity fields because the replica may lag.
        Returns 409 when a duplicate employee number, email, or phone is detected under STRICT policy, and 422 when terminationDate is before hireDate.
      operationId: createEmployee
      requestBody:
        description: "Employee profile to create: identity fields forwarded to pos-people-contact\
          \ plus local employment attributes."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeRequest"
            examples:
              New technician:
                description: New technician
                value:
                  firstName: Jane
                  lastName: Smith
                  preferredName: Jane
                  employeeNumber: EMP-0001
                  status: ACTIVE
                  hireDate: 2026-01-15
                  contactInfo:
                    primaryEmail: jane.smith@example.com
                    primaryPhone: +1-555-123-4567
                  duplicatePolicy: STRICT
        required: true
      responses:
        "201":
          description: Employee created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeProfileDto"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Duplicate employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Semantic validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth:
        - people:employee:create
      x-required-permissions:
      - people:employee:create
  /v1/people/employees/{employeeId}/enable:
    post:
      tags:
      - Employee API
      summary: Enable A Disabled Employee
      description: |
        Reactivates a DISABLED employee, setting status ACTIVE with a fresh statusEffectiveAt. This is the explicit DISABLED -> ACTIVE transition DECISION-PEOPLE-001 calls for, and the direct inverse of disableEmployee: staffing assignments are left exactly as disableEmployee's offboarding policy left them, never silently resurrected.
        Use this tool to bring a DISABLED employee back to ACTIVE; do not use updateEmployee to force the status field, which is gated on the broader profile-edit permission rather than this activation permission and runs no confirmation semantics, and do not use this tool for ON_LEAVE or SUSPENDED employees, which carry dates and a reason that only updateEmployee collects.
        Preconditions: the employee must exist and currently be DISABLED; TERMINATED is rejected as irreversible, ACTIVE is rejected as already active, and ON_LEAVE or SUSPENDED are rejected in favor of updateEmployee.
        Required inputs: employeeId (UUID) path parameter; the request body is required and carries updatedAt, the concurrency token also returned as EmployeeProfileDto.updatedAt — submit back the value most recently read for this employee so a change made in the meantime is caught rather than silently overwritten.
        Emits a PEOPLE_EMPLOYEE_ENABLE event and publishes a people.employee.updated fact, so the downstream replicas disableEmployee notified converge back to ACTIVE without a manual replay.
        Returns 404 when the employee does not exist, and 409 when the employee is TERMINATED (irreversible), ON_LEAVE or SUSPENDED (use updateEmployee instead), already ACTIVE, or when the submitted updatedAt no longer matches the employee's current value.
      operationId: enableEmployee
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: "Concurrency token guarding the reactivation: the updatedAt value\
          \ most recently read for this employee."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnableEmployeeRequestDto"
            examples:
              Reactivate with last-known updatedAt:
                description: Reactivate with last-known updatedAt
                value:
                  updatedAt: 2026-02-01T14:05:00Z
        required: true
      responses:
        "200":
          description: Employee enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeProfileDto"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "Employee is not currently DISABLED, or the concurrency token\
            \ is stale"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth:
        - people:employee:activation
      x-required-permissions:
      - people:employee:activation
  /v1/people/employees/{employeeId}/disable:
    post:
      tags:
      - Employee API
      summary: Disable Employee And Offboard Assignments
      description: |
        Disables an ACTIVE employee, setting status DISABLED with a fresh statusEffectiveAt, and applies the requested staffing-assignment offboarding policy.
        Use this tool for offboarding; do not use updateEmployee to force the status field, which skips offboarding, and do not use endStaffingAssignment, which ends a single assignment only.
        Preconditions: the employee must exist and be in ACTIVE status; ON_LEAVE or SUSPENDED employees are rejected, as are already DISABLED or TERMINATED ones.
        Required inputs: employeeId (UUID) path parameter; the body is optional, assignmentPolicy defaults to IMMEDIATE, and assignmentEndDate applies only with GRACE_PERIOD.
        Emits a PEOPLE_EMPLOYEE_DISABLE event and publishes a people.employee.updated fact; when the downstream assignment action fails, a retry is queued with a five-minute delay instead of failing the request.
        Returns 404 when the employee does not exist, and 409 when the employee is not currently ACTIVE (an already DISABLED, TERMINATED, ON_LEAVE, or SUSPENDED employee cannot be disabled again).
      operationId: disableEmployee
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Optional offboarding metadata controlling how the employee's
          staffing assignments are terminated; omitting it applies the IMMEDIATE policy.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisableEmployeeRequestDto"
            examples:
              Grace-period offboarding:
                description: Grace-period offboarding
                value:
                  disableReason: Voluntary resignation
                  assignmentPolicy: GRACE_PERIOD
                  assignmentEndDate: 2026-03-31
      responses:
        "200":
          description: Employee disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeProfileDto"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Employee is not currently ACTIVE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth:
        - people:employee:activation
      x-required-permissions:
      - people:employee:activation
  /v1/people/credentials/bulk-ingest:
    post:
      tags:
      - Person Credential Bulk Ingest API
      summary: Record People's Credentials in Bulk
      description: |
        Records many credentials at once, resolving each row's employee number to a person and its vendor code (sourceCode + sourceCredentialCode, such as ASE T4-BRAKES) to a registry skill through the cross-reference, or taking a Durion skillCode such as DOT-INSPECTOR directly.
        Use this tool when loading an HR feed's certifications or seeding an environment; read the registry at GET /v1/people/skills instead of guessing codes.
        Preconditions: each employee number must resolve to a person with an employee record, and each vendor code must be in the cross-reference — an unknown code rejects its row rather than becoming a skill nobody holds.
        Required inputs: jobId, and per record employeeNumber, issuer, issuedOn and either skillCode or sourceCode + sourceCredentialCode; expiresOn, proficiency (1-5) and evidenceRef are optional, and expiresOn may not precede issuedOn.
        Semantics: upsert by natural key (person, skill, issuer, issuedOn), so a re-send updates the expiry, proficiency and evidence, a renewal with a later issuedOn is a new row, and status is derived from the dates rather than taken from the row.
        With supersedeAbsent=true, each person in the batch has their credentials from this job's sourceSystem that the batch no longer lists marked SUPERSEDED — never deleted.
        Emits a PEOPLE_CREDENTIAL_BULK_INGEST event and a person-credential fact per row written.
        Returns 200 with a per-record result, where a refused row carries CREDENTIAL_EMPLOYEE_UNKNOWN or CREDENTIAL_INGEST_REJECTED with the reason.
      operationId: bulkIngestPersonCredentials
      requestBody:
        description: Credentials to record.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkIngestRequestPersonCredentialBulkIngestRecord"
            examples:
              HR certifications:
                description: HR certifications
                value:
                  jobId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a00
                  locationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a10
                  operatorId: seed-operator
                  records:
                  - employeeNumber: EMP-0006
                    sourceCode: ASE
                    sourceCredentialCode: T4-BRAKES
                    issuedOn: 2024-03-15
                    expiresOn: 2029-03-15
                    proficiency: 4
                  - employeeNumber: EMP-0008
                    skillCode: DOT-INSPECTOR
                    issuer: SHOP
                    issuedOn: 2025-01-10
                    expiresOn: 2027-01-10
        required: true
      responses:
        "200":
          description: Batch processed; inspect per-record results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkIngestResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      x-required-permissions:
      - people:employee:edit
  /v1/people/bulk-ingest:
    post:
      tags:
      - People Bulk Ingest API
      summary: Bulk Import Employee Records From Batch
      description: |
        Imports a batch of employee records, creating each one through the same path as createEmployee with status forced to ACTIVE.
        Use this tool for initial loads or migrations of many employees; use createEmployee instead for a single hire, since per-record failures here are reported in the response body rather than as an HTTP error.
        Preconditions: each record is checked under the STRICT duplicate policy, so an existing employee number, email, or phone fails that record.
        Required inputs: jobId (UUID), locationId (UUID), and records, each with firstName, lastName, employeeNumber, and hireDate as a YYYY-MM-DD string.
        Emits a PEOPLE_BULK_INGEST event, and each successfully created employee also publishes its identity upsert command and people.employee.updated fact.
        Returns 200 even when individual records fail: inspect each record's success flag and errorCode, which is PEOPLE_INGEST_FAILED with the reason for a record the service refused, or INTERNAL_ERROR with a correlationId to quote and no detail of its own for a record lost to a server-side fault. Returns 400 when the envelope itself is invalid or the records list is empty.
      operationId: createEmployeesBulk
      requestBody:
        description: "Bulk ingest envelope: a job-scoped batch of person records to\
          \ import as ACTIVE employees."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkIngestRequestPersonBulkIngestRecord"
            examples:
              Two-person batch:
                description: Two-person batch
                value:
                  jobId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  locationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
                  operatorId: user-jdoe
                  records:
                  - firstName: Jane
                    lastName: Smith
                    employeeNumber: EMP-0001
                    hireDate: 2026-01-15
                    primaryEmail: jane.smith@example.com
                  - firstName: John
                    lastName: Doe
                    employeeNumber: EMP-0002
                    hireDate: 2026-02-01
                    primaryPhone: +1-555-123-4567
        required: true
      responses:
        "200":
          description: Batch processed; inspect per-record results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkIngestResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth:
        - people:employee:create
      x-required-permissions:
      - people:employee:create
  /v1/people/{personId}/staffing/assignments:
    get:
      tags:
      - People - Staffing Assignments
      summary: List Staffing Assignments By Person Path
      description: |
        Lists every staffing assignment for the person given in the path, including ENDED ones; the data is identical to listStaffingAssignments.
        Use this tool when a path-style URL is preferred; use listStaffingAssignments instead for the query-parameter form, which returns the same rows.
        Preconditions: none beyond authentication; an unknown personId simply yields no rows.
        Required inputs: personId (UUID) path parameter; there is no request body.
        No events are emitted and no state changes; this is a read-only projection.
        Returns 200 with an empty list when the person has no assignments.
      operationId: listStaffingAssignmentsByPath
      parameters:
      - name: personId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: List of assignments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffingAssignmentResponse"
      security:
      - bearerAuth:
        - people:employee:view
      x-required-permissions:
      - people:employee:view
  /v1/people/{personId}/primary-location:
    get:
      tags:
      - People Availability API
      summary: Get Person Primary Location Assignment
      description: |
        Resolves a person's primary active location from their staffing assignments as of today.
        Use this tool for service-to-service location resolution by person id; use getMyPrimaryLocation instead for the authenticated caller.
        Preconditions: the person must have an ACTIVE staffing assignment flagged primary whose effective dates cover today.
        Required inputs: personId (UUID) path parameter; there is no request body.
        Emits a PEOPLE_PERSON_PRIMARY_LOCATION_GET audit event but changes no state; this is a read-only projection.
        Returns 404 when the person has no active assignment flagged as primary today.
      operationId: getPersonPrimaryLocation
      parameters:
      - name: personId
        in: path
        description: Person id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Primary location resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrimaryLocationResponse"
        "404":
          description: No primary location assignment found for the person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth:
        - people:employee:view
      x-required-permissions:
      - people:employee:view
  /v1/people/{personId}/locations:
    get:
      tags:
      - People Availability API
      summary: List Person Active Location Assignments
      description: |
        Lists a given person's staffing assignments that are active today, primary first.
        Use this tool when acting on another person by id; use listMyLocations instead for the authenticated caller, and listStaffingAssignments for full history including ended assignments.
        Preconditions: none beyond authentication; an unknown personId is not rejected.
        Required inputs: personId (UUID) path parameter; there is no request body.
        Emits a PEOPLE_PERSON_LOCATIONS_LIST audit event but changes no state; this is a read-only projection.
        Returns 200 with an empty list when the person has no assignment active today, including when the personId is unknown.
      operationId: listPersonLocations
      parameters:
      - name: personId
        in: path
        description: Person id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Active location assignments returned successfully.
          content:
            application/json:
              schema:
                type: array
