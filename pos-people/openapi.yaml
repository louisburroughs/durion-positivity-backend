          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "LOCATION_SCOPE_DENIED: the assignment's location is outside\
            \ the caller's location reach"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Location or person not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Overlapping assignment exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
