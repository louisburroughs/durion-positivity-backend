  /v1/people/staffing/assignments:
    get:
      description: 'Lists every staffing assignment for a person, including ENDED ones, across all locations and roles.

        Use this tool for assignment history and administration; use listPersonLocations instead when only the assignments active today are wanted.

        Preconditions: none beyond authentication; an unknown personId simply yields no rows.

        Required inputs: personId (UUID) as a query parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 with an empty list when the person has no assignments.

        '
      operationId: listStaffingAssignments
      parameters:
      - in: query
        name: personId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/StaffingAssignmentResponse'
                type: array
          description: List of assignments.
      security:
      - bearerAuth:
        - people:employee:view
      summary: List Staffing Assignments For A Person
      tags:
      - People - Staffing Assignments
      x-required-permissions:
      - people:employee:view
    post:
      description: 'Creates a staffing assignment linking a person to a location with a role, effective dates, and a primary flag.

        Use this tool when a person starts working at a location; do not use updateStaffingAssignment, which modifies an existing assignment by id.

        Preconditions: the person must hold an ACTIVE employee record here, the location must be active, and no assignment for the same person, location, and role may overlap the effective dates.

        Required inputs: personId (UUID), locationId (UUID), role, isPrimary, and effectiveFrom (yyyy-MM-dd); effectiveTo is optional and open-ended when null.

        Location scope: an assignment feeds the person''s location-scope claims, so locationId must lie within the caller''s own location reach when their people:employee:edit permission is location-scoped, or the request is refused with 403 LOCATION_SCOPE_DENIED (checked after the person and location are resolved, so a 404 precedes it).

        Emits a PEOPLE_STAFFING_ASSIGNMENT_CREATE event and publishes a staffing-assignment fact; a new primary demotes and ends any overlapping existing primary, and a person''s first active assignment is forced primary regardless of the flag.

        Returns 409 when an overlapping assignment exists for the person, location, and role, 404 when the person, employee record, or active location cannot be resolved, 400 when the person''s employee status is not ACTIVE, and 403 LOCATION_SCOPE_DENIED when locationId is outside the caller''s location reach.

        '
      operationId: createStaffingAssignment
      requestBody:
        content:
          application/json:
            examples:
              Primary technician assignment:
                description: Primary technician assignment
                value:
                  effectiveFrom: '2026-02-16'
                  isPrimary: true
                  locationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
                  personId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  role: TECHNICIAN
            schema:
              $ref: '#/components/schemas/CreateStaffingAssignmentRequest'
        description: Staffing assignment to create, binding one person to one location for a role over an effective date range.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffingAssignmentResponse'
          description: Assignment created.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Validation error.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'LOCATION_SCOPE_DENIED: the assignment''s location is outside the caller''s location reach'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Location or person not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Overlapping assignment exists.
      security:
      - bearerAuth:
        - people:employee:edit
      summary: Create Person To Location Staffing Assignment
      tags:
      - People - Staffing Assignments
      x-required-permissions:
      - people:employee:edit
  /v1/people/staffing/assignments/{assignmentId}:
    delete:
      description: 'Ends a staffing assignment by setting its status to ENDED without physically deleting the row.

        Use this tool when a person stops working at a location; do not use disableEmployee, which offboards the whole employee, and do not use updateStaffingAssignment to shorten dates manually.

        Preconditions: the assignment must exist; ending an already ENDED assignment is accepted and republishes the fact.

        Required inputs: assignmentId (UUID) path parameter; there is no request body.

        Location scope: when the caller''s people:employee:edit permission is location-scoped, the assignment''s location must lie within the caller''s reach, or the request is refused with 403 LOCATION_SCOPE_DENIED (checked after the assignment is found, so a 404 precedes it).

        Emits a PEOPLE_STAFFING_ASSIGNMENT_END event and publishes a staffing-assignment fact; a null effectiveTo is stamped with today''s date.

        Returns 204 on success, 404 when no assignment exists for the supplied id, and 403 LOCATION_SCOPE_DENIED when the assignment''s location is outside the caller''s location reach.

        '
      operationId: endStaffingAssignment
      parameters:
      - in: path
        name: assignmentId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: Assignment ended.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'LOCATION_SCOPE_DENIED: the assignment''s location is outside the caller''s location reach'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Assignment not found.
      security:
      - bearerAuth:
        - people:employee:edit
      summary: End An Active Staffing Assignment
      tags:
      - People - Staffing Assignments
      x-required-permissions:
      - people:employee:edit
    get:
      description: 'Returns a single staffing assignment by its unique assignment id.

        Use this tool when the assignment id is already known; use listStaffingAssignments instead to discover a person''s assignments.

        Preconditions: the assignment must exist; both ACTIVE and ENDED assignments are returned.

        Required inputs: assignmentId (UUID) path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 404 when no assignment exists for the supplied id.

        '
      operationId: getStaffingAssignment
      parameters:
      - in: path
        name: assignmentId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffingAssignmentResponse'
          description: Assignment found.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Assignment not found.
      security:
      - bearerAuth:
        - people:employee:view
      summary: Get Staffing Assignment By Id
      tags:
      - People - Staffing Assignments
      x-required-permissions:
      - people:employee:view
    put:
      description: 'Replaces a staffing assignment''s person, location, role, primary flag, and effective dates.

        Use this tool to correct or reshape an existing assignment; do not use endStaffingAssignment, which only closes an assignment, and do not use createStaffingAssignment for a new one.

        Preconditions: the assignment must exist, the person must exist with an ACTIVE employee record, the location must be active, and no other assignment for the same person, location, and role may overlap the effective dates.

        Required inputs: assignmentId (UUID) path parameter plus the full body (personId, locationId, role, isPrimary, effectiveFrom); this is a full replacement, not a patch.

        Location scope: when the caller''s people:employee:edit permission is location-scoped, both the assignment''s current location and the requested locationId must lie within the caller''s reach, or the request is refused with 403 LOCATION_SCOPE_DENIED (checked after the assignment is found, so a 404 precedes it).

        Emits a PEOPLE_STAFFING_ASSIGNMENT_UPDATE event and publishes a staffing-assignment fact; setting isPrimary true demotes and ends any other overlapping primary assignment.

        Returns 404 when the assignment, person, employee record, or active location cannot be resolved, 409 when another assignment overlaps for the person, location, and role, 400 when the person''s employee status is not ACTIVE, and 403 LOCATION_SCOPE_DENIED when the current or requested location is outside the caller''s location reach.

        '
      operationId: updateStaffingAssignment
      parameters:
      - in: path
        name: assignmentId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Extend assignment end date:
                description: Extend assignment end date
                value:
                  effectiveFrom: '2026-02-16'
                  effectiveTo: '2026-12-31'
                  isPrimary: true
                  locationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
                  personId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  role: TECHNICIAN
            schema:
              $ref: '#/components/schemas/UpdateStaffingAssignmentRequest'
        description: Full replacement values for the assignment's person, location, role, primary flag, and effective dates.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffingAssignmentResponse'
          description: Assignment updated.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Validation error.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'LOCATION_SCOPE_DENIED: the assignment''s location is outside the caller''s location reach'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Assignment not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Overlapping assignment exists.
      security:
      - bearerAuth:
        - people:employee:edit
      summary: Update An Existing Staffing Assignment
      tags:
      - People - Staffing Assignments
      x-required-permissions:
      - people:employee:edit
  /v1/people/staffing/bulk-ingest:
    post:
      description: 'Creates many staffing assignments at once, resolving each row''s employee number to a person.

        Use this tool when standing up a location''s roster or seeding an environment; use createStaffingAssignment instead for a single assignment.

        Preconditions: each employee number must resolve to a person with an ACTIVE employee record, each location must be active, and no assignment may overlap an existing one for the same person, location and role.

        Required inputs: jobId (UUID), locationId (UUID) and records, each with an employeeNumber and a role; a record''s own locationId overrides the batch one, and effectiveFrom defaults to today.

        Emits a PEOPLE_STAFFING_ASSIGNMENT_BULK_INGEST event and a staffing-assignment fact per row.

        Note two side effects that make this not simply additive: a new primary demotes and end-dates an overlapping existing primary, and a person''s first active assignment is forced primary whatever the flag says.

        Returns 200 with a per-record result; check each result rather than the status alone. A row the service refused carries errorCode STAFFING_ASSIGNMENT_INGEST_FAILED and the reason; a row lost to a server-side fault carries INTERNAL_ERROR and a correlationId to quote, with no detail of its own.

        '
      operationId: bulkIngestStaffingAssignments
      requestBody:
        content:
          application/json:
            examples:
              Location roster:
                description: Location roster
                value:
                  jobId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a00
                  locationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a10
                  operatorId: seed-operator
                  records:
                  - employeeNumber: EMP-0001
                    primary: true
                    role: LOCATION_MANAGER
                  - employeeNumber: EMP-0002
                    primary: true
                    role: TECHNICIAN
            schema:
              $ref: '#/components/schemas/BulkIngestRequestStaffingAssignmentBulkIngestRecord'
        description: Staffing assignments to create.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkIngestResponse'
          description: Batch processed; inspect per-record results
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request payload
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden
      security:
      - bearerAuth:
        - people:employee:edit
      summary: Assign People to Locations in Bulk
      tags:
      - Staffing Assignment Bulk Ingest API
      x-required-permissions:
      - people:employee:edit
  /v1/people/time-periods:
    post:
      description: 'Creates a pay period for a tenant with an inclusive start and end date and an initial lifecycle status.

        Use this tool for corrections and off-grid periods; do not create routine periods manually, the scheduled rollover opens those on the configured cadence instead.

        Preconditions: the range must not overlap any existing period for the tenant, and endDate must not be before startDate.

        Required inputs: a body with tenantId (UUID), startDate, and endDate; status is optional and defaults to OPEN.

        Emits PEOPLE_TIME_PERIOD_CREATE.

        Returns 400 when the range is invalid, and 409 when the range overlaps an existing period.

        '
      operationId: createTimePeriod
      requestBody:
        content:
          application/json:
            examples:
              Biweekly period:
                description: Biweekly period
                value:
                  endDate: '2026-06-14'
                  startDate: '2026-06-01'
                  tenantId: 01960000-0000-7000-8000-000000000001
            schema:
              $ref: '#/components/schemas/CreateTimePeriodRequest'
        description: Tenant, inclusive date range, and optional initial status of the new period.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimePeriodDto'
          description: Time period created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid date range
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Overlapping period exists
      security:
      - bearerAuth:
        - people:timePeriod:create
      summary: Create Pay Period
      tags:
      - Time Period Management API
      x-required-permissions:
      - people:timePeriod:create
  /v1/people/time-periods/{timePeriodId}/status:
    post:
      description: 'Moves a pay period to a new lifecycle status along the allowed transitions, including reopening a SUBMISSION_CLOSED period for corrections.

        Use this tool for manual corrections; do not drive routine closure with it, the scheduled rollover advances statuses on the configured cadence instead.

        Preconditions: allowed transitions are OPEN to SUBMISSION_CLOSED or PAYROLL_CLOSED, SUBMISSION_CLOSED to PAYROLL_CLOSED or back to OPEN; PAYROLL_CLOSED is terminal.

        Required inputs: timePeriodId (UUID) path parameter and a body with the target status.

        Emits PEOPLE_TIME_PERIOD_TRANSITION.

        Returns 404 when the period does not exist, and 409 when the transition is not allowed.

        '
      operationId: transitionTimePeriod
      parameters:
      - in: path
        name: timePeriodId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Close submissions:
                description: Close submissions
                value:
                  status: SUBMISSION_CLOSED
            schema:
              $ref: '#/components/schemas/TransitionTimePeriodRequest'
        description: Target lifecycle status for the period.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimePeriodDto'
          description: Time period transitioned
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Time period not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Transition not allowed
      security:
      - bearerAuth:
        - people:timePeriod:transition
      summary: Transition Pay Period Status
      tags:
      - Time Period Management API
      x-required-permissions:
      - people:timePeriod:transition
  /v1/people/timeEntries:
    get:
      description: 'Returns a page of attendance time entries — clock-in, clock-out and the break minutes inside that window — with each entry''s status and approval decision, oldest submission first.

        Use this tool to build the approvals queue or to find the timeEntryId an approve or reject call needs; do not use listWorkexecWorkSessions, which returns time a technician spent on a workorder task; a time entry is attendance only and carries no workorder reference, so this endpoint cannot answer how long a job took.

        Preconditions: none; a page with an empty items list is returned rather than an error when nothing matches.

        Required inputs: none are mandatory. status, workDate, employeeId and locationId each narrow the result and are unfiltered when omitted; workDate is a calendar day resolved in timeZone, which defaults to UTC; page defaults to 0 and size to 20 with a maximum of 100.

        Location scope: when locationId is given it must lie within the caller''s location reach, or the request is refused with 403 LOCATION_SCOPE_DENIED. When locationId is omitted and the caller''s people:timeEntry:view permission is location-scoped, the page is narrowed to the caller''s reach — their assigned locations and every location beneath them — rather than refused; a caller with no reach receives an empty page, and a caller whose permission is not location-scoped sees every location.

        Emits a PEOPLE_TIME_ENTRY_LIST audit event but changes no state.

        Returns 200 with the page envelope, 400 when timeZone is not a known zone id or the paging parameters are out of range, and 403 LOCATION_SCOPE_DENIED when locationId is outside the caller''s location reach.

        '
      operationId: listTimeEntries
      parameters:
      - description: Keep only entries in this status; omit for every status
        in: query
        name: status
        required: false
        schema:
          enum:
          - DRAFT
          - SUBMITTED
          - PENDING_APPROVAL
          - APPROVED
          - REJECTED
          type: string
      - description: Calendar day of the clock-in, resolved in timeZone
        example: '2026-01-15'
        in: query
        name: workDate
        required: false
        schema:
          format: date
          type: string
      - description: Zone whose calendar day workDate names; defaults to UTC
        example: America/Chicago
        in: query
        name: timeZone
        required: false
        schema:
          type: string
      - description: Keep only this person's entries
        in: query
        name: employeeId
        required: false
        schema:
          format: uuid
          type: string
      - description: Keep only entries clocked at this location; it must lie within the caller's location reach (403 LOCATION_SCOPE_DENIED otherwise). When omitted, a caller whose view permission is location-scoped sees only entries within their reach; an unscoped caller sees every location
        in: query
        name: locationId
        required: false
        schema:
          format: uuid
          type: string
      - description: Zero-based page index
        in: query
        name: page
        required: false
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
      - description: Page size, up to 100
        in: query
        name: size
        required: false
        schema:
          default: 20
          exclusiveMinimum: 0
          format: int32
          maximum: 100
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponseTimeEntrySummary'
          description: Time entries returned (possibly empty)
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid filter or paging parameter
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'LOCATION_SCOPE_DENIED: locationId is outside the caller''s location reach'
      security:
      - bearerAuth:
        - people:timeEntry:view
      summary: List Attendance Time Entries For Approval
      tags:
      - Time Entry Approval API
      x-required-permissions:
      - people:timeEntry:view
  /v1/people/timeEntries/adjustments:
    post:
      description: 'Creates a PENDING adjustment against a time entry, proposing either replacement start and end timestamps or a signed minutes delta.

        Use this tool when a recorded time entry needs correction before approval; do not use approveTimeEntryAdjustment, which decides an already proposed adjustment.

        Preconditions: the time entry must exist and be in PENDING_APPROVAL status; entries already approved or rejected cannot be adjusted.

        Required inputs: timeEntryId (UUID), reasonCode, and exactly one of the pair proposedStartAt plus proposedEndAt (ISO-8601 offset timestamps) or minutesDelta (positive adds, negative subtracts); notes and createdBy are optional.

        Emits a PEOPLE_TIME_ENTRY_ADJUSTMENT_CREATE event; the time entry itself is not modified until the adjustment is approved.

        Returns 404 when the time entry does not exist, 409 when the entry is not in PENDING_APPROVAL status, and 400 when reasonCode is missing or the proposed-times versus minutesDelta rule is violated.

        '
      operationId: createTimeEntryAdjustment
      requestBody:
        content:
          application/json:
            examples:
              Subtract a missed break:
                description: Subtract a missed break
                value:
                  minutesDelta: -30
                  notes: Employee forgot to log lunch break
                  reasonCode: MISSED_BREAK
                  timeEntryId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
            schema:
              $ref: '#/components/schemas/TimeEntryAdjustmentRequest'
        description: 'Proposed correction for one time entry: replacement start/end timestamps or a signed minutes delta, with a reason code.'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntryAdjustmentResponse'
          description: Adjustment created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Time entry not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid time entry state for adjustment
      security:
      - bearerAuth:
        - people:timeAdjustment:create
      summary: Create A Pending Time Entry Adjustment
      tags:
      - People TimeEntries
      x-required-permissions:
      - people:timeAdjustment:create
  /v1/people/timeEntries/adjustments/{adjustmentId}/approve:
    post:
      description: 'Approves a time entry adjustment, stamping the deciding user and decision time and writing an ADJUSTMENT_APPROVED audit row.

        Use this tool to accept a proposed correction; do not use approveTimeEntriesBatch, which approves the time entries themselves rather than adjustments.

        Preconditions: the adjustment must exist; no status gate is enforced, so re-approving an already decided adjustment overwrites the previous decision.

        Required inputs: adjustmentId (UUID) path parameter; an optional X-Correlation-Id header is carried into the audit trail.

        Emits a PEOPLE_TIME_ENTRY_ADJUSTMENT_APPROVE event; the underlying time entry''s own timestamps are not recalculated by this call.

        Returns 404 when no adjustment exists for the supplied id.

        '
      operationId: approveTimeEntryAdjustment
      parameters:
      - in: path
        name: adjustmentId
        required: true
        schema:
          format: uuid
          type: string
      - in: header
        name: X-Correlation-Id
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: Adjustment approved successfully
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden - insufficient permissions
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Adjustment not found
      security:
      - bearerAuth:
        - people:timeAdjustment:approve
      summary: Approve A Pending Time Entry Adjustment
      tags:
      - People TimeEntries
      x-required-permissions:
      - people:timeAdjustment:approve
  /v1/people/timeEntries/approve:
    post:
      description: 'Approves a batch of time entries, marking each SUBMITTED or PENDING_APPROVAL entry APPROVED and stamping the approver and approval time; pos-people is authoritative for approval execution.

        Use this tool for supervisor approval of individually selected time entries; do not use rejectTimeEntriesBatch, which rejects them, and do not use approveTimePeriod, which approves a whole pay period per person.

        Preconditions: each entry must exist and be in SUBMITTED or PENDING_APPROVAL status, and the caller needs the people:timeEntry:approve authority for individual entries to succeed.

        Required inputs: decisions, a non-empty list of objects each carrying timeEntryId (UUID string); an optional X-Correlation-Id header is recorded in the audit trail.

        Emits a PEOPLE_TIME_ENTRY_APPROVE event and writes an audit row per decision.

        Returns 200 with a per-entry result list (failure codes NOT_FOUND, ENTRY_NOT_PENDING, FORBIDDEN) rather than failing the whole batch, and 400 when the decisions list is missing or empty.

        '
      operationId: approveTimeEntriesBatch
      parameters:
      - in: header
        name: X-Correlation-Id
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Approve two entries:
                description: Approve two entries
                value:
                  decisions:
                  - timeEntryId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  - timeEntryId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
            schema:
              $ref: '#/components/schemas/TimeEntryDecisionBatchRequest'
        description: Batch of approval decisions, one element per time entry to approve; rejectionReason is ignored here.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: Time entries approved successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request - decisions required
      security:
      - bearerAuth:
        - people:timeEntry:approve
      summary: Batch Approve Submitted Time Entries
      tags:
      - Time Entry Approval API
      x-required-permissions:
      - people:timeEntry:approve
  /v1/people/timeEntries/reject:
    post:
      description: 'Rejects a batch of time entries, marking each SUBMITTED or PENDING_APPROVAL entry REJECTED with the supplied reason stored on the entry.

        Use this tool to send individually selected entries back with a reason; do not use approveTimeEntriesBatch, which approves them, and do not use rejectTimePeriod, which rejects a whole pay period per person.

        Preconditions: each entry must exist and be in SUBMITTED or PENDING_APPROVAL status, and the caller needs the people:timeEntry:reject authority for individual entries to succeed.

        Required inputs: decisions, a non-empty list where every element carries timeEntryId and a non-blank rejectionReason; one missing reason fails the entire request before any entry is touched.

        Emits a PEOPLE_TIME_ENTRY_REJECT event and writes an audit row per decision.

        Returns 200 with a per-entry result list (failure codes NOT_FOUND, ENTRY_NOT_PENDING, FORBIDDEN), and 400 when any decision lacks a rejectionReason.

        '
      operationId: rejectTimeEntriesBatch
      parameters:
      - in: header
        name: X-Correlation-Id
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Reject one entry:
                description: Reject one entry
                value:
                  decisions:
                  - rejectionReason: Incomplete work details
                    timeEntryId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
            schema:
              $ref: '#/components/schemas/TimeEntryDecisionBatchRequest'
        description: Batch of rejection decisions; every element must carry a non-blank rejectionReason.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: Time entries rejected successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request - rejectionReason required for all decisions
      security:
      - bearerAuth:
        - people:timeEntry:reject
      summary: Batch Reject Submitted Time Entries
      tags:
      - Time Entry Approval API
      x-required-permissions:
      - people:timeEntry:reject
  /v1/people/timeEntries/{timeEntryId}:
    get:
      description: 'Returns a single attendance time entry by id, with its clock-in, clock-out, break minutes, status and approval decision.

        Use this tool for the detail view opened from an approvals-queue row; do not use listTimeEntries, which pages over many entries, and do not use getTimeEntryAdjustments, which returns the proposed corrections attached to an entry rather than the entry itself.

        Preconditions: an entry must exist for the supplied timeEntryId.

        Required inputs: timeEntryId (UUID) path parameter; timeZone is optional and defaults to UTC, affecting only the derived workDate.

        Emits a PEOPLE_TIME_ENTRY_GET audit event but changes no state.

        Returns 404 when no entry has that id, and 400 when timeZone is not a known zone id.

        '
      operationId: getTimeEntry
      parameters:
      - in: path
        name: timeEntryId
        required: true
        schema:
          format: uuid
          type: string
      - description: Zone the derived workDate is resolved in; defaults to UTC
        in: query
        name: timeZone
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntrySummary'
          description: Time entry returned
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid timeZone
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Time entry not found
      security:
      - bearerAuth:
        - people:timeEntry:view
      summary: Get One Attendance Time Entry
      tags:
      - Time Entry Approval API
      x-required-permissions:
      - people:timeEntry:view
  /v1/people/timeEntries/{timeEntryId}/adjustments:
    get:
      description: 'Lists all adjustments recorded against one time entry, in any status.

        Use this tool to review an entry''s correction history; use createTimeEntryAdjustment instead to propose a new correction.

        Preconditions: none; an unknown timeEntryId simply yields no rows.

        Required inputs: timeEntryId (UUID) path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 with an empty list when the time entry has no adjustments.

        '
      operationId: listTimeEntryAdjustments
      parameters:
      - in: path
        name: timeEntryId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TimeEntryAdjustment'
                type: array
          description: List returned
      security:
      - bearerAuth:
        - people:timeAdjustment:view
      summary: List Adjustments For A Time Entry
      tags:
      - People TimeEntries
      x-required-permissions:
      - people:timeAdjustment:view
  /v1/people/timekeeping/approvals/people:
    get:
      description: 'Lists the distinct employees that have at least one timekeeping entry, with display name and employee number.

        Use this tool to build the person picker for pay-period approval; use listTimekeepingEntries instead for one person''s entries in a period.

        Preconditions: none; display names come from the person identity replica, which is eventually consistent.

        Required inputs: none; there are no parameters and no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 with an empty list when no timekeeping entries exist.

        '
      operationId: listTimekeepingApprovalPeople
      responses:
