components:
  schemas:
    UpdateStaffingAssignmentRequest:
      type: object
      description: Request to update a staffing assignment
      properties:
        personId:
          type: string
          format: uuid
          description: Person identifier
          example: 123e4567-e89b-12d3-a456-426614174000
        locationId:
          type: string
          format: uuid
          description: Location identifier
          example: 22222222-2222-2222-2222-222222222222
        role:
          type: string
          description: Assignment role
          example: TECHNICIAN
          minLength: 1
        effectiveFrom:
          type: string
          format: date
          description: Assignment effective start date
          example: 2026-02-16
        effectiveTo:
          type: string
          format: date
          description: Assignment effective end date
          example: 2026-12-31
        effectiveDateRangeValid:
          type: boolean
        isPrimary:
          type: boolean
          description: Whether this assignment is primary
          example: true
      required:
      - effectiveFrom
      - isPrimary
      - locationId
      - personId
      - role
    StaffingAssignmentResponse:
      type: object
      description: Staffing assignment response
      properties:
        assignmentId:
          type: string
          format: uuid
          description: Assignment identifier
          example: 33333333-3333-3333-3333-333333333333
        personId:
          type: string
          format: uuid
          description: Person identifier
          example: 123e4567-e89b-12d3-a456-426614174000
        locationId:
          type: string
          format: uuid
          description: Location identifier
          example: 22222222-2222-2222-2222-222222222222
        role:
          type: string
          description: Assignment role
          example: TECHNICIAN
        status:
          type: string
          description: Assignment lifecycle status
          enum:
          - ACTIVE
          - ENDED
          example: ACTIVE
        effectiveFrom:
          type: string
          format: date
          description: Assignment effective start date
          example: 2026-02-16
        effectiveTo:
          type: string
          format: date
          description: Assignment effective end date
          example: 2026-12-31
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp in UTC
          example: 2026-02-16 14:30:00+00:00
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp in UTC
          example: 2026-02-18 09:15:00+00:00
        createdBy:
          type: string
          description: Username that created the assignment
          example: manager.user
        isPrimary:
          type: boolean
          description: Whether this assignment is primary
          example: true
      required:
      - assignmentId
      - effectiveFrom
      - isPrimary
      - locationId
      - personId
      - role
      - status
    EmployeeAddressDto:
      type: object
      description: Postal address for an employee
      properties:
        line1:
          type: string
          description: First address line
          example: 123 Main St
        line2:
          type: string
          description: Second address line
          example: Suite 200
        city:
          type: string
          description: City
          example: Springfield
        region:
          type: string
          description: State, province, or region
          example: IL
        postalCode:
          type: string
          description: Postal or ZIP code
          example: '62704'
        country:
          type: string
          description: Country
          example: US
    EmployeeContactInfoDto:
      type: object
      description: Contact information for an employee
      properties:
        primaryEmail:
          type: string
          description: Primary email address
          example: jane.smith@example.com
        primaryPhone:
          type: string
          description: Primary phone number
          example: +1-555-123-4567
        secondaryEmail:
          type: string
          description: Secondary email address
          example: jane.alt@example.com
        secondaryPhone:
          type: string
          description: Secondary phone number
          example: +1-555-987-6543
        address:
          $ref: '#/components/schemas/EmployeeAddressDto'
        emergencyContact:
          $ref: '#/components/schemas/EmployeeEmergencyContactDto'
    EmployeeEmergencyContactDto:
      type: object
      description: Emergency contact details for an employee
      properties:
        name:
          type: string
          description: Name of the emergency contact
          example: John Smith
        relationship:
          type: string
          description: Relationship to the employee
          example: Spouse
        phone:
          type: string
          description: Phone number of the emergency contact
          example: +1-555-222-3333
        email:
          type: string
          description: Email address of the emergency contact
          example: john.smith@example.com
    UpdateEmployeeRequest:
      type: object
      description: Request to update an existing employee record
      properties:
        firstName:
          type: string
          description: First (given) name of the employee
          example: Jane
          minLength: 1
        lastName:
          type: string
          description: Last (family) name of the employee
          example: Smith
          minLength: 1
        preferredName:
          type: string
          description: Preferred name of the employee
          example: Jane
        employeeNumber:
          type: string
          description: Unique employee number
          example: EMP-0001
          minLength: 1
        status:
          type: string
          description: Employment status of the employee
          enum:
          - ACTIVE
          - ON_LEAVE
          - SUSPENDED
          - TERMINATED
          - DISABLED
          example: ACTIVE
        hireDate:
          type: string
          format: date
          description: Date the employee was hired
          example: 2026-01-15
        terminationDate:
          type: string
          format: date
          description: Date the employee was terminated, if applicable
          example: 2026-12-31
        contactInfo:
          $ref: '#/components/schemas/EmployeeContactInfoDto'
        duplicatePolicy:
          type: string
          description: Policy controlling how potential duplicate employee records are handled
          enum:
          - STRICT
          - BALANCED
          example: STRICT
      required:
      - employeeNumber
      - firstName
      - hireDate
      - lastName
      - status
    EmployeeProfileDto:
      type: object
      description: Employee profile returned by employee read and write operations
      properties:
        id:
          type: string
          format: uuid
          description: Employee identifier
          example: 01960011-0000-7000-8000-000000000001
        firstName:
          type: string
          description: First (given) name of the employee
          example: Jane
        lastName:
          type: string
          description: Last (family) name of the employee
          example: Smith
        preferredName:
          type: string
          description: Preferred name of the employee
          example: Jane
        employeeNumber:
          type: string
          description: Unique employee number
          example: EMP-0001
        status:
          type: string
          description: Employment status of the employee
          enum:
          - ACTIVE
          - ON_LEAVE
          - SUSPENDED
          - TERMINATED
          - DISABLED
          example: ACTIVE
        hireDate:
          type: string
          format: date
          description: Date the employee was hired
          example: 2026-01-15
        terminationDate:
          type: string
          format: date
          description: Date the employee was terminated, if applicable
          example: 2026-12-31
        contactInfo:
          $ref: '#/components/schemas/EmployeeContactInfoDto'
        statusEffectiveAt:
          type: string
          format: date-time
          description: Timestamp the current status became effective
          example: 2026-01-15 09:30:00+00:00
        createdAt:
          type: string
          format: date-time
          description: Timestamp the employee record was created
          example: 2026-01-15 09:30:00+00:00
        updatedAt:
          type: string
          format: date-time
          description: Timestamp the employee record was last updated
          example: 2026-02-01 14:05:00+00:00
        warnings:
          type: array
          description: Non-fatal warnings raised while resolving the profile
          example:
          - Potential duplicate employee number
          items:
            type: string
      required:
      - employeeNumber
      - firstName
      - hireDate
      - id
      - lastName
      - status
    WorkSessionSubmitRequest:
      type: object
      description: Work session submit request body
      properties:
        billableMinutes:
          type: integer
          format: int32
          description: Total billable minutes for the session
          example: 480
        breakMinutes:
          type: integer
          format: int32
          description: Total break minutes for the session
          example: 30
        submittedAt:
          type: string
          format: date-time
          description: Timestamp the session was submitted
          example: 2026-02-16 17:00:00+00:00
      required:
      - billableMinutes
      - breakMinutes
      - submittedAt
    WorkSessionDto:
      type: object
      description: Work session representing a tracked period of work for a person
      properties:
        sessionId:
          type: string
          format: uuid
          description: Work session identifier
          example: 01960011-0000-7000-8000-000000000001
        personId:
          type: string
          format: uuid
          description: Person the session belongs to
          example: 01960011-0000-7000-8000-000000000002
        status:
          type: string
          description: Lifecycle status of the session
          example: OPEN
        startedAt:
          type: string
          format: date-time
          description: Timestamp the session started
          example: 2026-02-16 08:00:00+00:00
        endedAt:
          type: string
          format: date-time
          description: Timestamp the session ended
          example: 2026-02-16 17:00:00+00:00
        billableMinutes:
          type: integer
          format: int32
          description: Total billable minutes for the session
          example: 480
        breakMinutes:
          type: integer
          format: int32
          description: Total break minutes for the session
          example: 30
        submittedAt:
          type: string
          format: date-time
          description: Timestamp the session was submitted
          example: 2026-02-16 17:05:00+00:00
      required:
      - personId
      - sessionId
      - status
    BreakDto:
      type: object
      description: Break taken within a work session
      properties:
        sessionId:
          type: string
          format: uuid
          description: Work session the break belongs to
          example: 01960011-0000-7000-8000-000000000001
        startedAt:
          type: string
          format: date-time
          description: Timestamp the break started
          example: 2026-02-16 12:00:00+00:00
        endedAt:
          type: string
          format: date-time
          description: Timestamp the break ended
          example: 2026-02-16 12:30:00+00:00
      required:
      - sessionId
      - startedAt
    WorkSessionRequest:
      type: object
      description: Work session start request body
      properties:
        personId:
          type: string
          format: uuid
          description: ID of the person
          example: 01960011-0000-7000-8000-000000000001
        actor:
          type: string
          description: Actor performing the action
          example: manager.user
      required:
      - personId
    RejectTimePeriodRequest:
      type: object
      description: Request to reject a time period approval
      properties:
        reason:
          type: string
          description: Reason the time period is being rejected
          example: Missing break entries for two shifts
          minLength: 1
      required:
      - reason
