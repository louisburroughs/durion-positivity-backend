openapi: 3.1.0
info:
  title: POS Human Resources Service API
  description: "Human Resources service for employee management, payroll, and benefits\
    \ administration"
  contact:
    name: Durion Team
    email: louis.burroughs@gmail.com
  version: v1
servers:
- url: http://localhost:8086
  description: Generated server url
tags:
- name: People - Staffing Assignments
  description: Person-to-location staffing assignment operations (CAP-119)
- name: People Reports API
  description: Reporting endpoints for people and attendance data
- name: Time Entry Approval API
  description: Approve/reject time entries (batch)
- name: People Availability API
  description: Operations for querying people availability
- name: Work Sessions API
  description: Operations for managing work sessions and breaks
- name: People API
  description: Operations related to people records
- name: People - TimeEntries
  description: Time entry adjustments and related APIs
- name: People TimeEntries
  description: Time entry adjustments and related APIs
- name: People - Exceptions
  description: Time entry exception APIs
- name: User-Person Linking API
  description: Link authentication users to person records
- name: Employee API
  description: Employee profile and offboarding operations
paths:
  /v1/people/{personId}:
    get:
      tags:
      - People API
      summary: Get person by ID
      description: Retrieve a person by their unique ID.
      operationId: getPersonById
      parameters:
      - name: personId
        in: path
        description: ID of the person to retrieve
        required: true
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        "200":
          description: Person found and returned.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Person"
        "404":
          description: Person not found.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Person"
    put:
      tags:
      - People API
      summary: Update an existing person
      description: Update the details of an existing person.
      operationId: updatePerson
      parameters:
      - name: personId
        in: path
        description: ID of the person to update
        required: true
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Person"
        required: true
      responses:
        "404":
          description: Person not found.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Person"
        "200":
          description: Person updated successfully.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Person"
    delete:
      tags:
      - People API
      summary: Delete a person
      description: Delete a person by their unique ID.
      operationId: deletePerson
      parameters:
      - name: personId
        in: path
        description: ID of the person to delete
        required: true
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        "404":
          description: Person not found.
        "204":
          description: Person deleted successfully.
  /v1/people/staffing/assignments/{assignmentId}:
    get:
      tags:
      - People - Staffing Assignments
      summary: Get assignment by ID
      operationId: getAssignment
      parameters:
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Assignment found.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StaffingAssignmentResponse"
        "404":
          description: Assignment not found.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StaffingAssignmentResponse"
    put:
      tags:
      - People - Staffing Assignments
      summary: Update staffing assignment
      operationId: updateAssignment
      parameters:
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStaffingAssignmentRequest"
        required: true
      responses:
        "409":
          description: Overlapping assignment exists.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StaffingAssignmentResponse"
        "200":
          description: Assignment updated.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StaffingAssignmentResponse"
        "400":
          description: Validation error.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StaffingAssignmentResponse"
        "404":
          description: Assignment not found.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StaffingAssignmentResponse"
    delete:
      tags:
      - People - Staffing Assignments
      summary: End (soft-delete) an assignment
      operationId: endAssignment
      parameters:
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Assignment ended.
        "404":
          description: Assignment not found.
  /v1/people/employees/{employeeId}:
    get:
      tags:
      - Employee API
      summary: Get employee profile
      operationId: getEmployee
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Employee not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmployeeProfileDto"
        "200":
          description: Employee found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmployeeProfileDto"
    put:
      tags:
      - Employee API
      summary: Update employee profile
      operationId: updateEmployee
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRequest"
        required: true
      responses:
        "404":
          description: Employee not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmployeeProfileDto"
        "422":
          description: Semantic validation failure
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmployeeProfileDto"
        "409":
          description: Duplicate employee
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmployeeProfileDto"
        "200":
          description: Employee updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmployeeProfileDto"
        "400":
          description: Invalid request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmployeeProfileDto"
  /v1/people:
    get:
      tags:
      - People API
      summary: Get all people
      description: Retrieve a list of all people.
      operationId: getAllPeople
      responses:
        "200":
          description: List of people returned successfully.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
    post:
      tags:
      - People API
      summary: Create a new person
      description: Add a new person to the system.
      operationId: createPerson
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Person"
        required: true
      responses:
        "201":
          description: Person created successfully.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Person"
  /v1/people/{personUuid}/access/assignments:
    get:
      tags:
      - person-access-controller
      summary: Get role assignments
      description: Retrieve role assignments for a person with optional history and
        date filtering
      operationId: getAssignments
      parameters:
      - name: personUuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: includeHistory
        in: query
        required: false
        schema:
          type: boolean
      - name: endDate
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: Assignments retrieved successfully
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserRoleDto"
    post:
      tags:
      - person-access-controller
      summary: Assign role to person
      description: Assign a role to a person with optional location scope and date
        range
      operationId: createAssignment
      parameters:
      - name: personUuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonRoleAssignmentRequest"
        required: true
      responses:
        "201":
          description: Role assignment created successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserRoleDto"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Person or role not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /v1/people/workSessions/{id}/breaks/stop:
    post:
      tags:
      - Work Sessions API
      summary: Stop work session break
      description: End a break within a work session.
      operationId: stopWorkSessionBreak
      parameters:
      - name: id
        in: path
        description: Work session ID
        required: true
        schema:
          type: string
          format: uuid
        example: 7b1f5a9d-0c2b-4c6d-9a5a-5f8e7c3a9b1c
      responses:
        "404":
          description: Work session or break not found.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BreakDto"
        "200":
          description: Break stopped successfully.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BreakDto"
  /v1/people/workSessions/{id}/breaks/start:
    post:
      tags:
      - Work Sessions API
      summary: Start work session break
      description: Start a break within an active work session.
      operationId: startWorkSessionBreak
      parameters:
      - name: id
        in: path
        description: Work session ID
        required: true
        schema:
          type: string
          format: uuid
        example: 7b1f5a9d-0c2b-4c6d-9a5a-5f8e7c3a9b1c
      responses:
        "404":
          description: Work session not found.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BreakDto"
        "200":
          description: Break started successfully.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BreakDto"
  /v1/people/workSessions/stop:
    post:
      tags:
      - Work Sessions API
      summary: Stop work session
      description: Stop an active work session.
      operationId: stopWorkSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkSessionRequest"
        required: true
      responses:
        "200":
          description: Work session stopped successfully.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WorkSessionDto"
  /v1/people/workSessions/start:
    post:
      tags:
      - Work Sessions API
      summary: Start work session
      description: Create/start a work session for a person.
      operationId: startWorkSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkSessionRequest"
        required: true
      responses:
        "200":
          description: Work session started successfully.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WorkSessionDto"
  /v1/people/users/link:
    post:
      tags:
      - User-Person Linking API
      summary: Link user to person
      description: Create a link between an authentication user and a person record
      operationId: linkUserToPerson
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkUserToPersonRequest"
        required: true
      responses:
        "201":
          description: Link created successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserPersonLinkResponse"
        "200":
          description: Link already exists and is returned
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserPersonLinkResponse"
        "404":
          description: Person not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserPersonLinkResponse"
        "409":
          description: User already linked to different person
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserPersonLinkResponse"
        "400":
          description: Invalid request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserPersonLinkResponse"
  /v1/people/user-links:
    post:
      tags:
      - User-Person Linking API
      summary: Create user-person link (admin)
      description: Create a link between an authentication user and a person record
      operationId: createUserPersonLink
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserLinkRequest"
        required: true
      responses:
        "201":
          description: Link created successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserPersonLinkResponse"
        "200":
          description: Link already exists and is returned
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserPersonLinkResponse"
        "404":
          description: Person not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserPersonLinkResponse"
        "409":
          description: User already linked to different person
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserPersonLinkResponse"
        "400":
          description: Invalid request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserPersonLinkResponse"
  /v1/people/timeEntries/reject:
    post:
      tags:
      - Time Entry Approval API
      summary: Batch reject time entries
      description: Reject multiple time entries. rejectionReason is required for each
        decision.
      operationId: rejectTimeEntries
      parameters:
      - name: X-User-Id
        in: header
        required: false
        schema:
          type: string
      - name: X-Permissions
        in: header
        required: false
        schema:
          type: string
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeEntryDecisionBatchRequest"
        required: true
      responses:
        "400":
          description: Invalid request - rejectionReason required for all decisions
          content:
            '*/*':
              schema: {}
        "200":
          description: Time entries rejected successfully
          content:
            '*/*':
              schema: {}
  /v1/people/timeEntries/approve:
    post:
      tags:
      - Time Entry Approval API
      summary: Batch approve time entries
      description: Approve multiple time entries. pos-people is authoritative for
        approval execution.
      operationId: approveTimeEntries
      parameters:
      - name: X-User-Id
        in: header
        required: false
        schema:
          type: string
      - name: X-Permissions
        in: header
        required: false
        schema:
          type: string
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeEntryDecisionBatchRequest"
        required: true
      responses:
        "200":
          description: Time entries approved successfully
          content:
            '*/*':
              schema: {}
        "400":
          description: Invalid request - decisions required
          content:
            '*/*':
              schema: {}
  /v1/people/timeEntries/adjustments:
    post:
      tags:
      - People TimeEntries
      summary: Create a time entry adjustment
      description: Submit a request to adjust a time entry. The adjustment will be
        in PENDING status until approved.
      operationId: createAdjustment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeEntryAdjustmentRequest"
        required: true
      responses:
        "409":
          description: Invalid time entry state for adjustment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntryAdjustmentResponse"
        "201":
          description: Adjustment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntryAdjustmentResponse"
        "404":
          description: Time entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntryAdjustmentResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntryAdjustmentResponse"
  /v1/people/timeEntries/adjustments/{adjustmentId}/approve:
    post:
      tags:
      - People TimeEntries
      summary: Approve a time entry adjustment
      description: Approve a pending time entry adjustment. Requires approval permissions.
      operationId: approveAdjustment
      parameters:
      - name: adjustmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Permissions
        in: header
        required: false
        schema:
          type: string
      - name: X-User-Id
        in: header
        required: false
        schema:
          type: string
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Adjustment approved successfully
          content:
            application/json:
              schema: {}
        "404":
          description: Adjustment not found
          content:
            application/json:
              schema: {}
        "403":
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema: {}
  /v1/people/staffing/assignments:
    get:
      tags:
      - People - Staffing Assignments
      summary: List assignments for person
      operationId: getAssignments_1
      parameters:
      - name: personId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: List of assignments.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffingAssignmentResponse"
    post:
      tags:
      - People - Staffing Assignments
      summary: Create staffing assignment
      description: "Link a person to a location with role, effective dates, and primary\
        \ flag."
      operationId: createAssignment_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffingAssignmentRequest"
        required: true
      responses:
        "409":
          description: Overlapping assignment exists.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StaffingAssignmentResponse"
        "201":
          description: Assignment created.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StaffingAssignmentResponse"
        "404":
          description: Location or person not found.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StaffingAssignmentResponse"
        "400":
          description: Validation error.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StaffingAssignmentResponse"
  /v1/people/resolve:
    post:
      tags:
      - People API
      summary: Resolve person
      description: Find best matching person by score or create a new person
      operationId: resolvePerson
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolvePersonRequest"
        required: true
      responses:
        "200":
          description: Person resolved successfully.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResolvePersonResponse"
  /v1/people/exceptions:
    get:
      tags:
      - People - Exceptions
      summary: "List exceptions, optional filter by employeeId"
      description: Retrieve all exceptions or filter by a specific employee ID.
      operationId: listByEmployee
      parameters:
      - name: employeeId
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: List returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeEntryException"
    post:
      tags:
      - People - Exceptions
      summary: Create a time entry exception
      description: Create a new time entry exception record with validation of required
        fields.
      operationId: createException
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeEntryExceptionRequest"
        required: true
      responses:
        "200":
          description: Exception created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntryExceptionResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntryExceptionResponse"
  /v1/people/exceptions/{exceptionId}/waive:
    post:
      tags:
      - People - Exceptions
      summary: Waive an exception
      description: Waive an exception with a reason. waiveReason is required.
      operationId: waiveException
      parameters:
      - name: exceptionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Id
        in: header
        required: false
        schema:
          type: string
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
        required: true
      responses:
        "200":
          description: Exception waived successfully
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid request - waiveReason is required
          content:
            application/json:
              schema: {}
        "404":
          description: Exception not found
          content:
            application/json:
              schema: {}
  /v1/people/exceptions/{exceptionId}/resolve:
    post:
      tags:
      - People - Exceptions
      summary: Resolve an exception
      description: Mark an exception as resolved with optional resolution notes.
      operationId: resolveException
      parameters:
      - name: exceptionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Id
        in: header
        required: false
        schema:
          type: string
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        "404":
          description: Exception not found
          content:
            application/json:
              schema: {}
        "200":
          description: Exception resolved successfully
          content:
            application/json:
              schema: {}
  /v1/people/exceptions/{exceptionId}/acknowledge:
    post:
      tags:
      - People - Exceptions
      summary: Acknowledge an exception
      description: Mark an exception as acknowledged by the specified actor.
      operationId: acknowledgeException
      parameters:
      - name: exceptionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-Id
        in: header
        required: false
        schema:
          type: string
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
  /v1/people/employees:
    post:
      tags:
      - Employee API
      summary: Create employee profile
      operationId: createEmployee
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeRequest"
        required: true
      responses:
        "201":
          description: Employee created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmployeeProfileDto"
        "422":
          description: Semantic validation failure
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmployeeProfileDto"
        "409":
          description: Duplicate employee
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmployeeProfileDto"
        "400":
          description: Invalid request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmployeeProfileDto"
  /v1/people/employees/{employeeId}/disable:
    post:
      tags:
      - Employee API
      summary: Disable employee profile
      operationId: disableEmployee
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisableEmployeeRequestDto"
      responses:
        "404":
          description: Employee not found
          content:
            '*/*':
