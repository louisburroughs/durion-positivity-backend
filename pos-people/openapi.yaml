          format: uuid
          description: Unique identifier for the adjustment
          example: 123e4567-e89b-12d3-a456-426614174000
          readOnly: true
        timeEntryId:
          type: string
          format: uuid
          description: Time entry identifier being adjusted
          example: 123e4567-e89b-12d3-a456-426614174000
        reasonCode:
          type: string
          description: Reason code for the adjustment
          example: MISSED_BREAK
        notes:
          type: string
          description: Additional notes explaining the adjustment
          example: Employee forgot to log lunch break
        proposedStartAt:
          type: string
          format: date-time
          description: Proposed new start timestamp
          example: 2026-02-17T08:00:00Z
        proposedEndAt:
          type: string
          format: date-time
          description: Proposed new end timestamp
          example: 2026-02-17T17:00:00Z
        minutesDelta:
          type: integer
          format: int32
          description: "Adjustment in minutes (positive to add time, negative to subtract)"
          example: -30
        status:
          type: string
          description: Current status of the adjustment
          enum:
          - PROPOSED
          - PENDING
          - APPROVED
          - REJECTED
          example: PENDING
        createdBy:
          type: string
          description: User who created the adjustment request
          example: employee-456
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the adjustment was created
          example: 2026-02-17T08:30:00Z
        decidedBy:
          type: string
          description: User who approved or rejected the adjustment
          example: manager-123
        decidedAt:
          type: string
          format: date-time
          description: Timestamp when the adjustment was approved or rejected
          example: 2026-02-17T09:15:00Z
      required:
      - reasonCode
      - status
      - timeEntryId
    SkillDto:
      type: object
      description: "A registry skill: a competence and the GVWR class range it certifies\
        \ work on"
      properties:
        skillId:
          type: string
          format: uuid
          description: Registry id
        code:
          type: string
          description: Durion skill code
          example: BRAKES-LIGHT
        name:
          type: string
          description: Display name
          example: Brakes (light duty)
        competenceCode:
          type: string
          description: The competence regardless of duty class
          example: BRAKES
        minGvwrClass:
          type: integer
          format: int32
          description: Lowest FHWA GVWR class covered (1-8)
          example: 1
        maxGvwrClass:
          type: integer
          format: int32
          description: Highest FHWA GVWR class covered (1-8)
          example: 3
        sourceCodes:
          type: array
          description: "Vendor codes that map onto this skill, as SOURCE:CODE"
          example:
          - ASE:A5-BRAKES
          items:
            type: string
      required:
      - code
      - competenceCode
      - maxGvwrClass
      - minGvwrClass
      - name
      - skillId
      - sourceCodes
    AttendanceDiscrepancyReportResponse:
      type: object
      description: Attendance vs job time discrepancy row
      properties:
        technicianId:
          type: string
          description: Technician identifier
          example: 123e4567-e89b-12d3-a456-426614174000
        technicianName:
          type: string
          description: Technician display name
          example: Jane Doe
        locationId:
          type: string
          description: Location identifier
          example: 22222222-2222-2222-2222-222222222222
        reportDate:
          type: string
          format: date
          description: Report local date
          example: 2026-02-16
        totalAttendanceHours:
          type: number
          format: double
          description: Total attendance time in decimal hours
          example: 8.0
        totalJobHours:
          type: number
          format: double
          description: Total approved job time in decimal hours
          example: 6.0
        discrepancyHours:
          type: number
          format: double
          description: Attendance minus job time in decimal hours
          example: 2.0
        thresholdApplied:
          type: integer
          format: int32
          description: Threshold in minutes used for this row
          example: 60
        isFlagged:
          type: boolean
          description: True when absolute discrepancy exceeds threshold
          example: true
      required:
      - discrepancyHours
      - isFlagged
      - locationId
      - reportDate
      - technicianId
      - technicianName
      - thresholdApplied
      - totalAttendanceHours
      - totalJobHours
    ApprovedTimeExportResponse:
      type: object
      description: Approved time row for accounting/payroll export orchestration
      properties:
        timeEntryId:
          type: string
          description: Time entry identifier
          example: 01960011-0000-7000-8000-000000000001
        employeeId:
          type: string
          description: Timekeeping employee identifier
          example: EMP-0001
        employeeName:
          type: string
          description: Employee display name
          example: Jane Smith
        locationId:
          type: string
          format: uuid
          description: Timekeeping location identifier
          example: 01960011-0000-7000-8000-000000000010
        locationName:
          type: string
          description: Location display name
          example: Downtown Service Center
        entryDate:
          type: string
          format: date
          description: Entry date (UTC)
          example: 2026-02-16
        hoursWorked:
          type: number
          description: Worked hours in decimal format
          example: 8.5
        approvedAt:
          type: string
          format: date-time
          description: Approval timestamp
          example: 2026-02-17T09:15:00Z
        approvedBy:
          type: string
          description: Approver reference
          example: manager.user
      required:
      - approvedAt
      - approvedBy
      - employeeId
      - employeeName
      - entryDate
      - hoursWorked
      - locationId
      - locationName
      - timeEntryId
    TimeEntryException:
      type: object
      description: Time entry exception representing a discrepancy or issue with time
        tracking
      properties:
        exceptionId:
          type: string
          format: uuid
          description: Unique identifier for the exception
          example: 123e4567-e89b-12d3-a456-426614174000
          readOnly: true
        employeeId:
          type: string
          description: Employee identifier associated with the exception
          example: EMP-001
        workDate:
          type: string
          format: date
          description: Work date when the exception occurred
          example: 2026-02-17
        exceptionCode:
          type: string
          description: Exception code identifying the type of exception
          example: MISSED_CLOCK_OUT
        severity:
          type: string
          description: Severity level of the exception
          enum:
          - WARNING
          - BLOCKING
          example: BLOCKING
        status:
          type: string
          description: Current status of the exception
          enum:
          - OPEN
          - ACKNOWLEDGED
          - RESOLVED
          - WAIVED
          example: OPEN
        timeEntryId:
          type: string
          description: Associated time entry identifier
          example: te-12345
        resolutionNotes:
          type: string
          description: Notes describing resolution or actions taken
          example: Manager manually adjusted time entry
        detectedAt:
          type: string
          format: date-time
          description: Timestamp when the exception was detected
          example: 2026-02-17T08:30:00Z
        resolvedBy:
          type: string
          description: User who resolved the exception
          example: manager-123
        resolvedAt:
          type: string
          format: date-time
          description: Timestamp when the exception was resolved
          example: 2026-02-17T09:15:00Z
      required:
      - employeeId
      - exceptionCode
      - severity
      - status
      - workDate
    EmployeeLocationDto:
      type: object
      description: The employee's primary staffing location
      properties:
        id:
          type: string
          format: uuid
          description: Location id
        name:
          type: string
          description: "Display name, from the location replica; null when the replica\
            \ has not caught up"
          example: Charlotte Main
      required:
      - id
    EmployeeRoleAssignmentDto:
      type: object
      description: One application-role assignment shown on the employee register
      properties:
        assignmentId:
          type: string
          format: uuid
          description: Role assignment id
        roleId:
          type: string
          format: uuid
          description: Assigned role id
        roleName:
          type: string
          description: Assigned role name
          example: SHOP_MANAGER
        roleLocationScope:
          type: string
          description: "The role's location scope: ALL (applies everywhere) or LOCATION\
            \ (particular locations)"
          example: ALL
        effectiveStartDate:
          type: string
          format: date-time
          description: When this assignment becomes or became effective
        effectiveEndDate:
          type:
          - string
          - "null"
          format: date-time
          description: Exclusive end of the effective window; null while open-ended
        revokedAt:
          type:
          - string
          - "null"
          format: date-time
          description: When the revocation was entered; null while the assignment
            stands
      required:
      - assignmentId
      - effectiveStartDate
      - roleId
      - roleLocationScope
      - roleName
    EmployeeSummaryDto:
      type: object
      description: "Employee row for search results; the fields below `active` are\
        \ populated only when requested via `include=` (and, for `contactInfo`, only\
        \ when the caller also holds `people:employee_pii:view`)"
      properties:
        employeeId:
          type: string
          format: uuid
          description: Employee record identifier
          example: 01960011-0000-7000-8000-000000000001
        personId:
          type: string
          format: uuid
          description: Stable person identifier the employee maps to
          example: 01960011-0000-7000-8000-000000000002
        employeeNumber:
          type: string
          description: Employee number
          example: EMP-0001
        firstName:
          type: string
          description: "First (given) name, from the identity replica; null when the\
            \ replica has not caught up"
          example: Jane
        lastName:
          type: string
          description: "Last (family) name, from the identity replica; null when the\
            \ replica has not caught up"
          example: Smith
        preferredName:
          type: string
          description: "Preferred name, from the identity replica"
          example: Janie
        status:
          type: string
          description: Employment status
          example: ACTIVE
        active:
          type: boolean
          description: True when the employee is in an ACTIVE employment status
          example: true
        username:
          type:
          - string
          - "null"
          description: "Login username, from the identity replica; null unless `include=USERNAME`\
            \ was requested or the person has no linked user account"
          example: jane.smith
        contactInfo:
          type: "null"
          $ref: "#/components/schemas/EmployeeContactInfoDto"
          description: "Email and phone only; null unless `include=CONTACT_INFO` was\
            \ requested AND the caller holds people:employee_pii:view (#1898) -- a\
            \ caller lacking that permission gets a 200 with this field simply absent,\
            \ never a 403"
        roleAssignments:
          type:
          - array
          - "null"
          description: "Active application-role assignments (DECISION-PEOPLE-026);\
            \ null unless `include=ROLE_ASSIGNMENTS` was requested, empty when requested\
            \ but the person holds none"
          items:
            $ref: "#/components/schemas/EmployeeRoleAssignmentDto"
        primaryLocation:
          type: "null"
          $ref: "#/components/schemas/EmployeeLocationDto"
          description: "The employee's single primary staffing location (DECISION-PEOPLE-004);\
            \ null unless `include=LOCATION` was requested, or when requested but\
            \ no active assignment is flagged primary"
        otherLocationCount:
          type:
          - integer
          - "null"
          format: int32
          description: "Count of the person's other active staffing assignments beyond\
            \ primaryLocation (\"Charlotte Main · +1 more\"); null unless `include=LOCATION`\
            \ was requested, 0 when requested but the person has no other active assignment"
          example: 1
        jobRole:
          type: "null"
          $ref: "#/components/schemas/EmployeeJobRoleDto"
          description: "The job role named on the employee profile (durion#2157);\
            \ null unless `include=JOB_ROLE` was requested, or when requested but\
            \ no job role is set"
        allowedActions:
          type:
          - array
          - "null"
          description: "Actions the calling user may take on this row (durion#2159);\
            \ null unless `include=ALLOWED_ACTIONS` was requested. Computed from the\
            \ caller's permissions and the row's status by EmployeeActionPolicy, the\
            \ single place this transition table lives -- see EmployeeProfileDto.allowedActions\
            \ for the full rendering-hint and location-scope caveats, which apply\
            \ identically here."
          example:
          - VIEW_PII
          - UPDATE
          - DISABLE
          items:
            type: string
            enum:
            - VIEW_PII
            - UPDATE
            - DISABLE
            - ENABLE
      required:
      - active
      - employeeId
      - personId
    PagedResponseEmployeeSummaryDto:
      type: object
      description: A page of results
      properties:
        items:
          type: array
          description: Items on this page
          items:
            $ref: "#/components/schemas/EmployeeSummaryDto"
        page:
          type: integer
          format: int32
          description: Zero-based page index
          example: 0
        size:
          type: integer
          format: int32
          description: Requested page size
          example: 20
        totalElements:
          type: integer
          format: int64
          description: Total matching items across all pages
          example: 42
        totalPages:
          type: integer
          format: int32
          description: Total number of pages
          example: 3
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
    EmployeeStatusCountsResponse:
      type: object
      description: "Employee status histogram over the q-filtered set, for the register's\
        \ stat tiles"
      properties:
        counts:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: "Employee count per status name (plus the UNKNOWN bucket for\
            \ a row with no status recorded), for the register's stat tiles. Computed\
            \ over the q-filtered set — the same `q` match searchEmployees applies,\
            \ before any status filter — so a tile for a status the caller has not\
            \ selected on searchEmployees still shows what selecting it would return,\
            \ and the counts always sum to the q-filtered total."
      required:
      - counts
    EmployeeIdentityDto:
      type: object
      description: Employee identity resolved from an employee number
      properties:
        employeeId:
          type: string
          format: uuid
          description: Employee record identifier
          example: 01960011-0000-7000-8000-000000000001
        personId:
          type: string
          format: uuid
          description: Stable person identifier the employee maps to
          example: 01960011-0000-7000-8000-000000000002
        employeeNumber:
          type: string
          description: Employee number
          example: EMP-0001
        status:
          type: string
          description: Employment status
          example: ACTIVE
        active:
          type: boolean
          description: True when the employee is in an ACTIVE employment status
          example: true
      required:
      - active
      - employeeId
      - employeeNumber
      - personId
      - status
    InactivePersonActiveUserResponse:
      type: object
      description: An active user-person link whose linked person is in an inactive
        status (ADR-0015 §4 violation)
      properties:
        linkId:
          type: string
          format: uuid
          description: User-person link identifier
          example: 01960012-0000-7000-8000-000000000001
        username:
          type: string
          description: Username of the security user account with the still-active
            link
          example: marcus.webb
        personId:
          type: string
          format: uuid
          description: Person identifier in an inactive status
          example: 01960011-0000-7000-8000-000000000001
        personStatus:
          type: string
          description: Inactive status of the linked person; absent when the employee
            row disappeared between the link query and the mapping step
          enum:
          - ACTIVE
          - ON_LEAVE
          - SUSPENDED
          - TERMINATED
          - DISABLED
          example: TERMINATED
        personStatusEffectiveAt:
          type: string
          format: date-time
          description: When the person's status last became effective
          example: 2026-01-15T09:30:00Z
      required:
      - linkId
      - personId
      - username
    PeopleAvailabilityResponse:
      type: object
      description: Availability of a person at a location for a given date based on
        staffing assignments
      properties:
        personId:
          type: string
          format: uuid
          description: Person identifier
          example: 01960011-0000-7000-8000-000000000001
        firstName:
          type: string
          description: First name of the person
          example: Jane
        lastName:
          type: string
          description: Last name of the person
          example: Smith
        locationId:
          type: string
          format: uuid
          description: Location identifier
          example: 01960011-0000-7000-8000-000000000010
        role:
          type: string
          description: Assignment role at the location
          example: TECHNICIAN
        primary:
          type: boolean
          description: Whether this is the person's primary assignment
          example: true
        assignmentStatus:
          type: string
          description: Lifecycle status of the assignment
          enum:
          - ACTIVE
          - ENDED
          example: ACTIVE
        effectiveFrom:
          type: string
          format: date
          description: Date the assignment becomes effective
          example: 2026-02-01
        effectiveTo:
          type: string
          format: date
          description: Date the assignment ends
          example: 2026-12-31
        availableOn:
          type: string
          format: date
          description: Date the availability was evaluated for
          example: 2026-02-16
        clockState:
          type: string
          description: "The person's current clock state: CLOCKED_IN (open work session,\
            \ no open break), ON_BREAK (open session with an open break) or CLOCKED_OUT\
            \ (no open session). Null when the caller may not see this person's clock\
            \ state: it is shown for the caller's own row, and for every row when\
            \ the caller holds people:timekeeping:view covering the location."
          enum:
          - CLOCKED_IN
          - ON_BREAK
          - CLOCKED_OUT
          example: CLOCKED_IN
        workSessionId:
          type: string
          format: uuid
          description: The open work session; non-null exactly when clockState is
            CLOCKED_IN or ON_BREAK. The break endpoints are keyed by this id.
          example: 01960011-0000-7000-8000-000000000002
        clockedInAt:
          type: string
          format: date-time
          description: When the open work session started; non-null exactly when workSessionId
            is
          example: 2026-02-16T08:00:00Z
        breakStartedAt:
          type: string
          format: date-time
          description: When the open break started; non-null exactly when clockState
            is ON_BREAK
          example: 2026-02-16T12:00:00Z
      required:
      - assignmentStatus
      - locationId
      - personId
      - primary
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
