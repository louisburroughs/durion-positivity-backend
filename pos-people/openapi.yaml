      description: "Generates a per-technician, per-location, per-day discrepancy\
        \ report based on attendance and approved job time totals."
      operationId: getAttendanceDiscrepancyReport
      parameters:
      - name: startDate
        in: query
        description: Start date (inclusive)
        required: true
        schema:
          type: string
          format: date
        example: 2026-02-01
      - name: endDate
        in: query
        description: End date (inclusive)
        required: true
        schema:
          type: string
          format: date
        example: 2026-02-07
      - name: timezone
        in: query
        description: IANA timezone
        required: true
        schema:
          type: string
        example: America/Chicago
      - name: locationId
        in: query
        description: Optional location filter
        required: false
        schema:
          type: string
          format: uuid
      - name: technicianIds
        in: query
