openapi: 3.1.0
info:
  title: POS Human Resources Service API
  description: "Human Resources service for employee management, payroll, and benefits\
    \ administration"
  contact:
    name: Durion Support Services
    email: louis.burroughs@gmail.com
  version: v1
servers:
- url: http://localhost:8086
  description: Generated server url
tags:
- name: People - Staffing Assignments
  description: Person-to-location staffing assignment operations (CAP-119)
- name: People Reports API
  description: Reporting endpoints for people and attendance data
- name: Skill Registry API
  description: Platform skill registry and vendor cross-references
- name: People Availability API
  description: Operations for querying people availability
- name: Work Sessions API
  description: Operations for managing work sessions and breaks
- name: Time Entry Approval API
  description: "List, approve and reject attendance time entries (clock-in, clock-out,\
    \ breaks)"
- name: Time Period Management API
  description: Pay-period lifecycle management for timekeeping approval
- name: Person Credential Bulk Ingest API
  description: Bulk import of the credentials people hold
- name: Job Role API
  description: The tenant's own job-role list (HR master data)
- name: People Compliance API
  description: Identity-compliance reports (ADR-0015 §4)
- name: Staffing Assignment Bulk Ingest API
  description: Bulk import person-to-location assignments
- name: Employee API
  description: Employee profile and offboarding operations
- name: Timekeeping Approval API
  description: Pay-period-based timekeeping approval operations
- name: People API
  description: Operations related to people records
- name: People TimeEntries
  description: Time entry adjustments and related APIs
- name: People - Exceptions
  description: Time entry exception APIs
- name: People Bulk Ingest API
  description: Bulk import employee records
- name: Person Credential API
  description: The credentials a person holds or held
paths:
  /v1/people/staffing/assignments/{assignmentId}:
    get:
      tags:
      - People - Staffing Assignments
      summary: Get Staffing Assignment By Id
      description: |
        Returns a single staffing assignment by its unique assignment id.
        Use this tool when the assignment id is already known; use listStaffingAssignments instead to discover a person's assignments.
        Preconditions: the assignment must exist; both ACTIVE and ENDED assignments are returned.
        Required inputs: assignmentId (UUID) path parameter; there is no request body.
        No events are emitted and no state changes; this is a read-only projection.
        Returns 404 when no assignment exists for the supplied id.
      operationId: getStaffingAssignment
      parameters:
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Assignment found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffingAssignmentResponse"
        "404":
          description: Assignment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth:
        - people:employee:view
      x-required-permissions:
      - people:employee:view
    put:
      tags:
      - People - Staffing Assignments
      summary: Update An Existing Staffing Assignment
      description: |
        Replaces a staffing assignment's person, location, role, primary flag, and effective dates.
        Use this tool to correct or reshape an existing assignment; do not use endStaffingAssignment, which only closes an assignment, and do not use createStaffingAssignment for a new one.
        Preconditions: the assignment must exist, the person must exist with an ACTIVE employee record, the location must be active, and no other assignment for the same person, location, and role may overlap the effective dates.
        Required inputs: assignmentId (UUID) path parameter plus the full body (personId, locationId, role, isPrimary, effectiveFrom); this is a full replacement, not a patch.
        Location scope: when the caller's people:employee:edit permission is location-scoped, both the assignment's current location and the requested locationId must lie within the caller's reach, or the request is refused with 403 LOCATION_SCOPE_DENIED (checked after the assignment is found, so a 404 precedes it).
        Emits a PEOPLE_STAFFING_ASSIGNMENT_UPDATE event and publishes a staffing-assignment fact; setting isPrimary true demotes and ends any other overlapping primary assignment.
        Returns 404 when the assignment, person, employee record, or active location cannot be resolved, 409 when another assignment overlaps for the person, location, and role, 400 when the person's employee status is not ACTIVE, and 403 LOCATION_SCOPE_DENIED when the current or requested location is outside the caller's location reach.
      operationId: updateStaffingAssignment
      parameters:
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: "Full replacement values for the assignment's person, location,\
          \ role, primary flag, and effective dates."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStaffingAssignmentRequest"
            examples:
              Extend assignment end date:
                description: Extend assignment end date
                value:
                  personId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  locationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
                  role: TECHNICIAN
                  isPrimary: true
                  effectiveFrom: 2026-02-16
                  effectiveTo: 2026-12-31
        required: true
      responses:
        "200":
          description: Assignment updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffingAssignmentResponse"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "LOCATION_SCOPE_DENIED: the assignment's location is outside\
            \ the caller's location reach"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Assignment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Overlapping assignment exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth:
        - people:employee:edit
      x-required-permissions:
      - people:employee:edit
    delete:
      tags:
      - People - Staffing Assignments
      summary: End An Active Staffing Assignment
      description: |
        Ends a staffing assignment by setting its status to ENDED without physically deleting the row.
        Use this tool when a person stops working at a location; do not use disableEmployee, which offboards the whole employee, and do not use updateStaffingAssignment to shorten dates manually.
        Preconditions: the assignment must exist; ending an already ENDED assignment is accepted and republishes the fact.
        Required inputs: assignmentId (UUID) path parameter; there is no request body.
        Location scope: when the caller's people:employee:edit permission is location-scoped, the assignment's location must lie within the caller's reach, or the request is refused with 403 LOCATION_SCOPE_DENIED (checked after the assignment is found, so a 404 precedes it).
        Emits a PEOPLE_STAFFING_ASSIGNMENT_END event and publishes a staffing-assignment fact; a null effectiveTo is stamped with today's date.
        Returns 204 on success, 404 when no assignment exists for the supplied id, and 403 LOCATION_SCOPE_DENIED when the assignment's location is outside the caller's location reach.
      operationId: endStaffingAssignment
      parameters:
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Assignment ended.
        "403":
          description: "LOCATION_SCOPE_DENIED: the assignment's location is outside\
            \ the caller's location reach"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Assignment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth:
        - people:employee:edit
      x-required-permissions:
      - people:employee:edit
  /v1/people/employees/{employeeId}:
    get:
      tags:
      - Employee API
      summary: Get Employee Profile By Person Id
      description: |
        Returns the full employee profile for a person id, merging identity fields from the pos-people-contact replica with local employment fields, including the contactInfo block: personal address, personal phone numbers, personal email and emergency contact.
        Use this tool when the person id is already known; use getEmployeeByNumber instead to resolve a human-entered employee number, and searchEmployees to list or pick an employee without their personal contact detail.
        Preconditions: the caller holds people:employee_pii:view, which is narrower than the people:employee:view held by the structural reads; an employee row or identity-replica row must exist for the id; identity fields may briefly be null right after creation while the replica catches up.
        Required inputs: employeeId (UUID) path parameter, which is the person id; there is no request body.
        Emits a PEOPLE_EMPLOYEE_GET audit event but changes no state; this is a read-only projection.
        Returns 403 when the caller does not hold people:employee_pii:view, and 404 when neither an employee record nor a person replica row exists for the id.
      operationId: getEmployee
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Employee found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeProfileDto"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth:
        - people:employee_pii:view
      x-required-permissions:
      - people:employee_pii:view
    put:
      tags:
      - Employee API
      summary: Update An Existing Employee Profile
      description: |
        Updates an existing employee profile by person id, replacing employment attributes locally and forwarding identity attributes to pos-people-contact as an upsert command.
        Use this tool when correcting or changing an existing employee's details; do not use createEmployee, which registers a new person, and do not use disableEmployee, which is the offboarding transition.
        Preconditions: an employee row or identity-replica row must exist for the supplied employeeId, which is the person id at this API surface.
        Required inputs: employeeId (UUID) path parameter plus the full profile (firstName, lastName, employeeNumber, status, hireDate); this is a full replacement, not a patch, and duplicatePolicy defaults to STRICT.
        Emits a PEOPLE_EMPLOYEE_UPDATE event and publishes a people.employee.updated fact; a status change also stamps statusEffectiveAt.
        Returns 404 when no employee or person exists for the id, 409 when another employee already uses the employee number, email, or phone under STRICT policy, and 422 when terminationDate is before hireDate.
      operationId: updateEmployee
      parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Full replacement employee profile; identity fields are re-sent
          to pos-people-contact as an upsert command.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRequest"
            examples:
              Status change to leave:
                description: Status change to leave
                value:
                  firstName: Jane
                  lastName: Smith
                  employeeNumber: EMP-0001
                  status: ON_LEAVE
                  hireDate: 2026-01-15
                  duplicatePolicy: BALANCED
        required: true
      responses:
        "200":
          description: Employee updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeProfileDto"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Duplicate employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Semantic validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth:
        - people:employee:edit
      x-required-permissions:
      - people:employee:edit
  /v1/people/workSessions/{id}/submit:
    post:
      tags:
      - Work Sessions API
      summary: Submit An Ended Work Session
      description: |
        Submits an ENDED work session for approval, recording billable and break minute totals and marking the session SUBMITTED.
        Use this tool after stopWorkSession has ended the session; do not use approveTimeEntriesBatch, which decides time entries, not work sessions.
        Preconditions: the session must exist and be in ENDED status; ACTIVE or already SUBMITTED sessions are rejected.
        Required inputs: the work session id (UUID) path parameter and a body with billableMinutes and breakMinutes (both zero or greater) and submittedAt (ISO-8601 instant).
        Authorization: the caller must be the session's person, or hold people:timekeeping:approve; when that grant is location-scoped it must cover one of the person's active assignment locations (403 FORBIDDEN otherwise, 403 LOCATION_SCOPE_DENIED when only the scope fails).
        Emits a PEOPLE_WORK_SESSION_SUBMIT event.
        Returns 404 when the session does not exist, and 409 when the session is not in ENDED status.
      operationId: submitWorkSession
      parameters:
      - name: id
        in: path
        description: Work session ID
        required: true
        schema:
          type: string
          format: uuid
        example: 7b1f5a9d-0c2b-4c6d-9a5a-5f8e7c3a9b1c
      requestBody:
        description: Billable and break minute totals plus the submission timestamp
          for the ended session.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkSessionSubmitRequest"
            examples:
              Full day with lunch break:
                description: Full day with lunch break
                value:
                  billableMinutes: 480
                  breakMinutes: 30
                  submittedAt: 2026-02-16T17:00:00Z
        required: true
      responses:
        "200":
          description: Work session submitted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkSessionDto"
        "404":
          description: Work session not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Work session is not in a submittable state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
      x-required-permissions:
      - AUTHENTICATED
  /v1/people/workSessions/{id}/breaks/stop:
    post:
      tags:
      - Work Sessions API
      summary: Stop The Open Work Session Break
      description: |
        Ends the open break on a work session, stamping the end time from the server clock.
        Use this tool when a person returns from a break; do not use stopWorkSession, which ends the session and auto-closes any open break itself.
        Preconditions: the session must have an open break with no recorded end time.
        Required inputs: the work session id (UUID) as the path parameter; there is no request body.
        Authorization: the caller must be the session's person, or hold people:timekeeping:approve; when that grant is location-scoped it must cover one of the person's active assignment locations (403 FORBIDDEN otherwise, 403 LOCATION_SCOPE_DENIED when only the scope fails).
        Emits a PEOPLE_WORK_SESSION_BREAK_STOP event.
        Returns 409 when no open break exists for the session, including when the session id itself is unknown.
      operationId: stopWorkSessionBreak
      parameters:
      - name: id
        in: path
        description: Work session ID
        required: true
        schema:
          type: string
          format: uuid
        example: 7b1f5a9d-0c2b-4c6d-9a5a-5f8e7c3a9b1c
      responses:
        "200":
          description: Break stopped successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakDto"
        "409":
          description: "No open break exists for the session, including when the session\
            \ id itself is unknown."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
      x-required-permissions:
      - AUTHENTICATED
  /v1/people/workSessions/{id}/breaks/start:
    post:
      tags:
      - Work Sessions API
      summary: Start A Break In Work Session
      description: |
        Starts a break inside an active work session, stamping the start time from the server clock.
        Use this tool when a person pauses work; do not use stopWorkSession, which ends the whole session rather than pausing it.
        Preconditions: the session must exist and still be open, and no break may already be open on it.
        Required inputs: the work session id (UUID) as the path parameter; there is no request body.
        Authorization: the caller must be the session's person, or hold people:timekeeping:approve; when that grant is location-scoped it must cover one of the person's active assignment locations (403 FORBIDDEN otherwise, 403 LOCATION_SCOPE_DENIED when only the scope fails).
        Emits a PEOPLE_WORK_SESSION_BREAK_START event.
        Returns 404 when no open session exists for the id, and 409 when a break is already open, including under concurrent break-start races.
      operationId: startWorkSessionBreak
      parameters:
      - name: id
        in: path
        description: Work session ID
        required: true
        schema:
          type: string
          format: uuid
        example: 7b1f5a9d-0c2b-4c6d-9a5a-5f8e7c3a9b1c
      responses:
        "200":
          description: Break started successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakDto"
        "404":
          description: Work session not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
      x-required-permissions:
      - AUTHENTICATED
  /v1/people/workSessions/stop:
    post:
      tags:
      - Work Sessions API
      summary: Stop An Active Work Session
      description: |
        Stops a person's open work session, setting status ENDED and closing any break still open at the same timestamp.
        Use this tool when a person clocks out; do not use submitWorkSession, which sends an already ENDED session for approval.
        Preconditions: the person must have an open session; sessions are keyed by person here, not by session id.
        Required inputs: personId (UUID) in the body; the body's actor field is ignored in favour of the authenticated username.
        Authorization: the caller must be the person themself, or hold people:timekeeping:approve; when that grant is location-scoped it must cover one of the person's active assignment locations (403 FORBIDDEN otherwise, 403 LOCATION_SCOPE_DENIED when only the scope fails).
        Emits a PEOPLE_WORK_SESSION_STOP event.
        Returns 404 when no active session exists for the person.
      operationId: stopWorkSession
      requestBody:
        description: "Identifies the person clocking out; the open session is found\
          \ by person id, not session id."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkSessionRequest"
            examples:
              Clock out:
                description: Clock out
                value:
                  personId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
        required: true
      responses:
        "200":
          description: Work session stopped successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkSessionDto"
      security:
      - bearerAuth: []
      x-required-permissions:
      - AUTHENTICATED
  /v1/people/workSessions/start:
    post:
      tags:
      - Work Sessions API
      summary: Start A Work Session For Person
      description: |
        Starts a new ACTIVE work session for a person, stamping the start time from the server clock and the actor from the security context.
        Use this tool when a person clocks in for the day; do not use startWorkSessionBreak, which pauses an already running session.
        Preconditions: the person must exist in the identity replica, and the person must have no session that is still open.
        Required inputs: personId (UUID) in the body; the body's actor field is ignored, because the recorded actor is always the authenticated username.
        Authorization: the caller must be the person themself, or hold people:timekeeping:approve; when that grant is location-scoped it must cover one of the person's active assignment locations (403 FORBIDDEN otherwise, 403 LOCATION_SCOPE_DENIED when only the scope fails).
        Emits a PEOPLE_WORK_SESSION_START event.
        Returns 404 when the person is unknown, and 409 when an active session already exists for the person, including under concurrent start races.
      operationId: startWorkSession
      requestBody:
        description: Identifies the person clocking in; the actor field is ignored
          in favour of the authenticated username.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkSessionRequest"
            examples:
              Clock in:
                description: Clock in
                value:
                  personId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
        required: true
      responses:
        "200":
          description: Work session started successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkSessionDto"
      security:
      - bearerAuth: []
      x-required-permissions:
      - AUTHENTICATED
  /v1/people/timekeeping/time-periods/{timePeriodId}/people/{personId}/reject:
    post:
      tags:
      - Timekeeping Approval API
      summary: Reject All Pending Entries In Period
      description: |
        Bulk-rejects every PENDING_APPROVAL timekeeping entry for a person within a pay period, storing the reason on each entry as its correctionReason.
        Use this tool to send a whole period back for correction; do not use rejectTimeEntriesBatch, which rejects individually selected time entries.
        Preconditions: the time period must exist; only entries currently in PENDING_APPROVAL are touched.
        Required inputs: timePeriodId (UUID) and personId (UUID) path parameters and a body with a non-blank reason.
        No events are emitted; entries are flipped to REJECTED in place and the response reports the processed count.
        Returns 400 when reason is blank, and 404 when the time period does not exist.
      operationId: rejectTimePeriod
      parameters:
      - name: timePeriodId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: personId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Rejection justification applied as the correctionReason on every
          pending entry in the period.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectTimePeriodRequest"
            examples:
              Missing breaks:
                description: Missing breaks
                value:
                  reason: Missing break entries for two shifts
        required: true
      responses:
        "200":
          description: Entries rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimePeriodDecisionResponse"
        "400":
          description: Reason is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Time period not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth:
        - people:timekeeping:reject
      x-required-permissions:
      - people:timekeeping:reject
  /v1/people/timekeeping/time-periods/{timePeriodId}/people/{personId}/approve:
    post:
      tags:
      - Timekeeping Approval API
      summary: Approve All Pending Entries In Period
      description: |
        Bulk-approves every PENDING_APPROVAL timekeeping entry for a person within a pay period's date range.
        Use this tool for pay-period sign-off; do not use approveTimeEntriesBatch, which decides individually selected time entries instead of a whole period.
        Preconditions: the time period must exist; only entries currently in PENDING_APPROVAL are touched, so already decided entries are left as they are.
        Required inputs: timePeriodId (UUID) and personId (UUID) path parameters; there is no request body.
        No events are emitted; entries are flipped to APPROVED in place and the response reports the processed count.
        Returns 200 with processedCount 0 when nothing was pending, and 404 when the time period does not exist.
      operationId: approveTimePeriod
      parameters:
      - name: timePeriodId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: personId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Entries approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimePeriodDecisionResponse"
        "404":
          description: Time period not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth:
        - people:timekeeping:approve
      x-required-permissions:
      - people:timekeeping:approve
  /v1/people/timeEntries/reject:
    post:
      tags:
      - Time Entry Approval API
      summary: Batch Reject Submitted Time Entries
      description: |
        Rejects a batch of time entries, marking each SUBMITTED or PENDING_APPROVAL entry REJECTED with the supplied reason stored on the entry.
        Use this tool to send individually selected entries back with a reason; do not use approveTimeEntriesBatch, which approves them, and do not use rejectTimePeriod, which rejects a whole pay period per person.
        Preconditions: each entry must exist and be in SUBMITTED or PENDING_APPROVAL status, and the caller needs the people:timeEntry:reject authority for individual entries to succeed.
        Required inputs: decisions, a non-empty list where every element carries timeEntryId and a non-blank rejectionReason; one missing reason fails the entire request before any entry is touched.
        Emits a PEOPLE_TIME_ENTRY_REJECT event and writes an audit row per decision.
        Returns 200 with a per-entry result list (failure codes NOT_FOUND, ENTRY_NOT_PENDING, FORBIDDEN), and 400 when any decision lacks a rejectionReason.
      operationId: rejectTimeEntriesBatch
      parameters:
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          type: string
      requestBody:
        description: Batch of rejection decisions; every element must carry a non-blank
          rejectionReason.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeEntryDecisionBatchRequest"
            examples:
              Reject one entry:
                description: Reject one entry
                value:
                  decisions:
                  - timeEntryId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                    rejectionReason: Incomplete work details
        required: true
      responses:
        "200":
          description: Time entries rejected successfully
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Invalid request - rejectionReason required for all decisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth:
        - people:timeEntry:reject
      x-required-permissions:
      - people:timeEntry:reject
