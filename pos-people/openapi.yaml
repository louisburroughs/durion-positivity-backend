      tags:
      - People Availability API
      x-required-permissions:
      - people:self:view
  /v1/people/me/primary-location:
    get:
      description: 'Resolves the authenticated caller''s primary active location from their staffing assignments as of today, defaulting to the platform''s top-level location when none is assigned.

        Use this tool when a UI or service needs the current user''s home location; use listMyLocations instead to see every active assignment, and getPersonPrimaryLocation for a different person.

        Preconditions: the people:self:view permission; callers without a person link or a primary assignment receive the top-level default location with defaulted=true.

        Required inputs: none; identity comes from the bearer token and there are no parameters.

        Emits a PEOPLE_PRIMARY_LOCATION_GET audit event but changes no state; this is a read-only projection.

        Returns 404 only when the caller has no primary assignment AND no top-level default location could be resolved from the location replica.

        '
      operationId: getMyPrimaryLocation
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrimaryLocationResponse'
          description: Primary location resolved successfully.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No primary location assignment found and no top-level default location available.
      security:
      - bearerAuth:
        - people:self:view
      summary: Get Current User Primary Location
      tags:
      - People Availability API
      x-required-permissions:
      - people:self:view
  /v1/people/reports/approvedTime:
    get:
      description: 'Returns APPROVED time-entry rows with worked hours, approval metadata, and resolved employee and location names for a date range and one or more locations.

        Use this tool as the stable source-data read for accounting time-export workflows; use getAttendanceDiscrepancyReport instead for variance analysis between attendance and job time.

        Preconditions: every supplied locationId must resolve to an active location; rows missing approval or attendance timestamps are silently excluded.

        Required inputs: startDate and endDate (inclusive, yyyy-MM-dd, evaluated in UTC) and one or more locationId query parameters.

        Location scope: every locationId must lie within the caller''s location reach, or the request is refused with 403 LOCATION_SCOPE_DENIED; a caller whose accounting:time:export permission is not location-scoped is unaffected.

        Emits a PEOPLE_TIME_APPROVED_EXPORT_READ audit event but changes no state; this is a read-only projection sorted by entry date then time entry id.

        Returns 400 when endDate is before startDate, when no locationId is supplied, or when a locationId is unknown or inactive, and 403 LOCATION_SCOPE_DENIED when any locationId is outside the caller''s location reach.

        '
      operationId: listApprovedTimeForExport
      parameters:
      - description: Start date (inclusive)
        example: '2026-02-01'
        in: query
        name: startDate
        required: true
        schema:
          format: date
          type: string
      - description: End date (inclusive)
        example: '2026-02-07'
        in: query
        name: endDate
        required: true
        schema:
          format: date
          type: string
      - description: One or more location IDs; each must lie within the caller's location reach (403 LOCATION_SCOPE_DENIED otherwise)
        in: query
        name: locationId
        required: true
        schema:
          items:
            format: uuid
            type: string
          type: array
      - in: header
        name: X-Correlation-Id
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ApprovedTimeExportResponse'
                type: array
          description: Approved time rows retrieved successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid parameters
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'Caller lacks accounting:time:export (ApiError.code FORBIDDEN), or LOCATION_SCOPE_DENIED: a locationId is outside the caller''s location reach'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unexpected server error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Dependent service unavailable
      security:
      - bearerAuth:
        - accounting:time:export
      summary: List Approved Time For Accounting Export
      tags:
      - People Reports API
      x-required-permissions:
      - accounting:time:export
  /v1/people/reports/attendanceJobtimeDiscrepancy:
    get:
      description: 'Generates a per-technician, per-location, per-day report comparing attendance minutes from time entries with job minutes from the workorder job-time replica.

        Use this tool to spot technicians whose clocked attendance diverges from booked job time; use listApprovedTimeForExport instead for the raw approved rows consumed by accounting export.

        Preconditions: attendance comes from local time entries and job minutes from the ext_workorder_job_time replica, so very recent workorder activity may not be reflected yet.

        Required inputs: startDate and endDate (inclusive, yyyy-MM-dd) and timezone (IANA, used to bucket minutes into local days); locationId and technicianIds are optional filters, and flaggedOnly defaults to false.

        Location scope: when locationId is given it must lie within the caller''s location reach, or the request is refused with 403 LOCATION_SCOPE_DENIED. When locationId is omitted and the caller''s accounting:time:export permission is location-scoped, the report is narrowed to the caller''s reach — their assigned locations and every location beneath them — rather than refused; a caller with no reach receives an empty report, and a caller whose permission is not location-scoped sees every location.

        Emits a REPORT_ATTENDANCE_VS_JOBTIME_GENERATED audit event but changes no state; rows are flagged when the absolute discrepancy exceeds the location''s configured threshold minutes.

        Returns 400 when endDate is before startDate or timezone is not a valid IANA zone, and 403 LOCATION_SCOPE_DENIED when locationId is outside the caller''s location reach.

        '
      operationId: getAttendanceDiscrepancyReport
      parameters:
      - description: Start date (inclusive)
        example: '2026-02-01'
        in: query
        name: startDate
        required: true
        schema:
          format: date
          type: string
      - description: End date (inclusive)
        example: '2026-02-07'
        in: query
        name: endDate
        required: true
        schema:
          format: date
          type: string
      - description: IANA timezone
        example: America/Chicago
        in: query
        name: timezone
        required: true
        schema:
          type: string
      - description: Optional location filter; it must lie within the caller's location reach (403 LOCATION_SCOPE_DENIED otherwise). When omitted, a caller whose export permission is location-scoped sees only rows within their reach; an unscoped caller sees every location
        in: query
        name: locationId
        required: false
        schema:
          format: uuid
          type: string
      - description: Optional technician IDs filter
        in: query
        name: technicianIds
        required: false
        schema:
          items:
            format: uuid
            type: string
          type: array
      - description: Return flagged rows only
        in: query
        name: flaggedOnly
        required: false
        schema:
          default: false
          type: boolean
      - in: header
        name: X-Correlation-Id
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AttendanceDiscrepancyReportResponse'
                type: array
          description: Report generated successfully.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid parameters
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'Caller lacks accounting:time:export (ApiError.code FORBIDDEN), or LOCATION_SCOPE_DENIED: locationId is outside the caller''s location reach'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unexpected server error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Dependent service unavailable
      security:
      - bearerAuth:
        - accounting:time:export
      summary: Get Attendance Versus Job Time Discrepancy Report
      tags:
      - People Reports API
      x-required-permissions:
      - accounting:time:export
