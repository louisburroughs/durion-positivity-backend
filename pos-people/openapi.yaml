                  $ref: "#/components/schemas/StaffingAssignmentResponse"
      security:
      - bearerAuth:
        - people:employee:view
      x-required-permissions:
      - people:employee:view
  /v1/people/{personId}/credentials:
    get:
      tags:
      - Person Credential API
      summary: List a Person's Credentials
      description: |
        Returns every credential the person holds or held, newest issue first, each with the registry skill it certifies and its status as of today: ACTIVE or EXPIRED from the dates, REVOKED or SUPERSEDED when set deliberately. A renewal appears as its own row beside the one it renewed, so a past date's qualification stays visible.
        Use this tool to see what a technician is certified to do, or to audit an inspector's qualification on a past date; for a shop's roster use shop management's technician roster instead, which reads a replica of the same credentials.
        Preconditions: the caller holds people:employee:view.
        Required inputs: personId (UUID) as a path parameter; there is no request body.
        No events are emitted and no state changes; this is a read-only projection.
        Returns 200 with the list, empty when the person holds none, and 403 without the authority.
      operationId: listPersonCredentials
      parameters:
      - name: personId
        in: path
        description: Person id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The person's credentials.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonCredentialResponse"
      security:
      - bearerAuth:
        - people:employee:view
      x-required-permissions:
      - people:employee:view
  /v1/people/workSessions/current:
    get:
      tags:
      - Work Sessions API
      summary: Get A Person's Current Work-Session (Clock) State
      description: |
        Reads a person's current clock state — CLOCKED_IN, ON_BREAK or CLOCKED_OUT — with the open session id, its start time and the open break's start time when there is one. Derived on read from the open work session and break; nothing is created, closed or changed.
        Use this tool to render a clock-in/out toggle for one person, for example after a toggle press or on a self-service view; use listPeopleAvailability instead to read the clock state of everyone at a location in one call, which is what a dispatch board needs.
        Preconditions: the person must exist in the identity replica.
        Required inputs: none are mandatory; personId (UUID) as a query parameter defaults to the caller's own linked person when omitted.
        Authorization: a person reads their own state with people:self:view; reading another person's state needs people:timekeeping:view, and when that grant is location-scoped it must cover one of the person's active assignment locations.
        Emits a PEOPLE_WORK_SESSION_CURRENT_GET audit event but changes no state.
        Returns 200 with clockState CLOCKED_OUT and null session fields when nothing is open — never 404 for that; 404 PERSON_NOT_FOUND when the person is unknown, 404 when personId is omitted and the caller has no linked person, 403 FORBIDDEN when the caller is neither the person nor a people:timekeeping:view holder, and 403 LOCATION_SCOPE_DENIED when the caller's grant does not cover the person's location.
      operationId: getCurrentWorkSession
      parameters:
      - name: personId
        in: query
        description: Person whose clock state to read. Defaults to the caller's own
          linked person when omitted.
        required: false
        schema:
          type: string
          format: uuid
        example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
      responses:
        "200":
          description: Current clock state returned; CLOCKED_OUT when nothing is open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkSessionClockStateResponse"
        "403":
          description: "Caller is neither the person nor a people:timekeeping:view\
            \ holder (ApiError.code FORBIDDEN), or their grant does not cover the\
            \ person's location (LOCATION_SCOPE_DENIED)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "Person not found, or personId omitted and the caller has no\
            \ linked person."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
      x-required-permissions:
      - people:self:view
      - people:timekeeping:view
  /v1/people/timekeeping/timekeeping-entries:
    get:
      tags:
      - Timekeeping Approval API
      summary: List Timekeeping Entries For Person And Period
      description: |
        Lists a person's timekeeping entries whose sessions fall entirely within the given pay period's date range, evaluated in UTC.
        Use this tool to review entries before deciding a period; use getTimePeriodApproval instead for just the status counts.
        Preconditions: the time period must exist; sessions straddling the period boundary are excluded because both start and end must fall inside it.
        Required inputs: personId (UUID) and timePeriodId (UUID) query parameters; there is no request body.
        No events are emitted and no state changes; this is a read-only projection.
        Returns 404 when the time period does not exist.
      operationId: listTimekeepingEntries
      parameters:
      - name: personId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: timePeriodId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: List of timekeeping entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimekeepingEntryDto"
        "404":
          description: Time period not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth:
        - people:timekeeping:view
      x-required-permissions:
      - people:timekeeping:view
  /v1/people/timekeeping/time-periods:
