        to a time entry
      properties:
        adjustmentId:
          type: string
          format: uuid
          description: Unique identifier for the adjustment
          example: 123e4567-e89b-12d3-a456-426614174000
          readOnly: true
        timeEntryId:
          type: string
          format: uuid
          description: Time entry identifier being adjusted
          example: 123e4567-e89b-12d3-a456-426614174000
        reasonCode:
          type: string
          description: Reason code for the adjustment
          example: MISSED_BREAK
        notes:
          type: string
          description: Additional notes explaining the adjustment
          example: Employee forgot to log lunch break
        proposedStartAt:
          type: string
          format: date-time
          description: Proposed new start timestamp
          example: 2026-02-17T08:00:00Z
        proposedEndAt:
          type: string
          format: date-time
          description: Proposed new end timestamp
          example: 2026-02-17T17:00:00Z
        minutesDelta:
          type: integer
          format: int32
          description: "Adjustment in minutes (positive to add time, negative to subtract)"
          example: -30
        status:
          type: string
          description: Current status of the adjustment
          enum:
          - PROPOSED
          - PENDING
          - APPROVED
          - REJECTED
          example: PENDING
        createdBy:
          type: string
          description: User who created the adjustment request
          example: employee-456
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the adjustment was created
          example: 2026-02-17T08:30:00Z
        decidedBy:
          type: string
          description: User who approved or rejected the adjustment
          example: manager-123
        decidedAt:
          type: string
          format: date-time
          description: Timestamp when the adjustment was approved or rejected
          example: 2026-02-17T09:15:00Z
      required:
      - reasonCode
      - status
      - timeEntryId
    AttendanceDiscrepancyReportResponse:
      type: object
      description: Attendance vs job time discrepancy row
      properties:
        technicianId:
          type: string
          description: Technician identifier
          example: 123e4567-e89b-12d3-a456-426614174000
        technicianName:
          type: string
          description: Technician display name
          example: Jane Doe
        locationId:
          type: string
          description: Location identifier
          example: 22222222-2222-2222-2222-222222222222
        reportDate:
          type: string
          format: date
          description: Report local date
          example: 2026-02-16
        totalAttendanceHours:
          type: number
          format: double
          description: Total attendance time in decimal hours
          example: 8.0
        totalJobHours:
          type: number
          format: double
          description: Total approved job time in decimal hours
          example: 6.0
        discrepancyHours:
          type: number
          format: double
          description: Attendance minus job time in decimal hours
          example: 2.0
        thresholdApplied:
          type: integer
          format: int32
          description: Threshold in minutes used for this row
          example: 60
        isFlagged:
          type: boolean
          description: True when absolute discrepancy exceeds threshold
          example: true
      required:
      - discrepancyHours
      - isFlagged
      - locationId
      - reportDate
      - technicianId
      - technicianName
      - thresholdApplied
      - totalAttendanceHours
      - totalJobHours
