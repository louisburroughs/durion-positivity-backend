      - jobId
      - locationId
      - records
      type: object
    BulkIngestResponse:
      description: 'Summary outcome of a bulk ingest job: per-record results plus aggregate counts'
      properties:
        failureCount:
          description: Number of records that failed ingest
          example: 2
          format: int32
          type: integer
        results:
          description: Per-record outcomes in submission order
          items:
            $ref: '#/components/schemas/BulkIngestResult'
          type: array
        successCount:
          description: Number of records ingested successfully
          example: 98
          format: int32
          type: integer
        totalSubmitted:
          description: Total number of records submitted in the batch
          example: 100
          format: int32
          type: integer
      required:
      - failureCount
      - results
      - successCount
      - totalSubmitted
      type: object
    BulkIngestResult:
      description: Per-record outcome of a bulk ingest submission
      properties:
        correlationId:
          description: 'Correlation id to quote when reporting a row that failed for a server-side reason. Present only alongside errorCode INTERNAL_ERROR, where it is the whole of what the caller can act on: the exception itself is logged at ERROR against this id and never returned (ADR-0056). Every failed row of one request carries the same id.'
          example: 01960003-0000-7000-8000-0000000000ff
          type: string
        entityId:
          description: Identifier of the entity created/updated for this record, when successful
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        errorCode:
          description: Machine-readable error code when the record failed
          example: VALIDATION_FAILED
          type: string
        errorMessage:
          description: Human-readable error detail when the record failed
          example: vin must be 17 characters
          type: string
        rowIndex:
          description: Zero-based index of the record within the submitted batch
          example: 0
          format: int32
          type: integer
        success:
          description: Whether this record was ingested successfully
          example: true
          type: boolean
      required:
      - rowIndex
      - success
      type: object
