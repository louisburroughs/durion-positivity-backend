      type: object
      description: "Summary outcome of a bulk ingest job: per-record results plus\
        \ aggregate counts"
      properties:
        totalSubmitted:
          type: integer
          format: int32
          description: Total number of records submitted in the batch
          example: 100
        successCount:
          type: integer
          format: int32
          description: Number of records ingested successfully
          example: 98
        failureCount:
          type: integer
          format: int32
          description: Number of records that failed ingest
          example: 2
        results:
          type: array
          description: Per-record outcomes in submission order
          items:
            $ref: "#/components/schemas/BulkIngestResult"
      required:
      - failureCount
      - results
      - successCount
      - totalSubmitted
    BulkIngestResult:
      type: object
      description: Per-record outcome of a bulk ingest submission
      properties:
        rowIndex:
          type: integer
          format: int32
          description: Zero-based index of the record within the submitted batch
          example: 0
        entityId:
          type: string
          format: uuid
          description: "Identifier of the entity created/updated for this record,\
            \ when successful"
          example: 01960003-0000-7000-8000-000000000001
        success:
          type: boolean
          description: Whether this record was ingested successfully
          example: true
        errorCode:
          type: string
          description: Machine-readable error code when the record failed
          example: VALIDATION_FAILED
        errorMessage:
          type: string
          description: Human-readable error detail when the record failed
          example: vin must be 17 characters
        correlationId:
          type: string
          description: "Correlation id to quote when reporting a row that failed for\
            \ a server-side reason. Present only alongside errorCode INTERNAL_ERROR,\
            \ where it is the whole of what the caller can act on: the exception itself\
            \ is logged at ERROR against this id and never returned (ADR-0056). Every\
            \ failed row of one request carries the same id."
          example: 01960003-0000-7000-8000-0000000000ff
      required:
      - rowIndex
      - success
