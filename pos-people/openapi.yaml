    TimeEntryException:
      type: object
      description: Time entry exception representing a discrepancy or issue with time
        tracking
      properties:
        exceptionId:
          type: string
          format: uuid
          description: Unique identifier for the exception
          example: 123e4567-e89b-12d3-a456-426614174000
          readOnly: true
        employeeId:
          type: string
          description: Employee identifier associated with the exception
          example: EMP-001
        workDate:
          type: string
          format: date
          description: Work date when the exception occurred
          example: 2026-02-17
        exceptionCode:
          type: string
          description: Exception code identifying the type of exception
          example: MISSED_CLOCK_OUT
        severity:
          type: string
          description: Severity level of the exception
          enum:
          - WARNING
          - BLOCKING
          example: HIGH
        status:
          type: string
          description: Current status of the exception
          enum:
          - OPEN
          - ACKNOWLEDGED
          - RESOLVED
          - WAIVED
          example: PENDING
        timeEntryId:
          type: string
          description: Associated time entry identifier
          example: te-12345
        resolutionNotes:
          type: string
          description: Notes describing resolution or actions taken
          example: Manager manually adjusted time entry
        detectedAt:
          type: string
          format: date-time
          description: Timestamp when the exception was detected
          example: 2026-02-17T08:30:00Z
        resolvedBy:
          type: string
          description: User who resolved the exception
          example: manager-123
        resolvedAt:
          type: string
          format: date-time
          description: Timestamp when the exception was resolved
          example: 2026-02-17T09:15:00Z
      required:
      - employeeId
      - exceptionCode
      - severity
      - status
      - workDate
