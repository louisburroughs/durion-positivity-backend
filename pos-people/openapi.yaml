  /v1/people/staffing/bulk-ingest:
    post:
      tags:
      - Staffing Assignment Bulk Ingest API
      summary: Assign People to Locations in Bulk
      description: |
        Creates many staffing assignments at once, resolving each row's employee number to a person.
        Use this tool when standing up a location's roster or seeding an environment; use createStaffingAssignment instead for a single assignment.
        Preconditions: each employee number must resolve to a person with an ACTIVE employee record, each location must be active, and no assignment may overlap an existing one for the same person, location and role.
        Required inputs: jobId (UUID), locationId (UUID) and records, each with an employeeNumber and a role; a record's own locationId overrides the batch one, and effectiveFrom defaults to today.
        Emits a PEOPLE_STAFFING_ASSIGNMENT_BULK_INGEST event and a staffing-assignment fact per row.
        Note two side effects that make this not simply additive: a new primary demotes and end-dates an overlapping existing primary, and a person's first active assignment is forced primary whatever the flag says.
        Returns 200 with a per-record result; check each result rather than the status alone. A row the service refused carries errorCode STAFFING_ASSIGNMENT_INGEST_FAILED and the reason; a row lost to a server-side fault carries INTERNAL_ERROR and a correlationId to quote, with no detail of its own.
      operationId: bulkIngestStaffingAssignments
      requestBody:
        description: Staffing assignments to create.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkIngestRequestStaffingAssignmentBulkIngestRecord"
            examples:
              Location roster:
                description: Location roster
                value:
                  jobId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a00
                  locationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a10
                  operatorId: seed-operator
                  records:
                  - employeeNumber: EMP-0001
                    role: LOCATION_MANAGER
                    primary: true
                  - employeeNumber: EMP-0002
                    role: TECHNICIAN
                    primary: true
        required: true
      responses:
        "200":
          description: Batch processed; inspect per-record results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkIngestResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
