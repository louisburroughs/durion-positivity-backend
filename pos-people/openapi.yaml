          format: date-time
          description: Timestamp when the exception was detected
          example: 2026-02-17 08:30:00+00:00
        resolvedBy:
          type: string
          description: User who resolved the exception
          example: manager-123
        resolvedAt:
          type: string
          format: date-time
          description: Timestamp when the exception was resolved
          example: 2026-02-17 09:15:00+00:00
      required:
      - employeeId
      - exceptionCode
      - severity
      - status
      - workDate
    EmployeeIdentityDto:
      type: object
      description: Employee identity resolved from an employee number
      properties:
        employeeId:
          type: string
          format: uuid
          description: Employee record identifier
          example: 01960011-0000-7000-8000-000000000001
        personId:
          type: string
          format: uuid
          description: Stable person identifier the employee maps to
          example: 01960011-0000-7000-8000-000000000002
        employeeNumber:
          type: string
          description: Employee number
          example: EMP-0001
        status:
          type: string
          description: Employment status
          example: ACTIVE
        active:
          type: boolean
          description: True when the employee is in an ACTIVE employment status
          example: true
      required:
      - active
      - employeeId
      - employeeNumber
      - personId
      - status
    InactivePersonActiveUserResponse:
      type: object
      description: An active user-person link whose linked person is in an inactive status (ADR-0015 §4 violation)
      properties:
        linkId:
          type: string
          format: uuid
          description: User-person link identifier
          example: 01960012-0000-7000-8000-000000000001
        username:
          type: string
          description: Username of the security user account with the still-active link
          example: marcus.webb
        personId:
          type: string
          format: uuid
          description: Person identifier in an inactive status
          example: 01960011-0000-7000-8000-000000000001
        personStatus:
          type: string
          description: Inactive status of the linked person; absent when the employee row disappeared between the link query and the mapping step
          enum:
          - ACTIVE
          - ON_LEAVE
          - SUSPENDED
          - TERMINATED
          - DISABLED
          example: TERMINATED
        personStatusEffectiveAt:
          type: string
          format: date-time
          description: When the person's status last became effective
          example: 2026-01-15 09:30:00+00:00
      required:
      - linkId
      - personId
      - username
    PeopleAvailabilityResponse:
      type: object
      description: Availability of a person at a location for a given date based on staffing assignments
      properties:
        personId:
          type: string
          format: uuid
          description: Person identifier
          example: 01960011-0000-7000-8000-000000000001
        firstName:
          type: string
          description: First name of the person
          example: Jane
        lastName:
          type: string
          description: Last name of the person
          example: Smith
        locationId:
          type: string
          format: uuid
          description: Location identifier
          example: 01960011-0000-7000-8000-000000000010
        role:
          type: string
          description: Assignment role at the location
          example: TECHNICIAN
        primary:
          type: boolean
          description: Whether this is the person's primary assignment
          example: true
        assignmentStatus:
          type: string
          description: Lifecycle status of the assignment
          enum:
          - ACTIVE
          - ENDED
          example: ACTIVE
        effectiveFrom:
          type: string
          format: date
          description: Date the assignment becomes effective
          example: 2026-02-01
        effectiveTo:
          type: string
          format: date
          description: Date the assignment ends
          example: 2026-12-31
        availableOn:
          type: string
          format: date
          description: Date the availability was evaluated for
          example: 2026-02-16
      required:
      - assignmentStatus
      - locationId
      - personId
      - primary
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
