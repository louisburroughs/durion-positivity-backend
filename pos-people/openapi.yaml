        exceptionCode:
          description: Exception code identifying the type of exception
          example: MISSED_CLOCK_OUT
          type: string
        resolutionNotes:
          description: Notes describing the exception or initial resolution steps
          example: Employee forgot to clock out at end of shift
          type: string
        severity:
          description: Severity level of the exception
          enum:
          - WARNING
          - BLOCKING
          example: BLOCKING
          type: string
        timeEntryId:
          description: Time entry identifier associated with the exception
          example: te-12345
          type: string
      required:
      - employeeId
      - exceptionCode
      type: object
    TimeEntryExceptionResolveRequest:
      description: Request to resolve a time entry exception
      properties:
        resolutionNotes:
          description: Notes explaining the resolution
          type: string
      type: object
    TimeEntryExceptionResponse:
      description: Response from creating or updating a time entry exception
      properties:
        exceptionId:
          description: Unique identifier of the created or updated exception
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
          type: string
        message:
          description: Human-readable message describing the outcome
          example: Exception created successfully
          type: string
        success:
          description: Indicates whether the operation was successful
          example: true
          type: boolean
      required:
      - success
      type: object
    TimeEntryExceptionWaiveRequest:
      description: Request to waive a time entry exception
      properties:
        waiveReason:
          description: Reason for waiving the exception
          minLength: 1
          type: string
      required:
      - waiveReason
      type: object
    TimeEntrySummary:
      description: An attendance time entry (clock-in, clock-out, breaks) with its approval decision
      properties:
        breakMinutes:
          description: Break minutes taken inside the attendance window; the window is gross time
          example: 30
          format: int32
          type: integer
        decisionAtUtc:
          description: When the entry was approved or rejected
          format: date-time
          type: string
        decisionByUserId:
          description: Who approved or rejected; null while no decision has been taken
          type: string
        employeeId:
          description: Person the attendance belongs to
          format: uuid
          type: string
        endAtUtc:
          description: Clock-out instant; null while the person is still clocked in
          format: date-time
          type: string
        locationId:
          description: Location the person was clocked in at
          format: uuid
          type: string
        rejectionReason:
          description: Why the entry was rejected; present only when status is REJECTED
          type: string
        startAtUtc:
          description: Clock-in instant
          format: date-time
          type: string
        status:
          description: Approval status
          enum:
          - DRAFT
          - SUBMITTED
          - PENDING_APPROVAL
          - APPROVED
          - REJECTED
          type: string
        submittedAtUtc:
          description: When the employee submitted the entry for approval
          format: date-time
          type: string
        timeEntryId:
          description: Time entry identifier
          format: uuid
          type: string
        workDate:
          description: Calendar day of the clock-in, in the zone the query was filtered by
          example: '2026-01-15'
          format: date
          type: string
        workSessionId:
          description: Work session that produced the entry, when it came from the clock surface
          format: uuid
          type: string
      required:
      - status
      - timeEntryId
      type: object
    TimePeriodApprovalDto:
      description: Aggregated approval state for a person within a time period
      properties:
        approvedCount:
          description: Number of approved entries
          example: 6
          format: int32
          type: integer
        overallStatus:
          description: Overall approval status for the person in the period
          enum:
          - PENDING_APPROVAL
          - APPROVED
          - REJECTED
          example: PENDING_APPROVAL
          type: string
        pendingCount:
          description: Number of entries still pending approval
          example: 3
          format: int32
          type: integer
        personId:
          description: Person identifier
          example: 01960011-0000-7000-8000-000000000001
          format: uuid
          type: string
        rejectedCount:
          description: Number of rejected entries
          example: 1
          format: int32
          type: integer
        timePeriodId:
          description: Time period identifier
          example: 01960011-0000-7000-8000-000000000010
          format: uuid
          type: string
        totalCount:
          description: Total number of entries in the period
          example: 10
          format: int32
          type: integer
      required:
      - approvedCount
      - overallStatus
      - pendingCount
      - personId
      - rejectedCount
      - timePeriodId
      - totalCount
      type: object
    TimePeriodDecisionResponse:
      description: Result of an approve/reject decision applied across a person's time period entries
      properties:
        personId:
          description: Person identifier
          example: 01960011-0000-7000-8000-000000000001
          format: uuid
          type: string
        processedCount:
          description: Number of entries processed by the decision
          example: 7
          format: int32
          type: integer
        status:
          description: Resulting status of the operation
          example: APPROVED
          type: string
        timePeriodId:
          description: Time period identifier
          example: 01960011-0000-7000-8000-000000000010
          format: uuid
          type: string
      required:
      - personId
      - processedCount
      - status
      - timePeriodId
      type: object
    TimePeriodDto:
      description: Timekeeping time period bounding a payroll or submission cycle
      properties:
        endDate:
          description: Last date of the period
          example: '2026-02-15'
          format: date
          type: string
        startDate:
          description: First date of the period
          example: '2026-02-01'
          format: date
          type: string
        status:
          description: Lifecycle status of the period
          enum:
          - OPEN
          - SUBMISSION_CLOSED
          - PAYROLL_CLOSED
          example: OPEN
          type: string
        tenantId:
          description: Tenant identifier the period belongs to
          example: 01960011-0000-7000-8000-000000000099
          format: uuid
          type: string
        timePeriodId:
          description: Time period identifier
          example: 01960011-0000-7000-8000-000000000001
          format: uuid
          type: string
      required:
      - endDate
      - startDate
      - status
      - tenantId
      - timePeriodId
      type: object
    TimekeepingEntryDto:
      description: Timekeeping entry summarizing a worked session pending or resolved for approval
      properties:
        approvalStatus:
          description: Approval status of the entry
          enum:
          - PENDING_APPROVAL
          - APPROVED
          - REJECTED
          example: PENDING_APPROVAL
          type: string
        associatedWorkOrderId:
          description: Associated workorder identifier
          example: 01960011-0000-7000-8000-000000000030
          format: uuid
          type: string
        employeeId:
          description: Employee identifier
          example: 01960011-0000-7000-8000-000000000002
          format: uuid
          type: string
        sessionEndTime:
          description: Session end timestamp
          example: '2026-02-16T17:00:00Z'
          format: date-time
          type: string
        sessionStartTime:
          description: Session start timestamp
          example: '2026-02-16T08:00:00Z'
          format: date-time
          type: string
        timekeepingEntryId:
          description: Timekeeping entry identifier
          example: 01960011-0000-7000-8000-000000000001
          format: uuid
          type: string
      required:
      - approvalStatus
      - employeeId
      - sessionStartTime
      - timekeepingEntryId
      type: object
    TransitionTimePeriodRequest:
      description: Request to move a pay period to a new lifecycle status
      properties:
        status:
          description: Target lifecycle status
          enum:
          - OPEN
          - SUBMISSION_CLOSED
          - PAYROLL_CLOSED
          example: SUBMISSION_CLOSED
          type: string
      required:
      - status
      type: object
    UpdateEmployeeRequest:
      description: Request to update an existing employee record
      properties:
        contactInfo:
          $ref: '#/components/schemas/EmployeeContactInfoDto'
        duplicatePolicy:
          description: Policy controlling how potential duplicate employee records are handled
          enum:
          - STRICT
          - BALANCED
          example: STRICT
          type: string
        employeeNumber:
          description: Unique employee number
          example: EMP-0001
          minLength: 1
          type: string
        firstName:
          description: First (given) name of the employee
          example: Jane
          minLength: 1
          type: string
        hireDate:
          description: Date the employee was hired
          example: '2026-01-15'
          format: date
          type: string
        jobRoleId:
          description: Id of the employee's job role, from the tenant's job-role list; omit to clear it
          format: uuid
          type: string
        lastName:
          description: Last (family) name of the employee
          example: Smith
          minLength: 1
          type: string
        preferredName:
          description: Preferred name of the employee
          example: Jane
          type: string
        status:
          description: Employment status of the employee
          enum:
          - ACTIVE
          - ON_LEAVE
          - SUSPENDED
          - TERMINATED
          - DISABLED
          example: ACTIVE
          type: string
        terminationDate:
          description: Date the employee was terminated, if applicable
          example: '2026-12-31'
          format: date
          type: string
      required:
      - employeeNumber
      - firstName
      - hireDate
      - lastName
      - status
      type: object
    UpdateStaffingAssignmentRequest:
      description: Request to update a staffing assignment
      properties:
        effectiveDateRangeValid:
          type: boolean
        effectiveFrom:
          description: Assignment effective start date
          example: '2026-02-16'
          format: date
          type: string
        effectiveTo:
          description: Assignment effective end date
          example: '2026-12-31'
          format: date
          type: string
        isPrimary:
          description: Whether this assignment is primary
          example: true
          type: boolean
        locationId:
          description: Location identifier
          example: 22222222-2222-2222-2222-222222222222
          format: uuid
          type: string
        personId:
          description: Person identifier
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
          type: string
        role:
          description: Assignment role
          example: TECHNICIAN
          minLength: 1
          type: string
      required:
      - effectiveFrom
      - isPrimary
      - locationId
      - personId
      - role
      type: object
    WorkSessionClockStateResponse:
      description: 'A person''s current work-session (clock) state, derived from their open work session and open break. CLOCKED_OUT is an answer, not an error: it is returned when nothing is open.'
      properties:
        breakStartedAt:
          description: When the open break started; non-null exactly when clockState is ON_BREAK
          example: '2026-02-16T12:00:00Z'
          format: date-time
          type: string
        clockState:
          description: CLOCKED_IN (open session, no open break), ON_BREAK (open session with an open break) or CLOCKED_OUT (no open session)
          enum:
          - CLOCKED_IN
          - ON_BREAK
          - CLOCKED_OUT
          example: CLOCKED_IN
          type: string
        clockedInAt:
          description: When the open session started; non-null exactly when workSessionId is
          example: '2026-02-16T08:00:00Z'
          format: date-time
          type: string
        personId:
          description: Person the state belongs to
          example: 01960011-0000-7000-8000-000000000001
          format: uuid
          type: string
        workSessionId:
          description: The open work session; non-null exactly when clockState is CLOCKED_IN or ON_BREAK. The break endpoints are keyed by this id.
          example: 01960011-0000-7000-8000-000000000002
          format: uuid
          type: string
      required:
      - clockState
      - personId
      type: object
    WorkSessionDto:
      description: Work session representing a tracked period of work for a person
      properties:
        billableMinutes:
          description: Total billable minutes for the session
          example: 480
          format: int32
          type: integer
        breakMinutes:
          description: Total break minutes for the session
          example: 30
          format: int32
          type: integer
        endedAt:
          description: Timestamp the session ended
          example: '2026-02-16T17:00:00Z'
          format: date-time
          type: string
        personId:
          description: Person the session belongs to
          example: 01960011-0000-7000-8000-000000000002
          format: uuid
          type: string
        sessionId:
          description: Work session identifier
          example: 01960011-0000-7000-8000-000000000001
          format: uuid
          type: string
        startedAt:
          description: Timestamp the session started
          example: '2026-02-16T08:00:00Z'
          format: date-time
          type: string
        status:
          description: Lifecycle status of the session
          example: OPEN
          type: string
        submittedAt:
          description: Timestamp the session was submitted
          example: '2026-02-16T17:05:00Z'
          format: date-time
          type: string
      required:
      - personId
      - sessionId
      - status
      type: object
    WorkSessionRequest:
      description: Request to start or act on a work session for a person
      properties:
        actor:
          description: Actor performing the action
          example: manager.user
          type: string
        personId:
          description: ID of the person
          example: 01960011-0000-7000-8000-000000000001
          format: uuid
          type: string
      required:
      - personId
      type: object
    WorkSessionSubmitRequest:
      description: Request to submit a completed work session for review
      properties:
        billableMinutes:
          description: Total billable minutes for the session
          example: 480
          format: int32
          minimum: 0
          type: integer
        breakMinutes:
          description: Total break minutes for the session
          example: 30
          format: int32
          minimum: 0
          type: integer
        submittedAt:
          description: Timestamp the session was submitted
          example: '2026-02-16T17:00:00Z'
          format: date-time
          type: string
      required:
      - billableMinutes
      - breakMinutes
      - submittedAt
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
