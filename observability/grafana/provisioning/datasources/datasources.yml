# Grafana Datasources Provisioning Configuration
apiVersion: 1

# Drop any pre-existing same-named datasources first (#863). Grafana provisioning
# matches by name and will NOT change the uid of an existing datasource, so an
# install that first created these without pinned uids keeps its auto-generated
# uid (e.g. PBFA97...) and dashboards referencing uid 'prometheus'/'loki' render
# no data. Deleting them here forces recreation with the pinned uids below.
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1

datasources:
  # Prometheus Datasource
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
    version: 1

  # Jaeger Datasource for Distributed Tracing
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: true
    jsonData:
      tracesToLogs:
        datasourceUid: 'loki'
        tags: ['job', 'instance', 'pod', 'namespace']
        mappedTags: [{ key: 'service.name', value: 'service' }]
        mapTagNamesEnabled: true
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
    version: 1

  # Tempo Datasource (if using Tempo instead of Jaeger)
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      httpMethod: GET
      tracesToLogs:
        datasourceUid: 'loki'
    version: 1

  # Loki Datasource for logs (#858)
  # uid 'loki' satisfies the Jaeger/Tempo tracesToLogs.datasourceUid references above.
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
      # Correlate a log line back to a trace. Every pos-* module logs the
      # correlation bracket "[<trace_id>,<span_id>,<tenantId>]" (comma-delimited;
      # pos-tenancy-common's TenantLogPatternEnvironmentPostProcessor, ADR-0062
      # plan WS6); capture the leading trace id. The tenant is a stream label
      # (Promtail), not a derived field.
      derivedFields:
        - name: TraceID
          matcherRegex: '\[(\w+),\w*,[\w\-]*\]'
          url: '$${__value.raw}'
          datasourceUid: 'jaeger'
    version: 1

  # TestData Datasource for testing and demos
  - name: TestData
    type: testdata
    access: proxy
    editable: true
    version: 1
