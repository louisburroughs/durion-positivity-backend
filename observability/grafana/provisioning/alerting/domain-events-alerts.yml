# Grafana-provisioned alert rules for the ADR-0044 domain-event channel (issue #838 Q5).
# Dashboard-only delivery for alpha (no contact points configured beyond the default).
apiVersion: 1

groups:
  - orgId: 1
    name: domain-events
    folder: Durion POS
    interval: 1m
    rules:
      # The __name__ regex matches every service's outbox gauges (#1458):
      # <domain>_outbox_oldest_age_seconds / <domain>_outbox_pending, registered by
      # OutboxHealthContributor (pos-events) in each module with a Kafka outbox.
      # `by (service)` keeps one alert instance per service, so the notification
      # names the stalled drain instead of hiding it behind a fleet-wide max.
      - uid: outbox-oldest-warn
        title: Outbox drain lagging (oldest unpublished > 5m)
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Oldest unpublished event_outbox row on {{ $labels.service }} is older than 5 minutes — drain is slow or stuck."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: max by (service) ({__name__=~".+_outbox_oldest_age_seconds"})
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [300] }
      - uid: outbox-oldest-critical
        title: Outbox drain stuck (oldest unpublished > 15m)
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Oldest unpublished event_outbox row on {{ $labels.service }} is older than 15 minutes — check the service's /actuator/health outbox details (drainState, headAttempts, headLastError)."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: max by (service) ({__name__=~".+_outbox_oldest_age_seconds"})
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [900] }
      - uid: outbox-depth-warn
        title: Outbox backlog growing (> 1000 unpublished rows for 10m)
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "{{ $labels.service }} has over 1000 unpublished event_outbox rows — the drain is falling behind sustained write volume even if the head keeps moving."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: max by (service) ({__name__=~".+_outbox_pending"})
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1000] }
      - uid: consumer-lag-warn
        title: Kafka consumer lag > 100 for 5m
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: A consumer group is more than 100 records behind for over 5 minutes.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: max(sum by (consumergroup) (kafka_consumergroup_lag))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [100] }
      - uid: dlq-message-warn
        title: DLQ received a message
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: A record was dead-lettered in the last 15 minutes — every DLQ message warrants a look (see OPERATIONS_RUNBOOK.md).
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              expr: sum(increase(kafka_topic_partition_current_offset{topic=~".*\\.dlq"}[15m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: replica-drift-warn
        title: Replica drift detected
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: A reconciliation manifest mismatched a replica in the last hour; a replay was auto-requested — verify it healed.
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: sum(increase(replica_drift_total[1h]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: manifest-silent-warn
        title: Manifest publisher silent > 2h
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: No manifest published to workorder.manifest.v1 in 2 hours (2x window) — the owner's manifest job is down.
        data:
          - refId: A
            relativeTimeRange: { from: 7200, to: 0 }
            datasourceUid: prometheus
            model:
              expr: sum(increase(kafka_topic_partition_current_offset{topic="workorder.manifest.v1"}[2h]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
