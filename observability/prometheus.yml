          application: 'pos-workorder'

  # Kafka exporter (#838): topic depth (DLQ), consumer lag, manifest activity
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']
        labels:
          service: 'kafka'

  # cAdvisor (#863): per-container CPU/memory/network metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'

  # postgres-exporter (#863): cluster-wide Postgres stats (pg_stat_database is
  # cluster-scoped, so scraping the 'postgres' maintenance DB covers every pos_*_db)
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
