    basic_auth:
      username: 'prometheus_scraper'
      password: 'durion-local-prom-scrape-password'
    static_configs:
      - targets: ['pos-bulk-loader:8080']
        labels:
          service: 'pos-bulk-loader'
          application: 'pos-bulk-loader'

  - job_name: 'pos-catalog'
