        labels:
          service: 'pos-workorder'
          application: 'pos-workorder'

  # The labor-guide mock vendor (#1569 Phase 1, sourcing plan §10). No basic_auth on purpose:
  # it simulates an external vendor outside the JWT boundary, so its actuator is open on the
  # compose network and serves metrics on the service port (8095, no separate management port).
  - job_name: 'pos-reference-mock'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['pos-reference-mock:8095']
        labels:
          service: 'pos-reference-mock'
          application: 'pos-reference-mock'

  # Kafka exporter (#838): topic depth (DLQ), consumer lag, manifest activity
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']
        labels:
          service: 'kafka'

  # cAdvisor (#863): per-container CPU/memory/network metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'

  # postgres-exporter (#863): cluster-wide Postgres stats (pg_stat_database is
  # cluster-scoped, so scraping the 'postgres' maintenance DB covers every pos_*_db)
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
