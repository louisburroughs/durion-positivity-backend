# Prometheus Configuration for Durion POS Backend
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: 'durion-pos-local'
    environment: 'development'

# Alertmanager configuration (optional for local development)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Scrape configuration
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # OTEL Collector internal telemetry (otelcol_*) on :8888.
  # App metrics come ONLY from the per-service /actuator/prometheus jobs below (#867);
  # the collector no longer re-exports them (its :8889 prometheus exporter was removed).
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          service: 'otel-collector'

  # Eureka Service Discovery
  - job_name: 'eureka-server'
    metrics_path: '/actuator/prometheus'
    basic_auth:
      username: 'prometheus_scraper'
      password: 'durion-local-prom-scrape-password'
    static_configs:
      - targets: ['eureka-server:8761']
        labels:
          service: 'pos-service-discovery'
          application: 'pos-service-discovery'

  # API Gateway
  - job_name: 'pos-api-gateway'
    metrics_path: '/actuator/prometheus'
    basic_auth:
      username: 'prometheus_scraper'
      password: 'durion-local-prom-scrape-password'
    static_configs:
      - targets: ['pos-api-gateway:8080']
        labels:
          service: 'pos-api-gateway'
          application: 'pos-api-gateway'

  # Business Services
  - job_name: 'pos-accounting'
    metrics_path: '/actuator/prometheus'
    basic_auth:
      username: 'prometheus_scraper'
      password: 'durion-local-prom-scrape-password'
    static_configs:
      - targets: ['pos-accounting:8080']
        labels:
          service: 'pos-accounting'
          application: 'pos-accounting'

  - job_name: 'pos-catalog'
    metrics_path: '/actuator/prometheus'
    basic_auth:
      username: 'prometheus_scraper'
      password: 'durion-local-prom-scrape-password'
    static_configs:
      - targets: ['pos-catalog:8080']
        labels:
          service: 'pos-catalog'
          application: 'pos-catalog'

  - job_name: 'pos-customer'
    metrics_path: '/actuator/prometheus'
    basic_auth:
      username: 'prometheus_scraper'
      password: 'durion-local-prom-scrape-password'
    static_configs:
      - targets: ['pos-customer:8080']
        labels:
          service: 'pos-customer'
          application: 'pos-customer'

  - job_name: 'pos-event-receiver'
    metrics_path: '/actuator/prometheus'
    basic_auth:
      username: 'prometheus_scraper'
      password: 'durion-local-prom-scrape-password'
    static_configs:
