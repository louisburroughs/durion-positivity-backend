# OpenTelemetry Collector Configuration for Durion POS Backend
#
# Metrics policy (#867): application metrics are PULL-ONLY — Prometheus scrapes
# each service's /actuator/prometheus endpoint directly (see prometheus.yml).
# The collector carries traces (OTLP -> Jaeger) and logs only; it has no metrics
# pipeline and does not re-export app metrics. Services must run with
# OTEL_METRICS_EXPORTER=none so the javaagent doesn't push OTLP metrics here.
# Collector-internal telemetry is exposed on :8888 (service.telemetry below)
# and scraped directly by Prometheus under job="otel-collector".
receivers:
  # OTLP Receiver - Primary receiver for OpenTelemetry Protocol
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "*"

processors:
  # Batch Processor - Batch telemetry data for better performance
  batch:
    timeout: 10s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # Memory Limiter - Prevent OOM by limiting memory usage
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Resource Processor - Add resource attributes to all telemetry
  resource:
    attributes:
      - key: deployment.environment
        value: development
        action: upsert
      - key: service.namespace
        value: durion-group
        action: upsert
      - key: cluster.name
        value: local-docker
        action: upsert

  # Attributes Processor - Add, update, or delete attributes
  attributes:
    actions:
      - key: environment
        value: local
        action: insert

exporters:
  # Jaeger Exporter - Send traces to Jaeger
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Logging Exporter - Output telemetry to collector logs (for debugging)
  logging:
    loglevel: debug
    sampling_initial: 5
    sampling_thereafter: 200

  # Debug Exporter - Detailed output for troubleshooting
  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 200

extensions:
  # Health Check Extension
  health_check:
    endpoint: 0.0.0.0:13133

  # Performance Profiler
  pprof:
    endpoint: 0.0.0.0:1777

  # zPages Extension - Diagnostic pages
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]
  
  pipelines:
    # Traces Pipeline
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource, attributes]
      exporters: [otlp/jaeger, logging]
    
    # No metrics pipeline (#867): app metrics are scraped by Prometheus from
    # /actuator/prometheus; collector-internal metrics are served on :8888.

    # Logs Pipeline
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource, attributes]
      exporters: [logging]

  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      address: 0.0.0.0:8888
