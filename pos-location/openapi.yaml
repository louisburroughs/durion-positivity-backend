          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Default storage location does not belong to the site
      security:
      - bearerAuth:
        - location:write
      summary: Configure Default Storage Locations for Site
      tags:
      - Site Defaults API
      x-required-permissions:
      - location:write
  /v1/locations/{locationId}/descendants:
    get:
      description: 'Walks typed parent-child edges downward from a location and returns every descendant as a flat list with its immediate parent id and depth, where depth 1 is a direct child.

        Use this tool when a whole subtree is needed in one call; use listLocationChildren instead for only the direct children of one location.

        Preconditions: the root location must exist; traversal is cycle-safe and silently truncates at depth 20.

        Required inputs: locationId (UUID) as a path parameter; parentType defaults to PHYSICAL when omitted.

        Emits a LOCATION_DESCENDANTS_GET event; no state changes.

        Returns 404 when the root location does not exist and 400 when parentType is not a recognized ParentType value.

        '
      operationId: listLocationDescendants
      parameters:
      - description: ID of the root location
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
        in: path
        name: locationId
        required: true
        schema:
          format: uuid
          type: string
      - description: Parent relationship type to traverse (defaults to PHYSICAL)
        in: query
        name: parentType
        required: false
        schema:
          default: PHYSICAL
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LocationDescendantResponseDTO'
                type: array
          description: List of descendant locations returned successfully.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid parentType value.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Location not found.
      security:
      - bearerAuth:
        - location:read
      summary: List All Descendants of a Location
      tags:
      - Location API
      x-required-permissions:
      - location:read
  /v1/locations/{locationId}/responsible-person:
    get:
      description: 'Returns the person responsible for a location, resolved from the people-contact replica with name, email and phone details.

        Use this tool to find who owns a site operationally; do not use getLocationById, which returns only the responsiblePersonId without contact details.

        Preconditions: the location must exist and have a responsiblePersonId assigned.

        Required inputs: locationId (UUID) as a path parameter.

        Emits a LOCATION_RESPONSIBLE_PERSON_GET event; no state changes.

        Returns 404 when the location does not exist or no responsible person is assigned; when the replica row has not yet arrived, a 200 with only the person id is returned and names follow with the feed.

        '
      operationId: getLocationResponsiblePerson
      parameters:
      - description: ID of the location
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
        in: path
        name: locationId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDTO'
          description: Responsible person found and returned.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Responsible person not found.
      security:
      - bearerAuth:
        - location:read
      summary: Get Responsible Person for a Location
      tags:
      - Location API
      x-required-permissions:
      - location:read
  /v1/locations/{locationId}/validation:
    get:
      description: 'Returns an existence-and-active-state check for a location id without transferring the full record.

        Use this tool for inter-service reference validation before storing a locationId; do not use getLocationById, which returns the full payload and answers 404 for unknown ids.

        Preconditions: none; unknown ids are a valid input.

        Required inputs: locationId (UUID) as a path parameter.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 always, with exists=false and active=false when the id is unknown, so callers must inspect the flags rather than the status code.

        '
      operationId: validateLocation
      parameters:
      - description: ID of the location to validate
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
        in: path
        name: locationId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationValidationResponseDTO'
          description: Validation result returned.
      security:
      - bearerAuth:
        - location:read
      summary: Validate Location Existence and Active State
      tags:
      - Location API
      x-required-permissions:
      - location:read
  /v1/locations/{siteId}/storage-locations:
    get:
      description: 'Lists the storage locations of a site as a page, optionally filtered by type and status.

        Use this tool for paginated browsing; use getStorageLocationTopology instead when the complete unpaginated hierarchy of the site is needed.

        Preconditions: none; an unknown site id yields an empty page rather than an error.

        Required inputs: siteId (UUID) as a path parameter; type (FLOOR, SHELF, BIN, CAGE, TRUCK) and status (ACTIVE, INACTIVE, MAINTENANCE, QUARANTINED) filters are optional, and standard page, size and sort parameters control paging.

        Emits a LOCATION_STORAGE_LOCATION_LIST event; no state changes.

        Returns 200 with a page of storage locations regardless of whether any match the filters.

        '
      operationId: listStorageLocations
      parameters:
      - in: path
        name: siteId
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: type
        required: false
        schema:
          enum:
          - FLOOR
          - SHELF
          - BIN
          - CAGE
          - TRUCK
          type: string
      - in: query
        name: status
        required: false
        schema:
          enum:
          - ACTIVE
          - INACTIVE
          - MAINTENANCE
          - QUARANTINED
          type: string
      - description: Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: The size of the page to be returned
        in: query
        name: size
        required: false
        schema:
          default: 20
          minimum: 1
          type: integer
      - description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
        in: query
        name: sort
        required: false
        schema:
          items:
            type: string
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageStorageLocationResponse'
          description: Storage locations listed
      security:
      - bearerAuth:
        - location:read
      summary: List Storage Locations of a Site
      tags:
      - Storage Location API
      x-required-permissions:
      - location:read
    post:
      description: 'Creates a storage location (FLOOR, SHELF, BIN, CAGE or TRUCK) inside a site, always starting in ACTIVE status.

        Use this tool when adding storage topology to a site; do not use patchStorageLocation, which modifies an existing node, and use createBay for vehicle service bays rather than inventory storage.

        Preconditions: the site must exist, the name must be unique within the site (case-insensitive), any barcode must be unique within the site, and a parentStorageLocationId must reference a storage location of the same site.

        Required inputs: name and type; barcode, parentStorageLocationId, capacity and temperature (free-form JSON objects) are optional.

        The optional storageCategoryCode declares the putaway capability — what the location is fit to hold (TIRE_RACK, OIL_STORAGE, BATTERY_RACK, SMALL_PARTS_BIN, BULK_FLOOR, STAGING, QUARANTINE, GENERAL) — which is independent of type: a tire rack and a bulk pallet area are both FLOOR. Omitting it leaves the capability undeclared, and the response reports GENERAL, which accepts every catalog category. hazardContainment (default false) and allowNewProduct (MIXED, SAME_PRODUCT_ONLY or EMPTY_ONLY; default MIXED) are the other putaway attributes.

        Emits a LOCATION_STORAGE_LOCATION_CREATE event and publishes a storage-location fact for replica consumers.

        Returns 404 when the site does not exist, 409 when the name or barcode is already used in the site, and 400 when the parent storage location is unknown or belongs to a different site.

        '
      operationId: createStorageLocation
      parameters:
      - in: path
        name: siteId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Refrigerated bin:
                description: Refrigerated bin
                value:
                  allowNewProduct: MIXED
                  barcode: SL-000312
                  capacity:
                    maxUnits: 100
                  hazardContainment: false
                  name: Aisle 3 Bin 12
                  parentStorageLocationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a10
                  storageCategoryCode: SMALL_PARTS_BIN
                  temperature:
                    max: 8
                    min: 2
                    unit: C
                  type: BIN
            schema:
              $ref: '#/components/schemas/StorageLocationRequest'
        description: Storage location to create, positioned in the site's topology via its optional parent reference.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageLocationResponse'
          description: Storage location created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Parent storage location unknown or in another site
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Site not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Duplicate name or barcode within the site
      security:
      - bearerAuth:
        - location:write
      summary: Create a Storage Location Within Site
      tags:
      - Storage Location API
      x-required-permissions:
      - location:write
  /v1/locations/{siteId}/storage-locations/topology:
    get:
      description: 'Returns every storage location of a site, regardless of status, as a flat unpaginated list with id, name, type, status and parentStorageLocationId.

        Use this tool when a rollup or topology consumer needs the whole storage tree in one call; use listStorageLocations instead for paginated, filtered browsing.

        Preconditions: the site must exist.

        Required inputs: siteId (UUID) as a path parameter; there is no filtering.

        Emits a LOCATION_STORAGE_LOCATION_TOPOLOGY event; no state changes.

        Returns 404 when the site does not exist.

        '
      operationId: getStorageLocationTopology
      parameters:
      - description: Site identifier
        in: path
        name: siteId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/StorageLocationTopologyResponse'
                type: array
          description: Storage location topology returned
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Site not found
      security:
      - bearerAuth:
        - location:read
      summary: Get Full Storage Location Topology
      tags:
      - Storage Location API
      x-required-permissions:
      - location:read
  /v1/locations/{siteId}/storage-locations/{storageLocationId}:
    get:
      description: 'Returns a single storage location of a site, including capacity and temperature attributes and its parent reference.

        Use this tool when the storage location id and its site are both known; use validateStorageLocation instead when only existence, active state and site ownership must be checked without knowing the site.

        Preconditions: the storage location must exist and belong to the supplied site.

        Required inputs: siteId and storageLocationId (UUIDs) as path parameters.

        Emits a LOCATION_STORAGE_LOCATION_GET event; no state changes.

        Returns 404 when no storage location with that id exists under the site.

        '
      operationId: getStorageLocation
      parameters:
      - in: path
        name: siteId
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: storageLocationId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageLocationResponse'
          description: Storage location returned
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Storage location not found
      security:
      - bearerAuth:
        - location:read
      summary: Get a Storage Location by Identifier
      tags:
      - Storage Location API
      x-required-permissions:
      - location:read
    patch:
      description: 'Applies a partial update to a storage location, covering rename, barcode, reparenting, capacity, temperature, putaway capability and status transitions.

        Use this tool for all storage-location mutations after creation, including deactivation; do not use createStorageLocation, which adds a new node.

        Preconditions: the storage location must exist in the site; a new name or barcode must be unique within the site, a new parent must belong to the same site without creating a cycle, and deactivating a node that still holds on-hand stock requires a destinationStorageLocationId naming an ACTIVE storage location of the same site to receive the transferred inventory.

        Required inputs: siteId and storageLocationId (UUIDs) as path parameters and a body with at least one field; status accepts ACTIVE, INACTIVE, MAINTENANCE or QUARANTINED, storageCategoryCode accepts TIRE_RACK, OIL_STORAGE, BATTERY_RACK, SMALL_PARTS_BIN, BULK_FLOOR, STAGING, QUARANTINE or GENERAL, and allowNewProduct accepts MIXED, SAME_PRODUCT_ONLY or EMPTY_ONLY. Every capability field is independently omittable — an absent one is left unchanged rather than reset.

        Emits a LOCATION_STORAGE_LOCATION_UPDATE event, publishes a storage-location fact, and on deactivation with stock triggers an atomic inventory transfer to the destination.

        Returns 404 when the storage location or transfer destination does not exist, 409 when the name or barcode collides or the new parent would create a cycle, 400 when the parent is unknown or in another site, and 422 when deactivation needs a destination that is missing, inactive or the node itself.

        '
      operationId: patchStorageLocation
      parameters:
      - in: path
        name: siteId
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: storageLocationId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Deactivate with stock transfer:
                description: Deactivate with stock transfer
                value:
                  destinationStorageLocationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a11
                  status: INACTIVE
            schema:
              $ref: '#/components/schemas/StorageLocationPatchRequest'
        description: Partial storage-location payload; only non-null fields are applied, and destinationStorageLocationId is consumed only when deactivating a node that still holds stock.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageLocationResponse'
          description: Storage location updated
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Parent storage location unknown or in another site
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Storage location not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Duplicate name or barcode, or reparenting would create a cycle
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Deactivation destination missing, inactive or invalid
      security:
      - bearerAuth:
        - location:write
      summary: Patch Fields of a Storage Location
      tags:
      - Storage Location API
      x-required-permissions:
      - location:write
  /v1/mobile-units:
    get:
      description: 'Lists mobile units as a page, ordered by name, with status, base location and travel buffer policy references; optionally narrowed to one base location and/or status, and optionally with each unit''s coverage rules.

        Use this tool to enumerate or browse units, or to read one shop''s units (baseLocationId) and their coverage (include=coverageRules) in one request; use getMobileUnitById instead when the unit id is known, and findEligibleMobileUnits to match units to a service address.

        Preconditions: none beyond the location:mobile-unit:read authority.

        Required inputs: none; page defaults to 0 and size to 20. baseLocationId (UUID) keeps only units based there and is denied (403 LOCATION_SCOPE_DENIED) for a location-scoped caller outside their reach, status (ACTIVE, OUT_OF_SERVICE or RETIRED) keeps only units in that status, and include accepts coverageRules, which adds each unit''s rules ordered by priority.

        Omitting status hides RETIRED units; naming status=RETIRED explicitly includes them.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 with a page of mobile units, empty when none match (including an unknown baseLocationId), and 400 VALIDATION_ERROR for an unknown status or include value.

        '
      operationId: listMobileUnits
      parameters:
      - in: query
        name: page
        required: false
        schema:
          default: 0
          format: int32
          type: integer
      - in: query
        name: size
        required: false
        schema:
          default: 20
          format: int32
          type: integer
      - description: Only units based at this location
        example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a01
        in: query
        name: baseLocationId
        required: false
        schema:
          format: uuid
          type: string
      - description: Only units in this status (ACTIVE, OUT_OF_SERVICE or RETIRED)
        example: ACTIVE
        in: query
        name: status
        required: false
        schema:
          type: string
      - description: Related data to embed; coverageRules adds each unit's coverage rules
        example: coverageRules
        in: query
        name: include
        required: false
        schema:
          items:
            type: string
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageMobileUnitResponse'
          description: Mobile units retrieved successfully.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'VALIDATION_ERROR: baseLocationId is not a UUID, status is not ACTIVE, OUT_OF_SERVICE or RETIRED, or include names something other than coverageRules.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks location:mobile-unit:read, or (LOCATION_SCOPE_DENIED) the named baseLocationId is outside a location-scoped caller's reach.
      security:
      - bearerAuth:
        - location:mobile-unit:read
      summary: List Mobile Units With Pagination
      tags:
      - Mobile Unit API
      x-required-permissions:
      - location:mobile-unit:read
    post:
      description: 'Creates a mobile service unit at a base location, with an optional travel buffer policy, capability list and initial coverage rules.

        Use this tool when commissioning a van or truck that serves customers off-site; do not use patchMobileUnit, which updates an existing unit, and change coverage later with replaceCoverageRules.

        Preconditions: a unit created with status ACTIVE must include travelBufferPolicyId, serviceCapabilityCodes and coverageRules; a status of OUT_OF_SERVICE must carry outOfServiceReason, with outOfServiceNote also required for OTHER; the base location, the travel buffer policy and every rule''s service area must exist, every serviceCapabilityCode must be an active catalog operationCode known to the location service''s catalog replica, each coverage rule''s ruleType must be SERVICE_AREA or DISTANCE_TIER, DISTANCE_TIER coverage rules must be strictly ascending by maxDistance and end with one null catch-all tier, the name must be unique (ignoring case, including a retired unit''s name) at the base location, maxDutyClass (when given) must be a GVWR class 1-8, vin (when given) must be exactly 17 characters excluding I, O and Q, plateRegion (when given) must be an ISO 3166-2 code (for example US-NC), and unitNumber, vin, and licensePlate+plateRegion must each be unique within the tenant when set.

        Required inputs: name and baseLocationId; status is ACTIVE, OUT_OF_SERVICE or RETIRED and defaults to OUT_OF_SERVICE (with outOfServiceReason OTHER) when omitted, and travelBufferPolicyId, notes, serviceCapabilityCodes, coverageRules, maxDutyClass and the display-only unitNumber, vin, licensePlate and plateRegion are optional unless the unit is ACTIVE, and the identity fields are never read by scheduling.

        Emits a LOCATION_MOBILE_UNIT_CREATE event and persists any supplied coverage rules in the same transaction.

        Returns 201 with the created unit; 400 VALIDATION_ERROR with fieldErrors for a blank name, a missing baseLocationId, an unknown status, a malformed coverage rule, an out-of-range maxDutyClass, a malformed vin or plateRegion; 422 with fieldErrors (LOCATION_NOT_FOUND, TRAVEL_BUFFER_POLICY_NOT_FOUND, SERVICE_AREA_NOT_FOUND, OUT_OF_SERVICE_REASON_REQUIRED) when an id names nothing or the out-of-service reason rules are not met, and 422 for an incomplete ACTIVE unit or an unknown capability code; 409 MOBILE_UNIT_NAME_TAKEN when the name is already taken at the base location, and 409 MOBILE_UNIT_IDENTITY_TAKEN with fieldErrors when unitNumber, vin, or licensePlate+plateRegion collides with another unit in the tenant.

        '
      operationId: createMobileUnit
      requestBody:
        content:
          application/json:
            examples:
              Active mobile unit:
                description: Active mobile unit
                value:
                  baseLocationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a01
                  coverageRules:
                  - priority: 1
                    ruleType: SERVICE_AREA
                    serviceAreaId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a03
                    validFrom: '2026-06-18'
                  name: Van 7
                  notes: Equipped with hydraulic lift
                  serviceCapabilityCodes:
                  - OIL-CHANGE-FULL-SYNTHETIC
                  - BATTERY-REPLACEMENT
                  status: ACTIVE
                  travelBufferPolicyId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a02
            schema:
              $ref: '#/components/schemas/MobileUnitRequest'
        description: Mobile unit to create; an ACTIVE unit must arrive complete with its travel buffer policy, capabilities and coverage rules.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileUnitResponse'
          description: Mobile unit created successfully.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'VALIDATION_ERROR: blank name, missing baseLocationId, a status other than ACTIVE, OUT_OF_SERVICE or RETIRED, a coverage rule with an unknown ruleType, no serviceAreaId, a negative priority, a maxDistance that is a bare number or names an unknown unit, validTo before validFrom, or DISTANCE_TIER rules out of order, a maxDutyClass outside 1-8, a vin that is not exactly 17 characters or contains I, O or Q, or a plateRegion that is not an ISO 3166-2 code. fieldErrors names the field.'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'MOBILE_UNIT_NAME_TAKEN: the name is already taken at the base location, including a retired unit''s name; or MOBILE_UNIT_IDENTITY_TAKEN (fieldErrors names the field) when unitNumber, vin, or licensePlate+plateRegion is already held by another unit in the tenant.'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: LOCATION_NOT_FOUND, TRAVEL_BUFFER_POLICY_NOT_FOUND or SERVICE_AREA_NOT_FOUND (fieldErrors names the field) when an id names nothing; OUT_OF_SERVICE_REASON_REQUIRED when status is OUT_OF_SERVICE without a reason, or OTHER without a note; otherwise an ACTIVE unit without a travel buffer policy, capabilities and coverage rules, or a serviceCapabilityCode that is not an active catalog operation code.
      security:
      - bearerAuth:
        - location:mobile-unit:manage
      summary: Create a New Mobile Service Unit
      tags:
      - Mobile Unit API
      x-required-permissions:
      - location:mobile-unit:manage
  /v1/mobile-units/bulk-ingest:
    post:
      description: 'Creates many mobile units at once, one per record.

        Use this tool when commissioning a fleet or seeding an environment; use createMobileUnit instead for a single unit.

        Preconditions: each row''s base location must exist. A unit created ACTIVE must also carry a travel buffer policy, capabilities and coverage rules, which this record does not express — so seed units INACTIVE and activate them through createMobileUnit or a later update.

        Required inputs: jobId (UUID), locationId (UUID) and records, each with a name; a record''s own baseLocationId overrides the batch one.

        Emits a LOCATION_MOBILE_UNIT_MANAGE event and a unit-created event per row.

        Re-running the same file is safe: a name already present at its base location is reported as already existing rather than as a failure.

        Returns 200 with a per-record result; check each result''s errorCode rather than the status alone, which is MOBILE_UNIT_INGEST_FAILED with the reason for a row the service refused, or INTERNAL_ERROR with a correlationId to quote for a row lost to a server-side fault.

        '
      operationId: bulkIngestMobileUnits
      requestBody:
        content:
          application/json:
            examples:
              Mobile units:
                description: Mobile units
                value:
                  jobId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a00
                  locationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a10
                  operatorId: seed-operator
                  records:
                  - name: Van 01
                    status: INACTIVE
                  - name: Van 02
                    notes: Mobile tyre fitting
                    status: INACTIVE
            schema:
              $ref: '#/components/schemas/BulkIngestRequestMobileUnitBulkIngestRecord'
        description: Mobile units to create.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkIngestResponse'
          description: Batch processed; inspect per-record results
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request payload
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden
      security:
      - bearerAuth:
        - location:mobile-unit:manage
      summary: Create Mobile Units in Bulk
      tags:
      - Mobile Unit Bulk Ingest API
      x-required-permissions:
      - location:mobile-unit:manage
  /v1/mobile-units/{id}:
    delete:
      description: 'Retires a mobile unit by id: status becomes RETIRED and an update fact is published so replica consumers mark the row inactive rather than removing it. Nothing is hard-deleted, and the unit''s coverage rules are kept — they simply stop matching because the unit is no longer active.

        Use this tool to take a unit out of use for good; use patchMobileUnit with status OUT_OF_SERVICE instead for a temporary stand-down that records a reason, and patchMobileUnit with status ACTIVE or OUT_OF_SERVICE to bring a retired unit back into service.

        Preconditions: the unit must exist; there is no usage check, so callers must confirm the unit is not referenced by scheduled work first.

        Required inputs: id (UUID) as a path parameter; there is no request body.

        Emits a LOCATION_MOBILE_UNIT_DELETE audit event, but the Kafka fact replica consumers see is an ordinary location.mobile-unit.updated with status RETIRED, not a tombstone; the unit''s name stays reserved, so a later create or rename to the same name at the base location still returns 409 MOBILE_UNIT_NAME_TAKEN.

        Returns 204 on success and 404 when the mobile unit does not exist; retiring an already-RETIRED unit succeeds again rather than erroring.

        '
      operationId: deleteMobileUnit
      parameters:
      - description: ID of the mobile unit to delete
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: Mobile unit retired successfully.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks location:mobile-unit:manage.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Mobile unit not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: A concurrent update won the version race.
      security:
      - bearerAuth:
        - location:mobile-unit:manage
      summary: Retire a Mobile Unit
      tags:
      - Mobile Unit API
      x-required-permissions:
      - location:mobile-unit:manage
    get:
      description: 'Returns a single mobile unit with its status, base location, capability ids and travel buffer policy reference.

        Use this tool when the unit id is already known; use listMobileUnits instead to enumerate, and listCoverageRules to read the unit''s coverage separately.

        Preconditions: the mobile unit must exist.

        Required inputs: id (UUID) as a path parameter.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 404 when no mobile unit exists for the supplied id.

        '
      operationId: getMobileUnitById
      parameters:
      - description: Mobile unit ID
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileUnitResponse'
          description: Mobile unit returned.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Mobile unit not found.
      security:
      - bearerAuth:
        - location:mobile-unit:read
      summary: Get a Mobile Unit by Identifier
      tags:
      - Mobile Unit API
      x-required-permissions:
      - location:mobile-unit:read
    patch:
      description: 'Applies a partial update to a mobile unit, accepting the keys name, status, outOfServiceReason, outOfServiceNote, expectedReturnAt, notes, travelBufferPolicyId, serviceCapabilityCodes, maxDutyClass, unitNumber, vin, licensePlate and plateRegion.

        Use this tool for status transitions among ACTIVE, OUT_OF_SERVICE and RETIRED, travel-buffer-policy reassignment, replacing the unit''s capability claim, and changing its duty ceiling or identity fields; use replaceCoverageRules instead to change where the unit operates, and deleteMobileUnit instead to retire a unit for good.

        Preconditions: the unit must exist. The unit as it stands after the patch must satisfy what create demands of an ACTIVE unit, so an ACTIVE result needs a travelBufferPolicyId, at least one serviceCapabilityCode and at least one coverage rule already on the unit, and a resulting status of OUT_OF_SERVICE must carry outOfServiceReason, with outOfServiceNote also required for OTHER; returning to ACTIVE clears all three out-of-service fields regardless of what else is sent. serviceCapabilityCodes replaces the whole claim and every code must be an active catalog operationCode known to the location service''s catalog replica; maxDutyClass, when given, must be a GVWR class 1-8; vin, when given, must be exactly 17 characters excluding I, O and Q; plateRegion, when given, must be an ISO 3166-2 code; and unitNumber, vin, and licensePlate+plateRegion must each stay unique within the tenant, excluding the unit itself.

        Required inputs: id (UUID) as a path parameter and a JSON object of the fields to change. name must be non-blank text, unique (ignoring case, including a retired unit''s name) at the unit''s base location; status must be ACTIVE, OUT_OF_SERVICE or RETIRED (any case; null is refused); notes is text or null; travelBufferPolicyId is null to clear it or the id of an existing policy; serviceCapabilityCodes is an array; maxDutyClass, unitNumber, vin, licensePlate and plateRegion are each cleared by sending null, and the four identity fields are display only, never read by scheduling; other keys are ignored.

        Emits a LOCATION_MOBILE_UNIT_UPDATE event.

        Returns 200 with the updated unit; 404 NOT_FOUND when the unit does not exist; 400 VALIDATION_ERROR with fieldErrors for a value of the wrong shape, an out-of-range maxDutyClass, or a malformed vin or plateRegion; 409 MOBILE_UNIT_NAME_TAKEN when the new name is taken at the base location, 409 MOBILE_UNIT_IDENTITY_TAKEN with fieldErrors when the new unitNumber, vin, or licensePlate+plateRegion collides with another unit in the tenant, or 409 when a concurrent update won the version race; 422 TRAVEL_BUFFER_POLICY_NOT_FOUND or OUT_OF_SERVICE_REASON_REQUIRED with fieldErrors for an unknown policy or a missing/incomplete out-of-service reason, and 422 when the result would be an incomplete ACTIVE unit or a capability code is unknown; nothing is saved on any refusal.

        '
      operationId: patchMobileUnit
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Deactivate unit:
                description: Deactivate unit
                value:
                  notes: Winter maintenance
                  status: INACTIVE
            schema:
              type: object
        description: Free-form patch object; only the keys name, status, notes, travelBufferPolicyId and serviceCapabilityCodes are recognized.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileUnitResponse'
          description: Mobile unit updated.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'VALIDATION_ERROR: blank or non-text name, a status other than ACTIVE, OUT_OF_SERVICE or RETIRED (null included), non-text notes, a travelBufferPolicyId that is not a UUID, serviceCapabilityCodes that is not an array, a maxDutyClass outside 1-8, a non-numeric maxDutyClass, a vin that is not exactly 17 characters or contains I, O or Q, a plateRegion that is not an ISO 3166-2 code, or a non-text unitNumber/vin/licensePlate/plateRegion. fieldErrors names the field.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks location:mobile-unit:manage.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Mobile unit not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: MOBILE_UNIT_NAME_TAKEN when the new name is taken at the base location (including a retired unit's name); MOBILE_UNIT_IDENTITY_TAKEN (fieldErrors names the field) when the new unitNumber, vin, or licensePlate+plateRegion is already held by another unit in the tenant; or OPTIMISTIC_LOCK_FAILED when a concurrent update won the version race.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: TRAVEL_BUFFER_POLICY_NOT_FOUND (fieldErrors names travelBufferPolicyId) for an unknown policy; OUT_OF_SERVICE_REASON_REQUIRED when the resulting status is OUT_OF_SERVICE without a reason, or OTHER without a note; otherwise the unit would be ACTIVE after the patch without a travel buffer policy, capabilities and coverage rules, or a serviceCapabilityCode is not an active catalog operation code.
      security:
      - bearerAuth:
        - location:mobile-unit:manage
      summary: Patch Fields of a Mobile Unit
      tags:
      - Mobile Unit API
      x-required-permissions:
      - location:mobile-unit:manage
  /v1/mobile-units/{id}/coverage-rules:
    get:
      description: 'Returns the coverage rules of a mobile unit ordered by ascending priority.

        Use this tool to inspect where a unit currently operates; use findEligibleMobileUnits instead to answer which units cover a given postal code.

        Preconditions: none; an unknown unit id yields an empty list rather than an error.

        Required inputs: id (UUID) as a path parameter.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 with the ordered rule list, empty when the unit has no rules or does not exist.

        '
      operationId: listCoverageRules
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CoverageRuleResponse'
                type: array
          description: Coverage rules returned.
      security:
      - bearerAuth:
        - location:mobile-unit:read
      summary: Get Coverage Rules of Mobile Unit
      tags:
      - Mobile Unit API
      x-required-permissions:
      - location:mobile-unit:read
    put:
      description: 'Atomically replaces the full set of coverage rules for a mobile unit, deleting the existing rules and inserting the supplied ones in one transaction.

        Use this tool whenever coverage changes, sending the complete desired rule set; do not use patchMobileUnit, which cannot modify coverage.

        Preconditions: the mobile unit must exist; every rule''s serviceAreaId must name an existing service area; DISTANCE_TIER rules must be strictly ascending by maxDistance and end with one null catch-all tier; an ACTIVE unit must keep at least one rule. The replacement set is checked in full before the existing rules are touched, so a refusal changes nothing.

        Required inputs: id (UUID) as a path parameter and a body of the form {"rules": [...]}, each rule carrying ruleType (SERVICE_AREA or DISTANCE_TIER, any case) and serviceAreaId, and optionally priority (non-negative, defaults to 0), validFrom, validTo (not before validFrom) and maxDistance, an explicit {value, unit} object (KM or MI, DECISION-LOCATION-028) converted and stored as kilometres; a bare number is refused.

        Emits a LOCATION_COVERAGE_RULES_REPLACE event.

        Returns 200 with the saved rules ordered by priority; 400 VALIDATION_ERROR with fieldErrors (rules[i].field) for a malformed rule or tiers out of order; 404 when the mobile unit does not exist; 422 SERVICE_AREA_NOT_FOUND with fieldErrors for an unknown service area, and 422 when the set would leave an ACTIVE unit with no rules. An omitted or empty rules array clears all coverage of an INACTIVE unit.

        '
      operationId: replaceCoverageRules
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Single service-area rule:
                description: Single service-area rule
                value:
                  rules:
                  - priority: 1
                    ruleType: SERVICE_AREA
                    serviceAreaId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a03
                    validFrom: '2026-06-18'
                    validTo: '2026-12-31'
            schema:
              type: object
        description: Envelope holding the complete replacement rule set under the "rules" key; existing rules not present here are deleted.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CoverageRuleResponse'
                type: array
          description: Coverage rules replaced successfully.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'VALIDATION_ERROR: rules is not an array, or a rule has an unknown ruleType, no serviceAreaId, a value of the wrong type, a negative priority, a maxDistance that is a bare number or names an unknown unit, validTo before validFrom, or the DISTANCE_TIER rules are out of order. fieldErrors names the field.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Mobile unit not found.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: SERVICE_AREA_NOT_FOUND (fieldErrors names rules[i].serviceAreaId) for an unknown service area, or the replacement would leave an ACTIVE unit with no coverage rules.
      security:
      - bearerAuth:
        - location:mobile-unit:manage
      summary: Replace Coverage Rules for Mobile Unit
      tags:
      - Mobile Unit API
      x-required-permissions:
      - location:mobile-unit:manage
  /v1/mobile-units:eligible:
    get:
      description: 'Finds the ACTIVE mobile units based at baseLocationId whose coverage rules include a postal code at a given instant, ordered by priority ascending and then by unit id, one deterministic ranking across that location''s units (DECISION-LOCATION-027).

        Use this tool when dispatching a mobile service request to a customer address at a known location; use listMobileUnits instead for plain enumeration without eligibility matching.

        Preconditions: coverage rules must already link units to service areas containing the postal code; only rules on an active service area match, units whose status is not ACTIVE are excluded, and a unit only takes work from its own base location (DECISION-SHOPMGMT-023 rule 1).

        Required inputs: postalCode, countryCode, at (an ISO-8601 instant) and baseLocationId, all mandatory; validFrom/validTo are matched against at as UTC instants, validFrom inclusive and validTo exclusive. operationCodes is optional and, when sent, a unit must claim every code listed (units have no general-work default).

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 with the eligible units, empty when nothing covers the address on that instant, 400 VALIDATION_ERROR with fieldErrors naming baseLocationId when it is missing, and 403 LOCATION_SCOPE_DENIED when baseLocationId is outside a location-scoped caller''s reach (ADR-0061, gated the same way as listMobileUnits'' baseLocationId filter).

        '
      operationId: findEligibleMobileUnits
      parameters:
      - in: query
        name: postalCode
        required: true
        schema:
          type: string
      - in: query
        name: countryCode
        required: true
        schema:
          type: string
      - in: query
        name: at
        required: true
        schema:
          format: date-time
          type: string
      - description: Only units based at this location
        example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a01
        in: query
        name: baseLocationId
        required: true
        schema:
          format: uuid
          type: string
      - description: Operation codes the unit must claim every one of; optional
        example: OIL-CHANGE-FULL-SYNTHETIC
        in: query
        name: operationCodes
        required: false
        schema:
          items:
            type: string
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/EligibleMobileUnitResponse'
                type: array
          description: Eligible mobile units returned.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'VALIDATION_ERROR: baseLocationId is missing or not a UUID.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks location:mobile-unit:read, or (LOCATION_SCOPE_DENIED) the named baseLocationId is outside a location-scoped caller's reach.
      security:
      - bearerAuth:
        - location:mobile-unit:read
      summary: Find Eligible Mobile Units for Address and Base Location
      tags:
      - mobile-unit-eligibility-controller
      x-required-permissions:
      - location:mobile-unit:read
  /v1/service-areas:
    get:
      description: 'Lists all configured service areas with their postal code sets and active flags.

        Use this tool to discover area ids for coverage rules; use listCoverageRules instead to see which areas a specific mobile unit uses.

        Preconditions: none beyond the location:service-area:read authority.

        Required inputs: none; there are no parameters, no paging and no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 with the full unpaginated list.

        '
      operationId: listServiceAreas
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ServiceAreaResponse'
                type: array
          description: Service areas listed
      security:
      - bearerAuth:
        - location:service-area:read
      summary: List All Configured Service Areas
      tags:
      - Service Area API
      x-required-permissions:
      - location:service-area:read
    post:
      description: 'Creates a service area, a named set of postal codes that defines where mobile coverage can be offered.

        Use this tool before wiring coverage rules that reference the area; do not use patchServiceArea, which edits an existing area.

        Preconditions: at least one postal code entry must be supplied and every entry must carry a countryCode (at most 2 characters) and a postalCode (at most 20 characters); the name must not collide with an existing service area.

        Required inputs: name and postalCodes, each entry with postalCode and countryCode; description is optional and active defaults to true.

        Emits a LOCATION_SERVICE_AREA_CREATE event.

        Returns 201 with the created area, 400 VALIDATION_ERROR with fieldErrors for a blank name, an empty postal code set or an entry that is blank or too long, and 409 SERVICE_AREA_NAME_TAKEN when the name is already taken (SERVICE_AREA_CONFLICT for any other uniqueness conflict). Nothing is stored on a refusal.

        '
      operationId: createServiceArea
      requestBody:
        content:
          application/json:
            examples:
              Metro area:
                description: Metro area
                value:
                  active: true
                  description: Northern metropolitan coverage zone
                  name: North Metro
                  postalCodes:
                  - countryCode: US
                    postalCode: '62704'
                  - countryCode: US
                    postalCode: '62711'
            schema:
              $ref: '#/components/schemas/ServiceAreaRequest'
        description: Service area to create, defined by its postal code and country code entries.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAreaResponse'
          description: Service area created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'VALIDATION_ERROR: blank or over-long name, an empty postal code set, or an entry with a blank or over-long postalCode (max 20) or countryCode (max 2)'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'SERVICE_AREA_NAME_TAKEN: the name is already taken (or SERVICE_AREA_CONFLICT for another uniqueness conflict)'
      security:
      - bearerAuth:
        - location:service-area:manage
      summary: Create a Postal Code Service Area
      tags:
      - Service Area API
      x-required-permissions:
      - location:service-area:manage
  /v1/service-areas/{id}:
    patch:
      description: 'Applies a partial update to a service area, accepting the keys name, description and active; a key that is absent leaves that field unchanged.

        Use this tool to rename an area, retire it with active=false or amend its description; do not use it to change which postal codes an area covers, use replaceServiceAreaPostalCodes instead.

        Preconditions: the service area must exist; a new name must not collide with another service area.

        Required inputs: id (UUID) as a path parameter and a JSON object where name is non-blank text, description is text or null (which clears it) and active is a JSON boolean, so null, "yes" or 1 are refused rather than read as false; keys other than these are silently ignored.

        Emits a LOCATION_SERVICE_AREA_PATCH event.

        Returns 400 when the id is not a valid UUID, 400 VALIDATION_ERROR with fieldErrors when name, description or active has the wrong type, 404 when no service area exists for the id and 409 SERVICE_AREA_NAME_TAKEN when another area already holds the new name (SERVICE_AREA_CONFLICT for any other uniqueness conflict); a refused patch changes nothing.

        '
      operationId: patchServiceArea
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Retire area:
                description: Retire area
                value:
                  active: false
                  description: Retired winter zone
            schema:
              type: object
        description: Free-form patch object; only the keys name, description and active are recognized. Omit a key to leave it unchanged; description null clears it; active must be a JSON boolean.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAreaResponse'
          description: Service area patched
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'Invalid service area id, or VALIDATION_ERROR: name is blank or not text, description is not text or null, or active is not a JSON boolean (fieldErrors names the field)'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Service area not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'SERVICE_AREA_NAME_TAKEN: the new name is already held by another service area (or SERVICE_AREA_CONFLICT for another uniqueness conflict)'
      security:
      - bearerAuth:
        - location:service-area:manage
      summary: Patch Fields of a Service Area
      tags:
      - Service Area API
      x-required-permissions:
      - location:service-area:manage
  /v1/service-areas/{id}/postal-codes:
    put:
      description: 'Replaces the whole postal code set of a service area, so the area afterwards covers exactly the codes supplied and nothing else.

        Use this tool whenever coverage changes — a market expands, a rural route is dropped, or an area was created with the wrong codes; patchServiceArea cannot touch postal codes and there is no way to delete an area and start again.

        Preconditions: the service area must exist; at least one postal code entry must be supplied and every entry must carry a countryCode. Sending an empty set is refused rather than treated as "covers nothing" — retire an area with patchServiceArea active=false instead.

        Required inputs: id (UUID) as a path parameter and a body of the form {"postalCodes": [...]}, each entry carrying postalCode and countryCode.

        Emits a LOCATION_SERVICE_AREA_POSTAL_CODES_REPLACE event.

        Returns 200 with the area as it stands afterwards, 400 when the id is not a valid UUID or the set is empty or has an entry with a blank or over-long postalCode (max 20) or countryCode (max 2), 404 when no service area exists for the id and 409 SERVICE_AREA_CONFLICT when the replacement trips a uniqueness constraint.

        Coverage resolution reads these rows directly: findEligibleMobileUnits matches an address through them, so removing a code stops every mobile unit covering that address.

        '
      operationId: replaceServiceAreaPostalCodes
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Expanded metro coverage:
                description: Expanded metro coverage
                value:
                  postalCodes:
                  - countryCode: US
                    postalCode: '62704'
                  - countryCode: US
                    postalCode: '62711'
                  - countryCode: US
                    postalCode: '62702'
            schema:
              $ref: '#/components/schemas/ServiceAreaPostalCodesRequest'
        description: The complete postal code set the area should cover afterwards; any code absent here stops being covered.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAreaResponse'
          description: Postal codes replaced
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid service area id, or an empty, incomplete or over-long set
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Service area not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'SERVICE_AREA_CONFLICT: the replacement trips a uniqueness constraint'
      security:
      - bearerAuth:
        - location:service-area:manage
      summary: Replace the Postal Codes a Service Area Covers
      tags:
      - Service Area API
      x-required-permissions:
      - location:service-area:manage
  /v1/storage-locations/{storageLocationId}/validation:
    get:
      description: 'Returns existence, active status, owning site id and maximum unit capacity for a storage location id without requiring the site to be known.

        Use this tool for inter-service reference validation before storing a storageLocationId; use getStorageLocation instead when the full record is needed and the site id is known.

        Preconditions: none; unknown ids are a valid input.

