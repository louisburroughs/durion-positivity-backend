          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        coverageRules:
          description: Coverage rules defining where the mobile unit can operate. Required, non-empty, for an ACTIVE unit.
          items:
            $ref: '#/components/schemas/CoverageRuleRequest'
          type: array
        expectedReturnAt:
          description: Advisory expected return-to-service time; not used by scheduling.
          example: '2026-07-01T08:00:00Z'
          format: date-time
          type: string
        licensePlate:
          description: License plate number, paired with plateRegion for uniqueness; display only; not used by scheduling. Unique per tenant together with plateRegion when both are set; a patch can clear it with null.
          example: ABC-1234
          maxLength: 16
          minLength: 0
          type: string
        maxDutyClass:
          description: Heaviest GVWR class (1-8) the unit accepts; omit for unconstrained (DECISION-LOCATION-029, the bay's axis per CAP-325 D13).
          example: 3
          format: int32
          maximum: 8
          minimum: 1
          type: integer
        name:
          description: Display name of the mobile unit
          example: Van 7
          minLength: 1
          type: string
        notes:
          description: Free-text notes about the mobile unit
          example: Equipped with hydraulic lift
          type: string
        outOfServiceNote:
          description: Free-text detail for outOfServiceReason (max 255 characters); required when outOfServiceReason is OTHER, optional otherwise.
          example: Awaiting hydraulic lift inspection
          maxLength: 255
          minLength: 0
          type: string
        outOfServiceReason:
          description: Reason the unit is OUT_OF_SERVICE (DECISION-LOCATION-026); required when status is OUT_OF_SERVICE, refused with 422 OUT_OF_SERVICE_REASON_REQUIRED otherwise. Defaults to OTHER when status is omitted entirely.
          enum:
          - EQUIPMENT_FAILURE
          - SCHEDULED_MAINTENANCE
          - INSPECTION
          - SAFETY_HOLD
          - FACILITY_ISSUE
          - OTHER
          example: EQUIPMENT_FAILURE
          type: string
        plateRegion:
          description: ISO 3166-2 region code for licensePlate (for example US-NC), normalized to upper case; rejected with 400 unless it matches that format. Display only; not used by scheduling. Unique per tenant together with licensePlate when both are set; a patch can clear it with null.
          example: US-NC
          maxLength: 6
          minLength: 0
          type: string
        serviceCapabilityCodes:
          description: 'Catalog operation codes this unit can perform off-site (CAP-325 D14): each must be an active catalog operationCode (UPPER-DASH, ADR-0059 §3), matched case-insensitively; unknown or retired codes are rejected 422. Required, non-empty, for an ACTIVE unit. Used by the eligible mobile-unit lookup (GET /v1/mobile-units:eligible), whose operationCodes filter keeps only units that claim every requested code.'
