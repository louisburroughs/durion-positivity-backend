              General service bay:
                description: General service bay
                value:
                  bayType: GENERAL_SERVICE
                  capacity:
                    maxConcurrentVehicles: 2
                  maxDutyClass: 3
                  name: Bay A1
                  serviceCapabilityCodes: []
                  status: ACTIVE
            schema:
              $ref: '#/components/schemas/BayRequest'
        description: Service bay to create, with its type classification and concurrent vehicle capacity.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BayResponse'
          description: Bay created successfully.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: locationId is not a UUID, or the payload is invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks location:bay:manage, or holds it but its location scope does not cover locationId (ApiError.code LOCATION_SCOPE_DENIED, see ../durion/docs/architecture/api/ERROR_ENVELOPE.md).
        '404':
