    StorageLocationBulkIngestRecord:
      description: One storage location to create at a site
      properties:
        allowNewProduct:
          description: Mixing policy for new products
          enum:
          - MIXED
          - SAME_PRODUCT_ONLY
          - EMPTY_ONLY
          example: MIXED
          type: string
        hazardContainment:
          description: Whether the location has spill containment
          example: false
          type: boolean
        maxUnitCount:
          description: Maximum units the location holds. This is the cap only — the fill is real stock, never a declared number.
          example: 500
          format: int32
          type: integer
        name:
          description: Name of the storage location, unique within its site
          example: Bin A-01
          minLength: 1
          type: string
        parentName:
          description: Name of the parent location within the same site. Resolved against locations already at the site and those created earlier in the same batch, so a file may create a shelf and its bins in one call as long as the shelf comes first.
          example: Parts Shelf A
          type: string
        siteId:
          description: Site the location belongs to. Defaults to the request's locationId when omitted, so a single-site file need not repeat it.
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a10
          format: uuid
          type: string
        status:
          description: Status to apply. Creation always produces an ACTIVE location, so anything else is applied as a follow-up update.
          enum:
          - ACTIVE
          - INACTIVE
          - MAINTENANCE
          - QUARANTINED
          example: INACTIVE
          type: string
        storageCategoryCode:
          description: 'What the location is fit to hold, which is independent of its physical type: a tire rack and a bulk pallet area are both shelves or floors.'
          enum:
          - TIRE_RACK
          - OIL_STORAGE
          - BATTERY_RACK
          - SMALL_PARTS_BIN
          - BULK_FLOOR
          - STAGING
          - QUARANTINE
          - GENERAL
          example: SMALL_PARTS_BIN
          type: string
        type:
          description: Physical topology of the location
          enum:
          - FLOOR
          - SHELF
          - BIN
          - CAGE
          - TRUCK
          example: BIN
          type: string
      required:
      - name
      - type
      type: object
    StorageLocationPatchRequest:
