    patch:
      description: 'Applies a partial update to a bay, changing only the supplied fields: name, bayType, status, the out-of-service reason/note/expected-return fields, displayOrder, capacity and the serviceCapabilityCodes specialty claim, and maxDutyClass. A field left out or sent as null is unchanged, with two exceptions. maxDutyClass: omit it to leave the limit alone, send JSON null to clear it back to no limit, or send a class from 1 to 8 to set it. serviceCapabilityCodes: when bayType actually changes and the codes are not sent, they reset to the new type''s default specialty codes; codes sent in the same request win, the same bayType does not reset them, and an empty list clears the bay to general.

        Use this tool for status transitions among ACTIVE, OUT_OF_SERVICE and RETIRED and for capacity changes; do not use createBay, which adds a new bay, and do not use this tool to retire a bay for good — use deleteBay, which also sets RETIRED.

        Preconditions: the location must exist, the bay must belong to it, a new name must not collide with another bay at the same location (including a retired one), and a resulting status of OUT_OF_SERVICE must carry outOfServiceReason, with outOfServiceNote also required for OTHER; returning to ACTIVE clears all three fields regardless of what else is sent.

        Required inputs: locationId and bayId (UUIDs) as path parameters and a body with at least one field; capacity.maxConcurrentVehicles, when supplied, must be at least 1.

        Emits a LOCATION_BAY_UPDATE event; no other records are touched.

        Returns 400 when either id does not parse as a UUID or a field fails validation (maxDutyClass outside 1-8, outOfServiceNote over 255 characters), 403 LOCATION_SCOPE_DENIED when a location-scoped location:bay:manage grant does not cover locationId (ADR-0061), 404 when the location or bay does not exist, 409 when the new name is already taken at that location, 422 when serviceCapabilityCodes names a blank, unknown or retired catalog operation code, and 422 OUT_OF_SERVICE_REASON_REQUIRED when the resulting status is OUT_OF_SERVICE without a reason, or with OTHER and no note.

        '
      operationId: patchBay
