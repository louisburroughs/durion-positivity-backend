          format: uuid
          type: string
        unitNumber:
          description: Fleet/unit number painted on the vehicle; display only; not used by scheduling. Unique per tenant when set; a patch can clear it with null.
          example: Fleet-107
          maxLength: 32
          minLength: 0
          type: string
        vin:
          description: 17-character vehicle identification number (ISO 3779), normalized to upper case; rejected with 400 unless it is exactly 17 characters and excludes I, O and Q. Display only; not used by scheduling. Unique per tenant when set; a patch can clear it with null.
          example: 1HGCM82633A004352
          maxLength: 17
          minLength: 17
          type: string
