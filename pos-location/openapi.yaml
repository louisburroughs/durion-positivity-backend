          minLength: 1
        bufferType:
          type: string
          description: Type of buffer the policy applies
          example: FIXED_MINUTES
          minLength: 1
        bufferValue:
          type: number
          description: Numeric value of the buffer (interpretation depends on buffer type)
          example: 30
