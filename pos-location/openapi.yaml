          example: Van 01
          minLength: 1
          type: string
        notes:
          description: Free-text notes
          example: Mobile tyre fitting
          type: string
        status:
          description: Unit status; defaults to OUT_OF_SERVICE (reason OTHER). A unit created ACTIVE must also carry a travel buffer policy, capabilities and coverage rules, none of which this record expresses — so an ACTIVE row is rejected by the service rather than created half-configured.
          example: OUT_OF_SERVICE
