          type: string
          description: Identifier of the operator submitting the batch
          example: user-jdoe
      required:
      - jobId
      - locationId
      - records
    LocationBulkIngestRecord:
      type: object
      description: A single location record within a bulk ingest request
      properties:
        name:
          type: string
          description: Display name of the location
          example: Downtown Service Center
          minLength: 1
        code:
          type: string
          description: Unique business code of the location
          example: LOC-001
          minLength: 1
        addressLine1:
          type: string
          description: First line of the street address
          example: 123 Main St
        addressLine2:
          type: string
          description: Second line of the street address
          example: Suite 200
        city:
          type: string
          description: City of the location
          example: Springfield
        stateOrProvince:
          type: string
          description: State or province of the location
          example: IL
        postalCode:
          type: string
          description: Postal or ZIP code of the location
          example: '62704'
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 country code
          example: US
        phoneNumber:
          type: string
          description: Primary phone number for the location
          example: +1-217-555-0100
        active:
          type: boolean
          description: Whether the location is active
          example: true
        locationTypeName:
          type: string
          description: Name of the location type to resolve during ingest
          example: STORE
      required:
      - code
      - name
    BulkIngestResponse:
      type: object
      description: 'Summary outcome of a bulk ingest job: per-record results plus aggregate counts'
      properties:
        totalSubmitted:
          type: integer
          format: int32
          description: Total number of records submitted in the batch
          example: 100
        successCount:
          type: integer
          format: int32
          description: Number of records ingested successfully
          example: 98
        failureCount:
          type: integer
          format: int32
          description: Number of records that failed ingest
          example: 2
        results:
          type: array
          description: Per-record outcomes in submission order
          items:
            $ref: '#/components/schemas/BulkIngestResult'
      required:
      - failureCount
      - results
      - successCount
      - totalSubmitted
    BulkIngestResult:
      type: object
      description: Per-record outcome of a bulk ingest submission
      properties:
        rowIndex:
          type: integer
          format: int32
          description: Zero-based index of the record within the submitted batch
          example: 0
        entityId:
          type: string
          format: uuid
          description: Identifier of the entity created/updated for this record, when successful
          example: 01960003-0000-7000-8000-000000000001
        success:
          type: boolean
          description: Whether this record was ingested successfully
          example: true
        errorCode:
          type: string
          description: Machine-readable error code when the record failed
          example: VALIDATION_FAILED
        errorMessage:
          type: string
          description: Human-readable error detail when the record failed
          example: vin must be 17 characters
      required:
      - rowIndex
      - success
