    post:
      description: 'Creates a service bay under a location with a type classification, concurrency capacity, an optional serviceCapabilityCodes specialty claim and an optional maxDutyClass. Leaving serviceCapabilityCodes out (or null) applies the bay type''s default specialty codes; an explicit empty list makes a general bay with no specialty claim.

        Use this tool when adding physical work capacity to a shop; do not use patchBay, which modifies a bay that already exists, and use createStorageLocation for inventory storage rather than vehicle bays.

        Preconditions: the location must exist, no bay of that location may already use the name (case-insensitive, including a retired bay''s name), any serviceCapabilityCodes must name active catalog operation codes (GENERAL_SERVICE, HEAVY_DUTY and WASH_DETAIL have no default codes), and a status of OUT_OF_SERVICE must carry outOfServiceReason, with outOfServiceNote also required for OTHER.

        Required inputs: name, bayType (one of GENERAL_SERVICE, ALIGNMENT, TIRE_SERVICE, HEAVY_DUTY, INSPECTION or WASH_DETAIL) and capacity.maxConcurrentVehicles of at least 1; status is optional and defaults to ACTIVE, also accepting OUT_OF_SERVICE or RETIRED; displayOrder is optional and controls list ordering.

        Emits a LOCATION_BAY_CREATE event; no other records are touched.

        Returns 400 when locationId does not parse as a UUID, 403 LOCATION_SCOPE_DENIED when a location-scoped location:bay:manage grant does not cover locationId (ADR-0061), 404 when the location does not exist, 409 when the bay name is already taken at that location (including a retired bay), 422 when serviceCapabilityCodes names a blank, unknown or retired catalog operation code, and 422 OUT_OF_SERVICE_REASON_REQUIRED when status is OUT_OF_SERVICE without a reason, or with OTHER and no note.

        '
      operationId: createBay
      parameters:
