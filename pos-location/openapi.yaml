  /v1/locations/{locationId}/bays/{bayId}:
    delete:
      description: 'Retires a bay by id: status becomes RETIRED and an update fact is published so replica consumers mark the row inactive rather than removing it. Nothing is hard-deleted.

        Use this tool to take a bay out of use for good; use patchBay with status OUT_OF_SERVICE instead for a temporary stand-down that records a reason, and patchBay with status ACTIVE or OUT_OF_SERVICE to bring a retired bay back into service.

        Preconditions: the location must exist and the bay must belong to it; there is no usage check, so callers must confirm the bay is not referenced by scheduled work first.

        Required inputs: locationId and bayId (UUIDs) as path parameters; there is no request body.

        Emits a LOCATION_BAY_DELETE audit event, but the Kafka fact replica consumers see is an ordinary location.bay.updated with status RETIRED, not a tombstone; the bay''s name stays reserved, so a later create or rename to the same name at this location still returns 409 BAY_NAME_TAKEN.

        Returns 204 on success, 400 when either id does not parse as a UUID, 403 LOCATION_SCOPE_DENIED when a location-scoped location:bay:manage grant does not cover locationId (ADR-0061), and 404 when the location or bay does not exist; retiring an already-RETIRED bay succeeds again rather than erroring.

        '
      operationId: deleteBay
      parameters:
      - description: Location ID
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
        in: path
        name: locationId
        required: true
        schema:
          type: string
      - description: ID of the bay to delete
        example: 018e1c9f-6b5a-7890-abcd-1234567890cd
        in: path
        name: bayId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Bay retired successfully.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: locationId or bayId is not a UUID.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks location:bay:manage, or holds it but its location scope does not cover locationId (ApiError.code LOCATION_SCOPE_DENIED, see ../durion/docs/architecture/api/ERROR_ENVELOPE.md).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
