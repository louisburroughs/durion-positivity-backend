  /v1/locations/{locationId}/descendants:
    get:
      tags:
      - Location API
      summary: Get all descendants for a location
      description: Walk typed parent-child edges downward from a location and return every descendant as a flat list with its immediate parent id and depth (1 = direct child). Traversal is cycle-safe and depth-capped at 20.
      operationId: getDescendants
      parameters:
      - name: locationId
        in: path
        description: ID of the root location
        required: true
        schema:
          type: string
          format: uuid
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
      - name: parentType
        in: query
        description: Parent relationship type to traverse (defaults to PHYSICAL)
        required: false
        schema:
          type: string
          default: PHYSICAL
      responses:
        '200':
          description: List of descendant locations returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationDescendantResponseDTO'
        '400':
          description: Invalid parentType value.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationDescendantResponseDTO'
        '404':
          description: Location not found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationDescendantResponseDTO'
      security:
      - bearerAuth:
        - location:read
      x-required-permissions:
      - location:read
  /v1/locations/{locationId}/children:
    get:
      tags:
      - Location API
      summary: Get all children for a location
      description: Retrieve all child locations for a given parent location.
      operationId: getAllChildren
      parameters:
      - name: locationId
        in: path
        description: ID of the parent location
        required: true
        schema:
          type: string
          format: uuid
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
      - name: parentType
        in: query
        description: Optional parent relationship type filter
        required: false
        schema:
          type: string
      responses:
        '200':
          description: List of child locations returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationResponseDTO'
      security:
      - bearerAuth:
        - location:read
      x-required-permissions:
      - location:read
  /v1/locations/roster:
