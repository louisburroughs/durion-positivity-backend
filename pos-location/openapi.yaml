openapi: 3.1.0
info:
  contact:
    email: louis.burroughs@gmail.com
    name: Durion Support Services
  description: API documentation for the Shop Location service, accessible via the API Gateway. Shop locations are Maintenance Bays and Mobile Shops.
  title: Positivity Location API
  version: v1
servers:
- description: API Gateway
  url: http://api-gateway.local/v1/location
tags:
- description: Operations for managing storage locations within a site
  name: Storage Location API
- description: Operations for managing mobile units within locations
  name: Mobile Unit API
- description: Operations for managing travel buffer policies
  name: Travel Buffer Policy API
- description: Bulk import locations
  name: Location Bulk Ingest API
- description: Operations for managing bays within locations
  name: Bay API
- description: Operations for managing location site default settings
  name: Site Defaults API
- description: Bulk import service bays
  name: Bay Bulk Ingest API
- description: Bulk import mobile units
  name: Mobile Unit Bulk Ingest API
- description: Operations for managing service areas
  name: Service Area API
- description: Bulk import a site's storage topology
  name: Storage Location Bulk Ingest API
- description: Operations related to locations and their relationships
  name: Location API
paths:
  /v1/locations:
    get:
      description: 'Lists every location in the system as a flat, unpaginated collection with address, status and type details, plus a query-time repair-capability projection: hasRepairCapability, activeBayCount and activeMobileUnitCount.

        Use this tool when a complete location inventory is needed at once, including when deciding which locations can perform repairs; use getLocationRoster instead for a paginated sync feed with status and updated-since filtering, do not use it to fetch a single known id, which is getLocationById, and do not fan out over listBays or listMobileUnits per location to derive repair capability.

        Preconditions: none beyond the location:read authority; an empty system returns an empty list.

        Required inputs: none; there are no parameters and no request body, and there is no capability filter parameter, so narrow on hasRepairCapability after the call.

        No events are emitted and no state changes; this is a read-only projection recomputed on every request, so a bay or mobile unit that was just created, restatused or re-based is reflected immediately.

        Returns 200 with the full list; there are no business error conditions for this operation. activeBayCount counts only bays with status ACTIVE, activeMobileUnitCount only mobile units with status ACTIVE, hasRepairCapability is true when either count is above zero, and an inactive location always reports false with zero counts.

        '
      operationId: listLocations
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LocationResponseDTO'
                type: array
          description: List of locations returned successfully.
      security:
      - bearerAuth:
        - location:read
      summary: List All Locations Without Pagination
      tags:
      - Location API
      x-required-permissions:
      - location:read
    post:
      description: 'Creates a location with address, timezone, operating hours, scheduling buffers and type classification, defaulting status to ACTIVE.

        Use this tool when registering a new physical or logical site; do not use updateLocation, which replaces an existing location, and use bulkIngestLocations for batch imports.

        Preconditions: no existing location may share the same name (case-insensitive) or code, and a type referenced by id must already exist; a type given only by name is created on the fly.

        Required inputs: name, code and type (id or name); timezone must be a valid IANA zone id, operatingHours entries must have unique dayOfWeek values with openTime before closeTime, and active defaults to true.

        Emits a LOCATION_LOCATION_CREATE event and publishes a location fact for replica consumers.

        Returns 409 when the name or code is already taken, 422 when the timezone or operating hours are invalid, and 400 when a referenced location type id is unknown.

        '
      operationId: createLocation
      requestBody:
        content:
          application/json:
            examples:
              Store location:
                description: Store location
                value:
                  active: true
                  addressLine1: 123 Main St
                  checkInBufferMinutes: 15
                  city: Springfield
                  cleanupBufferMinutes: 10
                  code: LOC-001
                  country: US
                  name: Downtown Service Center
                  operatingHours:
                  - closeTime: 1020
                    dayOfWeek: MONDAY
                    openTime: 08:00
                  postalCode: '62704'
                  responsiblePersonId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  state: IL
                  timezone: America/Chicago
                  type:
                    name: STORE
            schema:
              $ref: '#/components/schemas/LocationRequestDTO'
        description: Location to create, including its type and optional address, timezone and operating-hours configuration.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponseDTO'
          description: Location created successfully.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponseDTO'
          description: Location name or code already taken.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponseDTO'
          description: Invalid timezone or operating hours.
      security:
      - bearerAuth:
        - location:write
      summary: Create a New Location Record
      tags:
      - Location API
      x-required-permissions:
      - location:write
  /v1/locations/bays/bulk-ingest:
    post:
      description: 'Creates many service bays at once, one per record.

        Use this tool when commissioning a location or seeding an environment; use createBay instead for a single bay.

        Preconditions: each row''s location must exist, and bayType must name a known bay type.

        Required inputs: jobId (UUID), locationId (UUID) and records, each with a name, a bayType and maxConcurrentVehicles; a record''s own locationId overrides the batch one.

        Emits a LOCATION_BAY_BULK_INGEST event and a bay-created event per row.

        Re-running the same file is safe: a bay name already present at its location is reported as already existing rather than as a failure.

        Returns 200 with a per-record result; check each result rather than the status alone.

        '
      operationId: bulkIngestBays
      requestBody:
        content:
          application/json:
            examples:
              Bays:
                description: Bays
                value:
                  jobId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a00
                  locationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a10
                  operatorId: seed-operator
                  records:
                  - bayType: GENERAL_SERVICE
                    maxConcurrentVehicles: 1
                    name: Bay 1
                  - bayType: ALIGNMENT
                    maxConcurrentVehicles: 1
                    name: Alignment Bay
            schema:
              $ref: '#/components/schemas/BulkIngestRequestBayBulkIngestRecord'
        description: Service bays to create.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkIngestResponse'
          description: Batch processed; inspect per-record results
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkIngestResponse'
          description: Invalid request payload
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkIngestResponse'
          description: Forbidden
      security:
      - bearerAuth:
        - location:bay:manage
      summary: Create Service Bays in Bulk
      tags:
      - Bay Bulk Ingest API
      x-required-permissions:
      - location:bay:manage
  /v1/locations/bulk-ingest:
    post:
      description: 'Imports a batch of location records in one call, creating each row independently and reporting per-record success or failure.

        Use this tool for initial data loads or migrations; do not use createLocation, which creates a single location per call.

        Preconditions: names and codes must be unique against existing locations; each record is validated independently, so one failure does not abort the batch.

        Required inputs: jobId, locationId and a non-empty records array, each record with name and code; active defaults to true and locationTypeName defaults to STORE when omitted.

        Emits a LOCATION_BULK_INGEST event, and every successfully created location also publishes a location fact for replica consumers.

        Returns 200 with per-record results even when some records fail (failed rows carry errorCode LOCATION_INGEST_FAILED), and 400 when the batch envelope itself is invalid.

        '
      operationId: bulkIngestLocations
      requestBody:
        content:
          application/json:
            examples:
              Single-record batch:
                description: Single-record batch
                value:
                  jobId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a01
                  locationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a02
                  operatorId: user-jdoe
                  records:
                  - active: true
                    addressLine1: 123 Main St
                    city: Springfield
                    code: LOC-001
                    countryCode: US
                    locationTypeName: STORE
                    name: Downtown Service Center
                    phoneNumber: +1-217-555-0100
                    postalCode: '62704'
                    stateOrProvince: IL
                    timezone: America/Chicago
            schema:
              $ref: '#/components/schemas/BulkIngestRequestLocationBulkIngestRecord'
        description: Batch envelope of location records to import, scoped to a bulk ingest job and submitting operator.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkIngestResponse'
          description: Batch processed (check per-record success/failure in response)
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkIngestResponse'
          description: Invalid request payload
      security:
      - bearerAuth:
        - location:write
      summary: Bulk Import a Batch of Locations
      tags:
      - Location Bulk Ingest API
      x-required-permissions:
      - location:write
  /v1/locations/parents:
    get:
      description: 'Lists every parent-child relationship edge across all locations, with parentId, childId and parentType.

        Use this tool when a full hierarchy dump is needed; use listLocationChildren instead to read the children of one location, or listLocationDescendants for a deep traversal.

        Preconditions: none beyond the location:read authority.

        Required inputs: none; there are no parameters and no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 with the full unpaginated edge list.

        '
      operationId: listLocationParents
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LocationParentResponseDTO'
                type: array
          description: List of location parents returned successfully.
      security:
      - bearerAuth:
        - location:read
      summary: List All Location Parent Relationships
      tags:
      - Location API
      x-required-permissions:
      - location:read
  /v1/locations/roster:
    get:
      description: 'Returns a paginated roster of lightweight location references (id, name, code, status, hrLocationId, timezone, updatedAt, hasRepairCapability) for sync consumers.

        Use this tool when incrementally synchronising locations into another system; do not use listLocations, which returns full unpaginated location payloads, unless the activeBayCount and activeMobileUnitCount behind hasRepairCapability are also needed, because the roster projection intentionally carries only the flag.

        Preconditions: none beyond the location:read authority.

        Required inputs: none are mandatory; status filters exactly on the stored status value such as ACTIVE, sinceUpdatedAt is an ISO-8601 instant returning only rows updated after it, and standard page, size and sort parameters control paging.

        Emits a LOCATION_ROSTER_GET event; no location state changes.

        Returns 200 with a page of location refs; an unknown status value yields an empty page rather than an error. hasRepairCapability is computed at query time and is true when the location has at least one ACTIVE bay or at least one ACTIVE mobile unit based there; an inactive location always reports false.

        '
      operationId: getLocationRoster
      parameters:
      - description: Optional status filter
        example: ACTIVE
        in: query
        name: status
        required: false
        schema:
          type: string
      - description: Optional since-updated-at filter
        example: 2026-01-01 00:00:00+00:00
        in: query
        name: sinceUpdatedAt
        required: false
        schema:
          format: date-time
          type: string
      - description: Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: The size of the page to be returned
        in: query
        name: size
        required: false
        schema:
          default: 20
          minimum: 1
          type: integer
      - description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
        in: query
        name: sort
        required: false
        schema:
          items:
            type: string
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageLocationRef'
          description: Location roster returned successfully.
      security:
      - bearerAuth:
        - location:read
      summary: Get Paginated Location Roster for Sync
      tags:
      - Location API
      x-required-permissions:
      - location:read
  /v1/locations/storage-locations/bulk-ingest:
    post:
      description: 'Creates many storage locations at once, resolving each row''s parent by name and applying a non-default status as a follow-up update.

        Use this tool when commissioning a site or seeding an environment; use createStorageLocation instead for a single location, and patchStorageLocation to change one that already exists.

        Preconditions: each row''s site must exist, and a row naming a parent must either follow that parent in the same batch or name one already at the site.

        Required inputs: jobId (UUID), locationId (UUID) and records, each with a name and a type; a record''s own siteId overrides the batch one.

        Emits a LOCATION_STORAGE_LOCATION_BULK_INGEST event, and a storage-location fact per created row, which is what hydrates the pos-inventory replica.

        Re-running the same file is safe: a name already present at its site is skipped, not failed, and an existing location is never modified — applying a changed status or capacity to a live location is an operator''s update, not a reseed.

        Returns 200 with a per-record result; check each result rather than the status alone.

        '
      operationId: bulkIngestStorageLocations
      requestBody:
        content:
          application/json:
            examples:
              Shelf and bins:
                description: Shelf and bins
                value:
                  jobId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a00
                  locationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a10
                  operatorId: seed-operator
                  records:
                  - name: Parts Shelf A
                    storageCategoryCode: GENERAL
                    type: SHELF
                  - maxUnitCount: 500
                    name: Bin A-01
                    parentName: Parts Shelf A
                    storageCategoryCode: SMALL_PARTS_BIN
                    type: BIN
            schema:
              $ref: '#/components/schemas/BulkIngestRequestStorageLocationBulkIngestRecord'
        description: Storage locations to create, parents before their children.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkIngestResponse'
          description: Batch processed; inspect per-record results
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkIngestResponse'
          description: Invalid request payload
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkIngestResponse'
          description: Forbidden
      security:
      - bearerAuth:
        - location:write
      summary: Create a Site's Storage Topology in Bulk
      tags:
      - Storage Location Bulk Ingest API
      x-required-permissions:
      - location:write
  /v1/locations/top-level:
    get:
      description: 'Returns the platform''s top-level location: the active root of the parent-child hierarchy (a location that is a parent of others but a child of none), falling back to the oldest active location when no hierarchy edges exist. The pick is deterministic (ties break on id).

        Use this tool when a caller needs a default location, e.g. resolving a fallback for users with no primary staffing assignment; do not use it when the id is already known — call getLocationById instead.

        Preconditions: at least one active location must exist.

        Required inputs: none; there are no parameters and no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 404 when no active location exists.

        '
      operationId: getTopLevelLocation
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponseDTO'
          description: Top-level location resolved and returned.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponseDTO'
          description: No active location exists.
      security:
      - bearerAuth:
        - location:read
      summary: Get Top-Level Default Location
      tags:
      - Location API
      x-required-permissions:
      - location:read
  /v1/locations/{childId}/parents/{parentId}:
    post:
      description: 'Creates a typed parent-child edge between two existing locations, giving the child at most one parent per relationship type.

        Use this tool when building the location hierarchy; do not use listLocationChildren or listLocationDescendants, which only read the hierarchy.

        Preconditions: both locations must exist, the child must not already have a parent of that type, the pair must not already be linked in either direction, and the parent must not be a descendant of the child because cycles are forbidden by ADR-0016.

        Required inputs: childId and parentId (UUIDs) as path parameters and a parentType query parameter, one of HOME_OFFICE, HEADQUARTERS, REGION, DISTRICT, PHYSICAL, ORGANIZATIONAL, FINANCIAL or SHIPPING.

        Emits a LOCATION_PARENT_ADD event and republishes the child''s location fact, which carries the new edge to replica consumers.

        Returns 400 when parentType is not a recognized value; self-parenting, duplicate, inverse or circular relationships are rejected before the edge is written.

        '
      operationId: addLocationParent
      parameters:
      - description: ID of the child location
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
        in: path
        name: childId
        required: true
        schema:
          format: uuid
          type: string
      - description: ID of the parent location
        example: 018e1c9f-0000-7890-abcd-1234567890ab
        in: path
        name: parentId
        required: true
        schema:
          format: uuid
          type: string
      - description: Type of the parent relationship
        in: query
        name: parentType
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationParentResponseDTO'
          description: Parent relationship added successfully.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationParentResponseDTO'
          description: Invalid parentType value.
      security:
      - bearerAuth:
        - location:write
      summary: Add Typed Parent Relationship to Location
      tags:
      - Location API
      x-required-permissions:
      - location:write
  /v1/locations/{locationId}:
    delete:
      description: 'Deletes a location permanently by id and publishes a deletion fact so replica consumers drop the row.

        Use this tool only when a location was created in error; use patchLocation with status INACTIVE instead to retire a real site while preserving history.

        Preconditions: the location must exist; there is no child-relationship or usage check, so callers must confirm the location is unreferenced first.

        Required inputs: locationId (UUID) as a path parameter; there is no request body.

        Emits a LOCATION_LOCATION_DELETE event; the row is hard-deleted, not soft-deleted.

        Returns 204 on success and 404 when the location does not exist.

        '
      operationId: deleteLocation
      parameters:
      - description: ID of the location to delete
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
        in: path
        name: locationId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: Location deleted successfully.
        '404':
          description: Location not found.
      security:
      - bearerAuth:
        - location:write
      summary: Delete a Location by Identifier
      tags:
      - Location API
      x-required-permissions:
      - location:write
    get:
      description: 'Returns the full location record, including address fields, active flag, responsible person id and type classification, for a known id.

        Use this tool when the location id is already known; use listLocations instead to enumerate, and use validateLocation when only existence and active state are needed.

        Preconditions: the location must exist.

        Required inputs: locationId (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 404 when no location exists for the supplied id.

        '
      operationId: getLocationById
      parameters:
      - description: ID of the location to retrieve
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
        in: path
        name: locationId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponseDTO'
          description: Location found and returned.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponseDTO'
          description: Location not found.
      security:
      - bearerAuth:
        - location:read
      summary: Get Location by Unique Identifier
      tags:
      - Location API
      x-required-permissions:
      - location:read
    patch:
      description: 'Applies a partial update to a location, changing only the supplied fields: name, status, timezone, operatingHours, holidayClosures, checkInBufferMinutes and cleanupBufferMinutes.

        Use this tool for targeted edits such as deactivation or hours changes; do not use updateLocation, which overwrites every mutable field including address and type.

        Preconditions: the location must exist, and a new name must not be used by another location.

        Required inputs: locationId (UUID) as a path parameter and a body with at least one field; status only accepts the value INACTIVE to deactivate, and reactivation is not supported through this operation.

        Emits a LOCATION_PATCH event and publishes a location fact for replica consumers.

        Returns 404 when the location does not exist, 409 when the new name is taken, and 422 when a supplied timezone or operating-hours entry is invalid.

        '
      operationId: patchLocation
      parameters:
      - description: ID of the location to patch
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
        in: path
        name: locationId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Deactivate location:
                description: Deactivate location
                value:
                  status: INACTIVE
            schema:
              $ref: '#/components/schemas/LocationPatchRequest'
        description: Partial location payload; only non-null fields are applied and all others are left unchanged.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponseDTO'
          description: Location patched successfully.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponseDTO'
          description: Location not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponseDTO'
          description: Location name already taken.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponseDTO'
          description: Invalid timezone or operating hours.
      security:
      - bearerAuth:
        - location:write
      summary: Patch Selected Fields of a Location
      tags:
      - Location API
      x-required-permissions:
      - location:write
    put:
      description: 'Replaces the mutable fields of an existing location with the supplied full payload, including address, timezone, operating hours and type.

        Use this tool when the complete corrected state of a location is known; use patchLocation instead to change selected fields and leave the rest untouched.

        Preconditions: the location must exist, and no other location may already use the new name.

        Required inputs: locationId (UUID) as a path parameter plus a full body with name, code and type; omitted optional fields are overwritten with the request values, not preserved.

        Emits a LOCATION_LOCATION_UPDATE event and publishes a location fact for replica consumers.

        Returns 404 when the location does not exist, 409 when the name or code collides with another location, and 422 when the timezone or operating hours are invalid.

        '
      operationId: updateLocation
      parameters:
      - description: ID of the location to update
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
        in: path
        name: locationId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Full replacement:
                description: Full replacement
                value:
                  active: true
                  addressLine1: 123 Main St
                  checkInBufferMinutes: 15
                  city: Springfield
                  cleanupBufferMinutes: 10
                  code: LOC-001
                  country: US
                  name: Downtown Service Center
                  operatingHours:
                  - closeTime: 1020
                    dayOfWeek: MONDAY
                    openTime: 08:00
                  postalCode: '62704'
                  responsiblePersonId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  state: IL
                  timezone: America/Chicago
                  type:
                    name: STORE
            schema:
              $ref: '#/components/schemas/LocationRequestDTO'
        description: Full replacement state for the location; every mutable field is overwritten with the values supplied here.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponseDTO'
          description: Location updated successfully.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponseDTO'
          description: Location not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponseDTO'
          description: Location name or code already taken.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponseDTO'
          description: Invalid timezone or operating hours.
      security:
      - bearerAuth:
        - location:write
      summary: Update an Existing Location Fully
      tags:
      - Location API
      x-required-permissions:
      - location:write
  /v1/locations/{locationId}/bays:
    get:
      description: 'Lists the service bays of a location as a page, optionally filtered by status and bayType.

        Use this tool to see bay capacity and status for a shop; use getBay instead when the bay id is already known.

        Preconditions: the location must exist.

        Required inputs: locationId (UUID) as a path parameter; status (ACTIVE or OUT_OF_SERVICE) and bayType filters are optional, and page defaults to 0 with size 20.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 404 when the location does not exist; an unrecognized status or bayType filter value fails the request rather than returning an empty page.

        '
      operationId: listBays
      parameters:
      - description: Location ID
        in: path
        name: locationId
        required: true
        schema:
          type: string
      - in: query
        name: status
        required: false
        schema:
          type: string
      - in: query
        name: bayType
        required: false
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          default: 0
          format: int32
          type: integer
      - in: query
        name: size
        required: false
        schema:
          default: 20
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageBayResponse'
          description: Bays retrieved successfully.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageBayResponse'
          description: Location not found.
      security:
      - bearerAuth:
