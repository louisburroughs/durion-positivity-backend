          - INACTIVE
          - MAINTENANCE
          - QUARANTINED
          example: ACTIVE
          type: string
        storageCategoryCode:
          description: Putaway capability of the storage location — what it is fit to hold, independent of the physical type. Omit to leave the current capability unchanged.
          enum:
          - TIRE_RACK
          - OIL_STORAGE
          - BATTERY_RACK
          - SMALL_PARTS_BIN
          - BULK_FLOOR
          - STAGING
          - QUARANTINE
