    CoverageRuleRequest:
      description: Request payload defining a coverage rule for a mobile unit
      properties:
        maxDistance:
          allOf:
          - $ref: '#/components/schemas/DistanceDto'
          description: Maximum service distance covered by the rule, an explicit {value, unit} object (KM or MI); converted at the edge and stored as kilometres (DECISION-LOCATION-028). A bare number is refused. Not yet evaluated by eligibility, since geocoding does not exist.
        priority:
          description: Evaluation priority of the rule (lower is evaluated first)
          example: 1
          format: int32
          minimum: 0
          type: integer
        ruleType:
          description: 'Type of coverage rule, matched case-insensitively. SERVICE_AREA covers the whole service area; DISTANCE_TIER covers it up to maxDistance, and a unit''s DISTANCE_TIER rules must be strictly ascending by maxDistance and end with one rule whose maxDistance is null. Recorded and validated, but ruleType itself is not yet evaluated by eligibility: a DISTANCE_TIER rule matches the same addresses a SERVICE_AREA rule would.'
          enum:
          - SERVICE_AREA
          - DISTANCE_TIER
          example: SERVICE_AREA
          minLength: 1
          type: string
        serviceAreaId:
          description: 'Identifier of the service area this rule applies to; must name an existing, active service area (422 SERVICE_AREA_NOT_FOUND when unknown, 422 SERVICE_AREA_INACTIVE when it exists but active is false). Required for every rule type: a DISTANCE_TIER rule is a tier within its service area, and a rule without one never matches an address.'
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        validFrom:
          description: UTC instant from which the rule is effective, inclusive (DECISION-LOCATION-017)
          example: '2026-06-18T00:00:00Z'
          format: date-time
          type: string
        validTo:
          description: UTC instant until which the rule is effective, exclusive; must be after validFrom (DECISION-LOCATION-017)
          example: '2026-12-31T00:00:00Z'
          format: date-time
          type: string
      required:
      - ruleType
      - serviceAreaId
      type: object
    CoverageRuleResponse:
      description: Response payload describing a mobile unit coverage rule
      properties:
        id:
          description: Unique identifier of the coverage rule
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        maxDistance:
          allOf:
          - $ref: '#/components/schemas/DistanceDto'
          description: Maximum service distance covered by the rule, in the owning mobile unit's base location's distanceUnit; omitted for a rule with no distance ceiling. Not yet evaluated by eligibility, since geocoding does not exist.
        mobileUnitId:
          description: Identifier of the mobile unit this rule belongs to
          example: 01960003-0000-7000-8000-000000000002
          format: uuid
          type: string
        priority:
          description: Evaluation priority of the rule (lower is evaluated first)
          example: 1
          format: int32
          type: integer
        ruleType:
          description: 'Type of coverage rule. Recorded only: ruleType itself is not yet evaluated by eligibility, so a DISTANCE_TIER rule matches the same addresses a SERVICE_AREA rule would.'
          enum:
          - SERVICE_AREA
          - DISTANCE_TIER
          example: SERVICE_AREA
          type: string
        serviceAreaId:
          description: Identifier of the service area this rule applies to
          example: 01960003-0000-7000-8000-000000000003
          format: uuid
          type: string
        validFrom:
          description: UTC instant from which the rule is effective, inclusive
          example: '2026-06-18T00:00:00Z'
          format: date-time
          type: string
        validTo:
          description: UTC instant until which the rule is effective, exclusive
          example: '2026-12-31T00:00:00Z'
          format: date-time
          type: string
      required:
      - id
      - mobileUnitId
      - serviceAreaId
      type: object
    DistanceDto:
