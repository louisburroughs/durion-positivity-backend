    StorageLocationBulkIngestRecord:
      description: One storage location to create at a site
      properties:
        allowNewProduct:
          description: Mixing policy for new products
          enum:
          - MIXED
          - SAME_PRODUCT_ONLY
          - EMPTY_ONLY
          example: MIXED
          type: string
        hazardContainment:
          description: Whether the location has spill containment
          example: false
          type: boolean
        maxUnitCount:
          description: Maximum units the location holds. This is the cap only — the fill is real stock, never a declared number.
          example: 500
          format: int32
          type: integer
        name:
          description: Name of the storage location, unique within its site
          example: Bin A-01
          minLength: 1
          type: string
        parentName:
          description: Name of the parent location within the same site. Resolved against locations already at the site and those created earlier in the same batch, so a file may create a shelf and its bins in one call as long as the shelf comes first.
          example: Parts Shelf A
          type: string
        siteId:
          description: Site the location belongs to. Defaults to the request's locationId when omitted, so a single-site file need not repeat it.
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a10
          format: uuid
          type: string
        status:
          description: Status to apply. Creation always produces an ACTIVE location, so anything else is applied as a follow-up update.
          enum:
          - ACTIVE
          - INACTIVE
          - MAINTENANCE
          - QUARANTINED
          example: INACTIVE
          type: string
        storageCategoryCode:
          description: 'What the location is fit to hold, which is independent of its physical type: a tire rack and a bulk pallet area are both shelves or floors.'
          enum:
          - TIRE_RACK
          - OIL_STORAGE
          - BATTERY_RACK
          - SMALL_PARTS_BIN
          - BULK_FLOOR
          - STAGING
          - QUARANTINE
          - GENERAL
          example: SMALL_PARTS_BIN
          type: string
        type:
          description: Physical topology of the location
          enum:
          - FLOOR
          - SHELF
          - BIN
          - CAGE
          - TRUCK
          example: BIN
          type: string
      required:
      - name
      - type
      type: object
    StorageLocationPatchRequest:
      description: Partial update payload for a storage location; null fields are left unchanged
      properties:
        allowNewProduct:
          description: Whether the storage location will take stock of a product it is not already holding. Omit to leave it unchanged.
          enum:
          - MIXED
          - SAME_PRODUCT_ONLY
          - EMPTY_ONLY
          example: SAME_PRODUCT_ONLY
          type: string
        barcode:
          description: Barcode identifying the storage location
          example: SL-000312
          type: string
        capacity:
          description: Capacity attributes of the storage location
          example:
            maxUnits: 100
          type: object
        destinationStorageLocationId:
          description: Identifier of the destination storage location for relocation operations
          example: 01960003-0000-7000-8000-000000000002
          format: uuid
          type: string
        hazardContainment:
          description: Whether the storage location provides spill/hazard containment; required by battery and oil storage capabilities. Omit to leave it unchanged.
          example: true
          type: boolean
        name:
          description: Display name of the storage location
          example: Aisle 3 Bin 12
          type: string
        parentStorageLocationId:
          description: Identifier of the parent storage location
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        status:
          description: Operational status of the storage location
          enum:
          - ACTIVE
          - INACTIVE
          - MAINTENANCE
          - QUARANTINED
          example: ACTIVE
          type: string
        storageCategoryCode:
          description: Putaway capability of the storage location — what it is fit to hold, independent of the physical type. Omit to leave the current capability unchanged.
          enum:
          - TIRE_RACK
          - OIL_STORAGE
          - BATTERY_RACK
          - SMALL_PARTS_BIN
          - BULK_FLOOR
          - STAGING
          - QUARANTINE
          - GENERAL
          example: TIRE_RACK
          type: string
        temperature:
          description: Temperature attributes of the storage location
          example:
            max: 8
            min: 2
            unit: C
          type: object
      type: object
    StorageLocationRequest:
      description: Request payload for creating a storage location
      properties:
        allowNewProduct:
          description: Whether the storage location will take stock of a product it is not already holding. Defaults to MIXED.
          enum:
          - MIXED
          - SAME_PRODUCT_ONLY
          - EMPTY_ONLY
          example: MIXED
          type: string
        barcode:
          description: Barcode identifying the storage location
          example: SL-000312
          type: string
        capacity:
          description: Capacity attributes of the storage location
