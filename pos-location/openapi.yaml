          type: string
        plateRegion:
          description: ISO 3166-2 region code for licensePlate, upper case; display only, not used by scheduling; null when not set.
          example: US-NC
          type: string
        serviceCapabilityCodes:
          description: Catalog operation codes this unit can perform off-site (CAP-325 D14), UPPER-DASH per ADR-0059 §3; empty for a unit that has not declared any. Used by the eligible mobile-unit lookup (GET /v1/mobile-units:eligible), whose operationCodes filter keeps only units that claim every requested code.
          example:
          - OIL-CHANGE-FULL-SYNTHETIC
          - BATTERY-REPLACEMENT
          items:
            type: string
          type: array
        status:
          description: 'Operational status of the mobile unit: ACTIVE, OUT_OF_SERVICE or RETIRED (DECISION-LOCATION-026).'
          enum:
          - ACTIVE
          - OUT_OF_SERVICE
          - RETIRED
          example: ACTIVE
          type: string
        travelBufferPolicyId:
          description: Identifier of the travel buffer policy assigned to the mobile unit. Recorded; not yet applied by scheduling.
          example: 01960003-0000-7000-8000-000000000003
          format: uuid
          type: string
        unitNumber:
          description: Fleet/unit number painted on the vehicle; display only, not used by scheduling; null when not set.
          example: Fleet-107
          type: string
        updatedAt:
          description: Timestamp when the mobile unit was last updated (ISO 8601)
          example: '2026-06-18T08:00:00Z'
          format: date-time
          type: string
        vin:
          description: 17-character vehicle identification number, upper case; display only, not used by scheduling; null when not set.
          example: 1HGCM82633A004352
          type: string
      required:
      - id
      type: object
