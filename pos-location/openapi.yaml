  /v1/locations/{locationId}/bays:
    get:
      description: 'Lists the service bays of a location as a page, sorted by displayOrder (nulls last) then name, optionally filtered by status and bayType.

        Use this tool to see bay capacity and status for a shop; use getBay instead when the bay id is already known.

        Preconditions: the location must exist.

        Required inputs: locationId (UUID) as a path parameter; status (ACTIVE, OUT_OF_SERVICE or RETIRED) and bayType filters are optional, and page defaults to 0 with size 20. Omitting status hides RETIRED bays; naming status=RETIRED explicitly includes them.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 400 when locationId does not parse as a UUID, 403 LOCATION_SCOPE_DENIED when a location-scoped location:bay:read grant does not cover locationId (ADR-0061), and 404 when the location does not exist; an unrecognized status or bayType filter value fails the request rather than returning an empty page.

