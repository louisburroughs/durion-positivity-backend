openapi: 3.1.0
info:
  title: Positivity Location API
  description: "API documentation for the Shop Location service, accessible via the\
    \ API Gateway. Shop locations are Maintenance Bays and Mobile Shops."
  contact:
    name: Durion Team
    email: louis.burroughs@gmail.com
  version: v1
servers:
- url: http://api-gateway.local/api/location
  description: API Gateway
tags:
- name: Mobile Unit API
  description: Operations for managing mobile units within locations
- name: Travel Buffer Policy API
  description: Operations for managing travel buffer policies
- name: Bay API
  description: Operations for managing bays within locations
- name: Site Defaults API
  description: Operations for managing location site default settings
- name: Service Area API
  description: Operations for managing service areas
- name: Location API
  description: Operations related to locations and their relationships
paths:
  /v1/mobile-units/{id}/coverage-rules:
    get:
      tags:
      - Mobile Unit API
      summary: Get coverage rules
      description: Get coverage rules for a mobile unit.
      operationId: getCoverageRules
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Coverage rules returned.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoverageRuleResponse"
    put:
      tags:
      - Mobile Unit API
      summary: Replace coverage rules
      description: Atomically replace coverage rules for a mobile unit.
      operationId: replaceCoverageRules
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
        required: true
      responses:
        "200":
          description: Coverage rules replaced successfully.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoverageRuleResponse"
        "404":
          description: Mobile unit not found.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoverageRuleResponse"
  /v1/locations/{locationId}:
    get:
      tags:
      - Location API
      summary: Get location by ID
      description: Retrieve a location by its unique ID.
      operationId: getLocationById
      parameters:
      - name: locationId
        in: path
        description: ID of the location to retrieve
        required: true
        schema:
          type: string
          format: uuid
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
      responses:
        "404":
          description: Location not found.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LocationResponseDTO"
        "200":
          description: Location found and returned.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LocationResponseDTO"
    put:
      tags:
      - Location API
      summary: Update an existing location
      description: Update the details of an existing location.
      operationId: updateLocation
      parameters:
      - name: locationId
        in: path
        description: ID of the location to update
        required: true
        schema:
          type: string
          format: uuid
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationRequestDTO"
        required: true
      responses:
        "404":
          description: Location not found.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LocationResponseDTO"
        "200":
          description: Location updated successfully.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LocationResponseDTO"
    delete:
      tags:
      - Location API
      summary: Delete a location
      description: Delete a location by its unique ID.
      operationId: deleteLocation
      parameters:
      - name: locationId
        in: path
        description: ID of the location to delete
        required: true
        schema:
          type: string
          format: uuid
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
      responses:
        "404":
          description: Location not found.
        "204":
          description: Location deleted successfully.
    patch:
      tags:
      - Location API
      summary: Patch a location
      description: Patch selected fields for a location.
      operationId: patchLocation
      parameters:
      - name: locationId
        in: path
        description: ID of the location to patch
        required: true
        schema:
          type: string
          format: uuid
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationPatchRequest"
        required: true
      responses:
        "200":
          description: Location patched successfully.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LocationResponseDTO"
        "404":
          description: Location not found.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LocationResponseDTO"
  /v1/locations/{locationId}/defaults:
    get:
      tags:
      - Site Defaults API
      summary: Get site defaults
      description: Retrieve default site configuration for a location.
      operationId: getDefaults
      parameters:
      - name: locationId
        in: path
        description: ID of the location
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Site defaults returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteDefaultsResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SiteDefaultsResponse"
        "404":
          description: Location not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SiteDefaultsResponse"
    put:
      tags:
      - Site Defaults API
      summary: Configure site defaults
      description: Create or update default site configuration for a location.
      operationId: configureDefaults
      parameters:
      - name: locationId
        in: path
        description: ID of the location
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteDefaultsRequest"
        required: true
      responses:
        "400":
          description: Invalid request payload
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SiteDefaultsResponse"
        "200":
          description: Site defaults configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteDefaultsResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SiteDefaultsResponse"
        "404":
          description: Location not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SiteDefaultsResponse"
  /v1/travel-buffer-policies:
    get:
      tags:
      - Travel Buffer Policy API
      summary: List travel buffer policies
      operationId: list
      responses:
        "200":
          description: Travel buffer policies listed
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TravelBufferPolicyResponse"
    post:
      tags:
      - Travel Buffer Policy API
      summary: Create travel buffer policy
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TravelBufferPolicyRequest"
        required: true
      responses:
        "201":
          description: Travel buffer policy created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TravelBufferPolicyResponse"
  /v1/service-areas:
    get:
      tags:
      - Service Area API
      summary: List service areas
      operationId: list_1
      responses:
        "200":
          description: Service areas listed
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceAreaResponse"
    post:
      tags:
      - Service Area API
      summary: Create service area
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceAreaRequest"
        required: true
      responses:
        "201":
          description: Service area created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ServiceAreaResponse"
  /v1/mobile-units:
    get:
      tags:
      - Mobile Unit API
      summary: List mobile units
      description: List mobile units with pagination.
      operationId: listMobileUnits
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: Mobile units retrieved successfully.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageMobileUnitResponse"
    post:
      tags:
      - Mobile Unit API
      summary: Create mobile unit
      description: Create a new mobile unit.
      operationId: createMobileUnit
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileUnitRequest"
        required: true
      responses:
        "201":
          description: Mobile unit created successfully.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MobileUnitResponse"
  /v1/locations:
    get:
      tags:
      - Location API
      summary: Get all locations
      description: Retrieve a list of all locations.
      operationId: getAllLocations
      responses:
        "200":
          description: List of locations returned successfully.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LocationResponseDTO"
    post:
      tags:
      - Location API
      summary: Create a new location
      description: Add a new location to the system.
      operationId: createLocation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationRequestDTO"
        required: true
      responses:
        "201":
          description: Location created successfully.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LocationResponseDTO"
  /v1/locations/{siteId}/storage-locations:
    get:
      tags:
      - storage-location-controller
      operationId: list_2
      parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - FLOOR
          - SHELF
          - BIN
          - CAGE
          - TRUCK
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - MAINTENANCE
          - QUARANTINED
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageStorageLocationResponse"
    post:
      tags:
      - storage-location-controller
      operationId: create_2
      parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageLocationRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StorageLocationResponse"
  /v1/locations/{locationId}/bays:
    get:
      tags:
      - Bay API
      summary: List bays
      description: List bays for a location with optional status and bayType filters.
      operationId: listBays
      parameters:
      - name: locationId
        in: path
        description: Location ID
        required: true
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: bayType
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: Bays retrieved successfully.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageBayResponse"
    post:
      tags:
      - Bay API
      summary: Create bay
      description: Create a new bay for a specific location.
      operationId: createBay
      parameters:
      - name: locationId
        in: path
        description: Location ID
        required: true
        schema:
          type: string
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BayRequest"
        required: true
      responses:
        "201":
          description: Bay created successfully.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BayResponse"
  /v1/locations/{childId}/parents/{parentId}:
    post:
      tags:
      - Location API
      summary: Add a parent to a location
      description: Add a parent relationship to a location.
      operationId: addParent
      parameters:
      - name: childId
        in: path
        description: ID of the child location
        required: true
        schema:
          type: string
          format: uuid
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
      - name: parentId
        in: path
        description: ID of the parent location
        required: true
        schema:
          type: string
          format: uuid
        example: 018e1c9f-0000-7890-abcd-1234567890ab
      - name: parentType
        in: query
        description: Type of the parent relationship
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Parent relationship added successfully.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LocationParentResponseDTO"
  /v1/travel-buffer-policies/{id}:
    patch:
      tags:
      - Travel Buffer Policy API
      summary: Patch travel buffer policy
      operationId: patch
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
        required: true
      responses:
        "200":
          description: Travel buffer policy patched
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TravelBufferPolicyResponse"
        "404":
          description: Travel buffer policy not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TravelBufferPolicyResponse"
        "400":
          description: Invalid travel buffer policy id
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TravelBufferPolicyResponse"
  /v1/service-areas/{id}:
    patch:
      tags:
      - Service Area API
      summary: Patch service area
      operationId: patch_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
        required: true
      responses:
        "200":
          description: Service area patched
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ServiceAreaResponse"
        "400":
          description: Invalid service area id
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ServiceAreaResponse"
        "404":
          description: Service area not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ServiceAreaResponse"
  /v1/mobile-units/{id}:
    get:
      tags:
      - Mobile Unit API
      summary: Get mobile unit
      description: Get a mobile unit by ID.
      operationId: getMobileUnitById
      parameters:
      - name: id
        in: path
        description: Mobile unit ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Mobile unit returned.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MobileUnitResponse"
        "404":
          description: Mobile unit not found.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MobileUnitResponse"
    patch:
      tags:
      - Mobile Unit API
      summary: Patch mobile unit
      description: Partially update a mobile unit.
      operationId: patchMobileUnit
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
        required: true
      responses:
        "200":
          description: Mobile units managed successfully.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MobileUnitResponse"
  /v1/locations/{siteId}/storage-locations/{storageLocationId}:
    get:
      tags:
      - storage-location-controller
      operationId: get
      parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: storageLocationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StorageLocationResponse"
    patch:
      tags:
      - storage-location-controller
      operationId: patch_2
      parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: storageLocationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageLocationPatchRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StorageLocationResponse"
  /v1/locations/{locationId}/bays/{bayId}:
    get:
      tags:
      - Bay API
      summary: Get bay
      description: Get a bay by location and bay id.
      operationId: getBay
      parameters:
      - name: locationId
        in: path
        description: Location ID
        required: true
        schema:
          type: string
      - name: bayId
        in: path
        description: Bay ID
        required: true
        schema:
          type: string
      responses:
        "404":
          description: Bay not found.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BayResponse"
        "200":
          description: Bay retrieved successfully.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BayResponse"
    patch:
      tags:
      - Bay API
      summary: Patch bay
      description: Patch bay fields including status transition and capacity.
      operationId: patchBay
      parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: string
      - name: bayId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BayPatchRequest"
        required: true
      responses:
        "200":
          description: Bay updated successfully.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BayResponse"
  /v1/storage-locations/{storageLocationId}/validation:
    get:
      tags:
      - storage-location-validation-controller
      summary: Validate storage location reference
      description: "Returns existence, active status, and site ownership for a storage\
        \ location ID."
      operationId: validateStorageLocation
      parameters:
      - name: storageLocationId
        in: path
        description: Storage location identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "403":
          description: Forbidden - missing location:read authority
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StorageLocationValidationResponseDTO"
        "400":
          description: Invalid storageLocationId format
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StorageLocationValidationResponseDTO"
        "200":
          description: Validation payload returned
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StorageLocationValidationResponseDTO"
  /v1/mobile-units:eligible:
    get:
      tags:
      - mobile-unit-eligibility-controller
      summary: Find eligible mobile units
      description: Return eligible active units for a service request.
      operationId: findEligibleMobileUnits
      parameters:
      - name: postalCode
        in: query
        required: true
        schema:
          type: string
      - name: countryCode
        in: query
        required: true
        schema:
          type: string
      - name: at
        in: query
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: Eligible mobile units returned.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EligibleMobileUnitResponse"
  /v1/locations/{locationId}/validation:
    get:
      tags:
      - Location API
      summary: Validate location reference
      description: Return existence and active state for a location ID.
      operationId: validateLocation
      parameters:
      - name: locationId
        in: path
        description: ID of the location to validate
        required: true
        schema:
          type: string
          format: uuid
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
      responses:
        "200":
          description: Validation result returned.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LocationValidationResponseDTO"
  /v1/locations/{locationId}/responsible-person:
    get:
      tags:
      - Location API
      summary: Get responsible person for a location
      description: Retrieve the person responsible for a given location.
      operationId: getResponsiblePerson
      parameters:
      - name: locationId
        in: path
        description: ID of the location
        required: true
        schema:
          type: string
          format: uuid
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
      responses:
        "200":
          description: Responsible person found and returned.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PersonDTO"
        "404":
          description: Responsible person not found.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PersonDTO"
  /v1/locations/{locationId}/children:
    get:
      tags:
      - Location API
      summary: Get all children for a location
      description: Retrieve all child locations for a given parent location.
      operationId: getAllChildren
      parameters:
      - name: locationId
        in: path
        description: ID of the parent location
        required: true
        schema:
          type: string
          format: uuid
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
      - name: parentType
        in: query
        description: Optional parent relationship type filter
        required: false
        schema:
          type: string
      responses:
        "200":
          description: List of child locations returned successfully.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LocationResponseDTO"
  /v1/locations/roster:
    get:
      tags:
      - Location API
      summary: Get location roster
      description: Retrieve paginated location refs for sync consumers.
      operationId: getRoster
      parameters:
      - name: status
        in: query
        description: Optional status filter
        required: false
        schema:
          type: string
        example: ACTIVE
      - name: sinceUpdatedAt
        in: query
        description: Optional since-updated-at filter
        required: false
        schema:
          type: string
          format: date-time
        example: 2026-01-01T00:00:00Z
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Location roster returned successfully.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageLocationRef"
  /v1/locations/parents:
    get:
      tags:
      - Location API
      summary: Get all location parents
      description: Retrieve all parent relationships for locations.
      operationId: getAllParents
      responses:
        "200":
          description: List of location parents returned successfully.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LocationParentResponseDTO"
components:
  schemas:
    CoverageRuleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        mobileUnitId:
          type: string
          format: uuid
        serviceAreaId:
          type: string
          format: uuid
        ruleType:
          type: string
