      - Mobile Unit API
      x-required-permissions:
      - location:mobile-unit:manage
  /v1/mobile-units/bulk-ingest:
    post:
      description: 'Creates many mobile units at once, one per record.

        Use this tool when commissioning a fleet or seeding an environment; use createMobileUnit instead for a single unit.

        Preconditions: each row''s base location must exist. A unit created ACTIVE must also carry a travel buffer policy, capabilities and coverage rules, which this record does not express — so seed units INACTIVE and activate them through createMobileUnit or a later update.

        Required inputs: jobId (UUID), locationId (UUID) and records, each with a name; a record''s own baseLocationId overrides the batch one.

