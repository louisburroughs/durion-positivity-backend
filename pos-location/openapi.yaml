    BayCapacityRequest:
      description: Capacity configuration for a service bay
      properties:
        maxConcurrentVehicles:
          description: Number of vehicles the bay physically accommodates at once. A bay is a single bookable resource regardless of this value; register separate bays for independently bookable stalls.
          example: 2
          format: int32
          minimum: 1
          type: integer
      required:
      - maxConcurrentVehicles
      type: object
    BayPatchRequest:
      description: 'Partial update payload for a service bay; absent fields are left unchanged. maxDutyClass is the exception: an absent key leaves it unchanged, while an explicit JSON null clears it.'
      properties:
        bayType:
          description: Type classification of the bay; must be a BayType value. Changing bayType without also sending serviceCapabilityCodes resets the bay's codes to the new type's specialty-map defaults (CAP-325 D14 rule 3) — for example, retyping to GENERAL_SERVICE clears any alignment/tire/inspection claim rather than keeping it. Send serviceCapabilityCodes in the same request to state the bay's codes explicitly instead.
          example: GENERAL_SERVICE
          type: string
        capacity:
          $ref: '#/components/schemas/BayCapacityRequest'
        displayOrder:
          description: Sort key for bay lists and the dispatch board; null leaves the current value unchanged, the same as every other nullable field on this patch.
          example: 10
          format: int32
          type: integer
        expectedReturnAt:
          description: Advisory expected return-to-service time; not used by scheduling. Null leaves the current value unchanged unless status is patched to ACTIVE, which always clears it.
          example: '2026-07-01T08:00:00Z'
          format: date-time
          type: string
        maxConcurrentVehicles:
          description: Number of vehicles the bay physically accommodates at once. A bay is a single bookable resource regardless of this value; register separate bays for independently bookable stalls.
          example: 1
          format: int32
          minimum: 1
          type: integer
        maxDutyClass:
          description: Heaviest GVWR class (1–8) the bay accepts (CAP-325 D13). Omit the field to leave the current value unchanged; send JSON null to clear it back to no limit; send 1–8 to set it.
          example: 3
          format: int32
          maximum: 8
          minimum: 1
          type: integer
        name:
          description: Display name of the bay
          example: Bay A1
          type: string
        outOfServiceNote:
          description: Free-text detail for outOfServiceReason (max 255 characters); required when the resulting outOfServiceReason is OTHER. Null leaves the current note unchanged unless status is patched to ACTIVE, which always clears it.
          example: Lift arm replaced under warranty
          maxLength: 255
          minLength: 0
          type: string
        outOfServiceReason:
          description: Reason the bay is OUT_OF_SERVICE (DECISION-LOCATION-026); required when the resulting status is OUT_OF_SERVICE, refused with 422 OUT_OF_SERVICE_REASON_REQUIRED otherwise. Null leaves the current reason unchanged unless status is patched to ACTIVE, which always clears it.
          enum:
          - EQUIPMENT_FAILURE
          - SCHEDULED_MAINTENANCE
          - INSPECTION
          - SAFETY_HOLD
          - FACILITY_ISSUE
          - OTHER
          example: EQUIPMENT_FAILURE
          type: string
        serviceCapabilityCodes:
          description: Catalog operation codes this bay type is the only one able to perform (CAP-325 D14). Null leaves the codes unchanged unless bayType actually changes in the same request, in which case they reset to the new type's default specialty codes; codes sent alongside a bayType change win, and resending the same bayType does not reset them. An empty list clears the bay to general. No flag records whether the current codes are the type's defaults or customised, so a retype always replaces unsent codes. Each value must be an active catalog operationCode; unknown or retired codes are rejected 422.
          example:
          - WHEEL-ALIGNMENT-4-WHEEL
          items:
            type: string
          type:
          - array
          - 'null'
        status:
          description: 'Operational status of the bay: ACTIVE, OUT_OF_SERVICE or RETIRED. Going OUT_OF_SERVICE requires outOfServiceReason in this same request or already on the bay; returning to ACTIVE clears outOfServiceReason, outOfServiceNote and expectedReturnAt. DELETE is the usual way to RETIRE a bay; RETIRED here is reversible the same as OUT_OF_SERVICE.'
          enum:
          - ACTIVE
          - OUT_OF_SERVICE
          - RETIRED
          example: ACTIVE
          type: string
      type: object
    BayRequest:
      description: Request payload for creating a service bay
      properties:
        bayType:
          description: Type classification of the bay; must be a BayType value
          example: GENERAL_SERVICE
          minLength: 1
          type: string
        capacity:
