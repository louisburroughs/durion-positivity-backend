openapi: 3.1.0
info:
  title: Positivity Location API
  description: API documentation for the Shop Location service, accessible via the API Gateway. Shop locations are Maintenance Bays and Mobile Shops.
  contact:
    name: Durion Support Services
    email: louis.burroughs@gmail.com
  version: v1
servers:
- url: http://api-gateway.local/v1/location
  description: API Gateway
tags:
- name: Storage Location API
  description: Operations for managing storage locations within a site
- name: Mobile Unit API
  description: Operations for managing mobile units within locations
- name: Travel Buffer Policy API
  description: Operations for managing travel buffer policies
- name: Location Bulk Ingest API
  description: Bulk import locations
- name: Bay API
  description: Operations for managing bays within locations
- name: Site Defaults API
  description: Operations for managing location site default settings
- name: Service Area API
  description: Operations for managing service areas
- name: Location API
  description: Operations related to locations and their relationships
paths:
  /v1/mobile-units/{id}/coverage-rules:
    get:
      tags:
      - Mobile Unit API
      summary: Get coverage rules
      description: Get coverage rules for a mobile unit.
      operationId: getCoverageRules
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Coverage rules returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoverageRuleResponse'
      security:
      - bearerAuth:
        - location:mobile-unit:read
      x-required-permissions:
      - location:mobile-unit:read
    put:
      tags:
      - Mobile Unit API
      summary: Replace coverage rules
      description: Atomically replace coverage rules for a mobile unit.
      operationId: replaceCoverageRules
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
      responses:
        '200':
          description: Coverage rules replaced successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoverageRuleResponse'
        '404':
          description: Mobile unit not found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoverageRuleResponse'
      security:
      - bearerAuth:
        - location:mobile-unit:manage
      x-required-permissions:
      - location:mobile-unit:manage
  /v1/locations/{locationId}:
    get:
      tags:
      - Location API
      summary: Get location by ID
      description: Retrieve a location by its unique ID.
      operationId: getLocationById
      parameters:
      - name: locationId
        in: path
        description: ID of the location to retrieve
        required: true
        schema:
          type: string
          format: uuid
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
      responses:
        '200':
          description: Location found and returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponseDTO'
        '404':
          description: Location not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponseDTO'
      security:
      - bearerAuth:
        - location:read
      x-required-permissions:
      - location:read
    put:
      tags:
      - Location API
      summary: Update an existing location
      description: Update the details of an existing location.
      operationId: updateLocation
      parameters:
      - name: locationId
        in: path
        description: ID of the location to update
        required: true
        schema:
          type: string
          format: uuid
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequestDTO'
        required: true
      responses:
        '200':
          description: Location updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponseDTO'
        '404':
          description: Location not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponseDTO'
      security:
      - bearerAuth:
        - location:write
      x-required-permissions:
      - location:write
    delete:
      tags:
      - Location API
      summary: Delete a location
      description: Delete a location by its unique ID.
      operationId: deleteLocation
      parameters:
      - name: locationId
        in: path
        description: ID of the location to delete
        required: true
        schema:
          type: string
          format: uuid
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
      responses:
        '204':
          description: Location deleted successfully.
        '404':
          description: Location not found.
      security:
      - bearerAuth:
        - location:write
      x-required-permissions:
      - location:write
    patch:
      tags:
      - Location API
      summary: Patch a location
      description: Patch selected fields for a location.
      operationId: patchLocation
      parameters:
      - name: locationId
        in: path
        description: ID of the location to patch
        required: true
        schema:
          type: string
          format: uuid
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationPatchRequest'
        required: true
      responses:
        '200':
          description: Location patched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponseDTO'
        '404':
          description: Location not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponseDTO'
      security:
      - bearerAuth:
        - location:write
      x-required-permissions:
      - location:write
  /v1/locations/{locationId}/defaults:
    get:
      tags:
      - Site Defaults API
      summary: Get site defaults
      description: Retrieve default site configuration for a location.
      operationId: getDefaults
      parameters:
      - name: locationId
        in: path
        description: ID of the location
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Site defaults returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteDefaultsResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteDefaultsResponse'
        '404':
          description: Location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteDefaultsResponse'
      security:
      - bearerAuth:
        - location:read
      x-required-permissions:
      - location:read
    put:
      tags:
      - Site Defaults API
      summary: Configure site defaults
      description: Create or update default site configuration for a location.
      operationId: configureDefaults
      parameters:
      - name: locationId
        in: path
        description: ID of the location
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteDefaultsRequest'
        required: true
      responses:
        '200':
          description: Site defaults configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteDefaultsResponse'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteDefaultsResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteDefaultsResponse'
        '404':
          description: Location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteDefaultsResponse'
      security:
      - bearerAuth:
        - location:write
      x-required-permissions:
      - location:write
  /v1/travel-buffer-policies:
    get:
      tags:
      - Travel Buffer Policy API
      summary: List travel buffer policies
      description: List configured travel buffer policies available for routing and scheduling decisions
      operationId: list
      responses:
        '200':
          description: Travel buffer policies listed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TravelBufferPolicyResponse'
      security:
      - bearerAuth:
        - location:travel-buffer-policy:read
      x-required-permissions:
      - location:travel-buffer-policy:read
    post:
      tags:
      - Travel Buffer Policy API
      summary: Create travel buffer policy
      description: Create a travel buffer policy that defines extra travel time handling rules
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TravelBufferPolicyRequest'
        required: true
      responses:
        '201':
          description: Travel buffer policy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelBufferPolicyResponse'
      security:
      - bearerAuth:
        - location:travel-buffer-policy:manage
      x-required-permissions:
      - location:travel-buffer-policy:manage
  /v1/service-areas:
    get:
      tags:
      - Service Area API
      summary: List service areas
      description: List configured service areas available for dispatching and coverage management
      operationId: list_1
      responses:
        '200':
          description: Service areas listed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceAreaResponse'
      security:
      - bearerAuth:
        - location:service-area:read
      x-required-permissions:
      - location:service-area:read
    post:
      tags:
      - Service Area API
      summary: Create service area
      description: Create a service area that defines where a location can provide service coverage
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAreaRequest'
        required: true
      responses:
        '201':
          description: Service area created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAreaResponse'
      security:
      - bearerAuth:
        - location:service-area:manage
      x-required-permissions:
      - location:service-area:manage
  /v1/mobile-units:
    get:
      tags:
      - Mobile Unit API
      summary: List mobile units
      description: List mobile units with pagination.
      operationId: listMobileUnits
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: Mobile units retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageMobileUnitResponse'
      security:
      - bearerAuth:
        - location:mobile-unit:read
      x-required-permissions:
      - location:mobile-unit:read
    post:
      tags:
      - Mobile Unit API
      summary: Create mobile unit
      description: Create a new mobile unit.
      operationId: createMobileUnit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileUnitRequest'
        required: true
      responses:
        '201':
          description: Mobile unit created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileUnitResponse'
      security:
      - bearerAuth:
        - location:mobile-unit:manage
      x-required-permissions:
      - location:mobile-unit:manage
  /v1/locations:
    get:
      tags:
      - Location API
      summary: Get all locations
      description: Retrieve a list of all locations.
      operationId: getAllLocations
      responses:
        '200':
          description: List of locations returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationResponseDTO'
      security:
      - bearerAuth:
        - location:read
      x-required-permissions:
      - location:read
    post:
      tags:
      - Location API
      summary: Create a new location
      description: Add a new location to the system.
      operationId: createLocation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequestDTO'
        required: true
      responses:
        '201':
          description: Location created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponseDTO'
      security:
      - bearerAuth:
        - location:write
      x-required-permissions:
      - location:write
  /v1/locations/{siteId}/storage-locations:
    get:
      tags:
      - Storage Location API
      summary: List storage locations
      description: List storage locations for a site with optional type and status filtering
      operationId: list_2
      parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - FLOOR
          - SHELF
          - BIN
          - CAGE
          - TRUCK
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - MAINTENANCE
          - QUARANTINED
      - name: pageable
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Pageable'
      responses:
        '200':
          description: Storage locations listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageStorageLocationResponse'
      security:
      - bearerAuth:
        - location:read
      x-required-permissions:
      - location:read
    post:
      tags:
      - Storage Location API
      summary: Create storage location
      description: Create a storage location within a site using the provided topology and status details
      operationId: create_2
      parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageLocationRequest'
        required: true
      responses:
        '201':
          description: Storage location created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageLocationResponse'
      security:
      - bearerAuth:
        - location:write
      x-required-permissions:
      - location:write
  /v1/locations/{locationId}/bays:
    get:
      tags:
      - Bay API
      summary: List bays
      description: List bays for a location with optional status and bayType filters.
      operationId: listBays
      parameters:
      - name: locationId
        in: path
        description: Location ID
        required: true
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: bayType
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: Bays retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageBayResponse'
      security:
      - bearerAuth:
        - location:bay:read
      x-required-permissions:
      - location:bay:read
    post:
      tags:
      - Bay API
      summary: Create bay
      description: Create a new bay for a specific location.
      operationId: createBay
      parameters:
      - name: locationId
        in: path
        description: Location ID
        required: true
        schema:
          type: string
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BayRequest'
        required: true
      responses:
        '201':
          description: Bay created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BayResponse'
      security:
      - bearerAuth:
        - location:bay:manage
      x-required-permissions:
      - location:bay:manage
  /v1/locations/{childId}/parents/{parentId}:
    post:
      tags:
      - Location API
      summary: Add a parent to a location
      description: Add a parent relationship to a location.
      operationId: addParent
      parameters:
      - name: childId
        in: path
        description: ID of the child location
        required: true
        schema:
          type: string
          format: uuid
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
      - name: parentId
        in: path
        description: ID of the parent location
        required: true
        schema:
          type: string
          format: uuid
        example: 018e1c9f-0000-7890-abcd-1234567890ab
      - name: parentType
        in: query
        description: Type of the parent relationship
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Parent relationship added successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationParentResponseDTO'
      security:
      - bearerAuth:
        - location:write
      x-required-permissions:
      - location:write
  /v1/locations/bulk-ingest:
    post:
      tags:
      - Location Bulk Ingest API
      summary: Bulk ingest records
      description: Accepts a batch of domain records for bulk import. Returns per-record results.
      operationId: bulkIngest
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkIngestRequestLocationBulkIngestRecord'
        required: true
      responses:
        '200':
          description: Batch processed (check per-record success/failure in response)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkIngestResponse'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkIngestResponse'
      security:
      - bearerAuth:
        - location:write
      x-required-permissions:
      - location:write
  /v1/travel-buffer-policies/{id}:
    patch:
      tags:
      - Travel Buffer Policy API
      summary: Patch travel buffer policy
      description: Patch an existing travel buffer policy using the provided partial field updates
      operationId: patch
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
      responses:
        '200':
          description: Travel buffer policy patched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelBufferPolicyResponse'
        '400':
          description: Invalid travel buffer policy id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelBufferPolicyResponse'
        '404':
          description: Travel buffer policy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelBufferPolicyResponse'
      security:
      - bearerAuth:
        - location:travel-buffer-policy:manage
      x-required-permissions:
      - location:travel-buffer-policy:manage
  /v1/service-areas/{id}:
    patch:
      tags:
      - Service Area API
      summary: Patch service area
      description: Patch an existing service area using the provided partial field updates
      operationId: patch_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
      responses:
        '200':
          description: Service area patched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAreaResponse'
        '400':
          description: Invalid service area id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAreaResponse'
        '404':
          description: Service area not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAreaResponse'
      security:
      - bearerAuth:
        - location:service-area:manage
      x-required-permissions:
      - location:service-area:manage
  /v1/mobile-units/{id}:
    get:
      tags:
      - Mobile Unit API
      summary: Get mobile unit
      description: Get a mobile unit by ID.
      operationId: getMobileUnitById
      parameters:
      - name: id
        in: path
        description: Mobile unit ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Mobile unit returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileUnitResponse'
        '404':
          description: Mobile unit not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileUnitResponse'
      security:
      - bearerAuth:
        - location:mobile-unit:read
      x-required-permissions:
      - location:mobile-unit:read
    patch:
      tags:
      - Mobile Unit API
      summary: Patch mobile unit
      description: Partially update a mobile unit.
      operationId: patchMobileUnit
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
      responses:
        '200':
          description: Mobile units managed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileUnitResponse'
      security:
      - bearerAuth:
        - location:mobile-unit:manage
      x-required-permissions:
      - location:mobile-unit:manage
  /v1/locations/{siteId}/storage-locations/{storageLocationId}:
    get:
      tags:
      - Storage Location API
      summary: Get storage location
      description: Retrieve a single storage location for a site by its storage location identifier
      operationId: get
      parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: storageLocationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Storage location returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageLocationResponse'
        '404':
          description: Storage location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageLocationResponse'
      security:
      - bearerAuth:
        - location:read
      x-required-permissions:
      - location:read
    patch:
      tags:
      - Storage Location API
      summary: Patch storage location
      description: Patch an existing storage location for a site using the provided partial updates
      operationId: patch_2
      parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: storageLocationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageLocationPatchRequest'
        required: true
      responses:
        '200':
          description: Storage location updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageLocationResponse'
        '404':
          description: Storage location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageLocationResponse'
      security:
      - bearerAuth:
        - location:write
      x-required-permissions:
      - location:write
  /v1/locations/{locationId}/bays/{bayId}:
    get:
      tags:
      - Bay API
      summary: Get bay
      description: Get a bay by location and bay id.
      operationId: getBay
      parameters:
      - name: locationId
        in: path
        description: Location ID
        required: true
        schema:
          type: string
      - name: bayId
        in: path
        description: Bay ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Bay retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BayResponse'
        '404':
          description: Bay not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BayResponse'
      security:
      - bearerAuth:
        - location:bay:read
      x-required-permissions:
      - location:bay:read
    patch:
      tags:
      - Bay API
      summary: Patch bay
      description: Patch bay fields including status transition and capacity.
      operationId: patchBay
      parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: string
      - name: bayId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BayPatchRequest'
        required: true
      responses:
        '200':
          description: Bay updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BayResponse'
      security:
      - bearerAuth:
        - location:bay:manage
      x-required-permissions:
      - location:bay:manage
  /v1/storage-locations/{storageLocationId}/validation:
    get:
      tags:
      - storage-location-validation-controller
      summary: Validate storage location reference
      description: Returns existence, active status, and site ownership for a storage location ID.
      operationId: validateStorageLocation
      parameters:
      - name: storageLocationId
        in: path
        description: Storage location identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Validation payload returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageLocationValidationResponseDTO'
        '400':
          description: Invalid storageLocationId format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageLocationValidationResponseDTO'
        '403':
          description: Forbidden - missing location:read authority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageLocationValidationResponseDTO'
      security:
      - bearerAuth:
        - location:read
      x-required-permissions:
      - location:read
  /v1/mobile-units:eligible:
    get:
      tags:
      - mobile-unit-eligibility-controller
      summary: Find eligible mobile units
      description: Return eligible active units for a service request.
      operationId: findEligibleMobileUnits
      parameters:
      - name: postalCode
        in: query
        required: true
        schema:
          type: string
      - name: countryCode
        in: query
        required: true
        schema:
          type: string
      - name: at
        in: query
        required: true
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Eligible mobile units returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EligibleMobileUnitResponse'
      security:
      - bearerAuth:
        - location:mobile-unit:read
      x-required-permissions:
      - location:mobile-unit:read
  /v1/locations/{locationId}/validation:
    get:
      tags:
      - Location API
      summary: Validate location reference
      description: Return existence and active state for a location ID.
      operationId: validateLocation
      parameters:
      - name: locationId
        in: path
        description: ID of the location to validate
        required: true
        schema:
          type: string
          format: uuid
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
      responses:
        '200':
          description: Validation result returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationValidationResponseDTO'
      security:
      - bearerAuth:
        - location:read
      x-required-permissions:
      - location:read
  /v1/locations/{locationId}/responsible-person:
    get:
      tags:
      - Location API
      summary: Get responsible person for a location
      description: Retrieve the person responsible for a given location.
      operationId: getResponsiblePerson
      parameters:
      - name: locationId
        in: path
        description: ID of the location
        required: true
        schema:
          type: string
          format: uuid
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
      responses:
        '200':
          description: Responsible person found and returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDTO'
        '404':
          description: Responsible person not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDTO'
      security:
      - bearerAuth:
        - location:read
      x-required-permissions:
      - location:read
  /v1/locations/{locationId}/children:
    get:
      tags:
      - Location API
      summary: Get all children for a location
      description: Retrieve all child locations for a given parent location.
      operationId: getAllChildren
      parameters:
      - name: locationId
        in: path
        description: ID of the parent location
        required: true
        schema:
          type: string
          format: uuid
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
      - name: parentType
        in: query
        description: Optional parent relationship type filter
        required: false
        schema:
          type: string
      responses:
        '200':
          description: List of child locations returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationResponseDTO'
      security:
      - bearerAuth:
        - location:read
      x-required-permissions:
      - location:read
  /v1/locations/roster:
    get:
      tags:
      - Location API
      summary: Get location roster
      description: Retrieve paginated location refs for sync consumers.
      operationId: getRoster
      parameters:
      - name: status
        in: query
        description: Optional status filter
        required: false
        schema:
          type: string
        example: ACTIVE
      - name: sinceUpdatedAt
        in: query
        description: Optional since-updated-at filter
        required: false
        schema:
          type: string
          format: date-time
        example: 2026-01-01 00:00:00+00:00
      - name: pageable
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Pageable'
      responses:
        '200':
          description: Location roster returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageLocationRef'
      security:
      - bearerAuth:
        - location:read
      x-required-permissions:
      - location:read
  /v1/locations/parents:
    get:
      tags:
      - Location API
      summary: Get all location parents
      description: Retrieve all parent relationships for locations.
      operationId: getAllParents
      responses:
        '200':
          description: List of location parents returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationParentResponseDTO'
      security:
      - bearerAuth:
        - location:read
      x-required-permissions:
      - location:read
