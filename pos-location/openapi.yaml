      x-required-permissions:
      - location:write
    put:
      description: 'Replaces the mutable fields of an existing location with the supplied full payload, including address, timezone, operating hours and type.

        Use this tool when the complete corrected state of a location is known; use patchLocation instead to change selected fields and leave the rest untouched.

        Preconditions: the location must exist, and no other location may already use the new name.

        Required inputs: locationId (UUID) as a path parameter plus a full body with name, code and type; omitted optional fields are overwritten with the request values, not preserved, and an omitted distanceUnit (KM or MI, DECISION-LOCATION-028) resets to KM.

        Emits a LOCATION_LOCATION_UPDATE event and publishes a location fact for replica consumers.

        Returns 404 when the location does not exist, 403 LOCATION_SCOPE_DENIED when it exists but a location-scoped location:write grant does not cover it (ADR-0061), 409 when the name or code collides with another location, 422 when the timezone or operating hours are invalid, and 400 VALIDATION_ERROR when distanceUnit is something other than KM or MI.

        '
      operationId: updateLocation
