            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Caller lacks location:bay:read, or holds it but its location scope does not cover locationId (ApiError.code LOCATION_SCOPE_DENIED, see ../durion/docs/architecture/api/ERROR_ENVELOPE.md).
        '404':
          content:
            application/json:
