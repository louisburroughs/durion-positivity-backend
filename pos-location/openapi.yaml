        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteDefaultsResponse'
          description: Site defaults returned
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteDefaultsResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteDefaultsResponse'
