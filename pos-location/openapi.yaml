          example: false
          type: boolean
        name:
          description: Display name of the storage location
          example: Aisle 3 Bin 12
          minLength: 1
          type: string
        parentStorageLocationId:
          description: Identifier of the parent storage location
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        storageCategoryCode:
          description: Putaway capability of the storage location — what it is fit to hold, independent of the physical type. Omit to leave it undeclared, which reads back as GENERAL (accepts every catalog category).
          enum:
          - TIRE_RACK
          - OIL_STORAGE
          - BATTERY_RACK
          - SMALL_PARTS_BIN
          - BULK_FLOOR
          - STAGING
          - QUARANTINE
          - GENERAL
          example: TIRE_RACK
          type: string
        temperature:
          description: Temperature attributes of the storage location
          example:
            max: 8
            min: 2
            unit: C
          type: object
        type:
          description: Type classification of the storage location
          enum:
          - FLOOR
          - SHELF
          - BIN
          - CAGE
          - TRUCK
          example: BIN
          type: string
      required:
      - name
      - type
      type: object
