                value:
                  status: OUT_OF_SERVICE
            schema:
              $ref: '#/components/schemas/BayPatchRequest'
        description: 'Partial bay payload; only non-null fields are applied and all others are left unchanged, except maxDutyClass: omit it to leave it unchanged, send null to clear it to no limit, or 1-8 to set it.'
