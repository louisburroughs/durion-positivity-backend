          type: array
        status:
          description: 'Operational status of the mobile unit, matched case-insensitively: ACTIVE, OUT_OF_SERVICE or RETIRED. OUT_OF_SERVICE when omitted, with outOfServiceReason OTHER, for a unit staged before its policy, capabilities and coverage are configured.'
