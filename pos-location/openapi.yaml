                $ref: '#/components/schemas/ApiError'
          description: 'OUT_OF_SERVICE_REASON_REQUIRED: the resulting status is OUT_OF_SERVICE without outOfServiceReason, or outOfServiceReason is OTHER without outOfServiceNote.'
      security:
      - bearerAuth:
        - location:bay:manage
