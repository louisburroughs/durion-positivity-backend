                $ref: '#/components/schemas/ApiError'
          description: Location not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Bay name already taken at this location, including a retired bay's name.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'OUT_OF_SERVICE_REASON_REQUIRED: status is OUT_OF_SERVICE without outOfServiceReason, or outOfServiceReason is OTHER without outOfServiceNote.'
      security:
