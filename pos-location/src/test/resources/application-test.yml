spring:
  application:
    name: pos-location-test
  datasource:
    url: jdbc:h2:mem:location_test_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
  h2:
    console:
      enabled: false
  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

logging:
  level:
    health:
      show-details: INFO
    com:
      positivity: INFO
