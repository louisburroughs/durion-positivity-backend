domain: location
serviceName: pos-location
version: "1.0"
permissions:
  - name: "location:read"
    description: "Read location records and hierarchy data"
  - name: "location:write"
    description: "Create or update location records and defaults"
  - name: "location:bay:read"
    description: "Read bay definitions and availability"
  - name: "location:bay:manage"
    description: "Create or update bay definitions and assignments"
  - name: "location.mobile-unit.read"
    description: "Read mobile unit definitions and eligibility"
  - name: "location.mobile-unit.manage"
    description: "Create or update mobile unit definitions"
  - name: "location.service-area.read"
    description: "Read service area definitions"
  - name: "location.service-area.manage"
    description: "Create or update service area definitions"
  - name: "location.travel-buffer-policy.read"
    description: "Read travel buffer policy definitions"
  - name: "location.travel-buffer-policy.manage"
    description: "Create or update travel buffer policy definitions"
