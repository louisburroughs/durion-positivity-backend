          type: string
          description: Fleet/unit number. Optional; stored as empty when omitted.
          example: UNIT-1024
        description:
          type: string
          description: Human-readable vehicle description. Optional; stored as empty when omitted.
          example: 2024 Ford F-150 XL
        licensePlate:
          type: string
          description: License plate value.
          example: ABC1234
        licensePlateJurisdiction:
          type: string
          description: License plate jurisdiction/state or province.
          example: CA
        year:
          type: integer
          format: int32
          description: Model year.
          example: 2024
        make:
          type: string
          description: Vehicle make.
          example: Ford
        model:
          type: string
          description: Vehicle model.
          example: F-150
        trim:
          type: string
          description: Vehicle trim.
          example: XL
      required:
      - accountId
      - vin
    PreferencesMergeDto:
      type: object
      description: Request to partially merge fields into existing vehicle care preferences
      properties:
        partialPreferences:
          type: object
          description: Subset of preference fields to merge into existing preferences
          example:
            tireRotationInterval: 7500
        serviceIntervalMonths:
          type: integer
          format: int32
          description: Structured service interval in whole months; null leaves the current value unchanged (#1175)
          example: 6
          maximum: 120
          minimum: 1
        updatedByUserId:
          type: string
          format: uuid
          description: Identifier of the user updating the preferences
          example: 01960003-0000-7000-8000-000000000011
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
