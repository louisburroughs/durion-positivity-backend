spring:
  application:
    name: vehicle-inventory
  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 0
  tomcat:
    max-http-header-size: 65536

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    org:
      springframework: INFO
    com:
      positivity:
        vehicle: INFO

      netflix:
        discovery:
          shared:
            resolver:
              aws:
                ConfigClusterResolver: WARN
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json
pos:
  vehicle-inventory:
    kafka:
      # ADR-0044 domain-event flow (vehicle.events.v1 facts via the transactional outbox,
      # vehicle.commands.v1 replay/bootstrap commands, vehicle.manifest.v1 reconciliation).
      enabled: ${POS_VEHICLE_INVENTORY_KAFKA_ENABLED:false}
      events-topic: ${POS_VEHICLE_INVENTORY_EVENTS_TOPIC:vehicle.events.v1}
      commands-topic: ${POS_VEHICLE_INVENTORY_COMMANDS_TOPIC:vehicle.commands.v1}
      commands-consumer-group: ${POS_VEHICLE_INVENTORY_COMMANDS_CONSUMER_GROUP:pos-vehicle-inventory-commands}
    manifest:
      topic: ${POS_VEHICLE_INVENTORY_MANIFEST_TOPIC:vehicle.manifest.v1}
