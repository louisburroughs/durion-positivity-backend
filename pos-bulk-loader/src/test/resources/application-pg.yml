# Testcontainers Postgres profile (plan R-B7): the real baseline (Spring Batch metadata included),
# Hibernate validate, and the ADR-0062 runtime in strict mode (no default tenant), with the
# application pool connecting as the non-owner pos_app role. The ITs supply the datasource and
# Flyway credentials through @DynamicPropertySource.
spring:
  application:
    name: pos-bulk-loader-pg-test
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  batch:
    job:
      enabled: false
    jdbc:
      # V1__baseline_bulk_loader.sql carries the batch metadata tables
      initialize-schema: never
  cloud:
    discovery:
      enabled: false

pos:
  tenancy:
    # strict: nothing binds a tenant unless the test does
    default-tenant-id:
  security:
    permission-registration:
      enabled: false

bulk-loader:
  storage:
    local-root: ${java.io.tmpdir}/bulk-loader-pg-test

eureka:
  client:
    enabled: false

logging:
  level:
    com.positivity: INFO
