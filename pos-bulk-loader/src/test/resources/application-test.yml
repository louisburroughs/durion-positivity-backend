spring:
  application:
    name: pos-bulk-loader-test
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:h2:mem:bulkloader_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  batch:
    jdbc:
      initialize-schema: always
  cloud:
    discovery:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9999

eureka:
  client:
    enabled: false
