spring:
  application:
    name: pos-bulk-loader

  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

server:
  port: 0
  # Honor X-Forwarded-Proto/Host/Port/Prefix from the gateway/reverse-proxy chain so absolute
  # URLs built from the current request (e.g. the TUS Location header) use the public address.
  forward-headers-strategy: framework
  tomcat:
    max-http-header-size: 65536

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

pos:
  events:
    base-url: ${POS_EVENTS_BASE_URL:http://pos-event-receiver:8080}
    api-secret: ${POS_EVENTS_API_SECRET:}
  catalog:
    service-id: ${POS_CATALOG_SERVICE_ID:catalog}
  customer:
    service-id: ${POS_CUSTOMER_SERVICE_ID:customer}
  location:
    service-id: ${POS_LOCATION_SERVICE_ID:location}
  people:
    service-id: ${POS_PEOPLE_SERVICE_ID:people}
  price:
    service-id: ${POS_PRICE_SERVICE_ID:price}
  vehicle-inventory:
    service-id: ${POS_VEHICLE_INVENTORY_SERVICE_ID:vehicle-inventory}
  vehicle-fitment:
    service-id: ${POS_VEHICLE_FITMENT_SERVICE_ID:vehicle-fitment}
  inventory:
    service-id: ${POS_INVENTORY_SERVICE_ID:inventory}
  shop-manager:
    service-id: ${POS_SHOP_MANAGER_SERVICE_ID:shop-manager}
  security:
    service-id: ${POS_SECURITY_SERVICE_ID:security-service}

bulk-loader:
  storage:
    local-root: ${BULK_LOADER_STORAGE_ROOT:/tmp/bulk-loader}
  tus:
    max-upload-size: ${BULK_LOADER_TUS_MAX_UPLOAD_SIZE:536870912} # 512 MB
    expiry-hours: ${BULK_LOADER_TUS_EXPIRY_HOURS:24}
    cleanup-interval-ms: ${BULK_LOADER_TUS_CLEANUP_INTERVAL_MS:3600000} # 1 hour

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  default-produces-media-type: application/json

logging:
  level:
    com:
      netflix:
        discovery:
          shared:
            resolver:
              aws:
                ConfigClusterResolver: WARN
