spring:
  application:
    name: pos-bulk-loader

  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

server:
  port: 0
  tomcat:
    max-http-header-size: 65536

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

pos:
  events:
    base-url: ${POS_EVENTS_BASE_URL:http://pos-event-receiver:8080}
    api-secret: ${POS_EVENTS_API_SECRET:}
  catalog:
    base-url: ${POS_CATALOG_BASE_URL:http://localhost:8082}
  customer:
    base-url: ${POS_CUSTOMER_BASE_URL:http://localhost:8086}
  people:
    base-url: ${POS_PEOPLE_BASE_URL:http://localhost:8087}
  price:
    base-url: ${POS_PRICE_BASE_URL:http://localhost:8088}
  vehicle-inventory:
    base-url: ${POS_VEHICLE_INVENTORY_BASE_URL:http://localhost:8091}
  vehicle-fitment:
    base-url: ${POS_VEHICLE_FITMENT_BASE_URL:http://localhost:8092}

bulk-loader:
  storage:
    local-root: ${BULK_LOADER_STORAGE_ROOT:/tmp/bulk-loader}
  tus:
    max-upload-size: ${BULK_LOADER_TUS_MAX_UPLOAD_SIZE:536870912} # 512 MB
    expiry-hours: ${BULK_LOADER_TUS_EXPIRY_HOURS:24}
    cleanup-interval-ms: ${BULK_LOADER_TUS_CLEANUP_INTERVAL_MS:3600000} # 1 hour

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  default-produces-media-type: application/json

logging:
  level:
    com:
      netflix:
        discovery:
          shared:
            resolver:
              aws:
                ConfigClusterResolver: WARN
