spring:
  application:
    name: pos-bulk-loader

  datasource:
    url: jdbc:postgresql://localhost:5432/pos_bulk_loader_db
    username: ${SPRING_DATASOURCE_USERNAME:positivity}
    password: ${SPRING_DATASOURCE_PASSWORD:your_secure_password_here}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8080/realms/positivity}

server:
  port: ${SERVER_PORT:8090}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

pos:
  events:
    base-url: ${POS_EVENTS_BASE_URL:http://localhost:8085}
    api-secret: ${POS_EVENTS_API_SECRET:}
  catalog:
    base-url: ${POS_CATALOG_BASE_URL:http://localhost:8082}
  inventory:
    base-url: ${POS_INVENTORY_BASE_URL:http://localhost:8083}
  location:
    base-url: ${POS_LOCATION_BASE_URL:http://localhost:8084}

bulk-loader:
  storage:
    local-root: ${BULK_LOADER_STORAGE_ROOT:/tmp/bulk-loader}
