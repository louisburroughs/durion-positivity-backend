spring:
  application:
    name: pos-tax
  cloud:
    discovery:
      # Disabled by default - pos-tax is internal-only and should not be externally accessible
      # Enable only if deploying as standalone internal microservice
      enabled: false
  # Persistence for the T3 exemption-certificate registry (pos-tax's only table).
  # Deployed profiles (docker/alpha/prod) inject a Postgres datasource via env; dev/test
  # use in-memory H2 (see application-dev.yml / application-test.yml). Flyway owns the
  # schema; Hibernate only validates the mapping.
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  # CAP:550 S32c: pos-tax's Kafka rails (ADR-0044 §4): tax.registration.changed from the outbox, the
  # tax.manifest.v1 manifest and the tax.commands.v1 replay listener. Tier-1 and always on in deployed
  # profiles (@KafkaRails); the broker-less dev/test/pg profiles run without them.
  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: pos-tax-commands
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8091
  tomcat:
    max-http-header-size: 65536

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    # Do NOT register with Eureka by default - pos-tax is internal-only
    # Other services use it as a library dependency, not via REST calls
    register-with-eureka: false
    fetch-registry: false
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

  default-produces-media-type: application/json
# Tax service configuration
pos:
  tenancy:
    # ADR-0062: binds the alpha default tenant on every unbound path until every token carries tid
    default-tenant-id: ${POS_TENANCY_DEFAULT_TENANT_ID:01900000-0000-7000-8000-000000000001}
  tax:
    test-mode:
      # Default to the built-in test calculator until a real external tax service is wired.
      # Set TAX_TEST_MODE=false (and configure external-service.base-url) to route externally.
      enabled: ${TAX_TEST_MODE:true}
      default-rates:
        STATE: 0.0725 # 7.25% state tax
        COUNTY: 0.01 # 1% county tax
        CITY: 0.0025 # 0.25% city tax
    # Concrete external provider used when test-mode is disabled (story T6-external).
    # TEST_MODE (default/unset) -> legacy external stub; AVALARA -> real AvaTax adapter; EXTERNAL -> stub.
    provider: ${TAX_PROVIDER:TEST_MODE}
    external-service:
      base-url: ${TAX_SERVICE_URL:https://api.taxservice.example.com}
      api-key: ${TAX_SERVICE_API_KEY:}
      connect-timeout: 5000
      read-timeout: 10000
    # Avalara AvaTax REST v2 adapter (story T6-external). Env-var driven; license key is a
    # secret and is never logged. Sandbox base https://sandbox-rest.avatax.com, prod https://rest.avatax.com.
    avalara:
      base-url: ${AVALARA_BASE_URL:https://sandbox-rest.avatax.com}
      account-id: ${AVALARA_ACCOUNT_ID:}
      license-key: ${AVALARA_LICENSE_KEY:}
      company-code: ${AVALARA_COMPANY_CODE:DEFAULT}
      connect-timeout: 5000
      read-timeout: 10000
    retry:
      max-attempts: 3
      initial-backoff: 500
      multiplier: 2.0
    # Interim per-country default plug-in (ADR-0071 §3; CAP:550 S32a, #2636). An address in a listed
    # country is answered by the named plug-in in every provider mode; every other country keeps the
    # switch above. The self-hosted plug-in of a profiled country is <country>_SELF. ADR-0071 step 1
    # (#2629) makes this map the fallback of the per-tenant binding.
    default-providers:
      CA: CA_SELF
    # Per-country tax profiles (CAP:550 S32a). Every value below is a PLACEHOLDER held for expert advice
    # (spec AW48, OI-4): the tax types, the regime grouping and the recoverability flags. No rate ships:
    # `rates` stays empty, so an address here answers 422 TAX_JURISDICTION_NOT_CONFIGURED until rates are
    # advised. Tests and dev use fixture rows marked "not tax law". Rows: {region-code, tax-type, rate,
    # effective-from, effective-to?}; adding a country is a block here plus a default-providers entry.
    # Country keys must be upper case and cannot be set through environment variables (relaxed binding
    # lower-cases them, and the startup check then refuses the key).
    countries:
      CA:
        currency: CAD
        tax-types: # a list with explicit codes, so binding never mangles a code
          - { code: GST, regime: GST_HST, jurisdiction-type: COUNTRY, input-tax-recoverable: true }
          - { code: HST, regime: GST_HST, jurisdiction-type: PROVINCE, input-tax-recoverable: true }
          - { code: QST, regime: QST, jurisdiction-type: PROVINCE, input-tax-recoverable: true }
          - { code: PST, jurisdiction-type: PROVINCE, input-tax-recoverable: false } # no regime
        regimes: # empty regions = the whole country
          - { code: GST_HST, regions: [] }
          - { code: QST, regions: [QC] }
        # rates: none shipped (OI-4)
        # CAP:550 S32b. The regime whose shape a supplier's number must match (placeholder, OI-4).
        supplier-registration-regime: GST_HST
        # Evidence rules in the profile's currency (placeholder threshold and scope, OI-4; no $500 tier).
        # Rows: {rule, from-amount, applies-to[], effective-from?, effective-to?}.
        evidence-rules:
          - { rule: SUPPLIER_REGISTRATION_NUMBER, from-amount: 100.00, applies-to: [DRAWER_RECEIPT, VENDOR_BILL] }
    # Registration-number shapes (CAP:550 S32b; ADR-0072 Decision 1). A SECURITY CONTROL: shipped configuration,
    # changed only by a reviewed commit, never per tenant, by a tenant, by a tax provider or at runtime (never
    # bind these from the environment). `#` is one digit, A-Z stand for themselves; a shape must contain a letter.
    # Every regime a country profile declares needs a shape, or startup fails. Placeholders held for expert
    # advice (OI-4).
    registration:
      formats:
        - { regime: GST_HST, shape: "#########RT####" }
        - { regime: QST, shape: "##########TQ####" }
    # CAP:550 S32c (ADR-0071 §6): per-caller front-door secrets. The tax-registration writes accept only
    # pos-accounting, with this secret in X-Pos-Tax-Front-Door-Secret. From the environment or a secret store,
    # never from code or a shipped file. Unset (blank), every registration write answers 401.
    front-doors:
      accounting-secret: ${POS_TAX_ACCOUNTING_SECRET:}
    # CAP:550 S32c: tax.registration.changed by outbox, per-tenant manifests and replay (ADR-0044 §4).
    kafka:
      events-topic: ${POS_TAX_EVENTS_TOPIC:tax.events.v1}
      commands-topic: ${POS_TAX_COMMANDS_TOPIC:tax.commands.v1}
      commands-consumer-group: ${POS_TAX_COMMANDS_CONSUMER_GROUP:pos-tax-commands}
    outbox:
      poll-interval-ms: ${POS_TAX_OUTBOX_POLL_INTERVAL_MS:1000}
      send-timeout-ms: ${POS_TAX_OUTBOX_SEND_TIMEOUT_MS:10000}
      replay:
        max-lookback: ${POS_TAX_OUTBOX_REPLAY_MAX_LOOKBACK:P30D}
    manifest:
      topic: ${POS_TAX_MANIFEST_TOPIC:tax.manifest.v1}
      window: ${POS_TAX_MANIFEST_WINDOW:PT1H}
      grace: ${POS_TAX_MANIFEST_GRACE:PT5M}
      poll-interval-ms: ${POS_TAX_MANIFEST_POLL_INTERVAL_MS:300000}
    # Stated-tax plausibility (CAP:550 S32b, AW55): minor units added to each stated amount's maximum
    # (placeholder, OI-4).
    plausibility:
      tolerance-minor-units: 5
    # Information-return forms per country (CAP:550 #2615, AW48): the forms a vendor may be reported in, their
    # boxes and the payee-id schemes. Every row is a PLACEHOLDER held for expert advice (OI-4), never tax law:
    # which forms apply, their boxes, the schemes, thresholds and filing rules are all undecided. Country keys
    # are upper case and cannot be set through environment variables (relaxed binding lower-cases them, and the
    # startup check then refuses the key). Forms and boxes are lists with explicit codes; quote box codes so
    # "020" stays text. Adding a country is a block here. Checked at startup by InformationReturnForms.
    information-returns:
      US:
        forms:
          - code: US_1099_NEC
            label: "Form 1099-NEC (placeholder)"
            boxes:
              - { code: "1", label: "Box 1 (placeholder)" }
            payee-id-schemes: [EIN, SSN, ITIN]
          - code: US_1099_MISC
            label: "Form 1099-MISC (placeholder)"
            boxes:
              - { code: "1", label: "Box 1 (placeholder)" }
              - { code: "2", label: "Box 2 (placeholder)" }
              - { code: "3", label: "Box 3 (placeholder)" }
              - { code: "6", label: "Box 6 (placeholder)" }
              - { code: "10", label: "Box 10 (placeholder)" }
            payee-id-schemes: [EIN, SSN, ITIN]
      CA:
        forms:
          - code: CA_T4A
            label: "T4A (placeholder)"
            boxes:
              - { code: "020", label: "Box 020 (placeholder)" }
              - { code: "048", label: "Box 048 (placeholder)" }
            payee-id-schemes: [BN, SIN]

logging:
  level:
    com:
      netflix:
        discovery:
          shared:
            resolver:
              aws:
                ConfigClusterResolver: WARN
