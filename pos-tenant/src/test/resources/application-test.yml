spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: pos-tenant-test
  datasource:
    url: jdbc:h2:mem:tenant_test_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

pos:
  tenant:
    kafka:
      enabled: false
