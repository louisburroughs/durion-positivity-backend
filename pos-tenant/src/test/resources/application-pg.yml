# Testcontainers Postgres profile (plan R-B7): the real baseline + bootstrap seed, Hibernate
# validate, and the ADR-0062 runtime in strict mode (no default tenant), with the application pool
# connecting as the non-owner pos_app role. The ITs supply the datasource and Flyway credentials
# through @DynamicPropertySource.
spring:
  application:
    name: pos-tenant-pg-test
  autoconfigure:
    exclude: org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  cloud:
    discovery:
      enabled: false

pos:
  tenancy:
    # strict: nothing binds a tenant unless the test does
    default-tenant-id:

eureka:
  client:
    enabled: false

logging:
  level:
    com.positivity: INFO

# Test contexts never reach pos-security-service or pos-event-receiver. Skip permission registration
# (its startup retry loop otherwise sleeps ~8 s in every Spring test context) and point the event-type
# initializer at a loopback port that refuses instantly. Same arrangement as pos-mcp-server's test profile.
pos.security.permission-registration.enabled: false
pos.events.base-url: http://127.0.0.1:1
