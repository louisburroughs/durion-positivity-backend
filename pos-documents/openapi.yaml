openapi: 3.1.0
info:
  title: Positivity Documents API
  description: API documentation for document rendering and format conversion
  contact:
    name: Durion Support Services
    email: louis.burroughs@gmail.com
  version: v1
servers:
- url: http://localhost:8086
  description: Generated server url
tags:
- name: Document Render API
  description: Render source content into PDF output
paths:
  /v1/documents/render:
    post:
      tags:
      - Document Render API
      summary: Render document to PDF
      description: Renders input content and template context into a PDF document.
      operationId: renderDocument
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderRequest'
        required: true
      responses:
        '200':
          description: PDF rendered successfully
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid render request
          content:
            application/pdf:
              schema:
                type: string
                format: byte
        '403':
          description: Forbidden
          content:
            application/pdf:
              schema:
                type: string
                format: byte
      security:
      - bearerAuth:
        - documents:render
      x-required-permissions:
      - documents:render
components:
  schemas:
    RenderRequest:
      type: object
      description: Request to render document content into a target output format
      properties:
        format:
          type: string
          description: Target output format for the rendered document
          enum:
          - JSON
          - XML
          - MARKDOWN
          - TEXT
          - CSV
          example: JSON
        templateId:
          type: string
          description: Optional identifier of the template to apply when rendering
          example: invoice-default
        content:
          type: string
          description: Raw content to be rendered into the target format
          example:
            title: Invoice
            total: 125.0
          minLength: 1
      required:
      - content
      - format
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
