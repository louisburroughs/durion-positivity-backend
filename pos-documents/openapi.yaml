openapi: 3.1.0
info:
  title: Positivity Documents API
  description: API documentation for document rendering and format conversion
  contact:
    name: Durion Support Services
    email: louis.burroughs@gmail.com
  version: v1
servers:
- url: http://localhost:8086
  description: Generated server url
tags:
- name: Document Render API
  description: Render source content into PDF output
paths:
  /v1/documents/render:
    post:
      tags:
      - Document Render API
      summary: Render document to PDF
      description: 'Renders the supplied source content into a PDF document and returns the PDF bytes inline.

        Use this tool when a printable document is needed from structured content; do not use it to

        store or retrieve documents, because nothing is persisted and every call re-renders from the

        request alone.

        Preconditions: none beyond an authenticated caller with documents:render; when templateId is

        supplied the named template must exist.

        Required inputs: format (JSON, XML, MARKDOWN, TEXT or CSV, describing the source content) and

        content, the raw text to render; templateId is optional and applies the named layout.

        Emits a DOCUMENT_RENDER event; no document record is created and the output exists only in the

        response body.

        Returns 400 when the format is missing or unsupported, 404 when the named template does not

        exist, 422 when the content is blank or exceeds the maximum input size, and 500 when PDF

        rendering itself fails.

        '
      operationId: renderDocument
      requestBody:
        description: Source content and target format to render into a PDF.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderRequest'
            examples:
              Invoice content with a template:
                description: Invoice content with a template
                value:
                  format: JSON
                  templateId: invoice-default
                  content: '{"title":"Invoice","total":125.00}'
        required: true
      responses:
        '200':
          description: PDF rendered successfully
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid render request
          content:
            application/pdf:
              schema:
                type: string
                format: byte
        '403':
          description: Forbidden
          content:
            application/pdf:
              schema:
                type: string
                format: byte
      security:
      - bearerAuth:
        - documents:render
      x-required-permissions:
      - documents:render
components:
  schemas:
    RenderRequest:
      type: object
      description: Request to render document content into a target output format
      properties:
        format:
          type: string
          description: Target output format for the rendered document
          enum:
          - JSON
          - XML
          - MARKDOWN
          - TEXT
          - CSV
          example: JSON
        templateId:
          type: string
          description: Optional identifier of the template to apply when rendering
          example: invoice-default
        content:
          type: string
          description: Raw content to be rendered into the target format
          example:
            title: Invoice
            total: 125.0
          minLength: 1
      required:
      - content
      - format
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
