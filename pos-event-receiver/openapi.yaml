openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8086
  description: Generated server url
tags:
- name: Event Types
  description: Manage EventTypes for PreregisteredEvents
- name: Event Summary
  description: Query aggregated event counts by timeframe
- name: Event Emission
  description: Receive and persist emitted events from internal services
paths:
  /v1/eventTypes/{id}:
    get:
      tags:
      - Event Types
      summary: Get event type by ID
      description: Retrieve a specific event type by its unique ID
      operationId: getEventTypeById
      parameters:
      - name: id
        in: path
        description: EventType ID
        required: true
        schema:
          type: string
          format: uuid
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
      responses:
        '200':
          description: Event type found and returned
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventTypeResponse'
        '404':
          description: Event type not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventTypeResponse'
    put:
      tags:
      - Event Types
      summary: Update event type
      description: Update an existing event type
      operationId: updateEventType
      parameters:
      - name: id
        in: path
        description: EventType ID
        required: true
        schema:
          type: string
          format: uuid
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
      requestBody:
        description: Updated event type details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventTypeRequest'
        required: true
      responses:
        '200':
          description: Event type updated successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventTypeResponse'
        '404':
          description: Event type not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventTypeResponse'
    delete:
      tags:
      - Event Types
      summary: Delete event type
      description: Delete an event type by ID
      operationId: deleteEventType
      parameters:
      - name: id
        in: path
        description: EventType ID to delete
        required: true
        schema:
          type: string
          format: uuid
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
      responses:
        '204':
          description: Event type deleted successfully
        '404':
          description: Event type not found
  /v1/eventTypes/code/{typeCode}:
    get:
      tags:
      - Event Types
      summary: Get event type by code
      description: Retrieve a specific event type by its unique type code
      operationId: getEventTypeByCode
      parameters:
      - name: typeCode
        in: path
        description: Event type code
        required: true
        schema:
          type: string
          minLength: 1
        example: ORDER_CREATED
      responses:
        '200':
          description: Event type found and returned
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventTypeResponse'
        '404':
          description: Event type not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventTypeResponse'
    put:
      tags:
      - Event Types
      summary: Upsert event type
      description: Create or update an event type by type code
      operationId: upsertEventType
      parameters:
      - name: typeCode
        in: path
        description: Event type code
        required: true
        schema:
          type: string
          minLength: 1
        example: ORDER_ORDER_CREATE
      requestBody:
        description: Event type details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventTypeRequest'
        required: true
      responses:
        '200':
          description: Event type created or updated successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventTypeResponse'
        '400':
          description: Invalid request parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventTypeResponse'
  /v1/events:
    post:
      tags:
      - Event Emission
      summary: Receive emitted event
      description: Stores a preregistered emitted event payload
      operationId: receiveEvent
      requestBody:
        description: Event payload to persist
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmitEventRequest'
        required: true
      responses:
        '200':
          description: Event stored successfully
          content:
            '*/*':
              schema:
                type: string
        '400':
          description: Event type ID is not preregistered
          content:
            '*/*':
              schema:
                type: string
  /v1/eventTypes:
    get:
      tags:
      - Event Types
      summary: Get all event types
      description: Retrieve all available event types
      operationId: getAllEventTypes
      responses:
        '200':
          description: List of event types returned successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventTypeResponse'
    post:
      tags:
      - Event Types
      summary: Create event type
      description: Create a new event type for preregistered events
      operationId: createEventType
      requestBody:
        description: Event type details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventTypeRequest'
        required: true
      responses:
        '201':
          description: Event type created successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventTypeResponse'
        '400':
          description: Invalid request parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventTypeResponse'
  /v1/events/summary/lastWeek:
    get:
      tags:
      - Event Summary
      summary: Get event summary for the last week
      description: Returns event counts grouped by event type for the last 7 days
      operationId: getLastWeekSummary
      responses:
        '200':
          description: Summary returned successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventSummaryResponse'
  /v1/events/summary/lastHour:
    get:
      tags:
      - Event Summary
      summary: Get event summary for the last hour
      description: Returns event counts grouped by event type for the last 60 minutes
      operationId: getLastHourSummary
      responses:
        '200':
          description: Summary returned successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventSummaryResponse'
  /v1/events/summary/lastDay:
    get:
      tags:
      - Event Summary
      summary: Get event summary for the last day
      description: Returns event counts grouped by event type for the last 24 hours
      operationId: getLastDaySummary
      responses:
        '200':
          description: Summary returned successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventSummaryResponse'
  /v1/eventTypes/active:
    get:
      tags:
      - Event Types
      summary: Get active event types
      description: Retrieve only active event types
      operationId: getActiveEventTypes
      responses:
        '200':
          description: List of active event types returned successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventTypeResponse'
components:
  schemas:
    EventTypeRequest:
      type: object
      description: Request body for creating or updating an EventType
      properties:
        typeCode:
          type: string
          description: Unique code identifying the event type
          example: ORDER_CREATED
          minLength: 1
          pattern: ^[A-Z0-9_]+$
        description:
          type: string
          description: Human-readable description of the event type
          example: Triggered when an order is created
          minLength: 1
        active:
          type: boolean
          description: Whether the event type is active
          example: true
        apiVersion:
          type: string
          description: API version for this event type
          example: '1'
          pattern: ^[0-9]+$
        p50Micros:
          type: integer
          format: int64
          description: '50th percentile latency threshold in microseconds (default: 10,000,000 = 10s)'
          example: 500000
        p95Micros:
          type: integer
          format: int64
          description: '95th percentile latency threshold in microseconds (default: 10,000,000 = 10s)'
          example: 1000000
        p99Micros:
          type: integer
          format: int64
          description: '99th percentile latency threshold in microseconds (default: 10,000,000 = 10s)'
          example: 2000000
      required:
      - description
      - typeCode
    EventTypeResponse:
      type: object
      description: Response payload representing a registered event type
      properties:
        id:
          type: string
          format: uuid
          description: Event type identifier
          example: 018e1c9f-6b5a-7890-abcd-1234567890ab
        typeCode:
          type: string
          description: Unique event type code
          example: ORDER_CREATED
        description:
          type: string
          description: Human-readable event type description
          example: Triggered when an order is created
        active:
          type: boolean
          description: Whether this event type is active
          example: true
        apiVersion:
          type: string
          description: Event API version
          example: '1'
        p50Micros:
          type: integer
          format: int64
          description: p50 latency threshold in microseconds
          example: 500000
        p95Micros:
          type: integer
          format: int64
          description: p95 latency threshold in microseconds
          example: 1000000
        p99Micros:
          type: integer
          format: int64
          description: p99 latency threshold in microseconds
          example: 2000000
      required:
      - active
      - apiVersion
      - description
      - id
      - p50Micros
      - p95Micros
      - p99Micros
      - typeCode
    EmitEventRequest:
      type: object
      description: Request payload used to emit and persist an application event
      properties:
        id:
          type: string
          description: Preregistered event type code
          example: ORDER_ORDER_CREATE
          minLength: 1
          pattern: ^[A-Z0-9_]+$
        apiVersion:
          type: string
          description: Event API version
          example: '1'
          minLength: 1
          pattern: ^[0-9]+$
        timestamp:
          type: integer
          format: int64
          description: Event timestamp in epoch milliseconds
          example: 1730809200000
        elapsedMs:
          type: integer
          format: int64
          description: Elapsed operation time in milliseconds
          example: 42
        publishedAt:
          type: string
          format: date-time
          description: Event publication time in UTC
          example: 2026-03-05 21:15:00+00:00
      required:
      - apiVersion
      - elapsedMs
      - id
      - publishedAt
      - timestamp
    EventSummaryResponse:
      type: object
      description: Event count grouped by event type for a given timeframe
      properties:
        eventTypeId:
          type: string
          description: Event type identifier
          example: ORDER_ORDER_CREATE
        count:
          type: integer
          format: int64
          description: Number of events of this type in the timeframe
          example: 42
