spring:
  application:
    name: event-receiver
  datasource:
    url: jdbc:postgresql://localhost:5432/pos_event_receiver_db
    username: ${SPRING_DATASOURCE_USERNAME:pos_user}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 0

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# Shared secret for API authentication (avoids circular dependency with pos-security-service)
# Set via POS_EVENTS_API_SECRET environment variable in production
pos:
  events:
    api-secret: ${POS_EVENTS_API_SECRET:}

logging:
  level:
    root: INFO
    org:
      springframework: INFO
    com:
      positivity:
        event:
          receiver: INFO
