spring:
  application:
    name: event-receiver
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    # V1_1 (emitted_event without row security) must run on databases that already carry V2.
    out-of-order: true

server:
  port: 0
  tomcat:
    max-http-header-size: 65536

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# Shared secret for API authentication (avoids circular dependency with pos-security-service)
# Set via POS_EVENTS_API_SECRET environment variable in production
pos:
  tenancy:
    # ADR-0062: binds the alpha default tenant on every unbound path until every token carries tid
    default-tenant-id: ${POS_TENANCY_DEFAULT_TENANT_ID:01900000-0000-7000-8000-000000000001}
  events:
    api-secret: ${POS_EVENTS_API_SECRET:}

logging:
  level:
    root: INFO
    org:
      springframework: INFO
    com:
      positivity:
        event:
          receiver: INFO

      netflix:
        discovery:
          shared:
            resolver:
              aws:
                ConfigClusterResolver: WARN