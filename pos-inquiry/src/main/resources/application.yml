spring:
  application:
    name: inquiry
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://localhost:5432/pos_inquiry_db
    username: pos_user
    password: pos_password
    driver-class-name: org.postgresql.Driver

server:
  port: 0
  servlet:
    context-path: /

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    org:
      springframework:
        web: INFO
      hibernate: INFO
    com:
      positivity:
        inquiry: INFO
