openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8086
  description: Generated server url
tags:
- name: System Prompts
  description: Operations for managing MCP system prompts
- name: LLM API Configuration
  description: LLM provider API configuration management
- name: Document Ingestion
  description: RAG document ingestion job management
- name: NLTI Audit
  description: NLTI Audit Ledger Query
- name: NLTI
  description: Natural Language Task Interface
paths:
  /v1/prompts/{id}:
    get:
      tags:
      - System Prompts
      summary: Get system prompt
      description: Retrieve a single MCP system prompt by its identifier
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: System prompt returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemPromptResponse'
        '404':
          description: System prompt not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemPromptResponse'
      security:
      - bearerAuth:
        - mcp:system_prompt:view
    put:
      tags:
      - System Prompts
      summary: Update system prompt
      description: Update an existing MCP system prompt by replacing its editable fields
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemPromptRequest'
        required: true
      responses:
        '200':
          description: System prompt updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemPromptResponse'
        '404':
          description: System prompt not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemPromptResponse'
      security:
      - bearerAuth:
        - mcp:system_prompt:update
    delete:
      tags:
      - System Prompts
      summary: Delete system prompt
      description: Delete an MCP system prompt so it can no longer be selected for agent sessions
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: System prompt deleted
        '404':
          description: System prompt not found
      security:
      - bearerAuth:
        - mcp:system_prompt:delete
  /v1/llm-apis/{id}:
    get:
      tags:
      - LLM API Configuration
      summary: Get an LLM API configuration
      description: Retrieve a single LLM API provider configuration by its identifier.
      operationId: get_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmApiConfigResponse'
      security:
      - bearerAuth:
        - mcp:llm_api:view
    put:
      tags:
      - LLM API Configuration
      summary: Update an LLM API configuration
      description: Update an existing LLM API provider configuration by its identifier.
      operationId: update_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmApiConfigRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmApiConfigResponse'
      security:
      - bearerAuth:
        - mcp:llm_api:update
    delete:
      tags:
      - LLM API Configuration
      summary: Delete an LLM API configuration
      description: Delete an existing LLM API provider configuration by its identifier.
      operationId: delete_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
      security:
      - bearerAuth:
        - mcp:llm_api:delete
  /v1/prompts:
    get:
      tags:
      - System Prompts
      summary: List system prompts
      description: List all configured MCP system prompts that can be assigned to agents
      operationId: list
      responses:
        '200':
          description: System prompts returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SystemPromptResponse'
      security:
      - bearerAuth:
        - mcp:system_prompt:view
    post:
      tags:
      - System Prompts
      summary: Create system prompt
      description: Create a new MCP system prompt that can be used during agent orchestration
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemPromptRequest'
        required: true
      responses:
        '201':
          description: System prompt created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemPromptResponse'
        '400':
          description: System prompt request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemPromptResponse'
      security:
      - bearerAuth:
        - mcp:system_prompt:create
  /v1/nlt/requests:
    post:
      tags:
      - NLTI
      summary: Submit a natural language task request
      description: Submit a natural language task request for asynchronous MCP processing and correlation tracking
      operationId: submitRequest
      parameters:
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NltiRequestDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NltiResponseV1'
      security:
      - bearerAuth:
        - nlti:request:submit
  /v1/mcp/documents:
    post:
      tags:
      - Document Ingestion
      summary: Queue a document for ingestion into the RAG vector store
      description: Submit a document for asynchronous ingestion into the RAG vector store. The request includes the document content and optional metadata. The response returns a job ID that can be used to track the ingestion status.
      operationId: ingestDocument
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentIngestionRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIngestionJobResponse'
      security:
      - bearerAuth:
        - mcp:document:ingest
  /v1/mcp/chat:
    post:
      tags:
      - mcp-chat-controller
      summary: Execute MCP chat message
      description: Executes a chat message and returns the full response once complete. For streaming responses, use the /chat/stream endpoint which returns tokens as they are generated.
      operationId: chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
      security:
      - bearerAuth:
        - mcp:chat:execute
  /v1/mcp/chat/stream:
    post:
      tags:
      - mcp-streaming-chat-controller
      summary: Execute MCP streaming chat - returns SSE token stream
      description: Executes a streaming chat message and returns a stream of tokens as Server-Sent Events (SSE). Each token is sent as an individual SSE with event type 'chat'.
      operationId: streamChat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamChatRequest'
        required: true
      responses:
        '200':
          description: Stream of SSE chat tokens
          content:
            text/event-stream:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServerSentEventString'
      security:
      - bearerAuth:
        - mcp:chat:stream
  /v1/llm-apis:
    get:
      tags:
      - LLM API Configuration
      summary: List LLM API configurations
      description: Retrieve all configured LLM API provider definitions that are available to the MCP server.
      operationId: list_1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LlmApiConfigResponse'
      security:
      - bearerAuth:
        - mcp:llm_api:view
    post:
      tags:
      - LLM API Configuration
      summary: Create an LLM API configuration
      description: Create a new LLM API provider configuration for use by the MCP server.
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmApiConfigRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmApiConfigResponse'
      security:
      - bearerAuth:
        - mcp:llm_api:create
  /v1/nlt/audit:
    get:
      tags:
      - NLTI Audit
      summary: Query the NLTI audit ledger
      description: Query the NLTI audit ledger with optional filters for correlation ID, time range, and event type. Results are paginated.
      operationId: queryAudit
      parameters:
      - name: correlationId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: eventType
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
        required: false
        schema:
          type: array
          default:
          - timestamp,ASC
          items:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageAuditEventResponse'
      security:
      - bearerAuth:
        - nlti:audit:read
  /v1/mcp/documents/jobs/{jobId}:
    get:
      tags:
      - Document Ingestion
      summary: Get RAG document ingestion job status
      description: Retrieve the status and details of an asynchronous document ingestion job using its job ID. The response includes the current status, timestamps, and any error messages if applicable.
      operationId: getIngestionJob
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIngestionJobResponse'
      security:
      - bearerAuth:
        - mcp:document:ingest
components:
  schemas:
    SystemPromptRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
      required:
      - content
      - name
    SystemPromptResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LlmApiConfigRequest:
      type: object
      properties:
        apiId:
          type: string
          minLength: 1
        model:
          type: string
          minLength: 1
        baseUrl:
          type: string
          minLength: 1
        apiKey:
          type: string
          minLength: 1
        headers:
          type: object
          additionalProperties:
            type: string
      required:
      - apiId
      - apiKey
      - baseUrl
      - model
    LlmApiConfigResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        apiId:
          type: string
        model:
          type: string
        baseUrl:
          type: string
        apiKey:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NltiRequestDTO:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
        sessionId:
          type: string
          format: uuid
        clientContext:
          type: object
      required:
      - prompt
    NltiResponseV1:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        correlationId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        status:
          type: string
        meta:
          type: object
    DocumentIngestionRequest:
      type: object
      description: Document ingestion payload
      example:
        content: sample
        metadata:
          document_id: policy-123
          source: manual
      properties:
        content:
          type: string
          minLength: 1
        metadata:
          type: object
          description: Optional key-value metadata for the document
      required:
      - content
    DocumentIngestionJobResponse:
      type: object
      description: Asynchronous document ingestion job status
      properties:
        jobId:
          type: string
          format: uuid
        documentId:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - RUNNING
          - SUCCEEDED
          - FAILED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        chunkCount:
          type: integer
          format: int32
        errorMessage:
          type: string
    ChatRequest:
      type: object
      description: Chat request payload
      example:
        message: Hello
      properties:
        message:
          type: string
          minLength: 1
      required:
      - message
    ChatResponse:
      type: object
      description: Chat response payload
      example:
        response: Hi!
      properties:
        response:
          type: string
    ServerSentEventString:
      type: object
      description: A Server-Sent Event carrying a string data payload
      properties:
        id:
          type: string
        event:
          type: string
        data:
          type: string
        retry:
          type: integer
          format: int64
        comment:
          type: string
    StreamChatRequest:
      type: object
      description: Streaming chat request payload
      example:
        message: Hello
      properties:
        message:
          type: string
          minLength: 1
      required:
      - message
    AuditEventResponse:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        correlationId:
          type: string
          format: uuid
        eventType:
          type: string
        timestamp:
          type: string
          format: date-time
        actorSubjectId:
          type: string
        payloadRef:
          type: string
    PageAuditEventResponse:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: '#/components/schemas/AuditEventResponse'
        number:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: '#/components/schemas/PageableObject'
        sort:
          $ref: '#/components/schemas/SortObject'
        empty:
          type: boolean
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        paged:
          type: boolean
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/SortObject'
        unpaged:
          type: boolean
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        unsorted:
          type: boolean
        sorted:
          type: boolean
