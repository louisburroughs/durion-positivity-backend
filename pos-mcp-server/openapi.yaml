    StreamChatRequest:
      description: Streaming chat request payload
      example:
        message: Hello
      properties:
        message:
          description: User chat message to stream to the agent
          example: Hello
          minLength: 1
          type: string
      required:
      - message
      type: object
    SystemPromptRequest:
      description: Request to create or update a reusable system prompt
      properties:
        content:
          description: Text content of the system prompt
          example: You are a helpful assistant that creates workorders.
          minLength: 1
          type: string
        name:
          description: Human-readable name identifying the system prompt
          example: Workorder Assistant
          minLength: 1
          type: string
      required:
      - content
      - name
      type: object
    SystemPromptResponse:
      description: Stored reusable system prompt returned to clients
      properties:
        content:
          description: Text content of the system prompt
          example: You are a helpful assistant that creates workorders.
          type: string
        createdAt:
          description: Timestamp when the system prompt was created (ISO 8601)
          example: '2026-01-15T09:30:00Z'
          format: date-time
          type: string
        id:
          description: Unique identifier of the stored system prompt
          example: 01960003-0000-7000-8000-000000000008
          format: uuid
          type: string
        name:
          description: Human-readable name identifying the system prompt
          example: Workorder Assistant
          type: string
        updatedAt:
          description: Timestamp when the system prompt was last updated (ISO 8601)
          example: '2026-01-16T11:45:00Z'
          format: date-time
          type: string
      required:
      - content
      - createdAt
      - id
      - name
      - updatedAt
      type: object
    ToolPermissionRequest:
      description: Request to grant a permission code to a discovered OpenAPI tool
      properties:
        permissionCode:
          description: Permission code that must be held for the tool to be selectable. Either the literal AUTHENTICATED or a domain:resource:action code.
          example: event-receiver:event_type:view
          minLength: 1
          pattern: AUTHENTICATED|[a-z0-9-]+:[a-z0-9_-]+:[a-z0-9_-]+
          type: string
      required:
      - permissionCode
      type: object
    ToolPermissionsResponse:
      description: The permission codes currently granted to a discovered OpenAPI tool
      properties:
        permissionCodes:
          description: Granted permission codes (a caller holding any one may select the tool)
          items:
            type: string
          type: array
        toolName:
          description: Unique tool name
          example: event-receiver_getactiveeventtypes
          type: string
      type: object
    TranscriptionResponse:
      description: Transcript produced from one audio clip. The audio itself is never returned or stored.
      properties:
        durationSeconds:
          description: Clip duration in seconds as reported by the speech-to-text provider. Omitted when the provider does not report it — length is then bounded only by the request's size limit, not returned to the caller.
          example: 7.2
          format: double
          type: number
        language:
          description: 'BCP-47 language tag for the transcript: the requested `language`, else the provider-detected language, else "und" (undetermined) when neither is known.'
          example: en-US
          type: string
        text:
          description: The transcribed text, trimmed. Never blank — a clip with nothing intelligible in it fails the request (422) rather than returning an empty transcript.
          example: how many mechanics do i have
          type: string
      required:
      - language
      - text
      type: object
    UpdateConversationRequest:
      description: Partial update for a conversation's title and/or pinned state.
      properties:
        pinned:
          description: New pinned state. Omit to leave the pinned state unchanged. Pinned conversations are exempt from retention purge.
          type: boolean
        title:
          description: New title, 1..120 characters after trimming. Omit to leave the title unchanged.
          example: Mechanic roster (renamed)
          maxLength: 120
          minLength: 1
          type: string
      type: object
    WorkflowStateResponse:
      description: The session's workflow state after the update
      properties:
        sessionId:
          description: Session identifier
          format: uuid
          type: string
        workflowState:
          description: Current workflow state
          enum:
          - IDLE
          - CREATING_PO
          - RECEIVING_ASN
          - INVENTORY_RECON
          - PROCESSING_RETURN
          type: string
      required:
      - sessionId
      - workflowState
      type: object
    WorkflowStateUpdateRequest:
      description: Requested workflow state for the session
      properties:
        workflowState:
          description: The operational workflow state to set on the session
          enum:
          - IDLE
          - CREATING_PO
          - RECEIVING_ASN
          - INVENTORY_RECON
          - PROCESSING_RETURN
          type: string
      required:
      - workflowState
      type: object
    WritePlanResponseV1:
      description: Write-action plan preview / confirmation outcome (version 1)
      properties:
        args:
          description: Exact arguments that will be executed on confirmation
          type: object
        executedAt:
          description: Instant the plan was executed, when complete
          format: date-time
          type: string
        executionResult:
          description: Execution outcome returned by the tool, when complete
          type: string
        expiresAt:
          description: Instant after which the plan can no longer be confirmed
          format: date-time
          type: string
        idempotencyKey:
          description: Idempotency key; re-sending confirm with this key never double-executes
          type: string
        inferredDefaultArgs:
          description: Argument names filled by an inferred default (disclosed per Gate 6)
          items:
            type: string
          type: array
          uniqueItems: true
        planId:
          description: Write plan identifier
          format: uuid
          type: string
        requestId:
          description: Originating NLTI request identifier
          format: uuid
          type: string
        riskLevel:
          description: Assessed risk level
          example: MEDIUM
          type: string
        sessionId:
          description: Conversation session identifier
          format: uuid
          type: string
        status:
          description: Plan lifecycle status
          example: PENDING_CONFIRMATION
          type: string
        summary:
          description: Human-readable summary of the planned action
          type: string
        targetTool:
          description: Tool the plan will invoke on confirmation
          type: string
      required:
      - args
      - expiresAt
      - idempotencyKey
      - inferredDefaultArgs
      - planId
      - requestId
      - riskLevel
      - sessionId
      - status
      - summary
      - targetTool
      type: object
