openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8086
  description: Generated server url
tags:
- name: System Prompts
  description: Operations for managing MCP system prompts
- name: LLM API Configuration
  description: LLM provider API configuration management
- name: Document Ingestion
  description: RAG document ingestion job management
- name: NLTI Audit
  description: NLTI Audit Ledger Query
- name: NLTI
  description: Natural Language Task Interface
- name: MCP Tool Permissions
  description: Manage the permission codes that gate discovered OpenAPI tools
paths:
  /v1/prompts/{id}:
    get:
      tags:
      - System Prompts
      summary: Get system prompt
      description: Retrieve a single MCP system prompt by its identifier
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: System prompt returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemPromptResponse'
        '404':
          description: System prompt not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemPromptResponse'
      security:
      - bearerAuth:
        - mcp:system_prompt:view
    put:
      tags:
      - System Prompts
      summary: Update system prompt
      description: Update an existing MCP system prompt by replacing its editable fields
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemPromptRequest'
        required: true
      responses:
        '200':
          description: System prompt updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemPromptResponse'
        '404':
          description: System prompt not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemPromptResponse'
      security:
      - bearerAuth:
        - mcp:system_prompt:update
    delete:
      tags:
      - System Prompts
      summary: Delete system prompt
      description: Delete an MCP system prompt so it can no longer be selected for agent sessions
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: System prompt deleted
        '404':
          description: System prompt not found
      security:
      - bearerAuth:
        - mcp:system_prompt:delete
  /v1/llm-apis/{id}:
    get:
      tags:
      - LLM API Configuration
      summary: Get an LLM API configuration
      description: Retrieve a single LLM API provider configuration by its identifier.
      operationId: get_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmApiConfigResponse'
      security:
      - bearerAuth:
        - mcp:llm_api:view
    put:
      tags:
      - LLM API Configuration
      summary: Update an LLM API configuration
      description: Update an existing LLM API provider configuration by its identifier.
      operationId: update_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmApiConfigRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmApiConfigResponse'
      security:
      - bearerAuth:
        - mcp:llm_api:update
    delete:
      tags:
      - LLM API Configuration
      summary: Delete an LLM API configuration
      description: Delete an existing LLM API provider configuration by its identifier.
      operationId: delete_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
      security:
      - bearerAuth:
        - mcp:llm_api:delete
  /v1/prompts:
    get:
      tags:
      - System Prompts
      summary: List system prompts
      description: List all configured MCP system prompts that can be assigned to agents
      operationId: list
      responses:
        '200':
          description: System prompts returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SystemPromptResponse'
      security:
      - bearerAuth:
        - mcp:system_prompt:view
    post:
      tags:
      - System Prompts
      summary: Create system prompt
      description: Create a new MCP system prompt that can be used during agent orchestration
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemPromptRequest'
        required: true
      responses:
        '201':
          description: System prompt created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemPromptResponse'
        '400':
          description: System prompt request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemPromptResponse'
      security:
      - bearerAuth:
        - mcp:system_prompt:create
  /v1/nlt/requests:
    post:
      tags:
      - NLTI
      summary: Submit a natural language task request
      description: Submit a natural language task request for asynchronous MCP processing and correlation tracking
      operationId: submitRequest
      parameters:
      - name: X-Correlation-Id
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NltiRequestDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NltiResponseV1'
      security:
      - bearerAuth:
        - nlti:request:submit
  /v1/mcp/documents:
    post:
      tags:
      - Document Ingestion
      summary: Queue a document for ingestion into the RAG vector store
      description: Submit a document for asynchronous ingestion into the RAG vector store. The request includes the document content and optional metadata. The response returns a job ID that can be used to track the ingestion status.
      operationId: ingestDocument
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentIngestionRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIngestionJobResponse'
      security:
      - bearerAuth:
        - mcp:document:ingest
  /v1/mcp/chat:
    post:
      tags:
      - mcp-chat-controller
      summary: Execute MCP chat message
      description: Executes a chat message and returns the full response once complete. For streaming responses, use the /chat/stream endpoint which returns tokens as they are generated.
      operationId: chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
      security:
      - bearerAuth:
        - mcp:chat:execute
  /v1/mcp/chat/stream:
    post:
      tags:
      - mcp-streaming-chat-controller
      summary: Execute MCP streaming chat - returns SSE token stream
      description: Executes a streaming chat message and returns a stream of tokens as Server-Sent Events (SSE). Each token is sent as an individual SSE with event type 'chat'.
      operationId: streamChat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamChatRequest'
        required: true
      responses:
        '200':
          description: Stream of SSE chat tokens
          content:
            text/event-stream:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServerSentEventString'
      security:
      - bearerAuth:
        - mcp:chat:stream
  /v1/llm-apis:
    get:
      tags:
      - LLM API Configuration
      summary: List LLM API configurations
      description: Retrieve all configured LLM API provider definitions that are available to the MCP server.
      operationId: list_1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LlmApiConfigResponse'
      security:
      - bearerAuth:
        - mcp:llm_api:view
    post:
      tags:
      - LLM API Configuration
      summary: Create an LLM API configuration
      description: Create a new LLM API provider configuration for use by the MCP server.
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmApiConfigRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmApiConfigResponse'
      security:
      - bearerAuth:
        - mcp:llm_api:create
  /v1/nlt/audit:
    get:
      tags:
      - NLTI Audit
      summary: Query the NLTI audit ledger
      description: Query the NLTI audit ledger with optional filters for correlation ID, time range, and event type. Results are paginated.
      operationId: queryAudit
      parameters:
      - name: correlationId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: eventType
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
        required: false
        schema:
          type: array
          default:
          - timestamp,ASC
          items:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageAuditEventResponse'
      security:
      - bearerAuth:
        - nlti:audit:read
  /v1/mcp/documents/jobs/{jobId}:
    get:
      tags:
      - Document Ingestion
      summary: Get RAG document ingestion job status
      description: Retrieve the status and details of an asynchronous document ingestion job using its job ID. The response includes the current status, timestamps, and any error messages if applicable.
      operationId: getIngestionJob
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIngestionJobResponse'
      security:
      - bearerAuth:
        - mcp:document:ingest
  /v1/tools/{toolName}/permissions:
    get:
      tags:
      - MCP Tool Permissions
      summary: List a tool's permission grants
      description: Return the permission codes currently granted to a discovered OpenAPI tool.
      operationId: listToolPermissions
      parameters:
      - name: toolName
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolPermissionsResponse'
      security:
      - bearerAuth:
        - mcp:tool:view
    post:
      tags:
      - MCP Tool Permissions
      summary: Grant a permission to a tool
      description: Grant a permission code to a discovered OpenAPI tool so callers holding it can select the tool. Idempotent. Returns the tool's full permission set.
      operationId: grantToolPermission
      parameters:
      - name: toolName
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolPermissionRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolPermissionsResponse'
      security:
      - bearerAuth:
        - mcp:tool:manage
    delete:
      tags:
      - MCP Tool Permissions
      summary: Revoke a permission from a tool
      description: Revoke a permission code from a discovered OpenAPI tool. Idempotent.
      operationId: revokeToolPermission
      parameters:
      - name: toolName
        in: path
        required: true
        schema:
          type: string
      - name: permissionCode
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      security:
      - bearerAuth:
        - mcp:tool:manage
components:
  schemas:
    ToolPermissionRequest:
      type: object
      description: Request to grant a permission code to a discovered OpenAPI tool
      properties:
        permissionCode:
          type: string
          description: Permission code that must be held for the tool to be selectable. Either the literal AUTHENTICATED or a domain:resource:action code.
          example: event-receiver:event_type:view
          pattern: AUTHENTICATED|[a-z0-9-]+:[a-z0-9_-]+:[a-z0-9_-]+
          minLength: 1
      required:
      - permissionCode
    ToolPermissionsResponse:
      type: object
      description: The permission codes currently granted to a discovered OpenAPI tool
      properties:
        toolName:
          type: string
          description: Unique tool name
          example: event-receiver_getactiveeventtypes
        permissionCodes:
          type: array
          items:
            type: string
          description: Granted permission codes (a caller holding any one may select the tool)
    SystemPromptRequest:
      type: object
      description: Request to create or update a reusable system prompt
      properties:
        name:
          type: string
          description: Human-readable name identifying the system prompt
          example: Workorder Assistant
          minLength: 1
        content:
          type: string
          description: Text content of the system prompt
          example: You are a helpful assistant that creates workorders.
          minLength: 1
      required:
      - content
      - name
    SystemPromptResponse:
      type: object
      description: Stored reusable system prompt returned to clients
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the stored system prompt
          example: 01960003-0000-7000-8000-000000000008
        name:
          type: string
          description: Human-readable name identifying the system prompt
          example: Workorder Assistant
        content:
          type: string
          description: Text content of the system prompt
          example: You are a helpful assistant that creates workorders.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the system prompt was created (ISO 8601)
          example: 2026-01-15 09:30:00+00:00
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the system prompt was last updated (ISO 8601)
          example: 2026-01-16 11:45:00+00:00
      required:
      - content
      - createdAt
      - id
      - name
      - updatedAt
    LlmApiConfigRequest:
      type: object
      description: Request to create or update an external LLM API configuration
      properties:
        apiId:
          type: string
          description: Stable identifier for the LLM API configuration
          example: openai-gpt4
          minLength: 1
        model:
          type: string
          description: Model name to invoke on the configured provider
          example: gpt-4o
          minLength: 1
        baseUrl:
          type: string
          description: Base URL of the LLM provider API
          example: https://api.openai.com/v1
          minLength: 1
        apiKey:
          type: string
          description: API key credential used to authenticate with the provider
          example: sk-proj-xxxxxxxxxxxxxxxx
          minLength: 1
        headers:
          type: object
          additionalProperties:
            type: string
          description: Additional HTTP headers to send with each provider request
          example:
            X-Org-Id: org-01960003
      required:
      - apiId
      - apiKey
      - baseUrl
      - model
    LlmApiConfigResponse:
      type: object
      description: Stored external LLM API configuration returned to clients
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the stored LLM API configuration
          example: 01960003-0000-7000-8000-000000000005
        apiId:
          type: string
          description: Stable identifier for the LLM API configuration
          example: openai-gpt4
        model:
          type: string
          description: Model name invoked on the configured provider
          example: gpt-4o
        baseUrl:
          type: string
          description: Base URL of the LLM provider API
          example: https://api.openai.com/v1
        apiKey:
          type: string
          description: API key credential used to authenticate with the provider
          example: sk-proj-xxxxxxxxxxxxxxxx
        headers:
          type: object
          additionalProperties:
            type: string
          description: Additional HTTP headers sent with each provider request
          example:
            X-Org-Id: org-01960003
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the configuration was created (ISO 8601)
          example: 2026-01-15 09:30:00+00:00
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the configuration was last updated (ISO 8601)
          example: 2026-01-16 11:45:00+00:00
      required:
      - apiId
      - apiKey
      - baseUrl
      - createdAt
      - headers
      - id
      - model
      - updatedAt
    NltiRequestDTO:
      type: object
      description: Natural-language task interpretation request submitted by a client
      properties:
        prompt:
          type: string
          description: Natural-language prompt to interpret
          example: Create a workorder for an oil change at the downtown store
          minLength: 1
        sessionId:
          type: string
          format: uuid
          description: Conversation session identifier to maintain interpretation context
          example: 01960003-0000-7000-8000-000000000006
        clientContext:
          type: object
          description: Arbitrary client-supplied context to aid interpretation
          example:
            locationId: 01960003-0000-7000-8000-000000000001
      required:
      - prompt
    NltiResponseV1:
      type: object
      description: Natural-language task interpretation response (version 1)
      properties:
        requestId:
          type: string
          format: uuid
          description: Unique identifier of the interpretation request
          example: 01960003-0000-7000-8000-000000000007
        correlationId:
          type: string
          format: uuid
          description: Correlation identifier linking the response to the originating request flow
          example: 01960003-0000-7000-8000-000000000002
        sessionId:
          type: string
          format: uuid
          description: Conversation session identifier the request belonged to
          example: 01960003-0000-7000-8000-000000000006
        status:
          type: string
          description: Status of the interpretation
          example: RESOLVED
        result:
          description: Interpretation result payload, typically the resolved intent
        meta:
          type: object
          description: Additional metadata about the interpretation
          example:
            durationMs: 142
      required:
      - correlationId
      - requestId
      - status
    DocumentIngestionRequest:
      type: object
      description: Document ingestion payload
      example:
        content: sample
        metadata:
          document_id: policy-123
          source: manual
      properties:
        content:
          type: string
          description: Raw text content of the document to ingest
          example: 'Refund policy: customers may return items within 30 days.'
          minLength: 1
        metadata:
          type: object
          description: Optional key-value metadata for the document
          example:
            document_id: policy-123
            source: manual
      required:
      - content
    DocumentIngestionJobResponse:
      type: object
      description: Asynchronous document ingestion job status
      properties:
        jobId:
          type: string
          format: uuid
          description: Unique identifier of the ingestion job
          example: 01960003-0000-7000-8000-000000000009
        documentId:
          type: string
          description: Identifier of the document being ingested
          example: policy-123
        status:
          type: string
          description: Current status of the ingestion job
          enum:
          - PENDING
          - RUNNING
          - SUCCEEDED
          - FAILED
          example: RUNNING
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the job was created (ISO 8601)
          example: 2026-01-15 09:30:00+00:00
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the job was last updated (ISO 8601)
          example: 2026-01-15 09:31:00+00:00
        startedAt:
          type: string
          format: date-time
          description: Timestamp when ingestion processing started (ISO 8601)
          example: 2026-01-15 09:30:05+00:00
        completedAt:
          type: string
          format: date-time
          description: Timestamp when ingestion processing completed (ISO 8601)
          example: 2026-01-15 09:30:45+00:00
        chunkCount:
          type: integer
          format: int32
          description: Number of chunks produced from the document
          example: 12
        errorMessage:
          type: string
          description: Error message describing why ingestion failed, when applicable
          example: Embedding provider unavailable
      required:
      - createdAt
      - documentId
      - jobId
      - status
      - updatedAt
    ChatRequest:
      type: object
      description: Chat request payload
      example:
        message: Hello
      properties:
        message:
          type: string
          description: User chat message to send to the agent
          example: Hello
          minLength: 1
      required:
      - message
    ChatResponse:
      type: object
      description: Chat response payload
      example:
        response: Hi!
      properties:
        response:
          type: string
          description: Full agent response text
          example: Hi!
      required:
      - response
    ServerSentEventString:
      type: object
      description: A Server-Sent Event carrying a string data payload
      properties:
        id:
          type: string
          description: Event identifier
          example: '1'
        event:
          type: string
          description: Event name
          example: chat
        data:
          type: string
          description: String data payload of the event, typically a response token
          example: Hi
        retry:
          type: integer
          format: int64
          description: Reconnection time in milliseconds the client should wait before retrying
          example: 3000
        comment:
          type: string
          description: Comment line carried by the event
          example: keep-alive
    StreamChatRequest:
      type: object
      description: Streaming chat request payload
      example:
        message: Hello
      properties:
        message:
          type: string
          description: User chat message to stream to the agent
          example: Hello
          minLength: 1
      required:
      - message
    AuditEventResponse:
      type: object
      description: Audit event record describing a single recorded action within the MCP server
      properties:
        eventId:
          type: string
          format: uuid
          description: Unique identifier of the audit event
          example: 01960003-0000-7000-8000-000000000001
        correlationId:
          type: string
          format: uuid
          description: Correlation identifier linking the event to a request flow
          example: 01960003-0000-7000-8000-000000000002
        eventType:
          type: string
          description: Type of the audit event
          example: NLTI_INTENT_RESOLVED
        timestamp:
          type: string
          format: date-time
          description: Timestamp when the event occurred (ISO 8601)
          example: 2026-01-15 09:30:00+00:00
        actorSubjectId:
          type: string
          description: Subject identifier of the actor that triggered the event
          example: user-01960003
        payloadRef:
          type: string
          description: Reference pointer to the stored event payload
          example: payload/01960003-0000-7000-8000-000000000003
      required:
      - eventId
      - eventType
      - timestamp
    PageAuditEventResponse:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: '#/components/schemas/AuditEventResponse'
        number:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: '#/components/schemas/PageableObject'
        sort:
          $ref: '#/components/schemas/SortObject'
        empty:
          type: boolean
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        paged:
          type: boolean
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/SortObject'
        unpaged:
          type: boolean
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean
