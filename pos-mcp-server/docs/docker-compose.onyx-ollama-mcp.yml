services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - onyx-mcp

  pos-mcp-server:
    image: durion/pos-mcp-server:latest
    container_name: pos-mcp-server
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: preprod
      POS_MCP_DB_HOST: postgres
      POS_MCP_DB_PORT: 5432
      POS_MCP_DB_NAME: pos_mcp
      POS_MCP_DB_USER: pos_mcp
      POS_MCP_DB_PASSWORD: change-me
      EUREKA_CLIENT_ENABLED: "false"
      MCP_SERVER_BASE_URL: http://pos-mcp-server:8086
    depends_on:
      - postgres
    networks:
      - onyx-mcp

  postgres:
    image: postgres:16
    container_name: pos-mcp-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: pos_mcp
      POSTGRES_USER: pos_mcp
      POSTGRES_PASSWORD: change-me
    volumes:
      - pos-mcp-postgres-data:/var/lib/postgresql/data
    networks:
      - onyx-mcp

networks:
  onyx-mcp:
    driver: bridge

volumes:
  ollama-data:
  pos-mcp-postgres-data:
