# Test profile that runs the real Flyway migration chain + repeatable seed against a
# Testcontainers Postgres, with Hibernate ddl-auto=validate. This executes migrations
# and cross-service-shaped seed SQL in CI (issue #684 process follow-up), catching the
# class of breakages that H2 + flyway-disabled tests miss (e.g. seed/column drift).
# The datasource is supplied at runtime: PostgresTenancyTestBase connects the pool as pos_app with Flyway on
# the owner (@DynamicPropertySource). Tenancy is strict (nothing binds a tenant unless the test does; ADR-0062).
spring:
  application:
    name: pos-mcp-server-pg-test
  autoconfigure:
    # Kafka only. The Spring AI Ollama auto-configuration stays on, exactly as it is under the test
    # profile: it supplies the EmbeddingModel that OpenApiToolProvider needs and touches no network
    # until a model is invoked, which these suites never do.
    exclude: org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
  datasource:
    # The test profile names the H2 driver; the container URL needs the Postgres one.
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    # The Postgres chain (V1 baseline + V2 seed), not the H2 chain application.yml points at.
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092

# Disable security for tests
security:
  enabled: false

# Disable eureka for tests
eureka:
  client:
    enabled: false

logging:
  level:
    com.positivity: INFO

pos:
  tenancy:
    # strict: nothing binds a tenant unless the test does
    default-tenant-id:
  mcp:
    kafka:
      enabled: false
  events:
    base-url: http://127.0.0.1:1

mcp:
  llm:
    apis:
      - id: fake-llm
        model: test-model
        base-url: http://localhost:9999/fake-llm
        api-key: ""
