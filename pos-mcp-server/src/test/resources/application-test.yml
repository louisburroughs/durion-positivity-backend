spring:
    datasource:
        url: jdbc:h2:mem:mcp;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
        driver-class-name: org.h2.Driver
        username: sa
        password: ""
    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                jdbc:
                    time_zone: UTC
    flyway:
        enabled: false
    h2:
        console:
            enabled: false

eureka:
    client:
        enabled: false

mcp:
    llm:
        apis:
            - id: fake-llm
              model: test-model
              base-url: http://localhost:9999/fake-llm
              api-key: ""
    # ADR-0069: the scope graph stays off in tests except the graph's own (quoted: bare off is YAML
    # false).
    scope-graph:
        mode: "off"
    # ADR-0068: no test context calls the tagging provider (quoted for the same reason).
    tagging:
        mode: "off"

pos:
    # Point the event-type initializer at an unroutable loopback port: the test profile has no
    # pos-event-receiver, and the docker-internal default hostname adds DNS/connect delays to every
    # @SpringBootTest boot. Loopback refuses instantly and the initializer swallows the failure.
    events:
        base-url: http://127.0.0.1:1
    nlti:
        session:
            ttl-hours: 24
        rate-limit:
            per-session: 1000
            max-tracked-sessions: 10000
    security:
        permission-registration:
            enabled: false
