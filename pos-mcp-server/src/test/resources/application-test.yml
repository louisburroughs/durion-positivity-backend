spring:
    datasource:
        url: jdbc:h2:mem:mcp;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
        driver-class-name: org.h2.Driver
        username: sa
        password: ""
    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                jdbc:
                    time_zone: UTC
    h2:
        console:
            enabled: false

eureka:
    client:
        enabled: false

mcp:
    llm:
        apis:
            - id: fake-llm
              model: test-model
              base-url: http://localhost:9999/fake-llm
              api-key: ""

pos:
    nlti:
        session:
            ttl-hours: 24
        rate-limit:
            per-session: 1000
            max-tracked-sessions: 10000
    security:
        permission-registration:
            enabled: false
