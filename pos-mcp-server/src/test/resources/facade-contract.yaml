  # use the period's end date. Note the trial-balance as-of param is `asOf`, not `asOfDate`.
  legs:
    incomeStatement:
      verb: GET
      baseUrlProperty: pos.accounting.base-url
      templateProperty: pos.accounting.income-statement-uri-template
      template: "/accounting/v1/accounting/reports/financial/income-statement?startDate={startDate}&endDate={endDate}"
      route: accounting
      downstreamPath: "/v1/accounting/reports/financial/income-statement?startDate={}&endDate={}"
    balanceSheet:
      verb: GET
      baseUrlProperty: pos.accounting.base-url
      templateProperty: pos.accounting.balance-sheet-uri-template
      template: "/accounting/v1/accounting/reports/financial/balance-sheet?asOfDate={asOfDate}"
      route: accounting
      downstreamPath: "/v1/accounting/reports/financial/balance-sheet?asOfDate={}"
    trialBalance:
      verb: GET
      baseUrlProperty: pos.accounting.base-url
      templateProperty: pos.accounting.trial-balance-uri-template
      template: "/accounting/v1/accounting/reports/financial/trial-balance?asOf={asOf}"
      route: accounting
      downstreamPath: "/v1/accounting/reports/financial/trial-balance?asOf={}"

