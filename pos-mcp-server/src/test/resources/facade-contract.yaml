# Facade contract manifest (#1519 WS-0.3) — the single source of truth for what each
# facade @Tool method calls.
#
# One entry per @Tool method of every *FacadeTool. Facade tests build their
# MockRestServiceServer expectations from these entries (verb + expanded template) via
# FacadeContractManifest, never from string literals duplicating the configuration, and
# FacadeContractManifestTest locks every `template` value to the corresponding
# application.yml property default. The contract checker (scripts/check-mcp-facade-paths.py)
# independently validates the same configured templates against the routed modules'
# openapi.yaml files — closing the loop that made the #1519 failure mode (test encodes the
# same assumption as the code) possible.
#
# Fields:
#   verb              HTTP method the tool issues (NONE for tools that make no HTTP call)
#   baseUrlProperty   pos.* property supplying the RestClient base URL
#   templateProperty  pos.* property supplying the URI template (absent when the tool
#                     calls the bare base URL)
#   template          the exact configured template default (must match application.yml)
#   route             gateway route id serving the path's first segment, or DIRECT for the
#                     ADR-0021 pos-tax direct call, or NONE for no HTTP call
#   downstreamPath    path after the gateway's StripPrefix=1 (or after the direct base-url
#                     path), URI params normalized to {}
#   legs              composition tools only (verb: COMPOSITE): one sub-entry per downstream
#                     call, keyed by the ToolComposition leg name, each carrying its own verb,
#                     baseUrlProperty, templateProperty, template, route and downstreamPath.
# Wave 2 restoration (#1519): Events.getEventHistory (#1521), Hr.searchEmployees (#1523), and
# Tax.getTaxRate (#1522) were previously removed for lacking a real backend endpoint; all three
# now have one and are back on the surface below.

