TaxFacadeTool.calculateTax:
  verb: COMPOSITE
  route: COMPOSITE
  # WS-3.TAXCALC: the gateway location lookup supplies the destination address that the
  # ADR-0021 direct POST to pos-tax requires (nested destinationAddress, never the legacy
  # flat address fields). A location without a usable address degrades the tax leg without
  # calling pos-tax.
  legs:
    location:
      verb: GET
      baseUrlProperty: pos.tax.gateway-base-url
      templateProperty: pos.tax.location-uri-template
      template: "/location/v1/locations/{locationId}"
      route: location
      downstreamPath: "/v1/locations/{}"
    tax:
      verb: POST
      baseUrlProperty: pos.tax.base-url
      templateProperty: pos.tax.tax-calculate-uri-template
      template: "/calculate"
      route: DIRECT
      downstreamPath: "/v1/tax/calculate"

TaxFacadeTool.getTaxRate:
  verb: COMPOSITE
  route: COMPOSITE
  # #1522 restoration: the gateway location lookup supplies the destination address that the
  # ADR-0021 direct GET to pos-tax /rates requires (countryCode+postalCode always appended;
  # regionCode/city appended only when the location supplies them). A location without a usable
  # address degrades the rates leg without calling pos-tax, mirroring calculateTax.
  legs:
    location:
      verb: GET
      baseUrlProperty: pos.tax.gateway-base-url
      templateProperty: pos.tax.location-uri-template
      template: "/location/v1/locations/{locationId}"
      route: location
      downstreamPath: "/v1/locations/{}"
    rates:
      verb: GET
      baseUrlProperty: pos.tax.base-url
