domain: mcp
serviceName: pos-mcp-server
version: "1.0"
permissions:
  - name: "mcp:llm_api:view"
    description: "View registered LLM API configurations"
  - name: "mcp:llm_api:create"
    description: "Create LLM API configuration entries"
  - name: "mcp:llm_api:update"
    description: "Update existing LLM API configuration entries"
  - name: "mcp:llm_api:delete"
    description: "Delete LLM API configuration entries"
  - name: "mcp:system_prompt:view"
    description: "View configured MCP system prompts"
  - name: "mcp:system_prompt:create"
    description: "Create MCP system prompts"
  - name: "mcp:system_prompt:update"
    description: "Update MCP system prompts"
  - name: "mcp:system_prompt:delete"
    description: "Delete MCP system prompts"
  - name: "nlti:request:submit"
    description: "Submit a natural language task interface request"
  - name: "nlti:request:read"
    description: "Read submitted NLTI request status"
  - name: "nlti:audit:read"
    description: "Query the NLTI audit event ledger"
  - name: "mcp:document:ingest"
    description: "Ingest a document into the RAG vector store"
  - name: "mcp:chat:stream"
    description: "Execute a streaming SSE chat request via LangChain4j agent"
  - name: "mcp:chat:execute"
    description: "Execute a synchronous chat request via LangChain4j agent"
