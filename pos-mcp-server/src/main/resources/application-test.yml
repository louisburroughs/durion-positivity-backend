spring:
  autoconfigure:
    exclude:
      - dev.langchain4j.ollama.spring.OllamaAutoConfiguration
      - dev.langchain4j.spring.LangChain4jAutoConfiguration
  datasource:
    url: jdbc:h2:mem:mcp;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    locations: classpath:db/h2-migration
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          "[time_zone]": UTC
eureka:
  client:
    enabled: false
