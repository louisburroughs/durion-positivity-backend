spring:
  datasource:
    url: jdbc:postgresql://${POS_MCP_DB_HOST}:${POS_MCP_DB_PORT:5432}/${POS_MCP_DB_NAME:pos_mcp}
    driver-class-name: org.postgresql.Driver
    username: ${POS_MCP_DB_USER:pos_mcp}
    password: ${POS_MCP_DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          "[time_zone]": UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}

server:
  port: 8086

langchain4j:
  ollama:
    chat-model:
      base-url: ${OLLAMA_CHAT_BASE_URL:https://ollama.com}
      model-name: ${OLLAMA_CHAT_MODEL:qwen3-next:80b}
      custom-headers:
        Authorization: Bearer ${OLLAMA_API_KEY}
      temperature: 0.2
      timeout: ${OLLAMA_CHAT_TIMEOUT:180s}
    embedding-model:
      base-url: ${OLLAMA_EMBEDDING_BASE_URL:https://ollama.com}
      model-name: ${OLLAMA_EMBEDDING_MODEL:qwen3-embedding}
      custom-headers:
        Authorization: Bearer ${OLLAMA_API_KEY}
      timeout: ${OLLAMA_EMBEDDING_TIMEOUT:30s}
    streaming-chat-model:
      base-url: ${OLLAMA_CHAT_BASE_URL:https://ollama.com}
      model-name: ${OLLAMA_CHAT_MODEL:qwen3-next:80b}
      custom-headers:
        Authorization: Bearer ${OLLAMA_API_KEY}
      temperature: 0.2
      timeout: ${OLLAMA_STREAMING_CHAT_TIMEOUT:${OLLAMA_CHAT_TIMEOUT:180s}}

mcp:
  rag:
    table-name: mcp_document_embedding
    dimension: 768
    index-type: ivfflat
  agent:
    cache-ttl-minutes: 30
    max-cached-agents: 500
    memory-max-messages: 50
    candidate-tool-limit: 2

exa:
  api-key: ${EXA_API_KEY:}
  base-url: https://api.exa.ai
  search-type: auto
  max-results: 5

logging:
  level:
    com:
      positivity:
        mcp:
          internal:
            orchestration: DEBUG
