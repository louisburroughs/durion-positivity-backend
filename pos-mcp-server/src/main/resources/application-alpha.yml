spring:
  datasource:
    url: jdbc:postgresql://${POS_MCP_DB_HOST}:${POS_MCP_DB_PORT:5432}/${POS_MCP_DB_NAME:pos_mcp}
    driver-class-name: org.postgresql.Driver
    username: ${POS_MCP_DB_USER:pos_mcp}
    password: ${POS_MCP_DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          "[time_zone]": UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect
  ai:
    ollama:
      base-url: ${OLLAMA_CHAT_BASE_URL:https://ollama.com}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:deepseek-v4-flash:0731}
          # #1683: 0 (not 0.2). The analytics gate is graded at n=1, so sampling only adds
          # run-to-run variance to the "did that PR help?" comparison. Override per host with
          # OLLAMA_CHAT_TEMPERATURE if a workload ever needs sampling.
          temperature: ${OLLAMA_CHAT_TEMPERATURE:0.0}
          # #1683: always send num_ctx rather than letting the backend pick the window.
          # Ollama truncates the FRONT of the context — the system prompt — once the assembled
          # prompt exceeds it, with no error and no log line, and one analytics turn (layered
          # prompt + tool schemas + RAG snippets + memory + tool results) is well past 4096.
          # What "unset" inherits depends on the backend: a self-hosted daemon applies its own
          # OLLAMA_CONTEXT_LENGTH (4096 unless raised — gate3-openapi-bridge-design.md records
          # needing 16384 on the alpha CPU host for exactly this reason), while the hosted
          # ollama.com backend that the alpha chat base-url points at applies its own per-model
          # default, which we neither set nor can read back. Sending it explicitly is what makes
          # the window OURS in both cases. Tune per host with OLLAMA_NUM_CTX.
          num-ctx: ${OLLAMA_NUM_CTX:32768}
        timeout: ${OLLAMA_CHAT_TIMEOUT:180s}
        streaming-timeout: ${OLLAMA_STREAMING_CHAT_TIMEOUT:${OLLAMA_CHAT_TIMEOUT:180s}}
      embedding:
        base-url: ${OLLAMA_EMBEDDING_BASE_URL:http://ollama:11434}
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
        timeout: ${OLLAMA_EMBEDDING_TIMEOUT:30s}

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}

server:
  port: 8086

mcp:
  # #1691: primary -> secondary failover on. deepseek-v4-pro:0813 is the secondary (owner decision,
  # 2026-09-06); the model name comes from OLLAMA_FALLBACK_MODEL / application.yml's default.
  model:
    fallback:
      enabled: ${MCP_MODEL_FALLBACK_ENABLED:true}
  eval:
    turn-trace:
      enabled: ${MCP_EVAL_TURN_TRACE_ENABLED:true}
      retention: ${MCP_EVAL_TURN_TRACE_RETENTION:24h}
      cleanup-interval: ${MCP_EVAL_TURN_TRACE_CLEANUP_INTERVAL:1h}
  server:
    aggregate-spec-url: ${MCP_AGGREGATE_SPEC_URL:http://pos-api-gateway:8080/v3/api-docs}
    excluded-path-fragments:
      - /admin/
      - /actuator/
      - /internal/
    # #1632 follow-up: periodic re-discovery, alpha only. Self-heals a domain whose spec fetch
    # (and same-cycle targeted fallback) failed — without this, its tools stay absent from the live
    # tool list until a restart. 30 min, not the 5-min default: each cycle re-fetches ~22 specs
    # (up to 16MB each) and re-upserts 600+ mcp_tool rows, and alpha only needs convergence, not
    # freshness. Registration is idempotent and cycles serialize (see DiscoveryRefreshScheduler).
    discovery-refresh:
      enabled: ${MCP_DISCOVERY_REFRESH_ENABLED:true}
      interval-ms: ${MCP_DISCOVERY_REFRESH_INTERVAL_MS:1800000}
      # First refresh 5 min after startup: post-deploy is when stale Eureka routes exist, so the
      # first self-heal should not wait the full 30-minute interval (#1643 review).
      initial-delay-ms: ${MCP_DISCOVERY_REFRESH_INITIAL_DELAY_MS:300000}
  rag:
    table-name: mcp_document_embedding
    # G5.4 #1194 cutover complete + #1207 (V33): single embedding column, 1024-dim bge-m3 —
    # mirrors the base application.yml defaults; see docs/gate5-rag-hybrid-design.md.
    embedding-column: ${MCP_RAG_EMBEDDING_COLUMN:embedding}
    dimension: ${MCP_RAG_DIMENSION:1024}
    index-type: ivfflat
    preload:
      docs:
        - id: "accounting.de-bookkeeping"
          source-path: "classpath:rag/de-bookkeeping-rag.md"
          rag-scope: "accounting"
        - id: "accounting.journal-entries"
          source-path: "classpath:rag/accounting-journal-entries-rag.md"
          rag-scope: "accounting"
          # #1525: dual-listed for the reshaped facade JE surface — rationale in application.yml.
          required-permissions:
            ["accounting:je:view", "reporting:view:financial-statements"]
        - id: "accounting.financial-statements"
          source-path: "classpath:rag/accounting-financial-statements-rag.md"
          rag-scope: "accounting"
          required-permissions: ["reporting:view:financial-statements"]
        - id: "accounting.report-export"
          source-path: "classpath:rag/accounting-report-export-rag.md"
          rag-scope: "accounting"
          required-permissions: ["accounting:report:export"]
        - id: "accounting.codes"
          source-path: "classpath:rag/accounting-codes-rag.md"
          rag-scope: "accounting"
          # #1525: dual-listed for the reshaped facade JE surface — rationale in application.yml.
          required-permissions:
            ["accounting:je:view", "reporting:view:financial-statements"]
        - id: "inventory.inv-cntrl"
          source-path: "classpath:rag/inv-cntrl-rag.md"
          rag-scope: "inventory"
        - id: "inventory.purchase-orders"
          source-path: "classpath:rag/inventory-purchase-orders-rag.md"
          rag-scope: "inventory"
          # #1525: retargeted to the live pos-order code — rationale in application.yml.
          required-permissions: ["order:purchase_order:view"]
        - id: "inventory.receiving"
          source-path: "classpath:rag/inventory-receiving-rag.md"
          rag-scope: "inventory"
          required-permissions: ["inventory:receiving:view"]
        - id: "inventory.transfers-adjustments"
          source-path: "classpath:rag/inventory-transfers-adjustments-rag.md"
          rag-scope: "inventory"
          required-permissions: ["inventory:transfer:view"]
        - id: "inventory.codes"
          source-path: "classpath:rag/inventory-codes-rag.md"
          rag-scope: "inventory"
          # #1525: retargeted to the live pos-order code — rationale in application.yml.
          required-permissions: ["order:purchase_order:view"]
        - id: "people.human-resources"
          source-path: "classpath:rag/hr-functions-guide.md"
          rag-scope: "hr"
        - id: "shop.management"
          source-path: "classpath:rag/shop-management-rag.md"
          rag-scope: "shopmanager"
        - id: "shop.management.guidelines"
          source-path: "classpath:rag/shop-management-guidelines.md"
          rag-scope: "shopmanager"
        - id: "security.guide"
          source-path: "classpath:rag/security-service-guide.md"
          rag-scope: "master"
          required-permissions:
            ["security:permission:view", "security:role:view"]
        # Gate 5 documents. `required-permissions` is bound by StaticDocEntry (G5.2) and enforced by
        # the permission-aware RAG filter (G5.1). Permission codes verified against the service
        # permissions.yaml files. Kept in parity with application.yml so alpha's corpus matches the
        # full catalog the eval fixtures target (#783 recall@k).
        - id: "platform.capability-catalog"
          source-path: "classpath:rag/capability-catalog.md"
          rag-scope: "master"
          required-permissions: ["AUTHENTICATED"]
        - id: "workflow.cross-domain-playbooks"
          source-path: "classpath:rag/cross-domain-playbooks.md"
          rag-scope: "master"
          required-permissions: ["AUTHENTICATED"]
        - id: "glossary.identifiers"
          source-path: "classpath:rag/glossary-identifiers.md"
          rag-scope: "master"
          required-permissions: ["AUTHENTICATED"]
        - id: "order.guide"
          source-path: "classpath:rag/order-guide.md"
          rag-scope: "order"
          required-permissions: ["order:order:view"]
        - id: "order.lifecycle"
          source-path: "classpath:rag/order-lifecycle-rag.md"
          rag-scope: "order"
          required-permissions: ["order:order:view"]
        - id: "order.price-override"
          source-path: "classpath:rag/order-price-override-rag.md"
          rag-scope: "order"
          required-permissions: ["order:price_override:view"]
        - id: "order.codes"
          source-path: "classpath:rag/order-codes-rag.md"
          rag-scope: "order"
          required-permissions: ["order:order:view"]
        - id: "order.returns-refunds"
          source-path: "classpath:rag/returns-refunds-rag.md"
          rag-scope: "order"
          required-permissions: ["order:order:view"]
        - id: "pricing.guide"
          source-path: "classpath:rag/pricing-guide.md"
          rag-scope: "pricing"
          # #1525: dead pricing:price_book:view dropped, ADR-0054 successor added — see application.yml.
          required-permissions: ["pricing:rule:view", "catalog:price_book:read"]
        - id: "pricing.promotions"
          source-path: "classpath:rag/pricing-promotions-rag.md"
          rag-scope: "pricing"
          required-permissions: ["pricing:promotion:view"]
        - id: "pricing.restrictions"
          source-path: "classpath:rag/pricing-restrictions-rag.md"
          rag-scope: "pricing"
          required-permissions: ["AUTHENTICATED"]
        - id: "pricing.codes"
          source-path: "classpath:rag/pricing-codes-rag.md"
          rag-scope: "pricing"
          required-permissions: ["pricing:promotion:view"]
        - id: "warranty.guide"
          source-path: "classpath:rag/warranty-guide.md"
          rag-scope: "warranty"
          required-permissions: ["warranty:claim:view"]
        - id: "tax.guide"
          source-path: "classpath:rag/tax-guide.md"
          rag-scope: "tax"
          required-permissions: ["tax:mode:view"]
        - id: "crm.customer-vehicle"
          source-path: "classpath:rag/customer-vehicle-guide.md"
          rag-scope: "customer"
          # #1525: crm:vehicle:search → vehicle-inventory:search:view — see application.yml.
          required-permissions:
            [
              "crm:party:view",
              "crm:party:search",
              "crm:vehicle:view",
              "vehicle-inventory:search:view",
              "crm:contact:view",
            ]
        - id: "crm.party-account-model"
          source-path: "classpath:rag/crm-party-account-model-rag.md"
          rag-scope: "customer"
          required-permissions: ["crm:party:view"]
        - id: "crm.codes"
          source-path: "classpath:rag/crm-codes-rag.md"
          rag-scope: "customer"
          required-permissions: ["crm:party:view"]
        - id: "reporting.metrics"
          source-path: "classpath:rag/reporting-metrics.md"
          rag-scope: "reporting"
          required-permissions:
            ["accounting:report:export", "workorder:dashboard:view"]
        - id: "admin.governance"
          source-path: "classpath:rag/admin-governance.md"
          rag-scope: "admin"
          required-permissions:
            ["security:permission:view", "workorder:approval_config:view"]
        - id: "events.observability"
          source-path: "classpath:rag/events-observability.md"
          rag-scope: "events"
          required-permissions: ["nlti:audit:read"]
        - id: "security.role-permission-matrix"
          source-path: "classpath:rag/role-permission-matrix.md"
          rag-scope: "security"
          required-permissions:
            ["security:role:view", "security:permission:view"]
        - id: "workorder.estimate-promotion"
          source-path: "classpath:rag/workorder-estimate-promotion-rag.md"
          rag-scope: "workorder"
          required-permissions: ["workorder:estimate:view"]
        - id: "workorder.status-lifecycle"
          source-path: "classpath:rag/workorder-status-lifecycle-rag.md"
          rag-scope: "workorder"
          required-permissions: ["workorder:workorder:view"]
        - id: "workorder.approval-config"
          source-path: "classpath:rag/workorder-approval-config-rag.md"
          rag-scope: "workorder"
          required-permissions: ["workorder:approval_config:view"]
        - id: "workorder.codes"
          source-path: "classpath:rag/workorder-codes-rag.md"
          rag-scope: "workorder"
          required-permissions: ["workorder:estimate:view"]
  agent:
    cache-ttl-minutes: 30
    max-cached-agents: 500
    memory-max-messages: 50
    # #1840: must stay above the facade count (18 facade tools; 17 of them gated in for the alpha
    # admin caller) — the cut is by ranking, so at 16 one facade per turn was dropped at random,
    # once the date-window resolver itself. McpServerPropertiesDefaultsTest pins limit >= facades.
    candidate-tool-limit: 24
    # #1840: the discovered-OpenAPI-operation cap used to share candidate-tool-limit. Kept at the
    # pre-#1840 value so widening the facade limit does not add discovered schemas to every prompt
    # (OLLAMA_NUM_CTX caveat above). Defaults to candidate-tool-limit when unset.
    discovered-tool-limit: 16

pos:
  accounting:
    base-url: ${POS_ACCOUNTING_BASE_URL:http://pos-api-gateway}
  catalog:
    base-url: ${POS_CATALOG_BASE_URL:http://pos-api-gateway}
  customer:
    base-url: ${POS_CUSTOMER_BASE_URL:http://pos-api-gateway}
  event-receiver:
    base-url: ${POS_EVENT_RECEIVER_BASE_URL:http://pos-api-gateway}
  inventory:
    base-url: ${POS_INVENTORY_BASE_URL:http://pos-api-gateway}
  invoice:
    base-url: ${POS_INVOICE_BASE_URL:http://pos-api-gateway}
  location:
    base-url: ${POS_LOCATION_BASE_URL:http://pos-api-gateway}
  order:
    base-url: ${POS_ORDER_BASE_URL:http://pos-api-gateway}
  pricing:
    base-url: ${POS_PRICING_BASE_URL:http://pos-api-gateway}
  reporting:
    base-url: ${POS_REPORTING_BASE_URL:http://pos-api-gateway}
  security:
    users:
      base-url: ${POS_SECURITY_USERS_BASE_URL:http://pos-api-gateway}
    audit:
      base-url: ${POS_SECURITY_AUDIT_BASE_URL:http://pos-api-gateway}
    user-permissions-path-template: ${POS_SECURITY_USER_PERMISSIONS_PATH_TEMPLATE:/security-service/v1/users/{userId}/permissions}
    audit-search-uri-template: ${POS_SECURITY_AUDIT_SEARCH_URI_TEMPLATE:/security-service/v1/audit/events?eventType={query}}
  hr:
    employee-base-url: ${POS_HR_EMPLOYEE_BASE_URL:http://pos-api-gateway}
    availability-base-url: ${POS_HR_AVAILABILITY_BASE_URL:http://pos-api-gateway}
    employee-uri-template: ${POS_HR_EMPLOYEE_URI_TEMPLATE:/people/v1/people/employees/{employeeId}}
    schedule-uri-template: ${POS_HR_SCHEDULE_URI_TEMPLATE:/people/v1/people/availability?employeeId={employeeId}}
  shopmanager:
    base-url: ${POS_SHOPMANAGER_BASE_URL:http://pos-api-gateway}
  tax:
    # ADR-0021: pos-tax internal-only exemption; pos-tax listens on 8091 (#641)
    base-url: ${POS_TAX_BASE_URL:http://pos-tax:8091/v1/tax}
  vehicle:
    base-url: ${POS_VEHICLE_BASE_URL:http://pos-api-gateway}
  workorder:
    base-url: ${POS_WORKORDER_BASE_URL:http://pos-api-gateway}

exa:
  api-key: ${EXA_API_KEY:}
  base-url: https://api.exa.ai
  search-type: auto
  max-results: 5

logging:
  level:
    # ADR-0046: deployed environments run INFO baseline; framework noise capped at WARN
    root: INFO
    com:
      netflix:
        discovery:
          shared:
            resolver:
              aws:
                ConfigClusterResolver: WARN
