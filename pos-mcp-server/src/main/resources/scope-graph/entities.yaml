# Entity lexicon of the pos-mcp-server scope graph (ADR-0069 section 3, item 1).
#
# The one curated source of truth behind the graph: which business entities exist, what people call
# them, and which tools, schemas and screens are about them. Everything else in the graph is derived
# (tool catalog, mcp.rag.preload.docs, OpenAPI specs, screen registry). Platform definitions only:
# entity TYPES, never a tenant's records (ADR-0069 section 8).
#
# Read by EntityLexiconLoader (shape; an unknown field or a regex that does not compile fails the
# load and names the entity) and ScopeGraphBuilder (references; one that does not resolve is a
# validation finding). ScopeGraphRealConfigValidationTest fails the build on a strict finding.
#
# Top level
#   domain_scopes   tool-catalog domain -> rag_scope, ONLY for the domains the two vocabularies spell
#                   differently. The key is an mcp_tool.domain value: a facade domain, or for a
#                   discovered operation the gateway routing prefix. The value is a rag-scope used by
#                   a mcp.rag.preload.docs entry. A tool domain with no matching rag-scope
#                   (vehicle-inventory, people-contact, supplier, marketing, location, catalog,
#                   vehicle-fitment) stays unmapped.
#   domains         rag_scope -> one sentence, in the user's vocabulary, describing the area of the
#                   business the scope covers (ADR-0068: the criteria of the `domain` Choice question;
#                   its options are the distinct rag-scopes of mcp.rag.preload.docs plus master). Every
#                   rag-scope used by either preload list must have a sentence, and every key here must
#                   be such a scope or master (ScopeGraphRealConfigValidationTest).
#   unscoped_tools  enabled tools that deliberately act on no entity. Every other enabled facade tool
#                   must be listed under some entity's facade_tools.
#   entities        the list below.
#
# Per entity
#   key             the entity key: lower-case, hyphenated (purchase-order). It is what a RAG document
#                   lists under entities: in mcp.rag.preload.docs, and what relates_to points at.
#   domain          the owning domain, in the tool-catalog vocabulary (shop-manager, not shopmanager).
#   terms           language -> phrases that denote the entity. At least one phrase in EACH of en, fr
#                   and es. Write them as a user would, with accents; matching folds case, accents
#                   and a plural s/es/x, so list the singular. A phrase may denote several entities.
#   identifiers     optional. key + pattern: a regex that recognises an identifier of the entity in a
#                   message. Take patterns from rag/glossary-identifiers.md, do not invent them. A key
#                   shared by two entities must carry the same pattern.
#   relates_to      optional. entity + label, read from this entity: "estimate promotes_to workorder".
#   schemas         optional. OpenAPI component schemas that represent the entity, written
#                   domain:SchemaName (domain = gateway routing prefix: pos-workorder -> workorder).
#                   A discovered operation whose request body or 2xx response is one of them acts on
#                   the entity (GET reads, anything else writes). The status / state enum of THESE
#                   schemas gives the entity's lifecycle states, so list the canonical response DTO.
#   schema_patterns optional. Regexes matched against the WHOLE domain:SchemaName, to attach the many
#                   DTOs of an entity without listing each. They attach tools only, never states.
#                   Each pattern must match at least one schema.
#   facade_tools    optional. tool + access (reads | writes): the facade tools (mcp_tool.name) that act
#                   on the entity. Declared here because a facade row has no HTTP method or schema.
#   screens         optional. mcp_screen_registry.screen_key values that show the entity. A screen no
#                   entity lists falls back to the entities of its own domain.
#   workflow_state  optional. A WorkflowState name (CREATING_PO, RECEIVING_ASN, ...): the workflow the
#                   user is carrying out when a message names this entity with an ACTION intent
#                   (ADR-0068 spec §2.7). Read only by the heuristic tagger where the scope graph's
#                   `lookups` consumer is enforced; INVENTORY_RECON has no entity and stays phrase-only.

domain_scopes:
  shop-manager: shopmanager
  price: pricing
  people: hr
  security-service: security

domains:
  accounting: "General ledger, journal entries, chart of accounts, financial statements, revenue, margin and profit figures, customer invoices and payments, credit memos, receivables and payables, vendor bills, bank reconciliation."
  admin: "Administration of the platform: users, roles, permissions, access, and the audit log."
  customer: "Customers, their accounts and contacts, the vehicles they own, communication with them."
  events: "Platform events published by the pos-event modules: event types, event history and notifications."
  hr: "Employees as staff: employment, pay rates, time off, HR functions."
  inventory: "Stock on hand, availability, parts and the product catalog (SKUs, part numbers, which parts fit a vehicle by year, make and model), reorder points, receiving and ASNs, transfers, adjustments, counts, suppliers and purchase orders to suppliers."
  order: "Customer sales orders and carts, returns and refunds (not purchase orders to suppliers)."
  pricing: "Prices, price lists, promotions, discounts, overrides, restrictions."
  reporting: "Operational reports and KPIs: work in progress, cycle time, throughput, technician utilization and billed hours, rework, parts metrics, dashboards. Money figures (revenue, margin, profit) are accounting."
  security: "User accounts and sign-in, passwords and tokens, roles and the permissions each role grants, who can access what, and the platform's security audit log."
  shopmanager: "Shop operations: appointments, bays, day-to-day technician scheduling and availability, shop settings."
  tax: "Sales tax, rates, jurisdictions, tax reports."
  warranty: "Warranty claims, coverage, settlements, part returns."
  workorder: "Workorders (repair orders), estimates and quotes, approvals, repair status and lifecycle."
  master: "No single area, several areas equally, social chat, or the assistant itself (what it can do, how to use it)."

unscoped_tools:
  - DateWindowFacadeTool
  - GlossaryFacadeTool
  - EventsFacadeTool

entities:
  # ---- workorder domain ------------------------------------------------------------------------
  - key: workorder
    domain: workorder
    terms:
      en: [work order, workorder, repair order, wo, ro]
      fr: [bon de travail, ordre de réparation]
      es: [orden de trabajo, orden de reparación]
    identifiers:
      - key: workorder-number
        pattern: '\bWO-\d{4}-\d{4,}\b'
    relates_to:
      - {entity: estimate, label: promoted_from}
      - {entity: customer, label: belongs_to}
      - {entity: vehicle, label: services}
      - {entity: invoice, label: billed_by}
      - {entity: employee, label: assigned_to}
    schemas:
      - 'workorder:WorkorderDetailResponse'
      - 'workorder:WorkorderResponse'
    schema_patterns:
      - 'workorder:(?!.*Estimate).*'
    facade_tools:
      - {tool: WorkorderFacadeTool, access: reads}
      - {tool: ShopManagerFacadeTool, access: reads}
      - {tool: CustomerFacadeTool, access: reads}
      - {tool: InvoiceFacadeTool, access: reads}
    screens: [workorders.list, workorders.wip]

  - key: estimate
    domain: workorder
    terms:
      en: [estimate, quote, quotation]
      fr: [devis, estimation]
      es: [presupuesto, cotización]
    identifiers:
      - key: estimate-number
        pattern: '\bEST-\d{4}-\d{4,}\b'
    relates_to:
      - {entity: workorder, label: promotes_to}
      - {entity: customer, label: belongs_to}
      - {entity: appointment, label: created_from}
      - {entity: tax, label: taxed_by}
    schemas:
      - 'workorder:EstimateSummaryResponse'
      - 'workorder:EstimateResponse'
    schema_patterns:
      - 'workorder:.*Estimate.*'

  - key: appointment
    domain: shop-manager
    terms:
      en: [appointment, booking]
      fr: [rendez-vous]
      es: [cita]
    relates_to:
      - {entity: estimate, label: promotes_to}
      - {entity: customer, label: belongs_to}
      - {entity: vehicle, label: for}
      - {entity: location, label: held_at}
    schemas:
      - 'shop-manager:AppointmentResponse'
    schema_patterns:
      - 'shop-manager:(Appointment.*|.*Assignment.*|CancelAppointmentRequest|RescheduleAppointmentRequest|Conflict.*|Schedule.*|Opening.*|DayCapacityView|BayCapacityView|BayEligibility|CarryOverView|OverrideEntry|StaffingAdvisory|AssignedMechanicInfo)'
    facade_tools:
      - {tool: ShopManagerFacadeTool, access: reads}

  # ---- customer and vehicle --------------------------------------------------------------------
  - key: customer
    domain: customer
    terms:
      en: [customer, client, customer account]
      fr: [client, cliente, compte client]
      es: [cliente, cuenta de cliente]
    relates_to:
      - {entity: vehicle, label: owns}
      - {entity: invoice, label: billed_by}
    schemas:
      - 'customer:CustomerDTO'
    schema_patterns:
      - 'customer:(?!Vehicle|CreateVehicle|PromotionRedemption|RecordRedemption).*'
    facade_tools:
      - {tool: CustomerFacadeTool, access: reads}
      - {tool: AccountingFacadeTool, access: reads}
      - {tool: InvoiceFacadeTool, access: reads}
      - {tool: WorkorderFacadeTool, access: reads}

  - key: vehicle
    domain: vehicle-inventory
    terms:
      en: [vehicle, automobile, vin, license plate]
      fr: [véhicule, voiture, plaque d'immatriculation]
      es: [vehículo, auto, placa]
    identifiers:
      - key: vin
        pattern: '\b[A-HJ-NPR-Z0-9]{17}\b'
    relates_to:
      - {entity: customer, label: belongs_to}
      - {entity: product, label: fitted_with}
    schemas:
      - 'vehicle-inventory:VehicleResponse'
    schema_patterns:
      - 'vehicle-inventory:.*'
      - 'vehicle-fitment:.*'
      - 'customer:(Vehicle.*|CreateVehicleForParty.*)'
    facade_tools:
      - {tool: VehicleFacadeTool, access: reads}

  # ---- billing ---------------------------------------------------------------------------------
  - key: invoice
    domain: invoice
    terms:
      en: [invoice]
      fr: [facture]
      es: [factura]
    identifiers:
      - key: invoice-number
        pattern: '\bINV-\d{13}-[0-9a-fA-F]{8}\b'
    relates_to:
      - {entity: workorder, label: bills}
      - {entity: customer, label: belongs_to}
      - {entity: payment, label: paid_by}
      - {entity: journal-entry, label: posted_as}
    schemas:
      - 'invoice:InvoiceDetailsResponse'
      - 'invoice:InvoiceSearchResult'
      - 'workorder:InvoiceGenerationResponse'
    schema_patterns:
      - 'invoice:(Invoice(?!Refund).*|OrderInvoice.*|PageInvoiceSearchResult|FinalizationRequest|RevertRequest|AdjustmentRequest|BillingRulesDTO|Application|Email.*|Print.*|RevenueByCustomer.*|Invoicing.*|ArtifactDownloadToken|ElevateRe.*)'
      - 'accounting:(Invoice(?!Application).*|BillingRuleRef.*|RegenerateInvoice.*)'
    facade_tools:
      - {tool: InvoiceFacadeTool, access: reads}
      - {tool: CustomerFacadeTool, access: reads}
    screens: [invoices.list]

  - key: payment
    domain: invoice
    terms:
      en: [payment, deposit, receipt]
      fr: [paiement, dépôt, reçu]
      es: [pago, depósito, recibo]
    relates_to:
      - {entity: invoice, label: applies_to}
      - {entity: customer, label: made_by}
    schemas:
      - 'invoice:PaymentIntentResponse'
    schema_patterns:
      - 'invoice:(.*Payment.*|CaptureAmountRequest|.*Deposit.*|.*Receipt.*|.*Refund.*)'
      - 'accounting:(PaymentApplication.*|PagePaymentApplication.*|InvoiceApplication|ApplicationDetail)'

  # ---- sales orders and returns ----------------------------------------------------------------
  - key: order
    domain: order
    terms:
      en: [order, sales order, cart]
      fr: [commande, commande de vente, panier]
      es: [pedido, orden de venta, carrito]
    relates_to:
      - {entity: invoice, label: billed_by}
      - {entity: return, label: returned_by}
      - {entity: price, label: priced_by}
      - {entity: tax, label: taxed_by}
    schemas:
      - 'order:SalesOrderResponse'
    schema_patterns:
      - 'order:(?!.*(PurchaseOrder|Return|Procurement)).*'
    facade_tools:
      - {tool: OrderFacadeTool, access: reads}

  - key: return
    domain: order
    terms:
      en: [return, refund, return order]
      fr: [retour, remboursement, commande de retour]
      es: [devolución, reembolso, orden de devolución]
    relates_to:
      - {entity: order, label: returns_from}
      - {entity: stock-item, label: restocks}
      - {entity: payment, label: refunded_by}
    schemas:
      - 'order:ReturnOrderResponse'
    schema_patterns:
      - 'order:.*Return.*'
      - 'inventory:(ReturnLineDto|ReturnSubmissionResultDto|ReturnSubmitRequest|ReturnableItemDto)'

  # ---- purchasing and inventory ----------------------------------------------------------------
  - key: purchase-order
    domain: order
    terms:
      en: [purchase order, po]
      fr: [bon de commande, commande d'achat, commande fournisseur]
      es: [orden de compra, pedido de compra]
    relates_to:
      - {entity: supplier, label: placed_with}
      - {entity: asn, label: received_by}
      - {entity: stock-item, label: replenishes}
    schemas:
      - 'order:PurchaseOrderResponse'
    schema_patterns:
      - 'order:(.*PurchaseOrder.*|Procurement.*)'
      - 'inventory:.*PurchaseSuggestion.*'
    facade_tools:
      - {tool: OrderFacadeTool, access: reads}
    workflow_state: CREATING_PO

  - key: asn
    domain: inventory
    terms:
      en: [asn, advance ship notice, advance shipping notice, goods receipt, receiving session]
      fr: [avis d'expédition, avis d'expédition anticipé, bon de réception, réception de marchandises]
      es: [aviso de envío anticipado, recepción de mercancía, nota de recepción]
    identifiers:
      - key: goods-receipt-number
        pattern: '\bGR-[0-9a-fA-F]{8}\b'
    relates_to:
      - {entity: purchase-order, label: fulfills}
      - {entity: stock-item, label: adds_to}
    schemas:
      - 'inventory:AsnResponse'
      - 'inventory:GoodsReceiptResponse'
    schema_patterns:
      - 'inventory:(?!.*Transfer)(.*Asn.*|.*GoodsReceipt.*|.*Receiving.*|Receive.*|CrossDock.*)'
    workflow_state: RECEIVING_ASN

  - key: stock-item
    domain: inventory
    terms:
      en: [stock, inventory, stock level, on hand, inventory item]
      fr: [stock, inventaire, niveau de stock, article en stock]
      es: [existencias, inventario, nivel de existencias, artículo de inventario]
    relates_to:
      - {entity: product, label: stock_of}
      - {entity: location, label: held_at}
      - {entity: stock-transfer, label: moved_by}
      - {entity: stock-adjustment, label: adjusted_by}
    schemas:
      - 'inventory:InventoryAvailabilityResponse'
      - 'inventory:LocationInventoryInquiryResponse'
    schema_patterns:
      - 'inventory:(?!.*(Transfer|Adjustment|Asn|GoodsReceipt|Receiving|Receive|CrossDock|Scrap|Revaluation|PurchaseSuggestion|Return|MovedItem)).*'
    facade_tools:
      - {tool: InventoryFacadeTool, access: reads}
      - {tool: LocationFacadeTool, access: reads}
      - {tool: ReportingFacadeTool, access: reads}

  - key: stock-transfer
    domain: inventory
    terms:
      en: [stock transfer, inventory transfer, transfer order]
      fr: [transfert de stock, transfert d'inventaire, ordre de transfert]
      es: [transferencia de inventario, transferencia de stock, orden de transferencia]
    relates_to:
      - {entity: stock-item, label: moves}
      - {entity: location, label: between}
    schemas:
      - 'inventory:TransferOrderResponse'
    schema_patterns:
      - 'inventory:(.*Transfer.*|MovedItem)'

  - key: stock-adjustment
    domain: inventory
    terms:
      en: [stock adjustment, inventory adjustment, scrap, revaluation]
      fr: [ajustement de stock, ajustement d'inventaire, rebut]
      es: [ajuste de inventario, ajuste de stock, desecho]
    relates_to:
      - {entity: stock-item, label: adjusts}
      - {entity: journal-entry, label: posted_as}
    schemas:
      - 'inventory:AdjustmentResponse'
      - 'inventory:AdjustmentRequestResponse'
    schema_patterns:
      - 'inventory:(.*Adjustment.*|.*Scrap.*|.*Revaluation.*)'

  # ---- catalog, pricing, tax -------------------------------------------------------------------
  # #2381: fitment is not an entity of its own. A fitment question asks which PRODUCTS fit a vehicle
  # described by attributes (year, make, model), and pos-vehicle-fitment answers it with product ids
  # (rag/catalog-products-fitment-guide.md); the vehicle registry entity stays `vehicle`. So the
  # fitment vocabulary, and the part kinds named after the seeded catalog subcategories
  # (pos-catalog R__seed_reference_catalog.sql: brake pads, rotors, wiper blades, filters, batteries,
  # spark plugs), denote `product`. Bare "fit" is left out: "can you fit him in" is scheduling. Tires
  # are left out too: in the tagging gate fixtures "tire" names a service ("tire rotation"), a fee or
  # a stock count more often than a product, and adding it halved the term's precision for no gain in
  # F1. A hyphenated word takes no plural fold, so its plural is listed as well.
  - key: product
    domain: catalog
    terms:
      en: [product, spare part, auto part, catalog item, sku, part number, fitment, part fitment, fits, compatible,
           compatibility, year make model, year/make/model, ymm, brake pad, brake rotor, rotor, brake shoe,
           wiper blade, oil filter, air filter, cabin air filter, battery, spark plug]
      fr: [produit, pièce, article du catalogue, numéro de pièce, compatibilité, compatible, année/marque/modèle,
           plaquette de frein, disque de frein, rotor, essuie-glace, essuie-glaces, filtre à huile, filtre à air,
           filtre d'habitacle, batterie, bougie d'allumage]
      es: [producto, pieza, repuesto, artículo del catálogo, número de parte, compatibilidad, compatible,
           año/marca/modelo, balata, pastilla de freno, disco de freno, rotor, plumilla,
           limpiaparabrisas, filtro de aceite, filtro de aire, filtro de cabina, batería, bujía]
    relates_to:
      - {entity: price, label: priced_by}
      - {entity: stock-item, label: stocked_as}
      - {entity: supplier, label: supplied_by}
    schemas:
      - 'catalog:ProductDto'
      - 'catalog:ProductDetailView'
    schema_patterns:
      - 'catalog:(?!(PriceBook|.*Msrp|EffectiveLocationPrice|LocationPriceOverride|ResolvePrice|SupplierPrice|UpdateStandardCost|ItemCost|Pricing|GuardrailPolicy)).*'
      # The product side of pos-vehicle-fitment: applicability hints and the product-by-vehicle
      # filter. The vehicle taxonomy DTOs (manufacturer, make, model, type) stay on `vehicle` only.
      - 'vehicle-fitment:(.*Hint.*|FilterProducts.*|FitmentTagDto|.*FitmentBulkIngest.*)'
    facade_tools:
      - {tool: CatalogFacadeTool, access: reads}
      - {tool: PricingFacadeTool, access: reads}

  - key: price
    domain: price
    terms:
      en: [price, pricing, price book, msrp, labor rate]
      fr: [prix, tarification, livre de prix, taux de main-d'œuvre]
      es: [precio, libro de precios, tarifa de mano de obra]
    relates_to:
      - {entity: product, label: applies_to}
      - {entity: promotion, label: adjusted_by}
    schemas:
      - 'price:PriceQuoteResponse'
      - 'catalog:PriceBookDto'
    schema_patterns:
      - 'price:(?!.*(Promotion|Eligibility|EstimateContext|LineItemContext)).*'
      - 'catalog:(PriceBook.*|.*Msrp.*|EffectiveLocationPrice.*|LocationPriceOverride.*|ResolvePrice.*|SupplierPrice.*|UpdateStandardCost.*|ItemCost.*|Pricing.*|GuardrailPolicy.*)'
      - 'security-service:PricingSnapshot.*'
      - 'security-service:PricingRuleTrace.*'
    facade_tools:
      - {tool: PricingFacadeTool, access: reads}

  - key: promotion
    domain: price
    terms:
      en: [promotion, promo, discount, promo code]
      fr: [promotion, rabais, code promo]
      es: [promoción, descuento, código promocional]
    relates_to:
      - {entity: price, label: adjusts}
    schemas:
      - 'price:PromotionOfferResponse'
    schema_patterns:
      - 'price:(.*Promotion.*|.*Eligibility.*|EstimateContext|LineItemContext)'
      - 'customer:(PromotionRedemptionResponse|RecordRedemptionRequest)'
    facade_tools:
      - {tool: PricingFacadeTool, access: reads}

  - key: tax
    domain: tax
    terms:
      en: [tax, sales tax, gst, hst]
      fr: [taxe, taxe de vente, tps, tvq]
      es: [impuesto, impuesto sobre ventas, iva]
    relates_to:
      - {entity: estimate, label: applied_to}
      - {entity: invoice, label: applied_to}
      - {entity: location, label: determined_by}
    schemas:
      - 'tax:TaxCalculationResponse'
    schema_patterns:
      - 'tax:.*'
      - 'accounting:TaxLiability.*'
    facade_tools:
      - {tool: TaxFacadeTool, access: reads}

  # ---- places, suppliers, warranty, people -----------------------------------------------------
  - key: location
    domain: location
    terms:
      en: [location, store, branch, bay, service bay]
      fr: [emplacement, succursale, magasin, baie de service]
      es: [ubicación, sucursal, tienda, bahía de servicio]
    relates_to:
      - {entity: stock-item, label: holds}
      - {entity: employee, label: staffed_by}
    schemas:
      - 'location:LocationResponseDTO'
    schema_patterns:
      - 'location:.*'
      - 'shop-manager:Shop.*'
    facade_tools:
      - {tool: LocationFacadeTool, access: reads}
      - {tool: ShopManagerFacadeTool, access: reads}
      - {tool: TaxFacadeTool, access: reads}

  - key: supplier
    domain: supplier
    terms:
      en: [supplier, vendor]
      fr: [fournisseur]
      es: [proveedor]
    relates_to:
      - {entity: purchase-order, label: receives}
      - {entity: product, label: supplies}
    schemas:
      - 'supplier:VendorProfileView'
    schema_patterns:
      - 'supplier:.*'
      - 'accounting:VendorResponse'
    facade_tools:
      - {tool: AccountingFacadeTool, access: reads}

  - key: warranty-claim
    domain: warranty
    terms:
      en: [warranty claim, warranty]
      fr: [réclamation de garantie, garantie]
      es: [reclamo de garantía, garantía]
    identifiers:
      - key: claim-code
        pattern: '\bWC-\d{4}-\d{6}\b'
    relates_to:
      - {entity: customer, label: belongs_to}
      - {entity: vehicle, label: for}
      - {entity: workorder, label: originates_from}
      - {entity: invoice, label: settled_against}
    schemas:
      - 'warranty:ClaimResponse'
      - 'warranty:ClaimSummaryResponse'
    schema_patterns:
      - 'warranty:.*'

  - key: employee
    domain: people
    terms:
      en: [employee, staff member, technician, mechanic]
      fr: [employé, technicien, mécanicien]
      es: [empleado, técnico, mecánico]
    relates_to:
      - {entity: location, label: assigned_to}
      - {entity: user, label: linked_to}
      - {entity: workorder, label: works_on}
    schemas:
      - 'people:EmployeeProfileDto'
      - 'people:EmployeeSummaryDto'
    schema_patterns:
      - 'people:.*'
      - 'people-contact:(Person.*|ResolvePerson.*|ContactPointDto|PostalAddressDto|LinkUserToPersonRequest|CreateUserLinkRequest|UserPersonLinkResponse)'
      - 'shop-manager:(MechanicRoster.*|LocationTechnician.*|PagedModel.*|TechnicianCredentialResponse|PersonDTO)'
    facade_tools:
      - {tool: HrFacadeTool, access: reads}
      - {tool: WorkorderFacadeTool, access: reads}

  - key: user
    domain: security-service
    terms:
      en: [user, user account, login]
      fr: [utilisateur, compte utilisateur]
      es: [usuario, cuenta de usuario]
    relates_to:
      - {entity: role, label: holds}
      - {entity: employee, label: linked_to}
    schemas:
      - 'security-service:UserDto'
    schema_patterns:
      - 'security-service:BulkIngestRequestUser.*'
      - 'security-service:(User.*|CreateUserRequest|LinkUserPersonRequest|SelfRegistration.*|ResolveSelfRegistration.*|Activat.*|LoginRequest|.*Token.*|AccountState.*|ValidateResponse|Tenant.*|Audit.*|PageAuditLogEventDto|CrmMatchSummaryDto)'
    facade_tools:
      - {tool: AdminFacadeTool, access: reads}

  - key: role
    domain: security-service
    terms:
      en: [role, permission, access right]
      fr: [rôle, permission, droit d'accès]
      es: [rol, permiso, derecho de acceso]
    relates_to:
      - {entity: user, label: assigned_to}
    schemas:
      - 'security-service:RoleDto'
    schema_patterns:
      - 'security-service:BulkIngestRequestRole.*'
      - 'security-service:(Role.*|Permission.*|GrantAdded|AuthorizationDecisionResponse|CatalogVersionResponse)'
      - 'people-contact:(RoleDto|UserRoleDto)'
    facade_tools:
      - {tool: AdminFacadeTool, access: reads}

  # ---- accounting ------------------------------------------------------------------------------
  - key: journal-entry
    domain: accounting
    terms:
      en: [journal entry, ledger entry]
      fr: [écriture de journal, écriture comptable]
      es: [asiento contable, asiento de diario]
    relates_to:
      - {entity: gl-account, label: posts_to}
    schemas:
      - 'accounting:JournalEntryResponse'
    schema_patterns:
