spring:
  application:
    name: mcp-server
  jackson:
    default-property-inclusion: non_null
  flyway:
    locations: classpath:db/h2-migration
mcp:
  server:
    base-url: http://localhost:${server.port}
    message-endpoint: /mcp/message
    sse-endpoint: /mcp/sse
    open-api-path: /v3/api-docs
    discovery-timeout: 5s
    aggregate-spec-url: ${MCP_AGGREGATE_SPEC_URL:http://localhost:8080/v3/api-docs}
    excluded-path-fragments:
      - /admin/
      - /actuator/
      - /internal/
  security:
    permit-all-transport: false
  rag:
    table-name: mcp_document_embedding
    dimension: 768
    index-type: ivfflat
    preload:
      docs:
        - id: "accounting.de-bookkeeping"
          source-path: "classpath:rag/de-bookkeeping-rag.md"
          rag-scope: "accounting"
        - id: "inventory.inv-cntrl"
          source-path: "classpath:rag/inv-cntrl-rag.md"
          rag-scope: "inventory"
        - id: "people.human-resources"
          source-path: "classpath:rag/hr-functions-guide.md"
          rag-scope: "hr"
        - id: "shop.management"
          source-path: "classpath:rag/shop-management-rag.md"
          rag-scope: "shopmanager"
        - id: "shop.management.guidelines"
          source-path: "classpath:rag/shop-management-guidelines.md"
          rag-scope: "shopmanager"
        - id: "security.guide"
          source-path: "classpath:rag/security-service-guide.md"
          rag-scope: "master"
        # Gate 5 documents. `required-permissions` is the G5.2 metadata field (not yet bound by
        # StaticDocEntry — ignored until G5.2 adds the field + permission-aware filter G5.1);
        # carried here so it is ready and records intent. Permission codes verified against the
        # service permissions.yaml files.
        - id: "platform.capability-catalog"
          source-path: "classpath:rag/capability-catalog.md"
          rag-scope: "master"
          required-permissions: ["AUTHENTICATED"]
        - id: "workflow.cross-domain-playbooks"
          source-path: "classpath:rag/cross-domain-playbooks.md"
          rag-scope: "master"
          required-permissions: ["AUTHENTICATED"]
        - id: "glossary.identifiers"
          source-path: "classpath:rag/glossary-identifiers.md"
          rag-scope: "master"
          required-permissions: ["AUTHENTICATED"]
        - id: "order.guide"
          source-path: "classpath:rag/order-guide.md"
          rag-scope: "order"
          required-permissions: ["order:order:view"]
        - id: "pricing.guide"
          source-path: "classpath:rag/pricing-guide.md"
          rag-scope: "pricing"
          required-permissions: ["pricing:price_book:view", "pricing:rule:view"]
        - id: "tax.guide"
          source-path: "classpath:rag/tax-guide.md"
          rag-scope: "tax"
          required-permissions: ["tax:mode:view"]
        - id: "crm.customer-vehicle"
          source-path: "classpath:rag/customer-vehicle-guide.md"
          rag-scope: "customer"
          required-permissions: ["crm:party:view", "crm:party:search", "crm:vehicle:view", "crm:vehicle:search", "crm:contact:view"]
        - id: "reporting.metrics"
          source-path: "classpath:rag/reporting-metrics.md"
          rag-scope: "reporting"
          required-permissions: ["accounting:report:export", "workorder:dashboard:view"]
        - id: "admin.governance"
          source-path: "classpath:rag/admin-governance.md"
          rag-scope: "admin"
          required-permissions: ["security:permission:view", "workorder:approval_config:view"]
        - id: "events.observability"
          source-path: "classpath:rag/events-observability.md"
          rag-scope: "events"
          required-permissions: ["nlti:audit:read"]
        - id: "security.role-permission-matrix"
          source-path: "classpath:rag/role-permission-matrix.md"
          rag-scope: "security"
          required-permissions: ["security:role:view", "security:permission:view"]
    chunking:
      enabled: ${MCP_RAG_CHUNKING_ENABLED:true}
      max-segment-size: ${MCP_RAG_MAX_SEGMENT_SIZE:2000}
      max-overlap-size: ${MCP_RAG_MAX_OVERLAP_SIZE:200}
  agent:
    cache-ttl-minutes: 30
    max-cached-agents: 500
    memory-max-messages: 50
  tuning:
    # Gate 0 (NL-interface plan): adaptive tuning disabled until the retrieval-quality
    # regression harness exists. Re-enable only via shadow→controlled-live promotion (Gate 7).
    enabled: ${MCP_TUNING_ENABLED:false}
    cron: "0 0 2 * * ?"
  model:
    fallback:
      enabled: ${MCP_MODEL_FALLBACK_ENABLED:false}
      secondary-model-name: ${OLLAMA_FALLBACK_MODEL:gpt-oss:120b}
      timeout: ${OLLAMA_FALLBACK_TIMEOUT:${OLLAMA_CHAT_TIMEOUT:180s}}

langchain4j:
  ollama:
    chat-model:
      base-url: ${OLLAMA_CHAT_BASE_URL:${OLLAMA_BASE_URL:http://localhost:11434}}
      # Deliberate default executor model (Gate 0 config-hygiene). Documented in README.
      # Tier routing (Gate 4) may select a smaller/larger model per request; this is the single default.
      model-name: ${OLLAMA_CHAT_MODEL:qwen3.5:cloud}
      temperature: 0.2
      timeout: ${OLLAMA_CHAT_TIMEOUT:180s}
    embedding-model:
      base-url: ${OLLAMA_EMBEDDING_BASE_URL:${OLLAMA_BASE_URL:http://localhost:11434}}
      model-name: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      timeout: ${OLLAMA_EMBEDDING_TIMEOUT:30s}
    streaming-chat-model:
      base-url: ${OLLAMA_CHAT_BASE_URL:${OLLAMA_BASE_URL:http://localhost:11434}}
      model-name: ${OLLAMA_CHAT_MODEL:qwen3.5:cloud}
      temperature: 0.2
      timeout: ${OLLAMA_STREAMING_CHAT_TIMEOUT:${OLLAMA_CHAT_TIMEOUT:180s}}

exa:
  api-key: ${EXA_API_KEY:}
  base-url: https://api.exa.ai
  search-type: auto
  max-results: 5

server:
  port: 8086
  tomcat:
    max-http-header-size: 65536
  max-http-request-header-size: 32KB
  servlet:
    context-path: /

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    health-check-url-path: /actuator/health

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs

  default-produces-media-type: application/json
pos:
  accounting:
    base-url: ${POS_ACCOUNTING_BASE_URL:http://pos-api-gateway}
    account-balance-uri-template: ${POS_ACCOUNTING_ACCOUNT_BALANCE_URI_TEMPLATE:/accounting/v1/accounting/accounts/{accountId}/balance}
    journal-entries-search-uri-template: ${POS_ACCOUNTING_JOURNAL_ENTRIES_SEARCH_URI_TEMPLATE:/accounting/v1/accounting/journal-entries/search?q={query}}
    financial-summary-uri-template: ${POS_ACCOUNTING_FINANCIAL_SUMMARY_URI_TEMPLATE:/accounting/v1/accounting/summary/{period}}
  catalog:
    base-url: ${POS_CATALOG_BASE_URL:http://pos-api-gateway}
    product-uri-template: ${POS_CATALOG_PRODUCT_URI_TEMPLATE:/catalog/v1/catalog/products/{productId}}
    search-uri-template: ${POS_CATALOG_SEARCH_URI_TEMPLATE:/catalog/v1/catalog/search?q={query}}
    category-uri-template: ${POS_CATALOG_CATEGORY_URI_TEMPLATE:/catalog/v1/catalog/categories/{category}}
  customer:
    base-url: ${POS_CUSTOMER_BASE_URL:http://pos-api-gateway}
    customer-uri-template: ${POS_CUSTOMER_URI_TEMPLATE:/customer/v1/customers/{customerId}}
    search-uri-template: ${POS_CUSTOMER_SEARCH_URI_TEMPLATE:/customer/v1/customers/search?q={query}}
    history-uri-template: ${POS_CUSTOMER_HISTORY_URI_TEMPLATE:/customer/v1/customers/{customerId}/history}
  event-receiver:
    base-url: ${POS_EVENT_RECEIVER_BASE_URL:http://pos-api-gateway}
    event-types-uri-template: ${POS_EVENT_RECEIVER_EVENT_TYPES_URI_TEMPLATE:/event-receiver/v1/events/eventTypes}
    search-uri-template: ${POS_EVENT_RECEIVER_SEARCH_URI_TEMPLATE:/event-receiver/v1/events/events/summary?q={query}}
    history-uri-template: ${POS_EVENT_RECEIVER_HISTORY_URI_TEMPLATE:/event-receiver/v1/events/events/summary?entityId={entityId}}
  inventory:
    base-url: ${POS_INVENTORY_BASE_URL:http://pos-api-gateway}
    stock-uri-template: ${POS_INVENTORY_STOCK_URI_TEMPLATE:/inventory/v1/inventory/stock/{sku}}
    search-uri-template: ${POS_INVENTORY_SEARCH_URI_TEMPLATE:/inventory/v1/inventory/search?q={query}}
    location-stock-uri-template: ${POS_INVENTORY_LOCATION_STOCK_URI_TEMPLATE:/inventory/v1/inventory/locations/{locationId}/stock}
  invoice:
    base-url: ${POS_INVOICE_BASE_URL:http://pos-api-gateway}
    invoice-uri-template: ${POS_INVOICE_URI_TEMPLATE:/invoice/v1/invoices/{invoiceId}}
    search-uri-template: ${POS_INVOICE_SEARCH_URI_TEMPLATE:/invoice/v1/invoices/search?q={query}}
    customer-invoices-uri-template: ${POS_INVOICE_CUSTOMER_INVOICES_URI_TEMPLATE:/invoice/v1/invoices/customer/{customerId}}
  nlti:
    session:
      ttl-hours: 24
    rate-limit:
      per-session: 100
      max-tracked-sessions: 100000
  location:
    base-url: ${POS_LOCATION_BASE_URL:http://pos-api-gateway}
    location-uri-template: ${POS_LOCATION_URI_TEMPLATE:/location/v1/locations/{locationId}}
    search-uri-template: ${POS_LOCATION_SEARCH_URI_TEMPLATE:/location/v1/locations/search?q={query}}
    inventory-uri-template: ${POS_LOCATION_INVENTORY_URI_TEMPLATE:/location/v1/locations/{locationId}/inventory}
  order:
    base-url: ${POS_ORDER_BASE_URL:http://pos-api-gateway}
    order-uri-template: ${POS_ORDER_URI_TEMPLATE:/order/v1/orders/{orderId}}
    search-uri-template: ${POS_ORDER_SEARCH_URI_TEMPLATE:/order/v1/orders/search?q={query}}
  pricing:
    base-url: ${POS_PRICING_BASE_URL:http://pos-api-gateway}
    sku-price-uri-template: ${POS_PRICING_SKU_PRICE_URI_TEMPLATE:/price/v1/pricing/sku/{sku}}
    search-uri-template: ${POS_PRICING_SEARCH_URI_TEMPLATE:/price/v1/pricing/search?q={query}}
    price-list-uri-template: ${POS_PRICING_PRICE_LIST_URI_TEMPLATE:/price/v1/pricing/lists/{priceListId}}
  reporting:
    base-url: ${POS_REPORTING_BASE_URL:http://pos-api-gateway}
    sales-report-uri-template: ${POS_REPORTING_SALES_REPORT_URI_TEMPLATE:/accounting/v1/reporting/sales/{period}}
    inventory-report-uri-template: ${POS_REPORTING_INVENTORY_REPORT_URI_TEMPLATE:/accounting/v1/reporting/inventory/{locationId}}
    revenue-report-uri-template: ${POS_REPORTING_REVENUE_REPORT_URI_TEMPLATE:/accounting/v1/reporting/revenue/{period}}
  security:
    users:
      base-url: ${POS_SECURITY_USERS_BASE_URL:http://pos-api-gateway}
    audit:
      base-url: ${POS_SECURITY_AUDIT_BASE_URL:http://pos-api-gateway}
    user-permissions-path-template: ${POS_SECURITY_USER_PERMISSIONS_PATH_TEMPLATE:/security-service/v1/users/{userId}/permissions}
    audit-search-uri-template: ${POS_SECURITY_AUDIT_SEARCH_URI_TEMPLATE:/security-service/v1/audit/events?eventType={query}}
  hr:
    employee-base-url: ${POS_HR_EMPLOYEE_BASE_URL:http://pos-api-gateway}
    people-base-url: ${POS_HR_PEOPLE_BASE_URL:http://pos-api-gateway}
    availability-base-url: ${POS_HR_AVAILABILITY_BASE_URL:http://pos-api-gateway}
    employee-uri-template: ${POS_HR_EMPLOYEE_URI_TEMPLATE:/people/v1/people/employees/{employeeId}}
    search-uri-template: ${POS_HR_SEARCH_URI_TEMPLATE:/people/v1/people?q={query}}
    schedule-uri-template: ${POS_HR_SCHEDULE_URI_TEMPLATE:/people/v1/people/availability?employeeId={employeeId}}
  shopmanager:
    base-url: ${POS_SHOPMANAGER_BASE_URL:http://pos-api-gateway}
    status-uri-template: ${POS_SHOPMANAGER_STATUS_URI_TEMPLATE:/shop-manager/v1/shop/{shopId}/status}
    queue-uri-template: ${POS_SHOPMANAGER_QUEUE_URI_TEMPLATE:/shop-manager/v1/shop/{shopId}/queue}
    search-uri-template: ${POS_SHOPMANAGER_SEARCH_URI_TEMPLATE:/shop-manager/v1/shop/search?q={query}}
  tax:
    # ADR-0021: pos-tax is internal-only and excluded from Eureka/gateway migration
    base-url: ${POS_TAX_BASE_URL:http://pos-tax/v1/tax}
    tax-rate-uri-template: ${POS_TAX_RATE_URI_TEMPLATE:/rates/{locationId}}
    tax-calculate-uri-template: ${POS_TAX_CALCULATE_URI_TEMPLATE:/calculate?amount={amount}&locationId={locationId}}
    tax-summary-uri-template: ${POS_TAX_SUMMARY_URI_TEMPLATE:/summary/{period}}
  vehicle:
    base-url: ${POS_VEHICLE_BASE_URL:http://pos-api-gateway}
    vehicle-uri-template: ${POS_VEHICLE_URI_TEMPLATE:/customer/v1/vehicles/{vehicleId}}
    search-uri-template: ${POS_VEHICLE_SEARCH_URI_TEMPLATE:/customer/v1/vehicles/search?q={query}}
    customer-vehicles-uri-template: ${POS_VEHICLE_CUSTOMER_VEHICLES_URI_TEMPLATE:/customer/v1/vehicles/customer/{customerId}}
  workorder:
    base-url: ${POS_WORKORDER_BASE_URL:http://pos-api-gateway}
    workorder-uri-template: ${POS_WORKORDER_URI_TEMPLATE:/workorder/v1/workorders/{workorderId}}
    search-uri-template: ${POS_WORKORDER_SEARCH_URI_TEMPLATE:/workorder/v1/workorders/search?q={query}}
    status-uri-template: ${POS_WORKORDER_STATUS_URI_TEMPLATE:/workorder/v1/workorders/{workorderId}/status}
  show-actuator: true

logging:
  level:
    com:
      positivity:
        mcp: DEBUG
      netflix:
        discovery:
          shared:
            resolver:
              aws:
                ConfigClusterResolver: WARN
    org:
      springframework:
        web: INFO
        cloud: INFO
