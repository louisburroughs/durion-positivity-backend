spring:
  application:
    name: mcp-server
  jackson:
    default-property-inclusion: non_null
  flyway:
    locations: classpath:db/h2-migration
mcp:
  server:
    base-url: http://localhost:${server.port}
    message-endpoint: /mcp/message
    sse-endpoint: /mcp/sse
    open-api-path: /v3/api-docs
    discovery-timeout: 5s
    included-services:
      - event-receiver
    included-path-prefixes:
      - /v1/events/summary
  security:
    permit-all-transport: false
  rag:
    table-name: mcp_document_embedding
    dimension: 768
    index-type: ivfflat
  agent:
    cache-ttl-minutes: 30
    max-cached-agents: 500
    memory-max-messages: 50
  tuning:
    enabled: true
    cron: "0 0 2 * * ?"
  model:
    fallback:
      enabled: false
      secondary-model-name: ${OLLAMA_FALLBACK_MODEL:mistral:7b}
      timeout: ${OLLAMA_FALLBACK_TIMEOUT:${OLLAMA_CHAT_TIMEOUT:180s}}

langchain4j:
  ollama:
    chat-model:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model-name: ${OLLAMA_CHAT_MODEL:llama3.1:8b}
      temperature: 0.2
      timeout: ${OLLAMA_CHAT_TIMEOUT:180s}
    embedding-model:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model-name: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      timeout: ${OLLAMA_EMBEDDING_TIMEOUT:30s}

exa:
  api-key: ${EXA_API_KEY:}
  base-url: https://api.exa.ai
  search-type: auto
  max-results: 5

server:
  port: 8086
  servlet:
    context-path: /

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    health-check-url-path: /actuator/health

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs

pos:
  nlti:
    session:
      ttl-hours: 24
    rate-limit:
      per-session: 100
      max-tracked-sessions: 100000
  inventory:
    base-url: ${POS_INVENTORY_BASE_URL:http://pos-inventory/v1/inventory}
  order:
    base-url: ${POS_ORDER_BASE_URL:http://pos-order/v1/orders}
  show-actuator: true

logging:
  level:
    com:
      positivity:
        mcp: DEBUG
    org:
      springframework:
        web: INFO
        cloud: INFO
