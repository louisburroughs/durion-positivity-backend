spring:
  application:
    name: mcp-server
  jackson:
    default-property-inclusion: non_null
  flyway:
    locations: classpath:db/h2-migration
  ai:
    ollama:
      base-url: ${OLLAMA_CHAT_BASE_URL:${OLLAMA_BASE_URL:http://localhost:11434}}
      chat:
        options:
          # Deliberate default executor model (Gate 0 config-hygiene). Documented in README.
          # Tier routing (Gate 4) may select a smaller/larger model per request; this is the single default.
          model: ${OLLAMA_CHAT_MODEL:gpt-oss:120b}
          temperature: 0.2
        timeout: ${OLLAMA_CHAT_TIMEOUT:180s}
        streaming-timeout: ${OLLAMA_STREAMING_CHAT_TIMEOUT:${OLLAMA_CHAT_TIMEOUT:180s}}
      embedding:
        base-url: ${OLLAMA_EMBEDDING_BASE_URL:${OLLAMA_BASE_URL:http://localhost:11434}}
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
        timeout: ${OLLAMA_EMBEDDING_TIMEOUT:30s}
mcp:
  server:
    base-url: http://localhost:${server.port}
    message-endpoint: /mcp/message
    sse-endpoint: /mcp/sse
    open-api-path: /v3/api-docs
    discovery-timeout: 5s
    aggregate-spec-url: ${MCP_AGGREGATE_SPEC_URL:http://localhost:8080/v3/api-docs}
    excluded-path-fragments:
      - /admin/
      - /actuator/
      - /internal/
  sitemap:
    # Origin of the frontend SSR server (NOT the API gateway). The SSR server defaults to port 4000.
    base-url: ${FRONTEND_BASE_URL:http://localhost:4000}
    cache-ttl: ${SITEMAP_CACHE_TTL:600s}
    fetch-timeout: ${SITEMAP_FETCH_TIMEOUT:5s}
    expected-version: ${SITEMAP_EXPECTED_VERSION:1}
  security:
    permit-all-transport: false
  write-plan:
    # Gate 6 (#1193): minutes a previewed write plan stays confirmable before it expires.
    ttl-minutes: ${MCP_WRITE_PLAN_TTL_MINUTES:10}
  rag:
    table-name: mcp_document_embedding
    # G5.4 #1194 cutover complete + #1207 (V33): the embedding column is 1024-dim bge-m3; the 768
    # nomic columns and the dual-column selector were retired. The knobs remain for a future
    # embedding-model migration — see docs/gate5-rag-hybrid-design.md.
    embedding-column: ${MCP_RAG_EMBEDDING_COLUMN:embedding}
    dimension: ${MCP_RAG_DIMENSION:1024}
    # #1194: dense-retrieval cosine-similarity floors (primary retriever / tier-2 wide
    # retriever), calibrated per embedding model. Defaults fit bge-m3 (the alpha floor sweep chose
    # 0.45/0.40; nomic-embed-text needed 0.6/0.55 — its similarities sit ~0.10-0.15 higher). Flip
    # together with the embedding model — see docs/gate5-rag-hybrid-design.md G5.4.
    min-score: ${MCP_RAG_MIN_SCORE:0.45}
    tier2-min-score: ${MCP_RAG_TIER2_MIN_SCORE:0.40}
    index-type: ivfflat
    hybrid:
      # Exact identifiers (VINs, SKUs, permission/event codes) routinely score below the dense
      # tier-1 floor. Keep the literal FTS source in the live candidate set; operators can disable
      # it immediately if the retrieval-quality gate detects a regression.
      lexical-enabled: ${MCP_RAG_LEXICAL_ENABLED:true}
    rerank:
      # #1180: compound questions (two information needs in one query) reserve a slot in the final
      # top-K for each sub-query's best chunk, so chunks serving one need cannot crowd the other
      # need's best chunk out of the context window. Single-need queries are unaffected; operators
      # can disable instantly if the retrieval-quality gate detects a regression.
      compound-slots-enabled: ${MCP_RAG_RERANK_COMPOUND_SLOTS_ENABLED:true}
      # Cap on detected sub-queries eligible for a reserved slot.
      max-sub-queries: 3
    preload:
      docs:
        - id: "accounting.de-bookkeeping"
          source-path: "classpath:rag/de-bookkeeping-rag.md"
          rag-scope: "accounting"
        - id: "accounting.journal-entries"
          source-path: "classpath:rag/accounting-journal-entries-rag.md"
          rag-scope: "accounting"
          required-permissions: ["accounting:je:view"]
        - id: "accounting.financial-statements"
          source-path: "classpath:rag/accounting-financial-statements-rag.md"
          rag-scope: "accounting"
          required-permissions: ["reporting:view:financial-statements"]
        - id: "accounting.report-export"
          source-path: "classpath:rag/accounting-report-export-rag.md"
          rag-scope: "accounting"
          required-permissions: ["accounting:report:export"]
        - id: "accounting.codes"
          source-path: "classpath:rag/accounting-codes-rag.md"
          rag-scope: "accounting"
          required-permissions: ["accounting:je:view"]
        - id: "inventory.inv-cntrl"
          source-path: "classpath:rag/inv-cntrl-rag.md"
          rag-scope: "inventory"
        - id: "inventory.purchase-orders"
          source-path: "classpath:rag/inventory-purchase-orders-rag.md"
          rag-scope: "inventory"
          required-permissions: ["inventory:purchase_order:view"]
        - id: "inventory.receiving"
          source-path: "classpath:rag/inventory-receiving-rag.md"
          rag-scope: "inventory"
          required-permissions: ["inventory:receiving:view"]
        - id: "inventory.transfers-adjustments"
          source-path: "classpath:rag/inventory-transfers-adjustments-rag.md"
          rag-scope: "inventory"
          required-permissions: ["inventory:transfer:view"]
        - id: "inventory.codes"
          source-path: "classpath:rag/inventory-codes-rag.md"
          rag-scope: "inventory"
          required-permissions: ["inventory:purchase_order:view"]
        - id: "people.human-resources"
          source-path: "classpath:rag/hr-functions-guide.md"
          rag-scope: "hr"
        - id: "shop.management"
          source-path: "classpath:rag/shop-management-rag.md"
          rag-scope: "shopmanager"
        - id: "shop.management.guidelines"
          source-path: "classpath:rag/shop-management-guidelines.md"
          rag-scope: "shopmanager"
        - id: "security.guide"
          source-path: "classpath:rag/security-service-guide.md"
          rag-scope: "master"
          required-permissions: ["security:permission:view", "security:role:view"]
        # Gate 5 documents. `required-permissions` is the G5.2 metadata field (not yet bound by
        # StaticDocEntry — ignored until G5.2 adds the field + permission-aware filter G5.1);
        # carried here so it is ready and records intent. Permission codes verified against the
        # service permissions.yaml files.
        - id: "platform.capability-catalog"
          source-path: "classpath:rag/capability-catalog.md"
          rag-scope: "master"
          required-permissions: ["AUTHENTICATED"]
        - id: "workflow.cross-domain-playbooks"
          source-path: "classpath:rag/cross-domain-playbooks.md"
          rag-scope: "master"
          required-permissions: ["AUTHENTICATED"]
        - id: "glossary.identifiers"
          source-path: "classpath:rag/glossary-identifiers.md"
          rag-scope: "master"
          required-permissions: ["AUTHENTICATED"]
        - id: "order.guide"
          source-path: "classpath:rag/order-guide.md"
          rag-scope: "order"
          required-permissions: ["order:order:view"]
        - id: "order.lifecycle"
          source-path: "classpath:rag/order-lifecycle-rag.md"
          rag-scope: "order"
          required-permissions: ["order:order:view"]
        - id: "order.price-override"
          source-path: "classpath:rag/order-price-override-rag.md"
          rag-scope: "order"
          required-permissions: ["order:price_override:view"]
        - id: "order.codes"
          source-path: "classpath:rag/order-codes-rag.md"
          rag-scope: "order"
          required-permissions: ["order:order:view"]
        - id: "order.returns-refunds"
          source-path: "classpath:rag/returns-refunds-rag.md"
          rag-scope: "order"
          required-permissions: ["order:order:view"]
        - id: "pricing.guide"
          source-path: "classpath:rag/pricing-guide.md"
          rag-scope: "pricing"
          required-permissions: ["pricing:price_book:view", "pricing:rule:view"]
        - id: "pricing.promotions"
          source-path: "classpath:rag/pricing-promotions-rag.md"
          rag-scope: "pricing"
          required-permissions: ["pricing:promotion:view"]
        - id: "pricing.restrictions"
          source-path: "classpath:rag/pricing-restrictions-rag.md"
          rag-scope: "pricing"
          required-permissions: ["AUTHENTICATED"]
        - id: "pricing.codes"
          source-path: "classpath:rag/pricing-codes-rag.md"
          rag-scope: "pricing"
          required-permissions: ["pricing:promotion:view"]
        - id: "warranty.guide"
          source-path: "classpath:rag/warranty-guide.md"
          rag-scope: "warranty"
          required-permissions: ["warranty:claim:view"]
        - id: "tax.guide"
          source-path: "classpath:rag/tax-guide.md"
          rag-scope: "tax"
          required-permissions: ["tax:mode:view"]
        - id: "crm.customer-vehicle"
          source-path: "classpath:rag/customer-vehicle-guide.md"
          rag-scope: "customer"
          required-permissions: ["crm:party:view", "crm:party:search", "crm:vehicle:view", "crm:vehicle:search", "crm:contact:view"]
        - id: "crm.party-account-model"
          source-path: "classpath:rag/crm-party-account-model-rag.md"
          rag-scope: "customer"
          required-permissions: ["crm:party:view"]
        - id: "crm.codes"
          source-path: "classpath:rag/crm-codes-rag.md"
          rag-scope: "customer"
          required-permissions: ["crm:party:view"]
        - id: "reporting.metrics"
          source-path: "classpath:rag/reporting-metrics.md"
          rag-scope: "reporting"
          required-permissions: ["accounting:report:export", "workorder:dashboard:view"]
        - id: "admin.governance"
          source-path: "classpath:rag/admin-governance.md"
          rag-scope: "admin"
          required-permissions: ["security:permission:view", "workorder:approval_config:view"]
        - id: "events.observability"
          source-path: "classpath:rag/events-observability.md"
          rag-scope: "events"
          required-permissions: ["nlti:audit:read"]
        - id: "security.role-permission-matrix"
          source-path: "classpath:rag/role-permission-matrix.md"
          rag-scope: "security"
          required-permissions: ["security:role:view", "security:permission:view"]
        - id: "workorder.estimate-promotion"
          source-path: "classpath:rag/workorder-estimate-promotion-rag.md"
          rag-scope: "workorder"
          required-permissions: ["workorder:estimate:view"]
        - id: "workorder.status-lifecycle"
          source-path: "classpath:rag/workorder-status-lifecycle-rag.md"
          rag-scope: "workorder"
          required-permissions: ["workorder:workorder:view"]
        - id: "workorder.approval-config"
          source-path: "classpath:rag/workorder-approval-config-rag.md"
          rag-scope: "workorder"
          required-permissions: ["workorder:approval_config:view"]
        - id: "workorder.codes"
          source-path: "classpath:rag/workorder-codes-rag.md"
          rag-scope: "workorder"
          required-permissions: ["workorder:estimate:view"]
    chunking:
      enabled: ${MCP_RAG_CHUNKING_ENABLED:true}
      max-segment-size: ${MCP_RAG_MAX_SEGMENT_SIZE:2000}
      max-overlap-size: ${MCP_RAG_MAX_OVERLAP_SIZE:200}
  agent:
    cache-ttl-minutes: 30
    max-cached-agents: 500
    memory-max-messages: 50
  # Answer resolution ladder: on a turn that produced no direct answer, fall through to a
  # deep link (rung 3) or an honest hand-off (rung 4) instead of surfacing the thinking channel.
  ladder:
    enabled: ${MCP_LADDER_ENABLED:true}
  screen:
    # Minimum cosine similarity for a screen to be offered as a deep link.
    min-score: ${MCP_SCREEN_MIN_SCORE:0.6}
  tuning:
    # Gate 7 (#1195): adaptive tool-priority tuning mode — off | shadow | live.
    # shadow computes proposals and emits them (logger mcp.tuning.shadow, counter
    # mcp.tuning.proposals) without persisting; live writes only when the newest eval baseline
    # (eval-result-path, produced by scripts/eval_live.py) reports thresholds.passed=true and is
    # younger than eval-freshness-hours — otherwise the run downgrades to shadow with a WARN.
    # Legacy mcp.tuning.enabled=true (deprecated, kept for operators still setting
    # MCP_TUNING_ENABLED) is treated as mode=live when mode is unset.
    mode: ${MCP_TUNING_MODE:off}
    enabled: ${MCP_TUNING_ENABLED:}
    eval-result-path: ${MCP_TUNING_EVAL_RESULT_PATH:target/eval/baseline-live-python.json}
    eval-freshness-hours: ${MCP_TUNING_EVAL_FRESHNESS_HOURS:48}
    cron: "0 0 2 * * ?"
  model:
    # Gate 4 (#1192) tiered model router. Feature flag / rollback: set
    # MCP_MODEL_TIERING_ENABLED=false and every request uses the single default executor model
    # (spring.ai.ollama.chat.options.model) with the historical cache keys.
    tiering-enabled: ${MCP_MODEL_TIERING_ENABLED:true}
    # T1 router/classifier model (strict JSON, always temperature 0). Deliberately small. If the
    # model is not pulled on the Ollama host the router call fails fast and the request safely
    # defaults to T2-complex — never silently to a smaller model.
    router: ${MCP_MODEL_ROUTER:qwen3:4b}
    # T2-simple executor (single-tool lookups). Blank = use the default executor model; set to a
    # smaller pulled model (e.g. qwen3:8b) to realize the latency/cost win.
    simple: ${MCP_MODEL_SIMPLE:}
    # T2-complex executor (multi-tool, writes, accounting/tax/admin/security). Blank = use the
    # default executor model (gpt-oss:120b), which is already the complex-class model.
    complex: ${MCP_MODEL_COMPLEX:}
    # Failover (primary -> secondary within a tier) — orthogonal to tier routing above.
    fallback:
      enabled: ${MCP_MODEL_FALLBACK_ENABLED:false}
      secondary-model-name: ${OLLAMA_FALLBACK_MODEL:gpt-oss:20b}
      timeout: ${OLLAMA_FALLBACK_TIMEOUT:${OLLAMA_CHAT_TIMEOUT:180s}}

exa:
  api-key: ${EXA_API_KEY:}
  base-url: https://api.exa.ai
  search-type: auto
  max-results: 5

server:
  port: 8086
  tomcat:
    max-http-header-size: 65536
  max-http-request-header-size: 32KB
  servlet:
    context-path: /

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    health-check-url-path: /actuator/health

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs

  default-produces-media-type: application/json
pos:
  accounting:
    base-url: ${POS_ACCOUNTING_BASE_URL:http://pos-api-gateway}
    account-balance-uri-template: ${POS_ACCOUNTING_ACCOUNT_BALANCE_URI_TEMPLATE:/accounting/v1/accounting/gl-accounts/{glAccountId}/balance}
    general-ledger-uri-template: ${POS_ACCOUNTING_GENERAL_LEDGER_URI_TEMPLATE:/accounting/v1/accounting/reports/financial/general-ledger?startDate={startDate}&endDate={endDate}}
    # getFinancialSummary composition legs (#1519 WS-3.FINSUM).
    income-statement-uri-template: ${POS_ACCOUNTING_INCOME_STATEMENT_URI_TEMPLATE:/accounting/v1/accounting/reports/financial/income-statement?startDate={startDate}&endDate={endDate}}
    balance-sheet-uri-template: ${POS_ACCOUNTING_BALANCE_SHEET_URI_TEMPLATE:/accounting/v1/accounting/reports/financial/balance-sheet?asOfDate={asOfDate}}
    # The trial-balance as-of query param is `asOf` — unlike the sibling reports' `asOfDate`.
    trial-balance-uri-template: ${POS_ACCOUNTING_TRIAL_BALANCE_URI_TEMPLATE:/accounting/v1/accounting/reports/financial/trial-balance?asOf={asOf}}
  catalog:
    base-url: ${POS_CATALOG_BASE_URL:http://pos-api-gateway}
    product-uri-template: ${POS_CATALOG_PRODUCT_URI_TEMPLATE:/catalog/v1/products/{productId}}
    search-uri-template: ${POS_CATALOG_SEARCH_URI_TEMPLATE:/catalog/v1/products/search?q={query}}
    category-uri-template: ${POS_CATALOG_CATEGORY_URI_TEMPLATE:/catalog/v1/products/search?category={category}}
  customer:
    base-url: ${POS_CUSTOMER_BASE_URL:http://pos-api-gateway}
    customer-uri-template: ${POS_CUSTOMER_URI_TEMPLATE:/customer/v1/crm/accounts/parties/{partyId}}
    search-uri-template: ${POS_CUSTOMER_SEARCH_URI_TEMPLATE:/customer/v1/crm/accounts/parties?name={query}}
    # getCustomerHistory composition legs (#1519 WS-3.CUSTHIST). The invoice and workorder
    # legs cross domains on purpose: pos-customer holds no billing or repair history, so the
    # facade reads the /invoice and /workorder gateway routes (same gateway host) for the
    # customer's invoice lines and workorders.
    snapshot-uri-template: ${POS_CUSTOMER_SNAPSHOT_URI_TEMPLATE:/customer/v1/crm/snapshot/party/{partyId}}
    interactions-uri-template: ${POS_CUSTOMER_INTERACTIONS_URI_TEMPLATE:/customer/v1/crm/parties/{partyId}/interactions}
    invoices-uri-template: ${POS_CUSTOMER_INVOICES_URI_TEMPLATE:/invoice/v1/invoices/items/search?partyId={partyId}}
    workorders-uri-template: ${POS_CUSTOMER_WORKORDERS_URI_TEMPLATE:/workorder/v1/workorders/search?customerId={partyId}}
  event-receiver:
    base-url: ${POS_EVENT_RECEIVER_BASE_URL:http://pos-api-gateway}
    event-types-uri-template: ${POS_EVENT_RECEIVER_EVENT_TYPES_URI_TEMPLATE:/event-receiver/v1/eventTypes/active}
    # facade-checker: expand window=lastHour|lastDay|lastWeek
    summary-uri-template: ${POS_EVENT_RECEIVER_SUMMARY_URI_TEMPLATE:/event-receiver/v1/events/summary/{window}}
  inventory:
    base-url: ${POS_INVENTORY_BASE_URL:http://pos-api-gateway}
    stock-uri-template: ${POS_INVENTORY_STOCK_URI_TEMPLATE:/inventory/v1/inventory/availability/by-sku?productSku={productSku}}
    search-uri-template: ${POS_INVENTORY_SEARCH_URI_TEMPLATE:/inventory/v1/inventory/availability/by-sku?productSku={productSku}}
    location-stock-uri-template: ${POS_INVENTORY_LOCATION_STOCK_URI_TEMPLATE:/inventory/v1/inventory/locations/{locationId}/inventory-inquiry}
  invoice:
    base-url: ${POS_INVOICE_BASE_URL:http://pos-api-gateway}
    invoice-uri-template: ${POS_INVOICE_URI_TEMPLATE:/invoice/v1/invoices/{invoiceId}}
    search-uri-template: ${POS_INVOICE_SEARCH_URI_TEMPLATE:/invoice/v1/invoices/search?q={query}}
    customer-invoices-uri-template: ${POS_INVOICE_CUSTOMER_INVOICES_URI_TEMPLATE:/invoice/v1/invoices/items/search?partyId={customerId}}
  nlti:
    session:
      ttl-hours: 24
    rate-limit:
      per-session: 100
      max-tracked-sessions: 100000
  location:
    base-url: ${POS_LOCATION_BASE_URL:http://pos-api-gateway}
    location-uri-template: ${POS_LOCATION_URI_TEMPLATE:/location/v1/locations/{locationId}}
    # Zero-parameter roster; the facade filters by name/code in-process (the paged roster
    # endpoint would truncate a scan).
    search-uri-template: ${POS_LOCATION_SEARCH_URI_TEMPLATE:/location/v1/locations}
    # Cross-domain: pos-location publishes no inventory view, so the location facade reads the
    # /inventory gateway route (same gateway host) for a location's inventory inquiry.
    inventory-uri-template: ${POS_LOCATION_INVENTORY_URI_TEMPLATE:/inventory/v1/inventory/locations/{locationId}/inventory-inquiry}
  order:
    base-url: ${POS_ORDER_BASE_URL:http://pos-api-gateway}
    order-uri-template: ${POS_ORDER_URI_TEMPLATE:/order/v1/orders/carts/{orderId}}
    list-uri-template: ${POS_ORDER_LIST_URI_TEMPLATE:/order/v1/orders/carts}
  pricing:
    base-url: ${POS_PRICING_BASE_URL:http://pos-api-gateway}
    # getPriceForSku composition legs (#1519 WS-3.PRICE-SKU). Cross-domain per ADR-0054:
    # catalog owns MSRP and location effective prices. The search leg needs its own property
    # (not pos.catalog.search-uri-template) because it filters by sku= with detailed=true,
    # not by q=.
    product-search-uri-template: ${POS_PRICING_PRODUCT_SEARCH_URI_TEMPLATE:/catalog/v1/products/search?sku={sku}&detailed=true}
    effective-price-uri-template: ${POS_PRICING_EFFECTIVE_PRICE_URI_TEMPLATE:/catalog/v1/products/pricing/effective-price/{locationId}/{productId}}
    promotion-by-code-uri-template: ${POS_PRICING_PROMOTION_BY_CODE_URI_TEMPLATE:/price/v1/promotions/offers/by-code/{promoCode}}
    price-restrictions-uri-template: ${POS_PRICING_PRICE_RESTRICTIONS_URI_TEMPLATE:/price/v1/price/restrictions/rules}
    # Cross-domain per ADR-0054: catalog is the system of record for price books.
    price-list-uri-template: ${POS_PRICING_PRICE_LIST_URI_TEMPLATE:/catalog/v1/products/price-books/{priceBookId}}
  reporting:
    base-url: ${POS_REPORTING_BASE_URL:http://pos-api-gateway}
    sales-report-uri-template: ${POS_REPORTING_SALES_REPORT_URI_TEMPLATE:/accounting/v1/accounting/reports/financial/income-statement?startDate={startDate}&endDate={endDate}}
    # Cross-domain: pos-inventory serves the location rollup report.
    inventory-report-uri-template: ${POS_REPORTING_INVENTORY_REPORT_URI_TEMPLATE:/inventory/v1/inventory/locations/{locationId}/inventory-rollup}
    # getRevenueReport composition leg (#1519 WS-3.REPORTS); the income-statement leg reuses
    # sales-report-uri-template above.
    aged-receivables-uri-template: ${POS_REPORTING_AGED_RECEIVABLES_URI_TEMPLATE:/accounting/v1/accounting/reports/financial/aged-receivables?asOfDate={asOfDate}}
  security:
    users:
      base-url: ${POS_SECURITY_USERS_BASE_URL:http://pos-api-gateway}
    audit:
      base-url: ${POS_SECURITY_AUDIT_BASE_URL:http://pos-api-gateway}
    user-permissions-path-template: ${POS_SECURITY_USER_PERMISSIONS_PATH_TEMPLATE:/security-service/v1/users/{userId}/permissions}
    audit-search-uri-template: ${POS_SECURITY_AUDIT_SEARCH_URI_TEMPLATE:/security-service/v1/audit/events?eventType={query}}
  hr:
    employee-base-url: ${POS_HR_EMPLOYEE_BASE_URL:http://pos-api-gateway}
    availability-base-url: ${POS_HR_AVAILABILITY_BASE_URL:http://pos-api-gateway}
    employee-uri-template: ${POS_HR_EMPLOYEE_URI_TEMPLATE:/people/v1/people/employees/{employeeId}}
    schedule-uri-template: ${POS_HR_SCHEDULE_URI_TEMPLATE:/people/v1/people/availability?employeeId={employeeId}}
  shopmanager:
    base-url: ${POS_SHOPMANAGER_BASE_URL:http://pos-api-gateway}
    # getShopStatus/getShopQueue composition legs (#1519 WS-3.SHOPSTATUS/WS-3.SHOPQUEUE).
    # Shops ARE locations, and pos-shop-manager publishes no shop status or queue view, so
    # the location leg reads the /location route and the open-workorder leg reads the
    # /workorder workexec WIP board (same gateway host); only the schedule leg is served by
    # pos-shop-manager itself.
    location-uri-template: ${POS_SHOPMANAGER_LOCATION_URI_TEMPLATE:/location/v1/locations/{locationId}}
    schedule-uri-template: ${POS_SHOPMANAGER_SCHEDULE_URI_TEMPLATE:/shop-manager/v1/schedules/view?locationId={locationId}&date={date}}
    wip-uri-template: ${POS_SHOPMANAGER_WIP_URI_TEMPLATE:/workorder/v1/workexec/wip?locationId={locationId}}
    # Cross-domain: shops ARE locations; the facade fetches the /location roster and filters
    # by name/code in-process (pos-shop-manager publishes no shop directory).
    search-uri-template: ${POS_SHOPMANAGER_SEARCH_URI_TEMPLATE:/location/v1/locations}
  tax:
    # ADR-0021: pos-tax is internal-only and excluded from Eureka/gateway migration.
    # pos-tax listens on 8091 (no port-80 mapping), so the port is required (#641).
    base-url: ${POS_TAX_BASE_URL:http://pos-tax:8091/v1/tax}
    # Gateway base-url for the legs pos-tax does not serve: getTaxSummary reads
    # pos-accounting's tax-liability report, and calculateTax's address lookup reads the
    # /location route (#1519 WS-3.TAXCALC).
    gateway-base-url: ${POS_TAX_GATEWAY_BASE_URL:http://pos-api-gateway}
    location-uri-template: ${POS_TAX_LOCATION_URI_TEMPLATE:/location/v1/locations/{locationId}}
    tax-calculate-uri-template: ${POS_TAX_CALCULATE_URI_TEMPLATE:/calculate}
    tax-summary-uri-template: ${POS_TAX_SUMMARY_URI_TEMPLATE:/accounting/v1/accounting/reports/financial/tax-liability?startDate={startDate}&endDate={endDate}}
  vehicle:
    base-url: ${POS_VEHICLE_BASE_URL:http://pos-api-gateway}
    vehicle-uri-template: ${POS_VEHICLE_URI_TEMPLATE:/vehicle-inventory/v1/vehicle-registry/{vehicleId}}
    search-uri-template: ${POS_VEHICLE_SEARCH_URI_TEMPLATE:/vehicle-inventory/v1/vehicles/search?q={query}}
    customer-vehicles-uri-template: ${POS_VEHICLE_CUSTOMER_VEHICLES_URI_TEMPLATE:/customer/v1/crm/{customerId}/vehicles}
  workorder:
    base-url: ${POS_WORKORDER_BASE_URL:http://pos-api-gateway}
    workorder-uri-template: ${POS_WORKORDER_URI_TEMPLATE:/workorder/v1/workorders/{workorderId}}
    search-uri-template: ${POS_WORKORDER_SEARCH_URI_TEMPLATE:/workorder/v1/workorders/search?q={query}}
    status-uri-template: ${POS_WORKORDER_STATUS_URI_TEMPLATE:/workorder/v1/workorders/{workorderId}}
  show-actuator: true

logging:
  level:
    com:
      positivity:
        mcp: INFO
      netflix:
        discovery:
          shared:
            resolver:
              aws:
                ConfigClusterResolver: WARN
    org:
      springframework:
        web: INFO
        cloud: INFO
