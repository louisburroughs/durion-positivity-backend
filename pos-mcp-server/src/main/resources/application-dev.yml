spring:
  datasource:
    url: jdbc:h2:mem:mcp;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    locations: classpath:db/h2-migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          "[time_zone]": UTC

langchain4j:
  ollama:
    chat-model:
      base-url: ${OLLAMA_CHAT_BASE_URL:${OLLAMA_BASE_URL:http://localhost:11434}}
      model-name: ${OLLAMA_CHAT_MODEL:qwen3-next:80b}
      temperature: 0.2
      timeout: ${OLLAMA_CHAT_TIMEOUT:180s}
    embedding-model:
      base-url: ${OLLAMA_EMBEDDING_BASE_URL:${OLLAMA_BASE_URL:http://localhost:11434}}
      model-name: ${OLLAMA_EMBEDDING_MODEL:qwen3-embedding}
      timeout: ${OLLAMA_EMBEDDING_TIMEOUT:30s}
    streaming-chat-model:
      base-url: ${OLLAMA_CHAT_BASE_URL:${OLLAMA_BASE_URL:http://localhost:11434}}
      model-name: ${OLLAMA_CHAT_MODEL:qwen3-next:80b}
      temperature: 0.2
      timeout: ${OLLAMA_STREAMING_CHAT_TIMEOUT:${OLLAMA_CHAT_TIMEOUT:180s}}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
