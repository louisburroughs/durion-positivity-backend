spring:
  datasource:
    url: jdbc:h2:mem:mcp;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    locations: classpath:db/h2-migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          "[time_zone]": UTC
  ai:
    ollama:
      base-url: ${OLLAMA_CHAT_BASE_URL:${OLLAMA_BASE_URL:http://localhost:11434}}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:gpt-oss:120b}
          # #1683: 0 (not 0.2). The analytics gate is graded at n=1, so sampling only adds
          # run-to-run variance to the "did that PR help?" comparison. Override per host with
          # OLLAMA_CHAT_TEMPERATURE if a workload ever needs sampling.
          temperature: ${OLLAMA_CHAT_TEMPERATURE:0.0}
          # #1683: always send num_ctx. Left unset, Ollama applies the host's
          # OLLAMA_CONTEXT_LENGTH (4096 by default) and truncates the FRONT of the context —
          # the system prompt — once the assembled prompt exceeds it. One analytics turn
          # (layered prompt + tool schemas + RAG snippets + memory + tool results) is well past
          # 4096. Raise/lower per host with OLLAMA_NUM_CTX; do not rely on the server default.
          num-ctx: ${OLLAMA_NUM_CTX:32768}
        timeout: ${OLLAMA_CHAT_TIMEOUT:180s}
        streaming-timeout: ${OLLAMA_STREAMING_CHAT_TIMEOUT:${OLLAMA_CHAT_TIMEOUT:180s}}
      embedding:
        base-url: ${OLLAMA_EMBEDDING_BASE_URL:${OLLAMA_BASE_URL:http://localhost:11434}}
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
        timeout: ${OLLAMA_EMBEDDING_TIMEOUT:30s}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

pos:
  security:
    users:
      base-url: ${POS_SECURITY_USERS_BASE_URL:http://localhost:8086/v1/users}
    audit:
      base-url: ${POS_SECURITY_AUDIT_BASE_URL:http://localhost:8086/v1/audit}
    # Dev base-url above already IS the full users endpoint (direct-to-service), so the list
    # path must stay empty here — the gateway default /security-service/v1/users would double it.
    users-list-path: ${POS_SECURITY_USERS_LIST_PATH:}
    user-permissions-path-template: ${POS_SECURITY_USER_PERMISSIONS_PATH_TEMPLATE:/{userId}/permissions}
    audit-search-uri-template: ${POS_SECURITY_AUDIT_SEARCH_URI_TEMPLATE:/events?eventType={query}}
  hr:
    employee-base-url: ${POS_HR_EMPLOYEE_BASE_URL:http://localhost:8085/v1/people/employees}
    availability-base-url: ${POS_HR_AVAILABILITY_BASE_URL:http://localhost:8085/v1/people}
    employee-uri-template: ${POS_HR_EMPLOYEE_URI_TEMPLATE:/{employeeId}}
    schedule-uri-template: ${POS_HR_SCHEDULE_URI_TEMPLATE:/availability?employeeId={employeeId}}

# ADR-0046: developer-only DEBUG loggers moved out of application.yml
logging:
  level:
    com:
      positivity:
        mcp: DEBUG
