spring:
  datasource:
    url: jdbc:h2:mem:mcp;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    locations: classpath:db/h2-migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          "[time_zone]": UTC

langchain4j:
  ollama:
    chat-model:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model-name: ${OLLAMA_CHAT_MODEL:llama3.1:8b}
      temperature: 0.2
      timeout: 60s
    embedding-model:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model-name: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      timeout: 30s
    streaming-chat-model:
      base-url: ${OLLAMA_BASE_URL}
      model-name: ${OLLAMA_CHAT_MODEL:llama3.1:8b}
      temperature: 0.2
      timeout: 60s

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
