                description: Reject below margin
                value:
                  actorUserId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  rejectionNotes: Margin would fall below store target
                  rejectionReasonCode: MARGIN_TOO_LOW
                  version: 0
            schema:
