openapi: 3.1.0
info:
  title: Positivity Product API
  description: "API documentation for the Product service, accessible via the API\
    \ Gateway."
  contact:
    name: Durion Team
    email: louis.burroughs@gmail.com
  version: v1
servers:
- url: http://api-gateway.local/api/catalog
  description: API Gateway
tags:
- name: UOM Conversion API
  description: Unit of measure conversion API
- name: Products API
  description: "API for products, lifecycle, and pricing"
- name: Item Cost API
  description: "Manage standard, last, and average item costs"
- name: Supplier Item Cost API
  description: Manage supplier item costs with volume tiers
- name: Product MSRP API
  description: Manage MSRP values with effective dates
- name: Catalog API
  description: API for managing catalogs
- name: Price Book API
  description: "Manage price books, pricing rules, and resolution"
- name: Catalog Items API
  description: API for managing catalog items by type
paths:
  /v1/products/{productId}:
    get:
      tags:
      - Products API
      summary: Get a product by ID
      description: Retrieves a specific product by its unique ID.
      operationId: getProductById
      parameters:
      - name: productId
        in: path
        description: ID of the product to be obtained
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Successfully retrieved product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDto"
        "404":
          description: Product not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDto"
    put:
      tags:
      - Products API
      summary: Update product master record
      description: Updates mutable product master fields. SKU is immutable.
      operationId: updateProduct
      parameters:
      - name: productId
        in: path
        description: ID of the product to update
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdateRequestDto"
        required: true
      responses:
        "400":
          description: Validation error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDto"
        "409":
          description: Business conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDto"
        "404":
          description: Product not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDto"
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDto"
  /v1/products/{productId}/msrp/{msrpId}:
    put:
      tags:
      - Product MSRP API
      summary: Update MSRP
      description: Updates a non-historical MSRP record.
      operationId: updateMsrp
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: msrpId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMsrpRequestDto"
        required: true
      responses:
        "400":
          description: Invalid payload
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductMsrpDto"
        "404":
          description: MSRP record not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductMsrpDto"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductMsrpDto"
        "409":
          description: Temporal overlap or optimistic locking conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductMsrpDto"
        "200":
          description: MSRP updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductMsrpDto"
  /v1/products/{productId}/lifecycle:
    get:
      tags:
      - Products API
      summary: Get product lifecycle state
      description: Retrieves lifecycle state and replacement suggestions for a product.
      operationId: getProductLifecycle
      parameters:
      - name: productId
        in: path
        description: ID of the product
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Product not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductLifecycleResponse"
        "200":
          description: Successfully retrieved lifecycle state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductLifecycleResponse"
    put:
      tags:
      - Products API
      summary: Set product lifecycle state
      description: "Sets lifecycle state to ACTIVE, INACTIVE, or DISCONTINUED with\
        \ effective date semantics."
      operationId: setLifecycleState
      parameters:
      - name: productId
        in: path
        description: ID of the product
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductLifecycleUpdateRequest"
        required: true
      responses:
        "400":
          description: Validation error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductLifecycleResponse"
        "200":
          description: Lifecycle state updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductLifecycleResponse"
        "404":
          description: Product not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductLifecycleResponse"
        "403":
          description: Missing override permission
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductLifecycleResponse"
        "409":
          description: Lifecycle business rule conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductLifecycleResponse"
  /v1/products/uom-conversions/{id}:
    get:
      tags:
      - UOM Conversion API
      summary: Get conversion
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Conversion found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UomConversionDto"
    put:
      tags:
      - UOM Conversion API
      summary: Update conversion factor
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UomConversionUpdateRequestDto"
        required: true
      responses:
        "200":
          description: Conversion updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UomConversionDto"
    delete:
      tags:
      - UOM Conversion API
      summary: Deactivate conversion
      operationId: deactivate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Conversion deactivated
  /v1/products/supplier-costs/{id}:
    get:
      tags:
      - Supplier Item Cost API
      summary: Get supplier cost structure
      operationId: getCostStructure
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SupplierItemCostDto"
        "200":
          description: Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierItemCostDto"
    put:
      tags:
      - Supplier Item Cost API
      summary: Update supplier cost structure
      operationId: updateCostStructure
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierItemCostUpdateRequestDto"
        required: true
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierItemCostDto"
        "404":
          description: Not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SupplierItemCostDto"
    delete:
      tags:
      - Supplier Item Cost API
      summary: Delete supplier cost structure
      operationId: deleteCostStructure
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
  /v1/products/price-books/{priceBookId}:
    get:
      tags:
      - Price Book API
      summary: Get price book
      operationId: getPriceBook
      parameters:
      - name: priceBookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: Price book not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PriceBookDto"
        "200":
          description: Price book returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceBookDto"
    put:
      tags:
      - Price Book API
      summary: Update price book
      operationId: updatePriceBook
      parameters:
      - name: priceBookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceBookCreateRequestDto"
        required: true
      responses:
        "404":
          description: Price book not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PriceBookDto"
        "200":
          description: Price book updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceBookDto"
  /v1/products/price-books/{priceBookId}/rules/{ruleId}:
    put:
      tags:
      - Price Book API
      summary: Update price book rule
      operationId: updateRule
      parameters:
      - name: priceBookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: ruleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceBookRuleCreateRequestDto"
        required: true
      responses:
        "200":
          description: Price book rule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceBookRuleDto"
        "409":
          description: Rule conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PriceBookRuleDto"
    delete:
      tags:
      - Price Book API
      summary: Deactivate price book rule
      operationId: deactivateRule
      parameters:
      - name: priceBookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: ruleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Rule deactivated
  /v1/products/items/{itemId}/standard-cost:
    put:
      tags:
      - Item Cost API
      summary: Update standard item cost
      operationId: updateStandardCost
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStandardCostRequestDto"
        required: true
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemCostsDto"
        "400":
          description: Invalid payload
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ItemCostsDto"
  /v1/catalogs/{catalogId}:
    get:
      tags:
      - Catalog API
      summary: Get a catalog by ID
      description: Retrieves a specific catalog by its unique ID.
      operationId: getCatalogById
      parameters:
      - name: catalogId
        in: path
        description: ID of the catalog to be obtained
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Successfully retrieved catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogDto"
        "404":
          description: Catalog not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CatalogDto"
    put:
      tags:
      - Catalog API
      summary: Update an existing catalog
      description: Updates an existing catalog.
      operationId: updateCatalog
      parameters:
      - name: catalogId
        in: path
        description: ID of the catalog to update
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Updated catalog object
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogDto"
        required: true
      responses:
        "200":
          description: Catalog updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogDto"
        "400":
          description: Invalid request body
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CatalogDto"
        "404":
          description: Catalog not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CatalogDto"
    delete:
      tags:
      - Catalog API
      summary: Delete a catalog
      description: Deletes a catalog by its ID.
      operationId: deleteCatalog
      parameters:
      - name: catalogId
        in: path
        description: ID of the catalog to delete
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Catalog deleted successfully
        "404":
          description: Catalog not found
  /v1/catalog-items/{type}/{catalogId}:
    put:
      tags:
      - Catalog Items API
      summary: Update an existing catalog item
      description: "Updates an existing product, service, or non-inventory product\
        \ in the catalog."
      operationId: updateCatalogItem
      parameters:
      - name: type
        in: path
        description: "Type of catalog item (product, service, noninventory)"
        required: true
        schema:
          type: string
      - name: catalogId
        in: path
        description: ID of the catalog item to update
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogItemRequestDto"
        required: true
      responses:
        "200":
          description: Catalog item updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogItemResponseDto"
        "400":
          description: Invalid item type or request body
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CatalogItemResponseDto"
        "404":
          description: Catalog item not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CatalogItemResponseDto"
    delete:
      tags:
      - Catalog Items API
      summary: Delete a catalog item
      description: "Deletes a product, service, or non-inventory product from the\
        \ catalog by its ID."
      operationId: deleteCatalogItem
      parameters:
      - name: type
        in: path
        description: "Type of catalog item (product, service, noninventory)"
        required: true
        schema:
          type: string
      - name: catalogId
        in: path
        description: ID of the catalog item to delete
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Catalog item deleted successfully
        "400":
          description: Invalid item type
        "404":
          description: Catalog item not found
  /v1/products:
    post:
      tags:
      - Products API
      summary: Create product master record
      description: Creates a product master record with immutable SKU and uniqueness
        checks.
      operationId: createProduct
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateRequestDto"
        required: true
      responses:
        "400":
          description: Validation error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDto"
        "409":
          description: Business conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDto"
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDto"
  /v1/products/{productId}/replacements:
    get:
      tags:
      - Products API
      summary: List replacement products
      description: Returns replacement options for a product.
      operationId: getReplacements
      parameters:
      - name: productId
        in: path
        description: ID of the product
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Replacements listed
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReplacementOption"
    post:
      tags:
      - Products API
      summary: Add replacement product
      description: Adds a replacement suggestion to a discontinued product.
      operationId: addReplacementProduct
      parameters:
      - name: productId
        in: path
        description: ID of discontinued product
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductReplacementRequest"
        required: true
      responses:
        "201":
          description: Replacement added successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReplacementOption"
        "400":
          description: Validation error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReplacementOption"
        "404":
          description: Product not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReplacementOption"
  /v1/products/{productId}/msrp:
    get:
      tags:
      - Product MSRP API
      summary: List MSRP history
      description: Returns all MSRP records for a product.
      operationId: listMsrp
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: MSRP records returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductMsrpDto"
    post:
      tags:
      - Product MSRP API
      summary: Create MSRP
      description: Creates a product MSRP record with effective date constraints.
      operationId: createMsrp
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMsrpRequestDto"
        required: true
      responses:
        "409":
          description: Temporal overlap conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductMsrpDto"
        "400":
          description: Invalid payload
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductMsrpDto"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductMsrpDto"
        "201":
          description: MSRP created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductMsrpDto"
  /v1/products/uom-conversions:
    get:
      tags:
      - UOM Conversion API
      summary: List active conversions
      operationId: list
      responses:
        "200":
          description: Conversions listed
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UomConversionDto"
    post:
      tags:
      - UOM Conversion API
      summary: Create UOM conversion
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UomConversionCreateRequestDto"
        required: true
      responses:
        "201":
          description: Conversion created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UomConversionDto"
  /v1/products/supplier-costs:
    post:
      tags:
      - Supplier Item Cost API
      summary: Create supplier cost structure
      operationId: createCostStructure
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierItemCostCreateRequestDto"
        required: true
      responses:
        "400":
          description: Invalid payload
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SupplierItemCostDto"
        "409":
          description: Duplicate supplier and item combination
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SupplierItemCostDto"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierItemCostDto"
  /v1/products/pricing/location-overrides:
    post:
      tags:
      - Products API
      summary: Create location price override
      description: Creates a location-specific price override and enforces guardrails
        for margin and discount limits.
      operationId: createLocationPriceOverride
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationPriceOverrideCreateRequestDto"
        required: true
      responses:
        "201":
          description: Override created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationPriceOverrideResponseDto"
        "400":
          description: Guardrail validation failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LocationPriceOverrideResponseDto"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LocationPriceOverrideResponseDto"
  /v1/products/pricing/location-overrides/{overrideId}/reject:
    post:
      tags:
      - Products API
      summary: Reject pending location price override
      description: "Rejects a pending override, persists rejection metadata, and marks\
        \ the request as terminal."
      operationId: rejectLocationPriceOverride
      parameters:
      - name: overrideId
        in: path
        description: Override ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationPriceOverrideDecisionRequestDto"
        required: true
      responses:
        "200":
          description: Override rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationPriceOverrideResponseDto"
        "404":
          description: Override or approval request not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LocationPriceOverrideResponseDto"
        "400":
          description: Invalid rejection request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LocationPriceOverrideResponseDto"
        "409":
          description: Version conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LocationPriceOverrideResponseDto"
  /v1/products/pricing/location-overrides/{overrideId}/approve:
    post:
      tags:
      - Products API
      summary: Approve pending location price override
      description: Approves a pending override and activates it as the effective location
        price.
      operationId: approveLocationPriceOverride
      parameters:
      - name: overrideId
        in: path
        description: Override ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationPriceOverrideDecisionRequestDto"
        required: true
      responses:
        "404":
          description: Override or approval request not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LocationPriceOverrideResponseDto"
        "200":
          description: Override approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationPriceOverrideResponseDto"
        "409":
          description: Version conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LocationPriceOverrideResponseDto"
        "400":
          description: Invalid approval request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LocationPriceOverrideResponseDto"
  /v1/products/pricing/guardrail-policies:
    post:
      tags:
      - Products API
      summary: Upsert location guardrail policy
      description: Creates or updates the active LOCATION guardrail policy used by
        price overrides.
      operationId: upsertLocationGuardrailPolicy
