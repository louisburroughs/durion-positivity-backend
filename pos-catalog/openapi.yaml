  /v1/products/{productId}:
    get:
      description: 'Returns the full product record including identity codes, manufacturer data, category, dimensions, tracking level and lifecycle state.

        Use this tool when the productId is already known; use searchCatalogProducts instead to find products by text or filters.

        Preconditions: the product must exist.

        Required inputs: productId (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 404 when no product exists for the supplied id.

        '
      operationId: getProductById
      parameters:
      - description: ID of the product to be obtained
        in: path
        name: productId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
          description: Successfully retrieved product
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
          description: Product not found
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - catalog:product:view
      summary: Get a Product by ID
      tags:
      - Products API
      x-required-permissions:
      - catalog:product:view
    put:
      description: 'Replaces the mutable master-data fields of a product — name, description, unit of measure, manufacturer, category, subcategory, UPC and attributes — while the SKU stays immutable.

        Use this tool to correct product master data; do not use updateProductLifecycle, which changes selling state, and do not use updateProductTrackingLevel, which changes stock tracking.

        Preconditions: the product must exist, and a sku field in the body must either be omitted or match the stored SKU exactly.

        Required inputs: productId (UUID) path parameter plus non-blank name, description, unitOfMeasure and mpn; omitted optional fields such as upc, categoryId and subcategoryId are cleared, not preserved.

        Emits a CATALOG_PRODUCT_UPDATED event, publishes a product fact carrying the category and subcategory for downstream replicas, and invalidates the product-detail cache.

        Returns 404 when the product does not exist, 400 when the body tries to change the SKU or names a categoryId or subcategoryId that does not resolve, and 409 when the manufacturerId plus mpn pair collides with another product.

        '
      operationId: updateProduct
      parameters:
      - description: ID of the product to update
        in: path
        name: productId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Correct description and category:
                description: Correct description and category
                value:
                  categoryId: 01960030-0000-7000-8000-000000000004
                  description: All-terrain LT tire, 265/70R17, load range E
                  mpn: AT3-26570R17
                  name: All-Terrain Tire 265/70R17
                  subcategoryId: 01960031-0000-7000-8000-00000000000e
                  unitOfMeasure: EA
                  upc: 036121960222
            schema:
              $ref: '#/components/schemas/ProductUpdateRequestDto'
        description: Replacement master-data fields; sku may be omitted or must equal the stored value, and omitted optional fields are cleared.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
          description: Product updated
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
          description: Validation error
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
          description: Product not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
          description: Business conflict
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - catalog:product:edit
      summary: Update Product Master Record
      tags:
      - Products API
      x-required-permissions:
      - catalog:product:edit
  /v1/products/{productId}/detail:
    get:
      description: 'Returns a consolidated product view for one location: catalog data, location-specific pricing, availability and lead time, with a confidence indicator describing how complete the data is.

        Use this tool for a sales-facing view of one product at one store; use getProductById instead for raw master data, and getEffectiveLocationPrice for the override-derived price alone.

