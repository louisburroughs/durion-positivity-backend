            application/json:
              schema:
                $ref: '#/components/schemas/ItemCostsDto'
          description: Invalid payload
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - ROLE_MANAGER
        - catalog:item_cost:update
      summary: Update Standard Item Cost
      tags:
      - Item Cost API
      x-required-permissions:
      - catalog:item_cost:update
  /v1/products/name/{name}:
    get:
      description: 'Returns every product whose name equals the supplied value exactly; this is a whole-name match, not a substring search.

