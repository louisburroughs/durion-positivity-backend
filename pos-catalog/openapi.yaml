  /v1/catalogs:
    post:
      description: 'Creates a named catalog that groups existing products, services and non-inventory products for presentation; the catalog does not own the items, it only references them.

        Use this tool to define a new grouping; do not use updateCatalog, which replaces a catalog that already exists, and do not use createCatalogItem, which creates the underlying items themselves.

        Preconditions: any ids listed in productIds, serviceIds or nonInventoryProductIds should already exist; ids that do not resolve are silently dropped from the stored catalog rather than rejected.

        Required inputs: name; description and the three id lists are optional and default to empty.

        Emits a CATALOG_CATALOG_CREATE event; no product, service or non-inventory records are modified.

        Returns 201 with the stored catalog, whose id lists reflect only the references that resolved, so callers should compare them against what was sent.

        '
      operationId: createCatalog
      requestBody:
        content:
          application/json:
            examples:
              Catalog with two products:
                description: Catalog with two products
                value:
                  description: Seasonal winter tire lineup
                  name: Winter Tires
                  nonInventoryProductIds: []
                  productIds:
                  - 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  - 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
                  serviceIds: []
            schema:
              $ref: '#/components/schemas/CatalogDto'
        description: 'Catalog to create: a name plus optional lists of existing product, service and non-inventory product ids to group.'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDto'
          description: Catalog created successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDto'
          description: Invalid request body
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - catalog:catalog_grouping:edit
      summary: Create a New Catalog
      tags:
      - Catalog API
      x-required-permissions:
      - catalog:catalog_grouping:edit
  /v1/catalogs/name/{name}:
    get:
      description: 'Returns every catalog whose name contains the supplied fragment, matched case-insensitively.

        Use this tool to discover a catalogId by name; use getCatalogById instead when the id is already known.

        Preconditions: none; an empty result simply means no catalog name contains the fragment.

        Required inputs: name (path parameter) as a case-insensitive substring; there is no paging and no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 with an empty array when nothing matches, so an empty result is not an error condition.

        '
      operationId: listCatalogsByName
      parameters:
      - description: Name of the catalogs to be obtained
        in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDto'
          description: Successfully retrieved catalogs
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - catalog:catalog_grouping:view
      summary: List Catalogs by Name
      tags:
      - Catalog API
      x-required-permissions:
      - catalog:catalog_grouping:view
  /v1/catalogs/{catalogId}:
    delete:
      description: 'Permanently deletes a catalog grouping; the products, services and non-inventory products it referenced are untouched and remain available.

        Use this tool to retire a grouping that is no longer needed; do not use deleteCatalogItem, which deletes the underlying items themselves.

        Preconditions: the catalog must exist; there is no soft delete or archive state, so the row is removed outright.

        Required inputs: catalogId (UUID) as a path parameter; there is no request body.

        Emits a CATALOG_CATALOG_DELETE event; member items are not cascaded.

        Returns 204 when the catalog is removed, and 404 when no catalog exists for the supplied id.

        '
      operationId: deleteCatalog
      parameters:
      - description: ID of the catalog to delete
        in: path
        name: catalogId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: Catalog deleted successfully
        '404':
          description: Catalog not found
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - catalog:catalog_grouping:delete
      summary: Delete a Catalog
      tags:
      - Catalog API
      x-required-permissions:
      - catalog:catalog_grouping:delete
    get:
      description: 'Returns one named catalog with the ids of the products, services and non-inventory products it groups.

        Use this tool when the catalogId is already known; use listCatalogsByName instead to find catalogs by a name fragment.

        Preconditions: the catalog must exist.

        Required inputs: catalogId (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 404 when no catalog exists for the supplied id.

        '
      operationId: getCatalogById
      parameters:
      - description: ID of the catalog to be obtained
        in: path
        name: catalogId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDto'
          description: Successfully retrieved catalog
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDto'
          description: Catalog not found
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - catalog:catalog_grouping:view
      summary: Get a Catalog by ID
      tags:
      - Catalog API
      x-required-permissions:
      - catalog:catalog_grouping:view
    put:
      description: 'Replaces a catalog''s name, description and full membership lists with the supplied values; this is a full replacement, not a merge, so omitted item ids are removed from the catalog.

        Use this tool to rename a catalog or change which items it groups; do not use createCatalog, which adds a new catalog, and do not use updateCatalogItem, which edits the items themselves.

        Preconditions: the catalog must exist; ids in the three membership lists that do not resolve are silently dropped rather than rejected.

        Required inputs: catalogId (UUID) path parameter and the complete replacement body including name; an omitted id list clears that membership.

        Emits a CATALOG_CATALOG_UPDATE event; the referenced items themselves are not modified.

        Returns 404 when no catalog exists for the supplied id.

        '
      operationId: updateCatalog
      parameters:
      - description: ID of the catalog to update
        in: path
        name: catalogId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Rename and reduce membership:
                description: Rename and reduce membership
                value:
                  description: Renamed lineup
                  name: All-Season Tires
                  nonInventoryProductIds: []
                  productIds:
                  - 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  serviceIds: []
            schema:
              $ref: '#/components/schemas/CatalogDto'
        description: Complete replacement state for the catalog; membership lists overwrite the existing ones rather than merging.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDto'
          description: Catalog updated successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDto'
          description: Invalid request body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDto'
          description: Catalog not found
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - catalog:catalog_grouping:edit
      summary: Update an Existing Catalog
      tags:
      - Catalog API
      x-required-permissions:
      - catalog:catalog_grouping:edit
  /v1/products:
    post:
      description: 'Creates a product master record with an immutable SKU, status ACTIVE, and uniqueness enforced on SKU and on the manufacturerId plus mpn pair.

        Use this tool for governed product-master entry; do not use createCatalogItem, which is the lightweight catalog-item path with no duplicate checks, and do not use bulkIngestCatalogProducts, which loads many products in one call.

        Preconditions: no product may already use the SKU (case-insensitive), and when manufacturerId is supplied no product may already pair it with the same mpn; a supplied categoryId or subcategoryId must resolve.

        Required inputs: name, description, unitOfMeasure, sku and mpn, all non-blank; manufacturerId, categoryId, subcategoryId, upc and attributes are optional, and a upc also becomes the productCode with type UPC.

        Emits a CATALOG_PRODUCT_CREATED event, publishes a product fact carrying the category and subcategory for downstream replicas, and invalidates the product-detail cache.

        Returns 409 when the SKU or the manufacturerId plus mpn pair already exists, and 400 when the supplied categoryId or subcategoryId does not resolve.

        '
      operationId: createProduct
      requestBody:
        content:
          application/json:
            examples:
              New tire product:
                description: New tire product
                value:
                  categoryId: 01960030-0000-7000-8000-000000000004
                  description: All-terrain light truck tire, 265/70R17
                  manufacturerId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  mpn: AT3-26570R17
                  name: All-Terrain Tire 265/70R17
                  sku: TIRE-AT-2657017
                  subcategoryId: 01960031-0000-7000-8000-00000000000e
                  unitOfMeasure: EA
                  upc: 036121960222
            schema:
              $ref: '#/components/schemas/ProductCreateRequestDto'
        description: Product master data to register; sku becomes immutable after creation and upc, when supplied, also becomes the productCode.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
          description: Product created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
          description: Validation error
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
          description: Business conflict
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - catalog:product:create
      summary: Create Product Master Record
      tags:
      - Products API
      x-required-permissions:
      - catalog:product:create
  /v1/products/by-code:
    get:
      description: 'Resolves the single product carrying an exact product code under one code scheme, EAN or UPC, which is the deterministic matching step supplier price-catalog ingestion runs before it applies a vendor line to a product.

        Use this tool when a code from a vendor document or a scanner must be turned into a product id; use searchCatalogProducts instead for partial text or filters, and getProductById when the id is already known.

        Preconditions: EAN and UPC values are unique per scheme, so a match is either absent or unique; surrounding whitespace is trimmed but no other normalisation is applied, so a code differing by a leading zero is a different code and will not match.

        Required inputs: codeType (EAN or UPC) and code, both query parameters; there is no request body and no fuzzy fallback — an unmatched code is reported as a miss, never as a near match.

        Emits a CATALOG_PRODUCT_CODE_LOOKUP event; no state changes.

        Returns 404 when no product carries the code, 400 when codeType is not EAN or UPC, and 409 on a schema whose duplicate codes have not yet been cleaned up, in which case the value is ambiguous and matching is refused rather than guessed.

        '
      operationId: findProductByCode
      parameters:
      - description: Code scheme to match within; EAN and UPC are matched independently
        in: query
        name: codeType
        required: true
        schema:
          description: Product-code scheme that supports deterministic exact-match lookup.
          enum:
          - UPC
          - EAN
          type: string
      - description: Exact code value; trimmed, otherwise matched verbatim
        example: 0123456789012
        in: query
        name: code
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCodeMatch'
          description: The single product carrying the supplied code
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: codeType is not a supported code scheme.
        '404':
          description: No product carries the supplied code. The response has NO body — a miss is an expected outcome of a lookup, not an error to parse.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: The code is carried by more than one product; matching is refused rather than guessed.
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - catalog:product:view
      summary: Find a Product by Exact EAN or UPC
      tags:
      - Products API
      x-required-permissions:
      - catalog:product:view
  /v1/products/facts/replay:
    post:
      description: 'Re-publishes catalog.product.updated facts for one bounded page of products so that event-fed replicas in other modules can be seeded or repaired, returning what it emitted and a cursor for the next page.

        Use this tool to fill a consumer''s replica after a first deployment or a consumer outage longer than broker retention; do not use it to fix one product, which republishes itself on its next ordinary update.

        Preconditions: Kafka publication must be enabled — a replay with it off is refused rather than reported as a successful no-op; replayed facts are indistinguishable from live ones, so consumers apply them through their normal path and their stale guard prevents an older fact regressing newer state.

        Required inputs: none; afterProductId resumes a previous page, updatedSince restricts to products changed at or after an instant, and limit bounds the page at 1000.

        Emits a CATALOG_PRODUCT_FACT_REPLAY event and queues one product fact per product in the page; no catalog state changes.

        Returns 200 with complete=true and a null cursor once the catalog end is reached, 400 when limit is out of range or a parameter is malformed, and 409 when fact publication is disabled.

        '
      operationId: replayProductFacts
      parameters:
      - description: Resume cursor from a previous call; omit to start at the beginning.
        in: query
        name: afterProductId
        required: false
        schema:
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
          format: uuid
          type: string
      - description: Restrict to products changed at or after this instant; omit to replay all.
        in: query
        name: updatedSince
        required: false
        schema:
          example: 2026-08-01 00:00:00+00:00
          format: date-time
          type: string
      - description: Maximum facts to emit in this call (1–1000).
        in: query
        name: limit
        required: false
        schema:
          default: 500
          example: 500
          maximum: 1000
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductFactReplayResultDto'
          description: What this page emitted and where to resume.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: A parameter is malformed or the limit is out of range.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Fact publication is disabled, so a replay would emit nothing.
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - catalog:fact:replay
      summary: Re-emit Product Facts for Replica Consumers
      tags:
      - Products API
      x-required-permissions:
      - catalog:fact:replay
  /v1/products/items/{itemId}/costs:
    get:
      description: 'Returns the item''s current standard, average and last known costs in one record.

        Use this tool to read cost values; do not use updateStandardItemCost, which changes the standard cost, and use getItemCostAuditHistory for who changed what and when.

        Preconditions: none; an item with no cost record yet returns the itemId with all three cost fields null rather than an error.

