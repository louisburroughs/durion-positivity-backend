components:
  schemas:
    ProductUpdateRequestDto:
      type: object
      description: Update product request
      properties:
        name:
          type: string
        description:
          type: string
        unitOfMeasure:
          type: string
        manufacturerId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        sku:
          type: string
        mpn:
          type: string
        upc:
          type: string
        attributes:
          type: string
          description: JSON object represented as string
      required:
      - description
      - mpn
      - name
      - unitOfMeasure
    CategoryDto:
      type: object
      description: Product category
      properties:
        id:
          type: string
          format: uuid
          description: Category identifier
          example: 0196cf6f-c8dd-7ee0-93e7-f48a5698a535
        name:
          type: string
          description: Category name
          example: Tools
    DimensionDto:
      type: object
      description: Product dimension detail
      properties:
        id:
          type: string
          format: uuid
          description: Dimension identifier
          example: 0196cf6f-c8dd-7ee0-93e7-f48a5698a535
        dimensionType:
          type: string
          description: Dimension type
          enum:
          - LENGTH
          - WIDTH
          - HEIGHT
          - WEIGHT
          - VOLUME
          - AREA
          - DIAMETER
          - CIRCUMFERENCE
          - RADIUS
          - TEMPERATURE
          - TIME
          - SPEED
          - PRESSURE
          - FORCE
          - ENERGY
          - POWER
          - FREQUENCY
          - ANGLE
          - DATA_SIZE
          - CURRENT
          - VOLTAGE
          - RESISTANCE
        description:
          type: string
          description: Dimension description
          example: Length
        unitOfMeasure:
          type: string
          description: Unit of measure
          example: in
        dimensionValue:
          type: number
          format: double
          description: Dimension value
          example: 12.5
    ProductDto:
      type: object
      description: Catalog product
      properties:
        id:
          type: string
          format: uuid
          description: Product identifier
          example: 0196cf6f-c8dd-7ee0-93e7-f48a5698a535
        name:
          type: string
          description: Product name
          example: Heavy Duty Wrench
        shortDescription:
          type: string
          description: Short product description
        longDescription:
          type: string
          description: Long product description
        description:
          type: string
          description: Product description
        images:
          type: array
          description: Product image URLs
          items:
            type: string
        manufacturerPartNumber:
          type: string
          description: Manufacturer part number
        manufacturerId:
          type: string
          format: uuid
          description: Manufacturer identifier
        manufacturerName:
          type: string
          description: Manufacturer name
        manufacturerWarranty:
          type: string
          description: Manufacturer warranty
        manufacturerBrand:
          type: string
          description: Manufacturer brand
        countryOfOrigin:
          type: string
          description: Country of origin
        sku:
          type: string
          description: SKU
        mpn:
          type: string
          description: Manufacturer part number
        upc:
          type: string
          description: UPC
        attributes:
          type: string
          description: Attributes JSON
        unitOfMeasure:
          type: string
          description: Unit of measure
        status:
          type: string
          description: Operational status
          enum:
          - ACTIVE
          - INACTIVE
        productCode:
          type: string
          description: Product code
        productCodeType:
          type: string
          description: Product code type
          enum:
          - UPC
          - EAN
        category:
          $ref: "#/components/schemas/CategoryDto"
          description: Category detail
        subcategory:
          $ref: "#/components/schemas/SubcategoryDto"
          description: Subcategory detail
        type:
          type: string
          description: Product type
        dimensions:
          type: array
          description: Product dimensions
          items:
            $ref: "#/components/schemas/DimensionDto"
        material:
          type: string
          description: Material
        color:
          type: string
          description: Color
        warranty:
          type: string
          description: Warranty
        specifications:
          type: string
          description: Detailed specifications JSON
        lifecycleState:
          type: string
          description: Lifecycle state
          enum:
          - ACTIVE
          - INACTIVE
          - DISCONTINUED
        lifecycleStateEffectiveAt:
          type: string
          format: date-time
          description: Lifecycle state effective instant
        lastStateChangedBy:
          type: string
          format: uuid
          description: User that last changed lifecycle state
        lastStateChangedAt:
          type: string
          format: date-time
          description: Last lifecycle state change instant
        lifecycleOverrideReason:
          type: string
          description: Lifecycle override reason
        createdAt:
          type: string
          format: date-time
          description: Created timestamp
        updatedAt:
          type: string
          format: date-time
          description: Updated timestamp
    SubcategoryDto:
      type: object
      description: Product subcategory
      properties:
        id:
          type: string
          format: uuid
          description: Subcategory identifier
          example: 0196cf6f-c8dd-7ee0-93e7-f48a5698a535
        name:
          type: string
          description: Subcategory name
          example: Hand Tools
    UpdateMsrpRequestDto:
      type: object
      properties:
        amount:
          type: number
        currency:
          type: string
        effectiveStartDate:
          type: string
          format: date
        effectiveEndDate:
          type: string
          format: date
        createdByUserId:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
      required:
      - amount
      - createdByUserId
      - currency
      - effectiveStartDate
    ProductMsrpDto:
      type: object
      properties:
        msrpId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        amount:
          type: string
        currency:
          type: string
        effectiveStartDate:
          type: string
          format: date
        effectiveEndDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
    ProductLifecycleUpdateRequest:
      type: object
      description: Product lifecycle update request
      properties:
        lifecycleState:
          type: string
          description: Target lifecycle state
          enum:
          - ACTIVE
          - INACTIVE
          - DISCONTINUED
        effectiveAt:
          type: string
          format: date-time
          description: Effective instant for lifecycle change
        effectiveDate:
          type: string
          format: date
          description: Effective date for lifecycle change (date-only)
        changedBy:
          type: string
          description: Username performing the lifecycle change
          example: jane.doe
        overrideReason:
          type: string
          description: Reason for lifecycle override
    ProductLifecycleResponse:
      type: object
      description: Product lifecycle details and replacement options
      properties:
        productId:
          type: string
          format: uuid
          description: Product identifier
          example: 0196cf6f-c8dd-7ee0-93e7-f48a5698a535
        lifecycleState:
          type: string
          description: Current lifecycle state
          enum:
          - ACTIVE
          - INACTIVE
          - DISCONTINUED
        lifecycleStateEffectiveAt:
          type: string
          format: date-time
          description: Lifecycle state effective instant
        lastStateChangedBy:
          type: string
          format: uuid
          description: User that last changed lifecycle state
          example: 8b8df63e-18d8-4bde-a8f4-88bc36bc57d7
        lastStateChangedAt:
          type: string
          format: date-time
          description: Last lifecycle state change instant
        lifecycleOverrideReason:
          type: string
          description: Lifecycle override reason
        replacementOptions:
          type: array
          description: Replacement options for this product lifecycle state
          items:
            $ref: "#/components/schemas/ReplacementOption"
    ReplacementOption:
      type: object
      description: Replacement option details
      properties:
        replacementId:
          type: string
          format: uuid
          description: Replacement option identifier
          example: 0196cf6f-c8dd-7ee0-93e7-f48a5698a535
        replacementProductId:
          type: string
          format: uuid
          description: Replacement product identifier
          example: 2c018664-dfea-46ef-a838-6b9dbf8f9b1d
        priorityOrder:
          type: integer
          format: int32
          description: Display priority order
          example: 1
        notes:
          type: string
          description: Replacement notes
        effectiveAt:
          type: string
          format: date-time
          description: Replacement option effective instant
    UomConversionUpdateRequestDto:
      type: object
      properties:
        conversionFactor:
          type: number
      required:
      - conversionFactor
    UomConversionDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fromUomCode:
          type: string
        toUomCode:
          type: string
        conversionFactor:
          type: number
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
    CostTierDto:
      type: object
      description: Supplier item cost tier
      properties:
        minQuantity:
          type: integer
          format: int32
          description: Inclusive minimum quantity
          example: 1
          minimum: 1
        maxQuantity:
          type: integer
          format: int32
          description: Inclusive maximum quantity; null means and above
          example: 10
        unitCost:
          type: number
          description: Per-unit cost for this quantity range
          example: 5.0
      required:
      - minQuantity
      - unitCost
    SupplierItemCostUpdateRequestDto:
      type: object
      description: Request payload for updating supplier-item cost tiers
      properties:
        supplierId:
          type: string
          format: uuid
          description: Supplier identifier
        itemId:
          type: string
          format: uuid
          description: Inventory item identifier
        currencyCode:
          type: string
          description: ISO 4217 currency code
          example: USD
        baseCost:
          type: number
          description: Optional fallback base cost when no tiers apply
          example: 6.25
        tiers:
          type: array
          description: Ordered quantity-based cost tiers
          items:
            $ref: "#/components/schemas/CostTierDto"
      required:
      - currencyCode
      - itemId
      - supplierId
    SupplierItemCostDto:
      type: object
      description: Supplier-item cost structure with optional quantity-based tiers
      properties:
        id:
          type: string
          format: uuid
          description: Supplier-item cost identifier
        supplierId:
          type: string
          format: uuid
          description: Supplier identifier
        itemId:
          type: string
          format: uuid
          description: Inventory item identifier
        currencyCode:
          type: string
          description: ISO 4217 currency code
          example: USD
        baseCost:
          type: number
          description: Optional fallback base cost
        createdAt:
          type: string
          format: date-time
          description: Entity created timestamp
        updatedAt:
          type: string
          format: date-time
          description: Entity updated timestamp
        tiers:
          type: array
          description: Ordered quantity-based cost tiers
