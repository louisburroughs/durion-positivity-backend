        - ROLE_CATALOG_VIEW
  /v1/products/name/{name}:
    get:
      tags:
      - Products API
      summary: List Products by Exact Name
      description: 'Returns every product whose name equals the supplied value exactly; this is a whole-name match, not a substring search.

        Use this tool only when the exact product name is known; use searchCatalogProducts instead for partial text, brand, category or SKU matching.

        Preconditions: none; an empty result simply means no product carries that exact name.

        Required inputs: name as a path parameter; there is no paging and no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 with an empty array when nothing matches, so an empty result is not an error condition.

        '
      operationId: listProductsByName
      parameters:
      - name: name
        in: path
        description: Name of the products to be obtained
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - ROLE_CATALOG_VIEW
  /v1/products/items/{itemId}/costs:
    get:
      tags:
      - Item Cost API
      summary: Get Current Item Costs
      description: 'Returns the item''s current standard, average and last known costs in one record.

        Use this tool to read cost values; do not use updateStandardItemCost, which changes the standard cost, and use getItemCostAuditHistory for who changed what and when.

        Preconditions: none; an item with no cost record yet returns the itemId with all three cost fields null rather than an error.

        Required inputs: itemId (UUID) as a path parameter; there is no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 in all cases, so callers must treat null cost fields as absence of cost data rather than relying on a 404.

        '
      operationId: getItemCosts
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCostsDto'
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - ROLE_MANAGER
        - ROLE_CATALOG_VIEW
  /v1/products/items/{itemId}/costs/audit:
    get:
      tags:
      - Item Cost API
      summary: Get Item Cost Audit History
      description: 'Returns every recorded cost change for an item, newest first, each entry naming the cost type changed, old and new value, the actor, the change source and any reason code.

        Use this tool to trace how a cost reached its current value; use getItemCosts instead for just the current numbers.

        Preconditions: none; entries exist only after manual standard-cost updates or purchase-order receipt events have touched the item.

        Required inputs: itemId (UUID) as a path parameter; there is no request body and no paging.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 with an empty array when the item has no cost history, so an empty result is not an error condition.

        '
      operationId: getItemCostAuditHistory
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCostAuditDto'
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - ROLE_MANAGER
        - ROLE_CATALOG_VIEW
  /v1/products/by-code:
    get:
      tags:
      - Products API
      summary: Find a Product by Exact EAN or UPC
      description: 'Resolves the single product carrying an exact product code under one code scheme, EAN or UPC, which is the deterministic matching step supplier price-catalog ingestion runs before it applies a vendor line to a product.

        Use this tool when a code from a vendor document or a scanner must be turned into a product id; use searchCatalogProducts instead for partial text or filters, and getProductById when the id is already known.

        Preconditions: EAN and UPC values are unique per scheme, so a match is either absent or unique; surrounding whitespace is trimmed but no other normalisation is applied, so a code differing by a leading zero is a different code and will not match.

        Required inputs: codeType (EAN or UPC) and code, both query parameters; there is no request body and no fuzzy fallback — an unmatched code is reported as a miss, never as a near match.

        Emits a CATALOG_PRODUCT_CODE_LOOKUP event; no state changes.

        Returns 404 when no product carries the code, 400 when codeType is not EAN or UPC, and 409 on a schema whose duplicate codes have not yet been cleaned up, in which case the value is ambiguous and matching is refused rather than guessed.

        '
      operationId: findProductByCode
      parameters:
      - name: codeType
        in: query
        description: Code scheme to match within; EAN and UPC are matched independently
        required: true
        schema:
          type: string
          description: Product-code scheme that supports deterministic exact-match lookup.
          enum:
          - UPC
          - EAN
      - name: code
        in: query
        description: Exact code value; trimmed, otherwise matched verbatim
        required: true
        schema:
          type: string
        example: 0123456789012
      responses:
        '200':
          description: The single product carrying the supplied code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCodeMatch'
        '400':
          description: codeType is not a supported code scheme.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No product carries the supplied code. The response has NO body — a miss is an expected outcome of a lookup, not an error to parse.
        '409':
          description: The code is carried by more than one product; matching is refused rather than guessed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - ROLE_CATALOG_VIEW
  /v1/catalogs/name/{name}:
    get:
      tags:
      - Catalog API
      summary: List Catalogs by Name
      description: 'Returns every catalog whose name contains the supplied fragment, matched case-insensitively.

        Use this tool to discover a catalogId by name; use getCatalogById instead when the id is already known.

        Preconditions: none; an empty result simply means no catalog name contains the fragment.

        Required inputs: name (path parameter) as a case-insensitive substring; there is no paging and no request body.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 with an empty array when nothing matches, so an empty result is not an error condition.

        '
      operationId: listCatalogsByName
      parameters:
      - name: name
        in: path
        description: Name of the catalogs to be obtained
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved catalogs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDto'
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - ROLE_CATALOG_VIEW
  /v1/catalog/supplier-prices/latest:
    get:
      tags:
      - Supplier Prices
      summary: Get the Applicable Vendor Price for a Product
      description: 'Returns the vendor price that applies to a product in one market as at a day: the greatest effective-from date not after that day, with ties broken by the vendor document''s date and then by fetch time so two readers never disagree about today''s cost.

        Use this tool for purchasing and margin context; do not use it as a pricing input — supplier cost participates in no sell-price resolution, and the suggested retail price it carries is vendor reference data that must be labelled with its PRICAT source wherever it is shown.

        Preconditions: a PRICAT import must have applied for that vendor, product and market; a product with no vendor price simply has none, which is not an error.

        Required inputs: productId, countryCode and currency; vendorProfileId narrows to one vendor and asOf evaluates a past day, both optional, with asOf defaulting to today.

        Emits a CATALOG_SUPPLIER_PRICE_LATEST event; no state changes.

        Returns 404 when no entry applies, and 400 when a parameter is malformed. Money fields may be null, meaning the vendor did not state that value — null is never zero.

        '
      operationId: getLatestSupplierPrice
      parameters:
      - name: productId
        in: query
        description: Product to price.
        required: true
        schema:
          type: string
          format: uuid
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
      - name: countryCode
        in: query
        description: Market of interest (ISO 3166-1 alpha-2).
        required: true
        schema:
          type: string
        example: SE
      - name: currency
        in: query
        description: Currency of interest (ISO 4217).
        required: true
        schema:
          type: string
        example: SEK
      - name: vendorProfileId
        in: query
        description: Restrict to one vendor profile; omit to consider every vendor's entries.
        required: false
        schema:
          type: string
          format: uuid
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
      - name: asOf
        in: query
        description: Day to evaluate; defaults to today. A past day answers what applied then.
        required: false
        schema:
          type: string
          format: date
          example: 2026-08-14
      responses:
        '200':
          description: The applicable vendor price entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierPriceEntryDto'
        '400':
          description: A parameter is missing or malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 'No vendor price applies to that product, market and day. The response has NO body: absence is an expected outcome, not an error envelope to parse.'
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - catalog:supplier_cost:read
      x-required-permissions:
      - catalog:supplier_cost:read
  /v1/catalog/supplier-prices/imports/incomplete:
    get:
      tags:
      - Supplier Prices
      summary: List Vendor Price Imports This Module Could Not Complete
      description: 'Returns PRICAT imports whose completion event declared more chunks than this module applied, newest first, each with the counts that disagree.

        Use this tool when vendor prices look stale or partial; do not use it to check a specific product, which is listSupplierPriceHistory.

        Preconditions: none; an empty list is the healthy state and means every import applied whole.

        Required inputs: none.

        Emits a CATALOG_SUPPLIER_PRICE_IMPORT_GAPS event; no state changes. A re-emit was already requested on the supplier command topic when each gap was detected, so an entry here is a feed that did not self-heal rather than one nobody has chased.

        Returns 200 with an empty array when there are no gaps.

        '
      operationId: listIncompleteSupplierPriceImports
      responses:
        '200':
          description: Imports with unapplied chunks, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupplierPriceImportStatusDto'
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - catalog:supplier_cost:read
      x-required-permissions:
      - catalog:supplier_cost:read
  /v1/catalog/supplier-prices/history:
    get:
      tags:
      - Supplier Prices
      summary: List Vendor Price History for a Product
      description: 'Returns every vendor price recorded for a product, newest effective date first, including superseded entries with the vendor document and import each came from.

        Use this tool to answer what a vendor charged over time and where a cost came from; do not use it to find today''s cost, which is getLatestSupplierPrice and applies the effective-dating rules.

        Preconditions: none; a product with no imported vendor prices returns an empty page.

        Required inputs: productId; vendorProfileId narrows to one vendor, and page and size are optional with size defaulting to 50 and capped at 200.

        Emits a CATALOG_SUPPLIER_PRICE_HISTORY event; no state changes.

        Returns 200 with an empty items array when nothing has been imported, so an empty result is not an error condition, and 400 when the page size is out of range.

        '
      operationId: listSupplierPriceHistory
      parameters:
      - name: productId
        in: query
        description: Product whose vendor price history to list.
        required: true
        schema:
          type: string
          format: uuid
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
      - name: vendorProfileId
        in: query
        description: Restrict to one vendor profile; omit for every vendor.
        required: false
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        description: Zero-based page index.
        required: false
        schema:
          type: integer
          example: 0
          minimum: 0
      - name: size
        in: query
        description: Page size, 1–200.
        required: false
        schema:
          type: integer
          default: 50
          example: 50
          maximum: 200
          minimum: 1
      responses:
        '200':
          description: A page of vendor price entries, newest effective date first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          description: A parameter is missing, malformed, or the page size is out of range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - catalog:supplier_cost:read
      x-required-permissions:
      - catalog:supplier_cost:read
  /v1/products/substitution-groups/{groupId}/members/{productId}:
    delete:
      tags:
      - Substitution Group API
      summary: Remove Substitution Group Member
      description: 'Removes a product from a substitution group, ending its interchangeability with the remaining members and freeing it to join another group.

        Use this tool to take one product out; use deleteSubstitutionGroup instead to dissolve the entire group at once.

        Preconditions: the group must exist and the product must currently be a member of that specific group.

        Required inputs: groupId and productId (UUIDs) as path parameters; there is no request body.

        Emits a CATALOG_SUBSTITUTION_GROUP_MEMBER_REMOVE event and re-publishes the product fact for the removed product and every remaining member.

        Returns 200 with the group''s remaining membership, and 404 when the group does not exist or the product is not a member of it.

        '
      operationId: removeSubstitutionGroupMember
      parameters:
      - name: groupId
        in: path
        description: Substitution group ID
        required: true
        schema:
          type: string
          format: uuid
      - name: productId
        in: path
        description: Product ID to remove
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubstitutionGroupDto'
        '404':
          description: Substitution group or membership not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubstitutionGroupDto'
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - ROLE_CATALOG_EDIT
components:
