                $ref: "#/components/schemas/ProductMsrpDto"
  /v1/products/{productId}/detail:
    get:
      tags:
      - Products API
      summary: Get product details with pricing and availability
      description: "Retrieves a consolidated view of product information including\
        \ catalog data, location-specific pricing, and availability. Implements graceful\
        \ degradation and returns partial data when non-critical services are unavailable."
      operationId: getProductDetailView
      parameters:
      - name: productId
        in: path
        description: ID of the product
        required: true
        schema:
          type: string
          format: uuid
      - name: location_id
        in: query
        description: Location/store ID for location-specific data
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "400":
          description: Invalid location ID
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDetailView"
        "404":
          description: Product not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDetailView"
        "500":
          description: Unexpected server error while retrieving product details
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDetailView"
        "200":
          description: Successfully retrieved product details (may be partial if some
            services unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetailView"
  /v1/products/services/{serviceId}:
