          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NonInventoryProductDto'
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - ROLE_CATALOG_VIEW
  /v1/products/noninventory/name/{name}:
    get:
