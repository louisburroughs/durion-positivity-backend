          description: Matching services
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - catalog:service_type:view
      summary: Search Catalog Services
      tags:
      - Products API
      x-required-permissions:
      - catalog:service_type:view
  /v1/products/services/{serviceId}:
