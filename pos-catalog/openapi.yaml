        suggestedRetailPrice:
          type: number
          description: Vendor-suggested retail price; reference only, never an applied sell price.
        grossPrice:
          type: number
          description: Gross (list) purchase price as stated.
          example: 2895.5
        netPrice:
          type: number
          description: Net purchase price as stated.
          example: 2450.25
        taxRate:
          type: number
          description: Tax rate the vendor stated for the line.
          example: 25.0
        recyclingFee:
          type: number
          description: Recycling fee the vendor stated.
          example: 35.0
        effectiveFrom:
          type: string
          format: date
          description: Inclusive first day the values apply; a vendor-local date.
          example: 2026-02-01
        sourceDocumentId:
          type: string
          description: Vendor document the price came from.
          example: PRICAT-4046266_202305120844
        sourceDocumentDate:
          type: string
          format: date
          description: Vendor document date.
          example: 2026-05-12
        importManifestId:
          type: string
          format: uuid
          description: Import that produced this entry.
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5e
        fetchedAt:
          type: string
          format: date-time
          description: When the producer fetched the document.
    SupplierPriceImportStatusDto:
      type: object
      description: Application state of one supplier PRICAT import in this module.
      properties:
        importManifestId:
          type: string
          format: uuid
          description: The producer's import manifest id.
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
        vendorProfileId:
          type: string
          format: uuid
          description: Vendor profile the import belongs to.
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
        supplierRef:
          type: string
          description: Vendor profile alias at import time.
          example: michelin-eu
        status:
          type: string
          description: Application state.
          enum:
          - APPLYING
          - COMPLETE
          - INCOMPLETE
          example: COMPLETE
        chunksApplied:
          type: integer
          format: int32
          description: Chunk events applied so far.
          example: 25
        expectedChunkCount:
          type: integer
          format: int32
          description: Chunk total the producer declared; null until completion.
          example: 25
        linesApplied:
          type: integer
          format: int32
          description: Price rows written from this import.
          example: 12310
        expectedLineCount:
          type: integer
          format: int32
          description: Matched-line total the producer reported; null until completion.
          example: 12310
        completedAt:
          type: string
          format: date-time
          description: When the completion event was applied; null while chunks are in flight.
        updatedAt:
          type: string
          format: date-time
          description: When this row last changed.
    Page:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        content:
          type: array
        number:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/SortObject'
        pageable:
          $ref: '#/components/schemas/PageableObject'
        numberOfElements:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        paged:
          type: boolean
        pageNumber:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/SortObject'
        pageSize:
          type: integer
          format: int32
        unpaged:
          type: boolean
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
