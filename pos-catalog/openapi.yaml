                $ref: "#/components/schemas/EffectiveLocationPriceResponseDto"
        "200":
          description: Effective price returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveLocationPriceResponseDto"
  /v1/products/noninventory/{productId}:
