openapi: 3.1.0
info:
  contact:
    email: louis.burroughs@gmail.com
    name: Durion Support Services
  description: API documentation for the Product service, accessible via the API Gateway.
  title: Positivity Product API
  version: v1
servers:
- description: API Gateway
  url: http://api-gateway.local/v1/catalog
tags:
- description: Groups of mutually interchangeable products; a product belongs to at most one group
  name: Substitution Group API
- description: Unit of measure conversion API
  name: UOM Conversion API
- description: Vehicle-keyed estimated service times (book time) with provenance, per service operation. Hand-authored DURION rows only; imported guide rows are read-only here.
  name: Service Labor Standards
- description: Manage standard, last, and average item costs
  name: Item Cost API
- description: 'Vendor price entries applied from supplier PRICAT imports: latest applicable cost, full cost history, and import application state. Read-only.'
  name: Supplier Prices
- description: Per-product unit-of-measure conversion set (purchase/pack UoMs with factor to base UoM)
  name: Product UoM API
- description: Bulk import catalog products
  name: Catalog Bulk Ingest API
- description: Replay of vendor-specific article-code facts derived from PRICAT imports, for seeding or repairing consumer replicas such as pos-order's purchase-order transmission.
  name: Supplier Article Codes
- description: API for products, lifecycle, and pricing
  name: Products API
- description: Manage MSRP values with effective dates
  name: Product MSRP API
- description: API for managing catalogs
  name: Catalog API
- description: Manage price books, pricing rules, and resolution
  name: Price Book API
- description: API for managing catalog items by type
  name: Catalog Items API
- description: Vendor-supplied MKCAT marketing content — names, copy per language, artwork — attached to catalog products by matching, not by identifier. Read-only.
  name: Tread Design Enrichment
paths:
  /v1/catalog-items/service/{serviceId}/labor-standards:
    get:
      description: 'Returns the service''s labor standards — vehicle-keyed book times with source and revision — active

        rows only by default, oldest first.

        Use this tool to see what estimated times exist for an operation and where each came from; do not

        use it to resolve the one applicable time for a specific vehicle, which is the resolution endpoint''s

        job once it exists (sourcing plan §3.4).

        Preconditions: the service must exist.

        Required inputs: serviceId path parameter; includeSuperseded=true adds replaced rows for audit.

        Emits a CATALOG_LABOR_STANDARD_LIST event; no state changes.

        Returns 404 when the service does not exist.

        '
      operationId: listServiceLaborStandards
      parameters:
      - description: Service whose standards to list.
        in: path
        name: serviceId
        required: true
        schema:
          format: uuid
          type: string
      - description: Include superseded rows for audit history.
        in: query
        name: includeSuperseded
        required: false
        schema:
          default: false
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ServiceLaborStandardResponseDto'
                type: array
          description: The service's labor standards.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Service does not exist
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - catalog:labor_standard:view
      summary: List a Service's Labor Standards
      tags:
      - Service Labor Standards
      x-required-permissions:
      - catalog:labor_standard:view
    post:
      description: 'Creates an active DURION-source labor standard: the estimated (book) time for this service

        operation on the vehicles the key fields describe, in decimal hours in tenths (0.1 hr = 6 min).

        Use this tool for hand-authored times — dealer-created operations or shop-decided standards; do not

        use it to transcribe a licensed labor guide, which enters through the guide import path with its own

        provenance.

        Preconditions: the service must exist, and no active standard may already cover the same vehicle key

        and time type — correct a wrong number by superseding it, not by adding a duplicate.

        Required inputs: serviceId path parameter and a body with laborHours; vehicle-key fields left null

        are wildcards, and timeType defaults to DURION_STANDARD.

        Emits a CATALOG_LABOR_STANDARD_CREATE event.

        Returns 400 for malformed hours (not in tenths, non-positive) or codes, 404 for an unknown service,

        and 409 when an active row already covers the same vehicle key and time type.

        '
      operationId: createServiceLaborStandard
      parameters:
      - description: Service the standard belongs to.
        in: path
        name: serviceId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Front brake pads on a Civic:
                description: Front brake pads on a Civic
                value:
                  laborHours: 1.5
                  make: Honda
                  model: Civic
                  overlapGroup: WHEEL-OFF
                  publishedAt: 2026-09-01
                  timeType: DURION_STANDARD
                  vehicleYear: 2019-2023
            schema:
              $ref: '#/components/schemas/ServiceLaborStandardRequestDto'
        description: 'The standard to author: laborHours (decimal hours in tenths) plus optional vehicle-key fields (null = any vehicle), timeType, overlap metadata and published date.'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceLaborStandardResponseDto'
          description: Labor standard created.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Malformed hours, time type, or operation codes
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Service does not exist
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: An active standard already covers this vehicle key and type
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - catalog:labor_standard:manage
      summary: Author a Labor Standard for a Service
      tags:
      - Service Labor Standards
      x-required-permissions:
      - catalog:labor_standard:manage
  /v1/catalog-items/service/{serviceId}/labor-standards/{standardId}/supersede:
    post:
      description: 'Replaces an active DURION-source standard: the old row is marked superseded and kept for audit, and

        the body becomes the new active row, returned with fresh provenance.

        Use this tool to correct a hand-authored time; do not use it on imported guide rows, which are

        corrected by their source''s next import — the API refuses them.

        Preconditions: the standard must belong to the service, still be active, and carry source DURION.

        Required inputs: serviceId and standardId path parameters, plus a full replacement body — this is a

        replacement, not a patch, so omitted vehicle-key fields become wildcards.

        Emits a CATALOG_LABOR_STANDARD_SUPERSEDE event.

        Returns 400 for a malformed body, 404 when the standard is not this service''s, and 409 when the row

        is already superseded or not DURION-source.

        '
      operationId: supersedeServiceLaborStandard
      parameters:
      - description: Service the standard belongs to.
        in: path
        name: serviceId
        required: true
        schema:
          format: uuid
          type: string
      - description: Standard being replaced.
        in: path
        name: standardId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Corrected hours:
                description: Corrected hours
                value:
                  laborHours: 1.8
                  make: Honda
                  model: Civic
                  overlapGroup: WHEEL-OFF
                  publishedAt: 2026-09-01
                  timeType: DURION_STANDARD
                  vehicleYear: 2019-2023
            schema:
              $ref: '#/components/schemas/ServiceLaborStandardRequestDto'
        description: 'The full replacement row — not a patch: omitted vehicle-key fields become wildcards. Same shape as create.'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceLaborStandardResponseDto'
          description: The replacement row now active.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Malformed hours, time type, or operation codes
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Standard not found for this service
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Row already superseded, or not a DURION-source row
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - catalog:labor_standard:manage
      summary: Supersede a Labor Standard with a Correction
      tags:
      - Service Labor Standards
      x-required-permissions:
      - catalog:labor_standard:manage
  /v1/catalog-items/services/facts/replay:
    post:
      description: 'Re-publishes catalog.service.updated facts for one bounded page of services so that event-fed replicas in other modules can be seeded or repaired, returning what it emitted and a cursor for the next page.

        Use this tool to fill a consumer''s replica after a first deployment or a consumer outage longer than broker retention — pos-marketing resolves a campaign catalogFocusRef of the form service:<name> against such a replica; do not use it to fix one service, which republishes itself on its next ordinary update, and use replayProductFacts for the product half of the same replica.

        Preconditions: Kafka publication must be enabled — a replay with it off is refused rather than reported as a successful no-op; replayed facts are indistinguishable from live ones, so consumers apply them through their normal path and their stale guard prevents an older fact regressing newer state. A deleted service leaves no row to replay, so its tombstone exists only in the live stream.

        Required inputs: none; afterServiceId resumes a previous page, updatedSince restricts to services changed at or after an instant, and limit bounds the page at 1000.

        Emits a CATALOG_SERVICE_FACT_REPLAY event and queues one service fact per service in the page; no catalog state changes.

        Returns 200 with complete=true and a null cursor once the end of the service catalog is reached, 400 when limit is out of range or a parameter is malformed, and 409 when fact publication is disabled.

        '
      operationId: replayServiceFacts
      parameters:
      - description: Resume cursor from a previous call; omit to start at the beginning.
        in: query
        name: afterServiceId
        required: false
        schema:
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
          format: uuid
          type: string
      - description: Restrict to services changed at or after this instant; omit to replay all.
        in: query
        name: updatedSince
        required: false
        schema:
          example: 2026-08-01 00:00:00+00:00
          format: date-time
          type: string
      - description: Maximum facts to emit in this call (1–1000).
        in: query
        name: limit
        required: false
        schema:
          default: 500
          example: 500
          maximum: 1000
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceFactReplayResultDto'
          description: What this page emitted and where to resume.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: A parameter is malformed or the limit is out of range.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Fact publication is disabled, so a replay would emit nothing.
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - catalog:fact:replay
      summary: Re-emit Service Facts for Replica Consumers
      tags:
      - Catalog Items API
      x-required-permissions:
      - catalog:fact:replay
  /v1/catalog-items/{type}:
    post:
      description: 'Creates a catalog item of the given type: a product, a service, or a non-inventory product.

        Use this tool for quick item entry across the three item types; do not use createProduct, which is the richer product-master path that enforces SKU and manufacturer-part uniqueness — this endpoint performs no duplicate checks.

        Preconditions: none; for type noninventory only name, shortDescription and longDescription are persisted; type service also stores operationCode (unique when present), operationCategory and defaultLaborHours (decimal hours in tenths); type product also stores manufacturer, SKU, productCode, material, color, warranty and specifications fields.

        Required inputs: type path parameter, one of product, service or noninventory (case-insensitive), plus a body with at least name.

        Emits a CATALOG_ITEM_CREATE event; no catalog groupings are touched.

        Returns 400 when the type path parameter is not one of the three supported values.

        '
      operationId: createCatalogItem
      parameters:
      - description: Type of catalog item (product, service, noninventory)
        in: path
        name: type
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              New product item:
                description: New product item
                value:
                  color: Black
                  longDescription: All-weather beam wiper blade, 22 inch
                  manufacturerName: ClearView
                  manufacturerPartNumber: PWB-22
                  material: Rubber
                  name: Premium Wiper Blade 22in
                  productCode: 036121960221
                  shortDescription: 22-inch beam wiper blade
                  sku: WIP-22-PREM
            schema:
              $ref: '#/components/schemas/CatalogItemRequestDto'
        description: Item to create; non-inventory products store name, shortDescription and longDescription, services add operationCode, operationCategory and defaultLaborHours, and products store the full field set.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItemResponseDto'
          description: Catalog item created successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItemResponseDto'
          description: Invalid item type or request body
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - ROLE_CATALOG_EDIT
      summary: Add a New Catalog Item
      tags:
      - Catalog Items API
  /v1/catalog-items/{type}/{catalogId}:
    delete:
      description: 'Permanently deletes a product, service or non-inventory product row by id; this is a hard delete with no archive state.

        Use this tool to remove an item outright; use updateProductLifecycle instead when a product should stop selling but keep its history, and use deleteCatalog to remove a grouping rather than its items.

        Preconditions: an item of the given type must exist under the supplied id.

        Required inputs: type (product, service or noninventory, case-insensitive) and catalogId (UUID) as path parameters; there is no request body.

        Emits a CATALOG_ITEM_DELETE event, and for a product or a service queues a catalog fact marking it inactive so event-fed replicas in other modules stop resolving it; catalogs that referenced the item are not rewritten by this call.

        Returns 204 when the item is removed, 404 when no item of that type exists for the supplied id, and 400 when the type is not one of the three supported values.

        Authorization: type=product requires catalog:product:delete; type=service or noninventory requires the ADMIN role (unchanged pending a service_type delete permission).

        '
      operationId: deleteCatalogItem
      parameters:
      - description: Type of catalog item (product, service, noninventory)
        in: path
        name: type
        required: true
        schema:
          type: string
      - description: ID of the catalog item to delete
        in: path
        name: catalogId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: Catalog item deleted successfully
        '400':
          description: Invalid item type
        '404':
          description: Catalog item not found
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - catalog:product:delete
      summary: Delete a Catalog Item
      tags:
      - Catalog Items API
      x-required-permissions:
      - catalog:product:delete
    put:
      description: 'Replaces a catalog item of the given type with the supplied state; fields omitted from the body are overwritten with null, so this is a full replacement, not a patch.

        Use this tool to edit an item created through createCatalogItem; do not use updateProduct, which is the product-master path that protects SKU immutability — this endpoint applies no such guard.

        Preconditions: an item of the given type must exist under the supplied id; the type determines which repository is consulted, so a product id passed with type service resolves to 404.

        Required inputs: type (product, service or noninventory, case-insensitive), catalogId (UUID) and the complete replacement body.

        Emits a CATALOG_ITEM_UPDATE event; no catalog groupings are touched.

        Returns 404 when no item of that type exists for the supplied id, and 400 when the type is not one of the three supported values.

        '
      operationId: updateCatalogItem
      parameters:
      - description: Type of catalog item (product, service, noninventory)
        in: path
        name: type
        required: true
        schema:
          type: string
      - description: ID of the catalog item to update
        in: path
        name: catalogId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Rename a service:
                description: Rename a service
                value:
                  longDescription: Rotate all four tires and balance each wheel
                  name: Tire Rotation and Balance
                  shortDescription: Rotate and balance four tires
            schema:
              $ref: '#/components/schemas/CatalogItemRequestDto'
        description: Complete replacement state for the item; omitted fields are cleared because the update overwrites the whole row.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItemResponseDto'
          description: Catalog item updated successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItemResponseDto'
          description: Invalid item type or request body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItemResponseDto'
          description: Catalog item not found
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - ROLE_CATALOG_EDIT
      summary: Update an Existing Catalog Item
      tags:
      - Catalog Items API
  /v1/catalog/bulk-ingest:
    post:
      description: 'Imports a batch of catalog products in one call, creating each record through the same governed path as createProduct and reporting a per-row success or failure verdict.

        Use this tool to load many products at once; do not use createProduct, which registers a single product and surfaces its errors as HTTP statuses rather than row results.

        Preconditions: each row''s SKU must not already exist (case-insensitive), or that row fails with CATALOG_INGEST_FAILED while the rest of the batch proceeds.

        Required inputs: jobId (UUID), locationId (UUID) and a non-empty records array; per record, unitOfMeasure defaults to EA, description defaults to the name, and mpn falls back to the sku then the name. manufacturerName, manufacturerBrand, countryOfOrigin, and type are carried onto the product (the manufacturer fields also travel on the product fact for replica consumers), while price is accepted but ignored until catalog pricing lands.

        categoryName and subcategoryName are resolved against the seeded catalog reference data, trimmed and matched case-insensitively; omit them to leave the product unclassified. A supplied name that matches no seeded record fails that row with CATALOG_INGEST_FAILED rather than landing the product uncategorized, so a typo cannot silently produce a product that no category-based rule can match.

        Emits a CATALOG_BULK_INGEST event; each successful row also publishes a product fact carrying the resolved category and subcategory, and invalidates the product-detail cache.

        Returns 200 even when rows fail, so callers must inspect successCount, failureCount and the per-row results rather than the HTTP status.

        '
      operationId: bulkIngestCatalogProducts
      requestBody:
        content:
          application/json:
            examples:
              Two-product batch:
                description: Two-product batch
                value:
                  jobId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  locationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
                  records:
                  - mpn: AT3-26570R17
                    name: All-Terrain Tire 265/70R17
                    sku: TIRE-AT-2657017
                    unitOfMeasure: EA
                    upc: 036121960222
                  - name: Premium Wiper Blade 22in
                    sku: WIP-22-PREM
            schema:
              $ref: '#/components/schemas/BulkIngestRequestCatalogBulkIngestRecord'
        description: Batch of product records to create for one ingest job scoped to a location.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkIngestResponse'
          description: Batch processed (check per-record success/failure in response)
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkIngestResponse'
          description: Invalid request payload
      security:
      - bearerAuth:
        - catalog:product:create
      summary: Bulk Import Catalog Products
      tags:
      - Catalog Bulk Ingest API
      x-required-permissions:
      - catalog:product:create
  /v1/catalog/supplier-article-codes/replay:
    post:
      description: 'Re-publishes catalog.supplier-article-code.updated facts for one bounded page of vendor-article-code rows so that event-fed replicas in other modules can be seeded or repaired, returning what it emitted and a cursor for the next page.

        Use this tool to fill a consumer''s replica after a first deployment or a consumer outage longer than broker retention; do not use it to fix one row, which republishes itself on its next PRICAT import.

        Preconditions: Kafka publication must be enabled, or the facts queue in the outbox and reach nobody; replayed facts are indistinguishable from live ones, so consumers apply them through their normal path and their stale guard prevents an older fact regressing newer state.

        Required inputs: none; afterId resumes a previous page, updatedSince restricts to rows changed at or after an instant, and limit bounds the page at 1000.

        Emits a CATALOG_SUPPLIER_ARTICLE_CODE_REPLAY event and queues one fact per row in the page; no catalog state changes.

        Returns 200 with complete=true and a null cursor once the table end is reached, and 400 when limit is out of range or a parameter is malformed.

        '
      operationId: replaySupplierArticleCodeFacts
      parameters:
      - description: Resume cursor from a previous call; omit to start at the beginning.
        in: query
        name: afterId
        required: false
        schema:
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
          format: uuid
          type: string
      - description: Restrict to rows changed at or after this instant; omit to replay all.
        in: query
        name: updatedSince
        required: false
        schema:
          example: 2026-08-01 00:00:00+00:00
          format: date-time
          type: string
      - description: Maximum facts to emit in this call, 1-1000.
        in: query
        name: limit
        required: false
        schema:
          default: 500
          example: 500
          maximum: 1000
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierArticleCodeReplayResultDto'
          description: What this page emitted and where to resume.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: A parameter is malformed or the limit is out of range.
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - catalog:fact:replay
      summary: Re-emit Vendor Article Code Facts for Replica Consumers
      tags:
      - Supplier Article Codes
      x-required-permissions:
      - catalog:fact:replay
  /v1/catalog/supplier-prices/history:
    get:
      description: 'Returns every vendor price recorded for a product, newest effective date first, including superseded entries with the vendor document and import each came from.

        Use this tool to answer what a vendor charged over time and where a cost came from; do not use it to find today''s cost, which is getLatestSupplierPrice and applies the effective-dating rules.

        Preconditions: none; a product with no imported vendor prices returns an empty page.

        Required inputs: productId; vendorProfileId narrows to one vendor, and page and size are optional with size defaulting to 50 and capped at 200.

        Emits a CATALOG_SUPPLIER_PRICE_HISTORY event; no state changes.

        Returns 200 with an empty items array when nothing has been imported, so an empty result is not an error condition, and 400 when the page size is out of range.

        '
      operationId: listSupplierPriceHistory
      parameters:
      - description: Product whose vendor price history to list.
        in: query
        name: productId
        required: true
        schema:
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
          format: uuid
          type: string
      - description: Restrict to one vendor profile; omit for every vendor.
        in: query
        name: vendorProfileId
        required: false
        schema:
          format: uuid
          type: string
      - description: Zero-based page index.
        in: query
        name: page
        required: false
        schema:
          example: 0
          minimum: 0
          type: integer
      - description: Page size, 1–200.
        in: query
        name: size
        required: false
        schema:
          default: 50
          example: 50
          maximum: 200
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
          description: A page of vendor price entries, newest effective date first.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: A parameter is missing, malformed, or the page size is out of range.
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - catalog:supplier_cost:read
      summary: List Vendor Price History for a Product
      tags:
      - Supplier Prices
      x-required-permissions:
      - catalog:supplier_cost:read
  /v1/catalog/supplier-prices/imports/incomplete:
    get:
      description: 'Returns PRICAT imports whose completion event declared more chunks than this module applied, newest first, each with the counts that disagree.

        Use this tool when vendor prices look stale or partial; do not use it to check a specific product, which is listSupplierPriceHistory.

        Preconditions: none; an empty list is the healthy state and means every import applied whole.

        Required inputs: none.

        Emits a CATALOG_SUPPLIER_PRICE_IMPORT_GAPS event; no state changes. A re-emit was already requested on the supplier command topic when each gap was detected, so an entry here is a feed that did not self-heal rather than one nobody has chased.

        Returns 200 with an empty array when there are no gaps.

        '
      operationId: listIncompleteSupplierPriceImports
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SupplierPriceImportStatusDto'
                type: array
          description: Imports with unapplied chunks, newest first.
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - catalog:supplier_cost:read
      summary: List Vendor Price Imports This Module Could Not Complete
      tags:
      - Supplier Prices
      x-required-permissions:
      - catalog:supplier_cost:read
  /v1/catalog/supplier-prices/latest:
    get:
      description: 'Returns the vendor price that applies to a product in one market as at a day: the greatest effective-from date not after that day, with ties broken by the vendor document''s date and then by fetch time so two readers never disagree about today''s cost.

        Use this tool for purchasing and margin context; do not use it as a pricing input — supplier cost participates in no sell-price resolution, and the suggested retail price it carries is vendor reference data that must be labelled with its PRICAT source wherever it is shown.

        Preconditions: a PRICAT import must have applied for that vendor, product and market; a product with no vendor price simply has none, which is not an error.

        Required inputs: productId, countryCode and currency; vendorProfileId narrows to one vendor and asOf evaluates a past day, both optional, with asOf defaulting to today.

        Emits a CATALOG_SUPPLIER_PRICE_LATEST event; no state changes.

        Returns 404 when no entry applies, and 400 when a parameter is malformed. Money fields may be null, meaning the vendor did not state that value — null is never zero.

        '
      operationId: getLatestSupplierPrice
      parameters:
      - description: Product to price.
        in: query
        name: productId
        required: true
        schema:
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
          format: uuid
          type: string
      - description: Market of interest (ISO 3166-1 alpha-2).
        example: SE
        in: query
        name: countryCode
        required: true
        schema:
          type: string
      - description: Currency of interest (ISO 4217).
        example: SEK
        in: query
        name: currency
        required: true
        schema:
          type: string
      - description: Restrict to one vendor profile; omit to consider every vendor's entries.
        in: query
        name: vendorProfileId
        required: false
        schema:
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
          format: uuid
          type: string
      - description: Day to evaluate; defaults to today. A past day answers what applied then.
        in: query
        name: asOf
        required: false
        schema:
          example: 2026-08-14
          format: date
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierPriceEntryDto'
          description: The applicable vendor price entry.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: A parameter is missing or malformed.
        '404':
          description: 'No vendor price applies to that product, market and day. The response has NO body: absence is an expected outcome, not an error envelope to parse.'
      security:
      - bearerAuth:
        - ROLE_ADMIN
        - catalog:supplier_cost:read
      summary: Get the Applicable Vendor Price for a Product
      tags:
      - Supplier Prices
      x-required-permissions:
      - catalog:supplier_cost:read
  /v1/catalog/tread-designs/for-product/{productId}:
    get:
      description: 'Returns the manufacturer marketing content matched to a product — names, copy per language, artwork —

        distinguishable from catalog-owned product data because it lives here rather than on the product itself.

        Use this tool to show manufacturer marketing copy alongside a product; do not use it as a source for

        any structural or identity field, since a supplier fact never changes what a product is.

        Preconditions: the product must exist and must have matched a tread design; fuzzy matching on vendor

        brand and design names means many products, especially newly priced ones, match nothing yet.

        Required inputs: productId path parameter; there is no request body.

        Emits a CATALOG_TREAD_DESIGN_FOR_PRODUCT event; no state changes.

        Returns 404 when the product does not exist or matches no tread design — an ordinary outcome, not

        an error condition.

        '
      operationId: getTreadDesignForProduct
      parameters:
      - description: Product to look up enrichment for.
        in: path
