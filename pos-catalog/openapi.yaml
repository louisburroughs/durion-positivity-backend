          type: integer
        completedAt:
          description: When the completion event was applied; null while chunks are in flight.
          format: date-time
          type: string
        expectedChunkCount:
          description: Chunk total the producer declared; null until completion.
          example: 25
          format: int32
          type: integer
        expectedLineCount:
          description: Matched-line total the producer reported; null until completion.
          example: 12310
          format: int32
          type: integer
        importManifestId:
          description: The producer's import manifest id.
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
          format: uuid
          type: string
        linesApplied:
          description: Price rows written from this import.
          example: 12310
          format: int32
          type: integer
        status:
          description: Application state.
          enum:
          - APPLYING
          - COMPLETE
          - INCOMPLETE
          example: COMPLETE
          type: string
        supplierRef:
          description: Vendor profile alias at import time.
          example: michelin-eu
          type: string
        updatedAt:
          description: When this row last changed.
          format: date-time
          type: string
        vendorProfileId:
          description: Vendor profile the import belongs to.
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
          format: uuid
          type: string
      type: object
    TreadDesignDto:
      description: Vendor-supplied tread-design marketing enrichment, distinct from catalog-owned product data.
      properties:
        brand:
          description: Brand as stated by the vendor.
          type: string
        hasUnresolvedImages:
          description: Whether any artwork on this design is still missing and awaiting retry.
          type: boolean
        id:
          description: This design's id.
          format: uuid
          type: string
        images:
          description: Artwork references.
          items:
            $ref: '#/components/schemas/TreadDesignImageDto'
          type: array
        productName:
          description: Vendor's product name, where given.
          type: string
        seasonality:
          description: Seasonality as the vendor states it, not mapped to a Durion vocabulary.
          type: string
        supplierRef:
          description: That profile's alias, descriptive only.
          type: string
        texts:
          description: Marketing copy per language.
          items:
            $ref: '#/components/schemas/TreadDesignTextDto'
          type: array
        treadDesign:
          description: Primary tread design name as stated.
          type: string
        treadDesign2:
          description: Secondary tread design name, where the vendor uses one.
          type: string
        updatedAt:
          description: When this enrichment was last applied.
          format: date-time
          type: string
        vehicleType:
          description: Vehicle class as stated.
          type: string
        vendorProfileId:
          description: Vendor profile the enrichment was fetched from.
          format: uuid
          type: string
        vendorVariantId:
          description: The vendor's own tread design variant identifier.
          type: string
      type: object
    TreadDesignImageDto:
      description: Vendor-supplied artwork reference.
      properties:
        imageId:
          description: pos-image identifier for the stored bytes; absent when unresolved.
          format: int64
          type: integer
        imageType:
          description: Vendor's own classification of the image.
          type: string
        unresolved:
          description: Whether the artwork is still missing and awaiting a future republication.
          type: boolean
      type: object
    TreadDesignTextDto:
      description: Vendor-supplied marketing copy in one language.
      properties:
        description:
          description: Marketing description in that language.
          type: string
        footNotes:
          description: Legal or qualifying text, when given.
          type: string
        languageCode:
          description: Vendor's own language code, as stated.
          example: en-US
          type: string
        name:
          description: Product name in that language.
          type: string
      type: object
    UomConversionCreateRequestDto:
      description: Request to create a unit-of-measure conversion
      properties:
        conversionFactor:
          description: Multiplier to convert one unit of the source UOM into the target UOM
          example: 12
          minimum: 0
          type: number
        createdBy:
          description: Identifier of the user creating the conversion
          example: system
          type: string
        fromUomCode:
          description: Source unit-of-measure code
          example: CASE
          minLength: 1
          type: string
        toUomCode:
          description: Target unit-of-measure code
          example: EACH
          minLength: 1
          type: string
      required:
      - conversionFactor
      - fromUomCode
      - toUomCode
      type: object
    UomConversionDto:
      description: A unit-of-measure conversion between two UOM codes
      properties:
        active:
          description: Whether this conversion is currently active
          example: true
          type: boolean
        conversionFactor:
          description: Multiplier to convert one unit of the source UOM into the target UOM
          example: 12
          type: number
        createdAt:
          description: Timestamp the conversion was created
          example: 2026-01-15 09:30:00+00:00
          format: date-time
          type: string
        createdBy:
          description: Identifier of the user who created the conversion
          example: system
          type: string
        fromUomCode:
          description: Source unit-of-measure code
          example: CASE
          type: string
        id:
          description: Identifier of the conversion
          example: 0196cf6f-c8dd-7ee0-93e7-f48a5698a535
          format: uuid
          type: string
        toUomCode:
          description: Target unit-of-measure code
          example: EACH
          type: string
        updatedAt:
          description: Timestamp the conversion was last updated
          example: 2026-01-16 11:00:00+00:00
          format: date-time
          type: string
      required:
      - active
      - conversionFactor
      - createdAt
      - fromUomCode
      - id
      - toUomCode
      type: object
    UomConversionUpdateRequestDto:
      description: Request to update a unit-of-measure conversion factor
      properties:
        conversionFactor:
          description: Multiplier to convert one unit of the source UOM into the target UOM
          example: 12
          minimum: 0
          type: number
      required:
      - conversionFactor
      type: object
    UpdateMsrpRequestDto:
      description: Request to update the MSRP for a product
      properties:
        amount:
          description: MSRP amount
          example: 149.99
          type: number
        createdByUserId:
          description: Identifier of the user creating this MSRP entry
          example: 0196cf6f-c8dd-7ee0-93e7-f48a5698a535
          format: uuid
          type: string
        currency:
          description: ISO currency code for the amount
          example: USD
          type: string
        effectiveEndDate:
          description: Date the MSRP stops being effective (null means open-ended)
          example: 2026-12-31
          format: date
          type: string
        effectiveStartDate:
          description: Date the MSRP becomes effective
          example: 2026-01-01
          format: date
          type: string
        version:
          description: Version for optimistic locking
          example: 1
          format: int64
          type: integer
      required:
      - amount
      - createdByUserId
      - currency
      - effectiveStartDate
      type: object
    UpdateStandardCostRequestDto:
      description: Request payload to update standard cost
      properties:
        newCost:
          description: New standard cost
          minimum: 0
          type: number
        reasonCode:
          description: Reason code for manual change
          minLength: 1
          type: string
      required:
      - newCost
      - reasonCode
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
