        "200":
          description: Successfully retrieved services
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceDto"
  /v1/products/search:
    get:
      tags:
      - Products API
      summary: Search catalog products
      description: "Cursor-based product search with optional free-text query and\
        \ exact filters for brand, category, and SKU."
      operationId: searchProducts
      parameters:
      - name: q
        in: query
        description: Free-text search query (matches product name and description)
        required: false
        schema:
          type: string
      - name: brand
        in: query
        description: "Filter by manufacturer brand (exact, case-insensitive)"
        required: false
        schema:
          type: string
      - name: category
        in: query
        description: "Filter by category name (exact, case-insensitive)"
        required: false
        schema:
          type: string
      - name: sku
        in: query
        description: "Filter by SKU (exact match, case-insensitive)"
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: Pagination cursor from previous response
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of results (1–100)
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "400":
          description: "Invalid request parameter (e.g., non-numeric limit)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CatalogSearchResultDto"
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSearchResultDto"
  /v1/products/pricing/effective-price/{locationId}/{productId}:
    get:
