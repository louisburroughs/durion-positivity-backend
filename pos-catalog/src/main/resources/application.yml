spring:
  application:
    name: catalog
  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

server:
  port: 0
  tomcat:
    max-http-header-size: 65536

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

pos:
  price:
    service-id: price
    base-path: /v1/price
    default-customer-tier-id: ${POS_PRICE_DEFAULT_CUSTOMER_TIER_ID:00000000-0000-0000-0000-000000000001}
  catalog:
    kafka:
      # Inventory availability/lead-time replica feed + reconciliation (ADR-0044 §6, #899).
      # Off until the broker is provisioned; flip POS_CATALOG_KAFKA_ENABLED per environment.
      enabled: ${POS_CATALOG_KAFKA_ENABLED:false}
      inventory-events-topic: ${POS_CATALOG_INVENTORY_EVENTS_TOPIC:inventory.events.v1}
      inventory-events-consumer-group: ${POS_CATALOG_INVENTORY_EVENTS_CONSUMER_GROUP:pos-catalog-inventory-events}
      inventory-manifest-topic: ${POS_CATALOG_INVENTORY_MANIFEST_TOPIC:inventory.manifest.v1}
      inventory-manifest-consumer-group: ${POS_CATALOG_INVENTORY_MANIFEST_CONSUMER_GROUP:pos-catalog-inventory-manifests}
      inventory-commands-topic: ${POS_CATALOG_INVENTORY_COMMANDS_TOPIC:inventory.commands.v1}

logging:
  level:
    root: INFO
    org:
      springframework: INFO
    com:
      positivity:
        catalog: INFO

      netflix:
        discovery:
          shared:
            resolver:
              aws:
                ConfigClusterResolver: WARN
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  default-produces-media-type: application/json
