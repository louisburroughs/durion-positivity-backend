spring:
  application:
    name: catalog
  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

server:
  port: 0
  tomcat:
    max-http-header-size: 65536

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

pos:
  price:
    service-id: price
    base-path: /v1/price
    default-customer-tier-id: ${POS_PRICE_DEFAULT_CUSTOMER_TIER_ID:00000000-0000-0000-0000-000000000001}
  catalog:
    kafka:
      # Inventory availability/lead-time replica feed + reconciliation (ADR-0044 §6, #899), and the
      # catalog.product.updated fact producer (#924).
      # Off until the broker is provisioned; flip POS_CATALOG_KAFKA_ENABLED per environment.
      enabled: ${POS_CATALOG_KAFKA_ENABLED:false}
      inventory-events-topic: ${POS_CATALOG_INVENTORY_EVENTS_TOPIC:inventory.events.v1}
      inventory-events-consumer-group: ${POS_CATALOG_INVENTORY_EVENTS_CONSUMER_GROUP:pos-catalog-inventory-events}
      inventory-manifest-topic: ${POS_CATALOG_INVENTORY_MANIFEST_TOPIC:inventory.manifest.v1}
      inventory-manifest-consumer-group: ${POS_CATALOG_INVENTORY_MANIFEST_CONSUMER_GROUP:pos-catalog-inventory-manifests}
      inventory-commands-topic: ${POS_CATALOG_INVENTORY_COMMANDS_TOPIC:inventory.commands.v1}
      # catalog.product.updated fact producer (#924)
      events-topic: ${POS_CATALOG_EVENTS_TOPIC:catalog.events.v1}
      # Own command inbox (ADR-0044 §4, #1537): CatalogCommandListener's replay-only listener,
      # closing #1023 so pos-inventory's CatalogManifestListener can request repair on drift
      # instead of only detecting it.
      commands-topic: ${POS_CATALOG_COMMANDS_TOPIC:catalog.commands.v1}
      commands-consumer-group: ${POS_CATALOG_COMMANDS_CONSUMER_GROUP:pos-catalog-commands}
      # Supplier PRICAT application into append-only price entries (ADR-0053 §7, #1308). The
      # command topic is where a detected chunk gap asks the owner to re-emit (ADR-0044 §4) --
      # never a synchronous call back to pos-supplier.
      supplier-events-topic: ${POS_CATALOG_SUPPLIER_EVENTS_TOPIC:supplier.events.v1}
      supplier-events-consumer-group: ${POS_CATALOG_SUPPLIER_EVENTS_CONSUMER_GROUP:pos-catalog-supplier-events}
    manifest:
      topic: ${POS_CATALOG_MANIFEST_TOPIC:catalog.manifest.v1}

logging:
  level:
    root: INFO
    org:
      springframework: INFO
    com:
      positivity:
        catalog: INFO

      netflix:
        discovery:
          shared:
            resolver:
              aws:
                ConfigClusterResolver: WARN
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  default-produces-media-type: application/json
