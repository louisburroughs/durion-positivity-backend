domain: catalog
serviceName: pos-catalog
version: "1.0"
permissions:
  - name: "catalog:catalog_grouping:delete"
    description: "Delete a catalog grouping"
  - name: "catalog:catalog_grouping:edit"
    description: "Create or update a catalog grouping"
  - name: "catalog:catalog_grouping:view"
    description: "View catalog groupings"
  - name: "catalog:category:create"
    description: "Create product categories"
    deprecated: true
  - name: "catalog:category:delete"
    description: "Delete product categories"
    deprecated: true
  - name: "catalog:category:edit"
    description: "Edit product categories"
    deprecated: true
  - name: "catalog:category:view"
    description: "View product categories"
    deprecated: true
  - name: "catalog:fact:replay"
    description: "Re-emit product, service, and supplier-article-code facts for replica consumers"
  - name: "catalog:guardrail_policy:write"
    description: "Create or update location-scoped pricing guardrail policies"
  - name: "catalog:item_cost:read"
    description: "View an item's standard cost and its audit history"
  - name: "catalog:item_cost:update"
    description: "Update item cost"
  - name: "catalog:location_price_override:read"
    description: "View a location's effective price for a product"
  - name: "catalog:location_price_override:write"
    description: "Create location-specific price overrides"
  - name: "catalog:msrp:read"
    description: "View product MSRP history and active MSRP"
  - name: "catalog:msrp:write"
    description: "Create and update product MSRP records"
  - name: "catalog:non_inventory:view"
    description: "View non-inventory products"
  - name: "catalog:price_book:read"
    description: "View price books, price book rules, and resolve prices"
  - name: "catalog:price_book:write"
    description: "Create, update, and deactivate price books and price book rules"
  - name: "catalog:product:create"
    description: "Create products in catalog"
  - name: "catalog:product:delete"
    description: "Delete products from catalog"
  - name: "catalog:product:edit"
    description: "Edit products in catalog"
  - name: "catalog:product:view"
    description: "View products in catalog"
  - name: "catalog:product_uom:edit"
    description: "Add, update, and delete a product's alternate units of measure"
  - name: "catalog:product_uom:view"
    description: "View a product's alternate units of measure"
  - name: "catalog:service_type:create"
    description: "Create service types"
  - name: "catalog:service_type:edit"
    description: "Edit service types"
  - name: "catalog:service_type:view"
    description: "View service types"
  - name: "catalog:substitution_group:edit"
    description: "Create, delete, and modify membership of substitution groups"
  - name: "catalog:substitution_group:view"
    description: "View substitution groups and their membership"
  - name: "catalog:supplier_cost:read"
    description: "View supplier item cost structures"
  - name: "catalog:supplier_cost:write"
    description: "Create, update, and delete supplier item cost structures"
    deprecated: true
  - name: "catalog:tread_design:view"
    description: "View vendor tread-design enrichment matched to products"
  - name: "catalog:uom_conversion:edit"
    description: "Create, update, and deactivate unit-of-measure conversions"
  - name: "catalog:uom_conversion:view"
    description: "View unit-of-measure conversions"
  - name: "catalog:variant:create"
    description: "Create product variants"
    deprecated: true
  - name: "catalog:variant:edit"
    description: "Edit product variants"
    deprecated: true
  - name: "catalog:variant:view"
    description: "View product variants"
    deprecated: true
  - name: "product:lifecycle:override_discontinued"
    description: "Override discontinued lifecycle restrictions"
  - name: "product:lifecycle:update"
    description: "Update product lifecycle state"
