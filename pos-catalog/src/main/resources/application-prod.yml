# Environment-specific runtime intentionally inherits env-driven base settings.

# ADR-0046: deployed environments run INFO baseline; framework noise capped at WARN
logging:
  level:
    root: INFO
    com:
      netflix:
        discovery:
          shared:
            resolver:
              aws:
                ConfigClusterResolver: WARN

pos:
  catalog:
    labor-guide:
      # No licensed labor-guide source exists yet (#1569 Phase 2); the mock roster must never
      # answer in a deployed environment.
      enabled: false
