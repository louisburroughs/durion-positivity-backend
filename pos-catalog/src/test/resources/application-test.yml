spring:
  application:
    name: pos-catalog-test
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:h2:mem:catalog_test_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      "[hibernate.format_sql]": true
  flyway:
    enabled: false
  cloud:
    discovery:
      enabled: false

pos:
  price:
    base-url: http://localhost:9999/mock-price
    default-customer-tier-id: 00000000-0000-0000-0000-000000000099
  inventory:
    base-url: http://localhost:9999/mock-inventory

eureka:
  client:
    enabled: false

logging:
  level:
    health:
      show-details: INFO
    com:
      positivity:
        catalog: INFO

# Test contexts never reach pos-security-service or pos-event-receiver. Skip permission registration
# (its startup retry loop otherwise sleeps ~8 s in every Spring test context) and point the event-type
# initializer at a loopback port that refuses instantly. Same arrangement as pos-mcp-server's test profile.
pos.security.permission-registration.enabled: false
pos.events.base-url: http://127.0.0.1:1
