      description: 'Returns one row per role with its MCP persona slots, resolution rank, and eligibility flag, ordered by rank then name, plus the timestamp the snapshot was assembled.

        Use this tool to derive assistant personas and their priority order from role data, as pos-mcp-server does; do not use getAllRoles, which returns the full role graph including every permission grant and is far more expensive for this purpose.

