        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '200':
          description: OK
      security:
      - bearerAuth:
        - security:role:assign
      x-required-permissions:
      - security:role:assign
