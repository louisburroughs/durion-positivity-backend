openapi: 3.1.0
info:
  title: POS Security Service API
  description: API documentation for POS Security Service
  contact:
    name: Durion Support Services
    email: louis.burroughs@gmail.com
  version: v1
servers:
- url: http://localhost:8086
  description: Generated server url
tags:
- name: Principal Role Management
  description: Assign roles to principals for RBAC matrix operations
- name: JWT API
  description: Endpoints for JWT authentication and token management per ADR-0011
- name: Role Management
  description: "Manage roles, permissions, and user assignments"
- name: Authorization
  description: Authorization decision endpoints for principal permissions
- name: User API
  description: Endpoints for user management and authentication
- name: User Role Management
  description: Assign and revoke roles for users
- name: Permission Registry
  description: Central permission registry for all services
- name: Auth API
  description: User-facing authentication endpoints
- name: Self-Registration Review API
  description: Administrative queue for blocked self-registration recovery and identity
    review cases
- name: Admin Account-State API
  description: Administrative endpoints for user account state management
- name: Audit
  description: Audit event and pricing snapshot endpoints with immutable write-once
    behavior
paths:
  /v1/users/{username}/roles:
    put:
      tags:
      - User API
      summary: Assign roles to a user
      description: Replaces or applies the requested role set for the specified user
        by username.
      operationId: assignRoles
      parameters:
      - name: username
        in: path
        description: Username of the user whose roles are being assigned
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
              description: Payload containing the roles to assign
        required: true
      responses:
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User not found.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: User roles updated successfully.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDto"
      security:
      - bearerAuth: []
  /v1/users/{userId}/roles/{roleId}:
    put:
      tags:
      - User Role Management
      summary: Assign a role to a user
      description: Creates an effective role assignment linking the specified user
        to the specified role.
      operationId: assignRoleToUser
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: OK
      security:
      - bearerAuth: []
    delete:
      tags:
      - User Role Management
      summary: Revoke a role from a user
      description: Removes the effective assignment of the specified role from the
        specified user.
      operationId: revokeRoleFromUser
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "400":
          description: Bad Request
          content:
            '*/*':
