  /v1/roles/bulk-ingest:
    post:
      description: 'Creates roles from a bulk-load batch, each with an optional description and optional MCP persona metadata; every role starts with no permissions and no user assignments.

        Use this tool to provision a set of roles from a load file; do not use it to grant permissions, which is bulkIngestRolePermissions, and do not use createRole, which creates one role at a time.

        Preconditions: the caller must hold security:role:create.

