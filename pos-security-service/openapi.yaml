                  locationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a10
                  operatorId: seed-operator
                  records:
                  - personId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                    username: jane.doe
            schema:
              $ref: '#/components/schemas/BulkIngestRequestUserPersonLinkBulkIngestRecord'
        description: User-to-person links to queue.
        required: true
      responses:
