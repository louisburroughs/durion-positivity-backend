  /v1/roles/permissions/bulk-ingest:
    post:
      description: 'Grants named permissions to existing roles from a bulk-load batch.

        Use this tool to apply a role-to-permission grant file; do not use it to create roles, which is bulkIngestRoles, and note that both the role and each permission must already exist — permissions are registered by their owning module at startup.

        Preconditions: the caller must hold security:role:edit.

        Required inputs: jobId, locationId, and records; each record needs a roleName and at least one permission name.

