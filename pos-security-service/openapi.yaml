  /v1/users/bulk-ingest:
    post:
      description: 'Provisions many user accounts at once, each with its roles attached and a password generated inside the service.

        Use this tool when standing up an environment''s accounts; use createUser instead when the account needs a known password.

        Preconditions: every role named must already exist.

        Required inputs: jobId (UUID), locationId (UUID) and records, each with a username and at least one role. There is deliberately no password field: a bulk file is stored, and a password in it would exist at rest for as long as the upload does.

        Emits a SECURITY_USER_BULK_INGEST event and a user-created event per row; the generated passwords are returned to no one, so these accounts have no usable login until someone goes through the password reset path.

        Re-running the same file is safe: an existing username is reported as already provisioned rather than as a failure.

        Returns 200 with a per-record result; check each result rather than the status alone.

        '
      operationId: bulkIngestUsers
      requestBody:
        content:
          application/json:
            examples:
              Accounts:
                description: Accounts
                value:
                  jobId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a00
                  locationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a10
                  operatorId: seed-operator
                  records:
                  - roles:
                    - TECHNICIAN
                    username: jane.doe
                  - roles:
                    - SHOP_MGR
                    username: sam.lee
            schema:
              $ref: '#/components/schemas/BulkIngestRequestUserBulkIngestRecord'
        description: User accounts to provision. No password material is accepted.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkIngestResponse'
          description: Batch processed; inspect per-record results
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request payload
        '401':
