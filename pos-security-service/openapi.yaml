        required: false
        schema:
          type: string
          format: uuid
        example: 88888888-8888-8888-8888-888888888888
      - name: sku
        in: query
        description: SKU code
        required: false
        schema:
          type: string
        example: BRAKE-PAD-001
      - name: eventType
        in: query
        description: Event type code
        required: false
        schema:
          type: string
        example: PERMISSION_DENIED
      - name: aggregateId
        in: query
        description: Aggregate identifier
        required: false
        schema:
          type: string
        example: role:manager
      - name: correlationId
        in: query
        description: Correlation ID UUID for distributed tracing
        required: false
        schema:
          type: string
          format: uuid
