          type: string
        ruleId:
          type: string
        status:
          type: string
        inputs:
          type: string
        outputs:
          type: string
    PricingSnapshotDto:
      type: object
      properties:
        snapshotId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        quoteContext:
          type: string
        finalPrice:
          type: number
        evaluationSteps:
          type: array
          items:
            $ref: "#/components/schemas/PricingRuleTraceEntryDto"
    AuditLogEventDto:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        timestamp:
          type: string
