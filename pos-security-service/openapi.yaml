        required: false
        schema:
          type: string
          format: date-time
        example: 2026-12-31 23:59:59+00:00
      - name: actorId
        in: query
        description: Actor username or user identifier
        required: false
        schema:
          type: string
        example: advisor.jane
      - name: workorderId
        in: query
        description: Workorder UUID - one word per workspace naming policy
        required: false
        schema:
          type: string
          format: uuid
      - name: movementId
        in: query
        description: Movement UUID
        required: false
        schema:
          type: string
          format: uuid
        example: 77777777-7777-7777-7777-777777777777
      - name: productId
