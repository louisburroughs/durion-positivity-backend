      operationId: assignRolePermissionByKey
      parameters:
      - in: path
        name: roleId
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: permissionKey
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Permission assigned to role
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Role or permission not found
      security:
      - bearerAuth:
        - security:role:edit
      summary: Assign a Registered Permission to a Role
      tags:
      - Role Management
      x-required-permissions:
      - security:role:edit
  /v1/roles/{role}/default-permissions:
