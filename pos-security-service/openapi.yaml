  /v1/audit/events:
    get:
      tags:
      - Audit
      summary: Search Audit Events With Filters
      description: 'Searches audit events with pagination, filtering by time window, actor, event type, and aggregate identifier.

        Use this tool to query the audit trail; use getAuditEvent instead when the event id is known, and requestAuditExport for bulk extraction as a file.

        Preconditions: the caller must hold security:audit:view; when both bounds are given, fromDate must be strictly before toDate (fromDate inclusive, toDate exclusive).

        Required inputs: none are mandatory; fromDate, toDate, actorId, eventType, and aggregateId are applied as filters, while workorderId, movementId, productId, sku, correlationId, reasonCode, pageToken, and locationIds are accepted for contract compatibility but not yet applied.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 400 when fromDate is not before toDate or a parameter fails type conversion.

        '
      operationId: searchAuditEvents
      parameters:
      - name: fromDate
        in: query
        description: Inclusive start timestamp (ISO-8601)
        required: false
        schema:
          type: string
          format: date-time
        example: 2026-01-01 00:00:00+00:00
      - name: toDate
        in: query
        description: Exclusive end timestamp (ISO-8601)
        required: false
        schema:
          type: string
          format: date-time
        example: 2026-12-31 23:59:59+00:00
      - name: actorId
        in: query
        description: Actor username or user identifier
        required: false
        schema:
          type: string
        example: advisor.jane
      - name: workorderId
        in: query
        description: Workorder UUID - one word per workspace naming policy
        required: false
        schema:
          type: string
          format: uuid
      - name: movementId
        in: query
        description: Movement UUID
        required: false
        schema:
          type: string
          format: uuid
        example: 77777777-7777-7777-7777-777777777777
      - name: productId
        in: query
        description: Product UUID
        required: false
        schema:
          type: string
          format: uuid
        example: 88888888-8888-8888-8888-888888888888
      - name: sku
        in: query
        description: SKU code
        required: false
        schema:
          type: string
        example: BRAKE-PAD-001
      - name: eventType
        in: query
        description: Event type code
        required: false
        schema:
          type: string
        example: PERMISSION_DENIED
      - name: aggregateId
        in: query
        description: Aggregate identifier
        required: false
        schema:
          type: string
        example: role:manager
      - name: correlationId
        in: query
        description: Correlation ID UUID for distributed tracing
        required: false
        schema:
          type: string
          format: uuid
        example: 99999999-9999-9999-9999-999999999999
      - name: reasonCode
        in: query
        description: Reason code string
        required: false
        schema:
          type: string
        example: MANUAL_REVIEW
      - name: pageToken
        in: query
        description: Cursor token for page navigation
        required: false
        schema:
          type: string
        example: eyJwYWdlIjoyfQ
      - name: locationIds
        in: query
        description: Location UUID list - repeated query param
        required: false
        schema:
          type: array
          items:
            type: string
        example: 11111111-1111-1111-1111-111111111111
      responses:
        '400':
          description: Invalid filter criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Insufficient authority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '200':
          description: Audit events returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageAuditLogEventDto'
      security:
      - bearerAuth: []
    post:
      tags:
      - Audit
      summary: Record an Immutable Audit Event
      description: 'Records an immutable audit event and returns the generated event id and server timestamp.

        Use this tool to persist a write-once audit fact; do not use createPricingSnapshot, which records a pricing rule trace, and note that updates and deletes of audit events are rejected with 405 by design.

        Preconditions: the caller must hold security:audit:create; the actor is resolved server-side from the security context, so any actorId in the body is ignored.

        Required inputs: eventType, entityId, entityType, oldValue, and newValue (empty strings are accepted, null is not); context is optional and stored as serialized JSON.

        Emits a SECURITY_AUDIT_EVENT_CREATE event; the stored record can never be modified or deleted.

        Returns 400 when any required field is missing or a value cannot be serialized to JSON.

        '
      operationId: createAuditEvent
      requestBody:
        description: 'The audit fact to record: what changed, on which entity, from and to what.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditLogEventRequest'
            examples:
              Role change event:
                description: Role change event
                value:
                  eventType: ROLE_ASSIGNED
                  entityId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  entityType: USER
                  oldValue: ''
                  newValue: SHOP_MGR
                  context:
                    reason: onboarding
        required: true
