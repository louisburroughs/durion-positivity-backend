        "204":
          description: Role assignment revoked
  /v1/roles/assignments/{assignmentId}:
    delete:
      tags:
      - Role Management
      summary: Revoke role assignment
      description: "Revokes a role assignment by setting its end date. Supports past,\
        \ present, or future dates. The system automatically records when the revocation\
        \ was requested. Defaults to today when endDate is omitted"
      operationId: revokeRoleAssignment_1
      parameters:
      - name: assignmentId
        in: path
        description: Role assignment ID
        required: true
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      - name: endDate
        in: query
        description: Effective end date and time for revocation. Defaults to current
          date and time
        required: false
        schema:
          type: string
          format: date-time
        example: 2026-02-16T10:30:00
      responses:
        "404":
          description: Role assignment not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid endDate
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "204":
          description: Role assignment revoked
  /v1/auth/revoke:
    delete:
      tags:
      - JWT API
      summary: Revoke JWT token
      description: Revoke a JWT token immediately (Redis cache + database)
      operationId: revokeToken
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      responses:
        "404":
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "204":
          description: Token revoked successfully
components:
  schemas:
    ErrorResponse:
      type: object
      description: Standardized error response with correlation ID
      properties:
        code:
          type: string
          description: Error code for client processing
        message:
          type: string
          description: Human-readable error message
        status:
          type: integer
          format: int32
          description: HTTP status code
        timestamp:
          type: string
          description: ISO 8601 timestamp
        correlationId:
          type: string
          description: Unique request correlation ID for tracking
    UserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        roles:
          type: array
          items:
            type: string
          uniqueItems: true
        personId:
          type: string
          format: uuid
    UserUpdateRequest:
      type: object
      description: Updated user object
      properties:
        username:
          type: string
        password:
          type: string
        roles:
          type: array
          items:
            type: string
          uniqueItems: true
    RolePermissionGrantRequest:
      type: object
      properties:
        permission:
          type: string
    PermissionDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        domain:
          type: string
        description:
          type: string
        deprecated:
          type: boolean
    RoleDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionDto"
          uniqueItems: true
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        lastModifiedAt:
          type: string
          format: date-time
        lastModifiedBy:
          type: string
    RolePermissionsRequest:
      type: object
      properties:
        roleId:
          type: string
          format: uuid
        permissionNames:
          type: array
          items:
            type: string
          uniqueItems: true
    RoleAssignmentRequest:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        roleId:
          type: string
          format: uuid
        scopeType:
          type: string
          enum:
          - GLOBAL
          - LOCATION
        scopeLocationIds:
          type: array
          items:
            type: string
          uniqueItems: true
        effectiveStartDate:
          type: string
          format: date-time
        effectiveEndDate:
          type: string
          format: date-time
    RoleAssignmentDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        roleId:
          type: string
          format: uuid
        scopeType:
          type: string
          enum:
          - GLOBAL
          - LOCATION
        scopeLocationIds:
          type: array
          items:
            type: string
          uniqueItems: true
        effectiveStartDate:
          type: string
          format: date-time
        effectiveEndDate:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        lastModifiedAt:
          type: string
          format: date-time
        lastModifiedBy:
          type: string
    PermissionDefinition:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
    PermissionRegistrationRequest:
      type: object
      properties:
        domain:
          type: string
        serviceName:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionDefinition"
        version:
          type: string
    PermissionRegistrationResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        totalPermissions:
          type: integer
          format: int32
        registeredPermissions:
          type: integer
          format: int32
        updatedPermissions:
          type: integer
          format: int32
        skippedPermissions:
          type: integer
          format: int32
        errors:
          type: array
          items:
            type: string
    PermissionDecodeRequest:
      type: object
      properties:
        perm_bits:
          type: string
        perm_ver:
          type: integer
          format: int32
      required:
      - perm_bits
    PermissionDecodeResponse:
      type: object
      properties:
        permissions:
          type: array
          items:
            type: string
    TokenPairRequest:
      type: object
      description: Request to generate an access token and refresh token pair
      properties:
        subject:
          type: string
          description: User identifier (subject claim)
          example: user123
        roles:
          type: array
          description: Optional set of role names to include in token
          example:
          - SHOP_MGR
          items:
            type: string
          uniqueItems: true
      required:
      - subject
    TokenPairResponse:
      type: object
      description: Response containing both access and refresh JWT tokens
      properties:
        accessToken:
          type: string
          description: Short-lived JWT access token (1 hour expiration)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          description: Long-lived JWT refresh token (7 days expiration)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    RefreshTokenRequest:
      type: object
      description: Request to refresh an access token using a refresh token
      properties:
        refreshToken:
          type: string
          description: Long-lived refresh token
      required:
      - refreshToken
    LoginRequest:
      type: object
      description: Request to authenticate a user with username and password
      properties:
        username:
          type: string
          description: The user's login username
          example: jane.doe
        password:
          type: string
          description: The user's login password
      required:
      - password
      - username
    InternalTokenRequest:
      type: object
      description: Request to generate a single JWT token for an internal trusted
        caller
      properties:
        subject:
          type: string
          description: User identifier (subject claim)
          example: user123
        roles:
          type: array
          description: Optional set of role names to include in token
          example:
          - SHOP_MGR
          - ACCOUNTING_CLERK
          items:
            type: string
          uniqueItems: true
      required:
      - subject
    TokenResponse:
      type: object
      description: Response containing a JWT access token
      properties:
        token:
          type: string
          description: JWT token (Bearer token for Authorization header)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    PricingRuleTraceEntryRequest:
      type: object
      properties:
        ruleId:
          type: string
        status:
          type: string
        inputs: {}
        outputs: {}
    PricingSnapshotRequest:
      type: object
      properties:
        quoteContext: {}
        finalPrice:
          type: number
        evaluationSteps:
          type: array
          items:
            $ref: "#/components/schemas/PricingRuleTraceEntryRequest"
    PricingSnapshotCreatedResponse:
      type: object
      properties:
        snapshotId:
          type: string
          format: uuid
    AuditLogEventRequest:
      type: object
      properties:
        eventType:
          type: string
        actorId:
          type: string
        entityId:
          type: string
        entityType:
          type: string
        oldValue: {}
        newValue: {}
        context: {}
    AuditEventCreatedResponse:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
    AccountStateResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        enabled:
          type: boolean
        accountNonLocked:
          type: boolean
        accountNonExpired:
          type: boolean
        credentialsNonExpired:
          type: boolean
        failedLoginAttempts:
          type: integer
          format: int32
        lockedAt:
          type: string
          format: date-time
        lockedUntil:
          type: string
          format: date-time
        disabledAt:
          type: string
          format: date-time
        disabledBy:
          type: string
        accountExpiresAt:
          type: string
          format: date-time
        credentialsExpireAt:
          type: string
          format: date-time
    CatalogVersionResponse:
      type: object
      properties:
        version:
          type: integer
          format: int32
        permissionCount:
          type: integer
          format: int32
    AuthorizationDecisionResponse:
      type: object
      properties:
