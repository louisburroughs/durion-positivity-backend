          description: Login name of the account to link
          example: jane.doe
          minLength: 1
          type: string
      required:
      - personId
      - username
      type: object
    UserUpdateRequest:
      description: Partial update of a user account; only supplied fields are applied
      properties:
        password:
          description: New password for the account
          type: string
        roles:
          description: Replacement set of role names
          example:
          - SHOP_MGR
          items:
            type: string
          type: array
          uniqueItems: true
        username:
          description: New login username
          example: jane.doe
          type: string
      type: object
    ValidateResponse:
      description: Token validation result
      properties:
        valid:
          description: Whether the token is valid
          type: boolean
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
