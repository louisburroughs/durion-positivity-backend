    put:
      description: 'Replaces a role''s description and its MCP persona metadata: the persona title, focus, and tone slots, the persona rank, and whether the role participates in persona resolution at all.

        Use this tool to correct or rank a role''s assistant persona; do not use updateRolePermissions, which changes the role''s permission grants, and do not use it to rename a role — the name keys authority resolution and permission grants and is not updatable here.

        Preconditions: the caller must hold security:role:edit and the role id must exist.

        Required inputs: role id as a path parameter. Every body field is optional, but an omitted field clears the stored value rather than leaving it unchanged, which is how a persona slot is returned to its derived default.

        Persona slots must describe the role rather than instruct the assistant: single line, within the length cap, and free of imperative control verbs.

        Emits a SECURITY_ROLE_UPDATE event and records the modifying actor and timestamp.

        Returns 400 when a persona slot fails validation and 404 when no role has that id.

