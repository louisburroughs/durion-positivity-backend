openapi: 3.1.0
info:
  title: POS Security Service API
  description: API documentation for POS Security Service
  contact:
    name: Durion Team
    email: louis.burroughs@gmail.com
  version: v1
servers:
- url: http://localhost:8086
  description: Generated server url
tags:
- name: JWT API
  description: Endpoints for JWT authentication and token management per ADR-0011
- name: Role Management
  description: "Manage roles, permissions, and user assignments"
- name: Authorization
  description: Authorization decision endpoints for principal permissions
- name: User API
  description: Endpoints for user management and authentication
- name: User Role Management
  description: Assign and revoke roles for users
- name: Permission Registry
  description: Central permission registry for all services
- name: Auth API
  description: User-facing authentication endpoints
- name: Admin Account-State API
  description: Administrative endpoints for user account state management
