        \ was requested. Defaults to today when endDate is omitted"
      operationId: revokeRoleAssignment
      parameters:
      - name: assignmentId
        in: path
        description: Role assignment ID
        required: true
        schema:
          type: string
          format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      - name: endDate
        in: query
        description: Effective end date and time for revocation. Defaults to current
          date and time
        required: false
        schema:
          type: string
          format: date-time
        example: 2026-02-16T10:30:00
      responses:
        "404":
          description: Role assignment not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid endDate
          content:
            '*/*':
              schema:
