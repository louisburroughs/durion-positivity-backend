  /v1/users/person-link/bulk-ingest:
    post:
      description: 'Queues many user-to-person links at once, resolving each row''s username to an account.

        Use this tool when connecting seeded accounts to their staff records; use linkUserPerson instead for a single account.

        Preconditions: each username must name an existing account. The person id is not validated here — pos-people-contact rejects an unknown person when it processes the command, which surfaces later rather than as a row failure.

        Required inputs: jobId (UUID), locationId (UUID) and records, each with a username and a personId.

        Emits a SECURITY_USER_PERSON_LINK_BULK_INGEST event and queues a link command per row; linking is asynchronous, so a successful row means the link was accepted rather than applied and the accounts should be read back to confirm the projection landed.

