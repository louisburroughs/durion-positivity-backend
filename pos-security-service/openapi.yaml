          format: int32
        updatedPermissions:
          type: integer
          format: int32
        skippedPermissions:
          type: integer
          format: int32
        errors:
          type: array
          items:
            type: string
    PermissionDecodeRequest:
      type: object
      properties:
        perm_bits:
          type: string
        perm_ver:
          type: integer
          format: int32
      required:
      - perm_bits
    PermissionDecodeResponse:
      type: object
      properties:
        permissions:
          type: array
          items:
            type: string
    ResolveSelfRegistrationReviewCaseRequest:
      type: object
      description: Administrative request to resolve a blocked self-registration case
      properties:
        resolutionNotes:
          type: string
          description: Resolution note recorded with the case
          example: Recovered existing disabled account and asked user to sign in.
          minLength: 1
      required:
      - resolutionNotes
    SelfRegistrationReviewCaseResponse:
      type: object
      description: Administrative view of a blocked self-registration case
      properties:
        caseId:
          type: string
          format: uuid
          description: Review case identifier
        caseType:
          type: string
          description: Case type
          enum:
          - ACCOUNT_RECOVERY
          - IDENTITY_REVIEW
        status:
          type: string
          description: Case status
          enum:
          - OPEN
          - RESOLVED
        reasonCode:
          type: string
          description: Reason code that created the case
        reasonMessage:
          type: string
          description: Reason message recorded for the case
        email:
          type: string
          description: Submitted email address
        requestedUsername:
          type: string
          description: Requested username, when available
        personId:
          type: string
          format: uuid
          description: Resolved or created person identifier, when available
        linkedUserId:
          type: string
          format: uuid
          description: Linked or recoverable user identifier, when available
        crmCandidateCount:
          type: integer
          format: int32
          description: CRM candidate count, when available
        crmSharedIdentityCandidateCount:
          type: integer
          format: int32
          description: CRM shared-identity candidate count, when available
        crmExactEmailMatch:
          type: boolean
          description: CRM exact email match flag, when available
        crmExactPhoneMatch:
          type: boolean
          description: CRM exact phone match flag, when available
        crmExactNameMatch:
          type: boolean
          description: CRM exact name match flag, when available
        notes:
          type: string
          description: Operator notes recorded for the case
        createdAt:
          type: string
          format: date-time
          description: Case creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Case last-updated timestamp
        resolvedAt:
          type: string
          format: date-time
          description: Resolution timestamp, when resolved
        resolvedBy:
          type: string
          description: Actor who resolved the case, when resolved
        resolutionNotes:
          type: string
          description: Resolution notes, when resolved
    TokenPairRequest:
      type: object
      description: Request to generate an access token and refresh token pair
      properties:
        subject:
          type: string
          description: User identifier (subject claim)
          example: user123
        roles:
          type: array
          description: Optional set of role names to include in token
          example:
          - SHOP_MGR
          items:
            type: string
          uniqueItems: true
      required:
      - subject
    TokenPairResponse:
      type: object
      description: Response containing both access and refresh JWT tokens
      properties:
        accessToken:
          type: string
          description: Short-lived JWT access token (1 hour expiration)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          description: Long-lived JWT refresh token (7 days expiration)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    SelfRegistrationRequest:
      type: object
      description: Anonymous self-registration request
      properties:
        email:
          type: string
          format: email
          description: Primary email address
          example: jane.smith@example.com
          minLength: 1
        password:
          type: string
          description: Password for the new account
          example: Sup3rS3cret!
          minLength: 1
        firstName:
          type: string
          description: Given name
          example: Jane
          minLength: 1
        lastName:
          type: string
          description: Family name
          example: Smith
          minLength: 1
        phone:
          type: string
          description: Optional primary phone number
          example: +1-555-123-4567
        username:
          type: string
          description: Optional requested username. If omitted, the email local part is used.
        idpSubject:
          type: string
          description: Optional external identity subject for future federation support
        idempotencyKey:
          type: string
          description: Optional idempotency key used to replay a completed registration attempt without creating duplicate side effects
      required:
      - email
      - firstName
      - lastName
      - password
    CrmMatchSummaryDto:
      type: object
      properties:
        candidateCount:
          type: integer
          format: int32
        anyMatches:
          type: boolean
        individualCustomerCandidateCount:
          type: integer
          format: int32
        commercialContactCandidateCount:
          type: integer
          format: int32
        sharedIdentityCandidateCount:
          type: integer
          format: int32
        exactEmailMatch:
          type: boolean
        exactPhoneMatch:
          type: boolean
        exactNameMatch:
          type: boolean
        reviewRequired:
          type: boolean
    SelfRegistrationResponse:
      type: object
      description: Result of a successful self-registration
      properties:
        userId:
          type: string
          format: uuid
          description: Created user identifier
        personId:
          type: string
          format: uuid
          description: Resolved or created person identifier
        username:
          type: string
          description: Canonical username assigned to the account
        linkStatus:
          type: string
          description: User-person link status
          example: LINKED
        matchedExistingPerson:
          type: boolean
          description: True when an existing person was reused
        crmMatchSummary:
          $ref: '#/components/schemas/CrmMatchSummaryDto'
        idempotencyKey:
          type: string
          description: Idempotency key echoed back when the caller supplied one
        issuedTokens:
          type: boolean
          description: False for Phase 1 because follow-up login is required
    RefreshTokenRequest:
      type: object
      description: Request to refresh an access token using a refresh token
      properties:
        refreshToken:
          type: string
          description: Long-lived refresh token
      required:
      - refreshToken
    LoginRequest:
      type: object
      description: Request to authenticate a user with username and password
      properties:
        username:
          type: string
          description: The user's login username
          example: jane.doe
          minLength: 1
        password:
          type: string
          description: The user's login password
          minLength: 1
      required:
      - password
      - username
    InternalTokenRequest:
      type: object
      description: Request to generate a single JWT token for an internal trusted caller
      properties:
        subject:
          type: string
          description: User identifier (subject claim)
          example: user123
        roles:
          type: array
          description: Optional set of role names to include in token
          example:
          - SHOP_MGR
          - ACCOUNTING_CLERK
          items:
            type: string
          uniqueItems: true
      required:
      - subject
    TokenResponse:
      type: object
      description: Response containing a JWT access token
      properties:
        token:
          type: string
          description: JWT token (Bearer token for Authorization header)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
