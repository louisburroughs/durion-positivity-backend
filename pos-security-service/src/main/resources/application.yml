# Conversion to YAML from Properties formar report
# Warnings:
# - The yaml file had comments which are lost in the refactoring!
spring:
  flyway:
    # R__seed_security_operational_data.sql was retired in favour of the alpha fixture packs
    # (docs/DATA_SEED_STRATEGY.md, #1968). Environments that ran them keep the
    # flyway_schema_history rows, which default validation flags as "applied migration
    # not resolved locally" and which fails startup. Ignore missing repeatables only -
    # versioned-migration validation stays fully enforced.
    ignore-migration-patterns: "repeatable:missing"
  application:
    name: security-service
  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    # ADR-0062 (WS2b-3): the Hibernate session fixes its @TenantId at open time, so a request-scoped
    # session would pin every query to the tenant bound when the request arrived. Login, refresh,
    # activation and the platform administrator endpoints all rebind mid-request
    # (TenantContext.callAs/runAs); with open-in-view off each @Transactional method opens its own
    # session under the binding in force at that moment.
    open-in-view: false
  # flyway:
  #   placeholders:
  #     # Injected via env var at runtime/deploy time; do not commit real hash in SQL.
  #     seed_admin_password_hash: ${SECURITY_SEED_ADMIN_PASSWORD_HASH:$2a$12$replace_with_real_hash}

server:
  port: 8086
  tomcat:
    max-http-header-size: 65536

management:
  # No separate management port - expose actuator on main server port for healthchecks
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    org:
      springframework: INFO
    com:
      positivity:
        securityservice: INFO

      netflix:
        discovery:
          shared:
            resolver:
              aws:
                ConfigClusterResolver: WARN
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true

  default-produces-media-type: application/json
pos:
  # ADR-0062 section 9, transitional: every unbound path (a request the gateway has not yet stamped with
  # X-Tenant-Id, a record without the tenant header, a scheduler) runs as the alpha default tenant.
  # Unset it (POS_TENANCY_DEFAULT_TENANT_ID=) once every client sends a tenant: the runtime is then
  # strict and an unbound request is a 401. /v1/auth/** binds the tenant itself (login slug, refresh
  # token tid claim), so the filter never refuses it for lack of a header.
  tenancy:
    default-tenant-id: ${POS_TENANCY_DEFAULT_TENANT_ID:01900000-0000-7000-8000-000000000001}
    unenforced-paths:
      - /v1/auth/
  customer:
    service-id: ${POS_CUSTOMER_SERVICE_ID:customer}
  security-service:
    kafka:
      # ADR-0044 / amended ADR-0043 (#876): people-contact.events.v1 feeds the users.person_id
      # projection and the identity replica; person/link commands go out via the outbox to
      # people-contact.commands.v1; people-contact.manifest.v1 drives reconciliation.
      enabled: ${POS_SECURITY_SERVICE_KAFKA_ENABLED:false}
      people-contact-events-topic: ${POS_SECURITY_PC_EVENTS_TOPIC:people-contact.events.v1}
      people-contact-events-consumer-group: ${POS_SECURITY_PC_EVENTS_CONSUMER_GROUP:pos-security-people-contact-events}
      people-contact-manifest-topic: ${POS_SECURITY_PC_MANIFEST_TOPIC:people-contact.manifest.v1}
      people-contact-manifest-consumer-group: ${POS_SECURITY_PC_MANIFEST_CONSUMER_GROUP:pos-security-people-contact-manifests}
      people-contact-commands-topic: ${POS_SECURITY_PC_COMMANDS_TOPIC:people-contact.commands.v1}
      # ADR-0061 §1 (#1867): people.events.v1 staffing-assignment facts feed the
      # ext_people_staffing_assignment read model (assigned location nodes per person);
      # people.manifest.v1 drives reconciliation, replay requests go to people.commands.v1.
      people-events-topic: ${POS_SECURITY_PEOPLE_EVENTS_TOPIC:people.events.v1}
      people-events-consumer-group: ${POS_SECURITY_PEOPLE_EVENTS_CONSUMER_GROUP:pos-security-people-events}
      people-manifest-topic: ${POS_SECURITY_PEOPLE_MANIFEST_TOPIC:people.manifest.v1}
      people-manifest-consumer-group: ${POS_SECURITY_PEOPLE_MANIFEST_CONSUMER_GROUP:pos-security-people-manifests}
      people-commands-topic: ${POS_SECURITY_PEOPLE_COMMANDS_TOPIC:people.commands.v1}
      # Customer person-identity replica feed + reconciliation (ADR-0044 §6, #891)
      customer-events-topic: ${POS_SECURITY_CUSTOMER_EVENTS_TOPIC:customer.events.v1}
      customer-events-consumer-group: ${POS_SECURITY_CUSTOMER_EVENTS_CONSUMER_GROUP:pos-security-customer-events}
      customer-manifest-topic: ${POS_SECURITY_CUSTOMER_MANIFEST_TOPIC:customer.manifest.v1}
      customer-manifest-consumer-group: ${POS_SECURITY_CUSTOMER_MANIFEST_CONSUMER_GROUP:pos-security-customer-manifests}
      customer-commands-topic: ${POS_SECURITY_CUSTOMER_COMMANDS_TOPIC:customer.commands.v1}
      # Role persona facts consumed by pos-mcp-server so a persona edit reaches the assistant
      # without waiting for its scheduled pull (#1613).
      security-events-topic: ${POS_SECURITY_EVENTS_TOPIC:security.events.v1}
      # ADR-0062 section 7 (plan WS2b): tenant.events.v1 feeds the global ext_tenant replica that
      # login resolves slugs from and GET /v1/tenants/me answers from.
      tenant-events-topic: ${POS_SECURITY_TENANT_EVENTS_TOPIC:tenant.events.v1}
      tenant-events-consumer-group: ${POS_SECURITY_TENANT_EVENTS_CONSUMER_GROUP:pos-security-tenant-events}
    location-scope:
      # ADR-0061 §2: assertion that the hierarchy was modelled correctly, not a size limit.
      # A person whose effective assigned-node set exceeds this is logged at WARN and counted
      # (security.location-scope.assigned-nodes.cap-exceeded); the set is never truncated.
      assigned-node-cap: ${POS_SECURITY_LOCATION_SCOPE_ASSIGNED_NODE_CAP:8}
  security:
    lockout:
      max-attempts: 5
      window: 10m
      backoff-multiplier: 2
      max-backoff-window: 30m
    path: /swagger-ui.html

# ADR-0062 section 3: the organization directory the login form searches, so a user picks their
# organization by name instead of typing a tenant slug. Anonymous by necessity and therefore a
# tenant-enumeration surface by design; the limits below are what bound it. Enabled in every
# profile, production included — with no tenant-bearing host configured the search IS the login
# path, so disabling it would put every user back to typing a slug. `enabled` is an incident lever:
# turn it off and login still works for anyone who knows their slug.
auth:
  tenant-search:
    enabled: ${AUTH_TENANT_SEARCH_ENABLED:true}
    # Shortest query that is searched; shorter answers an empty list while the user is still typing.
    min-query-length: 3
    # Never offer more than this; no total is returned, since a total says how much is left.
    max-results: 10
