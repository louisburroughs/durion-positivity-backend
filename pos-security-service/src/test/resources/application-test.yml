spring:
  application:
    name: pos-security-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    # Runs src/test/resources/schema.sql after Hibernate builds the schema, so
    # migration-only columns can be patched in (#1512). See schema.sql.
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: false
  main:
    allow-bean-definition-overriding: true

  flyway:
    enabled: false
  liquibase:
    enabled: false
  boot:
    admin:
      client:
        enabled: false

  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

security:
  jwt:
    secret: test-jwt-secret-key-01234567890123456789
  redis:
    enabled: false

pos:
  security:
    api-secret: test-permission-secret
  events:
    base-url: http://localhost:1

# Logging
logging:
  level:
    com:
      security: DEBUG
    org:
      springframework:
        security: DEBUG
