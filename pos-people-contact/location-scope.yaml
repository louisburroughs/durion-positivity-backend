# Location-scope decisions for pos-people-contact (ADR-0061, #1872 and #1885).
# Every operation that takes a caller-supplied locationId must appear here;
# scripts/audit-rbac.py --check fails on a missing or stale entry.
decisions:
  - operation: PersonAccessController.createAssignment
    shape: unscoped
    reason: "The request carries no location to check. ADR-0061 §1 makes a role assignment an effective-dated user-to-role link and nothing more \u2014 the assignee's reach is the role's own location_scope combined with their pos-people staffing assignment, resolved at token issuance \u2014 and #1875 deleted the scopeType/scopeLocationIds this module used to forward, so PersonRoleAssignmentRequest has no locationId. Recorded as a decision rather than a deferral: there is nothing here for a location replica to answer (#1885)"
