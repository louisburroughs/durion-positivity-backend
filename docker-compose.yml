  pos-warranty:
    build:
      context: ./pos-warranty
      dockerfile: Dockerfile
    ports:
      - "8093:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      GATEWAY_URL: http://pos-api-gateway:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pos_warranty_db
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      <<: [ *pos-security-client-env, *pos-events-client-env ]
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_METRICS_EXPORTER: none # app metrics are pull-only via /actuator/prometheus (#867)
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 8080
      # Domain events (ADR-0044) — on by default since the warranty rollout (#927):
      # pos-accounting (reimbursement expectations) and pos-inventory (part-return
      # holds) consume warranty.events.v1.
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      POS_WARRANTY_KAFKA_ENABLED: ${POS_WARRANTY_KAFKA_ENABLED:-true}
    depends_on:
      eureka-server:
        condition: service_healthy
      pos-security-service:
        condition: service_healthy
    logging: *logging
    networks:
      - pos-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      # Same generous window as pos-vehicle-inventory — a whole-stack recreate on
      # alpha can push JVM startup well past 90s.
      start_period: 300s

  pos-workorder:
    build:
      context: ./pos-workorder
      dockerfile: Dockerfile
    ports:
      - "8090:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      GATEWAY_URL: http://pos-api-gateway:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pos_workorder_db
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      <<: [ *pos-security-client-env, *pos-events-client-env ]
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_METRICS_EXPORTER: none # app metrics are pull-only via /actuator/prometheus (#867)
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 8080
    depends_on:
      eureka-server:
        condition: service_healthy
      pos-security-service:
        condition: service_healthy
    logging: *logging
    networks:
      - pos-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 300s

  pos-api-gateway:
    build:
      context: ./pos-api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET}
      <<: [ *pos-security-client-env, *pos-events-client-env ]
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_METRICS_EXPORTER: none # app metrics are pull-only via /actuator/prometheus (#867)
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 300s
    logging: *logging
    networks:
      pos-network:
        aliases:
          - api-gateway

  pos-frontend:
    build:
      context: ../durion-positivity-frontend
      dockerfile: Dockerfile
    ports:
      - "4200:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      API_GATEWAY_URL: http://pos-api-gateway:8080
      NG_ALLOWED_HOSTS: ${NG_ALLOWED_HOSTS}
      OTEL_SERVICE_NAME: pos-frontend
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_METRICS_EXPORTER: none # app metrics are pull-only via /actuator/prometheus (#867)
      OTEL_RESOURCE_ATTRIBUTES: "service.name=pos-frontend,service.namespace=durion-g\
        roup,deployment.environment=pre-production"
    depends_on:
      pos-api-gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const net=require('net');const
            s=net.connect(4000,'127.0.0.1',()=>{s.end();process.exit(0)});s.set\
            Timeout(2000,()=>{s.destroy();process.exit(1)});s.on('error',()=>pr\
            ocess.exit(1));",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 300s
    logging: *logging
    networks:
      - pos-network

# Docker Networks
networks:
  pos-network:
    driver: bridge

# Docker Volumes for Observability Data Persistence
volumes:
  kafka-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
  promtail-positions:
    driver: local
  postgres-data:
    driver: local
  ollama-data:
    driver: local
