  pos-mcp-server:
    build:
      context: ./pos-mcp-server
      dockerfile: Dockerfile
    ports:
      - "8094:8086"
    environment:
      SPRING_PROFILES_ACTIVE: alpha,accelerated
      POS_MCP_DB_HOST: postgres
      POS_MCP_DB_PORT: 5432
      POS_MCP_DB_NAME: pos_mcp
      POS_MCP_DB_USER: ${SPRING_DATASOURCE_USERNAME}
      POS_MCP_DB_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      <<: [ *pos-security-client-env, *pos-events-client-env ]
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      # Chat runs against Ollama's hosted API. Embeddings stay local.
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_CHAT_BASE_URL: ${OLLAMA_CHAT_BASE_URL:-https://ollama.com}
      OLLAMA_EMBEDDING_BASE_URL: ${OLLAMA_EMBEDDING_BASE_URL:-http://ollama:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3.5:cloud}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_FALLBACK_MODEL: ${OLLAMA_FALLBACK_MODEL:-gpt-oss:120b}
      OLLAMA_CHAT_TIMEOUT: ${OLLAMA_CHAT_TIMEOUT:-180s}
      OLLAMA_STREAMING_CHAT_TIMEOUT: ${OLLAMA_STREAMING_CHAT_TIMEOUT:-180s}
      OLLAMA_EMBEDDING_TIMEOUT: ${OLLAMA_EMBEDDING_TIMEOUT:-30s}
      OLLAMA_FALLBACK_TIMEOUT: ${OLLAMA_FALLBACK_TIMEOUT:-180s}
      MCP_RAG_CHUNKING_ENABLED: ${MCP_RAG_CHUNKING_ENABLED:-true}
      MCP_RAG_MAX_SEGMENT_SIZE: ${MCP_RAG_MAX_SEGMENT_SIZE:-2000}
      MCP_RAG_MAX_OVERLAP_SIZE: ${MCP_RAG_MAX_OVERLAP_SIZE:-200}
      EXA_API_KEY: ${EXA_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      SERVER_PORT: 8086
      MANAGEMENT_SERVER_PORT: 8086
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
      pos-security-service:
        condition: service_healthy
      pos-event-receiver:
        condition: service_healthy
    logging: *logging
    networks:
      - pos-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
