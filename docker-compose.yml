      <<: [ *pos-security-client-env, *pos-events-client-env ]
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 8080
    depends_on:
      eureka-server:
        condition: service_healthy
      pos-security-service:
        condition: service_healthy
      pos-vehicle-inventory:
        condition: service_healthy
    logging: *logging
    networks:
      - pos-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20

  # NOTE: pos-event-receiver does NOT require pos-security-service.
  # Security is enforced via:
  #   1. Shared secret (X-Events-Api-Secret header) for write operations
  #   2. Preregistered event ID validation for event emission
  #   3. Network isolation (no external ports exposed)
  pos-event-receiver:
    build:
      context: ./pos-event-receiver
      dockerfile: Dockerfile
    # No external ports exposed - internal service only, accessed via API gateway
    environment:
      SPRING_PROFILES_ACTIVE: accelerated
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      GATEWAY_URL: http://pos-api-gateway:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pos_event_receiver_db
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      <<: [ *pos-security-client-env, *pos-events-client-env ]
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    logging: *logging
    networks:
      - pos-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20

  pos-image:
