x-pos-events-client-env: &pos-events-client-env
  POS_EVENTS_BASE_URL: ${POS_EVENTS_BASE_URL:-http://pos-event-receiver:8080}
  POS_EVENTS_API_SECRET: ${POS_EVENTS_API_SECRET}

x-pos-security-client-env: &pos-security-client-env
  POS_SECURITY_BASE_URL: ${POS_SECURITY_BASE_URL:-http://pos-security-service:8080}
  POS_SECURITY_API_SECRET: ${POS_SECURITY_API_SECRET}
  POS_SECURITY_METRICS_SCRAPE_USERNAME: ${POS_SECURITY_METRICS_SCRAPE_USERNAME:-prometheus_scraper}
  POS_SECURITY_METRICS_SCRAPE_PASSWORD: ${POS_SECURITY_METRICS_SCRAPE_PASSWORD:-durion-local-prom-scrape-password}
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 3
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
  SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: 30000

services:
  # Observability Stack for Local Development

  # Jaeger - Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: jaeger
    ports:
      - "5775:5775/udp"  # Compact thrift protocol
      - "6831:6831/udp"  # Compact thrift protocol
      - "6832:6832/udp"  # Binary thrift protocol
      - "5778:5778"      # Serve configs
      - "16686:16686"    # Jaeger UI
      - "14268:14268"    # Direct HTTP collector
      - "14250:14250"    # gRPC for model.proto
      - "9411:9411"      # Zipkin compatible endpoint
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      LOG_LEVEL: debug
    networks:
      - pos-network

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - pos-network

  # Grafana - Visualization and Dashboards
  grafana:
    image: grafana/grafana:10.3.3
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - jaeger
    networks:
      - pos-network

  # OTEL Collector - Centralized telemetry collection (optional but recommended)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.93.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    ports:
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver
      - "8888:8888"     # Prometheus metrics exposed by the collector
      - "8889:8889"     # Prometheus exporter metrics
      - "13133:13133"   # Health check extension
    volumes:
      - ./observability/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    depends_on:
      - jaeger
      - prometheus
    networks:
      - pos-network

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: postgres-positivity
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - pos-network

  # POS Services

  eureka-server:
    build:
      context: ./pos-service-discovery # Path to your eureka-server module
      dockerfile: Dockerfile # Assuming you have a Dockerfile in each module
    ports:
      - "8761:8761"
    environment:
      # Configure Eureka to use its Docker Compose service name for registration
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://localhost:8761/eureka/
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pos-network
    healthcheck: # Optional but recommended for sequential startup
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20 # Give it enough time to start

  pos-accounting:
    build:
      context: ./pos-accounting
      dockerfile: Dockerfile
    ports:
      - "9001:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      GATEWAY_URL: http://pos-api-gateway:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pos_accounting_db
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_CONNECT_ACCOUNT: ${STRIPE_CONNECT_ACCOUNT:-}
      POS_ACCOUNTING_CREDIT_MEMO_REVENUE_ACCOUNT_ID: ${POS_ACCOUNTING_CREDIT_MEMO_REVENUE_ACCOUNT_ID}
      POS_ACCOUNTING_CREDIT_MEMO_TAX_PAYABLE_ACCOUNT_ID: ${POS_ACCOUNTING_CREDIT_MEMO_TAX_PAYABLE_ACCOUNT_ID}
      POS_ACCOUNTING_CREDIT_MEMO_AR_ACCOUNT_ID: ${POS_ACCOUNTING_CREDIT_MEMO_AR_ACCOUNT_ID}
      <<: [*pos-security-client-env, *pos-events-client-env]
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 8080
    depends_on:
      pos-security-service:
        condition: service_healthy
    networks:
      - pos-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

