  #     timeout: 3s
  #     retries: 20

  pos-vehicle-inventory:
    build:
      context: ./pos-vehicle-inventory
      dockerfile: Dockerfile
    ports:
      - "8089:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      GATEWAY_URL: http://pos-api-gateway:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pos_vehicle_inventory_db
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      <<: [ *pos-security-client-env, *pos-events-client-env ]
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_METRICS_EXPORTER: none # app metrics are pull-only via /actuator/prometheus (#867)
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 8080
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: ${SPRING_KAFKA_LISTENER_AUTO_STARTUP:-false}
      MANAGEMENT_HEALTH_KAFKA_ENABLED: ${MANAGEMENT_HEALTH_KAFKA_ENABLED:-false}
      # ADR-0044 #843: vehicle.events.v1 outbox producer + commands/manifest loop
      POS_VEHICLE_INVENTORY_KAFKA_ENABLED: ${POS_VEHICLE_INVENTORY_KAFKA_ENABLED:-false}
    depends_on:
      eureka-server:
        condition: service_healthy
      pos-security-service:
        condition: service_healthy
    logging: *logging
    networks:
      - pos-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      # 90s was too tight on alpha: a whole-stack --force-recreate starts ~20 JVMs at
      # once and this service crossed the 90s + 12x10s window, got marked unhealthy,
      # and failed pos-customer's service_healthy dependency wait — then went healthy
      # seconds later. Startup probes are free when the service is fast, so be generous.
      start_period: 300s

