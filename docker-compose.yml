  pos-api-gateway:
    build:
      context: ./pos-api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET}
      <<: [*pos-security-client-env, *pos-events-client-env]
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - pos-network

  pos-frontend:
    build:
      context: ../durion-positivity-frontend
      dockerfile: Dockerfile
    ports:
      - "4200:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      API_GATEWAY_URL: http://pos-api-gateway:8080
      NG_ALLOWED_HOSTS: ${NG_ALLOWED_HOSTS}
      OTEL_SERVICE_NAME: pos-frontend
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_RESOURCE_ATTRIBUTES: "service.name=pos-frontend,service.namespace=durion-group,deployment.environment=pre-production"
    depends_on:
      pos-api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const net=require('net');const s=net.connect(4000,'127.0.0.1',()=>{s.end();process.exit(0)});s.setTimeout(2000,()=>{s.destroy();process.exit(1)});s.on('error',()=>process.exit(1));"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - pos-network

# Docker Networks
networks:
  pos-network:
    driver: bridge

# Docker Volumes for Observability Data Persistence
volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  postgres-data:
    driver: local
