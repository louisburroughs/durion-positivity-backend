x-pos-events-client-env: &pos-events-client-env
  POS_EVENTS_BASE_URL: ${POS_EVENTS_BASE_URL:-http://pos-event-receiver:8080}
  POS_EVENTS_API_SECRET: ${POS_EVENTS_API_SECRET}

x-pos-security-client-env: &pos-security-client-env
  POS_SECURITY_BASE_URL: ${POS_SECURITY_BASE_URL:-http://pos-security-service:8080}
  POS_SECURITY_API_SECRET: ${POS_SECURITY_API_SECRET}
  POS_SECURITY_METRICS_SCRAPE_USERNAME: ${POS_SECURITY_METRICS_SCRAPE_USERNAME:-prometheus_scraper}
  POS_SECURITY_METRICS_SCRAPE_PASSWORD: ${POS_SECURITY_METRICS_SCRAPE_PASSWORD:-durion-local-prom-scrape-password}
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 3
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
  SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: 30000

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Observability Stack for Local Development

  # Jaeger - Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: jaeger
    ports:
      - "5775:5775/udp" # Compact thrift protocol
      - "6831:6831/udp" # Compact thrift protocol
      - "6832:6832/udp" # Binary thrift protocol
      - "5778:5778" # Serve configs
      - "16686:16686" # Jaeger UI
      - "14268:14268" # Direct HTTP collector
      - "14250:14250" # gRPC for model.proto
      - "9411:9411" # Zipkin compatible endpoint
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      LOG_LEVEL: debug
    logging: *logging
    networks:
      - pos-network

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    logging: *logging
    networks:
      - pos-network

  # Grafana - Visualization and Dashboards
  grafana:
    image: grafana/grafana:10.3.3
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - jaeger
      - loki
    logging: *logging
    networks:
      - pos-network

  # OTEL Collector - Centralized telemetry collection (optional but recommended)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.93.0
    container_name: otel-collector
    command: [ "--config=/etc/otel-collector-config.yml" ]
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "8888:8888" # Prometheus metrics exposed by the collector
      - "13133:13133" # Health check extension
    volumes:
      - ./observability/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    depends_on:
      - jaeger
      - prometheus
    logging: *logging
    networks:
      - pos-network

  # Loki - Log aggregation (#858)
  loki:
    image: grafana/loki:3.1.1
    container_name: loki
    ports:
      # Localhost only — Grafana/Promtail reach Loki over the pos-network;
      # no need to expose all container logs on shared/remote host interfaces.
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    command: [ "-config.file=/etc/loki/loki-config.yml" ]
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://localhost:3100/ready || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *logging
    networks:
      - pos-network

  # docker-socket-proxy - Read-only, whitelisted Docker API for Promtail SD (#858)
  # Promtail needs container metadata for labels but not root-equivalent socket
  # access; the proxy exposes only GET /containers and /version over TCP.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: docker-socket-proxy
    environment:
      CONTAINERS: 1   # allow GET /containers/* (SD target list)
      NETWORKS: 1     # allow GET /networks/* (promtail computes network labels)
      VERSION: 1      # allow GET /version (API negotiation)
      # All other API groups (POST, exec, images, ...) denied by default.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *logging
    networks:
      - pos-network

  # cAdvisor - per-container resource metrics for Prometheus (#863)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    command: [ "--housekeeping_interval=15s", "--docker_only=true" ]
    # No host port publish: Prometheus scrapes cadvisor:8080 over pos-network.
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    logging: *logging
    networks:
      - pos-network

  # postgres-exporter - cluster-wide Postgres metrics for Prometheus (#863).
  # DATA_SOURCE_URI targets the 'postgres' maintenance DB; pg_stat_database is
  # cluster-scoped so this covers every per-service pos_*_db.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging
    networks:
      - pos-network

  # Promtail - Ships Docker json-file logs to Loki (#858)
  promtail:
    image: grafana/promtail:3.1.1
    container_name: promtail
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Container log files (read directly; container metadata comes from the proxy).
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Persist read positions across container recreation.
      - promtail-positions:/promtail
    command: [ "-config.file=/etc/promtail/promtail-config.yml" ]
    depends_on:
      - loki
      - docker-socket-proxy
    logging: *logging
    networks:
      - pos-network

  # PostgreSQL Database
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: postgres-positivity
    command: [ "postgres", "-c", "shared_preload_libraries=timescaledb" ]
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s
    logging: *logging
    networks:
      - pos-network

  kafka:
    # ADR-0044: Kafka is the domain-event backbone. Single-node KRaft broker for local dev.
    image: apache/kafka:3.9.0
    container_name: kafka-positivity
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Host-less bind ("://:") — Kafka 3.9 StorageTool rejects the 0.0.0.0 meta-address
      # in listeners when it (re)formats an empty data dir, crash-looping the broker.
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Persist log segments so a container recreate (alpha deploys use
      # --force-recreate) does not wipe topics, offsets, and consumer state.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *logging
    networks:
      - pos-network

  kafka-exporter:
    # #838: topic depth (DLQ), consumer lag, and manifest-topic activity for Prometheus.
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: kafka-exporter-positivity
    command: [ "--kafka.server=kafka:29092" ]
    ports:
      - "127.0.0.1:9308:9308"
    depends_on:
      kafka:
        condition: service_healthy
    logging: *logging
    networks:
      - pos-network

  kafka-topic-init:
    # #838 Q6/Q7/Q9: provision domain-event topics with delete retention, 1 partition.
    image: apache/kafka:3.9.0
    container_name: kafka-topic-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/bash", "-c" ]
    command:
      - |
        set -e
        declare -A topics=(
          ["workorder.events.v1"]=604800000
          ["workorder.commands.v1"]=604800000
          ["workorder.manifest.v1"]=259200000
          ["workorder.events.v1.dlq"]=2592000000
          ["workorder.commands.v1.dlq"]=2592000000
          ["workorder.manifest.v1.dlq"]=2592000000
          ["customer.events.v1"]=604800000
          ["customer.events.v1.dlq"]=2592000000
          ["people-contact.events.v1"]=604800000
          ["people-contact.commands.v1"]=604800000
          ["people-contact.manifest.v1"]=259200000
          ["people-contact.events.v1.dlq"]=2592000000
          ["invoice.events.v1"]=604800000
          ["invoice.events.v1.dlq"]=2592000000
          ["payment.cleared.v1"]=604800000
        )
        for t in "$${!topics[@]}"; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$$t" --partitions 1 --replication-factor 1 || true
          /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:29092 --alter \
            --entity-type topics --entity-name "$$t" \
            --add-config "retention.ms=$${topics[$$t]},cleanup.policy=delete"
        done
        echo "topic init complete"
    restart: "no"
    logging: *logging
    networks:
      - pos-network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null 2>&1 ||
            exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s
    logging: *logging
    networks:
      - pos-network

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      OLLAMA_HOST=http://ollama:11434 ollama pull
      ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    restart: "no"
    volumes:
      - ollama-data:/root/.ollama
    logging: *logging
    networks:
      - pos-network

  # POS Services

  eureka-server:
    build:
      context: ./pos-service-discovery # Path to your eureka-server module
      dockerfile: Dockerfile # Assuming you have a Dockerfile in each module
    ports:
      - "8761:8761"
    environment:
      # Configure Eureka to use its Docker Compose service name for registration
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://localhost:8761/eureka/
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_METRICS_EXPORTER: none # app metrics are pull-only via /actuator/prometheus (#867)
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging
    networks:
      - pos-network
    healthcheck:
      # Optional but recommended for sequential startup
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20 # Give it enough time to start
      start_period: 300s

  pos-accounting:
    build:
      context: ./pos-accounting
      dockerfile: Dockerfile
    ports:
      - "9001:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      # On by default since the warranty rollout (#927): consumes warranty.events.v1
      # into warranty_reimbursement_expectation (plus the customer/invoice replicas).
      POS_ACCOUNTING_KAFKA_ENABLED: ${POS_ACCOUNTING_KAFKA_ENABLED:-true}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      GATEWAY_URL: http://pos-api-gateway:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pos_accounting_db
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_CONNECT_ACCOUNT: ${STRIPE_CONNECT_ACCOUNT:-}
      POS_ACCOUNTING_CREDIT_MEMO_REVENUE_ACCOUNT_ID: ${POS_ACCOUNTING_CREDIT_MEMO_REVENUE_ACCOUNT_ID}
      POS_ACCOUNTING_CREDIT_MEMO_TAX_PAYABLE_ACCOUNT_ID: ${POS_ACCOUNTING_CREDIT_MEMO_TAX_PAYABLE_ACCOUNT_ID}
      POS_ACCOUNTING_CREDIT_MEMO_AR_ACCOUNT_ID: ${POS_ACCOUNTING_CREDIT_MEMO_AR_ACCOUNT_ID}
      <<: [ *pos-security-client-env, *pos-events-client-env ]
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_METRICS_EXPORTER: none # app metrics are pull-only via /actuator/prometheus (#867)
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 8080
    depends_on:
      eureka-server:
        condition: service_healthy
      pos-security-service:
        condition: service_healthy
    logging: *logging
    networks:
      - pos-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 300s

  pos-bulk-loader:
    build:
      context: ./pos-bulk-loader
      dockerfile: Dockerfile
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pos_bulk_loader_db
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      POS_CATALOG_BASE_URL: http://pos-catalog:8080
      POS_CUSTOMER_BASE_URL: http://pos-customer:8080
      POS_PEOPLE_BASE_URL: http://pos-people:8080
      POS_PRICE_BASE_URL: http://pos-price:8080
      POS_VEHICLE_INVENTORY_BASE_URL: http://pos-vehicle-inventory:8080
      POS_VEHICLE_FITMENT_BASE_URL: http://pos-vehicle-fitment:8080
      <<: [ *pos-security-client-env, *pos-events-client-env ]
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_METRICS_EXPORTER: none # app metrics are pull-only via /actuator/prometheus (#867)
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 8080
    depends_on:
      eureka-server:
        condition: service_healthy
      pos-security-service:
        condition: service_healthy
    logging: *logging
    networks:
      - pos-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 300s

  pos-catalog:
    build:
      context: ./pos-catalog
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      GATEWAY_URL: http://pos-api-gateway:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pos_catalog_db
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      # ADR-0044 #899: inventory availability/lead-time replica feed from inventory.events.v1
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      MANAGEMENT_HEALTH_KAFKA_ENABLED: ${MANAGEMENT_HEALTH_KAFKA_ENABLED:-false}
      POS_CATALOG_KAFKA_ENABLED: ${POS_CATALOG_KAFKA_ENABLED:-false}
      <<: [ *pos-security-client-env, *pos-events-client-env ]
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_METRICS_EXPORTER: none # app metrics are pull-only via /actuator/prometheus (#867)
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 8080
    depends_on:
      eureka-server:
        condition: service_healthy
      pos-security-service:
        condition: service_healthy
    logging: *logging
    networks:
      - pos-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 300s

  pos-customer:
    build:
      context: ./pos-customer
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      # ADR-0044: workorder + vehicle event consumers and the customer outbox producer
      POS_CUSTOMER_KAFKA_ENABLED: ${POS_CUSTOMER_KAFKA_ENABLED:-false}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      GATEWAY_URL: http://pos-api-gateway:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pos_customer_db
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      <<: [ *pos-security-client-env, *pos-events-client-env ]
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_METRICS_EXPORTER: none # app metrics are pull-only via /actuator/prometheus (#867)
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 8080
    depends_on:
      eureka-server:
        condition: service_healthy
      pos-security-service:
        condition: service_healthy
      # service_started, not service_healthy: customer calls vehicle-inventory over
      # HTTP at request time (via Eureka), not at boot. A hard health dependency
      # turns a slow vehicle-inventory startup into a failed deploy (run 29527988342).
      pos-vehicle-inventory:
        condition: service_started
    logging: *logging
    networks:
      - pos-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 300s

  # NOTE: pos-event-receiver does NOT require pos-security-service.
  # Security is enforced via:
  #   1. Shared secret (X-Events-Api-Secret header) for write operations
  #   2. Preregistered event ID validation for event emission
  #   3. Network isolation (no external ports exposed)
  pos-event-receiver:
    build:
      context: ./pos-event-receiver
      dockerfile: Dockerfile
    # No external ports exposed - internal service only, accessed via API gateway
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      GATEWAY_URL: http://pos-api-gateway:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pos_event_receiver_db
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      <<: [ *pos-security-client-env, *pos-events-client-env ]
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_METRICS_EXPORTER: none # app metrics are pull-only via /actuator/prometheus (#867)
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    logging: *logging
    networks:
      - pos-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 300s

  pos-image:
    build:
      context: ./pos-image
      dockerfile: Dockerfile
    ports:
      - "8083:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      GATEWAY_URL: http://pos-api-gateway:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pos_image_db
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      <<: [ *pos-security-client-env, *pos-events-client-env ]
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_METRICS_EXPORTER: none # app metrics are pull-only via /actuator/prometheus (#867)
