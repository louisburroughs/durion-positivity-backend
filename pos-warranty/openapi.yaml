components:
  schemas:
    RegistrationRequest:
      type: object
      description: Warranty registration create/update request — sold/instantiated coverage
      properties:
        policyId:
          type: string
          format: uuid
          description: Governing warranty policy id
        customerId:
          type: string
          format: uuid
          description: pos-customer customer id
        vehicleId:
          type: string
          format: uuid
          description: pos-vehicle-inventory vehicle id, when vehicle-bound
        sourceInvoiceId:
          type: string
          format: uuid
          description: Originating pos-invoice invoice id
        sourceInvoiceLineId:
          type: string
          format: uuid
          description: Originating pos-invoice invoice line id
        contractNumber:
          type: string
          description: Provider contract number
          example: RH-2026-88412
          maxLength: 100
          minLength: 0
        purchaseDate:
          type: string
          format: date
          description: Date the coverage was purchased
        expiresAt:
          type: string
          format: date
          description: Coverage end date, when bounded
        status:
          type: string
          description: Lifecycle status; defaults to ACTIVE on create
          enum:
          - ACTIVE
          - EXPIRED
          - CANCELLED
          - EXHAUSTED
      required:
      - customerId
      - policyId
      - purchaseDate
    RegistrationResponse:
      type: object
      description: Warranty registration — sold/instantiated coverage
      properties:
        id:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        sourceInvoiceId:
          type: string
          format: uuid
        sourceInvoiceLineId:
          type: string
          format: uuid
        contractNumber:
          type: string
        purchaseDate:
          type: string
          format: date
        expiresAt:
          type: string
          format: date
        status:
          type: string
          enum:
          - ACTIVE
          - EXPIRED
          - CANCELLED
          - EXHAUSTED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    ProviderRequest:
      type: object
      description: Warranty provider create/update request
      properties:
        name:
          type: string
          description: Provider display name
          example: Michelin North America
          maxLength: 255
          minLength: 0
        providerType:
          type: string
          description: Who funds the program
          enum:
          - MANUFACTURER
          - DISTRIBUTOR_PROGRAM
          - THIRD_PARTY_ADMIN
          - DEALER
        status:
          type: string
          description: Lifecycle status; defaults to ACTIVE on create
          example: ACTIVE
          pattern: ACTIVE|INACTIVE
        apVendorId:
          type: string
          format: uuid
          description: Optional pos-accounting ap_vendor.vendorId for credit matching
        manufacturerId:
          type: string
          format: uuid
          description: Optional pos-catalog ProductEntity.manufacturerId for policy lookup
        claimSubmissionMethod:
          type: string
          description: How claims are submitted to this provider
          example: Portal
          maxLength: 255
          minLength: 0
        portalUrl:
          type: string
          maxLength: 1024
          minLength: 0
        contactName:
          type: string
          maxLength: 255
          minLength: 0
        contactPhone:
          type: string
          maxLength: 50
          minLength: 0
        contactEmail:
          type: string
          format: email
          maxLength: 255
          minLength: 0
      required:
      - name
      - providerType
    ProviderResponse:
      type: object
      description: Warranty provider
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
        providerType:
          type: string
          enum:
          - MANUFACTURER
          - DISTRIBUTOR_PROGRAM
          - THIRD_PARTY_ADMIN
          - DEALER
        apVendorId:
          type: string
          format: uuid
        manufacturerId:
          type: string
          format: uuid
        claimSubmissionMethod:
          type: string
        portalUrl:
          type: string
        contactName:
          type: string
        contactPhone:
          type: string
        contactEmail:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    PolicyRequest:
      type: object
      description: Warranty policy create/update request — structured coverage terms
      properties:
        providerId:
          type: string
          format: uuid
          description: Owning warranty provider id
        name:
          type: string
          description: Program name
          example: Michelin passenger replacement — workmanship & materials
          maxLength: 255
          minLength: 0
        coverageType:
          type: string
          description: Claim type this policy covers
          enum:
          - MANUFACTURER_DEFECT
          - DEALER_WORKMANSHIP
          - ROAD_HAZARD
          - EXTENDED_PLAN
        appliesToType:
          type: string
          description: Matching scope of the appliesTo terms
          enum:
          - PRODUCT_LIST
          - CATEGORY
          - MANUFACTURER
          - ALL
        appliesToProductEntityIds:
          type: array
          description: Explicit pos-catalog productEntityIds; required when appliesToType=PRODUCT_LIST
          items:
            type: string
            format: uuid
        appliesToCategoryId:
          type: string
          format: uuid
          description: pos-catalog category id; required when appliesToType=CATEGORY
        appliesToManufacturerId:
          type: string
          format: uuid
          description: pos-catalog manufacturerId; required when appliesToType=MANUFACTURER
        effectiveFrom:
          type: string
          format: date
          description: Policy must be in effect on the original sale date
        effectiveTo:
          type: string
          format: date
        durationMonths:
          type: integer
          format: int32
          description: Time limit in months from sale date; null = unlimited
        mileageLimit:
          type: integer
          format: int32
          description: Miles from sale odometer; null = n/a
        treadPullPointThirtySeconds:
          type: integer
          format: int32
          description: 'Tires: coverage ends at this remaining depth, in 32nds of an inch'
          example: 2
          maximum: 32
          minimum: 0
        laborCovered:
          type: boolean
          description: Whether the provider reimburses install labor; defaults to false
        laborHoursCap:
          type: number
          description: Max labor hours reimbursed
          minimum: 0
        laborRateCap:
          type: number
          description: Max labor rate reimbursed
          minimum: 0
        prorationMethod:
          type: string
          description: How the credit fraction is computed
          enum:
          - NONE
          - TREAD_DEPTH
          - MILEAGE
          - TIME
        requiresPartReturn:
          type: boolean
          description: Provider demands the defective part back (drives RMA); defaults to false
        requiresPhotoEvidence:
          type: boolean
          description: Intake enforces at least one photo before submission; defaults to false
        transferable:
          type: boolean
          description: Coverage survives vehicle/owner change; defaults to false
        termsText:
          type: string
          description: Human-readable fine print
        documentUrls:
          type: array
          description: Links to the provider's policy documents
          items:
            type: string
            minLength: 1
      required:
      - appliesToType
      - coverageType
      - effectiveFrom
      - name
      - prorationMethod
      - providerId
    PolicyResponse:
      type: object
      description: Warranty policy — structured coverage terms
      properties:
        id:
          type: string
          format: uuid
        providerId:
          type: string
          format: uuid
        name:
          type: string
        coverageType:
          type: string
          enum:
          - MANUFACTURER_DEFECT
          - DEALER_WORKMANSHIP
          - ROAD_HAZARD
          - EXTENDED_PLAN
        appliesToType:
          type: string
          enum:
          - PRODUCT_LIST
          - CATEGORY
          - MANUFACTURER
          - ALL
        appliesToProductEntityIds:
          type: array
          items:
            type: string
            format: uuid
        appliesToCategoryId:
          type: string
          format: uuid
        appliesToManufacturerId:
          type: string
          format: uuid
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
        durationMonths:
          type: integer
          format: int32
        mileageLimit:
          type: integer
          format: int32
        treadPullPointThirtySeconds:
          type: integer
          format: int32
        laborCovered:
          type: boolean
        laborHoursCap:
          type: number
        laborRateCap:
          type: number
        prorationMethod:
          type: string
          enum:
          - NONE
          - TREAD_DEPTH
          - MILEAGE
          - TIME
        requiresPartReturn:
          type: boolean
        requiresPhotoEvidence:
          type: boolean
        transferable:
          type: boolean
        termsText:
          type: string
        documentUrls:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    PartReturnUpdateRequest:
      type: object
      description: Part return (RMA) lifecycle update; all fields optional
      properties:
        status:
          type: string
          description: Target status; omit for a detail-only update
          enum:
          - AWAITING_PART
          - ON_HOLD
          - SHIPPED
          - RECEIVED_BY_VENDOR
          - SCRAPPED
          - CLOSED
        disposition:
          type: string
          description: Revised disposition for the defective part
          enum:
          - HOLD_FOR_INSPECTION
          - RETURN_TO_VENDOR
          - SCRAP_AUTHORIZED
          - CUSTOMER_RETAINED
        carrier:
          type: string
          description: Shipping carrier
          maxLength: 100
          minLength: 0
        trackingNumber:
          type: string
          description: Carrier tracking number
          maxLength: 100
          minLength: 0
        shippedAt:
          type: string
          format: date-time
          description: When the part shipped; defaults to now when entering SHIPPED
        rmaNumber:
          type: string
          description: Vendor-issued RMA number
          maxLength: 100
          minLength: 0
        holdLocationNote:
          type: string
          description: Where the part sits on the physical hold shelf
          maxLength: 10000
          minLength: 0
    PartReturnResponse:
      type: object
