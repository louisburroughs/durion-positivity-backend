          type: string
          description: Program name
          example: Michelin passenger replacement — workmanship & materials
          maxLength: 255
          minLength: 0
        coverageType:
          type: string
          description: Claim type this policy covers
          enum:
          - MANUFACTURER_DEFECT
          - DEALER_WORKMANSHIP
          - ROAD_HAZARD
          - EXTENDED_PLAN
        appliesToType:
          type: string
          description: Matching scope of the appliesTo terms
          enum:
          - PRODUCT_LIST
          - CATEGORY
          - MANUFACTURER
          - ALL
