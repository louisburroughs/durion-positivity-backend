          description: Claim submitted.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
          description: Intake incomplete (no lines, missing required photos).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
          description: Claim not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
          description: Illegal transition; nextAction lists legal moves.
      security:
      - bearerAuth: []
