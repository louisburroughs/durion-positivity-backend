openapi: 3.1.0
info:
  title: Warranty API
  description: API for warranty policies, claims, settlements, reimbursements, and part returns in the POS system
  contact:
    name: Durion Support Services
    email: platform@durionpos.org
  version: '1.0'
servers:
- url: http://localhost:8097
  description: Generated server url
tags:
- name: Warranty Claims
  description: Claim intake, adjudication, and lifecycle
- name: Warranty Providers
  description: Who pays — manufacturers, program administrators, the dealer itself
- name: Warranty Part Returns
  description: Defective-part RMA lifecycle and worklist
- name: Warranty Registrations
  description: Sold/instantiated coverage — road-hazard add-ons and extended plans
- name: Warranty Settlements
  description: Execute settlements on approved warranty claims
- name: Warranty Reimbursements
  description: Vendor reimbursement lifecycle and worklist
- name: Warranty Policies
  description: Structured coverage terms — one row per distinct program
paths:
  /v1/warranty/registrations/{id}:
    get:
      tags:
      - Warranty Registrations
      summary: Get registration
      description: Retrieve a warranty registration by id
      operationId: getRegistration
      parameters:
      - name: id
        in: path
        description: Registration UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Registration returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '404':
          description: Registration not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - warranty:registration:view
    put:
      tags:
      - Warranty Registrations
      summary: Update registration
      description: Full update of an existing warranty registration
      operationId: updateRegistration
      parameters:
      - name: id
        in: path
        description: Registration UUID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
        required: true
      responses:
        '200':
          description: Registration updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '404':
          description: Registration or referenced policy not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - warranty:registration:manage
  /v1/warranty/providers/{id}:
    get:
      tags:
      - Warranty Providers
      summary: Get provider
      description: Retrieve a warranty provider by id
      operationId: getProvider
      parameters:
      - name: id
        in: path
        description: Provider UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Provider returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderResponse'
        '404':
          description: Provider not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - warranty:provider:view
    put:
      tags:
      - Warranty Providers
      summary: Update provider
      description: Full update of an existing warranty provider
      operationId: updateProvider
      parameters:
      - name: id
        in: path
        description: Provider UUID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderRequest'
        required: true
      responses:
        '200':
          description: Provider updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderResponse'
        '404':
          description: Provider not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - warranty:provider:manage
  /v1/warranty/policies/{id}:
    get:
      tags:
      - Warranty Policies
      summary: Get policy
      description: Retrieve a warranty policy by id
      operationId: getPolicy
      parameters:
      - name: id
        in: path
        description: Policy UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Policy returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponse'
        '404':
          description: Policy not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - warranty:policy:view
    put:
      tags:
      - Warranty Policies
      summary: Update policy
      description: Full update of an existing warranty policy
      operationId: updatePolicy
      parameters:
      - name: id
        in: path
        description: Policy UUID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyRequest'
        required: true
      responses:
        '200':
          description: Policy updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponse'
        '404':
          description: Policy or referenced provider not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - warranty:policy:manage
  /v1/warranty/part-returns/{id}:
    put:
      tags:
      - Warranty Part Returns
      summary: Update part return (RMA)
      description: Advances the RMA (AWAITING_PART -> ON_HOLD -> SHIPPED -> RECEIVED_BY_VENDOR, or SCRAPPED/CLOSED per disposition) and/or updates RMA details
      operationId: updatePartReturn
      parameters:
      - name: id
        in: path
        description: Part return id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartReturnUpdateRequest'
        required: true
      responses:
        '200':
          description: Part return updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartReturnResponse'
        '404':
          description: Part return not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartReturnResponse'
        '409':
          description: Illegal part-return transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartReturnResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - warranty:part-return:manage
  /v1/warranty/claims/{id}:
    get:
      tags:
      - Warranty Claims
      summary: Get claim
      description: Full detail incl. lines, settlements, reimbursements, part returns, history, notes
      operationId: getClaim
      parameters:
      - name: id
        in: path
        description: Claim UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Claim returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '404':
          description: Claim not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - warranty:claim:view
    put:
      tags:
      - Warranty Claims
      summary: Update claim
      description: Edit intake fields while DRAFT or INFO_NEEDED
      operationId: updateClaim
      parameters:
      - name: id
        in: path
        description: Claim UUID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimUpdateRequest'
        required: true
      responses:
        '200':
          description: Claim updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '404':
          description: Claim not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '409':
          description: Claim is not editable in its current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - warranty:claim:create
  /v1/warranty/claims/{id}/reimbursement:
    put:
      tags:
      - Warranty Reimbursements
      summary: Update vendor reimbursement
      description: Records a vendor decision (APPROVED/PARTIALLY_APPROVED/DENIED), credit receipt, or write-off; only legal child-lifecycle transitions are accepted
      operationId: updateReimbursement
      parameters:
      - name: id
        in: path
        description: Claim id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReimbursementUpdateRequest'
        required: true
      responses:
        '200':
          description: Reimbursement updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReimbursementResponse'
        '404':
          description: Claim or reimbursement not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReimbursementResponse'
        '409':
          description: Illegal reimbursement transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReimbursementResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - warranty:reimbursement:manage
  /v1/warranty/registrations:
    get:
      tags:
      - Warranty Registrations
      summary: Search registrations
      description: Optionally filter by customer, vehicle, and status
      operationId: searchRegistrations
      parameters:
      - name: customerId
        in: query
        description: Filter by customer id
        required: false
        schema:
          type: string
          format: uuid
      - name: vehicleId
        in: query
        description: Filter by vehicle id
        required: false
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        description: Filter by lifecycle status
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - EXPIRED
          - CANCELLED
          - EXHAUSTED
      responses:
        '200':
          description: Registrations returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistrationResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - warranty:registration:view
    post:
      tags:
      - Warranty Registrations
      summary: Create registration
      description: Record sold/instantiated coverage
      operationId: createRegistration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
        required: true
      responses:
        '201':
          description: Registration created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '404':
          description: Referenced policy not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - warranty:registration:manage
  /v1/warranty/providers:
    get:
      tags:
      - Warranty Providers
      summary: List providers
      description: Optionally filter by status and/or provider type
      operationId: listProviders
      parameters:
      - name: status
        in: query
        description: Filter by lifecycle status (ACTIVE/INACTIVE)
        required: false
        schema:
          type: string
      - name: providerType
        in: query
        description: Filter by provider type
        required: false
        schema:
          type: string
          enum:
          - MANUFACTURER
          - DISTRIBUTOR_PROGRAM
          - THIRD_PARTY_ADMIN
          - DEALER
      responses:
        '200':
          description: Providers returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - warranty:provider:view
    post:
      tags:
      - Warranty Providers
      summary: Create provider
      description: Create a new warranty provider
      operationId: createProvider
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderRequest'
        required: true
      responses:
        '201':
          description: Provider created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - warranty:provider:manage
  /v1/warranty/policies:
    get:
      tags:
      - Warranty Policies
      summary: List policies
      description: Optionally filter by provider and/or coverage type
      operationId: listPolicies
      parameters:
      - name: providerId
        in: query
        description: Filter by owning provider id
        required: false
        schema:
          type: string
          format: uuid
      - name: coverageType
        in: query
        description: Filter by coverage type
        required: false
        schema:
          type: string
          enum:
          - MANUFACTURER_DEFECT
          - DEALER_WORKMANSHIP
          - ROAD_HAZARD
          - EXTENDED_PLAN
      responses:
        '200':
          description: Policies returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - warranty:policy:view
    post:
      tags:
      - Warranty Policies
      summary: Create policy
      description: Create a new warranty policy
      operationId: createPolicy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyRequest'
        required: true
      responses:
        '201':
          description: Policy created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponse'
        '404':
          description: Referenced provider not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - warranty:policy:manage
  /v1/warranty/claims:
    get:
      tags:
      - Warranty Claims
      summary: Search claims
      description: Paged claim summaries; filter by customer, vehicle, status, claim code, location
      operationId: searchClaims
      parameters:
      - name: customerId
        in: query
        description: Filter by customer id
        required: false
        schema:
          type: string
          format: uuid
      - name: vehicleId
        in: query
        description: Filter by vehicle id
        required: false
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        description: Filter by claim status
        required: false
        schema:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - IN_REVIEW
          - INFO_NEEDED
          - APPROVED
          - DENIED
          - SETTLED
          - CLOSED
          - CANCELLED
      - name: claimCode
        in: query
        description: Exact claim code, e.g. WC-2026-000123
        required: false
        schema:
          type: string
      - name: locationId
        in: query
        description: Filter by location id
        required: false
        schema:
          type: string
          format: uuid
      - name: pageable
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Pageable'
      responses:
        '200':
          description: Claims returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageClaimSummaryResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - warranty:claim:view
    post:
      tags:
      - Warranty Claims
      summary: Create draft claim
      description: Creates a DRAFT claim; snapshots VIN/odometer
      operationId: createClaim
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimCreateRequest'
        required: true
      responses:
        '201':
          description: Claim created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - warranty:claim:create
  /v1/warranty/claims/{id}/submit:
    post:
      tags:
      - Warranty Claims
      summary: Submit claim
      description: 'Intake complete: runs eligibility, then DRAFT→SUBMITTED (or INFO_NEEDED→IN_REVIEW)'
      operationId: submitClaim
      parameters:
      - name: id
        in: path
        description: Claim UUID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Claim submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '400':
          description: Intake incomplete (no lines, missing required photos).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '404':
          description: Claim not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '409':
          description: Illegal transition; nextAction lists legal moves.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - warranty:claim:submit
  /v1/warranty/claims/{id}/settlements:
    post:
      tags:
      - Warranty Settlements
      summary: Execute a settlement
      description: 'Executes one settlement on an APPROVED (or already SETTLED) claim: creates an invoice adjustment/refund via pos-invoice for credit/refund types, links a validated replacement workorder, or records NO_ACTION. The first successful settlement moves the claim to SETTLED.'
      operationId: createSettlement
      parameters:
      - name: id
        in: path
        description: Claim id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementCreateRequest'
        required: true
      responses:
        '201':
          description: Settlement executed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementResponse'
        '404':
          description: Claim not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementResponse'
        '409':
          description: Claim is not in a settleable state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementResponse'
        '422':
          description: Referenced replacement workorder could not be resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementResponse'
        '502':
          description: pos-invoice write failed; settlement recorded as FAILED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - warranty:claim:settle
  /v1/warranty/claims/{id}/reimbursement/submit:
    post:
      tags:
      - Warranty Reimbursements
      summary: Submit vendor reimbursement
      description: Creates/updates the claim's single reimbursement NOT_SUBMITTED -> SUBMITTED; claim must be APPROVED or SETTLED and provider must not be dealer-funded
      operationId: submitReimbursement
      parameters:
      - name: id
        in: path
        description: Claim id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReimbursementSubmitRequest'
        required: true
      responses:
        '200':
          description: Reimbursement submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReimbursementResponse'
        '404':
          description: Claim or provider not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReimbursementResponse'
        '409':
          description: Claim state or reimbursement state does not allow submission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReimbursementResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - warranty:reimbursement:manage
  /v1/warranty/claims/{id}/photos:
    post:
      tags:
      - Warranty Claims
      summary: Add photo
      description: Attach a photo-evidence URL while DRAFT or INFO_NEEDED
      operationId: addPhoto
      parameters:
      - name: id
        in: path
        description: Claim UUID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimPhotoRequest'
        required: true
      responses:
        '200':
          description: Photo attached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '404':
          description: Claim not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '409':
          description: Claim is not editable in its current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - warranty:claim:create
    delete:
      tags:
      - Warranty Claims
      summary: Remove photo
      description: Detach a photo-evidence URL while DRAFT or INFO_NEEDED
      operationId: removePhoto
      parameters:
      - name: id
        in: path
        description: Claim UUID
        required: true
        schema:
          type: string
          format: uuid
      - name: url
        in: query
        description: Photo URL to detach
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Photo detached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '404':
          description: Claim or photo not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '409':
          description: Claim is not editable in its current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - warranty:claim:create
  /v1/warranty/claims/{id}/part-returns:
    post:
      tags:
      - Warranty Part Returns
      summary: Create part return (RMA)
      description: Opens the RMA lifecycle for one claim line (at most one per line); starts AWAITING_PART
      operationId: createPartReturn
      parameters:
      - name: id
        in: path
        description: Claim id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartReturnCreateRequest'
        required: true
      responses:
        '201':
          description: Part return created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartReturnResponse'
        '404':
          description: Claim or claim line not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartReturnResponse'
        '409':
          description: Line already has a part return, or claim is terminal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartReturnResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - warranty:part-return:manage
