          format: int32
          description: Original tread depth in 32nds of an inch
          example: 12
          minimum: 0
        measuredTreadDepth:
          type: integer
          format: int32
          description: Measured remaining tread depth in 32nds of an inch
          example: 6
          minimum: 0
