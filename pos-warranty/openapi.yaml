  /v1/warranty/reimbursements:
    get:
      description: 'Returns the back-office worklist of vendor reimbursements across all claims, optionally filtered by status and provider.

        Use this tool to work open vendor credits; use getClaim instead to see the reimbursement of one specific claim.

        Preconditions: none — an empty list is returned when nothing matches.

        Required inputs: status and providerId are optional query parameters and combine as AND when both are given; omitting both returns every reimbursement.

        No events are emitted and no state changes; this is a read-only projection.

        Returns 200 with the list, which is empty rather than 404 when nothing matches.

        '
      operationId: listReimbursements
      parameters:
      - description: Filter by reimbursement status
        in: query
        name: status
        required: false
        schema:
          enum:
          - NOT_SUBMITTED
          - SUBMITTED
          - APPROVED
          - PARTIALLY_APPROVED
          - DENIED
          - CREDIT_RECEIVED
          - WRITTEN_OFF
          - NOT_APPLICABLE
          type: string
      - description: Filter by warranty provider id
        in: query
        name: providerId
        required: false
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ReimbursementResponse'
                type: array
          description: Reimbursements returned.
      security:
      - bearerAuth: []
      summary: Reimbursement worklist
      tags:
      - Warranty Reimbursements
      x-required-permissions:
      - warranty:reimbursement:view
  /v1/warranty/settlements/reconciliation:
    get:
      description: 'Builds the reconciliation worklist for FAILED invoice-writing settlements by asking pos-invoice whether each adjustment or refund actually committed, matched by externalReference (the settlement id).

        Use this tool to detect double-pay risk after a settlement failure; do not retry with createSettlement until the row shows committedOnInvoice=false — committedOnInvoice=true means pos-invoice committed the money write even though warranty recorded the settlement as FAILED.

        Preconditions: none — only settlements already recorded FAILED with an invoice-writing type appear, and pos-invoice is consulted live at request time.

        Required inputs: none; there are no parameters and no request body.

        Emits a WARRANTY_SETTLEMENT_RECONCILIATION audit event; no state changes, this is a read-only cross-service check.

        Returns 200 with one row per FAILED settlement, where checkStatus UNKNOWN means pos-invoice was unreachable for that invoice and the worklist should be re-run before acting.

        '
      operationId: reconcileSettlements
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SettlementReconciliationRow'
                type: array
          description: Reconciliation worklist.
      security:
      - bearerAuth: []
      summary: Reconcile FAILED settlements against pos-invoice
      tags:
      - Warranty Settlements
      x-required-permissions:
      - warranty:claim:settle
components:
  schemas:
    CandidateLine:
      properties:
        description:
          type: string
        lineTotal:
          type: number
        photoEvidenceUrl:
          type: string
        productEntityId:
          format: uuid
          type: string
        quantity:
          type: number
        sku:
          type: string
        sourceCreatedAt:
          format: date-time
          type: string
        sourceId:
          format: uuid
          type: string
        sourceLineId:
          format: uuid
          type: string
        sourceReference:
          type: string
        sourceType:
          enum:
          - INVOICE_LINE
          - WORKORDER_PART
          - WORKORDER_SERVICE
          - MANUAL
          type: string
        unitPrice:
          type: number
      type: object
    ClaimActionRequest:
      description: Optional reason for a claim lifecycle action
      properties:
        reason:
          description: Reason recorded in the claim status history
          maxLength: 10000
          minLength: 0
          type: string
      type: object
    ClaimCreateRequest:
      description: Create a DRAFT warranty claim
      properties:
        claimType:
          description: Claim type
          enum:
          - MANUFACTURER_DEFECT
          - DEALER_WORKMANSHIP
          - ROAD_HAZARD
          - EXTENDED_PLAN
          example: MANUFACTURER_DEFECT
          type: string
        customerId:
          description: pos-customer customer id
          format: uuid
          type: string
        failureDate:
          description: Date the failure occurred or was noticed
          format: date
          type: string
        failureDescription:
          description: What failed and how
          maxLength: 10000
          minLength: 0
          type: string
        lines:
          description: Initial claim lines (may also be added later while DRAFT/INFO_NEEDED)
          items:
            $ref: '#/components/schemas/ClaimLineRequest'
          type: array
        locationId:
          description: Location where the claim is taken
          format: uuid
          type: string
        originInvoiceId:
          description: Originating invoice, when the sale was located
          format: uuid
          type: string
        originSaleDate:
          description: Original sale date (manual entry allowed for walk-ins)
          format: date
          type: string
        originWorkorderId:
          description: Originating workorder, when the sale was located
          format: uuid
          type: string
        photoEvidenceUrls:
          description: Photo evidence URLs (URL-reference pattern)
          items:
            maxLength: 2048
            minLength: 0
            type: string
          type: array
        registrationId:
          description: Registration id for registration-bound coverage, when already known
          format: uuid
          type: string
        vehicleId:
          description: pos-vehicle-inventory vehicle id; VIN + odometer are snapshotted from it
          format: uuid
          type: string
      required:
      - claimType
      - customerId
      - vehicleId
      type: object
    ClaimDecisionRequest:
      description: Approve/deny/request-info/appeal a warranty claim
      properties:
        decision:
          description: Decision action
          enum:
          - APPROVE
          - DENY
          - REQUEST_INFO
          - APPEAL
          type: string
        lineDecisions:
          description: Per-line adjudication (APPROVE/DENY only); omitted lines get defaults
          items:
            $ref: '#/components/schemas/LineDecision'
          type: array
        reason:
          description: Reason — required for DENY, APPEAL, and any decision that contradicts the computed suggestion
          maxLength: 10000
          minLength: 0
          type: string
      required:
      - decision
      type: object
    ClaimLineRequest:
      description: Warranty claim line — one failed part or service, with source provenance and snapshots
      properties:
        description:
          description: Line description snapshot
          maxLength: 512
