      properties:
        claimType:
          type: string
          description: Claim type
          enum:
          - MANUFACTURER_DEFECT
          - DEALER_WORKMANSHIP
          - ROAD_HAZARD
          - EXTENDED_PLAN
          example: MANUFACTURER_DEFECT
        customerId:
          type: string
          format: uuid
