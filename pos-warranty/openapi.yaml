      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
        providerType:
          type: string
          enum:
          - MANUFACTURER
          - DISTRIBUTOR_PROGRAM
          - THIRD_PARTY_ADMIN
          - DEALER
        apVendorId:
          type: string
          format: uuid
        manufacturerId:
