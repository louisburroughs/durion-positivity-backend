          minLength: 0
      required:
      - url
    PartReturnCreateRequest:
      type: object
      description: Create a part return (RMA) for a claim line; starts AWAITING_PART
      properties:
        claimLineId:
          type: string
          format: uuid
          description: Claim line whose failed part is being returned/held
        disposition:
          type: string
          description: What happens to the defective part
          enum:
          - HOLD_FOR_INSPECTION
          - RETURN_TO_VENDOR
          - SCRAP_AUTHORIZED
          - CUSTOMER_RETAINED
        rmaNumber:
          type: string
          description: Vendor-issued RMA number, if already assigned
          maxLength: 100
          minLength: 0
        holdLocationNote:
          type: string
          description: Where the part sits on the physical hold shelf
          maxLength: 10000
          minLength: 0
      required:
      - claimLineId
      - disposition
    ClaimNoteRequest:
      type: object
      description: Staff note to append to a warranty claim
      properties:
        note:
          type: string
          description: Note text
          maxLength: 10000
          minLength: 0
      required:
      - note
    ClaimDecisionRequest:
      type: object
      description: Approve/deny/request-info/appeal a warranty claim
      properties:
        decision:
          type: string
          description: Decision action
          enum:
          - APPROVE
          - DENY
          - REQUEST_INFO
          - APPEAL
        reason:
          type: string
          description: Reason — required for DENY, APPEAL, and any decision that contradicts the computed suggestion
          maxLength: 10000
          minLength: 0
        lineDecisions:
          type: array
          description: Per-line adjudication (APPROVE/DENY only); omitted lines get defaults
          items:
            $ref: '#/components/schemas/LineDecision'
      required:
      - decision
    LineDecision:
      type: object
      description: Per-line approved amount and disposition
      properties:
        lineId:
          type: string
          format: uuid
          description: Claim line UUID
        amountApproved:
          type: number
          description: Approved amount; defaults to the computed amountRequested on APPROVE
        lineDisposition:
          type: string
          description: Line disposition; defaults to APPROVED on APPROVE, DENIED on DENY
          enum:
          - PENDING
          - APPROVED
          - PARTIALLY_APPROVED
          - DENIED
          - WITHDRAWN
        overrideReason:
          type: string
          description: Required when amountApproved differs from the computed amountRequested; audited as a claim note
          maxLength: 10000
          minLength: 0
      required:
      - lineId
    ClaimActionRequest:
      type: object
      description: Optional reason for a claim lifecycle action
      properties:
        reason:
          type: string
          description: Reason recorded in the claim status history
          maxLength: 10000
          minLength: 0
    SettlementReconciliationRow:
      type: object
      description: FAILED settlement reconciled against pos-invoice — the double-pay-risk worklist
      properties:
        settlementId:
          type: string
          format: uuid
        claimId:
          type: string
          format: uuid
        settlementType:
          type: string
          enum:
          - REPLACEMENT_WORKORDER
          - INVOICE_CREDIT
          - REFUND
          - PRORATED_CREDIT
          - GOODWILL
          - NO_ACTION
        settlementStatus:
          type: string
          description: Always FAILED in this worklist
          enum:
          - PENDING
          - COMPLETED
          - FAILED
        invoiceId:
          type: string
          format: uuid
        externalReference:
          type: string
          description: Idempotency key warranty sent to pos-invoice (the settlement id)
        committedOnInvoice:
          type: boolean
          description: Whether pos-invoice committed the write; null when checkStatus is UNKNOWN
        matchedAdjustmentId:
          type: string
          format: uuid
        matchedRefundId:
          type: string
          format: uuid
        checkStatus:
          type: string
          enum:
          - CONFIRMED_COMMITTED
          - CONFIRMED_ABSENT
          - UNKNOWN
        coveredAmount:
          type: number
        customerAmount:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    ClaimSummaryResponse:
      type: object
      description: Warranty claim summary (search result row)
      properties:
        id:
          type: string
          format: uuid
        claimCode:
          type: string
        claimType:
          type: string
          enum:
          - MANUFACTURER_DEFECT
          - DEALER_WORKMANSHIP
          - ROAD_HAZARD
          - EXTENDED_PLAN
        status:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - IN_REVIEW
          - INFO_NEEDED
          - APPROVED
          - DENIED
          - SETTLED
          - CLOSED
          - CANCELLED
        customerId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        vin:
          type: string
        locationId:
          type: string
          format: uuid
        failureDate:
          type: string
          format: date
        eligibilityResult:
          type: string
          enum:
          - ELIGIBLE
          - INELIGIBLE
          - INDETERMINATE
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PageClaimSummaryResponse:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: '#/components/schemas/ClaimSummaryResponse'
        number:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/SortObject'
        pageable:
          $ref: '#/components/schemas/PageableObject'
        numberOfElements:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        sort:
          $ref: '#/components/schemas/SortObject'
        paged:
          type: boolean
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        unpaged:
          type: boolean
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean
    CandidateLine:
      type: object
      properties:
        sourceType:
          type: string
          enum:
          - INVOICE_LINE
          - WORKORDER_PART
          - WORKORDER_SERVICE
          - MANUAL
        sourceId:
          type: string
          format: uuid
        sourceLineId:
          type: string
          format: uuid
        sourceReference:
          type: string
        productEntityId:
          type: string
          format: uuid
        sku:
          type: string
        description:
          type: string
        quantity:
          type: number
        unitPrice:
          type: number
        lineTotal:
          type: number
        sourceCreatedAt:
          type: string
          format: date-time
        photoEvidenceUrl:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
