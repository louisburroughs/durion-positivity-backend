      properties:
        id:
          type: string
          format: uuid
        claimId:
          type: string
          format: uuid
        claimLineId:
          type: string
          format: uuid
        rmaNumber:
          type: string
        disposition:
          type: string
          enum:
          - HOLD_FOR_INSPECTION
          - RETURN_TO_VENDOR
          - SCRAP_AUTHORIZED
          - CUSTOMER_RETAINED
        status:
          type: string
          enum:
          - AWAITING_PART
          - ON_HOLD
          - SHIPPED
          - RECEIVED_BY_VENDOR
          - SCRAPPED
          - CLOSED
        carrier:
          type: string
        trackingNumber:
          type: string
        shippedAt:
          type: string
          format: date-time
        holdLocationNote:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ClaimUpdateRequest:
