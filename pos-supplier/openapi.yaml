          format: int32
          type: integer
        linesReported:
          description: Lines the vendor reported.
          example: 12500
          format: int32
          type: integer
        protocolVersion:
          description: Norm version the fetch used.
          example: EDIWHEEL_B-2.1
          type: string
        snapshotAsOf:
          description: Vendor-stated instant the stock picture describes (vendor time). Staleness is judged against this, never against fetchedAt.
          format: date-time
          type: string
        snapshotId:
          description: Immutable snapshot identity; the handle the lines endpoint pages by.
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
          format: uuid
          type: string
        status:
          description: Outcome of the fetch. A FAILED or EMPTY snapshot is a recorded answer, not an error.
          enum:
          - COMPLETED
          - EMPTY
          - REJECTED
          - FAILED
          example: COMPLETED
          type: string
        supplierRef:
          description: Profile alias at fetch time; descriptive only.
          example: michelin-eu
          type: string
        vendorProfileId:
          description: Vendor profile the report was fetched for.
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
          format: uuid
          type: string
      type: object
    SupplierStockAvailability:
      description: 'Live availability of one catalog product across every enabled stock-inquiry vendor, for one receiving location. Partial by design: each vendor answers (or fails) independently, carried as a per-vendor status. An empty vendors list means no vendor is configured for stock inquiry — a valid answer, not an error.'
      properties:
        deliveryLocationId:
          description: The receiving location every vendor was asked about.
          format: uuid
          type: string
        productId:
          description: The resolved catalog product, echoed even when the caller asked by SKU.
          format: uuid
          type: string
        requestedQuantity:
          description: The quantity whose availability was checked.
          format: int32
          type: integer
        stalenessThreshold:
          description: The backend-configured availability staleness threshold, as an ISO-8601 duration. Echoed so every client judges freshness by the same rule; staleness is evaluated from each vendor's asOf.
          type: string
        vendors:
          description: One entry per enabled stock-inquiry vendor; empty when none is configured.
          items:
            $ref: '#/components/schemas/SupplierStockAvailabilityVendor'
          type: array
      type: object
    SupplierStockAvailabilityLine:
      description: 'One vendor''s answer about the product. Carries no EAN/UPC/vendor article codes — product identity mapping is a backend implementation detail. availableQuantity is the canonical item/piece count: no unit of measure travels because none exists in the supplier wire data.'
      properties:
        availableQuantity:
          description: Quantity the vendor can supply, as a canonical item/piece count. Null when the vendor stated no quantity; zero only when the status is UNAVAILABLE, meaning the vendor stated it has none.
          format: int32
          type: integer
        currency:
          description: ISO 4217 currency of the quoted price, when quoted.
          type: string
        earliestDeliveryDate:
          description: Earliest date the vendor promised any quantity, when stated.
          format: date
          type: string
        quotedUnitPrice:
          description: Quoted unit price, when the vendor norm carries one.
          type: number
        status:
          description: What the vendor said about the article.
          enum:
          - AVAILABLE
          - UNAVAILABLE
          - NOT_LISTED
          - NOT_ANSWERED
          type: string
      type: object
    SupplierStockAvailabilityVendor:
      description: One vendor's live answer about the product, or the reason it gave none. fetchedAt is when this platform obtained the answer (a cached answer keeps its original fetch instant); asOf is the observation time the vendor stated, and staleness is judged from asOf alone.
      properties:
        asOf:
          description: The observation instant the vendor stated for its answer; the fetch instant when the vendor norm states none. Null when the vendor gave no answer. This is a different fact from fetchedAt.
          format: date-time
          type: string
        fetchedAt:
          description: When this platform obtained the answer. A cached answer carries the instant of the original vendor call, not of the cache hit. Null when the vendor gave no answer.
          format: date-time
          type: string
        lines:
          description: Per-article answers; empty unless the vendor answered.
          items:
            $ref: '#/components/schemas/SupplierStockAvailabilityLine'
          type: array
        stale:
          description: Whether asOf is older than the echoed stalenessThreshold. Null exactly when asOf is null.
          type: boolean
        status:
          description: 'Whether this vendor answered: OK and NOT_LISTED are answers; SUPPLIER_UNAVAILABLE covers failure AND a vendor that had not answered by the fan-out deadline; CAPABILITY_NOT_CONFIGURED and CONFIGURATION_ERROR are deployment states.'
          enum:
          - OK
          - SUPPLIER_UNAVAILABLE
          - NOT_LISTED
          - CAPABILITY_NOT_CONFIGURED
          - CONFIGURATION_ERROR
          type: string
        vendorDisplayName:
          description: The vendor profile's display name.
          type: string
        vendorProfileId:
          description: The vendor profile that was asked.
          format: uuid
          type: string
      type: object
    TransmissionResolutionRequest:
      properties:
        action:
          enum:
          - CONFIRM_WITH_VENDOR_REFERENCE
          - MARK_NOT_RECEIVED
          - CANCEL
          type: string
        evidence:
          maxLength: 2000
          minLength: 0
          type: string
        supplierOrderNumber:
          maxLength: 64
          minLength: 0
          type: string
      required:
      - action
      - evidence
      type: object
    VendorProfileRequest:
      description: 'Create/update payload for a vendor profile — one configured supplier connection (ADR-0050 §1/§2). The configuration source is never client-settable: profiles created here are ADMIN-managed.'
      properties:
        connectTimeoutMillis:
          description: Default connect timeout for the profile's bindings, in milliseconds. Must be > 0 when present; omit to use the deployment default.
          example: 5000
          format: int32
          type: integer
        displayName:
          description: Admin-screen display name. Never blank.
          example: Michelin Europe
          type: string
        enabled:
          description: Whether the profile's bindings resolve at all. A disabled profile resolves every capability to a typed not-configured outcome.
          example: true
          type: boolean
        maxRetries:
          description: Default pre-send retry budget for the profile's bindings. Must be >= 0 when present; omit to use the deployment default. Only pre-send failures are retried.
          example: 2
          format: int32
          type: integer
        readTimeoutMillis:
          description: Default read timeout for the profile's bindings, in milliseconds. Must be > 0 when present; omit to use the deployment default.
          example: 30000
          format: int32
          type: integer
        retryBackoff:
          description: Default retry backoff strategy. Omit to use the deployment default.
          enum:
          - FIXED
          - EXPONENTIAL
          example: EXPONENTIAL
          type: string
        sandbox:
          description: Whether the profile runs against the vendor's sandbox environment (ADR-0050 §2 sandbox overlay).
          example: false
          type: boolean
        sandboxBaseUrlOverride:
          description: Base URL the profile's bindings use while sandbox is set (ADR-0050 §2). Omit to leave the bindings' own base URLs unchanged; never blank when present.
          example: https://sandbox.ediwheel.example/api
          type: string
        supplierRef:
          description: Unique human-readable profile alias (ADR-0050 §1). Never blank. Identifies the configuration, and is never used as an identifier across a contract boundary.
          example: michelin-eu
          type: string
      type: object
    VendorProfileView:
      description: Read model of a vendor profile. Child collections (auth configs, commercial accounts, endpoint bindings) are read through their own list operations.
      properties:
        connectTimeoutMillis:
          description: Default connect timeout for the profile's bindings, in milliseconds. Must be > 0 when present; omit to use the deployment default.
          example: 5000
          format: int32
          type: integer
        displayName:
          description: Admin-screen display name. Never blank.
          example: Michelin Europe
          type: string
        enabled:
          description: Whether the profile's bindings resolve at all. A disabled profile resolves every capability to a typed not-configured outcome.
          example: true
          type: boolean
        maxRetries:
          description: Default pre-send retry budget for the profile's bindings. Must be >= 0 when present; omit to use the deployment default. Only pre-send failures are retried.
          example: 2
          format: int32
          type: integer
        readTimeoutMillis:
          description: Default read timeout for the profile's bindings, in milliseconds. Must be > 0 when present; omit to use the deployment default.
          example: 30000
          format: int32
          type: integer
        retryBackoff:
          description: Default retry backoff strategy. Omit to use the deployment default.
          enum:
          - FIXED
          - EXPONENTIAL
          example: EXPONENTIAL
          type: string
        sandbox:
          description: Whether the profile runs against the vendor's sandbox environment (ADR-0050 §2 sandbox overlay).
          example: false
          type: boolean
        sandboxBaseUrlOverride:
          description: Base URL the profile's bindings use while sandbox is set (ADR-0050 §2). Omit to leave the bindings' own base URLs unchanged; never blank when present.
          example: https://sandbox.ediwheel.example/api
          type: string
        sourceOfTruth:
          description: Authoritative configuration source (ADR-0050 §6). Every mutation is rejected with 409 while this is YAML.
          enum:
          - YAML
          - ADMIN
          example: ADMIN
          type: string
        supplierRef:
          description: Unique human-readable profile alias (ADR-0050 §1). Never blank. Identifies the configuration, and is never used as an identifier across a contract boundary.
          example: michelin-eu
          type: string
        vendorProfileId:
          description: Platform identity of the profile (UUIDv7, ADR-0050 §1).
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
          format: uuid
          type: string
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
