        '500':
          description: Stored content exists but could not be decrypted — a malformed envelope, a key this deployment does not hold, or a failed integrity check. The typed code distinguishes which; the detail is logged server-side and never returned. The read is still recorded, with an UNREADABLE outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Authentication is missing or the bearer token is invalid. The response has NO body: the gateway rejects unauthenticated calls with a bodiless status, so clients must not attempt to parse an error envelope here.'
        '403':
          description: Authenticated caller lacks supplier:audit:read. A denied read discloses nothing and is deliberately NOT written to the access trail.
