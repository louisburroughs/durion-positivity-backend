      - bearerAuth: []
      x-required-permissions:
      - supplier:profile:write
  /v1/supplier/admin/profiles:
    get:
      tags:
      - Supplier Vendor Profiles
      summary: List vendor profiles
      description: All vendor profiles, ordered by supplierRef
      operationId: listProfiles
      responses:
        '200':
          description: Profiles returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VendorProfileView'
        '401':
          description: 'Authentication is missing or the bearer token is invalid. The response has NO body: the gateway rejects unauthenticated calls with a bodiless status, so clients must not attempt to parse an error envelope here.'
        '403':
          description: Authenticated caller lacks the required supplier permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth: []
      x-required-permissions:
      - supplier:profile:read
    post:
      tags:
      - Supplier Vendor Profiles
      summary: Create vendor profile
      description: Create an ADMIN-managed vendor profile; supplierRef must be unique
      operationId: createProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorProfileRequest'
        required: true
      responses:
        '201':
          description: Profile created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorProfileView'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: supplierRef already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
