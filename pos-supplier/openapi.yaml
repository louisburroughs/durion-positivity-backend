  /v1/supplier/admin/price-catalog/{vendorProfileId}/unmatched-lines:
    get:
      description: 'Returns a page of PRICAT lines that could not be attached to a catalog product, newest first, each

        with the reason it was quarantined. By default only open lines are listed — a line stays listed

        until a later import or re-application matches it — and resolved=true flips the listing to closed

        lines instead, for auditing what a catalog fix healed.

        Use this tool to work the catalog-data backlog a vendor catalog exposes; do not use it for the

        run-level totals those lines roll up into, which is listSupplierPriceCatalogImports instead.

        Preconditions: the caller must hold supplier:pricecatalog:read.

        Required inputs: vendorProfileId (UUIDv7) path parameter; page defaults to 0 and size defaults to

        50 with a maximum of 200. Optional filters: reason keeps one quarantine reason, search is a

        case-insensitive contains-match over the line''s EAN, vendor article code and cross-reference code

        (LIKE metacharacters are treated literally), and dateFrom/dateTo bound fetchedAt as a half-open

        window — dateFrom inclusive, dateTo exclusive.

        Emits a SUPPLIER_PRICECATALOG_UNMATCHED_LIST event; no state changes and no vendor call is made.

        Returns 200 with an empty items array when the quarantine is clear or nothing matches the filters,

        and 400 when the page size is outside the permitted range or a filter value does not parse.

        '
      operationId: listSupplierPriceCatalogUnmatchedLines
      parameters:
      - description: Vendor profile whose quarantine to list (UUIDv7).
        in: path
        name: vendorProfileId
        required: true
        schema:
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
          format: uuid
          type: string
      - description: Narrow to one quarantine reason.
        in: query
        name: reason
        required: false
        schema:
          enum:
          - NO_IDENTIFIER
          - NO_CATALOG_MATCH
          - AMBIGUOUS_CATALOG_MATCH
          - CATALOG_UNAVAILABLE
          - DUPLICATE_LINE
          - MALFORMED_LINE
          type: string
      - description: Case-insensitive contains-match over the line's EAN, vendor article code and cross-reference code. LIKE metacharacters are treated literally, so a pasted code containing an underscore matches itself, not a wildcard.
        in: query
        name: search
        required: false
        schema:
          example: '3528709999083'
          type: string
      - description: Inclusive lower bound on fetchedAt (ISO-8601 instant).
        in: query
        name: dateFrom
        required: false
        schema:
          format: date-time
          type: string
      - description: Exclusive upper bound on fetchedAt (ISO-8601 instant); the window is half-open so adjacent windows tile without listing a boundary line twice.
        in: query
        name: dateTo
        required: false
        schema:
          format: date-time
          type: string
      - description: 'True lists resolved lines instead of the open worklist. Omitted or false keeps the default the worklist has always had: open lines only.'
        in: query
        name: resolved
        required: false
        schema:
          default: false
          type: boolean
      - description: Zero-based page index.
        in: query
        name: page
        required: false
        schema:
          example: 0
          minimum: 0
          type: integer
      - description: Page size, 1–200.
        in: query
        name: size
        required: false
        schema:
          default: 50
          example: 50
          maximum: 200
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponse'
          description: A page of open quarantined lines, newest first.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Page size outside the permitted range.
        '401':
          description: 'Authentication is missing or the bearer token is invalid. The response has NO body: the gateway rejects unauthenticated calls with a bodiless status, so clients must not attempt to parse an error envelope here.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated caller lacks supplier:pricecatalog:read.
      security:
      - bearerAuth: []
      summary: List quarantined price-catalog lines
      tags:
      - Supplier Price Catalog
      x-required-permissions:
      - supplier:pricecatalog:read
