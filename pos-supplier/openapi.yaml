openapi: 3.1.0
info:
  contact:
    email: platform@durionpos.org
    name: Durion Support Services
  description: API for supplier vendor profile administration — profiles, auth configs, commercial accounts, and capability endpoint bindings (ADR-0050)
  title: Supplier API
  version: '1.0'
servers:
- description: Generated server url
  url: http://localhost:8099
tags:
- description: Admin CRUD over vendor auth configs — secret references only, never plaintext credentials
  name: Supplier Auth Configs
- description: Trigger vendor PRICAT imports and read their bookkeeping and unmatched-line quarantine. No vendor prices are served here; they travel as supplier.pricecatalog.updated events.
  name: Supplier Price Catalog
- description: On-demand vendor invoice retrieval
  name: Supplier Invoices
- description: Admin CRUD over vendor commercial accounts — billing and per-location delivery numbers
  name: Supplier Commercial Accounts
- description: Fleet workorder authorization and lookups
  name: Supplier Fleet Authorization
- description: 'Read fetched vendor stock-report snapshots: latest-snapshot metadata per vendor profile, and paged lines of one immutable snapshot. No endpoint here contacts a vendor.'
  name: Supplier Stock Snapshots
- description: Live availability of one catalog product across every enabled stock-inquiry vendor. The backend resolves catalog identity to vendor article codes internally and fans out concurrently under a deadline; per-vendor failure is a status on a 200 body, never an error.
  name: Supplier Stock Availability
- description: Admin CRUD over vendor profiles — one row per configured supplier connection
  name: Supplier Vendor Profiles
- description: Read the supplier exchange-audit trail. Metadata is free to browse; reading stored payload content requires the same permission and is itself recorded.
  name: Supplier Exchange Audit
- description: 'Ask a vendor, live, what stock it holds for a receiving location. Vendor-side failure is reported as a status on a 200 response, never as an error status: callers are expected to degrade and render without live stock rather than fail their own flow.'
  name: Supplier Stock Inquiry
- description: Admin CRUD over capability endpoint bindings — capability → (family, version, URL, auth)
  name: Supplier Endpoint Bindings
- description: Read the purchase-order transmission ledger and resolve transmissions awaiting manual review. No endpoint here places or re-sends an order.
  name: Supplier Order Transmission
- description: Manufacturer marketing enrichment (MKCAT C1.2)
  name: Supplier Marketing Catalog
paths:
  /v1/supplier/admin/audit/exchanges:
    get:
      description: 'Returns a page of exchange-audit metadata for one vendor profile within a half-open time window,

        newest first.

        Use this tool to find the exchangeAuditId of a supplier call; use traceSupplierCorrelation instead

        when every attempt of one logical call is wanted, and do not expect payload content here.

        Preconditions: the caller must hold supplier:audit:read, which supplier:profile:read does not

        imply; the vendor profile need not still exist, because audit history outlives configuration.

        Required inputs: vendorProfileId, from (inclusive) and to (exclusive) as ISO-8601 instants;

        capability is optional, page defaults to 0 and size defaults to 50 with a maximum of 200.

        Emits a SUPPLIER_AUDIT_EXCHANGE_LIST event; no payload content is served, so no access row is

        written against the exchanges listed.

        Returns 400 when the window end is not after its start, the capability key is unrecognised, or the

        page size is out of range.

        '
      operationId: listSupplierExchanges
      parameters:
      - description: 'Vendor profile whose exchanges to list. A query filter rather than a path segment because audit history deliberately outlives the profile: exchanges of a deleted profile are still listed here.'
        in: query
        name: vendorProfileId
        required: true
        schema:
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
          format: uuid
          type: string
      - description: Window start, INCLUSIVE. ISO-8601 instant.
        in: query
        name: from
        required: true
        schema:
          example: 2026-08-01 00:00:00+00:00
          format: date-time
          type: string
      - description: Window end, EXCLUSIVE, and must be after 'from'. Half-open so adjacent windows tile without listing a boundary attempt twice.
        in: query
        name: to
        required: true
        schema:
          example: 2026-09-01 00:00:00+00:00
          format: date-time
          type: string
      - description: Canonical capability key to narrow to. Omit for all capabilities. An unrecognised key is rejected rather than silently matching nothing.
        in: query
        name: capability
        required: false
        schema:
          example: STOCK_INQUIRY
          type: string
      - description: Zero-based page index.
        in: query
        name: page
        required: false
        schema:
          example: 0
          minimum: 0
          type: integer
      - description: Page size, at most 200.
        in: query
        name: size
        required: false
        schema:
          example: 50
          maximum: 200
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponseExchangeAuditSummary'
          description: A page of exchange metadata, newest first.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request — window end not after its start, unknown capability key, or a page size outside the permitted range.
        '401':
          description: 'Authentication is missing or the bearer token is invalid. The response has NO body: the gateway rejects unauthenticated calls with a bodiless status, so clients must not attempt to parse an error envelope here.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated caller lacks supplier:audit:read. Profile-admin permissions do not grant audit access.
      security:
      - bearerAuth: []
      summary: List supplier exchanges in a window
      tags:
      - Supplier Exchange Audit
      x-required-permissions:
      - supplier:audit:read
  /v1/supplier/admin/audit/exchanges/by-correlation/{correlationId}:
    get:
      description: 'Returns every exchange attempt sharing one correlation id, oldest first, which is the order in

        which a retry sequence actually happened.

        Use this tool when a single logical supplier call needs to be reconstructed across its retries; use

        listSupplierExchanges instead to search a time window.

        Preconditions: the caller must hold supplier:audit:read; an unknown correlation id is not an error

        and yields an empty page.

        Required inputs: correlationId path parameter; page defaults to 0 and size defaults to 50 with a

        maximum of 200.

        Emits a SUPPLIER_AUDIT_EXCHANGE_TRACE event; metadata only, so no payload access is recorded.

        Returns 400 when the page size is outside the permitted range.

        '
      operationId: traceSupplierCorrelation
      parameters:
      - description: Correlation id shared by every attempt of one logical supplier call.
        in: path
        name: correlationId
        required: true
        schema:
          example: 018f0a1b2c3d7e4f8a9b0c1d2e3f4a71
          type: string
      - description: Zero-based page index.
        in: query
        name: page
        required: false
        schema:
          example: 0
          minimum: 0
          type: integer
      - description: Page size, at most 200.
        in: query
        name: size
        required: false
        schema:
          example: 50
          maximum: 200
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponseExchangeAuditSummary'
          description: A page of exchange metadata, oldest first.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request — page size outside the permitted range.
        '401':
          description: 'Authentication is missing or the bearer token is invalid. The response has NO body: the gateway rejects unauthenticated calls with a bodiless status, so clients must not attempt to parse an error envelope here.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated caller lacks supplier:audit:read.
      security:
      - bearerAuth: []
      summary: Trace one logical call by correlation id
      tags:
      - Supplier Exchange Audit
      x-required-permissions:
      - supplier:audit:read
  /v1/supplier/admin/audit/exchanges/{exchangeAuditId}:
    get:
      description: 'Returns the metadata of a single supplier exchange attempt, without any payload content.

        Use this tool to check requestPayloadPresent and responsePayloadPresent before calling

        readSupplierExchangePayload, which is recorded; do not use it to read the documents themselves.

        Preconditions: the caller must hold supplier:audit:read and the exchange-audit record must exist.

        Required inputs: exchangeAuditId (UUIDv7) path parameter; there is no request body.

        Emits a SUPPLIER_AUDIT_EXCHANGE_GET event; because no content is served, no access row is written.

        Returns 404 when no exchange-audit record has that id.

        '
      operationId: getSupplierExchange
      parameters:
      - description: Exchange-audit record identifier (UUIDv7).
        in: path
        name: exchangeAuditId
        required: true
        schema:
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a70
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeAuditSummary'
          description: Exchange metadata returned.
        '401':
          description: 'Authentication is missing or the bearer token is invalid. The response has NO body: the gateway rejects unauthenticated calls with a bodiless status, so clients must not attempt to parse an error envelope here.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated caller lacks supplier:audit:read.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No exchange-audit record with that id.
      security:
      - bearerAuth: []
      summary: Get one exchange's audit metadata
      tags:
      - Supplier Exchange Audit
      x-required-permissions:
      - supplier:audit:read
  /v1/supplier/admin/audit/exchanges/{exchangeAuditId}/accesses:
    get:
      description: 'Returns the access trail for one exchange, newest first: who read its payload, when, and what the

        read yielded.

        Use this tool to audit who has seen a trading partner''s documents; do not expect metadata browsing

        or denied attempts here, because a 403 disclosed nothing and is deliberately not recorded.

        Preconditions: the caller must hold supplier:audit:read; an unknown exchangeAuditId returns an

        empty page rather than 404, because access rows carry no foreign key to the exchange.

        Required inputs: exchangeAuditId (UUIDv7) path parameter; page defaults to 0 and size defaults to

        50 with a maximum of 200.

        Emits a SUPPLIER_AUDIT_ACCESS_LIST event; reading this trail is not itself recorded, or every

        inspection would generate the noise the next one has to sift.

        Returns 400 when the page size is outside the permitted range.

        '
      operationId: listSupplierExchangeAccesses
      parameters:
      - description: 'Exchange-audit record whose access trail to list. An unknown id returns an empty page rather than 404: ''nobody read it'' is the honest answer, and access rows carry no foreign key to the exchange by design.'
        in: path
        name: exchangeAuditId
        required: true
        schema:
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a70
          format: uuid
          type: string
      - description: Zero-based page index.
        in: query
        name: page
        required: false
        schema:
          example: 0
          minimum: 0
          type: integer
      - description: Page size, at most 200.
        in: query
        name: size
        required: false
        schema:
          example: 50
          maximum: 200
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponseExchangeAuditAccessView'
          description: A page of access records, newest first.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid request — page size outside the permitted range.
        '401':
          description: 'Authentication is missing or the bearer token is invalid. The response has NO body: the gateway rejects unauthenticated calls with a bodiless status, so clients must not attempt to parse an error envelope here.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated caller lacks supplier:audit:read.
      security:
      - bearerAuth: []
      summary: List who read one exchange's payload content
      tags:
      - Supplier Exchange Audit
      x-required-permissions:
      - supplier:audit:read
  /v1/supplier/admin/audit/exchanges/{exchangeAuditId}/payload:
    get:
      description: 'Returns the stored request and response documents of one supplier exchange.

        Use this tool only when the documents themselves are needed; use getSupplierExchange instead for

        routine inspection, because this call is itself recorded and each read adds an access row naming the

        caller.

        Preconditions: the caller must hold supplier:audit:read, the record must exist, and the access row

        must be writable, since content is withheld when it cannot be written.

        Required inputs: exchangeAuditId (UUIDv7) path parameter; there is no request body and no way to

        request the unredacted originals.

        Emits a SUPPLIER_AUDIT_PAYLOAD_READ event and writes an access row in the same transaction; null

        payload fields are normal, meaning a METADATA_ONLY binding, a bodiless exchange, or content already

        purged after 400 days, and a redacted flag means sensitive fields were replaced at capture time so

        the originals were never stored.

        Returns 404 when no record has that id, and 500 when stored content exists but cannot be decrypted,

        in which case the read is still recorded with an UNREADABLE outcome.

        '
      operationId: readSupplierExchangePayload
      parameters:
      - description: Exchange-audit record whose stored content to read.
        in: path
        name: exchangeAuditId
        required: true
        schema:
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a70
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeAuditPayloadView'
          description: Stored content returned, and the read has been recorded.
        '401':
          description: 'Authentication is missing or the bearer token is invalid. The response has NO body: the gateway rejects unauthenticated calls with a bodiless status, so clients must not attempt to parse an error envelope here.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated caller lacks supplier:audit:read. A denied read discloses nothing and is deliberately NOT written to the access trail.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No exchange-audit record with that id. A record that exists but holds no payload is NOT a 404 — it returns 200 with null content.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Stored content exists but could not be decrypted — a malformed envelope, a key this deployment does not hold, or a failed integrity check. The typed code distinguishes which; the detail is logged server-side and never returned. The read is still recorded, with an UNREADABLE outcome.
      security:
      - bearerAuth: []
      summary: Read one exchange's stored payload content
      tags:
      - Supplier Exchange Audit
      x-required-permissions:
      - supplier:audit:read
  /v1/supplier/admin/price-catalog/{vendorProfileId}/freshness:
    get:
      description: 'Returns how fresh one vendor profile''s price catalog is: latestEffectiveDate — the newest catalog

        document date the vendor itself stated on a completed import, which is vendor document metadata —

        kept strictly apart from lastFetchedAt, the platform''s own last retrieval attempt over every run

        including failed and empty ones. Alongside them: lastCompletedAt, the open unmatched-line count,

        the backend-configured staleness threshold (ISO-8601 duration) with the stale verdict it implies,

        and each PRICE_CATALOG binding''s schedule plus its scheduler-lease state (checkpointAt,

        lastRunOutcome, lastRunStartedAt). Window and checkpoint fields are null for full-snapshot

        protocols — every current PRICAT protocol: B4.0 fetches the vendor''s whole catalog, so there is no

        retrieval window to advance.

        Use this tool to answer "can these vendor prices be trusted today" in one read; do not use it for

        run-by-run history, which is listSupplierPriceCatalogImports.

        Preconditions: the caller must hold supplier:pricecatalog:read; the profile need not have imported

        anything — a never-fetched profile reports stale=true with null timestamps, not an error.

        Required inputs: vendorProfileId (UUIDv7) as a path parameter.

        Emits a SUPPLIER_PRICECATALOG_FRESHNESS_GET event; no state changes and no vendor call is made,

        and the stale verdict is computed server-side against the returned threshold — catalog-currency

        policy unrelated to any cache TTL — so every client behaves consistently.

        Returns 200 with the freshness view, and 404 only when the vendor profile does not exist.

        '
      operationId: getSupplierPriceCatalogFreshness
      parameters:
      - description: Vendor profile whose catalog freshness to read (UUIDv7).
        in: path
        name: vendorProfileId
        required: true
        schema:
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceCatalogFreshnessView'
          description: The profile's catalog freshness; a never-imported profile is stale, not an error.
        '401':
          description: 'Authentication is missing or the bearer token is invalid. The response has NO body: the gateway rejects unauthenticated calls with a bodiless status, so clients must not attempt to parse an error envelope here.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated caller lacks supplier:pricecatalog:read.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No vendor profile exists with the supplied id.
      security:
      - bearerAuth: []
      summary: Read a vendor price-catalog's freshness
      tags:
      - Supplier Price Catalog
      x-required-permissions:
      - supplier:pricecatalog:read
  /v1/supplier/admin/price-catalog/{vendorProfileId}/imports:
    get:
      description: 'Returns a page of PRICAT import runs for one vendor profile, newest first, including failed and

        empty runs with their line counters.

        Use this tool to answer whether a catalog feed is healthy and how much of it matched; do not use

        it to see which specific lines are waiting on catalog work, which is

        listSupplierPriceCatalogUnmatchedLines instead.

        Preconditions: the caller must hold supplier:pricecatalog:read; the profile need not have imported

        anything, in which case the page is empty.

        Required inputs: vendorProfileId (UUIDv7) path parameter; page defaults to 0 and size defaults to

        50 with a maximum of 200. Optional filters: bindingId narrows a profile''s history to one endpoint

        binding (runs recorded before binding ids were persisted carry none and never match), status keeps

        one run status, and dateFrom/dateTo bound fetchedAt as a half-open window — dateFrom inclusive,

        dateTo exclusive.

        Emits a SUPPLIER_PRICECATALOG_IMPORT_LIST event; no state changes and no vendor call is made.

        Returns 200 with an empty items array when the profile has never imported or nothing matches the

        filters, so an empty result is not an error, and 400 when the page size is outside the permitted

        range or a filter value does not parse.

        '
      operationId: listSupplierPriceCatalogImports
      parameters:
      - description: Vendor profile whose imports to list (UUIDv7).
        in: path
        name: vendorProfileId
        required: true
        schema:
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
          format: uuid
          type: string
      - description: Narrow to runs fetched over one endpoint binding (UUIDv7). Runs recorded before binding ids were persisted carry none and never match this filter.
        in: query
        name: bindingId
        required: false
        schema:
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5e
          format: uuid
          type: string
      - description: Narrow to one run status.
        in: query
        name: status
        required: false
        schema:
          enum:
          - IN_PROGRESS
          - COMPLETED
          - EMPTY
          - FAILED
          type: string
      - description: Inclusive lower bound on fetchedAt (ISO-8601 instant).
        in: query
        name: dateFrom
        required: false
        schema:
          format: date-time
          type: string
      - description: Exclusive upper bound on fetchedAt (ISO-8601 instant); the window is half-open so adjacent windows tile without listing a boundary run twice.
        in: query
        name: dateTo
        required: false
        schema:
          format: date-time
          type: string
      - description: Zero-based page index.
        in: query
        name: page
        required: false
        schema:
          example: 0
          minimum: 0
          type: integer
      - description: Page size, 1–200.
        in: query
        name: size
        required: false
        schema:
          default: 50
          example: 50
          maximum: 200
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponse'
          description: A page of import summaries, newest first.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Page size outside the permitted range.
        '401':
          description: 'Authentication is missing or the bearer token is invalid. The response has NO body: the gateway rejects unauthenticated calls with a bodiless status, so clients must not attempt to parse an error envelope here.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated caller lacks supplier:pricecatalog:read.
      security:
      - bearerAuth: []
      summary: List vendor price-catalog imports
      tags:
      - Supplier Price Catalog
      x-required-permissions:
      - supplier:pricecatalog:read
    post:
      description: 'Fetches the vendor''s current PRICAT document for a profile''s buyer account, stages every line, and

        publishes the matched lines as chunked supplier.pricecatalog.updated events plus one

        supplier.pricecatalog.import.completed event.

        Use this tool to pull a catalog now — after a vendor price change or a catalog fix that should

        make quarantined lines matchable; do not use it to read results, which is listSupplierPriceCatalogImports.

        Preconditions: the profile must exist and be enabled, its PRICE_CATALOG capability must be bound to

        a registered codec, and it must have a billing account; the run is synchronous and can take minutes

        for a large catalog.

        Required inputs: vendorProfileId (UUIDv7) as a path parameter; there is no request body and no

        partial-catalog option — B4.0 returns the whole catalog for the buyer account.

        Emits a SUPPLIER_PRICECATALOG_IMPORT_TRIGGER event, writes exchange-audit rows for the vendor call,

        and appends staged lines; nothing is ever deleted or overwritten, so a failed or empty fetch leaves

        the previous import as the latest word on this vendor''s prices.

        Returns 200 with a terminal summary whose status may be FAILED or EMPTY — a vendor outage is

        reported in the summary rather than as an error — 404 when the profile does not exist, and 409 when

        the capability is not configured for the profile.

        '
      operationId: triggerSupplierPriceCatalogImport
      parameters:
      - description: Vendor profile to import for (UUIDv7).
        in: path
        name: vendorProfileId
        required: true
        schema:
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceCatalogImportSummary'
          description: Terminal summary of the run, including FAILED and EMPTY outcomes.
        '401':
          description: 'Authentication is missing or the bearer token is invalid. The response has NO body: the gateway rejects unauthenticated calls with a bodiless status, so clients must not attempt to parse an error envelope here.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated caller lacks supplier:pricecatalog:import.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No vendor profile exists with the supplied id.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: The profile is disabled, or PRICE_CATALOG is not bound to a registered codec.
      security:
      - bearerAuth: []
      summary: Trigger a vendor price-catalog import
      tags:
      - Supplier Price Catalog
      x-required-permissions:
      - supplier:pricecatalog:import
  /v1/supplier/admin/price-catalog/{vendorProfileId}/quarantine/reapply:
    post:
      description: 'Re-matches the profile''s open unmatched-line quarantine against the current product-code replica

        and applies whatever now resolves, staging it and publishing it exactly as an import would — with

        no call to the vendor.

        Use this tool after a catalog fix, or after the product-code replica has been seeded, to close

        lines that were quarantined for a reason that no longer holds; do not use it to fetch fresh

        prices, which is triggerSupplierPriceCatalogImport.

        Preconditions: the profile must exist; lines that carried no identifier and lines whose values

        never decoded are skipped, because no catalog fix can rescue them.

        Required inputs: vendorProfileId (UUIDv7) as a path parameter; there is no request body, and the

        batch size is a deployment setting rather than a caller choice.

        Emits a SUPPLIER_PRICECATALOG_REAPPLY event and creates one re-application manifest per origin

        import — a quarantine spans every import that left a line open, and each manifest carries one

        vendor document''s identity — closing the lines it matched and publishing their prices; the

        original imports'' counters are left untouched, because they record what the vendor sent at the time.

        Returns 200 with one summary per healed import, 204 when nothing matched — the healthy steady

        state, not a failure — and 404 when the profile does not exist.

        '
      operationId: reapplySupplierPriceCatalogQuarantine
      parameters:
      - description: Vendor profile whose quarantine to work (UUIDv7).
        in: path
        name: vendorProfileId
        required: true
        schema:
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PriceCatalogImportSummary'
                type: array
          description: One summary per origin import that had lines resolve.
        '204':
          description: 'Nothing in the quarantine resolved. The response has NO body: an empty result is the healthy steady state, not an error envelope to parse.'
        '401':
