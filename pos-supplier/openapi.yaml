openapi: 3.1.0
info:
  title: Supplier API
  description: API for supplier vendor profile administration — profiles, auth configs, commercial accounts, and capability endpoint bindings (ADR-0050)
  contact:
    name: Durion Support Services
    email: platform@durionpos.org
  version: '1.0'
servers:
- url: http://localhost:8099
  description: Generated server url
tags:
- name: Supplier Auth Configs
  description: Admin CRUD over vendor auth configs — secret references only, never plaintext credentials
- name: Supplier Price Catalog
  description: Trigger vendor PRICAT imports and read their bookkeeping and unmatched-line quarantine. No vendor prices are served here; they travel as supplier.pricecatalog.updated events.
- name: Supplier Invoices
  description: On-demand vendor invoice retrieval
- name: Supplier Commercial Accounts
  description: Admin CRUD over vendor commercial accounts — billing and per-location delivery numbers
- name: Supplier Endpoint Bindings
  description: Admin CRUD over capability endpoint bindings — capability → (family, version, URL, auth)
- name: Supplier Order Transmission
  description: Read the purchase-order transmission ledger and resolve transmissions awaiting manual review. No endpoint here places or re-sends an order.
- name: Supplier Vendor Profiles
  description: Admin CRUD over vendor profiles — one row per configured supplier connection
- name: Supplier Exchange Audit
  description: Read the supplier exchange-audit trail. Metadata is free to browse; reading stored payload content requires the same permission and is itself recorded.
- name: Supplier Stock Inquiry
  description: 'Ask a vendor, live, what stock it holds for a receiving location. Vendor-side failure is reported as a status on a 200 response, never as an error status: callers are expected to degrade and render without live stock rather than fail their own flow.'
paths:
  /v1/supplier/admin/profiles/{vendorProfileId}:
    get:
      tags:
      - Supplier Vendor Profiles
      summary: Get vendor profile
      description: 'Returns one vendor profile with its timeouts, retry settings, sandbox overlay and whether it is

        ADMIN-managed or YAML-managed.

        Use this tool when the vendorProfileId is already known; use listVendorProfiles instead to search

        by supplierRef.

        Preconditions: the profile must exist.

        Required inputs: vendorProfileId (UUIDv7) path parameter; there is no request body.

        Emits a SUPPLIER_PROFILE_GET audit event; no configuration is changed.

        Returns 404 when no profile exists for the supplied id.

        '
      operationId: getVendorProfile
      parameters:
      - name: vendorProfileId
        in: path
        description: Vendor profile identifier (UUIDv7). Must reference an existing vendor profile.
        required: true
        schema:
          type: string
          format: uuid
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
      responses:
        '200':
          description: Profile returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorProfileView'
        '404':
          description: Profile not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Authentication is missing or the bearer token is invalid. The response has NO body: the gateway rejects unauthenticated calls with a bodiless status, so clients must not attempt to parse an error envelope here.'
        '403':
          description: Authenticated caller lacks the required supplier permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth: []
      x-required-permissions:
      - supplier:profile:read
    put:
      tags:
      - Supplier Vendor Profiles
      summary: Update vendor profile
      description: 'Replaces every settable field of a vendor profile, including its alias, display name, enabled and

        sandbox flags and default timeouts.

        Use this tool to change connection defaults or take a supplier out of service by clearing

        enabled; do not use it on YAML-managed profiles, whose source of truth is the deployment

        configuration instead.

        Preconditions: the profile must exist, must be ADMIN-managed, and the supplierRef in the body

        must not belong to a different profile.

        Required inputs: vendorProfileId (UUIDv7) path parameter plus the full body, because every field

        is replaced; omitting an optional field resets it to the deployment default rather than leaving

        the stored value.

        Emits a SUPPLIER_PROFILE_UPDATE audit event; disabling a profile immediately makes its bindings

        resolve to a typed not-configured outcome.

        Returns 404 when the profile does not exist, 409 when it is YAML-managed or the supplierRef is

        taken, and 400 when a required field is blank or a timeout is not greater than zero.

        '
      operationId: updateVendorProfile
      parameters:
      - name: vendorProfileId
        in: path
        description: Vendor profile identifier (UUIDv7). Must reference an existing vendor profile.
        required: true
        schema:
          type: string
          format: uuid
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
      requestBody:
        description: Replacement values for every settable field of the vendor profile.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorProfileRequest'
            examples:
              Enabled production profile:
                description: Enabled production profile
                value:
                  supplierRef: michelin-eu
                  displayName: Michelin Europe
                  enabled: true
                  sandbox: false
                  connectTimeoutMillis: 5000
                  readTimeoutMillis: 30000
                  maxRetries: 2
                  retryBackoff: EXPONENTIAL
        required: true
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorProfileView'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Profile not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Profile is YAML-managed or supplierRef already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Authentication is missing or the bearer token is invalid. The response has NO body: the gateway rejects unauthenticated calls with a bodiless status, so clients must not attempt to parse an error envelope here.'
        '403':
          description: Authenticated caller lacks the required supplier permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth: []
      x-required-permissions:
      - supplier:profile:write
    delete:
      tags:
      - Supplier Vendor Profiles
      summary: Delete vendor profile
      description: 'Deletes a vendor profile together with its accounts, auth config and endpoint bindings.

        Use this tool only when a supplier connection is being retired permanently; to stop traffic while

        keeping the configuration, call updateVendorProfile with enabled cleared instead.

        Preconditions: the profile must exist and must be ADMIN-managed, because YAML-managed profiles

        are owned by the deployment configuration.

        Required inputs: vendorProfileId (UUIDv7) path parameter; there is no request body and no

        confirmation flag.

        Emits a SUPPLIER_PROFILE_DELETE audit event and cascades to the profile''s child configuration;

        exchange audit records already written are retained.

        Returns 404 when the profile does not exist and 409 when it is YAML-managed.

        '
      operationId: deleteVendorProfile
      parameters:
      - name: vendorProfileId
        in: path
        description: Vendor profile identifier (UUIDv7). Must reference an existing vendor profile.
        required: true
        schema:
          type: string
          format: uuid
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
      responses:
        '204':
          description: Profile deleted.
        '404':
          description: Profile not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Profile is YAML-managed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Authentication is missing or the bearer token is invalid. The response has NO body: the gateway rejects unauthenticated calls with a bodiless status, so clients must not attempt to parse an error envelope here.'
        '403':
          description: Authenticated caller lacks the required supplier permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth: []
      x-required-permissions:
      - supplier:profile:write
  /v1/supplier/admin/profiles/{vendorProfileId}/bindings/{bindingId}:
    put:
      tags:
      - Supplier Endpoint Bindings
      summary: Update endpoint binding
      description: 'Replaces every settable field of an endpoint binding, including its capability, adapter version,

        URL, auth config, schedule, enabled flag and audit capture level.

        Use this tool to repoint a capability or take it out of service by clearing enabled; do not use

        it to bind a second capability, which is createEndpointBinding.

        Preconditions: the profile must exist and be ADMIN-managed, the binding must belong to it, and a

        changed capability must not already be bound elsewhere on the profile.

        Required inputs: vendorProfileId and bindingId (UUIDv7) path parameters plus the full body,

        because every field is replaced; omitting captureLevel resets it to the deployment default rather

        than leaving the stored value.

        Emits a SUPPLIER_BINDING_UPDATE audit event; a disabled binding immediately reports the typed

        CAPABILITY_NOT_CONFIGURED outcome with HTTP 200 rather than failing.

        Returns 404 when the profile or binding does not exist, 409 when the profile is YAML-managed or

        the capability is already bound, and 400 when the capability, protocol family or auth config name

        is unknown.

        '
      operationId: updateEndpointBinding
      parameters:
      - name: vendorProfileId
        in: path
        description: Owning vendor profile identifier (UUIDv7). Must reference an existing vendor profile.
        required: true
        schema:
          type: string
          format: uuid
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
      - name: bindingId
        in: path
        description: Endpoint binding identifier (UUIDv7). Must belong to the vendor profile in the path.
        required: true
        schema:
          type: string
          format: uuid
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a60
      requestBody:
        description: Endpoint binding to store in place of the existing one, mapping one capability to a vendor endpoint.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndpointBindingRequest'
            examples:
              Stock inquiry over EDIWHEEL A2.5:
                description: Stock inquiry over EDIWHEEL A2.5
                value:
                  capability: STOCK_INQUIRY
                  protocolFamily: EDIWHEEL_A25
                  version: A2_5
                  baseUrl: https://edi.michelin.example/a25
                  path: /stock/inquiry
                  authConfigName: ediwheel-basic
                  enabled: true
                  captureLevel: REDACTED
        required: true
      responses:
        '200':
          description: Binding updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointBindingView'
        '400':
          description: Invalid request — unknown capability/protocol-family key, unknown auth config name, or invalid cron schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Profile or binding not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Profile is YAML-managed or capability already bound.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Authentication is missing or the bearer token is invalid. The response has NO body: the gateway rejects unauthenticated calls with a bodiless status, so clients must not attempt to parse an error envelope here.'
        '403':
          description: Authenticated caller lacks the required supplier permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth: []
      x-required-permissions:
      - supplier:profile:write
    delete:
      tags:
      - Supplier Endpoint Bindings
      summary: Delete endpoint binding
      description: 'Removes an endpoint binding, which disables that one capability for the vendor profile.

        Use this tool when a capability is retired for a supplier; to pause it while keeping the

        configuration, call updateEndpointBinding with enabled cleared instead, since a disabled binding

        behaves exactly as an absent one.

        Preconditions: the profile must exist and be ADMIN-managed, and the binding must belong to it.

        Required inputs: vendorProfileId and bindingId (UUIDv7) path parameters; there is no request

        body.

        Emits a SUPPLIER_BINDING_DELETE audit event; the capability then resolves to the typed

        CAPABILITY_NOT_CONFIGURED outcome, and exchange audit rows already written are retained.

        Returns 404 when the profile or binding does not exist, and 409 when the profile is YAML-managed.

        '
      operationId: deleteEndpointBinding
      parameters:
      - name: vendorProfileId
        in: path
        description: Owning vendor profile identifier (UUIDv7). Must reference an existing vendor profile.
        required: true
        schema:
          type: string
          format: uuid
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
      - name: bindingId
        in: path
        description: Endpoint binding identifier (UUIDv7). Must belong to the vendor profile in the path.
        required: true
        schema:
          type: string
          format: uuid
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a60
      responses:
        '204':
          description: Binding deleted.
        '404':
          description: Profile or binding not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Profile is YAML-managed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Authentication is missing or the bearer token is invalid. The response has NO body: the gateway rejects unauthenticated calls with a bodiless status, so clients must not attempt to parse an error envelope here.'
        '403':
          description: Authenticated caller lacks the required supplier permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth: []
      x-required-permissions:
      - supplier:profile:write
  /v1/supplier/admin/profiles/{vendorProfileId}/auth-configs/{authConfigId}:
    put:
      tags:
      - Supplier Auth Configs
      summary: Update auth config
      description: 'Replaces the name, credential scheme and secret references of an existing auth config.

        Use this tool to rotate which references a connection resolves or to switch credential scheme; do

        not use it to rename a config that endpoint bindings still reference, because bindings resolve it

        by name and the rename is rejected.

        Preconditions: the profile must exist and be ADMIN-managed, the auth config must belong to it,

        and a new name must be free and unreferenced.

        Required inputs: vendorProfileId and authConfigId (UUIDv7) path parameters plus the full body,

        because every field is replaced; omitting a reference field clears it, which fails validation

        when the declared type requires it.

        Emits a SUPPLIER_AUTHCONFIG_UPDATE audit event; the new references take effect on the next

        outbound call, and the response omits every reference value.

        Returns 404 when the profile or config does not exist, 409 when the profile is YAML-managed or

        the name is in use or still referenced, and 400 when the reference set does not match the

        declared type.

        '
      operationId: updateAuthConfig
      parameters:
      - name: vendorProfileId
        in: path
        description: Owning vendor profile identifier (UUIDv7). Must reference an existing vendor profile.
        required: true
        schema:
          type: string
          format: uuid
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
      - name: authConfigId
        in: path
        description: Auth config identifier (UUIDv7). Must belong to the vendor profile in the path.
        required: true
        schema:
          type: string
          format: uuid
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a61
      requestBody:
        description: Auth config to store in place of the existing one. Every secret field is a reference, never a plaintext credential.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthConfigRequest'
            examples:
              Basic auth plus API key:
                description: Basic auth plus API key
                value:
                  name: ediwheel-basic
                  type: BASIC_PLUS_APIKEY
                  usernameRef: env:MICHELIN_EDI_USER
                  passwordRef: env:MICHELIN_EDI_PASSWORD
                  apiKeyRef: env:MICHELIN_EDI_APIKEY
                  apiKeyHeader: apikey
        required: true
      responses:
        '200':
          description: Auth config updated (without credential reference values).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfigView'
        '400':
          description: Invalid request or incomplete/malformed secret references.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Profile or auth config not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Profile is YAML-managed, name in use, or config referenced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Authentication is missing or the bearer token is invalid. The response has NO body: the gateway rejects unauthenticated calls with a bodiless status, so clients must not attempt to parse an error envelope here.'
        '403':
          description: Authenticated caller lacks the required supplier permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth: []
      x-required-permissions:
      - supplier:profile:write
    delete:
      tags:
      - Supplier Auth Configs
      summary: Delete auth config
      description: 'Removes an auth config from a vendor profile.

        Use this tool when a credential scheme is retired; do not call it to rotate credentials, where

        updateAuthConfig repoints the references instead, and repoint or delete the endpoint bindings

        that name it first, because deletion is rejected while any binding still references it.

        Preconditions: the profile must exist and be ADMIN-managed, the config must belong to it, and no

        endpoint binding may reference it.

        Required inputs: vendorProfileId and authConfigId (UUIDv7) path parameters; there is no request

        body.

        Emits a SUPPLIER_AUTHCONFIG_DELETE audit event; the referenced secrets themselves are untouched,

        since only the reference is stored here.

        Returns 404 when the profile or config does not exist, and 409 when the profile is YAML-managed

        or a binding still references the config.

        '
      operationId: deleteAuthConfig
      parameters:
      - name: vendorProfileId
        in: path
        description: Owning vendor profile identifier (UUIDv7). Must reference an existing vendor profile.
        required: true
        schema:
          type: string
          format: uuid
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
      - name: authConfigId
        in: path
        description: Auth config identifier (UUIDv7). Must belong to the vendor profile in the path.
        required: true
        schema:
          type: string
          format: uuid
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a61
      responses:
        '204':
          description: Auth config deleted.
        '404':
          description: Profile or auth config not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Profile is YAML-managed or config still referenced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Authentication is missing or the bearer token is invalid. The response has NO body: the gateway rejects unauthenticated calls with a bodiless status, so clients must not attempt to parse an error envelope here.'
        '403':
          description: Authenticated caller lacks the required supplier permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth: []
      x-required-permissions:
      - supplier:profile:write
  /v1/supplier/admin/profiles/{vendorProfileId}/accounts/{accountId}:
    put:
      tags:
      - Supplier Commercial Accounts
      summary: Update commercial account
      description: 'Replaces the role, account number, agency code and location mapping of an existing commercial

        account.

        Use this tool to correct a vendor-assigned account number or move a DELIVERY account to another

        location; do not use it to add a second account, which is createCommercialAccount.

        Preconditions: the profile must exist and be ADMIN-managed, the account must belong to that

        profile, and the target slot must not already be occupied by another account.

        Required inputs: vendorProfileId and accountId (UUIDv7) path parameters plus the full body,

        because every field is replaced; omitting agencyCode clears it.

        Emits a SUPPLIER_ACCOUNT_UPDATE audit event; orders already transmitted under the previous

        account number are unaffected.

        Returns 404 when the profile or account does not exist, 409 when the profile is YAML-managed or

        the account slot is taken, and 400 when accountNumber is blank or deliveryLocationId does not

        match the role.

        '
      operationId: updateCommercialAccount
      parameters:
      - name: vendorProfileId
        in: path
        description: Owning vendor profile identifier (UUIDv7). Must reference an existing vendor profile.
        required: true
        schema:
          type: string
          format: uuid
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
      - name: accountId
        in: path
        description: Commercial account identifier (UUIDv7). Must belong to the vendor profile in the path.
        required: true
        schema:
          type: string
          format: uuid
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a62
      requestBody:
        description: Commercial account to store in place of the existing one on the vendor profile.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommercialAccountRequest'
            examples:
              Delivery account for one location:
                description: Delivery account for one location
                value:
                  role: DELIVERY
                  accountNumber: FR-0042871
                  agencyCode: PAR01
                  deliveryLocationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a70
        required: true
      responses:
        '200':
          description: Account updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialAccountView'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Profile or account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Profile is YAML-managed or account slot already taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Authentication is missing or the bearer token is invalid. The response has NO body: the gateway rejects unauthenticated calls with a bodiless status, so clients must not attempt to parse an error envelope here.'
        '403':
          description: Authenticated caller lacks the required supplier permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth: []
      x-required-permissions:
      - supplier:profile:write
    delete:
      tags:
      - Supplier Commercial Accounts
      summary: Delete commercial account
      description: 'Removes a commercial account from a vendor profile, freeing its BILLING or per-location DELIVERY

        slot.

        Use this tool when a location stops ordering from the supplier; to change the account number

        instead, call updateCommercialAccount, which preserves the slot.

        Preconditions: the profile must exist and be ADMIN-managed, and the account must belong to that

        profile.

        Required inputs: vendorProfileId and accountId (UUIDv7) path parameters; there is no request body.

        Emits a SUPPLIER_ACCOUNT_DELETE audit event; ordering for the mapped location resolves to a

        not-configured outcome from that point on.

        Returns 404 when the profile or account does not exist, and 409 when the profile is YAML-managed.

        '
      operationId: deleteCommercialAccount
      parameters:
      - name: vendorProfileId
        in: path
        description: Owning vendor profile identifier (UUIDv7). Must reference an existing vendor profile.
        required: true
        schema:
          type: string
          format: uuid
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
      - name: accountId
        in: path
        description: Commercial account identifier (UUIDv7). Must belong to the vendor profile in the path.
        required: true
        schema:
          type: string
          format: uuid
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a62
      responses:
        '204':
          description: Account deleted.
        '404':
          description: Profile or account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Profile is YAML-managed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Authentication is missing or the bearer token is invalid. The response has NO body: the gateway rejects unauthenticated calls with a bodiless status, so clients must not attempt to parse an error envelope here.'
        '403':
          description: Authenticated caller lacks the required supplier permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth: []
      x-required-permissions:
      - supplier:profile:write
  /v1/supplier/transmissions/{transmissionIntentId}/resolve:
    post:
      tags:
      - Supplier Order Transmission
      summary: Resolve a transmission awaiting manual review
      description: 'Applies one of the three ADR-0052 §4 resolutions to a transmission whose outcome could not be

        established automatically: confirm-with-vendor-reference (the vendor accepted it),

        mark-not-received (the vendor never got it — the intent ends and is never re-sent), or cancel.

        Use this tool only after establishing the facts with the vendor; do not use it to retry a

        transmission, which no endpoint offers because a blind re-send is how a purchase order becomes two

        deliveries. Re-ordering after mark-not-received is a fresh request from the ordering domain, which

        mints a new transmission intent and a new vendor document id.

        Preconditions: the caller must hold supplier:transmission:resolve, the transmission must exist and

        be in state MANUAL_REVIEW, and the operator must have established the facts with the vendor —

        every other state either has a definite outcome already or is still being worked on

        automatically.

        Required inputs: transmissionIntentId (UUIDv7) as a path parameter, and a body carrying the action

        plus free-text evidence; supplierOrderNumber is additionally required when confirming.

        Emits a SUPPLIER_TRANSMISSION_RESOLVE event, records the actor and their evidence on the

        transmission, and publishes supplier.order.confirmed or supplier.order.rejected for the

        purchase-order timeline. The change is permanent — resolved transmissions are terminal.

        Returns 200 with the resolved transmission, 400 when the evidence or vendor reference is missing,

        404 when no such transmission exists, and 409 when the transmission is not awaiting manual review.

        '
      operationId: resolveSupplierTransmission
      parameters:
      - name: transmissionIntentId
        in: path
        description: Transmission intent id (UUIDv7).
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: 'The resolution to apply and the operator''s evidence for it. The evidence is stored and published on the resulting event: weeks later it is the only record of why the system believes a vendor did or did not receive this order.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransmissionResolutionRequest'
            examples:
              Vendor confirmed by phone:
                description: Vendor confirmed by phone
                value:
                  action: CONFIRM_WITH_VENDOR_REFERENCE
                  evidence: Called Michelin order desk 2026-08-14 09:40; they hold the order under MICH-770412 and confirmed the delivery is scheduled.
                  supplierOrderNumber: MICH-770412
              Vendor never received it:
                description: Vendor never received it
                value:
                  action: MARK_NOT_RECEIVED
                  evidence: Michelin order desk searched by our reference and by buyer account for 2026-08-14 and found nothing; re-ordering will be raised as a new purchase-order revision.
        required: true
      responses:
        '200':
          description: The transmission after resolution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderTransmissionStatus'
        '400':
          description: The request is missing evidence, or a vendor reference when confirming.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No transmission exists with the supplied id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The transmission is not awaiting manual review, so it cannot be resolved by hand.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Authentication is missing or the bearer token is invalid. The response has NO body: the gateway rejects unauthenticated calls with a bodiless status, so clients must not attempt to parse an error envelope here.'
        '403':
          description: The caller lacks supplier:transmission:resolve.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth: []
      x-required-permissions:
      - supplier:transmission:resolve
  /v1/supplier/stock/inquiries:
    post:
      tags:
      - Supplier Stock Inquiry
      summary: Ask a vendor for live stock availability
      description: 'Places a real-time availability inquiry with the vendor bound to the given profile, for the given receiving location, and returns what the vendor said; availability is consignee-specific, so an answer for one location is never valid for another.

        Use this tool when a decision depends on what a vendor holds right now — composing a product page, quoting procurement; do not use it to read a vendor''s prices, which arrive as price-catalogue events and are read from the price catalogue instead.

        Preconditions: the caller must hold supplier:stock:inquire, and the vendor profile must exist, be enabled, carry a STOCK_INQUIRY binding and map a delivery account to the receiving location; a profile meeting none of these is reported as a status rather than an error.

        Required inputs: a JSON body carrying inquiryId, vendorProfileId, deliveryLocationId and at least one line with a quantity of one or more and at least one article identifier.

        Emits a SUPPLIER_STOCK_INQUIRY event; the inquiry creates nothing and changes nothing, so it is safe to repeat, and repeating it within the cache window returns the same answer without a second vendor call.

        Returns 200 with a status for every outcome including vendor failure — OK means the vendor answered and the per-article outcomes are on the lines, SUPPLIER_UNAVAILABLE means it did not answer usefully, NOT_LISTED means it carries none of the inquired articles, CAPABILITY_NOT_CONFIGURED means this deployment has not bound stock inquiry for the vendor, and CONFIGURATION_ERROR means the profile is bound and wrong and is raised before any vendor call; a null quantity means the vendor stated nothing while a quantity of zero means it stated that it has none, and only the second justifies telling a customer an article is out of stock.

        Returns 400 when the body is malformed — a missing identifier, an empty line list, a line with no article identity, or a quantity below one.

        Returns 403 when the caller lacks supplier:stock:inquire.

        '
      operationId: inquireSupplierStock
      requestBody:
        description: 'The inquiry: which vendor to ask, which receiving location the question is about, and the articles to ask about.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockInquiryRequest'
            examples:
              oneArticle:
                description: oneArticle
                value:
                  inquiryId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                  vendorProfileId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
                  deliveryLocationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5f
                  lines:
                  - articleEan: '4019238001234'
                    requestedQuantity: 4
        required: true
      responses:
        '200':
          description: The inquiry was processed. Read `status` before reading the lines — a non-OK status carries no vendor data, and that is the normal degraded case rather than an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockInquiryResponse'
              examples:
                answered:
                  description: answered
                  value:
                    inquiryId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
                    status: OK
                    lines:
                    - articleEan: '4019238001234'
                      status: AVAILABLE
                      availableQuantity: 8
                      earliestDeliveryDate: 2026-08-20
                    asOf: 2026-08-14 12:00:00+00:00
        '400':
          description: 'The request body is malformed: a missing identifier, an empty line list, a line with no article identity, or a quantity below 1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Authentication is missing or the bearer token is invalid. The response has NO body: the gateway rejects unauthenticated calls with a bodiless status, so clients must not attempt to parse an error envelope here.'
        '403':
          description: The caller lacks `supplier:stock:inquire`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth: []
      x-required-permissions:
      - supplier:stock:inquire
  /v1/supplier/invoices/{supplierRef}/fetches:
    post:
      tags:
      - Supplier Invoices
      summary: Fetch Vendor Invoices For A Window
      description: 'Asks a vendor for the invoices it issued between two dates and imports the ones not already held.

        Use this tool when somebody is chasing an invoice a vendor says it sent; do not use it to catch a schedule up, because it deliberately leaves the checkpoint alone and the scheduled run will still cover its own window.

        Preconditions: the vendor profile must be enabled and have an invoice-fetch binding configured; fromDate must not be after toDate.

        Required inputs: supplierRef path parameter, and fromDate and toDate query parameters as ISO dates.

        Emits a SUPPLIER_INVOICE_FETCH event and, for each invoice not already held, publishes it for the accounting domain to record as a vendor bill.

        Returns 200 with the number fetched and the number new, 422 when the vendor refused the window or could not be reached, and 404 when the vendor profile or its binding is not configured.

        '
      operationId: fetchSupplierInvoices
      parameters:
      - name: supplierRef
        in: path
        description: Vendor profile alias
        required: true
        schema:
          type: string
      - name: fromDate
        in: query
        description: First issue date to fetch, inclusive
        required: true
        schema:
          type: string
          format: date
      - name: toDate
        in: query
        description: Last issue date to fetch, inclusive
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Window fetched
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Vendor profile or invoice binding not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: The vendor refused the window or could not be reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth:
        - supplier:invoice:fetch
      x-required-permissions:
      - supplier:invoice:fetch
