  /v1/supplier/admin/audit/exchanges:
    get:
      tags:
      - Supplier Exchange Audit
      summary: List supplier exchanges in a window
      description: 'Exchange metadata for one vendor profile within a half-open time window (from inclusive, to exclusive), newest first. Payload content is NOT included and nothing is recorded: browsing the trail discloses no commercial content. Rows whose stored content cannot be decrypted still list normally, because this query never touches the encrypted columns.'
      operationId: listExchanges
      parameters:
      - name: vendorProfileId
        in: query
        description: 'Vendor profile whose exchanges to list. A query filter rather than a path segment because audit history deliberately outlives the profile: exchanges of a deleted profile are still listed here.'
        required: true
        schema:
          type: string
          format: uuid
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
      - name: from
        in: query
        description: Window start, INCLUSIVE. ISO-8601 instant.
        required: true
        schema:
          type: string
          format: date-time
          example: 2026-08-01 00:00:00+00:00
      - name: to
        in: query
        description: Window end, EXCLUSIVE, and must be after 'from'. Half-open so adjacent windows tile without listing a boundary attempt twice.
        required: true
        schema:
          type: string
          format: date-time
          example: 2026-09-01 00:00:00+00:00
      - name: capability
        in: query
        description: Canonical capability key to narrow to. Omit for all capabilities. An unrecognised key is rejected rather than silently matching nothing.
        required: false
        schema:
          type: string
          example: STOCK_INQUIRY
      - name: page
        in: query
        description: Zero-based page index.
        required: false
        schema:
          type: integer
          example: 0
          minimum: 0
      - name: size
        in: query
        description: Page size, at most 200.
        required: false
        schema:
          type: integer
          example: 50
          maximum: 200
          minimum: 1
      responses:
        '200':
          description: A page of exchange metadata, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponseExchangeAuditSummary'
        '400':
          description: Invalid request — window end not after its start, unknown capability key, or a page size outside the permitted range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Authentication is missing or the bearer token is invalid. The response has NO body: the gateway rejects unauthenticated calls with a bodiless status, so clients must not attempt to parse an error envelope here.'
        '403':
          description: Authenticated caller lacks supplier:audit:read. Profile-admin permissions do not grant audit access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth: []
      x-required-permissions:
      - supplier:audit:read
  /v1/supplier/admin/audit/exchanges/{exchangeAuditId}:
    get:
      tags:
      - Supplier Exchange Audit
      summary: Get one exchange's audit metadata
      description: Metadata of a single attempt, without payload content. Use this to decide whether content exists (requestPayloadPresent / responsePayloadPresent) before making the recorded payload call.
      operationId: getExchange
      parameters:
      - name: exchangeAuditId
        in: path
        description: Exchange-audit record identifier (UUIDv7).
        required: true
        schema:
          type: string
          format: uuid
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a70
      responses:
        '200':
          description: Exchange metadata returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeAuditSummary'
        '404':
          description: No exchange-audit record with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Authentication is missing or the bearer token is invalid. The response has NO body: the gateway rejects unauthenticated calls with a bodiless status, so clients must not attempt to parse an error envelope here.'
        '403':
          description: Authenticated caller lacks supplier:audit:read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth: []
      x-required-permissions:
      - supplier:audit:read
  /v1/supplier/admin/audit/exchanges/{exchangeAuditId}/payload:
    get:
      tags:
      - Supplier Exchange Audit
      summary: Read one exchange's stored payload content
      description: 'Returns the stored request and response documents. THIS CALL IS ITSELF RECORDED (ADR-0050 §7): an access row naming the caller is written in the same transaction, and the content is withheld if that row cannot be written. Null payload fields are a normal state, not an error — a METADATA_ONLY binding captured none, the exchange carried no body, or retention has already purged the content after 400 days. When ''redacted'' is true the documents are not the wire bytes: sensitive fields were replaced at capture time and the originals were never stored.'
      operationId: readPayload
      parameters:
      - name: exchangeAuditId
        in: path
        description: Exchange-audit record whose stored content to read.
        required: true
        schema:
          type: string
          format: uuid
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a70
      responses:
        '200':
          description: Stored content returned, and the read has been recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeAuditPayloadView'
        '404':
          description: No exchange-audit record with that id. A record that exists but holds no payload is NOT a 404 — it returns 200 with null content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Stored content exists but could not be decrypted — a malformed envelope, a key this deployment does not hold, or a failed integrity check. The typed code distinguishes which; the detail is logged server-side and never returned. The read is still recorded, with an UNREADABLE outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Authentication is missing or the bearer token is invalid. The response has NO body: the gateway rejects unauthenticated calls with a bodiless status, so clients must not attempt to parse an error envelope here.'
        '403':
          description: Authenticated caller lacks supplier:audit:read. A denied read discloses nothing and is deliberately NOT written to the access trail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth: []
      x-required-permissions:
      - supplier:audit:read
  /v1/supplier/admin/audit/exchanges/{exchangeAuditId}/accesses:
    get:
      tags:
      - Supplier Exchange Audit
      summary: List who read one exchange's payload content
      description: 'The ADR-0050 §7 access trail for one exchange, newest first: who read it, when, and what the read yielded. Only payload reads appear here. Metadata browsing does not, and neither do denied attempts — a 403 disclosed nothing. Reading this trail is not itself recorded, or every inspection would generate the noise the next one has to sift.'
      operationId: listAccesses
      parameters:
      - name: exchangeAuditId
        in: path
        description: 'Exchange-audit record whose access trail to list. An unknown id returns an empty page rather than 404: ''nobody read it'' is the honest answer, and access rows carry no foreign key to the exchange by design.'
        required: true
        schema:
          type: string
          format: uuid
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a70
      - name: page
        in: query
        description: Zero-based page index.
        required: false
        schema:
          type: integer
          example: 0
          minimum: 0
      - name: size
        in: query
        description: Page size, at most 200.
        required: false
        schema:
          type: integer
          example: 50
          maximum: 200
          minimum: 1
      responses:
        '200':
          description: A page of access records, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponseExchangeAuditAccessView'
        '400':
          description: Invalid request — page size outside the permitted range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Authentication is missing or the bearer token is invalid. The response has NO body: the gateway rejects unauthenticated calls with a bodiless status, so clients must not attempt to parse an error envelope here.'
        '403':
          description: Authenticated caller lacks supplier:audit:read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth: []
      x-required-permissions:
      - supplier:audit:read
  /v1/supplier/admin/audit/exchanges/by-correlation/{correlationId}:
    get:
      tags:
      - Supplier Exchange Audit
      summary: Trace one logical call by correlation id
      description: Every attempt sharing a correlation id, OLDEST FIRST — the order in which a retry sequence actually happened. Metadata only; nothing is recorded.
      operationId: traceCorrelation
      parameters:
      - name: correlationId
        in: path
        description: Correlation id shared by every attempt of one logical supplier call.
        required: true
        schema:
          type: string
          example: 018f0a1b2c3d7e4f8a9b0c1d2e3f4a71
      - name: page
        in: query
        description: Zero-based page index.
        required: false
        schema:
          type: integer
          example: 0
          minimum: 0
      - name: size
        in: query
        description: Page size, at most 200.
        required: false
        schema:
          type: integer
          example: 50
          maximum: 200
          minimum: 1
      responses:
        '200':
          description: A page of exchange metadata, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponseExchangeAuditSummary'
        '400':
          description: Invalid request — page size outside the permitted range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Authentication is missing or the bearer token is invalid. The response has NO body: the gateway rejects unauthenticated calls with a bodiless status, so clients must not attempt to parse an error envelope here.'
        '403':
          description: Authenticated caller lacks supplier:audit:read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
