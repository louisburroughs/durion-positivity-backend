    PriceCatalogBindingFreshness:
      description: One PRICE_CATALOG binding's schedule and scheduler-lease state.
      properties:
        bindingId:
          description: The endpoint binding.
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5e
          format: uuid
          type: string
        checkpointAt:
          description: End of the last window the schedule coordinator checkpointed. Null for full-snapshot protocols — every current PRICAT protocol — and for bindings a scheduled run has never claimed.
          format: date-time
          type: string
        enabled:
          description: Whether the binding is enabled.
          type: boolean
        lastRunOutcome:
          description: How the last scheduled run ended; null when a scheduled run never ran.
          example: COMPLETED
          type: string
        lastRunStartedAt:
          description: When the last scheduled run started; null when a scheduled run never ran.
          format: date-time
          type: string
        scheduleCron:
          description: The binding's schedule cron; null when the feed only runs on demand.
          example: 0 0 3 * * *
          type: string
      type: object
    PriceCatalogFreshnessView:
      description: 'Freshness of one vendor profile''s price catalog: what the vendor last stated (latestEffectiveDate, vendor document metadata) versus when this platform last retrieved it (lastFetchedAt), judged against the backend-owned staleness threshold.'
      properties:
        bindings:
          description: The profile's PRICE_CATALOG bindings with their schedule and lease state; empty when none is configured.
          items:
            $ref: '#/components/schemas/PriceCatalogBindingFreshness'
          type: array
        lastCompletedAt:
          description: When staging last committed; null when no run ever completed.
          format: date-time
          type: string
        lastFetchedAt:
          description: When the vendor was last called, over every run including failed and empty ones. Platform retrieval time, NOT vendor metadata; null when never fetched.
          format: date-time
          type: string
        latestEffectiveDate:
          description: Newest vendor-stated catalog document date over completed imports. Vendor document metadata, NOT retrieval time; null when no completed import stated one.
          example: 2026-08-13
          format: date
          type: string
        stale:
          description: True when lastFetchedAt is older than the threshold, or the profile was never fetched at all.
          type: boolean
        stalenessThreshold:
          description: The backend-configured staleness threshold, as an ISO-8601 duration. Every client judges freshness by this same value.
          example: P7D
          type: string
        unresolvedUnmatchedCount:
          description: Open quarantine lines still awaiting a catalog fix.
          example: 42
          format: int64
          type: integer
        vendorProfileId:
          description: Vendor profile this freshness read describes.
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
          format: uuid
          type: string
      type: object
    PriceCatalogImportSummary:
      description: Bookkeeping summary of one vendor PRICAT import run.
      properties:
        bindingId:
          description: Endpoint binding the run was fetched over. Null on runs recorded before the binding was persisted (forward-only) and on quarantine re-application manifests, which make no vendor call.
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5e
          format: uuid
          type: string
        checkpointAt:
          description: When the checkpoint state was committed; null whenever checkpointState is null.
          format: date-time
          type: string
        checkpointState:
          description: Opaque continuation state committed for the next incremental run; null for full-snapshot protocols, which have nothing to resume from.
          type: string
        chunkCount:
          description: Number of chunk events published for the import.
          example: 25
          format: int32
          type: integer
        completedAt:
          description: When staging committed; null while in progress or after a failed fetch.
          format: date-time
          type: string
        countryCode:
          description: Market the catalog was fetched for, when stated.
          example: SE
          type: string
        currency:
          description: Currency of the catalog, when stated.
          example: SEK
          type: string
        errorCode:
          description: Stable machine-readable failure category for a failed import, alongside the free-text failureDetail. Null unless the run failed.
          enum:
          - FETCH_FAILED
          - DECODE_FAILED
          example: FETCH_FAILED
          type: string
        failureDetail:
          description: Operator-facing failure summary for a failed import.
          type: string
        fetchedAt:
          description: When the vendor was called.
          format: date-time
          type: string
        importManifestId:
          description: Identity of the import run; the aggregate id of its events.
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
          format: uuid
          type: string
        linesDuplicate:
          description: Lines deduplicated within the document.
          example: 8
          format: int32
          type: integer
        linesFetched:
          description: Lines the vendor sent.
          example: 12500
          format: int32
          type: integer
        linesMatched:
          description: Lines resolved to a catalog product and published.
          example: 12310
          format: int32
          type: integer
        linesUnmatched:
          description: Lines quarantined for review.
          example: 182
          format: int32
          type: integer
        sourceDocumentDate:
          description: Vendor catalog document date, when stated.
          example: 2026-05-12
          format: date
          type: string
        sourceDocumentId:
          description: Vendor catalog document id, when stated.
          example: PRICAT-4046266_202305120844
          type: string
        status:
          description: Terminal or in-flight state of the run.
          enum:
          - IN_PROGRESS
          - COMPLETED
          - EMPTY
          - FAILED
          example: COMPLETED
          type: string
        supplierRef:
          description: Profile alias at fetch time; descriptive only.
          example: michelin-eu
          type: string
        vendorProfileId:
          description: Vendor profile the catalog was fetched for.
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5c
          format: uuid
          type: string
        windowFrom:
          description: 'Inclusive start of the incremental retrieval interval requested for the run. Null for full-snapshot protocols — every current PRICAT protocol: B4.0 fetches the vendor''s whole catalog, so there is no window.'
          format: date-time
          type: string
        windowTo:
          description: Exclusive end of the requested retrieval interval; null for full-snapshot protocols.
          format: date-time
          type: string
      type: object
