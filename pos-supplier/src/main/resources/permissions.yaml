domain: supplier
serviceName: pos-supplier
version: "1.0"
permissions:
  - name: "supplier:audit:read"
    description: "Read supplier exchange audit records"
  - name: "supplier:profile:read"
    description: "View vendor profiles, auth configs, commercial accounts, and endpoint bindings"
  - name: "supplier:profile:write"
    description: "Create and edit vendor profiles, auth configs, commercial accounts, and endpoint bindings"
  - name: "supplier:pricecatalog:read"
    description: "View vendor price-catalog import bookkeeping and the unmatched-line quarantine"
  - name: "supplier:pricecatalog:import"
    description: "Trigger an on-demand vendor price-catalog (PRICAT) import"
  - name: "supplier:transmission:read"
    description: "View the purchase-order transmission ledger and its stuck-transmission queue"
  - name: "supplier:transmission:resolve"
    description: "Resolve a purchase-order transmission awaiting manual review (confirm with vendor reference, mark not received, or cancel)"
  - name: "supplier:stock:inquire"
    description: "Ask a vendor, live, what stock it holds for a receiving location (the approved synchronous supplier read)"
  - name: "supplier:stockavailability:read"
    description: "Check one catalog product's live availability across every enabled stock-inquiry vendor (product-keyed fan-out; no vendor/article mapping is exposed)"
  - name: "supplier:stocksnapshot:read"
    description: "View fetched vendor stock-report snapshots and their lines (no vendor call is made)"
  - name: "supplier:invoice:fetch"
    description: "Run a vendor invoice fetch on demand"
  - name: "supplier:workorderauth:request"
    description: "Ask a fleet program to authorize work, and look up fleet vehicles, contracts and policies"
  - name: "supplier:workorderauth:review"
    description: "View and clear fleet workorder authorizations parked for manual review"
  - name: "supplier:mktcat:import"
    description: "Run a marketing-catalogue (MKCAT) import on demand and read staged enrichment"
  - name: "supplier:vendor:read"
    description: "View vendors (the vendor master) and their remit-to change requests"
    grantTo:
      - ADMIN
      - CONTROLLER
      - ACCOUNTING_CLERK
      - GENERAL_MANAGER
      - SUPPORT
  - name: "supplier:vendor:write"
    description: "Create and edit vendors, deactivate or reactivate them, and request a remit-to change"
    grantTo:
      - ADMIN
      - CONTROLLER
      - ACCOUNTING_CLERK
  - name: "supplier:vendor_remit:approve"
    description: "Approve or reject a vendor remit-to change requested by someone else"
    grantTo:
      - ADMIN
      - CONTROLLER
      - GENERAL_MANAGER
  - name: "supplier:fact:replay"
    description: "Re-emit the tenant's supplier.vendor.updated facts to seed or repair a replica"
    grantTo:
      - ADMIN
