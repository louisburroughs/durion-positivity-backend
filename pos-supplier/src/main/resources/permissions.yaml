domain: supplier
serviceName: pos-supplier
version: "1.0"
permissions:
  - name: "supplier:audit:read"
    description: "Read supplier exchange audit records"
  - name: "supplier:profile:read"
    description: "View vendor profiles, auth configs, commercial accounts, and endpoint bindings"
  - name: "supplier:profile:write"
    description: "Create and edit vendor profiles, auth configs, commercial accounts, and endpoint bindings"
  - name: "supplier:pricecatalog:read"
    description: "View vendor price-catalog import bookkeeping and the unmatched-line quarantine"
  - name: "supplier:pricecatalog:import"
    description: "Trigger an on-demand vendor price-catalog (PRICAT) import"
