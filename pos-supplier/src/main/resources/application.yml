spring:
  application:
    name: supplier
  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Explicit String (de)serializers (#1450): spring-kafka 4.1 defaults to ByteArraySerializer,
    # and SupplierOutboxPublisher sends String key/payload through KafkaTemplate — the same
    # SerializationException #1449 fixed on six other services. No global consumer group-id:
    # each @KafkaListener sets its own from pos.supplier.kafka.*-consumer-group.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  datasource:
    # Deployment wiring points at the per-service pos_supplier_db (docker-compose / env).
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 0
  tomcat:
    max-http-header-size: 65536

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    org:
      springframework: INFO
    com:
      positivity:
        supplier: INFO

      netflix:
        discovery:
          shared:
            resolver:
              aws:
                ConfigClusterResolver: WARN

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

pos:
  image:
    # pos-image is a Utility module under ADR-0044 and may be called directly. MKCAT artwork is
    # stored there so a product page never renders from a manufacturer's own server.
    service-id: ${POS_IMAGE_SERVICE_ID:image}
    base-path: ${POS_IMAGE_BASE_PATH:/v1/images}
  # ── Exchange-audit payload encryption (ADR-0050 §7) ─────────────────────────────────
  #
  # NOT optional plumbing. AuditPayloadCipher fails startup without a key unless the dev or test
  # profile is active, and its failure message names SUPPLIER_AUDIT_ENC_KEY -- so that variable must
  # actually reach the property. Without these lines relaxed binding would only have resolved
  # POS_SUPPLIER_AUDIT_ENCRYPTION_KEY, and an operator following the message would have set a
  # variable nothing reads.
  supplier:
    audit:
      encryption:
        # 32 bytes, base64. Provision before first deploy.
        key: ${SUPPLIER_AUDIT_ENC_KEY:}
        # Recorded in every envelope so rotation stays possible.
        key-id: ${SUPPLIER_AUDIT_ENC_KEY_ID:k1}
        # Decrypt-only keys, keyId:base64 comma-separated. A retired key MUST stay here for the whole
        # retention window or its payloads become unreadable.
        previous-keys: ${SUPPLIER_AUDIT_ENC_PREVIOUS_KEYS:}
      # Applied when a binding sets no level of its own. REDACTED, not FULL: an unconfigured binding must
      # not capture credentials that happen to sit inside a vendor document.
      default-capture-level: ${SUPPLIER_AUDIT_DEFAULT_CAPTURE_LEVEL:REDACTED}
      # Payload content expires; the metadata trail is kept permanently.
      retention: ${SUPPLIER_AUDIT_RETENTION:P400D}
      purge-cron: ${SUPPLIER_AUDIT_PURGE_CRON:0 30 3 * * *}
    # ── OAuth2 token leg (ADR-0050 §4) ──────────────────────────────────────────────────
    #
    # The token endpoint gets its OWN budgets, not the profile's and not the platform builder's 2s/5s
    # in-cluster defaults -- it is a third-party internet call, frequently slower than the vendor API,
    # and the whole exchange waits on it.
    oauth2:
      expiry-skew-seconds: ${SUPPLIER_OAUTH2_EXPIRY_SKEW_SECONDS:30}
      connect-timeout-millis: ${SUPPLIER_OAUTH2_CONNECT_TIMEOUT_MILLIS:5000}
      read-timeout-millis: ${SUPPLIER_OAUTH2_READ_TIMEOUT_MILLIS:15000}
    # ── Retry and circuit breaker (ADR-0052 §5) ─────────────────────────────────────────
    #
    # Only PRE_SEND_FAILURE is retried; a post-send ambiguity is never retried, whatever these say.
    retry:
      base-backoff-millis: ${SUPPLIER_RETRY_BASE_BACKOFF_MILLIS:500}
    breaker:
      failure-rate-threshold: ${SUPPLIER_BREAKER_FAILURE_RATE_THRESHOLD:50}
      sliding-window-size: ${SUPPLIER_BREAKER_SLIDING_WINDOW_SIZE:20}
      # Below this many calls the breaker stays closed, so one early failure cannot open it.
      minimum-number-of-calls: ${SUPPLIER_BREAKER_MINIMUM_NUMBER_OF_CALLS:10}
      wait-duration-seconds: ${SUPPLIER_BREAKER_WAIT_DURATION_SECONDS:30}
      half-open-permitted-calls: ${SUPPLIER_BREAKER_HALF_OPEN_PERMITTED_CALLS:3}
    # ── Scheduler lease (binding decision 4) ────────────────────────────────────────────
    schedule:
      lease-duration-seconds: ${SUPPLIER_SCHEDULE_LEASE_DURATION_SECONDS:600}
    # ── Price catalog / PRICAT (ADR-0053 §7) ────────────────────────────────────────────
    #
    # chunk-size is the deployment default; a binding may override it, because how many lines fit a
    # broker message depends on how wide that vendor's lines are. 500 is ADR-0053's figure and MUST be
    # validated against the first Michelin sandbox pull and recorded there.
    pricat:
      chunk-size: ${SUPPLIER_PRICAT_CHUNK_SIZE:500}
      # How often due bindings are checked, NOT how often a catalog is fetched -- that is the
      # binding's own cron.
      poll-interval-ms: ${SUPPLIER_PRICAT_POLL_INTERVAL_MS:60000}
      scheduler-enabled: ${SUPPLIER_PRICAT_SCHEDULER_ENABLED:true}
      # Quarantine re-application (#1310). The sweep runs on its own cadence rather than with an
      # import: what makes a quarantined line matchable is a change in the CATALOG, which has
      # nothing to do with when the vendor is next fetched.
      reapply-batch-size: ${SUPPLIER_PRICAT_REAPPLY_BATCH_SIZE:2000}
      reapply-cron: ${SUPPLIER_PRICAT_REAPPLY_CRON:0 15 * * * *}
      reapply-enabled: ${SUPPLIER_PRICAT_REAPPLY_ENABLED:true}
      # Re-publication on consumer request (ADR-0044 §4). Both bounds exist because serving a
      # request does not guarantee the consumer recovers: if it stays short it asks again, and an
      # unbounded answer would re-emit an entire vendor catalogue in a loop. The cooldown collapses
      # a burst of requests for one import; the cap stops a genuinely broken consumer, loudly.
      republish-cooldown: ${SUPPLIER_PRICAT_REPUBLISH_COOLDOWN:PT10M}
      republish-max-attempts: ${SUPPLIER_PRICAT_REPUBLISH_MAX_ATTEMPTS:3}
      # How old the last vendor fetch may be before the freshness read reports the catalog stale
      # (#1637 decision 3). Catalog-currency policy, returned to every client in the freshness
      # response so they all judge by the same rule. NOT a cache TTL -- in particular not the
      # stock-inquiry cache-ttl below, which bounds request coalescing, not data currency.
      staleness-threshold: ${SUPPLIER_PRICAT_STALENESS_THRESHOLD:P7D}
    # ── Live stock inquiry / A2.5 (CAP-319) ─────────────────────────────────────────────
    #
    # The one synchronous supplier read the platform allows (ADR-0044 amendment). A customer is
    # waiting on it, so the profile's connect/read timeouts govern how long a page can be held up:
    # a profile bound to STOCK_INQUIRY wants short ones, not the generous budgets a nightly batch
    # can afford.
    stockinquiry:
      # Absorbs the repeat views of one product page. Short on purpose: an availability is only
      # worth repeating while it is still plausibly true.
      cache-ttl: ${SUPPLIER_STOCKINQUIRY_CACHE_TTL:PT60S}
      cache-enabled: ${SUPPLIER_STOCKINQUIRY_CACHE_ENABLED:true}
    # ── Stock report / B2.1 (CAP-322) ───────────────────────────────────────────────────
    #
    # Same chunking problem as PRICAT: a country-level report is as wide as a catalog. A binding
    # may override the size; the binding column governs both feeds.
    stockreport:
      chunk-size: ${SUPPLIER_STOCKREPORT_CHUNK_SIZE:500}
      poll-interval-ms: ${SUPPLIER_STOCKREPORT_POLL_INTERVAL_MS:60000}
      scheduler-enabled: ${SUPPLIER_STOCKREPORT_SCHEDULER_ENABLED:true}
      # B2.1 identifies the buyer by credential and takes no query parameters. The sibling C1.0
      # report on the same spec DOES take buyerParty/agencyCode, so a deployment binding a C1.0
      # endpoint to this codec turns this on rather than silently fetching nothing.
      send-buyer-party: ${SUPPLIER_STOCKREPORT_SEND_BUYER_PARTY:false}
    # ── Vendor invoice fetch (B3.3, CAP-321) ───────────────────────────────────────────
    invoice:
      poll-interval-ms: ${SUPPLIER_INVOICE_POLL_INTERVAL_MS:300000}
      # How far back each window reaches beyond the last checkpoint. A vendor may date an invoice
      # a day or two before it becomes fetchable, and a window starting exactly where the last one
      # ended would step over it. Re-asking is cheap: the importer recognises an invoice it already
      # holds by the vendor's own identity. The right value is only learned from a live vendor.
      window-overlap: ${SUPPLIER_INVOICE_WINDOW_OVERLAP:P2D}
      # How far back the first fetch reaches when a binding has no checkpoint. Bounded, because an
      # unbounded first fetch against a vendor with years of history would time out — and a
      # timed-out first fetch never establishes a checkpoint, so it would time out again forever.
      initial-lookback: ${SUPPLIER_INVOICE_INITIAL_LOOKBACK:P30D}
    # ── Purchase-order transmission (ADR-0052, CAP-320) ─────────────────────────────────
    #
    # Three background jobs, three cadences. None of them ever re-sends an order: dispatch drains
    # PENDING, recovery reconciles what a crash left mid-flight, and the status poll watches
    # fulfilment.
    order:
      scheduler-enabled: ${SUPPLIER_ORDER_SCHEDULER_ENABLED:true}
      # Short, because this is the latency between a purchase order being approved and reaching the
      # vendor. It costs nothing when the queue is empty.
      dispatch-poll-interval-ms: ${SUPPLIER_ORDER_DISPATCH_POLL_INTERVAL_MS:5000}
      recovery-poll-interval-ms: ${SUPPLIER_ORDER_RECOVERY_POLL_INTERVAL_MS:60000}
      # How long an order may sit mid-flight before a human is asked to look at it. Bounded because
      # the alternative is an order that MAY exist at a vendor sitting unresolved indefinitely while
      # reconciliation quietly fails every cycle.
      ambiguity-escalation-minutes: ${SUPPLIER_ORDER_AMBIGUITY_ESCALATION_MINUTES:30}
      # How often the poller LOOKS for due orders, not how often a vendor is asked -- that is the
      # minimum interval below.
      status-poll-interval-ms: ${SUPPLIER_ORDER_STATUS_POLL_INTERVAL_MS:60000}
      status-poll-min-interval-seconds: ${SUPPLIER_ORDER_STATUS_POLL_MIN_INTERVAL_SECONDS:900}
      # Days of UNCHANGED vendor answers after which polling stops. Needed because a schedule is
      # only settled on a positive statement, so a vendor that never states quantities would
      # otherwise be polled forever. Recorded as STALE, never as a completion.
      status-max-quiet-days: ${SUPPLIER_ORDER_STATUS_MAX_QUIET_DAYS:45}
    # ── Event outbox drain (ADR-0044 §4) ────────────────────────────────────────────────
    outbox:
      poll-interval-ms: ${SUPPLIER_OUTBOX_POLL_INTERVAL_MS:1000}
      send-timeout-ms: ${SUPPLIER_OUTBOX_SEND_TIMEOUT_MS:10000}
    mktcat:
      # Full catalogue sweep. The mode that always works: change subscription is better where a
      # catalogue offers it, but a subscription the vendor has silently forgotten produces no error,
      # just a catalogue that stops changing. Both modes go through one importer that publishes on
      # content change, so running both costs reads and emits nothing extra.
      poll-interval-ms: ${SUPPLIER_MKTCAT_POLL_INTERVAL_MS:900000}
      # Artwork is fetched directly rather than through the supplier base client: an image URI is an
      # arbitrary asset URL published inside a document, and sending vendor credentials to it would
      # leak them to whatever host the catalogue names.
      image-fetch-timeout-ms: ${SUPPLIER_MKTCAT_IMAGE_FETCH_TIMEOUT_MS:15000}
      # Bounded because the URI comes from a document rather than from configuration: without a cap,
      # a mistyped link to a very large file would be pulled into memory and stored.
      image-max-bytes: ${SUPPLIER_MKTCAT_IMAGE_MAX_BYTES:10485760}
      # Missing artwork is retried on its own cadence rather than waiting for the next sweep, which
      # on a nightly schedule would leave a picture missing for a day for a reason unrelated to it.
      image-retry-interval-ms: ${SUPPLIER_MKTCAT_IMAGE_RETRY_INTERVAL_MS:1800000}
      image-retry-batch-size: ${SUPPLIER_MKTCAT_IMAGE_RETRY_BATCH_SIZE:25}
      # Where the catalogue should send change notifications. Unset by default: a deployment that
      # cannot accept callbacks must not advertise one, and the scheduled sweep covers it.
      callback-base-url: ${SUPPLIER_MKTCAT_CALLBACK_BASE_URL:}
    workorderauth:
      # How often accepted-but-undecided authorizations are re-read. The S2S API may answer a
      # request with 202 and a Location instead of a decision; without this the 202 is
      # indistinguishable from a request that vanished.
      poll-interval-ms: ${SUPPLIER_WORKORDERAUTH_POLL_INTERVAL_MS:120000}
      poll-batch-size: ${SUPPLIER_WORKORDERAUTH_POLL_BATCH_SIZE:50}
      # How long an authorization may stay undecided before a human is asked to look. Bounded
      # because "never" is not an answer a shop can act on: a vendor that will never resolve a
      # request must not look the same as one that is about to.
      pending-timeout: ${SUPPLIER_WORKORDERAUTH_PENDING_TIMEOUT:PT24H}
      # Completion sign-off. Retried, unlike the authorization request: approving an
      # already-approved workorder is the vendor restating a fact, whereas re-requesting an
      # authorization can open a second one against the same contract.
      approval-interval-ms: ${SUPPLIER_WORKORDERAUTH_APPROVAL_INTERVAL_MS:300000}
      approval-batch-size: ${SUPPLIER_WORKORDERAUTH_APPROVAL_BATCH_SIZE:50}
      # Finite on purpose. An approval that retries forever looks like one that is working, and an
      # unapproved completion is work already performed that the fleet has not agreed to pay for.
      approval-max-attempts: ${SUPPLIER_WORKORDERAUTH_APPROVAL_MAX_ATTEMPTS:6}
    kafka:
      # Off by default so a deployment without a broker starts cleanly; the outbox still records
      # events, and they drain once this is enabled. It also gates the catalog product-code
      # consumer, so a deployment with Kafka off cannot match PRICAT lines at all — by design: an
      # empty replica is reported as unavailable rather than as a catalog full of misses.
      #
      # Deployment status (#1450): pos-supplier is deliberately NOT in
      # deployment/alpha/docker-compose.prod.yml. When it is added there, set
      # SUPPLIER_KAFKA_ENABLED=true and KAFKA_BOOTSTRAP_SERVERS together and verify the outbox
      # drains (supplier_event_outbox.published_at set, attempts not climbing).
      enabled: ${SUPPLIER_KAFKA_ENABLED:false}
      catalog-events-topic: ${SUPPLIER_CATALOG_EVENTS_TOPIC:catalog.events.v1}
      catalog-events-consumer-group: ${SUPPLIER_CATALOG_EVENTS_CONSUMER_GROUP:pos-supplier-catalog-events}
      # Workorder completions, which queue the fleet sign-off (CAP-323). Its own consumer group:
      # one group per topic per module, so a lag or a reset here cannot disturb the catalog replica.
      workorder-events-topic: ${SUPPLIER_WORKORDER_EVENTS_TOPIC:workorder.events.v1}
      workorder-events-consumer-group: ${SUPPLIER_WORKORDER_EVENTS_CONSUMER_GROUP:pos-supplier-workorder-events}
      # Inbound commands (ADR-0049 §3): purchase-order transmission requests from pos-order and
      # PRICAT re-publication requests from pos-catalog. Also gated by `enabled` above: with Kafka
      # off nothing is consumed and no order is transmitted, which is the safe direction — the
      # alternative would be orders placed by a deployment that cannot report the results.
      #
      # ONE group for the whole topic, deliberately. processed_events is keyed by event id alone, so
      # a second consumer group here would record ids the first group still had to act on and the
      # two would suppress each other's commands.
      supplier-commands-topic: ${SUPPLIER_COMMANDS_TOPIC:supplier.commands.v1}
      supplier-commands-consumer-group: ${SUPPLIER_COMMANDS_CONSUMER_GROUP:pos-supplier-commands}
  # @EmitEvent event-type registration with pos-event-receiver at startup (AGENTS.md)
  events:
    base-url: ${POS_EVENTS_BASE_URL:http://pos-event-receiver:8080}
    api-secret: ${POS_EVENTS_API_SECRET:}
  # permissions.yaml registration with pos-security-service at startup (ADR-0025)
  security:
    base-url: ${POS_SECURITY_BASE_URL:http://pos-security-service:8080}
