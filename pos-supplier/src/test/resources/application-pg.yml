# Testcontainers Postgres profile (ADR-0062, plan R-B7): the real Flyway chain, Hibernate validate,
# the pool as pos_app (PostgresTenancyTestBase), strict tenancy. The datasource is supplied at
# runtime by @DynamicPropertySource.
spring:
  application:
    name: pos-supplier-pg-test
  datasource:
    hikari:
      # Every Spring context this JVM caches keeps its pool for the whole run, and the module has
      # a dozen-odd Postgres-backed context shapes. Hikari's default of 10 apiece exhausts even a
      # generously configured server; a slice needs one connection at a time. The contention test
      # that really does need many raises this for itself.
      maximum-pool-size: 8
      minimum-idle: 1
  autoconfigure:
    exclude: org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  cloud:
    discovery:
      enabled: false

pos:
  tenancy:
    # strict: nothing binds a tenant unless the test does
    default-tenant-id:
  supplier:
    kafka:
      enabled: false
    audit:
      encryption:
        # AuditPayloadCipher requires a real key under any profile set that is not entirely dev/test
        # (ADR-0050 §7): a fixed test key, not a secret, so the pg profile stands alone. It must
        # decode to exactly 32 bytes (AES-256) or the cipher refuses to start.
        key: cGctdGVzdC1vbmx5LWtleS1wZy10ZXN0LW9ubHkta2U=
        key-id: pg-test
    vendor-tax-id:
      encryption:
        # VendorTaxIdCipher has the same fail-closed policy and its OWN key (#2621). A fixed, obviously fake
        # test key, not a secret: base64 of "FAKE-test-only-vendor-tax-id-key" (32 bytes).
        key: RkFLRS10ZXN0LW9ubHktdmVuZG9yLXRheC1pZC1rZXk=
        key-id: pg-test-taxid

eureka:
  client:
    enabled: false

logging:
  level:
    org.hibernate.SQL: warn

# Test contexts never reach pos-security-service or pos-event-receiver. Skip permission registration
# (its startup retry loop otherwise sleeps ~8 s in every Spring test context) and point the event-type
# initializer at a loopback port that refuses instantly. Same arrangement as pos-mcp-server's test profile.
pos.security.permission-registration.enabled: false
pos.events.base-url: http://127.0.0.1:1
