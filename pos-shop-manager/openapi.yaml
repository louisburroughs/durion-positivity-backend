      type: object
    MechanicRosterEntryResponse:
      description: HR-synchronized mechanic roster entry
      properties:
        firstName:
          type: string
        hireDate:
          format: date
          type: string
        lastName:
          type: string
        lastSyncedAt:
          format: date-time
          type: string
        mechanicId:
          format: uuid
          type: string
        personId:
          format: uuid
          type: string
        skills:
          items:
            type: string
          type: array
        status:
          enum:
          - ACTIVE
          - INACTIVE
          - ON_LEAVE
          type: string
        terminationDate:
          format: date
          type: string
      type: object
    MechanicSkillBulkIngestRecord:
      description: One mechanic's proficiency in one skill
      properties:
        personId:
          description: Canonical person id of the mechanic
          example: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a5b
          minLength: 1
          type: string
        proficiencyLevel:
          description: Proficiency, 1 to 5
