    PageMetadata:
      properties:
        number:
          format: int64
          type: integer
        size:
          format: int64
          type: integer
        totalElements:
          format: int64
          type: integer
        totalPages:
          format: int64
          type: integer
      type: object
    PagedModelLocationTechnicianRosterEntryResponse:
      properties:
        content:
          items:
            $ref: '#/components/schemas/LocationTechnicianRosterEntryResponse'
          type: array
        page:
          $ref: '#/components/schemas/PageMetadata'
      type: object
    PagedModelMechanicRosterEntryResponse:
      properties:
        content:
          items:
            $ref: '#/components/schemas/MechanicRosterEntryResponse'
          type: array
        page:
          $ref: '#/components/schemas/PageMetadata'
      type: object
    PersonDTO:
      description: Person details for a technician
      properties:
        firstName:
          description: First name of the person
          example: Jane
          type: string
        id:
          description: People-contact person identifier
          example: 01960011-0000-7000-8000-000000000001
          format: uuid
          type: string
        lastName:
          description: Last name of the person
          example: Doe
          type: string
        phoneNumbers:
          description: Phone numbers associated with the person
          example:
          - +1-217-555-0100
          items:
            type: string
          type: array
        primaryEmail:
          description: Primary email address of the person
          example: jane.doe@example.com
          type: string
        secondaryEmail:
          description: Secondary email address of the person
          example: jane.d@example.com
          type: string
      type: object
    ReplaceMechanicSkillsRequest:
      properties:
        skills:
          description: Full replacement skill set for the mechanic
          items:
            $ref: '#/components/schemas/SkillInput'
          minItems: 1
          type: array
      required:
      - skills
      type: object
    RescheduleAppointmentRequest:
      description: Request to reschedule an appointment to a new time window with a mandatory reason
      properties:
        newEndAt:
          description: New appointment end instant in UTC (ISO-8601); must be after newStartAt
          example: 2026-06-19 10:00:00+00:00
          format: date-time
          type: string
        newStartAt:
          description: New appointment start instant in UTC (ISO-8601)
          example: 2026-06-19 08:00:00+00:00
          format: date-time
          type: string
        notifyCustomer:
          description: Whether to notify the customer of this reschedule (defaults to true)
          example: true
          type: boolean
        reason:
          description: Mandatory reschedule reason code
          enum:
          - CUSTOMER_REQUEST
          - SHOP_CAPACITY
          - EQUIPMENT_ISSUE
          - MECHANIC_UNAVAILABLE
          - PARTS_DELAY
          - WEATHER
          - EMERGENCY
          - MANAGER_DISCRETION
          - OTHER
          example: CUSTOMER_REQUEST
          type: string
        rescheduleReasonNotes:
          description: Optional notes; required when reason is OTHER or when overriding a hard conflict
          example: Mechanic out sick; moved to next available slot
          maxLength: 1000
          minLength: 0
          type: string
      required:
      - newEndAt
      - newStartAt
      - reason
      type: object
    ScheduleEventView:
      description: A single event displayed within a resource lane
      properties:
        conflictDetails:
          $ref: '#/components/schemas/ConflictDetails'
        endTime:
          description: Event end instant in UTC (ISO-8601)
          example: 2026-06-18 15:00:00+00:00
          format: date-time
          type: string
        eventId:
          description: Event identifier
          example: 01960003-0000-7000-8000-000000000001
          type: string
        eventType:
          description: Event type (e.g. APPOINTMENT, SHIFT, PTO)
          example: APPOINTMENT
          type: string
        hasConflict:
          description: Whether this event has a scheduling conflict
          example: false
          type: boolean
        severity:
          description: Conflict severity when hasConflict is true (HARD or SOFT)
          example: SOFT
          type: string
        startTime:
          description: Event start instant in UTC (ISO-8601)
          example: 2026-06-18 13:00:00+00:00
          format: date-time
          type: string
        subType:
          description: Event sub-type, when applicable
          example: DIAGNOSTIC
          type: string
        title:
          description: Event display title
          example: Oil change - Jane Doe
          type: string
      required:
      - endTime
      - eventId
      - eventType
      - hasConflict
      - startTime
      type: object
    ScheduleResourceView:
      description: A single resource lane within the schedule view
      properties:
        events:
          description: Events scheduled for this resource
          items:
            $ref: '#/components/schemas/ScheduleEventView'
          type: array
        resourceId:
          description: Resource identifier
          example: 01960003-0000-7000-8000-000000000010
          type: string
        resourceName:
          description: Display name of the resource
          example: Jane Doe
          type: string
        resourceType:
          description: Resource type (e.g. MECHANIC or BAY)
          example: MECHANIC
          type: string
      required:
      - events
      - resourceId
      - resourceType
      type: object
    ScheduleViewResponse:
      description: Schedule view for a location and date, grouped by resource with their events
      properties:
        availabilityOverlayStatus:
          description: Status of the availability overlay (e.g. AVAILABLE, UNAVAILABLE, SKIPPED)
          example: AVAILABLE
          type: string
        date:
          description: Calendar date of the schedule view (ISO-8601)
          example: 2026-06-18
          format: date
          type: string
        dayEndAt:
          description: End of the displayed day window in UTC (ISO-8601)
          example: 2026-06-18 21:00:00+00:00
          format: date-time
          type: string
        dayStartAt:
          description: Start of the displayed day window in UTC (ISO-8601)
          example: 2026-06-18 12:00:00+00:00
          format: date-time
          type: string
        locationId:
          description: Location identifier the schedule belongs to
          example: 01960003-0000-7000-8000-000000000003
          format: uuid
          type: string
        resources:
          description: Resources and their scheduled events
          items:
            $ref: '#/components/schemas/ScheduleResourceView'
          type: array
        viewGeneratedAt:
          description: Instant the view was generated in UTC (ISO-8601)
          example: 2026-06-18 07:55:00+00:00
          format: date-time
          type: string
        warnings:
          description: Non-fatal warnings generated while assembling the view
          example:
          - HR availability data was unavailable
          items:
            type: string
          type: array
      required:
      - date
      - dayEndAt
      - dayStartAt
      - locationId
      - resources
      - viewGeneratedAt
      type: object
    ShopAuditEntryResponse:
      description: Read-only shop audit trail entry recording a schedule or assignment change
      properties:
        actorUserId:
          description: User identifier of the actor who made the change
          example: 01960003-0000-7000-8000-000000000020
          type: string
        appointmentId:
          description: Associated appointment identifier
          example: 01960003-0000-7000-8000-000000000003
          type: string
        changePatch:
          description: Machine-readable patch describing the change (JSON)
          example:
            startAt:
              new: 2026-06-18 11:00:00+00:00
              old: 2026-06-18 08:00:00+00:00
          type: string
        changeSummaryText:
          description: Human-readable summary of the change
          example: Appointment moved from 08:00 to 11:00
          type: string
        eventType:
          description: Type of audit event recorded
          enum:
          - SCHEDULE_CREATED
          - SCHEDULE_UPDATED
          - SCHEDULE_CANCELLED
          - ASSIGNMENT_CREATED
          - ASSIGNMENT_REMOVED
          example: SCHEDULE_UPDATED
          type: string
        id:
          description: Unique audit entry identifier
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        locationId:
          description: Location identifier the change applies to
          example: 01960003-0000-7000-8000-000000000004
          type: string
        mechanicId:
          description: Mechanic identifier involved in the change
          example: 01960003-0000-7000-8000-000000000010
          type: string
        reasonCode:
          description: Reason code associated with the change
          example: CUSTOMER_REQUEST
          type: string
        recordedAt:
          description: Instant the audit entry was recorded in UTC (ISO-8601)
          example: 2026-06-18 08:00:00+00:00
          format: date-time
          type: string
        retentionYears:
          description: Number of years the entry is retained
          example: 7
          format: int32
          type: integer
        workorderId:
          description: Associated workorder identifier
          example: 01960003-0000-7000-8000-000000000002
          type: string
      required:
      - actorUserId
      - eventType
      - id
      - recordedAt
      - retentionYears
      type: object
    ShopDashboardResponse:
      description: Bays, mobile units and open workorders for one shop location in a single read.
      properties:
        date:
          description: The day the unit roster is rendered as of, in the location's local calendar.
          example: 2026-09-03
          format: date
          type: string
        locationId:
          description: The location this dashboard describes.
          example: 018e1c9f-6b5a-7890-abcd-1234567890ab
          format: uuid
          type: string
        openWorkorders:
          description: Every open workorder at the location, assigned or not. Not date-scoped.
          items:
            $ref: '#/components/schemas/ShopDashboardWorkorder'
          type: array
        openWorkordersTruncated:
          description: True when openWorkorders was cut at the 200-row cap and more rows exist.
          example: false
          type: boolean
        units:
          description: Every bay and mobile unit at the location, idle ones included.
          items:
            $ref: '#/components/schemas/ShopDashboardUnit'
          type: array
      type: object
    ShopDashboardUnit:
      description: A bay or mobile unit at the location, with the workorder on it or an explicit null.
      properties:
        assignment:
          $ref: '#/components/schemas/ShopDashboardWorkorder'
        unitId:
          description: Bay or mobile-unit identifier, from the owning location domain.
          example: 01960005-0000-7000-8000-0000000000b1
          format: uuid
          type: string
        unitName:
          description: Display name from the location replica; null until the fact arrives.
          type: string
        unitType:
          description: Which kind of repair unit this row describes.
          enum:
          - BAY
          - MOBILE_UNIT
          example: BAY
          type: string
      type: object
    ShopDashboardVehicle:
      description: Vehicle identity for a dashboard row, from the local vehicle replica.
      properties:
        make:
          description: Vehicle make.
          example: Ford
          type: string
        model:
          description: Vehicle model.
          example: F-150
          type: string
        vehicleId:
          description: Vehicle registry identifier.
          example: 01960004-0000-7000-8000-0000000000a1
          format: uuid
          type: string
        vin:
          description: Vehicle identification number.
          example: 1HGCM82633A004352
          type: string
        year:
          description: Model year.
          example: 2024
          format: int32
          type: integer
      type: object
    ShopDashboardWorkorder:
      description: An open workorder at the location, with its unit assignment when it has one.
      properties:
        mechanicName:
          description: 'Display name of the first assigned mechanic. Null when that person has not replicated into this module yet, which is a normal consequence of the People replica lagging the workorder feed. It is never a different technician''s name: an unresolved lead mechanic yields null rather than falling through to whichever assigned mechanic happens to resolve, because naming the wrong technician is worse than naming none. Do not treat null as "unassigned" — read mechanicNames for who is actually on the job.'
          example: Ada Lovelace
          type: string
        mechanicNames:
          description: Display names of every assigned mechanic, in assignment order. Technicians whose person replica has not arrived yet are omitted, so this list can be shorter than the workorder's assignment and its first entry is not necessarily mechanicName.
          items:
            type: string
          type: array
        promisedAt:
          description: Time the vehicle is promised back; always null until pos-workorder owns a promise time.
          example: 2026-09-03 17:00:00+00:00
          format: date-time
          type: string
        status:
          description: Owner's workorder status name.
          example: WORK_IN_PROGRESS
          type: string
        unitId:
          description: Bay or mobile unit the workorder occupies; null when unassigned.
          example: 01960005-0000-7000-8000-0000000000b1
          format: uuid
          type: string
        unitName:
          description: Display name of the occupied unit; null when unassigned.
          example: Front Bay 1
          type: string
        unitType:
          description: Kind of unit occupied; null when unassigned.
          enum:
          - BAY
          - MOBILE_UNIT
          example: BAY
          type: string
        vehicle:
          $ref: '#/components/schemas/ShopDashboardVehicle'
        workorderId:
          description: Workorder identifier.
          example: 01960003-0000-7000-8000-000000000002
          format: uuid
          type: string
        workorderNumber:
          description: Human-readable workorder number.
          example: WO-2026-1001
          type: string
      type: object
    SkillInput:
      properties:
        proficiencyLevel:
          description: Proficiency 1 (beginner) to 5 (master)
          example: 4
          format: int32
          maximum: 5
          minimum: 1
          type: integer
        skillCode:
          description: Skill code (ASE T-series convention)
          example: T4-BRAKES
          minLength: 1
          type: string
      required:
      - skillCode
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
