          - ON_LEAVE
          type: string
        technicianId:
          format: uuid
          type: string
        terminationDate:
          format: date
          type: string
      type: object
    MechanicAssignmentItem:
      description: A single mechanic entry within an assignment request
      properties:
        mechanicPersonId:
          description: Person identifier of the mechanic being assigned
          example: 01960003-0000-7000-8000-000000000010
          minLength: 1
          type: string
        role:
          description: Role of the mechanic; defaults to LEAD for single-mechanic assignments when null
          enum:
          - LEAD
          - ASSIST
          example: LEAD
          type: string
      required:
