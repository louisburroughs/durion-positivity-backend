openapi: 3.1.0
info:
  title: POS Shop Manager Service API
  description: Shop Manager service for managing shop operations and staff
  contact:
    name: Durion Team
    email: louis.burroughs@gmail.com
  version: v1
servers:
- url: http://localhost:8086
  description: Generated server url
tags:
- name: Appointments API
  description: Operations for creating and loading appointments in shop management
- name: Shop API
  description: "Endpoints for shop management, technicians, and services"
- name: Workorder Operational Context API
  description: Read-only operational context view for workorders
- name: Shop Mobile Unit API
  description: Operations for managing mobile units within shop locations
- name: Schedule API
  description: Read-only schedule view operations for shop management UI
- name: Shop Bay API
  description: Operations for managing bays within shop locations
paths:
  /v1/shop-manager/mobileUnit:
    get:
      tags:
      - Shop Mobile Unit API
      summary: Get mobile units
      description: List all mobile units or get a specific mobile unit detail by locationId
        and bayId.
      operationId: getMobileUnits
      parameters: []
      responses:
        "200":
          description: Mobile units retrieved successfully.
          content:
            '*/*':
              schema: {}
    put:
      tags:
      - Shop Mobile Unit API
      summary: Manage mobile units
      description: Create or update mobile units in bulk.
      operationId: manageMobileUnits
      requestBody:
        content:
          application/json:
            schema:
              description: Mobile unit management request body
      responses:
        "200":
          description: Mobile units managed successfully.
          content:
            '*/*':
              schema: {}
  /v1/shop-manager/bays:
    get:
      tags:
      - Shop Bay API
      summary: Get bays
      description: List all bays or get a specific bay detail by locationId and bayId.
      operationId: getBays
      parameters: []
      responses:
        "200":
          description: Bays retrieved successfully.
          content:
            '*/*':
              schema: {}
    put:
      tags:
      - Shop Bay API
      summary: Manage bays
      description: Create or update bays in bulk.
      operationId: manageBays
      requestBody:
        content:
          application/json:
            schema:
              description: Bay management request body
      responses:
        "200":
          description: Bays managed successfully.
          content:
            '*/*':
              schema: {}
  /v1/appointments/{appointmentId}/reschedule:
    put:
      tags:
      - Appointments API
      summary: Reschedule appointment
      description: Reschedule an existing appointment
      operationId: rescheduleAppointment
      parameters:
      - name: appointmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleAppointmentRequest"
        required: true
      responses:
        "409":
          description: Appointment state conflict — appointment is not in a reschedulable
            status.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
        "400":
          description: "Validation error — invalid times, missing mandatory fields,\
            \ or blank notes required for OTHER reason."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
        "404":
          description: Appointment not found.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
        "200":
          description: Appointment rescheduled successfully.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
  /v1/shop-manager/{locationId}/mobileUnit:
    post:
      tags:
      - Shop Mobile Unit API
      summary: Create mobile unit
      description: Create a new mobile unit for a specific shop location. Validate
        baseLocationId and capabilities.
      operationId: createMobileUnit
      parameters:
      - name: locationId
        in: path
        description: Shop location ID
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              description: Mobile unit creation request body
      responses:
        "200":
          description: Mobile unit created successfully.
          content:
            '*/*':
              schema: {}
  /v1/shop-manager/{locationId}/bays:
    post:
      tags:
      - Shop Bay API
      summary: Create bay
      description: Create a new bay for a specific shop location.
      operationId: createBay
      parameters:
      - name: locationId
        in: path
        description: Shop location ID
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              description: Bay creation request body
      responses:
        "200":
          description: Bay created successfully.
          content:
            '*/*':
              schema: {}
  /v1/appointments:
    post:
      tags:
      - Appointments API
      summary: Create appointment
      description: Create a new appointment
      operationId: createAppointment
      parameters:
      - name: Idempotency-Key
        in: header
        description: Idempotency key for safe retries
        required: false
        schema:
          type: string
      - name: X-Correlation-Id
        in: header
        description: Correlation ID for request tracing
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentCreateRequest"
        required: true
      responses:
        "501":
          description: Not implemented.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
        "422":
          description: Source not eligible — estimate or work order cannot be scheduled
            (ineligible status).
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
        "400":
          description: "Validation or conflict error — requested slot is unavailable,\
            \ duplicate source appointment, or request fields are invalid."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
        "201":
          description: Appointment created successfully.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
  /v1/appointments/{appointmentId}/conflict-override:
    post:
      tags:
      - conflict-override-controller
      operationId: executeOverride
      parameters:
      - name: appointmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConflictOverrideRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ConflictOverrideResponse"
  /v1/appointments/{appointmentId}/assignments:
    get:
      tags:
      - assignment-controller
      operationId: listAssignments
      parameters:
      - name: appointmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssignmentResponse"
    post:
      tags:
      - assignment-controller
      operationId: createAssignment
      parameters:
      - name: appointmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssignmentRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AssignmentResponse"
  /v1/shop-manager/{locationId}/workorders/{workorderId}/operationalContext:
    get:
      tags:
      - Workorder Operational Context API
      summary: View workorder operational context
      description: Read-only operational context view for workorders used by UI with
        optional filters.
      operationId: viewOpenWorkordersByShop
      parameters:
      - name: locationId
        in: path
        description: Shop location ID
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      - name: workorderId
        in: path
        description: Workorder ID
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      - name: filters
        in: query
        description: Optional filter parameters
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Operational context retrieved successfully.
          content:
            '*/*':
              schema: {}
  /v1/shop-manager/{locationId}/technicians/{personId}/person:
    get:
      tags:
      - Shop API
      summary: Get technician's person details
      description: Retrieve the person details for a technician by technician ID.
      operationId: getTechnicianPerson
      parameters:
      - name: locationId
        in: path
        description: ID of the shop
        required: true
        schema:
          type: string
          format: uuid
        example: 1
      - name: personId
        in: path
        description: ID of the technician
        required: true
        schema:
          type: string
          format: uuid
        example: 1
      responses:
        "404":
          description: Technician or person not found.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PersonDTO"
        "200":
          description: Person details returned successfully.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PersonDTO"
  /v1/shop-manager/{locationId}/services/{serviceId}/details:
    get:
      tags:
      - Shop API
      summary: Get shop service details
      description: Retrieve the details of a shop service by service ID.
      operationId: getShopServiceDetails
      parameters:
      - name: locationId
        in: path
        description: ID of the shop
        required: true
        schema:
          type: string
          format: uuid
        example: 1
      - name: serviceId
        in: path
        description: ID of the service
        required: true
        schema:
          type: string
          format: uuid
        example: 1
      responses:
        "404":
          description: Service not found.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ServiceEntityDTO"
        "200":
          description: Service details returned successfully.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ServiceEntityDTO"
  /v1/shop-manager/{locationId}/mobileUnit/{bayId}:
    get:
      tags:
      - Shop Mobile Unit API
      summary: Get mobile units
      description: List all mobile units or get a specific mobile unit detail by locationId
        and bayId.
      operationId: getMobileUnits_1
      parameters:
      - name: locationId
        in: path
        description: Location ID (optional for specific mobile unit)
        required: true
        schema:
          type: integer
          format: int64
      - name: bayId
        in: path
        description: Bay ID (optional for specific mobile unit)
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Mobile units retrieved successfully.
          content:
            '*/*':
              schema: {}
    delete:
      tags:
      - Shop Mobile Unit API
      summary: Delete mobile unit
      description: Delete a specific mobile unit by locationId and bayId.
      operationId: deleteMobileUnit
      parameters:
      - name: locationId
        in: path
        description: Shop location ID
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      - name: bayId
        in: path
        description: Bay ID
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "204":
          description: Mobile unit deleted successfully.
        "404":
          description: Mobile unit not found.
  /v1/shop-manager/{locationId}/bays/{bayId}:
    get:
      tags:
      - Shop Bay API
      summary: Get bays
      description: List all bays or get a specific bay detail by locationId and bayId.
      operationId: getBays_1
      parameters:
      - name: locationId
        in: path
        description: Location ID (optional for specific bay)
        required: true
        schema:
          type: integer
          format: int64
      - name: bayId
        in: path
        description: Bay ID (optional for specific bay)
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Bays retrieved successfully.
          content:
            '*/*':
              schema: {}
    delete:
      tags:
      - Shop Bay API
      summary: Delete bay
      description: Delete a specific bay by locationId and bayId.
      operationId: deleteBay
      parameters:
      - name: locationId
        in: path
        description: Shop location ID
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      - name: bayId
        in: path
        description: Bay ID
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "404":
          description: Bay not found.
        "204":
          description: Bay deleted successfully.
  /v1/schedules/view:
    get:
      tags:
      - Schedule API
      summary: View schedule
      description: Read-only schedule view for a location and date.
      operationId: viewSchedule
      parameters:
      - name: locationId
        in: query
        description: Location ID
        required: true
        schema:
          type: string
          format: uuid
      - name: date
        in: query
        description: Date in YYYY-MM-DD
        required: true
        schema:
          type: string
          format: date
      - name: resourceType
        in: query
        description: Optional resource type filter
        required: false
        schema:
          type: string
      - name: resourceId
        in: query
        description: Optional single resource filter
        required: false
        schema:
          type: string
      - name: includeAvailabilityOverlay
        in: query
        description: Include HR availability overlay
        required: false
        schema:
          type: boolean
          default: false
      - name: range
        in: query
        description: Schedule window range
        required: false
        schema:
          type: string
          default: LOCATION_HOURS
      - name: X-Correlation-Id
        in: header
        description: Correlation ID for request tracing
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "400":
          description: Invalid input parameters
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ScheduleViewResponse"
        "200":
          description: Schedule retrieved successfully.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ScheduleViewResponse"
        "403":
          description: Not authorized for this location
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ScheduleViewResponse"
        "404":
          description: Location or resource not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ScheduleViewResponse"
  /v1/appointments/{appointmentId}:
    get:
      tags:
      - Appointments API
      summary: Load appointment
      description: Retrieve an appointment by ID
      operationId: getAppointment
      parameters:
      - name: appointmentId
        in: path
        description: Appointment ID
        required: true
        schema:
          type: string
        example: appt-123
      - name: X-Correlation-Id
        in: header
        description: Correlation ID for request tracing
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "501":
          description: Not implemented.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
        "404":
          description: Appointment not found.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
        "200":
          description: Appointment retrieved successfully.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
  /v1/appointments/{appointmentId}/cancel:
    delete:
      tags:
      - Appointments API
      summary: Cancel appointment
      description: Cancel a scheduled appointment
      operationId: cancelAppointment
      parameters:
      - name: appointmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelAppointmentRequest"
        required: true
      responses:
        "409":
          description: Appointment state conflict.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
        "200":
          description: Appointment cancelled successfully.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
components:
  schemas:
    RescheduleAppointmentRequest:
      type: object
      properties:
        newStartAt:
          type: string
          format: date-time
        newEndAt:
          type: string
          format: date-time
        reason:
          type: string
          enum:
          - CUSTOMER_REQUEST
          - SHOP_CAPACITY
          - EQUIPMENT_ISSUE
          - MECHANIC_UNAVAILABLE
          - PARTS_DELAY
          - WEATHER
          - EMERGENCY
          - MANAGER_DISCRETION
          - OTHER
        rescheduleReasonNotes:
          type: string
          maxLength: 1000
          minLength: 0
        notifyCustomer:
          type: boolean
      required:
      - newEndAt
      - newStartAt
      - reason
    AppointmentResponse:
      type: object
      properties:
        appointmentId:
          type: string
          format: uuid
        status:
          type: string
        locationId:
          type: string
          format: uuid
        resourceId:
          type: string
        crmCustomerId:
          type: string
          format: uuid
        crmVehicleId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        cancellationReason:
          type: string
        cancellationNotes:
          type: string
        serviceRequestIds:
          type: array
          items:
            type: string
            format: uuid
        customerSnapshot:
          type: object
          additionalProperties: {}
        vehicleSnapshot:
          type: object
          additionalProperties: {}
    AppointmentCreateRequest:
      type: object
      description: Appointment creation request body
      properties:
        crmCustomerId:
          type: string
          format: uuid
        crmVehicleId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        resourceId:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        serviceRequestIds:
          type: array
          items:
            type: string
            format: uuid
        workorderLinkRef:
          type: string
        sourceType:
          type: string
          enum:
          - ESTIMATE
          - WORK_ORDER
        sourceId:
          type: string
      required:
      - crmCustomerId
      - crmVehicleId
      - endAt
      - locationId
      - serviceRequestIds
      - startAt
    ConflictOverrideRequest:
      type: object
      properties:
        appointmentId:
          type: string
          format: uuid
        overrideReason:
          type: string
        conflictDetails:
          type: string
    ConflictOverrideResponse:
      type: object
      properties:
        overrideId:
          type: string
          format: uuid
        appointmentId:
          type: string
          format: uuid
        overriddenByUserId:
          type: string
        overrideTimestamp:
          type: string
          format: date-time
        overrideReason:
          type: string
    CreateAssignmentRequest:
      type: object
      properties:
        appointmentId:
          type: string
          format: uuid
        mechanics:
          type: array
          items:
            $ref: "#/components/schemas/MechanicAssignmentItem"
        resourceId:
          type: string
          format: uuid
        resourceType:
          type: string
        override:
          type: boolean
        overrideReason:
          type: string
    MechanicAssignmentItem:
      type: object
      properties:
        mechanicPersonId:
          type: string
        role:
          type: string
          enum:
          - LEAD
          - ASSIST
    AssignedMechanicInfo:
      type: object
      properties:
        mechanicId:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - LEAD
          - ASSIST
    AssignmentResponse:
      type: object
      properties:
        assignmentId:
          type: string
          format: uuid
        appointmentId:
          type: string
          format: uuid
        mechanics:
          type: array
          items:
            $ref: "#/components/schemas/AssignedMechanicInfo"
        resourceId:
          type: string
          format: uuid
        resourceType:
          type: string
        status:
          type: string
          enum:
          - CONFIRMED
          - IN_PROGRESS
          - COMPLETED
          - CANCELLED
        override:
          type: boolean
        assignmentNotes:
          type: string
        assignedAt:
          type: string
          format: date-time
        lastUpdatedAt:
          type: string
          format: date-time
    PersonDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        primaryEmail:
          type: string
        secondaryEmail:
          type: string
        phoneNumbers:
          type: array
          items:
            type: string
        username:
          type: string
    ServiceEntityDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
    ConflictDetails:
      type: object
      properties:
        conflictingEventIds:
          type: array
          items:
            type: string
    ScheduleEventView:
      type: object
      properties:
        eventId:
          type: string
        eventType:
          type: string
        subType:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        title:
          type: string
        hasConflict:
          type: boolean
        severity:
          type: string
        conflictDetails:
          $ref: "#/components/schemas/ConflictDetails"
    ScheduleResourceView:
      type: object
      properties:
        resourceId:
          type: string
        resourceType:
          type: string
        resourceName:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleEventView"
    ScheduleViewResponse:
      type: object
      properties:
        locationId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        viewGeneratedAt:
          type: string
          format: date-time
        dayStartAt:
          type: string
          format: date-time
        dayEndAt:
          type: string
          format: date-time
        availabilityOverlayStatus:
          type: string
        warnings:
          type: array
          items:
            type: string
        resources:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleResourceView"
    CancelAppointmentRequest:
      type: object
      properties:
        cancellationReason:
          type: string
          enum:
          - CUSTOMER_REQUEST
          - TECHNICIAN_UNAVAILABLE
          - WEATHER
          - VEHICLE_NOT_READY
          - OTHER
        notes:
          type: string
      required:
      - cancellationReason
