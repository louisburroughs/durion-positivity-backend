spring:
  application:
    name: shop-manager
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  flyway:
    out-of-order: ${SPRING_FLYWAY_OUT_OF_ORDER:false}
  cloud:
    discovery:
      enabled: true
  boot:
    admin:
      client:
        enabled: true

server:
  port: 0
  tomcat:
    max-http-header-size: 65536

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    org:
      springframework: INFO
    com:
      positivity:
        shop: INFO

      netflix:
        discovery:
          shared:
            resolver:
              aws:
                ConfigClusterResolver: WARN
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

  default-produces-media-type: application/json
pos:
  crm:
    connect-timeout-ms: ${POS_CRM_CONNECT_TIMEOUT_MS:200}
    read-timeout-ms: ${POS_CRM_READ_TIMEOUT_MS:2000}
  customer:
    service-id: ${POS_CUSTOMER_SERVICE_ID:customer}
  people:
    service-id: ${POS_PEOPLE_SERVICE_ID:people}
  location:
    service-id: ${POS_LOCATION_SERVICE_ID:location}
  catalog:
    service-id: ${POS_CATALOG_SERVICE_ID:catalog}
