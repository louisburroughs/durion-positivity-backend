spring:
  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  application:
    name: shop-manager
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  flyway:
    out-of-order: ${SPRING_FLYWAY_OUT_OF_ORDER:false}
  cloud:
    discovery:
      enabled: true
  boot:
    admin:
      client:
        enabled: true

server:
  port: 0
  tomcat:
    max-http-header-size: 65536

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    org:
      springframework: INFO
    com:
      positivity:
        shop: INFO

      netflix:
        discovery:
          shared:
            resolver:
              aws:
                ConfigClusterResolver: WARN
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

  default-produces-media-type: application/json
pos:
  crm:
    connect-timeout-ms: ${POS_CRM_CONNECT_TIMEOUT_MS:200}
    read-timeout-ms: ${POS_CRM_READ_TIMEOUT_MS:2000}
  customer:
    service-id: ${POS_CUSTOMER_SERVICE_ID:customer}
  shop-manager:
    kafka:
      # Staffing-assignment replica feed (ADR-0044 §6, #877)
      enabled: ${POS_SHOP_MANAGER_KAFKA_ENABLED:false}
      people-events-topic: ${POS_SHOP_MANAGER_PEOPLE_EVENTS_TOPIC:people.events.v1}
      people-events-consumer-group: ${POS_SHOP_MANAGER_PEOPLE_EVENTS_CONSUMER_GROUP:pos-shop-manager-people-events}
      # Customer-party + vehicle replica feeds + reconciliation (ADR-0044 §6, #891)
      customer-events-topic: ${POS_SHOP_MANAGER_CUSTOMER_EVENTS_TOPIC:customer.events.v1}
      customer-events-consumer-group: ${POS_SHOP_MANAGER_CUSTOMER_EVENTS_CONSUMER_GROUP:pos-shop-manager-customer-events}
      customer-manifest-topic: ${POS_SHOP_MANAGER_CUSTOMER_MANIFEST_TOPIC:customer.manifest.v1}
      customer-manifest-consumer-group: ${POS_SHOP_MANAGER_CUSTOMER_MANIFEST_CONSUMER_GROUP:pos-shop-manager-customer-manifests}
      customer-commands-topic: ${POS_SHOP_MANAGER_CUSTOMER_COMMANDS_TOPIC:customer.commands.v1}
      vehicle-events-topic: ${POS_SHOP_MANAGER_VEHICLE_EVENTS_TOPIC:vehicle.events.v1}
      vehicle-events-consumer-group: ${POS_SHOP_MANAGER_VEHICLE_EVENTS_CONSUMER_GROUP:pos-shop-manager-vehicle-events}
      vehicle-manifest-topic: ${POS_SHOP_MANAGER_VEHICLE_MANIFEST_TOPIC:vehicle.manifest.v1}
      vehicle-manifest-consumer-group: ${POS_SHOP_MANAGER_VEHICLE_MANIFEST_CONSUMER_GROUP:pos-shop-manager-vehicle-manifests}
      vehicle-commands-topic: ${POS_SHOP_MANAGER_VEHICLE_COMMANDS_TOPIC:vehicle.commands.v1}
  catalog:
    service-id: ${POS_CATALOG_SERVICE_ID:catalog}
