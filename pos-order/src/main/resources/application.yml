# POS Order Service
spring:
  application:
    name: order
  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: pos-order-events
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 0
  tomcat:
    max-http-header-size: 65536

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com:
      positivity:
        order: INFO
      netflix:
        discovery:
          shared:
            resolver:
              aws:
                ConfigClusterResolver: WARN
    org:
      springframework:
        web: INFO
      hibernate: INFO
pos:
  order:
    kafka:
      # Domain-event publishing + replica feeds (ADR-0044, parity stories D1/I2). Off until the
      # broker is provisioned; flip POS_ORDER_KAFKA_ENABLED per environment.
      enabled: ${POS_ORDER_KAFKA_ENABLED:false}
      # CRM replica feeds (ADR-0044 §6): ext_customer / ext_vehicle
      customer-events-topic: ${POS_ORDER_CUSTOMER_EVENTS_TOPIC:customer.events.v1}
      customer-events-consumer-group: ${POS_ORDER_CUSTOMER_EVENTS_CONSUMER_GROUP:pos-order-customer-events}
      vehicle-events-topic: ${POS_ORDER_VEHICLE_EVENTS_TOPIC:vehicle.events.v1}
      vehicle-events-consumer-group: ${POS_ORDER_VEHICLE_EVENTS_CONSUMER_GROUP:pos-order-vehicle-events}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  default-produces-media-type: application/json
