# POS Order Service
spring:
  application:
    name: order
  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: pos-order-events
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    placeholders:
      # V4 stamps drawers that predate CAP:550 S16 with the configured functional currency (ADR-0067
      # R-2: never an implicit one). FlywayConfig passes it for the application; this entry serves
      # Spring Boot's own Flyway (the @DataJpaTest slices). A versioned migration's checksum is taken
      # before placeholders are replaced, so a later change of the value does not fail validation.
      functional_currency: ${pos.order.functional-currency}

server:
  port: 0
  tomcat:
    max-http-header-size: 65536

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com:
      positivity:
        order: INFO
      netflix:
        discovery:
          shared:
            resolver:
              aws:
                ConfigClusterResolver: WARN
    org:
      springframework:
        web: INFO
      hibernate: INFO
pos:
  # ADR-0062 section 9 (plan WS3): the transitional default tenant. Every unbound path (a request
  # without X-Tenant-Id, a record without the tenant header, a scheduler with no registry entry)
  # runs as the alpha default tenant. Unset it (POS_TENANCY_DEFAULT_TENANT_ID=) once every client
  # sends a tenant: the runtime is then strict and an unbound request is a 401.
  tenancy:
    default-tenant-id: ${POS_TENANCY_DEFAULT_TENANT_ID:01900000-0000-7000-8000-000000000001}
  order:
    kafka:
      # Domain-event publishing + replica feeds (ADR-0044, parity stories D1/I2): tier-1 rails, no flag.
      # CRM replica feeds (ADR-0044 §6): ext_customer / ext_vehicle
      customer-events-topic: ${POS_ORDER_CUSTOMER_EVENTS_TOPIC:customer.events.v1}
      customer-events-consumer-group: ${POS_ORDER_CUSTOMER_EVENTS_CONSUMER_GROUP:pos-order-customer-events}
      vehicle-events-topic: ${POS_ORDER_VEHICLE_EVENTS_TOPIC:vehicle.events.v1}
      vehicle-events-consumer-group: ${POS_ORDER_VEHICLE_EVENTS_CONSUMER_GROUP:pos-order-vehicle-events}
      # Catalog/location reference replicas (parity stories B1/B3)
      catalog-events-topic: ${POS_ORDER_CATALOG_EVENTS_TOPIC:catalog.events.v1}
      catalog-events-consumer-group: ${POS_ORDER_CATALOG_EVENTS_CONSUMER_GROUP:pos-order-catalog-events}
      location-events-topic: ${POS_ORDER_LOCATION_EVENTS_TOPIC:location.events.v1}
      location-events-consumer-group: ${POS_ORDER_LOCATION_EVENTS_CONSUMER_GROUP:pos-order-location-events}
      # Settlement handshake (parity story C3): pos-invoice per-payment settlement facts
      payment-events-topic: ${POS_ORDER_PAYMENT_EVENTS_TOPIC:payment.events.v1}
      payment-events-consumer-group: ${POS_ORDER_PAYMENT_EVENTS_CONSUMER_GROUP:pos-order-payment-events}
      # Source-document replicas (parity story E1): estimate/workorder snapshots
      workorder-events-topic: ${POS_ORDER_WORKORDER_EVENTS_TOPIC:workorder.events.v1}
      workorder-events-consumer-group: ${POS_ORDER_WORKORDER_EVENTS_CONSUMER_GROUP:pos-order-workorder-events}
      # Accounting's facts (CAP:550 S16, #2512): petty-expense categories and register floats into
      # pos-order's copies, the accounting reconciliation manifest, and drift-repair replay requests.
      accounting-events-topic: ${POS_ORDER_ACCOUNTING_EVENTS_TOPIC:accounting.events.v1}
      accounting-events-consumer-group: ${POS_ORDER_ACCOUNTING_EVENTS_CONSUMER_GROUP:pos-order-accounting-events}
      accounting-manifest-topic: ${POS_ORDER_ACCOUNTING_MANIFEST_TOPIC:accounting.manifest.v1}
      accounting-manifest-consumer-group: ${POS_ORDER_ACCOUNTING_MANIFEST_CONSUMER_GROUP:pos-order-accounting-manifests}
      accounting-commands-topic: ${POS_ORDER_ACCOUNTING_COMMANDS_TOPIC:accounting.commands.v1}
    # Reconciliation manifests of order.events.v1, one per tenant per closed window (ADR-0044 section 4,
    # #2579): consumers compare their processed-events log and send order.outbox.replay-requested on
    # order.commands.v1 when a window disagrees.
    manifest:
      topic: ${POS_ORDER_MANIFEST_TOPIC:order.manifest.v1}
      window: ${POS_ORDER_MANIFEST_WINDOW:PT1H}
      grace: ${POS_ORDER_MANIFEST_GRACE:PT5M}
    pricing:
      # PriceQuoteRequest requires a customerTierId; served from config until a customer→tier
      # mapping feed exists (the ext_customer replica carries only the tier name). Story B1.
      default-customer-tier-id: ${POS_ORDER_DEFAULT_CUSTOMER_TIER_ID:00000000-0000-0000-0000-000000000000}
    quote:
      # Counter-quote validity horizon (ISO-8601 duration; parity story A3)
      validity: ${POS_ORDER_QUOTE_VALIDITY:P7D}
    # The functional currency of drawer money (ADR-0067 R-2, R-6), a Stage A interim until step A5
    # reads the tenant's: REQUIRED, no default; an unset or non-ISO value fails startup. A drawer is
    # stamped with it when it opens, and its movements, approvals and close fact use that stamp, so a
    # change applies to drawers opened afterwards. A request in another currency is 422
    # CURRENCY_NOT_SUPPORTED.
    functional-currency: ${POS_ORDER_FUNCTIONAL_CURRENCY}
    session:
      # The over/short tolerance above which a close needs order:session:approve_variance is the
      # tenant's drawer policy (GET/PUT /v1/orders/session-policy, CAP:550 S16), not a setting here.
      # A manager's single-use cash-movement approval token expires after this long (AW31).
      approval-token-ttl: ${POS_ORDER_SESSION_APPROVAL_TOKEN_TTL:PT5M}
      # Failed approvals one manager sign-in name may take on one drawer session before the step-up
      # stops asking pos-security-service for it. Each failure counts against that manager's sign-in
      # lockout (pos.security.lockout.max-attempts, 5), so keep this BELOW it: a cashier must not be
      # able to lock a manager out from the register.
      max-denied-approvals: ${POS_ORDER_SESSION_MAX_DENIED_APPROVALS:3}
      # CAP:550 S40 (#2578): at start, re-emit order.session.opened for every OPEN or CLOSING session, per
      # tenant (ADR-0044 §4), so pos-accounting's register-relocation guard heals a lost or missed fact.
      bootstrap-republish:
        enabled: ${POS_ORDER_SESSION_BOOTSTRAP_REPUBLISH_ENABLED:true}
  price:
    service-id: ${POS_PRICE_SERVICE_ID:price}
  tax:
    # Direct-call exception (#641): pos-tax is internal-only, register-with-eureka: false
    base-url: ${POS_TAX_BASE_URL:http://pos-tax:8091}
  invoice:
    # Scoped ADR-0044 exception (checkout invoice creation + saga payment reversal)
    service-id: ${POS_INVOICE_SERVICE_ID:invoice}
  security-service:
    # Utility module (ADR-0044 section 1): the internal step-up credential check behind a manager's
    # cash-movement approval (CAP:550 S16, AW31). Load-balanced inside the mesh, never via the gateway.
    service-id: ${POS_SECURITY_SERVICE_ID:security-service}
    # A cashier waits on the step-up at the register: fail fast rather than hang the drawer.
    connect-timeout: ${POS_SECURITY_SERVICE_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${POS_SECURITY_SERVICE_READ_TIMEOUT:PT5S}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  default-produces-media-type: application/json
