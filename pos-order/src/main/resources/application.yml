# POS Order Service
spring:
  application:
    name: order
  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 0
  tomcat:
    max-http-header-size: 65536

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com:
      positivity:
        order: INFO
      netflix:
        discovery:
          shared:
            resolver:
              aws:
                ConfigClusterResolver: WARN
    org:
      springframework:
        web: INFO
      hibernate: INFO
pos:
  order:
    kafka:
      # Domain-event publishing (ADR-0044, parity story D1). Off until the broker is
      # provisioned; flip POS_ORDER_KAFKA_ENABLED per environment.
      enabled: ${POS_ORDER_KAFKA_ENABLED:false}
  inventory:
    base-url: ${POS_INVENTORY_BASE_URL:http://pos-inventory:8080}
  customer:
    base-url: ${POS_CUSTOMER_BASE_URL:http://pos-customer:8080}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  default-produces-media-type: application/json
