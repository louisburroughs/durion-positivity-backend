domain: order
serviceName: pos-order
version: "1.0"
permissions:
  - name: "order:order:view"
    description: "View orders"
  - name: "order:order:create"
    description: "Create orders"
  - name: "order:order:edit"
    description: "Edit orders"
  - name: "order:order:cancel"
    description: "Cancel orders"
  - name: "order:order:discount"
    description: "Apply or remove an order-level discount"
  - name: "order:order:quote"
    description: "Convert a cart to a counter quote and reopen quotes"
  - name: "order:order:checkout"
    description: "Check out a cart: freeze lines, create the fronting invoice, enter PENDING_PAYMENT"
  - name: "order:order:void"
    description: "Void an unsettled PENDING_PAYMENT order and cancel its invoice"
  - name: "order:order:charge_on_account"
    description: "Check out with ON_ACCOUNT tender: charge a validated commercial customer's account"
  - name: "order:line:view"
    description: "View order lines"
  - name: "order:line:create"
    description: "Add order lines"
  - name: "order:line:edit"
    description: "Edit order lines"
  - name: "order:line:delete"
    description: "Remove order lines"
  - name: "order:session:open"
    description: "Open a register session for a terminal"
  - name: "order:session:view"
    description: "View register sessions, cash movements, and X/Z reports"
  - name: "order:session:cash_movement"
    description: "Record a cash paid-in or paid-out movement against an open register session"
  - name: "order:session:close"
    description: "Begin and confirm the close of a register session with a counted cash count"
  - name: "order:session:approve_variance"
    description: "Approve a register session close whose over/short exceeds the authorized difference limit"
  - name: "order:return:create"
    description: "Create a return against a completed order"
  - name: "order:return:approve"
    description: "Approve a return whose refund exceeds the approval threshold"
  - name: "order:return:view"
    description: "View returns and per-line returnable quantities"
  - name: "order:line:enter_manual_price"
    description: "Allows a POS clerk to manually enter a price for an order line when the pricing service is unavailable"
  - name: "order:price_override:view"
    description: "View price override history and reports"
  - name: "order:price_override:apply"
    description: "Apply/request a price override"
  - name: "order:price_override:approve"
    description: "Approve price overrides"
  - name: "order:price_override:reject"
    description: "Cancel/reject price overrides"
