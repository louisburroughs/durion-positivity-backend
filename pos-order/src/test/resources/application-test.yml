spring:
  security:
    user:
      password: test-password
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false
  h2:
    console:
      enabled: false
  main:
    allow-bean-definition-overriding: true

# Test contexts never reach pos-security-service or pos-event-receiver. Skip permission registration
# (its startup retry loop otherwise sleeps ~8 s in every Spring test context) and point the event-type
# initializer at a loopback port that refuses instantly. Same arrangement as pos-mcp-server's test profile.
pos.security.permission-registration.enabled: false
pos.events.base-url: http://127.0.0.1:1

# ADR-0067 R-2: the functional currency has no default in application.yml; tests state it.
pos.order.functional-currency: USD
