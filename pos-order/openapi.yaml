  /v1/orders/purchase-orders/{poId}/supplier-availability:
    get:
      description: 'Asks a vendor what it can supply against every line of a purchase order, in one inquiry, and returns the answer per line.

        Use this tool when a buyer is deciding what to order and needs what the vendor says now; do not use the availability endpoints for this, which report owned stock rather than what a supplier could send.

        Preconditions: the purchase order must exist; the vendor profile and delivery location are both required, because availability is consignee-specific and answering for another location answers a different question.

        Required inputs: poId path parameter, and vendorProfileId and deliveryLocationId query parameters.

        Emits an ORDER_PURCHASE_ORDER_AVAILABILITY audit event; no state changes, and a supplier that cannot be reached degrades the answer rather than failing the request.

        Returns 200 with a document status of SUPPLIER_UNAVAILABLE and no line quantities when the vendor could not be asked; availableQuantity is null where the vendor stated nothing and zero only where it stated it has none, and 404 when the purchase order does not exist.

        '
      operationId: getPurchaseOrderSupplierAvailability
      parameters:
      - description: Purchase order id (UUIDv7)
        in: path
        name: poId
        required: true
        schema:
          format: uuid
          type: string
      - description: Vendor profile to ask
        in: query
        name: vendorProfileId
        required: true
        schema:
          format: uuid
          type: string
      - description: Delivery location the answer is for
        in: query
        name: deliveryLocationId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcurementAvailability'
          description: Vendor availability, possibly degraded
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Purchase order not found
      security:
      - bearerAuth:
        - order:purchase_order:availability_view
      summary: Read Live Vendor Availability For A Purchase Order
      tags:
      - Purchase Orders
      x-required-permissions:
      - order:purchase_order:availability_view
  /v1/orders/purchase-orders/{poId}/transmit:
    post:
      description: 'Sends an approved purchase order to the supplier named on it, asking pos-supplier to transmit it and report back what the vendor says.

        Use this tool to actually place an order with a vendor; do not use approvePurchaseOrder for this, which commits the spend internally and sends nothing to anyone.

        Preconditions: the order must be APPROVED or PARTIALLY_RECEIVED, must name a supplierRef, must have no transmission already in flight or awaiting review, and every line must carry an article code the vendor would recognise.

        Required inputs: poId (UUIDv7) path parameter; there is no request body, because what is sent is the order as it stands.

        Emits an ORDER_PURCHASE_ORDER_TRANSMIT event and queues a supplier order command; the vendor''s answer arrives later and appears on the order''s transmission state and timeline.

        Returns 404 when the purchase order does not exist, and 422 with a code naming the obstacle when the order cannot be sent: SUPPLIER_REF_MISSING, PURCHASE_ORDER_NOT_APPROVED, TRANSMISSION_IN_FLIGHT, TRANSMISSION_AWAITING_REVIEW, ARTICLE_NOT_IDENTIFIABLE or FRACTIONAL_QUANTITY.

        '
      operationId: transmitPurchaseOrder
      parameters:
      - description: Purchase order id (UUIDv7)
        in: path
        name: poId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '202':
          description: Transmission requested
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Purchase order not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: The order cannot be transmitted as it stands
      security:
      - bearerAuth:
        - order:purchase_order:transmit
      summary: Transmit Purchase Order To Vendor
      tags:
      - Purchase Orders
      x-required-permissions:
      - order:purchase_order:transmit
