openapi: 3.1.0
info:
  title: Positivity Order API
  description: API documentation for the Order service, accessible via the API Gateway.
  contact:
    name: Durion Support Services
    email: louis.burroughs@gmail.com
  version: v1
servers:
- url: http://localhost:8086
  description: Generated server url
tags:
- name: Order Cancellation
  description: Cancel orders and retry failed cancellations
- name: Price Overrides
  description: Price override management with approval workflow
- name: Sales Orders
  description: Sales order cart management
paths:
  /v1/orders/carts/{orderId}/items/{lineId}:
    put:
      tags:
      - Sales Orders
      summary: Update a sales order cart item quantity
      description: Update the quantity for an existing sales order line item in a cart.
      operationId: updateItemQuantity
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: lineId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItemRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderLineResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - AUTHENTICATED
    delete:
      tags:
      - Sales Orders
      summary: Remove an item from a sales order cart
      description: Remove a line item from an existing sales order cart.
      operationId: removeItem
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: lineId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
      security:
      - bearerAuth: []
      x-required-permissions:
      - AUTHENTICATED
  /v1/orders/price-overrides:
    get:
      tags:
      - Price Overrides
      summary: Get price overrides
      description: Retrieve price overrides by order ID, status, or date range. At least one filter parameter is required.
      operationId: getOverridesByOrder
      parameters:
      - name: orderId
        in: query
        description: Order ID filter
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: Override status filter
        required: false
        schema:
          type: string
      - name: startDate
        in: query
        description: Start date for date range filter
        required: false
        schema:
          type: string
      - name: endDate
        in: query
        description: End date for date range filter
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Overrides retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceOverrideDetail'
        '400':
          description: No filter parameter provided
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceOverrideDetail'
      security:
      - bearerAuth:
        - order:price_override:view
      x-required-permissions:
      - order:price_override:view
    post:
      tags:
      - Price Overrides
      summary: Apply price override
      description: Apply a price override to an order line. May require approval based on override amount.
      operationId: applyPriceOverride
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyPriceOverrideRequest'
        required: true
      responses:
        '201':
          description: Override created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceOverrideResult'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceOverrideResult'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceOverrideResult'
      security:
      - bearerAuth:
        - order:price_override:apply
      x-required-permissions:
      - order:price_override:apply
  /v1/orders/price-overrides/{overrideId}/reject:
    post:
      tags:
      - Price Overrides
      summary: Reject price override
      description: Reject a pending price override with a reason.
      operationId: rejectPriceOverride
      parameters:
      - name: overrideId
        in: path
        description: Price override ID
        required: true
        schema:
          type: string
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectPriceOverrideRequest'
        required: true
      responses:
        '200':
          description: Override rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceOverrideDetail'
        '400':
          description: Invalid request or override not in pending state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceOverrideDetail'
        '403':
          description: Insufficient rejection permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceOverrideDetail'
        '404':
          description: Override not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceOverrideDetail'
      security:
      - bearerAuth:
        - order:price_override:reject
      x-required-permissions:
      - order:price_override:reject
  /v1/orders/price-overrides/{overrideId}/approve:
    post:
      tags:
      - Price Overrides
      summary: Approve price override
      description: Approve a pending price override. Validates approver permission level.
      operationId: approvePriceOverride
      parameters:
      - name: overrideId
        in: path
        description: Price override ID
        required: true
        schema:
          type: string
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovePriceOverrideRequest'
        required: true
      responses:
        '200':
          description: Override approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceOverrideDetail'
        '400':
          description: Invalid request or override not in pending state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceOverrideDetail'
        '403':
          description: Insufficient approval permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceOverrideDetail'
        '404':
          description: Override not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceOverrideDetail'
      security:
      - bearerAuth:
        - order:price_override:approve
      x-required-permissions:
      - order:price_override:approve
  /v1/orders/carts:
    post:
      tags:
      - Sales Orders
      summary: Create a sales order cart
      description: Create a new sales order cart for a customer, terminal, and optional vehicle context.
      operationId: createCart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCartRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - AUTHENTICATED
  /v1/orders/carts/{orderId}/items:
    post:
      tags:
      - Sales Orders
      summary: Add an item to a sales order cart
      description: Add a line item to an existing sales order cart using SKU, quantity, and optional pricing context.
      operationId: addItem
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddItemRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderLineResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - AUTHENTICATED
  /v1/orders/carts/{orderId}/cancel:
    post:
      tags:
      - Order Cancellation
      summary: Cancel order
      description: Initiate cancellation for a sales order cart using the supplied cancellation context.
      operationId: cancelOrder
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
        required: true
      responses:
        '201':
          description: Cancellation initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationResponse'
        '409':
          description: Order cannot be cancelled in current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationResponse'
      security:
      - bearerAuth:
        - order:order:cancel
      x-required-permissions:
      - order:order:cancel
  /v1/orders/carts/{orderId}/cancel/retry:
    post:
      tags:
      - Order Cancellation
      summary: Retry failed cancellation
      description: Retry a previously failed order cancellation using the original idempotency key.
      operationId: retryCancellation
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: idempotencyKey
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Retry accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationResponse'
        '409':
          description: Order not in retryable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationResponse'
      security:
      - bearerAuth:
        - order:order:cancel
      x-required-permissions:
      - order:order:cancel
  /v1/orders/carts/{orderId}/source:
    patch:
      tags:
      - Sales Orders
      summary: Link a source to a sales order
      description: Associate an external source reference with an existing sales order cart.
      operationId: linkSource
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkSourceRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - AUTHENTICATED
  /v1/orders/price-overrides/{overrideId}:
    get:
      tags:
      - Price Overrides
      summary: Get price override
      description: Retrieve a specific price override by ID.
      operationId: getOverride
      parameters:
      - name: overrideId
        in: path
        description: Price override ID
        required: true
        schema:
          type: string
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
      responses:
        '200':
          description: Override found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceOverrideDetail'
        '404':
          description: Override not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceOverrideDetail'
      security:
      - bearerAuth:
        - order:price_override:view
      x-required-permissions:
      - order:price_override:view
  /v1/orders/price-overrides/pending:
    get:
      tags:
      - Price Overrides
      summary: Get pending approvals
      description: Retrieve all price overrides awaiting approval.
      operationId: getPendingApprovals
      responses:
        '200':
          description: Pending overrides retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceOverrideDetail'
      security:
      - bearerAuth:
        - order:price_override:approve
      x-required-permissions:
      - order:price_override:approve
  /v1/orders/carts/{orderId}:
    get:
      tags:
      - Sales Orders
      summary: Get a sales order by ID
      description: Retrieve a sales order cart and its current line items by identifier.
      operationId: getOrder
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - AUTHENTICATED
components:
  schemas:
    UpdateItemRequest:
      type: object
      description: Request payload for updating an existing cart item line
      properties:
        quantity:
          type: integer
          format: int32
          description: Updated quantity for the item line
          example: 3
          minimum: 1
      required:
      - quantity
    SalesOrderLineResponse:
      type: object
      description: Response representing a single line on a sales order
      properties:
        orderLineId:
          type: string
          description: Unique identifier of the order line
          example: 01960003-0000-7000-8000-000000000002
        itemSku:
          type: string
          description: Stock keeping unit identifying the line item
          example: SKU-OIL-5W30-1L
        itemDescription:
          type: string
          description: Human-readable description of the line item
          example: Synthetic Motor Oil 5W-30 1L
        quantity:
          type: integer
          format: int32
          description: Quantity of the item on the line
          example: 2
        unitPrice:
          type: number
          description: Unit price applied to the line
          example: 19.99
        fulfillmentStatus:
          type: string
          description: Fulfillment status of the line
          example: PENDING
        priceSource:
          type: string
          description: Source of the line price (e.g. CATALOG, MANUAL, OVERRIDE)
          example: CATALOG
        reasonCode:
          type: string
          description: Reason code associated with a manual price or special handling
          example: PRICE_MATCH
        sourceType:
          type: string
          description: Type classification of the line's originating source
          example: WORKORDER
        sourceId:
          type: string
          description: Identifier of the originating source record
          example: 01960003-0000-7000-8000-000000000004
        sourceLineId:
          type: string
          description: Identifier of the originating source line
          example: 01960003-0000-7000-8000-000000000006
      required:
      - itemSku
      - orderLineId
      - quantity
    ApplyPriceOverrideRequest:
      type: object
      description: Request payload for applying a price override to an order line
      properties:
        orderId:
          type: string
          description: Identifier of the order whose line is being overridden
          example: 01960003-0000-7000-8000-000000000001
          minLength: 1
        orderLineId:
          type: string
          description: Identifier of the order line receiving the price override
          example: 01960003-0000-7000-8000-000000000002
          minLength: 1
        productId:
          type: string
          description: Identifier of the product on the order line
          example: 01960003-0000-7000-8000-000000000003
          minLength: 1
        originalPrice:
          type: number
          description: Original price of the line before the override
          example: 49.99
          minimum: 0.0
        overridePrice:
          type: number
          description: Overridden price to apply to the line
          example: 39.99
          minimum: 0.0
        reasonCode:
          type: string
          description: Reason code for the price override
          example: PRICE_MATCH
          minLength: 1
        justification:
          type: string
          description: Free-text justification supporting the price override
          example: Competitor price match per store policy
        idempotencyKey:
          type: string
          description: Optional idempotency key for duplicate prevention
          example: req-abc123
      required:
      - orderId
      - orderLineId
      - originalPrice
      - overridePrice
      - productId
      - reasonCode
    PriceOverrideResult:
      type: object
      description: Result of applying a price override to an order line
      properties:
        overrideId:
          type: string
          format: uuid
          description: Unique identifier of the created price override
          example: 01960003-0000-7000-8000-0000000000aa
        orderId:
          type: string
          description: Identifier of the order the override applies to
          example: 01960003-0000-7000-8000-000000000001
        orderLineId:
          type: string
          description: Identifier of the order line the override applies to
          example: 01960003-0000-7000-8000-000000000002
        productId:
          type: string
          description: Identifier of the product on the overridden line
          example: 01960003-0000-7000-8000-000000000003
        originalPrice:
          type: number
          description: Original price before the override
          example: 49.99
        overridePrice:
          type: number
          description: Overridden price applied to the line
          example: 39.99
        discountAmount:
          type: number
          description: Absolute discount amount granted by the override
          example: 10.0
        discountPercentage:
          type: number
          description: Discount expressed as a percentage of the original price
          example: 20.0
        reasonCode:
          type: string
          description: Reason code supplied for the override
          example: PRICE_MATCH
        justification:
          type: string
          description: Free-text justification supporting the override
          example: Competitor price match per store policy
        status:
          type: string
          description: Override status; APPROVED means applied immediately, PENDING_APPROVAL means queued for review
          example: APPROVED
        requiresApproval:
          type: boolean
          default: false
          description: Whether the override required approval
          example: false
        affectsCommission:
          type: boolean
          default: false
          description: Whether the override affects sales commission
          example: true
        requestedByUserId:
          type: string
          description: Identifier of the user who requested the override
          example: user-12345
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the override was created
          example: 2026-02-21 09:18:40+00:00
        message:
          type: string
          description: Optional human-readable message describing the result
          example: Price override applied
      required:
      - affectsCommission
      - createdAt
      - discountAmount
      - discountPercentage
      - orderId
      - orderLineId
      - originalPrice
      - overrideId
      - overridePrice
      - productId
      - reasonCode
      - requestedByUserId
      - requiresApproval
      - status
    RejectPriceOverrideRequest:
      type: object
      description: Request payload for rejecting a pending price override
      properties:
        reason:
          type: string
          description: Reason explaining why the override is being rejected
          example: Outside approved discount threshold
          minLength: 1
        comments:
          type: string
          description: Optional reviewer comments recorded with the rejection
          example: Discount exceeds policy limit for this product
      required:
      - reason
    PriceOverrideDetail:
      type: object
      description: Detailed view of a price override including approval workflow state
      properties:
        overrideId:
          type: string
          format: uuid
          description: Unique identifier of the price override
          example: 01960003-0000-7000-8000-0000000000aa
        orderId:
          type: string
          description: Identifier of the order the override applies to
          example: 01960003-0000-7000-8000-000000000001
        orderLineId:
          type: string
          description: Identifier of the order line the override applies to
          example: 01960003-0000-7000-8000-000000000002
        productId:
          type: string
          description: Identifier of the product on the overridden line
          example: 01960003-0000-7000-8000-000000000003
        originalPrice:
          type: number
          description: Original price before the override
          example: 49.99
        overridePrice:
          type: number
          description: Overridden price applied to the line
          example: 39.99
        discountAmount:
          type: number
          description: Absolute discount amount granted by the override
          example: 10.0
        discountPercentage:
          type: number
          description: Discount expressed as a percentage of the original price
          example: 20.0
        reasonCode:
          type: string
          description: Reason code supplied for the override
          example: PRICE_MATCH
        justification:
          type: string
          description: Free-text justification supporting the override
          example: Competitor price match per store policy
        status:
          type: string
          description: Current override status (e.g. APPROVED, PENDING_APPROVAL, REJECTED)
          example: PENDING_APPROVAL
        requiresApproval:
          type: boolean
          default: false
          description: Whether the override required approval
          example: true
        affectsCommission:
          type: boolean
          default: false
          description: Whether the override affects sales commission
          example: true
        requestedByUserId:
          type: string
          description: Identifier of the user who requested the override
          example: user-12345
        approvedByUserId:
          type: string
          description: Identifier of the user who approved the override, if approved
          example: manager-67890
        rejectedByUserId:
          type: string
          description: Identifier of the user who rejected the override, if rejected
          example: manager-67890
        rejectionReason:
          type: string
          description: Reason the override was rejected, if rejected
          example: Discount exceeds allowed threshold
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the override was created
          example: 2026-02-21 09:18:40+00:00
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the override was last updated
          example: 2026-02-21 10:05:12+00:00
        approvedAt:
          type: string
          format: date-time
          description: Timestamp when the override was approved, if approved
          example: 2026-02-21 10:05:12+00:00
        rejectedAt:
          type: string
          format: date-time
          description: Timestamp when the override was rejected, if rejected
          example: 2026-02-21 10:05:12+00:00
        appliedAt:
          type: string
          format: date-time
          description: Timestamp when the override was applied to the line, if applied
          example: 2026-02-21 10:06:00+00:00
      required:
      - affectsCommission
      - createdAt
      - discountAmount
      - discountPercentage
      - orderId
      - orderLineId
      - originalPrice
      - overrideId
      - overridePrice
      - productId
      - reasonCode
      - requestedByUserId
      - requiresApproval
      - status
    ApprovePriceOverrideRequest:
      type: object
      description: Request payload for approving a pending price override
      properties:
        comments:
          type: string
          description: Optional approver comments recorded with the approval
          example: Approved per store manager discretion
    CreateCartRequest:
      type: object
      description: Request payload for creating a new cart
      properties:
        clerkId:
          type: string
          description: Identifier of the clerk creating the cart
          example: 01960003-0000-7000-8000-000000000050
          minLength: 1
        terminalId:
          type: string
          description: Identifier of the terminal where the cart is created
          example: 01960003-0000-7000-8000-000000000060
          minLength: 1
        customerId:
          type: string
          description: Identifier of the customer associated with the cart, when known
          example: 01960003-0000-7000-8000-000000000070
        vehicleId:
          type: string
          description: Identifier of the vehicle associated with the cart, when applicable
          example: 01960003-0000-7000-8000-000000000080
      required:
      - clerkId
      - terminalId
    SalesOrderResponse:
      type: object
      description: Response representing a sales order and its lines
      properties:
        orderId:
          type: string
          description: Unique identifier of the order
          example: 01960003-0000-7000-8000-000000000001
        customerId:
          type: string
          description: Identifier of the customer associated with the order
          example: 01960003-0000-7000-8000-000000000070
        vehicleId:
          type: string
          description: Identifier of the vehicle associated with the order
          example: 01960003-0000-7000-8000-000000000080
        clerkId:
          type: string
          description: Identifier of the clerk who owns the order
          example: 01960003-0000-7000-8000-000000000050
        terminalId:
          type: string
          description: Identifier of the terminal where the order was created
          example: 01960003-0000-7000-8000-000000000060
        status:
          type: string
          description: Current status of the order
          example: OPEN
        subtotal:
          type: number
          description: Subtotal of all order lines before taxes and fees
          example: 59.97
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the order was created (ISO 8601)
          example: 2026-01-15 09:30:00+00:00
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the order was last updated (ISO 8601)
          example: 2026-01-15 09:45:00+00:00
        createdBy:
          type: string
          description: Identifier of the user who created the order
          example: 01960003-0000-7000-8000-000000000050
        updatedBy:
          type: string
          description: Identifier of the user who last updated the order
          example: 01960003-0000-7000-8000-000000000051
        lines:
          type: array
          description: Lines belonging to the order
          items:
            $ref: '#/components/schemas/SalesOrderLineResponse'
      required:
      - orderId
      - status
    AddItemRequest:
      type: object
      description: Request payload for adding an item line to a cart
      properties:
        itemSku:
          type: string
          description: Stock keeping unit identifying the item to add
          example: SKU-OIL-5W30-1L
          minLength: 1
        quantity:
          type: integer
          format: int32
          description: Quantity of the item to add to the cart
          example: 2
          minimum: 1
        reasonCode:
          type: string
          description: Reason code justifying a manual price or special handling
          example: PRICE_MATCH
        manualPrice:
          type: number
          description: Manual unit price override for the item, when applicable
          example: 19.99
      required:
      - itemSku
      - quantity
    CancelOrderRequest:
      type: object
      description: Request payload for cancelling an order
      properties:
        cancellationReason:
          type: string
          description: Reason explaining why the order is being cancelled
          example: Customer changed their mind
          minLength: 1
        workOrderId:
          type: string
          format: uuid
          description: Identifier of the associated workorder, when applicable
          example: 01960003-0000-7000-8000-000000000004
        paymentId:
          type: string
          format: uuid
          description: Identifier of the associated payment, when applicable
          example: 01960003-0000-7000-8000-000000000005
        idempotencyKey:
          type: string
          description: Optional idempotency key for duplicate cancellation prevention
          example: cancel-req-abc123
      required:
      - cancellationReason
    CancellationResponse:
      type: object
      description: Response returned after cancelling an order
      properties:
        orderId:
          type: string
          description: Identifier of the cancelled order
          example: 01960003-0000-7000-8000-000000000001
        status:
          type: string
          description: Resulting status of the order after cancellation
          example: CANCELLED
        message:
          type: string
          description: Human-readable message describing the cancellation outcome
          example: Order cancelled successfully
        cancellationIdempotencyKey:
          type: string
          description: Idempotency key associated with the cancellation request
          example: cancel-req-abc123
      required:
      - orderId
      - status
    LinkSourceRequest:
      type: object
      description: Request payload for linking an order to an originating source
      properties:
        sourceType:
          type: string
          description: Type classification of the originating source
          example: WORKORDER
          minLength: 1
        sourceId:
          type: string
          description: Identifier of the originating source record
          example: 01960003-0000-7000-8000-000000000004
          minLength: 1
      required:
      - sourceId
      - sourceType
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
