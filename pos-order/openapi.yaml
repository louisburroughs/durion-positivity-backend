  /v1/orders/purchase-orders/{poId}/revisions:
    post:
      description: 'Revises an existing purchase order in place: the version number increments, the header fields and every line are replaced, totals are recomputed, and the open balance resets to the value of the new lines.

        Use this tool to change quantities, costs or delivery terms on an order; do not use createPurchaseOrder, which starts a new order, and use cancelPurchaseOrder instead when the order should be terminated rather than changed.

        Preconditions: the purchase order must exist; the service applies no status gate, so a revision replaces lines and open balance in any lifecycle status, discarding received-quantity bookkeeping on the replaced lines.

        Required inputs: poId (UUIDv7) path parameter plus poDate, revisionReason and the full replacement lines list, because every line is replaced rather than merged; paymentTermsId, expectedDeliveryDate, shipToLocationId, requestedBy and comment overwrite the stored values even when omitted.

        Emits an ORDER_PURCHASE_ORDER_REVISE event carrying the field-level delta and the revision reason.

        Returns 404 when the purchase order does not exist, and 422 when a line''s documentUom has no conversion path to the product''s base UoM.

        '
