                  paymentTermsId: NET30
                  poDate: 2026-08-13
                  shipToLocationId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a05
                  vendorId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a01
            schema:
