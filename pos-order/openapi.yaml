                    lineNumber: 1
                    quantity: 24
                    skuId: 018f0a1b-2c3d-7e4f-8a9b-0c1d2e3f4a10
                    unitCostMinor: 1399
                  paymentTermsId: NET30
                  poDate: 2026-08-20
                  revisionReason: Vendor confirmed availability of larger quantity
            schema:
              $ref: '#/components/schemas/RevisePurchaseOrderRequest'
        description: Replacement header values and the full replacement line set, with the reason for the revision.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
          description: Purchase order revised
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Validation failure
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: User lacks required purchase order create authority
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Purchase order not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Purchase order is in a conflicting state
      security:
      - bearerAuth:
        - order:purchase_order:create
