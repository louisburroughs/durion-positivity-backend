openapi: 3.1.0
info:
  title: Positivity Order API
  description: "API documentation for the Order service, accessible via the API Gateway."
  contact:
    name: Durion Support Services
    email: louis.burroughs@gmail.com
  version: v1
servers:
- url: http://localhost:8086
  description: Generated server url
tags:
- name: Order Cancellation
  description: Cancel orders and retry failed cancellations
- name: Price Overrides
  description: Price override management with approval workflow
- name: Sales Orders
  description: Sales order cart management
paths:
  /v1/orders/carts/{orderId}/items/{lineId}:
    put:
      tags:
      - Sales Orders
      summary: Update a sales order cart item quantity
      description: Update the quantity for an existing sales order line item in a
        cart.
      operationId: updateItemQuantity
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: lineId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItemRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrderLineResponse"
      security:
      - bearerAuth: []
    delete:
      tags:
      - Sales Orders
      summary: Remove an item from a sales order cart
      description: Remove a line item from an existing sales order cart.
      operationId: removeItem
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: lineId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
      security:
      - bearerAuth: []
  /v1/orders/price-overrides:
    get:
      tags:
      - Price Overrides
      summary: Get price overrides
      description: "Retrieve price overrides by order ID, status, or date range. At\
        \ least one filter parameter is required."
      operationId: getOverridesByOrder
      parameters:
      - name: orderId
        in: query
        description: Order ID filter
        required: false
        schema:
          type: string
          default: ""
      - name: status
        in: query
        description: Override status filter
        required: false
        schema:
          type: string
          default: ""
      - name: startDate
        in: query
        description: Start date for date range filter
        required: false
        schema:
          type: string
          default: ""
      - name: endDate
        in: query
        description: End date for date range filter
        required: false
        schema:
          type: string
          default: ""
      responses:
        "200":
          description: Overrides retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceOverrideDetail"
        "400":
          description: No filter parameter provided
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceOverrideDetail"
      security:
      - bearerAuth:
        - order:price_override:view
      x-required-permissions:
      - order:price_override:view
    post:
      tags:
      - Price Overrides
      summary: Apply price override
      description: Apply a price override to an order line. May require approval based
        on override amount.
      operationId: applyPriceOverride
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyPriceOverrideRequest"
        required: true
      responses:
        "201":
          description: Override created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceOverrideResult"
                additionalProperties:
                  default: ""
                default: ""
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceOverrideResult"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceOverrideResult"
      security:
      - bearerAuth:
        - order:price_override:apply
      x-required-permissions:
      - order:price_override:apply
  /v1/orders/price-overrides/{overrideId}/reject:
    post:
      tags:
      - Price Overrides
      summary: Reject price override
      description: Reject a pending price override with a reason.
      operationId: rejectPriceOverride
      parameters:
      - name: overrideId
        in: path
        description: Price override ID
        required: true
        schema:
          type: string
          default: ""
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectPriceOverrideRequest"
        required: true
      responses:
        "200":
          description: Override rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceOverrideDetail"
                additionalProperties:
                  default: ""
                default: ""
        "400":
          description: Invalid request or override not in pending state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceOverrideDetail"
        "403":
          description: Insufficient rejection permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceOverrideDetail"
        "404":
          description: Override not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceOverrideDetail"
      security:
      - bearerAuth:
        - order:price_override:reject
      x-required-permissions:
      - order:price_override:reject
  /v1/orders/price-overrides/{overrideId}/approve:
    post:
      tags:
      - Price Overrides
      summary: Approve price override
      description: Approve a pending price override. Validates approver permission
        level.
      operationId: approvePriceOverride
      parameters:
      - name: overrideId
        in: path
        description: Price override ID
        required: true
        schema:
          type: string
          default: ""
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovePriceOverrideRequest"
        required: true
      responses:
        "200":
          description: Override approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceOverrideDetail"
                additionalProperties:
                  default: ""
                default: ""
        "400":
          description: Invalid request or override not in pending state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceOverrideDetail"
        "403":
          description: Insufficient approval permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceOverrideDetail"
        "404":
          description: Override not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceOverrideDetail"
      security:
      - bearerAuth:
        - order:price_override:approve
      x-required-permissions:
      - order:price_override:approve
  /v1/orders/carts:
    post:
      tags:
      - Sales Orders
      summary: Create a sales order cart
      description: "Create a new sales order cart for a customer, terminal, and optional\
        \ vehicle context."
      operationId: createCart
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCartRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrderResponse"
      security:
      - bearerAuth: []
  /v1/orders/carts/{orderId}/items:
    post:
      tags:
      - Sales Orders
      summary: Add an item to a sales order cart
      description: "Add a line item to an existing sales order cart using SKU, quantity,\
        \ and optional pricing context."
      operationId: addItem
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddItemRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrderLineResponse"
      security:
      - bearerAuth: []
  /v1/orders/carts/{orderId}/cancel:
    post:
      tags:
      - Order Cancellation
      summary: Cancel order
      description: Initiate cancellation for a sales order cart using the supplied
        cancellation context.
      operationId: cancelOrder
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelOrderRequest"
        required: true
      responses:
        "201":
          description: Cancellation initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationResponse"
        "409":
          description: Order cannot be cancelled in current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationResponse"
      security:
      - bearerAuth:
        - order:order:cancel
      x-required-permissions:
      - order:order:cancel
  /v1/orders/carts/{orderId}/cancel/retry:
    post:
      tags:
      - Order Cancellation
      summary: Retry failed cancellation
      description: Retry a previously failed order cancellation using the original
        idempotency key.
      operationId: retryCancellation
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: idempotencyKey
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Retry accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationResponse"
        "409":
          description: Order not in retryable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationResponse"
      security:
      - bearerAuth:
        - order:order:cancel
      x-required-permissions:
      - order:order:cancel
  /v1/orders/carts/{orderId}/source:
    patch:
      tags:
      - Sales Orders
      summary: Link a source to a sales order
      description: Associate an external source reference with an existing sales order
        cart.
      operationId: linkSource
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkSourceRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrderResponse"
      security:
      - bearerAuth: []
  /v1/orders/price-overrides/{overrideId}:
    get:
      tags:
      - Price Overrides
      summary: Get price override
      description: Retrieve a specific price override by ID.
      operationId: getOverride
      parameters:
      - name: overrideId
        in: path
        description: Price override ID
        required: true
        schema:
          type: string
          default: ""
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
      responses:
        "200":
          description: Override found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceOverrideDetail"
                additionalProperties:
                  default: ""
                default: ""
        "404":
          description: Override not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceOverrideDetail"
      security:
      - bearerAuth:
        - order:price_override:view
      x-required-permissions:
      - order:price_override:view
  /v1/orders/price-overrides/pending:
    get:
      tags:
      - Price Overrides
      summary: Get pending approvals
      description: Retrieve all price overrides awaiting approval.
      operationId: getPendingApprovals
      responses:
        "200":
          description: Pending overrides retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceOverrideDetail"
      security:
      - bearerAuth:
        - order:price_override:approve
      x-required-permissions:
      - order:price_override:approve
  /v1/orders/carts/{orderId}:
    get:
      tags:
      - Sales Orders
      summary: Get a sales order by ID
      description: Retrieve a sales order cart and its current line items by identifier.
      operationId: getOrder
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrderResponse"
      security:
      - bearerAuth: []
components:
  schemas:
    UpdateItemRequest:
      type: object
      properties:
        quantity:
          type: integer
          format: int32
          minimum: 1
    SalesOrderLineResponse:
      type: object
      properties:
        orderLineId:
          type: string
        itemSku:
          type: string
        itemDescription:
          type: string
        quantity:
          type: integer
          format: int32
        unitPrice:
          type: number
        fulfillmentStatus:
          type: string
        priceSource:
          type: string
        reasonCode:
          type: string
        sourceType:
          type: string
        sourceId:
          type: string
        sourceLineId:
          type: string
    ApplyPriceOverrideRequest:
      type: object
      properties:
        orderId:
          type: string
          minLength: 1
        orderLineId:
          type: string
          minLength: 1
        productId:
          type: string
          minLength: 1
        originalPrice:
          type: number
          minimum: 0.0
        overridePrice:
          type: number
          minimum: 0.0
        reasonCode:
          type: string
          default: ""
          description: Reason code for the price override
          example: PRICE_MATCH
          minLength: 1
        justification:
          type: string
        idempotencyKey:
          type: string
          default: ""
          description: Optional idempotency key for duplicate prevention
          example: req-abc123
      required:
      - orderId
      - orderLineId
      - originalPrice
      - overridePrice
      - productId
      - reasonCode
    PriceOverrideResult:
      type: object
      properties:
        overrideId:
          type: string
          format: uuid
        orderId:
          type: string
        orderLineId:
          type: string
        productId:
          type: string
        originalPrice:
          type: number
        overridePrice:
          type: number
        discountAmount:
          type: number
        discountPercentage:
          type: number
        reasonCode:
          type: string
        justification:
          type: string
        status:
          type: string
        requiresApproval:
          type: boolean
        affectsCommission:
          type: boolean
        requestedByUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        message:
          type: string
    RejectPriceOverrideRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
        comments:
          type: string
      required:
      - reason
    PriceOverrideDetail:
      type: object
      properties:
        overrideId:
          type: string
          format: uuid
        orderId:
          type: string
        orderLineId:
          type: string
        productId:
          type: string
        originalPrice:
          type: number
        overridePrice:
          type: number
        discountAmount:
          type: number
        discountPercentage:
          type: number
        reasonCode:
          type: string
        justification:
          type: string
        status:
          type: string
        requiresApproval:
          type: boolean
        affectsCommission:
          type: boolean
        requestedByUserId:
          type: string
        approvedByUserId:
          type: string
        rejectedByUserId:
          type: string
        rejectionReason:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        approvedAt:
          type: string
          format: date-time
        rejectedAt:
          type: string
          format: date-time
        appliedAt:
          type: string
          format: date-time
    ApprovePriceOverrideRequest:
      type: object
      properties:
        comments:
          type: string
    CreateCartRequest:
      type: object
      properties:
        clerkId:
          type: string
          minLength: 1
        terminalId:
          type: string
          minLength: 1
        customerId:
          type: string
        vehicleId:
          type: string
      required:
      - clerkId
      - terminalId
    SalesOrderResponse:
      type: object
      properties:
        orderId:
          type: string
        customerId:
          type: string
        vehicleId:
          type: string
        clerkId:
          type: string
        terminalId:
          type: string
        status:
          type: string
        subtotal:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedBy:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/SalesOrderLineResponse"
    AddItemRequest:
      type: object
      properties:
        itemSku:
          type: string
          minLength: 1
        quantity:
          type: integer
          format: int32
          minimum: 1
        reasonCode:
          type: string
        manualPrice:
          type: number
      required:
      - itemSku
    CancelOrderRequest:
      type: object
      properties:
        cancellationReason:
          type: string
          minLength: 1
        workOrderId:
          type: string
          format: uuid
        paymentId:
          type: string
          format: uuid
        idempotencyKey:
          type: string
      required:
      - cancellationReason
    CancellationResponse:
      type: object
      properties:
        orderId:
          type: string
        status:
          type: string
        message:
          type: string
        cancellationIdempotencyKey:
          type: string
    LinkSourceRequest:
      type: object
      properties:
        sourceType:
          type: string
          minLength: 1
        sourceId:
          type: string
          minLength: 1
      required:
      - sourceId
      - sourceType
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
