      - order:order:view
components:
  schemas:
    UpdateItemRequest:
      type: object
      description: Request payload for updating an existing cart item line
      properties:
        quantity:
          type: integer
          format: int32
          description: Updated quantity for the item line
          example: 3
          minimum: 1
      required:
      - quantity
    SalesOrderLineResponse:
      type: object
      description: Response representing a single line on a sales order
      properties:
        orderLineId:
          type: string
          description: Unique identifier of the order line
          example: 01960003-0000-7000-8000-000000000002
        itemSku:
          type: string
          description: Stock keeping unit identifying the line item
          example: SKU-OIL-5W30-1L
        itemDescription:
          type: string
          description: Human-readable description of the line item
          example: Synthetic Motor Oil 5W-30 1L
        quantity:
          type: integer
          format: int32
          description: Quantity of the item on the line
          example: 2
        unitPrice:
          type: number
          description: Unit price applied to the line
          example: 19.99
        discountPercent:
          type: number
          description: Line-level discount percent (0-100)
          example: 5
        discountAmount:
          type: number
          description: Line discount plus this line's pro-rata share of the order discount
          example: 2.0
        lineSubtotal:
          type: number
          description: Extended amount post-line-discount, pre-order-discount, pre-tax
          example: 37.98
        taxAmount:
          type: number
          description: Tax for this line (pos-tax authoritative)
          example: 3.04
        lineTotal:
          type: number
          description: lineSubtotal minus order-discount allocation plus taxAmount
          example: 39.02
        customerNote:
          type: string
          description: Customer-visible line note
        internalNote:
          type: string
          description: Shop-internal line note
        fulfillmentStatus:
          type: string
          description: Fulfillment status of the line
          example: PENDING
        priceSource:
          type: string
          description: Source of the line price (e.g. CATALOG, MANUAL, OVERRIDE)
          example: CATALOG
        reasonCode:
          type: string
          description: Reason code associated with a manual price or special handling
          example: PRICE_MATCH
        sourceType:
          type: string
          description: Type classification of the line's originating source
          example: WORKORDER
        sourceId:
          type: string
          description: Identifier of the originating source record
          example: 01960003-0000-7000-8000-000000000004
        sourceLineId:
          type: string
          description: Identifier of the originating source line
          example: 01960003-0000-7000-8000-000000000006
        serialNumbers:
          type: array
          description: Captured lot/serial numbers for tracked products
          items:
            type: string
        returnable:
          type: boolean
          description: Explicit source-document returnability flag (imported lines only; null for counter lines)
      required:
      - itemSku
      - orderLineId
      - quantity
    OrderDiscountRequest:
      type: object
      description: Request payload for applying an order-level discount (pro-rata across lines)
      properties:
        type:
          type: string
          description: Discount flavor
          enum:
          - PERCENT
          - AMOUNT
          example: PERCENT
          minLength: 1
        value:
          type: number
          description: Percent (0-100] or currency amount, per type
          example: 10
          minimum: 0
        reasonCode:
          type: string
          description: Business reason for the discount
          example: GOODWILL_ADJUSTMENT
      required:
      - type
      - value
    SalesOrderResponse:
      type: object
      description: Response representing a sales order and its lines
      properties:
        orderId:
          type: string
          description: Unique identifier of the order
          example: 01960003-0000-7000-8000-000000000001
        orderNumber:
          type: string
          description: Human-facing order number assigned at creation
          example: SO-1A2B3C4D-2607-000042
        locationId:
          type: string
          description: Shop location the order belongs to
          example: 01960003-0000-7000-8000-000000000090
        label:
          type: string
          description: Parking label for resumable drafts
          example: blue F-150 waiting on customer
        customerValidationStatus:
          type: string
          description: CRM validation state of the customer/vehicle references (VALIDATED or PENDING)
          example: VALIDATED
        customerId:
          type: string
          description: Identifier of the customer associated with the order
          example: 01960003-0000-7000-8000-000000000070
        vehicleId:
          type: string
          description: Identifier of the vehicle associated with the order
          example: 01960003-0000-7000-8000-000000000080
        clerkId:
          type: string
          description: Identifier of the clerk who owns the order
          example: 01960003-0000-7000-8000-000000000050
        terminalId:
          type: string
          description: Identifier of the terminal where the order was created
          example: 01960003-0000-7000-8000-000000000060
        status:
          type: string
          description: Current status of the order
          example: OPEN
        subtotal:
          type: number
          description: 'Σ line subtotals: post-line-discount, pre-order-discount, pre-tax'
          example: 59.97
        discountTotal:
          type: number
          description: Σ line discounts + allocated order discount
          example: 6.0
        taxTotal:
          type: number
          description: Total tax (pos-tax authoritative)
          example: 4.32
        grandTotal:
          type: number
          description: subtotal − order discount + taxTotal
          example: 58.29
        taxStale:
          type: boolean
          description: True when mutations invalidated taxTotal; cleared by quote/checkout tax recompute
          example: false
        orderDiscountType:
          type: string
          description: Order discount flavor (PERCENT or AMOUNT)
        orderDiscountValue:
          type: number
          description: Order discount value per type
        orderDiscountReasonCode:
          type: string
          description: Order discount reason code
        generalNote:
          type: string
          description: Order-level note
        quoteExpiresAt:
          type: string
          format: date-time
          description: Quote validity horizon (QUOTED orders)
        invoiceId:
          type: string
          description: Invoice fronting this order, set at checkout
        invoiceNumber:
          type: string
          description: Human-facing invoice number
        amountPaid:
          type: number
          description: Net settled amount (checkout onward)
        balanceDue:
          type: number
          description: Outstanding balance (checkout onward)
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the order was created (ISO 8601)
          example: 2026-01-15 09:30:00+00:00
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the order was last updated (ISO 8601)
          example: 2026-01-15 09:45:00+00:00
        createdBy:
          type: string
          description: Identifier of the user who created the order
          example: 01960003-0000-7000-8000-000000000050
        updatedBy:
          type: string
          description: Identifier of the user who last updated the order
          example: 01960003-0000-7000-8000-000000000051
        lines:
          type: array
          description: Lines belonging to the order
          items:
            $ref: '#/components/schemas/SalesOrderLineResponse'
      required:
      - orderId
      - status
    CreateReturnRequest:
      type: object
      description: Request payload for creating a return against a completed order
      properties:
        originalOrderId:
          type: string
          format: uuid
          description: The single COMPLETED order being returned against
        refundMethod:
          type: string
          description: How the refund is issued
          enum:
          - ORIGINAL_TENDER
          - STORE_CREDIT
          - ON_ACCOUNT_CREDIT
          minLength: 1
        reasonCode:
          type: string
          description: Return reason code
        lines:
          type: array
          description: Return lines
          items:
            $ref: '#/components/schemas/ReturnLineRequest'
          minItems: 1
      required:
      - lines
      - originalOrderId
      - refundMethod
    ReturnLineRequest:
      type: object
      description: One requested return line
      properties:
        originalOrderLineId:
          type: string
          format: uuid
          description: The sold line (order line id) being returned against
        returnQty:
          type: integer
          format: int32
          description: Units to return (capped at the un-refunded remainder)
          example: 1
          minimum: 0
        condition:
          type: string
          description: Disposition of the returned item
          enum:
          - RESTOCK
          - SCRAP
          - WARRANTY
          minLength: 1
        serialNumbers:
          type: array
          description: Returned serials, when the sale captured them
          items:
            type: string
            minLength: 1
      required:
      - condition
      - originalOrderLineId
      - returnQty
    Line:
      type: object
      description: One returned line
      properties:
        returnLineId:
          type: string
          format: uuid
        originalOrderLineId:
          type: string
          format: uuid
        itemSku:
          type: string
        returnQty:
          type: integer
          format: int32
        condition:
          type: string
        lineRefund:
          type: number
        serialNumbers:
          type: array
          items:
            type: string
    ReturnOrderResponse:
      type: object
      description: A return order and its lines
      properties:
        returnOrderId:
          type: string
          format: uuid
        originalOrderId:
          type: string
          format: uuid
        originalOrderNumber:
          type: string
        locationId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        refundMethod:
          type: string
        status:
          type: string
        reasonCode:
          type: string
        totalRefund:
          type: number
        failureReason:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/Line'
        returnedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    RejectReturnRequest:
      type: object
      description: Request payload for rejecting a pending return
      properties:
        reason:
          type: string
          description: Reason for the rejection
          minLength: 1
      required:
      - reason
    VoidOrderRequest:
      type: object
      description: Request payload for voiding an unsettled order
      properties:
        reason:
          type: string
          description: Reason the order is being voided
          example: Customer walked away before payment
    CheckoutRequest:
      type: object
      description: Optional checkout options
      properties:
        tenderType:
          type: string
          description: 'Tender intent: DEFAULT (asynchronous settlement via payments) or ON_ACCOUNT (charge a validated commercial customer''s account; requires order:order:charge_on_account and the order completes with the balance carried by the AR invoice)'
          example: ON_ACCOUNT
    OpenSessionRequest:
      type: object
      description: Request payload for opening a register session
      properties:
        terminalId:
          type: string
          description: Terminal the drawer belongs to; one open session per terminal
          example: 01960003-0000-7000-8000-000000000060
          minLength: 1
        openedByClerkId:
          type: string
          description: Clerk opening the session
          example: 01960003-0000-7000-8000-000000000050
          minLength: 1
        locationId:
          type: string
          format: uuid
          description: Shop location; defaults from the terminal's previous session when omitted
          example: 01960003-0000-7000-8000-000000000090
        openingFloat:
          type: number
          description: Starting drawer cash; defaults to the terminal's previous counted close when omitted
          example: 150.0
          minimum: 0
      required:
      - openedByClerkId
      - terminalId
    RegisterSessionResponse:
      type: object
      description: Register session state
      properties:
        sessionId:
          type: string
          format: uuid
        terminalId:
          type: string
        locationId:
          type: string
          format: uuid
        openedByClerkId:
          type: string
        status:
          type: string
        openingFloat:
          type: number
        countedCash:
          type: number
        theoreticalCash:
          type: number
        overShort:
          type: number
        varianceApproved:
          type: boolean
        closedByClerkId:
          type: string
        openedAt:
          type: string
          format: date-time
        closingStartedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
    CashMovementRequest:
      type: object
      description: Request payload for recording a drawer cash movement
      properties:
        movementType:
          type: string
          description: Movement direction
          enum:
          - PAID_IN
          - PAID_OUT
          example: PAID_OUT
          minLength: 1
        amount:
          type: number
          description: Positive cash amount moved
          example: 40.0
          minimum: 0
        reason:
          type: string
          description: Reason for the movement
          example: petty cash to office
          minLength: 1
        clerkId:
          type: string
          description: Clerk recording the movement
          example: 01960003-0000-7000-8000-000000000050
          minLength: 1
      required:
      - amount
      - clerkId
      - movementType
      - reason
    CashMovementResponse:
      type: object
      description: A drawer cash movement
      properties:
        movementId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        movementType:
          type: string
        amount:
          type: number
        reason:
          type: string
        clerkId:
          type: string
        occurredAt:
          type: string
          format: date-time
    BeginCloseRequest:
      type: object
      description: Request payload for beginning a register session close
      properties:
        countedCash:
          type: number
          description: Physical cash counted in the drawer
          example: 310.0
          minimum: 0
      required:
      - countedCash
    ApplyPriceOverrideRequest:
      type: object
      description: Request payload for applying a price override to an order line
      properties:
        orderId:
          type: string
          description: Identifier of the order whose line is being overridden
          example: 01960003-0000-7000-8000-000000000001
          minLength: 1
        orderLineId:
          type: string
          description: Identifier of the order line receiving the price override
          example: 01960003-0000-7000-8000-000000000002
          minLength: 1
        productId:
          type: string
          description: Identifier of the product on the order line
          example: 01960003-0000-7000-8000-000000000003
          minLength: 1
        originalPrice:
          type: number
          description: Original price of the line before the override
          example: 49.99
          minimum: 0.0
        overridePrice:
          type: number
          description: Overridden price to apply to the line
          example: 39.99
          minimum: 0.0
        reasonCode:
          type: string
          description: Reason code for the price override
          example: PRICE_MATCH
          minLength: 1
        justification:
          type: string
          description: Free-text justification supporting the price override
          example: Competitor price match per store policy
        idempotencyKey:
          type: string
          description: Optional idempotency key for duplicate prevention
          example: req-abc123
      required:
      - orderId
      - orderLineId
      - originalPrice
      - overridePrice
      - productId
      - reasonCode
    PriceOverrideResult:
      type: object
      description: Result of applying a price override to an order line
      properties:
        overrideId:
          type: string
          format: uuid
          description: Unique identifier of the created price override
          example: 01960003-0000-7000-8000-0000000000aa
        orderId:
          type: string
          description: Identifier of the order the override applies to
          example: 01960003-0000-7000-8000-000000000001
        orderLineId:
          type: string
          description: Identifier of the order line the override applies to
          example: 01960003-0000-7000-8000-000000000002
        productId:
          type: string
          description: Identifier of the product on the overridden line
          example: 01960003-0000-7000-8000-000000000003
        originalPrice:
          type: number
          description: Original price before the override
          example: 49.99
        overridePrice:
          type: number
          description: Overridden price applied to the line
          example: 39.99
        discountAmount:
          type: number
          description: Absolute discount amount granted by the override
          example: 10.0
        discountPercentage:
          type: number
          description: Discount expressed as a percentage of the original price
          example: 20.0
        reasonCode:
          type: string
          description: Reason code supplied for the override
          example: PRICE_MATCH
        justification:
          type: string
          description: Free-text justification supporting the override
          example: Competitor price match per store policy
        status:
          type: string
          description: Override status; APPROVED means applied immediately, PENDING_APPROVAL means queued for review
          example: APPROVED
        requiresApproval:
          type: boolean
          description: Whether the override required approval
          example: false
        affectsCommission:
          type: boolean
          description: Whether the override affects sales commission
          example: true
        requestedByUserId:
          type: string
          description: Identifier of the user who requested the override
          example: user-12345
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the override was created
          example: 2026-02-21 09:18:40+00:00
        message:
          type: string
          description: Optional human-readable message describing the result
          example: Price override applied
      required:
      - affectsCommission
      - createdAt
      - discountAmount
      - discountPercentage
      - orderId
      - orderLineId
      - originalPrice
      - overrideId
      - overridePrice
      - productId
      - reasonCode
      - requestedByUserId
      - requiresApproval
      - status
    RejectPriceOverrideRequest:
      type: object
      description: Request payload for rejecting a pending price override
      properties:
        reason:
          type: string
          description: Reason explaining why the override is being rejected
          example: Outside approved discount threshold
          minLength: 1
        comments:
          type: string
          description: Optional reviewer comments recorded with the rejection
          example: Discount exceeds policy limit for this product
      required:
      - reason
    PriceOverrideDetail:
      type: object
      description: Detailed view of a price override including approval workflow state
      properties:
        overrideId:
          type: string
          format: uuid
          description: Unique identifier of the price override
          example: 01960003-0000-7000-8000-0000000000aa
        orderId:
          type: string
          description: Identifier of the order the override applies to
          example: 01960003-0000-7000-8000-000000000001
        orderLineId:
          type: string
          description: Identifier of the order line the override applies to
          example: 01960003-0000-7000-8000-000000000002
        productId:
          type: string
          description: Identifier of the product on the overridden line
          example: 01960003-0000-7000-8000-000000000003
        originalPrice:
          type: number
          description: Original price before the override
          example: 49.99
        overridePrice:
          type: number
          description: Overridden price applied to the line
          example: 39.99
        discountAmount:
          type: number
          description: Absolute discount amount granted by the override
          example: 10.0
        discountPercentage:
          type: number
          description: Discount expressed as a percentage of the original price
          example: 20.0
        reasonCode:
          type: string
          description: Reason code supplied for the override
          example: PRICE_MATCH
        justification:
          type: string
          description: Free-text justification supporting the override
          example: Competitor price match per store policy
        status:
          type: string
          description: Current override status (e.g. APPROVED, PENDING_APPROVAL, REJECTED)
          example: PENDING_APPROVAL
        requiresApproval:
          type: boolean
          description: Whether the override required approval
          example: true
        affectsCommission:
          type: boolean
          description: Whether the override affects sales commission
          example: true
        requestedByUserId:
          type: string
          description: Identifier of the user who requested the override
          example: user-12345
        approvedByUserId:
          type: string
          description: Identifier of the user who approved the override, if approved
          example: manager-67890
        rejectedByUserId:
          type: string
          description: Identifier of the user who rejected the override, if rejected
          example: manager-67890
        rejectionReason:
          type: string
          description: Reason the override was rejected, if rejected
          example: Discount exceeds allowed threshold
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the override was created
          example: 2026-02-21 09:18:40+00:00
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the override was last updated
          example: 2026-02-21 10:05:12+00:00
        approvedAt:
          type: string
          format: date-time
          description: Timestamp when the override was approved, if approved
          example: 2026-02-21 10:05:12+00:00
        rejectedAt:
          type: string
          format: date-time
          description: Timestamp when the override was rejected, if rejected
          example: 2026-02-21 10:05:12+00:00
        appliedAt:
          type: string
          format: date-time
          description: Timestamp when the override was applied to the line, if applied
          example: 2026-02-21 10:06:00+00:00
      required:
      - affectsCommission
      - createdAt
      - discountAmount
      - discountPercentage
      - orderId
      - orderLineId
      - originalPrice
      - overrideId
      - overridePrice
      - productId
      - reasonCode
      - requestedByUserId
      - requiresApproval
      - status
    ApprovePriceOverrideRequest:
      type: object
      description: Request payload for approving a pending price override
      properties:
        comments:
          type: string
          description: Optional approver comments recorded with the approval
          example: Approved per store manager discretion
    CreateCartRequest:
      type: object
      description: Request payload for creating a new cart
      properties:
        clerkId:
          type: string
          description: Identifier of the clerk creating the cart
          example: 01960003-0000-7000-8000-000000000050
          minLength: 1
        locationId:
          type: string
          format: uuid
          description: Shop location the cart is created at; drives order-number assignment. Optional when the terminal has an open register session (the session supplies the location); required otherwise.
          example: 01960003-0000-7000-8000-000000000090
        label:
          type: string
          description: Optional parking label for resumable drafts
          example: blue F-150 waiting on customer
        generalNote:
          type: string
          description: Optional order-level note
          example: Customer will pick up after 5pm
        terminalId:
          type: string
          description: Identifier of the terminal where the cart is created
          example: 01960003-0000-7000-8000-000000000060
          minLength: 1
        customerId:
          type: string
          description: Identifier of the customer associated with the cart, when known
          example: 01960003-0000-7000-8000-000000000070
        vehicleId:
          type: string
          description: Identifier of the vehicle associated with the cart, when applicable
          example: 01960003-0000-7000-8000-000000000080
        depositSourceType:
          type: string
          description: When this cart takes a deposit / down payment (odoo-parity story E4), the source document type it is held against; pos-invoice registers a deposit credit at checkout.
          enum:
          - ESTIMATE
          - WORKORDER
          - ORDER
        depositSourceId:
          type: string
          format: uuid
          description: Source document id the deposit is held against (required with depositSourceType).
          example: 01960003-0000-7000-8000-000000000011
      required:
      - clerkId
      - terminalId
    AddItemRequest:
      type: object
      description: Request payload for adding an item line to a cart
      properties:
        itemSku:
          type: string
          description: Stock keeping unit identifying the item to add
          example: SKU-OIL-5W30-1L
          minLength: 1
        quantity:
          type: integer
          format: int32
          description: Quantity of the item to add to the cart
          example: 2
          minimum: 1
        reasonCode:
          type: string
          description: Reason code justifying a manual price or special handling
          example: PRICE_MATCH
        manualPrice:
          type: number
          description: Manual unit price override for the item, when applicable
          example: 19.99
        lineUuid:
          type: string
          format: uuid
          description: Client-supplied stable line identity; a replayed add with a known lineUuid updates the existing line instead of duplicating it
          example: 01960003-0000-7000-8000-0000000000aa
        customerNote:
          type: string
          description: Customer-visible line note
          example: Front wipers only
        internalNote:
          type: string
          description: Shop-internal line note
          example: 'Price-matched to invoice #123'
        serialNumbers:
          type: array
          description: Captured lot/serial numbers for tracked products (count must not exceed quantity; SERIAL-tracked products require one per unit at checkout, LOT-tracked at least one)
          example:
          - SN-0001
          - SN-0002
          items:
            type: string
      required:
      - itemSku
      - quantity
    CancelOrderRequest:
      type: object
      description: Request payload for cancelling an order
      properties:
        cancellationReason:
          type: string
          description: Reason explaining why the order is being cancelled
          example: Customer changed their mind
          minLength: 1
        workOrderId:
          type: string
          format: uuid
          description: Identifier of the associated workorder, when applicable
          example: 01960003-0000-7000-8000-000000000004
        idempotencyKey:
          type: string
          description: Optional idempotency key for duplicate cancellation prevention
          example: cancel-req-abc123
      required:
      - cancellationReason
    CancellationResponse:
      type: object
      description: Response returned after cancelling an order
      properties:
        orderId:
          type: string
          description: Identifier of the cancelled order
          example: 01960003-0000-7000-8000-000000000001
        status:
          type: string
          description: Resulting status of the order after cancellation
          example: CANCELLED
        message:
          type: string
          description: Human-readable message describing the cancellation outcome
          example: Order cancelled successfully
        cancellationIdempotencyKey:
          type: string
          description: Idempotency key associated with the cancellation request
          example: cancel-req-abc123
      required:
      - orderId
      - status
    LinkSourceRequest:
      type: object
      description: Request payload for linking an order to an originating source
      properties:
        sourceType:
          type: string
          description: Type classification of the originating source
          example: WORKORDER
          minLength: 1
        sourceId:
          type: string
          description: Identifier of the originating source record
          example: 01960003-0000-7000-8000-000000000004
          minLength: 1
      required:
      - sourceId
      - sourceType
    ReturnableLineResponse:
      type: object
      description: Per-line returnable remainder for a completed order
      properties:
        orderLineId:
          type: string
          format: uuid
        itemSku:
          type: string
        soldQty:
          type: integer
          format: int32
        alreadyReturned:
          type: integer
          format: int32
        returnableQty:
          type: integer
          format: int32
        returnable:
          type: boolean
    SessionReportResponse:
      type: object
      description: X-report (mid-day) or Z-report (close summary) for a register session
      properties:
        sessionId:
          type: string
          format: uuid
        terminalId:
          type: string
        locationId:
          type: string
          format: uuid
        status:
          type: string
        reportType:
          type: string
        openingFloat:
          type: number
        tenderTotals:
          type: array
          items:
            $ref: '#/components/schemas/TenderTotal'
        cashSettlements:
          type: number
        cashMovements:
          type: number
        theoreticalCash:
          type: number
        countedCash:
          type: number
        overShort:
          type: number
        orderCount:
          type: integer
          format: int64
        movements:
          type: array
          items:
            $ref: '#/components/schemas/CashMovementResponse'
        openedAt:
          type: string
          format: date-time
        generatedAt:
          type: string
          format: date-time
    TenderTotal:
      type: object
      description: Net settled amount for one tender method
      properties:
        methodType:
          type: string
        amount:
          type: number
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
