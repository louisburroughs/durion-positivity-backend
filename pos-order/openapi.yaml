          example: 19.99
          type: number
        quantity:
          description: Quantity of the item to add to the cart
          example: 2
          format: int32
          minimum: 1
          type: integer
        reasonCode:
          description: Reason code justifying a manual price or special handling
          example: PRICE_MATCH
          type: string
        serialNumbers:
          description: Captured lot/serial numbers for tracked products (count must not exceed quantity; SERIAL-tracked products require one per unit at checkout, LOT-tracked at least one)
          example:
          - SN-0001
          - SN-0002
          items:
            type: string
          type: array
