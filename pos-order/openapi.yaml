  /v1/orders/carts/{orderId}:
    get:
      tags:
      - Sales Orders
      summary: Get a sales order by ID
      description: Retrieve a sales order cart and its current line items by identifier.
      operationId: getOrder
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
