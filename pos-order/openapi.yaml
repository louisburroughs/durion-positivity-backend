openapi: 3.1.0
info:
  title: Positivity Order API
  description: API documentation for the Order service, accessible via the API Gateway.
  contact:
    name: Durion Support Services
    email: louis.burroughs@gmail.com
  version: v1
servers:
- url: http://localhost:8086
  description: Generated server url
tags:
- name: Order Cancellation
  description: Cancel orders and retry failed cancellations
- name: Price Overrides
  description: Price override management with approval workflow
- name: Register Sessions
  description: POS register session and cash management
- name: Returns
  description: Returns & refunds against completed orders
- name: Sales Orders
  description: Sales order cart management
paths:
  /v1/orders/carts/{orderId}/items/{lineId}:
    put:
      tags:
      - Sales Orders
      summary: Update a sales order cart item quantity
      description: Update the quantity for an existing sales order line item in a cart.
      operationId: updateItemQuantity
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: lineId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItemRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderLineResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - order:line:edit
    delete:
      tags:
      - Sales Orders
      summary: Remove an item from a sales order cart
      description: Remove a line item from an existing sales order cart.
      operationId: removeItem
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: lineId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
      security:
      - bearerAuth: []
      x-required-permissions:
      - order:line:delete
  /v1/orders/carts/{orderId}/discount:
    put:
      tags:
      - Sales Orders
      summary: Apply an order-level discount
      description: Apply or replace the order-level discount (PERCENT or AMOUNT), allocated pro-rata across lines. DRAFT orders only.
      operationId: applyOrderDiscount
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderDiscountRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - order:order:discount
    delete:
      tags:
      - Sales Orders
      summary: Remove the order-level discount
      description: Clear any order-level discount and recompute totals. DRAFT orders only.
      operationId: clearOrderDiscount
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - order:order:discount
  /v1/returns:
    get:
      tags:
      - Returns
      summary: List returns for an original order
      description: Lists return orders created from the specified original order.
      operationId: listReturns
      parameters:
      - name: originalOrderId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReturnOrderResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - order:return:view
    post:
      tags:
      - Returns
      summary: Create a return against a completed order
      description: 'Idempotency-Key header supported: a replayed key returns the original return. Over-cap requests return 422 listing each line''s returnableQty.'
      operationId: createReturn
      parameters:
      - name: Idempotency-Key
        in: header
        description: Client idempotency key; replays return the original return
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReturnRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnOrderResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - order:return:create
  /v1/returns/{returnOrderId}/retry:
    post:
      tags:
      - Returns
      summary: Retry a return saga after a refund failure
      description: Retries return processing for a return currently in a retryable failed state.
      operationId: retryReturn
      parameters:
      - name: returnOrderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnOrderResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - order:return:create
  /v1/returns/{returnOrderId}/reject:
    post:
      tags:
      - Returns
      summary: Reject a pending return
      description: Rejects a pending return with a provided rejection reason.
      operationId: rejectReturn
      parameters:
      - name: returnOrderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectReturnRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnOrderResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - order:return:approve
  /v1/returns/{returnOrderId}/process:
    post:
      tags:
      - Returns
      summary: Run the return orchestration saga (refund + restock signal)
      description: 'From RETURN_REQUESTED: issues the refund and emits order.order.returned. A refund failure parks the return at REFUND_FAILED before any stock movement.'
      operationId: processReturn
      parameters:
      - name: returnOrderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnOrderResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - order:return:create
  /v1/returns/{returnOrderId}/approve:
    post:
      tags:
      - Returns
      summary: Approve a pending return
      description: Approves a pending return so it can continue through the return workflow.
      operationId: approveReturn
      parameters:
      - name: returnOrderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnOrderResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - order:return:approve
  /v1/orders/{orderId}/void:
    post:
      tags:
      - Sales Orders
      summary: Void an unsettled order
      description: 'Terminal void of a PENDING_PAYMENT order before any settlement: cancels the fronting pos-invoice invoice and transitions the order to VOIDED. Rejected with 409 when settled payments exist (use the cancellation flow) or from any other status (drafts are cancelled, not voided).'
      operationId: voidOrder
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidOrderRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - order:order:void
  /v1/orders/{orderId}/checkout:
    post:
      tags:
      - Sales Orders
      summary: Check out a sales order
      description: 'Freeze the cart and take it to PENDING_PAYMENT: validates lines/customer/availability, performs the final reprice and tax computation, and creates the fronting invoice at pos-invoice. The Idempotency-Key header is required; a replayed key returns the checked-out order with 200. Settlement completion is asynchronous — the order completes when payment events settle the balance to zero.'
      operationId: checkout
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        description: Required checkout idempotency key; replays return the original result
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - order:order:checkout
  /v1/orders/sessions:
    post:
      tags:
      - Register Sessions
      summary: Open a register session
      description: Opens a new register session for the provided terminal, location, and clerk context.
      operationId: openSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenSessionRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSessionResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - order:session:open
  /v1/orders/sessions/{sessionId}/confirm-close:
    post:
      tags:
      - Register Sessions
      summary: Confirm a register session close
      description: Snapshots theoretical cash, computes over/short, and moves the session to CLOSED. An over/short beyond the authorized difference limit requires order:session:approve_variance.
      operationId: confirmClose
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSessionResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - order:session:close
  /v1/orders/sessions/{sessionId}/cash-movements:
    get:
      tags:
      - Register Sessions
      summary: List a session's cash movements
      description: Lists all recorded cash movements for the specified register session.
      operationId: listCashMovements
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CashMovementResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - order:session:view
    post:
      tags:
      - Register Sessions
      summary: Record a drawer cash movement
      description: Records a cash in/out drawer movement against the specified register session.
      operationId: recordCashMovement
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashMovementRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashMovementResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - order:session:cash_movement
  /v1/orders/sessions/{sessionId}/begin-close:
    post:
      tags:
      - Register Sessions
      summary: Begin closing a register session
      description: Records the counted cash and moves the session to CLOSING. Blocked while any of its orders are in PENDING_PAYMENT.
      operationId: beginClose
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeginCloseRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSessionResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - order:session:close
  /v1/orders/price-overrides:
    get:
      tags:
      - Price Overrides
      summary: Get price overrides
      description: Retrieve price overrides by order ID, status, or date range. At least one filter parameter is required.
      operationId: getOverridesByOrder
      parameters:
      - name: orderId
        in: query
        description: Order ID filter
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: Override status filter
        required: false
        schema:
          type: string
      - name: startDate
        in: query
        description: Start date for date range filter
        required: false
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        description: End date for date range filter
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Overrides retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceOverrideDetail'
        '400':
          description: No filter parameter provided
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceOverrideDetail'
      security:
      - bearerAuth:
        - order:price_override:view
      x-required-permissions:
      - order:price_override:view
    post:
      tags:
      - Price Overrides
      summary: Apply price override
      description: Apply a price override to an order line. May require approval based on override amount.
      operationId: applyPriceOverride
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyPriceOverrideRequest'
        required: true
      responses:
        '201':
          description: Override created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceOverrideResult'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceOverrideResult'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceOverrideResult'
      security:
      - bearerAuth:
        - order:price_override:apply
      x-required-permissions:
      - order:price_override:apply
  /v1/orders/price-overrides/{overrideId}/reject:
    post:
      tags:
      - Price Overrides
      summary: Reject price override
      description: Reject a pending price override with a reason.
      operationId: rejectPriceOverride
      parameters:
      - name: overrideId
        in: path
        description: Price override ID
        required: true
        schema:
          type: string
          format: uuid
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectPriceOverrideRequest'
        required: true
      responses:
        '200':
          description: Override rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceOverrideDetail'
        '400':
          description: Invalid request or override not in pending state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceOverrideDetail'
        '403':
          description: Insufficient rejection permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceOverrideDetail'
        '404':
          description: Override not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceOverrideDetail'
      security:
      - bearerAuth:
        - order:price_override:reject
      x-required-permissions:
      - order:price_override:reject
  /v1/orders/price-overrides/{overrideId}/approve:
    post:
      tags:
      - Price Overrides
      summary: Approve price override
      description: Approve a pending price override. Validates approver permission level.
      operationId: approvePriceOverride
      parameters:
      - name: overrideId
        in: path
        description: Price override ID
        required: true
        schema:
          type: string
          format: uuid
        example: 018e1c9f-6b5a-7890-abcd-1234567890ab
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovePriceOverrideRequest'
        required: true
      responses:
        '200':
          description: Override approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceOverrideDetail'
        '400':
          description: Invalid request or override not in pending state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceOverrideDetail'
        '403':
          description: Insufficient approval permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceOverrideDetail'
        '404':
          description: Override not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceOverrideDetail'
      security:
      - bearerAuth:
        - order:price_override:approve
      x-required-permissions:
      - order:price_override:approve
  /v1/orders/carts:
    get:
      tags:
      - Sales Orders
      summary: List sales order carts
      description: List carts filtered by clerk, terminal, and/or status — the draft-parking/resume surface. Line items are omitted from list results.
      operationId: listCarts
      parameters:
      - name: clerkId
        in: query
        description: Filter by clerk identifier
        required: false
        schema:
          type: string
      - name: terminalId
        in: query
        description: Filter by terminal identifier
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: Filter by order status, e.g. DRAFT
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalesOrderResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - order:order:view
    post:
      tags:
      - Sales Orders
      summary: Create a sales order cart
      description: 'Create a new sales order cart for a customer, terminal, and optional vehicle context. Supports the Idempotency-Key header: a replayed key returns the original cart with 200 instead of creating a duplicate; a replayed key with a different payload returns 409.'
      operationId: createCart
      parameters:
      - name: Idempotency-Key
        in: header
        description: Client idempotency key; replays return the original cart
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCartRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - order:order:create
  /v1/orders/carts/{orderId}/quote:
    post:
      tags:
      - Sales Orders
      summary: Convert a cart to a counter quote
      description: 'Final reprice + tax computation, then DRAFT → QUOTED with a validity horizon. Counter quotes only: workorder-linked orders are quoted via pos-workorder estimates and are rejected here (spec Q3).'
      operationId: quote
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - order:order:quote
  /v1/orders/carts/{orderId}/quote/reopen:
    post:
      tags:
      - Sales Orders
      summary: Reopen a counter quote
      description: 'QUOTED → DRAFT: clears the validity horizon, best-effort reprices, and marks tax stale.'
      operationId: reopenQuote
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - order:order:quote
  /v1/orders/carts/{orderId}/items:
    post:
      tags:
      - Sales Orders
      summary: Add an item to a sales order cart
      description: 'Add a line item to an existing sales order cart using SKU, quantity, and optional pricing context. A client-supplied lineUuid makes the call replay-safe: a replay with a known lineUuid updates the existing line instead of duplicating it.'
      operationId: addItem
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddItemRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderLineResponse'
      security:
      - bearerAuth: []
      x-required-permissions:
      - order:line:create
  /v1/orders/carts/{orderId}/cancel:
    post:
      tags:
      - Order Cancellation
      summary: Cancel order
      description: Initiate cancellation for a sales order cart using the supplied cancellation context.
      operationId: cancelOrder
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
        required: true
      responses:
        '201':
          description: Cancellation initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationResponse'
        '409':
          description: Order cannot be cancelled in current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationResponse'
      security:
      - bearerAuth:
        - order:order:cancel
      x-required-permissions:
      - order:order:cancel
  /v1/orders/carts/{orderId}/cancel/retry:
    post:
      tags:
      - Order Cancellation
      summary: Retry failed cancellation
      description: Retry a previously failed order cancellation using the original idempotency key.
      operationId: retryCancellation
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: idempotencyKey
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Retry accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationResponse'
        '409':
          description: Order not in retryable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationResponse'
      security:
      - bearerAuth:
        - order:order:cancel
      x-required-permissions:
      - order:order:cancel
  /v1/orders/carts/{orderId}/source:
    patch:
      tags:
      - Sales Orders
      summary: Link a source to a sales order
      description: Associate an external source reference with an existing sales order cart.
      operationId: linkSource
      parameters:
