      description: 'Cancels a purchase order, moving it to CANCELLED so it can no longer be approved or received.

        Use this tool when an order is no longer needed; do not use revisePurchaseOrder, which keeps the order alive with changed lines.

        Preconditions: the purchase order must exist and must not be FULLY_RECEIVED or CLOSED; any other status, including DRAFT, may be cancelled.

        Required inputs: poId (UUIDv7) path parameter; there is no request body and no confirmation flag.

        Emits an ORDER_PURCHASE_ORDER_CANCEL event and publishes the order''s new state; a cancelled order is no longer counted as incoming supply by the modules that track it.

        Returns 404 when the purchase order does not exist, and 409 when it is FULLY_RECEIVED or CLOSED.

        '
      operationId: cancelPurchaseOrder
      parameters:
      - description: Purchase order identifier
        in: path
        name: poId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
          description: Purchase order cancelled
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: User lacks required purchase order approval authority
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Purchase order not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Purchase order is in a conflicting state
