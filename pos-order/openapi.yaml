        content:
          application/json:
            examples:
              Counted drawer:
                description: Counted drawer
                value:
                  countedCash: 310.0
            schema:
              $ref: '#/components/schemas/BeginCloseRequest'
        description: The physically counted drawer cash at the start of the close.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSessionResponse'
