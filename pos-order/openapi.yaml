    post:
      description: 'Creates a DRAFT purchase order with a generated PO number, computing subtotal, tax and grand total in minor currency units and initialising the open balance to the grand total.

        Use this tool when ordering stock from a vendor manually; do not use revisePurchaseOrder, which replaces the lines of an existing order, and do not use convertPurchaseSuggestions, which turns accepted replenishment suggestions into orders.

        Preconditions: none; the order starts in DRAFT and must pass approvePurchaseOrder before any receiving.

        Required inputs: vendorId (UUID), poDate, currency (ISO 4217) and lines (non-empty), each naming lineNumber, description and unitCostMinor plus either quantity in base UoM or the documentUom/documentQuantity pair; tax is derived from the configured default rate.

        Emits an ORDER_PURCHASE_ORDER_CREATE event; no stock, ledger or vendor-side state is touched.

