    ProcurementAvailability:
      description: 'Live vendor availability for a purchase order''s lines. A supplier that could not be reached is reported through the document status, never as zero quantities: availableQuantity is null when the vendor stated nothing and zero only when it stated it has none, and only the second means an article is unavailable.'
      properties:
        asOf:
          description: When the answer was obtained; null when there is no answer to date.
          format: date-time
          type: string
        deliveryLocationId:
          description: The delivery location the answer is for; availability is consignee-specific.
          format: uuid
          type: string
        lines:
          description: One entry per purchase-order line, in line-number order.
          items:
            $ref: '#/components/schemas/ProcurementAvailabilityLine'
          type: array
        purchaseOrderId:
          description: The purchase order the lines belong to.
          format: uuid
          type: string
        status:
          description: 'Whether the vendor answered, and if not, why not: OK, SUPPLIER_UNAVAILABLE, NOT_LISTED, CAPABILITY_NOT_CONFIGURED or CONFIGURATION_ERROR. Anything other than OK means no line quantity here is a statement by the vendor.'
          type: string
        vendorProfileId:
          description: The vendor profile asked.
          format: uuid
          type: string
      type: object
    ProcurementAvailabilityLine:
      description: One purchase-order line and what the vendor said about it.
      properties:
        articleEan:
          description: The article code the vendor was asked about; null when none could be resolved.
          type: string
        availableQuantity:
          description: Quantity the vendor can supply. Null when the vendor stated no quantity; zero only when it stated it has none.
          format: int32
          type: integer
        earliestDeliveryDate:
          description: Earliest date the vendor promised any quantity, when stated.
          format: date
          type: string
        lineId:
          description: Purchase-order line id.
          format: uuid
          type: string
        lineNumber:
          description: Line number on the order.
          format: int32
          type: integer
        requestedQuantity:
          description: 'Quantity asked about: what is still outstanding on this line.'
          format: int32
          type: integer
        skuId:
          description: Catalog product ordered.
          format: uuid
          type: string
        status:
          description: AVAILABLE, UNAVAILABLE, NOT_LISTED or NOT_ANSWERED as the vendor stated it; ARTICLE_NOT_IDENTIFIABLE when the line carries no code the vendor would recognise; NOTHING_OUTSTANDING when the line is already settled and so was not asked about. The last two describe our own situation, not the vendor's answer.
          type: string
      type: object
    PurchaseOrderLineRequest:
      description: A single line item on a purchase order request, identifying the SKU, quantity, and unit cost
      properties:
        description:
          description: Human-readable description of the item being ordered
          example: Stainless steel water bottle, 750ml
          minLength: 1
          type: string
        documentQuantity:
          description: Quantity ordered expressed in documentUom; must be supplied together with documentUom
          example: 1
          minimum: 0
          type: number
        documentUom:
          description: Optional UoM the line is keyed in (e.g. CASE). When present, documentQuantity is converted to the product's base UoM at derivation time via the catalog conversion factors; unitCostMinor then refers to one documentUom unit. A UoM with no conversion path is rejected with 422 UOM_CONVERSION_UNDEFINED
          example: CASE
          type: string
        glAccountId:
          description: Identifier of the general ledger account this line posts to
          example: GL-5000
          type: string
        lineNumber:
          description: Sequential line number identifying this line within the purchase order
          example: 1
          format: int32
          minimum: 0
          type: integer
        quantity:
          description: Quantity of the item being ordered on this line, in the product's base UoM. Required unless documentUom/documentQuantity are supplied, in which case the base quantity is derived and this field is ignored
          example: 12
          minimum: 0
          type: number
        skuId:
          description: Identifier of the SKU being ordered on this line
          example: 01960003-0000-7000-8000-000000000010
          format: uuid
          type: string
        taxCodeId:
          description: Identifier of the tax code applied to this line
          example: TAX-STD
          type: string
        unitCostMinor:
          description: Unit cost of the item in the smallest currency unit (e.g. cents)
          example: 1499
          format: int64
          minimum: 0
          type: integer
      required:
      - description
      - lineNumber
      - unitCostMinor
      type: object
    PurchaseOrderLineResponse:
      description: A single line item returned as part of a purchase order
      properties:
        conversionFactor:
          description: Effective base-per-document-unit conversion factor applied at derivation time
          example: 12
          type: number
        description:
          description: Human-readable description of the item on this line
          example: Stainless steel water bottle, 750ml
          type: string
        documentQuantity:
          description: Quantity as keyed in documentUom; quantityDecimal holds the derived base quantity
          example: 1
          type: number
        documentUom:
          description: UoM the line was keyed in when it differed from the product's base UoM
          example: CASE
          type: string
        lineId:
          description: Unique identifier of this purchase order line
          example: 01960003-0000-7000-8000-000000000020
          format: uuid
          type: string
        lineNumber:
          description: Sequential line number identifying this line within the purchase order
          example: 1
          format: int32
          type: integer
        lineTotalMinor:
          description: Total cost of this line in the smallest currency unit (e.g. cents)
          example: 17988
          format: int64
          type: integer
        openQuantityDecimal:
          description: Quantity on this line not yet received
          example: 4
          type: number
        quantityDecimal:
          description: Quantity ordered on this line
          example: 12
          type: number
        skuId:
          description: Identifier of the SKU on this line
          example: 01960003-0000-7000-8000-000000000010
          format: uuid
          type: string
        taxMinor:
          description: Tax amount for this line in the smallest currency unit (e.g. cents)
          example: 1439
          format: int64
          type: integer
        unitCostMinor:
          description: Unit cost of the item in the smallest currency unit (e.g. cents)
          example: 1499
          format: int64
          type: integer
      required:
      - lineId
      - lineNumber
      type: object
    PurchaseOrderResponse:
      description: Full representation of a purchase order, including header totals and line items
      properties:
        approvalNotes:
          description: Notes recorded by the approver explaining the approval decision
          example: Approved within budget for Q1 restock
          type: string
        approvalTimestamp:
          description: Timestamp at which the purchase order was approved
          example: 2026-01-15 09:30:00+00:00
          format: date-time
          type: string
        approverId:
          description: Identifier of the person who approved the purchase order
          example: user-asmith
          type: string
        comment:
          description: Free-text comment providing additional context for the purchase order
          example: Urgent restock for spring promotion
          type: string
        createdAt:
          description: Timestamp at which the purchase order was created
          example: 2026-01-15 09:00:00+00:00
          format: date-time
          type: string
        createdBy:
          description: Identifier of the user who created the purchase order
          example: user-jdoe
          type: string
        currency:
          description: ISO 4217 currency code the purchase order is denominated in
          example: USD
          type: string
        expectedDeliveryDate:
          description: Date the ordered goods are expected to be delivered
          example: 2026-01-29
          format: date
          type: string
        grandTotalMinor:
          description: Grand total including tax in the smallest currency unit (e.g. cents)
          example: 19427
          format: int64
          type: integer
        lines:
          description: Line items belonging to this purchase order
          items:
            $ref: '#/components/schemas/PurchaseOrderLineResponse'
          type: array
        openBalanceMinor:
          description: Remaining unpaid/unreceived balance in the smallest currency unit (e.g. cents)
          example: 19427
          format: int64
          type: integer
        paymentTermsId:
          description: Identifier of the payment terms applied to this purchase order
          example: NET30
          type: string
        poDate:
          description: Date the purchase order was issued
          example: 2026-01-15
          format: date
          type: string
        poNumber:
          description: Human-readable purchase order number
          example: PO-2026-00042
          type: string
        purchaseOrderId:
          description: Unique identifier of the purchase order
          example: 01960003-0000-7000-8000-000000000001
          format: uuid
          type: string
        requestedBy:
          description: Identifier or name of the person who requested the purchase order
          example: user-jdoe
          type: string
        shipToLocationId:
          description: Identifier of the location the goods are shipped to
          example: 01960003-0000-7000-8000-000000000003
          format: uuid
          type: string
        status:
          description: Current lifecycle status of the purchase order
          enum:
          - DRAFT
          - APPROVED
          - PARTIALLY_RECEIVED
          - FULLY_RECEIVED
          - CLOSED
          - CANCELLED
          example: APPROVED
          type: string
        subtotalMinor:
          description: Sum of line totals before tax in the smallest currency unit (e.g. cents)
          example: 17988
          format: int64
          type: integer
        taxMinor:
          description: Total tax amount in the smallest currency unit (e.g. cents)
          example: 1439
          format: int64
          type: integer
        updatedAt:
          description: Timestamp at which the purchase order was last updated
          example: 2026-01-15 09:30:00+00:00
          format: date-time
          type: string
        updatedBy:
          description: Identifier of the user who last updated the purchase order
          example: user-asmith
          type: string
        vendorId:
          description: Identifier of the vendor the purchase order is placed with
          example: 01960003-0000-7000-8000-000000000002
          format: uuid
          type: string
        versionNumber:
          description: Revision/version number of the purchase order, incremented on each revision
          example: 1
          format: int32
          type: integer
      required:
      - createdAt
      - currency
      - poNumber
      - purchaseOrderId
      - status
      - updatedAt
      - vendorId
      - versionNumber
      type: object
    RegisterSessionResponse:
      description: Register session state
      properties:
        closedAt:
          format: date-time
          type: string
        closedByClerkId:
          type: string
        closingStartedAt:
          format: date-time
          type: string
        countedCash:
          type: number
        locationId:
          format: uuid
          type: string
        openedAt:
          format: date-time
          type: string
        openedByClerkId:
          type: string
        openingFloat:
          type: number
        overShort:
          type: number
        sessionId:
          format: uuid
          type: string
        status:
          type: string
        terminalId:
          type: string
        theoreticalCash:
          type: number
        varianceApproved:
          type: boolean
      type: object
    RejectPriceOverrideRequest:
      description: Request payload for rejecting a pending price override
      properties:
        comments:
          description: Optional reviewer comments recorded with the rejection
          example: Discount exceeds policy limit for this product
          type: string
        reason:
          description: Reason explaining why the override is being rejected
          example: Outside approved discount threshold
          minLength: 1
          type: string
      required:
      - reason
      type: object
    RejectReturnRequest:
      description: Request payload for rejecting a pending return
      properties:
        reason:
          description: Reason for the rejection
          minLength: 1
          type: string
      required:
      - reason
      type: object
    ReturnLineRequest:
      description: One requested return line
      properties:
        condition:
          description: Disposition of the returned item
          enum:
          - RESTOCK
          - SCRAP
          - WARRANTY
          minLength: 1
          type: string
        originalOrderLineId:
          description: The sold line (order line id) being returned against
          format: uuid
          type: string
        returnQty:
          description: Units to return (capped at the un-refunded remainder)
          example: 1
          format: int32
          minimum: 0
          type: integer
        serialNumbers:
          description: Returned serials, when the sale captured them
          items:
            minLength: 1
            type: string
          type: array
      required:
      - condition
      - originalOrderLineId
      - returnQty
      type: object
    ReturnOrderResponse:
      description: A return order and its lines
      properties:
        createdAt:
          format: date-time
          type: string
        customerId:
          format: uuid
          type: string
        failureReason:
          type: string
        lines:
          items:
            $ref: '#/components/schemas/Line'
          type: array
        locationId:
          format: uuid
          type: string
        originalOrderId:
          format: uuid
          type: string
        originalOrderNumber:
          type: string
        reasonCode:
          type: string
        refundMethod:
          type: string
        returnOrderId:
          format: uuid
          type: string
        returnedAt:
          format: date-time
          type: string
        status:
          type: string
        totalRefund:
          type: number
      type: object
    ReturnableLineResponse:
      description: Per-line returnable remainder for a completed order
      properties:
        alreadyReturned:
          format: int32
          type: integer
        itemSku:
          type: string
        orderLineId:
          format: uuid
          type: string
        returnable:
          type: boolean
        returnableQty:
          format: int32
          type: integer
        soldQty:
          format: int32
          type: integer
      type: object
    RevisePurchaseOrderRequest:
      description: Request to revise an existing purchase order, replacing its lines and recording a revision reason
      properties:
        comment:
          description: Free-text comment providing additional context for the revised purchase order
          example: Increased quantities after vendor confirmed availability
          type: string
        expectedDeliveryDate:
          description: Date the ordered goods are expected to be delivered
          example: 2026-02-03
          format: date
          type: string
        lines:
          description: Order lines replacing the existing purchase order lines
          items:
            $ref: '#/components/schemas/PurchaseOrderLineRequest'
          minItems: 1
          type: array
        paymentTermsId:
          description: Identifier of the payment terms applied to the revised purchase order
          example: NET30
          type: string
        poDate:
          description: Date the revised purchase order is issued
          example: 2026-01-20
          format: date
          type: string
        requestedBy:
          description: Identifier or name of the person who requested the revision
          example: user-jdoe
          type: string
        revisionReason:
          description: Reason explaining why the purchase order is being revised
          example: Vendor price change required updated unit costs
          minLength: 1
          type: string
        shipToLocationId:
          description: Identifier of the location the goods should be shipped to
          example: 01960003-0000-7000-8000-000000000003
          format: uuid
          type: string
      required:
      - lines
      - poDate
      - revisionReason
      type: object
    SalesOrderLineResponse:
      description: Response representing a single line on a sales order
      properties:
        customerNote:
          description: Customer-visible line note
          type: string
        discountAmount:
          description: Line discount plus this line's pro-rata share of the order discount
          example: 2.0
          type: number
        discountPercent:
          description: Line-level discount percent (0-100)
          example: 5
          type: number
        fulfillmentStatus:
          description: Fulfillment status of the line
          example: PENDING
          type: string
        internalNote:
          description: Shop-internal line note
          type: string
        itemDescription:
          description: Human-readable description of the line item
          example: Synthetic Motor Oil 5W-30 1L
          type: string
        itemSku:
          description: Stock keeping unit identifying the line item
          example: SKU-OIL-5W30-1L
          type: string
        lineSubtotal:
          description: Extended amount post-line-discount, pre-order-discount, pre-tax
          example: 37.98
          type: number
        lineTotal:
          description: lineSubtotal minus order-discount allocation plus taxAmount
          example: 39.02
          type: number
        orderLineId:
          description: Unique identifier of the order line
          example: 01960003-0000-7000-8000-000000000002
          type: string
        priceSource:
          description: Source of the line price (e.g. CATALOG, MANUAL, OVERRIDE)
          example: CATALOG
          type: string
        quantity:
          description: Quantity of the item on the line
          example: 2
          format: int32
          type: integer
        reasonCode:
          description: Reason code associated with a manual price or special handling
          example: PRICE_MATCH
          type: string
        returnable:
          description: Explicit source-document returnability flag (imported lines only; null for counter lines)
          type: boolean
        serialNumbers:
          description: Captured lot/serial numbers for tracked products
          items:
            type: string
          type: array
        sourceId:
          description: Identifier of the originating source record
          example: 01960003-0000-7000-8000-000000000004
          type: string
        sourceLineId:
          description: Identifier of the originating source line
          example: 01960003-0000-7000-8000-000000000006
          type: string
        sourceType:
          description: Type classification of the line's originating source
          example: WORKORDER
          type: string
        taxAmount:
          description: Tax for this line (pos-tax authoritative)
          example: 3.04
          type: number
        unitPrice:
          description: Unit price applied to the line
          example: 19.99
          type: number
      required:
      - itemSku
      - orderLineId
      - quantity
      type: object
    SalesOrderResponse:
      description: Response representing a sales order and its lines
      properties:
        amountPaid:
          description: Net settled amount (checkout onward)
          type: number
        balanceDue:
          description: Outstanding balance (checkout onward)
          type: number
        clerkId:
          description: Identifier of the clerk who owns the order
          example: 01960003-0000-7000-8000-000000000050
          type: string
        createdAt:
          description: Timestamp when the order was created (ISO 8601)
          example: 2026-01-15 09:30:00+00:00
          format: date-time
          type: string
        createdBy:
          description: Identifier of the user who created the order
          example: 01960003-0000-7000-8000-000000000050
          type: string
        customerId:
          description: Identifier of the customer associated with the order
          example: 01960003-0000-7000-8000-000000000070
          type: string
        customerValidationStatus:
          description: CRM validation state of the customer/vehicle references (VALIDATED or PENDING)
          example: VALIDATED
          type: string
        discountTotal:
          description: Σ line discounts + allocated order discount
          example: 6.0
          type: number
        generalNote:
          description: Order-level note
          type: string
        grandTotal:
          description: subtotal − order discount + taxTotal
          example: 58.29
          type: number
        invoiceId:
          description: Invoice fronting this order, set at checkout
          type: string
        invoiceNumber:
          description: Human-facing invoice number
          type: string
        label:
          description: Parking label for resumable drafts
          example: blue F-150 waiting on customer
          type: string
        lines:
          description: Lines belonging to the order
          items:
            $ref: '#/components/schemas/SalesOrderLineResponse'
          type: array
        locationId:
          description: Shop location the order belongs to
          example: 01960003-0000-7000-8000-000000000090
          type: string
        orderDiscountReasonCode:
          description: Order discount reason code
          type: string
        orderDiscountType:
          description: Order discount flavor (PERCENT or AMOUNT)
          type: string
        orderDiscountValue:
          description: Order discount value per type
          type: number
        orderId:
          description: Unique identifier of the order
          example: 01960003-0000-7000-8000-000000000001
          type: string
        orderNumber:
          description: Human-facing order number assigned at creation
          example: SO-1A2B3C4D-2607-000042
          type: string
        quoteExpiresAt:
          description: Quote validity horizon (QUOTED orders)
          format: date-time
          type: string
        status:
          description: Current status of the order
          example: OPEN
          type: string
        subtotal:
          description: 'Σ line subtotals: post-line-discount, pre-order-discount, pre-tax'
          example: 59.97
          type: number
        taxStale:
          description: True when mutations invalidated taxTotal; cleared by quote/checkout tax recompute
          example: false
          type: boolean
        taxTotal:
          description: Total tax (pos-tax authoritative)
          example: 4.32
          type: number
        terminalId:
          description: Identifier of the terminal where the order was created
          example: 01960003-0000-7000-8000-000000000060
          type: string
        updatedAt:
          description: Timestamp when the order was last updated (ISO 8601)
          example: 2026-01-15 09:45:00+00:00
          format: date-time
          type: string
        updatedBy:
          description: Identifier of the user who last updated the order
          example: 01960003-0000-7000-8000-000000000051
          type: string
        vehicleId:
          description: Identifier of the vehicle associated with the order
          example: 01960003-0000-7000-8000-000000000080
          type: string
      required:
      - orderId
      - status
      type: object
    SessionReportResponse:
      description: X-report (mid-day) or Z-report (close summary) for a register session
      properties:
        cashMovements:
          type: number
        cashSettlements:
          type: number
        countedCash:
          type: number
        generatedAt:
          format: date-time
          type: string
        locationId:
          format: uuid
          type: string
        movements:
          items:
            $ref: '#/components/schemas/CashMovementResponse'
          type: array
        openedAt:
          format: date-time
          type: string
        openingFloat:
          type: number
        orderCount:
          format: int64
          type: integer
        overShort:
          type: number
        reportType:
          type: string
        sessionId:
          format: uuid
          type: string
        status:
          type: string
        tenderTotals:
          items:
            $ref: '#/components/schemas/TenderTotal'
          type: array
        terminalId:
          type: string
        theoreticalCash:
          type: number
      type: object
    SortObject:
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean
      type: object
    TenderTotal:
      description: Net settled amount for one tender method
      properties:
        amount:
          type: number
        methodType:
          type: string
      type: object
    UpdateItemRequest:
      description: Request payload for updating an existing cart item line
      properties:
        quantity:
          description: Updated quantity for the item line
          example: 3
          format: int32
          minimum: 1
          type: integer
      required:
      - quantity
      type: object
    VoidOrderRequest:
      description: Request payload for voiding an unsettled order
      properties:
        reason:
          description: Reason the order is being voided
          example: Customer walked away before payment
          type: string
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
